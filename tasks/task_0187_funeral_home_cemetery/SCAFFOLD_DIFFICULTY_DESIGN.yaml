  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: chapel_buffered_half_open_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.FuneralHome.fields.chapel_buffer_minutes
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Chapel interval semantics: half-open [start,end) PLUS a 30-minute cleanup buffer on
          the same Venue. A second booking starting 15 minutes after the first ends (within
          the 30-min buffer) collides; a booking starting >=30 minutes after would not.
        test_recipe:
          setup:
            - "FuneralHome chapel_buffer_minutes=30; a Venue; an AT_NEED Case with a SCHEDULED chapel event 15:00-16:00."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90, chapel_buffer_minutes: 30 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { funeral_home_id: "${home_id}", name: "Main Chapel", capacity: 120 }
              as: Admin
              captures: { venue_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case One", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case1_id: $.data.id }
            - call: "POST /cases/${case1_id}/events"
              payload: { resource_kind: "CHAPEL", resource_id: "${venue_id}", starts_at: "2026-06-10T15:00:00.000Z", ends_at: "2026-06-10T16:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { event1_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case Two", case_mode: "AT_NEED", date_of_death: "2026-06-02T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case2_id: $.data.id }
          trigger:
            - call: "POST /cases/${case2_id}/events"
              payload: { resource_kind: "CHAPEL", resource_id: "${venue_id}", starts_at: "2026-06-10T16:15:00.000Z", ends_at: "2026-06-10T17:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_CONFLICT (16:15 start is within the 30-min buffer after the 16:00 end)"

      - name: graveside_whole_day_exclusivity_rejected
        grounds:
          - validations[priority=10]
          - entities.Event.fields.resource_kind
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Graveside interval semantics differ from chapel: whole-DAY exclusivity per Plot
          (date granularity, end time ignored), on a DIFFERENT resource entity (Plot). Two
          graveside events on the same calendar date for the same plot collide even at
          different clock times.
        test_recipe:
          setup:
            - "A Plot; two AT_NEED cases each scheduling a GRAVESIDE event on the same plot on 2026-06-12 at different times."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /plots"
              payload: { funeral_home_id: "${home_id}", section: "B", plot_code: "B-1", current_price_cents: 90000 }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case One", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case1_id: $.data.id }
            - call: "POST /cases/${case1_id}/events"
              payload: { resource_kind: "GRAVESIDE", resource_id: "${plot_id}", starts_at: "2026-06-12T09:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { gv1_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case Two", case_mode: "AT_NEED", date_of_death: "2026-06-02T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case2_id: $.data.id }
          trigger:
            - call: "POST /cases/${case2_id}/events"
              payload: { resource_kind: "GRAVESIDE", resource_id: "${plot_id}", starts_at: "2026-06-12T14:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_CONFLICT (same plot, same calendar date 2026-06-12, despite different clock times)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: trust_principal_conserved_across_deposit_and_void_refund
        grounds:
          - calculations.trust_balance_reconciliation
          - state_machines.Contract.FUNDED_to_VOID
          - entities.Contract.fields.trust_principal_cents
          - entities.FuneralHome.fields.trust_balance_cents
        distinguishing_aspect: |
          Conserved quantity = trust money (trust_principal_cents / FuneralHome.trust_balance_cents):
          a POSTED 360000 PRINCIPAL deposit followed by the void cascade's REFUND leg leaves
          trust_principal_cents back at 0 and FuneralHome.trust_balance_cents back at 0 — no drift.
        test_recipe:
          setup:
            - "PRENEED Case ARRANGED, contract with a POSTED 360000 PRINCIPAL deposit (trust_balance 360000)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "PRENEED_TRUST" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/trust-deposits"
              payload: { kind: "PRINCIPAL", amount_cents: 360000 }
              as: TrustOfficer
              as_user_id: "to-1"
          trigger:
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          assert:
            - "Contract.${contract_id}.status == VOID"
            - "Contract.${contract_id}.trust_principal_cents == 0 (deposit + refund leg net to zero)"
            - "FuneralHome.${home_id}.trust_balance_cents == 0 (conserved: returned to pre-deposit value)"

      - name: plot_inventory_conserved_across_reserve_and_release
        grounds:
          - state_machines.Plot.AVAILABLE_to_RESERVED
          - state_machines.Plot.RESERVED_to_AVAILABLE
          - entities.Plot.fields.status
          - entities.Plot.fields.reserved_case_id
        distinguishing_aspect: |
          Conserved quantity = plot availability (count of AVAILABLE plots), a DIFFERENT
          conserved type from trust money: reserving then releasing the same plot returns it
          to AVAILABLE with reserved_case_id null and locked_price_cents null — the available
          inventory count is identical before and after.
        test_recipe:
          setup:
            - "One AVAILABLE plot and an AT_NEED Case; plot reserved for the case."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /plots"
              payload: { funeral_home_id: "${home_id}", section: "C", plot_code: "C-1", current_price_cents: 70000 }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_id: $.data.id, plot_v0: $.data.version }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /plots/${plot_id}/reserve"
              payload: { case_id: "${case_id}", expected_plot_version: "${plot_v0}" }
              as: CemeteryClerk
              as_user_id: "cc-1"
          trigger:
            - call: "POST /plots/${plot_id}/release"
              payload: {}
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { st: $.data.status }
          assert:
            - "Plot.${plot_id}.status == AVAILABLE"
            - "Plot.${plot_id}.reserved_case_id == null"
            - "Plot.${plot_id}.locked_price_cents == null (inventory conserved: identical to creation)"
