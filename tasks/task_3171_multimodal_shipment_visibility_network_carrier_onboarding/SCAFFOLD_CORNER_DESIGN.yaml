      - name: eta_confidence_uses_prior_epoch_quality_not_current_run
        claim_type: variant_selection
        grounds: [calculations.eta_confidence_halfwidth]
        distinguishing_aspect: "Evaluation-order pin: the CI halfwidth uses the quality score from the LAST COMPLETED checkpoint — a connection scored 83 at run 1 keeps Q = 83 for CI purposes even while run 2 recomputes its score, breaking the would-be circular dependency between quality and confidence."
        test_recipe:
          setup: ["TMS connection scored 83 at checkpoint 1 (one on-time completeness-100 heartbeat in a 720-minute window) and ACTIVE; shipment with one DEPARTED event; second checkpoint run."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
