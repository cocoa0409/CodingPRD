              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Zero interest year", body_text: "A zero interest year on transferred balances for new customers.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/zero", display_url: "https://www.beaconlending.example/zero" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.70, matched_snippet: "zero interest year" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { task_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks/${task_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The second claim returns HTTP 409 with error_id ERR_INVALID_TASK_STATE"
            - "Reviewer.${rev_id}.claimed_task_count == 1 (not 2) and version == 2"
            - "ReviewTask.${task_id}.status == CLAIMED, assigned_reviewer_id == ${rev_id}, claimed_at == 2026-08-01T00:00:00Z"
            - "ReviewTask.${task_id}.version is still ${task_v} == 2"

      - name: side_effect_execution_claim_increments_the_reviewer_slot_counter
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReviewTask.status.QUEUED_to_CLAIMED
          - entities.Reviewer.claimed_task_count
        excluded_because:
          difficulty_instance: compensating_invariant / release_and_escalate_conserve_the_reviewer_claim_slot_counter
          rationale: "That instance asserts the claimed_task_count ledger across claim, release and escalate, so the claim side effect is its opening observation."

      - name: cyclic_shape_review_task_loops_back_to_queued_with_a_bumped_cycle_count
        claim_type: Idempotency
        grounds:
          - state_machines.ReviewTask.status.ESCALATED_to_QUEUED
          - endpoints[POST /ad-policy/review-tasks/{id}/requeue]
        excluded_because:
          difficulty_instance: non_linear_state_machine / review_task_claim_escalate_requeue_cycle_increments_counter_and_rescores
          rationale: "The claim -> escalate -> requeue loop, its cycle_count increment and the re-scored priority are that instance's entire subject."

      - name: parallel_shape_the_destination_axis_moves_without_disturbing_the_review_axis
        claim_type: Valid Transition
        grounds:
          - state_machines.AdCreative.destination_status
          - state_machines.AdCreative.review_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / ad_creative_two_axes_advance_independently_with_destination_cycle
          rationale: "Independent advancement of the two axes, including the MISMATCH_FLAGGED -> DESTINATION_CLEARED cycle, is exactly what that instance isolates."

      - name: compound_shape_advertiser_account_status_is_rederived_when_its_enforcement_row_expires
        claim_type: Valid Transition
        grounds:
          - entities.Advertiser.account_status
          - state_machines.EnforcementAction.status.ACTIVE_to_EXPIRED
          - endpoints[POST /ad-policy/advertisers/{id}/enforcement-actions]
          - endpoints[POST /ad-policy/_policy-sweeps/run]
        distinguishing_aspect: |
          Advertiser.account_status is a compound state with no endpoint of its own: a
          manual WARNING drives it to WARNED, and when the sweep expires that row the
          parent is re-derived back to ACTIVE — the status must be recomputed from the
          surviving ACTIVE rows, never latched at its high-water mark.
        test_recipe:
          setup:
            - "One advertiser verified on identity and business standing, so its version is 3 and account_status is ACTIVE with severity_index 0.00."
          setup_api_calls:
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Cobalt Media Group", country_code: "US", industry_code: "RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
              captures: { adv_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "WARNING", trigger_reason: "Manual warning issued after an offline audit", effective_until: "2026-08-05T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: PolicyAdmin
              captures: { act_id: "$.data.id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /ad-policy/_policy-sweeps/run"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions/${act_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "EnforcementAction.${act_id}.status == ACTIVE immediately after creation, origin == MANUAL, effective_from == 2026-08-01T00:00:00Z, effective_until == 2026-08-05T00:00:00Z"
            - "EnforcementAction.${act_id}.severity_index_at_issue == 0.00 (the advertiser has no ledger entries)"
            - "Advertiser.${adv_id}.account_status == WARNED and version == 4 after the manual action"
            - "The sweep response reports expired_enforcement_actions == 1 and lifted_enforcement_actions == 0 (the row is already EXPIRED before phase 7)"
            - "EnforcementAction.${act_id}.status == EXPIRED after the sweep"
            - "Advertiser.${adv_id}.account_status == ACTIVE again, with violation_points_raw 0.00 and severity_index 0.00"

      - name: guarded_transition_cloaking_requires_a_prior_crawler_check_on_the_same_creative
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AdCreative.destination_status.DESTINATION_CLEARED_to_CLOAKING_CONFIRMED
          - calculations.destination_check_result
          - calculations.disapproval_points_assessment
        distinguishing_aspect: |
          The identical USER-agent check on the identical divergent host yields HOST_MISMATCH
          the first time and UA_DIVERGENCE the third, because clause 2 of
          destination_check_result is guarded on a prior CRAWLER row existing for that
          creative — the guard is history-dependent, not payload-dependent.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.55), no country override, one verified advertiser."
            - "One creative whose display_url host is www.beaconlending.example, submitted and screened at confidence 0.30 so it lands AUTO_APPROVED with an empty finding set."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Fixed rate offer", body_text: "A fixed rate personal loan offer for qualified applicants.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/fixed", display_url: "https://www.beaconlending.example/fixed" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "fixed rate personal loan" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "USER", fetched_final_url: "https://promo.other-host.example/fixed", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk1: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/fixed", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "USER", fetched_final_url: "https://promo.other-host.example/fixed", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk3: "$.data.id" }
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
          assert:
            - "DestinationCheck.${chk1}.result == MISMATCH with mismatch_detail HOST_MISMATCH (clause 2 is skipped because no CRAWLER row exists yet), leaving destination_status MISMATCH_FLAGGED and review_status PENDING_MANUAL_REVIEW"
            - "DestinationCheck.${chk2}.result == CLEARED with mismatch_detail null, moving destination_status to DESTINATION_CLEARED while review_status stays PENDING_MANUAL_REVIEW"
            - "DestinationCheck.${chk3}.result == CLOAKING with mismatch_detail UA_DIVERGENCE — the same payload as ${chk1} now satisfies clause 2 because ${chk2} is the last CRAWLER row"
            - "AdCreative.${cr_id}.destination_status == CLOAKING_CONFIRMED and review_status == DISAPPROVED"
            - "DisapprovalNotice.${notice_id}.reason_codes == [CLOAKING], decided_by_reviewer_id == null, and assessed_points == 20.00 (phase 1 is empty because the only decision was BELOW_THRESHOLD; phase 2 is 10.00 * 1.00 * 2.00)"
            - "Advertiser.${adv_id}.account_status == WARNED (severity_index 20.00 + 3.50 = 23.50, in [10.00, 25.00))"

      - name: cascade_down_withdrawing_a_creative_expires_its_claimed_task_and_frees_the_reviewer
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AdCreative.review_status.DRAFT_to_WITHDRAWN
          - state_machines.ReviewTask.status.CLAIMED_to_EXPIRED
          - entities.Reviewer.claimed_task_count
        distinguishing_aspect: |
          Withdrawal cascades down into a task that is CLAIMED, not merely QUEUED: the task
          must be driven to EXPIRED and the holding reviewer's claimed_task_count must fall
          back to 0, so a slot is never leaked by a parent-side terminal transition.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.55, queue STANDARD), one verified advertiser, one reviewer authorised for US on STANDARD with a ceiling of 3."
            - "One creative screened at confidence 0.70 so it routes to manual review, and the reviewer claims the resulting task."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Pulled campaign", body_text: "A campaign the advertiser pulls while a reviewer is still holding it.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/pulled", display_url: "https://www.beaconlending.example/pulled" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.70, matched_snippet: "a campaign the advertiser pulls" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/withdraw"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "GET /ad-policy/review-tasks/${task_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "AdCreative.${cr_id}.review_status == WITHDRAWN with serving_eligible false and blocking_reason_codes [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED]"
            - "ReviewTask.${task_id}.status == EXPIRED (a CLAIMED task is cascaded, not skipped) and cycle_count is still 0"
            - "Reviewer.${rev_id}.claimed_task_count == 0 (the slot held by the expired task is returned)"
            - "No DisapprovalNotice exists for the creative: GET /ad-policy/disapproval-notices?ad_creative_id=${cr_id} reports total_count == 0"

      - name: compensation_a_denied_appeal_leaves_the_disapproval_and_the_ledger_untouched
        claim_type: Valid Transition
        grounds:
          - state_machines.DisapprovalNotice.status.APPEALED_to_APPEAL_UPHELD
          - state_machines.Appeal.status.SUBMITTED_to_DENIED
          - validations[priority=58].ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          A DENIED appeal is the no-op branch of the compensation pair: the notice settles
          at APPEAL_UPHELD, but the creative stays DISAPPROVED, no second ledger entry is
          written, reinstated_review_status stays null and no ReviewTask is minted — the
          only observable change is on the notice and the appeal.
        test_recipe:
          setup:
            - "Rule GAM_CASINO (RESTRICTED, weight 6.00, auto 0.90, manual 0.20, queue STANDARD, requires_certification false) with no country override, so the multiplier is 1.00."
            - "One verified advertiser and two reviewers R1 and R2, both authorised for US on STANDARD."
            - "One creative screened at confidence 0.50 (>= 0.20, < 0.90) so it routes to manual review; R1 claims and DISAPPROVES it, producing a notice with assessed_points 6.00 (6.00 * 1.00 * MANUAL_REVIEW 1.00) — below the 10.00 WARNING threshold, so no EnforcementAction is created."
            - "The advertiser appeals within the window (the clock is still 2026-08-01)."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "GAM_CASINO", title: "Casino gambling", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { gam_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Riverbend Gaming Inc", country_code: "US", industry_code: "GAMING" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R1 Deciding", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev1: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R2 Appeals", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Table games weekend", body_text: "Join our table games weekend for guests of legal age.", declared_category_codes: ["GAM_CASINO"], target_country_codes: ["US"], landing_page_url: "https://www.riverbend.example/tables", display_url: "https://www.riverbend.example/tables" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${gam_id}", confidence: 0.50, matched_snippet: "table games weekend" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev1}"
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW"], note: "Age gating is not evidenced on the landing page" }
              as: PolicyReviewer
              as_user_id: "${rev1}"
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice_id}", justification: "Age gating is implemented server side and was not visible to the reviewer" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { appeal_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/appeals/${appeal_id}/decision"
              payload: { outcome: "DENIED", note: "The submitted evidence does not establish age gating at the destination" }
              as: PolicyReviewer
              as_user_id: "${rev2}"
            - call: "GET /ad-policy/disapproval-notices/${notice_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "Appeal.${appeal_id}.status == DENIED, decided_by_reviewer_id == ${rev2}, decided_at == 2026-08-01T00:00:00Z and reinstated_review_status == null"
            - "DisapprovalNotice.${notice_id}.status == APPEAL_UPHELD with assessed_points 6.00 unchanged"
            - "GET the notice's ledger entries reports total_count == 1 (only the original DISAPPROVAL_ASSESSED entry; no reversal row)"
            - "Advertiser.${adv_id}.violation_points_raw == 6.00, violation_points_decayed == 6.00, severity_index == 6.00 and account_status == ACTIVE"
            - "GET /ad-policy/enforcement-actions?advertiser_id=${adv_id} reports total_count == 0 (6.00 never reaches the 10.00 WARNING threshold)"
            - "AdCreative.${cr_id}.review_status is still DISAPPROVED and GET review-tasks for the creative reports exactly one task, ${task_id}, in status RESOLVED"

  # ===========================================================================
  - section: "From Table 3 (Calculations)"
    instances:

      - name: precision_risk_score_sums_unrounded_products_while_each_decision_row_rounds_alone
        claim_type: Precision
        grounds:
          - calculations.creative_risk_score
          - entities.ClassifierDecision.assessed_points
        distinguishing_aspect: |
          The audit rows and the score round at different points on the same data:
          the two ClassifierDecision rows read 2.86 and 4.24 (sum 7.10) while
          risk_score_provisional is 7.11, because the score sums the unrounded
          products 2.8635 + 4.2435 = 7.107 and rounds once.
        test_recipe:
