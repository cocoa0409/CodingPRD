    code: 200
    input: []
    output: PackagingRun
    side_effects: []
  - method: GET
    path: "/sugarhouse/packaging-runs"
    description: "List packaging runs"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["syrup_lot_id?", "status?", "limit?", "offset?"]
    output: PackagingRun[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/packaging-runs/{id}/fill"
    description: "PLANNED -> FILLED; re-checks unpackaged gallons; may exhaust the lot"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: PackagingRun
    side_effects: ["status -> FILLED", "units_filled/filled_gallons set", "SyrupLot.unpackaged_gallons -= filled_gallons; lot -> EXHAUSTED at exactly 0.00", "increments PackagingRun.version by 1"]
  - method: POST
    path: "/sugarhouse/packaging-runs/{id}/cancel"
