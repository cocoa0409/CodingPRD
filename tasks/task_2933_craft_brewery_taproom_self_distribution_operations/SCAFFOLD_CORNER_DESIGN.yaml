      - name: order_created_before_the_license_effective_instant_is_not_yet_effective
        claim_type: Temporal validation
        grounds:
          - validations.priority_41
          - errors.ERR_LICENSE_NOT_YET_EFFECTIVE
        distinguishing_aspect: "The license window is checked against the logical clock at BOTH ends. Here the clock sits a month before effective_from_utc, so the order is refused with ERR_LICENSE_NOT_YET_EFFECTIVE - a distinct error from the lapsed-end ERR_LICENSE_EXPIRED - and the license itself stays ACTIVE."
