              payload: { station_id: "${station_id}", shift_id: "${july_shift}", food_type_id: "${food_type_id}", weight_grams: 700, loss_reason: "TRIM", captured_at: "2026-07-01T00:30:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
