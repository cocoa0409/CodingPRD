  # ===========================================================================
  - section: errors
    instances:

      - name: missing_user_id_header_then_foreign_household_read
        claim_type: error_triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_NOT_RESOURCE_OWNER
          - errors.ERR_HOUSEHOLD_NOT_FOUND
          - validations.priority_1
          - validations.priority_7
        distinguishing_aspect: |
          Three different 4xx answers to the same GET, separated only by the
          caller and the id: no X-User-ID at all is 401, an Applicant reading
          another household is 403 ERR_NOT_RESOURCE_OWNER, and an id that
          exists nowhere is 404 ERR_HOUSEHOLD_NOT_FOUND — proving existence
          (priority 5) is resolved BEFORE ownership (priority 7), so probing
          foreign ids cannot be used to distinguish "exists" from "not mine".
        test_recipe:
          setup:
            - "One OPEN program with two households: hh_a (the caller) and hh_b (someone else's)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Auth", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Ada Owner", email: "ada@example.com", service_address_line1: "230 Ada Ave", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_a: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Bo Neighbour", email: "bo@example.com", service_address_line1: "232 Ada Ave", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 2, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_b: $.data.id }
          trigger:
            - call: "GET /households/${hh_a}"
              payload: {}
              as: Applicant
              as_user_id: ""
              captures: { err_unauth: $.data.error_id }
            - call: "GET /households/${hh_b}"
              payload: {}
              as: Applicant
              as_user_id: "${hh_a}"
              captures: { err_not_owner: $.data.error_id }
            - call: "GET /households/00000000-0000-0000-0000-0000000000dd"
              payload: {}
              as: Applicant
              as_user_id: "${hh_a}"
              captures: { err_hh_missing: $.data.error_id }
            - call: "POST /households/${hh_b}/income-verifications"
              payload: { annual_household_income_cents: 5000000, county_median_income_cents: 10000000, household_size_attested: 2 }
              as: Applicant
              as_user_id: "${hh_a}"
              captures: { err_not_owner_write: $.data.error_id }
            - call: "GET /households/${hh_a}"
              payload: {}
              as: Applicant
              as_user_id: "${hh_a}"
          assert:
            - "Trigger call 1 (X-User-ID header omitted / empty) returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "Trigger call 2 returns 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" and no household payload"
            - "Trigger call 3 returns 404 with data.error_id == \"ERR_HOUSEHOLD_NOT_FOUND\" — NOT 403, because priority 5 (existence) runs before priority 7 (ownership)"
            - "Trigger call 4 returns 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" and GET /households/${hh_b}/income-verifications (as ProgramReviewer) returns total_count == 0"
            - "Trigger call 5 returns 200 with id == ${hh_a}, income_tier == null and rebate_cap_cents == null"
            - "Household.${hh_b}.version is still 1 after all four failed calls"

      - name: not_found_sweep_over_every_addressable_aggregate
        claim_type: error_triggerability
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_CONTRACTOR_NOT_FOUND
          - errors.ERR_INCOME_VERIFICATION_NOT_FOUND
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_RESERVATION_NOT_FOUND
          - errors.ERR_INSPECTION_NOT_FOUND
          - errors.ERR_INSPECTOR_NOT_FOUND
          - errors.ERR_CLAWBACK_ACTION_NOT_FOUND
          - validations.priority_5
        distinguishing_aspect: |
          Each aggregate has its OWN 404 code — the API never collapses them
          into a generic ERR_NOT_FOUND, and the code is chosen by the path
          segment, not by which lookup happens to be attempted first. The same
          syntactically valid UUID produces nine different error_ids depending
          on the collection addressed, including read-only aggregates such as
          ClawbackAction that no test ever creates by hand.
        test_recipe:
          setup:
            - "One OPEN program only — the database is deliberately non-empty so a 404 cannot be an artefact of an empty store."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Not Found", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_program: $.data.error_id }
            - call: "GET /contractors/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_contractor: $.data.error_id }
            - call: "POST /income-verifications/00000000-0000-0000-0000-000000000003/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_income_verification: $.data.error_id }
            - call: "GET /assessments/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_assessment: $.data.error_id }
            - call: "GET /rebate-projects/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_project: $.data.error_id }
            - call: "GET /reservations/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_reservation: $.data.error_id }
            - call: "GET /inspections/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_inspection: $.data.error_id }
            - call: "GET /inspectors/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_inspector: $.data.error_id }
            - call: "GET /clawback-actions/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_clawback: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 → 404 ERR_PROGRAM_NOT_FOUND; call 2 → 404 ERR_CONTRACTOR_NOT_FOUND; call 3 → 404 ERR_INCOME_VERIFICATION_NOT_FOUND; call 4 → 404 ERR_ASSESSMENT_NOT_FOUND"
            - "Trigger call 5 → 404 ERR_PROJECT_NOT_FOUND; call 6 → 404 ERR_RESERVATION_NOT_FOUND; call 7 → 404 ERR_INSPECTION_NOT_FOUND; call 8 → 404 ERR_INSPECTOR_NOT_FOUND; call 9 → 404 ERR_CLAWBACK_ACTION_NOT_FOUND"
            - "All nine responses carry a non-empty data.message and no entity payload"
            - "Trigger call 3 does NOT return 409 or 422 even though a decision body was supplied: existence outranks every state and business check"
            - "Trigger call 10 returns 200 for the real program, and GET /clawback-actions returns total_count == 0 — the 404s were genuine misses, not a broken store"

      - name: project_creation_requires_an_approved_assessment_in_all_three_bad_states
        claim_type: error_triggerability
        grounds:
          - errors.ERR_ASSESSMENT_NOT_APPROVED
          - state_machines.Assessment
          - validations.priority_8
        distinguishing_aspect: |
          ERR_ASSESSMENT_NOT_APPROVED covers three distinct assessment states
          with one code — PENDING_REVIEW, SUPERSEDED and REJECTED — and the
          SUPERSEDED case shows the error can appear for an assessment that WAS
          approved earlier: approval is not a permanent licence, it is revoked
          the moment a newer assessment is filed for the same household.
        test_recipe:
          setup:
            - "One OPEN program with the BASE MEASURE catalog item, a LOW-tier verified household (200 A panel) and an ENROLLED_ACTIVE contractor."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Approval Gate", state_code: "CO", budget_total_cents: 50000000 }
