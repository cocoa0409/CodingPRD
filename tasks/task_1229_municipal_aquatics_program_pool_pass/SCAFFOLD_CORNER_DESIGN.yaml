scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: facility_create_returns_defaults
        claim_type: creation
        grounds: [entities.Facility]
        distinguishing_aspect: "POST /facilities with required fields returns 201 and Facility with computed fields initialized (current_bather_count=0, required_lifeguard_count=0, operational_status=OPEN, chemistry_state=IN_RANGE, chemistry_out_of_range_since=null)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F1", address: "1 A", max_bather_capacity: 50, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
          trigger: []
          assert:
            - "Facility.${fac_id}.current_bather_count == 0"
            - "Facility.${fac_id}.required_lifeguard_count == 0"
            - "Facility.${fac_id}.operational_status == OPEN"
            - "Facility.${fac_id}.chemistry_state == IN_RANGE"
            - "Facility.${fac_id}.version == 1"

      - name: facility_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Facility
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /facilities missing max_bather_capacity returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "F1", address: "1 A", lap_lane_count: 4 }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: pass_holder_unique_email_enforced
        claim_type: type_constraints
        grounds: [entities.PassHolder.fields.email]
        distinguishing_aspect: "Two PassHolders with the same email are rejected on the second create with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One existing PassHolder with email dup@x.com"]
          setup_api_calls:
            - call: "POST /pass-holders"
              payload: { full_name: "First", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "dup@x.com" }
              as: GateAttendant
          trigger:
            - call: "POST /pass-holders"
              payload: { full_name: "Second", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "dup@x.com" }
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: pass_holder_invalid_residency_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.PassHolder.fields.residency_status]
        distinguishing_aspect: "residency_status with value not in {RESIDENT, NON_RESIDENT} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pass-holders"
              payload: { full_name: "X", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "CITIZEN", email: "x@x.com" }
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: facility_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - entities.Facility
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /facilities/{non-existent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: pass_holder_banned_until_default_null
        claim_type: defaults
        grounds: [entities.PassHolder.fields.banned_until, entities.PassHolder.fields.strike_count]
        distinguishing_aspect: "Newly created PassHolder has strike_count=0 and banned_until=null without input."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /pass-holders"
              payload: { full_name: "A", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "a@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
          trigger: []
          assert:
            - "PassHolder.${p_id}.strike_count == 0"
            - "PassHolder.${p_id}.banned_until == null"

      - name: season_publish_resident_gt_nonresident_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_SEASON_OVERLAP]
        distinguishing_aspect: "Season publish with resident_pass_price_cents > non_resident_pass_price_cents returns ERR_SEASON_OVERLAP."
        test_recipe:
          setup: ["Facility F; Season S with resident=20000, non_resident=15000 (DRAFT)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "Bad", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 20000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEASON_OVERLAP"
            - "MembershipSeason.${s_id}.status == DRAFT"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: admission_enter_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DailyAdmission
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second POST /admissions/{id}/enter on an already-ENTERED admission returns ERR_INVALID_STATE; no double-count of bather_count."
        test_recipe:
          setup: ["Facility F, Season S PUBLISHED, PassHolder P, Admission AD ISSUED for 2026-07-05, clock 2026-07-05T10:00:00Z"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "A", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "a@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-05T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id }
            - call: "POST /admissions/${adm}/enter"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /admissions/${adm}/enter"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Facility.${fac_id}.current_bather_count == 1"

      - name: rental_cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.FacilityRental]
        distinguishing_aspect: "POST /rentals/{id}/cancel on a COMPLETED rental returns ERR_INVALID_STATE (terminal state lockdown)."
        test_recipe:
          setup: ["Facility F, PassHolder P, Rental R APPROVED -> CHECKED_IN -> COMPLETED"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 0 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "R", date_of_birth: "1985-01-01T00:00:00Z", residency_status: "RESIDENT", email: "r@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", party_size: 5, start_datetime: "2026-07-10T14:00:00Z", end_datetime: "2026-07-10T16:00:00Z" }
              as: PassHolder
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv: $.data.version }
            - call: "POST /rentals/${r_id}/approve"
              payload: { expected_facility_version: "${fv}" }
              as: AquaticsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T14:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals/${r_id}/check-in"
              payload: {}
              as: GateAttendant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T16:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals/${r_id}/check-out"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /rentals/${r_id}/cancel"
              payload: {}
              as: PassHolder
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "FacilityRental.${r_id}.status == COMPLETED"

      - name: lesson_session_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.LessonSession]
        distinguishing_aspect: "Newly created LessonSession starts in DRAFT with enrolled_count=0."
        test_recipe:
          setup: ["Facility F, Season S PUBLISHED, Level L"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /lesson-levels"
              payload: { level_code: "L1", display_name: "L1", min_age_years: 5, capacity_per_session: 10 }
              as: AquaticsManager
              captures: { level_id: $.data.id }
          trigger:
            - call: "POST /lesson-sessions"
              payload: { facility_id: "${fac_id}", level_id: "${level_id}", season_id: "${s_id}", start_datetime: "2026-07-01T09:00:00Z", end_datetime: "2026-07-31T10:00:00Z", lanes_required: 1 }
              as: AquaticsManager
              captures: { sess_id: $.data.id }
          assert:
            - "LessonSession.${sess_id}.status == DRAFT"
            - "LessonSession.${sess_id}.enrolled_count == 0"

      - name: incident_dismiss_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentReport]
        distinguishing_aspect: "Once IncidentReport is DISMISSED (terminal), any further transition attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility F, Lifeguard LG ACTIVE, PassHolder P, IncidentReport IR submitted then dismissed"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "P", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG", certification_id: "RC-1", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: AquaticsManager
            - call: "POST /incident-reports"
              payload: { facility_id: "${fac_id}", reporting_lifeguard_id: "${lg_id}", involved_pass_holder_id: "${p_id}", incident_type: "FIRST_AID", occurred_at: "2026-06-15T11:00:00Z", severity: "MINOR", narrative: "cut" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { ir: $.data.id }
            - call: "POST /incident-reports/${ir}/submit"
              payload: {}
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /incident-reports/${ir}/dismiss"
              payload: {}
              as: AquaticsManager
          trigger:
            - call: "POST /incident-reports/${ir}/confirm"
              payload: {}
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "IncidentReport.${ir}.status == DISMISSED"

      - name: pass_refund_transition
        claim_type: valid_transition
        grounds: [state_machines.SeasonPass.ACTIVE_to_REFUNDED]
        distinguishing_aspect: "POST /passes/{id}/refund on an ACTIVE pass transitions to REFUNDED and sets refunded_cents=purchase_price_cents."
        test_recipe:
          setup: ["Facility F, Season S PUBLISHED, PassHolder P, SeasonPass PS ACTIVE (resident 15000c)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 15000, non_resident_pass_price_cents: 25000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "P", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT, ADULT", email: "p2@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /passes"
              payload: { pass_holder_id: "${p_id}", season_id: "${s_id}" }
              as: GateAttendant
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /passes/${ps_id}/refund"
              payload: {}
              as: AquaticsManager
          assert:
            - "SeasonPass.${ps_id}.status == REFUNDED"
            - "SeasonPass.${ps_id}.refunded_cents == 15000"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: daily_price_senior_tier
        claim_type: correct_result
        grounds: [calculations.daily_admission_price]
        distinguishing_aspect: "SENIOR (age>=62) RESIDENT daily price = ceil(800 * 0.75) = 600 cents."
        test_recipe:
          setup: ["Facility F, Season S PUBLISHED (resident_daily=800c), PassHolder P born 1960-01-01 (age 66 on 2026-07-01)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 800, non_resident_daily_price_cents: 1200 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Sr", date_of_birth: "1960-01-01T00:00:00Z", residency_status: "RESIDENT", email: "sr@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-01T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id, charge: $.data.charge_cents }
          assert:
            - "DailyAdmission.${adm}.charge_cents == 600"

      - name: daily_price_child_nonresident
        claim_type: correct_result
        grounds: [calculations.daily_admission_price]
        distinguishing_aspect: "CHILD NON_RESIDENT daily price = ceil(1200 * 0.60) = 720 cents."
        test_recipe:
          setup: ["Facility F, Season S PUBLISHED (non_resident_daily=1200c), PassHolder P born 2016-01-01 (age 10 on 2026-07-01)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 800, non_resident_daily_price_cents: 1200 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Kid", date_of_birth: "2016-01-01T00:00:00Z", residency_status: "NON_RESIDENT", email: "kid@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-01T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id, charge: $.data.charge_cents }
          assert:
            - "DailyAdmission.${adm}.charge_cents == 720"

      - name: bather_load_at_zero_requires_zero_guards
        claim_type: correct_result
        grounds: [calculations.bather_load_staffing_requirement]
        distinguishing_aspect: "current_bather_count=0 yields required_lifeguard_count=0; at 50 -> 2; at 51 -> 3."
        test_recipe:
          setup: ["Facility F (max=200)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 200, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { req: $.data.required_lifeguard_count, cnt: $.data.current_bather_count }
          assert:
            - "Facility.${fac_id}.current_bather_count == 0"
            - "Facility.${fac_id}.required_lifeguard_count == 0"

      - name: rain_check_full_refund_under_60min
        claim_type: correct_result
        grounds: [calculations.rain_check_refund]
        distinguishing_aspect: "Weather closure 30 minutes after entry issues FULL_REFUND; charge_cents refunded in full."
        test_recipe:
          setup: ["Facility F, Season S, PassHolder P, Admission AD ENTERED at 10:00; closure at 10:30"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 800, non_resident_daily_price_cents: 1200 }
              as: AquaticsManager
              captures: { s_id: $.data.id }
            - call: "POST /seasons/${s_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "P", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-15T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id, charge: $.data.charge_cents }
            - call: "POST /admissions/${adm}/enter"
              payload: {}
              as: GateAttendant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T10:30:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /facilities/${fac_id}/closures"
              payload: { closure_reason: "WEATHER", started_at: "2026-07-15T10:30:00Z" }
              as: AquaticsManager
              captures: { cl_id: $.data.id, rc: $.data.rain_check_issuance }
          assert:
            - "PoolClosureEvent.${cl_id}.rain_check_issuance == FULL_REFUND"
            - "DailyAdmission.${adm}.status == RAIN_CHECKED"

      - name: rain_check_pro_rata_over_60min
        claim_type: correct_result
        grounds: [calculations.rain_check_refund]
