            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-8", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { ma_id: $.data.id } }
            - { call: "POST /movements/${ma_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { mb_id: $.data.id } }
            - { call: "POST /movements/${mb_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler, captures: { conflict_err: $.data.error_id } }
          trigger:
