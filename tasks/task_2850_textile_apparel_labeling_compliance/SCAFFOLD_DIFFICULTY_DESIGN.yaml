              payload: { style_id: "${s4_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-07T09:00:00Z", results_due_at: "2026-08-08T09:00:00Z" }
