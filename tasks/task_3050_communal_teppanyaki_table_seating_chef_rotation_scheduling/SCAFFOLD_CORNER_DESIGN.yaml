  # ===========================================================================
  - section: calculations
    instances:

      - name: settlement_case_b_shared_table_premium_from_a_within_table_sushi_ticket
        claim_type: Correct Result
        grounds:
          - calculations.settlement
          - entities.Reservation.fields.final_bill_cents
          - entities.Reservation.fields.check_cents
          - calculations.seat_surcharge
        distinguishing_aspect: "The contested-table branch, computed end to end as literals: a six-guest T6 booking carrying a shared invite code computes SECURED 16000, P 19200 and a sushi amount of 3600, so base is max(16000 + 3600 + 0, 19200) == 19600 rather than the 19200 a reader who dropped the within-table sushi spend would assert."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with a T6 tier of minimum 16000, a T2 tier of minimum 8000, one T6 table, two chefs and a PLATINUM party."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Dana Whitfield", contact_phone: "212-555-0141", loyalty_tier: "PLATINUM" }
              as: Host
              captures: { party_w: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_w}", tier_id: "${tier6_id}", party_size: 6, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE", invite_code: "SHARE-9" }
              as: Host
              captures: { res_case: $.data.id }
            - call: "POST /service-floor/reservations/${res_case}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: Host
              captures: { v_t6_case: $.data.version }
            - call: "POST /service-floor/reservations/${res_case}/holds"
              payload: { expected_table_version: "${v_t6_case}", table_id: "${table6_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_case}/seat"
              payload: {}
              as: Host
              captures: { res_case_v: $.data.version }
            - call: "POST /service-floor/sushi-tickets"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_case}", item_code: "DRAGON-ROLL", quantity: 2, requested_at: "2026-09-03T19:05:00Z", unit_price_cents: 1800 }
              as: SushiChef
          trigger:
            - call: "POST /service-floor/reservations/${res_case}/close"
              payload: { expected_reservation_version: "${res_case_v}", credit_to_apply_cents: 0 }
              as: Host
          assert:
            - "no other booking carries invite code SHARE-9, so the set T is exactly {this reservation} and OTHER contributes 0"
            - "SECURED == TableTier(T6).minimum_bill_cents == 16000"
            - "ENTITLEMENT == 6 * 3200 == 19200 and P_cap == 6 * 3200 == 19200, so P == 19200"
            - "SushiAmount == 2 * 1800 == 3600 from the OPEN sushi ticket on this very reservation"
            - "SECURED 16000 is strictly less than P 19200, so the branch is CASE B and base == max(16000 + 3600 + 0, 19200) == 19600"
            - "Reservation.${res_case}.final_bill_cents == 19600"
            - "seat_surcharge_cents == ceil((3200 * 3 / 7) / 25) * 25 == ceil(1371.43/25) * 25 == 55 * 25 == 1375"
            - "the shortfall against the minimum is 0 because 19600 exceeds 16000, so no TABLE_MINIMUM_TRUEUP row exists"
            - "Reservation.${res_case}.check_cents == 19600 + 1375 + 0 + 0 == 20975"

