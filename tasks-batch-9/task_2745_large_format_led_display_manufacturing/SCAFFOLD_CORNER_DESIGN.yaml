      - name: cabinet_uniformity_score_precision_and_two_module_floor
        claim_type: precision
        grounds:
          - calculations.cabinet_uniformity_score
          - entities.Cabinet.fields.as_built_uniformity_score
        distinguishing_aspect: |
          Three different precisions stack inside one score and the intermediate
          roundings are pinned: brightness_spread_pct to 4 decimals
          (50 / 4925 x 100 = 1.0152284... -> 1.0152), chroma_spread to 6 decimals
          (0.000300), then the weighted score to 2 (100 - 1.5228 - 0.6 = 97.8772
          -> 97.88). Rounding the spread to 2 decimals first yields 97.89 and
          skipping the intermediate rounding yields 97.8772 — both wrong. Below
          MIN_MODULES_FOR_SCORE the field is null rather than 100.00.
        test_recipe:
          setup:
            - "An FP16-STD project (1x1, 2 modules per cabinet) is engineering APPROVED with cabinet ${cab} and two CALIBRATED modules: ${m1} (4900, 0.3130, 0.3292) and ${m2} (4950, 0.3128, 0.3291)."
