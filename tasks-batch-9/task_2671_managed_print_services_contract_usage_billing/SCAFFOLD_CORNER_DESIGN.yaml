            - call: "POST /billing-periods"
              payload: { contract_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { p1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FleetOpsController
            - call: "POST /_agent/meter-reads"
              payload: { device_id: "${d1}", billing_period_id: "${p1}", mono_meter: 3000, color_meter: 0, toner_level_pct: 70, coverage_start: "2026-08-01T00:00:00Z", coverage_end: "2026-08-15T00:00:00Z" }
              as: FleetOpsController
