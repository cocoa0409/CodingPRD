          EnforcementAction (action_type TERMINATION, trigger_reason
          CONCESSIONAIRE_DEFAULT, status NOTIFIED) and store its id in the lapsed row's
          self-referential escalated_to_action_id — while deliberately leaving the
          concession in STEP_IN and the concessionaire in STEPPED_IN. The new row is
          observable only through the list endpoint.
