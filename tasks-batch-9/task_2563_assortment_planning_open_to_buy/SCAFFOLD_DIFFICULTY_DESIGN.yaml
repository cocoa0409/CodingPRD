            - "the suspension is a write on the DEPENDENCY row only: Vendor.${vendor_id}.status == SUSPENDED and VendorAuthorization.${auth_id}.status == REVOKED, while ReceiptCommitment.${rc_id}.commit_status is untouched at PROPOSED"
            - "the first commit returns HTTP 409 with ${suspended_error} == ERR_VENDOR_NOT_AUTHORIZED - priority 13 wins over the priority-19 ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY that the revoked authorization also triggers, and over ERR_INVALID_STATE, since PROPOSED -> COMMITTED is a declared transition"
            - "the first commit moved no money: PlanMonth.${m1_id}.otb_committed_cents == 0 and otb_open_cents == 18200000, and CategoryPlan.${plan_id}.open_ratio_bps == 10000"
            - "the reinstatement restores exactly what the suspension revoked: Vendor.${vendor_id}.status == AUTHORIZED and VendorAuthorization.${auth_id}.status == ACTIVE again, with no new authorization row created"
            - "the second commit, byte-identical to the first, returns HTTP 200: ReceiptCommitment.${rc_id}.commit_status == COMMITTED, fulfillment_status == AWAITING_SHIP, open_cost_cents == 1000000"
            - "after the second commit: PlanMonth.${m1_id}.otb_committed_cents == 1000000 and otb_open_cents == 17200000, and CategoryPlan.${plan_id}.open_ratio_bps == 9751 (17200000 + 21970000 over 40170000) with otb_posture == OPEN"

      - name: open_season_requires_approved_category_plan
        grounds:
          - validations[priority=12].ERR_CATEGORY_PLAN_NOT_APPROVED
          - state_machines.PlanMonth.LOCKED_PLAN_to_IN_SEASON
          - state_machines.CategoryPlan.APPROVED_to_REFORECAST_OPEN
          - state_machines.CategoryPlan.REFORECAST_OPEN_to_SUBMITTED
          - state_machines.ReforecastCycle.OPEN_to_CLOSED
        distinguishing_aspect: |
          A third entity pair, PlanMonth -> CategoryPlan, and the dependency is narrower than
          "not terminal": the parent must be in exactly APPROVED, so the month is refused while its
          plan is REFORECAST_OPEN *and* while it is SUBMITTED - two different parent states, one
          error. The month itself stays LOCKED_PLAN the whole time, which is precisely the state from
          which open-season is declared, and the guard is satisfied only after the reforecast round
          is closed and the plan is re-approved.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Department WAPP, Category DRSS, StoreCluster Cold-A"
            - "CategoryPlan SPRING 2027 APPROVED with PlanMonth M1 LOCKED_PLAN (otb_planned_cents 18,200,000) and OptionPlan OP1 SLOTTED"
            - "a DIRECTOR_REQUEST ReforecastCycle round 1 already OPEN, so the plan sits in REFORECAST_OPEN with no decisions in the cycle"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "OS", size_sort_order: 1, pct_bps: 10000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              captures: { plan_v1: $.data.version }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "rebuild March before selling", expected_category_plan_version: "${plan_v1}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { reforecast_open_error: $.data.error_id }
            - call: "POST /otb/reforecast-cycles/${cycle_id}/close"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "round 1 rebuild" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { submitted_error: $.data.error_id }
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "re-approved" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
          assert:
            - "before the first probe: PlanMonth.${m1_id}.status == LOCKED_PLAN (the exact state from which open-season is declared) while CategoryPlan.${plan_id}.status == REFORECAST_OPEN and ReforecastCycle.${cycle_id}.status == OPEN"
            - "the first probe returns HTTP 409 with ${reforecast_open_error} == ERR_CATEGORY_PLAN_NOT_APPROVED, and PlanMonth.${m1_id}.status is still LOCKED_PLAN with active_basis == PLANNED_BASIS"
            - "the empty cycle closes through the OPEN -> CLOSED liveness escape: ReforecastCycle.${cycle_id}.status == CLOSED even though no ChaseCancelDecision was ever created, so the plan is not trapped in REFORECAST_OPEN"
            - "after the submit: CategoryPlan.${plan_id}.status == SUBMITTED, and the second probe returns HTTP 409 with ${submitted_error} == ERR_CATEGORY_PLAN_NOT_APPROVED as well - the guard demands exactly APPROVED, so SUBMITTED fails for the same reason REFORECAST_OPEN did"
            - "${reforecast_open_error} == ${submitted_error} == ERR_CATEGORY_PLAN_NOT_APPROVED, and neither probe wrote anything on PlanMonth.${m1_id}"
            - "the re-approval leaves the already-locked month alone: CategoryPlan.${plan_id}.status == APPROVED, receipt_budget_cents == 60000000, and PlanMonth.${m1_id}.status is still LOCKED_PLAN with otb_planned_cents == 18200000, because cascade-B link 2 only locks months that are DRAFT"
            - "the third probe, byte-identical to the first two, returns HTTP 200: PlanMonth.${m1_id}.status == IN_SEASON with active_basis still PLANNED_BASIS (no ActualsPost exists yet) and otb_planned_cents == 18200000"
            - "the parent is untouched by the child's transition: CategoryPlan.${plan_id}.status remains APPROVED and reforecast_round remains 1 after the month opens for season"

  - rule_id: resource_temporal_overlap
    instances:
      - name: vendor_ship_window_half_open_capacity_aggregate
        grounds:
          - calculations.vendor_window_load
          - validations[priority=31].ERR_VENDOR_CAPACITY_EXCEEDED
          - entities.Vendor.fields.weekly_unit_capacity
          - entities.ReceiptCommitment.fields.ship_window_start
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The contended resource is the Vendor's weekly_unit_capacity and the interval semantics are
          HALF-OPEN [ship_window_start, ship_window_end): two windows that merely touch at an instant
          do not overlap, so a 7000-unit order ending 2027-03-15T00:00:00Z and another starting at
          exactly that instant coexist under a 12000-unit ceiling. The check is an AGGREGATE over
          every PROPOSED or COMMITTED window that overlaps the candidate, not a pairwise test: a
          candidate that individually fits is still rejected because three separately legal windows
          sum against it. Nothing here is a duration or a buffer - contiguity is explicitly allowed.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Vendor Aurora Mills AUTHORIZED with weekly_unit_capacity 12000, min_order_units 200, lead_time_days 45, and an ACTIVE DRSS authorization for 40000 open units"
            - "CategoryPlan SPRING 2027 APPROVED with PlanMonth M1 LOCKED_PLAN, otb_planned_cents and otb_open_cents both 18,200,000"
            - "one CARRYOVER AssortmentItem W on OP1 with unit_cost_cents 1000, so every commitment below costs units * 1000 cents"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "OS", size_sort_order: 1, pct_bps: 10000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-CARRY-W", color_code: "NAVY", lifecycle_stage: "CARRYOVER", unit_cost_cents: 1000, retail_price_cents: 2900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_w: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { v_a: $.data.version }
          trigger:
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_w}", vendor_id: "${vendor_id}", units: 7000, unit_cost_cents: 1000, ship_window_start: "2027-03-01T00:00:00Z", ship_window_end: "2027-03-15T00:00:00Z", expected_plan_month_version: "${v_a}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_c1: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { v_b: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_w}", vendor_id: "${vendor_id}", units: 7000, unit_cost_cents: 1000, ship_window_start: "2027-03-15T00:00:00Z", ship_window_end: "2027-03-29T00:00:00Z", expected_plan_month_version: "${v_b}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_c2: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { v_c: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_w}", vendor_id: "${vendor_id}", units: 5000, unit_cost_cents: 1000, ship_window_start: "2027-03-20T00:00:00Z", ship_window_end: "2027-03-25T00:00:00Z", expected_plan_month_version: "${v_c}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_c4: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { v_d: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_w}", vendor_id: "${vendor_id}", units: 6000, unit_cost_cents: 1000, ship_window_start: "2027-03-10T00:00:00Z", ship_window_end: "2027-03-22T00:00:00Z", expected_plan_month_version: "${v_d}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { capacity_error: $.data.error_id }
          assert:
            - "C1 [2027-03-01, 2027-03-15) for 7000 units is accepted with HTTP 201: ReceiptCommitment.${rc_c1}.commit_status == PROPOSED, cost_cents == 7000000, open_cost_cents == 7000000; loaded units in its window are 0 and 0 + 7000 <= 12000"
            - "C2 [2027-03-15, 2027-03-29) for 7000 units is accepted with HTTP 201 even though 7000 + 7000 = 14000 exceeds weekly_unit_capacity 12000: under half-open semantics C1.ship_window_end == C2.ship_window_start means the windows do NOT overlap, so C1 contributes nothing to C2's load. A closed-interval or inclusive-end implementation would reject this call"
            - "C4 [2027-03-20, 2027-03-25) for 5000 units overlaps C2 only (C1 ends before C4 starts) and is accepted at the exact ceiling: loaded 7000 + candidate 5000 == 12000, and the rule rejects only when the sum is strictly greater than capacity"
            - "C4 does not overlap C1: C1.ship_window_start 2027-03-01 < C4.ship_window_end 2027-03-25 holds, but C4.ship_window_start 2027-03-20 < C1.ship_window_end 2027-03-15 does not, so the conjunction fails and C1 is excluded from C4's load - a one-sided overlap test would have summed 7000 + 7000 + 5000 and rejected C4"
            - "C3 [2027-03-10, 2027-03-22) for 6000 units returns HTTP 409 with ${capacity_error} == ERR_VENDOR_CAPACITY_EXCEEDED: it genuinely overlaps all three of C1, C2 and C4, so the aggregate load is 7000 + 7000 + 5000 = 19000 and 19000 + 6000 = 25000 > 12000"
            - "the rejection is aggregate, not pairwise: C3's 6000 units are below capacity 12000 and below every single existing window's headroom taken alone, and no individual pair (C3, Cn) exceeds 12000 except through the sum"
            - "the rejection is not budgetary: PlanMonth.${m1_id}.otb_open_cents is still 18200000 when C3 is attempted and C3's cost_cents would have been 6000000, so priority-37 ERR_OTB_EXCEEDED cannot explain it; equally units 6000 >= min_order_units 200 rules out ERR_BELOW_VENDOR_MINIMUM, and the category open units 19000 + 6000 = 25000 stay under max_open_units 40000"
            - "no PROPOSED commitment consumes budget: after all four calls PlanMonth.${m1_id}.otb_committed_cents == 0, otb_received_cents == 0 and otb_open_cents == 18200000, while PlanMonth.${m1_id}.version has advanced by exactly 3 (one per accepted create; the rejected C3 wrote nothing)"
            - "exactly three ReceiptCommitment rows exist for ${vendor_id}: GET /otb/receipt-commitments filtered by vendor_id returns ${rc_c1}, ${rc_c2} and ${rc_c4} and no row for the rejected candidate"

      - name: overlay_closed_window_separation_buffer
