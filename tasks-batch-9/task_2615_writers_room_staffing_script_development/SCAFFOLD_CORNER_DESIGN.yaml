      - name: a_ballot_must_cover_exactly_the_participants_and_sum_to_one_hundred
        claim_type: violation_error
        grounds:
          - validations.priority_13_business_constraint
          - errors.ERR_VOTE_SHARES_INVALID
          - errors.ERR_BALLOT_ALREADY_CAST
          - entities.CreditArbitration.fields.vote_ledger
        distinguishing_aspect: |
          vote_shares is validated as a SET plus a SUM against the arbitration's own participant list, so a
          ballot summing to 90, a ballot omitting a participant and a ballot naming an outsider are all
          422 ERR_VOTE_SHARES_INVALID - none of them may be recorded. The accepted ballot then makes a
          second ballot from the same arbiter a 409 ERR_BALLOT_ALREADY_CAST rather than an overwrite.
        test_recipe:
          setup:
            - "Arbitration ARB on EP1 has participant_writer_ids [W1, W2] and arbiters AR1, AR2, AR3."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
            - *C_MLIST2
            - *C_D2A
            - *C_APP2
            - *C_SUB1
            - *C_SUB2
            - *C_CLOSE
            - *C_AR1
            - *C_AR2
            - *C_AR3
            - *C_ARBIT
          trigger:
            - call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 60, "${w2}": 30 } }
              as: Writer
              as_user_id: "${ar1}"
            - call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 100 } }
              as: Writer
              as_user_id: "${ar1}"
            - call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 50, "${w2}": 30, "${ar2}": 20 } }
              as: Writer
              as_user_id: "${ar1}"
            - *C_V1
            - call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 30, "${w2}": 70 } }
              as: Writer
              as_user_id: "${ar1}"
          assert:
            - "Trigger call 1 returns 422 ERR_VOTE_SHARES_INVALID (60 + 30 = 90, not 100)"
            - "Trigger call 2 returns 422 ERR_VOTE_SHARES_INVALID (participant ${w2} is missing even though the values sum to 100)"
            - "Trigger call 3 returns 422 ERR_VOTE_SHARES_INVALID (${ar2} is an arbiter, not a participant)"
            - "After the three refusals CreditArbitration.${arb}.status is still STATEMENTS_OPEN with votes_cast_count == 0 and vote_ledger == {}"
            - "Trigger call 4 returns 200: status == PANEL_VOTING, votes_cast_count == 1 and vote_ledger has exactly the key ${ar1}"
            - "Trigger call 5 returns 409 ERR_BALLOT_ALREADY_CAST and vote_ledger[${ar1}] is still { ${w1}: 50, ${w2}: 50 } - a ballot is never overwritten"

      - name: pagination_bounds_are_enforced_before_any_row_is_read
        claim_type: violation_error
        grounds:
          - validations.priority_11_business_constraint
          - errors.ERR_INVALID_PAGINATION
          - endpoints.GET_/writers
        distinguishing_aspect: |
          limit is bounded on BOTH sides and offset only below, so limit=0, limit=101 and offset=-1 are all
          400 ERR_INVALID_PAGINATION while limit=100 with offset=0 is accepted - and the check runs before
          any filtering, so an out-of-range limit combined with a filter that matches nothing is still a
          400 rather than an empty 200.
        test_recipe:
          setup:
            - "Three writers exist: SR, W1 and W3."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W3
          trigger:
            - call: "GET /writers?limit=0"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?limit=101"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?offset=-1"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?limit=0&determined_level=PRODUCER"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?limit=100&offset=0"
              payload: {}
              as: GuildAdministrator
          assert:
            - "Trigger calls 1, 2 and 3 each return 400 ERR_INVALID_PAGINATION"
            - "Trigger call 4 returns 400 ERR_INVALID_PAGINATION, not an empty 200 list: pagination is validated before the filter is applied"
            - "Trigger call 5 returns 200 with total_count == 3, has_more == false and exactly 3 rows"
            - "limit=1 offset=2 returns 200 with total_count == 3, has_more == false and 1 row, proving the accepted bounds still page correctly"

      - name: state_gate_precedes_the_fiscal_gate
        claim_type: priority_ordering
        grounds:
          - validations.priority_30_state
          - validations.priority_75_business_fiscal
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_30_beats_fiscal_75_on_an_over_budget_offer_into_an_active_room
          rationale: "That §1.8 instance violates both rules with one call and asserts the priority 30 code, then repairs each violation separately to prove the ordering."

      - name: safety_gate_precedes_the_interval_constraint
        claim_type: priority_conflict
        grounds:
          - validations.priority_45_business_safety
          - validations.priority_65_business_constraint
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_45_beats_constraint_65_on_an_underpaid_overlapping_second_seat
          rationale: "That §1.8 instance offers a seat that is simultaneously underpaid and overlapping an EXCLUSIVE seat and asserts ERR_BELOW_GUILD_MINIMUM, then fixes the pay to expose ERR_WRITER_WINDOW_CONFLICT."

  - section: endpoints
    instances:
      - name: writer_create_read_and_list_round_trip_with_filters_and_pagination
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/writers
          - endpoints.GET_/writers/{writer_id}
          - endpoints.GET_/writers
          - entities.Writer
        distinguishing_aspect: |
          The create/read/list triple must agree on DERIVED data, not just stored input: the level that
          POST computed is the level GET returns and the level the ?determined_level= filter selects on, and
          the filter composes with limit/offset so that total_count reflects the filter rather than the
          whole table. There is no update or delete endpoint for a Writer other than the credit-history
          award, so the CRUD surface is deliberately create/read/list only.
        test_recipe:
          setup:
            - "Agreement AG is on file with level thresholds STORY_EDITOR 2, EXEC_STORY_EDITOR 4, CO_PRODUCER 7, PRODUCER 12."
          setup_api_calls:
            - *C_AG
          trigger:
            - call: "POST /writers"
              payload: { legal_name: "Ines Roche", guild_member_id: "GM-5001", agreement_id: "${ag}", career_episodic_credits: 8, diversity_program_participant: true }
              as: GuildAdministrator
              captures: { w10: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Tomas Berg", guild_member_id: "GM-5002", agreement_id: "${ag}", career_episodic_credits: 8 }
              as: GuildAdministrator
              captures: { w11: "$.data.id" }
            - call: "GET /writers/${w10}"
              payload: {}
              as: StudioExecutive
            - call: "GET /writers?determined_level=CO_PRODUCER"
              payload: {}
              as: StudioExecutive
            - call: "GET /writers?determined_level=CO_PRODUCER&diversity_program_participant=true"
              payload: {}
              as: StudioExecutive
            - call: "GET /writers?determined_level=CO_PRODUCER&limit=1&offset=0"
              payload: {}
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns 201 with id, created_at, updated_at and version == 1 present, determined_level == CO_PRODUCER (8 credits clears the 7 threshold) and level_determination_agreement_id == ${ag}"
            - "Trigger call 3 returns 200 with a body byte-identical in every field to the create response: legal_name Ines Roche, career_episodic_credits 8, determined_level CO_PRODUCER, is_showrunner_eligible false, active_seat_count 0"
            - "Trigger call 4 returns 200 with total_count == 2, has_more == false and exactly the ids ${w10} and ${w11} - the filter is applied to the COMPUTED level, never to an input field"
            - "Trigger call 5 returns 200 with total_count == 1 and the single id ${w10}: the two filters compose as a conjunction"
            - "Trigger call 6 returns 200 with total_count == 2, has_more == true and exactly 1 row, and the same query at offset=1 returns the other id with has_more == false"
            - "GET /writers/00000000-0000-4000-8000-000000000000 returns 404 ERR_WRITER_NOT_FOUND"

      - name: reconfigure_rewrites_every_confirmed_seat_and_is_refused_once_the_room_is_active
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/rooms/{room_id}/reconfigure
          - state_machines.WritersRoom.STAFFING_to_STAFFING
          - calculations.seat_weekly_compensation
          - calculations.seat_prorated_commitment
          - calculations.room_weekly_burn
          - errors.ERR_ROOM_NOT_ACCEPTING_SEATS
        distinguishing_aspect: |
          A self-loop action endpoint whose whole observable effect is CASCADE C: two payload fields
          (format, duration) rewrite four derived fields on every CONFIRMED seat, then the room's tier and
          burn, then the season's commitment - and the second reconfigure proves the recomputation is done
          from the guild floor each time rather than from the previously derived figure (720000 does not
          become 792000, it becomes 660000). The same call is 409 once the room is ACTIVE, which makes the
          endpoint reachable only inside the STAFFING window of the room's life.
        test_recipe:
          setup:
            - "IN_PERSON room RM (capacity 3, 26 weeks) is in STAFFING with S1 CONFIRMED for W1 at STORY_EDITOR / offered 600000 over 2026-09-01..2027-03-01 (181 days)."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - call: "GET /rooms/${rm}"
              payload: {}
              as: StudioExecutive
              captures: { rv18: "$.data.version" }
          trigger:
            - call: "POST /rooms/${rm}/reconfigure"
              payload: { format: "MINI_ROOM", duration_weeks_committed: 26, expected_room_version: "${rv18}" }
              as: StudioExecutive
              captures: { rv19: "$.data.version" }
            - call: "POST /rooms/${rm}/reconfigure"
              payload: { format: "IN_PERSON", duration_weeks_committed: 12, expected_room_version: "${rv19}" }
              as: StudioExecutive
              captures: { rv20: "$.data.version" }
            - call: "POST /rooms/${rm}/activate"
              payload: {}
              as: StudioExecutive
              captures: { rv21: "$.data.version" }
            - call: "POST /rooms/${rm}/reconfigure"
              payload: { format: "REMOTE", duration_weeks_committed: 26, expected_room_version: "${rv21}" }
              as: StudioExecutive
          assert:
            - "Before trigger call 1: RoomSeat.${s1}.guild_floor_weekly_cents == 600000, weekly_compensation_cents == 600000, prorated_commitment_cents == 15514284 and WritersRoom.${rm}.weekly_burn_cents == 800000"
            - "Trigger call 1 returns 200 with status still STAFFING and version ${rv19} == ${rv18} + 1"
            - "After trigger call 1: RoomSeat.${s1}.guild_floor_weekly_cents == 720000 (round_half_up(600000 * 1.2)), weekly_compensation_cents == 720000 (the floor now beats the 600000 offer) and prorated_commitment_cents == 18617142 (25 * 720000 + 6 * 102857)"
            - "After trigger call 1: room.seat_subtotal_weekly_cents == 720000, facility_tier == TIER_1, facility_surcharge_weekly_cents == 120000 (200000 * MINI_ROOM 0.6), weekly_burn_cents == 840000 and Season.${se}.staffing_commitment_weekly_cents == 840000"
            - "After trigger call 2: guild_floor_weekly_cents == 660000 (round_half_up(600000 * 1.0 * 1.1) - recomputed from the level minimum, NOT from the 720000 mini-room figure), weekly_compensation_cents == 660000, prorated_commitment_cents == 17065716 (25 * 660000 + 6 * 94286)"
            - "After trigger call 2: facility_surcharge_weekly_cents == 200000 (IN_PERSON 1.0), weekly_burn_cents == 860000 and Season commitment == 860000; RoomSeat.${s1}.version == 4 (create 1, accept 2, two reconfigures 3 and 4)"
            - "Trigger call 4 returns 409 ERR_ROOM_NOT_ACCEPTING_SEATS: the version is current, so this is the state precondition and not the OCC check"
            - "After trigger call 4 the room is unchanged: format IN_PERSON, duration_weeks_committed 12, weekly_burn_cents 860000 and version ${rv21}"

      - name: offering_a_seat_links_a_writer_a_room_and_the_window_that_covers_it
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/rooms/{room_id}/seats
          - endpoints.POST_/room-seats/{seat_id}/accept
          - entities.RoomSeat.fields.consumed_window_id
          - errors.ERR_WRITER_NOT_FOUND
          - errors.ERR_ROOM_NOT_FOUND
          - errors.ERR_WRITER_UNAVAILABLE
        distinguishing_aspect: |
          The link needs THREE resolvable ends, and each end fails differently: an unknown room in the path
          is 404 ERR_ROOM_NOT_FOUND, an unknown writer in the body is 404 ERR_WRITER_NOT_FOUND, and a real
          writer with no window covering the interval is 422 ERR_WRITER_UNAVAILABLE. Only on success is the
          third end bound - the window id is written onto the seat and the reverse lookup by
          ?consumed_by_seat_id= finds it - and the binding happens at ACCEPT, not at offer.
        test_recipe:
          setup:
            - "Room RM is in STAFFING; W1 holds window AW1 (2026-08-15..2027-06-01); W3 holds no window at all."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W3
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
          trigger:
            - call: "POST /rooms/00000000-0000-4000-8000-000000000000/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "00000000-0000-4000-8000-000000000000", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - *C_S1
            - *C_ACC1
          assert:
            - "Trigger call 1 returns 404 ERR_ROOM_NOT_FOUND: the path resource is resolved before the body"
            - "Trigger call 2 returns 404 ERR_WRITER_NOT_FOUND (body FK existence, priority 6)"
            - "Trigger call 3 returns 422 ERR_WRITER_UNAVAILABLE: ${w3} exists but owns no AvailabilityWindow containing 2026-09-01..2027-03-01"
            - "After trigger call 4 (the successful offer): RoomSeat.${s1}.room_id == ${rm}, writer_id == ${w1}, status == OFFERED and consumed_window_id == null - the window is not bound yet"
            - "After trigger call 5 (accept): RoomSeat.${s1}.consumed_window_id == ${aw1} and AvailabilityWindow.${aw1}.status == CONSUMED with consumed_by_seat_id == ${s1}"
            - "GET /availability-windows?consumed_by_seat_id=${s1} returns exactly 1 row (${aw1}) and GET /room-seats?consumed_window_id=${aw1} returns exactly 1 row (${s1}): the association is navigable from both ends"
            - "GET /room-seats?room_id=${rm} returns 1 row and GET /room-seats?writer_id=${w3} returns 0 rows: none of the three refusals created a seat"

      - name: season_and_ledger_reads_return_the_calculated_figures_not_stored_copies
        claim_type: computed_read
        grounds:
          - endpoints.GET_/seasons/{season_id}
          - endpoints.GET_/fee-ledger-entries
          - calculations.season_staffing_commitment
          - calculations.script_coverage_index
          - calculations.season_script_fee_commitment
        distinguishing_aspect: |
          Every derived number the season read exposes must reconcile against an independently observable
          source in the same response set: staffing_commitment_weekly_cents equals the sum of
          GET /rooms weekly_burn_cents over STAFFING and ACTIVE rooms, committed_script_fee_cents equals the
          signed sum of GET /fee-ledger-entries, and ready_script_count equals the number of
          GET /episodes rows that pass BOTH readiness and clearance filters - so a coverage figure that
          drifted from the episode list is detectable without recomputing the formula by hand.
        test_recipe:
          setup:
            - "Season SE has room RM in ACTIVE with S1 CONFIRMED, and EP1 with A1 (TELEPLAY) APPROVED and A2 (STORY) DRAFTING."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
          trigger:
            - call: "GET /seasons/${se}"
              payload: {}
              as: StudioExecutive
            - call: "GET /rooms?season_id=${se}&status=ACTIVE"
              payload: {}
              as: StudioExecutive
            - call: "GET /fee-ledger-entries?season_id=${se}"
              payload: {}
              as: StudioExecutive
            - call: "GET /episodes?season_id=${se}&script_readiness=READY"
              payload: {}
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns staffing_commitment_weekly_cents == 800000, and trigger call 2's single row has weekly_burn_cents == 800000: the two agree exactly"
            - "Trigger call 1 returns committed_script_fee_cents == 3250000, and trigger call 3's rows sum to 3250000 (COMMITMENT 3500000 for ${a1}, GUARANTEE_OFFSET -1750000 for ${a1}, COMMITMENT 1500000 for ${a2})"
            - "Trigger call 3 returns total_count == 3 and every row carries season_id ${se}; GET /fee-ledger-entries?assignment_id=${a1} returns 2 of them"
            - "Trigger call 1 returns ready_script_count == 0, coverage_gap == 1 and coverage_posture == AT_RISK even though trigger call 4 returns 1 row: ${ep1} is READY but its clearance_posture is PENDING, so it is not countable"
            - "GET /episodes?season_id=${se}&clearance_posture=CLEARED returns 0 rows, which is exactly the ready_script_count of 0"
            - "Trigger call 1 also exposes filled_seat_count-independent totals: confirmed_seat_count == 1 and staffing_budget_weekly_cents == 5000000 unchanged from the create"

      - name: a_legal_waiver_is_available_only_while_the_review_sits_at_conditional
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/clearance-reviews/{review_id}/waiver
          - state_machines.ClearanceReview.CONDITIONAL_to_CONDITIONAL_WAIVED
          - errors.ERR_WAIVER_NOT_APPLICABLE
          - errors.ERR_REVIEW_WAIVED
          - calculations.script_coverage_index
        distinguishing_aspect: |
          The action's availability is a function of a COMPUTED posture the caller cannot set directly: it
          is refused at PENDING (nothing decided yet) with ERR_WAIVER_NOT_APPLICABLE, becomes available the
          instant a CONDITIONAL decision lands, and closes again with a different code
          (ERR_REVIEW_WAIVED) once used. Its success is what converts a READY episode into a countable
          ready script, so the season's coverage posture flips inside the waiver call.
        test_recipe:
          setup:
            - "EP1's A1 is APPROVED (readiness READY) and review CR holds items IT1 (DEPICTION) and IT2 (NAME), both still SUBMITTED."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_CR
            - *C_IT1
            - *C_IT2
          trigger:
            - call: "POST /clearance-reviews/${cr}/waiver"
              payload: { waiver_memo: "Premature." }
              as: LegalCounsel
            - call: "POST /clearance-items/${it2}/decide"
              payload: { decision: "CLEARED" }
              as: LegalCounsel
            - call: "POST /clearance-items/${it1}/decide"
              payload: { decision: "CONDITIONAL", conditional_note: "Change the senator's home state and surname." }
              as: LegalCounsel
            - call: "POST /clearance-reviews/${cr}/waiver"
              payload: { waiver_memo: "Depiction risk accepted; E&O carrier notified 2026-08-01." }
              as: LegalCounsel
            - call: "POST /clearance-reviews/${cr}/waiver"
              payload: { waiver_memo: "Second bite." }
              as: LegalCounsel
          assert:
            - "Trigger call 1 returns 409 ERR_WAIVER_NOT_APPLICABLE (posture is PENDING) and legal_waiver_granted stays false with waiver_memo null"
            - "After trigger call 2: posture is still PENDING (1 of 2 items decided) and a waiver attempt would still be ERR_WAIVER_NOT_APPLICABLE"
            - "After trigger call 3: ClearanceReview.${cr}.risk_score == 25 (DEPICTION 25 * CONDITIONAL 1 + NAME 5 * CLEARED 0), posture == CONDITIONAL and Episode.${ep1}.clearance_posture == CONDITIONAL"
            - "Immediately before trigger call 4: Episode.${ep1}.script_readiness == READY but Season.${se}.ready_script_count == 0 and coverage_posture == AT_RISK"
            - "Trigger call 4 returns 200 with posture == CONDITIONAL_WAIVED, legal_waiver_granted == true and waiver_memo stored verbatim; risk_score stays 25 - the waiver does not rescore the items"
            - "In the same trigger call 4 response set: Episode.${ep1}.clearance_posture == CONDITIONAL_WAIVED, Season.${se}.ready_script_count == 1, coverage_gap == 0 and coverage_posture == COVERED"
            - "Trigger call 5 returns 409 ERR_REVIEW_WAIVED and waiver_memo is still the trigger call 4 text, not 'Second bite.'"

  - section: errors
    instances:
      - name: the_second_half_of_the_not_found_catalogue_is_triggerable_by_read
        claim_type: violation_to_error
        grounds:
          - validations.priority_5_existence
          - errors.ERR_EPISODE_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_MILESTONE_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
