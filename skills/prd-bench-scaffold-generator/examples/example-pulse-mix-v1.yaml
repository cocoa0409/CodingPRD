# =============================================================================
# Example: pulse-mix benchmark seed tables (v1)
# =============================================================================

scenario: |
  Music studio playlist management system. Manages cycle-based promotional playlists
  ("mixes") within a rights, dispute, and budget policy environment. Studios own assets,
  clearances, mixes, and disputes. Considerations: role-based access (curator/manager/legal),
  studio posture derived from disputes, per-cycle token budgets, clearance policies,
  dispute cascades, idempotency, optimistic concurrency, and budget shedding.

domain_name: pulse-mix
api_prefix: /studios

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: posture, type: enum, source: computed, description: "OPEN | REVIEW | HALT — derived from disputes" }
      - { name: cycle_index, type: integer, source: system, description: "Monotone cycle counter, starts at 1" }
      - { name: token_budget, type: integer, source: input, description: "Per-cycle token budget cap" }
      - { name: token_reserved, type: integer, source: computed, description: "Sum of token_cost for SUBMITTED/APPROVED mixes" }
      - { name: token_committed, type: integer, source: computed, description: "Sum of token_cost for PUBLISHED/FROZEN mixes" }
      - { name: token_available, type: integer, source: computed, description: "token_budget - token_reserved - token_committed" }

  - name: Asset
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "Associated studio ID" }
      - { name: title, type: string, source: input, description: "Asset title" }
      - { name: duration_sec, type: integer, source: input, description: "Duration in seconds" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE / QUARANTINED / RETIRED" }

  - name: Clearance
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "Associated studio ID" }
      - { name: asset_id, type: string, source: input, description: "Associated asset ID (exactly one clearance per asset)" }
      - { name: policy, type: enum, source: input, description: "FULL | PROMO" }
      - { name: status, type: enum, source: system, description: "PENDING → GRANTED / SUSPENDED / REVOKED" }
      - { name: last_granted_in_cycle, type: integer, source: system, required: false, description: "Cycle index when last granted, or null" }

  - name: Mix
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "Associated studio ID" }
      - { name: kind, type: enum, source: input, description: "PUBLIC | INTERNAL | EVIDENCE" }
      - { name: entries, type: array, source: input, description: "List of entries, each with asset_id and slot (NORMAL or SPOTLIGHT)" }
      - { name: token_cost, type: integer, source: computed, description: "Derived from entries, asset durations, slots, and mix kind" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → PUBLISHED / FROZEN / ARCHIVED" }
      - { name: approved_in_cycle, type: integer, source: system, required: false, description: "Cycle index when approved" }
      - { name: published_in_cycle, type: integer, source: system, required: false, description: "Cycle index when published" }

  - name: Dispute
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "Associated studio ID" }
      - { name: target_type, type: enum, source: input, description: "ASSET | MIX" }
      - { name: target_id, type: string, source: input, description: "ID of the targeted asset or mix" }
      - { name: severity, type: enum, source: input, description: "LOW | HIGH" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED | VOID" }
      - { name: resolution, type: enum, source: system, required: false, description: "UPHELD | DISMISSED | VOID — set on resolution" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Studio
    field: posture
    note: "Posture is derived, not directly transitioned"
    derivation: |
      If any dispute is ESCALATED → HALT.
      Else if 2+ disputes are OPEN → REVIEW.
      Else → OPEN.
      Recalculates after every dispute create/resolve/void and after cycle advance.

  - entity: Asset
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /studios/:studio_id/assets/:asset_id/activate
        actor: curator
        preconditions:
          - "Asset is DRAFT"
          - "Clearance in GRANTED exists for the asset"
          - "Studio posture is not HALT"
          - "No OPEN or ESCALATED dispute targeting the asset"
        side_effects: []

      - from: ACTIVE
        to: QUARANTINED
        trigger: "system (dispute creation targeting asset, or legal duration correction)"
        actor: system
        preconditions: []
        side_effects:
          - "Any GRANTED clearance becomes SUSPENDED"
          - "Queued mixes (SUBMITTED/APPROVED) referencing this asset → DRAFT (release reserved tokens)"
          - "PUBLISHED mixes referencing asset: LOW dispute → FROZEN; HIGH dispute → ARCHIVED"

      - from: QUARANTINED
        to: ACTIVE
        trigger: "system (when no more OPEN/ESCALATED disputes remain on asset, after dismiss/void)"
        actor: system
        preconditions:
          - "No remaining OPEN or ESCALATED disputes on the asset"
        side_effects: []
        note: "Quarantine removal only; clearance is NOT auto-regranted"

      - from: ACTIVE
        to: RETIRED
        trigger: "system (dispute resolved as UPHELD targeting asset)"
        actor: system
        preconditions: []
        side_effects:
          - "Clearance becomes REVOKED"
          - "All mixes containing the asset become ARCHIVED"

      - from: QUARANTINED
        to: RETIRED
        trigger: "system (dispute resolved as UPHELD targeting asset)"
        actor: system
        preconditions: []
        side_effects:
          - "Clearance becomes REVOKED"
          - "All mixes containing the asset become ARCHIVED"

  - entity: Clearance
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: POST /studios/:studio_id/clearances/:clearance_id/grant
        actor: legal
        preconditions:
          - "Studio posture is not HALT"
        side_effects:
          - "Sets last_granted_in_cycle to current cycle_index"

      - from: GRANTED
        to: SUSPENDED
        trigger: "system (asset quarantine) or POST .../clearances/:id/suspend"
        actor: "system or legal"
        preconditions: []
        side_effects:
          - "Queued mixes (SUBMITTED/APPROVED) referencing asset → DRAFT"
          - "Live mixes (PUBLISHED/FROZEN) referencing asset → FROZEN"

      - from: SUSPENDED
        to: GRANTED
        trigger: POST /studios/:studio_id/clearances/:clearance_id/grant
        actor: legal
        preconditions:
          - "Studio posture is not HALT"
        side_effects:
          - "Sets last_granted_in_cycle to current cycle_index"

      - from: GRANTED
        to: REVOKED
        trigger: POST /studios/:studio_id/clearances/:clearance_id/revoke
        actor: legal
        preconditions: []
        side_effects:
          - "Live mixes containing asset → ARCHIVED"
          - "Queued mixes containing asset → DRAFT"
          - "If from upheld dispute: asset → RETIRED"

      - from: SUSPENDED
        to: REVOKED
        trigger: POST /studios/:studio_id/clearances/:clearance_id/revoke
        actor: legal
        preconditions: []
        side_effects:
          - "Same as GRANTED → REVOKED"

      - from: PENDING
        to: REVOKED
        trigger: POST /studios/:studio_id/clearances/:clearance_id/revoke
        actor: legal
        preconditions: []
        side_effects: []

  - entity: Mix
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /studios/:studio_id/mixes/:mix_id/submit
        actor: curator
        preconditions:
          - "Studio posture is not HALT"
          - "Entry rules validated (count, duplicates, spotlight caps, clearance, disputes, asset status)"
          - "Token budget not exceeded"
        side_effects:
          - "token_reserved increases by token_cost"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/approve
        actor: manager
        preconditions:
          - "Studio posture is not HALT"
        side_effects:
          - "approved_in_cycle set to current cycle_index"

      - from: APPROVED
        to: PUBLISHED
        trigger: POST /studios/:studio_id/mixes/:mix_id/publish
        actor: manager
        preconditions:
          - "PUBLIC: posture must be OPEN; INTERNAL: posture OPEN or REVIEW"
          - "approved_in_cycle must equal current cycle_index (ERR_CYCLE_STALE)"
        side_effects:
          - "token_reserved decreases, token_committed increases by token_cost"
          - "published_in_cycle set to current cycle_index"

      - from: DRAFT
        to: FROZEN
        trigger: POST /studios/:studio_id/mixes/:mix_id/publish
        actor: legal
        preconditions:
          - "Mix kind must be EVIDENCE"
          - "Evidence entry rules validated"
        side_effects:
          - "token_cost is 0 (evidence mixes never count)"
          - "published_in_cycle set to current cycle_index"
        note: "Evidence mixes go directly DRAFT → FROZEN, published by legal even in HALT"

      - from: PUBLISHED
        to: FROZEN
        trigger: POST /studios/:studio_id/mixes/:mix_id/freeze
        actor: legal
        preconditions: []
        side_effects:
          - "Tokens remain committed"

      - from: PUBLISHED
        to: APPROVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/unpublish
        actor: manager
        preconditions:
          - "approved_in_cycle equals current cycle_index"
        side_effects:
          - "token_committed decreases, token_reserved increases by token_cost"

      - from: PUBLISHED
        to: DRAFT
        trigger: POST /studios/:studio_id/mixes/:mix_id/unpublish
        actor: manager
        preconditions:
          - "approved_in_cycle does NOT equal current cycle_index"
        side_effects:
          - "token_committed decreases by token_cost"

      - from: FROZEN
        to: APPROVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/unpublish
        actor: "manager or legal"
        preconditions:
          - "approved_in_cycle equals current cycle_index"
        side_effects:
          - "token_committed decreases, token_reserved increases by token_cost"
        note: "legal can unpublish only FROZEN mixes"

      - from: FROZEN
        to: DRAFT
        trigger: POST /studios/:studio_id/mixes/:mix_id/unpublish
        actor: "manager or legal"
        preconditions:
          - "approved_in_cycle does NOT equal current cycle_index"
        side_effects:
          - "token_committed decreases by token_cost"

      - from: SUBMITTED
        to: DRAFT
        trigger: "system (cycle advance, clearance suspend, dispute, entry edit, budget shedding)"
        actor: system
        preconditions: []
        side_effects:
          - "token_reserved decreases by token_cost"

      - from: APPROVED
        to: DRAFT
        trigger: "system (cycle advance, clearance suspend, dispute, entry edit, budget shedding)"
        actor: system
        preconditions: []
        side_effects:
          - "token_reserved decreases by token_cost"

      - from: DRAFT
        to: ARCHIVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/archive
        actor: "manager or legal"
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: ARCHIVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/archive
        actor: "manager or legal"
        preconditions: []
        side_effects:
          - "token_reserved decreases by token_cost"

      - from: APPROVED
        to: ARCHIVED
        trigger: POST /studios/:studio_id/mixes/:mix_id/archive
        actor: "manager or legal"
        preconditions: []
        side_effects:
          - "token_reserved decreases by token_cost"

      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST .../archive or system (cycle advance, HIGH dispute, clearance revoke, budget shedding)"
        actor: "manager, legal, or system"
        preconditions: []
        side_effects:
          - "token_committed decreases by token_cost"

      - from: FROZEN
        to: ARCHIVED
        trigger: "POST .../archive or system (cycle advance, HIGH dispute, clearance revoke, budget shedding)"
        actor: "manager, legal, or system"
        preconditions: []
        side_effects:
          - "token_committed decreases by token_cost"

  - entity: Dispute
    initial_state: "OPEN (LOW) or ESCALATED (HIGH)"
    terminal_states: [RESOLVED, VOID]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: POST /studios/:studio_id/disputes/:dispute_id/resolve
        actor: legal
        preconditions: []
        side_effects:
          - "resolution set (UPHELD or DISMISSED)"
          - "Posture recalculates"
          - "DISMISSED: quarantine removed if no other OPEN/ESCALATED disputes remain on target"
          - "UPHELD on asset: asset → RETIRED, clearance → REVOKED, mixes → ARCHIVED"
          - "UPHELD on mix: mix → ARCHIVED"

      - from: ESCALATED
        to: RESOLVED
        trigger: POST /studios/:studio_id/disputes/:dispute_id/resolve
        actor: legal
        preconditions: []
        side_effects:
          - "Same as OPEN → RESOLVED"

      - from: OPEN
        to: VOID
        trigger: POST /studios/:studio_id/disputes/:dispute_id/resolve
        actor: legal
        preconditions: []
        side_effects:
          - "resolution set to VOID"
          - "Posture recalculates"
          - "Quarantine removed if no other OPEN/ESCALATED disputes remain"

      - from: ESCALATED
        to: VOID
        trigger: POST /studios/:studio_id/disputes/:dispute_id/resolve
        actor: legal
        preconditions: []
        side_effects:
          - "Same as OPEN → VOID"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: token_cost
    trigger: "mix creation, entry edit, asset duration correction"
    algorithm: derived
    formula: |
      1. For each entry, determine base cost from referenced asset's duration_sec:
         duration_sec <= 120: base = 1
         121-240: base = 2
         241-420: base = 3
         > 420: base = 4
      2. Adjust by slot: NORMAL keeps base; SPOTLIGHT adds 1
      3. Sum all entries (duplicates count multiple times)
      4. Apply kind rule:
         PUBLIC: keep sum as-is
         INTERNAL: floor(sum / 2), minimum 1 for non-empty mix
         EVIDENCE: always 0

  - name: token_budget_enforcement
    trigger: "submit, publish, entry edit on queued mixes"
    algorithm: constraint
    formula: |
      token_reserved + token_committed + new_token_cost <= token_budget
      If violated: ERR_TOKEN_BUDGET_EXCEEDED

  - name: budget_shedding
    trigger: "legal actions that cause studio to exceed token_budget (disputes, clearance suspend/revoke, duration correction)"
    algorithm: priority_queue
    formula: |
      When token_reserved + token_committed > token_budget after a legal action:
      1. First shed queued mixes (SUBMITTED/APPROVED) → DRAFT
      2. If still over, archive live mixes (PUBLISHED/FROZEN) → ARCHIVED
      Shedding order: INTERNAL first, then PUBLIC.
      Within same kind: highest token_cost first.
      Ties: lexicographically smaller mix id first.

  - name: studio_posture
    trigger: "dispute create, resolve, void, cycle advance"
    algorithm: derived
    formula: |
      If any dispute is ESCALATED → HALT
      Else if 2+ disputes are OPEN → REVIEW
      Else → OPEN

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints

  - priority: 2
    category: idempotency
    check: "POST requests must include Idempotency-Key header"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: all POST endpoints

  - priority: 2b
    category: concurrency
    check: "PUT/PATCH requests must include If-Match header"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 428
    applies_to: PUT/PATCH endpoints

  - priority: 3
    category: idempotency
    check: "Idempotency key reused with different request body"
    error_id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http_status: 409
    applies_to: all POST endpoints

  - priority: 3b
    category: concurrency
    check: "If-Match version does not match current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: PUT/PATCH and optional on POST actions

  - priority: 4
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 5
    category: posture
    check: "Studio posture must allow the operation (e.g., HALT blocks submit, approve, activate, grant)"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 403
    applies_to: "submit, approve, activate, grant"

  - priority: 6
    category: state
    check: "Resource must be in the correct state for the requested operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 7a
    category: business_dispute
    check: "Asset or mix has an OPEN/ESCALATED dispute blocking the action"
    error_id: ERR_DISPUTE_BLOCKING
    http_status: 409
    applies_to: "submit (entry references disputed asset)"

  - priority: 7b
    category: business_asset
    check: "Referenced asset must be ACTIVE for non-evidence mixes"
    error_id: ERR_ASSET_NOT_ACTIVE
    http_status: 409
    applies_to: "submit"

  - priority: 7b2
    category: business_asset
    check: "Referenced asset must be QUARANTINED for evidence mixes"
    error_id: ERR_ASSET_QUARANTINED
    http_status: 409
    applies_to: "submit (evidence mix entries)"

  - priority: 7c
    category: business_clearance
    check: "Clearance must be GRANTED"
    error_id: ERR_CLEARANCE_REQUIRED
    http_status: 409
    applies_to: "submit"

  - priority: 7c2
    category: business_clearance
    check: "Clearance is SUSPENDED"
    error_id: ERR_CLEARANCE_SUSPENDED
    http_status: 409
    applies_to: "submit"

  - priority: 7c3
    category: business_clearance
    check: "Clearance policy must permit the mix kind and slot (PROMO cannot be in PUBLIC or SPOTLIGHT)"
    error_id: ERR_CLEARANCE_POLICY_MISMATCH
    http_status: 409
    applies_to: "submit"

  - priority: 7d
    category: business_entry
    check: "Entries count must be 1-25 (PUBLIC/INTERNAL) or 1-10 (EVIDENCE)"
    error_id: ERR_ENTRY_LIMIT
    http_status: 400
    applies_to: "submit, entry edit"

  - priority: 7e
    category: business_entry
    check: "PUBLIC mixes: each asset_id may appear at most once"
    error_id: ERR_ENTRY_DUPLICATE_PUBLIC
    http_status: 400
    applies_to: "submit, entry edit (PUBLIC)"

  - priority: 7f
    category: business_entry
    check: "Adjacent duplicate entries are not allowed (all kinds)"
    error_id: ERR_ENTRY_ADJACENT_DUPLICATE
    http_status: 400
    applies_to: "submit, entry edit"

  - priority: 7g
    category: business_entry
    check: "SPOTLIGHT entries not allowed in EVIDENCE mixes"
    error_id: ERR_SPOTLIGHT_NOT_ALLOWED
    http_status: 400
    applies_to: "submit, entry edit (EVIDENCE)"

  - priority: 7h
    category: business_entry
    check: "SPOTLIGHT cap: PUBLIC max 3, INTERNAL max 5; if REVIEW posture, non-evidence capped at 1"
    error_id: ERR_SPOTLIGHT_CAP_EXCEEDED
    http_status: 400
    applies_to: "submit, entry edit"

  - priority: 8
    category: business_cycle
    check: "approved_in_cycle must equal current cycle_index for publish"
    error_id: ERR_CYCLE_STALE
    http_status: 409
    applies_to: "publish (PUBLIC/INTERNAL)"

  - priority: 9
    category: business_fiscal
    check: "Token budget must not be exceeded"
    error_id: ERR_TOKEN_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "submit, entry edit on queued mixes"

  - priority: 10
    category: business_clearance
    check: "Only one clearance per asset"
    error_id: ERR_CLEARANCE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /clearances"

response_envelope:
  success: |
    (no envelope wrapper — resource fields at root with "effects": [] array)
  error: |
    { "error": { "code": "ERR_XXX", "message": "..." } }
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 5: API Endpoint Table (22 endpoints)
# =============================================================================
endpoints:
  # --- Studio ---
  - method: POST
    path: "/studios"
    description: "Create a new Studio"
    roles: [curator, manager, legal]
    code: 201
    input: [name, token_budget]
    output: Studio
    side_effects: ["posture initialized to OPEN, cycle_index to 1, token fields to 0"]

  - method: GET
    path: "/studios/:studio_id"
    description: "Get a specific Studio"
    roles: [curator, manager, legal]
    code: 200
    input: []
    output: Studio
    side_effects: []

  - method: POST
    path: "/studios/:studio_id/advance-cycle"
    description: "Advance the studio's cycle"
    roles: [manager]
    code: 200
    input: []
    output: Studio
    side_effects:
      - "cycle_index incremented"
      - "SUBMITTED/APPROVED mixes → DRAFT, release reserved tokens"
      - "PUBLISHED/FROZEN mixes → ARCHIVED, release committed tokens"
      - "Idempotency keys cleared"
      - "Posture recalculates"

  # --- Asset ---
  - method: POST
    path: "/studios/:studio_id/assets"
    description: "Create a new Asset"
    roles: [curator]
    code: 201
    input: [title, duration_sec]
    output: Asset
    side_effects: ["status initialized to DRAFT"]

  - method: GET
    path: "/studios/:studio_id/assets/:asset_id"
    description: "Get a specific Asset"
    roles: [curator, manager, legal]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: PATCH
    path: "/studios/:studio_id/assets/:asset_id"
    description: "Edit an asset (title/duration for DRAFT by curator; duration correction for ACTIVE/QUARANTINED by legal)"
    roles: [curator, legal]
    code: 200
    input: ["title?, duration_sec?"]
    output: Asset
    side_effects:
      - "Legal duration correction: asset → QUARANTINED, clearance → SUSPENDED, mix cascades, token_cost recalculated"

  - method: POST
    path: "/studios/:studio_id/assets/:asset_id/activate"
    description: "Activate a DRAFT asset"
    roles: [curator]
    code: 200
    input: []
    output: Asset
    side_effects: ["status → ACTIVE"]

  # --- Clearance ---
  - method: POST
    path: "/studios/:studio_id/clearances"
    description: "Create a clearance for an asset"
    roles: [legal]
    code: 201
    input: [asset_id, policy]
    output: Clearance
    side_effects: ["status initialized to PENDING, last_granted_in_cycle null"]

  - method: POST
    path: "/studios/:studio_id/clearances/:clearance_id/grant"
    description: "Grant a clearance"
    roles: [legal]
    code: 200
    input: []
    output: Clearance
    side_effects: ["status → GRANTED, last_granted_in_cycle set"]

  - method: POST
    path: "/studios/:studio_id/clearances/:clearance_id/suspend"
    description: "Suspend a clearance"
    roles: [legal]
    code: 200
    input: []
    output: Clearance
    side_effects:
      - "status → SUSPENDED"
      - "Queued mixes referencing asset → DRAFT"
      - "Live mixes referencing asset → FROZEN"

  - method: POST
    path: "/studios/:studio_id/clearances/:clearance_id/revoke"
    description: "Revoke a clearance"
    roles: [legal]
    code: 200
    input: []
    output: Clearance
    side_effects:
      - "status → REVOKED (terminal)"
      - "Live mixes containing asset → ARCHIVED"
      - "Queued mixes containing asset → DRAFT"
      - "If from upheld dispute: asset → RETIRED"

  # --- Mix ---
  - method: POST
    path: "/studios/:studio_id/mixes"
    description: "Create a new Mix"
    roles: [curator]
    code: 201
    input: [kind, entries]
    output: Mix
    side_effects: ["status initialized to DRAFT, token_cost computed"]

  - method: GET
    path: "/studios/:studio_id/mixes/:mix_id"
    description: "Get a specific Mix"
    roles: [curator, manager, legal]
    code: 200
    input: []
    output: Mix
    side_effects: []

  - method: PUT
    path: "/studios/:studio_id/mixes/:mix_id/entries"
    description: "Replace the full entries list of a mix"
    roles: [curator]
    code: 200
    input: [entries]
    output: Mix
    side_effects:
      - "Allowed from DRAFT, SUBMITTED, APPROVED"
      - "If SUBMITTED/APPROVED: mix resets to DRAFT, releases reserved tokens"
      - "token_cost recalculated"

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/submit"
    description: "Submit a mix for review"
    roles: [curator]
    code: 200
    input: []
    output: Mix
    side_effects: ["status → SUBMITTED, token_reserved increases"]

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/approve"
    description: "Approve a submitted mix"
    roles: [manager]
    code: 200
    input: []
    output: Mix
    side_effects: ["status → APPROVED, approved_in_cycle set"]

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/publish"
    description: "Publish an approved mix (or evidence mix directly from DRAFT)"
    roles: [manager, legal]
    code: 200
    input: []
    output: Mix
    side_effects:
      - "PUBLIC/INTERNAL: status → PUBLISHED, tokens move from reserved to committed"
      - "EVIDENCE: status → FROZEN (legal only, allowed even in HALT)"
      - "published_in_cycle set"

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/unpublish"
    description: "Unpublish a live mix"
    roles: [manager, legal]
    code: 200
    input: []
    output: Mix
    side_effects:
      - "If approved_in_cycle is current: status → APPROVED (tokens to reserved)"
      - "Otherwise: status → DRAFT (tokens released)"
      - "legal can only unpublish FROZEN mixes"

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/freeze"
    description: "Freeze a published mix"
    roles: [legal]
    code: 200
    input: []
    output: Mix
    side_effects: ["status → FROZEN, tokens remain committed"]

  - method: POST
    path: "/studios/:studio_id/mixes/:mix_id/archive"
    description: "Archive a mix from any non-archived status"
    roles: [manager, legal]
    code: 200
    input: []
    output: Mix
    side_effects: ["status → ARCHIVED, releases any held tokens"]

  # --- Dispute ---
  - method: POST
    path: "/studios/:studio_id/disputes"
    description: "Open a dispute against an asset or mix"
    roles: [legal]
    code: 201
    input: [target_type, target_id, severity]
    output: Dispute
    side_effects:
      - "LOW → status OPEN; HIGH → status ESCALATED"
      - "Asset target: asset → QUARANTINED, clearance → SUSPENDED, mix cascades"
      - "Mix target: queued mixes → DRAFT; PUBLISHED: LOW → FROZEN, HIGH → ARCHIVED"
      - "Posture recalculates"

  - method: POST
    path: "/studios/:studio_id/disputes/:dispute_id/resolve"
    description: "Resolve or void a dispute"
    roles: [legal]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects:
      - "DISMISSED: status → RESOLVED, quarantine removed if no other disputes"
      - "UPHELD: status → RESOLVED, asset → RETIRED, clearance → REVOKED, mixes → ARCHIVED"
      - "VOID: status → VOID, quarantine removed if no other disputes"
      - "Posture recalculates"
      - "Never auto-regrants clearance"

# =============================================================================
# Table 6: Error Code Catalogue (23 error codes)
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch, etc.)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist"

  - id: ERR_MISSING_IDEMPOTENCY_KEY
    http: 400
    condition: "POST request missing Idempotency-Key header"

  - id: ERR_MISSING_IF_MATCH
    http: 428
    condition: "PUT/PATCH request missing If-Match header"

  - id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http: 409
    condition: "Idempotency key reused with different request body"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version does not match current version"

  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Current role does not have permission for this operation"

  - id: ERR_POSTURE_BLOCKED
    http: 403
    condition: "Operation blocked by current studio posture (HALT or REVIEW)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the correct state for the requested operation"

  - id: ERR_CYCLE_STALE
    http: 409
    condition: "approved_in_cycle does not match current cycle_index for publish"

  - id: ERR_TOKEN_BUDGET_EXCEEDED
    http: 402
    condition: "Operation would exceed studio token budget"

  - id: ERR_ENTRY_LIMIT
    http: 400
    condition: "Entries list exceeds allowed size (1-25 for PUBLIC/INTERNAL, 1-10 for EVIDENCE)"

  - id: ERR_ENTRY_DUPLICATE_PUBLIC
    http: 400
    condition: "PUBLIC mix has duplicate asset_id"

  - id: ERR_ENTRY_ADJACENT_DUPLICATE
    http: 400
    condition: "Adjacent entries reference the same asset_id"

  - id: ERR_SPOTLIGHT_NOT_ALLOWED
    http: 400
    condition: "SPOTLIGHT slot used in EVIDENCE mix"

  - id: ERR_SPOTLIGHT_CAP_EXCEEDED
    http: 400
    condition: "Too many SPOTLIGHT entries for the mix kind or posture"

  - id: ERR_ASSET_NOT_ACTIVE
    http: 409
    condition: "Referenced asset is not in ACTIVE status"

  - id: ERR_ASSET_QUARANTINED
    http: 409
    condition: "Referenced asset is QUARANTINED (relevant for evidence mix validation)"

  - id: ERR_CLEARANCE_REQUIRED
    http: 409
    condition: "No clearance exists or clearance not in GRANTED state"

  - id: ERR_CLEARANCE_SUSPENDED
    http: 409
    condition: "Clearance is in SUSPENDED state"

  - id: ERR_CLEARANCE_POLICY_MISMATCH
    http: 409
    condition: "Clearance policy does not permit the mix kind or slot type (PROMO cannot be in PUBLIC or SPOTLIGHT)"

  - id: ERR_DISPUTE_BLOCKING
    http: 409
    condition: "An OPEN or ESCALATED dispute blocks the action"

  - id: ERR_CLEARANCE_ALREADY_EXISTS
    http: 409
    condition: "A clearance already exists for this asset"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: curator
    description: "Uploads and edits assets, authors mixes, submits mixes"
    exclusive_operations:
      - "POST /studios/:studio_id/assets — Create asset"
      - "PATCH /studios/:studio_id/assets/:asset_id — Edit asset (DRAFT only: title, duration)"
      - "POST .../assets/:asset_id/activate — Activate asset"
      - "POST /studios/:studio_id/mixes — Create mix"
      - "PUT .../mixes/:mix_id/entries — Edit entries"
      - "POST .../mixes/:mix_id/submit — Submit mix"

  - name: manager
    description: "Approves mixes, controls publishing and removal"
    exclusive_operations:
      - "POST .../mixes/:mix_id/approve — Approve mix"
      - "POST .../mixes/:mix_id/publish — Publish mix (PUBLIC/INTERNAL)"
      - "POST .../mixes/:mix_id/unpublish — Unpublish mix (any live status)"
      - "POST .../mixes/:mix_id/archive — Archive mix"
      - "POST .../advance-cycle — Advance cycle"

  - name: legal
    description: "Manages rights and enforcement: clearances, disputes, evidence mixes, freezes"
    exclusive_operations:
      - "POST /studios/:studio_id/clearances — Create clearance"
      - "POST .../clearances/:clearance_id/grant — Grant clearance"
      - "POST .../clearances/:clearance_id/suspend — Suspend clearance"
      - "POST .../clearances/:clearance_id/revoke — Revoke clearance"
      - "POST /studios/:studio_id/disputes — Open dispute"
      - "POST .../disputes/:dispute_id/resolve — Resolve dispute"
      - "POST .../mixes/:mix_id/publish — Publish evidence mix"
      - "POST .../mixes/:mix_id/freeze — Freeze mix"
      - "POST .../mixes/:mix_id/unpublish — Unpublish FROZEN mix"
      - "PATCH .../assets/:asset_id — Legal duration correction (ACTIVE/QUARANTINED)"
