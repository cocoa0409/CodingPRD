            - "Result 3 retry on 2026-08-13: http 422 ERR_BATCH_WINDOW_CLOSED (temporal priority 9 masks the still-true capacity violation)"
            - "LabBatch.${batch}.intake_count == 2 and FieldSample.${s3}.status == SEALED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invalidate_replace_conserves_active_count
        grounds:
          - calculations.plan_sample_accounting
          - state_machines.FieldSample.COLLECTED_to_INVALIDATED
        distinguishing_aspect: |
          Conserved quantity = plan.active_sample_count (sample population). Compensating pair:
          invalidate (3 -> 2) then create replacement reusing the released calibration (2 -> 3);
          the invariant count(status in {COLLECTED,SEALED,ANALYZED} PERSONAL) == active_sample_count
          holds at every step.
        test_recipe:
          setup: ["SEG H=3, plan APPROVED, 3 PERSONAL samples COLLECTED"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c2: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c3: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c2}", collection_date: "2026-08-03", start_minute: 720, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s2: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c3}", collection_date: "2026-08-03", start_minute: 960, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s3: $.data.id } }
            - { call: "GET /ih/sampling-plans/${plan}", payload: {}, as: IndustrialHygienist, captures: { cnt_before: $.data.active_sample_count } }
          trigger:
            - { call: "POST /ih/field-samples/${s1}/invalidate", payload: { reason: "dropped cassette" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "GET /ih/sampling-plans/${plan}", payload: {}, as: IndustrialHygienist, captures: { cnt_mid: $.data.active_sample_count } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-04", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s4: $.data.id } }
            - { call: "GET /ih/sampling-plans/${plan}", payload: {}, as: IndustrialHygienist, captures: { cnt_after: $.data.active_sample_count } }
          assert:
            - "active_sample_count: 3 before, 2 after invalidate, 3 after replacement — the invalidate/replace pair conserves the quantity"
            - "FieldSample.${s1}.status == INVALIDATED and PumpCalibration.${c1}.linked_sample_id == null after invalidation"
            - "Replacement ${s4} reuses calibration ${c1} without ERR_CALIBRATION_IN_USE; plan remains APPROVED (count dropped and recovered, never below required after compensation)"

      - name: membership_transfer_conserves_site_headcount
        grounds:
          - calculations.seg_headcount
          - entities.SimilarExposureGroup.fields.headcount
        distinguishing_aspect: |
          Conserved quantity = site-wide SEG membership total (a headcount, not a sample count).
          Transfer A->B decrements A and increments B: (2,1) -> (1,2), sum stays 3.
        test_recipe:
          setup: ["Site with SEG A (members E1, E2) and SEG B (member E3)"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters A", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "line A" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { segA: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters B", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "line B" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { segB: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Two", external_ref: "E2", job_title: "Painter" }, as: FirmAdmin, captures: { e2: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Three", external_ref: "E3", job_title: "Painter" }, as: FirmAdmin, captures: { e3: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${segA}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { m1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${segA}", employee_id: "${e2}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${segB}", employee_id: "${e3}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
          trigger:
            - { call: "POST /ih/seg-memberships/${m1}/transfer", payload: { target_seg_id: "${segB}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
          assert:
            - "SimilarExposureGroup.${segA}.headcount == 1 (was 2)"
            - "SimilarExposureGroup.${segB}.headcount == 2 (was 1)"
            - "Site-wide total headcount 1 + 2 == 3 unchanged (conserved)"
            - "SEGMembership.${m1}.seg_id == ${segB}"
