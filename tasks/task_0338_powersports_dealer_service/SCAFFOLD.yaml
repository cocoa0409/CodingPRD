# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Unit
    field: status
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED]
    transitions:
      - from: IN_TRANSIT
        to: IN_STOCK
        trigger: "POST /units/{id}/receive"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "If acquisition_kind == NEW_FLOORED and floor_plan_loan_id is null, no auto floor plan; floor plan is opened separately via POST /floor-plan-loans"

      - from: IN_STOCK
        to: ON_HOLD
        trigger: "system (Deal moves DRAFT->QUOTED referencing this unit)"
        actor: system
        preconditions:
          - "Unit.status == IN_STOCK (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "held_by_deal_id := the quoting Deal.id"

      - from: ON_HOLD
        to: IN_STOCK
        trigger: "system (Deal declined or cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "held_by_deal_id := null"

      - from: ON_HOLD
        to: SOLD
        trigger: "system (Deal moves to APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SOLD
        to: DELIVERED
        trigger: "system (Deal moves to DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "If floor_plan_loan_id set: a SALE_PAYOFF Curtailment for the full principal_outstanding_cents is POSTED on that loan, driving the loan to PAID_OFF (cascade hop 2)"

  # ---------------------------------------------------------------------------
  - entity: FloorPlanLoan
    field: status
    initial_state: OPEN
    terminal_states: [PAID_OFF]
    transitions:
      - from: OPEN
        to: CURTAILMENT_DUE
        trigger: "POST /floor-plan-loans/{id}/run-aging"
        actor: DealerPrincipal
        preconditions:
          - "Days since opened_on (per current clock) >= CURTAILMENT_DUE_DAYS (90) (else stays OPEN)"
        side_effects: []
        note: "Boundary: due at exactly 90 days (>=), not 91."

      - from: CURTAILMENT_DUE
        to: OPEN
        trigger: "POST /curtailments (reason SCHEDULED meeting the required minimum)"
        actor: DealerPrincipal
        preconditions:
          - "principal_cents >= required scheduled curtailment (CURTAILMENT_PCT_BPS of original_advance_cents) (else ERR_CURTAILMENT_INSUFFICIENT)"
        side_effects:
          - "principal_outstanding_cents reduced; cumulative_curtailment_cents increased"

      - from: [OPEN, CURTAILMENT_DUE]
        to: PAID_OFF
        trigger: "POST /curtailments (reason SALE_PAYOFF, principal == principal_outstanding_cents) OR system cascade from Unit DELIVERED"
        actor: DealerPrincipal | system
        preconditions:
          - "principal_cents == principal_outstanding_cents (else ERR_PAYOFF_NOT_FULL)"
        side_effects:
          - "principal_outstanding_cents := 0; loan terminal"

  # ---------------------------------------------------------------------------
  - entity: TradeIn
    field: status
    initial_state: APPRAISED
    terminal_states: [TITLED, REJECTED]
    transitions:
      - from: APPRAISED
        to: ACCEPTED
        trigger: "system (Deal referencing this trade moves to APPROVED)"
        actor: system
        preconditions:
          - "TradeIn.status == APPRAISED (else ERR_TRADE_NOT_APPRAISED)"
        side_effects: []

      - from: APPRAISED
        to: REJECTED
        trigger: "POST /trade-ins/{id}/reject"
        actor: SalesManager
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: TITLED
        trigger: "system (Deal referencing this trade moves to DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Mint a new Unit (acquisition_kind=TRADE_IN, status=IN_STOCK, dealer_cost_cents := appraised_value_cents) (cascade hop 2)"
          - "resulting_unit_id := minted Unit.id"

  # ---------------------------------------------------------------------------
  - entity: Deal
    field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /deals/{id}/quote"
        actor: SalesManager
        preconditions:
          - "Referenced Unit.status == IN_STOCK (else ERR_UNIT_NOT_AVAILABLE)"
          - "If trade_in_id set, TradeIn.status == APPRAISED (else ERR_TRADE_NOT_APPRAISED)"
        side_effects:
          - "Unit IN_STOCK -> ON_HOLD; Unit.held_by_deal_id := this Deal.id"
          - "out_the_door_cents, trade_allowance_cents, amount_financed_cents computed with PROVISIONAL variant (uses TradeIn.estimated_payoff_cents)"

      - from: QUOTED
        to: FINANCE_SUBMITTED
        trigger: "POST /deals/{id}/submit-finance"
        actor: FinanceManager
        preconditions: []
        side_effects: []

      - from: FINANCE_SUBMITTED
        to: APPROVED
        trigger: "POST /deals/{id}/approve"
        actor: FinanceManager
        preconditions:
          - "Referenced Unit.status == ON_HOLD held_by_deal_id == this Deal.id (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "trade_allowance_cents, out_the_door_cents, amount_financed_cents ALL recomputed with FINAL variant (uses Deal.approved_lender_payoff_cents); the final payoff changes trade equity, which flows through the trade tax credit into OTD and then into the financed amount"
          - "Unit ON_HOLD -> SOLD"
          - "If trade_in_id set: TradeIn APPRAISED -> ACCEPTED (cascade hop 1)"

      - from: FINANCE_SUBMITTED
        to: DECLINED
        trigger: "POST /deals/{id}/decline"
        actor: FinanceManager
        preconditions: []
        side_effects:
          - "Unit ON_HOLD -> IN_STOCK; Unit.held_by_deal_id := null"

      - from: DECLINED
        to: QUOTED
        trigger: "POST /deals/{id}/quote"
        actor: SalesManager
        preconditions:
          - "Referenced Unit.status == IN_STOCK (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "Unit IN_STOCK -> ON_HOLD; Unit.held_by_deal_id := this Deal.id"
          - "out_the_door_cents, amount_financed_cents recomputed with PROVISIONAL variant"
        note: "Re-quote loop: DECLINED -> QUOTED makes the Deal state machine cyclic."

      - from: APPROVED
        to: DELIVERED
        trigger: "POST /deals/{id}/deliver"
        actor: SalesManager
        preconditions:
          - "Unit.status == SOLD (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "Unit SOLD -> DELIVERED (cascade hop 1)"
          - "If Unit.floor_plan_loan_id set: SALE_PAYOFF Curtailment POSTED for full principal_outstanding_cents; FloorPlanLoan -> PAID_OFF (cascade hop 2 -> hop 3)"
          - "If trade_in_id set: TradeIn ACCEPTED -> TITLED; new trade Unit minted IN_STOCK (cascade hop 2 from TradeIn delivery path)"

      - from: [DRAFT, QUOTED]
        to: CANCELLED
        trigger: "POST /deals/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "If Unit.held_by_deal_id == this Deal.id: Unit ON_HOLD -> IN_STOCK; held_by_deal_id := null"

  # ---------------------------------------------------------------------------
  - entity: RepairOrder
    field: work_status
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/start"
        actor: ServiceAdvisor
        preconditions:
          - "At least one ServiceLine exists on this RO (else ERR_NO_SERVICE_LINES)"
        side_effects: []

      - from: IN_PROGRESS
        to: WORK_COMPLETE
        trigger: "POST /repair-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions: []
        side_effects:
          - "labor_total_cents, shop_supplies_cents, parts_total_cents, ro_total_cents finalized"
          - "All RESERVED PartLines -> CONSUMED; each Part: reserved_qty -= qty, consumed_qty += qty (inventory conservation)"

      - from: [OPEN, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "billing_status == UNBILLED (else ERR_RO_ALREADY_BILLED)"
        side_effects:
          - "All RESERVED PartLines -> RELEASED; each Part: reserved_qty -= qty (inventory restored)"

  # ---------------------------------------------------------------------------
  - entity: RepairOrder
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [VOID]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /repair-orders/{id}/invoice"
        actor: ServiceAdvisor
        preconditions:
          - "work_status == WORK_COMPLETE (else ERR_WORK_NOT_COMPLETE)"
          - "If not is_warranty: ro_total_cents <= authorized_amount_cents OR caller is DealerPrincipal (else ERR_OVER_AUTHORIZATION)"
        side_effects: []
        note: "Billing dimension evolves independently of work dimension; INVOICED requires the WORK_COMPLETE work-state but the two are separate fields."

      - from: INVOICED
        to: PAID
        trigger: "POST /repair-orders/{id}/pay"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: []

      - from: UNBILLED
        to: VOID
        trigger: "system (work_status -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Part
    field: availability (derived; no explicit status field — conservation invariant)
    initial_state: STOCKED
    terminal_states: []
    transitions:
      - from: STOCKED
        to: STOCKED
        trigger: "system (PartLine reserve / consume / release)"
        actor: system
        preconditions:
          - "On reserve: available_qty >= requested quantity (else ERR_PART_INSUFFICIENT_STOCK)"
        side_effects:
          - "Maintains on_hand_qty == available_qty + reserved_qty + consumed_qty at all times"
        note: "Part has no lifecycle status; this row documents the conservation invariant the PartLine transitions enforce."

  # ---------------------------------------------------------------------------
  - entity: PartLine
    field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system (parent RepairOrder work_status -> WORK_COMPLETE)"
        actor: system
        preconditions: []
        side_effects:
          - "Part.reserved_qty -= quantity; Part.consumed_qty += quantity"

      - from: RESERVED
        to: RELEASED
        trigger: "system (parent RepairOrder cancelled) OR DELETE /part-lines/{id}"
        actor: system | PartsClerk
        preconditions:
          - "Parent RO billing_status == UNBILLED (else ERR_RO_ALREADY_BILLED)"
        side_effects:
          - "Part.reserved_qty -= quantity; Part.available_qty += quantity (inventory restored)"

  # ---------------------------------------------------------------------------
  - entity: StorageAgreement
    field: status
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /storage-agreements/{id}/check-in"
        actor: ServiceAdvisor
        preconditions:
          - "No other StorageAgreement in CHECKED_IN occupies the same storage_bay_id with an overlapping [period_start, period_end) (else ERR_BAY_DOUBLE_BOOKED)"
        side_effects:
          - "If includes_winterization: mint a prep RepairOrder (work_status=OPEN, is_warranty=false) for this unit; prep_repair_order_id := minted RO.id"

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /storage-agreements/{id}/check-out"
        actor: ServiceAdvisor
        preconditions:
          - "If prep_repair_order_id set, that RO.work_status IN {WORK_COMPLETE, CANCELLED} (else ERR_PREP_RO_OPEN)"
        side_effects:
          - "storage_fee_cents finalized"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /storage-agreements/{id}/cancel"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: TestRideWaiver
    field: status
    initial_state: SIGNED
    terminal_states: [RIDE_LOGGED, EXPIRED, VOID]
    transitions:
      - from: SIGNED
        to: RIDE_LOGGED
        trigger: "POST /test-ride-waivers/{id}/log-ride"
        actor: SalesManager
        preconditions:
          - "Current clock < valid_until (else ERR_WAIVER_EXPIRED)"
          - "Referenced Unit.status IN {IN_STOCK, ON_HOLD} (else ERR_UNIT_NOT_RIDEABLE)"
        side_effects: []

      - from: SIGNED
        to: EXPIRED
        trigger: "POST /test-ride-waivers/{id}/log-ride when current clock >= valid_until"
        actor: SalesManager
        preconditions:
          - "Current clock >= valid_until"
        side_effects: []
        note: "Reaching valid_until on a log-ride attempt records EXPIRED and rejects the ride (ERR_WAIVER_EXPIRED)."

      - from: SIGNED
        to: VOID
        trigger: "POST /test-ride-waivers/{id}/void"
        actor: SalesManager
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: WarrantyClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: DealerPrincipal
        preconditions:
          - "Referenced Unit.status == DELIVERED (else ERR_UNIT_NOT_DELIVERED)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: DealerPrincipal
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /warranty-claims/{id}/pay"
        actor: DealerPrincipal
        preconditions: []
        side_effects:
          - "If repair_order_id set and that RO.billing_status == UNBILLED and RO.work_status == WORK_COMPLETE: RO billing_status UNBILLED -> PAID (warranty pays the RO)"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: curtailment-create-stale-loan
    parent_entity: FloorPlanLoan
    write_endpoint: "POST /curtailments"
    occ_field: "expected_floor_plan_loan_version"
    description: |
      Posting a Curtailment against a FloorPlanLoan whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has already posted a curtailment that reduced the
      principal (legitimately changing the basis for this paydown), so the
      current writer's view of the loan principal is stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

  - rule_id: part-line-create-stale-part
    parent_entity: Part
    write_endpoint: "POST /part-lines"
    occ_field: "expected_part_version"
    description: |
      Reserving a PartLine against a Part whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has already reserved (or restocked) the part, so the current
      writer's view of available_qty is stale and the reservation must be
      re-validated against the new availability.
    error_id: ERR_STALE_PART_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  # ----- RULE 1 instance A (dual-variant on Deal) -----
  - name: deal_amount_financed
    trigger: "Deal DRAFT->QUOTED (provisional), Deal FINANCE_SUBMITTED->APPROVED (final)"
    algorithm: forward_looking
    formula: |
      trade_allowance = deal_trade_equity (see calc; uses the variant's payoff input)
      amount_financed = out_the_door_cents - down_payment_cents - max(trade_allowance, 0)
      amount_financed = max(amount_financed, 0)
    input_set: "Single Deal plus its referenced TradeIn (if any)"
    precision: "integer cents; no rounding (all inputs are integer cents)"
    variants:
      - name: provisional
        when: "computed at DRAFT->QUOTED and DECLINED->QUOTED"
        difference: "trade_allowance uses TradeIn.estimated_payoff_cents as the lien payoff"
      - name: final
        when: "computed at FINANCE_SUBMITTED->APPROVED"
        difference: "trade_allowance uses Deal.approved_lender_payoff_cents as the lien payoff; identical inputs but a different payoff number yields a different financed amount"

  # ----- supporting: trade equity (variant-parameterized) -----
  - name: deal_trade_equity
    trigger: "Deal quote (provisional) and Deal approve (final)"
    algorithm: aggregation
    formula: |
      payoff = (variant == final) ? Deal.approved_lender_payoff_cents
                                  : TradeIn.estimated_payoff_cents
      trade_allowance_cents = TradeIn.appraised_value_cents - payoff
      # may be negative (negative equity rolled into financing)
    input_set: "One TradeIn referenced by the Deal; if trade_in_id is null, trade_allowance_cents := 0"
    precision: "integer cents"

  # ----- RULE 2 instance B (nested rounding ORDER on Deal OTD — two taxable lines) -----
  - name: deal_out_the_door
    trigger: "Deal DRAFT->QUOTED and DECLINED->QUOTED (provisional trade allowance); recomputed at Deal FINANCE_SUBMITTED->APPROVED (final trade allowance)"
    algorithm: aggregation
    formula: |
      # TWO independently taxable lines: (1) the unit sale net of trade allowance,
      # (2) the freight & setup charge. The doc fee is NOT taxable.
      taxable_sale_cents    = max(sale_price_cents - max(trade_allowance_cents, 0), 0)
      taxable_freight_cents = freight_setup_cents
      # ROUNDING ORDER IS PINNED: round EACH tax line to whole cents FIRST, THEN sum.
      # (round_per_line, NOT round-once-on-the-summed-tax). This produces a different
      # cent total than summing the two fractional taxes and rounding once.
      tax_sale_cents    = round_half_up(taxable_sale_cents    * tax_rate_bps / 10000)
      tax_freight_cents = round_half_up(taxable_freight_cents * tax_rate_bps / 10000)
      out_the_door_cents = sale_price_cents + freight_setup_cents
                           + tax_sale_cents + tax_freight_cents + doc_fee_cents
    input_set: "Single Deal; trade_allowance_cents from deal_trade_equity (provisional variant at quote)"
    constants:
      ROUNDING: "round_half_up, per-line (each tax line rounded before summation)"
    precision: "integer cents, round_half_up, per-line before summation"
    note: |
      Rounding-order mode (b): rounding each of the two tax lines then summing
      diverges from summing the two fractional taxes into one number and rounding
      once. The scaffold PINS per-line rounding. (Worked example: sale 1234550,
      freight 4575, tax 825 bps, doc 39900, no trade -> per-line 1381252 vs
      round-once 1381253.)

  # ----- RULE 2 instance A (non-linear >=3 inputs, branches+tier+cap on RO) -----
  - name: ro_labor_total
    trigger: "RepairOrder IN_PROGRESS->WORK_COMPLETE (finalize)"
    algorithm: tiered_pricing
    formula: |
      total_flat_hours = sum(ServiceLine.flat_rate_hours for all lines on the RO)
      # Tiered effective labor rate by total flat hours on the RO:
      if total_flat_hours <= TIER1_HOURS:        rate = BASE_LABOR_RATE_CENTS
      elif total_flat_hours <= TIER2_HOURS:      rate = BASE_LABOR_RATE_CENTS - TIER2_DISCOUNT_CENTS
      else:                                      rate = BASE_LABOR_RATE_CENTS - TIER3_DISCOUNT_CENTS
      # Warranty branch overrides retail rate with the manufacturer reimbursement rate:
      if is_warranty: rate = WARRANTY_LABOR_RATE_CENTS
      # Per-line extended labor rounded to whole cents, THEN summed (order pinned):
      labor_total = sum( round_half_up(line.flat_rate_hours * rate) for each ServiceLine )
      # Shop supplies = SHOP_SUPPLY_BPS of labor_total, capped, waived for warranty:
      shop_supplies = is_warranty ? 0 : min( round_half_up(labor_total * SHOP_SUPPLY_BPS / 10000), SHOP_SUPPLY_CAP_CENTS )
    input_set: "All ServiceLines on the RO (no status filter; lines are immutable once created)"
    constants:
      BASE_LABOR_RATE_CENTS: 12500      # $125.00/hr retail
      TIER1_HOURS: 2.0
      TIER2_HOURS: 6.0
      TIER2_DISCOUNT_CENTS: 1000        # $10 off/hr for 2 < hrs <= 6
      TIER3_DISCOUNT_CENTS: 2500        # $25 off/hr for hrs > 6
      WARRANTY_LABOR_RATE_CENTS: 9000   # $90.00/hr manufacturer reimbursement
      SHOP_SUPPLY_BPS: 800              # 8% of labor
      SHOP_SUPPLY_CAP_CENTS: 5000       # $50 cap
    precision: "integer cents, round_half_up, per-line before summation"
    note: "Mode (a): >=3 inputs (hours, warranty flag, tier) with nested branch + tier + min-cap."

  # ----- RULE 1 instance B (dual-variant on FloorPlanLoan interest) -----
  - name: floor_plan_interest
    trigger: "GET /floor-plan-loans/{id} (read), POST /floor-plan-loans/{id}/run-aging"
    algorithm: chronological
    formula: |
      days = floor( (current_clock - opened_on) / 86400 seconds )
      per_diem_simple = round_half_up(original_advance_cents * apr_bps / 10000 / 365)
      # SIMPLE variant: per-diem on the ORIGINAL advance for the whole elapsed period.
      simple_interest = per_diem_simple * days
      # DECLINING variant: walk POSTED curtailments in created_at ASC order; between
      # each curtailment boundary accrue per-diem on the principal_outstanding in that
      # segment. Ties in created_at broken by created_at then by lower principal_cents.
      declining_interest = sum over segments( segment_days * round_half_up(segment_principal * apr_bps / 10000 / 365) )
    input_set: "One FloorPlanLoan and all its Curtailments (all are POSTED; ordered by created_at ASC for the segment walk)"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up at per-diem, then multiply"
    variants:
      - name: simple
        when: "accrued_interest_cents default presentation and aging check"
        difference: "per-diem on original_advance_cents for full elapsed days; ignores curtailments"
      - name: declining
        when: "requested via GET /floor-plan-loans/{id}?interest_basis=DECLINING"
        difference: "per-diem recomputed on principal_outstanding within each inter-curtailment segment; identical loan+payments yield a smaller number than simple"

  # ----- storage fee -----
  - name: storage_fee
    trigger: "StorageAgreement CHECKED_IN->CHECKED_OUT (finalize)"
    algorithm: aggregation
    formula: |
      span_days = ceil( (period_end - period_start) / 86400 seconds )
      months = ceil(span_days / 30)           # partial month rounds up
      base = months * monthly_rate_cents
      storage_fee_cents = includes_winterization ? base + WINTERIZATION_FEE_CENTS : base
    input_set: "Single StorageAgreement"
    constants:
      WINTERIZATION_FEE_CENTS: 14900
    precision: "integer cents"

  # ----- warranty claim amount -----
  - name: warranty_claim_amount
    trigger: "POST /warranty-claims (create), recomputed on POST /warranty-claims/{id}/approve"
    algorithm: aggregation
    formula: |
      if kind == RECALL:
        # Recall pays only labor at the warranty reimbursement rate; the RO must be warranty.
        claim_amount_cents = repair_order_id ? RepairOrder.labor_total_cents : 0
      else: # WARRANTY
        claim_amount_cents = repair_order_id ? (RepairOrder.labor_total_cents + RepairOrder.parts_total_cents) : 0
    input_set: "One referenced RepairOrder (must be is_warranty==true); else 0"
    precision: "integer cents"

  # ----- floor plan curtailment requirement (threshold) -----
  - name: required_scheduled_curtailment
    trigger: "validation on POST /curtailments with reason SCHEDULED"
    algorithm: threshold
    formula: |
      required = round_half_up(FloorPlanLoan.original_advance_cents * CURTAILMENT_PCT_BPS / 10000)
      # A SCHEDULED curtailment must satisfy principal_cents >= required.
    constants:
      CURTAILMENT_PCT_BPS: 1000        # 10% of original advance
      CURTAILMENT_DUE_DAYS: 90
    precision: "integer cents, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-body resource ids exist (validated left-to-right: path id first, then body FKs in declared order)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_TRADE_IN_NOT_FOUND | ERR_FLOOR_PLAN_LOAN_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_STORAGE_AGREEMENT_NOT_FOUND | ERR_STORAGE_BAY_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body resource references

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers within field constraints (e.g., VIN length 17, quantity > 0, flat_rate_hours > 0, end > start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "Uniqueness: Unit.vin unique; Part.sku unique; Customer.email unique; StorageBay.label unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /units, POST /parts, POST /customers, POST /storage-bays"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version (when supplied/required) equals current parent.version"
    error_id: "ERR_STALE_LOAN_VERSION | ERR_STALE_PART_VERSION"
    http_status: 412
    applies_to: "POST /curtailments, POST /part-lines"

  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition (state-machine from-state check)"
    error_id: "ERR_INVALID_STATE | ERR_WORK_NOT_COMPLETE | ERR_RO_ALREADY_BILLED | ERR_NO_SERVICE_LINES | ERR_TRADE_NOT_APPRAISED | ERR_PREP_RO_OPEN | ERR_WAIVER_EXPIRED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Cross-entity precondition: referenced sibling entity in required state (e.g., Deal approve requires Unit ON_HOLD held by this deal; warranty claim approve requires Unit DELIVERED; test ride requires Unit IN_STOCK/ON_HOLD)"
    error_id: "ERR_UNIT_NOT_AVAILABLE | ERR_UNIT_NOT_DELIVERED | ERR_UNIT_NOT_RIDEABLE"
    http_status: 409
    applies_to: "POST /deals/{id}/approve, POST /deals/{id}/deliver, POST /warranty-claims/{id}/approve, POST /test-ride-waivers/{id}/log-ride"

  - priority: 9
    category: business_safety
    check: "Test ride requires a SIGNED, unexpired TestRideWaiver for this (customer, unit); a ride may not be logged without one"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 403
    applies_to: "POST /test-ride-waivers/{id}/log-ride"

  - priority: 10
    category: business_temporal
    check: "Resource temporal-overlap: storage bay [start,end) half-open non-overlap; technician appointment closed interval plus cleanup buffer gap"
    error_id: "ERR_BAY_DOUBLE_BOOKED | ERR_TECH_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "POST /storage-agreements/{id}/check-in, POST /repair-orders"

  - priority: 11
    category: business_constraint
    check: "Floor-plan curtailment sufficiency: SCHEDULED curtailment principal >= required (10% of original advance); SALE_PAYOFF principal == principal_outstanding"
    error_id: "ERR_CURTAILMENT_INSUFFICIENT | ERR_PAYOFF_NOT_FULL"
    http_status: 422
    applies_to: "POST /curtailments"

  - priority: 12
    category: business_constraint
    check: "Part reservation: requested quantity <= Part.available_qty"
    error_id: ERR_PART_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /part-lines"

  - priority: 13
    category: business_fiscal
    check: "RO non-warranty invoice ro_total_cents must not exceed authorized_amount_cents unless the caller is DealerPrincipal (override)"
    error_id: ERR_OVER_AUTHORIZATION
    http_status: 402
    applies_to: "POST /repair-orders/{id}/invoice"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Test-driving clock ----------------
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving; aging, waiver expiry, interest accrual read it)"
    roles: [DealerPrincipal]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock := to_iso8601"]

  # ---------------- Customer ----------------
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [SalesManager, ServiceAdvisor]
    code: 201
    input: [full_name, email, phone]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
