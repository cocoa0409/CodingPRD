              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}", cadence_days: 28 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
            - call: "POST /api/weight-logs"
              payload: { pet_id: "${pet}", weight_kg: 24.0, effective_date: "2026-01-01T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
            - call: "GET /api/subscriptions/${sub}"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v_now: $.data.version }
            - call: "POST /api/subscriptions/${sub}/resize"
              payload: { expected_subscription_version: "${v_now}", effective_at: "2026-01-15T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pending: $.data.pending_resize_grams_per_day }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /api/subscriptions/${sub}"
              payload: {}
              as: BillingAdmin
              captures: { v_gen: $.data.version }
          trigger:
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v_gen}" }
              as: BillingAdmin
              captures: { ord: $.data.food_grams }
          assert:
            - "Subscription.${sub}.pending_resize_grams_per_day == 456 before realization (24kg dct 911 / kcal 2.0)"
            - "the generated order food_grams == 12768 (456 * 28) after the resize is realized at clock 2026-01-20"

      - name: dual_variant_cycle_price_estimate_vs_actual
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cycle_price
        excluded_because:
          difficulty_instance: dual_variant_calc / cycle_price_estimate_vs_actual_snapshot_diverge_on_weight_change
          rationale: "Estimate vs actual divergence is the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Order.CHARGING_to_PAID
          - entities.Account.fields.wallet_credit_cents
        excluded_because:
          difficulty_instance: transitive_cascade / paid_first_order_grants_referral_credit_updates_both_accounts_depth2
          rationale: "Immediate visibility of the referral-grant cascade in the same request is asserted by the named §1.8 depth-2 cascade instance."
