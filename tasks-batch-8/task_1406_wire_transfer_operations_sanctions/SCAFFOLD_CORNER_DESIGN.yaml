            - { call: "POST /wire-ops/wires/${s9_w}/resubmit", payload: {}, as: RepairSpecialist, as_user_id: "rs-1" }
            - { call: "GET /wire-ops/wires/${s9_w}", as: WireOperator, captures: { s9_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${s9_w}/repair", payload: { expected_wire_version: "${s9_v2}", purpose: "fix two" }, as: RepairSpecialist, as_user_id: "rs-1", captures: { s9_att2: $.data.repair_attempts } }
            - { call: "POST /wire-ops/wires/${s9_w}/resubmit", payload: {}, as: RepairSpecialist, as_user_id: "rs-1" }
