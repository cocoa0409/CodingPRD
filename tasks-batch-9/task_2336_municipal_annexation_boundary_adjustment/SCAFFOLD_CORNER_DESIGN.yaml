      - name: consent_shares_summing_to_exactly_one_hundred_certify_at_the_threshold
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=80]
          - validations[priority=86]
          - calculations.petition_sufficiency
        distinguishing_aspect: |
          The two petition constraints are inclusive at both of their boundaries in the same
          request sequence: two owners signing 60.00% and 40.00% of one 50,000,000-cent parcel sum
          to exactly 100 and are both accepted, and the resulting 50,000,000 of a 100,000,000-cent
          territory is exactly the 50.00 signature threshold, so certification passes with
          SUFFICIENT instead of ERR_PETITION_INSUFFICIENT.
        test_recipe:
          setup:
            - "A TERRITORY_CERTIFIED PETITION_MAJORITY case whose territory is two 50,000,000-cent parcels owned by OW1 and OW2, with a CIRCULATING petition and no consents yet."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_v7: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_v7}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_v7: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_v7a: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Olsen", contact_email: "ben@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_v7b: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v7}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v7}"
              captures: { case_v7: $.data.id }
            - call: "POST /annexation-cases/${case_v7}/parcels"
              payload: { primary_owner_id: "${ow_v7a}", parcel_apn: "V7-1", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_v7}"
              captures: { parcel_v7a: $.data.id }
            - call: "POST /annexation-cases/${case_v7}/parcels"
              payload: { primary_owner_id: "${ow_v7b}", parcel_apn: "V7-2", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_v7}"
            - call: "POST /annexation-cases/${case_v7}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v7}"
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_v7}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_v7}"
              captures: { pet_v7: $.data.id }
          trigger:
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v7}", parcel_id: "${parcel_v7a}", property_owner_id: "${ow_v7a}", ownership_share_pct: 60.00 }
              as: PropertyOwner
