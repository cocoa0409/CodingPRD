  # ==================================================================
  - section: endpoints
    instances:
      - name: clock_default_and_set
        claim_type: action_endpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Logical clock starts at exactly 2026-08-01T00:00:00Z before any set; set_current_utc returns the new value and drives deadline math deterministically."
        test_recipe:
          setup: ["empty DB; incident created against the DEFAULT clock position"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EP1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
