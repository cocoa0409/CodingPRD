              payload: {}
              as: TransactionCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEAL_INVALID_STATE (priority 8 beats priority 15)"
            - "no Settlement is created; GET /brokerage/settlements?deal_id=${deal_id} returns an empty list"

      - name: deal_create_temporal_error_beats_fiscal_error
        grounds:
          - validations[priority=10]
          - validations[priority=17]
          - errors[ERR_DEAL_BEFORE_JOIN]
          - errors[ERR_NONPOSITIVE_GROSS]
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): create a deal
          whose closing_date precedes joined_at AND whose gross is 0 — both
          fail; the temporal error ERR_DEAL_BEFORE_JOIN (priority 10) wins over
          ERR_NONPOSITIVE_GROSS (priority 17).
