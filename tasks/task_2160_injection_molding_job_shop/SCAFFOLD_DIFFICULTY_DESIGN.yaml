      - name: mold_closed_window_rejects_touching_endpoints
        grounds:
          - calculations.mold_window_overlap
          - errors[ERR_MOLD_WINDOW_CONFLICT]
          - validations[priority=17]
          - state_machines.Mold.SERVICEABLE_to_IN_MAINTENANCE
