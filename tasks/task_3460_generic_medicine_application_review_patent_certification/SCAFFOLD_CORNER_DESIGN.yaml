              as: ApplicantSponsor
              as_user_id: "${ac_a}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "ownexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
              captures: { v_seen_by_b: $.data.version }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MINOR", contains_new_be_data: false, expected_application_version: "${v_seen_by_b}" }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and data.error_id == ERR_NOT_RESOURCE_OWNER (priority 3 fires before the OCC check at priority 6)"

      - name: innovator_can_list_patent_only_for_owned_product
        claim_type: Denied Operation
        grounds:
          - validations[priority=3]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.InnovatorSponsor
        distinguishing_aspect: "The opaque InnovatorSponsor id is bound to the product at registration: patent_owner_user_id innovator-ops-1 accepts the listing while innovator-ops-999 is rejected, proving ownership is pinned to the stored field, not the role alone."
        test_recipe:
          setup:
            - "Logical clock at default. One reference product with patent_owner_user_id innovator-ops-1."
          setup_api_calls:
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Guarded", active_ingredient: "guardedol", strength: "52 mg", dosage_form: "TABLET", rld_approval_date: "2000-01-01", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-1" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US1717001", patent_type: "DRUG_SUBSTANCE", expiry_date: "2030-01-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-999"
              captures: { err: $.data.error_id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US1717001", patent_type: "DRUG_SUBSTANCE", expiry_date: "2030-01-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-1"
              captures: { pat_id: $.data.id }
          assert:
            - "as innovator-ops-999: 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "as innovator-ops-1 (the stored patent_owner_user_id): 201 and the patent is LISTED"

