            payload: { termination_reason: "VOLUNTARY" }
            as: ComplianceOfficer
            captures: { t_status: "$.data.status" }
          - call: "POST /direct-selling/consultants/${cons_a_id}/reinstate"
            payload: { reinstatement_note: "wants back in" }
            as: ComplianceOfficer
            captures: { e_claw: "$.data.error_id" }
          assert:
            - "paid_total == 3400 before the reversal"
            - "rv_status == REVERSED with rv_total == 3400 and rv_at == 2026-08-01T00:00:00Z"
            - "c_claw == 3400, c_hold == true and c_life == 0: the reversal moves the whole paid amount into clawback_balance_cents and unwinds the lifetime ledger"
            - "s_status == VOIDED (the statement is not deleted, it is voided)"
            - "t_status == TERMINATED: termination is allowed now because the blocking run is REVERSED, not APPROVED"
            - "e_claw == ERR_CLAWBACK_OUTSTANDING with HTTP 422 (priority 55, business_fiscal) because clawback_balance_cents is 3400 rather than 0, and it fires ahead of the priority-56 open-case guard which A does not trip"
            - "A remains TERMINATED with reinstatement_count 0"

