            - "Admission.${adm_id}.status == PENDING (unchanged)"

      - name: caregiver_cannot_create_rate_schedule
        claim_type: role_exclusive_operation_denied
        grounds:
          - roles[Provider]
          - roles[CaregiverRole]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Rate-schedule publishing is Provider-exclusive: an entity_backed CaregiverRole caller (valid Caregiver id) is rejected 403 with a fully well-formed payload."
        test_recipe:
          setup:
            - "One home with one ACTIVE caregiver"
