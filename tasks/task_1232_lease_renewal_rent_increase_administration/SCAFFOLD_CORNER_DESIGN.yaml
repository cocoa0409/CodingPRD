        excluded_because:
          difficulty_instance: lease_renewal_cycle_status_loops
          rationale: "The decline-revert arc (RENEWAL_PENDING -> ACTIVE) is asserted mid-chain in the named difficulty instance via s_active1 == ACTIVE."

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: effective_cap_ceiling_binds
        claim_type: constants_applied
        grounds: [calculations.effective_cap_bps]
        distinguishing_aspect: "base 400 + cpi 700 = 1100 exceeds hard_ceiling 900 -> effective_cap_bps == 900 (the min() clamp binds on the ceiling, not the sum)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "WA-SEA", base_cap_bps: 400, cpi_adjustment_bps: 700, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 30, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { cap: $.data.effective_cap_bps }
          assert:
            - "cap == 900 (ceiling binds; NOT 1100)"

      - name: term_discount_capped_at_180
        claim_type: constants_applied
        grounds: [calculations.proposed_rent_cents]
        distinguishing_aspect: "Term 36 (band [36,36]) would earn (36-12)*10 = 240 bps discount, but MAX_TERM_DISCOUNT_BPS 180 binds: 600 - 180 = 420 bps -> proposed round_half_up(200000*1.042) = 208400."
        test_recipe:
          setup: ["policy CA-OAK; property band [36,36]; unit market 220000; lease rent 200000, 2026-06-01 + 12mo"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Long Band Court", rent_cap_policy_id: "${pol}", min_term_months: 36, max_term_months: 36 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "301", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Lon Gterm", email: "lon.gterm@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { proposed: $.data.proposed_rent_cents, term: $.data.offered_term_months, incr: $.data.proposed_increase_bps }
          assert:
            - "term == 36 and incr == 420 (discount clamped at 180, not 240)"
            - "proposed == 208400"

      - name: staggering_selector_prefers_emptiest_month
        claim_type: correct_result
        grounds: [calculations.staggered_term_selection, entities.RenewalOffer.fields.offered_term_months]
        distinguishing_aspect: "Selector determinism: with blocker leases loading months 2029-06 (term 24) and 2028-12 (term 18), the selector picks term 23 (projected 2029-05, load 0) — the minimum-load month with the longest-term tie-break, excluding the subject lease itself from load."
        test_recipe:
          setup:
            - "policy CA-OAK; property band [6,24]; three units, three residents"
            - "subject lease Ls on unit 1: 2026-06-01 + 12mo -> end 2027-06-01, rent 200000"
            - "blocker B1 on unit 2: 2026-06-01 + 36mo -> end 2029-06-01 (loads candidate term 24); blocker B2 on unit 3: 2026-06-01 + 30mo -> end 2028-12-01 (loads candidate term 18)"
            - "all other candidate terms land in zero-load months; tie among them broken by term_months DESC -> 23"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Stagger Court", rent_cap_policy_id: "${pol}", min_term_months: 6, max_term_months: 24 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "S1", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "S2", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "S3", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u3: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "St Agger", email: "st.agger@x.com" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Blo Cker1", email: "blo.cker1@x.com" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Blo Cker2", email: "blo.cker2@x.com" }
              as: PlatformAdmin
              captures: { r3: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${u1}", resident_id: "${r1}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { ls: $.data.id, ls_v: $.data.version }
            - call: "POST /leases"
              payload: { unit_id: "${u2}", resident_id: "${r2}", term_start_date: "2026-06-01", term_months: 36, monthly_rent_cents: 200000 }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${u3}", resident_id: "${r3}", term_start_date: "2026-06-01", term_months: 30, monthly_rent_cents: 200000 }
              as: PropertyManager
          trigger:
            - call: "POST /leases/${ls}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${ls_v}" }
              as: LeasingAgent
              captures: { term: $.data.offered_term_months }
          assert:
            - "term == 23 (loads: t=24 -> 2029-06 has 1, t=18 -> 2028-12 has 1, all others 0; longest-term tie-break picks 23)"

      - name: staggering_tie_break_longest_term
        claim_type: correct_result
        grounds: [calculations.staggered_term_selection]
        distinguishing_aspect: "With zero competing load anywhere, every candidate ties at load 0 and the longest-term tie-break selects max_term_months 24 — proving the deterministic tie-break, not an arbitrary or random choice."
        test_recipe:
          setup: ["policy CA-OAK; property band [6,24]; single lease on the only unit, end 2027-06-01 (its own term_end excluded from load)"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
