          - errors.ERR_NOTICE_PERIOD_TOO_SHORT
        distinguishing_aspect: |
          The second publish-notice violates the business_constraint at priority 41
          (study A occupies the window [2026-01-15, 2026-02-14) and the clock is inside it)
          AND the temporal rule at priority 42 (notice_days 7 < notice_min_days 14). The
          required answer is the 409 ERR_NOTICE_WINDOW_OVERLAP; the 422
          ERR_NOTICE_PERIOD_TOO_SHORT is the wrong one, so the cheap field check must not
          run first.
