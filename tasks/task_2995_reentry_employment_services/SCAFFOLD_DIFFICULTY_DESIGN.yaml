# Scaffold Difficulty Design (SKILL.md §1.8) for task_2995_reentry_employment_services
# Nine §0.5 difficulty rules; every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: projected_vs_actual_wage_subsidy_diverge_on_same_shift_set
    grounds:
    - calculations.wage_subsidy_total
    - calculations.grant_ledger
    - state_machines.WorkShift_status.SCHEDULED_to_WORKED
    - entities.Placement.fields.projected_subsidy_cents
    - entities.Placement.fields.actual_subsidy_cents
    - concurrency_rules[placement-create-stale-job-opening]
    distinguishing_aspect: The two variants of calculations.wage_subsidy_total are computed over the WorkShift entity
      domain (shift status filters SCHEDULED+WORKED versus WORKED only) and diverge to 14800 vs 7400 on one identical
      two-shift set, while the OTHER dual-variant calculation in this scaffold (grant_outcome_report) is computed
      over the Placement/Participant domain.
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participant p1 released (doc_completeness_pct 80.0, barrier_score 66.3, stage POST_RELEASE).
      - SupervisionCase sc1 ACTIVE with work_authorization_status APPROVED, window [480, 1020].
      - EmployerPartnership pt1 ACTIVE, wotc_certified true, fidelity bond recorded.
      - 'JobOpening jo1: hourly_wage_cents 1850, weekly_hours 35, openings_count 2, transit_accessible true.'
      - 'FunderGrant g1: authorized_cents 5000000, per_participant_cap_cents 60000, retention_benchmark_pct 50.0.'
      - Placement pl1 ACTIVE with subsidy_track SUBSIDIZED_WORK_EXPERIENCE.
      - Two 8.0-hour WorkShifts on 2026-08-03 and 2026-08-04, both SCHEDULED.
      - Clock advanced to 2026-08-03T18:00:00.000Z so the first shift's ends_at has passed.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: STATE_ID
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: SSN_CARD
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: BIRTH_CERTIFICATE
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: WORK_HISTORY
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: TRANSIT_PASS
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/release-plan/approve
        payload: {}
        as: ProgramDirector
        as_user_id: pd-1
      - call: POST /participants/${p1_id}/release
        payload:
          actual_release_date: '2026-08-01'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /supervision-cases
        payload:
          participant_id: ${p1_id}
          officer_user_id: officer-1
          officer_name: M. Ruiz
          supervision_type: PAROLE
          expected_discharge_date: '2027-08-01'
        as: SupervisionOfficer
        as_user_id: officer-1
        captures:
          sc1_id: $.data.id
      - call: POST /supervision-cases/${sc1_id}/status
        payload:
          to_status: ACTIVE
        as: SupervisionOfficer
        as_user_id: officer-1
      - call: POST /supervision-cases/${sc1_id}/work-authorization
        payload:
          decision: APPROVED
          approved_window_start_minute: 480
          approved_window_end_minute: 1020
        as: SupervisionOfficer
        as_user_id: officer-1
      - call: POST /employer-partnerships
        payload:
          employer_name: Ridgeway Logistics
          industry: LOGISTICS
          max_concurrent_placements: 2
          wotc_certified: true
          excluded_record_categories: []
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      - call: POST /employer-partnerships/${pt1_id}/bonding-agreement
        payload:
          bond_coverage_cents: 500000
          bond_effective_date: '2026-08-01'
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ENGAGED
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ACTIVE
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /job-openings
        payload:
          partnership_id: ${pt1_id}
          title: Warehouse Associate
          occupation_code: 53-7062
          hourly_wage_cents: 1850
          weekly_hours: 35
          openings_count: 2
          barred_record_categories: []
          requires_license: false
          requires_fidelity_bond: false
          transit_accessible: true
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          jo1_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 5000000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: GET /job-openings/${jo1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          jo1_v_a: $.data.version
      - call: POST /placements
        payload:
          participant_id: ${p1_id}
          job_opening_id: ${jo1_id}
          grant_id: ${g1_id}
          subsidy_track: SUBSIDIZED_WORK_EXPERIENCE
          expected_job_opening_version: ${jo1_v_a}
          start_date: '2026-08-03'
        as: CaseManager
        as_user_id: cm-1
        captures:
          pl1_id: $.data.id
      - call: POST /placements/${pl1_id}/offer-response
        payload:
          response: ACCEPTED
        as: Participant
        as_user_id: ${p1_id}
      - call: POST /placements/${pl1_id}/work-shifts
        payload:
          starts_at: '2026-08-03T09:00:00.000Z'
          ends_at: '2026-08-03T17:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
        captures:
          sh1_id: $.data.id
      - call: POST /placements/${pl1_id}/work-shifts
        payload:
          starts_at: '2026-08-04T09:00:00.000Z'
          ends_at: '2026-08-04T17:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
        captures:
          sh2_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T18:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: POST /work-shifts/${sh1_id}/status
        payload:
          to_status: WORKED
        as: CaseManager
        as_user_id: cm-1
      assert:
      - WorkShift.${sh1_id}.status == WORKED
      - WorkShift.${sh1_id}.scheduled_hours == 8.0
      - WorkShift.${sh2_id}.status == SCHEDULED
      - Placement.${pl1_id}.projected_subsidy_cents == 14800
      - Placement.${pl1_id}.actual_subsidy_cents == 7400
      - Placement.${pl1_id}.projected_subsidy_cents != Placement.${pl1_id}.actual_subsidy_cents
      - Placement.${pl1_id}.disbursed_subsidy_cents == 0
      - Placement.${pl1_id}.match_score == 75
      - FunderGrant.${g1_id}.committed_cents == 14800
      - FunderGrant.${g1_id}.disbursed_cents == 0
      - FunderGrant.${g1_id}.available_cents == 4985200
      - FunderGrant.${g1_id}.funding_posture == OPEN
  - name: outcome_report_cohort_vs_exit_based_denominators
