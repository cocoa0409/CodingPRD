            - "sch2 created after archive (ARCHIVED rows do not block the weekday)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_create
        claim_type: standard_crud
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object'|'array', and data."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
          assert:
            - "Response has meta.api_request_id (non-empty), meta.api_request_timestamp (ISO8601), response_type == 'object', and data.id present"
            - "HTTP status 201"

      - name: error_envelope_shape_on_not_found
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Errors use response_type 'error' with data.error_id and data.message."
        test_recipe:
