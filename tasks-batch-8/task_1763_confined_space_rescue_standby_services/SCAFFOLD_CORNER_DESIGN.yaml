        claim_type: violation_to_error
        grounds: [roles.BillingClerk, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role check (priority 2) precedes state check (priority 7): BillingClerk activating a DRAFT permit gets ERR_FORBIDDEN, not ERR_PERMIT_INVALID_STATE."
