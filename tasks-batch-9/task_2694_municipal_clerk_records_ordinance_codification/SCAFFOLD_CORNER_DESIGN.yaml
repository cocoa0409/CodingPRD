      - name: the_clerk_cannot_convene_the_deputy_cannot_tally_and_the_editor_cannot_open_a_venue
        claim_type: cross_role_operation_denied
        grounds: ["validations[priority=3]", "errors[ERR_ROLE_NOT_PERMITTED]", "roles[CityClerk].exclusive_operations", "roles[PresidingOfficer].exclusive_operations", "roles[CodificationEditor].exclusive_operations"]
        distinguishing_aspect: "Three crossings of the peer-role boundary all return ERR_ROLE_NOT_PERMITTED (403) with no state change: the CityClerk reaching for the gavel, the DeputyClerk reaching for the tally that only the clerk may record, and the CodificationEditor reaching into the meetings surface."
        test_recipe:
          setup: ["A meeting IN_SESSION with one SECONDED PROCEDURAL motion."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
