scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, required fields, defaults, computed
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_with_defaults
        claim_type: creation
        grounds:
          - entities.Customer
        distinguishing_aspect: "POST /customers with required fields yields status=PROSPECT, lifetime_outstanding_cents=0 by default"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Default Dan", date_of_birth: "1960-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
          assert:
            - "Customer.${cid}.status == PROSPECT"
            - "Customer.${cid}.lifetime_outstanding_cents == 0"
            - "Customer.${cid}.version == 1"

      - name: customer_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.full_name
        distinguishing_aspect: "Omitting full_name on POST /customers yields ERR_INVALID_REQUEST (400)"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stairlift-ops/customers"
              payload: { date_of_birth: "1960-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: customer_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Customer
        distinguishing_aspect: "GET /customers/{uuid-not-in-db} returns ERR_NOT_FOUND (404)"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stairlift-ops/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: product_model_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.ProductModel
        distinguishing_aspect: "ProductModel has common_fields:false — no version field; GET returns id+created_at only as system fields"
        test_recipe:
          setup: ["One ProductModel exists"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-X", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 300000, monthly_rental_rate_cents: 7000, install_labor_hours: 4 }
              as: PlatformAdmin
          trigger:
            - call: "GET /stairlift-ops/product-models/SL-X"
              payload: {}
              as: PlatformAdmin
              captures: { pm: $.data }
          assert:
            - "ProductModel response does not contain version field"
            - "ProductModel response does not contain updated_at field"

      - name: home_assessment_measurement_invalid_range_returns_error
        claim_type: type_constraints
        grounds:
          - entities.HomeAssessment.fields.stair_rise_mm
        distinguishing_aspect: "stair_rise_mm < 500 (e.g., 300) violates numeric range and is rejected with ERR_INVALID_MEASUREMENT"
        test_recipe:
          setup: ["Customer + SCHEDULED HomeAssessment"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Range Rita", date_of_birth: "1950-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-05" }
              as: Assessor
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 300, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEASUREMENT"
            - "HomeAssessment.${aid}.status == SCHEDULED (unchanged)"

      - name: equipment_unit_default_grade_and_status
        claim_type: defaults
        grounds:
          - entities.EquipmentUnit.fields.condition_grade
          - entities.EquipmentUnit.fields.status
        distinguishing_aspect: "New EquipmentUnit defaults to condition_grade=NEW, status=IN_STOCK, lifetime_rental_months=0"
        test_recipe:
          setup: ["ProductModel exists"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-D", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 300000, monthly_rental_rate_cents: 7000, install_labor_hours: 4 }
              as: PlatformAdmin
          trigger:
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-D", serial_number: "SN-D-001" }
              as: InventoryManager
              captures: { uid: $.data.id }
          assert:
            - "EquipmentUnit.${uid}.condition_grade == NEW"
            - "EquipmentUnit.${uid}.status == IN_STOCK"
            - "EquipmentUnit.${uid}.lifetime_rental_months == 0"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, idempotency
  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Quote.DRAFT
        distinguishing_aspect: "Quote in DRAFT (never issued) cannot be accepted; accept returns ERR_INVALID_STATE"
        test_recipe:
          setup: ["Quote in DRAFT state"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-S", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Draft Dana", date_of_birth: "1950-01-01", home_region_code: "EAST" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${aid}/approve"
              payload: { model_code: "SL-S" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cid}/quotes"
              payload: { home_assessment_id: "${aid}", model_code: "SL-S", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-S", serial_number: "SN-DD-001" }
              as: InventoryManager
              captures: { uid: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/quotes/${qid}/accept"
              payload: { equipment_unit_id: "${uid}", expected_customer_version: "${cid_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_state_quote_accepted_locked
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Quote.terminal_states
        distinguishing_aspect: "ACCEPTED Quote is terminal; further revise/issue attempts return ERR_INVALID_STATE"
        test_recipe:
          setup: ["Quote in ACCEPTED state via successful accept flow"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-T", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Term Tom", date_of_birth: "1950-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${aid}/approve"
              payload: { model_code: "SL-T" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cid}/quotes"
              payload: { home_assessment_id: "${aid}", model_code: "SL-T", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-T", serial_number: "SN-TT-001" }
              as: InventoryManager
              captures: { uid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/accept"
              payload: { equipment_unit_id: "${uid}", expected_customer_version: "${cid_v}" }
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /stairlift-ops/quotes/${qid}/revise"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: install_job_start_before_scheduled_time_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_TOO_EARLY"]
        distinguishing_aspect: "Logical clock < scheduled_start_utc yields ERR_TOO_EARLY"
        test_recipe:
          setup: ["InstallJob scheduled for 2026-06-10 09:00; logical clock at 2026-06-01"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-E", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Early Erin", date_of_birth: "1950-01-01", home_region_code: "SOUTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${aid}/approve"
              payload: { model_code: "SL-E" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cid}/quotes"
              payload: { home_assessment_id: "${aid}", model_code: "SL-E", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-E", serial_number: "SN-EE-001" }
              as: InventoryManager
              captures: { uid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/accept"
              payload: { equipment_unit_id: "${uid}", expected_customer_version: "${cid_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { agid: $.data.id }
            - call: "POST /stairlift-ops/agreements/${agid}/skip-funding"
              payload: {}
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${agid}/install-jobs"
              payload: { technician_crew_id: "CREW-E", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T13:00:00Z" }
              as: InstallCoordinator
              captures: { ijid: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/install-jobs/${ijid}/start"
              payload: {}
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TOO_EARLY"

      - name: measurement_geometric_constraint_curved_run_too_short
        claim_type: precondition_enforcement
        grounds:
          - state_machines.HomeAssessment.SCHEDULED_to_MEASURED
          - errors[ERR_INVALID_MEASUREMENT"]
        distinguishing_aspect: "CURVED staircase requires stair_run_mm >= 2 * stair_rise_mm (safety minimum); violation returns ERR_INVALID_MEASUREMENT"
        test_recipe:
          setup: ["SCHEDULED assessment"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Curve Carl", date_of_birth: "1950-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "CURVED", stair_rise_mm: 2800, stair_run_mm: 5000, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEASUREMENT (5000 < 2*2800)"

  # ===========================================================================
  # Section: calculations — corner claims beyond difficulty instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: customer_outstanding_rollup_aggregation
        claim_type: correct_result
        grounds:
          - calculations.customer_outstanding_rollup
        distinguishing_aspect: "Rollup sums only ACTIVE+REMOVAL_REQUESTED agreements, floors at 0"
        test_recipe:
          setup: ["Customer with one ACTIVE agreement list=502000 funding=200000 paid=50000 -> expected 252000"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-R", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Rollup Rachel", date_of_birth: "1950-01-01", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${aid}/approve"
              payload: { model_code: "SL-R" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cid}/quotes"
              payload: { home_assessment_id: "${aid}", model_code: "SL-R", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-R", serial_number: "SN-RR-003" }
              as: InventoryManager
              captures: { uid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/accept"
              payload: { equipment_unit_id: "${uid}", expected_customer_version: "${cid_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { agid: $.data.id, ag_v: $.data.version }
            - call: "POST /stairlift-ops/quotes/${qid}/funding-applications"
              payload: { source_kind: "STATE_GRANT", requested_cents: 200000, priority_rank: 1 }
              as: FundingOfficer
              captures: { fid: $.data.id }
            - call: "POST /stairlift-ops/funding-applications/${fid}/decide"
              payload: { decision: "APPROVED", decision_reason: "ok", approved_cents: 200000 }
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${agid}/install-jobs"
              payload: { technician_crew_id: "CREW-R", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T13:00:00Z" }
              as: InstallCoordinator
              captures: { ijid: $.data.id }
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/install-jobs/${ijid}/start"
              payload: {}
              as: InstallCoordinator
            - call: "POST /stairlift-ops/install-jobs/${ijid}/complete"
              payload: { measured_labor_hours: 4, installed_rail_length_m: 4.00 }
              as: InstallCoordinator
            - call: "POST /stairlift-ops/agreements/${agid}/service-plans"
              payload: { tier: "BASIC" }
              as: InstallCoordinator
            - call: "POST /stairlift-ops/agreements/${agid}/activate"
              payload: {}
              as: InstallCoordinator
          trigger:
            - call: "POST /stairlift-ops/agreements/${agid}/payments"
              payload: { amount_cents: 50000, expected_agreement_version: "${ag_v}" }
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "Customer.${cid}.lifetime_outstanding_cents == 252000 (= 502000 - 200000 - 50000)"

      - name: buyback_offer_straight_line_zero_at_useful_life
        claim_type: correct_result
        grounds:
          - calculations.buyback_offer
        distinguishing_aspect: "RENTAL straight_line variant yields 0 when months_installed >= 120 (useful life exhausted)"
        test_recipe:
          setup: ["RENTAL Agreement ACTIVE for >=120 months; removal triggers buyback=0"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-BB", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 450000, monthly_rental_rate_cents: 8500, install_labor_hours: 6 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "BuyBack Barb", date_of_birth: "1950-01-01", home_region_code: "EAST" }
              as: SalesRep
              captures: { cid: $.data.id , cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${aid}/approve"
              payload: { model_code: "SL-BB" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cid}/quotes"
              payload: { home_assessment_id: "${aid}", model_code: "SL-BB", acquisition_mode: "RENTAL" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-BB", serial_number: "SN-BB-003" }
              as: InventoryManager
              captures: { uid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${qid}/accept"
              payload: { equipment_unit_id: "${uid}", expected_customer_version: "${cid_v}", committed_rental_months: 6 }
              as: Customer
              as_user_id: "${cid}"
              captures: { agid: $.data.id, ag_v: $.data.version }
            - call: "POST /stairlift-ops/agreements/${agid}/skip-funding"
              payload: {}
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${agid}/install-jobs"
