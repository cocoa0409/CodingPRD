      - name: actual_tons_above_planned_at_complete_is_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ACTUAL_TONS_EXCEED_PLANNED]"
          - "validations[priority=80 ERR_ACTUAL_TONS_EXCEED_PLANNED]"
          - "state_machines.HarvestBlock.COMMITTED_to_COMPLETED"
