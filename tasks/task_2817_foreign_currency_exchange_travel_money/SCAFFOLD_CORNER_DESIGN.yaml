            - "${e_manager} == ERR_UNAUTHORIZED (403): reversal is BranchManager-exclusive, and ${t1} is still SETTLED"
            - "${e_teller} == ERR_UNAUTHORIZED (403): redemption is BranchTeller-exclusive even for the PlatformAdmin, and BuybackContract.${k1} is still ISSUED with remaining_fx_minor_units 20000"
            - "${e_customer} == ERR_UNAUTHORIZED (403): the Customer role reaches only GET /branches/{id}/rate-board, GET /currencies and GET /currencies/{id}, so an ordinary branch read is closed to it"
            - "${e_order} == ERR_UNAUTHORIZED (403), not ERR_TRANSACTION_NOT_FOUND: priority 2 is evaluated before the path id is resolved"

