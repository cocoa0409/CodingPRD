  - rule_id: boundary_precision_check
    instances:
      - name: assign_rejected_when_active_caseload_count_exactly_equals_capacity
        grounds:
          - validations[priority=32]
          - entities.Advisor.fields.active_caseload_count
          - entities.Advisor.fields.caseload_capacity
          - errors[ERR_ADVISOR_CASELOAD_FULL]
        distinguishing_aspect: |
          Numeric-threshold boundary on the headcount metric reached through
          POST /inquiries/{id}/assign: the gate is `active_caseload_count < caseload_capacity`,
          so 1 < 2 is accepted and 2 < 2 is rejected — a `<=` implementation would wrongly admit
          a third case onto a capacity-2 advisor.
        test_recipe:
          setup:
            - "Advisor Ann in TX-AUS has caseload_capacity 2 and exactly 2 ACTIVE CaseloadAssignment rows (Q1 and Q2), so active_caseload_count == caseload_capacity."
            - "A third inquiry Q3 in the same region is still NEW and unassigned."
          setup_api_calls:
