  - rule_id: cross_entity_state_dependency
    instances:
      - name: lock_requires_trail_not_closed_departure_to_trail
        grounds:
          - state_machines.TourDeparture.SCHEDULED_to_LOCKED
          - validations[priority=17]
          - entities.Trail.fields.condition
          - errors[ERR_TRAIL_CLOSED]
        distinguishing_aspect: |
          TourDeparture->Trail dependency: a departure's SCHEDULED->LOCKED transition is rejected when its Trail.condition
          is CLOSED, even with rider_count and guide ratio satisfied -> ERR_TRAIL_CLOSED.
        test_recipe:
          setup:
            - "Trail with a SCHEDULED departure holding 1 CONFIRMED reservation and 1 assigned guide; trail then moved to CLOSED via a closure that does not touch THIS departure's window (departure is in the future, so it gets cancelled by close) — instead use a SECOND trail. Reframed: departure on Trail T, then T set CAUTION->CLOSED would cancel it; to keep departure SCHEDULED we set condition CLOSED on a trail whose departure is created AFTER close."
            - "Concretely: create Trail T OPEN; close T (no departures yet, count 0); create a departure on T while CLOSED is permitted (scheduling allowed; only lock/depart gated); confirm a reservation; assign guide; attempt lock."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "ClsLock", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "CLOSED", reason: "storm" }
              as: DispatchOperator
            - call: "POST /units"
              payload: { vin_tag: "U-17", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G Six", max_class: "TRAIL" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-02T09:00:00Z", ends_at: "2027-01-02T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Lk Mem", email: "lk@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /tour-departures/${dep_id}/assign-guide"
              payload: { guide_id: "${guide_id}" }
              as: DispatchOperator
          trigger:
            - call: "POST /tour-departures/${dep_id}/lock"
              payload: {}
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "TourDeparture.${dep_id}.error_id == ERR_TRAIL_CLOSED"
            - "TourDeparture.${dep_id}.status == SCHEDULED"

      - name: confirm_mountain_requires_member_training_reservation_to_member
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - validations[priority=10]
          - entities.Member.fields.training_level
          - entities.Unit.fields.unit_class
          - errors[ERR_TRAINING_REQUIRED]
        distinguishing_aspect: |
          Reservation->Member dependency (different entity pair from departure->trail): confirming a reservation on a
          MOUNTAIN-class Unit requires the Member.training_level == ADVANCED; a BASIC-trained member is rejected -> ERR_TRAINING_REQUIRED.
        test_recipe:
          setup:
            - "Trail MOUNTAIN OPEN; Unit MOUNTAIN; Member age-eligible, waiver SIGNED, training_level BASIC (not ADVANCED); PENDING reservation."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "MtnT", required_class: "MOUNTAIN", max_riders: 8 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-18", unit_class: "MOUNTAIN", daily_rate_cents: 12000, deposit_cents: 40000, tank_capacity_liters: 50 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-05T09:00:00Z", ends_at: "2027-01-05T15:00:00Z", required_guide_class: "MOUNTAIN", capacity_riders: 8 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Basic Mem", email: "basic@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /members/${mem_id}/complete-training"
              payload: { level: "BASIC" }
              as: DispatchOperator
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "Reservation.${res_id}.error_id == ERR_TRAINING_REQUIRED"
            - "Reservation.${res_id}.reservation_status == PENDING"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_half_open_overlap_rejects_but_adjacent_ok
        grounds:
          - validations[priority=12]
          - state_machines.Unit.AVAILABLE_to_RESERVED
          - errors[ERR_UNIT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Unit interval semantics are HALF-OPEN [starts_at, ends_at): a unit reserved over D1 [09:00,17:00) is rejected
          for an overlapping D2 [12:00,20:00) -> ERR_UNIT_DOUBLE_BOOKED, but the SAME unit is accepted for adjacent D3
          [17:00,01:00) because D1's end == D3's start does NOT overlap under half-open arithmetic.
        test_recipe:
          setup:
            - "Trail TRAIL OPEN; one Unit reserved over D1 [2027-01-08T09:00,17:00); attempt to reserve same unit on overlapping D2 [12:00,20:00)."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "UnitOvl", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-19", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-08T09:00:00Z", ends_at: "2027-01-08T17:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-08T12:00:00Z", ends_at: "2027-01-08T20:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { d2_id: $.data.id, d2_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "U1 Mem", email: "u1@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /reservations"
              payload: { member_id: "${m1}", tour_departure_id: "${d1_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /reservations/${r1}/confirm"
              payload: { expected_tour_departure_version: "${d1_ver}" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /members/register"
              payload: { full_name: "U2 Mem", email: "u2@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /members/${m2}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /reservations"
              payload: { member_id: "${m2}", tour_departure_id: "${d2_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${m2}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /reservations/${r2}/confirm"
              payload: { expected_tour_departure_version: "${d2_ver}" }
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "Reservation.${r2}.error_id == ERR_UNIT_DOUBLE_BOOKED"

      - name: gear_closed_buffered_overlap_rejects_adjacent_departure
        grounds:
          - validations[priority=13]
          - state_machines.GearItem.AVAILABLE_to_ASSIGNED
          - calculations.eligibility_constants
          - errors[ERR_GEAR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Gear interval semantics DIFFER from units: CLOSED interval [starts_at, ends_at] padded by GEAR_BUFFER_MINUTES
          (60) each side. A helmet on D1 [09:00,17:00] (buffered [08:00,18:00]) is rejected for the ADJACENT D3
          [17:00,01:00] because 17:00 falls inside [08:00,18:00] — the exact case the unit half-open rule ALLOWED.
        test_recipe:
          setup:
            - "Trail TRAIL OPEN; helmet assigned on D1 [2027-01-10T09:00,17:00]; attempt to assign same helmet on adjacent D3 [17:00,01:00]."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "GearOvl", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-20", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit1: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-21", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit2: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-10T09:00:00Z", ends_at: "2027-01-10T17:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-10T17:00:00Z", ends_at: "2027-01-11T01:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { d3_id: $.data.id, d3_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "G1 Mem", email: "g1@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /reservations"
              payload: { member_id: "${m1}", tour_departure_id: "${d1_id}", unit_id: "${unit1}", helmet_gear_id: "${helmet_id}" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /reservations/${r1}/confirm"
              payload: { expected_tour_departure_version: "${d1_ver}" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /members/register"
              payload: { full_name: "G2 Mem", email: "g2@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /members/${m2}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /reservations"
              payload: { member_id: "${m2}", tour_departure_id: "${d3_id}", unit_id: "${unit2}", helmet_gear_id: "${helmet_id}" }
              as: Member
              as_user_id: "${m2}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /reservations/${r2}/confirm"
              payload: { expected_tour_departure_version: "${d3_ver}" }
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "Reservation.${r2}.error_id == ERR_GEAR_DOUBLE_BOOKED"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_hold_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.HELD_to_REFUNDED
          - entities.Member.fields.deposit_hold_cents
        distinguishing_aspect: |
          Conserved quantity = Member.deposit_hold_cents. Invariant: Member.deposit_hold_cents AFTER (confirm then
          cancel) == value BEFORE confirm. Before=0; confirm holds 25000; cancel refunds 25000; final==0 with zero drift.
        test_recipe:
          setup:
            - "Member NONE-tier waiver SIGNED with deposit_hold_cents 0; one Unit deposit 25000; departure SCHEDULED."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "DepInv", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-22", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-12T09:00:00Z", ends_at: "2027-01-12T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Inv Mem", email: "inv@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Member.${mem_id}.deposit_hold_cents == 0"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Unit.${unit_id}.status == AVAILABLE"

      - name: departure_rider_count_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.TourDeparture.fields.rider_count
        distinguishing_aspect: |
          Conserved quantity = TourDeparture.rider_count (a DIFFERENT conserved quantity from deposit cents).
          Invariant: rider_count AFTER (confirm then cancel) == value BEFORE confirm. Before=0; confirm increments to 1;
          cancel decrements to 0; net zero drift.
        test_recipe:
          setup:
            - "Departure SCHEDULED with rider_count 0; a Member confirms (rider_count 1) then cancels."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "RCInv", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-23", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-01-14T09:00:00Z", ends_at: "2027-01-14T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "RC Mem", email: "rc@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "TourDeparture.${dep_id}.rider_count == 0"
            - "Reservation.${res_id}.reservation_status == CANCELLED"
