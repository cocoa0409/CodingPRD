            - { call: "PUT /flight-legs/${leg1}/forecast", payload: { forecast_high_c: 26, forecast_low_c: 16 }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /flight-legs/${leg1}/delay", payload: { new_departure_utc: "2026-09-10T04:00:00Z", new_arrival_utc: "2026-09-10T18:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          trigger:
