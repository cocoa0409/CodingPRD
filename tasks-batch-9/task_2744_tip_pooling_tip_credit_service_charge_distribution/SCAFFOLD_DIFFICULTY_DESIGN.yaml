            - call: "POST /shifts/${shift_2}/close"
              payload: {}
              as: PayrollPreparer
          assert:
            - "Shift.${shift_1}.scheduled_minutes == 480 with non_tip_credit_minutes == 0 and tip_credit_eligible_minutes == 480, the 96-minute allowance and the 30-minute continuous limit both being inclusive"
            - "Shift.${shift_2}.non_tip_credit_minutes == 1 and tip_credit_eligible_minutes == 479, the percentage limb yielding 1 and the continuous limb also yielding 1 and max(1, 1) being 1 rather than the 2 an additive reading would give"
            - "both shifts have time_status CLOSED and declaration_status UNDECLARED"
            - "PayPeriod.${period_id}.total_credited_minutes == 960, since the rollup counts scheduled minutes of CLOSED shifts and not tip-credit-eligible minutes"

      - name: tipped_employee_monthly_threshold_at_exactly_three_thousand_cents
        grounds:
