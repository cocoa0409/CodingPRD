              as: SignalOpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "B Street Corridor", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /signal-ops/corridors/${ca_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${ca_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${ca_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme A Street" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme B Street" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${ca_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 10, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pa_id: $.data.id }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${cb_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 10, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pb_id: $.data.id }
            - call: "POST /signal-ops/intersections/${ishared_id}/turning-movement-counts"
              payload: { project_id: "${pa_id}", study_role: "BEFORE", count_date: "2026-08-02T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/intersections/${ishared_id}/turning-movement-counts"
              payload: { project_id: "${pb_id}", study_role: "BEFORE", count_date: "2026-08-02T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${pa_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-08-02T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${pb_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-08-02T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T23:59:59Z" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${pb_id}/advance"
