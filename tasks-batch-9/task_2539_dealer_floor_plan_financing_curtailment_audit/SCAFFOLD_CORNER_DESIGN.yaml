# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml
# Task 2539 - Dealer Floor Plan Financing & Curtailment Audit
#
# Breadth probe (SKILL.md 1.9). Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; no category is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because stub and NO test_recipe.
#
# Fixture user ids (X-User-ID) used throughout:
#   u-sys-1  SystemOperator      u-co-1   CreditOfficer
#   u-crm-1  CreditRiskManager   u-crm-2  CreditRiskManager
#   u-fa-1   FieldAuditor        u-fa-2   FieldAuditor
#   u-am-1   AuditManager
# DealerPrincipal identity is entity_backed:Dealer, so as_user_id is the
# dealer's own id and must always be a ${var}.
# Default logical clock 2026-08-01T00:00:00Z is set explicitly in every chain.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: dealer_creation_returns_201_with_declared_defaults_and_envelope
        claim_type: creation
        grounds:
          - response_envelope.success
          - entities.Dealer
          - endpoints["POST /floorplan/dealers"]
        distinguishing_aspect: "A dealer created with only the four input fields comes back with status PROSPECT, risk_score 100, risk_rating A, audit_frequency_days 180, every counter 0 and version 1, wrapped in the declared success envelope."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
          trigger:
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Creation Motors LLC", dba_name: "Corner Motors", franchise_type: "FRANCHISE_NEW_CAR", state_code: "TX" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c1_d: "$.data.id", c1_status: "$.data.status", c1_score: "$.data.risk_score", c1_rating: "$.data.risk_rating", c1_freq: "$.data.audit_frequency_days", c1_ver: "$.data.version", c1_created: "$.data.created_at" }
          assert:
            - "HTTP status is 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "${c1_status} == \"PROSPECT\", ${c1_score} == 100, ${c1_rating} == \"A\", ${c1_freq} == 180 and ${c1_ver} == 1"
            - "${c1_created} == \"2026-08-01T00:00:00Z\" and Dealer.${c1_d}.updated_at == \"2026-08-01T00:00:00Z\""
            - "Dealer.${c1_d}.next_audit_due_at == null and Dealer.${c1_d}.last_covenant_result == null"
            - "Dealer.${c1_d}.open_sot_incident_count == 0, open_sot_exposure_cents == 0, delinquent_unit_count == 0, covenant_breach_count == 0, unapplied_credit_cents == 0 and audit_in_progress == false"
            - "Dealer.${c1_d}.legal_name == \"Corner Creation Motors LLC\", dba_name == \"Corner Motors\", franchise_type == \"FRANCHISE_NEW_CAR\" and state_code == \"TX\""

      - name: dealer_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints["GET /floorplan/dealers/{id}"]
          - entities.Dealer
        distinguishing_aspect: "GET /floorplan/dealers/{id} returns the same field values the POST response carried, with version still 1 because a read never writes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer created by CreditOfficer u-co-1 with legal_name \"Corner Retrieval Motors LLC\" in state NV."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Retrieval Motors LLC", franchise_type: "POWERSPORTS", state_code: "NV" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c2_d: "$.data.id" }
          trigger:
            - call: "GET /floorplan/dealers/${c2_d}"
              payload: {}
              as: CreditRiskManager
              as_user_id: "u-crm-1"
              captures: { c2_id: "$.data.id", c2_name: "$.data.legal_name", c2_type: "$.data.franchise_type", c2_ver: "$.data.version" }
          assert:
            - "HTTP status is 200 and ${c2_id} == ${c2_d}"
            - "${c2_name} == \"Corner Retrieval Motors LLC\" and ${c2_type} == \"POWERSPORTS\""
            - "${c2_ver} == 1 - the read did not bump version"
            - "Dealer.${c2_d}.dba_name == null because the optional field was omitted"

      - name: dealer_listing_filters_by_state_code_and_honors_limit_and_offset
        claim_type: listing
        grounds:
          - endpoints["GET /floorplan/dealers"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three dealers of which two are in KS, GET /floorplan/dealers?state_code=KS&limit=1&offset=1 returns exactly the second KS dealer by created_at ASC with total_count 2 and has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three dealers created in this order: KS dealer A, MO dealer B, KS dealer C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner List A Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "KS" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c3_a: "$.data.id" }
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner List B Motors LLC", franchise_type: "INDEPENDENT_USED", state_code: "MO" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c3_b: "$.data.id" }
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner List C Motors LLC", franchise_type: "INDEPENDENT_USED", state_code: "KS" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c3_c: "$.data.id" }
          trigger:
            - call: "GET /floorplan/dealers"
              payload: { state_code: "KS", limit: 1, offset: 1 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c3_first: "$.data[0].id", c3_first_name: "$.data[0].legal_name" }
          assert:
            - "HTTP status is 200, response_type == \"array\", total_count == 2, has_more == false, limit == 1 and offset == 1"
            - "exactly one row is returned and ${c3_first} == ${c3_c} - created_at ASC ordering puts KS dealer C second"
            - "${c3_first_name} == \"Corner List C Motors LLC\" and the MO dealer ${c3_b} does not appear"
            - "GET /floorplan/dealers with no query parameters returns total_count 3 with limit 10 and offset 0 applied by default"

      - name: credit_line_retrieval_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=41]
          - errors.ERR_CREDIT_LINE_NOT_FOUND
          - endpoints["GET /floorplan/credit-lines/{id}"]
        distinguishing_aspect: "A GET against a syntactically valid but absent credit-line id returns 404 ERR_CREDIT_LINE_NOT_FOUND, never an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer exists; no CreditLine has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Missing Line Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "OK" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c4_d: "$.data.id" }
          trigger:
            - call: "GET /floorplan/credit-lines/cl-absent-0001"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c4_err: "$.data.error_id" }
          assert:
            - "HTTP status is 404 and ${c4_err} == \"ERR_CREDIT_LINE_NOT_FOUND\""
            - "the body uses the error envelope: response_type == \"error\" with data.error_id and data.message present"
            - "GET /floorplan/credit-lines?dealer_id=${c4_d} returns 200 with total_count 0"

      - name: credit_line_creation_missing_required_credit_limit_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=50]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /floorplan/credit-lines"]
        distinguishing_aspect: "Omitting credit_limit_cents, a required input field with no default, returns 400 ERR_INVALID_REQUEST and creates no CreditLine row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer in PROSPECT with no CreditLine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Required Field Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "AR" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c5_d: "$.data.id" }
          trigger:
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c5_d}", advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c5_err: "$.data.error_id" }
          assert:
            - "HTTP status is 400 and ${c5_err} == \"ERR_INVALID_REQUEST\""
            - "GET /floorplan/credit-lines?dealer_id=${c5_d} returns total_count 0"
            - "Dealer.${c5_d}.status is still PROSPECT and version is still 1"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CreditLine.fields.curtailment_grace_days
          - entities.InventoryUnit.fields.odometer_miles
          - endpoints["POST /floorplan/credit-lines"]
          - endpoints["POST /floorplan/units"]
        distinguishing_aspect: "Omitting curtailment_grace_days yields 10 and omitting odometer_miles yields 0, both taken from the declared field defaults rather than from null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer, and one CreditLine created WITHOUT curtailment_grace_days, then activated so units may be registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Defaults Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "IA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c6_d: "$.data.id" }
          trigger:
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c6_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c6_cl: "$.data.id", c6_grace: "$.data.curtailment_grace_days" }
            - call: "POST /floorplan/credit-lines/${c6_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c6_d}", credit_line_id: "${c6_cl}", vin: "1CRNDEFAULTUNIT01", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c6_d}"
              captures: { c6_u: "$.data.id", c6_odo: "$.data.odometer_miles" }
          assert:
            - "${c6_grace} == 10 - the declared default, not null"
            - "${c6_odo} == 0 - the declared default for an omitted odometer reading"
            - "InventoryUnit.${c6_u}.funding_status == \"REGISTERED\", title_custody_status == \"NOT_RECEIVED\" and eligibility_status == \"ELIGIBLE\""
            - "InventoryUnit.${c6_u}.advance_amount_cents == 0, principal_paid_cents == 0, floored_at == null and funded_by_user_id == null"

      - name: advance_funding_ignores_the_client_supplied_requested_amount
        claim_type: computed_fields
        grounds:
          - calculations.unit_advance_amount
          - entities.FundingAdvance.fields.approved_advance_amount_cents
          - entities.FundingAdvance.fields.requested_amount_cents
          - endpoints["POST /floorplan/funding-advances/{id}/fund"]
        distinguishing_aspect: "A dealer asking for 5000000 against a 3000000 NEW invoice is funded 3000000 exactly, so approved_advance_amount_cents is computed from invoice_amount_cents and the class rate, never copied from requested_amount_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine: credit_limit_cents 500000000, advance_rate_bps_new 10000, max_unit_advance_cents_new 20000000, NEW tier [90,unbounded) at 1000 bps."
            - "One NEW InventoryUnit with invoice_amount_cents 3000000 and title LENDER_HELD, plus a REQUESTED FundingAdvance whose requested_amount_cents is 5000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Computed Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "IL" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c7_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c7_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c7_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c7_cl}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${c7_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c7_d}", credit_line_id: "${c7_cl}", vin: "1CRNCOMPUTEDUNIT1", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", odometer_miles: 5, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c7_d}"
              captures: { c7_u: "$.data.id" }
            - call: "POST /floorplan/units/${c7_u}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-C7" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${c7_u}/funding-advances"
              payload: { requested_amount_cents: 5000000, dealer_invoice_reference: "INV-C7" }
              as: DealerPrincipal
              as_user_id: "${c7_d}"
              captures: { c7_a: "$.data.id", c7_req: "$.data.requested_amount_cents", c7_approved0: "$.data.approved_advance_amount_cents" }
            - call: "GET /floorplan/credit-lines/${c7_cl}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c7_v: "$.data.version" }
          trigger:
            - call: "POST /floorplan/funding-advances/${c7_a}/fund"
              payload: { expected_credit_line_version: "${c7_v}", disbursement_reference: "WIRE-C7" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c7_approved: "$.data.approved_advance_amount_cents", c7_bps: "$.data.effective_advance_rate_bps", c7_age: "$.data.invoice_age_days_at_funding" }
          assert:
            - "${c7_req} == 5000000 is echoed back untouched while ${c7_approved0} == 0 before funding"
            - "${c7_approved} == 3000000, ${c7_bps} == 10000 and ${c7_age} == 0"
            - "InventoryUnit.${c7_u}.advance_amount_cents == 3000000 and outstanding_principal_cents == 3000000"
            - "CreditLine.${c7_cl}.outstanding_principal_cents == 3000000 and available_credit_cents == 497000000"
            - "FundingAdvance.${c7_a}.funded_at == \"2026-08-01T00:00:00Z\" and funded_by_user_id == \"u-co-1\""

      - name: system_stamped_ids_and_timestamps_are_server_generated_on_every_write
        claim_type: system_fields
        grounds:
          - entities.CreditLine
          - endpoints["POST /floorplan/credit-lines"]
          - endpoints["POST /floorplan/credit-lines/{id}/activate"]
        distinguishing_aspect: "created_at is stamped once from the logical clock and never moves, while updated_at and version advance on the activate write; two lines created in the same request sequence still receive distinct ids."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two Dealers, each with one PENDING CreditLine created at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner System Fields One LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "MN" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c8_d1: "$.data.id" }
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner System Fields Two LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "MN" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c8_d2: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c8_d1}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c8_cl1: "$.data.id", c8_created1: "$.data.created_at", c8_updated1: "$.data.updated_at", c8_ver1: "$.data.version" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c8_d2}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c8_cl2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
          trigger:
            - call: "POST /floorplan/credit-lines/${c8_cl1}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c8_created_after: "$.data.created_at", c8_updated_after: "$.data.updated_at", c8_ver_after: "$.data.version", c8_activated: "$.data.activated_at" }
          assert:
            - "${c8_created1} == \"2026-08-01T00:00:00Z\", ${c8_updated1} == \"2026-08-01T00:00:00Z\" and ${c8_ver1} == 1"
            - "${c8_created_after} == \"2026-08-01T00:00:00Z\" - created_at never moves"
            - "${c8_updated_after} == \"2026-08-08T00:00:00Z\", ${c8_activated} == \"2026-08-08T00:00:00Z\" and ${c8_ver_after} == 2"
            - "${c8_cl1} != ${c8_cl2} - ids are server-generated and unique"
            - "CreditLine.${c8_cl2}.version is still 1 because the activate touched only the first line"

      - name: unit_audit_observation_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.UnitAuditObservation
          - endpoints["POST /floorplan/audits/{id}/observations"]
          - endpoints["GET /floorplan/audits/{id}/observations"]
        distinguishing_aspect: "UnitAuditObservation declares common_fields false, so the recorded row carries id and created_at but no version and no update endpoint anywhere in §1.5; its computed classification is frozen at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE Dealer with an ACTIVE CreditLine (limit 500000000, NEW rate 10000 bps, NEW tier [90,unbounded) at 1000 bps)."
            - "One NEW unit with a 3000000 invoice, title LENDER_HELD, FLOORED via a funded advance."
            - "One UNANNOUNCED FloorPlanAudit for window 2026-08-01 .. 2026-08-03, started by FieldAuditor u-fa-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Immutable Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "WI" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c9_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c9_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
