            - "Job.${job}.billing_status == SETTLED and production_status == CLOSED (hop 2)"
            - "Customer.${cust}.exposure_cents == 0 and posture == ACTIVE (hop 3)"
            - "Customer.${cust}.reprint_credit_balance_cents == 0 (no remainder: final credit equaled outstanding)"

      - name: press_complete_to_lot_to_auto_po_cascade
