              as: InnovationLead
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "IN_HOME_USE", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-15T00:00:00Z" }
              as: InnovationLead
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "IN_HOME_USE", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-14T00:00:00Z" }
              as: InnovationLead
              captures: { pg_ct11_id: $.data.id }
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "IN_HOME_USE", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-13T00:00:00Z" }
