            - "The approve response carries version == 3 with guide_status == GUIDE_APPROVED and guide_version_pinned == 'G1'"
            - "The field response carries version == 4 with execution_status == FIELDING and recruitment_status == RECRUITING"
            - "The final read carries version == 4, and ParticipantPool.version was untouched by all four study writes"
      - name: layer_cascading_side_effects_across_five_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: consent_revocation_five_hop_evidence_withdrawal
          rationale: "That §1.8 instance walks the full five-hop chain - consent revoked -> artifacts PURGED -> evidence links inadmissible -> finding strength and counters recomputed -> theme weight rolled back - and asserts every hop, including that a PUBLISHED finding is not silently unpublished."
      - name: layer_dual_variant_calculation_on_evidence_strength
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: finding_strength_provisional_vs_corroborated
          rationale: "That §1.8 instance computes both variants over the identical link set, asserts the divergence and asserts the delta at the moment the variant switches on lock."
  - section: consistency_model
    instances:
      - name: computed_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /studies/{id}/recruitments]
          - endpoints[POST /findings/{id}/evidence-links]
        distinguishing_aspect: "Every derived value - the reservation on the invite, the pool ledger it moved, the per-link contribution and the finding strength it feeds - is asserted in the response of the very call that caused it, with no intervening read. A deferred or batched recompute fails immediately rather than at the next GET."
        test_recipe:
          setup:
            - "A fielded INTERVIEW study with one consented participant, one theme and one DRAFT finding"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Immediate", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "What blocks the first export?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /participant-pools"
              payload: { name: "Immediate pool", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 100000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-I01", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 3, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1", "A2"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 5000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-21T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { study_id: $.data.id }
            - call: "PUT /studies/${study_id}/guide"
              payload: { guide_version_label: "G1", guide_question_count: 6 }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/guide/approve"
              payload: {}
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /studies/${study_id}/field"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /consent-records"
              payload: { participant_id: "${p1_id}", study_id: "${study_id}", scopes: ["RECORDING"], retention_days: 180 }
              as: PrivacyOfficer
              as_user_id: "u_priv_1"
            - call: "POST /themes"
              payload: { label: "First export" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { th_id: $.data.id }
          trigger:
            - call: "POST /studies/${study_id}/recruitments"
              payload: { participant_id: "${p1_id}", screening_answers: { segment: "POWER_USER", locale: "en-US", answers: ["A1", "A2"] } }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { r1_id: $.data.id }
            - call: "GET /participant-pools/${pool_id}"
              payload: {}
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /recruitments/${r1_id}/screen"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /recruitments/${r1_id}/schedule"
              payload: { scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z", moderator_user_id: "u_res_1" }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /recruitments/${r1_id}/complete"
              payload: { actual_duration_min: 60 }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /recruitments/${r1_id}/artifacts"
              payload: { artifact_type: "RECORDING", contains_pii: true }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { a1_id: $.data.id }
            - call: "POST /findings"
              payload: { study_id: "${study_id}", theme_id: "${th_id}", statement: "The export picker hides the format list", severity: "MEDIUM" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { f1_id: $.data.id }
            - call: "POST /findings/${f1_id}/evidence-links"
              payload: { artifact_id: "${a1_id}", excerpt_ref: "00:07:30", weight_class: "DIRECT_QUOTE" }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "GET /findings/${f1_id}"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
          assert:
            - "The invite response itself already carries reserved_cents == 5000, incentive_state == RESERVED and status == INVITED - no follow-up read is needed to see the reservation"
            - "The pool read taken immediately afterwards shows incentive_reserved_cents == 5000, incentive_available_cents == 95000, participant_count == 1 and pool_posture == OPEN, i.e. utilization 0.05 was re-derived synchronously"
            - "The screen response carries screening_score == 90.00 and status == SCREENED_IN in the same body"
            - "The complete response carries status == COMPLETED and the study's completed_count == 1 is already reflected in the next read"
            - "The finding create response carries evidence_strength == 0.00, strength_variant == PROVISIONAL, admissible_link_count == 0 and distinct_participant_count == 0"
            - "The evidence-link response carries contribution == 1.00 (DIRECT_QUOTE 1.00 x INTERVIEW 1.0) and is_admissible == true in the creating response"
            - "The finding read taken immediately afterwards shows evidence_strength == 0.25 (PROVISIONAL: round(min(1, 1.00 / 4.00), 2)), admissible_link_count == 1 and distinct_participant_count == 1"
            - "No assertion in this instance requires a retry, sleep or second read of the same resource"
