            - "RosterEntry.${ro_e3}.status remains SCHEDULED"
            - "The ON_DUTY attendant does not count toward max_entrants (only ENTRANT role counts)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_activation_gated_by_plan_approval
        grounds:
          - state_machines.EntryPermit.ISSUED_to_ACTIVE
          - state_machines.RescuePlan.DRAFT_to_APPROVED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair = EntryPermit -> RescuePlan. Activation of an ISSUED permit is
          rejected while the space's only plan is DRAFT (ERR_RESCUE_PLAN_NOT_APPROVED)
          and succeeds after the plan transitions to APPROVED — the permit's valid
          transition set depends on the plan entity's state.
        test_recipe:
          setup:
            - "ISSUED permit with a fresh PRE_ENTRY reading; the space's plan is DRAFT (not yet approved); no standby assignment yet (standby create itself requires an APPROVED plan)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Gate Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-G", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Gate job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v2}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v3}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per_status: "$.data.status" } }
          assert:
            - "First activate fails with ERR_RESCUE_PLAN_NOT_APPROVED (plan still DRAFT; the plan gate is check (a) of the safety chain, evaluated before the standby-understaffing check)"
            - "EntryPermit.${per} remains ISSUED after the failed activation"
            - "Standby creation before approval is itself gated: it is only attempted after approve in this chain because the endpoint requires an APPROVED plan"
            - "After POST /rescue-plans/${plan}/approve and standby scheduling, the second activate succeeds: EntryPermit.${per}.status == ACTIVE"

      - name: statement_finalize_gated_by_open_permits
        grounds:
          - state_machines.BillingStatement.OPEN_to_FINALIZED
          - entities.BillingStatement.fields.total_cents
          - validations[priority=14]
        distinguishing_aspect: |
          Entity pair = BillingStatement -> EntryPermit (DIFFERENT pair from
          permit_activation_gated_by_plan_approval). Finalize of an OPEN statement is
          rejected while any account permit with actual_entry_at inside the period is
          still ACTIVE (ERR_PERMITS_STILL_OPEN); closing the permit unblocks finalize.
        test_recipe:
          setup:
            - "HOURLY account; ACTIVE permit (activated 06:00) with one ON_STANDBY assignment (r1, 05:00-20:00, checked in 05:30)"
            - "Statement generated for period [2026-08-03T00:00:00Z, 2026-08-04T00:00:00Z) while the permit is still ACTIVE"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Finalize Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-F", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Finalize job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/statements/${stmt}/finalize", payload: {}, as: BillingClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/close", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt_again: "$.data.id" } }
            - { call: "POST /rescue-ops/statements/${stmt}/finalize", payload: {}, as: BillingClerk, captures: { stmt_status: "$.data.status", stmt_total: "$.data.total_cents" } }
            - { call: "GET /rescue-ops/client-accounts/${acct}", as: BillingClerk, captures: { acct_balance: "$.data.balance_cents" } }
          assert:
            - "First finalize fails with ERR_PERMITS_STILL_OPEN (permit ACTIVE with actual_entry_at in period)"
            - "BillingStatement.${stmt} remains OPEN after the failed finalize"
            - "Close releases the ON_STANDBY assignment (cascade): StandbyAssignment.${sa}.status == RELEASED with checked_out_at 09:00 (checked in 05:30 -> 210 min)"
            - "Second generate returns the SAME statement id ${stmt_again} == ${stmt} (OPEN-statement top-up, not a new statement) and sweeps the released assignment"
            - "Second finalize succeeds: status == FINALIZED, total_cents == 80000 (05:30->09:00 = 210 min -> 3.5h -> max(4, 3.5) = 4h * 20000)"
            - "ClientAccount.${acct}.balance_cents == 80000"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: standby_half_open_touching_windows
        grounds:
          - calculations.standby_window_rules
          - entities.StandbyAssignment.fields.standby_start_at
          - "endpoints[POST /rescue-ops/entry-permits/{permitId}/standby-assignments]"
        distinguishing_aspect: |
          Resource = rescuer (Personnel) via StandbyAssignment; interval semantics =
          HALF-OPEN [start, end) with NO buffer: a new window starting exactly at the
          existing window's end (12:00 == 12:00) is legal, while 11:59-13:00 strictly
          overlaps and is rejected with ERR_STANDBY_OVERLAP.
        test_recipe:
          setup:
            - "ISSUED permit with APPROVED plan; rescuer r1; clock at 2026-08-03T06:00:00Z (all windows in the future)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Overlap Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-O", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Overlap job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-04T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T08:00:00Z", standby_end_at: "2026-08-03T12:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_a: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T12:00:00Z", standby_end_at: "2026-08-03T16:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_b: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T11:59:00Z", standby_end_at: "2026-08-03T13:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Assignment B (12:00-16:00) is created successfully: new_start == existing_end is NOT an overlap under half-open semantics"
            - "Assignment C (11:59-13:00) fails with ERR_STANDBY_OVERLAP (11:59 < 12:00 strict overlap with A, and 11:59 < 16:00 / 12:00 < 13:00 with B)"
            - "Exactly 2 StandbyAssignments exist for rescuer ${r1_id} after the three attempts"

      - name: roster_rest_gap_exact_boundary
        grounds:
          - calculations.duty_window_rules
          - entities.RosterEntry.fields.scheduled_start_at
          - "endpoints[POST /rescue-ops/entry-permits/{permitId}/roster-entries]"
        distinguishing_aspect: |
          Resource = worker (Personnel) via RosterEntry; interval semantics = BUFFER
          (8-hour rest gap) — DIFFERENT semantics from standby's half-open rule and a
          different resource entity. A shift starting exactly 8h after the previous
          shift's end (20:00 after 12:00) is legal; 19:59 violates the rest gap.
        test_recipe:
          setup:
            - "ISSUED permit; worker p1 (no qualifications needed for ENTRANT); existing shift1 2026-08-03T06:00:00Z-12:00:00Z"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Worker One", role_qualifications: [] }, as: OperationsManager, captures: { p1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Rest Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-RG", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 3, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Rest job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-04T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${p1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T06:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { shift1: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${p1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T20:00:00Z", scheduled_end_at: "2026-08-03T23:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { shift2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${p1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T19:59:00Z", scheduled_end_at: "2026-08-03T23:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Shift2 (20:00-23:00) is created: 20:00 == 12:00 + 8h exactly satisfies the rest gap (boundary is inclusive-legal)"
            - "Shift3 (19:59-23:00) fails with ERR_INSUFFICIENT_REST (19:59 < 20:00)"
            - "Exactly 2 RosterEntries exist for ${p1_id} after the three attempts"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: finalize_void_balance_invariant
        grounds:
          - calculations.balance_reconciliation
          - entities.ClientAccount.fields.balance_cents
          - state_machines.BillingStatement.OPEN_to_FINALIZED
          - state_machines.BillingStatement.FINALIZED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = money (ClientAccount.balance_cents, pinned by the
          ledger invariant balance == sum of billed_balance_contribution_cents).
          Forward action finalize (+80000) paired with compensating action void
          (-80000) leaves the account balance exactly at its pre-finalize value 0,
          while the VOID statement retains total_cents == 80000 with contribution 0.
        test_recipe:
          setup:
            - "HOURLY account (rate 20000, min 4h); ISSUED permit; one standby assignment (r1, window 10:00-20:00) checked in 10:00, released 12:07 (line 80000)"
            - "Statement generated for [2026-08-03T00:00:00Z, 2026-08-04T00:00:00Z): total 80000, account balance still 0"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Ledger Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-L", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Ledger job", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:07:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt: "$.data.id" } }
            - { call: "GET /rescue-ops/client-accounts/${acct}", as: BillingClerk, captures: { bal_before: "$.data.balance_cents" } }
          trigger:
            - { call: "POST /rescue-ops/statements/${stmt}/finalize", payload: {}, as: BillingClerk }
            - { call: "GET /rescue-ops/client-accounts/${acct}", as: BillingClerk, captures: { bal_mid: "$.data.balance_cents" } }
            - { call: "POST /rescue-ops/statements/${stmt}/void", payload: {}, as: BillingClerk, captures: { stmt_status: "$.data.status" } }
            - { call: "GET /rescue-ops/client-accounts/${acct}", as: BillingClerk, captures: { bal_after: "$.data.balance_cents" } }
            - { call: "GET /rescue-ops/statements/${stmt}", as: BillingClerk, captures: { stmt_total: "$.data.total_cents", stmt_contrib: "$.data.billed_balance_contribution_cents" } }
          assert:
            - "Before finalize: ClientAccount.${acct}.balance_cents == 0 (generate does not debit)"
            - "After finalize: balance_cents == 80000 (contribution 0 -> 80000)"
            - "After void: balance_cents == 0 — the forward+compensating pair conserves balance_cents"
            - "BillingStatement.${stmt}.status == VOID, total_cents == 80000 (preserved for audit), billed_balance_contribution_cents == 0"

      - name: standby_create_cancel_committed_minutes_invariant
        grounds:
          - entities.Personnel.fields.committed_standby_minutes
          - state_machines.StandbyAssignment.SCHEDULED_to_CANCELLED
          - "endpoints[POST /rescue-ops/standby-assignments/{id}/cancel]"
        distinguishing_aspect: |
          Conserved quantity = time (Personnel.committed_standby_minutes) — DIFFERENT
          quantity from money in finalize_void_balance_invariant. Creating a 480-minute
          assignment raises the rescuer's committed minutes to 480; cancelling that
          SCHEDULED assignment returns it to exactly 0 with no charge accruing.
        test_recipe:
          setup:
            - "ISSUED permit with APPROVED plan; rescuer r1 with committed_standby_minutes == 0"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Minutes Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-M", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Minutes job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "GET /rescue-ops/personnel/${r1_id}", as: OperationsManager, captures: { mins_before: "$.data.committed_standby_minutes" } }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T08:00:00Z", standby_end_at: "2026-08-03T16:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "GET /rescue-ops/personnel/${r1_id}", as: OperationsManager, captures: { mins_mid: "$.data.committed_standby_minutes" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/cancel", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_status: "$.data.status" } }
            - { call: "GET /rescue-ops/personnel/${r1_id}", as: OperationsManager, captures: { mins_after: "$.data.committed_standby_minutes" } }
          assert:
            - "Before: Personnel.${r1_id}.committed_standby_minutes == 0"
            - "After create (window 08:00-16:00 = 480 min): committed_standby_minutes == 480"
            - "After cancel: committed_standby_minutes == 0 — the create/cancel pair conserves the committed-minutes quantity"
            - "StandbyAssignment.${sa}.status == CANCELLED and line_amount_cents == null (no charge for a SCHEDULED cancellation)"
