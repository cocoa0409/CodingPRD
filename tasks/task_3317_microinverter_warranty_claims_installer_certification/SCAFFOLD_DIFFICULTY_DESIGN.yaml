              payload: { system_id: "${sys_ci2}", transfer_kind: "SALE", new_owner_name: "V. Victor", new_owner_email: "v@victor.example", effective_date: "2026-08-25T00:00:00Z" }
              as: Homeowner
              captures: { tr_ci2: "$.data.id" }
            - call: "POST /warranty/warranty-transfers/${tr_ci2}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { ci2_sys_status: "$.data.status" }
            - call: "GET /warranty/installers/${inst_ci2}/portfolio"
              payload: {}
              as: PlatformAdmin
              captures: { ci2_approved_before: "$.data.labor_approved_cents_total", ci2_reversed_before: "$.data.labor_reversed_cents_total" }
          trigger:
            - call: "POST /warranty/labor-reimbursements/${lab_ci2}/reject"
              payload: { rejection_reason: "duplicate invoice" }
              as: PlatformAdmin
              captures: { ci2_lab_status: "$.data.status" }
            - call: "GET /warranty/installers/${inst_ci2}/portfolio"
              payload: {}
              as: PlatformAdmin
              captures: { ci2_approved_after: "$.data.labor_approved_cents_total", ci2_reversed_after: "$.data.labor_reversed_cents_total" }
          assert:
            - "the system is TRANSFERRED, yet the rejected claim's labor was still payable because claim payment keys on the claim status, not the system status"
            - "before the reject, labor_approved_cents_total == 34425 and labor_reversed_cents_total == 0"
            - "after the reject, LaborReimbursement.${lab_ci2}.status == REJECTED"
            - "labor_approved_cents_total == 0 and labor_reversed_cents_total == 34425"
            - "labor_approved_cents_total minus labor_reversed_cents_total == 0, the same net payable as before the forward action"