            - "Carrier.${c1_id}.version == 2 while posture is still OPEN and quota_target_units is still 0"
            - "Carrier.${c2_id}.licensed_territories is still the single element T02 and version is still 1 (one carrier's filing does not touch another's)"
            - "the exit notice returns 200 with Carrier.${c2_id}.status == EXIT_NOTICED"
