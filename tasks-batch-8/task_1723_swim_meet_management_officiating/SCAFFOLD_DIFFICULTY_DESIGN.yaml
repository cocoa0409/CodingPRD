  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  - rule_id: transitive_cascade
    instances:
      - name: dq_confirm_rescore_cascade_depth4
        grounds:
          - state_machines.Disqualification.UPHELD_to_CONFIRMED
          - state_machines.EventEntry.FINISHED_to_DQ
          - state_machines.Result.UNOFFICIAL_to_DQ_EXCLUDED
          - calculations.place_points
          - calculations.team_points_rollup
        distinguishing_aspect: |
          Depth-4 cascade from the DQ-confirm trigger (distinct from the relay-scratch trigger):
          Disqualification CONFIRMED mutates EventEntry (-> DQ); that mutation forces the Result row
          to DQ_EXCLUDED and re-runs place_points for surviving results; each re-pointed Result forces
          Team.provisional_points recomputation on TWO teams; SwimEvent.version bumps as the rescore
          receipt. Each hop is caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Event COMPLETED: A (team X) place 1 = 9.00, B and C (team Y) places 2-3 = 7.00/6.00; DQ recorded on A's lane post-completion, coach notified at 10:00, clock then moved past the 30-minute protest window"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "TC1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
