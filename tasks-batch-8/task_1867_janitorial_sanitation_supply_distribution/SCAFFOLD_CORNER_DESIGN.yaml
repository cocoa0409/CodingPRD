- section: endpoints
  instances:
  - name: run_daily_second_run_generates_nothing
    claim_type: side_effect_execution
    grounds:
    - endpoints
    - state_machines.StandingOrder
    distinguishing_aspect: 'Ops-run checkpoint: after a due standing order is generated, next_run_date advances 7d, so an immediate second sweep generates 0 orders — no duplicate generation.'
    test_recipe:
      setup:
      - Facility ACTIVE credit 1000000; product 1000 stock 500; ACTIVE weekly SO due 2026-08-01 (default clock)
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac AP
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-AP1
          name: AP
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 500
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/standing-orders
        payload:
          facility_id: ${fac_id}
          items:
          - product_id: ${prod_id}
            qty: 1
          frequency: WEEKLY
          next_run_date: '2026-08-01T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          so_id: $.data.id
      - call: POST /jansan/standing-orders/${so_id}/activate
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      trigger:
      - call: POST /jansan/ops/run-daily
        payload: {}
        as: DistributorAdmin
        captures:
          first_count: $.data.generated_count
      - call: POST /jansan/ops/run-daily
        payload: {}
        as: DistributorAdmin
        captures:
          second_count: $.data.generated_count
      assert:
      - first run generated_count == 1; second run generated_count == 0
      - StandingOrder.${so_id}.next_run_date == 2026-08-08T00:00:00Z after both runs (advanced exactly once)
  - name: substitution_proposal_expiry_sweep
    claim_type: side_effect_execution
    grounds:
    - state_machines.SubstitutionProposal.PENDING_to_EXPIRED
    distinguishing_aspect: 'Sweep expires a PENDING proposal past its 7-day TTL: proposal EXPIRED, line CANCELLED, single-line order auto-CANCELLED, committed credit released to 0.'
    test_recipe:
      setup:
      - Facility ACTIVE; short product 1000 stock 100 + substitute 900 stock 100; order 1 x short PLACED (subtotal 1000 + fee 4000 + surcharge 200 = total 6200, committed 6200); shortage declared so proposal
        PENDING with expires_at 2026-08-08T00:00:00Z
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac AQ
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-AQ1
          name: ShortQ
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          p_short: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-AQ2
          name: SubQ
          category: PAPER
          base_price_cents: 900
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          p_sub: $.data.id
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${p_short}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
      - call: POST /jansan/orders/${ord_id}/place
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/products/${p_short}/declare-shortage
        payload: {}
        as: DistributorAdmin
      - call: GET /jansan/substitution-proposals
        payload:
          status: PENDING
        as: DistributorAdmin
        captures:
          prop_id: $.data[0].id
      - call: POST /jansan/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-09T00:00:00Z'
        as: DistributorAdmin
      trigger:
      - call: POST /jansan/ops/run-daily
        payload: {}
        as: DistributorAdmin
        captures:
          expired_props: $.data.expired_proposal_ids
      assert:
      - expired_proposal_ids contains ${prop_id}; SubstitutionProposal.${prop_id}.status == EXPIRED
      - Order line (GET /jansan/order-lines?order_id=${ord_id}) [0].status == CANCELLED; Order.${ord_id}.status == CANCELLED
      - Facility.${fac_id}.committed_cents == 0 (6200 released)
- section: errors
  instances:
  - name: clock_regression_returns_error
    claim_type: violation_to_error
    grounds:
    - validations[priority=15]
    - errors[ERR_CLOCK_REGRESSION]
    distinguishing_aspect: 'Logical clock is monotonic: after setting 2026-08-02, setting 2026-08-01 is rejected with ERR_CLOCK_REGRESSION.'
    test_recipe:
      setup:
      - empty DB; clock at default 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /jansan/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-02T00:00:00Z'
        as: DistributorAdmin
      trigger:
      - call: POST /jansan/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: DistributorAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CLOCK_REGRESSION and http status 400
  - name: missing_auth_header_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request without X-User-Role/X-User-ID headers -> 401 ERR_UNAUTHENTICATED before any role or existence check.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /jansan/facilities/00000000-0000-4000-8000-000000000000
        payload: {}
        as: Anonymous
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHENTICATED and http status 401 (auth beats even the 404 this path would otherwise yield)
  - name: error_facility_inactive_on_place
    claim_type: violation_to_error
    grounds:
    - errors[ERR_FACILITY_INACTIVE]
    excluded_because:
      difficulty_instance: facility_inactive_beats_credit_exceeded
      rationale: ERR_FACILITY_INACTIVE trigger is asserted as the winning error in the named §1.8 instance.

- section: rbac
  instances:
    - name: facility_manager_cannot_award_bid_returns_forbidden
      claim_type: role_exclusive_deny
      grounds: ["roles[DistributorAdmin]", "errors[ERR_FORBIDDEN]"]
      distinguishing_aspect: "award is DistributorAdmin-exclusive; a FacilityManager attempt fails at priority 2 with ERR_FORBIDDEN regardless of bid state."
      test_recipe:
        setup: ["Product; bid UNDER_REVIEW"]
        setup_api_calls:
          - { call: "POST /jansan/products", payload: { sku: "SKU-RB1", name: "RB1", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
          - { call: "POST /jansan/contract-bids", payload: { bid_reference: "BID-RB", facility_group_code: "GPO-9", lines: [ { product_id: "${prod_id}", bid_price_cents: 800 } ], protection_start: "2026-09-01T00:00:00Z", protection_end: "2026-12-31T00:00:00Z" }, as: SalesRep, captures: { bid_id: $.data.id } }
          - { call: "POST /jansan/contract-bids/${bid_id}/submit", payload: {}, as: SalesRep }
          - { call: "POST /jansan/contract-bids/${bid_id}/open-review", payload: {}, as: SalesRep }
        trigger:
          - { call: "POST /jansan/contract-bids/${bid_id}/award", payload: {}, as: FacilityManager, captures: { err: $.data.error_id } }
        assert:
          - "error_id == ERR_FORBIDDEN and http status 403; ContractBid.${bid_id}.status remains UNDER_REVIEW"

    - name: sales_rep_cannot_create_product_returns_forbidden
      claim_type: role_exclusive_deny
