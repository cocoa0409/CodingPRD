              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
            - call: "GET /order-lines"
              payload: { sales_order_id: "${so_id}" }
              as: PlatformAdmin
              captures: { ol_id: "$.data[0].id" }
          trigger:
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { so_status_in_response: "$.data.fulfillment_status" }
          assert:
            - "${so_status_in_response} == ALLOCATED"
            - "Reel.${r1_id}.allocated_length_ft == 300"
            - "Reel.${r1_id}.available_length_ft == 700"
            - "Reel.${r1_id}.status == ALLOCATED_PARTIAL"
            - "OrderLine.${ol_id}.allocation_status == FULLY_ALLOCATED"
            - "SalesOrder.${so_id}.version == 2"
