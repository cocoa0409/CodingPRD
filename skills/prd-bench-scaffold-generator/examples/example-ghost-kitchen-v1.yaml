# =============================================================================
# Example: ghost-kitchen benchmark seed tables (v1)
# =============================================================================

scenario: |
  Ghost Kitchen API for automated food preparation and delivery. Manages meal
  orders, recipes, cooking steps, robotic cooking stations, task executions,
  and food safety protocols. Enforces cleaning cycles between station usage,
  rushed order penalties, food quality scoring with override locks, utensil
  compatibility, and chronological final cost calculation.

domain_name: ghost-kitchen
api_prefix: /meal-orders

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: MealOrder
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: order_name, type: string, source: input, description: "Order name (e.g., Order for Jane Doe)" }
      - { name: total_payment, type: number, source: input, description: "Total payment received for all items" }
      - { name: cost_balance, type: number, source: computed, description: "Read-only: remaining funds after provisional and finalized costs; initialized to total_payment" }
      - { name: food_quality_score, type: integer, source: computed, description: "Read-only: deviations from ideal quality, starts at 0, lower is better" }
      - { name: status, type: enum, source: system, description: "PREPARING → COOKING → QUALITY_CHECK_PENDING → COMPLETE" }

  - name: Recipe
    parent: MealOrder
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "Parent Meal Order ID" }
      - { name: name, type: string, source: input, description: "Recipe name (e.g., Deluxe Burger)" }
      - { name: start_time, type: integer, source: input, description: "Recipe start time as Unix timestamp" }
      - { name: end_time, type: integer, source: input, description: "Recipe end time (must be > start_time)" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_COOKING / CANCELLED" }

  - name: CookingStep
    parent: Recipe
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "Parent Meal Order ID" }
      - { name: recipe_id, type: string, source: system, description: "Parent Recipe ID" }
      - { name: task_type, type: string, source: input, description: "Type of cooking task (e.g., GrillPatty)" }
      - { name: start_time, type: integer, source: input, description: "Step start time as Unix timestamp" }
      - { name: end_time, type: integer, source: input, description: "Step end time (must be > start_time)" }
      - { name: duration_minutes, type: number, source: computed, description: "Read-only: derived from start_time and end_time" }
      - { name: required_utensil, type: enum, source: input, default: "NONE", description: "SPATULA_ATTACHMENT | WHISK_HEAD | NONE" }
      - { name: status, type: enum, source: system, description: "PENDING → SCHEDULED → ASSIGNED / CANCELLED" }

  - name: CookingStation
    parent: MealOrder
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "Parent Meal Order ID" }
      - { name: station_name, type: string, source: input, description: "Station name" }
      - { name: station_type, type: string, source: input, description: "Station type (e.g., RoboChef-5000)" }
      - { name: ingredient_and_energy_cost_per_minute, type: number, source: input, description: "Operating cost per minute" }
      - { name: utensil_capabilities, type: array, source: system, description: "List of utensils, each with id, name, installed_date" }

  - name: TaskExecution
    parent: MealOrder
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "Parent Meal Order ID" }
      - { name: cooking_step_id, type: string, source: input, description: "Associated Cooking Step ID" }
      - { name: station_id, type: string, source: input, description: "Associated Cooking Station ID" }
      - { name: override_quality_check, type: boolean, source: input, default: false, description: "Whether to bypass food quality lock (HeadChef only)" }
      - { name: quality_check_override_penalty_applied, type: boolean, source: computed, description: "True if override penalty (+40 points) was applied" }
      - { name: is_rushed_order, type: boolean, source: computed, description: "True if step starts before MINIMUM_THAW_TIME_HOURS after order creation" }
      - { name: provisional_cost, type: number, source: computed, description: "Provisional cost (includes rushed rate if applicable)" }
      - { name: final_cost, type: number, source: computed, description: "Final cost calculated during finalization (null until then)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ACKNOWLEDGED → BOUND → FINALIZED / REJECTED / CANCELLED" }

  - name: FoodSafetyProtocol
    parent: MealOrder
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "Parent Meal Order ID" }
      - { name: station_id_1, type: string, source: input, description: "First station in the incompatible pair" }
      - { name: station_id_2, type: string, source: input, description: "Second station in the incompatible pair" }
      - { name: reason, type: string, source: input, required: false, description: "Optional explanation for the protocol" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MealOrder
    initial_state: PREPARING
    terminal_states: [COMPLETE]
    transitions:
      - from: PREPARING
        to: COOKING
        trigger: POST /meal-orders/{orderId}/begin-cooking
        actor: Any
        preconditions:
          - "Order must be in PREPARING state (ERR_ORDER_NOT_IN_PREPARING)"
        side_effects: []

      - from: COOKING
        to: QUALITY_CHECK_PENDING
        trigger: POST /meal-orders/{orderId}/finish-cooking
        actor: Any
        preconditions:
          - "Order must be in COOKING state (ERR_ORDER_NOT_COOKING)"
          - "All task executions must be resolved: terminal (REJECTED, CANCELLED) or BOUND (ERR_UNRESOLVED_RECORDS_EXIST)"
        side_effects: []

      - from: QUALITY_CHECK_PENDING
        to: COMPLETE
        trigger: POST /meal-orders/{orderId}/mark-order-complete
        actor: Any
        preconditions:
          - "Order must be in QUALITY_CHECK_PENDING state (ERR_ORDER_NOT_READY_FOR_COMPLETION)"
          - "Total finalized_debits must not exceed total_payment (ERR_FINALIZATION_EXCEEDS_PAYMENT)"
        side_effects:
          - "All BOUND task executions: compute final_cost → FINALIZED"
          - "food_quality_score reconciled (rushed status re-evaluated)"
          - "cost_balance finalized"
          - "Provisional debits cleared to 0.0"

  - entity: Recipe
    initial_state: PLANNING
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_COOKING
        trigger: PUT /meal-orders/{orderId}/recipes/{recipeId}
        actor: Any
        preconditions:
          - "Recipe must have at least one CookingStep"
          - "All CookingSteps must be in ASSIGNED state (ERR_STEPS_NOT_ASSIGNED)"
        side_effects: []

      - from: READY_FOR_COOKING
        to: PLANNING
        trigger: "system (automatic when a step's assignment is cancelled, breaking readiness)"
        actor: system
        preconditions:
          - "A child step is no longer ASSIGNED"
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /meal-orders/{orderId}/recipes/{recipeId}
        actor: Any
        preconditions: []
        side_effects:
          - "All child CookingSteps → CANCELLED"
          - "All associated non-terminal TaskExecutions → CANCELLED with ledger reversals"
          - "Reversed: provisional costs, rushed order penalties (20 pts), override penalties (40 pts)"

      - from: READY_FOR_COOKING
        to: CANCELLED
        trigger: PUT /meal-orders/{orderId}/recipes/{recipeId}
        actor: Any
        preconditions: []
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: CookingStep
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "system (automatic when task execution proposed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: ASSIGNED
        trigger: "system (automatic when task execution bound)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: PENDING
        trigger: "system (automatic when task execution rejected/cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: PENDING
        trigger: "system (automatic when BOUND task execution cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from recipe cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from recipe cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (cascade from recipe cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TaskExecution
    initial_state: PROPOSED
    terminal_states: [FINALIZED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACKNOWLEDGED
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/acknowledge
        actor: Any
        preconditions:
          - "Record must be PROPOSED (ERR_RECORD_NOT_PROPOSED)"
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/reject
        actor: Any
        preconditions:
          - "Record must be PROPOSED (ERR_RECORD_NOT_PROPOSED)"
        side_effects:
          - "CookingStep reverts to PENDING"
          - "Provisional cost reversed from FoodCostLedger"
          - "Food quality penalties reversed"

      - from: ACKNOWLEDGED
        to: BOUND
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/bind
        actor: Operator
        preconditions:
          - "Record must be ACKNOWLEDGED (ERR_RECORD_NOT_ACKNOWLEDGED)"
          - "CookingStep must be SCHEDULED (ERR_STEP_NOT_SCHEDULED)"
          - "Cleaning cycle re-checked against ACKNOWLEDGED, BOUND, FINALIZED records"
          - "provisional_cost recalculated (rushed status re-evaluated)"
          - "New cost must not exceed cost_balance (ERR_INSUFFICIENT_FUNDS)"
        side_effects:
          - "CookingStep → ASSIGNED"
          - "provisional_cost and is_rushed_order updated"
          - "FoodCostLedger and FoodQualityScore adjusted for cost/rushed changes"

      - from: PROPOSED
        to: CANCELLED
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/cancel
        actor: Operator
        preconditions:
          - "Record must not be in terminal state (ERR_RECORD_NOT_CANCELLABLE)"
        side_effects:
          - "CookingStep reverts to PENDING"
          - "Provisional cost reversed"
          - "Food quality penalties reversed"
          - "If parent Recipe was READY_FOR_COOKING, demote to PLANNING"

      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/cancel
        actor: Operator
        preconditions:
          - "Same as PROPOSED → CANCELLED"
        side_effects:
          - "Same as PROPOSED → CANCELLED"

      - from: BOUND
        to: CANCELLED
        trigger: POST /meal-orders/{orderId}/task-executions/{recordId}/cancel
        actor: Operator
        preconditions:
          - "Same as PROPOSED → CANCELLED"
        side_effects:
          - "CookingStep reverts to PENDING"
          - "Provisional cost reversed"
          - "Food quality penalties reversed"
          - "If parent Recipe was READY_FOR_COOKING, demote to PLANNING"

      - from: BOUND
        to: FINALIZED
        trigger: "system (automatic during mark-order-complete)"
        actor: system
        preconditions: []
        side_effects:
          - "final_cost calculated (chronological order by step start_time)"
          - "Provisional cost moved from provisional_debits to finalized_debits"
          - "food_quality_score reconciled (rushed status re-evaluated)"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_cost
    trigger: "task execution proposal and binding"
    algorithm: cost_with_multiplier
    formula: |
      base_cost = ingredient_and_energy_cost_per_minute * duration_minutes
      if is_rushed_order:
        provisional_cost = base_cost * RUSHED_RATE_MULTIPLIER
      else:
        provisional_cost = base_cost
    constants:
      RUSHED_RATE_MULTIPLIER: 1.5
    precision: "2 decimal places"
    note: "Recalculated at binding; may differ from proposal estimate"

  - name: is_rushed_order
    trigger: "Calculated in sync with provisional_cost"
    algorithm: threshold
    formula: |
      time_since_order_creation = step.start_time - order.created_at
      if time_since_order_creation < MINIMUM_THAW_TIME_HOURS:
        is_rushed_order = true
      else:
        is_rushed_order = false
    constants:
      MINIMUM_THAW_TIME_HOURS: 1  # hour (3600 seconds)

  - name: final_cost
    trigger: "order completion (mark-order-complete)"
    algorithm: chronological
    formula: |
      1. Collect all BOUND task executions for the order
      2. Sort by cooking_step.start_time ascending, then task_execution.created_at ascending
      3. For each execution:
           base_cost = cost_per_minute * duration_minutes
           Re-evaluate is_rushed_order based on order.created_at and step.start_time
           if is_rushed_order:
             final_cost = base_cost * RUSHED_RATE_MULTIPLIER
           else:
             final_cost = base_cost
      4. Total finalized_debits must not exceed total_payment
    constants:
      RUSHED_RATE_MULTIPLIER: 1.5
    precision: "2 decimal places"

  - name: cost_balance_update
    trigger: "task execution propose, bind, reject, cancel, finalize"
    algorithm: aggregation
    formula: |
      cost_balance = total_payment - provisional_debits - finalized_debits
      Proposal: provisional_debits += provisional_cost
      Bind: provisional_debits adjusted (refund old, debit new)
      Reject/Cancel: provisional_debits -= provisional_cost
      Finalize: finalized_debits += final_cost, provisional cleared to 0.0

  - name: food_quality_score
    trigger: "task execution propose, bind, reject, cancel"
    algorithm: aggregation
    formula: |
      Proposal:
        if is_rushed_order: score += RUSHED_PENALTY
        if is_rushed_order AND score (after penalty) >= FOOD_QUALITY_LOCK:
          if NOT override_quality_check: reject ERR_QUALITY_THRESHOLD_BREACHED
          if override_quality_check (HeadChef only): score += OVERRIDE_PENALTY
      Bind: if rushed status changed, adjust ±RUSHED_PENALTY
      Reject/Cancel: reverse all assessed penalties (rushed + override)
      Finalize: reconcile based on final rushed determination
      Floor: score never goes below 0
    constants:
      RUSHED_PENALTY: 20
      OVERRIDE_PENALTY: 40
      FOOD_QUALITY_LOCK: 100

  - name: cleaning_cycle_check
    trigger: "task execution proposal and binding"
    algorithm: time_gap
    formula: |
      For the same CookingStation within the same MealOrder:
        Check against records in PROPOSED, ACKNOWLEDGED, BOUND, FINALIZED state (at proposal)
        Check against records in ACKNOWLEDGED, BOUND, FINALIZED state (at binding)
        gap = |stepA.end_time - stepB.start_time| or |stepB.end_time - stepA.start_time|
        minimum of (|stepA.start - stepB.end|, |stepB.start - stepA.end|) must be >= CLEANING_CYCLE_MINUTES
        if gap < CLEANING_CYCLE_MINUTES: reject ERR_CLEANING_CYCLE_VIOLATION
    constants:
      CLEANING_CYCLE_MINUTES: 15  # minutes (converted to time units as needed)

  - name: food_safety_protocol_check
    trigger: "task execution proposal"
    algorithm: pairing
    formula: |
      If a FoodSafetyProtocol pairs station_id_1 and station_id_2:
        and one station already has a committed execution in a Recipe
        (committed = PROPOSED, ACKNOWLEDGED, BOUND, FINALIZED):
        then the other station cannot be used for a step in the same Recipe.
        Violation: ERR_FOOD_SAFETY_VIOLATION

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist and belong to correct parent"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_ORDER_NOT_FOUND, ERR_RECIPE_NOT_FOUND, ERR_STEP_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_RECORD_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 3
    category: state
    check: "Parent Meal Order must be in COOKING state for write operations"
    error_id: ERR_ORDER_NOT_COOKING
    http_status: 409
    applies_to: "Create recipes, cooking steps, task executions, cooking stations"

  - priority: 4
    category: state
    check: "Target resource must be in correct state for the operation"
    error_id: "varies (ERR_STEP_NOT_PENDING, ERR_RECORD_NOT_PROPOSED, ERR_RECORD_NOT_ACKNOWLEDGED, etc.)"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 5
    category: business_safety
    check: "Utensil compatibility: station must have required utensil for the step"
    error_id: ERR_UTENSIL_MISMATCH
    http_status: 400
    applies_to: "POST /task-executions (proposal)"

  - priority: 6
    category: business_safety
    check: "Cleaning cycle: minimum 15 min gap between steps on the same station"
    error_id: ERR_CLEANING_CYCLE_VIOLATION
    http_status: 409
    applies_to: "POST /task-executions (proposal), POST /task-executions/{id}/bind"

  - priority: 7
    category: business_safety
    check: "Food safety protocol: paired stations cannot both be used in the same recipe"
    error_id: ERR_FOOD_SAFETY_VIOLATION
    http_status: 409
    applies_to: "POST /task-executions (proposal)"

  - priority: 8
    category: business_quality
    check: "Food quality lock: rushed order blocked when score >= 100 (unless HeadChef override)"
    error_id: ERR_QUALITY_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /task-executions (proposal)"

  - priority: 9
    category: business_fiscal
    check: "Cost balance must be sufficient for provisional_cost"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /task-executions (proposal), POST /task-executions/{id}/bind"

# =============================================================================
# Table 5: API Endpoint Table (27 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- MealOrder ---
  - method: POST
    path: "/meal-orders"
    description: "Create a new Meal Order"
    roles: [Any]
    code: 201
    input: [order_name, total_payment]
    output: MealOrder
    side_effects: ["cost_balance initialized to total_payment, food_quality_score to 0, status to PREPARING"]

  - method: GET
    path: "/meal-orders"
    description: "List all Meal Orders"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "MealOrder[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}"
    description: "Get a specific Meal Order"
    roles: [Any]
    code: 200
    input: []
    output: MealOrder
    side_effects: []

  - method: POST
    path: "/meal-orders/{orderId}/begin-cooking"
    description: "Begin cooking an order"
    roles: [Any]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["status → COOKING"]

  - method: POST
    path: "/meal-orders/{orderId}/finish-cooking"
    description: "Move order to quality check pending"
    roles: [Any]
    code: 200
    input: []
    output: MealOrder
    side_effects:
      - "status → QUALITY_CHECK_PENDING"
      - "Precondition: all task executions resolved (ERR_UNRESOLVED_RECORDS_EXIST)"

  - method: POST
    path: "/meal-orders/{orderId}/mark-order-complete"
    description: "Finalize costs and complete the order"
    roles: [Any]
    code: 200
    input: []
    output: MealOrder
    side_effects:
      - "status → COMPLETE"
      - "All BOUND task executions: compute final_cost → FINALIZED"
      - "food_quality_score reconciled"
      - "cost_balance finalized"
      - "Provisional debits cleared to 0.0"

  # --- Recipe ---
  - method: POST
    path: "/meal-orders/{orderId}/recipes"
    description: "Create a new Recipe within an Order"
    roles: [Any]
    code: 201
    input: [name, start_time, end_time]
    output: Recipe
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/recipes"
    description: "List Recipes for an Order"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Recipe[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/recipes/{recipeId}"
    description: "Get a specific Recipe"
    roles: [Any]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: PUT
    path: "/meal-orders/{orderId}/recipes/{recipeId}"
    description: "Update a Recipe's status"
    roles: [Any]
    code: 200
    input: [status]
    output: Recipe
    side_effects:
      - "PLANNING → READY_FOR_COOKING (requires all steps ASSIGNED)"
      - "PLANNING/READY_FOR_COOKING → CANCELLED (cascade cancellation)"

  # --- CookingStep ---
  - method: POST
    path: "/meal-orders/{orderId}/recipes/{recipeId}/cooking-steps"
    description: "Create a new Cooking Step for a Recipe"
    roles: [Any]
    code: 201
    input: [task_type, start_time, end_time, "required_utensil?"]
    output: CookingStep
    side_effects: ["duration_minutes auto-calculated"]

  - method: GET
    path: "/meal-orders/{orderId}/recipes/{recipeId}/cooking-steps"
    description: "List Cooking Steps for a Recipe"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "CookingStep[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/recipes/{recipeId}/cooking-steps/{stepId}"
    description: "Get a specific Cooking Step"
    roles: [Any]
    code: 200
    input: []
    output: CookingStep
    side_effects: []

  # --- TaskExecution ---
  - method: POST
    path: "/meal-orders/{orderId}/task-executions"
    description: "Propose a new station execution for a Cooking Step"
    roles: [Any]
    code: 201
    input: [cooking_step_id, station_id, "override_quality_check?"]
    output: TaskExecution
    side_effects:
      - "Calculate provisional_cost and is_rushed_order"
      - "Debit provisional_cost to FoodCostLedger"
      - "Update food_quality_score"
      - "CookingStep → SCHEDULED"
      - "Validation chain: utensil, cleaning cycle, food safety, quality lock, budget"

  - method: GET
    path: "/meal-orders/{orderId}/task-executions"
    description: "List all Task Executions for an Order"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "TaskExecution[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/task-executions/{recordId}"
    description: "Get a specific Task Execution"
    roles: [Any]
    code: 200
    input: []
    output: TaskExecution
    side_effects: []

  - method: POST
    path: "/meal-orders/{orderId}/task-executions/{recordId}/acknowledge"
    description: "Acknowledge a proposed execution"
    roles: [Any]
    code: 200
    input: []
    output: TaskExecution
    side_effects: ["status → ACKNOWLEDGED"]

  - method: POST
    path: "/meal-orders/{orderId}/task-executions/{recordId}/reject"
    description: "Reject a proposed execution"
    roles: [Any]
    code: 200
    input: []
    output: TaskExecution
    side_effects:
      - "status → REJECTED"
      - "CookingStep reverts to PENDING"
      - "Provisional cost reversed"
      - "Food quality penalties reversed"

  - method: POST
    path: "/meal-orders/{orderId}/task-executions/{recordId}/bind"
    description: "Bind an acknowledged execution"
    roles: [Operator]
    code: 200
    input: []
    output: TaskExecution
    side_effects:
      - "status → BOUND"
      - "CookingStep → ASSIGNED"
      - "Cleaning cycle re-checked"
      - "provisional_cost and is_rushed_order recalculated"
      - "FoodCostLedger and FoodQualityScore adjusted"

  - method: POST
    path: "/meal-orders/{orderId}/task-executions/{recordId}/cancel"
    description: "Cancel a task execution"
    roles: [Operator]
    code: 200
    input: []
    output: TaskExecution
    side_effects:
      - "status → CANCELLED"
      - "CookingStep reverts to PENDING"
      - "Provisional cost reversed"
      - "Food quality penalties reversed"
      - "If parent Recipe was READY_FOR_COOKING, demote to PLANNING"

  # --- CookingStation ---
  - method: POST
    path: "/meal-orders/{orderId}/cooking-stations"
    description: "Create a new Cooking Station profile"
    roles: [Any]
    code: 201
    input: [station_name, station_type, ingredient_and_energy_cost_per_minute]
    output: CookingStation
    side_effects: ["utensil_capabilities initialized to empty array"]

  - method: GET
    path: "/meal-orders/{orderId}/cooking-stations"
    description: "List Cooking Stations for an Order"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "CookingStation[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/cooking-stations/{stationId}"
    description: "Get a specific Cooking Station"
    roles: [Any]
    code: 200
    input: []
    output: CookingStation
    side_effects: []

  - method: POST
    path: "/meal-orders/{orderId}/cooking-stations/{stationId}/utensil-capabilities"
    description: "Add a utensil capability to a Cooking Station"
    roles: [Any]
    code: 201
    input: ["name (SPATULA_ATTACHMENT | WHISK_HEAD), installed_date"]
    output: CookingStation
    side_effects: ["Utensil added to utensil_capabilities array"]

  # --- FoodSafetyProtocol ---
  - method: POST
    path: "/meal-orders/{orderId}/food-safety-protocols"
    description: "Create a Food Safety Protocol"
    roles: [Any]
    code: 201
    input: [station_id_1, station_id_2, "reason?"]
    output: FoodSafetyProtocol
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/food-safety-protocols"
    description: "List Food Safety Protocols for an Order"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "FoodSafetyProtocol[]"
    side_effects: []

  - method: GET
    path: "/meal-orders/{orderId}/food-safety-protocols/{protocolId}"
    description: "Get a specific Food Safety Protocol"
    roles: [Any]
    code: 200
    input: []
    output: FoodSafetyProtocol
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue (29 error codes)
# =============================================================================
errors:
  # --- Authentication ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  # --- Resource Not Found ---
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Meal order with given orderId does not exist"

  - id: ERR_RECIPE_NOT_FOUND
    http: 404
    condition: "Recipe with given recipeId does not exist in the order"

  - id: ERR_STEP_NOT_FOUND
    http: 404
    condition: "Cooking step with given stepId does not exist"

  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "Cooking station with given stationId does not exist"

  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "Task execution record with given recordId does not exist"

  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "Food safety protocol with given protocolId does not exist"

  # --- State Constraints ---
  - id: ERR_ORDER_NOT_COOKING
    http: 409
    condition: "Operation requires meal order to be in COOKING state"

  - id: ERR_ORDER_NOT_IN_PREPARING
    http: 409
    condition: "begin-cooking requires order to be in PREPARING state"

  - id: ERR_ORDER_NOT_READY_FOR_COMPLETION
    http: 409
    condition: "mark-order-complete requires order to be in QUALITY_CHECK_PENDING state"

  - id: ERR_STEP_NOT_PENDING
    http: 409
    condition: "Step must be in PENDING state to create a task execution"

  - id: ERR_STEP_NOT_SCHEDULED
    http: 409
    condition: "Step must be in SCHEDULED state for binding"

  - id: ERR_RECORD_NOT_PROPOSED
    http: 409
    condition: "acknowledge/reject requires record to be in PROPOSED state"

  - id: ERR_RECORD_NOT_ACKNOWLEDGED
    http: 409
    condition: "bind requires record to be in ACKNOWLEDGED state"

  - id: ERR_RECORD_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires record to not be in a terminal state"

  - id: ERR_ILLEGAL_RECIPE_STATE_TRANSITION
    http: 409
    condition: "Recipe state transition is invalid"

  - id: ERR_STEPS_NOT_ASSIGNED
    http: 409
    condition: "Not all steps are ASSIGNED when transitioning recipe to READY_FOR_COOKING"

  - id: ERR_UNRESOLVED_RECORDS_EXIST
    http: 409
    condition: "Unresolved task executions exist when finishing cooking"

  # --- Business Validation ---
  - id: ERR_INVALID_PAYLOAD
    http: 400
    condition: "General request format error (missing required fields, type mismatch)"

  - id: ERR_INVALID_RECIPE_TIMES
    http: 400
    condition: "Recipe end_time not after start_time"

  - id: ERR_INVALID_STEP_TIMES
    http: 400
    condition: "Step end_time not after start_time"

  - id: ERR_SELF_EXCLUSION
    http: 400
    condition: "Station cannot have a food safety protocol with itself"

  - id: ERR_UTENSIL_MISMATCH
    http: 400
    condition: "Station does not have the utensil required by the cooking step"

  - id: ERR_CLEANING_CYCLE_VIOLATION
    http: 409
    condition: "Insufficient cleaning time (< 15 min gap) between steps on the same station"

  - id: ERR_FOOD_SAFETY_VIOLATION
    http: 409
    condition: "Paired stations cannot both be used for steps in the same recipe"

  # --- Quality & Financial ---
  - id: ERR_QUALITY_THRESHOLD_BREACHED
    http: 403
    condition: "Rushed order would cause food_quality_score >= 100 and override not set (or not HeadChef)"

  - id: ERR_INSUFFICIENT_PRIVILEGES
    http: 403
    condition: "Only HeadChef can use override_quality_check flag"

  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "provisional_cost exceeds current cost_balance"

  - id: ERR_FINALIZATION_EXCEEDS_PAYMENT
    http: 402
    condition: "Total finalized_debits exceed total_payment at order completion"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: HeadChef
    description: "Head chef with authority to override food quality locks"
    exclusive_operations:
      - "Can use override_quality_check flag on task execution proposals"

  - name: Operator
    description: "Kitchen operator responsible for binding and cancelling task executions"
    exclusive_operations:
      - "POST .../task-executions/{id}/bind — Bind an acknowledged execution"
      - "POST .../task-executions/{id}/cancel — Cancel a task execution"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "POST /meal-orders — Create order"
      - "GET /meal-orders — List orders"
      - "GET /meal-orders/{orderId} — Get order"
      - "POST .../begin-cooking — Begin cooking"
      - "POST .../finish-cooking — Finish cooking"
      - "POST .../mark-order-complete — Complete order"
      - "POST .../recipes — Create recipe"
      - "GET .../recipes — List recipes"
      - "GET .../recipes/{id} — Get recipe"
      - "PUT .../recipes/{id} — Update recipe status"
      - "POST .../cooking-steps — Create cooking step"
      - "GET .../cooking-steps — List steps"
      - "GET .../cooking-steps/{id} — Get step"
      - "POST .../task-executions — Propose execution"
      - "GET .../task-executions — List executions"
      - "GET .../task-executions/{id} — Get execution"
      - "POST .../task-executions/{id}/acknowledge — Acknowledge"
      - "POST .../task-executions/{id}/reject — Reject"
      - "POST .../cooking-stations — Create station"
      - "GET .../cooking-stations — List stations"
      - "GET .../cooking-stations/{id} — Get station"
      - "POST .../cooking-stations/{id}/utensil-capabilities — Add utensil"
      - "POST .../food-safety-protocols — Create protocol"
      - "GET .../food-safety-protocols — List protocols"
      - "GET .../food-safety-protocols/{id} — Get protocol"
