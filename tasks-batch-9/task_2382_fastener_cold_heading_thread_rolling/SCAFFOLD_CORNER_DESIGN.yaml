      - name: part_spec_patch_is_partial_and_rederives_the_bake_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /part-specs/{id}]
          - calculations.he_bake_compliance
          - entities.PartSpec.fields.he_bake_required
        distinguishing_aspect: >
          A PATCH touches only the supplied keys — nominal_pack_count 250 leaves count_tolerance_pct and
          the hardness window alone but re-derives count_tolerance_pieces at the next pack — and changing
          plating_spec from NONE to ZINC_CLEAR flips he_bake_required to true with he_bake_min_minutes 240
          for a CLASS_10_9 part, each PATCH bumping version by exactly 1.
        test_recipe:
          setup:
            - "Part spec NP-M8-088 created with plating_spec NONE, nominal_pack_count 100 and the default count_tolerance_pct 0.02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
          trigger:
            - call: "PATCH /part-specs/${spec_id}"
              payload: { nominal_pack_count: 250 }
              as: ProcessEngineer
            - call: "PATCH /part-specs/${spec_id}"
              payload: { plating_spec: "ZINC_CLEAR" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /part-specs/${spec_id}"
              payload: {}
              as: ShippingClerk
              as_user_id: "ship-1"
          assert:
            - "After the first PATCH: version == 2, nominal_pack_count == 250, count_tolerance_pct == 0.02, min_core_hardness_hv == 304, max_core_hardness_hv == 361, max_decarb_depth_mm == 0.100, plating_spec == NONE"
            - "At version 2 he_bake_required is still false and he_bake_min_minutes is still 0"
            - "After the second PATCH: version == 3, plating_spec == ZINC_CLEAR, he_bake_required == true and he_bake_min_minutes == 240 (CLASS_10_9, not 480)"
            - "The GET echoes version 3 with nominal_pack_count 250 and thread_timing BEFORE_HEAT_TREAT unchanged, and created_at unchanged while updated_at advanced"

      - name: heading_completion_endpoint_side_effect_chain
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: heading_completion_wears_tool_and_holds_sibling_setup_lot
          rationale: >
            POST /production-lots/{id}/complete-heading declares five side effects and the §1.8 instance
            verifies all of them in one pass — piece counts, the wire ledger settlement, the tool counter
            and utilization snapshot, the MOUNTED to WORN flip and the sibling SETUP lot going on hold with
            hold_source TOOL_WEAR — so an endpoint-level corner would duplicate it.

