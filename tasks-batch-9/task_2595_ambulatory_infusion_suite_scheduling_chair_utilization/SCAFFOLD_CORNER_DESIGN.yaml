      - name: a_superseded_regimen_refuses_bookings_resumes_and_further_revisions
        claim_type: triggerable
        grounds:
          - validations[priority 47]
          - errors[ERR_PLAN_SUPERSEDED]
          - endpoints[POST /treatment-plans/{id}/revisions]
          - state_machines[TreatmentPlan].transitions[ACTIVE -> SUPERSEDED]
        distinguishing_aspect: |
          SUPERSEDED is terminal on all three write surfaces the rule lists, so one dose
          revision closes the old plan to booking, to resume and to a second revision — the
          last one even when the caller supplies the correct bumped version, proving the
          state check outranks the OCC comparison. The successor plan created by the same
          call is immediately bookable, so the refusals are about the old row alone.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Standing center, chair, nurse (capacity 12), drug, MID template, one 70 kg patient."
            - "Plan P1 at 10 mg/kg with total_cycles 6 (version 1) holds one TENTATIVE visit on 2026-08-10 at 540."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id, pl1_v1: $.data.version }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${pl1}/revisions"
              payload: { dose_mg_per_kg: 12, total_cycles: 6, premed_waived: false, expected_treatment_plan_version: "${pl1_v1}" }
              as: MedicalDirector
              captures: { pl2: $.data.id, pl2_supersedes: $.data.supersedes_plan_id, pl2_status: $.data.status }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { e_book: $.data.error_id }
            - call: "POST /treatment-plans/${pl1}/resume"
              payload: { reason: "Attempt to revive the old dose" }
              as: MedicalDirector
              captures: { e_resume: $.data.error_id }
            - call: "GET /treatment-plans/${pl1}"
              payload: {}
              as: MedicalDirector
              captures: { pl1_v2: $.data.version, pl1_superseded: $.data.status }
            - call: "POST /treatment-plans/${pl1}/revisions"
              payload: { dose_mg_per_kg: 14, total_cycles: 6, premed_waived: false, expected_treatment_plan_version: "${pl1_v2}" }
              as: MedicalDirector
              captures: { e_revise: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl2}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id, ap2_chair: $.data.chair_id }
          assert:
            - "First trigger HTTP status == 201 with ${pl2_status} == 'ACTIVE' and ${pl2_supersedes} == ${pl1}"
            - "TreatmentPlan.${pl1}.status == 'SUPERSEDED' and version == 2"
            - "Appointment.${ap1}.schedule_status == 'CANCELLED' with cancellation_charge_cents == 0, chair_id null and nurse_id null"
            - "${e_book} == 'ERR_PLAN_SUPERSEDED' with HTTP 409"
            - "${e_resume} == 'ERR_PLAN_SUPERSEDED' — resume is refused even though the plan is not SUSPENDED for a different reason"
            - "${pl1_superseded} == 'SUPERSEDED' and ${pl1_v2} == 2"
            - "${e_revise} == 'ERR_PLAN_SUPERSEDED' — the supplied expected_treatment_plan_version is the row's CURRENT version, so this is the state check firing, not an OCC failure"
