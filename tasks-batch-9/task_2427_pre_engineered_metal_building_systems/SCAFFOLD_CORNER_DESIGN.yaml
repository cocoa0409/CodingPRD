      - name: sealed_drawings_outrank_the_credit_gate_on_release
        claim_type: priority_ordering
        grounds:
          - validations[priority=10, error_id=ERR_DRAWINGS_NOT_SEALED]
          - validations[priority=15, error_id=ERR_BUILDER_CREDIT_EXCEEDED]
        excluded_because:
          difficulty_instance: drawings_not_sealed_beats_credit_exceeded_on_release
          rationale: "That §1.8 instance builds a release request that violates both rules at once and asserts the priority-10 state error wins over the priority-15 money error, which is exactly this ordering claim."

      - name: two_rules_violated_in_one_request_resolve_by_declared_priority
        claim_type: priority_conflict
        grounds:
          - validations[priority=11, error_id=ERR_CONNECTION_DETAILS_INCOMPLETE]
          - validations[priority=12, error_id=ERR_SEAL_LICENSE_STATE_MISMATCH]
        excluded_because:
          difficulty_instance: connection_details_incomplete_beats_seal_license_mismatch
          rationale: "The §1.8 instance already seals a package that is both missing a BASE detail and licensed in the wrong state, and pins the 422 to the priority-11 code, so a second priority-conflict corner would repeat it."

      - name: design_creation_reads_state_from_the_referenced_configuration
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10, error_id=ERR_CONFIGURATION_NOT_LOCKED]
        excluded_because:
          difficulty_instance: design_create_requires_configuration_locked
          rationale: "That §1.8 instance already drives the cross-entity read in both directions — a DRAFT and a CRITERIA_STALE configuration both blocking design creation with ERR_CONFIGURATION_NOT_LOCKED, and the same call succeeding once the configuration is LOCKED."

      - name: unload_capacity_is_an_aggregate_not_a_pairwise_check
        claim_type: aggregate_validation
        grounds:
          - calculations.site_unload_capacity_check
          - validations[priority=14, error_id=ERR_SITE_UNLOAD_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: site_unload_closed_window_aggregate_capacity
          rationale: "The §1.8 instance is built precisely on the aggregate count: two individually harmless endpoint-touching overlaps together reach site_delivery_capacity and only then trigger the error, across orders sharing the job_site_code."

  - section: endpoints
    instances:
      - name: production_line_create_read_and_default_buffer_roundtrip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /production-lines]
          - endpoints[GET /production-lines/{id}]
          - entities.ProductionLine.fields.changeover_buffer_minutes
        distinguishing_aspect: "ProductionLine is the scaffold's plain create-and-read resource: the create echoes what the read returns, changeover_buffer_minutes falls back to 120 when omitted and is honoured verbatim when supplied, and an unknown id on the read is ERR_LINE_NOT_FOUND rather than an empty 200."
        test_recipe:
          setup:
            - "Empty database; clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /production-lines"
              payload: { code: "PL-1", name: "Plate Line 1", line_type: "PLATE_CUT_WELD" }
              as: PlatformAdmin
              captures: { pl1_id: $.data.id }
            - call: "POST /production-lines"
              payload: { code: "PL-2", name: "Roll Former 1", line_type: "ROLL_FORM", changeover_buffer_minutes: 45 }
              as: PlatformAdmin
              captures: { pl2_id: $.data.id }
            - call: "GET /production-lines/${pl1_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
          assert:
            - "both creates return 201 with version == 1 and created_at == 2026-08-01T00:00:00.000Z"
            - "ProductionLine.${pl1_id}.changeover_buffer_minutes == 120, the declared default"
            - "ProductionLine.${pl2_id}.changeover_buffer_minutes == 45"
            - "the read of ${pl1_id} returns code PL-1, name Plate Line 1 and line_type PLATE_CUT_WELD, identical to the create response"
            - "the read of the unknown id returns 404 with data.error_id == ERR_LINE_NOT_FOUND"

      - name: suspend_and_reauthorize_are_separate_action_endpoints
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /builders/{id}/suspend]
          - endpoints[POST /builders/{id}/authorize]
          - state_machines.Builder.transitions[SUSPENDED->AUTHORIZED]
        distinguishing_aspect: "Authorization is driven by two bodyless action endpoints rather than a status field on a generic update, and POST /builders/{id}/authorize serves two different from-states: it moves PENDING_AUTHORIZATION to AUTHORIZED and later moves SUSPENDED back to AUTHORIZED, re-stamping authorized_at from the clock at the second call."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; builder b1 authorized once at that instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
