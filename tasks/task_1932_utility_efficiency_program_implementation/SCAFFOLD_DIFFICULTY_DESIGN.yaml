              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins_id}/record"
              payload: { outcome: "PASS", score_bps: 9000 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /efficiency/incentive_payments"
              payload: {}
              as: ProgramManager
              captures: { pay_id: "$.data[0].id" }
          trigger:
            - call: "POST /efficiency/incentive_payments/${pay_id}/disburse"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/incentive_payments/${pay_id}/reconcile"
              payload: {}
              as: ProgramManager
            - call: "GET /efficiency/programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { paid_after: $.data.paid_cents }
          assert:
            - "After disburse: paid_cents == 74000 (amount_provisional_cents paid up front)"
            - "reconciliation_delta_cents == 50000 - 74000 == -24000"
            - "After reconcile: paid_after == 74000 + (-24000) == 50000 == amount_cents (invariant: paid after disburse+reconcile == final amount_cents)"
