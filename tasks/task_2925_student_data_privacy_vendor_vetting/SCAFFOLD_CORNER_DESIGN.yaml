            - "Application.${app_id}.exposed_sensitivity_points == 0.00 (both rows are still PROPOSED)"

      - name: stale_application_version_blocks_a_reauthorization
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reauthorization-stale-application]
          - errors[ERR_STALE_APPLICATION_VERSION]
          - endpoints[POST /catalog-entries/{entryId}/reauthorize]
          - endpoints[POST /applications/{applicationId}/attest-integration]
        distinguishing_aspect: |
          Reauthorization reads publication eligibility off the Application row, so an
          attest-integration that lands between the client's read and its renewal must
          invalidate the renewal with 412 ERR_STALE_APPLICATION_VERSION — and, critically,
          the predecessor entry must NOT be left SUPERSEDED by the failed attempt. Only the
          retry with the re-read version mints the successor.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; fully publishable Vendor V / Application A pair; entry E published over [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)."
            - "The clock is advanced to 2027-07-15T00:00:00Z and swept, so E is EXPIRING_SOON and therefore renewable."
            - "The Application version is read AFTER the sweep, then a concurrent attest-integration bumps it."
