# =====================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: biosolids-land-application
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is reachable from an
# empty database through the §1.5 endpoint surface alone. Every numeric assert
# below was computed by executing the referenced §1.3 formula with its own
# constants (KG_PER_DRY_TON 907.185, HECTARES_PER_ACRE 0.404686, so one
# mg/kg applied at one dry ton per acre is 0.0022417009731 kg/ha).
# Fixed fixture conventions used throughout:
#   logical clock starts at 2026-08-01T00:00:00Z (§1.5 /_clock/set_current_utc)
#   certifying officer id  "officer-cert-1"   (SolidsBatch.certified_by_user_id)
#   closing officer id     "officer-close-2"  (segregation of duties)
#   farmer id              "farmer-jones"     (FarmerAgreement.farmer_user_id)
# =====================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: vsr_van_kleeck_gates_while_mass_balance_only_reports
        grounds:
          - calculations.volatile_solids_reduction
          - entities.SolidsBatch.fields.vsr_pct_van_kleeck
          - entities.SolidsBatch.fields.vsr_pct_mass_balance
          - state_machines.SolidsBatch.PROC_THICKENED_to_PROC_DIGESTED
          - state_machines.SolidsBatch.QUAL_UNTESTED_to_QUAL_REJECTED
        distinguishing_aspect: |
          One digestion request persists two volatile-solids-reduction numbers from identical
          inputs that straddle the 38.00 compliance line - van_kleeck 47.62 and mass_balance
          37.14 - and the batch survives because only van_kleeck decides the vector attraction
          gate; a system that gated on mass_balance would reject this batch.
        test_recipe:
          setup:
            - "One TreatmentFacility with 5000.00 wet tons of storage, 40.00 wet tons/day production and 2 loadout bays, posture OPEN."
            - "One SolidsBatch B-2026-001 at process_status THICKENED, quality_status UNTESTED, 800.00 wet tons, 200.000 dry tons in at 70.00% volatile solids, vector_option VAR_OPTION_1_VSR."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
              captures: { vsr_vk: $.data.vsr_pct_van_kleeck, vsr_mb: $.data.vsr_pct_mass_balance }
          assert:
            - "SolidsBatch.${batch_id}.vsr_pct_van_kleeck == 47.62"
            - "SolidsBatch.${batch_id}.vsr_pct_mass_balance == 37.14"
            - "SolidsBatch.${batch_id}.vsr_pct_van_kleeck != SolidsBatch.${batch_id}.vsr_pct_mass_balance"
            - "SolidsBatch.${batch_id}.quality_status == UNTESTED"
            - "SolidsBatch.${batch_id}.rejection_reason == null"
            - "SolidsBatch.${batch_id}.pathogen_class == CLASS_B"
            - "SolidsBatch.${batch_id}.process_status == DIGESTED"
            - "SolidsBatch.${batch_id}.version == 2"

      - name: odor_risk_precautionary_variant_gates_site_near_residences
        grounds:
          - calculations.site_odor_risk_score
          - entities.LandApplicationSite.fields.odor_risk_score_historical
          - entities.LandApplicationSite.fields.odor_risk_score_precautionary
          - entities.LandApplicationSite.fields.gating_risk_score
          - state_machines.OdorComplaint.INVESTIGATING_to_SUBSTANTIATED
        distinguishing_aspect: |
          The same two complaints score 28.00 historically and 40.00 precautionarily on a
          LandApplicationSite - not a SolidsBatch - because the still-open MODERATE complaint
          counts in one variant only, and nearest_residence_ft 1200 selects the precautionary
          number as the scheduling gate.
        test_recipe:
          setup:
            - "One TreatmentFacility, posture OPEN."
            - "One PERMITTED LandApplicationSite 1200 ft from the nearest residence, pfas_advisory_flag false."
            - "One SEVERE odor complaint received 2026-07-01 that has been substantiated, and one MODERATE complaint received 2026-07-15 still in RECEIVED."
            - "Logical clock at 2026-08-01T00:00:00Z, so both complaints are inside the 365-day scoring window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], soil_ph: 6.5, depth_to_groundwater_ft: 10.0, slope_pct: 3.0, nearest_residence_ft: 1200, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site_id: $.data.id }
            - call: "POST /land-application-sites/${site_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0001" }
              as: ComplianceOfficer
            - call: "POST /odor-complaints"
              payload: { facility_id: "${fac_id}", site_id: "${site_id}", received_at: "2026-07-01T14:00:00Z", severity: "SEVERE", description: "Strong odor during afternoon spreading", complainant_contact: "neighbor-a@example.com" }
              as: PublicLiaison
              captures: { comp_severe_id: $.data.id }
            - call: "POST /odor-complaints/${comp_severe_id}/investigate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /odor-complaints/${comp_severe_id}/resolve"
              payload: { outcome: "SUBSTANTIATED", investigation_note: "Field crew confirmed surface application upwind", resolution_action: "OPERATIONAL_CHANGE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /odor-complaints"
              payload: { facility_id: "${fac_id}", site_id: "${site_id}", received_at: "2026-07-15T09:00:00Z", severity: "MODERATE", description: "Odor noticeable at the property line" }
              as: PublicLiaison
              captures: { comp_moderate_id: $.data.id }
          assert:
            - "LandApplicationSite.${site_id}.odor_risk_score_historical == 28.00"
            - "LandApplicationSite.${site_id}.odor_risk_score_precautionary == 40.00"
            - "LandApplicationSite.${site_id}.gating_risk_score == 40.00"
            - "LandApplicationSite.${site_id}.status == PERMITTED"
            - "LandApplicationSite.${site_id}.restriction_reason == null"
            - "OdorComplaint.${comp_moderate_id}.status == RECEIVED"
            - "TreatmentFacility.${fac_id}.substantiated_complaint_count_30d == 0"
            - "TreatmentFacility.${fac_id}.posture == OPEN"

  - rule_id: combinatorial_formula
    instances:
      - name: agronomic_cap_nested_min_selects_nitrogen_over_three_rivals
        mode: a_nonlinear_multi_input
        grounds:
          - calculations.agronomic_rate_cap
          - entities.ApplicationEvent.fields.agronomic_rate_cap_dry_tons_per_acre
          - entities.ApplicationEvent.fields.binding_rate_constraint
          - entities.ApplicationEvent.fields.plant_available_n_lb_per_dry_ton
          - validations.priority_51_ERR_AGRONOMIC_RATE_EXCEEDED
        distinguishing_aspect: |
          A four-candidate nested minimum - nitrogen 9.8765..., phosphorus 9999.0 (sentinel,
          soil_p_index 40 below the 75 tier), APLR 42.3785... and agreement 20.00 - collapses to
          9.88 with exactly one rounding at the end, and the winner must be labelled NITROGEN.
          Dropping the SURFACE volatilization factor 0.50 gives pan 20.2000 and a cap of 7.92;
          rounding each candidate before the min or letting the visible contractual number
          (20.00) win both produce a different cap.
        test_recipe:
          setup:
            - "TreatmentFacility posture OPEN, 5000.00 wet tons capacity, 2 loadout bays."
            - "ACTIVE PollutantLimit for CADMIUM: ceiling 85.0, monthly average 39.0, APLR 1.9 kg/ha/yr, CPLR 39.0 kg/ha."
            - "SolidsBatch DEWATERED + QUALIFIED, 160.000 dry tons produced and unallocated, nh4_n 4000.0, organic_n 30000.0, nitrate_n 100.0, total_p 25000.0 mg/kg, one CADMIUM result at 20.0 mg/kg in sampling round 0."
            - "PERMITTED LandApplicationSite, 100.0 acres, CORN, crop_n_demand 160.0 lb/acre, crop_p_removal 60.0 lb/acre, soil_p_index 40, months [8,9,10], nearest_residence_ft 3000, weather clear."
            - "ACTIVE FarmerAgreement with max_dry_tons_per_acre 20.0 and notice_days 3, term 2026-08-01 .. 2026-12-31."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 20.0, sampling_event_index: 0, analyzed_at: "2026-08-01T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
            - call: "POST /solids-batches/${batch_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-cert-1"
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], soil_ph: 6.5, depth_to_groundwater_ft: 10.0, slope_pct: 3.0, nearest_residence_ft: 3000, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site_id: $.data.id }
            - call: "POST /land-application-sites/${site_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0001" }
              as: ComplianceOfficer
              captures: { site_v: $.data.version }
            - call: "POST /farmer-agreements"
              payload: { site_id: "${site_id}", expected_site_version: "${site_v}", farmer_user_id: "farmer-jones", farm_name: "Jones Family Farm", term_start: "2026-08-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
              captures: { agr_id: $.data.id }
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: {}
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/sign"
              payload: {}
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/activate"
              payload: {}
              as: Agronomist
            - call: "POST /_weather/observations"
              payload: { site_id: "${site_id}", rainfall_in_24h: 0.0, forecast_rainfall_in_48h: 0.0, frozen_ground: false }
              as: FacilityOperator
          trigger:
            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr_id}", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-21T00:00:00Z", application_method: "SURFACE", acres_treated: 100.0, planned_dry_tons: 100.000 }
              as: Agronomist
              captures: { event_id: $.data.id, cap: $.data.agronomic_rate_cap_dry_tons_per_acre, binding: $.data.binding_rate_constraint }
            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr_id}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", application_method: "SURFACE", acres_treated: 10.0, planned_dry_tons: 99.000 }
              as: Agronomist
              captures: { over_err: $.data.error_id }
          assert:
            - "ApplicationEvent.${event_id}.plant_available_n_lb_per_dry_ton == 16.2000"
            - "ApplicationEvent.${event_id}.agronomic_rate_cap_dry_tons_per_acre == 9.88"
            - "ApplicationEvent.${event_id}.binding_rate_constraint == NITROGEN"
            - "ApplicationEvent.${event_id}.requested_rate_dry_tons_per_acre == 1.00"
            - "ApplicationEvent.${event_id}.status == SCHEDULED"
            - "ApplicationEvent.${event_id}.reserved_dry_tons == 100.000"
            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 60.000"
            - "second create returns HTTP 422 with error_id == ERR_AGRONOMIC_RATE_EXCEEDED because requested_rate 9.90 > 9.88"
            - "GET /application-events?site_id=${site_id} returns exactly 1 row"

      - name: loading_ledger_rounds_each_entry_before_summing
        mode: b_pinned_rounding_order
        grounds:
          - calculations.cumulative_loading_ledger
          - entities.LoadingLedgerEntry.fields.kg_per_hectare_delta
          - entities.LandApplicationSite.fields.cumulative_loading_kg_per_hectare
          - entities.LandApplicationSite.fields.annual_loading_kg_per_hectare
          - endpoints.GET_/land-application-sites/{siteId}/loading-summary
        distinguishing_aspect: |
          Two closed-out applications of 80.000 dry tons on 80.0 acres each write two ledger
          rows rounded to 0.0448 kg/ha, and the site total is the sum of the ROUNDED rows,
          0.0896. Summing the unrounded increments (0.0448340195 each) and rounding the total
          gives 0.0897 - one cent of a kg/ha apart, and only the pinned round-then-sum order
          reproduces the ledger.
        test_recipe:
          setup:
            - "The full base fixture of agronomic_cap_nested_min_selects_nitrogen_over_three_rivals (facility, CADMIUM limit with CPLR 39.0, batch DEWATERED+QUALIFIED with 160.000 dry tons, PERMITTED 100-acre site, ACTIVE agreement, weather clear, clock 2026-08-01T00:00:00Z)."
            - "Two SCHEDULED ApplicationEvents on that site, each 80.000 dry tons on 80.0 acres (rate 1.00), windows 2026-08-20 .. 2026-08-21 and 2026-09-10 .. 2026-09-11 so the 10-day reapplication buffer is satisfied."
            - "Certifying officer officer-cert-1 differs from the closing officer officer-close-2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
              captures: { batch_v: $.data.version }
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 20.0, sampling_event_index: 0, analyzed_at: "2026-08-01T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
            - call: "POST /solids-batches/${batch_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-cert-1"
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], soil_ph: 6.5, depth_to_groundwater_ft: 10.0, slope_pct: 3.0, nearest_residence_ft: 3000, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site_id: $.data.id }
            - call: "POST /land-application-sites/${site_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0001" }
              as: ComplianceOfficer
              captures: { site_v: $.data.version }
            - call: "POST /farmer-agreements"
              payload: { site_id: "${site_id}", expected_site_version: "${site_v}", farmer_user_id: "farmer-jones", farm_name: "Jones Family Farm", term_start: "2026-08-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
              captures: { agr_id: $.data.id }
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: {}
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/sign"
              payload: {}
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/activate"
              payload: {}
              as: Agronomist
            - call: "POST /_weather/observations"
              payload: { site_id: "${site_id}", rainfall_in_24h: 0.0, forecast_rainfall_in_48h: 0.0, frozen_ground: false }
              as: FacilityOperator
            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr_id}", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-21T00:00:00Z", application_method: "SURFACE", acres_treated: 80.0, planned_dry_tons: 80.000 }
              as: Agronomist
              captures: { ev_a: $.data.id }
            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr_id}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", application_method: "SURFACE", acres_treated: 80.0, planned_dry_tons: 80.000 }
              as: Agronomist
              captures: { ev_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T06:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /application-events/${ev_a}/start"
              payload: {}
              as: FacilityOperator
            - call: "POST /application-events/${ev_a}/haul-tickets"
              payload: { truck_id: "T-1", wet_tons: 400.00, depart_at: "2026-08-20T08:00:00Z", return_at: "2026-08-20T10:00:00Z", odometer_miles: 30.0 }
              as: FacilityOperator
            - call: "POST /application-events/${ev_a}/complete"
              payload: { applied_dry_tons: 80.000 }
              as: ComplianceOfficer
              as_user_id: "officer-close-2"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-10T06:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /application-events/${ev_b}/start"
              payload: {}
              as: FacilityOperator
            - call: "POST /application-events/${ev_b}/haul-tickets"
              payload: { truck_id: "T-1", wet_tons: 400.00, depart_at: "2026-09-10T08:00:00Z", return_at: "2026-09-10T10:00:00Z", odometer_miles: 30.0 }
              as: FacilityOperator
          trigger:
            - call: "POST /application-events/${ev_b}/complete"
              payload: { applied_dry_tons: 80.000 }
              as: ComplianceOfficer
              as_user_id: "officer-close-2"
            - call: "GET /land-application-sites/${site_id}/loading-summary"
              payload: { applied_year: 2026 }
              as: Agronomist
