        distinguishing_aspect: "OCC on PartnerCollege.version: after agreement A's creation advances the college to version 2, a second create still carrying the observed version 1 is rejected 412 ERR_STALE_VERSION — deterministically, via two strictly sequential requests."
        test_recipe:
          setup: ["College created (version 1); agreement A created with expected_college_version = 1 (college now version 2)"]
          setup_api_calls:
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, v1: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${v1}" }, as: ProgramAdmin, captures: { aga: $.data.id } }
