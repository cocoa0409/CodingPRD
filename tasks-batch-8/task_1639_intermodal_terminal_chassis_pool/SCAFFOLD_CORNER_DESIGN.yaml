        grounds:
          - "errors[ERR_CHASSIS_UNROADABLE]"
        excluded_because:
          difficulty_instance: state_vs_safety_on_reserve
          rationale: "Asserted as the priority-loser in §1.8 priority_pair_validation_conflict instance 1 — would be the error if priorities were reversed."

      - name: error_membership_not_active
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MEMBERSHIP_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: temporal_vs_referential_on_checkin
          rationale: "Asserted as priority-loser in §1.8 instance; would fire if temporal check passed."

