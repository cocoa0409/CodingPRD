      - name: vendor_ceiling_is_tested_on_the_discounted_award_not_the_tier_basis
        claim_type: cascading_validation
        grounds:
          - validations[priority=27]
          - calculations.vendor_award_pricing
          - errors[ERR_VENDOR_CEILING_EXCEEDED]
          - entities.Vendor.fields.contract_ceiling_cents
        distinguishing_aspect: "The ceiling check consumes the pricing calculation's finished output: with contract_ceiling_cents 96500 an award whose tier_basis is 100000 is ADMITTED because the discounted award is 96000, and a second 25000 award is then refused with 402 ERR_VENDOR_CEILING_EXCEEDED - so the discount step provably runs before the ceiling comparison."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Vendor V1: accredited_disciplines [DIGITAL], accreditation_expires_at_utc 2027-08-01T00:00:00Z, concurrent_case_capacity 5, unit_price_cents 25000, rush_surcharge_pct 0.0, contract_ceiling_cents 96500."
            - "Method M1 VALIDATED, DIGITAL, standard_hours_per_item 1.00, min_competency_level 2, max_items_per_request 10."
            - "Case C1 (OTHER) ACCEPTED with two DIGITAL_DEVICE vault items; request R4 (item_count 4) and request R1 (item_count 1) are QUEUED."
            - "Hand-executed formula for R4: base 100000, tier_basis 100000, pct 0.04, discount 4000, award 96000; 0 + 0 + 96000 <= 96500 admits."
            - "Hand-executed formula for R1: base 25000, tier_basis 25000, pct 0.00, award 25000; 96000 + 0 + 25000 == 121000 > 96500 refuses."
