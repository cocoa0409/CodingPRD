  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: severity_index_exactly_forty_freezes_project
        grounds:
          - calculations.issue_severity_index
          - calculations.readiness_posture_derivation
          - entities.CxProject.fields.readiness_posture
          - state_machines.CxProject.readiness_posture.RESTRICTED_to_FROZEN
        distinguishing_aspect: |
          The metric is the numeric issue_severity_index on POST /issues: 32.00
          stays RESTRICTED and the very next S3 lands the index on exactly 40.00,
          which must FREEZE because the threshold comparison is >= and not >.
        test_recipe:
          setup:
            - "Project P (contract_value_cents 100000000) with EquipmentUnit E1 (CRITICAL, contract_value_cents 1000000)."
            - "The logical clock is still at its 2026-08-01T00:00:00Z default, so every issue has age 0 and an aging multiplier of exactly 1.00."
            - "One S2 issue (contribution 24.00) and one S3 issue (contribution 8.00) are OPEN, putting the index at 32.00 and the posture at RESTRICTED."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Aster Cx", building_name: "Aster Building", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "NONE", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "LTG-1", system_type: "LIGHTING", criticality: "CRITICAL", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S2", description: "Daylight sensor placement wrong", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i1: $.data.id }
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { idx1: $.data.issue_severity_index, posture1: $.data.readiness_posture }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Zone schedule mislabelled", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i2: $.data.id }
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { idx2: $.data.issue_severity_index, posture2: $.data.readiness_posture }
          trigger:
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Occupancy sensor time-out not set", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i3: $.data.id }
          assert:
            - "${idx1} == 24.00 and ${posture1} == RESTRICTED"
            - "${idx2} == 32.00 and ${posture2} == RESTRICTED"
            - "CxProject.${p}.issue_severity_index == 40.00"
            - "CxProject.${p}.readiness_posture == FROZEN (40.00 >= 40.00 triggers, the comparison is not strictly greater)"
            - "CxProject.${p}.retainage_withheld_cents == 36000"
            - "CxProject.${p}.open_blocking_issue_count == 1"

      - name: checklist_execute_zero_item_boundary
        grounds:
          - validations[priority=25]
          - errors[ERR_CHECKLIST_EMPTY]
          - state_machines.PrefunctionalChecklist.DRAFT_to_EXECUTED
          - entities.PrefunctionalChecklist.fields.item_count
        distinguishing_aspect: |
          The metric is an empty collection rather than a numeric threshold: a
          checklist with item_count 0 vacuously satisfies "no item is PENDING"
          yet must be refused with ERR_CHECKLIST_EMPTY on
          POST /prefunctional-checklists/{id}/execute, and the same endpoint
          succeeds the moment a single recorded item exists.
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 in install_status INSTALLED."
            - "PrefunctionalChecklist CL1 exists in DRAFT with items == [] and item_count == 0."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Willow Cx", building_name: "Willow Annex", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "NONE", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "BAS-1", system_type: "BAS", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-BAS-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id, initial_item_count: $.data.item_count }
          trigger:
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { err: $.data.error_id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Points list verified", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { status_after: $.data.status, count_after: $.data.item_count }
          assert:
            - "${initial_item_count} == 0"
            - "${err} == ERR_CHECKLIST_EMPTY with HTTP 422"
            - "${status_after} == EXECUTED and ${count_after} == 1"
            - "CxProject.${p}.verified_prefunctional_units == 0 (the failed execute wrote nothing)"

