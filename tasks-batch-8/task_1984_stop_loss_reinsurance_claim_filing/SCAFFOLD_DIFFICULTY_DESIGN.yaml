            - call: "POST /stop-loss/contracts/${c1_id}/activate"
              payload: {}
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${c1_id}"
                member_id: "${m2_id}"
                lasered_specific_deductible_cents: 5000000
