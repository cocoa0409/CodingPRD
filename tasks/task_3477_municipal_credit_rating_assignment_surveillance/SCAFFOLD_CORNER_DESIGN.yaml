        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or resource logic runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
