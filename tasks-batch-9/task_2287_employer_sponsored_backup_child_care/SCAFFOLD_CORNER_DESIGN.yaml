            - "${p2_ns2} == DEPROVISIONED and ${err_prov_term} == ERR_PROVIDER_TERMINAL with HTTP 409"
            - "${err_inc_state} == ERR_INCIDENTREPORT_STATE_INVALID with HTTP 409 — substantiate is only declared from UNDER_REVIEW"
            - "${inc_st1} == UNDER_REVIEW, ${inc_st2} == DISMISSED and ${inc_qa} == NONE"
            - "${err_inc_term} == ERR_INCIDENTREPORT_TERMINAL with HTTP 409"
            - "Provider.${p1}.quality_score == 100 — a DISMISSED report is never a quality event"

