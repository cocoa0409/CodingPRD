              as: PlatformAdmin
              captures: { pol_aug: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "TOBACCO_VAPE", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.00, max_units_per_order: 5.00, rolling_window_days: 30, max_units_per_window: 20.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_tob: $.data.id }
          trigger:
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.30, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-31", effective_to: "2026-09-30" }
              as: PlatformAdmin
              captures: { err_touch: $.data.error_id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.30, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-09-01", effective_to: "2026-09-30" }
              as: PlatformAdmin
              captures: { pol_sep: $.data.id }
          assert:
            - "the first trigger call returns 409 and ${err_touch} == ERR_POLICY_PERIOD_OVERLAP, because 2026-08-31 belongs to both closed periods"
            - "the second trigger call returns 201 because 2026-09-01 is the first date outside the resident closed period"
            - "RestrictionPolicy.${pol_sep}.effective_from == 2026-09-01 and RestrictionPolicy.${pol_sep}.unit_scale_factor == 1.30"
            - "the count of ALCOHOL RestrictionPolicy rows for jurisdiction ${j_ny} is 2"
            - "RestrictionPolicy.${pol_tob}.effective_from == 2026-08-01, proving the overlap rule is scoped to (jurisdiction_id, restriction_type)"

  # =========================================================================
  # Rule 9 — compensating_invariant  (different conserved quantities:
  #          integer money cents, then decimal license-risk points)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: return_settlement_conserves_every_charged_cent
        grounds:
          - calculations.refusal_return_settlement
          - entities.Order.fields.charged_cents
          - entities.Order.fields.refunded_cents
          - entities.Order.fields.retained_cents
          - state_machines.Order.fulfillment_state.RETURN_IN_TRANSIT_to_RETURN_COMPLETED
        distinguishing_aspect: |
          Conserved quantity 1 — MONEY, in integer cents. Forward action: the submit that
          fixes charged_cents at 21000 (item_subtotal 20400 + delivery_fee 600).
          Compensating action: the refusal and its return settlement. The pinned invariant
          is refunded_cents + retained_cents == charged_cents, exactly, with no rounding
          drift, and the retained side must itself decompose without remainder into
          restocking_fee_cents + delivery_fee_cents == 1632 + 600 == 2232. Because the
          restocking fee is FLOORED rather than rounded, a naive implementation that rounds
          it to 1632 and then recomputes retained_cents independently would leave the two
          sides off by a cent, which this instance forbids.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY ALCOHOL policy as in the shared conventions"
            - "customer attested and MATCH-pre-verified; partner OPEN; courier CERTIFIED for ALCOHOL"
            - "order with a single line 3xWINE-A: item_subtotal_cents 20400, delivery_fee_cents 600, charged_cents 21000"
            - "the order is submitted, dispatched, an attempt reaches ID_VERIFIED and the courier then refuses with UNDERAGE_RECIPIENT is impossible from ID_VERIFIED, so the refusal reason is INTOXICATED_RECIPIENT and the order sits in RETURN_IN_TRANSIT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T16:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_a: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { charged_at_submit: $.data.charged_cents }
            - call: "POST /orders/${order}/dispatch"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
            - call: "POST /delivery-attempts"
              payload: { order_id: "${order}", courier_id: "${courier}", started_at: "2026-08-20T16:00:00Z" }
              as: Courier
              as_user_id: "${courier}"
              captures: { att: $.data.id }
            - call: "POST /delivery-attempts/${att}/id-check"
              payload: { document_type: "DRIVERS_LICENSE", document_expires_on: "2030-03-15", scan_performed: true, scanned_dob: "2000-03-15", recipient_name: "Ada Lin" }
              as: Courier
              as_user_id: "${courier}"
            - call: "POST /delivery-attempts/${att}/refuse"
              payload: { refusal_reason: "INTOXICATED_RECIPIENT", observed_indicators: ["slurred speech"] }
              as: Courier
              as_user_id: "${courier}"
          trigger:
            - call: "POST /orders/${order}/return-settlement"
              payload: { restock_confirmed: true }
              as: PlatformAdmin
          assert:
            - "the setup capture ${charged_at_submit} equals 21000"
            - "Order.${order}.refunded_cents == 18768"
            - "Order.${order}.retained_cents == 2232"
            - "INVARIANT: Order.${order}.refunded_cents + Order.${order}.retained_cents == Order.${order}.charged_cents, i.e. 18768 + 2232 == 21000"
            - "INVARIANT: Order.${order}.retained_cents == Order.${order}.restocking_fee_cents + Order.${order}.delivery_fee_cents, i.e. 2232 == 1632 + 600"
            - "Order.${order}.charged_cents == 21000 and Order.${order}.item_subtotal_cents == 20400, both unchanged by the compensation"
            - "Order.${order}.fulfillment_state == RETURN_COMPLETED"
            - "OrderLine.${line_a}.line_state == WITHDRAWN and Order.${order}.final_restricted_units == 0.00"

      - name: reopen_and_dismiss_restores_the_partner_license_risk_score_exactly
        grounds:
          - calculations.partner_license_risk_score
          - state_machines.ViolationCase.SUBSTANTIATED_to_UNDER_INVESTIGATION
          - state_machines.ViolationCase.UNDER_INVESTIGATION_to_DISMISSED
          - entities.DeliveryPartner.fields.license_risk_score
          - entities.ViolationCase.fields.risk_contribution
        distinguishing_aspect: |
          Conserved quantity 2 — LICENSE-RISK POINTS, a 2-decimal score rather than money,
          and on a different entity. Forward action: substantiating a MAJOR case lifts
          DeliveryPartner.license_risk_score from 5.00 to 20.00 and writes
          ViolationCase.risk_contribution 15.00. Compensating action: reopening that case
          and then dismissing it must withdraw the contribution completely, returning
          license_risk_score to EXACTLY 5.00 — the value it held before the forward action —
          with risk_contribution 0.00, lifetime_risk_score also back at 5.00 and
          open_case_count back at 0. An implementation that decrements the stored score
          instead of recomputing it from the surviving case set drifts here, because the
          per-case rounding in partner_license_risk_score is not reversible by subtraction.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "partner Empire Last Mile on contract_tier STANDARD, so tier_multiplier is 1.00"
            - "case_minor is already SUBSTANTIATED at MINOR with decided_at 2026-08-20T12:00:00Z, giving license_risk_score 5.00 and lifetime_risk_score 5.00"
            - "case_major is OPEN then investigated, so it is UNDER_INVESTIGATION and contributes no points yet"
            - "the pre-forward rolling score is captured from GET /delivery-partners/{id}/risk-assessment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Decoy Buyer", email: "decoy@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-22T16:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { decoy1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-22T17:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { decoy2: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${decoy1}", scenario_type: "NO_ID_PRESENTED", scheduled_at: "2026-08-22T16:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst1: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${decoy2}", scenario_type: "EXPIRED_DOCUMENT", scheduled_at: "2026-08-22T17:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst2: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst1}", severity: "MINOR", summary: "Signage lapse recorded by the auditor" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_minor: $.data.id }
            - call: "POST /violation-cases/${case_minor}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_minor}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "MINOR", notes: "Substantiated at MINOR" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst2}", severity: "MAJOR", summary: "Courier accepted an expired document" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_major: $.data.id }
            - call: "POST /violation-cases/${case_major}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /delivery-partners/${partner}/risk-assessment"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { rolling_before: $.data.rolling_90d_score }
          trigger:
            - call: "POST /violation-cases/${case_major}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "MAJOR", notes: "Forward action: substantiated at MAJOR" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_major}/reopen"
              payload: { notes: "Compensating action step 1: new evidence contradicts the finding" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case_major}/decide"
              payload: { decision: "DISMISSED", notes: "Compensating action step 2: dismissed on review" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "the setup capture ${rolling_before} equals 5.00"
            - "after the first trigger call DeliveryPartner.${partner}.license_risk_score == 20.00 and ViolationCase.${case_major}.risk_contribution == 15.00"
            - "after the second trigger call DeliveryPartner.${partner}.license_risk_score == 5.00 and ViolationCase.${case_major}.risk_contribution == 0.00"
            - "INVARIANT: after the third trigger call DeliveryPartner.${partner}.license_risk_score == 5.00, exactly the pre-forward value ${rolling_before}"
            - "INVARIANT: after the third trigger call DeliveryPartner.${partner}.lifetime_risk_score == 5.00"
            - "ViolationCase.${case_major}.state == DISMISSED with assessed_severity null and risk_contribution 0.00"
            - "ViolationCase.${case_minor}.state == SUBSTANTIATED with risk_contribution 5.00, untouched by the compensation"
            - "ViolationCase.${case_major}.investigation_rounds == 2"
            - "DeliveryPartner.${partner}.open_case_count == 0 and DeliveryPartner.${partner}.posture == OPEN"
