# =============================================================================
# PRD Benchmark Seed Tables — Grill Assembly, Seasonal Demand & Warranty Parts
# =============================================================================

scenario: |
  Grill Assembly, Seasonal Demand & Warranty Parts Support (Weber): highly
  seasonal demand concentrated in spring with production and inventory built
  through winter, retail channel allocation across home centers, specialty
  dealers and direct with different assortments and service expectations,
  assembly service programs at retail and in-home with third-party assemblers
  and scheduling, parts support obligations extending many years past sale
  with burner, grate and electronic component availability, warranty claim
  adjudication by component with differing coverage periods and proof of
  purchase, accessory and consumable attach programs including covers, tools
  and fuel, connected grill features with application pairing and firmware
  support, end-of-season clearance and next-year model transition

domain_name: grill-seasonal-ops
api_prefix: /grillops

complexity_profile:
  primary_archetype: quota_allocation        # finite seasonal inventory pool competed for by channels
  secondary_archetype: posture_driven_gating # Season.status gates allocation, sales, clearance
  complexity_layers:
    - optimistic_concurrency        # OCC on Season.version (allocation create/supersede) and Allocation.version (respond)
    - cascading_side_effects        # no-show -> counter -> auto-suspend -> job unassign; season advance -> models -> lots
    - dual_variant_calculation      # warranty settlement provisional/final; assembler quality official/provisional; build sizing forward/actual
    - rate_threshold_triggers       # low-stock threshold, no-show suspend threshold, consumption-rate waterfall threshold
  entity_topology: flat             # peer entities joined by foreign keys; sub-resource GETs are filtered views only
  state_machine_shape: cyclic       # claim reopen loop, job no-show reschedule loop, part restock loop, assembler reinstate loop
  relationship_patterns:
    - one_to_many                   # Season -> InventoryLot, Sale -> WarrantyClaim
    - cross_aggregate               # Sale consumes Allocation across aggregate boundary; AssemblyJob spans Sale x Assembler
  role_model: peer_roles            # PlannerAdmin / ChannelRep / Assembler / ServiceAgent / AppUser own distinct surfaces
  consistency_model: immediate      # every mutation visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Constants — every symbolic constant named anywhere in this scaffold is
# assigned its concrete value HERE. Downstream generators MUST NOT re-derive.
# =============================================================================
constants:
  DEFAULT_CLOCK_ISO: "2026-09-01T00:00:00Z"   # logical-clock startup default; server MUST NOT fall back to wall clock
  # Warranty coverage (years from Sale.sold_at, per component)
  BURNER_COVERAGE_YEARS: 10
  GRATE_COVERAGE_YEARS: 5
  ELECTRONICS_COVERAGE_YEARS: 3
  OTHER_COVERAGE_YEARS: 2
  GOODWILL_EXTENSION_DAYS: 90                  # claim within coverage_expiry + 90d -> GOODWILL_ELIGIBLE
  MODEL_PARTS_SUPPORT_YEARS: 7                 # parts availability obligation after model discontinuation
  REOPEN_WINDOW_DAYS: 30                       # DENIED claim reopenable within 30 days of denied_at
  # Warranty settlement schedule (per component)
  PART_COST_BURNER_CENTS: 3200
  PART_COST_GRATE_CENTS: 2400
  PART_COST_ELECTRONICS_CENTS: 4800
  PART_COST_OTHER_CENTS: 1500
  LABOR_ALLOWANCE_BURNER_CENTS: 4500
  LABOR_ALLOWANCE_GRATE_CENTS: 4500
  LABOR_ALLOWANCE_ELECTRONICS_CENTS: 7500
  LABOR_ALLOWANCE_OTHER_CENTS: 2500
  GOODWILL_CAP_CENTS: 10000                    # APPROVE from UNDER_REVIEW blocked above this; ESCALATED bypasses
  # Clearance markdown engine
  TIER1_MARKDOWN_PCT: 15                       # weeks 0..2 into clearance
  TIER2_MARKDOWN_PCT: 30                       # weeks 3..4
  TIER3_MARKDOWN_PCT: 50                       # weeks >= 5
  TIER2_START_WEEK: 3
  TIER3_START_WEEK: 5
  COVERAGE_HIGH_BP: 6000                       # units_available/units_built >= 0.60 -> overstock
  COVERAGE_LOW_BP: 2000                        # <= 0.20 -> understock relief
  OVERSTOCK_EXTRA_PCT: 10
  UNDERSTOCK_RELIEF_PCT: 5
  MAX_MARKDOWN_PCT: 70
  # Assembly fee engine
  BASE_ASSEMBLY_FEE_CENTS: 7999
  IN_HOME_SURCHARGE_CENTS: 5005
  INCLUDED_MILES: 15
  RATE_PER_MILE_CENTS: 149
  SUBSIDY_BP_HOME_CENTER: 2000
  SUBSIDY_BP_SPECIALTY_DEALER: 1000
  SUBSIDY_BP_DIRECT: 0
  # Assembly scheduling
  TRAVEL_BUFFER_MINUTES: 45                    # padding applied to the NEW In-Home job's window
  DEFAULT_MAX_CONCURRENT_JOBS: 4
  # Assembler quality / lifecycle
  NO_SHOW_SUSPEND_THRESHOLD: 3                 # auto-SUSPEND at 3 no-shows
  NO_SHOW_PENALTY_BP: 1200
  COMPLETION_BONUS_BP: 25
  PROVISIONAL_WINDOW_DAYS: 90
  REINSTATE_MIN_PROVISIONAL_BP: 7000
  DECERTIFY_MAX_OFFICIAL_BP: 4000
  # Allocation waterfall
  MIN_CONSUMPTION_RATE_BP: 5000                # below 50% consumption at clearance -> unconsumed units recaptured
  MAX_REDISTRIB_SHARE_BP: 4000                 # each surviving channel may absorb at most 40% of the recaptured pool
  # Parts availability
  LOW_STOCK_THRESHOLD: 10                      # stock_quantity <= 10 -> LOW_STOCK; == 0 -> EXHAUSTED
  # Build sizing
  GROWTH_BP: 11000                             # forward sizing = prior consumption x 1.10
  SEASON_WEEKS: 26                             # in-season annualization window for actual sizing

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season label, unique (e.g. 'Grilling Season 2026')" }
      - { name: year, type: integer, source: input, description: "Calendar year the season sells into" }
      - { name: build_start, type: datetime, source: input, description: "Winter build window opens" }
      - { name: allocation_open, type: datetime, source: input, description: "Channel allocation window opens" }
      - { name: in_season_start, type: datetime, source: input, description: "Spring demand peak window opens" }
      - { name: clearance_start, type: datetime, source: input, description: "End-of-season clearance opens" }
      - { name: season_end, type: datetime, source: input, description: "Season close; model transition allowed after this" }
      - { name: demand_forecast_units, type: integer, source: input, description: "Total forecast demand for the season across all models" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | BUILD | ALLOCATION | IN_SEASON | CLEARANCE | TRANSITIONED | CLOSED" }
    constraints: "build_start < allocation_open < in_season_start < clearance_start < season_end; the CLOSED interval [in_season_start, season_end] must be strictly disjoint from every other Season's same interval (touching endpoints conflict)."

  - name: GrillModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique model code, e.g. 'GX-100'" }
      - { name: model_family, type: string, source: input, description: "Product family shared across model years; next-year transition matches on family + (model_year + 1), NOT an FK" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: base_price_cents, type: integer, source: input, description: "List price in cents" }
      - { name: demand_share_bp, type: integer, source: input, description: "Share of season demand forecast, basis points 0..10000" }
      - { name: burner_coverage_years, type: integer, source: input, default: 10, description: "Burner warranty years from sale date (default BURNER_COVERAGE_YEARS)" }
      - { name: grate_coverage_years, type: integer, source: input, default: 5, description: "Grate warranty years (default GRATE_COVERAGE_YEARS)" }
      - { name: electronics_coverage_years, type: integer, source: input, default: 3, description: "Electronic component warranty years (default ELECTRONICS_COVERAGE_YEARS)" }
      - { name: other_coverage_years, type: integer, source: input, default: 2, description: "Other component warranty years (default OTHER_COVERAGE_YEARS)" }
      - { name: parts_support_years, type: integer, source: input, default: 7, description: "Parts availability obligation years after discontinuation (default MODEL_PARTS_SUPPORT_YEARS)" }
      - { name: current_firmware_version, type: string, source: input, default: "1.0.0", description: "Firmware version stamped on newly paired ConnectedDevices" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLEARANCE_ELIGIBLE | DISCONTINUED | PARTS_ONLY | RETIRED" }
      - { name: discontinued_at, type: datetime, source: system, description: "Set when status enters DISCONTINUED; null otherwise" }
      - { name: support_obligation_until, type: datetime, source: computed, description: "= discontinued_at + parts_support_years; null while not discontinued" }

  - name: ChannelAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail partner name" }
      - { name: channel_type, type: enum, source: input, description: "HOME_CENTER | SPECIALTY_DEALER | DIRECT" }
      - { name: service_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREMIUM — service expectation level" }
      - { name: allocation_priority, type: integer, source: input, description: "Waterfall redistribution rank; higher absorbs recaptured units earlier; ties break on created_at ASC" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding allocation exposure" }
      - { name: subsidy_bp, type: integer, source: computed, description: "Assembly-fee subsidy derived from channel_type: HOME_CENTER=2000, SPECIALTY_DEALER=1000, DIRECT=0" }
      - { name: outstanding_exposure_cents, type: integer, source: computed, description: "Sum over this channel's allocations in {ACCEPTED, PARTIALLY_CONSUMED} of (allocated_units - committed_units) x model.base_price_cents" }
      - { name: accessory_attach_rate, type: number, source: computed, default: 0.0, description: "Sales with accessory_count >= 1 / non-RETURNED sales for this channel, 4 dp round_half_up; empty denominator -> 0.0000" }
      - { name: fuel_attach_rate, type: number, source: computed, default: 0.0, description: "Same denominator; numerator = sales with has_fuel true; empty denominator -> 0.0000" }

  - name: InventoryLot
    parent: Season
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; owning season from the nested create path" }
      - { name: model_id, type: string, source: input, description: "FK -> GrillModel.id; model being built" }
      - { name: build_week, type: string, source: input, description: "Planned build week label, e.g. '2026-W06'" }
      - { name: units_built, type: integer, source: input, description: "Units produced into this lot" }
      - { name: units_available, type: integer, source: computed, description: "= units_built - sum(allocated_units over this lot's season+model allocations in {OFFERED, ACCEPTED, PARTIALLY_CONSUMED, CONSUMED}) - sum(committed_units over allocations in {RELEASED, EXPIRED, SUPERSEDED})" }
      - { name: units_consumed, type: integer, source: computed, default: 0, description: "Sum of committed_units over ALL allocations of this lot's season+model" }
      - { name: recommended_build_forward_units, type: integer, source: computed, description: "Forward variant of calc_build_sizing (prior-season consumption x GROWTH_BP x demand_share_bp)" }
      - { name: recommended_build_actual_units, type: integer, source: computed, description: "Chronological variant of calc_build_sizing; null until season reaches IN_SEASON" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | AVAILABLE | DEPLETED | CLOSEOUT" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season the units are allocated within" }
      - { name: channel_account_id, type: string, source: input, description: "FK -> ChannelAccount.id; receiving channel" }
      - { name: model_id, type: string, source: input, description: "FK -> GrillModel.id; model allocated" }
      - { name: allocated_units, type: integer, source: input, description: "Units reserved for this channel (includes committed_units); rewritten by REVISE, release, expiry and the clearance waterfall" }
      - { name: committed_units, type: integer, source: system, default: 0, description: "Units already sold against this allocation" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | PARTIALLY_CONSUMED | CONSUMED | DECLINED | RELEASED | EXPIRED | SUPERSEDED" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
    constraints: "At most one Allocation in {OFFERED, ACCEPTED, PARTIALLY_CONSUMED, CONSUMED} per (season_id, channel_account_id, model_id); creating a second supersedes the first."

  - name: Assembler
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Third-party assembler company name" }
      - { name: certification_level, type: enum, source: input, default: BASIC, description: "BASIC | CERTIFIED_PRO | MASTER" }
      - { name: service_regions, type: array, source: input, description: "Region codes the assembler covers" }
      - { name: max_concurrent_jobs, type: integer, source: input, default: 4, description: "Cap on jobs in {SCHEDULED, IN_PROGRESS} (default DEFAULT_MAX_CONCURRENT_JOBS)" }
      - { name: status, type: enum, source: system, default: APPLIED, description: "APPLIED | CERTIFIED | SUSPENDED | DECERTIFIED" }
      - { name: active_job_count, type: integer, source: computed, default: 0, description: "= count of AssemblyJobs assigned to this assembler in {SCHEDULED, IN_PROGRESS}; invariant maintained on every job transition" }
      - { name: jobs_completed, type: integer, source: system, default: 0, description: "Lifetime completed jobs" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Lifetime no-shows; auto-SUSPEND at NO_SHOW_SUSPEND_THRESHOLD" }
      - { name: no_show_history, type: array, source: system, default: [], description: "Append-only list of logical-clock timestamps of each NO_SHOW transition" }
      - { name: completion_history, type: array, source: system, default: [], description: "Append-only list of logical-clock timestamps of each COMPLETE transition" }
      - { name: official_quality_bp, type: integer, source: computed, description: "= max(0, 10000 - NO_SHOW_PENALTY_BP * no_show_count)" }
      - { name: provisional_quality_bp, type: integer, source: computed, description: "= clamp(10000 - NO_SHOW_PENALTY_BP * no_shows_in_last_90d + COMPLETION_BONUS_BP * completions_in_last_90d, 0, 10000); window measured from logical clock" }

  - name: AssemblyJob
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; the grill being assembled" }
      - { name: assembler_id, type: string, source: system, description: "FK -> Assembler.id; null until ASSIGN, cleared again on unassign cascades" }
      - { name: job_type, type: enum, source: input, description: "RETAIL_ASSEMBLY | IN_HOME" }
      - { name: distance_mi, type: integer, source: input, default: 0, description: "One-way distance for IN_HOME travel surcharge" }
      - { name: window_start, type: datetime, source: system, description: "Scheduled window open; set by ASSIGN, null before" }
      - { name: window_end, type: datetime, source: system, description: "Scheduled window close; set by ASSIGN, null before" }
      - { name: fee_cents, type: integer, source: computed, description: "calc_assembly_fee at creation: subsidy applied per component (round_half_up each), then summed" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season the unit is sold in" }
      - { name: model_id, type: string, source: input, description: "FK -> GrillModel.id" }
      - { name: channel_account_id, type: string, source: input, description: "FK -> ChannelAccount.id; selling channel (must equal acting ChannelRep)" }
      - { name: quantity, type: integer, source: input, description: "Units in this transaction; consumes that many allocation units" }
      - { name: serials, type: array, source: input, description: "Optional serial numbers; when present length must equal quantity; globally unique across sales" }
      - { name: accessories, type: array, source: input, default: [], description: "Attach items: [{ sku, accessory_type: COVER|TOOLS|FUEL|OTHER, unit_price_cents }]" }
      - { name: accessory_count, type: integer, source: computed, default: 0, description: "= len(accessories)" }
      - { name: has_cover, type: boolean, source: computed, default: false, description: "true if any accessory COVER" }
      - { name: has_tools, type: boolean, source: computed, default: false, description: "true if any accessory TOOLS" }
      - { name: has_fuel, type: boolean, source: computed, default: false, description: "true if any accessory FUEL" }
      - { name: unit_price_cents, type: integer, source: computed, description: "calc_clearance_price when season is CLEARANCE, else model.base_price_cents; input value is ignored" }
      - { name: proof_of_purchase_token, type: string, source: input, description: "Receipt token; present at creation -> sale is immediately REGISTERED" }
      - { name: status, type: enum, source: system, default: SOLD, description: "SOLD | REGISTERED | RETURNED; starts REGISTERED iff proof_of_purchase_token provided at creation" }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of creation; anchor for warranty coverage" }
      - { name: registered_at, type: datetime, source: system, description: "Set on registration (creation with proof, REGISTER action, or device pairing); null otherwise" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; sale the claim is filed against" }
      - { name: component, type: enum, source: input, description: "BURNER | GRATE | ELECTRONICS | OTHER" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description" }
      - { name: serial_number, type: string, source: input, description: "Optional unit serial; when sale.serials is non-empty this must be a member" }
      - { name: claim_date, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: coverage_determination, type: enum, source: computed, description: "IN_COVERAGE | GOODWILL_ELIGIBLE | OUT_OF_COVERAGE per calc_coverage_determination; stored at creation" }
      - { name: goodwill, type: boolean, source: system, default: false, description: "true when approved out of coverage or while GOODWILL_ELIGIBLE" }
      - { name: provisional_settlement_cents, type: integer, source: computed, description: "calc_warranty_settlement PROVISIONAL variant; set at APPROVE" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "calc_warranty_settlement FINAL variant; set at SETTLE" }
      - { name: settlement_delta_cents, type: integer, source: computed, description: "= final_settlement_cents - provisional_settlement_cents; set at SETTLE" }
      - { name: settlement_parts_order_id, type: string, source: system, description: "Informational id of the auto-created PartsOrder at SETTLE; null if the parts selector found no candidate" }
      - { name: denied_at, type: datetime, source: system, description: "Set on DENY; REOPEN allowed within REOPEN_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | ESCALATED | APPROVED | DENIED | REOPENED | SETTLED" }

  - name: PartSku
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Unique part number, e.g. 'BRN-4500-A'" }
      - { name: component, type: enum, source: input, description: "BURNER | GRATE | ELECTRONICS | OTHER" }
      - { name: compatible_model_codes, type: array, source: input, description: "GrillModel.model_code values this part fits; non-empty" }
      - { name: supersession_chain_id, type: string, source: input, description: "Supersession chain identifier (plain attribute, NOT an FK); parts sharing it form an ordered chain" }
      - { name: chain_position, type: integer, source: input, description: "Position within supersession_chain_id; unique per chain; successor = next higher position" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Catalog cost of the part" }
      - { name: stock_quantity, type: integer, source: input, default: 0, description: "On-hand stock" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | LOW_STOCK | EXHAUSTED | SUPERSEDED | OBSOLETE; LOW_STOCK/EXHAUSTED auto-derived from LOW_STOCK_THRESHOLD" }

  - name: PartsOrder
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> PartSku.id; the REQUESTED part (before supersession resolution)" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; anchors the model-compatibility and obligation checks" }
      - { name: warranty_claim_id, type: string, source: input, description: "Optional informational claim reference (plain attribute, NOT an FK); set by system on settlement-created orders" }
      - { name: fulfillment_type, type: enum, source: input, description: "WARRANTY | GOODWILL | PAID" }
      - { name: quantity, type: integer, source: input, description: "Units requested" }
      - { name: resolved_part_id, type: string, source: system, description: "Part actually allocated after calc_parts_supersession_resolution; equals part_id when no supersession needed" }
      - { name: free_of_charge, type: boolean, source: computed, description: "true iff fulfillment_type in {WARRANTY, GOODWILL}" }
      - { name: total_cost_cents, type: integer, source: computed, description: "= resolved part's unit_cost_cents x quantity at resolution time" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ALLOCATED | BACKORDERED | SHIPPED | DELIVERED | CANCELLED; synchronously resolved to ALLOCATED or BACKORDERED within create" }
      - { name: seq_no, type: integer, source: system, description: "Per-entity monotonic insertion counter starting at 1; deterministic tie-break after created_at for the backorder fill order (id is NEVER used)" }

  - name: ConnectedDevice
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; the paired grill's sale" }
      - { name: app_account_id, type: string, source: input, description: "Consumer app account the grill is paired to" }
      - { name: pairing_token, type: string, source: system, description: "Server-issued pairing proof returned at creation" }
      - { name: firmware_version, type: string, source: system, description: "Initialized to model.current_firmware_version at pairing; rewritten by firmware UPDATE" }
      - { name: status, type: enum, source: system, default: PAIRED, description: "PAIRED | UPDATING | UNPAIRED; UPDATE passes through UPDATING synchronously and returns PAIRED" }
    constraints: "At most one ConnectedDevice in {PAIRED, UPDATING} per sale_id."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: BUILD
        trigger: "POST /grillops/seasons/{id}/advance { target_status: BUILD }"
        actor: PlannerAdmin
        preconditions: ["target_status is exactly BUILD (skipping states -> ERR_INVALID_STATE)"]
        side_effects: ["increments Season.version by 1"]
      - from: BUILD
        to: ALLOCATION
        trigger: "POST /grillops/seasons/{id}/advance { target_status: ALLOCATION }"
        actor: PlannerAdmin
        preconditions: ["at least one InventoryLot exists for this season"]
        side_effects:
          - "every InventoryLot of this season in BUILDING -> AVAILABLE"
          - "increments Season.version by 1"
      - from: ALLOCATION
        to: IN_SEASON
        trigger: "POST /grillops/seasons/{id}/advance { target_status: IN_SEASON }"
        actor: PlannerAdmin
        preconditions: ["logical clock >= season.in_season_start"]
        side_effects: ["increments Season.version by 1"]
      - from: IN_SEASON
        to: CLEARANCE
        trigger: "POST /grillops/seasons/{id}/advance { target_status: CLEARANCE }"
        actor: PlannerAdmin
        preconditions: ["logical clock >= season.clearance_start"]
        side_effects:
          - "hop 1: every Allocation of this season still in OFFERED -> EXPIRED; its allocated_units are returned to the lot (allocated_units := committed_units = 0 for never-accepted offers)"
          - "hop 2: the units returned in hop 1 recompute each affected InventoryLot.units_available and may flip DEPLETED -> AVAILABLE"
          - "hop 3: calc_allocation_waterfall runs over this season's {ACCEPTED, PARTIALLY_CONSUMED} allocations (see calculations), mutating allocated_units and lot availability again"
          - "increments Season.version by 1"
        note: "waterfall ordering is pinned in calc_allocation_waterfall: consumption rates are computed on the pre-release snapshot."
      - from: CLEARANCE
        to: TRANSITIONED
        trigger: "POST /grillops/seasons/{id}/advance { target_status: TRANSITIONED }"
        actor: PlannerAdmin
        preconditions: ["logical clock >= season.season_end"]
        side_effects:
          - "hop 1: every GrillModel with >= 1 InventoryLot in this season -> DISCONTINUED (discontinued_at := logical clock; support_obligation_until := clock + parts_support_years)"
          - "hop 2: each model discontinued in hop 1 flips its InventoryLots in this season to CLOSEOUT"
          - "hop 3: every remaining Allocation of this season in {OFFERED, ACCEPTED, PARTIALLY_CONSUMED} -> EXPIRED; allocated_units := committed_units and the difference returns to lot availability (recompute per hop 2 pattern)"
          - "increments Season.version by 1"
      - from: TRANSITIONED
        to: CLOSED
        trigger: "POST /grillops/seasons/{id}/advance { target_status: CLOSED }"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["increments Season.version by 1"]

  - entity: GrillModel
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: CLEARANCE_ELIGIBLE
        trigger: "POST /grillops/models/{id}/lifecycle { action: MARK_CLEARANCE_ELIGIBLE }"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["increments GrillModel.version by 1"]
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /grillops/models/{id}/lifecycle { action: DISCONTINUE } or Season CLEARANCE -> TRANSITIONED cascade"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["discontinued_at := logical clock", "support_obligation_until := clock + parts_support_years", "increments GrillModel.version by 1"]
      - from: CLEARANCE_ELIGIBLE
        to: DISCONTINUED
        trigger: "POST /grillops/models/{id}/lifecycle { action: DISCONTINUE } or Season CLEARANCE -> TRANSITIONED cascade"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["discontinued_at := logical clock", "support_obligation_until := clock + parts_support_years", "increments GrillModel.version by 1"]
      - from: DISCONTINUED
        to: PARTS_ONLY
        trigger: "POST /grillops/models/{id}/lifecycle { action: MARK_PARTS_ONLY }"
        actor: PlannerAdmin
        preconditions: ["logical clock > support_obligation_until (obligation expired)"]
        side_effects: ["increments GrillModel.version by 1"]
      - from: PARTS_ONLY
        to: RETIRED
        trigger: "POST /grillops/models/{id}/lifecycle { action: RETIRE }"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["increments GrillModel.version by 1"]

  - entity: Allocation
    initial_state: OFFERED
    terminal_states: [CONSUMED, DECLINED, RELEASED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /grillops/allocations/{id}/respond { action: ACCEPT, expected_allocation_version }"
        actor: ChannelRep
        preconditions: ["acting ChannelRep's id == allocation.channel_account_id", "expected_allocation_version == allocation.version (OCC, else ERR_STALE_VERSION)"]
        side_effects: ["ChannelAccount.outstanding_exposure_cents recomputed", "increments Allocation.version by 1"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /grillops/allocations/{id}/respond { action: DECLINE, expected_allocation_version }"
        actor: ChannelRep
        preconditions: ["acting ChannelRep's id == allocation.channel_account_id", "OCC version match"]
        side_effects: ["allocated_units := 0 and the offered units return to InventoryLot.units_available (may flip DEPLETED -> AVAILABLE)", "increments Allocation.version by 1"]
      - from: OFFERED
        to: OFFERED
        trigger: "POST /grillops/allocations/{id}/respond { action: REVISE, allocated_units, expected_allocation_version }"
        actor: PlannerAdmin
        preconditions: ["new allocated_units passes the lot-capacity and credit checks after recapturing the current offer", "OCC version match"]
        side_effects: ["allocated_units := new value; lot availability and channel exposure recomputed", "increments Allocation.version by 1 (this is the re-offer that makes a concurrent ACCEPT stale)"]
      - from: ACCEPTED
        to: PARTIALLY_CONSUMED
        trigger: "system: first Sale consumes units against this allocation"
        actor: system
        preconditions: ["sale.quantity < allocated_units - committed_units before this sale... boundary: reaching equality flips to CONSUMED instead"]
        side_effects: ["committed_units += sale.quantity", "InventoryLot.units_consumed recomputed", "ChannelAccount.outstanding_exposure_cents recomputed", "increments Allocation.version by 1"]
      - from: PARTIALLY_CONSUMED
        to: CONSUMED
        trigger: "system: Sale consumption makes committed_units == allocated_units"
        actor: system
        preconditions: []
        side_effects: ["InventoryLot.units_consumed recomputed", "increments Allocation.version by 1"]
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system: Sale consumption makes committed_units == allocated_units in one step"
        actor: system
        preconditions: []
        side_effects: ["committed_units += sale.quantity", "InventoryLot.units_consumed recomputed", "increments Allocation.version by 1"]
      - from: ACCEPTED
        to: RELEASED
        trigger: "POST /grillops/allocations/{id}/respond { action: RELEASE, expected_allocation_version } or clearance waterfall recapture"
        actor: ChannelRep
        preconditions: ["acting ChannelRep's id == allocation.channel_account_id when triggered via respond", "OCC version match when triggered via respond"]
        side_effects: ["allocated_units := committed_units; unconsumed remainder returns to InventoryLot.units_available", "ChannelAccount.outstanding_exposure_cents recomputed", "increments Allocation.version by 1"]
      - from: PARTIALLY_CONSUMED
        to: RELEASED
        trigger: "POST /grillops/allocations/{id}/respond { action: RELEASE, expected_allocation_version } or clearance waterfall recapture"
        actor: ChannelRep
        preconditions: ["as above"]
        side_effects: ["allocated_units := committed_units; remainder returns to lot", "exposure recomputed", "increments Allocation.version by 1"]
      - from: PARTIALLY_CONSUMED
        to: PARTIALLY_CONSUMED
        trigger: "system: further Sale consumption short of CONSUMED, or a Sale RETURN decrementing committed_units"
        actor: system
        preconditions: []
        side_effects: ["committed_units adjusted", "lot units_consumed recomputed", "increments Allocation.version by 1"]
      - from: CONSUMED
        to: PARTIALLY_CONSUMED
        trigger: "system: Sale RETURN decrements committed_units below allocated_units"
        actor: system
        preconditions: []
        side_effects: ["committed_units -= returned quantity", "exposure recomputed", "increments Allocation.version by 1"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system: Season advance IN_SEASON -> CLEARANCE or CLEARANCE -> TRANSITIONED sweeps open offers"
        actor: system
        preconditions: []
        side_effects: ["allocated_units := 0; offered units return to lot availability", "increments Allocation.version by 1"]
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system: Season advance CLEARANCE -> TRANSITIONED"
        actor: system
        preconditions: []
        side_effects: ["allocated_units := committed_units; remainder returns to lot", "exposure recomputed", "increments Allocation.version by 1"]
      - from: PARTIALLY_CONSUMED
        to: EXPIRED
        trigger: "system: Season advance CLEARANCE -> TRANSITIONED"
        actor: system
        preconditions: []
        side_effects: ["allocated_units := committed_units; remainder returns to lot", "exposure recomputed", "increments Allocation.version by 1"]
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: a new Allocation POST for the same (season_id, channel_account_id, model_id) supersedes this one"
        actor: system
        preconditions: []
        side_effects: ["allocated_units := committed_units (0 for OFFERED); remainder returns to lot BEFORE the new allocation's capacity check", "increments Allocation.version by 1"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: same-tuple Allocation create supersedes"
        actor: system
        preconditions: []
        side_effects: ["allocated_units := committed_units; remainder returns to lot before the new capacity check", "exposure recomputed", "increments Allocation.version by 1"]
      - from: PARTIALLY_CONSUMED
        to: SUPERSEDED
        trigger: "system: same-tuple Allocation create supersedes"
        actor: system
        preconditions: []
        side_effects: ["as for ACCEPTED", "increments Allocation.version by 1"]

  - entity: Assembler
    initial_state: APPLIED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: APPLIED
        to: CERTIFIED
        trigger: "POST /grillops/assemblers/{id}/status { action: CERTIFY }"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["increments Assembler.version by 1"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /grillops/assemblers/{id}/status { action: SUSPEND } or system auto-suspend when no_show_count reaches NO_SHOW_SUSPEND_THRESHOLD"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "cascade: every AssemblyJob assigned to this assembler in {SCHEDULED} -> REQUESTED with assembler_id := null and windows cleared (IN_PROGRESS jobs are NOT touched)"
          - "increments Assembler.version by 1"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /grillops/assemblers/{id}/status { action: CERTIFY } (reinstatement)"
        actor: PlannerAdmin
        preconditions: ["provisional_quality_bp >= REINSTATE_MIN_PROVISIONAL_BP (7000)"]
        side_effects: ["increments Assembler.version by 1"]
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /grillops/assemblers/{id}/status { action: DECERTIFY }"
        actor: PlannerAdmin
        preconditions: ["official_quality_bp <= DECERTIFY_MAX_OFFICIAL_BP (4000)"]
        side_effects: ["cascade: assigned jobs in {SCHEDULED} -> REQUESTED (assembler_id := null); jobs in {IN_PROGRESS} -> CANCELLED", "increments Assembler.version by 1"]
      - from: SUSPENDED
        to: DECERTIFIED
        trigger: "POST /grillops/assemblers/{id}/status { action: DECERTIFY }"
        actor: PlannerAdmin
        preconditions: ["official_quality_bp <= DECERTIFY_MAX_OFFICIAL_BP (4000)"]
        side_effects: ["increments Assembler.version by 1"]

  - entity: AssemblyJob
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: ASSIGN, assembler_id, window_start, window_end }"
        actor: ServiceAgent
        preconditions:
          - "assembler exists and status == CERTIFIED (else ERR_ASSEMBLER_NOT_CERTIFIED)"
          - "window_end > window_start (else ERR_VALIDATION)"
          - "no active (SCHEDULED|IN_PROGRESS) job on the same sale whose raw half-open [window_start, window_end) overlaps (else ERR_ASSEMBLY_WINDOW_CONFLICT); adjacency (end == start) is allowed"
          - "no active job of the assembler overlapping; when the NEW job is IN_HOME its window is padded by +/- TRAVEL_BUFFER_MINUTES (45) before the half-open overlap test (else ERR_ASSEMBLER_BUFFER_CONFLICT); RETAIL_ASSEMBLY jobs are never padded"
          - "assembler.active_job_count < assembler.max_concurrent_jobs (else ERR_MAX_CONCURRENT_JOBS)"
        side_effects: ["assembler_id := payload, windows stored", "assembler.active_job_count += 1", "increments AssemblyJob.version by 1"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: ASSIGN, ... } (reschedule)"
        actor: ServiceAgent
        preconditions: ["same five checks as REQUESTED -> SCHEDULED"]
        side_effects: ["assembler_id := payload, windows stored", "new assembler.active_job_count += 1", "increments AssemblyJob.version by 1"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: START }"
        actor: Assembler
        preconditions: ["acting Assembler's id == job.assembler_id (else ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["increments AssemblyJob.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: COMPLETE }"
        actor: Assembler
        preconditions: ["acting Assembler's id == job.assembler_id"]
        side_effects: ["assembler.active_job_count -= 1", "assembler.jobs_completed += 1", "assembler.completion_history appends logical clock", "assembler quality scores recomputed", "increments AssemblyJob.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: CANCEL }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments AssemblyJob.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: CANCEL }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["assembler.active_job_count -= 1", "increments AssemblyJob.version by 1"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /grillops/assembly-jobs/{id}/transition { action: NO_SHOW }"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "hop 1: assembler.no_show_count += 1; no_show_history appends logical clock; assembler.active_job_count -= 1; quality scores recomputed"
          - "hop 2: when no_show_count reaches NO_SHOW_SUSPEND_THRESHOLD (3) the assembler auto-transitions CERTIFIED -> SUSPENDED"
          - "hop 3: that suspension cascades every other SCHEDULED job of the assembler -> REQUESTED (assembler_id := null, windows cleared)"
          - "increments AssemblyJob.version by 1"
        note: "the no-showed job keeps its assembler_id for audit; only its status changes."

  - entity: Sale
    initial_state: SOLD
    terminal_states: [RETURNED]
    transitions:
      - from: SOLD
        to: REGISTERED
        trigger: "POST /grillops/sales/{id}/transition { action: REGISTER, proof_of_purchase_token } or POST /grillops/devices/pair side effect"
        actor: ChannelRep
        preconditions: ["acting ChannelRep owns the sale when triggered via transition", "proof_of_purchase_token present (or synthesized 'APP-PAIR' by pairing)"]
        side_effects: ["registered_at := logical clock", "increments Sale.version by 1"]
      - from: SOLD
        to: RETURNED
        trigger: "POST /grillops/sales/{id}/transition { action: RETURN }"
        actor: ChannelRep
        preconditions: ["acting ChannelRep owns the sale"]
        side_effects:
          - "the ACTIVE allocation (ACCEPTED | PARTIALLY_CONSUMED | CONSUMED) for (season, channel, model) has committed_units -= sale.quantity; CONSUMED -> PARTIALLY_CONSUMED when it drops below allocated_units"
          - "InventoryLot.units_consumed recomputed; ChannelAccount attach rates and exposure recomputed"
          - "cascade: every WarrantyClaim of this sale in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED, REOPENED} -> DENIED (denied_at := clock); APPROVED/SETTLED claims are untouched"
          - "increments Sale.version by 1"
      - from: REGISTERED
        to: RETURNED
        trigger: "POST /grillops/sales/{id}/transition { action: RETURN }"
        actor: ChannelRep
        preconditions: ["acting ChannelRep owns the sale"]
        side_effects: ["same four side effects as SOLD -> RETURNED"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: REVIEW }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: REVIEW }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: REQUEST_INFO }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: SUBMIT_INFO }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: ESCALATE }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: APPROVE, goodwill_justification? }"
        actor: ServiceAgent
        preconditions:
          - "coverage_determination != OUT_OF_COVERAGE, OR goodwill_justification is non-empty (else ERR_VALIDATION; approving OUT_OF_COVERAGE sets goodwill := true; approving while GOODWILL_ELIGIBLE also sets goodwill := true)"
          - "provisional settlement per calc_warranty_settlement PROVISIONAL <= GOODWILL_CAP_CENTS (10000) when approving from UNDER_REVIEW (else ERR_GOODWILL_CAP_EXCEEDED — escalate first)"
        side_effects: ["provisional_settlement_cents computed and stored", "increments WarrantyClaim.version by 1"]
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: APPROVE, goodwill_justification? }"
        actor: ServiceAgent
        preconditions: ["coverage_determination != OUT_OF_COVERAGE OR goodwill_justification non-empty (GOODWILL_CAP_CENTS does NOT apply from ESCALATED)"]
        side_effects: ["provisional_settlement_cents computed and stored", "increments WarrantyClaim.version by 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: DENY } or Sale RETURN cascade"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["denied_at := logical clock", "increments WarrantyClaim.version by 1"]
      - from: ESCALATED
        to: DENIED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: DENY } or Sale RETURN cascade"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["denied_at := logical clock", "increments WarrantyClaim.version by 1"]
      - from: DENIED
        to: REOPENED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: REOPEN }"
        actor: ServiceAgent
        preconditions: ["logical clock <= denied_at + REOPEN_WINDOW_DAYS (30) (else ERR_REOPEN_WINDOW_EXPIRED)"]
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /grillops/warranty-claims/{id}/adjudicate { action: SETTLE, actual_labor_cents }"
        actor: ServiceAgent
        preconditions: ["actual_labor_cents present (else ERR_VALIDATION)"]
        side_effects:
          - "a PartsOrder is auto-created for the claim (quantity 1, fulfillment_type WARRANTY if IN_COVERAGE else GOODWILL) with the part chosen by the calc_warranty_settlement part selector; settlement_parts_order_id stored (null when selector pool empty)"
          - "final_settlement_cents and settlement_delta_cents computed per calc_warranty_settlement FINAL"
          - "increments WarrantyClaim.version by 1"

  - entity: PartSku
    initial_state: AVAILABLE
    terminal_states: [OBSOLETE]
    transitions:
      - from: AVAILABLE
        to: LOW_STOCK
        trigger: "system: stock_quantity drops to <= LOW_STOCK_THRESHOLD (10) but > 0 after allocation"
        actor: system
        preconditions: []
        side_effects: ["increments PartSku.version by 1"]
      - from: AVAILABLE
        to: EXHAUSTED
        trigger: "system: stock_quantity reaches 0, or POST /grillops/parts/{id}/transition { action: MARK_EXHAUSTED }"
        actor: system
        preconditions: []
        side_effects: ["increments PartSku.version by 1"]
      - from: LOW_STOCK
        to: EXHAUSTED
        trigger: "system: stock_quantity reaches 0, or MARK_EXHAUSTED"
        actor: system
        preconditions: []
        side_effects: ["increments PartSku.version by 1"]
      - from: LOW_STOCK
        to: AVAILABLE
        trigger: "POST /grillops/parts/{id}/transition { action: RESTOCK, quantity } pushing stock above LOW_STOCK_THRESHOLD"
        actor: PlannerAdmin
        preconditions: ["quantity >= 1"]
        side_effects: ["stock_quantity += quantity", "backorder fill: BACKORDERED PartsOrders resolved to this part are allocated in created_at ASC order (ties by PartsOrder.seq_no ASC, never id) until stock or backorders run out (each -> ALLOCATED, stock decremented)", "increments PartSku.version by 1"]
      - from: EXHAUSTED
        to: AVAILABLE
        trigger: "POST /grillops/parts/{id}/transition { action: RESTOCK, quantity }"
        actor: PlannerAdmin
        preconditions: ["quantity >= 1"]
        side_effects: ["stock_quantity += quantity; status lands AVAILABLE when resulting stock > LOW_STOCK_THRESHOLD else LOW_STOCK", "backorder fill in created_at ASC order, ties broken by PartsOrder.seq_no ASC (never id)", "increments PartSku.version by 1"]
      - from: AVAILABLE
        to: SUPERSEDED
        trigger: "POST /grillops/parts/{id}/transition { action: SUPERSEDE, successor_part_id }"
        actor: PlannerAdmin
        preconditions: ["successor exists, shares supersession_chain_id, and has a strictly higher chain_position (else ERR_VALIDATION)"]
        side_effects: ["increments PartSku.version by 1"]
      - from: LOW_STOCK
        to: SUPERSEDED
        trigger: "SUPERSEDE"
        actor: PlannerAdmin
        preconditions: ["as above"]
        side_effects: ["increments PartSku.version by 1"]
      - from: EXHAUSTED
        to: SUPERSEDED
        trigger: "SUPERSEDE"
        actor: PlannerAdmin
        preconditions: ["as above"]
        side_effects: ["increments PartSku.version by 1"]
      - from: SUPERSEDED
        to: OBSOLETE
        trigger: "POST /grillops/parts/{id}/transition { action: MARK_OBSOLETE }"
        actor: PlannerAdmin
        preconditions: []
        side_effects: ["increments PartSku.version by 1"]

  - entity: PartsOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "system: synchronous resolution within POST /grillops/parts-orders when the resolved part has stock_quantity >= quantity, or backorder fill on RESTOCK"
        actor: system
        preconditions: []
        side_effects: ["resolved_part_id stored; resolved part's stock_quantity -= quantity (may flip AVAILABLE -> LOW_STOCK -> EXHAUSTED)", "total_cost_cents computed", "increments PartsOrder.version by 1"]
      - from: REQUESTED
        to: BACKORDERED
        trigger: "system: synchronous resolution when the requested part is EXHAUSTED and no supersession-chain successor can fulfil"
        actor: system
        preconditions: []
        side_effects: ["resolved_part_id := requested part_id", "increments PartsOrder.version by 1"]
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system: RESTOCK backorder fill (created_at ASC, ties by seq_no ASC)"
        actor: system
        preconditions: []
        side_effects: ["stock decremented on the resolved part", "increments PartsOrder.version by 1"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /grillops/parts-orders/{id}/transition { action: SHIP }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments PartsOrder.version by 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /grillops/parts-orders/{id}/transition { action: DELIVER }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments PartsOrder.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /grillops/parts-orders/{id}/transition { action: CANCEL }"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments PartsOrder.version by 1"]
      - from: BACKORDERED
        to: CANCELLED
        trigger: "CANCEL"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["increments PartsOrder.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "CANCEL"
        actor: ServiceAgent
        preconditions: []
        side_effects: ["compensation: resolved part's stock_quantity += quantity (may flip EXHAUSTED/LOW_STOCK upward)", "increments PartsOrder.version by 1"]

  - entity: ConnectedDevice
    initial_state: PAIRED
    terminal_states: [UNPAIRED]
    transitions:
      - from: PAIRED
        to: UPDATING
        trigger: "POST /grillops/devices/{id}/firmware { action: UPDATE, target_version }"
        actor: AppUser
        preconditions: ["target_version present and != current firmware_version (else ERR_VALIDATION)"]
        side_effects: ["immediately continues to UPDATING -> PAIRED within the same request (synchronous apply)"]
      - from: UPDATING
        to: PAIRED
        trigger: "system: synchronous completion of the UPDATE action"
        actor: system
        preconditions: []
        side_effects: ["firmware_version := target_version", "increments ConnectedDevice.version by 1"]
      - from: PAIRED
        to: UNPAIRED
        trigger: "POST /grillops/devices/{id}/firmware { action: UNPAIR }"
        actor: AppUser
        preconditions: []
        side_effects: ["increments ConnectedDevice.version by 1"]

  - entity: InventoryLot
    initial_state: BUILDING
    terminal_states: [CLOSEOUT]
    transitions:
      - from: BUILDING
        to: AVAILABLE
        trigger: "system: Season BUILD -> ALLOCATION advance activates the season's lots"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryLot.version by 1"]
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: units_available reaches 0 after an allocation create/REVISE"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryLot.version by 1"]
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: a release/decline/expiry/supersede recapture makes units_available > 0"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryLot.version by 1"]
      - from: AVAILABLE
        to: CLOSEOUT
        trigger: "system: Season CLEARANCE -> TRANSITIONED cascade via the model's discontinuation"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryLot.version by 1"]
      - from: DEPLETED
        to: CLOSEOUT
        trigger: "system: Season CLEARANCE -> TRANSITIONED cascade"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryLot.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-season
    parent_entity: Season
    write_endpoint: "POST /grillops/allocations"
    occ_field: expected_season_version
    description: |
      Creating an Allocation against a Season whose version has advanced since
      the client last observed it is rejected. This captures the case where an
      earlier Allocation create for the same (season, channel, model) tuple has
      just legitimately superseded the prior offer (and every allocation create
      bumps Season.version), so the current writer's view of the season's
      allocation book is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-respond-stale-allocation
    parent_entity: Allocation
    write_endpoint: "POST /grillops/allocations/{id}/respond"
    occ_field: expected_allocation_version
    description: |
      Responding to an Allocation offer whose version has advanced since the
      client last observed it is rejected. A PlannerAdmin REVISE legitimately
      re-offers the same allocation with different allocated_units while it
      stays OFFERED, so an ACCEPT carrying the pre-revision version must not
      bind the channel to stale terms.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_clearance_price
    trigger: "Sale creation when the referenced Season.status == CLEARANCE; result stored on Sale.unit_price_cents"
    algorithm: threshold
    formula: |
      weeks_into_clearance = floor((sold_at - season.clearance_start) / 7 days)
      tier_pct = TIER1_MARKDOWN_PCT if weeks <= 2
                 else TIER2_MARKDOWN_PCT if weeks <= 4
                 else TIER3_MARKDOWN_PCT            # weeks >= 5 (boundary: week index == TIER2_START_WEEK(3) is tier 2; == TIER3_START_WEEK(5) is tier 3)
      lot = the InventoryLot of (season, model)
      coverage_bp = floor(10000 * lot.units_available / max(lot.units_built, 1))
      adj = +OVERSTOCK_EXTRA_PCT if coverage_bp >= COVERAGE_HIGH_BP (inclusive)
            else -UNDERSTOCK_RELIEF_PCT if coverage_bp <= COVERAGE_LOW_BP (inclusive)
            else 0
      markdown_pct = min(max(tier_pct + adj, 0), MAX_MARKDOWN_PCT)
      after_markdown = round_half_up(model.base_price_cents * (100 - markdown_pct) / 100)
      unit_price_cents = round_half_up(after_markdown * (10000 - channel.subsidy_bp) / 10000)
    input_set: "the Sale's season, model, channel and the (season, model) InventoryLot; runs only when season.status == CLEARANCE (otherwise unit_price_cents = model.base_price_cents)"
    constants: { TIER1_MARKDOWN_PCT: 15, TIER2_MARKDOWN_PCT: 30, TIER3_MARKDOWN_PCT: 50, TIER2_START_WEEK: 3, TIER3_START_WEEK: 5, COVERAGE_HIGH_BP: 6000, COVERAGE_LOW_BP: 2000, OVERSTOCK_EXTRA_PCT: 10, UNDERSTOCK_RELIEF_PCT: 5, MAX_MARKDOWN_PCT: 70 }
    precision: "integer cents; two pinned round_half_up steps (after markdown, after subsidy) — rounding order MUST NOT be swapped"
    variants:
      - name: in_season_pricing
        when: "season.status == IN_SEASON"
        difference: "no markdown, no subsidy: unit_price_cents = model.base_price_cents"
      - name: clearance_pricing
        when: "season.status == CLEARANCE"
        difference: "full tier/coverage/subsidy pipeline above; identical cart inputs price differently under the two variants"

  - name: calc_assembly_fee
    trigger: "AssemblyJob creation; result stored on AssemblyJob.fee_cents"
    algorithm: aggregation
    formula: |
      base = BASE_ASSEMBLY_FEE_CENTS
      surcharge = IN_HOME_SURCHARGE_CENTS if job_type == IN_HOME else 0
      travel = max(0, distance_mi - INCLUDED_MILES) * RATE_PER_MILE_CENTS if job_type == IN_HOME else 0
      subsidy = channel_of(sale).subsidy_bp
      # PINNED ROUNDING ORDER: the subsidy is applied to EACH component and
      # rounded half-up to cents individually; the rounded components are then
      # summed. Summing first and rounding once produces a different cent value
      # and is NOT compliant.
      fee_cents = round_half_up(base * (10000 - subsidy) / 10000)
                + round_half_up(surcharge * (10000 - subsidy) / 10000)
                + round_half_up(travel * (10000 - subsidy) / 10000)
    input_set: "the AssemblyJob's job_type and distance_mi; the subsidy of the ChannelAccount on the referenced Sale"
    constants: { BASE_ASSEMBLY_FEE_CENTS: 7999, IN_HOME_SURCHARGE_CENTS: 5005, INCLUDED_MILES: 15, RATE_PER_MILE_CENTS: 149 }
    precision: "integer cents; round_half_up per component BEFORE summation (order is load-bearing)"
    variants:
      - name: retail_fee
        when: "job_type == RETAIL_ASSEMBLY"
        difference: "surcharge and travel are both 0 — only the subsidized base remains"
      - name: in_home_fee
        when: "job_type == IN_HOME"
        difference: "all three components participate; per-component rounding diverges from sum-then-round"

  - name: calc_allocation_waterfall
    trigger: "Season advance IN_SEASON -> CLEARANCE"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (breaks the circularity: released units depend
      # on consumption rates, which depend on allocated_units, which the
      # redistribution below then mutates — all rates are computed on the
      # PRE-RELEASE snapshot and never recomputed inside the run):
      # step 1: snapshot every allocation of the season in {ACCEPTED, PARTIALLY_CONSUMED}:
      #   rate_bp(A) = floor(10000 * A.committed_units / A.allocated_units)   # allocated_units > 0 guaranteed while active
      # step 2: for each A with rate_bp(A) < MIN_CONSUMPTION_RATE_BP (strictly below 5000):
      #   released = A.allocated_units - A.committed_units
      #   A.allocated_units := A.committed_units; A.status := RELEASED
      #   lot.units_available += released; pool += released
      # step 3: candidates = surviving {ACCEPTED, PARTIALLY_CONSUMED} allocations
      #   (rate_bp >= 5000), sorted by channel.allocation_priority DESC,
      #   tie-break channel.created_at ASC (NEVER id)
      # step 4: original_pool = pool; for each candidate in order while pool > 0:
      #   share = min(floor(original_pool * MAX_REDISTRIB_SHARE_BP / 10000), pool)
      #   candidate.allocated_units += share; lot.units_available -= share; pool -= share
      # step 5: any remainder stays in lot.units_available
    input_set: "allocations of the advancing season in {ACCEPTED, PARTIALLY_CONSUMED} and their channels; OFFERED allocations are expired by the season transition BEFORE this calc runs"
    constants: { MIN_CONSUMPTION_RATE_BP: 5000, MAX_REDISTRIB_SHARE_BP: 4000 }
    precision: "integer units; floor for rate_bp and share"
    variants: []

  - name: calc_warranty_settlement
    trigger: "PROVISIONAL at adjudicate APPROVE; FINAL at adjudicate SETTLE"
    algorithm: aggregation
    formula: |
      # PROVISIONAL (catalog schedule):
      provisional_settlement_cents = PART_COST[component] + LABOR_ALLOWANCE[component]
      # FINAL (actuals):
      part_actual = total_cost_cents of the auto-created PartsOrder when one was
                    created (selector below), else PART_COST[component]
      final_settlement_cents = part_actual + actual_labor_cents
      settlement_delta_cents = final_settlement_cents - provisional_settlement_cents
      # Part selector for the auto-created order (eligibility / ranking /
      # tie-break / fallback all pinned):
      #   eligible: PartSku with component == claim.component,
      #             sale's model_code in compatible_model_codes,
      #             status in {AVAILABLE, LOW_STOCK}, stock_quantity >= 1
      #   ranking:  unit_cost_cents ASC; tie-break created_at ASC (NEVER id)
      #   fallback: pool empty -> no PartsOrder is created,
      #             settlement_parts_order_id := null, part_actual = schedule cost
    input_set: "the claim's component, the sale's model, and the PartSku catalog at SETTLE time"
    constants: { PART_COST_BURNER_CENTS: 3200, PART_COST_GRATE_CENTS: 2400, PART_COST_ELECTRONICS_CENTS: 4800, PART_COST_OTHER_CENTS: 1500, LABOR_ALLOWANCE_BURNER_CENTS: 4500, LABOR_ALLOWANCE_GRATE_CENTS: 4500, LABOR_ALLOWANCE_ELECTRONICS_CENTS: 7500, LABOR_ALLOWANCE_OTHER_CENTS: 2500, GOODWILL_CAP_CENTS: 10000 }
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at APPROVE"
        difference: "catalog part-cost schedule + fixed labor allowance; does not observe real parts stock"
      - name: final
        when: "at SETTLE"
        difference: "actual resolved part cost + actual_labor_cents from the payload; identical claim data settles at a different figure than the provisional"

  - name: calc_coverage_determination
    trigger: "WarrantyClaim creation; stored on claim.coverage_determination"
    algorithm: chronological
    formula: |
      years = model.{burner|grate|electronics|other}_coverage_years per claim.component
      expiry = sale.sold_at + years years
      determination = IN_COVERAGE      if claim_date <= expiry                      # boundary INCLUSIVE
                      else GOODWILL_ELIGIBLE if claim_date <= expiry + GOODWILL_EXTENSION_DAYS days
                      else OUT_OF_COVERAGE
    input_set: "the claim's claim_date, the sale's sold_at, the model's per-component coverage years"
    constants: { BURNER_COVERAGE_YEARS: 10, GRATE_COVERAGE_YEARS: 5, ELECTRONICS_COVERAGE_YEARS: 3, OTHER_COVERAGE_YEARS: 2, GOODWILL_EXTENSION_DAYS: 90 }
    precision: "datetime comparison at day granularity; the exact expiry day is still IN_COVERAGE"
    variants: []

  - name: calc_assembler_quality
    trigger: "recomputed on every NO_SHOW / COMPLETE transition affecting the assembler"
    algorithm: weighted_scoring
    formula: |
      official_quality_bp = max(0, 10000 - NO_SHOW_PENALTY_BP * no_show_count)
      recent_no_shows   = count(no_show_history entries within PROVISIONAL_WINDOW_DAYS of the logical clock)
      recent_completions = count(completion_history entries within PROVISIONAL_WINDOW_DAYS of the logical clock)
      provisional_quality_bp = clamp(10000 - NO_SHOW_PENALTY_BP * recent_no_shows
                                     + COMPLETION_BONUS_BP * recent_completions, 0, 10000)
    input_set: "assembler counters and the two append-only event histories; window boundaries inclusive of exactly-90-days-old events"
    constants: { NO_SHOW_PENALTY_BP: 1200, COMPLETION_BONUS_BP: 25, PROVISIONAL_WINDOW_DAYS: 90 }
    precision: "integer basis points"
    variants:
      - name: official
        when: "lifetime view; used by DECERTIFY guard"
        difference: "every no-show counts forever; completions give no credit"
      - name: provisional
        when: "rolling 90-day view; used by the SUSPENDED -> CERTIFIED reinstatement guard"
        difference: "no-shows older than 90 days are forgiven and recent completions add bonus — same event history yields a different score"

  - name: calc_attach_rate
    trigger: "recomputed on ChannelAccount on every Sale create / RETURN for that channel"
    algorithm: aggregation
    formula: |
      denom = count(Sale where channel_account_id == channel.id AND status in {SOLD, REGISTERED})
      accessory_attach_rate = round_half_up(count(denom sales with accessory_count >= 1) / denom, 4) if denom > 0 else 0.0000
      fuel_attach_rate      = round_half_up(count(denom sales with has_fuel) / denom, 4) if denom > 0 else 0.0000
    input_set: "sales of the channel; RETURNED sales are excluded from BOTH numerator and denominator"
    constants: {}
    precision: "4 decimal places, round_half_up; empty denominator yields exactly 0.0000 (no error)"
    variants: []

  - name: calc_build_sizing
    trigger: "InventoryLot creation (both variants stored); actual variant recomputed on every consumption change while IN_SEASON/CLEARANCE"
    algorithm: forward_looking
    formula: |
      # FORWARD variant (always available):
      prior_total = sum(units_consumed over all lots of the Season with the greatest year < this season's year)
      base = prior_total if such a season exists else this_season.demand_forecast_units
      recommended_build_forward_units = floor(base * GROWTH_BP / 10000 * model.demand_share_bp / 10000)
      # ACTUAL (chronological run-rate) variant:
      if season.status in {IN_SEASON, CLEARANCE}:
        weeks_elapsed = max(1, floor((logical_clock - season.in_season_start) / 7 days))
        recommended_build_actual_units = floor(lot.units_consumed * SEASON_WEEKS / weeks_elapsed)
      else:
        recommended_build_actual_units = null
    input_set: "this lot's season and model; the prior season's lots for the forward variant"
    constants: { GROWTH_BP: 11000, SEASON_WEEKS: 26 }
    precision: "integer units, floor"
    variants:
      - name: forward
        when: "planning/build context"
        difference: "projects from prior-season consumption with a growth multiplier; ignores current-season run-rate"
      - name: actual
        when: "season is IN_SEASON or CLEARANCE"
        difference: "annualizes the observed sell-through; identical lot data yields a different recommendation than the forward variant"

  - name: calc_parts_supersession_resolution
    trigger: "PartsOrder creation (and the claim-settlement part selector uses the same walk restricted to quantity 1)"
    algorithm: topological
    formula: |
      # Ordered walk along the requested part's supersession chain:
      candidate = requested part
      loop:
        if candidate.status in {AVAILABLE, LOW_STOCK} and candidate.stock_quantity >= quantity:
          resolved_part_id = candidate.id; allocate (stock -= quantity); STOP
        if candidate.status == OBSOLETE: fail ERR_PART_UNAVAILABLE
        next = PartSku with same supersession_chain_id and chain_position = candidate.chain_position + 1
        if next exists: candidate = next; continue
        # chain exhausted:
        if requested part.status == EXHAUSTED: resolved = requested; order -> BACKORDERED; STOP
        else fail ERR_PART_UNAVAILABLE   # requested SUPERSEDED with no fulfilable successor
    input_set: "the requested PartSku and its supersession chain (chain_position ordering, unique per chain)"
    constants: { LOW_STOCK_THRESHOLD: 10 }
    precision: "chain walk is deterministic because chain_position is unique within supersession_chain_id"
    variants: []

  - name: calc_allocation_credit
    trigger: "Allocation create / REVISE; gates with ERR_CREDIT_LIMIT_EXCEEDED"
    algorithm: aggregation
    formula: |
      exposure(channel) = sum over channel's allocations in {ACCEPTED, PARTIALLY_CONSUMED}
                          of (allocated_units - committed_units) * model.base_price_cents
      check: exposure(channel) + allocated_units(new) * model.base_price_cents <= channel.credit_limit_cents
      # equality passes (boundary inclusive); exceeding by 1 cent fails
    input_set: "the channel's active allocations and their models"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "the acting role is listed in the endpoint's roles AND, for action endpoints, is permitted for the specific action (PlannerAdmin may REVISE but never ACCEPT/DECLINE/RELEASE; ChannelRep may never REVISE; Assembler only START/COMPLETE; AppUser only device endpoints)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-template ids resolve to existing entities, validated left-to-right (season -> lot, model -> lots, sale -> claim/device, etc.)", error_id: ERR_SEASON_NOT_FOUND, http_status: 404, applies_to: "all — use the per-entity NOT_FOUND code: ERR_SEASON_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ASSEMBLER_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_PARTS_ORDER_NOT_FOUND | ERR_DEVICE_NOT_FOUND" }
  - { priority: 4, category: existence, check: "entity-backed ownership: ChannelRep's X-User-ID must equal the target's channel_account_id (allocation respond/view, sale create/transition); Assembler's X-User-ID must equal job.assembler_id (START/COMPLETE) or the assembler being viewed", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 5, category: state, check: "target entity is in a state from which the requested transition exists (posture gates, terminal lockdowns, invalid-from). Allocation create requires Season.status == ALLOCATION; lot create requires {PLANNING, BUILD}; sale create requires {IN_SEASON, CLEARANCE}; claim create requires sale REGISTERED (SOLD -> ERR_SALE_NOT_REGISTERED, RETURNED -> ERR_SALE_RETURNED)", error_id: ERR_SEASON_POSTURE_FORBIDDEN, http_status: 409, applies_to: "all state-changing endpoints — use the specific code: ERR_INVALID_STATE | ERR_SEASON_POSTURE_FORBIDDEN | ERR_ALLOCATION_NOT_ACTIONABLE | ERR_JOB_NOT_SCHEDULABLE | ERR_CLAIM_NOT_ADJUDICATABLE | ERR_SALE_NOT_REGISTERED | ERR_SALE_RETURNED | ERR_DEVICE_NOT_PAIRED | ERR_DEVICE_ALREADY_PAIRED" }
  - { priority: 6, category: business_referential, check: "request body is well-formed: required fields present, enums valid, date ordering (build_start < allocation_open < in_season_start < clearance_start < season_end; window_end > window_start), serials length == quantity, supersede successor in same chain with higher chain_position, APPROVE of OUT_OF_COVERAGE carries goodwill_justification, SETTLE carries actual_labor_cents", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 7, category: business_referential, check: "referenced entities' state/compatibility: assembler CERTIFIED for ASSIGN (ERR_ASSEMBLER_NOT_CERTIFIED); model sellable (ACTIVE|CLEARANCE_ELIGIBLE) for sale create and model ACTIVE for allocation create (ERR_MODEL_NOT_SELLABLE); an ACTIVE allocation exists for (season, channel, model) at sale create (ERR_NO_ACTIVE_ALLOCATION); part OBSOLETE or unfulfillable superseded (ERR_PART_UNAVAILABLE); part.compatible_model_codes contains the sale's model_code (ERR_PART_INCOMPATIBLE)", error_id: ERR_PART_INCOMPATIBLE, http_status: 422, applies_to: "assign/sale/allocations/parts-orders" }
  - { priority: 8, category: business_temporal, check: "interval and deadline rules: season IN_SEASON closed-interval disjointness (ERR_SEASON_OVERLAP); sale-resource job overlap half-open (ERR_ASSEMBLY_WINDOW_CONFLICT); assembler padded-window conflict for IN_HOME (ERR_ASSEMBLER_BUFFER_CONFLICT); free-of-charge parts order requires clock <= model.support_obligation_until (ERR_PARTS_OBLIGATION_EXPIRED); claim REOPEN within REOPEN_WINDOW_DAYS (ERR_REOPEN_WINDOW_EXPIRED)", error_id: ERR_ASSEMBLY_WINDOW_CONFLICT, http_status: 409, applies_to: "seasons create, job assign, parts-orders create, claim adjudicate" }
  - { priority: 9, category: business_constraint, check: "capacity/uniqueness/quota: lot capacity sum of active allocated_units <= units_available (ERR_ALLOCATION_CAPACITY_EXCEEDED); serial uniqueness (ERR_DUPLICATE_SERIAL); assembler active_job_count < max_concurrent_jobs (ERR_MAX_CONCURRENT_JOBS); at most one PAIRED device per sale (ERR_DEVICE_ALREADY_PAIRED); chain_position unique within supersession_chain_id (ERR_VALIDATION)", error_id: ERR_ALLOCATION_CAPACITY_EXCEEDED, http_status: 409, applies_to: "allocations, sales, job assign, devices, parts" }
  - { priority: 10, category: business_fiscal, check: "fiscal limits last: calc_allocation_credit at allocation create/REVISE (ERR_CREDIT_LIMIT_EXCEEDED); APPROVE from UNDER_REVIEW with provisional settlement > GOODWILL_CAP_CENTS (ERR_GOODWILL_CAP_EXCEEDED)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "allocations create/respond, claim adjudicate" }

# =============================================================================
# §1.5 API Endpoint Table  (40 endpoints; all paths under api_prefix /grillops)
# =============================================================================
endpoints:
  - { method: POST, path: "/grillops/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z (DEFAULT_CLOCK_ISO); the clock MUST NOT fall back to wall-clock time.", roles: [PlannerAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["recomputes every clock-dependent derived field lazily on next read"] }

  - { method: POST, path: "/grillops/seasons", description: "Create a season in PLANNING", roles: [PlannerAdmin], code: 201, input: [name, year, build_start, allocation_open, in_season_start, clearance_start, season_end, demand_forecast_units], output: Season, side_effects: ["closed-interval IN_SEASON disjointness check (ERR_SEASON_OVERLAP)"] }
  - { method: GET, path: "/grillops/seasons/{id}", description: "Read a season", roles: [PlannerAdmin, ChannelRep, ServiceAgent], code: 200, input: [], output: Season, side_effects: [] }
  - { method: POST, path: "/grillops/seasons/{id}/advance", description: "Advance the season lifecycle one step; target_status must be the immediate next state; guards per §1.2", roles: [PlannerAdmin], code: 200, input: [target_status], output: Season, side_effects: ["per-transition cascades (lot activation, offer expiry, allocation waterfall, model discontinuation, lot closeout)", "increments Season.version by 1"] }
  - { method: POST, path: "/grillops/seasons/{id}/lots", description: "Create an inventory lot (season must be PLANNING or BUILD)", roles: [PlannerAdmin], code: 201, input: [model_id, build_week, units_built], output: InventoryLot, side_effects: ["computes recommended_build_forward_units (and actual variant when applicable)"] }
  - { method: GET, path: "/grillops/seasons/{id}/lots", description: "List lots of a season (FK reverse view for InventoryLot.season_id)", roles: [PlannerAdmin, ChannelRep], code: 200, input: ["status?"], output: "InventoryLot[]", side_effects: [] }
  - { method: GET, path: "/grillops/models/{id}/lots", description: "List lots of a model (FK reverse view for InventoryLot.model_id)", roles: [PlannerAdmin, ChannelRep], code: 200, input: ["status?"], output: "InventoryLot[]", side_effects: [] }

  - { method: POST, path: "/grillops/models", description: "Create a grill model in ACTIVE", roles: [PlannerAdmin], code: 201, input: [model_code, model_family, model_year, base_price_cents, demand_share_bp, "burner_coverage_years?", "grate_coverage_years?", "electronics_coverage_years?", "other_coverage_years?", "parts_support_years?", "current_firmware_version?"], output: GrillModel, side_effects: [] }
  - { method: GET, path: "/grillops/models/{id}", description: "Read a model", roles: [PlannerAdmin, ChannelRep, ServiceAgent], code: 200, input: [], output: GrillModel, side_effects: [] }
  - { method: POST, path: "/grillops/models/{id}/lifecycle", description: "Model lifecycle action: MARK_CLEARANCE_ELIGIBLE | DISCONTINUE | MARK_PARTS_ONLY | RETIRE", roles: [PlannerAdmin], code: 200, input: [action], output: GrillModel, side_effects: ["DISCONTINUE stamps discontinued_at and computes support_obligation_until", "increments GrillModel.version by 1"] }

  - { method: POST, path: "/grillops/channels", description: "Create a channel account", roles: [PlannerAdmin], code: 201, input: [name, channel_type, "service_tier?", allocation_priority, credit_limit_cents], output: ChannelAccount, side_effects: ["subsidy_bp derived from channel_type"] }
  - { method: GET, path: "/grillops/channels/{id}", description: "Read a channel account including derived exposure and attach rates (ChannelRep limited to own id)", roles: [PlannerAdmin, ChannelRep, ServiceAgent], code: 200, input: [], output: ChannelAccount, side_effects: [] }

  - { method: POST, path: "/grillops/allocations", description: "Offer units of a model to a channel for a season (season must be ALLOCATION). A second create for the same (season, channel, model) supersedes the active allocation.", roles: [PlannerAdmin], code: 201, input: [season_id, channel_account_id, model_id, allocated_units, expected_season_version], output: Allocation, side_effects: ["OCC check on Season.version", "same-tuple active allocation -> SUPERSEDED with unit recapture BEFORE the capacity check", "lot availability recomputed", "channel exposure recomputed", "increments Season.version by 1"] }
  - { method: GET, path: "/grillops/allocations/{id}", description: "Read an allocation (ChannelRep limited to own)", roles: [PlannerAdmin, ChannelRep], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/grillops/allocations", description: "List allocations with filters (FK reverse view for season_id / channel_account_id / model_id); ChannelRep sees only own", roles: [PlannerAdmin, ChannelRep], code: 200, input: ["season_id?", "channel_account_id?", "model_id?", "status?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/grillops/allocations/{id}/respond", description: "Respond to an offer: ACCEPT | DECLINE | RELEASE (ChannelRep, own allocations) or REVISE (PlannerAdmin, re-offer with new allocated_units)", roles: [PlannerAdmin, ChannelRep], code: 200, input: [action, expected_allocation_version, "allocated_units?"], output: Allocation, side_effects: ["OCC check on Allocation.version", "unit recapture on DECLINE/RELEASE", "lot availability and channel exposure recomputed", "increments Allocation.version by 1"] }

  - { method: POST, path: "/grillops/assemblers", description: "Register a third-party assembler (starts APPLIED)", roles: [PlannerAdmin], code: 201, input: [name, "certification_level?", service_regions, "max_concurrent_jobs?"], output: Assembler, side_effects: [] }
  - { method: GET, path: "/grillops/assemblers/{id}", description: "Read an assembler (Assembler role limited to self)", roles: [PlannerAdmin, ServiceAgent, Assembler], code: 200, input: [], output: Assembler, side_effects: [] }
  - { method: POST, path: "/grillops/assemblers/{id}/status", description: "Assembler lifecycle: CERTIFY (also reinstatement from SUSPENDED) | SUSPEND | DECERTIFY", roles: [PlannerAdmin, ServiceAgent], code: 200, input: [action], output: Assembler, side_effects: ["SUSPEND/DECERTIFY cascade unassigns SCHEDULED jobs", "increments Assembler.version by 1"] }

  - { method: POST, path: "/grillops/assembly-jobs", description: "Request an assembly job for a sale; fee computed immediately; scheduling happens at ASSIGN", roles: [ChannelRep, ServiceAgent], code: 201, input: [sale_id, job_type, "distance_mi?"], output: AssemblyJob, side_effects: ["calc_assembly_fee"] }
  - { method: GET, path: "/grillops/assembly-jobs/{id}", description: "Read a job", roles: [PlannerAdmin, ServiceAgent, Assembler, ChannelRep], code: 200, input: [], output: AssemblyJob, side_effects: [] }
  - { method: GET, path: "/grillops/assembly-jobs", description: "List jobs with filters (FK reverse view for assembler_id / sale_id)", roles: [PlannerAdmin, ServiceAgent, Assembler, ChannelRep], code: 200, input: ["assembler_id?", "sale_id?", "status?"], output: "AssemblyJob[]", side_effects: [] }
  - { method: POST, path: "/grillops/assembly-jobs/{id}/transition", description: "Job lifecycle: ASSIGN (ServiceAgent; assembler_id + window_start + window_end) | START | COMPLETE (Assembler, own job) | CANCEL | NO_SHOW (ServiceAgent)", roles: [ServiceAgent, Assembler], code: 200, input: [action, "assembler_id?", "window_start?", "window_end?"], output: AssemblyJob, side_effects: ["overlap/buffer/capacity checks on ASSIGN", "assembler counters and quality recompute on COMPLETE/NO_SHOW", "auto-suspend cascade at 3 no-shows", "increments AssemblyJob.version by 1"] }

  - { method: POST, path: "/grillops/sales", description: "Record a channel sale; consumes allocation units; proof_of_purchase_token at creation registers immediately", roles: [ChannelRep], code: 201, input: [season_id, model_id, channel_account_id, quantity, "accessories?", "serials?", "proof_of_purchase_token?"], output: Sale, side_effects: ["allocation consumption (PARTIALLY_CONSUMED / CONSUMED)", "unit_price_cents via calc_clearance_price when CLEARANCE", "channel attach rates and exposure recomputed", "lot units_consumed recomputed"] }
  - { method: GET, path: "/grillops/sales/{id}", description: "Read a sale (ChannelRep limited to own)", roles: [PlannerAdmin, ChannelRep, ServiceAgent], code: 200, input: [], output: Sale, side_effects: [] }
  - { method: GET, path: "/grillops/sales", description: "List sales with filters (FK reverse view for season_id / model_id / channel_account_id); ChannelRep sees only own", roles: [PlannerAdmin, ChannelRep, ServiceAgent], code: 200, input: ["season_id?", "model_id?", "channel_account_id?", "status?"], output: "Sale[]", side_effects: [] }
  - { method: POST, path: "/grillops/sales/{id}/transition", description: "Sale lifecycle: REGISTER (late proof-of-purchase) | RETURN", roles: [ChannelRep, ServiceAgent], code: 200, input: [action, "proof_of_purchase_token?"], output: Sale, side_effects: ["RETURN restores committed units to the allocation and denies open claims", "increments Sale.version by 1"] }

  - { method: POST, path: "/grillops/warranty-claims", description: "File a warranty claim against a REGISTERED sale; coverage_determination computed at creation", roles: [ServiceAgent], code: 201, input: [sale_id, component, failure_description, "serial_number?"], output: WarrantyClaim, side_effects: ["calc_coverage_determination"] }
  - { method: GET, path: "/grillops/sales/{id}/warranty-claims", description: "List claims of a sale (FK reverse view for WarrantyClaim.sale_id); also serves as the claim read view", roles: [ServiceAgent, PlannerAdmin, ChannelRep], code: 200, input: ["status?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/grillops/warranty-claims/{id}/adjudicate", description: "Adjudication: REVIEW | REQUEST_INFO | SUBMIT_INFO | ESCALATE | APPROVE | DENY | REOPEN | SETTLE", roles: [ServiceAgent], code: 200, input: [action, "goodwill_justification?", "actual_labor_cents?"], output: WarrantyClaim, side_effects: ["APPROVE computes provisional settlement", "SETTLE auto-creates the settlement PartsOrder and computes final settlement + delta", "increments WarrantyClaim.version by 1"] }

  - { method: POST, path: "/grillops/parts", description: "Create a part SKU (AVAILABLE; auto LOW_STOCK when stock <= 10)", roles: [PlannerAdmin], code: 201, input: [part_number, component, compatible_model_codes, supersession_chain_id, chain_position, unit_cost_cents, stock_quantity], output: PartSku, side_effects: ["chain_position uniqueness within supersession_chain_id"] }
  - { method: GET, path: "/grillops/parts/{id}", description: "Read a part", roles: [PlannerAdmin, ServiceAgent], code: 200, input: [], output: PartSku, side_effects: [] }
  - { method: POST, path: "/grillops/parts/{id}/transition", description: "Part lifecycle: RESTOCK (quantity) | MARK_EXHAUSTED | SUPERSEDE (successor_part_id) | MARK_OBSOLETE", roles: [PlannerAdmin, ServiceAgent], code: 200, input: [action, "quantity?", "successor_part_id?"], output: PartSku, side_effects: ["RESTOCK fills BACKORDERED parts orders in created_at ASC order", "increments PartSku.version by 1"] }
  - { method: POST, path: "/grillops/parts-orders", description: "Order a part against a sale; supersession resolution runs synchronously; WARRANTY/GOODWILL orders are free_of_charge and gated by the model's parts obligation window", roles: [ServiceAgent], code: 201, input: [part_id, sale_id, quantity, fulfillment_type, "warranty_claim_id?"], output: PartsOrder, side_effects: ["calc_parts_supersession_resolution", "stock decrement on the resolved part", "increments PartsOrder.version by 1"] }
  - { method: GET, path: "/grillops/parts-orders/{id}", description: "Read a parts order", roles: [ServiceAgent, PlannerAdmin], code: 200, input: [], output: PartsOrder, side_effects: [] }
  - { method: GET, path: "/grillops/parts-orders", description: "List parts orders with filters (FK reverse view for part_id / sale_id)", roles: [ServiceAgent, PlannerAdmin], code: 200, input: ["part_id?", "sale_id?", "status?"], output: "PartsOrder[]", side_effects: [] }
  - { method: POST, path: "/grillops/parts-orders/{id}/transition", description: "Parts order lifecycle: SHIP | DELIVER | CANCEL (cancel of ALLOCATED restores stock)", roles: [ServiceAgent], code: 200, input: [action], output: PartsOrder, side_effects: ["stock restoration on cancel of ALLOCATED", "increments PartsOrder.version by 1"] }

  - { method: POST, path: "/grillops/devices/pair", description: "Pair a grill (sale) to an app account; registers an unregistered sale as a side effect", roles: [AppUser], code: 201, input: [sale_id, app_account_id], output: ConnectedDevice, side_effects: ["sale SOLD -> REGISTERED with proof_of_purchase_token 'APP-PAIR' when absent", "firmware_version initialized from model.current_firmware_version"] }
  - { method: POST, path: "/grillops/devices/{id}/firmware", description: "UPDATE (target_version; synchronous PAIRED -> UPDATING -> PAIRED) | UNPAIR", roles: [AppUser], code: 200, input: [action, "target_version?"], output: ConnectedDevice, side_effects: ["firmware_version rewritten on UPDATE", "increments ConnectedDevice.version by 1"] }
  - { method: GET, path: "/grillops/sales/{id}/devices", description: "List devices paired to a sale (FK reverse view for ConnectedDevice.sale_id; 0..1 entries)", roles: [ServiceAgent, AppUser, ChannelRep, PlannerAdmin], code: 200, input: [], output: "ConnectedDevice[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/invalid" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not permitted for this endpoint or for this action on an action endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "entity-backed role acting on a resource owned by a different account (channel or assembler mismatch)" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body: missing required field, invalid enum, bad date ordering, serials length != quantity, window_end <= window_start, supersede successor outside chain, APPROVE of OUT_OF_COVERAGE without goodwill_justification, SETTLE without actual_labor_cents, duplicate chain_position within a supersession chain" }
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "season id does not exist" }
  - { id: ERR_MODEL_NOT_FOUND, http: 404, condition: "model id does not exist" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "channel id does not exist (referenced in a body)" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "allocation id does not exist" }
  - { id: ERR_ASSEMBLER_NOT_FOUND, http: 404, condition: "assembler id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "assembly job id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "sale id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "part id does not exist" }
  - { id: ERR_PARTS_ORDER_NOT_FOUND, http: 404, condition: "parts order id does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "connected device id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic invalid-from transition: advance skipping a state, transition from a terminal state, MARK_PARTS_ONLY before the obligation window has elapsed" }
  - { id: ERR_SEASON_POSTURE_FORBIDDEN, http: 409, condition: "operation gated by season posture: allocation create outside ALLOCATION, lot create outside {PLANNING, BUILD}, sale create outside {IN_SEASON, CLEARANCE}" }
  - { id: ERR_ALLOCATION_NOT_ACTIONABLE, http: 409, condition: "respond action on an allocation not in a state that allows it (e.g. ACCEPT on DECLINED/RELEASED/EXPIRED/SUPERSEDED/CONSUMED)" }
  - { id: ERR_JOB_NOT_SCHEDULABLE, http: 409, condition: "ASSIGN on a job not in {REQUESTED, NO_SHOW}; START/COMPLETE/CANCEL/NO_SHOW from a state that does not allow it" }
  - { id: ERR_CLAIM_NOT_ADJUDICATABLE, http: 409, condition: "adjudicate action on a claim whose state does not allow it (e.g. SETTLE before APPROVED, REOPEN on SETTLED)" }
  - { id: ERR_SALE_NOT_REGISTERED, http: 409, condition: "warranty claim filed against a sale still in SOLD (proof of purchase not yet provided)" }
  - { id: ERR_SALE_RETURNED, http: 409, condition: "warranty claim filed against a RETURNED sale, or RETURN of an already RETURNED sale" }
  - { id: ERR_ASSEMBLER_NOT_CERTIFIED, http: 409, condition: "ASSIGN to an assembler not in CERTIFIED status" }
  - { id: ERR_DEVICE_NOT_PAIRED, http: 409, condition: "firmware UPDATE on a device not currently PAIRED" }
  - { id: ERR_DEVICE_ALREADY_PAIRED, http: 409, condition: "pairing a sale that already has a PAIRED/UPDATING device" }
  - { id: ERR_MODEL_NOT_SELLABLE, http: 409, condition: "sale create on a model in {DISCONTINUED, PARTS_ONLY, RETIRED}, or allocation create on a non-ACTIVE model" }
  - { id: ERR_NO_ACTIVE_ALLOCATION, http: 409, condition: "sale create finds no allocation in {ACCEPTED, PARTIALLY_CONSUMED} for (season, channel, model)" }
  - { id: ERR_SEASON_OVERLAP, http: 409, condition: "new season's closed interval [in_season_start, season_end] touches or overlaps another season's interval" }
  - { id: ERR_ASSEMBLY_WINDOW_CONFLICT, http: 409, condition: "another active job on the same sale overlaps the requested window (half-open test; adjacency allowed)" }
  - { id: ERR_ASSEMBLER_BUFFER_CONFLICT, http: 409, condition: "another active job of the assembler overlaps; new IN_HOME jobs are padded by +/-45 minutes before testing" }
  - { id: ERR_MAX_CONCURRENT_JOBS, http: 409, condition: "ASSIGN would push the assembler to active_job_count == max_concurrent_jobs (cap is exclusive at the boundary)" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "a serial in sale.serials already appears on another sale" }
  - { id: ERR_ALLOCATION_CAPACITY_EXCEEDED, http: 409, condition: "allocated_units exceeds the lot's units_available (after same-tuple supersession recapture); boundary: exact fit passes" }
  - { id: ERR_PART_UNAVAILABLE, http: 409, condition: "parts order for an OBSOLETE part, or for a SUPERSEDED part whose chain has no fulfiller" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "REOPEN after denied_at + 30 days" }
  - { id: ERR_PART_INCOMPATIBLE, http: 422, condition: "part.compatible_model_codes does not contain the sale's model_code" }
  - { id: ERR_PARTS_OBLIGATION_EXPIRED, http: 422, condition: "WARRANTY/GOODWILL (free) parts order after model.support_obligation_until" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "allocation create/REVISE pushes channel exposure above credit_limit_cents" }
  - { id: ERR_GOODWILL_CAP_EXCEEDED, http: 422, condition: "APPROVE from UNDER_REVIEW with provisional settlement > GOODWILL_CAP_CENTS (10000); escalate first" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_season_version / expected_allocation_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlannerAdmin
    description: "Manufacturer planning operator: seasons, models, lots, channels, parts catalog, allocation offers and revisions, assembler certification, clock"
    identity: opaque
    exclusive_operations: ["season create/advance", "model create/lifecycle", "lot create", "channel create", "allocation create + REVISE", "assembler create/CERTIFY/DECERTIFY", "part create + RESTOCK/SUPERSEDE lifecycle", "logical clock control"]
    shared_operations: ["read any entity", "assembler SUSPEND (shared with ServiceAgent)", "part transitions (shared with ServiceAgent)"]
  - name: ChannelRep
    description: "Retail channel representative (home center, specialty dealer, or direct) acting as their ChannelAccount"
    identity: "entity_backed:ChannelAccount"
    exclusive_operations: ["allocation ACCEPT/DECLINE/RELEASE on own allocations", "sale create + REGISTER/RETURN on own sales", "assembly job request"]
    shared_operations: ["read seasons/models/lots", "list own allocations and sales", "read devices of own sales"]
  - name: Assembler
    description: "Third-party assembly technician acting as their Assembler account"
    identity: "entity_backed:Assembler"
    exclusive_operations: ["START / COMPLETE on own assigned jobs"]
    shared_operations: ["read own assembler record", "list/read jobs (assignment visibility)"]
  - name: ServiceAgent
    description: "Customer-support operator: warranty intake and adjudication, parts fulfillment, assembly dispatch"
    identity: opaque
    exclusive_operations: ["warranty claim create + all adjudicate actions", "parts order create + transitions", "job ASSIGN/CANCEL/NO_SHOW"]
    shared_operations: ["assembler SUSPEND (shared with PlannerAdmin)", "part transitions (shared with PlannerAdmin)", "sale transitions (shared with ChannelRep)"]
  - name: AppUser
    description: "Consumer application identity for connected-grill pairing and firmware consent"
    identity: opaque
    exclusive_operations: ["device pairing", "firmware UPDATE / UNPAIR"]
    shared_operations: ["read devices of a sale"]

