              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o1}", "${o2}"], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T02:00:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /delivery-batches/${b_id}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
