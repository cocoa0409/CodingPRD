          assert:
            - "${au14a_scope} == 1 and ${au14b_scope} == 0"
            - "First trigger call returns 409 and ${err14} == \"ERR_AUDIT_NO_OBSERVATIONS\" - scope 1 with an empty observation set is a refusal, not a clean audit"
            - "After the first trigger call FloorPlanAudit.${au14a}.status == IN_PROGRESS and Dealer.${d14a}.audit_in_progress == true"
            - "Second trigger call returns 200 with ${au14b_status} == \"RECONCILED_CLEAN\" and ${au14b_exposure} == 0 - scope 0 with an empty observation set is legal"
            - "After the second trigger call FloorPlanAudit.${au14b}.units_verified_count == 0, units_exception_count == 0, units_unobserved_count == 0 and observer_user_ids == []"
            - "Fourth trigger call returns 200 with ${au14a_status} == \"RECONCILED_CLEAN\" and ${au14a_verified} == 1, sot_exposure_cents == 0 and units_unobserved_count == 0"
            - "Dealer.${d14a}.open_sot_incident_count == 0, risk_rating == \"A\" and audit_frequency_days == 180 after the clean reconcile"
            - "Dealer.${d14b}.risk_rating == \"A\" and next_audit_due_at == \"2027-02-06T00:00:00Z\" (2026-08-10 plus 180 days)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_registration_blocked_until_the_governing_credit_line_is_activated
        grounds:
          - validations[priority=61]
          - validations[priority=62]
          - state_machines.CreditLine.PENDING_to_ACTIVE
          - state_machines.Dealer.PROSPECT_to_ACTIVE
          - errors.ERR_CREDIT_LINE_NOT_ACTIVE
          - endpoints["POST /floorplan/units"]
        distinguishing_aspect: |
          The dependency runs CHILD-CREATION -> GRANDPARENT-STATE (InventoryUnit depends
          on CreditLine.status, two hops up from the unit being created), and the
          controlling entity is the one NOT named in the failing state check's own error
          text: the dealer is simultaneously PROSPECT, so the priority 61 line error must
          mask the priority 62 dealer error, and one activate call clears both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer freshly created, therefore in PROSPECT."
            - "One CreditLine for that dealer in PENDING with a NEW tier [90,unbounded) at 1000 bps already loaded, deliberately NOT activated."
