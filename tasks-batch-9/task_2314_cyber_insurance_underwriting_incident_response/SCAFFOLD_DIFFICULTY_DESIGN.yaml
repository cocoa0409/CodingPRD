            - "ControlAttestation for control_key OFFLINE_BACKUPS on ${app_a_id} has verified_level == PARTIAL (hop 2)"
            - "ControlAttestation for control_key EMAIL_FILTERING on ${app_a_id} has verified_level == FULL because the control is absent from findings"
