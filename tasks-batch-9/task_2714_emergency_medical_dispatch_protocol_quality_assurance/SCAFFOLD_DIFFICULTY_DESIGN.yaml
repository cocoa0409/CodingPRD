          assert:
            - "Before the trigger: RetrainingSession.${sessa_id}.status == COMPLETED with duration_hours 1.00, CoachingPlan.${plan1_id}.status == CANCELLED with closure_reason SUPERSEDED, CoachingPlan.${plan2_id}.status == ASSIGNED"
            - "The trigger returns 409 with data.error_id == ERR_SESSION_WINDOW_OVERLAP: the buffered window [10:15, 12:45] of the requested session overlaps the COMPLETED session A [10:00, 11:00] of the same dispatcher, even though A belongs to a CANCELLED plan"
            - "GET /coaching-plans/${plan2_id}/retraining-sessions returns 0 elements and CoachingPlan.${plan2_id}.status is still ASSIGNED"
            - "After POST /retraining-sessions/${sessa_id}/cancel with cancel_reason RESCHEDULED, RetrainingSession.${sessa_id}.status == CANCELLED and completed_at == null"
            - "The identical scheduling request now returns 201 with duration_hours 1.00 and moves CoachingPlan.${plan2_id} to IN_PROGRESS — a CANCELLED session no longer participates in buffered overlap detection"
            - "Control — a further request for 2026-08-15 12:45-13:45 on the same dispatcher is refused with ERR_SESSION_WINDOW_OVERLAP against the newly created 11:00-12:00 session (buffered start 12:00 touches its 12:00 end), while 12:46-13:46 succeeds"

  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_finalized_review_reverses_every_link_of_the_finalize_cascade
        grounds:
          - state_machines.Review.FINALIZED_to_VOIDED
          - state_machines.CoachingPlan.ASSIGNED_to_CANCELLED
          - calculations.dispatcher_compliance_rollup
          - calculations.remediation_hours_ledger
          - calculations.sampling_period_counters
        distinguishing_aspect: |
          CASCADE D must undo CASCADE A exactly, across five different fields on three entity types,
          with no drift: the point ledger returns to 0.0 (not to a re-derived non-null 0.0 with a
          stale posture), compliance_pct returns to null rather than 0.0, the AUTO plan is CANCELLED
          with closure_reason SOURCE_VOIDED rather than deleted, the hours ledger returns to 0.00 and
          the privilege returns to FULL. The append-only ScoreSheets are deliberately NOT reversed.
        test_recipe:
          setup:
            - "Exactly the CASCADE A fixture: an under-triaged CHEST_PAIN review finalized at 75.0, dispatcher on PROBATION with an AUTO CRITICAL plan (8.0 h) and dispatch_privilege RESTRICTED."
            - "Pre-trigger snapshot recorded: reviewed_case_count 1, compliance_points_total 75.0, compliance_pct 75.0, posture PROBATION, remediation_hours_owed 8.00, privilege RESTRICTED, period selected_review_count 1 / finalized_review_count 1, CallRecord status SELECTED."
