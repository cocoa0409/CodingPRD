  - section: errors
    instances:
      - name: second_daily_price_for_same_key_returns_duplicate_price
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_PRICE]", "validations[priority=9]"]
        distinguishing_aspect: "DailyPrice is unique per (commodity_id, market_date): a second POST with the same key is rejected ERR_DUPLICATE_PRICE (409) even though its low/high values differ from the first row."
        test_recipe:
          setup: ["Commodity TOM; DailyPrice for TOM 2026-05-01 already posted"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 9.00, high_price: 11.00 }, as: MarketAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_PRICE (409)"

      - name: second_inspection_while_submitted_open_returns_inspection_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_OPEN]", state_machines.PurchaseLot.RECEIVED_to_INSPECTED]
        distinguishing_aspect: "ERR_INSPECTION_OPEN (409) fires only in the dispute loop: with the lot back in DISPUTED and the re-inspection I2 still SUBMITTED (uncertified), a third inspection POST passes the lot-state check but hits the one-open-inspection rule."
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00; I1 FAIL (defect 25) CERTIFIED; dispute -> DISPUTED"
            - "I2 created SUBMITTED (lot -> INSPECTED); second dispute (I1 CERTIFIED FAIL) -> lot DISPUTED with I2 still SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US2", defect_pct: 25, result: "FAIL" }, as: USDAInspector, captures: { i1: "$.data.id" } }
            - { call: "POST /market/inspections/${i1}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "grade below contract" }, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 8, result: "PASS" }, as: USDAInspector, captures: { i2: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "contested again" }, as: Receiver }
          trigger:
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 3, result: "PASS" }, as: USDAInspector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSPECTION_OPEN (409)"
            - "lot remains DISPUTED and I2 remains SUBMITTED (no mutation on the rejected create)"

      - name: pick_order_on_violated_lot_returns_cold_chain_violation
        claim_type: violation_to_error
        grounds: ["errors[ERR_COLD_CHAIN_VIOLATION]", "validations[priority=7]", state_machines.SalesOrder.CONFIRMED_to_PICKED]
        distinguishing_aspect: "The pick-side cold-chain gate is reachable only when the violation predates the order (otherwise the cascade would already have held it): lot flips VIOLATED while no orders exist, the order is then created and CONFIRMED (confirm has no cold-chain check), and pick fails with ERR_COLD_CHAIN_VIOLATION (409). §1.8 asserted the cascade hold, never the pick/deliver guard."
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 ACCEPTED, band 45-55F, max_violation_minutes 60"
            - "One probe 70F for 70 minutes -> violation_minutes 70 > 60 -> lot VIOLATED (no orders yet, so no cascade target)"
            - "Customer order (1 unit @ 10.00) created and CONFIRMED against the violated lot"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/temperature-readings", payload: { purchase_lot_id: "${lot}", recorded_at: "2026-05-01T09:00:00Z", temp_f: 70, duration_minutes: 70 }, as: Receiver }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_COLD_CHAIN_VIOLATION (409)"
            - "order remains CONFIRMED and lot.reserved_units == 1 (pick did not fire)"

