        distinguishing_aspect: |
          Two state guards that lock a window's evidence into a strict order: a window cannot be closed
          before its interval has elapsed on the logical clock, and it cannot be scored for drift before
          it is closed — so the only way to a DriftReport is clock-advance, close, score. The clock
          boundary is inclusive (window_end == clock_now closes), and the drift path is exercised at
          severity NONE so no cascade fires and the guards are observed in isolation.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default, later advanced to 2026-08-03T00:00:00Z"
            - "one REALTIME Deployment of an APPROVED version ramped once, plus one OPEN PERFORMANCE window [2026-08-01, 2026-08-03] whose observed bins equal the training baseline exactly"
