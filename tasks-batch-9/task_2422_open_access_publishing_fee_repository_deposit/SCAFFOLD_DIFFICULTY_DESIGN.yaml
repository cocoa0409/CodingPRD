      - name: business_safety_publisher_blocked_outranks_grant_not_active
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - errors[ERR_PUBLISHER_BLOCKED]
          - errors[ERR_GRANT_NOT_ACTIVE]
