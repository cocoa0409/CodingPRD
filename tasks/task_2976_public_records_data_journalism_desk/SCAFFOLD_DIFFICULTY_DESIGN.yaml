            - call: "POST /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", dataset_id: "${ds_id}", start_at: "2026-08-20T09:00:00Z", end_at: "2026-08-20T11:00:00Z", document_count: 5, purpose: "First pass over the narratives." }
              as: LegalCounsel
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /records-desk/enclave-sessions"
              payload: { enclave_id: "${enclave_id}", dataset_id: "${ds_id}", start_at: "2026-08-20T11:29:00Z", end_at: "2026-08-20T13:00:00Z", document_count: 3, purpose: "Second pass, one minute inside the sanitization buffer." }
