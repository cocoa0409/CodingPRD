  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with different interval semantics on
  # different resources: (1) LoanerUnit half-open date windows, adjacency
  # allowed, no buffer; (2) rigging bay occupancy includes a trailing
  # RIGGING_BUFFER_HOURS tail, so back-to-back same-day bookings conflict.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: loaner_window_true_overlap_rejected
        grounds:
          - endpoints: "POST /reman/loaner-units/{id}/assignments"
          - "errors[ERR_LOANER_OVERLAP]"
          - entities.LoanerAssignment.fields.start_date
        distinguishing_aspect: |
          Semantics 1 (half-open date interval, no buffer) on LoanerUnit:
          [2026-08-15, 2026-08-25) against existing [2026-08-10, 2026-08-20)
          shares 5 days and MUST be rejected with ERR_LOANER_OVERLAP — unlike
          the adjacent zero-gap case which is allowed.
        test_recipe:
          setup:
            - "Loaner L with RESERVED assignment A1 [2026-08-10, 2026-08-20) for order O1; order O2 exists"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Overlap Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-O1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit1: $.data.id }
            - call: "POST /reman/units/${unit1}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit1}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order1: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-O2", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit2: $.data.id }
            - call: "POST /reman/units/${unit2}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit2}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order2: $.data.id }
            - call: "POST /reman/loaner-units"
              payload: { serial_number: "LN-OV", model: "HZ-450" }
              as: ServiceManager
              captures: { loaner_id: $.data.id }
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order1}", start_date: "2026-08-10", end_date: "2026-08-20" }
              as: IntakeCoordinator
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order2}", start_date: "2026-08-15", end_date: "2026-08-25" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOANER_OVERLAP"
            - "http status == 409"
            - "LoanerAssignment.${asg1}.status == RESERVED (unchanged)"

      - name: rigging_bay_back_to_back_conflicts_due_to_buffer_tail
        grounds:
          - endpoints: "POST /reman/orders/{id}/shipments"
          - "errors[ERR_RIGGING_BAY_CONFLICT]"
          - calculations.freight_charge
        distinguishing_aspect: |
          Semantics 2 (interval with trailing buffer) on the rigging bay: bay
          occupancy is [date, date + hours + RIGGING_BUFFER_HOURS(2)), so a
          booking at 2026-08-12 for 4h occupies through 2026-08-12T+6h; a
          second booking the SAME day (adjacent in calendar terms, gap 0)
          collides because of the buffer tail and MUST be rejected with
          ERR_RIGGING_BAY_CONFLICT — different arithmetic from the loaner's
          pure half-open adjacency.
        test_recipe:
          setup:
            - "Two orders O1, O2 (different units); O1 has shipment S1 booked at rigging bay 2026-08-12 for 4h"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Bay Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-RB1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit1: $.data.id }
            - call: "POST /reman/units/${unit1}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit1}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order1: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-RB2", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit2: $.data.id }
            - call: "POST /reman/units/${unit2}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit2}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order2: $.data.id }
            - call: "POST /reman/orders/${order1}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 400, rigging_bay_date: "2026-08-12", rigging_bay_hours: 4 }
              as: IntakeCoordinator
              captures: { ship1: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order2}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 300, rigging_bay_date: "2026-08-12", rigging_bay_hours: 2 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RIGGING_BAY_CONFLICT"
            - "http status == 409"
            - "FreightShipment.${ship1}.status == BOOKED (unchanged)"
            - "FreightShipment.${ship1}.freight_charge_cents == 83000 (45000 base + 4*9500)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant over different conserved quantities:
  # (1) loaner fleet count: units CHECKED_OUT + AVAILABLE per loaner conserved
  #     across checkout/return (quantity: LoanerUnit.status cardinality);
  # (2) customer credit: outstanding_approved_cents conserved across
  #     approve-then-complete (quantity: cents on Customer).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loaner_checkout_return_conserves_unit_availability
        grounds:
          - state_machines.LoanerAssignment.RESERVED_to_CHECKED_OUT
          - state_machines.LoanerAssignment.CHECKED_OUT_to_RETURNED
          - entities.LoanerUnit.fields.status
          - "concurrency_rules[loaner-return-stale-assignment]"
        distinguishing_aspect: |
          Conserved quantity: per-LoanerUnit availability cardinality —
          checkout moves the unit AVAILABLE→CHECKED_OUT and its compensating
          return moves it back CHECKED_OUT→AVAILABLE, leaving the loaner's
          availability invariant (exactly one of {AVAILABLE, CHECKED_OUT}
          across the pair) unchanged after the round trip.
        test_recipe:
          setup:
            - "Loaner L AVAILABLE; assignment A RESERVED over [2026-08-01, 2026-08-10) for order O; logical clock at 2026-08-02 (inside window)"
          setup_api_calls:
            - call: "POST /reman/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ServiceManager
            - call: "POST /reman/customers"
              payload: { legal_name: "Loan Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-LN1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/loaner-units"
              payload: { serial_number: "LN-INV", model: "HZ-450" }
              as: ServiceManager
              captures: { loaner_id: $.data.id }
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: IntakeCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /reman/loaner-assignments/${asg_id}/checkout"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /reman/loaner-assignments/${asg_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { asg_v: $.data.version }
          trigger:
            - call: "POST /reman/loaner-assignments/${asg_id}/return"
              payload: { expected_assignment_version: "${asg_v}" }
              as: IntakeCoordinator
            - call: "GET /reman/loaner-units/${loaner_id}"
              payload: {}
              as: ServiceManager
          assert:
            - "After checkout LoanerUnit was CHECKED_OUT; after return LoanerUnit.${loaner_id}.status == AVAILABLE"
            - "LoanerAssignment.${asg_id}.status == RETURNED"
            - "Round trip checkout+return restores the pre-checkout availability exactly (no drift)"

      - name: scope_approve_then_complete_conserves_customer_outstanding
        grounds:
          - calculations.customer_credit_hold
          - state_machines.RemanOrder.SCOPE_APPROVAL_to_APPROVED
          - state_machines.RemanOrder.SHIPPED_to_COMPLETED
          - entities.Customer.fields.outstanding_approved_cents
        distinguishing_aspect: |
          Conserved quantity: Customer.outstanding_approved_cents — approve
          adds approved_scope_cents (46000), its compensating completion
          subtracts exactly the same 46000, returning the customer to
          outstanding 0 and credit_hold false — a cents-denominated ledger
          invariant, different in kind from the loaner-cardinality invariant.
        test_recipe:
          setup:
            - "Customer CU (limit 90000000), order O fully progressed: scope 46000 approved, build/assembly/run-in PASS, OUTBOUND shipment DELIVERED, order SHIPPED"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Ledger Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-LG1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 4.0, material_cents: 12000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /reman/customers/${cust_id}"
              payload: {}
              as: ServiceManager
              captures: { mid_outstanding: $.data.outstanding_approved_cents }
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 80.0, vibration_mm_s: 2.0, oil_particle_count: 1500 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 400, rigging_bay_date: "2026-08-06", rigging_bay_hours: 2 }
              as: IntakeCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/ship"
              payload: {}
              as: ServiceManager
            - call: "POST /reman/shipments/${ship_id}/deliver"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/orders/${order_id}/complete"
              payload: {}
              as: ServiceManager
            - call: "GET /reman/customers/${cust_id}"
              payload: {}
              as: ServiceManager
          assert:
            - "Customer.${cust_id}.outstanding_approved_cents at midpoint (after approve) == 46000"
            - "Customer.${cust_id}.outstanding_approved_cents after completion == 0"
            - "Customer.${cust_id}.credit_hold == false"
            - "RemanOrder.${order_id}.status == COMPLETED"
            - "GearUnit.${unit_id}.physical_status == IN_SERVICE"
