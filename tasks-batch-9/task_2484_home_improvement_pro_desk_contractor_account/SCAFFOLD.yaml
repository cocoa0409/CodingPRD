# =============================================================================
# task_2484 — Home Improvement Pro Desk & Contractor Account (The Home Depot Pro)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2484. Home Improvement Pro Desk & Contractor Account (The Home Depot Pro): pro account tiering by
  trailing purchase volume with tiered discounts, bulk quote request and negotiated job pricing valid
  for a term, will-call staging, job-lot reservation and multi-store sourcing, commercial credit line,
  purchase-order requirement and job-name coding, tax-exempt certificate management for resale
  purchases, delivery scheduling with lift-gate and jobsite access requirements, volume rebate accrual
  and payout, returns on job-quoted material and restocking policy

domain_name: pro-desk-contractor-account
api_prefix: /pro

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # tier determination (ProAccount) and return valuation (ReturnRequest)
    - rate_threshold_triggers       # tier volume breakpoints, freight waiver, credit-utilization freeze
    - cascading_side_effects        # invoice→exposure→freeze→hold, sweep→expire→release→revert
    - optimistic_concurrency        # OCC on JobQuote.version and ProAccount.version

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /pro and linked by explicit
  # foreign keys; the only nested paths are line-item sub-resources of JobQuote / ProOrder.

  state_machine_shape: cyclic
  # JobQuote cycles COUNTERED→SUBMITTED→COUNTERED (negotiation rounds); CreditLine cycles
  # ACTIVE→FROZEN→ACTIVE; ProAccount cycles ACTIVE→HOLD→ACTIVE. ProOrder additionally carries two
  # independent parallel state dimensions (fulfillment_status × credit_status) on the same row.

  relationship_patterns:
    - one_to_many          # ProAccount→JobQuote/ProOrder/CreditLine/TaxExemptCertificate/RebateAccrual
    - cross_aggregate      # Reservation spans ProOrder (commercial) and StoreStock (physical) aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The ProDeskAssociate who authors a negotiated counter-offer can never be the CreditManager user who
  # approves it (X-User-ID compared), and the CreditManager who invoices is the only role that can
  # credit a return.

  consistency_model: immediate

  difficulty_level: beyond_expert   # 15 entities, 61 endpoints, 48 error codes, 7 calculations,
                                    # 10 state machines (2 cyclic + 1 parallel-dimension pair)

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Human store code, unique across stores", constraints: "unique" }
      - { name: region_code, type: string, source: input, description: "Sourcing region; multi-store sourcing only considers stores sharing the ordering store's region_code" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of the store; tax-exempt certificates are matched on this value" }
      - { name: distance_rank, type: integer, source: input, description: "Sourcing distance rank inside the region; lower is nearer", constraints: ">= 0" }
      - { name: will_call_bay_slots, type: integer, source: input, description: "Number of will-call staging bays occupiable at the same instant", constraints: ">= 1" }
      - { name: lift_gate_available, type: boolean, source: input, description: "Whether the store dispatches lift-gate-capable equipment at all" }
      - { name: tax_rate_pct, type: number, source: input, description: "Sales tax rate applied to taxable orders fulfilled by this store, e.g. 0.0825", constraints: ">= 0 and <= 0.20" }
      - { name: max_stage_hours, type: integer, source: input, description: "Longest will-call staging window this store allows", default: 72, constraints: ">= 1" }

  - name: StoreStock
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store holding this SKU" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit code", constraints: "(store_id, sku) unique" }
      - { name: on_hand_units, type: integer, source: input, description: "Physical units on hand", constraints: ">= 0" }
      - { name: reserved_units, type: integer, source: computed, description: "Sum of Reservation.qty_units for this (store_id, sku) with status IN {HELD, ALLOCATED}", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "on_hand_units - reserved_units" }
      - { name: list_unit_price_cents, type: integer, source: input, description: "Undiscounted list price per unit in cents at this store", constraints: ">= 1" }

  - name: DeliveryTruck
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; home store dispatching this truck" }
      - { name: truck_code, type: string, source: input, description: "Fleet code, unique per store", constraints: "(store_id, truck_code) unique" }
      - { name: lift_gate_equipped, type: boolean, source: input, description: "Truck carries a hydraulic lift gate" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Depot turnaround padding applied on BOTH sides of every appointment window when testing truck occupancy", default: 30, constraints: ">= 0" }
      - { name: access_types_supported, type: array, source: input, description: "Subset of {CURBSIDE, DRIVEWAY, NARROW_ALLEY, CRANE_REQUIRED} this truck can service", constraints: "non-empty" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: AVAILABLE }

  - name: ProAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Contractor business name" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the pro desk that owns the relationship" }
      - { name: po_required, type: boolean, source: input, description: "When true every order submission must carry a non-empty po_number", default: false }
      - { name: job_name_required, type: boolean, source: input, description: "When true every order submission must carry a non-empty job_name (job-name coding)", default: false }
      - { name: tier_review_mode, type: enum, source: input, description: "ROLLING_365_INCLUSIVE | PINNED_AT_REVIEW — selects the account_tier_determination variant used when pricing an order", default: PINNED_AT_REVIEW }
      - { name: baseline_volume_cents, type: integer, source: input, description: "Trailing volume carried over from the legacy system; always counted in the trailing window", default: 0, constraints: ">= 0" }
      - { name: trailing_volume_cents, type: integer, source: computed, description: "Output of account_tier_determination step 1 (baseline plus in-window invoiced net volume)" }
      - { name: tier_code, type: enum, source: computed, description: "MEMBER | GOLD | PLATINUM | DIAMOND — highest TIER_TABLE tier whose min_trailing_volume_cents <= trailing_volume_cents" }
      - { name: tier_discount_pct, type: number, source: computed, description: "discount_pct of tier_code from TIER_TABLE" }
      - { name: tier_reviewed_at, type: datetime, source: system, description: "Logical-clock instant of the most recent tier review (account create, volume adjustment, order invoice, return credit)" }
      - { name: rebate_accrued_cents, type: integer, source: computed, description: "Sum of (RebateAccrual.accrued_cents - RebateAccrual.clawed_back_cents) over this account's accruals with payout_status IN {ACCRUING, PAYABLE}" }
      - { name: tax_exempt_state_codes, type: array, source: computed, description: "state_code values for which this account has a TaxExemptCertificate with status == VERIFIED and expires_on strictly after the current clock date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | HOLD — HOLD is set when this account's credit line transitions to FROZEN and blocks quote submission and order submission", default: ACTIVE }

  - name: CreditLine
    parent: null
    common_fields: true
    fields:
      - { name: pro_account_id, type: string, source: input, description: "FK -> ProAccount.id; at most one CreditLine per account" }
      - { name: limit_cents, type: integer, source: input, description: "Commercial credit line limit in cents", constraints: ">= 1" }
      - { name: terms_days, type: integer, source: input, description: "Net payment terms in days", constraints: ">= 1" }
      - { name: exposure_cents, type: integer, source: computed, description: "Output of credit_exposure_and_authorization: outstanding order value net of credited returns" }
      - { name: available_cents, type: integer, source: computed, description: "limit_cents - exposure_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN", default: ACTIVE }
      - { name: frozen_reason_code, type: string, source: system, description: "UTILIZATION_REVIEW | MANUAL — reason recorded on the ACTIVE→FROZEN transition; null while ACTIVE" }

  - name: TaxExemptCertificate
    parent: null
    common_fields: true
    fields:
      - { name: pro_account_id, type: string, source: input, description: "FK -> ProAccount.id; owning contractor account" }
      - { name: state_code, type: string, source: input, description: "Two-letter state the resale exemption applies to" }
      - { name: certificate_number, type: string, source: input, description: "State-issued resale certificate number" }
      - { name: expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) the certificate lapses; the comparison is strict — the certificate counts as valid only while expires_on is strictly after the current clock date, so a certificate expiring today is already lapsed" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | SUPERSEDED | REVOKED", default: PENDING }
      - { name: verified_at, type: datetime, source: system, description: "Clock instant of verification; null while PENDING" }
      - { name: revoke_reason_code, type: string, source: system, description: "Reason recorded on the VERIFIED→REVOKED transition; null otherwise" }

  - name: JobQuote
    parent: null
    common_fields: true
    fields:
      - { name: pro_account_id, type: string, source: input, description: "FK -> ProAccount.id; the account that requested the bulk quote" }
      - { name: originating_store_id, type: string, source: input, description: "FK -> Store.id; the pro desk that prices the quote and whose StoreStock list prices are snapshotted" }
      - { name: job_name, type: string, source: input, description: "Job-name code the quote is tied to" }
      - { name: requested_term_days, type: integer, source: input, description: "Term the contractor asked for; capped by the tier's max_quote_term_days at acceptance", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COUNTERED | APPROVED | ACCEPTED | EXPIRED | WITHDRAWN", default: DRAFT }
      - { name: round_count, type: integer, source: computed, description: "Number of counter-offers written by the pro desk; capped by MAX_QUOTE_ROUNDS", default: 0 }
      - { name: revision_count, type: integer, source: computed, description: "Number of contractor revisions that bounced the quote COUNTERED→SUBMITTED", default: 0 }
      - { name: list_subtotal_cents, type: integer, source: computed, description: "Sum of QuoteLine.line_list_subtotal_cents, snapshotted on DRAFT→SUBMITTED" }
      - { name: negotiated_total_cents, type: integer, source: computed, description: "Sum of QuoteLine.line_negotiated_subtotal_cents after the latest counter-offer; null before the first counter-offer" }
      - { name: discount_depth_pct, type: number, source: computed, description: "(list_subtotal_cents - negotiated_total_cents) / list_subtotal_cents rounded half-up to 4 decimals; null before the first counter-offer" }
      - { name: term_days, type: integer, source: computed, description: "min(requested_term_days, TIER_TABLE[account.tier_code].max_quote_term_days), fixed on APPROVED→ACCEPTED" }
      - { name: term_start, type: datetime, source: computed, description: "Clock instant of acceptance; null before ACCEPTED" }
      - { name: term_end, type: datetime, source: computed, description: "term_start + term_days days; the negotiated prices bind while term_start <= clock <= term_end (both bounds inclusive)" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the ProDeskAssociate who wrote the latest counter-offer" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the CreditManager who approved; must differ from authored_by_user_id" }
      - { name: withdrawn_reason_code, type: string, source: system, description: "Reason recorded on any *→WITHDRAWN transition" }

  - name: QuoteLine
    parent: JobQuote
    common_fields: true
    fields:
      - { name: job_quote_id, type: string, source: system, description: "FK -> JobQuote.id; owning quote" }
      - { name: sku, type: string, source: input, description: "SKU quoted", constraints: "(job_quote_id, sku) unique" }
      - { name: qty_units, type: integer, source: input, description: "Quoted quantity", constraints: ">= 1" }
      - { name: list_unit_price_cents, type: integer, source: computed, description: "StoreStock.list_unit_price_cents at the originating store, snapshotted on quote submission" }
      - { name: negotiated_unit_price_cents, type: integer, source: computed, description: "Per-unit price written by the latest counter-offer; null before the first counter-offer" }
      - { name: line_list_subtotal_cents, type: integer, source: computed, description: "list_unit_price_cents * qty_units" }
      - { name: line_negotiated_subtotal_cents, type: integer, source: computed, description: "negotiated_unit_price_cents * qty_units; null before the first counter-offer" }

  - name: ProOrder
    parent: null
    common_fields: true
    fields:
      - { name: pro_account_id, type: string, source: input, description: "FK -> ProAccount.id; buying account" }
      - { name: fulfillment_store_id, type: string, source: input, description: "FK -> Store.id; order-of-record store, whose list prices and tax rate apply and which heads the sourcing waterfall" }
      - { name: job_quote_id, type: string, source: input, description: "FK -> JobQuote.id; null for spot orders, otherwise an ACCEPTED quote of the same account" }
      - { name: po_number, type: string, source: input, description: "Contractor purchase-order number; required at submission when ProAccount.po_required is true" }
      - { name: job_name, type: string, source: input, description: "Job-name code; required at submission when ProAccount.job_name_required is true" }
      - { name: payment_method, type: enum, source: input, description: "CREDIT_LINE | CARD" }
      - { name: delivery_mode, type: enum, source: input, description: "WILL_CALL | DELIVERY" }
      - { name: lift_gate_required, type: boolean, source: input, description: "Jobsite needs a lift gate; priced as LIFT_GATE_FEE_CENTS and enforced against the assigned truck", default: false }
      - { name: job_lot_required, type: boolean, source: input, description: "When true every line must be sourced from one single store (dye/job lot consistency)", default: false }
      - { name: resale_purchase, type: boolean, source: input, description: "Purchased for resale; requires a valid tax-exempt certificate for the fulfillment store's state", default: false }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | RESERVED | STAGED | FULFILLED | CANCELLED — physical dimension", default: DRAFT }
      - { name: credit_status, type: enum, source: system, description: "UNBILLED | AUTHORIZED | INVOICED | PAID | VOIDED — commercial dimension, evolving independently of fulfillment_status", default: UNBILLED }
      - { name: tier_code_applied, type: enum, source: computed, description: "Tier actually used when pricing this order (MEMBER | GOLD | PLATINUM | DIAMOND)" }
      - { name: list_subtotal_cents, type: integer, source: computed, description: "Sum over lines of list_unit_price_cents * qty_units" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_subtotal_cents" }
      - { name: discount_cents, type: integer, source: computed, description: "list_subtotal_cents - subtotal_cents" }
      - { name: freight_surcharge_cents, type: integer, source: computed, description: "FREIGHT_BASE_SURCHARGE_CENTS for DELIVERY orders, waived to 0 when subtotal_cents >= FREIGHT_WAIVER_SUBTOTAL_CENTS; always 0 for WILL_CALL" }
      - { name: lift_gate_fee_cents, type: integer, source: computed, description: "LIFT_GATE_FEE_CENTS when delivery_mode == DELIVERY and lift_gate_required is true; never waived" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((subtotal_cents + freight_surcharge_cents + lift_gate_fee_cents) * Store.tax_rate_pct), or 0 when tax_exempt_applied" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + freight_surcharge_cents + lift_gate_fee_cents + tax_cents" }
      - { name: tax_exempt_applied, type: boolean, source: computed, description: "True when resale_purchase is true and the account holds a VERIFIED unexpired certificate for the fulfillment store's state_code", default: false }
      - { name: priced_at, type: datetime, source: system, description: "Clock instant the order was priced (set on DRAFT→SUBMITTED)" }
      - { name: invoiced_at, type: datetime, source: system, description: "Clock instant credit_status became INVOICED; anchors the trailing-volume window membership" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Clock instant fulfillment_status became FULFILLED; anchors return-window age" }
      - { name: credited_refund_cents, type: integer, source: computed, description: "Sum of ReturnRequest.refund_total_cents over this order's returns with status == CREDITED", default: 0 }
      - { name: credited_gross_refund_cents, type: integer, source: computed, description: "Sum of ReturnRequest.gross_refund_cents over this order's returns with status == CREDITED", default: 0 }
      - { name: net_volume_cents, type: integer, source: computed, description: "subtotal_cents - credited_gross_refund_cents; the amount this order contributes to trailing volume and rebate base" }
      - { name: cancel_reason_code, type: string, source: system, description: "Reason recorded on any *→CANCELLED fulfillment transition" }

  - name: OrderLine
    parent: ProOrder
    common_fields: true
    fields:
      - { name: pro_order_id, type: string, source: system, description: "FK -> ProOrder.id; owning order" }
      - { name: sku, type: string, source: input, description: "SKU ordered", constraints: "(pro_order_id, sku) unique" }
      - { name: qty_units, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: price_source, type: enum, source: computed, description: "QUOTED (negotiated quote price bound at pricing time) | TIER_DISCOUNTED (list price less tier discount)" }
      - { name: list_unit_price_cents, type: integer, source: computed, description: "StoreStock.list_unit_price_cents at the fulfillment store, snapshotted at pricing time" }
      - { name: effective_unit_price_cents, type: integer, source: computed, description: "Per-unit price after quote binding or per-unit tier rounding (see order_line_pricing)" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "effective_unit_price_cents * qty_units" }
      - { name: fulfilled_units, type: integer, source: computed, description: "Units handed over (set to qty_units when the order reaches FULFILLED)", default: 0 }
      - { name: returned_units, type: integer, source: computed, description: "Units already covered by CREDITED return requests", default: 0 }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: pro_order_id, type: string, source: system, description: "FK -> ProOrder.id; order the units are held for" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line the units are held for" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; sourcing store the units are held at" }
      - { name: sku, type: string, source: system, description: "SKU held (copied from the order line)" }
      - { name: qty_units, type: integer, source: system, description: "Units held at this store for this line", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "HELD | ALLOCATED | CONSUMED | RELEASED", default: HELD }
      - { name: released_reason_code, type: string, source: system, description: "ORDER_CANCELLED | STAGING_EXPIRED | MANUAL — set on any *→RELEASED transition" }

  - name: WillCallStaging
    parent: null
    common_fields: true
    fields:
      - { name: pro_order_id, type: string, source: input, description: "FK -> ProOrder.id; the WILL_CALL order being staged" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose bays are occupied" }
      - { name: stage_start, type: datetime, source: input, description: "Instant the bay occupancy starts (inclusive)" }
      - { name: stage_hours, type: integer, source: input, description: "Length of the occupancy in hours; must be <= Store.max_stage_hours", constraints: ">= 1" }
      - { name: expires_at, type: datetime, source: computed, description: "stage_start + stage_hours hours; occupancy interval is half-open [stage_start, expires_at)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | STAGED | PICKED_UP | EXPIRED", default: SCHEDULED }
      - { name: picked_up_by, type: string, source: system, description: "Name recorded at pickup; null otherwise" }
      - { name: picked_up_at, type: datetime, source: system, description: "Clock instant of pickup; null otherwise" }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: pro_order_id, type: string, source: input, description: "FK -> ProOrder.id; the DELIVERY order being scheduled" }
      - { name: delivery_truck_id, type: string, source: input, description: "FK -> DeliveryTruck.id; truck occupying the window" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (inclusive); must be strictly after window_start" }
      - { name: jobsite_access_type, type: enum, source: input, description: "CURBSIDE | DRIVEWAY | NARROW_ALLEY | CRANE_REQUIRED — must be in the truck's access_types_supported" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | DELIVERED | CANCELLED", default: SCHEDULED }
      - { name: delivered_at, type: datetime, source: system, description: "Clock instant of delivery; null otherwise" }
      - { name: cancel_reason_code, type: string, source: system, description: "Reason recorded on any *→CANCELLED transition" }

  - name: RebateAccrual
    parent: null
    common_fields: true
    fields:
      - { name: pro_account_id, type: string, source: system, description: "FK -> ProAccount.id; account earning the rebate" }
      - { name: period_start, type: string, source: system, description: "ISO date the accrual period opened (clock date of the first invoice in the period)" }
      - { name: period_end, type: string, source: system, description: "period_start + REBATE_PERIOD_DAYS days, ISO date" }
      - { name: accrued_cents, type: integer, source: computed, description: "Running sum of per-invoice accrual deltas (see rebate_accrual_and_clawback)", default: 0 }
      - { name: clawed_back_cents, type: integer, source: computed, description: "Running sum of clawback deltas booked when returns are credited", default: 0 }
      - { name: payable_cents, type: integer, source: computed, description: "max(0, accrued_cents - clawed_back_cents)" }
      - { name: payout_status, type: enum, source: system, description: "ACCRUING | PAYABLE | PAID | VOIDED", default: ACCRUING }
      - { name: closed_at, type: datetime, source: system, description: "Clock instant the period was closed; null while ACCRUING" }
      - { name: payout_reference, type: string, source: system, description: "External payout reference recorded at payout; null otherwise" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount actually paid out; equals payable_cents at the PAYABLE→PAID transition", default: 0 }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: pro_order_id, type: string, source: input, description: "FK -> ProOrder.id; the fulfilled order being returned against" }
      - { name: reason_code, type: enum, source: input, description: "OVER_ORDERED | DAMAGED | JOB_CANCELLED | WRONG_ITEM" }
      - { name: lines, type: array, source: input, description: "Requested return lines, each { order_line_id, qty_units }; order_line_id must belong to pro_order_id and qty_units <= fulfilled_units - returned_units" }
      - { name: valuation_mode, type: enum, source: computed, description: "QUOTED_TERM | CURRENT_LIST — pinned at the REQUESTED→APPROVED transition by return_refund_valuation" }
      - { name: gross_refund_cents, type: integer, source: computed, description: "Sum over return lines of refund_unit_cents * qty_units" }
      - { name: restocking_fee_pct, type: number, source: computed, description: "max(age-based percentage, QUOTED_MATERIAL_RESTOCK_FLOOR_PCT when any returned line has price_source == QUOTED)" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "round_half_up(gross_refund_cents * restocking_fee_pct) — computed once on the summed gross, not per line" }
      - { name: tax_refund_cents, type: integer, source: computed, description: "0 when the order was tax exempt, else round_half_up((gross_refund_cents - restocking_fee_cents) * Store.tax_rate_pct)" }
      - { name: refund_total_cents, type: integer, source: computed, description: "gross_refund_cents - restocking_fee_cents + tax_refund_cents" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CREDITED", default: REQUESTED }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the ProDeskAssociate who approved; null otherwise" }
      - { name: denied_reason_code, type: string, source: system, description: "Reason recorded on REQUESTED→DENIED; null otherwise" }
      - { name: credited_at, type: datetime, source: system, description: "Clock instant the credit was booked against the credit line; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- JobQuote: cyclic negotiation (COUNTERED -> SUBMITTED -> COUNTERED) -----
  - entity: JobQuote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pro/job-quotes/{job_quote_id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "quote has at least one QuoteLine, else ERR_NO_QUOTE_LINES"
          - "every QuoteLine.sku has a StoreStock row at originating_store_id, else ERR_SKU_NOT_STOCKED"
          - "ProAccount.status == ACTIVE, else ERR_ACCOUNT_ON_HOLD"
        side_effects:
          - "snapshots QuoteLine.list_unit_price_cents from StoreStock at originating_store_id for every line"
          - "sets QuoteLine.line_list_subtotal_cents = list_unit_price_cents * qty_units per line"
          - "sets JobQuote.list_subtotal_cents = sum of line_list_subtotal_cents"
          - "increments JobQuote.version by 1"
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /pro/job-quotes/{job_quote_id}/counter-offers"
        actor: ProDeskAssociate
        preconditions:
          - "expected_job_quote_version == JobQuote.version, else ERR_STALE_VERSION"
          - "round_count < MAX_QUOTE_ROUNDS (3), else ERR_QUOTE_ROUND_LIMIT"
          - "every line_prices[].quote_line_id belongs to this quote, else ERR_QUOTE_LINE_NOT_FOUND"
          - "line_prices names every QuoteLine of the quote (no partial rounds), else ERR_INCOMPLETE_COUNTER_OFFER"
          - "every negotiated_unit_price_cents in [1, QuoteLine.list_unit_price_cents], else ERR_INVALID_NEGOTIATED_PRICE"
        side_effects:
          - "writes QuoteLine.negotiated_unit_price_cents and line_negotiated_subtotal_cents for every line in line_prices"
          - "recomputes JobQuote.negotiated_total_cents and discount_depth_pct"
          - "sets JobQuote.term_days candidate from the counter-offer's term_days input"
          - "sets authored_by_user_id = X-User-ID; round_count += 1"
          - "increments JobQuote.version by 1"
        note: "Cycle edge #1 — a quote may be countered again after the contractor revises it."
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /pro/job-quotes/{job_quote_id}/revise"
        actor: ContractorAdmin
        preconditions:
          - "round_count < MAX_QUOTE_ROUNDS (3), else ERR_QUOTE_ROUND_LIMIT"
          - "ProAccount.status == ACTIVE, else ERR_ACCOUNT_ON_HOLD"
        side_effects:
          - "revision_count += 1; negotiated prices from the previous round stay on the QuoteLines until the next counter-offer overwrites them"
          - "increments JobQuote.version by 1"
        note: "Cycle edge #2 — closes the DRAFT->SUBMITTED->COUNTERED->SUBMITTED loop."
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /pro/job-quotes/{job_quote_id}/approve"
        actor: CreditManager
        preconditions:
          - "X-User-ID != JobQuote.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "discount_depth_pct <= MAX_APPROVABLE_DISCOUNT_DEPTH_PCT (0.30), else ERR_DISCOUNT_DEPTH_EXCEEDED"
          - "ProAccount.status == ACTIVE, else ERR_ACCOUNT_ON_HOLD"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "increments JobQuote.version by 1"
      - from: APPROVED
        to: ACCEPTED
        trigger: "POST /pro/job-quotes/{job_quote_id}/accept"
        actor: ContractorAdmin
        preconditions:
          - "ProAccount.status == ACTIVE, else ERR_ACCOUNT_ON_HOLD"
        side_effects:
          - "sets term_days = min(requested_term_days, TIER_TABLE[ProAccount.tier_code].max_quote_term_days)"
          - "sets term_start = current clock, term_end = term_start + term_days days"
          - "increments JobQuote.version by 1"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "POST /pro/job-quotes/{job_quote_id}/expire"
        actor: ProDeskAssociate
        preconditions:
          - "current clock > term_end, else ERR_QUOTE_TERM_ACTIVE"
        side_effects:
          - "increments JobQuote.version by 1"
          - "orders already priced under this quote keep their snapshotted OrderLine prices (no repricing)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pro/job-quotes/{job_quote_id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["status IN {DRAFT, SUBMITTED, COUNTERED, APPROVED}, else ERR_INVALID_STATE"]
        side_effects: ["sets withdrawn_reason_code", "increments JobQuote.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pro/job-quotes/{job_quote_id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["status IN {DRAFT, SUBMITTED, COUNTERED, APPROVED}, else ERR_INVALID_STATE"]
        side_effects: ["sets withdrawn_reason_code", "increments JobQuote.version by 1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /pro/job-quotes/{job_quote_id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["status IN {DRAFT, SUBMITTED, COUNTERED, APPROVED}, else ERR_INVALID_STATE"]
        side_effects: ["sets withdrawn_reason_code", "increments JobQuote.version by 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /pro/job-quotes/{job_quote_id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["status IN {DRAFT, SUBMITTED, COUNTERED, APPROVED}, else ERR_INVALID_STATE"]
        side_effects: ["sets withdrawn_reason_code", "increments JobQuote.version by 1"]

  # --- ProOrder, dimension 1 of 2: physical fulfillment -----------------------
  - entity: ProOrder
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: |
      ProOrder carries two independent parallel state dimensions on the same row. This machine moves
      only fulfillment_status; credit_status is never written by any transition below except where
      explicitly listed (submit and cancel, which touch both dimensions).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pro/pro-orders/{pro_order_id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "order has >= 1 OrderLine, else ERR_NO_ORDER_LINES"
          - "ProAccount.status == ACTIVE, else ERR_ACCOUNT_ON_HOLD"
          - "payment_method == CREDIT_LINE implies the account's CreditLine.status == ACTIVE, else ERR_CREDIT_LINE_FROZEN"
          - "po_number non-empty when ProAccount.po_required, else ERR_PO_NUMBER_REQUIRED"
          - "job_name non-empty when ProAccount.job_name_required, else ERR_JOB_NAME_REQUIRED"
          - "resale_purchase implies Store.state_code IN ProAccount.tax_exempt_state_codes, else ERR_NO_VALID_TAX_CERTIFICATE"
          - "job_quote_id non-null implies quote.status == ACCEPTED (ERR_QUOTE_NOT_ACCEPTED) and term_start <= clock <= term_end (ERR_QUOTE_TERM_EXPIRED)"
          - "payment_method == CREDIT_LINE implies total_cents <= CreditLine.available_cents, else ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "runs order_line_pricing then order_total_assembly; writes tier_code_applied, all OrderLine price fields, and the order's money fields"
          - "sets priced_at = current clock"
          - "sets credit_status UNBILLED -> AUTHORIZED (the credit dimension's own transition)"
          - "recomputes CreditLine.exposure_cents and available_cents"
          - "increments ProOrder.version by 1"
      - from: SUBMITTED
        to: RESERVED
        trigger: "POST /pro/pro-orders/{pro_order_id}/reserve"
        actor: ProDeskAssociate
        preconditions:
          - "candidate store set for every line is non-empty, else ERR_NO_SOURCING_CANDIDATES"
          - "multi_store_sourcing_allocation satisfies every line in full, else ERR_INSUFFICIENT_JOB_LOT"
          - "job_lot_required implies one single store covers every line, else ERR_JOB_LOT_SPLIT_NOT_ALLOWED"
        side_effects:
          - "creates one Reservation per (line, sourcing store) in status HELD"
          - "recomputes StoreStock.reserved_units and available_units at every sourcing store"
          - "increments ProOrder.version by 1"
      - from: RESERVED
        to: STAGED
        trigger: "POST /pro/will-call-stagings/{will_call_staging_id}/stage (system side effect on the order)"
        actor: StoreOperations
        preconditions:
          - "every Reservation of the order has status == ALLOCATED, else ERR_RESERVATIONS_NOT_ALLOCATED"
        side_effects:
          - "increments ProOrder.version by 1"
      - from: STAGED
        to: FULFILLED
        trigger: "POST /pro/will-call-stagings/{will_call_staging_id}/pick-up (system side effect on the order)"
        actor: StoreOperations
        preconditions: ["staging.status == STAGED, else ERR_INVALID_STATE"]
        side_effects:
          - "sets every Reservation of the order to CONSUMED"
          - "decrements StoreStock.on_hand_units by each consumed Reservation.qty_units and recomputes reserved_units / available_units"
          - "sets OrderLine.fulfilled_units = qty_units for every line"
          - "sets fulfilled_at = current clock"
          - "increments ProOrder.version by 1"
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/complete (system side effect on the order)"
        actor: StoreOperations
        preconditions:
          - "appointment.status == CONFIRMED, else ERR_INVALID_STATE"
          - "every Reservation of the order has status IN {HELD, ALLOCATED}, else ERR_INVALID_STATE"
        side_effects:
          - "sets every Reservation of the order to CONSUMED"
          - "decrements StoreStock.on_hand_units by each consumed Reservation.qty_units and recomputes reserved_units / available_units"
          - "sets OrderLine.fulfilled_units = qty_units for every line"
          - "sets fulfilled_at = current clock"
          - "increments ProOrder.version by 1"
      - from: RESERVED
        to: SUBMITTED
        trigger: "POST /pro/reservations/{reservation_id}/release or POST /pro/stores/{store_id}/will-call-sweep (system side effect)"
        actor: StoreOperations
        preconditions:
          - "after the release, every Reservation of the order has status == RELEASED"
        side_effects:
          - "increments ProOrder.version by 1"
        note: "Cascade hop — the order reverts only because its last remaining reservation was released."
      - from: STAGED
        to: SUBMITTED
        trigger: "POST /pro/stores/{store_id}/will-call-sweep (system side effect)"
        actor: StoreOperations
        preconditions:
          - "the order's WillCallStaging expired in this sweep and every Reservation of the order is now RELEASED"
        side_effects:
          - "increments ProOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pro/pro-orders/{pro_order_id}/cancel"
        actor: ContractorAdmin
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED, RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects: ["sets cancel_reason_code", "increments ProOrder.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /pro/pro-orders/{pro_order_id}/cancel"
        actor: ContractorAdmin
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED, RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects:
          - "sets cancel_reason_code"
          - "sets credit_status AUTHORIZED -> VOIDED"
          - "recomputes CreditLine.exposure_cents and available_cents (compensating leg of compensating_invariant/credit_exposure_round_trip)"
          - "increments ProOrder.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /pro/pro-orders/{pro_order_id}/cancel"
        actor: ContractorAdmin
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED, RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects:
          - "sets cancel_reason_code"
          - "releases every Reservation of the order (status -> RELEASED, released_reason_code = ORDER_CANCELLED)"
          - "each release recomputes StoreStock.reserved_units / available_units at its store"
          - "sets credit_status AUTHORIZED -> VOIDED and recomputes CreditLine.exposure_cents / available_cents"
          - "cancels any SCHEDULED or STAGED WillCallStaging of the order (-> EXPIRED) and any SCHEDULED or CONFIRMED DeliveryAppointment (-> CANCELLED, cancel_reason_code = ORDER_CANCELLED)"
          - "increments ProOrder.version by 1"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /pro/pro-orders/{pro_order_id}/cancel"
        actor: ContractorAdmin
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED, RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects:
          - "sets cancel_reason_code"
          - "releases every Reservation of the order and recomputes StoreStock.reserved_units / available_units"
          - "sets credit_status AUTHORIZED -> VOIDED and recomputes CreditLine.exposure_cents / available_cents"
          - "expires the order's WillCallStaging"
          - "increments ProOrder.version by 1"

  # --- ProOrder, dimension 2 of 2: commercial credit -------------------------
  - entity: ProOrder
    dimension: credit_status
    initial_state: UNBILLED
    terminal_states: [PAID, VOIDED]
    note: |
      Parallel dimension. INVOICED requires the physical dimension to have reached FULFILLED, but the
      reverse is not true: reserve/stage/pick-up never move credit_status, and invoice/pay never move
      fulfillment_status.
    transitions:
      - from: UNBILLED
        to: AUTHORIZED
        trigger: "POST /pro/pro-orders/{pro_order_id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "all DRAFT->SUBMITTED preconditions of the fulfillment dimension hold"
        side_effects:
          - "recomputes CreditLine.exposure_cents = sum of total_cents over the account's orders with credit_status IN {AUTHORIZED, INVOICED} minus credited refunds"
          - "no credit-utilization review runs here (the review is pinned to the INVOICE transition only)"
      - from: AUTHORIZED
        to: INVOICED
        trigger: "POST /pro/pro-orders/{pro_order_id}/invoice"
        actor: CreditManager
        preconditions:
          - "fulfillment_status == FULFILLED, else ERR_ORDER_NOT_FULFILLED"
          - "payment_method == CREDIT_LINE, else ERR_INVALID_STATE"
        side_effects:
          - "sets invoiced_at = current clock and recomputes net_volume_cents"
          - "CASCADE hop 1: recomputes CreditLine.exposure_cents and available_cents"
          - "CASCADE hop 2: the recomputed exposure is put through the credit-utilization review — when exposure_cents >= round_half_up(limit_cents * FREEZE_UTILIZATION_PCT) the CreditLine takes its own ACTIVE->FROZEN transition with frozen_reason_code = UTILIZATION_REVIEW"
          - "CASCADE hop 3: that CreditLine ACTIVE->FROZEN transition sets ProAccount.status ACTIVE -> HOLD"
          - "recomputes ProAccount.trailing_volume_cents / tier_code / tier_discount_pct and stamps tier_reviewed_at (tier review event)"
          - "books the rebate accrual delta per rebate_accrual_and_clawback, creating the ACCRUING RebateAccrual when the account has none"
          - "increments ProOrder.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /pro/pro-orders/{pro_order_id}/pay"
        actor: CreditManager
        preconditions:
          - "amount_cents == total_cents - credited_refund_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "recomputes CreditLine.exposure_cents and available_cents (PAID orders leave the exposure base)"
          - "increments ProOrder.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /pro/pro-orders/{pro_order_id}/cancel"
        actor: ContractorAdmin
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED, RESERVED, STAGED}"]
        side_effects:
          - "recomputes CreditLine.exposure_cents and available_cents"

  # --- Reservation -----------------------------------------------------------
  - entity: Reservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: ALLOCATED
        trigger: "POST /pro/reservations/{reservation_id}/allocate"
        actor: StoreOperations
        preconditions: ["ProOrder.fulfillment_status == RESERVED, else ERR_INVALID_STATE"]
        side_effects: ["increments Reservation.version by 1 (StoreStock.reserved_units unchanged: HELD and ALLOCATED both occupy units)"]
      - from: HELD
        to: RELEASED
        trigger: "POST /pro/reservations/{reservation_id}/release"
        actor: StoreOperations
        preconditions: ["ProOrder.fulfillment_status IN {SUBMITTED, RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects:
          - "sets released_reason_code"
          - "recomputes StoreStock.reserved_units / available_units at store_id"
          - "when every Reservation of the order is now RELEASED, drives ProOrder.fulfillment_status back to SUBMITTED"
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /pro/reservations/{reservation_id}/release or will-call sweep expiry cascade"
        actor: StoreOperations
        preconditions: ["ProOrder.fulfillment_status IN {RESERVED, STAGED}, else ERR_INVALID_STATE"]
        side_effects:
          - "sets released_reason_code"
          - "recomputes StoreStock.reserved_units / available_units at store_id"
          - "when every Reservation of the order is now RELEASED, drives ProOrder.fulfillment_status back to SUBMITTED"
      - from: ALLOCATED
        to: CONSUMED
        trigger: "POST /pro/will-call-stagings/{will_call_staging_id}/pick-up"
        actor: StoreOperations
        preconditions: ["staging.status == STAGED"]
        side_effects: ["decrements StoreStock.on_hand_units by qty_units and recomputes reserved_units / available_units"]
      - from: HELD
        to: CONSUMED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/complete"
        actor: StoreOperations
        preconditions: ["appointment.status == CONFIRMED"]
        side_effects: ["decrements StoreStock.on_hand_units by qty_units and recomputes reserved_units / available_units"]

  # --- WillCallStaging -------------------------------------------------------
  - entity: WillCallStaging
    initial_state: SCHEDULED
    terminal_states: [PICKED_UP, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: STAGED
        trigger: "POST /pro/will-call-stagings/{will_call_staging_id}/stage"
        actor: StoreOperations
        preconditions:
          - "ProOrder.fulfillment_status == RESERVED, else ERR_INVALID_STATE"
          - "every Reservation of the order has status == ALLOCATED, else ERR_RESERVATIONS_NOT_ALLOCATED"
        side_effects: ["drives ProOrder.fulfillment_status RESERVED -> STAGED", "increments WillCallStaging.version by 1"]
      - from: STAGED
        to: PICKED_UP
        trigger: "POST /pro/will-call-stagings/{will_call_staging_id}/pick-up"
        actor: StoreOperations
        preconditions:
          - "current clock < expires_at, else ERR_INVALID_STATE"
        side_effects:
          - "sets picked_up_by and picked_up_at"
          - "drives ProOrder.fulfillment_status STAGED -> FULFILLED with its consume/decrement side effects"
          - "increments WillCallStaging.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /pro/stores/{store_id}/will-call-sweep (system, ops run) or order cancellation cascade"
        actor: StoreOperations
        preconditions: ["expires_at <= current clock (sweep) or owning order is being cancelled"]
        side_effects:
          - "CASCADE hop 1: releases every Reservation of the order in status IN {HELD, ALLOCATED} with released_reason_code = STAGING_EXPIRED"
          - "CASCADE hop 2: each of those releases recomputes StoreStock.reserved_units / available_units at its store"
          - "CASCADE hop 3: because every Reservation of the order is now RELEASED, ProOrder.fulfillment_status falls back RESERVED|STAGED -> SUBMITTED"
      - from: STAGED
        to: EXPIRED
        trigger: "POST /pro/stores/{store_id}/will-call-sweep (system, ops run) or order cancellation cascade"
        actor: StoreOperations
        preconditions: ["expires_at <= current clock (sweep) or owning order is being cancelled"]
        side_effects:
          - "CASCADE hop 1: releases every Reservation of the order in status IN {HELD, ALLOCATED} with released_reason_code = STAGING_EXPIRED"
          - "CASCADE hop 2: each release recomputes StoreStock.reserved_units / available_units"
          - "CASCADE hop 3: ProOrder.fulfillment_status STAGED -> SUBMITTED"

  # --- DeliveryAppointment ---------------------------------------------------
  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/confirm"
        actor: StoreOperations
        preconditions:
          - "DeliveryTruck.status == AVAILABLE, else ERR_TRUCK_OUT_OF_SERVICE"
          - "ProOrder.fulfillment_status == RESERVED, else ERR_INVALID_STATE"
        side_effects: ["increments DeliveryAppointment.version by 1"]
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/complete"
        actor: StoreOperations
        preconditions: ["ProOrder.fulfillment_status == RESERVED, else ERR_INVALID_STATE"]
        side_effects:
          - "sets delivered_at = current clock"
          - "drives ProOrder.fulfillment_status RESERVED -> FULFILLED with its consume/decrement side effects"
          - "increments DeliveryAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/cancel or order cancellation cascade"
        actor: StoreOperations
        preconditions: ["status IN {SCHEDULED, CONFIRMED}, else ERR_INVALID_STATE"]
        side_effects: ["sets cancel_reason_code", "frees the truck window for later appointments"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /pro/delivery-appointments/{delivery_appointment_id}/cancel or order cancellation cascade"
        actor: StoreOperations
        preconditions: ["status IN {SCHEDULED, CONFIRMED}, else ERR_INVALID_STATE"]
        side_effects: ["sets cancel_reason_code", "frees the truck window for later appointments"]

  # --- CreditLine: cyclic ACTIVE -> FROZEN -> ACTIVE -------------------------
  - entity: CreditLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /pro/credit-lines/{credit_line_id}/freeze (manual) or the credit-utilization review inside POST /pro/pro-orders/{pro_order_id}/invoice"
        actor: CreditManager
        preconditions:
          - "manual freeze: none beyond role; review freeze: exposure_cents >= round_half_up(limit_cents * FREEZE_UTILIZATION_PCT)"
        side_effects:
          - "sets frozen_reason_code (MANUAL or UTILIZATION_REVIEW)"
          - "sets ProAccount.status ACTIVE -> HOLD"
          - "increments CreditLine.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /pro/credit-lines/{credit_line_id}/reinstate"
        actor: CreditManager
        preconditions:
          - "status == FROZEN, else ERR_CREDIT_LINE_NOT_FROZEN"
          - "exposure_cents < round_half_up(limit_cents * FREEZE_UTILIZATION_PCT), else ERR_UTILIZATION_STILL_HIGH"
        side_effects:
          - "clears frozen_reason_code"
          - "increments CreditLine.version by 1"
        note: "Cycle edge — the credit line may be frozen again by a later invoice review."

  # --- ProAccount: cyclic ACTIVE -> HOLD -> ACTIVE ---------------------------
  - entity: ProAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: HOLD
        trigger: "CreditLine ACTIVE->FROZEN cascade"
        actor: system
        preconditions: ["the account's CreditLine just transitioned to FROZEN"]
        side_effects: ["blocks POST /pro/job-quotes/{id}/submit, /revise, /approve, /accept and POST /pro/pro-orders/{id}/submit with ERR_ACCOUNT_ON_HOLD"]
      - from: HOLD
        to: ACTIVE
        trigger: "POST /pro/pro-accounts/{pro_account_id}/reinstate"
        actor: CreditManager
        preconditions: ["the account's CreditLine.status == ACTIVE, else ERR_CREDIT_LINE_FROZEN"]
        side_effects: ["increments ProAccount.version by 1"]

  # --- TaxExemptCertificate --------------------------------------------------
  - entity: TaxExemptCertificate
    initial_state: PENDING
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /pro/tax-exempt-certificates/{tax_exempt_certificate_id}/verify"
        actor: TaxComplianceOfficer
        preconditions: ["expires_on is strictly after the current clock date, else ERR_CERTIFICATE_STATE_MISMATCH"]
        side_effects:
          - "sets verified_at = current clock"
          - "any other certificate of the same (pro_account_id, state_code) with status == VERIFIED transitions VERIFIED -> SUPERSEDED"
          - "recomputes ProAccount.tax_exempt_state_codes"
          - "increments TaxExemptCertificate.version by 1"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "verification of a newer certificate for the same (pro_account_id, state_code)"
        actor: system
        preconditions: ["a newer certificate for the same account and state has just been verified"]
        side_effects: ["recomputes ProAccount.tax_exempt_state_codes"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /pro/tax-exempt-certificates/{tax_exempt_certificate_id}/revoke"
        actor: TaxComplianceOfficer
        preconditions: ["status == VERIFIED, else ERR_INVALID_STATE"]
        side_effects:
          - "sets revoke_reason_code"
          - "recomputes ProAccount.tax_exempt_state_codes (already-priced orders keep tax_exempt_applied and tax_cents unchanged)"
          - "increments TaxExemptCertificate.version by 1"

  # --- RebateAccrual ---------------------------------------------------------
  - entity: RebateAccrual
    initial_state: ACCRUING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ACCRUING
        to: PAYABLE
        trigger: "POST /pro/rebate-accruals/{rebate_accrual_id}/close"
        actor: CreditManager
        preconditions: ["payable_cents > 0, else the accrual goes to VOIDED instead"]
        side_effects: ["sets closed_at = current clock", "increments RebateAccrual.version by 1"]
      - from: ACCRUING
        to: VOIDED
        trigger: "POST /pro/rebate-accruals/{rebate_accrual_id}/close"
        actor: CreditManager
        preconditions: ["payable_cents == 0 (clawbacks consumed the whole accrual)"]
        side_effects:
          - "sets closed_at = current clock"
          - "recomputes ProAccount.rebate_accrued_cents (a VOIDED accrual leaves the base)"
          - "increments RebateAccrual.version by 1"
      - from: PAYABLE
        to: PAID
        trigger: "POST /pro/rebate-accruals/{rebate_accrual_id}/pay-out"
        actor: CreditManager
        preconditions: ["payable_cents > 0, else ERR_NO_REBATE_PAYABLE"]
        side_effects:
          - "sets paid_amount_cents = payable_cents and payout_reference"
          - "recomputes ProAccount.rebate_accrued_cents (a PAID accrual leaves the base)"
          - "increments RebateAccrual.version by 1"

  # --- ReturnRequest ---------------------------------------------------------
  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, CREDITED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pro/return-requests/{return_request_id}/approve"
        actor: ProDeskAssociate
        preconditions:
          - "floor((clock - ProOrder.fulfilled_at)/86400) <= RETURN_WINDOW_DAYS (90), else ERR_RETURN_WINDOW_CLOSED"
        side_effects:
          - "runs return_refund_valuation: pins valuation_mode, gross_refund_cents, restocking_fee_pct, restocking_fee_cents, tax_refund_cents, refund_total_cents"
          - "sets approved_by_user_id = X-User-ID"
          - "increments ReturnRequest.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /pro/return-requests/{return_request_id}/deny"
        actor: ProDeskAssociate
        preconditions: ["status == REQUESTED, else ERR_INVALID_STATE"]
        side_effects: ["sets denied_reason_code", "increments ReturnRequest.version by 1"]
      - from: APPROVED
        to: CREDITED
        trigger: "POST /pro/return-requests/{return_request_id}/credit"
        actor: CreditManager
        preconditions:
          - "ProOrder.credit_status IN {AUTHORIZED, INVOICED, PAID}, else ERR_INVALID_STATE"
        side_effects:
          - "sets credited_at = current clock; adds qty to OrderLine.returned_units"
          - "CASCADE hop 1: recomputes ProOrder.credited_refund_cents, credited_gross_refund_cents and net_volume_cents"
          - "CASCADE hop 2: those order-level changes recompute CreditLine.exposure_cents and available_cents (compensating leg of the credit-exposure invariant)"
          - "CASCADE hop 3: the changed net_volume_cents recomputes ProAccount.trailing_volume_cents, tier_code, tier_discount_pct and stamps tier_reviewed_at"
          - "books the rebate clawback delta on the account's newest ACCRUING or PAYABLE RebateAccrual per rebate_accrual_and_clawback"
          - "increments ReturnRequest.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# mechanism; both entries are CREATE-with-supersede shapes)
# =============================================================================
concurrency_rules:
  - rule_id: counter-offer-stale-quote
    parent_entity: JobQuote
    write_endpoint: "POST /pro/job-quotes/{job_quote_id}/counter-offers"
    occ_field: "expected_job_quote_version"
    description: |
      A counter-offer written against a JobQuote whose version has advanced since the pro desk last
      read it is rejected. The product deliberately allows a fresh counter-offer to supersede the
      previous round's negotiated prices, so the write itself is legitimate from a state standpoint;
      only the stale version tells the server that the associate priced against an outdated round.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cert-supersede-stale-account
    parent_entity: ProAccount
    write_endpoint: "POST /pro/tax-exempt-certificates"
    occ_field: "expected_pro_account_version"
    description: |
      Filing a resale certificate against a ProAccount whose version has advanced since the
      contractor last read it is rejected. A newer certificate legitimately supersedes the prior
      verified certificate for the same state, so the create is not blocked by any state
      precondition; the stale version is what identifies a filing made against an outdated view of
      the account's exemption set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: account_tier_determination
    trigger: |
      Recomputed (tier review event) on ProAccount creation, on POST /pro/pro-accounts/{id}/volume-adjustments,
      on the ProOrder credit AUTHORIZED->INVOICED transition, and on the ReturnRequest APPROVED->CREDITED
      transition. Consulted (without writing) by order_line_pricing and by GET pricing-preview.
    algorithm: threshold
    formula: |
      # ---- step 1: trailing volume (window is closed on both ends) ----
      window_start = current_clock - TRAILING_WINDOW_DAYS days
      in_window(o) = (o.credit_status IN {INVOICED, PAID}) AND (o.invoiced_at >= window_start) AND (o.invoiced_at <= current_clock)
      trailing_volume_cents = account.baseline_volume_cents
                            + sum(o.net_volume_cents for o in ProOrder where o.pro_account_id == account.id AND in_window(o))
      # o.net_volume_cents = o.subtotal_cents - o.credited_gross_refund_cents (returns net out at gross-refund value)

      # ---- step 2: tier selection (inclusive lower bound) ----
      eligible = [t for t in TIER_TABLE if t.min_trailing_volume_cents <= volume_used]
      tier = the element of eligible with the greatest min_trailing_volume_cents
             # TIER_TABLE thresholds are distinct by construction, so no tie is possible;
             # were two rows to share a threshold, the greater discount_pct wins, then the row
             # appearing earlier in TIER_TABLE.
      tier_code = tier.tier_code ; tier_discount_pct = tier.discount_pct

      # ---- step 3: which volume feeds step 2 (variant-dependent, see variants) ----
      # PINNED_AT_REVIEW:        volume_used = trailing_volume_cents as of the last tier review
      # ROLLING_365_INCLUSIVE:   volume_used = trailing_volume_cents + order.list_subtotal_cents
    input_set: |
      Only the account's own ProOrders with credit_status IN {INVOICED, PAID} and invoiced_at inside the
      closed 365-day window ending at the current clock. DRAFT / SUBMITTED / AUTHORIZED / VOIDED orders
      never contribute, so an authorized-but-not-invoiced order does not move the tier.
    constants:
      TRAILING_WINDOW_DAYS: 365
      TIER_TABLE:
        - { tier_code: MEMBER,   min_trailing_volume_cents: 0,        discount_pct: 0.00, rebate_rate_pct: 0.000, max_quote_term_days: 15 }
        - { tier_code: GOLD,     min_trailing_volume_cents: 5000000,  discount_pct: 0.05, rebate_rate_pct: 0.010, max_quote_term_days: 30 }
        - { tier_code: PLATINUM, min_trailing_volume_cents: 20000000, discount_pct: 0.08, rebate_rate_pct: 0.020, max_quote_term_days: 60 }
        - { tier_code: DIAMOND,  min_trailing_volume_cents: 50000000, discount_pct: 0.12, rebate_rate_pct: 0.030, max_quote_term_days: 90 }
    precision: "trailing_volume_cents and all money in integer cents; discount_pct exact from TIER_TABLE"
    variants:
      - name: PINNED_AT_REVIEW
        when: "ProAccount.tier_review_mode == PINNED_AT_REVIEW (the default)"
        difference: |
          Order pricing uses the tier_code / tier_discount_pct persisted on the account by the last tier
          review event. The order being priced never influences its own tier, so an order that would by
          itself carry the account over a threshold is still priced at the old tier.
      - name: ROLLING_365_INCLUSIVE
        when: "ProAccount.tier_review_mode == ROLLING_365_INCLUSIVE"
        difference: |
          Order pricing adds the order's own list_subtotal_cents (undiscounted, so the computation cannot
          be circular) to trailing_volume_cents before step 2, then prices at the resulting tier. For
          identical stored data the two variants can select different tiers and therefore produce
          different subtotal_cents, discount_cents, tax_cents and total_cents for the same order.

  - name: quote_negotiation_rollup
    trigger: |
      JobQuote DRAFT->SUBMITTED (list snapshot), SUBMITTED->COUNTERED (negotiated rollup, once per
      counter-offer round), and APPROVED->ACCEPTED (term window).
    algorithm: aggregation
    formula: |
      # ---- on submit: snapshot list prices from the ORIGINATING store ----
      for each QuoteLine Q of the quote:
        Q.list_unit_price_cents   = StoreStock(quote.originating_store_id, Q.sku).list_unit_price_cents
        Q.line_list_subtotal_cents = Q.list_unit_price_cents * Q.qty_units
      quote.list_subtotal_cents = sum(Q.line_list_subtotal_cents)
      # ---- on each counter-offer round: the round SUPERSEDES the previous prices ----
      # line_prices[] must name every QuoteLine of the quote, else ERR_INCOMPLETE_COUNTER_OFFER
      for each entry (quote_line_id, negotiated_unit_price_cents) in line_prices:
        Q.negotiated_unit_price_cents  = negotiated_unit_price_cents        # in [1, Q.list_unit_price_cents]
        Q.line_negotiated_subtotal_cents = Q.negotiated_unit_price_cents * Q.qty_units
      quote.negotiated_total_cents = sum(Q.line_negotiated_subtotal_cents)
      quote.discount_depth_pct = round_half_up(
          (quote.list_subtotal_cents - quote.negotiated_total_cents) / quote.list_subtotal_cents, 4)
      quote.round_count += 1                                               # < MAX_QUOTE_ROUNDS before the round
      # ---- on accept: the term is the lesser of what was asked and what the tier permits ----
      quote.term_days  = min(quote.requested_term_days, TIER_TABLE[account.tier_code].max_quote_term_days)
      quote.term_start = current_clock
      quote.term_end   = quote.term_start + quote.term_days days           # both bounds inclusive downstream
    input_set: "Only the quote's own QuoteLines; only StoreStock rows of quote.originating_store_id supply list prices. The tier consulted for max_quote_term_days is the one persisted on the account at the acceptance instant."
    constants:
      MAX_QUOTE_ROUNDS: 3
      MAX_APPROVABLE_DISCOUNT_DEPTH_PCT: 0.30
    precision: "money in integer cents (exact products, no rounding); discount_depth_pct round_half_up to 4 decimals"
    variants: []

  - name: order_line_pricing
    trigger: "ProOrder fulfillment DRAFT->SUBMITTED (writes the fields) and GET /pro/pro-orders/{id}/pricing-preview (read-only)"
    algorithm: tiered_pricing
    formula: |
      tier_code_applied, d = account_tier_determination(order)   # variant per account.tier_review_mode
      for each line L in the order's OrderLines, ordered by OrderLine.created_at ASC:
        stock = StoreStock row with (store_id == order.fulfillment_store_id, sku == L.sku)
        L.list_unit_price_cents = stock.list_unit_price_cents
        qline = QuoteLine of order.job_quote_id with the same sku, if order.job_quote_id is not null
        quote_binds = qline exists
                      AND qline.negotiated_unit_price_cents is not null
                      AND quote.term_start <= pricing_instant <= quote.term_end      # both bounds inclusive
        if quote_binds:
          L.price_source = QUOTED
          L.effective_unit_price_cents = qline.negotiated_unit_price_cents
        else:
          L.price_source = TIER_DISCOUNTED
          # ROUNDING ORDER IS PINNED AT THE UNIT: round first, then multiply by qty.
          L.effective_unit_price_cents = round_half_up(L.list_unit_price_cents * (1 - d))
        L.line_subtotal_cents = L.effective_unit_price_cents * L.qty_units          # exact integer product
      order.subtotal_cents      = sum(L.line_subtotal_cents)
      order.list_subtotal_cents = sum(L.list_unit_price_cents * L.qty_units)
      order.discount_cents      = order.list_subtotal_cents - order.subtotal_cents
    input_set: "All OrderLines of the order (an order with zero lines cannot be submitted). Only the StoreStock rows of order.fulfillment_store_id supply list prices, never a sourcing store's price."
    constants: {}
    precision: |
      2-step rounding, order PINNED: round_half_up at the UNIT price, then multiply by qty_units, then sum
      lines. The alternative reading — multiply list by qty, apply the discount to the line, then round —
      yields different cents (list 1999, d = 0.08, qty 7: pinned = round(1839.08)*7 = 1839*7 = 12873;
      unpinned = round(13993*0.92) = round(12873.56) = 12874). Implementations MUST produce 12873.
    variants: []

  - name: order_total_assembly
    trigger: "ProOrder fulfillment DRAFT->SUBMITTED (writes the fields) and GET /pro/pro-orders/{id}/pricing-preview (read-only)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The freight waiver is keyed on a figure that does NOT contain the
      # surcharge, which is what makes the apparent circularity (total needs the surcharge, the surcharge
      # needs a total) well defined.
      # 1. lines -> subtotal_cents / list_subtotal_cents / discount_cents  (order_line_pricing)
      # 2. freight base
      base_freight = FREIGHT_BASE_SURCHARGE_CENTS if order.delivery_mode == DELIVERY else 0
      # 3. waiver test — against subtotal_cents ONLY (post-discount line total, excluding surcharge,
      #    lift-gate fee and tax). Inclusive: exactly at the threshold the freight is waived.
      order.freight_surcharge_cents = 0 if (base_freight > 0 AND order.subtotal_cents >= FREIGHT_WAIVER_SUBTOTAL_CENTS) else base_freight
      # 4. lift-gate fee is NEVER waived, even when the freight base is
      order.lift_gate_fee_cents = LIFT_GATE_FEE_CENTS if (order.delivery_mode == DELIVERY AND order.lift_gate_required) else 0
      # 5. exemption + tax
      store = Store(order.fulfillment_store_id)
      order.tax_exempt_applied = order.resale_purchase AND (store.state_code IN account.tax_exempt_state_codes)
      tax_base = order.subtotal_cents + order.freight_surcharge_cents + order.lift_gate_fee_cents
      order.tax_cents = 0 if order.tax_exempt_applied else round_half_up(tax_base * store.tax_rate_pct)
      # 6. total
      order.total_cents = order.subtotal_cents + order.freight_surcharge_cents + order.lift_gate_fee_cents + order.tax_cents
    input_set: "The order's own priced lines plus the fulfillment Store's tax_rate_pct and state_code, plus the account's tax_exempt_state_codes evaluated at the pricing instant."
    constants:
      FREIGHT_BASE_SURCHARGE_CENTS: 8900
      FREIGHT_WAIVER_SUBTOTAL_CENTS: 250000
      LIFT_GATE_FEE_CENTS: 4500
    precision: "integer cents; a single round_half_up on the tax, applied to the summed tax base (never per line)"
    variants: []

  - name: credit_exposure_and_authorization
    trigger: |
      Recomputed on ProOrder credit transitions UNBILLED->AUTHORIZED, AUTHORIZED->INVOICED,
      INVOICED->PAID, AUTHORIZED->VOIDED, and on ReturnRequest APPROVED->CREDITED. Evaluated as a gate
      inside the ProOrder DRAFT->SUBMITTED transition.
    algorithm: aggregation
    formula: |
      outstanding = [o for o in ProOrder
                     where o.pro_account_id == credit_line.pro_account_id
                       AND o.credit_status IN {AUTHORIZED, INVOICED}]
      credit_line.exposure_cents = sum(o.total_cents for o in outstanding)
                                 - sum(o.credited_refund_cents for o in outstanding)
      credit_line.available_cents = credit_line.limit_cents - credit_line.exposure_cents
      # authorization gate at submit (inclusive: an order that lands exactly on the limit is accepted)
      authorize_ok = (order.payment_method != CREDIT_LINE) OR (order.total_cents <= credit_line.available_cents)
      # utilization review — evaluated ONLY on the AUTHORIZED->INVOICED transition
      freeze_threshold_cents = round_half_up(credit_line.limit_cents * FREEZE_UTILIZATION_PCT)
      freeze_now = (credit_line.exposure_cents >= freeze_threshold_cents)
    input_set: "Only the account's own orders in credit_status AUTHORIZED or INVOICED; PAID and VOIDED orders leave the exposure base entirely, and DRAFT/UNBILLED orders never enter it."
    constants:
      FREEZE_UTILIZATION_PCT: 0.90
    precision: "integer cents; one round_half_up on the freeze threshold"
    variants: []

  - name: multi_store_sourcing_allocation
    trigger: "ProOrder fulfillment SUBMITTED->RESERVED (POST /pro/pro-orders/{pro_order_id}/reserve)"
    algorithm: waterfall_allocation
    formula: |
      # candidate set (eligibility filter, explicit predicate — no fuzzy 'available stores')
      region = Store(order.fulfillment_store_id).region_code
      candidates(sku) = [ s for s in Store
                          where s.region_code == region
                            AND exists StoreStock st with (st.store_id == s.id AND st.sku == sku
                                                           AND st.on_hand_units - st.reserved_units > 0) ]
      if candidates(sku) is empty for any line -> reject whole call with ERR_NO_SOURCING_CANDIDATES
      # ranking expression (sort key), applied per line:
      #   1. the order's fulfillment store first  (rank key 0; every other store gets 1)
      #   2. Store.distance_rank ASC
      #   3. StoreStock.available_units DESC
      #   4. Store.created_at ASC                      (final tie-break; ids are never consulted)
      # allocation: strict waterfall, lines processed in OrderLine.created_at ASC order
      for L in order lines ordered by created_at ASC:
        remaining = L.qty_units
        for s in ranked candidates(L.sku):
          take = min(remaining, available_units(s, L.sku))
          if take > 0: plan.append(Reservation(order, L, s, L.sku, take)) ; remaining -= take
          if remaining == 0: break
        if remaining > 0 -> reject whole call with ERR_INSUFFICIENT_JOB_LOT   # all-or-nothing across ALL lines
      if order.job_lot_required AND the plan uses more than one distinct store
         -> reject whole call with ERR_JOB_LOT_SPLIT_NOT_ALLOWED
      commit: persist every planned Reservation in status HELD, then recompute
              StoreStock.reserved_units = sum(qty_units of its HELD/ALLOCATED Reservations)
    input_set: "StoreStock rows of stores sharing the fulfillment store's region_code; only rows with available_units > 0 are candidates. Rejection is atomic — no Reservation row and no reserved_units change survives a failed call."
    constants: {}
    precision: "integer units; no rounding"
    variants: []

  - name: return_refund_valuation
    trigger: "ReturnRequest REQUESTED->APPROVED (POST /pro/return-requests/{return_request_id}/approve)"
    algorithm: weighted_scoring
    formula: |
      order = ProOrder(request.pro_order_id) ; store = Store(order.fulfillment_store_id)
      age_days = floor((current_clock - order.fulfilled_at) / 86400)
      if age_days > RETURN_WINDOW_DAYS -> ERR_RETURN_WINDOW_CLOSED
      # --- variant selection (see variants); pinned once, here, and stored on the request ---
      quote_still_binding = order.job_quote_id is not null AND current_clock <= JobQuote.term_end
      valuation_mode = QUOTED_TERM if quote_still_binding else CURRENT_LIST
      for each requested line R (order by OrderLine.created_at ASC):
        L = OrderLine(R.order_line_id)
        if valuation_mode == QUOTED_TERM:
          refund_unit = L.effective_unit_price_cents                      # what was actually paid
        else:
          refund_unit = round_half_up( StoreStock(order.fulfillment_store_id, L.sku).list_unit_price_cents
                                       * (1 - account.tier_discount_pct) )   # tier persisted on the account NOW
        gross += refund_unit * R.qty_units
      request.gross_refund_cents = gross
      # --- restocking policy: age band vs job-quoted-material floor, max() wins ---
      age_pct = 0.00 if age_days <= RESTOCK_FREE_WINDOW_DAYS else 0.10
      floor_pct = QUOTED_MATERIAL_RESTOCK_FLOOR_PCT if any returned line has L.price_source == QUOTED else 0.00
      request.restocking_fee_pct = max(age_pct, floor_pct)
      # ONE rounding, on the summed gross (contrast with order_line_pricing's per-unit rounding)
      request.restocking_fee_cents = round_half_up(request.gross_refund_cents * request.restocking_fee_pct)
      net_goods = request.gross_refund_cents - request.restocking_fee_cents
      request.tax_refund_cents = 0 if order.tax_exempt_applied else round_half_up(net_goods * store.tax_rate_pct)
      request.refund_total_cents = net_goods + request.tax_refund_cents
    input_set: "Only the OrderLines named in request.lines, each capped at fulfilled_units - returned_units. Only orders with fulfillment_status == FULFILLED may be returned against."
    constants:
      RETURN_WINDOW_DAYS: 90
      RESTOCK_FREE_WINDOW_DAYS: 30
      QUOTED_MATERIAL_RESTOCK_FLOOR_PCT: 0.15
    precision: "integer cents; round_half_up once on the restocking fee and once on the tax refund"
    variants:
      - name: QUOTED_TERM
        when: "the order was placed against a JobQuote and the approval instant is still <= JobQuote.term_end"
        difference: |
          Every line is refunded at the negotiated unit price the contractor actually paid
          (OrderLine.effective_unit_price_cents).
      - name: CURRENT_LIST
        when: "the order carries no JobQuote, or the approval instant is past JobQuote.term_end"
        difference: |
          Every line is revalued at today's list price less the account's currently persisted tier
          discount, which for identical return quantities yields a different gross refund, a different
          restocking fee and a different tax refund than QUOTED_TERM — and can even exceed what the
          contractor paid when the negotiated price was deeper than the tier discount.

  - name: rebate_accrual_and_clawback
    trigger: |
      Accrual delta on the ProOrder credit AUTHORIZED->INVOICED transition; clawback delta on the
      ReturnRequest APPROVED->CREDITED transition. Final figures frozen by
      POST /pro/rebate-accruals/{rebate_accrual_id}/close.
    algorithm: aggregation
    formula: |
      # accrual target (invoice): the account's accrual with payout_status == ACCRUING; if none exists the
      # invoice transition creates one with period_start = current clock date and
      # period_end = period_start + REBATE_PERIOD_DAYS days.
      # clawback target (return credit): the account's newest accrual with payout_status IN
      # {ACCRUING, PAYABLE} (a closed-but-unpaid period is still clawable); PAID and VOIDED are immune.
      rate = TIER_TABLE[account.tier_code].rebate_rate_pct        # tier as persisted at the triggering instant
      on invoice:        accrual.accrued_cents     += round_half_up(order.subtotal_cents * rate)
      on return credit:  accrual.clawed_back_cents += round_half_up(request.gross_refund_cents * rate)
      accrual.payable_cents = max(0, accrual.accrued_cents - accrual.clawed_back_cents)
      account.rebate_accrued_cents = sum(a.payable_cents for a in the account's RebateAccruals
                                         where a.payout_status IN {ACCRUING, PAYABLE})
      on close:   payout_status = PAYABLE if payable_cents > 0 else VOIDED
      on pay-out: paid_amount_cents = payable_cents ; payout_status = PAID
    input_set: |
      Only invoices booked while the accrual is ACCRUING raise accrued_cents; once the accrual is PAYABLE
      or PAID a later invoice opens a new ACCRUING accrual. Clawbacks are booked one rung wider: a credited
      return hits the newest accrual whose payout_status is ACCRUING or PAYABLE, so a period closed but not
      yet paid can still be clawed down to payable_cents == 0 (which is exactly what makes a later pay-out
      fail with ERR_NO_REBATE_PAYABLE). PAID and VOIDED accruals are never touched again.
    constants:
      REBATE_PERIOD_DAYS: 90
    precision: "integer cents; round_half_up per booking event (deltas are rounded, never the running total)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - { priority: 1,  category: auth,        check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,        check: "the acting role appears in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: all }
  - { priority: 3,  category: existence,   check: "path resources resolve left to right (store -> stock -> order -> line ...)", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path parameters" }
  - { priority: 4,  category: existence,   check: "body foreign keys resolve (pro_account_id, home_store_id, fulfillment_store_id, job_quote_id, delivery_truck_id, order_line_id inside lines[])", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all POST endpoints carrying foreign keys" }
  - { priority: 5,  category: business_constraint, check: "request body shape: required fields present, enums in range, integers >= their declared minimum, ISO-8601 datetimes and ISO dates parseable, lines[]/line_prices[] non-empty", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 6,  category: state,       check: "OCC: expected_job_quote_version == JobQuote.version / expected_pro_account_version == ProAccount.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /pro/job-quotes/{job_quote_id}/counter-offers, POST /pro/tax-exempt-certificates" }
  - { priority: 7,  category: auth,        check: "a ContractorAdmin's X-User-ID equals the pro_account_id owning the target resource (entity_backed identity)", error_id: ERR_ACCOUNT_SCOPE_VIOLATION, http_status: 403, applies_to: "all ContractorAdmin endpoints" }
  - { priority: 8,  category: business_constraint, check: "uniqueness: (store_id, sku) on StoreStock", error_id: ERR_DUPLICATE_STORE_STOCK, http_status: 409, applies_to: "POST /pro/store-stocks" }
  - { priority: 9,  category: business_constraint, check: "at most one CreditLine per ProAccount", error_id: ERR_CREDIT_LINE_EXISTS, http_status: 409, applies_to: "POST /pro/credit-lines" }
  - { priority: 10, category: state,       check: "reinstating a credit line whose status is already ACTIVE (specialization of the generic §1.2 guard, evaluated before it)", error_id: ERR_CREDIT_LINE_NOT_FROZEN, http_status: 409, applies_to: "POST /pro/credit-lines/{credit_line_id}/reinstate" }
  - { priority: 11, category: state,       check: "reinstating a FROZEN credit line whose exposure_cents is still >= round_half_up(limit_cents * FREEZE_UTILIZATION_PCT)", error_id: ERR_UTILIZATION_STILL_HIGH, http_status: 409, applies_to: "POST /pro/credit-lines/{credit_line_id}/reinstate" }
  - { priority: 12, category: state,       check: "booking a will-call bay or a delivery appointment for an order whose fulfillment_status is not RESERVED (the /stage and /confirm transitions keep the generic ERR_INVALID_STATE)", error_id: ERR_ORDER_NOT_RESERVED, http_status: 409, applies_to: "POST /pro/will-call-stagings, POST /pro/delivery-appointments" }
  - { priority: 13, category: state,       check: "target resource is in a state the requested transition leaves from (generic state-machine guard; the three specializations at priorities 10-12 are evaluated first)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 14, category: state,       check: "ProAccount.status == ACTIVE for quote submit/revise/approve/accept and order submit", error_id: ERR_ACCOUNT_ON_HOLD, http_status: 409, applies_to: "POST /pro/job-quotes/{job_quote_id}/submit, /revise, /approve, /accept; POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 15, category: state,       check: "CreditLine.status == ACTIVE when the order pays by CREDIT_LINE; account reinstatement requires an ACTIVE credit line", error_id: ERR_CREDIT_LINE_FROZEN, http_status: 409, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit, POST /pro/pro-accounts/{pro_account_id}/reinstate" }
  - { priority: 16, category: state,       check: "ProOrder.fulfillment_status == FULFILLED before invoicing", error_id: ERR_ORDER_NOT_FULFILLED, http_status: 409, applies_to: "POST /pro/pro-orders/{pro_order_id}/invoice, POST /pro/return-requests" }
  - { priority: 17, category: state,       check: "every Reservation of the order is ALLOCATED before the staging may be staged", error_id: ERR_RESERVATIONS_NOT_ALLOCATED, http_status: 409, applies_to: "POST /pro/will-call-stagings/{will_call_staging_id}/stage" }
  - { priority: 18, category: state,       check: "DeliveryTruck.status == AVAILABLE when scheduling or confirming an appointment on it", error_id: ERR_TRUCK_OUT_OF_SERVICE, http_status: 409, applies_to: "POST /pro/delivery-appointments, POST /pro/delivery-appointments/{delivery_appointment_id}/confirm" }
  - { priority: 19, category: business_safety, check: "order.lift_gate_required implies the assigned DeliveryTruck.lift_gate_equipped is true and the store's lift_gate_available is true", error_id: ERR_LIFT_GATE_UNAVAILABLE, http_status: 422, applies_to: "POST /pro/delivery-appointments" }
  - { priority: 20, category: business_safety, check: "jobsite_access_type is a member of the truck's access_types_supported", error_id: ERR_JOBSITE_ACCESS_UNSUPPORTED, http_status: 422, applies_to: "POST /pro/delivery-appointments" }
  - { priority: 21, category: business_temporal, check: "window_end strictly after window_start (a zero-length or inverted delivery window is rejected; the will-call analogue of this length check is priority 22)", error_id: ERR_INVALID_DELIVERY_WINDOW, http_status: 422, applies_to: "POST /pro/delivery-appointments" }
  - { priority: 22, category: business_temporal, check: "stage_hours <= Store.max_stage_hours", error_id: ERR_STAGE_WINDOW_TOO_LONG, http_status: 422, applies_to: "POST /pro/will-call-stagings" }
  - { priority: 23, category: business_constraint, check: "the inflated truck window [window_start - buffer, window_end + buffer] (closed, endpoints inclusive) must not intersect any SCHEDULED or CONFIRMED appointment window of the same truck", error_id: ERR_TRUCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /pro/delivery-appointments" }
  - { priority: 24, category: business_constraint, check: "the half-open bay interval [stage_start, expires_at) must not overlap will_call_bay_slots or more SCHEDULED/STAGED stagings at that store (adjacency, existing.expires_at == new.stage_start, is not an overlap)", error_id: ERR_WILL_CALL_CAPACITY_FULL, http_status: 409, applies_to: "POST /pro/will-call-stagings" }
  - { priority: 25, category: business_constraint, check: "delivery_mode must match the scheduling channel: WILL_CALL orders cannot take delivery appointments and DELIVERY orders cannot take will-call stagings", error_id: ERR_DELIVERY_MODE_MISMATCH, http_status: 422, applies_to: "POST /pro/will-call-stagings, POST /pro/delivery-appointments" }
  - { priority: 26, category: business_referential, check: "the order has at least one OrderLine when submitting or previewing", error_id: ERR_NO_ORDER_LINES, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit, GET /pro/pro-orders/{pro_order_id}/pricing-preview" }
  - { priority: 27, category: business_referential, check: "the sku exists in StoreStock at the relevant store (fulfillment store for order lines, originating store for quote lines)", error_id: ERR_SKU_NOT_STOCKED, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/lines, POST /pro/job-quotes/{job_quote_id}/lines, POST /pro/job-quotes/{job_quote_id}/submit" }
  - { priority: 28, category: business_referential, check: "a quote has at least one QuoteLine before submission", error_id: ERR_NO_QUOTE_LINES, http_status: 422, applies_to: "POST /pro/job-quotes/{job_quote_id}/submit" }
  - { priority: 29, category: business_referential, check: "order.job_quote_id belongs to the same pro_account_id as the order", error_id: ERR_QUOTE_ACCOUNT_MISMATCH, http_status: 422, applies_to: "POST /pro/pro-orders" }
  - { priority: 30, category: business_referential, check: "order.job_quote_id references a quote in status ACCEPTED at submission", error_id: ERR_QUOTE_NOT_ACCEPTED, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 31, category: business_referential, check: "po_number is present and non-empty when ProAccount.po_required is true", error_id: ERR_PO_NUMBER_REQUIRED, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 32, category: business_referential, check: "job_name is present and non-empty when ProAccount.job_name_required is true", error_id: ERR_JOB_NAME_REQUIRED, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 33, category: business_referential, check: "resale_purchase implies the fulfillment store's state_code is in ProAccount.tax_exempt_state_codes", error_id: ERR_NO_VALID_TAX_CERTIFICATE, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 34, category: business_temporal, check: "an order bound to a quote may only be submitted while quote.term_start <= clock <= quote.term_end", error_id: ERR_QUOTE_TERM_EXPIRED, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 35, category: business_temporal, check: "a quote may only be expired once the clock is past term_end", error_id: ERR_QUOTE_TERM_ACTIVE, http_status: 409, applies_to: "POST /pro/job-quotes/{job_quote_id}/expire" }
  - { priority: 36, category: business_temporal, check: "the certificate expires_on is strictly after the current logical clock date", error_id: ERR_CERTIFICATE_STATE_MISMATCH, http_status: 422, applies_to: "POST /pro/tax-exempt-certificates/{tax_exempt_certificate_id}/verify" }
  - { priority: 37, category: business_constraint, check: "round_count < MAX_QUOTE_ROUNDS (3) before a further counter-offer or revision", error_id: ERR_QUOTE_ROUND_LIMIT, http_status: 409, applies_to: "POST /pro/job-quotes/{job_quote_id}/counter-offers, POST /pro/job-quotes/{job_quote_id}/revise" }
  - { priority: 38, category: business_constraint, check: "line_prices names every QuoteLine of the quote (no partial rounds)", error_id: ERR_INCOMPLETE_COUNTER_OFFER, http_status: 422, applies_to: "POST /pro/job-quotes/{job_quote_id}/counter-offers" }
  - { priority: 39, category: business_constraint, check: "every negotiated_unit_price_cents is in [1, QuoteLine.list_unit_price_cents]", error_id: ERR_INVALID_NEGOTIATED_PRICE, http_status: 422, applies_to: "POST /pro/job-quotes/{job_quote_id}/counter-offers" }
  - { priority: 40, category: business_constraint, check: "the approving CreditManager's X-User-ID differs from JobQuote.authored_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /pro/job-quotes/{job_quote_id}/approve" }
  - { priority: 41, category: business_constraint, check: "JobQuote.discount_depth_pct <= MAX_APPROVABLE_DISCOUNT_DEPTH_PCT (0.30)", error_id: ERR_DISCOUNT_DEPTH_EXCEEDED, http_status: 422, applies_to: "POST /pro/job-quotes/{job_quote_id}/approve" }
  - { priority: 42, category: business_constraint, check: "the sourcing candidate set is non-empty for every line (some store in the region has available_units > 0 for the sku)", error_id: ERR_NO_SOURCING_CANDIDATES, http_status: 409, applies_to: "POST /pro/pro-orders/{pro_order_id}/reserve" }
  - { priority: 43, category: business_constraint, check: "the sourcing waterfall covers every line in full", error_id: ERR_INSUFFICIENT_JOB_LOT, http_status: 409, applies_to: "POST /pro/pro-orders/{pro_order_id}/reserve" }
  - { priority: 44, category: business_constraint, check: "job_lot_required orders resolve to exactly one sourcing store", error_id: ERR_JOB_LOT_SPLIT_NOT_ALLOWED, http_status: 409, applies_to: "POST /pro/pro-orders/{pro_order_id}/reserve" }
  - { priority: 45, category: business_temporal, check: "floor((clock - ProOrder.fulfilled_at)/86400) <= RETURN_WINDOW_DAYS (90)", error_id: ERR_RETURN_WINDOW_CLOSED, http_status: 422, applies_to: "POST /pro/return-requests/{return_request_id}/approve" }
  - { priority: 46, category: business_constraint, check: "each requested return qty_units <= OrderLine.fulfilled_units - OrderLine.returned_units", error_id: ERR_RETURN_QTY_EXCEEDS_FULFILLED, http_status: 422, applies_to: "POST /pro/return-requests" }
  - { priority: 47, category: business_fiscal, check: "order.total_cents <= CreditLine.available_cents for CREDIT_LINE orders (inclusive: landing exactly on the limit is allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /pro/pro-orders/{pro_order_id}/submit" }
  - { priority: 48, category: business_fiscal, check: "payment amount_cents equals total_cents - credited_refund_cents", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /pro/pro-orders/{pro_order_id}/pay" }
  - { priority: 49, category: business_fiscal, check: "RebateAccrual.payable_cents > 0 at payout", error_id: ERR_NO_REBATE_PAYABLE, http_status: 422, applies_to: "POST /pro/rebate-accruals/{rebate_accrual_id}/pay-out" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Stores, stock, trucks, clock (configuration surface) ----
  - method: POST
    path: "/pro/stores"
    description: "Register a store with its sourcing rank, will-call bay capacity, tax rate and staging cap"
    roles: [PlatformAdmin]
    code: 201
    input: [store_code, region_code, state_code, distance_rank, will_call_bay_slots, lift_gate_available, tax_rate_pct, "max_stage_hours?"]
    output: Store
    side_effects: []
  - method: GET
    path: "/pro/stores/{store_id}"
    description: "Read one store"
    roles: [PlatformAdmin, StoreOperations, ProDeskAssociate, CreditManager, ContractorAdmin]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/pro/stores"
    description: "List stores, optionally filtered by sourcing region"
    roles: [PlatformAdmin, StoreOperations, ProDeskAssociate, CreditManager, ContractorAdmin]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: POST
    path: "/pro/store-stocks"
    description: "Seed or extend a store's stock position for a SKU"
    roles: [PlatformAdmin]
    code: 201
    input: [store_id, sku, on_hand_units, list_unit_price_cents]
    output: StoreStock
    side_effects: ["initializes reserved_units to 0 and available_units to on_hand_units"]
  - method: GET
    path: "/pro/store-stocks/{store_stock_id}"
    description: "Read one stock position (reserved_units / available_units reflect live reservations)"
    roles: [PlatformAdmin, StoreOperations, ProDeskAssociate]
    code: 200
    input: []
    output: StoreStock
    side_effects: []
  - method: GET
    path: "/pro/store-stocks"
    description: "List stock positions, filterable by store and SKU (FK reverse-reachability for StoreStock.store_id)"
    roles: [PlatformAdmin, StoreOperations, ProDeskAssociate]
    code: 200
    input: ["store_id?", "sku?", "limit?", "offset?"]
    output: StoreStock[]
    side_effects: []
  - method: POST
    path: "/pro/delivery-trucks"
    description: "Register a delivery truck with its lift-gate equipment, turnaround buffer and supported jobsite access types"
    roles: [StoreOperations]
    code: 201
    input: [store_id, truck_code, lift_gate_equipped, access_types_supported, "turnaround_buffer_minutes?"]
    output: DeliveryTruck
    side_effects: ["status starts at AVAILABLE"]
  - method: GET
    path: "/pro/delivery-trucks/{delivery_truck_id}"
    description: "Read one truck"
    roles: [StoreOperations, ProDeskAssociate]
    code: 200
    input: []
    output: DeliveryTruck
    side_effects: []
  - method: GET
    path: "/pro/delivery-trucks"
    description: "List trucks, filterable by store and status (FK reverse-reachability for DeliveryTruck.store_id)"
    roles: [StoreOperations, ProDeskAssociate]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: DeliveryTruck[]
    side_effects: []
  - method: POST
    path: "/pro/delivery-trucks/{delivery_truck_id}/out-of-service"
    description: "Take a truck out of service (mechanical hold); its existing appointments keep occupying their windows"
    roles: [StoreOperations]
    code: 200
    input: [reason_code]
    output: DeliveryTruck
    side_effects: ["sets status to OUT_OF_SERVICE", "increments DeliveryTruck.version by 1"]
  - method: POST
    path: "/pro/_clock/set_current_utc"
    description: |
      Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical
      clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it MUST NOT fall back to real
      wall-clock time. Every quote term, staging window, trailing-volume window and return-window rule is
      evaluated against this clock.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock only; no entity is mutated and no sweep runs implicitly"]

  # ---- Pro accounts and credit ----
  - method: POST
    path: "/pro/pro-accounts"
    description: "Open a contractor pro account, pinning its PO / job-name coding requirements and tier review mode"
    roles: [PlatformAdmin]
    code: 201
    input: [business_name, home_store_id, "po_required?", "job_name_required?", "tier_review_mode?", "baseline_volume_cents?"]
    output: ProAccount
    side_effects: ["runs account_tier_determination and writes trailing_volume_cents, tier_code, tier_discount_pct, tier_reviewed_at", "status starts at ACTIVE"]
  - method: GET
    path: "/pro/pro-accounts/{pro_account_id}"
    description: "Read one pro account including tier, trailing volume, exemption states and rebate balance"
    roles: [PlatformAdmin, CreditManager, ProDeskAssociate, ContractorAdmin, StoreOperations, TaxComplianceOfficer]
    code: 200
    input: []
    output: ProAccount
    side_effects: []
  - method: GET
    path: "/pro/pro-accounts"
    description: "List pro accounts, filterable by home store, tier and status (FK reverse-reachability for ProAccount.home_store_id)"
    roles: [PlatformAdmin, CreditManager, ProDeskAssociate]
    code: 200
    input: ["home_store_id?", "tier_code?", "status?", "limit?", "offset?"]
    output: ProAccount[]
    side_effects: []
  - method: POST
    path: "/pro/pro-accounts/{pro_account_id}/volume-adjustments"
    description: "Book a trailing-volume correction (legacy migration, goodwill credit); real pro-desk back-office operation"
    roles: [CreditManager]
    code: 200
    input: [delta_cents, memo]
    output: ProAccount
    side_effects:
      - "adds delta_cents to baseline_volume_cents"
      - "tier review event: recomputes trailing_volume_cents, tier_code, tier_discount_pct and stamps tier_reviewed_at"
      - "increments ProAccount.version by 1"
  - method: POST
    path: "/pro/pro-accounts/{pro_account_id}/reinstate"
    description: "Lift a credit hold on the account once its credit line is active again"
    roles: [CreditManager]
    code: 200
    input: []
    output: ProAccount
    side_effects: ["sets status HOLD -> ACTIVE", "increments ProAccount.version by 1"]
  - method: POST
    path: "/pro/credit-lines"
    description: "Open the commercial credit line for an account"
    roles: [CreditManager]
    code: 201
    input: [pro_account_id, limit_cents, terms_days]
    output: CreditLine
    side_effects: ["exposure_cents starts at 0 and available_cents at limit_cents", "status starts at ACTIVE"]
  - method: GET
    path: "/pro/credit-lines/{credit_line_id}"
    description: "Read one credit line with live exposure and availability"
    roles: [CreditManager, ProDeskAssociate, ContractorAdmin]
    code: 200
    input: []
    output: CreditLine
    side_effects: []
  - method: GET
    path: "/pro/credit-lines"
    description: "List credit lines, filterable by account and status (FK reverse-reachability for CreditLine.pro_account_id)"
    roles: [CreditManager, ProDeskAssociate, ContractorAdmin]
    code: 200
    input: ["pro_account_id?", "status?", "limit?", "offset?"]
    output: CreditLine[]
    side_effects: []
  - method: POST
    path: "/pro/credit-lines/{credit_line_id}/freeze"
    description: "Freeze a credit line manually"
    roles: [CreditManager]
    code: 200
    input: [reason_code]
    output: CreditLine
    side_effects: ["sets status ACTIVE -> FROZEN with frozen_reason_code = MANUAL", "cascades ProAccount.status ACTIVE -> HOLD", "increments CreditLine.version by 1"]
  - method: POST
    path: "/pro/credit-lines/{credit_line_id}/reinstate"
    description: "Return a frozen credit line to ACTIVE once utilization is back under the freeze threshold"
    roles: [CreditManager]
    code: 200
    input: []
    output: CreditLine
    side_effects: ["sets status FROZEN -> ACTIVE and clears frozen_reason_code", "increments CreditLine.version by 1"]
  - method: POST
    path: "/pro/tax-exempt-certificates"
    description: "File a resale exemption certificate for a state; a newer certificate supersedes the prior verified one (OCC on the account's version)"
    roles: [ContractorAdmin]
    code: 201
    input: [pro_account_id, state_code, certificate_number, expires_on, expected_pro_account_version]
    output: TaxExemptCertificate
    side_effects: ["status starts at PENDING", "increments ProAccount.version by 1"]
  - method: GET
    path: "/pro/tax-exempt-certificates/{tax_exempt_certificate_id}"
    description: "Read one certificate"
    roles: [ContractorAdmin, TaxComplianceOfficer, ProDeskAssociate]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: []
  - method: GET
    path: "/pro/tax-exempt-certificates"
    description: "List certificates, filterable by account, state and status (FK reverse-reachability for TaxExemptCertificate.pro_account_id)"
    roles: [ContractorAdmin, TaxComplianceOfficer, ProDeskAssociate]
    code: 200
    input: ["pro_account_id?", "state_code?", "status?", "limit?", "offset?"]
    output: TaxExemptCertificate[]
    side_effects: []
  - method: POST
    path: "/pro/tax-exempt-certificates/{tax_exempt_certificate_id}/verify"
    description: "Verify a filed certificate, superseding any prior verified certificate for the same state"
    roles: [TaxComplianceOfficer]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: ["sets status PENDING -> VERIFIED and verified_at", "supersedes the prior VERIFIED certificate of the same (account, state)", "recomputes ProAccount.tax_exempt_state_codes", "increments TaxExemptCertificate.version by 1"]
  - method: POST
    path: "/pro/tax-exempt-certificates/{tax_exempt_certificate_id}/revoke"
    description: "Revoke a verified certificate"
    roles: [TaxComplianceOfficer]
    code: 200
    input: [reason_code]
    output: TaxExemptCertificate
    side_effects: ["sets status VERIFIED -> REVOKED and revoke_reason_code", "recomputes ProAccount.tax_exempt_state_codes", "increments TaxExemptCertificate.version by 1"]

  # ---- Bulk quotes and negotiated job pricing ----
  - method: POST
    path: "/pro/job-quotes"
    description: "Open a bulk quote request for a job"
    roles: [ContractorAdmin]
    code: 201
    input: [pro_account_id, originating_store_id, job_name, requested_term_days]
    output: JobQuote
    side_effects: ["status starts at DRAFT with round_count 0 and revision_count 0"]
  - method: GET
    path: "/pro/job-quotes/{job_quote_id}"
    description: "Read one quote including negotiated totals, discount depth, term window and negotiation counters"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: []
    output: JobQuote
    side_effects: []
  - method: GET
    path: "/pro/job-quotes"
    description: "List quotes, filterable by account, originating store and status (FK reverse-reachability for JobQuote.pro_account_id and originating_store_id)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: ["pro_account_id?", "originating_store_id?", "status?", "limit?", "offset?"]
    output: JobQuote[]
    side_effects: []
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/lines"
    description: "Add a line to a DRAFT quote"
    roles: [ContractorAdmin]
    code: 201
    input: [sku, qty_units]
    output: QuoteLine
    side_effects: ["list prices stay null until the quote is submitted"]
  - method: GET
    path: "/pro/job-quotes/{job_quote_id}/lines"
    description: "List a quote's lines with snapshotted list prices and negotiated prices (FK reverse-reachability for QuoteLine.job_quote_id)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: ["limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: GET
    path: "/pro/quote-lines/{quote_line_id}"
    description: "Read one quote line directly (the id a counter-offer's line_prices[] entries must name)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: []
    output: QuoteLine
    side_effects: []
  - method: GET
    path: "/pro/quote-lines"
    description: "List quote lines, filterable by quote (FK reverse-reachability for QuoteLine.job_quote_id)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: ["job_quote_id?", "sku?", "limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/submit"
    description: "Submit the quote to the pro desk; snapshots list prices from the originating store"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobQuote
    side_effects: ["snapshots QuoteLine list prices and line_list_subtotal_cents", "writes JobQuote.list_subtotal_cents", "increments JobQuote.version by 1"]
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/counter-offers"
    description: "Pro desk writes a negotiated price round (OCC on the quote's version); supersedes the previous round's prices"
    roles: [ProDeskAssociate]
    code: 200
    input: [line_prices, term_days, expected_job_quote_version]
    output: JobQuote
    side_effects:
      - "writes negotiated unit prices and line subtotals on the named quote lines"
      - "recomputes negotiated_total_cents and discount_depth_pct; round_count += 1"
      - "records authored_by_user_id from X-User-ID"
      - "increments JobQuote.version by 1"
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/revise"
    description: "Contractor bounces a countered quote back for another negotiation round (cycle edge)"
    roles: [ContractorAdmin]
    code: 200
    input: [revision_note]
    output: JobQuote
    side_effects: ["sets status COUNTERED -> SUBMITTED and revision_count += 1", "increments JobQuote.version by 1"]
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/approve"
    description: "Credit manager approves the negotiated round (segregation of duties against the authoring associate)"
    roles: [CreditManager]
    code: 200
    input: []
    output: JobQuote
    side_effects: ["sets status COUNTERED -> APPROVED and approved_by_user_id", "increments JobQuote.version by 1"]
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/accept"
    description: "Contractor accepts the approved quote, starting its price-protection term"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobQuote
    side_effects: ["sets term_days, term_start and term_end", "sets status APPROVED -> ACCEPTED", "increments JobQuote.version by 1"]
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/withdraw"
    description: "Withdraw a quote that has not been accepted"
    roles: [ContractorAdmin]
    code: 200
    input: [reason_code]
    output: JobQuote
    side_effects: ["sets status -> WITHDRAWN and withdrawn_reason_code", "increments JobQuote.version by 1"]
  - method: POST
    path: "/pro/job-quotes/{job_quote_id}/expire"
    description: "Retire an accepted quote whose term has run out"
    roles: [ProDeskAssociate]
    code: 200
    input: []
    output: JobQuote
    side_effects: ["sets status ACCEPTED -> EXPIRED", "increments JobQuote.version by 1"]

  # ---- Orders, pricing, sourcing, credit lifecycle ----
  - method: POST
    path: "/pro/pro-orders"
    description: "Open a draft pro order, optionally bound to an accepted job quote"
    roles: [ContractorAdmin]
    code: 201
    input: [pro_account_id, fulfillment_store_id, payment_method, delivery_mode, "job_quote_id?", "po_number?", "job_name?", "lift_gate_required?", "job_lot_required?", "resale_purchase?"]
    output: ProOrder
    side_effects: ["fulfillment_status starts at DRAFT and credit_status at UNBILLED; money fields stay null until submission"]
  - method: GET
    path: "/pro/pro-orders/{pro_order_id}"
    description: "Read one order with both state dimensions and all priced money fields"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager, StoreOperations]
    code: 200
    input: []
    output: ProOrder
    side_effects: []
  - method: GET
    path: "/pro/pro-orders"
    description: "List orders, filterable by account, quote, store and either state dimension (FK reverse-reachability for ProOrder.pro_account_id, job_quote_id, fulfillment_store_id)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager, StoreOperations]
    code: 200
    input: ["pro_account_id?", "job_quote_id?", "fulfillment_store_id?", "fulfillment_status?", "credit_status?", "limit?", "offset?"]
    output: ProOrder[]
    side_effects: []
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/lines"
    description: "Add a line to a DRAFT order"
    roles: [ContractorAdmin]
    code: 201
    input: [sku, qty_units]
    output: OrderLine
    side_effects: ["price fields stay null until the order is submitted or previewed"]
  - method: GET
    path: "/pro/pro-orders/{pro_order_id}/lines"
    description: "List an order's lines with price source, effective unit price and fulfilled/returned counters (FK reverse-reachability for OrderLine.pro_order_id)"
    roles: [ContractorAdmin, ProDeskAssociate, StoreOperations]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/pro/order-lines/{order_line_id}"
    description: "Read one order line directly (the id a return request's lines[] entries must name)"
    roles: [ContractorAdmin, ProDeskAssociate, StoreOperations, CreditManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/pro/order-lines"
    description: "List order lines, filterable by order and SKU (FK reverse-reachability for OrderLine.pro_order_id)"
    roles: [ContractorAdmin, ProDeskAssociate, StoreOperations, CreditManager]
    code: 200
    input: ["pro_order_id?", "sku?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/pro/pro-orders/{pro_order_id}/pricing-preview"
    description: "Computed read: run order_line_pricing + order_total_assembly against the current clock and tier without persisting anything"
    roles: [ContractorAdmin, ProDeskAssociate]
    code: 200
    input: []
    output: "{ tier_code_applied: string, list_subtotal_cents: integer, subtotal_cents: integer, discount_cents: integer, freight_surcharge_cents: integer, lift_gate_fee_cents: integer, tax_exempt_applied: boolean, tax_cents: integer, total_cents: integer }"
    side_effects: []
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/submit"
    description: "Price and submit the order: authorizes it against the credit line and freezes the money fields"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: ProOrder
    side_effects:
      - "runs order_line_pricing and order_total_assembly, writing tier_code_applied and every money field"
      - "sets fulfillment_status DRAFT -> SUBMITTED and credit_status UNBILLED -> AUTHORIZED"
      - "recomputes CreditLine.exposure_cents and available_cents"
      - "increments ProOrder.version by 1"
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/reserve"
    description: "Run the multi-store sourcing waterfall and hold job-lot units"
    roles: [ProDeskAssociate]
    code: 201
    input: []
    output: Reservation[]
    side_effects:
      - "creates the planned Reservations in status HELD (atomic: none is persisted on failure)"
      - "recomputes StoreStock.reserved_units and available_units at every sourcing store"
      - "sets fulfillment_status SUBMITTED -> RESERVED"
      - "increments ProOrder.version by 1"
  - method: GET
    path: "/pro/reservations/{reservation_id}"
    description: "Read one reservation"
    roles: [StoreOperations, ProDeskAssociate, ContractorAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/pro/reservations"
    description: "List reservations, filterable by order, line, store and status (FK reverse-reachability for Reservation.pro_order_id, order_line_id, store_id)"
    roles: [StoreOperations, ProDeskAssociate, ContractorAdmin]
    code: 200
    input: ["pro_order_id?", "order_line_id?", "store_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/pro/reservations/{reservation_id}/allocate"
    description: "Pick and allocate held units so the order can be staged"
    roles: [StoreOperations]
    code: 200
    input: []
    output: Reservation
    side_effects: ["sets status HELD -> ALLOCATED (occupied units unchanged)", "increments Reservation.version by 1"]
  - method: POST
    path: "/pro/reservations/{reservation_id}/release"
    description: "Release held or allocated units back to the shelf"
    roles: [StoreOperations]
    code: 200
    input: [reason_code]
    output: Reservation
    side_effects:
      - "sets status -> RELEASED with released_reason_code"
      - "recomputes StoreStock.reserved_units and available_units at store_id"
      - "when the order has no non-released reservation left, drives ProOrder.fulfillment_status back to SUBMITTED"
      - "increments Reservation.version by 1"
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/cancel"
    description: "Cancel an order: releases reservations, voids the credit authorization and drops staging/appointments"
    roles: [ContractorAdmin]
    code: 200
    input: [reason_code]
    output: ProOrder
    side_effects:
      - "sets fulfillment_status -> CANCELLED and cancel_reason_code"
      - "releases every non-terminal Reservation (released_reason_code = ORDER_CANCELLED) and recomputes StoreStock.reserved_units / available_units"
      - "sets credit_status AUTHORIZED -> VOIDED and recomputes CreditLine.exposure_cents / available_cents"
      - "expires SCHEDULED/STAGED will-call stagings and cancels SCHEDULED/CONFIRMED delivery appointments of the order"
      - "increments ProOrder.version by 1"
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/invoice"
    description: "Invoice a fulfilled order against the credit line; runs the credit-utilization review, the tier review and the rebate accrual"
    roles: [CreditManager]
    code: 200
    input: []
    output: ProOrder
    side_effects:
      - "sets credit_status AUTHORIZED -> INVOICED and invoiced_at"
      - "recomputes CreditLine.exposure_cents / available_cents, then runs the utilization review which may freeze the credit line and put the account on HOLD"
      - "tier review event: recomputes ProAccount.trailing_volume_cents, tier_code, tier_discount_pct, tier_reviewed_at"
      - "books the rebate accrual delta, creating the ACCRUING RebateAccrual if the account has none"
      - "increments ProOrder.version by 1"
  - method: POST
    path: "/pro/pro-orders/{pro_order_id}/pay"
    description: "Settle an invoiced order, taking it out of the exposure base"
    roles: [CreditManager]
    code: 200
    input: [amount_cents]
    output: ProOrder
    side_effects: ["sets credit_status INVOICED -> PAID", "recomputes CreditLine.exposure_cents / available_cents", "increments ProOrder.version by 1"]

  # ---- Will-call staging and delivery scheduling ----
  - method: POST
    path: "/pro/will-call-stagings"
    description: "Book a will-call bay window for a reserved order"
    roles: [StoreOperations]
    code: 201
    input: [pro_order_id, store_id, stage_start, stage_hours]
    output: WillCallStaging
    side_effects: ["computes expires_at = stage_start + stage_hours hours", "status starts at SCHEDULED"]
  - method: GET
    path: "/pro/will-call-stagings/{will_call_staging_id}"
    description: "Read one staging record"
    roles: [StoreOperations, ContractorAdmin]
    code: 200
    input: []
    output: WillCallStaging
    side_effects: []
  - method: GET
    path: "/pro/will-call-stagings"
    description: "List stagings, filterable by order, store and status (FK reverse-reachability for WillCallStaging.pro_order_id, store_id)"
    roles: [StoreOperations, ContractorAdmin]
    code: 200
    input: ["pro_order_id?", "store_id?", "status?", "limit?", "offset?"]
    output: WillCallStaging[]
    side_effects: []
  - method: POST
    path: "/pro/will-call-stagings/{will_call_staging_id}/stage"
    description: "Mark the material physically staged in the bay"
    roles: [StoreOperations]
    code: 200
    input: []
    output: WillCallStaging
    side_effects: ["sets status SCHEDULED -> STAGED", "drives ProOrder.fulfillment_status RESERVED -> STAGED", "increments WillCallStaging.version by 1"]
  - method: POST
    path: "/pro/will-call-stagings/{will_call_staging_id}/pick-up"
    description: "Hand the staged material to the contractor's crew"
    roles: [StoreOperations]
    code: 200
    input: [picked_up_by]
    output: WillCallStaging
    side_effects:
      - "sets status STAGED -> PICKED_UP with picked_up_by / picked_up_at"
      - "consumes the order's reservations, decrements StoreStock.on_hand_units and sets OrderLine.fulfilled_units"
      - "drives ProOrder.fulfillment_status STAGED -> FULFILLED and sets fulfilled_at"
      - "increments WillCallStaging.version by 1"
  - method: POST
    path: "/pro/stores/{store_id}/will-call-sweep"
    description: "Ops run: expire every staging at this store whose expires_at has passed, cascading reservation releases and order reverts"
    roles: [StoreOperations]
    code: 200
    input: []
    output: "{ expired_staging_count: integer, released_reservation_count: integer, reverted_order_count: integer }"
    side_effects:
      - "sets each due WillCallStaging SCHEDULED|STAGED -> EXPIRED"
      - "cascade: releases each affected order's HELD/ALLOCATED reservations with released_reason_code = STAGING_EXPIRED"
      - "cascade: recomputes StoreStock.reserved_units / available_units at each store that lost a reservation"
      - "cascade: reverts each affected ProOrder.fulfillment_status RESERVED|STAGED -> SUBMITTED"
  - method: POST
    path: "/pro/delivery-appointments"
    description: "Schedule a jobsite delivery on a specific truck with lift-gate and access requirements"
    roles: [StoreOperations]
    code: 201
    input: [pro_order_id, delivery_truck_id, window_start, window_end, jobsite_access_type]
    output: DeliveryAppointment
    side_effects: ["status starts at SCHEDULED and the truck window (inflated by turnaround_buffer_minutes on both sides) becomes occupied"]
  - method: GET
    path: "/pro/delivery-appointments/{delivery_appointment_id}"
    description: "Read one appointment"
    roles: [StoreOperations, ContractorAdmin]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []
  - method: GET
    path: "/pro/delivery-appointments"
    description: "List appointments, filterable by order, truck and status (FK reverse-reachability for DeliveryAppointment.pro_order_id, delivery_truck_id)"
    roles: [StoreOperations, ContractorAdmin]
    code: 200
    input: ["pro_order_id?", "delivery_truck_id?", "status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []
  - method: POST
    path: "/pro/delivery-appointments/{delivery_appointment_id}/confirm"
    description: "Confirm the appointment with dispatch"
    roles: [StoreOperations]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["sets status SCHEDULED -> CONFIRMED", "increments DeliveryAppointment.version by 1"]
  - method: POST
    path: "/pro/delivery-appointments/{delivery_appointment_id}/complete"
    description: "Record the delivery as made; fulfills the order"
    roles: [StoreOperations]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects:
      - "sets status CONFIRMED -> DELIVERED and delivered_at"
      - "consumes the order's reservations, decrements StoreStock.on_hand_units and sets OrderLine.fulfilled_units"
      - "drives ProOrder.fulfillment_status RESERVED -> FULFILLED and sets fulfilled_at"
      - "increments DeliveryAppointment.version by 1"
  - method: POST
    path: "/pro/delivery-appointments/{delivery_appointment_id}/cancel"
    description: "Cancel an appointment and free the truck window"
    roles: [StoreOperations]
    code: 200
    input: [reason_code]
    output: DeliveryAppointment
    side_effects: ["sets status -> CANCELLED with cancel_reason_code", "frees the truck window", "increments DeliveryAppointment.version by 1"]

  # ---- Volume rebates ----
  - method: GET
    path: "/pro/rebate-accruals/{rebate_accrual_id}"
    description: "Read one rebate accrual period"
    roles: [CreditManager, ContractorAdmin]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: []
  - method: GET
    path: "/pro/rebate-accruals"
    description: "List rebate accruals, filterable by account and payout status (FK reverse-reachability for RebateAccrual.pro_account_id; the only discovery channel for accruals created by the invoice cascade)"
    roles: [CreditManager, ContractorAdmin]
    code: 200
    input: ["pro_account_id?", "payout_status?", "limit?", "offset?"]
    output: RebateAccrual[]
    side_effects: []
  - method: POST
    path: "/pro/rebate-accruals/{rebate_accrual_id}/close"
    description: "Close the accrual period, freezing the payable amount"
    roles: [CreditManager]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: ["sets payout_status ACCRUING -> PAYABLE when payable_cents > 0, otherwise ACCRUING -> VOIDED", "sets closed_at", "increments RebateAccrual.version by 1"]
  - method: POST
    path: "/pro/rebate-accruals/{rebate_accrual_id}/pay-out"
    description: "Pay a closed rebate period out to the contractor"
    roles: [CreditManager]
    code: 200
    input: [payout_reference]
    output: RebateAccrual
    side_effects: ["sets payout_status PAYABLE -> PAID with paid_amount_cents and payout_reference", "recomputes ProAccount.rebate_accrued_cents", "increments RebateAccrual.version by 1"]

  # ---- Returns on job-quoted material ----
  - method: POST
    path: "/pro/return-requests"
    description: "Request a return against a fulfilled order"
    roles: [ContractorAdmin]
    code: 201
    input: [pro_order_id, reason_code, lines]
    output: ReturnRequest
    side_effects: ["status starts at REQUESTED; refund figures stay null until approval"]
  - method: GET
    path: "/pro/return-requests/{return_request_id}"
    description: "Read one return request with its pinned valuation mode and refund breakdown"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/pro/return-requests"
    description: "List return requests, filterable by order and status (FK reverse-reachability for ReturnRequest.pro_order_id)"
    roles: [ContractorAdmin, ProDeskAssociate, CreditManager]
    code: 200
    input: ["pro_order_id?", "status?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []
  - method: POST
    path: "/pro/return-requests/{return_request_id}/approve"
    description: "Approve the return, pinning the valuation mode and computing the restocking fee and refund"
    roles: [ProDeskAssociate]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["runs return_refund_valuation and writes valuation_mode, gross_refund_cents, restocking_fee_pct, restocking_fee_cents, tax_refund_cents, refund_total_cents", "sets approved_by_user_id", "increments ReturnRequest.version by 1"]
  - method: POST
    path: "/pro/return-requests/{return_request_id}/deny"
    description: "Deny the return request"
    roles: [ProDeskAssociate]
    code: 200
    input: [reason_code]
    output: ReturnRequest
    side_effects: ["sets status REQUESTED -> DENIED with denied_reason_code", "increments ReturnRequest.version by 1"]
  - method: POST
    path: "/pro/return-requests/{return_request_id}/credit"
    description: "Book the approved refund against the credit line, netting trailing volume and clawing back rebate"
    roles: [CreditManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "sets status APPROVED -> CREDITED and credited_at; adds the returned units to OrderLine.returned_units"
      - "recomputes ProOrder.credited_refund_cents, credited_gross_refund_cents and net_volume_cents"
      - "recomputes CreditLine.exposure_cents and available_cents"
      - "tier review event: recomputes ProAccount.trailing_volume_cents, tier_code, tier_discount_pct, tier_reviewed_at"
      - "books the rebate clawback delta on the account's newest ACCRUING or PAYABLE accrual and recomputes ProAccount.rebate_accrued_cents"
      - "increments ReturnRequest.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not listed in the target endpoint's roles" }
  - { id: ERR_ACCOUNT_SCOPE_VIOLATION, http: 403, condition: "a ContractorAdmin acts on a quote, order, certificate, credit line, return or staging that belongs to a different pro_account_id than its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the CreditManager approving a job quote has the same X-User-ID as JobQuote.authored_by_user_id" }

  # --- not found ---
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store_id (path or body, incl. home_store_id / originating_store_id / fulfillment_store_id) does not resolve" }
  - { id: ERR_STORE_STOCK_NOT_FOUND, http: 404, condition: "store_stock_id does not resolve" }
  - { id: ERR_DELIVERY_TRUCK_NOT_FOUND, http: 404, condition: "delivery_truck_id does not resolve" }
  - { id: ERR_PRO_ACCOUNT_NOT_FOUND, http: 404, condition: "pro_account_id does not resolve" }
  - { id: ERR_CREDIT_LINE_NOT_FOUND, http: 404, condition: "credit_line_id does not resolve, or a CREDIT_LINE order's account has no credit line at submission" }
  - { id: ERR_TAX_EXEMPT_CERTIFICATE_NOT_FOUND, http: 404, condition: "tax_exempt_certificate_id does not resolve" }
  - { id: ERR_JOB_QUOTE_NOT_FOUND, http: 404, condition: "job_quote_id does not resolve" }
  - { id: ERR_QUOTE_LINE_NOT_FOUND, http: 404, condition: "a line_prices[] entry names a quote_line_id that is not a line of this quote" }
  - { id: ERR_PRO_ORDER_NOT_FOUND, http: 404, condition: "pro_order_id does not resolve" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "a return lines[] entry names an order_line_id that is not a line of this order" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation_id does not resolve" }
  - { id: ERR_WILL_CALL_STAGING_NOT_FOUND, http: 404, condition: "will_call_staging_id does not resolve" }
  - { id: ERR_DELIVERY_APPOINTMENT_NOT_FOUND, http: 404, condition: "delivery_appointment_id does not resolve" }
  - { id: ERR_REBATE_ACCRUAL_NOT_FOUND, http: 404, condition: "rebate_accrual_id does not resolve" }
  - { id: ERR_RETURN_REQUEST_NOT_FOUND, http: 404, condition: "return_request_id does not resolve" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, enum out of range, non-positive qty_units / stage_hours / limit_cents, unparseable ISO-8601 value, empty lines[] or line_prices[], or pagination limit outside [1, 100]" }

  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_job_quote_version != JobQuote.version on a counter-offer, or expected_pro_account_version != ProAccount.version on a certificate filing" }

  # --- uniqueness ---
  - { id: ERR_DUPLICATE_STORE_STOCK, http: 409, condition: "a StoreStock row already exists for (store_id, sku)" }
  - { id: ERR_CREDIT_LINE_EXISTS, http: 409, condition: "the pro account already has a credit line" }

  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "the requested transition is not declared from the target's current state (generic §1.2 guard, incl. repeating a trigger already applied and any trigger from a terminal state)" }
  - { id: ERR_ACCOUNT_ON_HOLD, http: 409, condition: "ProAccount.status is HOLD when submitting/revising/approving/accepting a quote or submitting an order" }
  - { id: ERR_CREDIT_LINE_FROZEN, http: 409, condition: "CreditLine.status is FROZEN when submitting a CREDIT_LINE order, or the account's credit line is still FROZEN at account reinstatement" }
  - { id: ERR_CREDIT_LINE_NOT_FROZEN, http: 409, condition: "reinstating a credit line that is already ACTIVE" }
  - { id: ERR_UTILIZATION_STILL_HIGH, http: 409, condition: "reinstating a frozen credit line whose exposure_cents / limit_cents is still at or above FREEZE_UTILIZATION_PCT" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "invoicing or returning against an order whose fulfillment_status is not FULFILLED" }
  - { id: ERR_ORDER_NOT_RESERVED, http: 409, condition: "scheduling a staging or appointment for an order whose fulfillment_status is not RESERVED" }
  - { id: ERR_RESERVATIONS_NOT_ALLOCATED, http: 409, condition: "staging a will-call order that still has a HELD reservation" }
  - { id: ERR_TRUCK_OUT_OF_SERVICE, http: 409, condition: "the assigned DeliveryTruck.status is OUT_OF_SERVICE" }
  - { id: ERR_QUOTE_TERM_ACTIVE, http: 409, condition: "expiring an accepted quote while the logical clock is still within [term_start, term_end]" }
  - { id: ERR_QUOTE_ROUND_LIMIT, http: 409, condition: "a counter-offer or revision would push round_count past MAX_QUOTE_ROUNDS (3)" }

  # --- safety ---
  - { id: ERR_LIFT_GATE_UNAVAILABLE, http: 422, condition: "the order requires a lift gate but the assigned truck is not lift_gate_equipped or the store has lift_gate_available false" }
  - { id: ERR_JOBSITE_ACCESS_UNSUPPORTED, http: 422, condition: "jobsite_access_type is not in the assigned truck's access_types_supported" }

  # --- temporal ---
  - { id: ERR_INVALID_DELIVERY_WINDOW, http: 422, condition: "window_end is not strictly after window_start" }
  - { id: ERR_STAGE_WINDOW_TOO_LONG, http: 422, condition: "stage_hours exceeds Store.max_stage_hours" }
  - { id: ERR_QUOTE_TERM_EXPIRED, http: 422, condition: "submitting a quote-bound order while the logical clock is outside [term_start, term_end]" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "approving a return more than RETURN_WINDOW_DAYS (90) whole days after ProOrder.fulfilled_at" }

  # --- resource contention ---
  - { id: ERR_TRUCK_WINDOW_CONFLICT, http: 409, condition: "the buffered closed window intersects another SCHEDULED or CONFIRMED appointment on the same truck" }
  - { id: ERR_WILL_CALL_CAPACITY_FULL, http: 409, condition: "the half-open bay interval overlaps will_call_bay_slots or more live stagings at that store" }

  # --- referential / configuration ---
  - { id: ERR_DELIVERY_MODE_MISMATCH, http: 422, condition: "a WILL_CALL order is given a delivery appointment or a DELIVERY order is given a will-call staging" }
  - { id: ERR_SKU_NOT_STOCKED, http: 422, condition: "the sku has no StoreStock row at the relevant store" }
  - { id: ERR_NO_QUOTE_LINES, http: 422, condition: "submitting a quote with no lines" }
  - { id: ERR_QUOTE_ACCOUNT_MISMATCH, http: 422, condition: "the referenced job quote belongs to a different pro account than the order" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 422, condition: "submitting an order bound to a quote whose status is not ACCEPTED" }
  - { id: ERR_PO_NUMBER_REQUIRED, http: 422, condition: "the account has po_required true and the order carries no non-empty po_number" }
  - { id: ERR_JOB_NAME_REQUIRED, http: 422, condition: "the account has job_name_required true and the order carries no non-empty job_name" }
  - { id: ERR_NO_VALID_TAX_CERTIFICATE, http: 422, condition: "a resale_purchase order's fulfillment store state is not in ProAccount.tax_exempt_state_codes" }
  - { id: ERR_CERTIFICATE_STATE_MISMATCH, http: 422, condition: "verifying a certificate whose expires_on is not after the logical clock" }
  - { id: ERR_NO_ORDER_LINES, http: 422, condition: "submitting or previewing an order with no lines" }
  - { id: ERR_INVALID_NEGOTIATED_PRICE, http: 422, condition: "a negotiated_unit_price_cents is below 1 or above the line's snapshotted list_unit_price_cents" }
  - { id: ERR_INCOMPLETE_COUNTER_OFFER, http: 422, condition: "a counter-offer omits one or more of the quote's lines" }
  - { id: ERR_DISCOUNT_DEPTH_EXCEEDED, http: 422, condition: "the negotiated round's discount_depth_pct exceeds MAX_APPROVABLE_DISCOUNT_DEPTH_PCT (0.30)" }
  - { id: ERR_RETURN_QTY_EXCEEDS_FULFILLED, http: 422, condition: "a requested return quantity exceeds fulfilled_units - returned_units on that order line" }

  # --- sourcing ---
  - { id: ERR_NO_SOURCING_CANDIDATES, http: 409, condition: "no store in the fulfillment store's region carries the sku with available_units > 0" }
  - { id: ERR_INSUFFICIENT_JOB_LOT, http: 409, condition: "the sourcing waterfall cannot cover a line's full quantity across all candidate stores" }
  - { id: ERR_JOB_LOT_SPLIT_NOT_ALLOWED, http: 409, condition: "a job_lot_required order can only be covered by splitting a line across two or more stores" }

  # --- fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "the order's total_cents exceeds CreditLine.available_cents at submission" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "amount_cents differs from total_cents - credited_refund_cents" }
  - { id: ERR_NO_REBATE_PAYABLE, http: 422, condition: "paying out an accrual whose payable_cents is not positive" }

