              as_user_id: "liaison-01"
              captures: { ratio_cw: $.data.adequacy_ratio, num_cw: $.data.numerator, den_cw: $.data.denominator }
          assert:
            - "num_cw == 1 and den_cw == 3 — credit hours, not headcount"
            - "ratio_cw == 0.3333 exactly (1/3 rounded half-up to four decimals)"
            - "data.basis_applied == CREDIT_HOUR_COVERAGE, data.adequacy_status == INSUFFICIENT (0.3333 < 0.60 - 0.15), data.unqualified_assignment_count == 1, data.roster_id == ${roster_cw_id}"
            - "FacultyRoster.${roster_cw_id}.adequacy_ratio_snapshot == 0.3333, credit_hours_total == 3, credit_hours_terminal_qualified == 1"
            - "Program.${prog_cw_id}.adequacy_ratio == 0.3333 and adequacy_status == INSUFFICIENT"

      - name: basis_override_recomputes_adequacy_without_persisting_it
        claim_type: variant_selection
        grounds:
          - calculations.program_faculty_adequacy.variants
          - endpoints[GET /programs/{programId}/adequacy]
          - entities.Program.fields.adequacy_basis
        distinguishing_aspect: |
          The basis_override query parameter selects the other variant for one read only: the same
          roster reports 1/3 = 0.3333 INSUFFICIENT under the program's stored
          CREDIT_HOUR_COVERAGE basis and 1/2 = 0.5000 AT_RISK under an overridden HEADCOUNT
          basis, while the persisted Program fields keep the stored-basis values.
        test_recipe:
          setup:
            - "Exactly the fixture of adequacy_ratio_rounds_to_four_decimals_on_the_credit_hour_basis: the CREDIT_HOUR_COVERAGE program with a 1-credit terminal-qualified section and a 2-credit flagged section, roster generated, Program.adequacy_ratio 0.3333."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_cw_1cr
            - *c_sec_cw_2cr
            - *c_asn_m_1cr
            - *c_asn_x_2cr
            - *c_roster_cw
            - *c_roster_cw_gen
