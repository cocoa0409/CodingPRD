            - "One lease, envelope 200000 sqft, nothing allocated."
            - "Two COSMETIC requests created back to back while both are SUBMITTED: A for 2027-01-01 to 2027-06-01 (10000 sqft) and D for 2027-03-01 to 2027-04-01 (5000 sqft), whose windows overlap each other."
