              captures: { pat8_post: $.data.patient_status }
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat8}", component_type: "MASK" }
              as: OpsAdmin
              captures: { plan8_post: "$.data[0].plan_status" }
            - call: "GET /sleep-therapy/rental-contracts"
