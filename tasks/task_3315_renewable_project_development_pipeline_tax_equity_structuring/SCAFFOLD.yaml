    side_effects: ["per DebtFacility state machine incl. term_debt_usd sizing"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or is outside the declared parent chain" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid payload field, bad enum, start_date >= end_date, non-positive amount, missing continuity_variant at establish, PHYSICAL_WORK confirm without evidence" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version / expected_partnership_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from the resource's current state (incl. direct project COD attempt and transitions from terminal states)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Milestone certifier X-User-ID equals submitted_by_user_id" }
  - { id: ERR_MILESTONE_EVIDENCE_REQUIRED, http: 400, condition: "submit-evidence without evidence_uri or work_date" }
  - { id: ERR_MILESTONE_OUT_OF_ORDER, http: 409, condition: "Certifying sequence_no N while a lower sequence_no milestone is not CERTIFIED" }
  - { id: ERR_COD_MILESTONE_PREREQUISITE, http: 409, condition: "COMMISSIONING requires FOUNDATION/ERECTION/ENERGIZATION/SUBSTANTIAL_COMPLETION CERTIFIED; COD milestone certify requires project COMMISSIONING" }
  - { id: ERR_PARCEL_OVERLAP, http: 409, condition: "Executing a site control instrument whose half-open window overlaps an active instrument on the same parcel_id" }
  - { id: ERR_OPTION_WINDOW_LAPSED, http: 409, condition: "Exercising an option/easement after end_date; instrument auto-transitions to EXPIRED" }
  - { id: ERR_STUDY_WINDOW_CONFLICT, http: 409, condition: "Study window collides with a same-phase study on the same cluster under closed-interval + 5-day buffer semantics" }
  - { id: ERR_PHASE_STUDY_NOT_ACCEPTED, http: 409, condition: "Queue phase advance without an ACCEPTED study of the current phase" }
  - { id: ERR_UPGRADE_ALLOCATION_REQUIRED, http: 409, condition: "FACILITIES_STUDY advance before upgrade cost allocation has run on the cluster" }
  - { id: ERR_ACTIVE_OFFTAKE_EXISTS, http: 409, condition: "Executing an offtake while another offtake of the project is EXECUTED or EFFECTIVE" }
  - { id: ERR_PRICE_FLOOR_BREACH, http: 422, condition: "Executing an offtake with base_price_usd_mwh < 20.00" }
  - { id: ERR_OFFTAKE_REQUIRED, http: 409, condition: "READY_FOR_CONSTRUCTION without an EFFECTIVE offtake agreement" }
  - { id: ERR_INTERCONNECTION_NOT_EXECUTED, http: 409, condition: "READY_FOR_CONSTRUCTION without an interconnection request in AGREEMENT_EXECUTED or IN_SERVICE" }
  - { id: ERR_SUPPLY_AGREEMENT_NOT_EXECUTED, http: 409, condition: "Safe-harbor confirm while the parent supply agreement is DRAFT or TERMINATED" }
  - { id: ERR_SAFE_HARBOR_WINDOW_LAPSED, http: 422, condition: "Safe-harbor confirm after order created_at + 183 days" }
  - { id: ERR_SAFE_HARBOR_TEST_FAILED, http: 422, condition: "FIVE_PERCENT_COST confirm with deposit_paid_usd < round_half_up(0.05 * eligible_cost_basis_usd, 2)" }
  - { id: ERR_SAFE_HARBOR_NOT_QUALIFIED, http: 409, condition: "TCQ establish / partnership commitment / UNDER_CONSTRUCTION without a safe-harbor-qualified order or anchored qualification" }
  - { id: ERR_CONTINUITY_LAPSED, http: 409, condition: "Continuity assessment failed under the pinned variant; TCQ auto-lapses" }
  - { id: ERR_CURE_WINDOW_EXPIRED, http: 422, condition: "Cure attempted after lapse_date + 90 days; TCQ auto-transitions to DISQUALIFIED" }
  - { id: ERR_CREDIT_DISQUALIFIED, http: 409, condition: "Operation requires a non-DISQUALIFIED tax credit qualification" }
  - { id: ERR_CONTRIBUTION_EXCEEDS_COMMITMENT, http: 422, condition: "Contribution would push contributed_usd above commitment_usd" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_CASH, http: 422, condition: "Distribution amount_usd exceeds retained_cash_usd" }
  - { id: ERR_TARGET_IRR_NOT_ACHIEVED, http: 409, condition: "Flip election with investor_irr_pct < target_irr_pct" }
  - { id: ERR_DSCR_BELOW_MINIMUM, http: 422, condition: "Term conversion with projected_cfads_usd / (drawn_usd * rate) < 1.30" }
  - { id: ERR_DRAW_EXCEEDS_COMMITMENT, http: 422, condition: "Construction draw would push drawn_usd above commitment_usd" }
  - { id: ERR_AVAILABILITY_MEASUREMENT_REQUIRED, http: 400, condition: "Transition to OPERATIONAL without measured_availability_pct" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: DeveloperAdmin
    description: "Developer organization administrator; owns projects and site control"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects"
      - "POST /api/projects/{id}/transitions"
      - "POST /api/projects/{id}/site-control-instruments"
      - "POST /api/site-control-instruments/{id}/transitions"
    shared_operations: ["GET read access to all project resources"]
  - name: OriginationManager
    description: "Originates interconnection requests, manages studies and offtake negotiations"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/interconnection-requests"
      - "POST /api/interconnection-requests/{id}/transitions"
      - "POST /api/interconnection-requests/{id}/studies"
      - "POST /api/interconnection-studies/{id}/transitions"
      - "POST /api/projects/{id}/offtake-agreements"
      - "POST /api/offtake-agreements/{id}/transitions"
    shared_operations: ["GET read access to interconnection and offtake resources"]
  - name: ProcurementLead
    description: "Owns supply agreements and procurement orders including safe harbor deposits"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/supply-agreements"
      - "POST /api/supply-agreements/{id}/transitions"
      - "POST /api/supply-agreements/{id}/procurement-orders"
      - "POST /api/procurement-orders/{id}/transitions"
    shared_operations: ["GET read access to supply and procurement resources"]
  - name: ConstructionManager
    description: "Plans milestones and submits work evidence; may NOT certify (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/construction-milestones"
      - "POST /api/construction-milestones/{id}/submit-evidence"
    shared_operations: ["GET read access to milestones"]
  - name: TaxCounsel
    description: "Certifies milestones, drives tax credit qualification, structures partnerships, runs distributions and flip; may NOT submit evidence (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/construction-milestones/{id}/certify"
      - "POST /api/tax-credit-qualifications/{id}/transitions"
      - "POST /api/projects/{id}/tax-equity-partnerships"
      - "POST /api/tax-equity-partnerships/{id}/transitions"
      - "POST /api/tax-equity-partnerships/{id}/distributions"
    shared_operations: ["GET read access to all tax and partnership resources"]
  - name: InvestorManager
    description: "Tax equity investor operator; posts capital contributions only"
    identity: opaque
    exclusive_operations:
      - "POST /api/tax-equity-partnerships/{id}/contributions"
    shared_operations: ["GET read access to partnerships and ledger entries"]
  - name: LenderAgent
    description: "Debt provider; owns facilities, draws, conversion, retirement, default"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/debt-facilities"
      - "POST /api/debt-facilities/{id}/transitions"
    shared_operations: ["GET read access to debt facilities"]
  - name: Auditor
    description: "Read-only oversight"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["GET read access to all resources"]
  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock and upgrade cost allocation"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/interconnection-requests/{id}/allocate-upgrade-costs"
    shared_operations: ["GET read access to all resources"]
