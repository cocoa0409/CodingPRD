# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3415_domestic_shoe_manufacturing_content_claim_substantiation
#
# Depth probe: 9 Difficulty Rules x 2 instances, every instance grounded in
# SCAFFOLD.yaml §1.1-§1.7 and replayable from empty-DB via setup_api_calls.
# YAML anchors (&c_*) are defined at first use and aliased (*c_*) in later
# instances; each instance is an independent empty-DB test, so literal
# payloads (style codes, contract numbers) may repeat across instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: content_provisional_vs_certified_diverge
        grounds:
          - calculations.content_calculation
          - entities.DomesticContentReport.fields.us_content_pct
          - entities.ShoeModel.fields.domestic_price_cents
          - endpoints.POST_/footwear/production-runs/{id}/content-reports
        distinguishing_aspect: "Same run and same nominal model: PROVISIONAL (BOM planned costs + standard minutes) yields us_content_pct 83.33 while CERTIFIED (actual lot costs 1250/800 + actual minutes 11/6/5) yields 84.00 — a content/cost-domain dual variant, distinct from the workforce-domain dual variant in skill_coverage_certified_vs_pipeline_diverge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. DOMESTIC factory (rate 50c/min, overhead 600c/pair, 2 lines, weekly capacity 1000)."
            - "Model M990V6 (DUAL_SOURCE, base 15000, import cost basis 4000): BOM line A = 2.0 uppers/pair planned 1200c domestic-planned, BOM line B = 1.0 midsole/pair planned 800c import-planned; standard minutes 10/5/5."
            - "Lots: upper domestic @1250 qty 500; midsole imported @800 qty 500."
            - "Week 2026-W36 allocation total 500, locked with the STOCK run (100 units) as demand -> domestic pool 100."
            - "Run MATERIAL_RESERVED (consumes 200 upper units + 100 midsole units), then started and completed with actual minutes 11/6/5."
          setup_api_calls:
            - &c_clk
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_fac_dom
              call: "POST /footwear/factories"
              payload: { factory_name: "Lawrence MA Plant", location_type: "DOMESTIC", government_cleared: false, weekly_capacity_units: 1000, line_count: 2, labor_rate_cents_per_minute: 50, overhead_cents_per_pair: 600 }
              as: PlatformAdmin
              captures: { f_id: $.data.id }
            - &c_comp_upper
              call: "POST /footwear/components"
              payload: { component_name: "Full-grain leather upper", component_type: "UPPER" }
              as: SourcingManager
              captures: { c_up: $.data.id }
            - &c_comp_mid
              call: "POST /footwear/components"
              payload: { component_name: "EVA midsole", component_type: "MIDSOLE" }
              as: SourcingManager
              captures: { c_mid: $.data.id }
            - &c_lot_up_dom
              call: "POST /footwear/lots"
              payload: { component_id: "${c_up}", supplier_name: "Lawrence Leather Co", is_domestic: true, quantity_received: 500, unit_cost_cents: 1250 }
              as: SourcingManager
              captures: { l_up: $.data.id }
            - &c_lot_mid_imp
              call: "POST /footwear/lots"
              payload: { component_id: "${c_mid}", supplier_name: "Saigon Foam Ltd", is_domestic: false, quantity_received: 500, unit_cost_cents: 800 }
              as: SourcingManager
              captures: { l_mid: $.data.id }
            - &c_model_dual
              call: "POST /footwear/models"
              payload: { style_code: "M990V6", production_policy: "DUAL_SOURCE", base_price_cents: 15000, import_cost_basis_cents: 4000, bom_lines: [ { component_id: "${c_up}", quantity_per_pair: 2.0, sourcing_requirement: "DOMESTIC_PREFERRED", planned_unit_cost_cents: 1200, planned_is_domestic: true }, { component_id: "${c_mid}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 800, planned_is_domestic: false } ], standard_stitching_minutes: 10, standard_lasting_minutes: 5, standard_assembly_minutes: 5 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - &c_alloc_w36
              call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W36", total_reserved_units: 500 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - &c_run_stock100
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 100, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_id: $.data.id }
            - &c_lock
              call: "POST /footwear/capacity-allocations/${a_id}/lock"
              payload: {}
              as: PlatformAdmin
            - &c_reserve
              call: "POST /footwear/production-runs/${r_id}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { run_v: $.data.version }
            - &c_report_prov
              call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "PROVISIONAL", expected_run_version: "${run_v}" }
              as: ProductionPlanner
              captures: { rep_prov: $.data.id }
            - &c_w1_create
              call: "POST /footwear/workers"
              payload: { factory_id: "${f_id}", full_name: "Ada Lovelace" }
              as: TrainingCoordinator
              captures: { w1: $.data.id }
            - &c_w1_enr_st
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w1}", operation: "STITCHING", target_level: 2 }
              as: TrainingCoordinator
              captures: { w1_es: $.data.id }
            - &c_w1_as_st
              call: "POST /footwear/training-enrollments/${w1_es}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_w1_enr_la
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w1}", operation: "LASTING", target_level: 2 }
              as: TrainingCoordinator
              captures: { w1_el: $.data.id }
            - &c_w1_as_la
              call: "POST /footwear/training-enrollments/${w1_el}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_w1_enr_as
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w1}", operation: "ASSEMBLY", target_level: 2 }
              as: TrainingCoordinator
              captures: { w1_ea: $.data.id }
            - &c_w1_as_as
              call: "POST /footwear/training-enrollments/${w1_ea}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_w2_create
              call: "POST /footwear/workers"
              payload: { factory_id: "${f_id}", full_name: "Grace Hopper" }
              as: TrainingCoordinator
              captures: { w2: $.data.id }
            - &c_w2_enr_st
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w2}", operation: "STITCHING", target_level: 2 }
              as: TrainingCoordinator
              captures: { w2_es: $.data.id }
            - &c_w2_as_st
              call: "POST /footwear/training-enrollments/${w2_es}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_w2_enr_la
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w2}", operation: "LASTING", target_level: 2 }
              as: TrainingCoordinator
              captures: { w2_el: $.data.id }
            - &c_w2_as_la
              call: "POST /footwear/training-enrollments/${w2_el}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_w2_enr_as
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w2}", operation: "ASSEMBLY", target_level: 2 }
              as: TrainingCoordinator
              captures: { w2_ea: $.data.id }
            - &c_w2_as_as
              call: "POST /footwear/training-enrollments/${w2_ea}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
            - &c_start
              call: "POST /footwear/production-runs/${r_id}/start"
              payload: {}
              as: ProductionPlanner
            - &c_complete_11_6_5
              call: "POST /footwear/production-runs/${r_id}/complete"
              payload: { actual_stitching_minutes: 11, actual_lasting_minutes: 6, actual_assembly_minutes: 5 }
              as: ProductionPlanner
            - &c_run_get
              call: "GET /footwear/production-runs/${r_id}"
              payload: {}
              as: ProductionPlanner
              captures: { run_v5: $.data.version }
            - &c_report_cert
              call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "CERTIFIED", expected_run_version: "${run_v5}" }
              as: ProductionPlanner
              captures: { rep_cert: $.data.id }
          trigger:
            - &c_model_get
              call: "GET /footwear/models/${m_id}"
              payload: {}
              as: SourcingManager
            - &c_reports_list
              call: "GET /footwear/production-runs/${r_id}/content-reports"
              payload: {}
              as: ProductionPlanner
          assert:
            - "GET /footwear/production-runs/${r_id}/content-reports?variant=PROVISIONAL returns 1 report; $.data[0].us_content_pct == 83.33, material_cost_cents == 3200, domestic_material_cost_cents == 2400, labor_cost_cents == 1000, overhead_cost_cents == 600, total_cost_cents == 4800, domestic_value_cents == 4000, final_assembly_domestic == true"
            - "GET /footwear/production-runs/${r_id}/content-reports?variant=CERTIFIED returns 1 report; $.data[0].us_content_pct == 84.00, material_cost_cents == 3300, domestic_material_cost_cents == 2500, labor_cost_cents == 1100, total_cost_cents == 5000"
            - "83.33 != 84.00 — the two variants disagree on identical nominal inputs (planned 1200/800 + 20 std minutes vs actual 1250/800 + 22 actual minutes)"
            - "ShoeModel.${m_id}.domestic_unit_cost_cents == 5000 and domestic_price_cents == 18750 (event-driven refresh by cost_differential_pricing from the CERTIFIED report)"
            - "ProductionRun.${r_id}.certified_unit_cost_cents == 5000 (STOCK run of 100 units -> no small-batch surcharge)"

      - name: skill_coverage_certified_vs_pipeline_diverge
        grounds:
          - calculations.skill_coverage_score
          - entities.Factory.fields.skill_coverage_certified_pct
          - entities.Factory.fields.skill_coverage_pipeline_pct
          - state_machines.TrainingEnrollment.ENROLLED_to_REMEDIATION
        distinguishing_aspect: "Same factory roster at the same instant: certified_only yields 75.0 while pipeline_adjusted yields 81.5 (one worker with an open STITCHING enrollment adds 0.5 credit) — a workforce-domain dual variant, distinct from the content/cost domain of content_provisional_vs_certified_diverge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. DOMESTIC factory with 2 lines and weekly capacity 1000."
            - "Two STOCK runs IN_PRODUCTION (10 units each) in week 2026-W36, so required headcount is STITCHING 4 / LASTING 2 / ASSEMBLY 2."
            - "Workers Ada + Grace: ACTIVE, CERTIFIED level 2 in all three operations. Worker Alan: ACTIVE with one ENROLLED (never assessed) STITCHING enrollment."
          setup_api_calls:
            - *c_clk
            - *c_fac_dom
            - &c_comp_out
              call: "POST /footwear/components"
              payload: { component_name: "Rubber outsole", component_type: "OUTSOLE" }
              as: SourcingManager
              captures: { c_out: $.data.id }
            - &c_lot_out
              call: "POST /footwear/lots"
              payload: { component_id: "${c_out}", supplier_name: "Akron Rubber", is_domestic: true, quantity_received: 1000, unit_cost_cents: 3000 }
              as: SourcingManager
              captures: { l_out: $.data.id }
            - &c_model_880
              call: "POST /footwear/models"
              payload: { style_code: "M880V2", production_policy: "DUAL_SOURCE", base_price_cents: 9900, import_cost_basis_cents: 3000, bom_lines: [ { component_id: "${c_out}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 3000, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *c_alloc_w36
            - &c_run_v1
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r1: $.data.id }
            - &c_run_v2
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 2, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r2: $.data.id }
            - *c_lock
            - &c_reserve_r1
              call: "POST /footwear/production-runs/${r1}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - &c_reserve_r2
              call: "POST /footwear/production-runs/${r2}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - *c_w1_create
            - *c_w1_enr_st
            - *c_w1_as_st
            - *c_w1_enr_la
            - *c_w1_as_la
            - *c_w1_enr_as
            - *c_w1_as_as
            - *c_w2_create
            - *c_w2_enr_st
            - *c_w2_as_st
            - *c_w2_enr_la
            - *c_w2_as_la
            - *c_w2_enr_as
            - *c_w2_as_as
            - &c_start_r1
              call: "POST /footwear/production-runs/${r1}/start"
              payload: {}
              as: ProductionPlanner
            - &c_start_r2
              call: "POST /footwear/production-runs/${r2}/start"
              payload: {}
              as: ProductionPlanner
            - &c_w3_create
              call: "POST /footwear/workers"
              payload: { factory_id: "${f_id}", full_name: "Alan Turing" }
              as: TrainingCoordinator
              captures: { w3: $.data.id }
            - &c_w3_enr_st
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w3}", operation: "STITCHING", target_level: 1 }
              as: TrainingCoordinator
              captures: { w3_es: $.data.id }
          trigger:
            - call: "GET /footwear/factories/${f_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Factory.${f_id}.skill_coverage_certified_pct == 75.0 (STITCHING coverage 50 = 2 certified of 4 required; LASTING and ASSEMBLY 100)"
            - "Factory.${f_id}.skill_coverage_pipeline_pct == 81.5 (STITCHING pipeline coverage 63 = round_half_up(100 * 2.5 / 4); 63*0.5 + 100*0.3 + 100*0.2 = 81.5)"
            - "the two variants disagree (75.0 != 81.5) on the same roster because only pipeline_adjusted credits the open ENROLLED enrollment 0.5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: run_unit_cost_surcharge_tiers_and_type_conditionals
        grounds:
          - calculations.run_unit_cost
          - entities.ProductionRun.fields.certified_unit_cost_cents
          - endpoints.POST_/footwear/production-runs/{id}/complete
        distinguishing_aspect: "Mode (a): identical base cost 4600 but three runs diverge purely through nested conditionals — CUSTOM_BATCH of 8 units pays tier-1 25% + 5pp = 30% (5980), STOCK of 8 pays 25% (5750), GOVERNMENT of 8 is exempt (4600) — inputs {planned_units, run_type, actual material, actual minutes} interact non-linearly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. DOMESTIC government-cleared factory (rate 50c/min, overhead 600c/pair, 3 lines, weekly capacity 1000)."
            - "Model M550 (DUAL_SOURCE): one IMPORT_ALLOWED BOM line of 1.0 outsole/pair planned 3000c; standard minutes 0/0/0; lot of 100 domestic outsoles @3000."
            - "Week 2026-W36 allocation total 100; three runs of 8 units each on lines 1-3 created before lock (waterfall: domestic pool 24)."
            - "All three runs reserved (24 lot units), started (Ada + Grace fully certified) and completed with actual minutes 20/0/0 -> per-pair base 3000 + 1000 + 600 = 4600."
          setup_api_calls:
            - *c_clk
            - &c_fac_gov
              call: "POST /footwear/factories"
              payload: { factory_name: "Norridgewock ME Plant", location_type: "DOMESTIC", government_cleared: true, weekly_capacity_units: 1000, line_count: 3, labor_rate_cents_per_minute: 50, overhead_cents_per_pair: 600 }
              as: PlatformAdmin
              captures: { f_id: $.data.id }
            - *c_comp_out
            - *c_lot_out
            - &c_model_550
              call: "POST /footwear/models"
              payload: { style_code: "M550", production_policy: "DUAL_SOURCE", base_price_cents: 9900, import_cost_basis_cents: 3000, bom_lines: [ { component_id: "${c_out}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 3000, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - &c_alloc_100
              call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W36", total_reserved_units: 100 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - &c_run_cust8
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "CUSTOM_BATCH", planned_units: 8, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_cust: $.data.id }
            - &c_run_stock8
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 8, line_index: 2, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_stock: $.data.id }
            - &c_run_gov8
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "GOVERNMENT", planned_units: 8, line_index: 3, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_gov: $.data.id }
            - &c_lock_a100
              call: "POST /footwear/capacity-allocations/${a_id}/lock"
              payload: {}
              as: PlatformAdmin
            - &c_reserve_cust
              call: "POST /footwear/production-runs/${r_cust}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - &c_reserve_stock
              call: "POST /footwear/production-runs/${r_stock}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - &c_reserve_gov
              call: "POST /footwear/production-runs/${r_gov}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - *c_w1_create
            - *c_w1_enr_st
            - *c_w1_as_st
            - *c_w1_enr_la
            - *c_w1_as_la
            - *c_w1_enr_as
            - *c_w1_as_as
            - *c_w2_create
            - *c_w2_enr_st
            - *c_w2_as_st
            - *c_w2_enr_la
            - *c_w2_as_la
            - *c_w2_enr_as
            - *c_w2_as_as
            - &c_start_cust
              call: "POST /footwear/production-runs/${r_cust}/start"
              payload: {}
              as: ProductionPlanner
            - &c_start_stock
              call: "POST /footwear/production-runs/${r_stock}/start"
              payload: {}
              as: ProductionPlanner
            - &c_start_gov
              call: "POST /footwear/production-runs/${r_gov}/start"
              payload: {}
              as: ProductionPlanner
            - &c_complete_cust
              call: "POST /footwear/production-runs/${r_cust}/complete"
              payload: { actual_stitching_minutes: 20, actual_lasting_minutes: 0, actual_assembly_minutes: 0 }
              as: ProductionPlanner
            - &c_complete_stock
              call: "POST /footwear/production-runs/${r_stock}/complete"
              payload: { actual_stitching_minutes: 20, actual_lasting_minutes: 0, actual_assembly_minutes: 0 }
              as: ProductionPlanner
            - &c_complete_gov
              call: "POST /footwear/production-runs/${r_gov}/complete"
              payload: { actual_stitching_minutes: 20, actual_lasting_minutes: 0, actual_assembly_minutes: 0 }
              as: ProductionPlanner
          trigger:
            - call: "GET /footwear/production-runs"
              payload: { factory_id: "${f_id}" }
              as: ProductionPlanner
          assert:
            - "ProductionRun.${r_cust}.certified_unit_cost_cents == 5980 (CUSTOM_BATCH, 8 units: 4600 * 1.30)"
            - "ProductionRun.${r_stock}.certified_unit_cost_cents == 5750 (STOCK, 8 units: 4600 * 1.25)"
            - "ProductionRun.${r_gov}.certified_unit_cost_cents == 4600 (GOVERNMENT is surcharge-exempt despite 8 < 10 units)"
            - "all three runs COMPLETED with the same 4600 base — the 1380-cent spread between CUSTOM_BATCH and GOVERNMENT comes only from tier selection + run_type conditionals"

      - name: custom_order_price_pinned_evaluation_order
        grounds:
          - calculations.custom_order_price
          - entities.CustomOrder.fields.quoted_price_cents
          - endpoints.POST_/footwear/custom-orders/{id}/accept
        distinguishing_aspect: "Mode (c): the discount tier is keyed on the PRE-discount subtotal — for subtotal 21750 the 10% tier applies and the pinned result is 19575, whereas keying the tier on the post-discount price (a plausible misreading, since 19575 < 20000) would yield 20663. A second order exercises the fallback-markup base (no certified report -> round(15000*1.15)=17250) with tier 5% and per-pair rounding before quantity multiplication (16625 x 2 = 33250)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. DOMESTIC cleared factory (rate 50c/min, overhead 600c/pair)."
            - "Model CUSTOM1 (DUAL_SOURCE, base 15000, import basis 4000) has NO certified report -> domestic_price_cents is null."
            - "Model CUSTOM2 (DUAL_SOURCE, base 15000, import basis 4000, single DOMESTIC_REQUIRED line planned 3900) has a CERTIFIED report with total_cost_cents 5600 (domestic lot @4000, actual minutes 20 -> labor 1000, overhead 600) -> domestic_price_cents == 21000."
            - "Order O1 on CUSTOM1: colorway RED, no monogram, qty 2. Order O2 on CUSTOM2: colorway RED, monogram 'AB', qty 1."
          setup_api_calls:
            - *c_clk
            - *c_fac_gov
            - &c_comp_k
              call: "POST /footwear/components"
              payload: { component_name: "Kevlar lace set", component_type: "LACES" }
              as: SourcingManager
              captures: { c_k: $.data.id }
            - &c_lot_k
              call: "POST /footwear/lots"
              payload: { component_id: "${c_k}", supplier_name: "Rhode Island Cordage", is_domestic: true, quantity_received: 100, unit_cost_cents: 4000 }
              as: SourcingManager
              captures: { l_k: $.data.id }
            - &c_model_custom1
              call: "POST /footwear/models"
              payload: { style_code: "CUSTOM1", production_policy: "DUAL_SOURCE", base_price_cents: 15000, import_cost_basis_cents: 4000, bom_lines: [ { component_id: "${c_k}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 1, standard_lasting_minutes: 1, standard_assembly_minutes: 1 }
              as: SourcingManager
