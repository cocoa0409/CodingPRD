          assert:
            - "trigger[0]: lifetime_giving_cents == 497499, is_major_donor == false, cultivation_locked == false, status == ACTIVE"
            - "trigger[1]: 200 with settlement_status == SETTLED"
            - "trigger[2]: lifetime_giving_cents == 500000, is_major_donor == true, cultivation_locked == true"
            - "trigger[3]: total_count == 1 and the single row is ${m_id}"

      - name: layer_influence_contact_cascade_reaches_five_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Funder.CLEARED_to_RESTRICTED
          - entities.CoverageArea.fields.publication_gate
        distinguishing_aspect: >-
          One logged editorial-direction contact restricts the funder, staleness the disclosure,
          blocks the beat, suspends the awarded proposal and finally reprices the period's
          posture, and every hop is asserted end to end.
        excluded_because:
          difficulty_instance: tc_influence_contact_five_hop_cascade_suspends_awarded_grant
          rationale: >-
            The §1.8 instance already walks the full five-hop chain from the third influence
            contact through funder restriction, disclosure staleness, gate blocking and proposal
            suspension, asserting each hop's fields.

      - name: layer_dual_variant_revenue_index_produces_two_answers
        claim_type: dual_variant_calculation
        grounds:
          - calculations.revenue_diversification_index
        distinguishing_aspect: >-
          The RECOGNIZED and PIPELINE variants of the diversification index disagree on the same
          rows, and only the RECOGNIZED variant is ever persisted onto the period.
        excluded_because:
          difficulty_instance: dv_recognized_vs_pipeline_diverge_on_hhi_top_source_and_reserve_target
          rationale: >-
            The §1.8 instance already reads both variants off one fixture, asserts the divergent
            HHI, top-source share, reserve target and posture, and confirms the projection is not
            written back.

  - section: Consistency Model
    instances:

      - name: cm_settlement_recomputes_member_and_period_state_within_the_same_request
        claim_type: immediate
        grounds:
          - calculations.revenue_diversification_index
          - calculations.reserve_policy_posture
          - entities.Member.fields.lifetime_giving_cents
        distinguishing_aspect: >-
          The settlement response itself already carries the SETTLED status, and an immediately
          following read - with no sweep, no second write and no delay - shows the member ACTIVE
          and the period's recognized revenue, HHI, reserve target and posture fully repriced.
        test_recipe:
          setup: "One period (200000-cent monthly base, 500000-cent reserve), one published ANNUAL 100000-cent benefit-free tier and one PENDING member with an unsettled 100000-cent membership contribution."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "PATRON", name: "Patron", renewal_cadence: "ANNUAL", contribution_amount_cents: 100000, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 100000, received_date: "2026-08-01", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /contributions/${c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "GET /members/${m_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
          assert:
            - "trigger[0]: recognized_revenue_cents == 0, concentration_hhi == 0, reserve_months_target == 3, operating_reserve_target_cents == 600000, sustainability_posture == HEALTHY, restricted_release_cap_pct_bps == 10000"
            - "trigger[1]: 200 in the settlement response itself with settlement_status == SETTLED, quid_pro_quo_amount_cents == 0, tax_deductible_amount_cents == 100000"
            - "trigger[2]: status == ACTIVE, cycle_start_date == 2026-08-01, next_renewal_date == 2027-08-01, lifetime_giving_cents == 100000, is_major_donor == false"
            - "trigger[3]: recognized_revenue_cents == 100000, membership_share_bps == 10000, concentration_hhi == 10000, top_source_share_bps == 10000, reserve_months_target == 5, operating_reserve_target_cents == 1000000, reserve_months_ratio_bps == 25000, sustainability_posture == WATCH, restricted_release_cap_pct_bps == 6000"

      - name: cm_sweep_derived_penalties_are_visible_in_the_sweep_response
        claim_type: immediate
        grounds:
          - entities.Funder.fields.reporting_reliability_bps
        distinguishing_aspect: >-
          The daily sweep's own response reports the rows it moved, and the funder's reliability
          penalty is readable immediately afterwards rather than converging over later sweeps.
        excluded_because:
          difficulty_instance: tc_report_overdue_sweep_penalises_funder_reliability_once
          rationale: >-
            The §1.8 instance already asserts the sweep response counters and then re-reads the
            funder to show the single 2000-bps penalty, including idempotency across a second
            sweep on the same day.
