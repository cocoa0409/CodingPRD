            - { call: "POST /haul/loads/${ld}/arrive", payload: {}, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/loads/${ld}/weight-tickets", payload: { ticket_type: "DELIVERY", gross_lb: 44800, tare_lb: 6000, weighed_at: "2026-08-02T15:30:00Z" }, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/deliver", payload: {}, as: ConsigneeAgent }
            - { call: "GET /haul/loads/${ld}/settlement", as: Any, captures: { s_id: "$.data[0].id" } }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/settlements/${s_id}/dispute", payload: { disputed_weight_lb: 37000 }, as: ConsigneeAgent }
            - { call: "GET /haul/settlements/${s_id}", as: Any, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /haul/settlements/${s_id}/counter", payload: { counter_weight_lb: 38800, expected_settlement_version: "${sv}" }, as: Dispatcher }
            - { call: "POST /haul/settlements/${s_id}/accept-counter", payload: {}, as: ConsigneeAgent }
          assert:
            - "Settlement.${s_id}.status == RESOLVED"
            - "Settlement.${s_id}.final_amount_cents == 149000 (unchanged by the equal-weight round-trip)"
            - "Settlement.${s_id}.provisional_amount_cents == 150000"
            - "Settlement.${s_id}.shrink_penalty_cents == 1000 and welfare_deduction_cents == 0 and dispute_adjustment_cents == 0"
            - "identity: 149000 == 150000 - 1000 - 0 + 0"
