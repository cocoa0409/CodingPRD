        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lockout_safety_beats_temporal
          rationale: "Asserted as the winning error of the dual-failure §1.8 instance."
      - name: error_rigging_plan_not_approved_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RIGGING_PLAN_NOT_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lift_permit_requires_approved_rigging_plan
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_alignment_outstanding_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ALIGNMENT_OUTSTANDING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / checklist_submit_requires_alignment_clearance
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_lockout_conflict_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOCKOUT_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lockout_buffer_clearance
          rationale: "Asserted by the 15-minute-gap trigger of the named §1.8 instance."
      - name: error_crane_window_conflict_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CRANE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crane_booking_half_open_adjacency
          rationale: "Asserted by the overlapping-window trigger of the named §1.8 instance."
      - name: error_safety_hold_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SAFETY_HOLD]
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_parallel_hold_dimension
          rationale: "Asserted by the labor submit attempt during SAFETY_HOLD in the named §1.8 instance."
      - name: error_nte_exceeded_state_priority_covered
        claim_type: priority_conflict
        grounds:
          - errors[ERR_NTE_EXCEEDED]
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invoice_state_beats_fiscal
          rationale: "Dual-failure priority between state and fiscal is asserted by the named §1.8 instance; standalone NTE trigger lives in validations/nte_exceeded_on_tm_invoice."

  # ===========================================================================
  - section: rbac
    instances:
      - name: safety_officer_cannot_create_project
        claim_type: role_denial
        grounds:
          - roles.ProjectManager
          - "endpoints.POST /v1/projects"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Project creation is exclusive to ProjectManager; SafetyOfficer gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/projects", payload: { name: "RBAC Job", customer_name: "Acme", site_address: "59 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: SafetyOfficer, captures: { rb1_err: $.data.error_id } }
          assert:
            - "Response is 403 with error_id ERR_FORBIDDEN (${rb1_err})"

      - name: payroll_clerk_cannot_create_labor_entry
        claim_type: role_denial
        grounds:
          - roles.SiteSupervisor
          - "endpoints.POST /v1/labor-entries"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Labor creation is exclusive to SiteSupervisor; PayrollClerk gets 403 ERR_FORBIDDEN (role check fires before body existence checks)."
        test_recipe:
          setup: ["One project exists"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "RBAC2 Job", customer_name: "Acme", site_address: "60 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_rb2: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_rb2}", worker_ref: "U-9601", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: PayrollClerk, captures: { rb2_err: $.data.error_id } }
          assert:
            - "Response is 403 with error_id ERR_FORBIDDEN (${rb2_err})"

      - name: site_supervisor_cannot_approve_labor
        claim_type: role_denial
        grounds:
          - roles.PayrollClerk
          - "endpoints.POST /v1/labor-entries/{id}/approve"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Labor approval is exclusive to PayrollClerk; a SiteSupervisor gets 403 ERR_FORBIDDEN at the role layer (distinct from the segregation check)."
        test_recipe:
          setup: ["Project with a SUBMITTED labor entry (submitted by sup-1)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "RBAC3 Job", customer_name: "Acme", site_address: "61 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_rb3: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_rb3}", worker_ref: "U-9602", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_rb3: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_rb3}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /v1/labor-entries/${le_rb3}/approve", payload: {}, as: SiteSupervisor, as_user_id: sup-2, captures: { rb3_err: $.data.error_id } }
          assert:
            - "Response is 403 with error_id ERR_FORBIDDEN (${rb3_err}); entry remains SUBMITTED"

      - name: segregation_of_duties_same_user_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.LaborEntry.fields.submitted_by_user_id
        distinguishing_aspect: "A PayrollClerk whose X-User-ID equals the entry's submitted_by_user_id is the same person wearing two hats; approval fails 403 ERR_SEGREGATION_OF_DUTIES while a different clerk succeeds."
        test_recipe:
          setup: ["Project with a SUBMITTED labor entry (submitted_by_user_id == 'sup-1')"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SoD Job", customer_name: "Acme", site_address: "62 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sod: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_sod}", worker_ref: "U-9603", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_sod: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_sod}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /v1/labor-entries/${le_sod}/approve", payload: {}, as: PayrollClerk, as_user_id: sup-1, captures: { sod_err: $.data.error_id } }
            - { call: "POST /v1/labor-entries/${le_sod}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1, captures: { sod_ok: $.data.status } }
          assert:
            - "Same-user approval fails with error_id ERR_SEGREGATION_OF_DUTIES (${sod_err})"
            - "Different-clerk approval succeeds: status == APPROVED (${sod_ok})"

      - name: project_manager_cannot_signoff_checklist
        claim_type: role_denial
        grounds:
          - roles.CustomerRep
          - "endpoints.POST /v1/commissioning-checklists/{id}/sign-off"
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Sign-off is exclusive to CustomerRep; the ProjectManager who submitted the checklist gets 403 ERR_FORBIDDEN — segregation between contractor and customer."
        test_recipe:
          setup: ["Project in COMMISSIONING with checklist SUBMITTED (full chain incl. accepted alignment record and checked items)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "RBAC5 Job", customer_name: "Acme", site_address: "63 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_rb5: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_rb5}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_rb5: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_rb5}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_rb5}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_rb5}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_rb5: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_rb5}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_rb5}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_rb5}/advance", payload: {}, as: ProjectManager, captures: { p_rb5_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_rb5}", expected_project_version: "${p_rb5_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_rb5: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_rb5}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_rb5}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_rb5}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_rb5: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/lift-permits/${lp_rb5}/execute", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/projects/${p_rb5}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists", payload: { project_id: "${p_rb5}", items: [{ item_key: "GROUT", description: "grout cured", required: true }] }, as: ProjectManager, captures: { cc_rb5: $.data.id } }
            - { call: "POST /v1/alignment-records", payload: { project_id: "${p_rb5}", measurement_point: "PUMP-MOTOR", tolerance_class: PRECISION, measured_offset_mils: 1.5, measured_angular_mils_per_in: 0.4 }, as: SiteSupervisor, captures: { ar_rb5: $.data.id } }
            - { call: "POST /v1/alignment-records/${ar_rb5}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_rb5}/check-item", payload: { item_key: "GROUT" }, as: SiteSupervisor }
            - { call: "POST /v1/commissioning-checklists/${cc_rb5}/submit", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/commissioning-checklists/${cc_rb5}/sign-off", payload: {}, as: ProjectManager, captures: { rb5_err: $.data.error_id } }
          assert:
            - "Response is 403 with error_id ERR_FORBIDDEN (${rb5_err}); checklist remains SUBMITTED"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rigging-plan-create-stale-project]
          - errors[ERR_STALE_VERSION]
          - validations[priority=4]
        distinguishing_aspect: "Creating a rigging plan with expected_project_version one behind the current Project.version (a prior plan creation bumped it) fails 412 ERR_STALE_VERSION; supplying the current version succeeds."
        test_recipe:
          setup: ["Project (AWARDED) with one rigging plan created at project version 1 and already REJECTED (so the open-plan constraint cannot mask the OCC result); project version re-read before the stale attempt"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "OCC Job", customer_name: "Acme", site_address: "64 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_occ: $.data.id, p_occ_v1: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_occ}", expected_project_version: "${p_occ_v1}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_occ1: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_occ1}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_occ1}/review", payload: { outcome: REJECTED, reviewer_note: "redo" }, as: ProjectManager }
            - { call: "GET /v1/projects/${p_occ}", payload: {}, as: ProjectManager, captures: { p_occ_v2: $.data.version } }
          trigger:
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_occ}", expected_project_version: "${p_occ_v2} - 1", lift_weight_tons: 41, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { occ_err: $.data.error_id } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_occ}", expected_project_version: "${p_occ_v2}", lift_weight_tons: 41, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_occ2: $.data.id, rp_occ2_rev: $.data.revision } }
          assert:
            - "Stale create (${p_occ_v2} - 1) fails with error_id ERR_STALE_VERSION (${occ_err}) and HTTP 412"
            - "Current-version create succeeds: new plan id ${rp_occ2} with revision == 2 (${rp_occ2_rev})"

      - name: version_pinning_on_approval
        claim_type: version_pinning_on_approval
        grounds:
          - entities.Project.fields.approved_rigging_plan_id
          - entities.Project.fields.approved_rigging_plan_revision
          - state_machines.RiggingPlan.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Approval pins the exact plan id and revision onto the project, readable via GET /v1/projects/{id}."
        test_recipe:
          setup: ["Project in INSTALLING (survey accepted) with rigging plan revision 1 APPROVED"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Pin Job", customer_name: "Acme", site_address: "65 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_pin: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_pin}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_pin: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_pin}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_pin}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_pin}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_pin: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_pin}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_pin}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_pin}/advance", payload: {}, as: ProjectManager, captures: { p_pin_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_pin}", expected_project_version: "${p_pin_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_pin: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_pin}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_pin}/review", payload: { outcome: APPROVED }, as: ProjectManager }
          trigger:
            - { call: "GET /v1/projects/${p_pin}", payload: {}, as: ProjectManager, captures: { pin_id: $.data.approved_rigging_plan_id, pin_rev: $.data.approved_rigging_plan_revision } }
          assert:
            - "Project.approved_rigging_plan_id == ${rp_pin} (${pin_id})"
            - "Project.approved_rigging_plan_revision == 1 (${pin_rev})"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SafetyPlan.ACTIVE_to_SUSPENDED
          - state_machines.RiggingPlan.APPROVED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / safety_suspend_cascade
          rationale: "Both cascade chains (depth 3 each) are asserted end-to-end by §1.8 instances safety_suspend_cascade and rigging_supersede_cascade."

      - name: dual_variant_calculations_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.invoice_amount
          - calculations.labor_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_tm_vs_lump_sum_divergence
          rationale: "Both variant pairs (billing TM/LUMP_SUM and payroll DAILY_OT/WEEKLY_OT) asserted by §1.8 instances invoice_tm_vs_lump_sum_divergence and labor_daily_vs_weekly_ot_divergence."

      - name: derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.project_cost_rollup
          - entities.Project.fields.approved_labor_cents
        excluded_because:
          difficulty_instance: compensating_invariant / labor_approve_reject_conserves_rollup
          rationale: "Rollup correctness across forward and compensating mutations asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_approve
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.project_cost_rollup
        distinguishing_aspect: "Immediate consistency: the approve response itself reports APPROVED, and a plain GET right after shows the rolled-up approved_labor_cents with no delay or replay step."
        test_recipe:
          setup: ["Project with a SUBMITTED 8h MW_JOURNEYMAN DAY entry (total 84800)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Consistency Job", customer_name: "Acme", site_address: "66 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_cm: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_cm}", worker_ref: "U-9701", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_cm: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_cm}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /v1/labor-entries/${le_cm}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1, captures: { cm_status: $.data.status } }
            - { call: "GET /v1/projects/${p_cm}", payload: {}, as: ProjectManager, captures: { cm_alc: $.data.approved_labor_cents } }
          assert:
            - "Approve response reports status == APPROVED (${cm_status}) in the same request"
            - "Immediate GET shows approved_labor_cents == 84800 (${cm_alc}) — no staleness window"
