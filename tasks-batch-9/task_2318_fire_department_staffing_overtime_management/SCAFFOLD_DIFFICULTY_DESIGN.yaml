# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# 9 rule_id blocks x 2 instances = 18 instances.
# Every numeric literal in `assert:` was computed by executing the referenced
# §1.3 formula with its `constants:` in Python; the logical clock default is
# 2026-08-01T00:00:00Z (POST /_clock/set_current_utc, §1.5), so every work
# period created without an explicit clock call spans 2026-08-01 .. 2026-08-27
# and the canonical shift dates 2026-08-10 (platoon B), 2026-08-11 (platoon C),
# 2026-08-12 (platoon D), 2026-08-23 (platoon C) and 2026-08-27 (platoon C) all
# fall inside it. Kelly slot is 8 on 2026-08-10/11/12, 3 on 2026-08-23 and 4 on
# 2026-08-27, so members created with kelly_day_cycle_position in {1,2,3,4} are
# never on a Kelly day on 2026-08-10/11/12.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_variant_divergence_on_station_fiscal_projection
        grounds:
          - calculations.station_overtime_forecast
          - entities.Station.fields.ot_actual_cents
          - entities.Station.fields.ot_committed_cents
          - entities.Vacancy.fields.status
          - endpoints["GET /fire-ops/stations/{station_id}/overtime-forecast"]
        distinguishing_aspect: |
          The dual variant lives on the Station entity in the money domain: the
          VACANCY_DRIVEN method reads only open seats plus injury headcount and
          returns 171441 cents, while the RUN_RATE method reads only realised
          spend divided by elapsed fiscal days and returns 630720 cents for the
          identical station at the identical clock instant.
        test_recipe:
          setup:
            - "Station 41 with a 9,000,000-cent overtime budget over the fiscal period 2026-08-01 .. 2026-09-30 and a staffing floor of 1."
            - "One company ENGINE-41 with minimum_crew_size 1 requiring PARAMEDIC."
            - "Three ACTIVE paramedics on platoon C with hourly rates 4237, 3916 and 4602 cents (average 4252 after round_half_up)."
            - "A shift on 2026-08-11 that was staffed by an accepted VOLUNTARY overtime offer and then completed, leaving Station.ot_actual_cents = 170820 and ot_committed_cents = 0."
            - "A second shift on 2026-08-23 published with one OPEN PARAMEDIC vacancy in the remaining fiscal horizon."
            - "Logical clock at 2026-08-13T00:00:00Z: 13 elapsed fiscal days, 48 remaining days."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 41", battalion_code: "B4", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st41: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st41}", unit_designation: "ENGINE-41", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: ["PARAMEDIC"], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng41: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st41}", full_name: "A Alvarez", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: ["PARAMEDIC"], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff41a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st41}", full_name: "B Boyd", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: ["PARAMEDIC"], hourly_rate_cents: 3916 }
              as: StaffingOfficer
              captures: { ff41b: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st41}", full_name: "C Cho", rank: "ENGINEER", platoon: "C", seniority_rank: 3, kelly_day_cycle_position: 3, certifications: ["PARAMEDIC"], hourly_rate_cents: 4602 }
              as: StaffingOfficer
              captures: { ff41c: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st41}", roster_type: "VOLUNTARY_OT", certification_scope: "PARAMEDIC" }
              as: StaffingOfficer
              captures: { r41: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st41}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh41a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh41a}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh41a_v: "$.data.version" }
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh41a}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac41a: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac41a}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off41a: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${off41a}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff41a}"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-13T00:00:00Z" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts/${sh41a}/complete"
              payload: {}
              as: PayrollAnalyst
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st41}", shift_date: "2026-08-23", platoon: "C" }
              as: StaffingOfficer
              captures: { sh41b: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh41b}/publish"
              payload: {}
              as: StaffingOfficer
          trigger:
            - call: "GET /fire-ops/stations/${st41}/overtime-forecast"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /fire-ops/stations/${st41}/overtime-forecast"
              payload: { method: "RUN_RATE" }
              as: PayrollAnalyst
          assert:
            - "Station.${st41}.ot_actual_cents == 170820 and Station.${st41}.ot_committed_cents == 0"
            - "VACANCY_DRIVEN response: avg_rate_cents == 4252"
            - "VACANCY_DRIVEN response: shift_base_cents == 153072"
            - "VACANCY_DRIVEN response: horizon_vacancy_count == 1"
            - "VACANCY_DRIVEN response: vacancy_driver_cents == 171441"
            - "VACANCY_DRIVEN response: injury_headcount == 0 and injury_driver_cents == 0"
            - "VACANCY_DRIVEN response: forecast_cents == 171441"
            - "VACANCY_DRIVEN response: projected_period_total_cents == 342261 and variance_cents == 8657739 and forecast_posture == \"WITHIN\""
            - "RUN_RATE response: remaining_days == 48 and daily_run_rate_cents == 13140"
            - "RUN_RATE response: forecast_cents == 630720"
            - "RUN_RATE response: projected_period_total_cents == 801540 and variance_cents == 8198460 and forecast_posture == \"WITHIN\""
            - "The two variants differ by 459279 cents on identical stored state (630720 - 171441)"

      - name: flsa_period_priced_on_scheduled_versus_worked_basis
        grounds:
          - calculations.flsa_work_period_overtime
          - entities.WorkPeriod.fields.adjusted_scheduled_hours
          - entities.WorkPeriod.fields.adjusted_worked_hours
          - state_machines.WorkPeriod.OPEN_to_CLOSED
          - endpoints["POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"]
        distinguishing_aspect: |
          This dual variant lives on the WorkPeriod entity in the labour-hours
          domain, not on Station money: the same period holds 252 adjusted
          scheduled hours and 240 adjusted worked hours, so the SCHEDULED_BASIS
          variant prices 48 overtime hours at 101688 cents while the WORKED_BASIS
          variant prices 36 overtime hours at 76266 cents once the period closes.
        test_recipe:
          setup:
            - "Station 42 with one company ENGINE-42 (minimum_crew_size 1, no required certifications) and a staffing floor of 1."
            - "One ACTIVE member on platoon C, Kelly position 1, hourly rate 4237 cents, whose FLSA work period spans 2026-08-01 .. 2026-08-27."
            - "The member holds two REGULAR 24-hour seats, on 2026-08-11 and on 2026-08-27, so WorkPeriod.scheduled_hours == 48."
            - "A +204-hour SCHEDULED adjustment and a +192-hour WORKED adjustment are recorded against the period, giving adjusted_scheduled_hours 252 and adjusted_worked_hours 192 while the period is still OPEN."
            - "Logical clock moved to 2026-08-28T00:00:00Z and the 2026-08-11 shift already completed, so worked_hours == 24 and adjusted_worked_hours == 216, with the period still OPEN and priced on the SCHEDULED_BASIS at 101688 cents."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 42", battalion_code: "B4", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st42: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st42}", unit_designation: "ENGINE-42", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng42: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st42}", full_name: "D Diaz", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff42a: "$.data.id" }
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff42a}" }
              as: PayrollAnalyst
              captures: { wp42a: "$.data[0].id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st42}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh42a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh42a}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh42a_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh42a}", firefighter_id: "${ff42a}", apparatus_id: "${eng42}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh42a_v}" }
              as: CompanyOfficer
              as_user_id: "${ff42a}"
              captures: { asg42a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st42}", shift_date: "2026-08-27", platoon: "C" }
              as: StaffingOfficer
              captures: { sh42b: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh42b}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh42b_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh42b}", firefighter_id: "${ff42a}", apparatus_id: "${eng42}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh42b_v}" }
              as: CompanyOfficer
              as_user_id: "${ff42a}"
              captures: { asg42b: "$.data.id" }
            - call: "POST /fire-ops/work-periods/${wp42a}/hour-adjustment"
              payload: { adjustment_hours: 204, adjustment_basis: "SCHEDULED", reason: "hours imported from the prior 7(k) period" }
              as: PayrollAnalyst
            - call: "POST /fire-ops/work-periods/${wp42a}/hour-adjustment"
              payload: { adjustment_hours: 192, adjustment_basis: "WORKED", reason: "worked hours imported from the prior 7(k) period" }
              as: PayrollAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-28T00:00:00Z" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts/${sh42a}/complete"
              payload: {}
              as: PayrollAnalyst
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh42b}/complete"
              payload: {}
              as: PayrollAnalyst
          assert:
            - "WorkPeriod.${wp42a}.status == \"CLOSED\""
            - "WorkPeriod.${wp42a}.adjusted_scheduled_hours == 252 and WorkPeriod.${wp42a}.projected_flsa_overtime_hours == 48"
            - "WorkPeriod.${wp42a}.adjusted_worked_hours == 240 and WorkPeriod.${wp42a}.final_flsa_overtime_hours == 36"
            - "WorkPeriod.${wp42a}.flsa_premium_cents == 76266 (WORKED_BASIS), having read 101688 (SCHEDULED_BASIS) immediately before this call"
            - "The variant switch moved the premium by exactly 25422 cents with no change to any stored hour field"
            - "ShiftAssignment.${asg42b}.status == \"WORKED\" and ShiftAssignment.${asg42b}.actual_hours == 24"
            - "A successor WorkPeriod exists for ${ff42a} with status \"OPEN\", period_start_date \"2026-08-28\" and period_end_date \"2026-09-23\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overtime_offer_cost_nested_premium_and_mode_minimum_hours
        grounds:
          - calculations.overtime_offer_cost
          - calculations.continuous_duty_hours
          - entities.OvertimeOffer.fields.projected_cost_cents
          - endpoints["POST /fire-ops/vacancies/{vacancy_id}/offer"]
        distinguishing_aspect: |
          Mode (a) of §0.5 Rule 2: a five-input non-linear formula (base rate,
          certification premium, conditional fatigue premium gated on a merged
          interval, max() mode-minimum hours, mode multiplier) whose branches are
          exercised on one endpoint by two offers — 180000 cents through the
          fatigue branch and 25422 cents through the max() mode-minimum branch.
        test_recipe:
          setup:
            - "Station 43 with a 9,000,000-cent budget and one company ENGINE-43 (minimum_crew_size 2, requiring HAZMAT_TECH, closure_priority 10)."
            - "A VOLUNTARY_OT roster and a CALLBACK roster, both with certification_scope NONE."
            - "Member ff43a: platoon C, Kelly position 1, holds HAZMAT_TECH, hourly rate 4237 cents, already holding a REGULAR 24-hour seat on the 2026-08-11 shift."
            - "Member ff43b: platoon C, Kelly position 2, holds no certifications, hourly rate 4237 cents, holding no seat at all."
            - "The 2026-08-12 shift (platoon D) is published with two OPEN vacancies: seat 1 requiring HAZMAT_TECH and seat 2 requiring NONE."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 43", battalion_code: "B4", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st43: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st43}", unit_designation: "ENGINE-43", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: ["HAZMAT_TECH"], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng43: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st43}", full_name: "E Estrada", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: ["HAZMAT_TECH"], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff43a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st43}", full_name: "F Fox", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff43b: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st43}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st43}", roster_type: "CALLBACK", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st43}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh43a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh43a}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh43a_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh43a}", firefighter_id: "${ff43a}", apparatus_id: "${eng43}", assignment_type: "REGULAR", seat_certification: "HAZMAT_TECH", scheduled_hours: 24, expected_duty_shift_version: "${sh43a_v}" }
              as: CompanyOfficer
              as_user_id: "${ff43a}"
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st43}", shift_date: "2026-08-12", platoon: "D" }
              as: StaffingOfficer
              captures: { sh43b: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh43b}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh43b}", required_certification: "HAZMAT_TECH", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac43haz: "$.data[0].id" }
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh43b}", required_certification: "NONE", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac43none: "$.data[0].id" }
          trigger:
            - call: "POST /fire-ops/vacancies/${vac43haz}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off43haz: "$.data.id" }
            - call: "POST /fire-ops/vacancies/${vac43none}/offer"
              payload: { hiring_mode: "CALLBACK", offer_hours: 2 }
              as: StaffingOfficer
              captures: { off43none: "$.data.id" }
          assert:
            - "OvertimeOffer.${off43haz}.firefighter_id == ${ff43a}"
            - "OvertimeOffer.${off43haz}.projected_cost_cents == 180000 — effective rate round_half_up(4237 * 1.18) == 5000 (8 percent HAZMAT_TECH plus 10 percent fatigue on the merged 48-hour tour), then 5000 * 24 * 1.5"
            - "OvertimeOffer.${off43none}.firefighter_id == ${ff43b}"
            - "OvertimeOffer.${off43none}.offer_hours == 2 while the priced hours are max(2, 3) == 3, giving projected_cost_cents == 25422 (4237 * 3 * 2.0, no certification and no fatigue uplift)"
            - "Station.${st43}.ot_committed_cents == 205422"
            - "Rounding order is observable: rounding only once at the end of the first offer would yield 179870, not 180000"

      - name: forecast_rounds_each_vacancy_before_summing
        grounds:
          - calculations.station_overtime_forecast
          - calculations.vacancy_generation
          - entities.Vacancy.fields.required_certification
          - endpoints["GET /fire-ops/stations/{station_id}/overtime-forecast"]
        distinguishing_aspect: |
          Mode (b) of §0.5 Rule 2 — nested rounding whose order changes the cents:
          three horizon vacancies uplifted and rounded individually sum to 489831,
          whereas summing the uplift factors first and rounding once yields 489830,
          and the scaffold pins the per-vacancy order.
        test_recipe:
          setup:
            - "Station 44 with a 9,000,000-cent budget over 2026-08-01 .. 2026-09-30 and a staffing floor of 1."
            - "Three companies of minimum_crew_size 1: ENGINE-44 requiring PARAMEDIC (closure_priority 10), HAZMAT-44 requiring nothing (closure_priority 20), TRUCK-44 requiring TECHNICAL_RESCUE (closure_priority 30)."
            - "Three ACTIVE members with hourly rates 4237, 3916 and 4602 cents, giving avg_rate_cents 4252 and shift_base_cents 153072."
            - "One shift on 2026-08-23 published, producing exactly three OPEN vacancies with required_certification PARAMEDIC, NONE and TECHNICAL_RESCUE."
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the 2026-08-23 shift is inside the remaining fiscal horizon."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 44", battalion_code: "B5", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st44: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st44}", unit_designation: "ENGINE-44", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: ["PARAMEDIC"], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng44: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st44}", unit_designation: "HAZMAT-44", apparatus_type: "HAZMAT", minimum_crew_size: 1, required_certifications: [], closure_priority: 20 }
              as: StaffingOfficer
              captures: { haz44: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st44}", unit_designation: "TRUCK-44", apparatus_type: "LADDER", minimum_crew_size: 1, required_certifications: ["TECHNICAL_RESCUE"], closure_priority: 30 }
              as: StaffingOfficer
              captures: { trk44: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st44}", full_name: "G Gomez", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: ["PARAMEDIC"], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff44a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st44}", full_name: "H Hale", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: ["TECHNICAL_RESCUE"], hourly_rate_cents: 3916 }
              as: StaffingOfficer
              captures: { ff44b: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st44}", full_name: "I Ibarra", rank: "ENGINEER", platoon: "C", seniority_rank: 3, kelly_day_cycle_position: 4, certifications: [], hourly_rate_cents: 4602 }
              as: StaffingOfficer
              captures: { ff44c: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st44}", shift_date: "2026-08-23", platoon: "C" }
              as: StaffingOfficer
              captures: { sh44: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh44}/publish"
              payload: {}
              as: StaffingOfficer
          trigger:
            - call: "GET /fire-ops/stations/${st44}/overtime-forecast"
              payload: { method: "VACANCY_DRIVEN" }
              as: StaffingOfficer
          assert:
            - "avg_rate_cents == 4252 (round_half_up of 12755/3 == 4251.667)"
            - "shift_base_cents == 153072"
            - "horizon_vacancy_count == 3"
            - "vacancy_driver_cents == 489831 — 171441 + 153072 + 165318, each vacancy uplifted and rounded before summation"
            - "vacancy_driver_cents != 489830, the value produced by summing the uplift factors (3.20) and rounding once"
            - "injury_driver_cents == 0 and forecast_cents == 489831"
            - "projected_period_total_cents == 489831, variance_cents == 8510169, forecast_posture == \"WITHIN\""

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_request_revision_cycle_increments_revision_count_twice
        grounds:
          - state_machines.TradeRequest.COUNTERSIGNED_to_PROPOSED
          - state_machines.TradeRequest.PROPOSED_to_COUNTERSIGNED
          - entities.TradeRequest.fields.revision_count
          - endpoints["POST /fire-ops/trade-requests/{trade_request_id}/decision"]
        distinguishing_aspect: |
          The non-linearity is a cycle on the TradeRequest entity:
          PROPOSED -> COUNTERSIGNED -> PROPOSED traversed twice, with
          revision_count reaching 2 and the underlying seat never changing hands.
        test_recipe:
          setup:
            - "Station 45 with one company ENGINE-45 (minimum_crew_size 2, no required certifications) and a staffing floor of 1."
