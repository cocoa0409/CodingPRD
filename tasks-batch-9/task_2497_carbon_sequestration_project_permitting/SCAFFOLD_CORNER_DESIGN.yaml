          - errors.ERR_INVALID_PLAN_STATE
          - entities.MonitoringPlan.fields.revision_round_count
        distinguishing_aspect: |
          Re-issuing the same submit against a plan already in SUBMITTED is refused at priority 63 with
          HTTP 409 ERR_INVALID_PLAN_STATE rather than being silently re-applied, so
          revision_round_count stays at 1 and the two review-track flags stay false.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with one MonitoringPlan MRV-1 in status SUBMITTED after a single submit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
