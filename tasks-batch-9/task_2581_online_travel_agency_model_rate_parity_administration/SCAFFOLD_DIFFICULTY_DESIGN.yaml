              as: PlatformAdmin
            - call: "POST /bookings/${bk_t0}/cancel"
              payload: { cancellation_reason: "traveler changed plans" }
              as: BookingAgent
              as_user_id: "ba-1"
          trigger:
            - call: "POST /bookings/${bk_t0}/dispute-cases"
              payload: { dispute_type: "REFUND_PASSTHROUGH", claim_cents: 999999, narrative: "supplier refuses the pass-through share" }
              as: BookingAgent
