    side_effects: []

  - method: GET
    path: "/society/adult-learners/{id}"
    description: "Read one learner."
    roles: [SocietyAdmin, AccreditationReviewer, ProgramDirector, Registrar, AdultLearner]
    code: 200
    input: []
    output: AdultLearner
    side_effects: []

  - method: GET
    path: "/society/adult-learners"
    description: "List learners with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, ProgramDirector, Registrar]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "AdultLearner[]"
    side_effects: []

  - method: POST
    path: "/society/practicum-placements"
    description: "Create a practicum placement directly in ACTIVE. Validates window, learner half-open overlap, supervisor level/active/capacity, host school level. Pins target_hours from the ACTIVE catalog."
    roles: [ProgramDirector]
    code: 201
    input: [learner_id, host_school_id, "supervisor_credential_id?", start_date, end_date]
    output: PracticumPlacement
    side_effects: ["learner ENROLLED -> IN_PRACTICUM"]

  - method: GET
    path: "/society/practicum-placements/{id}"
    description: "Read one placement."
    roles: [SocietyAdmin, ProgramDirector, AdultLearner, Registrar, AccreditationReviewer]
    code: 200
    input: []
