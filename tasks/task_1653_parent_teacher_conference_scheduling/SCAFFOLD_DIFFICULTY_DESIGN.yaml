            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G F", email: "f@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 1 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S2", grade_level: 2 }, as: FrontOfficeStaff, captures: { st2: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S3", grade_level: 3 }, as: FrontOfficeStaff, captures: { st3: $.data.id } }
