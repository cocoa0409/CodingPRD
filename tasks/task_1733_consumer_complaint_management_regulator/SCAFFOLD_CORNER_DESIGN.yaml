  # ===========================================================================
  # Section 9: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_intake_response_contains_final_fields
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /complaint-office/complaints]
        distinguishing_aspect: "Immediate consistency: the POST /complaints 201 response itself contains status INTAKE, owner_user_id of the actor, version 1, and received_at — no later read required to observe the mutation."
        test_recipe:
          setup: ["Product/channel/category exist"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-CM1", display_name: "CM1" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.CM1" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-CM1", channel_code: "WEB", product_code: "P-CM1", category_code: "C.CM1", narrative: "immediate" }
              as: IntakeSpecialist
              as_user_id: "user_cm1"
              captures: { cid: $.data.id }
          assert:
            - "create response data.status == INTAKE"
            - "create response data.owner_user_id == user_cm1"
            - "create response data.version == 1"
            - "create response data.received_at == 2026-08-01T00:00:00Z"
            - "create response envelope contains meta.api_request_id and response_type == object"

      - name: immediate_consistency_cascade_visible_in_same_read_after_trigger
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.RegulatoryReferral.RESPONSE_SUBMITTED_to_REOPENED_BY_REGULATOR
        excluded_because:
          difficulty_instance: transitive_cascade / regulator_reopen_cascades_referral_to_complaint_to_product
          rationale: "Cascade visibility is asserted by the §1.8 instance's post-trigger reads (complaint REOPENED, product count 1) — immediate visibility of the full hop chain."
