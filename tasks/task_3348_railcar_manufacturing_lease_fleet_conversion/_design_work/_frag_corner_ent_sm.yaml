scaffold_corner_design:
  - section: entities
    instances:
      - name: car_type_creation_returns_201_with_computed_status_active
        claim_type: Creation
        grounds:
          - entities.CarType.fields.model_code
          - entities.CarType.fields.status
        distinguishing_aspect: "POST /car-types with all five catalogue fields returns 201 and the persisted CarType carries status ACTIVE, the computed default — a caller-supplied status is never stored."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "GET /api/v1/car-types/${ct_box_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CarType.${ct_box_id}.model_code == \"BOX-100\""
            - "CarType.${ct_box_id}.car_class == \"BOXCAR\""
            - "CarType.${ct_box_id}.build_hours == 10"
            - "CarType.${ct_box_id}.regulatory_life_years == 25"
            - "CarType.${ct_box_id}.line_count_family == \"LINE-A\""
            - "CarType.${ct_box_id}.status == \"ACTIVE\""
            - "CarType.${ct_box_id}.version == 1"

      - name: component_creation_defaults_on_hand_qty_and_reserved_qty_zero
        claim_type: Defaults
        grounds:
          - entities.Component.fields.on_hand_qty
          - entities.Component.fields.reserved_qty
        distinguishing_aspect: "A newly registered Component stores on_hand_qty 0 and reserved_qty 0 from the §1.1 defaults even though the create body carries no stock, and the read-back returns those literals."
        test_recipe:
          setup:
            - "Empty DB; no receipts have landed, so no stock exists for the new part."
          setup_api_calls:
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-200", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws200_id: $.data.id }
          trigger:
            - call: "GET /api/v1/components/${ws200_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Component.${ws200_id}.part_number == \"WS-200\""
            - "Component.${ws200_id}.component_class == \"WHEELSET\""
            - "Component.${ws200_id}.unit_cost_cents == 200000"
            - "Component.${ws200_id}.lead_time_days == 10"
            - "Component.${ws200_id}.on_hand_qty == 0"
            - "Component.${ws200_id}.reserved_qty == 0"

      - name: car_type_component_requirement_creation_binds_car_type_and_component
        claim_type: Creation
        grounds:
          - entities.CarTypeComponentRequirement.fields.car_type_id
          - entities.CarTypeComponentRequirement.fields.component_id
          - entities.CarTypeComponentRequirement.fields.qty_per_car
        distinguishing_aspect: "The junction row stores both FK ids verbatim and its qty_per_car 4, and the §1.5 side effect recomputes Component.reserved_qty to 0 because no ProductionOrder is RELEASED yet."
        test_recipe:
          setup:
            - "Empty DB; one CarType and one Component exist with no orders against them."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-200", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws200_id: $.data.id }
          trigger:
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws200_id}", qty_per_car: 4 }
              as: ProductionPlanner
              captures: { bom_id: $.data.id }
            - call: "GET /api/v1/car-type-component-requirements/${bom_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/v1/components/${ws200_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "CarTypeComponentRequirement.${bom_id}.car_type_id == \"${ct_box_id}\""
            - "CarTypeComponentRequirement.${bom_id}.component_id == \"${ws200_id}\""
            - "CarTypeComponentRequirement.${bom_id}.qty_per_car == 4"
            - "Component.${ws200_id}.reserved_qty == 0"
            - "Component.${ws200_id}.on_hand_qty == 0"

      - name: production_order_creation_starts_draft_with_forecast_quote
        claim_type: Creation
        grounds:
          - entities.ProductionOrder.fields.status
          - entities.ProductionOrder.fields.unit_price_cents
          - calculations.order_price_quote
        distinguishing_aspect: "POST /production-orders returns 201 with status DRAFT and a server-quoted unit_price_cents of 1275000 (one wheelset BOM row of 4 units at 200000 cents: ceil((4*200000+25000)/100)*100 = 825000, plus 10 build hours at 45000 = 450000, plus a zero change fee), never the omitted client value."
        test_recipe:
          setup:
            - "Empty DB; clock pinned to 2026-09-01, the same day as order_date, so no 120-day forecast lapse applies."
            - "CarType BOX-100 has build_hours 10 and one WHEELSET bill-of-material row (4 per car) so the quote has exactly one line."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-200", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws200_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws200_id}", qty_per_car: 4 }
              as: ProductionPlanner
              captures: { bom_id: $.data.id }
          trigger:
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ProductionOrder.${po_id}.status == \"DRAFT\""
            - "ProductionOrder.${po_id}.unit_price_cents == 1275000"
            - "ProductionOrder.${po_id}.quantity == 1"
            - "ProductionOrder.${po_id}.completed_qty == 0"
            - "ProductionOrder.${po_id}.planned_shop_days == 10"
            - "ProductionOrder.${po_id}.disposition == \"RETAINED\""
            - "ProductionOrder.${po_id}.priority_rank == 1"
            - "ProductionOrder.${po_id}.version == 1"

      - name: substitution_endorsement_creation_starts_pending
        claim_type: Creation
        grounds:
          - entities.SubstitutionEndorsement.fields.status
          - entities.SubstitutionEndorsement.fields.decides_material
          - entities.SubstitutionEndorsement.fields.substitute_qty_per_car
        distinguishing_aspect: "The raised endorsement persists status PENDING and the client-declared decides_material true, and raising it bumps the parent ProductionOrder.version by exactly one per the §1.5 side effect."
        test_recipe:
          setup:
            - "Empty DB; a DRAFT order exists on a car type with WHEELSET and CASTING bill-of-material rows."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-500", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws500_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-600", component_class: "CASTING", unit_cost_cents: 150000, lead_time_days: 20 }
              as: SupplyChainCoordinator
              captures: { cs600_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws500_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${cs600_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
          trigger:
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws500_id}", substitute_component_id: "${cs600_id}", substitute_qty_per_car: 2, decides_material: true, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "user-planner-7"
              captures: { se_id: $.data.id }
            - call: "GET /api/v1/substitution-endorsements/${se_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SubstitutionEndorsement.${se_id}.status == \"PENDING\""
            - "SubstitutionEndorsement.${se_id}.decides_material == true"
            - "SubstitutionEndorsement.${se_id}.substitute_qty_per_car == 2"
            - "SubstitutionEndorsement.${se_id}.production_order_id == \"${po_id}\""
            - "SubstitutionEndorsement.${se_id}.original_component_id == \"${ws500_id}\""
            - "SubstitutionEndorsement.${se_id}.version == 1"
            - "ProductionOrder.${po_id}.version == ${po_v} + 1"
            - "ProductionOrder.${po_id}.status == \"DRAFT\""

      - name: lease_contract_creation_defaults_amendment_seq_and_capital_zero
        claim_type: Defaults
        grounds:
          - entities.LeaseContract.fields.amendment_seq
          - entities.LeaseContract.fields.capital_allocation_cents
          - entities.LeaseContract.fields.status
        distinguishing_aspect: "A drafted contract stores the three §1.1 defaults literally — status DRAFT, amendment_seq 0 and capital_allocation_cents 0 — while echoing the supplied rate and liability bearer."
        test_recipe:
          setup:
            - "Empty DB; one Lessee account exists to own the contract."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Acme Leasing LLC", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 25000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "GET /api/v1/lease-contracts/${lc_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "LeaseContract.${lc_id}.status == \"DRAFT\""
            - "LeaseContract.${lc_id}.amendment_seq == 0"
            - "LeaseContract.${lc_id}.capital_allocation_cents == 0"
            - "LeaseContract.${lc_id}.per_diem_rate_cents == 25000"
            - "LeaseContract.${lc_id}.liability_bearer == \"LESSOR\""
            - "LeaseContract.${lc_id}.lease_type == \"FULL_SERVICE\""
            - "LeaseContract.${lc_id}.version == 1"

      - name: lessee_creation_defaults_outstanding_balance_zero_and_active
        claim_type: Defaults
        grounds:
          - entities.Lessee.fields.outstanding_balance_cents
          - entities.Lessee.fields.status
        distinguishing_aspect: "A new Lessee stores status ACTIVE and outstanding_balance_cents 0, and the entity-backed Lessee role can read its own zero balance through the §1.5 balance endpoint."
        test_recipe:
          setup:
            - "Empty DB; no charges or payments have touched any ledger."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Acme Leasing LLC", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "GET /api/v1/lessees/${lessee_id}/outstanding-balance"
              payload: {}
              as: Lessee
              as_user_id: "${lessee_id}"
          assert:
            - "Lessee.${lessee_id}.status == \"ACTIVE\""
            - "Lessee.${lessee_id}.outstanding_balance_cents == 0"
            - "Lessee.${lessee_id}.credit_tier == \"A\""
            - "Lessee.${lessee_id}.utilization_threshold_pct == 50"
            - "GET /lessees/${lessee_id}/outstanding-balance .settled_charges_cents == 0"
            - "GET /lessees/${lessee_id}/outstanding-balance .credits_applied_cents == 0"

      - name: lease_fleet_car_created_by_retained_order_completion_starts_held
        claim_type: Creation
        grounds:
          - entities.LeaseFleetCar.fields.production_order_id
          - entities.LeaseFleetCar.fields.regulatory_life_end_date
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
        distinguishing_aspect: "There is no POST /lease-fleet-cars: the car row appears only as the §1.2 side effect of completing a RETAINED order, stamped status HELD, acquisition_cost_cents 1275000 (the quoted unit price) and regulatory_life_end_date 2051-09-15 (built 2026-09-15 + 25 years)."
        test_recipe:
          setup:
            - "Empty DB; clock pinned to 2026-09-01; stock is received into the yard so the wheelset reservation can commit."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-200", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws200_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws200_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws200_id}", qty_ordered: 4, unit_cost_cents: 200000, order_date: "2026-09-01", expected_receipt_date: "2026-09-11" }
              as: SupplyChainCoordinator
              captures: { cpo_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders/${cpo_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${cpo_id}", component_id: "${ws200_id}", qty_received: 4, receipt_date: "2026-09-11" }
              as: SupplyChainCoordinator
              captures: { cr_id: $.data.id }
            - call: "POST /api/v1/component-receipts/${cr_id}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LINE-A/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-15" }
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars"
              payload: { production_order_id: "${po_id}" }
              as: PlatformAdmin
              captures: { car_id: "$.data[0].id" }
          assert:
            - "ProductionOrder.${po_id}.status == \"COMPLETED\""
            - "ProductionOrder.${po_id}.completed_qty == 1"
            - "LeaseFleetCar.${car_id}.status == \"HELD\""
            - "LeaseFleetCar.${car_id}.production_order_id == \"${po_id}\""
            - "LeaseFleetCar.${car_id}.acquisition_cost_cents == 1275000"
            - "LeaseFleetCar.${car_id}.built_date == \"2026-09-15\""
            - "LeaseFleetCar.${car_id}.regulatory_life_end_date == \"2051-09-15\""
            - "LeaseFleetCar.${car_id}.accumulated_mileage == 0"
            - "LeaseFleetCar.${car_id}.retrofit_required == false"
            - "LeaseFleetCar.${car_id}.lease_contract_id == null"

      - name: car_assignment_per_diem_rate_input_ignored_snapshot_stored
        claim_type: Computed Fields
        grounds:
          - entities.CarAssignment.fields.per_diem_rate_cents
          - entities.CarAssignment.fields.per_diem_accrued_cents
          - entities.LeaseContract.fields.per_diem_rate_cents
        distinguishing_aspect: "A client-supplied per_diem_rate_cents of 1 on POST /car-assignments is ignored: the stored rate is the contract's snapshot 25000, and the placement starts with per_diem_accrued_cents 0 at zero elapsed days."
        test_recipe:
          setup:
            - "Empty DB; a HELD fleet car and an ACTIVE FULL_SERVICE contract at 25000 cents per day; clock advanced to the placement start date 2026-10-01."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-200", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws200_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws200_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ws200_id}", qty_ordered: 4, unit_cost_cents: 200000, order_date: "2026-09-01", expected_receipt_date: "2026-09-11" }
              as: SupplyChainCoordinator
              captures: { cpo_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders/${cpo_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${cpo_id}", component_id: "${ws200_id}", qty_received: 4, receipt_date: "2026-09-11" }
              as: SupplyChainCoordinator
              captures: { cr_id: $.data.id }
            - call: "POST /api/v1/component-receipts/${cr_id}/receive"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LINE-A/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars"
              payload: { production_order_id: "${po_id}" }
              as: PlatformAdmin
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Acme Leasing LLC", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 25000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-assignments"
