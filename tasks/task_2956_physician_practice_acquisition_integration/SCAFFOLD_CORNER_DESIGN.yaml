      - name: twenty_nine_day_notice_blocks_the_notice_issuance
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PATIENT_NOTICE_LEAD_TIME_SHORT]
          - errors[ERR_PATIENT_NOTICE_COVERAGE_INCOMPLETE]
          - validations[priority=34]
          - validations[priority=35]
          - calculations.patient_notice_coverage
          - state_machines.BillingConversion.status.ATTESTED_to_NOTICES_ISSUED
