            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-C7", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_am: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /restoration/jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_now: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v_now}" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /restoration/estimates/${est_id}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 72, relative_humidity_pct: 38, moisture_content_pct: 15 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EQUIPMENT_STILL_DEPLOYED"

      - name: cancel_from_completed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LossJob.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) job returns ERR_INVALID_STATE (409); no transition from a terminal state."
        test_recipe:
          setup: ["A WATER job driven all the way to COMPLETED."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC8", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-C8", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-C8", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_am: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_dh: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /restoration/jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_now: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 1, unit_price_cents: 5000 } ], expected_job_version: "${job_v_now}" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /restoration/estimates/${est_id}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 72, relative_humidity_pct: 38, moisture_content_pct: 15 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_am}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_dh}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
