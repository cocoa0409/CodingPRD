            - "ReturnLine.${line_id}.disposition == REFURBISH at grading (rule D5) and disposition_state == IN_REFURB once the work order exists"
            - "RefurbWorkOrder.${wo_id}.rework_cycles == 0 after the first start-test (entered from OPEN, not a re-entry)"
            - "RefurbWorkOrder.${wo_id}.rework_cycles == 1 after the second start-test and == 2 after the third — the counter only increments on TEST_FAILED -> IN_TEST"
            - "RefurbWorkOrder.${wo_id}.status == TEST_FAILED and labor_minutes_total == 30 after the third FAIL result"
            - "The fourth start-test returns HTTP 409 with ${err_id} == ERR_REWORK_LIMIT_EXCEEDED, and RefurbWorkOrder.${wo_id}.status is still TEST_FAILED with rework_cycles still 2"
            - "RefurbWorkOrder.${wo_id}.qa_user_id == u_qa and assigned_technician_user_id == u_tech (distinct, so ERR_QA_SELF_INSPECTION never fires)"
            - "After abandon, RefurbWorkOrder.${wo_id}.status == ABANDONED and total_cost_cents == 3278 (round_half_up((30 * 95 + 0 + 0) * 1.15))"
            - "A REFURB_COST ShrinkLedgerEntry of amount_cents == -3278 exists and Client.${c_id}.settlement_balance_cents == -3278 and shrink_ledger_cents == -3278"
            - "ReturnLine.${line_id}.disposition_state == DISPOSITION_ASSIGNED and disposition == LIQUIDATE — the matrix was re-run with refurb_eligible forced false, so D5 no longer applies and D6 (720000 >= 600000) wins"

  # ===================================================================== #
  # RULE 4 — transitive_cascade                                           #
  # Trigger 1: POST /disposition-orders/{id}/execute  (depth 5)            #
  # Trigger 2: POST /catalog-items/{id}/recall MANDATORY (depth 4)         #
  # ===================================================================== #
  - rule_id: transitive_cascade
    instances:
      - name: execute_destroy_order_cascades_to_client_suspension_and_rma_close
        grounds:
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
          - state_machines.ReturnLine.DISPOSITION_ASSIGNED_to_DISPOSITIONED
          - state_machines.ReturnAuthorization.RECEIVED_to_CLOSED
          - calculations.shrink_ledger_entry_amount
          - calculations.client_settlement_balance
          - entities.Client.fields.status
          - validations[priority=19]
        distinguishing_aspect: |
          One execute call produces a five-link chain in which each link is caused by the previous
          one: (1) the order EXECUTES, which (2) drives the ReturnLine to DISPOSITIONED, which
          (3) makes a DESTRUCTION_WRITE_OFF of -20750 appendable, which (4) drops
          Client.settlement_balance_cents to -20750 and therefore below the negated 20000 exposure
          cap so the Client becomes SUSPENDED, which (5) leaves every sibling line DISPOSITIONED so
          the RMA closes — after which the suspended client rejects a brand-new RMA. The other
          transitive_cascade instance originates from a catalog recall, a different trigger.
        test_recipe:
          setup:
            - "Client CLDES: SL_STANDARD, restock_grade_floor B, liquidation_floor_pct 0.90, donation_allowed false, destroy_requires_dual_signoff false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 20000, refund_hold_hours 48."
            - "CatalogItem WIDGET-1 at declared_value_cents 20000, hazard_class NONE, recall_status NONE."
            - "A CERTIFIED_DESTRUCTION channel accepting grades SCRAP and D at fee_pct 0.00, min_lot_value_cents 0, concurrent_lot_capacity 5."
            - "One received line of quantity 1 graded SCRAP, so rule D3 forces disposition DESTROY with provisional recovery 0, and an APPROVED DispositionOrder of disposition DESTROY whose unit_price_cents is 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Destruction Client", client_code: "CLDES", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "B", refund_hold_hours: 48, liquidation_floor_pct: 0.90, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 20000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Certified Destruction Co", channel_code: "DEST1", channel_type: "CERTIFIED_DESTRUCTION", accepted_grades: ["D", "SCRAP"], fee_pct: 0.00, hazard_certified: true, recall_certified: true, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1007", customer_reference: "CUST-7", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
