            - "trigger call 2 shows Certification.${cA} unchanged: program_config_version == 1, fee_surcharge_cents == 30500, fee_charged_cents == 120400, warranty_end_date == 2027-08-01, warranty_end_miles == 74000, retention_expires_at == 2034-08-01"
            - "trigger call 3 pins Certification.${cB}.program_config_version == 2 and bills fee_charged_cents == 230500: base 200000 plus surcharge 30500 (age_over 1 * 12500 + 2 blocks * 9000), which is under the new cap floor(200000 * 0.35) == 70000, and tier pct 0.00 at lifetime_activated_count 1"
            - "Certification.${cB}.warranty_end_date == 2028-08-01 under the 24-month extension, still inside cap_end 2029-02-01, with retention_expires_at 2035-08-01 and warranty_end_miles 74000 (warranty_extension_miles was not changed)"
            - "the two rows differ in fee by 110100 despite identical vehicles, identical odometers and the same activation date, purely because of the pinned generation"
            - "trigger call 4 shows Dealer.${d1}.fee_billed_cents_total == 350900 and fee_balance_cents == 350900"

      - name: reconditioning_reimbursement_precision_per_item_rounding
        claim_type: precision
        excluded_because:
          difficulty_instance: reconditioning_reimbursement_round_per_item_then_sum
          rationale: |
            The per-item-then-sum rounding order is exactly what that 1.8 instance isolates: three
            rows at 1001 cents give 601 + 601 + 601 == 1803 rather than round_half_up(3003 * 0.60)
            == 1802, and it also pins the round_half_up direction on the .6 fraction. A separate
            corner test would re-run the same call sequence with the same literals.

      - name: warranty_anchor_variant_divergence_on_boundary_vehicle
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: warranty_anchor_variant_divergence
          rationale: |
            Both warranty_coverage variants are already exercised on one boundary vehicle there:
            IN_SERVICE_ANCHORED when the factory term is live on both axes and CERTIFICATION_ANCHORED
            when either axis has lapsed, with the two divergent end dates asserted side by side.

      - name: claim_ratio_variant_selection_at_volume_floor
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: dealer_claim_ratio_trailing_window_variant
          rationale: |
            The selector claim_variant_volume_floor is driven across its boundary there, and the
            paired instance dealer_claim_ratio_lifetime_cumulative_variant holds the other side, so
            both the choice of variant and its effect on claim_ratio_effective are covered.

      - name: claim_ratio_weighted_into_risk_score
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: dealer_claim_ratio_lifetime_cumulative_variant
          rationale: |
            That instance already asserts claim_ratio_effective and the 0.60/0.40 weighted risk_score
            derived from it on the same dealer, which is the whole of dealer_risk_score's arithmetic.

      - name: claim_reimbursement_evaluation_order
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: claim_reimbursement_snapshot_cap_share_order
          rationale: |
            The circular-looking snapshot-then-pay-then-recount order, the per-certification lifetime
            trim and the probation share are all pinned by that instance with two sequential claims on
            one certification; nothing about the ordering is left untested.

      - name: certification_fee_surcharge_cap_precedes_discount
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: certification_fee_cap_before_volume_discount
          rationale: |
            The pinned evaluation order - cap the surcharge, form the subtotal, then discount the
            capped subtotal - is exactly that instance's subject, including the wrong answer produced
            by discounting the uncapped sum.

      - name: vehicle_coverage_interval_adjacency_allowed
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: vehicle_coverage_window_adjacency_allowed
          rationale: |
            Half-open adjacency on the vehicle coverage axis (candidate_start == retained_end accepted,
            one day earlier rejected with ERR_COVERAGE_WINDOW_OVERLAP) is that instance's exact
            boundary pair.

      - name: technician_buffered_interval_adjacency_forbidden
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: technician_buffered_slot_adjacency_forbidden
          rationale: |
            The opposite convention - closed buffered intervals where touching at 11:30 conflicts and
            11:31 does not - is covered there with both the rejected and the accepted neighbour.

  # ===========================================================================
  # 4. From Table 1.4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: missing_identity_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 1 fires before anything else, including the role check at priority 2 and the
          schema check at priority 4: a request with no X-User-Role, a request with no X-User-ID and
          a request naming a role that is not one of the five declared roles all fail 401
          ERR_UNAUTHENTICATED rather than 403 or 422, even when the body itself is malformed.
        test_recipe:
          setup:
            - "No setup: authentication is decided before any row is read."
          trigger:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: "(X-User-Role header omitted)"
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: "(X-User-ID header omitted)"
            - call: "GET /cpo/program-config"
              payload: {}
              as: "SalesManager (role not declared in 1.7)"
            - call: "POST /cpo/dealers"
              payload: { franchise_code: "FR-1001" }
              as: "(both identity headers omitted)"
          trigger_note: "The as: fields above describe the header state rather than a declared role; every call is expected to be rejected before role resolution."
          assert:
            - "all four calls return 401 with response_type error and data.error_id == ERR_UNAUTHENTICATED"
            - "trigger call 4 omits the required body field name as well, yet still reports ERR_UNAUTHENTICATED and not ERR_INVALID_REQUEST: priority 1 precedes priority 4"
            - "trigger call 3 reports ERR_UNAUTHENTICATED and not ERR_ROLE_FORBIDDEN, because an unrecognized role value fails the header check itself"
            - "no Dealer row is created by any of the four calls"

      - name: prior_use_ineligible_rejected_at_inspection_creation
        claim_type: violation_to_error
        grounds:
          - validations.priority_11
          - errors.ERR_PRIOR_USE_INELIGIBLE
          - entities.ProgramConfig.fields.ineligible_prior_uses
        distinguishing_aspect: |
          Prior use is screened at inspection creation, not deferred to certification: a RENTAL
          vehicle whose title is CLEAN and whose age and mileage are comfortably inside every limit
          is still refused an inspection with 422 ERR_PRIOR_USE_INELIGIBLE. A LEASE vehicle - a value
          of the same enum that is NOT in ineligible_prior_uses - must be accepted on the identical
          request, which distinguishes the configured list from a blanket rule against non-personal use.
        test_recipe:
          setup:
            - "Dealer D1, technician T1, published MPI-172, and two young low-mileage vehicles differing only in prior_use: V_R is RENTAL, V_L is LEASE."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000023", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "RENTAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { vR: $.data.id }
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000024", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "LEASE", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { vL: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${vR}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${vL}", technician_id: "${t2}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 422 with data.error_id == ERR_PRIOR_USE_INELIGIBLE and creates no Inspection row"
            - "creating V_R itself succeeded: the vehicle may exist in inventory, it simply can never be inspected for the program"
            - "trigger call 2 returns 201 with status DRAFT, proving the rejection came from the configured ineligible_prior_uses list and not from prior_use != PERSONAL"
            - "Vehicle.${vR}.cpo_state is still NOT_CERTIFIED after trigger call 1"

      - name: mileage_limits_rejected_above_max_and_below_vehicle_odometer
        claim_type: violation_to_error
        grounds:
          - validations.priority_13
          - errors.ERR_MILEAGE_LIMIT_EXCEEDED
          - entities.Inspection.fields.odometer_at_inspection
        distinguishing_aspect: |
          One rule guards two opposite directions with the same error: 80001 breaks the inclusive
          program ceiling of 80000, and 61999 breaks the monotonicity floor because the vehicle
          already reads 62000 - an odometer cannot have run backwards. Exactly 80000 and exactly
          62000 must both be accepted, so both bounds are inclusive on the legal side.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1..T3, published MPI-172, and vehicle V1 at 62000 miles (canonical V1)."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 80001 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 61999 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 422 ERR_MILEAGE_LIMIT_EXCEEDED: 80001 > max_odometer_miles 80000"
            - "trigger call 2 returns 422 ERR_MILEAGE_LIMIT_EXCEEDED as well, for the opposite reason: 61999 < Vehicle.odometer_miles 62000"
            - "trigger call 3 returns 201 with odometer_at_inspection == 62000, so equality with the vehicle reading is legal"
            - "neither rejected call created an Inspection row, so trigger call 3 is not blocked by priority 15 and T1's slot is free for it"

      - name: inspection_started_at_in_future_rejected
        claim_type: temporal
        grounds:
          - validations.priority_26
          - errors.ERR_INSPECTION_DATE_IN_FUTURE
        distinguishing_aspect: |
          started_at is compared against the logical clock, never against wall-clock time, and the
          comparison is "not after": one second past 2026-08-01T00:00:00Z is rejected while the clock
          instant itself is accepted. Advancing the clock makes the previously illegal instant legal,
          which no wall-clock implementation reproduces.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 and T2, published MPI-172, canonical vehicle V1; the clock still reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-08-01T00:00:01Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-08-01T00:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t2}", template_id: "${tpl}", started_at: "2026-08-01T00:00:01Z", odometer_at_inspection: 62000, parent_inspection_id: "${i1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 422 ERR_INSPECTION_DATE_IN_FUTURE: started_at is one second after the logical clock"
            - "trigger call 2 returns 201 with started_at == 2026-08-01T00:00:00Z and slot_end_at == 2026-08-01T02:00:00Z, so equality with the clock is legal"
            - "trigger call 4 returns 201 for the identical instant that was rejected in call 1, because the clock has moved to 2026-08-05; it supersedes ${i1} so priority 15 is satisfied and its technician T2 has a free slot"
            - "the superseded ${i1} is VOIDED by trigger call 4, releasing T1's slot per calculations.technician_slot_overlap"

      - name: technician_credential_not_active_rejected
        claim_type: conditional
        grounds:
          - validations.priority_27
          - errors.ERR_TECHNICIAN_CREDENTIAL_EXPIRED
          - entities.Technician.fields.credential_status
        distinguishing_aspect: |
          The credential gate is a conjunction re-evaluated on every technician-touching call: status
          must be ACTIVE and credential_expires_at must be STRICTLY after the logical clock. A REVOKED
          technician whose expiry is a year away fails, an ACTIVE technician whose expiry equals the
          clock instant fails, and an ACTIVE technician who was legal at inspection creation fails on
          the very next results call once the clock crosses the expiry - the check is not snapshotted
          at assignment time.
        test_recipe:
          setup:
            - "Dealer D1 with three technicians: T_REV (REVOKED, expires 2027-01-01), T_EDGE (ACTIVE, expires exactly 2026-08-01T00:00:00Z) and T_OK (ACTIVE, expires 2026-08-02T00:00:00Z)."
            - "Published MPI-172 and canonical vehicle V1."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Rev Tech", credential_id: "CR-R", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "REVOKED" }
              as: ProgramAdministrator
              captures: { t_rev: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Edge Tech", credential_id: "CR-E", credential_expires_at: "2026-08-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t_edge: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ok Tech", credential_id: "CR-O", credential_expires_at: "2026-08-02T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t_ok: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t_rev}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t_edge}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t_ok}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t_ok}"
          assert:
            - "trigger call 1 returns 422 ERR_TECHNICIAN_CREDENTIAL_EXPIRED although T_REV's expiry is months away: credential_status REVOKED alone disqualifies"
            - "trigger call 2 returns 422 ERR_TECHNICIAN_CREDENTIAL_EXPIRED: credential_expires_at == the clock is not strictly after it"
            - "trigger call 3 returns 201 with status DRAFT and attempt_count 0"
            - "trigger call 5 returns 422 ERR_TECHNICIAN_CREDENTIAL_EXPIRED: the clock now equals T_OK's expiry, so the assignment made at call 3 no longer authorizes recording results"
            - "Inspection.${i1} is still DRAFT with attempt_count 0 and version unchanged - the rejected results call had no partial effect"
            - "Technician.${t_ok}.completed_inspection_count == 0"

      - name: second_open_inspection_for_same_vehicle_rejected
        claim_type: cross-entity
        grounds:
          - validations.priority_15
          - errors.ERR_INSPECTION_ALREADY_OPEN
        distinguishing_aspect: |
          The uniqueness constraint spans entities and is conditional on the request body: a vehicle
          may hold only one inspection in DRAFT, IN_PROGRESS or RECONDITIONING_REQUIRED, and the only
          escape is a request that names the open row as parent_inspection_id. The same POST body
          therefore returns 409 or 201 depending purely on that one optional field, and the escape
          hatch consumes the parent by voiding it.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1..T3, published MPI-172, canonical vehicle V1, and inspection I1 left in DRAFT."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ben Tech", credential_id: "CR-2", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t2: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
