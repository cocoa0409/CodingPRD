      - name: sm_guarded_transition_finalize_initial_requires_clearance
        claim_type: guarded_transitions
        grounds:
          - state_machines.Provider.application_status.CHECKS_CLEARED_to_INITIAL_INSPECTION_PASSED
          - validations.priority_55_ERR_CLEARANCE_INCOMPLETE
        excluded_because:
          difficulty_instance: cross_entity_inspection_finalize_requires_provider_clearance
          rationale: "The §1.8 instance already drives the cross-entity guard on this exact edge — finalizing an INITIAL inspection while a BackgroundCheck of a StaffMember leaves the provider without clearance — and asserts both the ERR_CLEARANCE_INCOMPLETE refusal and the success after the clearance is restored. A breadth copy would repeat that setup verbatim."

      - name: sm_cross_entity_substantiated_determination_cites_a_violation
        claim_type: cross_entity
        grounds:
          - state_machines.Complaint.UNDER_INVESTIGATION_to_DETERMINED
          - global_constants.COMPLAINT_CATEGORY_CHECKLIST_CODE
        excluded_because:
          difficulty_instance: cascade_substantiation_to_auto_violation_to_counters_to_enforcement
          rationale: "The four-link cascade from a SUBSTANTIATED determination through the auto-cited violation, the provider counters and the auto-proposed EnforcementAction is exercised end-to-end by that §1.8 instance, which also pins the recomputed FINAL score of the target inspection."

      - name: sm_ledger_sync_point_counters_track_every_disposition
        claim_type: ledger_sync
        grounds:
          - entities.Provider.fields.open_violation_points
          - entities.Provider.fields.resolved_violation_points
          - calculations.violation_point_conservation
        excluded_because:
          difficulty_instance: invariant_violation_points_lifetime_equals_open_plus_resolved
          rationale: "That §1.8 instance reconciles the provider's point ledger before and after each disposition class and proves lifetime == open + resolved holds after VERIFIED_CORRECTED, UNCORRECTED and VACATED, which is exactly the ledger-sync claim."

      - name: sm_compensation_vacated_appeal_restores_capacity
        claim_type: compensation
        grounds:
          - state_machines.Provider.license_status.SUSPENDED_to_PROBATION
          - calculations.capacity_slot_conservation
        excluded_because:
          difficulty_instance: invariant_capacity_slots_conserved_across_suspension_and_appeal
          rationale: "The undo path — a VACATED appeal returning capacity_held_slots to licensed_capacity and reinstating the licence to PROBATION with no slot drift — is fully asserted by that §1.8 instance, including the conserved sum at every step."

  # ---------------------------------------------------------------------------
  # Guide section 3 — From Table 3 (Calculations), plus the algorithm-type rows
  # actually declared in §1.3 (threshold, chronological, aggregation,
  # constraint_propagation) and the dual-variant rows.
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: calc_correct_result_warning_fine_stays_in_tier_one
        claim_type: correct_result
        grounds:
          - calculations.enforcement_fine_amount
          - calculations.enforcement_ladder_step
          - entities.EnforcementAction.fields.basis_points
          - endpoints.POST /licensing/enforcement-actions
        distinguishing_aspect: "At exactly WARNING_THRESHOLD the fine lands in tier T1, where SURCHARGE_PCT and CREDIT_PCT are both 0.0, so fine_amount_cents is the bare gross 37500 — the surcharge-then-credit arithmetic must not alter a T1 amount."
        test_recipe:
          setup:
            - "A CENTER provider carrying exactly 15 open violation points from one FINALIZED ANNUAL inspection with a single CRITICAL PRESCHOOL citation; clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Nap room left unattended." }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins}/finalize"
              as: LicensingSupervisor
          trigger:
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "WARNING", source_inspection_id: "${ins}", rationale: "First supervision failure." }
              as: LicensingSupervisor
              captures: { act: $.data.id, bp: $.data.basis_points, fine: $.data.fine_amount_cents, step: $.data.ladder_step }
          assert:
            - "${bp} == 15 — basis_points is frozen at Provider.open_violation_points at proposal time"
            - "${step} == 1 (LADDER_STEP[WARNING])"
            - "${fine} == 37500 — gross = FINE_BASE_CENTS[WARNING] 0 + PER_POINT_CENTS 2500 * 15, tier T1, surcharge 0, credit 0"
            - "EnforcementAction.${act}.status == PROPOSED with proposed_at == 2026-08-05T09:00:00Z"
            - "EnforcementAction.${act}.action_type == WARNING and appeal_deadline_at == null"
            - "Provider.${prov}.current_ladder_step == 0 — a proposal does not move the ladder"

      - name: calc_input_set_filtering_finalized_inspection_releases_its_window
        claim_type: input_set_filtering
        grounds:
          - calculations.inspector_schedule_conflict_window
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - state_machines.Inspection.PENDING_REVIEW_to_FINALIZED
        distinguishing_aspect: "The conflict calculation's active_set is exactly {SCHEDULED, IN_PROGRESS}: the identical slot is refused with ERR_INSPECTOR_DOUBLE_BOOKED while the incumbent is SCHEDULED and accepted once that incumbent reaches FINALIZED, with nothing else changed between the two attempts."
        test_recipe:
          setup:
            - "Inspector X holds a SCHEDULED ANNUAL visit at provider A for 2026-08-10T09:00:00Z (default 120 minutes); provider B exists for the competing request; clock 2026-08-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Provider A", county_code: "CTY-01", site_address: "1 A St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Provider B", county_code: "CTY-01", site_address: "2 B St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov_b: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_e: $.data.id, win_end: $.data.visit_window_end }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { e_dbl: $.data.error_id }
            - call: "POST /licensing/inspections/${ins_e}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_e}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_e}/finalize"
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_new: $.data.id }
          assert:
            - "${win_end} == 2026-08-10T11:00:00Z"
            - "${e_dbl} == ERR_INSPECTOR_DOUBLE_BOOKED with HTTP 409 while ${ins_e} is SCHEDULED"
            - "Inspection.${ins_e}.status == FINALIZED after the third and fourth calls"
            - "The final call returns HTTP 201: Inspection.${ins_new}.scheduled_for == 2026-08-10T09:00:00Z and visit_window_end == 2026-08-10T11:00:00Z"
            - "Inspection.${ins_new}.status == SCHEDULED and provider_id == ${prov_b}"

      - name: calc_constants_applied_empty_room_needs_zero_staff
        claim_type: constants_applied
        grounds:
          - calculations.ratio_group_size_supervision_verification
          - global_constants.AGE_GROUP_RATIO
          - endpoints.POST /licensing/age-group-rosters/{roster_id}/verify-ratio
          - validations.priority_57_ERR_SUPERVISION_INELIGIBLE_LEAD
        distinguishing_aspect: "With enrolled_count 0 the ceil(0 / AGE_GROUP_RATIO[PRESCHOOL]) term is 0, so a room with zero children and zero assigned staff is ratio_compliant and verify-ratio returns 200 — the compliance flags must not treat 'no staff' as a failure."
        test_recipe:
