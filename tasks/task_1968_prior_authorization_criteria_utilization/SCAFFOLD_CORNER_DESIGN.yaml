            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000035", name: "P" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1", captures: { st: $.data.status, det_at: $.data.determined_at } }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det_outcome: "$.data[0].outcome", det_status: "$.data[0].status" } }
          assert:
            - "st == APPROVED and det_at == 2026-08-01T00:00:00.000Z in the decision response itself"
            - "det_outcome == APPROVED and det_status == FINAL on the immediate follow-up read"
