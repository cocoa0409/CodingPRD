            - { call: "POST /fsa/farms/${farm_id}/disaster-applications", payload: { program_year: 2026, disaster_type: "FLOOD", loss_acres: 35.00, qualifying_commodity: "CORN", documentation_complete: true }, as: Producer, as_user_id: "${prod_p}", captures: { da_id: "$.data.id" } }
            - { call: "POST /fsa/disaster-applications/${da_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
