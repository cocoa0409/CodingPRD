  # =========================================================================
  # RULE 3 — non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dye_lot_redye_revision_loop_bounded_by_max_redye_count
        grounds:
          - state_machines.DyeLot.MEASURED_to_REDYE_QUEUED
          - state_machines.DyeLot.REDYE_QUEUED_to_DYEING
          - state_machines.DyeLot.DYEING_to_MEASURED
          - state_machines.DyeLot.MEASURED_to_APPROVED
          - calculations.shade_band_assignment
          - entities.DyeLot.fields.redye_count
          - entities.DyeLot.fields.parent_dye_lot_id
          - errors[ERR_REDYE_LIMIT_REACHED]
          - concurrency_rules[dye-measurement-stale-lot]
        distinguishing_aspect: |
          The DyeLot walks MEASURED -> REDYE_QUEUED -> DYEING -> MEASURED twice, re-entering DYEING
          from a later state than its initial FORMULATED entry and incrementing redye_count each
          time; the third REDYE request is refused with ERR_REDYE_LIMIT_REACHED at redye_count == 2,
          proving the cycle is bounded rather than infinite.
        test_recipe:
          setup:
            - "Piece-dyed style ST-PD-01 ACTIVE with ProductionRun PR-01 in status BACKED."
            - "DyeVessel DV-01 (capacity 2000.0) and DyeLot DL-01 (lot_kg 400.0, dyed_yards 400.0, target L*a*b* 55.00/12.00/-8.00) in status FORMULATED."
            - "Logical clock at 2026-08-06T08:00:00Z, inside DL-01's dye window."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
