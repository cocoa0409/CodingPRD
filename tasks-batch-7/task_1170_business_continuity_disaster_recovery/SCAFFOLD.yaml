  - { method: GET, path: "/resilience/gaps", description: "List gaps", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["process_id?", "capability_id?", "finding_id?", "status?", "severity?", "closed_by_contact_id?", "limit?", "offset?"], output: "Gap[]", side_effects: [] }
  - { method: GET, path: "/resilience/gaps/{gapId}", description: "Get a gap", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Gap, side_effects: [] }
  - { method: POST, path: "/resilience/gaps/{gapId}/start", description: "OPEN -> IN_PROGRESS", roles: [PlanAuthor], code: 200, input: [], output: Gap, side_effects: ["increments Gap.version by 1"] }
  - { method: POST, path: "/resilience/gaps/{gapId}/reopen", description: "IN_PROGRESS -> OPEN (revision loop)", roles: [PlanAuthor], code: 200, input: [], output: Gap, side_effects: ["increments Gap.version by 1"] }
  - { method: POST, path: "/resilience/gaps/{gapId}/close", description: "OPEN/IN_PROGRESS -> CLOSED", roles: [RiskCommittee], code: 200, input: [], output: Gap, side_effects: ["sets closed_by_contact_id", "gap-backlog aggregates + validation_freshness recompute", "increments Gap.version by 1"] }
  - { method: POST, path: "/resilience/gaps/{gapId}/accept-risk", description: "OPEN/IN_PROGRESS -> ACCEPTED_RISK", roles: [RiskCommittee], code: 200, input: [], output: Gap, side_effects: ["gap-backlog aggregates refresh", "increments Gap.version by 1"] }

  # ---- comm nodes ----
  - { method: POST, path: "/resilience/comm-nodes", description: "Add a node to a crisis comms tree (one root per tree_label; cycle-free)", roles: [CrisisOfficer], code: 201, input: [tree_label, contact_name, role_title, parent_node_id, order_index, channel, ack_deadline_minutes, "active_flag?"], output: CommNode, side_effects: [] }
  - { method: GET, path: "/resilience/comm-nodes", description: "List comm nodes", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["tree_label?", "parent_node_id?", "active_flag?", "limit?", "offset?"], output: "CommNode[]", side_effects: [] }
  - { method: GET, path: "/resilience/comm-nodes/{nodeId}", description: "Get a comm node", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: CommNode, side_effects: [] }
  - { method: PUT, path: "/resilience/comm-nodes/{nodeId}", description: "Update a comm node (re-parent cycle check; deactivation requires inactive children)", roles: [CrisisOfficer], code: 200, input: ["contact_name?", "role_title?", "parent_node_id?", "order_index?", "channel?", "ack_deadline_minutes?", "active_flag?"], output: CommNode, side_effects: ["increments CommNode.version by 1"] }

  # ---- activations ----
  - { method: POST, path: "/resilience/activations", description: "Activate the crisis comms tree for a process; fans out one Notification per active CommNode of TREE_<process.name>", roles: [CrisisOfficer], code: 201, input: [process_id, declared_severity, activation_criterion, criterion_justification], output: Activation, side_effects: ["pins plan_id := the process's APPROVED plan", "creates Notifications (SENT) in tree order (order_index ASC at each level, breadth-first); sets expected_notifications/notified_count", "auto-transitions ACTIVE -> ALL_NOTIFIED after fan-out (and ALL_NOTIFIED -> ACKNOWLEDGED immediately when expected_notifications == 0)", "increments Activation.version by 1"] }
  - { method: GET, path: "/resilience/activations", description: "List activations", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["process_id?", "status?", "declared_severity?", "plan_id?", "deactivated_by_contact_id?", "limit?", "offset?"], output: "Activation[]", side_effects: [] }
  - { method: GET, path: "/resilience/activations/{activationId}", description: "Get an activation (counters + coverage per calculations.activation_ack_coverage)", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Activation, side_effects: [] }
  - { method: POST, path: "/resilience/activations/{activationId}/deactivate", description: "ACTIVE/ALL_NOTIFIED/ACKNOWLEDGED -> DEACTIVATED", roles: [CrisisOfficer], code: 200, input: [], output: Activation, side_effects: ["sets deactivated_by_contact_id", "increments Activation.version by 1"] }
  - { method: GET, path: "/resilience/activations/{id}/notifications", description: "Notifications of an activation", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: "Notification[]", side_effects: [] }

  # ---- notifications ----
  - { method: GET, path: "/resilience/notifications", description: "List notifications", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["activation_id?", "comm_node_id?", "status?", "limit?", "offset?"], output: "Notification[]", side_effects: [] }
  - { method: GET, path: "/resilience/notifications/{notificationId}", description: "Get a notification (includes ack_token)", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Notification, side_effects: [] }
  - { method: POST, path: "/resilience/notifications/{notificationId}/ack", description: "SENT -> ACKED (token-checked); bubbles the activation to ACKNOWLEDGED when the last ack lands", roles: [CrisisOfficer], code: 200, input: [ack_token], output: Notification, side_effects: ["sets acked_at", "Activation.acked_count += 1; at parity with expected_notifications the activation -> ACKNOWLEDGED (version+1)"] }

  # ---- attestations ----
  - { method: POST, path: "/resilience/attestations", description: "Create an attestation for a period (DRAFT)", roles: [AttestationSigner], code: 201, input: [process_id, attestation_type, period_start, period_end, "signer_declaration?"], output: Attestation, side_effects: ["computes readiness_score per calculations.attestation_readiness"] }
  - { method: GET, path: "/resilience/attestations", description: "List attestations", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["process_id?", "attestation_type?", "status?", "signed_by_contact_id?", "limit?", "offset?"], output: "Attestation[]", side_effects: [] }
  - { method: GET, path: "/resilience/attestations/{attestationId}", description: "Get an attestation (readiness_score recomputed on read while DRAFT)", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Attestation, side_effects: ["recomputes readiness_score while DRAFT"] }
  - { method: POST, path: "/resilience/attestations/{attestationId}/sign", description: "DRAFT -> SIGNED (readiness gate >= 70); captures immutable snapshot_payload", roles: [AttestationSigner], code: 200, input: [signer_declaration], output: Attestation, side_effects: ["sets signed_by_contact_id", "captures snapshot_payload", "increments Attestation.version by 1"] }
  - { method: POST, path: "/resilience/attestations/{attestationId}/revoke", description: "SIGNED -> REVOKED (SoD: revoker != signer)", roles: [RiskCommittee], code: 200, input: ["revoked_reason?"], output: Attestation, side_effects: ["increments Attestation.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint, or entity_backed role acting with a non-existent Contact id where identity matters" }
  - { id: ERR_CONTACT_NOT_FOUND, http: 404, condition: "Referenced contact id does not exist" }
  - { id: ERR_PROCESS_NOT_FOUND, http: 404, condition: "Referenced process id does not exist" }
  - { id: ERR_BIA_NOT_FOUND, http: 404, condition: "Referenced BIA id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced plan id does not exist" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "Referenced plan-section id does not exist (within an existing plan)" }
  - { id: ERR_DEPENDENCY_NOT_FOUND, http: 404, condition: "Referenced dependency id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "Referenced third-party id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Referenced assessment id does not exist" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Referenced alternate-site id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Referenced site-reservation id does not exist" }
  - { id: ERR_EXERCISE_NOT_FOUND, http: 404, condition: "Referenced exercise id does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "Referenced finding id does not exist" }
  - { id: ERR_CAPABILITY_NOT_FOUND, http: 404, condition: "Referenced recovery-capability id does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "Referenced validation-run id does not exist" }
  - { id: ERR_GAP_NOT_FOUND, http: 404, condition: "Referenced gap id does not exist" }
  - { id: ERR_NODE_NOT_FOUND, http: 404, condition: "Referenced comm-node id does not exist" }
  - { id: ERR_ACTIVATION_NOT_FOUND, http: 404, condition: "Referenced activation id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Referenced notification id does not exist" }
  - { id: ERR_ATTESTATION_NOT_FOUND, http: 404, condition: "Referenced attestation id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, or signer_declaration false/absent at signing" }
  - { id: ERR_VALIDATION, http: 400, condition: "Field constraint violated: enum out of domain, non-positive integer where positivity required, end <= start window, negative rto/rpo, cross-referenced entities inconsistent (finding process != exercise process, exercise plan of a different process, capability_ref_id of the wrong kind); on POST /recovery-capabilities and POST /findings the http status is 422" }
  - { id: ERR_MTPD_BELOW_RTO, http: 422, condition: "BIA mtpd_hours < rto_target_hours" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the invoked transition exists (includes terminal-state lockdown and update-state guards)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation-of-duties breach: same Contact attempted a step forbidden to the previous step's actor (BIA decide vs current decider, assessment finalize vs vendor owner, reservation release vs creator, attestation revoke vs signer)" }
  - { id: ERR_PROCESS_NOT_ACTIVE, http: 409, condition: "Referenced Process not ACTIVE for an operation that requires it (BIA submit, plan submit, exercise create, activation create)" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Referenced ThirdParty not ACTIVE at assessment finalize" }
  - { id: ERR_CAPABILITY_TARGETS_UNKNOWN, http: 422, condition: "Standalone ValidationRun cannot resolve targets: process has neither an APPROVED BIA nor an APPROVED Plan" }
  - { id: ERR_PLAN_NOT_APPROVED_FOR_EXERCISE, http: 409, condition: "Exercise references a Plan that is not APPROVED at scheduling/reschedule/completion time" }
  - { id: ERR_READINESS_BELOW_THRESHOLD, http: 422, condition: "attestation_readiness < 70 at signing" }
  - { id: ERR_REQUIRED_SECTION_MISSING, http: 422, condition: "Plan lacks one of RECOVERY_STRATEGY / DEPENDENCY_MAP / COMMS_PLAN at submit" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: vendor/site/contact name-or-email, (process, cycle_label) for live BIAs, (process, version_no) for live plans, (plan, order_index) sections, (tree_label, parent, order_index) comm nodes" }
  - { id: ERR_DEPENDENCY_CYCLE, http: 422, condition: "New dependency edge would close a directed cycle in the process dependency graph" }
  - { id: ERR_DEPENDENCY_SELF_LOOP, http: 422, condition: "from_process_id == to_process_id" }
  - { id: ERR_TREE_ROOT_EXISTS, http: 409, condition: "A root (parent_node_id null) already exists for this tree_label" }
  - { id: ERR_COMM_TREE_CYCLE, http: 422, condition: "Re-parenting would make a CommNode its own ancestor" }
  - { id: ERR_NODE_HAS_ACTIVE_CHILDREN, http: 409, condition: "Deactivating a CommNode while any child has active_flag true" }
  - { id: ERR_ACK_TOKEN_MISMATCH, http: 403, condition: "ack_token does not match the notification's issued token" }
  - { id: ERR_NOTIFICATION_ALREADY_ACKED, http: 409, condition: "Notification already in ACKED" }
  - { id: ERR_CRITERION_NOT_ALLOWED, http: 422, condition: "declared_severity does not permit the requested activation_criterion (SEV1 -> {A,B}, SEV2 -> {A}, SEV3 -> {})" }
  - { id: ERR_NO_APPROVED_PLAN, http: 422, condition: "Activation requested for a process with no APPROVED plan" }
  - { id: ERR_ACTIVATION_ALREADY_ACTIVE, http: 409, condition: "A non-terminal Activation already exists for the process" }
  - { id: ERR_PROCESS_HAS_OPEN_ITEMS, http: 409, condition: "Process retire blocked by APPROVED plans, SUBMITTED BIAs, live exercises, or live activations" }
  - { id: ERR_SITE_HAS_ACTIVE_RESERVATIONS, http: 409, condition: "Site retire blocked by CONFIRMED reservations" }
  - { id: ERR_PLAN_HAS_ACTIVE_EXERCISE, http: 409, condition: "Plan retire blocked by SCHEDULED/IN_PROGRESS exercises referencing it" }
  - { id: ERR_PLAN_HAS_LIVE_ACTIVATION, http: 409, condition: "Plan retire blocked by a live activation of its process" }
  - { id: ERR_CAPABILITY_HAS_OPEN_GAPS, http: 409, condition: "mark-remediated blocked by non-terminal gaps linked to the capability" }
  - { id: ERR_SITE_WINDOW_OVERLAP, http: 409, condition: "CONFIRMED reservation overlaps (half-open) another CONFIRMED reservation of the same process on the same site" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 422, condition: "Aggregate overlapping CONFIRMED seats plus requested seats exceed site capacity_seats" }
  - { id: ERR_EXERCISE_WINDOW_OVERLAP, http: 409, condition: "FAILOVER exercise window overlaps (closed-interval; touching endpoints count) another FAILOVER exercise of the same process" }
  - { id: ERR_SITE_CONTRACT_EXPIRED, http: 422, condition: "Reservation ends_at after the site's contracted_through" }
  - { id: ERR_PLAN_TARGETS_UNAPPROVED_BIA, http: 422, condition: "Plan approval requires target_bia_id to resolve to an APPROVED BIA" }
  - { id: ERR_PLAN_EXCEEDS_BIA_RTO, http: 422, condition: "Plan.rto_committed_hours > target BIA.rto_target_hours at approval" }
  - { id: ERR_PLAN_EXCEEDS_BIA_RPO, http: 422, condition: "Plan.rpo_committed_hours > target BIA.rpo_target_hours at approval" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ResilienceAdmin
    description: "Enterprise resilience office administrator; owns process registry, dependency graph, site retirement, contacts, and the test clock"
    identity: opaque
    exclusive_operations: ["process create/update/activate/suspend/resume/retire", "dependency create/delete", "alternate-site retire", "contact create", "clock set"]
    shared_operations: ["all GET endpoints"]
  - name: BIAAnalyst
    description: "Business impact analyst; authors and submits BIAs"
    identity: "entity_backed:Contact"
    exclusive_operations: ["BIA create/update/submit"]
    shared_operations: ["all GET endpoints"]
  - name: PlanAuthor
    description: "Continuity plan author; drafts plans and sections, remediates findings, registers capabilities and gaps"
    identity: "entity_backed:Contact"
    exclusive_operations: ["plan create/update/submit", "plan-section create/update/delete", "finding remediate", "recovery-capability create/mark-remediated", "gap create/start/reopen"]
    shared_operations: ["all GET endpoints"]
  - name: PlanApprover
    description: "Plan approval authority distinct from authors"
    identity: "entity_backed:Contact"
    exclusive_operations: ["plan approve/reject/retire"]
    shared_operations: ["all GET endpoints"]
  - name: RiskCommittee
    description: "Risk committee member; decides BIAs, verifies findings, closes gaps, revokes attestations"
    identity: "entity_backed:Contact"
    exclusive_operations: ["BIA decide", "finding verify/reject", "gap close/accept-risk", "attestation revoke"]
    shared_operations: ["all GET endpoints"]
  - name: ExerciseOfficer
    description: "Exercise planner; schedules and runs exercises, records findings and validation runs"
    identity: "entity_backed:Contact"
    exclusive_operations: ["exercise create/update/start/complete/cancel", "finding create", "validation-run create"]
    shared_operations: ["all GET endpoints"]
  - name: SiteCoordinator
    description: "Alternate-site coordinator; manages sites and seat reservations"
    identity: "entity_backed:Contact"
    exclusive_operations: ["alternate-site create", "site-reservation create/release"]
    shared_operations: ["all GET endpoints"]
  - name: VendorManager
    description: "Third-party continuity manager; manages vendors and their assessments"
    identity: "entity_backed:Contact"
    exclusive_operations: ["third-party create/activate/suspend/exit", "assessment create/update/finalize"]
    shared_operations: ["all GET endpoints"]
  - name: CrisisOfficer
    description: "Crisis communication officer; maintains comm trees, activates and deactivates, acknowledges notifications"
    identity: "entity_backed:Contact"
    exclusive_operations: ["comm-node create/update", "activation create/deactivate", "notification ack"]
    shared_operations: ["all GET endpoints"]
  - name: AttestationSigner
    description: "Executive signer for regulatory/customer attestations"
    identity: "entity_backed:Contact"
    exclusive_operations: ["attestation create/sign"]
    shared_operations: ["all GET endpoints"]
