      - name: duplicate_code_is_scoped_globally_per_pdu_per_hall_and_per_cage
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_CODE] (409, Hall.code or Tenant.code already exists globally, or a Busway name / ContainmentZone label / Cage label / SecurityDevice label already exists in its parent scope)"
          - "validations[10] human-readable identifier uniqueness: Hall.code and Tenant.code globally unique; Busway.name unique per pdu_id; ContainmentZone.label and Cage.label unique per hall_id; SecurityDevice.label unique per cage_id"
        distinguishing_aspect: "One error code covers six different uniqueness scopes, and each scope must be exactly the declared one: reusing BW-A1 under the SAME PDU is a conflict while reusing it under a DIFFERENT PDU of the same hall is legal, and reusing CAM-1 in a different cage of the same hall is legal. An implementation that makes busway names hall-unique (or device labels hall-unique) fails the two positive controls."
        test_recipe:
          setup: "Hall CX71 with tenant TN71, PDU-A1 and PDU-B1, busway BW-A1 under PDU-A1, containment zone CA-1, cages CG-1 and CG-2, camera CAM-1 on CG-1."
