scenario: |
  Voter Registration & Election Management: eligibility (citizenship/age/residency),
  party registration, absentee ballot request, Precinct assignment, early voting,
  voting machine failure backup, Ballot Curing, recount.

domain_name: voter-registration
api_prefix: /elections

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim from §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Election
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable election name" }
      - { name: election_date, type: datetime, source: input, description: "Election day (ISO 8601, UTC midnight of the day)" }
      - { name: registration_deadline, type: datetime, source: input, description: "Cutoff after which voters cannot newly register and party changes are frozen" }
      - { name: absentee_request_deadline, type: datetime, source: input, description: "Last instant absentee ballot requests are accepted" }
      - { name: early_voting_starts_at, type: datetime, source: input, description: "Inclusive start of early voting window" }
      - { name: early_voting_ends_at, type: datetime, source: input, description: "Exclusive end of early voting window (must be < election_date)" }
      - { name: ballot_return_deadline, type: datetime, source: input, description: "Last instant a returned absentee ballot is timely; postmark rule does NOT apply — server clock at receive_ballot_return determines timeliness" }
      - { name: cure_deadline, type: datetime, source: input, description: "Last instant a CuringCase can transition to RESOLVED_ACCEPT" }
      - { name: certification_deadline, type: datetime, source: input, description: "Last instant the election can be certified" }
      - { name: state, type: enum, source: system, description: "DRAFT | OPEN_REGISTRATION | EARLY_VOTING | ELECTION_DAY | TALLY | RECOUNT | CERTIFIED", constraints: "Allowed enum closure — every value produced by a state-machine transition" }
      - { name: recount_threshold_pct, type: number, source: input, description: "Margin-of-victory percentage (e.g., 0.005 for 0.5%) at or below which an automatic recount is required", default: 0.005 }
      - { name: total_registered_active, type: integer, source: computed, description: "Count of Voters with status=ACTIVE assigned to a Precinct under this Election" }
      - { name: certified_winner_voter_choice, type: string, source: computed, description: "Choice id with highest reconciled_total; null until CERTIFIED" }

  - name: Precinct
    parent: Election
    common_fields: true
    fields:
      - { name: election_id, type: string, source: system, description: "Parent election id" }
      - { name: code, type: string, source: input, description: "Stable per-election precinct code (unique within election_id)", constraints: "UNIQUE (election_id, code)" }
      - { name: street_pattern, type: string, source: input, description: "Street regex/CIDR pattern that determines residency-based assignment" }
      - { name: capacity_machines, type: integer, source: input, description: "Number of voting machines provisioned at this precinct on election day" }
      - { name: provisional_ballot_count, type: integer, source: computed, description: "Count of BallotCast for this Precinct with method=ELECTION_DAY_PROVISIONAL and status in {CAST, TALLIED, CHALLENGED}" }
      - { name: machine_failure_active, type: boolean, source: computed, description: "True iff any VotingMachine at this precinct currently has status=DOWN" }

  - name: Voter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Voter legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (UTC midnight of the day)" }
      - { name: residency_address, type: string, source: input, description: "Street address used for Precinct assignment via Precinct.street_pattern match" }
      - { name: residency_since, type: datetime, source: input, description: "Date the voter began residing at this address; residency_days = (Election.election_date - residency_since)" }
      - { name: is_citizen, type: boolean, source: input, description: "Citizenship attestation (true required for ACTIVE)" }
      - { name: election_id, type: string, source: input, description: "Election this voter is registering for (foreign key)" }
      - { name: precinct_id, type: string, source: computed, description: "Assigned precinct id; null until residency match succeeds" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | PURGED", constraints: "Enum produced by Voter state machine" }
      - { name: party_affiliation, type: enum, source: system, description: "DEMOCRATIC | REPUBLICAN | INDEPENDENT | UNAFFILIATED; mutated only via /party-registration", default: UNAFFILIATED }
      - { name: party_locked_at, type: datetime, source: system, description: "Snapshot of Election.registration_deadline after which party_affiliation is frozen" }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the actor who performed the PENDING→ACTIVE transition; null while PENDING. Used by SOD check to forbid the same opaque user-id from later adjudicating a CuringCase for this voter." }

  - name: PartyRegistration
    parent: Voter
    common_fields: false  # immutable event log; only id + created_at
    fields:
      - { name: voter_id, type: string, source: system, description: "Voter whose affiliation this row records" }
      - { name: previous_party, type: enum, source: system, description: "Prior party value before this change" }
      - { name: new_party, type: enum, source: input, description: "New party value being set" }
      - { name: actor_role, type: enum, source: system, description: "Role that wrote the change — VoterSelf | RegistrarClerk" }

  - name: AbsenteeBallot
    parent: Voter
    common_fields: true
    fields:
      - { name: voter_id, type: string, source: system, description: "Owning voter" }
      - { name: election_id, type: string, source: system, description: "Election the ballot belongs to" }
      - { name: requested_at, type: datetime, source: system, description: "Server timestamp at request creation" }
      - { name: issued_at, type: datetime, source: system, description: "Server timestamp when ballot was mailed/issued (transition to ISSUED)" }
      - { name: returned_at, type: datetime, source: system, description: "Server timestamp when ballot was received back (transition to RETURNED)" }
      - { name: decided_at, type: datetime, source: system, description: "Server timestamp when ACCEPTED / REJECTED / CURED was finalized" }
      - { name: reason_code, type: enum, source: input, description: "MILITARY | OVERSEAS | DISABILITY | ABSENT | NO_REASON", default: NO_REASON }
      - { name: signature_match, type: enum, source: input, description: "MATCH | MISMATCH | MISSING — supplied on receive endpoint" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | RETURNED | ACCEPTED | REJECTED | CURED" }
      - { name: linked_curing_case_id, type: string, source: system, description: "CuringCase opened when this ballot is RETURNED with non-MATCH signature" }

  - name: CuringCase
    parent: AbsenteeBallot
    common_fields: true
    fields:
      - { name: absentee_ballot_id, type: string, source: system, description: "Ballot under cure" }
      - { name: voter_id, type: string, source: system, description: "Voter who must cure" }
      - { name: election_id, type: string, source: system, description: "Election context (used to enforce cure_deadline)" }
      - { name: defect_code, type: enum, source: system, description: "SIGNATURE_MISMATCH | SIGNATURE_MISSING" }
      - { name: round_count, type: integer, source: system, description: "Number of REVIEW→OPEN_PENDING_VOTER cycles consumed", default: 0 }
      - { name: max_rounds, type: integer, source: system, description: "Hard cap on round_count (default 3)", default: 3 }
      - { name: voter_submission_text, type: string, source: input, description: "Voter-supplied affirmation/signature text on submit-cure" }
      - { name: status, type: enum, source: system, description: "OPEN_PENDING_VOTER | UNDER_REVIEW | RESOLVED_ACCEPT | RESOLVED_REJECT | EXPIRED" }

  - name: BallotCast
    parent: Precinct
    common_fields: true
    fields:
      - { name: precinct_id, type: string, source: system, description: "Precinct where the ballot was cast" }
      - { name: voter_id, type: string, source: system, description: "Voter who cast (one BallotCast per voter per election)" }
      - { name: election_id, type: string, source: system, description: "Election context" }
      - { name: method, type: enum, source: input, description: "EARLY_IN_PERSON | ELECTION_DAY_MACHINE | ELECTION_DAY_PROVISIONAL | ABSENTEE", constraints: "PROVISIONAL used when machine_failure_active=true OR voter status=PENDING" }
      - { name: machine_id, type: string, source: input, description: "VotingMachine.id when method=ELECTION_DAY_MACHINE; null otherwise" }
      - { name: absentee_ballot_id, type: string, source: system, description: "Set when method=ABSENTEE; mirrors the AbsenteeBallot row" }
      - { name: voter_choice, type: string, source: input, description: "Choice identifier (candidate id or option key)" }
      - { name: cast_at, type: datetime, source: system, description: "Server timestamp when cast" }
      - { name: status, type: enum, source: system, description: "CAST | TALLIED | CHALLENGED | INVALIDATED" }
      - { name: challenge_reason, type: enum, source: system, description: "DOUBLE_VOTE | MACHINE_FAILURE | RECOUNT_DISCREPANCY", default: null }

  - name: VotingMachine
    parent: Precinct
    common_fields: true
    fields:
      - { name: precinct_id, type: string, source: system, description: "Precinct the machine is deployed at" }
      - { name: serial_no, type: string, source: input, description: "Unique serial number (UNIQUE globally)", constraints: "UNIQUE serial_no" }
      - { name: status, type: enum, source: system, description: "READY | IN_USE | DOWN | DECOMMISSIONED" }
      - { name: failure_reason, type: enum, source: input, description: "POWER | JAM | TAMPER | OTHER (required when transitioning to DOWN)" }
      - { name: down_since, type: datetime, source: system, description: "Server timestamp set when status→DOWN" }
      - { name: backup_emergency_ballots_issued, type: integer, source: computed, description: "Count of BallotCast with method=ELECTION_DAY_PROVISIONAL where cast_at >= down_since for this machine's precinct" }

  - name: RecountRequest
    parent: Election
    common_fields: true
    fields:
      - { name: election_id, type: string, source: system, description: "Election under recount" }
      - { name: requested_by_role, type: enum, source: system, description: "ElectionBoard (manual petition) | system (automatic threshold trigger)" }
      - { name: petition_count, type: integer, source: input, description: "Number of citizen petition signatures (irrelevant when requested_by_role=system)", default: 0 }
      - { name: trigger_margin_pct, type: number, source: computed, description: "Margin percent at the moment the recount was requested" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | IN_PROGRESS | RESOLVED_NO_CHANGE | RESOLVED_OVERTURN | DENIED" }
      - { name: reconciled_totals_json, type: object, source: computed, description: "Snapshot map {voter_choice -> reconciled_total} produced when status enters RESOLVED_*" }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: now, type: datetime, source: system, description: "Server-controlled wall clock; mutated only by POST /_clock/advance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Election
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: OPEN_REGISTRATION
        trigger: "POST /elections/{electionId}/state {to_state: OPEN_REGISTRATION}"
        actor: ElectionBoard
        preconditions:
          - "registration_deadline > now (ERR_DEADLINE_PASSED)"
          - "At least one Precinct exists for this election (ERR_NO_PRECINCTS)"
        side_effects: []

      - from: OPEN_REGISTRATION
        to: EARLY_VOTING
        trigger: "system at now >= early_voting_starts_at, observable via POST /_clock/advance"
        actor: system
        preconditions:
          - "now >= Election.early_voting_starts_at"
        side_effects:
          - "All Voters with status=PENDING that fail eligibility are auto-transitioned to SUSPENDED (cascade-down)"

      - from: EARLY_VOTING
        to: ELECTION_DAY
        trigger: "system at now >= early_voting_ends_at, observable via POST /_clock/advance"
        actor: system
        preconditions:
          - "now >= Election.early_voting_ends_at"
        side_effects: []

      - from: ELECTION_DAY
        to: TALLY
        trigger: "POST /elections/{electionId}/state {to_state: TALLY}"
        actor: ElectionBoard
        preconditions:
          - "now >= Election.ballot_return_deadline (ERR_TALLY_TOO_EARLY)"
          - "No CuringCase with status=OPEN_PENDING_VOTER OR UNDER_REVIEW (ERR_CURING_IN_PROGRESS)"
        side_effects:
          - "Compute precinct_margin (provisional variant) for every Precinct"
          - "Compute election_margin_pct"
          - "If election_margin_pct <= Election.recount_threshold_pct, system creates RecountRequest with requested_by_role=system and trigger_margin_pct=election_margin_pct"

      - from: TALLY
        to: RECOUNT
        trigger: "POST /elections/{electionId}/recounts {requested_by_role, petition_count}"
        actor: ElectionBoard
        preconditions:
          - "Either an auto-trigger RecountRequest exists OR petition_count >= 100 (ERR_RECOUNT_PETITION_INSUFFICIENT)"
          - "now <= Election.certification_deadline (ERR_DEADLINE_PASSED)"
        side_effects:
          - "RecountRequest transitions REQUESTED → APPROVED → IN_PROGRESS"
          - "All BallotCast with status=TALLIED are set to status=CHALLENGED with challenge_reason=RECOUNT_DISCREPANCY (cascade-down)"

      - from: TALLY
        to: CERTIFIED
        trigger: "POST /elections/{electionId}/state {to_state: CERTIFIED}"
        actor: ElectionBoard
        preconditions:
          - "election_margin_pct > Election.recount_threshold_pct (ERR_RECOUNT_REQUIRED)"
          - "No CuringCase in OPEN_PENDING_VOTER or UNDER_REVIEW"
          - "now <= Election.certification_deadline"
        side_effects:
          - "Election.certified_winner_voter_choice = argmax(precinct_margin reconciled_totals)"

      - from: RECOUNT
        to: CERTIFIED
        trigger: "POST /elections/{electionId}/state {to_state: CERTIFIED}"
        actor: ElectionBoard
        preconditions:
          - "All RecountRequest rows for this election in {RESOLVED_NO_CHANGE, RESOLVED_OVERTURN, DENIED}"
          - "now <= Election.certification_deadline"
        side_effects:
          - "Election.certified_winner_voter_choice = argmax(reconciled_totals) from latest RESOLVED_* RecountRequest"

  - entity: Voter
    initial_state: PENDING
    terminal_states: [PURGED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /voters/{voterId}/state {to_state: ACTIVE}"
        actor: RegistrarClerk
        preconditions:
          - "is_citizen == true (ERR_NOT_CITIZEN)"
          - "age >= 18 on Election.election_date (ERR_UNDER_AGE)"
          - "residency_days >= 30 on Election.election_date (ERR_RESIDENCY_INSUFFICIENT)"
          - "now <= Election.registration_deadline (ERR_DEADLINE_PASSED)"
          - "Precinct assignment succeeded (precinct_id != null) (ERR_NO_PRECINCT_MATCH)"
        side_effects:
          - "Election.total_registered_active increments by 1"
          - "Voter.party_locked_at = Election.registration_deadline (snapshot)"
          - "Voter.registered_by_user_id = X-User-ID of the acting RegistrarClerk (snapshot for later SOD check)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /voters/{voterId}/state {to_state: SUSPENDED}; or system on Election.OPEN_REGISTRATION→EARLY_VOTING when an eligibility check newly fails"
        actor: RegistrarClerk OR system
        preconditions:
          - "Voter has no BallotCast with status in {CAST, TALLIED} for this election (ERR_VOTER_HAS_BALLOT)"
        side_effects:
          - "Election.total_registered_active decrements by 1"
          - "DIRECT cascade (link 2 from voter suspend): Any AbsenteeBallot for this voter in status {REQUESTED, ISSUED, RETURNED} → REJECTED with reason 'voter suspended'"
          - "TRANSITIVE cascade (link 3, caused by AbsenteeBallot RETURNED → REJECTED on a ballot that has linked_curing_case_id): the linked CuringCase in OPEN_PENDING_VOTER or UNDER_REVIEW → RESOLVED_REJECT. NOTE: this CuringCase transition is triggered by the AbsenteeBallot transition (link 2), not directly by the voter suspend — it is a true depth-3 transitive cascade"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /voters/{voterId}/state {to_state: ACTIVE}"
        actor: RegistrarClerk
        preconditions:
          - "now <= Election.registration_deadline"
          - "All eligibility checks pass again"
        side_effects:
          - "Election.total_registered_active increments by 1"

      - from: ACTIVE
        to: PURGED
        trigger: "POST /voters/{voterId}/state {to_state: PURGED}"
        actor: RegistrarClerk
        preconditions:
          - "Election.state == CERTIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "Voter row retained for audit; no further mutation allowed"

      - from: SUSPENDED
        to: PURGED
        trigger: "POST /voters/{voterId}/state {to_state: PURGED}"
        actor: RegistrarClerk
        preconditions:
          - "Election.state == CERTIFIED"
        side_effects: []

  - entity: AbsenteeBallot
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, CURED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /absentee-ballots/{ballotId}/state {to_state: ISSUED}"
        actor: RegistrarClerk
        preconditions:
          - "Voter.status == ACTIVE (ERR_VOTER_NOT_ACTIVE — cross-entity)"
          - "now <= Election.absentee_request_deadline (ERR_DEADLINE_PASSED)"
        side_effects:
          - "issued_at = now"

      - from: ISSUED
        to: RETURNED
        trigger: "POST /absentee-ballots/{ballotId}/return {signature_match}"
        actor: RegistrarClerk
        preconditions:
          - "now <= Election.ballot_return_deadline (ERR_RETURN_LATE)"
        side_effects:
          - "returned_at = now"
          - "If signature_match == MATCH: auto-transition to ACCEPTED (see next rule)"
          - "If signature_match in {MISMATCH, MISSING}: create CuringCase with defect_code mapped from signature_match, set linked_curing_case_id"

      - from: RETURNED
        to: ACCEPTED
        trigger: "system on signature_match=MATCH at receive"
        actor: system
        preconditions:
          - "signature_match == MATCH"
        side_effects:
          - "decided_at = now"
          - "Create BallotCast(method=ABSENTEE, absentee_ballot_id, voter_choice supplied on return)"

      - from: RETURNED
        to: REJECTED
        trigger: "POST /absentee-ballots/{ballotId}/state {to_state: REJECTED}"
        actor: RegistrarClerk
        preconditions:
          - "linked_curing_case_id is null OR linked CuringCase.status in {RESOLVED_REJECT, EXPIRED}"
        side_effects:
          - "decided_at = now"
          - "No BallotCast is created"

      - from: REQUESTED
        to: REJECTED
        trigger: "system on Voter ACTIVE→SUSPENDED cascade"
        actor: system
        preconditions:
          - "Voter for this ballot just transitioned to SUSPENDED"
        side_effects:
          - "decided_at = now"

      - from: ISSUED
        to: REJECTED
        trigger: "system on Voter ACTIVE→SUSPENDED cascade"
        actor: system
        preconditions:
          - "Voter for this ballot just transitioned to SUSPENDED"
        side_effects:
          - "decided_at = now"

      - from: RETURNED
        to: REJECTED
        trigger: "system on Voter ACTIVE→SUSPENDED cascade (overrides cure-link precondition)"
        actor: system
        preconditions:
          - "Voter for this ballot just transitioned to SUSPENDED"
        side_effects:
          - "decided_at = now"
          - "TRANSITIVE: if linked_curing_case_id is not null AND linked CuringCase.status in {OPEN_PENDING_VOTER, UNDER_REVIEW}, the CuringCase auto-transitions to RESOLVED_REJECT (link 3 of depth-3 chain)"

      - from: RETURNED
        to: CURED
        trigger: "system on CuringCase → RESOLVED_ACCEPT"
        actor: system
        preconditions:
          - "linked CuringCase.status == RESOLVED_ACCEPT"
        side_effects:
          - "decided_at = now"
          - "Create BallotCast(method=ABSENTEE, absentee_ballot_id, voter_choice supplied during cure)"

  - entity: CuringCase
    initial_state: OPEN_PENDING_VOTER
    terminal_states: [RESOLVED_ACCEPT, RESOLVED_REJECT, EXPIRED]
    transitions:
      - from: OPEN_PENDING_VOTER
        to: UNDER_REVIEW
        trigger: "POST /curing-cases/{caseId}/submit {voter_submission_text, voter_choice}"
        actor: Voter
        preconditions:
          - "now <= Election.cure_deadline (ERR_DEADLINE_PASSED)"
          - "Acting Voter.id == CuringCase.voter_id (ERR_FORBIDDEN; segregation of duties)"
        side_effects:
          - "voter_submission_text stored"

      - from: UNDER_REVIEW
        to: OPEN_PENDING_VOTER
        trigger: "POST /curing-cases/{caseId}/request-revision"
        actor: ReviewerClerk
        preconditions:
          - "round_count < max_rounds (ERR_MAX_ROUNDS_REACHED)"
          - "now <= Election.cure_deadline"
          - "X-User-ID of caller != Voter.registered_by_user_id (ERR_FORBIDDEN_SOD)"
        side_effects:
          - "round_count += 1"

      - from: UNDER_REVIEW
        to: RESOLVED_ACCEPT
        trigger: "POST /curing-cases/{caseId}/state {to_state: RESOLVED_ACCEPT}"
        actor: ReviewerClerk
        preconditions:
          - "now <= Election.cure_deadline"
          - "X-User-ID of caller != Voter.registered_by_user_id (ERR_FORBIDDEN_SOD)"
        side_effects:
          - "AbsenteeBallot transitions RETURNED → CURED (cascade-up)"
          - "BallotCast(method=ABSENTEE) is created via that cascade"

      - from: UNDER_REVIEW
        to: RESOLVED_REJECT
        trigger: "POST /curing-cases/{caseId}/state {to_state: RESOLVED_REJECT}"
        actor: ReviewerClerk
        preconditions:
          - "X-User-ID of caller != Voter.registered_by_user_id (ERR_FORBIDDEN_SOD)"
        side_effects:
          - "AbsenteeBallot remains RETURNED; subsequent POST /absentee-ballots/{ballotId}/state {REJECTED} is permitted"

      - from: OPEN_PENDING_VOTER
        to: EXPIRED
        trigger: "system on POST /_clock/advance when now > Election.cure_deadline"
        actor: system
        preconditions:
          - "now > Election.cure_deadline"
        side_effects:
          - "AbsenteeBallot transitions RETURNED → REJECTED (cascade-up); no BallotCast created"

      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system on POST /_clock/advance when now > Election.cure_deadline"
        actor: system
        preconditions:
          - "now > Election.cure_deadline"
        side_effects:
          - "AbsenteeBallot transitions RETURNED → REJECTED (cascade-up)"

      - from: OPEN_PENDING_VOTER
        to: RESOLVED_REJECT
        trigger: "system on AbsenteeBallot RETURNED→REJECTED cascade (from Voter SUSPEND)"
        actor: system
        preconditions:
          - "Linked AbsenteeBallot just transitioned RETURNED → REJECTED via the voter-suspend cascade"
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED_REJECT
        trigger: "system on AbsenteeBallot RETURNED→REJECTED cascade (from Voter SUSPEND)"
        actor: system
        preconditions:
          - "Linked AbsenteeBallot just transitioned RETURNED → REJECTED via the voter-suspend cascade"
        side_effects: []

  - entity: BallotCast
    initial_state: CAST
    terminal_states: [INVALIDATED]
    transitions:
      - from: CAST
        to: TALLIED
        trigger: "system on Election ELECTION_DAY → TALLY"
        actor: system
        preconditions:
          - "Election.state transitions to TALLY"
        side_effects:
          - "Contributes to precinct_margin calculation"

      - from: TALLIED
        to: CHALLENGED
        trigger: "system on Election TALLY → RECOUNT (cascade-down across all TALLIED ballots in the election)"
        actor: system
        preconditions:
          - "Election.state transitions to RECOUNT"
        side_effects:
          - "challenge_reason = RECOUNT_DISCREPANCY"

      - from: CHALLENGED
        to: TALLIED
        trigger: "system on RecountRequest IN_PROGRESS → RESOLVED_NO_CHANGE OR RESOLVED_OVERTURN"
        actor: system
        preconditions:
          - "RecountRequest.status enters RESOLVED_*"
        side_effects:
          - "challenge_reason cleared to null"
          - "Contributes to reconciled_totals on the parent RecountRequest"

      - from: CAST
        to: INVALIDATED
        trigger: "system on detection of double-vote (same voter_id, election_id) at second BallotCast creation"
        actor: system
        preconditions:
          - "A prior BallotCast exists with same (voter_id, election_id) in status != INVALIDATED"
        side_effects:
          - "The FIRST cast is preserved as CAST; the SECOND attempt is rejected with ERR_DOUBLE_VOTE; this transition handles the rare case where two casts already exist (data import) — system invalidates the later one"

      - from: TALLIED
        to: INVALIDATED
        trigger: "POST /ballots/{ballotId}/state {to_state: INVALIDATED, reason: DOUBLE_VOTE} by ElectionBoard"
        actor: ElectionBoard
        preconditions:
          - "Election.state in {TALLY, RECOUNT}"
        side_effects:
          - "precinct_margin recomputed for the affected Precinct"

  - entity: VotingMachine
    initial_state: READY
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: READY
        to: IN_USE
        trigger: "system on first POST /ballots with method=ELECTION_DAY_MACHINE and machine_id=this"
        actor: system
        preconditions:
          - "Election.state == ELECTION_DAY"
        side_effects: []

      - from: IN_USE
        to: DOWN
        trigger: "POST /voting-machines/{machineId}/state {to_state: DOWN, failure_reason}"
        actor: PrecinctOfficer
        preconditions:
          - "failure_reason supplied (ERR_BAD_REQUEST)"
          - "Election.state == ELECTION_DAY (ERR_INVALID_STATE)"
        side_effects:
          - "down_since = now"
          - "Precinct.machine_failure_active = true"
          - "Subsequent ballot casts at this Precinct using method=ELECTION_DAY_MACHINE are rejected (ERR_MACHINE_FAILURE); officers must use method=ELECTION_DAY_PROVISIONAL"

      - from: DOWN
        to: READY
        trigger: "POST /voting-machines/{machineId}/state {to_state: READY}"
        actor: PrecinctOfficer
        preconditions: []
        side_effects:
          - "If no other machine at this Precinct is DOWN: Precinct.machine_failure_active = false"

      - from: READY
        to: DECOMMISSIONED
        trigger: "POST /voting-machines/{machineId}/state {to_state: DECOMMISSIONED}"
        actor: ElectionBoard
        preconditions:
          - "Election.state == CERTIFIED"
        side_effects: []

  - entity: RecountRequest
    initial_state: REQUESTED
    terminal_states: [RESOLVED_NO_CHANGE, RESOLVED_OVERTURN, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /recounts/{recountId}/state {to_state: APPROVED}"
        actor: ElectionBoard
        preconditions:
          - "If requested_by_role == ElectionBoard: petition_count >= 100 (ERR_RECOUNT_PETITION_INSUFFICIENT)"
          - "Election.state in {TALLY, RECOUNT} (ERR_INVALID_STATE)"
        side_effects: []

      - from: REQUESTED
        to: DENIED
        trigger: "POST /recounts/{recountId}/state {to_state: DENIED}"
        actor: ElectionBoard
        preconditions:
          - "requested_by_role == ElectionBoard (system-triggered recounts cannot be denied; ERR_RECOUNT_REQUIRED)"
        side_effects: []

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /recounts/{recountId}/state {to_state: IN_PROGRESS}"
        actor: ElectionBoard
        preconditions: []
        side_effects:
          - "Election TALLY → RECOUNT (cascade-up); all TALLIED BallotCast → CHALLENGED"

      - from: IN_PROGRESS
        to: RESOLVED_NO_CHANGE
        trigger: "POST /recounts/{recountId}/state {to_state: RESOLVED_NO_CHANGE}"
        actor: ElectionBoard
        preconditions:
          - "Reconciled winner (from reconciled variant) == provisional winner (from provisional variant)"
        side_effects:
          - "Snapshot reconciled_totals_json"
          - "All CHALLENGED BallotCast → TALLIED (cascade-down)"

      - from: IN_PROGRESS
        to: RESOLVED_OVERTURN
        trigger: "POST /recounts/{recountId}/state {to_state: RESOLVED_OVERTURN}"
        actor: ElectionBoard
        preconditions:
          - "Reconciled winner != provisional winner (ERR_RECOUNT_NO_OVERTURN)"
        side_effects:
          - "Snapshot reconciled_totals_json"
          - "All CHALLENGED BallotCast → TALLIED (cascade-down)"
          - "Election.certified_winner_voter_choice computed from reconciled_totals on subsequent CERTIFICATION"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Same Voter attempts to cast a ballot twice (e.g., absentee accepted then walks into polling place) in parallel requests"
    guarantee: "At most one BallotCast per (voter_id, election_id) in status != INVALIDATED; second creation rejected"
    error_id: ERR_DOUBLE_VOTE
    http_status: 409
    serialization: "First-writer-wins on BallotCast (voter_id, election_id) uniqueness"

  - scenario: "Two RegistrarClerks try to issue absentee ballots for the same Voter+Election simultaneously"
    guarantee: "At most one AbsenteeBallot per (voter_id, election_id) reaches status=ISSUED; second is rejected"
    error_id: ERR_ABSENTEE_ALREADY_ISSUED
    http_status: 409
    serialization: "First-writer-wins on AbsenteeBallot (voter_id, election_id) where status in {REQUESTED, ISSUED, RETURNED, ACCEPTED, CURED}"

  - scenario: "Voter changes party while ElectionBoard advances OPEN_REGISTRATION → EARLY_VOTING simultaneously"
    guarantee: "Exactly one wins; loser receives party-frozen error if Election moved first, else version-mismatch"
    error_id: ERR_PARTY_LOCKED
    http_status: 409
    serialization: "First-writer-wins on Election.state read at the start of party-change transaction"

  - scenario: "Two ReviewerClerks try to resolve the same CuringCase in opposite directions (accept vs reject) simultaneously"
    guarantee: "Exactly one transition succeeds; loser sees ERR_INVALID_STATE because the case is no longer UNDER_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CuringCase.status"

  - scenario: "PrecinctOfficer marks a machine DOWN while a voter casts a ballot on it"
    guarantee: "If ballot cast commits first, the cast succeeds and machine still transitions to DOWN; if machine-DOWN commits first, the cast is rejected"
    error_id: ERR_MACHINE_FAILURE
    http_status: 409
    serialization: "First-writer-wins on VotingMachine.status"

  - scenario: "Two parallel attempts to approve the same RecountRequest"
    guarantee: "At most one approval; loser sees ERR_VERSION_MISMATCH"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "OCC on RecountRequest.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: voter_eligibility
    trigger: "POST /voters and POST /voters/{voterId}/state {ACTIVE}; recomputed on Election OPEN_REGISTRATION→EARLY_VOTING"
    algorithm: threshold
    formula: |
      age_years = floor((Election.election_date - Voter.date_of_birth).days / 365.25)
      residency_days = (Election.election_date - Voter.residency_since).days
      is_eligible = (Voter.is_citizen == true)
                AND (age_years >= ELIGIBLE_AGE)
                AND (residency_days >= MIN_RESIDENCY_DAYS)
                AND (now <= Election.registration_deadline)
                AND (Voter.precinct_id != null)
    input_set: "Voter row + parent Election row; ClockState.now"
    constants:
      ELIGIBLE_AGE: 18
      MIN_RESIDENCY_DAYS: 30
    precision: "integers only; floor on age, integer subtraction on residency_days"
    variants:
      - name: strict_pre_deadline
        when: "Election.state == OPEN_REGISTRATION AND now <= registration_deadline"
        difference: "All four conditions enforced; missing any => ERR_*; cannot ACTIVATE"
      - name: cure_grace_window
        when: "Election.state == EARLY_VOTING AND voter was ACTIVE at registration_deadline AND today is within 7 days of registration_deadline"
        difference: "residency_days requirement waived to allow domestic movers to remain ACTIVE; citizenship + age still required. SAME voter, SAME inputs, different outputs vs strict_pre_deadline."

  - name: precinct_margin
    trigger: "Election ELECTION_DAY→TALLY (provisional variant); RecountRequest APPROVED→IN_PROGRESS (reconciled variant)"
    algorithm: aggregation
    formula: |
      For each voter_choice c at Precinct p:
        provisional_total[c] = count(BallotCast where
            precinct_id=p AND voter_choice=c
            AND status IN {CAST, TALLIED, CHALLENGED}
            AND method IN {EARLY_IN_PERSON, ELECTION_DAY_MACHINE, ABSENTEE}
            AND challenge_reason != DOUBLE_VOTE)
        reconciled_total[c]  = count(BallotCast where
            precinct_id=p AND voter_choice=c
            AND status IN {CAST, TALLIED, CHALLENGED}
            AND method IN {EARLY_IN_PERSON, ELECTION_DAY_MACHINE, ELECTION_DAY_PROVISIONAL, ABSENTEE}
            AND challenge_reason != DOUBLE_VOTE)
      precinct_margin[p] = (max - second_max) / sum_over_choices
    input_set: "BallotCast rows under Precinct (status filter explicit)"
    constants: {}
    precision: "ratio rounded to 6 decimals, round_half_up"
    variants:
      - name: provisional_tally
        when: "Election TALLY computation"
        difference: "Excludes ELECTION_DAY_PROVISIONAL ballots (treated as not yet adjudicated)"
      - name: reconciled_recount
        when: "RecountRequest IN_PROGRESS"
        difference: "Includes ELECTION_DAY_PROVISIONAL ballots; same input rows produce a different total whenever any PROVISIONAL ballot exists in the precinct"

  - name: election_margin_pct
    trigger: "Election ELECTION_DAY→TALLY and RecountRequest IN_PROGRESS→RESOLVED_*"
    algorithm: aggregation
    formula: |
      For each voter_choice c election-wide:
        choice_total[c] = sum over Precincts of precinct_margin.totals[c]  # rounded per-precinct then summed
      sorted = sort_desc(choice_total)
      election_margin_pct = (sorted[0] - sorted[1]) / sum(sorted)
    input_set: "All BallotCast under Election filtered by precinct_margin's variant"
    constants: {}
    precision: |
      ROUNDING ORDER (PINNED): round each precinct_margin.totals[c] to integer count first
      (integer counts so this is exact), then sum across precincts, then divide once with
      6-decimal round_half_up. Do NOT divide per-precinct and then sum ratios.
    variants:
      - name: provisional_election_margin
        when: "Election TALLY (uses provisional_tally precinct totals)"
        difference: "Excludes PROVISIONAL ballots"
      - name: reconciled_election_margin
        when: "RecountRequest RESOLVED_* (uses reconciled_recount precinct totals)"
        difference: "Includes PROVISIONAL ballots; pins recount overturn condition"

  - name: recount_threshold_check
    trigger: "system at Election ELECTION_DAY→TALLY (after election_margin_pct computed)"
    algorithm: threshold
    formula: |
      if provisional_election_margin <= Election.recount_threshold_pct:
        create RecountRequest(requested_by_role=system, trigger_margin_pct=provisional_election_margin)
        STATE remains TALLY until ElectionBoard transitions it
      else:
        no recount auto-trigger
    input_set: "provisional_election_margin scalar; Election.recount_threshold_pct scalar"
    constants: {}
    precision: "boundary uses <= (inclusive lower); exactly equal to threshold triggers recount"

  - name: ballot_cure_window_check
    trigger: "POST /absentee-ballots/{ballotId}/return and POST /curing-cases/{caseId}/submit"
    algorithm: threshold
    formula: |
      on return: if now > Election.ballot_return_deadline -> ERR_RETURN_LATE
                 elif signature_match == MATCH -> ACCEPT (no cure needed)
                 else -> open CuringCase with cure_deadline_remaining = (Election.cure_deadline - now)
      on submit: if now > Election.cure_deadline -> ERR_DEADLINE_PASSED (boundary: strictly >)
                 if round_count >= max_rounds -> ERR_MAX_ROUNDS_REACHED
    input_set: "ClockState.now, Election deadlines, CuringCase.round_count"
    constants:
      MAX_ROUNDS_DEFAULT: 3
    precision: "boundary: deadline check uses STRICT > (now > deadline rejects)"

  - name: precinct_assignment
    trigger: "POST /voters (initial assignment) and PATCH /voters/{voterId} when residency_address changes"
    algorithm: matching
    formula: |
      candidates = Precincts where election_id == Voter.election_id
                   AND re.match(street_pattern, residency_address)
      eligibility_filter: "candidate set"
      ranking_expression: "len(street_pattern) DESC then Precinct.code ASC"
      tie_break: "smallest Precinct.code lexicographically"
      empty_fallback: "ERR_NO_PRECINCT_MATCH; precinct_id stays null and Voter cannot transition to ACTIVE"
    input_set: "Precinct rows for this election"
    constants: {}
    precision: "deterministic; first match by ranking expression"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and parseable"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameter ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Segregation of duties: caller's X-User-ID on CuringCase mutation must NOT equal Voter.registered_by_user_id (snapshot captured at PENDING→ACTIVE)"
    error_id: ERR_FORBIDDEN_SOD
    http_status: 403
    applies_to: "POST /curing-cases/{caseId}/state, POST /curing-cases/{caseId}/request-revision"

  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_temporal
    check: "Operation is within the applicable election deadline window (registration_deadline, absentee_request_deadline, ballot_return_deadline, cure_deadline, certification_deadline)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /voters/{voterId}/state {ACTIVE}, POST /party-registration, POST /absentee-ballots, POST /absentee-ballots/{ballotId}/state {ISSUED}, POST /curing-cases/{caseId}/submit, POST /curing-cases/{caseId}/state, POST /elections/{electionId}/state {CERTIFIED}"

  - priority: 7
    category: business_safety
    check: "Ballot-integrity: no double vote — a voter may have at most one non-INVALIDATED BallotCast per election"
    error_id: ERR_DOUBLE_VOTE
    http_status: 409
    applies_to: "POST /ballots, POST /absentee-ballots/{ballotId}/return (when MATCH cascades to BallotCast)"

  - priority: 8
    category: business_safety
    check: "Ballot-integrity: a voter who walks into a polling place where machine_failure_active=true must use method=ELECTION_DAY_PROVISIONAL; method=ELECTION_DAY_MACHINE is rejected"
    error_id: ERR_MACHINE_FAILURE
    http_status: 409
    applies_to: "POST /ballots"

  - priority: 9
    category: business_constraint
    check: "Eligibility: is_citizen, age_years >= 18, residency_days >= 30 at Election.election_date"
    error_id: "ERR_NOT_CITIZEN | ERR_UNDER_AGE | ERR_RESIDENCY_INSUFFICIENT"
    http_status: 422
    applies_to: "POST /voters/{voterId}/state {ACTIVE}"

  - priority: 10
    category: business_referential
    check: "Precinct assignment: at least one Precinct.street_pattern matches Voter.residency_address"
    error_id: ERR_NO_PRECINCT_MATCH
    http_status: 422
    applies_to: "POST /voters, PATCH /voters/{voterId} (when residency_address changes)"

  - priority: 11
    category: business_constraint
    check: "Party affiliation cannot change after Voter.party_locked_at; AND ElectionBoard cannot certify if election_margin_pct <= recount_threshold_pct without first completing recount"
    error_id: "ERR_PARTY_LOCKED | ERR_RECOUNT_REQUIRED"
    http_status: 409
    applies_to: "POST /party-registration, POST /elections/{electionId}/state {CERTIFIED}"

  - priority: 12
    category: business_fiscal
    check: "Petition-count threshold for manually-requested recount: petition_count >= 100"
    error_id: ERR_RECOUNT_PETITION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /elections/{electionId}/recounts (when requested_by_role=ElectionBoard)"

  - priority: 13
    category: business_constraint
    check: "OCC: If-Match / version field matches current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all PATCH and state endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test driver endpoints (reachability per testability-completeness rule) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to a specified ISO 8601 instant; drives all time-gated transitions (Election day-rollovers, CuringCase EXPIRED, deadline checks)"
    roles: [TestDriver]
    code: 200
    input: [to_instant]
    output: ClockState
    side_effects:
      - "Runs Election day-rollover sweep (DRAFT/OPEN_REGISTRATION/EARLY_VOTING/ELECTION_DAY) when now crosses thresholds"
      - "Runs CuringCase expiry sweep (transitions OPEN_PENDING_VOTER and UNDER_REVIEW → EXPIRED when now > cure_deadline)"
      - "Cascades into AbsenteeBallot RETURNED → REJECTED for each EXPIRED CuringCase"

  - method: GET
    path: "/_clock"
    description: "Read the current server clock"
    roles: [TestDriver, ElectionBoard, RegistrarClerk, ReviewerClerk, PrecinctOfficer, Voter]
    code: 200
    input: []
    output: ClockState
    side_effects: []

  # ---- Election ----
  - method: POST
    path: "/elections"
    description: "Create election"
    roles: [ElectionBoard]
    code: 201
    input: [name, election_date, registration_deadline, absentee_request_deadline, early_voting_starts_at, early_voting_ends_at, ballot_return_deadline, cure_deadline, certification_deadline, "recount_threshold_pct?"]
    output: Election
    side_effects: ["state=DRAFT"]

  - method: GET
    path: "/elections/{electionId}"
    description: "Get election (includes computed total_registered_active, certified_winner_voter_choice)"
    roles: [ElectionBoard, RegistrarClerk, ReviewerClerk, PrecinctOfficer, Voter]
    code: 200
    input: []
    output: Election
    side_effects: []

  - method: GET
    path: "/elections"
    description: "List elections (paginated)"
    roles: [ElectionBoard, RegistrarClerk, ReviewerClerk, PrecinctOfficer, Voter]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "Election[]"
    side_effects: []

  - method: POST
    path: "/elections/{electionId}/state"
    description: "Transition Election state per state machine"
    roles: [ElectionBoard]
    code: 200
    input: [to_state, version]
    output: Election
    side_effects: ["See Election state machine"]

  - method: GET
    path: "/elections/{electionId}/tally"
    description: "Return provisional or reconciled tallies depending on Election.state"
    roles: [ElectionBoard, RegistrarClerk]
    code: 200
    input: ["variant? = provisional|reconciled"]
    output: object
    side_effects: []

  # ---- Precinct ----
  - method: POST
    path: "/elections/{electionId}/precincts"
    description: "Create precinct"
    roles: [ElectionBoard]
    code: 201
    input: [code, street_pattern, capacity_machines]
    output: Precinct
    side_effects: []

  - method: GET
    path: "/elections/{electionId}/precincts/{precinctId}"
    description: "Get precinct (includes computed provisional_ballot_count, machine_failure_active)"
    roles: [ElectionBoard, RegistrarClerk, PrecinctOfficer]
    code: 200
    input: []
    output: Precinct
    side_effects: []

  - method: GET
    path: "/elections/{electionId}/precincts"
    description: "List precincts in election"
    roles: [ElectionBoard, RegistrarClerk, PrecinctOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Precinct[]"
    side_effects: []

  # ---- Voter ----
  - method: POST
    path: "/voters"
    description: "Create voter; runs precinct_assignment; sets status=PENDING"
    roles: [RegistrarClerk, Voter]
    code: 201
    input: [full_name, date_of_birth, residency_address, residency_since, is_citizen, election_id]
    output: Voter
    side_effects:
      - "precinct_assignment runs"
      - "status=PENDING; party_affiliation=UNAFFILIATED"

  - method: GET
    path: "/voters/{voterId}"
    description: "Get voter"
    roles: [RegistrarClerk, ReviewerClerk, Voter, ElectionBoard]
    code: 200
    input: []
    output: Voter
    side_effects: []

  - method: PATCH
    path: "/voters/{voterId}"
    description: "Update voter (mutable fields: residency_address, residency_since, full_name); re-runs precinct_assignment when residency_address changes"
    roles: [RegistrarClerk, Voter]
    code: 200
    input: ["full_name?", "residency_address?", "residency_since?", version]
    output: Voter
    side_effects: ["May change precinct_id; updated_at refreshed; version+=1"]

  - method: POST
    path: "/voters/{voterId}/state"
    description: "Transition Voter state per state machine"
    roles: [RegistrarClerk]
    code: 200
    input: [to_state, version]
    output: Voter
    side_effects: ["See Voter state machine; cascades to AbsenteeBallot and CuringCase on SUSPEND"]

  - method: POST
    path: "/voters/{voterId}/party-registration"
    description: "Change party affiliation; creates immutable PartyRegistration row"
    roles: [Voter, RegistrarClerk]
    code: 201
    input: [new_party, version]
    output: PartyRegistration
    side_effects: ["Voter.party_affiliation updated; Voter.updated_at refreshed; rejected after party_locked_at"]

  - method: GET
    path: "/voters/{voterId}/party-registration"
    description: "List party-registration history (immutable event log, append-only)"
    roles: [Voter, RegistrarClerk, ElectionBoard]
    code: 200
    input: ["limit?", "offset?"]
    output: "PartyRegistration[]"
    side_effects: []

  # ---- AbsenteeBallot ----
  - method: POST
    path: "/voters/{voterId}/absentee-ballots"
    description: "Request absentee ballot"
    roles: [Voter, RegistrarClerk]
    code: 201
    input: [election_id, "reason_code?"]
    output: AbsenteeBallot
    side_effects: ["status=REQUESTED; requested_at=now"]

  - method: GET
    path: "/absentee-ballots/{ballotId}"
    description: "Get absentee ballot"
    roles: [Voter, RegistrarClerk, ReviewerClerk, ElectionBoard]
    code: 200
    input: []
    output: AbsenteeBallot
    side_effects: []

  - method: POST
    path: "/absentee-ballots/{ballotId}/state"
    description: "Transition absentee ballot per state machine (ISSUED, REJECTED via explicit call; ACCEPTED and CURED happen via cascade only)"
    roles: [RegistrarClerk]
    code: 200
    input: [to_state, version]
    output: AbsenteeBallot
    side_effects: ["See AbsenteeBallot state machine"]

  - method: POST
    path: "/absentee-ballots/{ballotId}/return"
    description: "Record return with signature_match and voter_choice; cascades to ACCEPTED or opens CuringCase"
    roles: [RegistrarClerk]
    code: 200
    input: [signature_match, voter_choice, version]
    output: AbsenteeBallot
    side_effects:
      - "If signature_match=MATCH: cascade-up to ACCEPTED and create BallotCast(method=ABSENTEE)"
      - "Else: create CuringCase(defect_code=signature_match==MISMATCH ? SIGNATURE_MISMATCH : SIGNATURE_MISSING)"

  # ---- CuringCase ----
  - method: GET
    path: "/curing-cases/{caseId}"
    description: "Get curing case"
    roles: [Voter, ReviewerClerk, ElectionBoard]
    code: 200
    input: []
    output: CuringCase
    side_effects: []

  - method: POST
    path: "/curing-cases/{caseId}/submit"
    description: "Voter submits affirmation/signature text and intended voter_choice; transitions OPEN_PENDING_VOTER → UNDER_REVIEW"
    roles: [Voter]
    code: 200
    input: [voter_submission_text, voter_choice, version]
    output: CuringCase
    side_effects: ["voter_submission_text stored; voter_choice held for use on RESOLVED_ACCEPT"]

  - method: POST
    path: "/curing-cases/{caseId}/request-revision"
    description: "Reviewer requests revision; UNDER_REVIEW → OPEN_PENDING_VOTER (round_count += 1)"
    roles: [ReviewerClerk]
    code: 200
    input: [version]
    output: CuringCase
    side_effects: ["round_count += 1; SOD check enforced"]

  - method: POST
    path: "/curing-cases/{caseId}/state"
    description: "Reviewer resolves curing case (RESOLVED_ACCEPT or RESOLVED_REJECT); cascades to AbsenteeBallot"
    roles: [ReviewerClerk]
    code: 200
    input: [to_state, version]
    output: CuringCase
    side_effects:
      - "RESOLVED_ACCEPT: cascade-up to AbsenteeBallot CURED, creates BallotCast(method=ABSENTEE)"
      - "RESOLVED_REJECT: AbsenteeBallot eligible for subsequent REJECTED transition"

  # ---- BallotCast ----
  - method: POST
    path: "/ballots"
    description: "Cast a ballot in-person (early voting or election day); enforces double-vote, machine-failure, eligibility"
    roles: [PrecinctOfficer]
    code: 201
    input: [voter_id, precinct_id, method, "machine_id?", voter_choice]
    output: BallotCast
    side_effects:
      - "If method=ELECTION_DAY_MACHINE and VotingMachine status=READY: machine transitions READY → IN_USE"
      - "If Precinct.machine_failure_active=true and method=ELECTION_DAY_MACHINE: rejected (ERR_MACHINE_FAILURE)"

  - method: GET
    path: "/ballots/{ballotId}"
    description: "Get ballot cast"
    roles: [ElectionBoard, PrecinctOfficer]
    code: 200
    input: []
    output: BallotCast
    side_effects: []

  - method: POST
    path: "/ballots/{ballotId}/state"
    description: "ElectionBoard manually invalidates a TALLIED ballot (e.g., post-hoc double-vote discovery)"
    roles: [ElectionBoard]
    code: 200
    input: [to_state, "challenge_reason?", version]
    output: BallotCast
    side_effects: ["Recompute precinct_margin"]

  # ---- VotingMachine ----
  - method: POST
    path: "/elections/{electionId}/precincts/{precinctId}/voting-machines"
    description: "Provision a voting machine at a precinct"
    roles: [ElectionBoard]
    code: 201
    input: [serial_no]
    output: VotingMachine
    side_effects: ["status=READY"]

  - method: GET
    path: "/voting-machines/{machineId}"
    description: "Get voting machine"
    roles: [ElectionBoard, PrecinctOfficer]
    code: 200
    input: []
    output: VotingMachine
    side_effects: []

  - method: POST
    path: "/voting-machines/{machineId}/state"
    description: "Transition voting machine status; required failure_reason on transition to DOWN"
    roles: [PrecinctOfficer, ElectionBoard]
    code: 200
    input: [to_state, "failure_reason?", version]
    output: VotingMachine
    side_effects: ["See VotingMachine state machine; toggles Precinct.machine_failure_active"]

  # ---- RecountRequest ----
  - method: POST
    path: "/elections/{electionId}/recounts"
    description: "Request a recount (manual petition); validates petition_count threshold"
    roles: [ElectionBoard]
    code: 201
    input: [petition_count]
    output: RecountRequest
    side_effects: ["status=REQUESTED; requested_by_role=ElectionBoard"]

  - method: GET
    path: "/elections/{electionId}/recounts"
    description: "List recount requests under this election (includes any system-triggered ones)"
    roles: [ElectionBoard]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecountRequest[]"
    side_effects: []

  - method: POST
    path: "/recounts/{recountId}/state"
    description: "Transition recount per state machine (APPROVED, DENIED, IN_PROGRESS, RESOLVED_*)"
    roles: [ElectionBoard]
    code: 200
    input: [to_state, version]
    output: RecountRequest
    side_effects: ["See RecountRequest state machine; cascades BallotCast statuses"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_BAD_REQUEST, http: 400, condition: "Malformed body, missing required field, or unparseable value" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unparseable X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not authorized for this endpoint" }
  - { id: ERR_FORBIDDEN_SOD, http: 403, condition: "Segregation of duties: same opaque user-id cannot adjudicate a CuringCase for a Voter they registered" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-parameter resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid from-state for the requested transition" }
  - { id: ERR_VERSION_MISMATCH, http: 409, condition: "OCC: client-supplied version does not match current version" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Operation attempted after the applicable election deadline" }
  - { id: ERR_DOUBLE_VOTE, http: 409, condition: "Voter already has a non-INVALIDATED BallotCast for this election" }
  - { id: ERR_NOT_CITIZEN, http: 422, condition: "Voter.is_citizen=false at activation" }
  - { id: ERR_UNDER_AGE, http: 422, condition: "Voter.age_years < 18 on Election.election_date" }
  - { id: ERR_RESIDENCY_INSUFFICIENT, http: 422, condition: "Voter.residency_days < 30 on Election.election_date AND not in cure_grace_window variant" }
  - { id: ERR_NO_PRECINCT_MATCH, http: 422, condition: "No Precinct.street_pattern matches Voter.residency_address" }
  - { id: ERR_PARTY_LOCKED, http: 409, condition: "Voter.party_locked_at has passed; party_affiliation is frozen" }
  - { id: ERR_ABSENTEE_ALREADY_ISSUED, http: 409, condition: "An AbsenteeBallot for this (voter_id, election_id) is already in {REQUESTED, ISSUED, RETURNED, ACCEPTED, CURED}" }
  - { id: ERR_VOTER_NOT_ACTIVE, http: 409, condition: "Cross-entity precondition: AbsenteeBallot transition requires Voter.status=ACTIVE" }
  - { id: ERR_RETURN_LATE, http: 409, condition: "Absentee ballot return received after Election.ballot_return_deadline" }
  - { id: ERR_MAX_ROUNDS_REACHED, http: 409, condition: "CuringCase.round_count has reached max_rounds; no further revisions allowed" }
  - { id: ERR_CURING_IN_PROGRESS, http: 409, condition: "Election TALLY transition blocked while any CuringCase is in OPEN_PENDING_VOTER or UNDER_REVIEW" }
  - { id: ERR_MACHINE_FAILURE, http: 409, condition: "Precinct.machine_failure_active=true and method=ELECTION_DAY_MACHINE; voters must use ELECTION_DAY_PROVISIONAL" }
  - { id: ERR_VOTER_HAS_BALLOT, http: 409, condition: "Cannot SUSPEND a voter who has already cast a BallotCast in {CAST, TALLIED, CHALLENGED}" }
  - { id: ERR_TALLY_TOO_EARLY, http: 409, condition: "Election TALLY transition before now >= ballot_return_deadline" }
  - { id: ERR_RECOUNT_REQUIRED, http: 409, condition: "Election CERTIFIED blocked because election_margin_pct <= recount_threshold_pct and no resolved RecountRequest exists" }
  - { id: ERR_RECOUNT_PETITION_INSUFFICIENT, http: 422, condition: "Manual RecountRequest petition_count < 100" }
  - { id: ERR_RECOUNT_NO_OVERTURN, http: 409, condition: "RESOLVED_OVERTURN attempted when reconciled winner equals provisional winner" }
  - { id: ERR_NO_PRECINCTS, http: 409, condition: "Election OPEN_REGISTRATION transition requires at least one Precinct to exist" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ElectionBoard
    description: "Operational role that owns election lifecycle, recounts, and certifications"
    identity: opaque
    exclusive_operations:
      - "POST /elections — Create election"
      - "POST /elections/{electionId}/state — Election lifecycle (DRAFT → OPEN_REGISTRATION; TALLY → CERTIFIED; RECOUNT → CERTIFIED)"
      - "POST /elections/{electionId}/precincts — Create precinct"
      - "POST /elections/{electionId}/precincts/{precinctId}/voting-machines — Provision machine"
      - "POST /elections/{electionId}/recounts — File manual recount petition"
      - "POST /recounts/{recountId}/state — Approve/deny/progress/resolve recount"
      - "POST /ballots/{ballotId}/state — Post-hoc ballot invalidation"
    shared_operations:
      - "GET /elections, /elections/{id}, /elections/{id}/tally, /elections/{id}/recounts"
      - "GET /voters/{voterId}, /voters/{voterId}/party-registration"
      - "GET /voting-machines/{machineId} — also shared with PrecinctOfficer"
      - "POST /voting-machines/{machineId}/state — also shared with PrecinctOfficer (e.g., DECOMMISSIONED requires ElectionBoard)"

  - name: RegistrarClerk
    description: "Operational role that handles voter registration and absentee ballot lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /voters/{voterId}/state — Voter state (PENDING→ACTIVE, ACTIVE↔SUSPENDED, →PURGED)"
      - "POST /absentee-ballots/{ballotId}/state — Absentee ballot state (REQUESTED→ISSUED, RETURNED→REJECTED)"
      - "POST /absentee-ballots/{ballotId}/return — Record ballot return"
    shared_operations:
      - "POST /voters — Create voter (also shared with Voter)"
      - "PATCH /voters/{voterId} — Update voter (also shared with Voter)"
      - "POST /voters/{voterId}/party-registration — Change party (also shared with Voter)"
      - "POST /voters/{voterId}/absentee-ballots — Request absentee ballot (also shared with Voter)"
      - "GET endpoints across elections, voters, precincts, absentee-ballots, ballots"

  - name: ReviewerClerk
    description: "Operational role that adjudicates CuringCase rows; must be different opaque id from RegistrarClerk who registered the voter (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /curing-cases/{caseId}/request-revision — Send back to voter"
      - "POST /curing-cases/{caseId}/state — Resolve (RESOLVED_ACCEPT / RESOLVED_REJECT)"
    shared_operations:
      - "GET /curing-cases/{caseId}, GET /voters/{voterId}, GET /absentee-ballots/{ballotId}, GET /elections/{electionId}"

  - name: PrecinctOfficer
    description: "Operational role at polling place; casts in-person ballots, marks machine failures"
    identity: opaque
    exclusive_operations:
      - "POST /ballots — Cast in-person ballot (early voting or election day)"
    shared_operations:
      - "POST /voting-machines/{machineId}/state — Machine status changes (READY ↔ DOWN); shared with ElectionBoard"
      - "GET /voting-machines/{machineId}, GET /elections/{electionId}/precincts/{precinctId}"

  - name: Voter
    description: "End-user voter acting on their own row"
    identity: "entity_backed:Voter"
    exclusive_operations:
      - "POST /curing-cases/{caseId}/submit — Submit cure (only the owning Voter)"
    shared_operations:
      - "POST /voters — Self-register (also shared with RegistrarClerk)"
      - "PATCH /voters/{voterId} — Update own row (also shared with RegistrarClerk; X-User-ID must equal Voter.id)"
      - "POST /voters/{voterId}/party-registration — Change own party"
      - "POST /voters/{voterId}/absentee-ballots — Request own absentee ballot"
      - "GET /voters/{voterId}, GET /absentee-ballots/{ballotId}, GET /curing-cases/{caseId}, GET /elections/{electionId} (own data only)"

  - name: TestDriver
    description: "Test-harness role used to drive the server clock; not present in production"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance — Advance server clock"
    shared_operations:
      - "GET /_clock — Read current clock"
