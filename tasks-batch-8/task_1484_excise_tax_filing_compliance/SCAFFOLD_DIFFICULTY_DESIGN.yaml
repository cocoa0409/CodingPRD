          assert:
            - "CA return: deposits_applied_cents == 90000 == ceil(0.9 x 100000) exactly -> penalty_cents == 0 and net_due_cents == 10000"
            - "NV return: deposits_applied_cents == 89999 (one cent below) -> penalty_cents == 1000 (round_half_up(0.10 x 10001)) and net_due_cents == 11001"
            - "The 90-percent safe-harbor boundary is >= -inclusive"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_rating_gated_on_registration_state
        grounds:
          - state_machines.TaxableEvent.CLASSIFIED_to_RATED
          - state_machines.Registration
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair TaxableEvent x Registration: an event may be CLASSIFIED while the
          registration is ACTIVE, but the CLASSIFIED -> RATED transition is rejected with
          ERR_REGISTRATION_NOT_ACTIVE after the registration is suspended, and succeeds again
          after reinstatement.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000; one CLASSIFIED event"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /registrations/${rgn}/suspend", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /registrations/${rgn}/reinstate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { st: $.data.status, tax: $.data.tax_cents } }
          assert:
            - "While registration SUSPENDED: 409 ERR_REGISTRATION_NOT_ACTIVE; event stays CLASSIFIED"
            - "After reinstate to ACTIVE: rate succeeds, status == RATED, tax_cents == 24300"

      - name: amendment_gated_on_audit_records_hold
        grounds:
          - state_machines.AuditCase
          - validations[priority=8]
          - entities.AuditCase.fields.records_hold
        distinguishing_aspect: |
          Entity pair TaxReturn x AuditCase (different pair than TaxableEvent x Registration):
          POST /returns/{id}/amend on a FILED return is rejected with ERR_AUDIT_RECORDS_HOLD while
          an audit case covers the period, and succeeds after the audit closes (hold released).
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration; one rated event; 2026-08 return FILED"
            - "Audit case OPENED covering [2026-08, 2026-08]"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /audit-cases", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", period_start: "2026-08", period_end: "2026-08" }, as: JurisdictionAuditor, captures: { aud: $.data.id } }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /returns/${ret}/amend", payload: { expected_return_version: "${v2}" }, as: TaxAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /audit-cases/${aud}/begin-review", payload: {}, as: JurisdictionAuditor }
            - { call: "POST /audit-cases/${aud}/close", payload: { outcome: "NO_CHANGE" }, as: JurisdictionAuditor }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { v3: $.data.version } }
            - { call: "POST /returns/${ret}/amend", payload: { expected_return_version: "${v3}" }, as: TaxAnalyst, captures: { amd: $.data.id, amd_st: $.data.filing_status } }
          assert:
            - "While audit OPENED (records_hold): 409 ERR_AUDIT_RECORDS_HOLD"
            - "After audit CLOSED_NO_CHANGE: amend succeeds (201); amendment ${amd} filing_status == DRAFT, amendment_of_id == ${ret}, amendment_sequence == 1"

      - name: event_exemption_gated_on_certificate_state
        grounds:
          - state_machines.ExemptionCertificate
          - validations[priority=26]
        distinguishing_aspect: |
          Entity pair TaxableEvent x ExemptionCertificate (a third distinct pair): rating with a
          PENDING_VERIFICATION or REVOKED certificate fails ERR_CERTIFICATE_NOT_ACTIVE; only the
          ACTIVE window in between permits the exemption.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000"
            - "Certificate RESALE CUST-1 [2026-03-01, 2026-12-31]; two CLASSIFIED 1000-unit events for CUST-1 dated 2026-08-03"
          setup_api_calls:
