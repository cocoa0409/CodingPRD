              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret1: $.data.id }
            - call: "POST /api/returns/${ret1}/lines"
              payload: { article_id: "${art_a}", qty: 2, assembly_state: "UNOPENED", order_line_id: "${line_a}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl1: $.data.id }
            - call: "POST /api/returns/${ret1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret1}/lines/${rl1}/grade"
              payload: { condition_grade: "LIKE_NEW" }
              as: StoreOps
          trigger:
            - call: "POST /api/returns/${ret1}/settle"
              payload: {}
              as: StoreOps
              captures: { refund: $.data.refund_total_cents, wo: $.data.writeoff_total_cents }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand, rsv: $.data.reserved }
          assert:
            - "after checkout BinStock.${bs_id}.on_hand was 3 (forward action)"
            - "after LIKE_NEW settle: on_hand == 5 — exactly the initial value (compensating action conserves inventory)"
            - "reserved == 0 throughout the endpoints of the round trip"
            - "refund_total_cents == 1000 (2 x 500 x 1.00) and writeoff_total_cents == 0"
            - "OrderLine.${line_a}.returned_qty == 2"

      - name: booking_and_cancel_conserve_slot_capacity
        grounds:
          - state_machines.DeliveryBooking.CONFIRMED_to_CANCELLED
          - calculations.slot_capacity_consumption
          - entities.DeliverySlot.fields.used_weight_kg
          - entities.BinStock.fields.reserved
        distinguishing_aspect: |
          Conserved quantity = vehicle capacity (a different quantity from
          inventory units): booking then cancelling restores
          used_weight_kg + free_weight_kg == capacity_weight_kg exactly and
          releases the stock reservation, so used_weight_kg returns to 0 while
          capacity_weight_kg never changes; the waitlist scan finds no
          candidates and changes nothing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Non-member customer N. Article W60 (carton 60 kg / 1.0 m3), stock 2. ZONE_A slot capacity 100 kg / 2.0 m3. DELIVERY order qty 1 with a CONFIRMED booking (used 60 / 1.0, reserved 1)."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - call: "POST /api/articles"
              payload: { article_number: "W60", name: "Desk", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 1000 }
              as: PlatformAdmin
              captures: { a60: $.data.id }
            - call: "POST /api/articles/${a60}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "60", weight_kg: 60, volume_m3: 1.0 }
              as: PlatformAdmin
              captures: { c60: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c60}", on_hand: 2 }
              as: StoreOps
              captures: { bs60: $.data.id }
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_A", capacity_weight_kg: 100, capacity_volume_m3: 2.0 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/lines"
              payload: { article_id: "${a60}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o1}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o1}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /api/delivery-bookings/${b1}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b1_st: $.data.status }
            - call: "GET /api/delivery-slots/${slot_id}"
              payload: {}
              as: DeliveryCoordinator
              captures: { uw: $.data.used_weight_kg, uv: $.data.used_volume_m3, cw: $.data.capacity_weight_kg }
            - call: "GET /api/bin-stock/${bs60}"
              payload: {}
              as: StoreOps
              captures: { rsv: $.data.reserved, oh: $.data.on_hand }
            - call: "GET /api/orders/${o1}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_del: $.data.delivery_status }
          assert:
            - "DeliveryBooking.${b1}.status == CANCELLED"
            - "DeliverySlot.${slot_id}: used_weight_kg == 0 and used_volume_m3 == 0 while capacity_weight_kg == 100 is unchanged — capacity conserved"
            - "BinStock.${bs60}: reserved == 0 and on_hand == 2 (DELIVERY-channel stock was never decremented, only reserved)"
            - "Order.${o1}.delivery_status == NONE (rebookable after cancel)"
