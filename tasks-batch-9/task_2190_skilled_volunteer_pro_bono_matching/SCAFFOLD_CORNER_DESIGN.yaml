      - name: error_scope_version_superseded_is_pre_empted_by_offer_state
        claim_type: error_triggerable
        grounds: ["errors[ERR_SCOPE_VERSION_SUPERSEDED]", "validations[priority=49]", state_machines.ProjectRequest.transitions.MATCHING_to_ABANDONED]
        distinguishing_aspect: "Documents the one construction that actually supersedes a PINNED revision - abandoning a MATCHING request - and pins the answer: the accept must return ERR_OFFER_NOT_OPEN (priority 22), because the abandon cascade withdraws the offer in the same step that supersedes the revision, so the priority-49 check is unreachable on all three of its declared endpoints (accept: the offer is never left OFFERED across a supersession; handoff and send: every supersession path terminates the engagement or voids the agreement first, so priority 23 / 24 answer instead). Recorded here so the §1.6 catalog entry is not silently treated as covered."
        test_recipe:
          setup: ["Base chain to one OFFERED offer, then the manager abandons the MATCHING request (offer WITHDRAWN, pinned revision SUPERSEDED)."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1", payload: {verify_skill_codes: ["TAX_LAW"]}}
            - {call: "POST /volunteers/${vol_id}/availability-windows", as: Volunteer, as_user_id: "${vol_id}", payload: {starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-11-01T00:00:00Z", window_kind: HARD, hours_offered: 200.00}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {req_v: "$.data.version"}}
            - {call: "POST /project-requests/${req_id}/scope-definitions", as: ScopingSpecialist, as_user_id: "spec-1", payload: {expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: STANDARD, ip_disposition: ASSIGN_TO_PARTNER}, captures: {scope_id: "$.data.id"}}
            - {call: "POST /scope-definitions/${scope_id}/deliverables", as: ScopingSpecialist, as_user_id: "spec-1", payload: {title: "Findings memo", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Board-ready memo with cited findings."}, captures: {d1_id: "$.data.id"}}
            - {call: "POST /scope-definitions/${scope_id}/approve", as: PartnerContact, as_user_id: "${partner_id}"}
            - {call: "POST /project-requests/${req_id}/match", as: ScopingSpecialist, as_user_id: "spec-1", captures: {offer_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/abandon", as: ProgramManager, as_user_id: "pm-1"}
          trigger:
            - {call: "POST /match-offers/${offer_id}/accept", as: Volunteer, as_user_id: "${vol_id}", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_OFFER_NOT_OPEN\""
            - "data.error_id != \"ERR_SCOPE_VERSION_SUPERSEDED\""
            - "GET /scope-definitions/${scope_id} shows status == \"SUPERSEDED\""
            - "GET /match-offers/${offer_id} shows status == \"WITHDRAWN\" and withdraw_reason == \"ADMIN\""
            - "GET /project-requests/${req_id} shows status == \"ABANDONED\" and active_scope_revision_no == 0"
            - "GET /engagements?project_request_id=${req_id} returns total_count == 0"
      - name: error_missing_auth_headers_beats_validation_on_malformed_body
        claim_type: error_triggerable
        grounds: ["errors[ERR_MISSING_AUTH_HEADERS]", "validations[priority=1]", "endpoints[PATCH /partner-orgs/{id}/status]"]
        distinguishing_aspect: "X-User-ID is present but empty while the body also carries an out-of-enum to_status: priority 1 wins outright, so the answer is 401 ERR_MISSING_AUTH_HEADERS and never 422 ERR_VALIDATION - the envelope must not describe the bad field."
        test_recipe:
          setup: ["One ACTIVE partner org."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "PATCH /partner-orgs/${partner_id}/status", as: ProgramManager, as_user_id: "(X-User-ID sent as the empty string)", payload: {to_status: "DELETED"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_MISSING_AUTH_HEADERS\" - not ERR_VALIDATION, even though to_status is outside the PartnerOrg status enum"
            - "GET /partner-orgs/${partner_id} as ProgramManager shows status == \"ACTIVE\""
      - name: error_role_not_permitted_beats_volunteer_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_ROLE_NOT_PERMITTED]", "validations[priority=2]", "validations[priority=7]", "endpoints[PATCH /volunteers/{id}/status]"]
        distinguishing_aspect: "Authorization precedes existence: a ScopingSpecialist patching the status of the entirely fictional volunteer id 'vol-does-not-exist' gets 403 ERR_ROLE_NOT_PERMITTED at priority 2, never 404 ERR_VOLUNTEER_NOT_FOUND at priority 7, so the API never confirms or denies that the id exists."
        test_recipe:
          setup: ["One partner org; deliberately no volunteer with the probed id."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "PATCH /volunteers/vol-does-not-exist/status", as: ScopingSpecialist, as_user_id: "spec-1", payload: {to_status: "ACTIVE"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\" - not ERR_VOLUNTEER_NOT_FOUND"
            - "the same call as ProgramManager with the same fictional id returns HTTP 404 with ERR_VOLUNTEER_NOT_FOUND, which is how the two priorities are told apart"
      - name: error_partner_org_not_found_beats_program_cycle_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_PARTNER_ORG_NOT_FOUND]", "validations[priority=3]", "validations[priority=4]", "endpoints[POST /project-requests]"]
        distinguishing_aspect: "Two FK lookups fail in the same body; the earlier priority decides. partner_org_id 'org-nope' and cycle_id 'cycle-nope' together must yield exactly 404 ERR_PARTNER_ORG_NOT_FOUND, and it also pre-empts the priority-15 ownership check that the mismatched caller id would otherwise trip."
        test_recipe:
          setup: ["One real partner (the caller identity) and one real cycle, neither of which is referenced by the payload."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "org-nope", cycle_id: "cycle-nope", title: "Ghost request", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PARTNER_ORG_NOT_FOUND\" - not ERR_PROGRAM_CYCLE_NOT_FOUND and not ERR_NOT_RESOURCE_OWNER"
            - "GET /project-requests?cycle_id=${cycle_id} returns total_count == 0"
      - name: error_program_cycle_not_found_beats_zero_hours_and_validation
        claim_type: error_triggerable
        grounds: ["errors[ERR_PROGRAM_CYCLE_NOT_FOUND]", "validations[priority=4]", "validations[priority=17]", "validations[priority=19]", "endpoints[POST /project-requests]"]
        distinguishing_aspect: "The partner_org_id resolves so priority 3 passes; cycle_id does not, and priority 4 fires ahead of both the priority-17 enum check on discipline and the priority-19 zero-hours check, so a body that is wrong three ways answers exactly 404 ERR_PROGRAM_CYCLE_NOT_FOUND."
        test_recipe:
          setup: ["One real partner org whose id is used as both the caller and the payload FK."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "cycle-nope", title: "Triple-fault request", discipline: BASKET_WEAVING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 0.00, urgency: ROUTINE}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROGRAM_CYCLE_NOT_FOUND\" - not ERR_VALIDATION and not ERR_ZERO_HOURS_NOT_ALLOWED"
            - "GET /partner-orgs/${partner_id}/summary shows open_engagement_count == 0"
      - name: error_project_request_not_found_beats_invalid_request_state
        claim_type: error_triggerable
        grounds: ["errors[ERR_PROJECT_REQUEST_NOT_FOUND]", "validations[priority=5]", "validations[priority=20]", "endpoints[POST /project-requests/{id}/submit-for-scoping]"]
        distinguishing_aspect: "A path id that resolves to nothing cannot have a status, so the 404 at priority 5 must precede the priority-20 state check: the response is 404 ERR_PROJECT_REQUEST_NOT_FOUND, never 409 ERR_INVALID_REQUEST_STATE."
        test_recipe:
          setup: ["One partner, one cycle and one real DRAFT request that is not the one targeted."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests/req-nope/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROJECT_REQUEST_NOT_FOUND\""
            - "GET /project-requests/${req_id} still shows status == \"DRAFT\", proving the real request was untouched"
      - name: error_scope_definition_not_found_beats_weight_total_invalid
        claim_type: error_triggerable
        grounds: ["errors[ERR_SCOPE_DEFINITION_NOT_FOUND]", "validations[priority=6]", "validations[priority=17]", "endpoints[POST /scope-definitions/{id}/deliverables]"]
        distinguishing_aspect: "The body carries weight_pct 250.00, which would fail range validation and would also push a real revision's total above 100.00; the unresolvable path id short-circuits both, so the answer is 404 ERR_SCOPE_DEFINITION_NOT_FOUND."
        test_recipe:
          setup: ["One partner and one cycle only - no scope revision has ever been authored."]
          setup_api_calls:
