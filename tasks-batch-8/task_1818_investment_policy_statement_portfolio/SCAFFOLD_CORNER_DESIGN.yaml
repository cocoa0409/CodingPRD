            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50, review_cadence_months: 1 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}", captures: { act: $.data.activated_at, due: $.data.next_review_due } }
          assert:
            - "activated_at == 2026-08-31T10:00:00Z"
            - "next_review_due == 2026-09-30T10:00:00Z (day clamped 31 -> 30, time preserved)"
      - name: performance_flow_window_excludes_period_start_date
        claim_type: input_set_filtering
        grounds:
          - "calculations.performance_return"
          - "entities.CashFlowEvent.fields.occurred_at"
        distinguishing_aspect: "Flows are selected by UTC date in (period_start, period_end]: the deposit dated exactly 2026-08-01 is excluded. If it were wrongly included, its valuation_before 0 would zero a TWR sub-period (return -10000 bps); correct result is 0 bps."
        test_recipe:
          setup: ["ACTIVE portfolio (CASH 100/50 IPS); E1 DEPOSIT 500000 occurred 2026-08-01; E2 DEPOSIT 100000 occurred 2026-08-05; report period [2026-08-01, 2026-08-10], beg 500000, end 600000, TIME_WEIGHTED"]
          setup_api_calls:
