                routing_window_end_utc: "2026-08-20T00:00:00Z"
                min_days_between_engagements: 0
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Tessellate: Untitled Work No. 4"
                load_in_start_utc: "2026-08-10T08:00:00Z"
                performance_start_utc: "2026-08-10T19:00:00Z"
                performance_end_utc: "2026-08-10T22:00:00Z"
                load_out_end_utc: "2026-08-11T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 0
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload:
                tier_name: "GA"
                seats_allocated: 100
                base_price_cents: 5000
                price_ceiling_cents: 6000
                dynamic_pricing_enabled: false
                subscription_eligible: false
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              payload: {}
              captures: { eng_v_pre_neg: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 500000
                offered_artist_share_pct: 0.20
                expected_engagement_version: "${eng_v_pre_neg}"
              captures: { neg_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
