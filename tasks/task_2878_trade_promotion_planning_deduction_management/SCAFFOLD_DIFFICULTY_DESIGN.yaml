  - rule_id: cross_entity_state_dependency
    instances:
      - name: promotion_create_gated_on_budget_allocation_status
        entity_pair: [Promotion, BudgetAllocation]
        grounds:
          - validations.priority_41
          - state_machines.BudgetAllocation.status
          - errors.ERR_ALLOCATION_NOT_APPROVED
          - endpoints.POST_/trade-marketing/promotions
        distinguishing_aspect: |
          Whether a Promotion may be created at all is decided by a state field on a different
          entity: the parent BudgetAllocation must be APPROVED, not DRAFT. The request payload is
          byte-identical in both attempts apart from the OCC version token, and the promotion
          entity itself does not exist yet, so nothing in the promotion's own data explains the
          409. An implementation that validates only the promotion's own fields, or that treats
          "allocation exists" as sufficient, admits the first call and creates an orphaned
          promotion against an unapproved budget line.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program, brand and customer."
            - "One BudgetAllocation left in DRAFT, planned_amount 100000.00, planned_incremental_units 20000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 5000000.00, accrual_method_default: "SHIPMENT" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id, alloc_v0: $.data.version }
          trigger:
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Gated Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_v0}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Gated Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
          assert:
            - "first create -> 409 ERR_ALLOCATION_NOT_APPROVED while BudgetAllocation.${alloc_id}.status == DRAFT"
            - "the refused create wrote nothing: GET /trade-marketing/promotions?allocation_id=${alloc_id} returns total_count 0 immediately after it"
            - "the refused create did not bump the parent: BudgetAllocation.${alloc_id}.version is still ${alloc_v0} until the approve call"
            - "second create -> 201 with Promotion.${promo_id}.lifecycle_status == DRAFT, spend_status == WITHIN_BUDGET, performance_flag == UNRATED, revision_round == 0"
            - "BudgetAllocation.${alloc_id}.status == APPROVED and committed_amount == 0.00 (creating a DRAFT promotion reserves nothing)"

      - name: deduction_settle_gated_on_customer_trading_status
        entity_pair: [Deduction, Customer]
        grounds:
          - validations.priority_53
          - state_machines.Customer.trading_status
          - state_machines.Deduction.status
          - errors.ERR_CUSTOMER_CREDIT_HOLD
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency from the promotion
          instance: the Deduction is in exactly the right own-state (VALIDATED) and the request
          body is empty, yet settlement is decided by the Customer's trading_status. Two customers
          hold identical VALIDATED deductions of 1000.00 under identical AGREEMENT_CAP promotions;
          the ACTIVE customer's deduction settles with 200 and the CREDIT_HOLD customer's is
          refused with 409. An implementation that checks only Deduction.status settles both, and
          one that reads the customer's audit_status instead of trading_status settles both as
          well, since both customers are audit_status CLEAR.
