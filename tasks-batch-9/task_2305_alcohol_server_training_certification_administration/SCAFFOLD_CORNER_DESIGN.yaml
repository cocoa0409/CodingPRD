      - name: occ_course_revision_rejects_the_version_the_editor_read_before_publication
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.course-revision-stale-course
          - endpoints.PATCH_/courses/{id}
          - errors.ERR_STALE_COURSE_VERSION
        distinguishing_aspect: |
          Publishing bumps Course.version, so a revision computed against the pre-publish
          version returns ERR_STALE_COURSE_VERSION (412) and content_revision_count stays 0;
          re-reading and retrying applies the revision and raises content_revision_count to
          1 while the status remains PUBLISHED.
        test_recipe:
          setup:
            - "A PUBLISHED ON_PREMISE course; the editor captured the version at creation, before publication."
          setup_api_calls:
