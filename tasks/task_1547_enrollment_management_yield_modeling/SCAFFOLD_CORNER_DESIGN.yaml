              captures: { stage1: $.data.funnel_stage }
          assert:
            - "Cycle: inquiry_count == 2, application_count == 1"
            - "Applicant 1 funnel_stage == APPLIED (auto-transition on first application); applicant 2 remains INQUIRY"

      - name: melt_threshold_exact_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.melt_risk_score, entities.MeltIntervention.fields.trigger_source]
        distinguishing_aspect: "Cumulative threshold precision: application X's risk computes to exactly 0.7000 (>= threshold) -> an AUTO_THRESHOLD intervention appears; application Y computes to 0.6999 (< threshold) -> none."
        test_recipe:
          setup:
            - "Cycle DECISIONS_RELEASED at clock 2027-04-01; program budget 5000000 tuition 5000000 capacity 4 target 3"
            - "X (NATIONAL, NEED_BASED efc 4375000 -> award 625000 -> aid_gap 4375000 -> g 0.875 -> risk 0.40*0.875+0.25*0.6+0.20*1+0.15*0 = 0.7000)"
            - "Y (INTERNATIONAL, NEED_BASED efc 3124000 -> award 1876000 -> aid_gap 3124000 -> g 0.6248 -> risk 0.2499+0.2500+0.2000 = 0.6999)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "THR", capacity_seats: 4, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 5000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Th X", email: "thx@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "NATIONAL" }
              as: AdmissionsOfficer
              captures: { ap_x: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Th Y", email: "thy@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "INTERNATIONAL" }
              as: AdmissionsOfficer
              captures: { ap_y: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_x}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 85, efc_cents: 4375000 }
              as: AdmissionsOfficer
              captures: { app_x: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_y}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 85, efc_cents: 3124000 }
              as: AdmissionsOfficer
              captures: { app_y: $.data.id }
            # --- X to ADMITTED + NEED_BASED offer accepted ---
            - { call: "POST /enrollment/applications/${app_x}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_x}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rx1: $.data.id }
            - { call: "POST /enrollment/reviews/${rx1}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_x}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rx2: $.data.id }
            - { call: "POST /enrollment/reviews/${rx2}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_x}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_x}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_x_v: $.data.version }
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_x}", fund_type: "NEED_BASED", expected_application_version: "${app_x_v}" }
              as: FinancialAidOfficer
              captures: { offer_x: $.data.id, offer_x_amt: $.data.amount_cents }
            - { call: "POST /enrollment/aid-offers/${offer_x}/transition", payload: { to_status: "ACCEPTED" }, as: Applicant, as_user_id: "${ap_x}" }
            # --- Y to ADMITTED + NEED_BASED offer accepted ---
            - { call: "POST /enrollment/applications/${app_y}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_y}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ry1: $.data.id }
            - { call: "POST /enrollment/reviews/${ry1}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_y}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ry2: $.data.id }
            - { call: "POST /enrollment/reviews/${ry2}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_y}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_y}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_y_v: $.data.version }
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_y}", fund_type: "NEED_BASED", expected_application_version: "${app_y_v}" }
              as: FinancialAidOfficer
              captures: { offer_y: $.data.id, offer_y_amt: $.data.amount_cents }
            - { call: "POST /enrollment/aid-offers/${offer_y}/transition", payload: { to_status: "ACCEPTED" }, as: Applicant, as_user_id: "${ap_y}" }
            # --- phases + deposits ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_x}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_x}" }
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_y}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_y}" }
            - call: "GET /enrollment/applications/${app_x}"
              payload: {}
              as: EnrollmentManager
              captures: { risk_x: $.data.melt_risk_score }
            - call: "GET /enrollment/applications/${app_y}"
              payload: {}
              as: EnrollmentManager
              captures: { risk_y: $.data.melt_risk_score }
            - call: "GET /enrollment/interventions?application_id=${app_x}"
              payload: {}
              as: EnrollmentManager
            - call: "GET /enrollment/interventions?application_id=${app_y}"
              payload: {}
              as: EnrollmentManager
          assert:
            - "${offer_x_amt} == 625000 and ${offer_y_amt} == 1876000"
            - "${risk_x} == 0.7000 and exactly one AUTO_THRESHOLD SCHEDULED MeltIntervention exists for X"
            - "${risk_y} == 0.6999 and NO intervention exists for Y (0.6999 < 0.70)"

  # ==================================================== consistency model
  - section: consistency_model
    instances:
      - name: create_response_immediately_consistent
        claim_type: immediate
        grounds: [complexity_profile, entities.Program.fields.seats_open]
        distinguishing_aspect: "The POST /enrollment/programs response itself carries the computed fields (seats_open == capacity_seats, scholarship_available_cents == budget, intake_posture == OPEN) — no re-read needed under the immediate consistency model."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "IMM", capacity_seats: 7, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 900000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_seats: $.data.seats_open, p_avail: $.data.scholarship_available_cents, p_posture: $.data.intake_posture }
          assert:
            - "${p_seats} == 7 and ${p_avail} == 900000 and ${p_posture} == OPEN in the create response"
