# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Difficulty-covered corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: student_create_missing_required_gpa_rejected
        claim_type: required_fields
        grounds: ["entities.Student.fields.gpa_hundredths", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "gpa_hundredths is a required input with no default; omitting it fails with ERR_VALIDATION (400) before any persistence."
        test_recipe:
          setup: ["empty DB at default clock"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "No Gpa", email: "nogpa@x.com", grade_level: 12, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION with HTTP 400"
            - "GET /api/students would show total_count == 0 (nothing persisted)"

      - name: student_defaults_applied_on_create
        claim_type: defaults
        grounds: ["entities.Student.fields.tags", "entities.Student.fields.status"]
        distinguishing_aspect: "Omitting optional fields applies declared defaults: tags == [] and status == ACTIVE on the create response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "Def Ault", email: "def@x.com", grade_level: 11, gpa_hundredths: 300, residency_state: "OR", intended_major: "ARTS", household_income_cents: 4000000, efc_cents: 1000000, cost_of_attendance_cents: 2500000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id, s_tags: $.data.tags, s_status: $.data.status, s_cap: $.data.aid_cap_cents }
          assert:
            - "s_tags == [] (declared default)"
            - "s_status == ACTIVE (declared default)"
            - "s_cap == 1500000 (computed 2500000 - 1000000 at create)"

      - name: student_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Student.fields.total_accepted_cents"]
        distinguishing_aspect: "Client-supplied computed fields are ignored: posting total_accepted_cents 999999 still yields 0 on the response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "Sneaky", email: "snk@x.com", grade_level: 12, gpa_hundredths: 300, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U", total_accepted_cents: 999999 }
              as: ScholarshipCoordinator
              captures: { s_total: $.data.total_accepted_cents, s_excess: $.data.excess_cents }
          assert:
            - "s_total == 0 and s_excess == 0 (computed fields ignore client input)"

      - name: student_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Student"]
        distinguishing_aspect: "System fields are server-minted: a client-supplied id is discarded; version starts at 1; created_at equals the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty DB at default clock"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "Sys Fields", email: "sys@x.com", grade_level: 12, gpa_hundredths: 300, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U", id: "00000000-0000-4000-8000-0000000000ff", version: 42 }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id, s_ver: $.data.version, s_created: $.data.created_at }
          assert:
            - "s_id != '00000000-0000-4000-8000-0000000000ff' (server-minted UUID with no type prefix)"
            - "s_ver == 1"
            - "s_created == '2026-08-01T00:00:00Z' (logical clock default, never wall clock)"

      - name: student_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404), not a 500 or empty envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: program_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.ScholarshipProgram.fields.program_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "program_type is a closed enum {MERIT, NEED, HYBRID}; 'SPORTS' is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["donor and fund exist"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { name: "E Donor", contact_email: "e@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "E Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /api/scholarship-programs"
              payload: { name: "Bad Enum", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "SPORTS", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION with HTTP 400"

      - name: program_create_inverted_window_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_DATE_RANGE]", "entities.ScholarshipProgram.fields.application_close_at"]
        distinguishing_aspect: "application_close_at must be strictly after application_open_at; an inverted window fails with ERR_INVALID_DATE_RANGE (400)."
        test_recipe:
          setup: ["donor and fund exist"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { name: "D Donor", contact_email: "dd@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "D Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /api/scholarship-programs"
              payload: { name: "Inverted", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-09-15T00:00:00Z", application_close_at: "2026-08-01T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_DATE_RANGE with HTTP 400"

      - name: applications_list_pagination_defaults_and_limit
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "List responses carry the fixed pagination fields with defaults limit=10/offset=0; an explicit limit=1 over a 2-row result sets has_more=true while total_count stays 2."
        test_recipe:
          setup: ["two students each with one DRAFT application to the same OPEN program"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Pg One", email: "pg1@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_1: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "Pg Two", email: "pg2@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_2: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Pg Donor", contact_email: "pg@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Pg Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Pg Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_1}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_2}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
          trigger:
            - call: "GET /api/applications?program_id=${p_id}"
              as: ScholarshipCoordinator
            - call: "GET /api/applications?program_id=${p_id}&limit=1&offset=1"
              as: ScholarshipCoordinator
          assert:
            - "First response: response_type == 'array', data has 2 items, pagination shows limit == 10 (default), offset == 0, total_count == 2, has_more == false"
            - "Second response: 1 item, limit == 1, offset == 1, total_count == 2, has_more == false (offset 1 consumed the last row; the first page limit=1&offset=0 would show has_more == true)"

      - name: applications_list_filter_by_student
        claim_type: listing
        grounds: ["entities.Application.fields.student_id", "endpoints"]
        distinguishing_aspect: "FK-filtered list returns exactly the matching rows: filtering by student A's id returns only A's application even though B applied to the same program (FK reverse-reachability correctness)."
        test_recipe:
          setup: ["two students each with one application to the same OPEN program"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Fk One", email: "fk1@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_1: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "Fk Two", email: "fk2@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_2: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Fk Donor", contact_email: "fk@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Fk Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Fk Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_1}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_1: $.data.id }
            - call: "POST /api/applications"
              payload: { student_id: "${s_2}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
          trigger:
            - call: "GET /api/applications?student_id=${s_1}"
              as: ScholarshipCoordinator
              captures: { only_app: "$.data[0].id" }
          assert:
            - "total_count == 1 and the sole row id == ${app_1} (student B's application excluded)"

  - section: state_machines
    instances:
      - name: program_publish_before_window_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ScholarshipProgram.DRAFT_to_OPEN", "errors[ERR_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "Publish before application_open_at fails with ERR_WINDOW_NOT_OPEN (422); the gate is inclusive (now >= open_at), so publishing exactly at open_at succeeds."
        test_recipe:
          setup: ["program with application_open_at 2026-08-15 (after the default clock 2026-08-01)"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { name: "W Donor", contact_email: "w@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "W Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "W Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-15T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id, p_status: $.data.status }
          trigger:
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
              captures: { p_status_after: $.data.status }
          assert:
            - "p_status == DRAFT (initial state on create)"
            - "First publish: err == ERR_WINDOW_NOT_OPEN with HTTP 422"
            - "Second publish at exactly open_at: p_status_after == OPEN (inclusive gate)"

      - name: program_extend_reopens_closed_cycle
        claim_type: valid_transition
        grounds: ["state_machines.ScholarshipProgram.CLOSED_to_OPEN"]
        distinguishing_aspect: "The CLOSED -> OPEN extend edge is a real cycle: after extension the program accepts submissions again under the new close_at, proving the machine is not a linear pipeline."
        test_recipe:
          setup: ["program published then manually CLOSED at the default clock (close_at 2026-09-01 unchanged); the application is created only after the extension reopens the program"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Ex Tend", email: "ex@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Ex Donor", contact_email: "ex@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Ex Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Ex Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-01T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/scholarship-programs/${p_id}/close"
              as: ScholarshipCoordinator
          trigger:
            - call: "POST /api/scholarship-programs/${p_id}/extend"
              payload: { new_close_at: "2026-10-01T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_status: $.data.status, p_close: $.data.application_close_at }
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/submit"
              as: ScholarshipCoordinator
              captures: { app_status: $.data.status }
          assert:
            - "p_status == OPEN and p_close == '2026-10-01T00:00:00Z' (extend reopened the cycle)"
            - "app_status == SUBMITTED (the reopened program accepts submissions at the default clock, now < new close)"
          note: "run_daily expiry of the old DRAFT application is covered by run_daily_closes_program_expires_drafts; here the application is created after reopening"

      - name: program_archive_blocked_then_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ScholarshipProgram.CLOSED_to_ARCHIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Archive is refused while a non-terminal application exists (ERR_INVALID_STATE); once ARCHIVED, every further action (publish) is refused — terminal lockdown."
        test_recipe:
          setup: ["program CLOSED with one SUBMITTED application"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Ar Chive", email: "ar@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Ar Donor", contact_email: "ar@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Ar Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Ar Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/scholarship-programs/${p_id}/close"
              as: ScholarshipCoordinator
          trigger:
            - call: "POST /api/scholarship-programs/${p_id}/archive"
              as: ScholarshipCoordinator
              captures: { err_1: $.data.error_id }
            - call: "POST /api/applications/${app_id}/withdraw"
              as: ScholarshipCoordinator
            - call: "POST /api/scholarship-programs/${p_id}/archive"
              as: ScholarshipCoordinator
              captures: { p_status: $.data.status }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
              captures: { err_2: $.data.error_id }
          assert:
            - "err_1 == ERR_INVALID_STATE (409): SUBMITTED application blocks archival"
            - "After withdrawing the application: archive succeeds, p_status == ARCHIVED"
            - "err_2 == ERR_INVALID_STATE (409): ARCHIVED is terminal, publish rejected"

      - name: application_withdraw_then_submit_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Application", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal for an application: a later submit attempt is rejected with ERR_INVALID_STATE and leaves reminders SUPPRESSED."
        test_recipe:
          setup: ["DRAFT application on an OPEN program"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Wd Raw", email: "wd@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Wd Donor", contact_email: "wd@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Wd Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Wd Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_id}" }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/applications/${app_id}/withdraw"
              as: Student
              as_user_id: "${s_id}"
              captures: { st_1: $.data.status }
            - call: "POST /api/applications/${app_id}/submit"
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "st_1 == WITHDRAWN"
            - "err == ERR_INVALID_STATE (409) on submit from WITHDRAWN"
