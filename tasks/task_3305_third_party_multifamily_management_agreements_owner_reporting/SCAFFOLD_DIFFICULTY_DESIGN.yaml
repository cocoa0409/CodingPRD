              payload: { unit_label: "W1", recommended_rent_cents: 200000, effective_start_date: "2026-10-01T00:00:00Z", effective_end_date: "2026-11-01T00:00:00Z" }
              as: RevenueAnalyst
              captures: { pr15_base: $.data.id }
            - call: "POST /mgmt/pricing/${pr15_base}/publish"
              payload: {}
              as: RevenueAnalyst
          trigger:
            - call: "POST /mgmt/properties/${p15_id}/pricing"
              payload: { unit_label: "W1", recommended_rent_cents: 205000, effective_start_date: "2026-11-01T00:00:00Z", effective_end_date: "2026-12-01T00:00:00Z" }
              as: RevenueAnalyst
              captures: { pr15_adj: $.data.id }
