scenario: |
  Securities Filings & Section 16 Reporting (public company SEC reporting team): insider list maintenance & reporting person designation, transaction reporting deadline (Form 4 two business days) tracking, equity plan transaction feed & automatic form generation, Form 3/5 annual sweep & late-filing disclosure, EDGAR codes & filing agent coordination, 10b5-1 plan adoption & cooling-off period, Section 16(b) short-swing profit analysis, beneficial ownership (13D/G) threshold monitoring

domain_name: securities-filings-section-16
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology, FK links in bodies)
# =============================================================================
entities:
  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Issuer legal name" }
      - { name: ticker, type: string, source: input, description: "Exchange ticker symbol" }
      - { name: cik, type: string, source: input, description: "SEC Central Index Key, 10-digit string" }
      - { name: edgar_ccc, type: string, source: input, description: "Current EDGAR CCC confirmation code; submissions must present the current value" }
      - { name: shares_outstanding, type: integer, source: input, constraints: "> 0", description: "Common shares outstanding; denominator of basic ownership percentage" }
      - { name: fiscal_year_end_month, type: integer, source: input, constraints: "1..12", description: "Month number of fiscal year end (e.g. 12 = December 31)" }
      - { name: holiday_dates, type: array, source: input, default: [], description: "Exchange holiday dates as 'YYYY-MM-DD' strings; skipped by the business-day routine" }
      - { name: next_earnings_filing_date, type: string, source: input, default: null, description: "Date 'YYYY-MM-DD' of the next periodic earnings report (10-Q/10-K); input to officer/director cooling-off extension" }

  - name: ReportingPerson
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; issuer whose securities the insider reports on" }
      - { name: full_name, type: string, source: input, description: "Insider full legal name" }
      - { name: person_cik, type: string, source: input, description: "Insider's individual SEC CIK" }
      - { name: is_director, type: boolean, source: input, default: false, description: "Board director flag; drives extended 10b5-1 cooling-off" }
      - { name: is_officer, type: boolean, source: input, default: false, description: "Section 16 officer flag; drives extended 10b5-1 cooling-off" }
      - { name: is_ten_pct_owner, type: boolean, source: input, default: false, description: "Greater-than-10-percent beneficial owner flag" }
      - { name: status, type: enum, source: system, constraints: "PROPOSED | ACTIVE | EXITED", description: "Designation lifecycle state" }
      - { name: designation_date, type: string, source: system, default: null, description: "Date (YYYY-MM-DD, logical clock) the person became subject to Section 16; set by DESIGNATE and REINSTATE" }
      - { name: exit_date, type: string, source: system, default: null, description: "Date (YYYY-MM-DD, logical clock) insider status ended; set by EXIT, cleared by REINSTATE" }
      - { name: late_filing_count, type: integer, source: computed, default: 0, description: "Lifetime count of filings accepted with is_late = true; never decremented" }
      - { name: delinquent_flag, type: boolean, source: computed, default: false, description: "True once late_filing_count >= DELINQUENT_LATE_THRESHOLD (2); sticky, never auto-clears" }
      - { name: open_obligation_count, type: integer, source: computed, default: 0, description: "= COUNT(SecuritiesFiling with reporting_person_id = this.id AND status IN {DRAFT, READY, SUBMITTED}); recomputed on every filing status change" }

  - name: SecurityTransaction
    parent: null
    common_fields: true
    fields:
      - { name: reporting_person_id, type: string, source: input, description: "FK -> ReportingPerson.id; insider who transacted" }
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; denormalized from the reporting person at ingest" }
      - { name: filing_id, type: string, source: system, default: null, description: "FK -> SecuritiesFiling.id; filing that reports this transaction; null while unfiled" }
      - { name: plan_id, type: string, source: input, default: null, description: "FK -> TradingPlan10b5_1.id; set when the trade executes under a 10b5-1 plan" }
      - { name: transaction_date, type: string, source: input, description: "Execution date YYYY-MM-DD; may be earlier than the logical clock date, never later" }
      - { name: transaction_code, type: enum, source: input, constraints: "P | S | A | M | F | G | V", description: "P open-market purchase, S sale, A grant/award, M option exercise, F tax withholding, G gift, V vest" }
      - { name: security_type, type: enum, source: input, constraints: "COMMON_STOCK | OPTION | RSU | DERIVATIVE_OTHER", description: "Security class of the transaction" }
      - { name: shares, type: integer, source: input, constraints: "> 0", description: "Share count transacted" }
      - { name: price_per_share, type: number, source: input, default: null, description: "Execution price; required for codes P and S, optional otherwise" }
      - { name: source, type: enum, source: input, default: "MANUAL", constraints: "EQUITY_PLAN_FEED | MANUAL", description: "Ingestion channel" }
      - { name: direction, type: enum, source: computed, constraints: "ACQUIRED | DISPOSED", description: "= ACQUIRED for codes {P, A, M, V}; = DISPOSED for codes {S, F, G}" }
      - { name: shares_owned_after, type: integer, source: computed, default: null, description: "Running balance per (reporting_person_id, security_type) over transactions with status IN {CONFIRMED, REPORTED}, ordered by transaction_date ASC then created_at ASC; null while INGESTED or VOID" }
      - { name: ingested_by_user_id, type: string, source: system, description: "X-User-ID of the creator; drives the ingester/confirmer segregation-of-duties check" }
      - { name: status, type: enum, source: system, constraints: "INGESTED | CONFIRMED | REPORTED | VOID", description: "Transaction lifecycle state" }

  - name: SecuritiesFiling
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: reporting_person_id, type: string, source: input, description: "FK -> ReportingPerson.id" }
      - { name: form_type, type: enum, source: input, constraints: "FORM_3 | FORM_4 | FORM_5", description: "SEC form type" }
      - { name: amends_filing_id, type: string, source: system, default: null, description: "FK -> SecuritiesFiling.id; set on amendments, references the filing being amended (self-referential)" }
      - { name: filing_deadline, type: string, source: computed, description: "Due date YYYY-MM-DD per filing_deadline calculation (2 business days for FORM_4, +10 calendar days for FORM_3, FY-end +45 for FORM_5)" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "Set once at acceptance: date(accepted_at) > filing_deadline; never recomputed afterwards" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | READY | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED | DISCARDED", description: "Filing lifecycle state" }
      - { name: prepared_by_user_id, type: string, source: system, default: null, description: "X-User-ID of creator; null for system-generated drafts (auto Form 4 on confirm, Form 3 on designation, Form 5 on sweep); drives SOD submit check" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the filing agent who submitted" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of EDGAR acceptance" }
      - { name: accession_number, type: string, source: system, default: null, description: "EDGAR accession number recorded on acceptance" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "EDGAR rejection reason recorded on rejection" }

  - name: TradingPlan10b5_1
    parent: null
    common_fields: true
    fields:
      - { name: reporting_person_id, type: string, source: input, description: "FK -> ReportingPerson.id; insider adopting the plan" }
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; denormalized from the reporting person at creation" }
      - { name: plan_name, type: string, source: input, description: "Human label for the plan" }
      - { name: first_trade_date, type: string, source: input, description: "Intended trading window start YYYY-MM-DD; half-open interval [first_trade_date, expiration_date)" }
      - { name: expiration_date, type: string, source: input, description: "Intended trading window end YYYY-MM-DD, exclusive" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | PENDING_APPROVAL | ADOPTED | ACTIVE | SUSPENDED | REJECTED | TERMINATED", description: "Plan lifecycle state" }
      - { name: adoption_date, type: string, source: system, default: null, description: "Logical-clock date of approval (DRAFT->PENDING_APPROVAL->ADOPTED)" }
      - { name: cooling_off_end_date, type: string, source: computed, default: null, description: "Computed once at approval per cooling_off_end_date calculation; immutable thereafter (suspend/reinstate MUST NOT change it)" }
      - { name: termination_date, type: string, source: system, default: null, description: "Logical-clock date of termination" }

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: start_date, type: string, source: input, description: "Blackout start YYYY-MM-DD, inclusive (closed interval)" }
      - { name: end_date, type: string, source: input, description: "Blackout end YYYY-MM-DD, inclusive (closed interval); must be >= start_date" }
      - { name: reason, type: string, source: input, default: null, description: "Optional description (e.g. quarterly earnings blackout)" }

  - name: BeneficialHolder
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: holder_name, type: string, source: input, description: "Beneficial owner name (fund, individual, entity)" }
      - { name: holder_cik, type: string, source: input, default: null, description: "Holder CIK if known" }
      - { name: shares_beneficially_owned, type: integer, source: computed, default: 0, description: "= SUM(PositionChange.shares_delta) over all PositionChange with holder_id = this.id" }
      - { name: exercisable_derivative_shares, type: integer, source: computed, default: 0, description: "= SUM(PositionChange.derivative_shares_delta); derivative shares exercisable within 60 days" }
      - { name: current_pct, type: number, source: computed, default: 0, description: "Basic ownership percentage, 2 decimals half-up: 100 * shares_beneficially_owned / issuer.shares_outstanding; drives threshold monitoring" }
      - { name: fully_diluted_pct, type: number, source: computed, default: 0, description: "Fully diluted variant: 100 * (shares + exercisable_derivative_shares) / (shares_outstanding + exercisable_derivative_shares); informational only, never gates thresholds" }
      - { name: last_reported_pct, type: number, source: system, default: null, description: "current_pct snapshot taken at the most recent file-schedule; basis for the 1.00 amendment trigger" }
      - { name: schedule_type, type: enum, source: system, default: null, constraints: "SCHEDULE_13D | SCHEDULE_13G | null", description: "Schedule filed most recently" }
      - { name: status, type: enum, source: system, constraints: "MONITORING | FILING_REQUIRED | FILED | AMENDMENT_REQUIRED", description: "Threshold monitoring state" }

  - name: PositionChange
    parent: null
    common_fields: false
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> BeneficialHolder.id" }
      - { name: shares_delta, type: integer, source: input, constraints: "!= 0", description: "Signed share change (positive acquisition, negative disposition)" }
      - { name: derivative_shares_delta, type: integer, source: input, default: 0, description: "Signed change in 60-day-exercisable derivative shares" }
      - { name: effective_date, type: string, source: input, description: "Date YYYY-MM-DD the position changed; must not be later than the logical clock date" }
      - { name: note, type: string, source: input, default: null, description: "Optional annotation" }

  - name: AnnualSweep
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year number; unique per issuer among sweeps with status IN {OPEN, COMPLETED}" }
      - { name: fy_start_date, type: string, source: computed, description: "Fiscal window start: day after prior fiscal year end, inclusive" }
      - { name: fy_end_date, type: string, source: computed, description: "Fiscal window end: last day of fiscal_year_end_month in fiscal_year, inclusive" }
      - { name: status, type: enum, source: system, constraints: "OPEN | COMPLETED", description: "Sweep lifecycle" }
      - { name: run_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the run" }
      - { name: results, type: array, source: computed, default: [], description: "One object per in-scope person: {reporting_person_id, late_filing_count, unreported_exempt_count, needs_form5, delinquent, form5_filing_id|null}" }

  - name: FilingAgentAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: agent_user_id, type: string, source: input, description: "Opaque X-User-ID of the authorized filing agent operator" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | REVOKED", description: "Authorization lifecycle; only ACTIVE authorizations permit submission" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ReportingPerson
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /reporting-persons/{personId}/transitions {action: DESIGNATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Person status == PROPOSED (ERR_PERSON_INVALID_STATE)"
        side_effects:
          - "designation_date = logical clock date"
          - "System creates a DRAFT FORM_3 SecuritiesFiling (prepared_by_user_id = null) with filing_deadline = designation_date + 10 calendar days"
          - "Recompute ReportingPerson.open_obligation_count (+1 for the new DRAFT)"
      - from: ACTIVE
        to: EXITED
        trigger: "POST /reporting-persons/{personId}/transitions {action: EXIT}"
        actor: ComplianceOfficer
        preconditions:
          - "Person status == ACTIVE (ERR_PERSON_INVALID_STATE)"
        side_effects:
          - "exit_date = logical clock date"
      - from: EXITED
        to: ACTIVE
        trigger: "POST /reporting-persons/{personId}/transitions {action: REINSTATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Person status == EXITED (ERR_PERSON_INVALID_STATE)"
        side_effects:
          - "designation_date = logical clock date; exit_date = null"
          - "System creates a DRAFT FORM_3 SecuritiesFiling with filing_deadline = designation_date + 10 calendar days"
          - "Recompute ReportingPerson.open_obligation_count (+1)"
        note: "Reinstatement loop makes the machine cyclic (ACTIVE -> EXITED -> ACTIVE)"

  - entity: SecurityTransaction
    initial_state: INGESTED
    terminal_states: [VOID, REPORTED]
    transitions:
      - from: INGESTED
        to: CONFIRMED
        trigger: "POST /transactions/{transactionId}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "Transaction status == INGESTED (ERR_TRANSACTION_INVALID_STATE)"
          - "ReportingPerson (SecurityTransaction.reporting_person_id) status == ACTIVE (ERR_PERSON_NOT_ACTIVE)"
          - "SOD: X-User-ID != ingested_by_user_id (ERR_SOD_INGESTER_CONFIRMER)"
          - "If plan_id set: TradingPlan10b5_1.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "If plan_id null: transaction_date not inside any BlackoutWindow of the issuer (closed interval, ERR_BLACKOUT_PERIOD)"
          - "transaction_date <= logical clock date (ERR_FUTURE_TRANSACTION_DATE)"
          - "If plan_id set: plan.reporting_person_id == transaction.reporting_person_id (ERR_PLAN_PERSON_MISMATCH)"
        side_effects:
          - "Compute direction and recompute shares_owned_after for the (person, security_type) chain"
          - "If transaction_code != G: system creates a DRAFT FORM_4 SecuritiesFiling (prepared_by_user_id = null), attaches this transaction (filing_id set), filing_deadline = transaction_date + 2 business days"
          - "That filing creation itself triggers recomputation of ReportingPerson.open_obligation_count (+1) — cascade hop 2"
      - from: INGESTED
        to: VOID
        trigger: "POST /transactions/{transactionId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "Transaction status IN {INGESTED, CONFIRMED} (ERR_TRANSACTION_INVALID_STATE)"
        side_effects:
          - "Recompute shares_owned_after for the (person, security_type) chain"
      - from: CONFIRMED
        to: VOID
        trigger: "POST /transactions/{transactionId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "Transaction status IN {INGESTED, CONFIRMED} (ERR_TRANSACTION_INVALID_STATE)"
          - "Linked filing (if any) must have status IN {DRAFT, READY} — a SUBMITTED or ACCEPTED filing blocks void (ERR_TRANSACTION_INVALID_STATE)"
        side_effects:
          - "Linked DRAFT/READY filing -> DISCARDED and its transactions detached"
          - "That discard itself triggers recomputation of ReportingPerson.open_obligation_count (-1) — compensation of the confirm cascade"
          - "Recompute shares_owned_after for the (person, security_type) chain"
      - from: CONFIRMED
        to: REPORTED
        trigger: "system (automatic when the linked SecuritiesFiling is ACCEPTED)"
        actor: system
        preconditions:
          - "Linked filing transitioned SUBMITTED -> ACCEPTED"
        side_effects: []

  - entity: SecuritiesFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISCARDED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /filings/{filingId}/ready"
        actor: FilingCoordinator
        preconditions:
          - "Filing status == DRAFT (ERR_FILING_INVALID_STATE)"
        side_effects: []
      - from: READY
        to: DRAFT
        trigger: "POST /filings/{filingId}/reopen"
        actor: FilingCoordinator
        preconditions:
          - "Filing status IN {READY, REJECTED} (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "Clear submitted_at, submitted_by_user_id, rejection_reason"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /filings/{filingId}/reopen"
        actor: FilingCoordinator
        preconditions:
          - "Filing status IN {READY, REJECTED} (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "Clear submitted_at, submitted_by_user_id, rejection_reason"
        note: "Rejection revision loop DRAFT->READY->SUBMITTED->REJECTED->DRAFT makes the machine cyclic"
      - from: READY
        to: SUBMITTED
        trigger: "POST /filings/{filingId}/submit"
        actor: FilingAgent
        preconditions:
          - "Filing status == READY (ERR_FILING_INVALID_STATE)"
          - "An ACTIVE FilingAgentAuthorization exists with issuer_id == filing.issuer_id AND agent_user_id == X-User-ID (ERR_AGENT_NOT_AUTHORIZED)"
          - "SOD: filing.prepared_by_user_id is null OR != X-User-ID (ERR_SOD_PREPARER_SUBMITTER)"
          - "Payload edgar_ccc == issuer.edgar_ccc (ERR_EDGAR_CREDENTIAL_MISMATCH)"
        side_effects:
          - "submitted_at = logical clock; submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /filings/{filingId}/record-edgar-result {outcome: ACCEPTED}"
        actor: FilingAgent
        preconditions:
          - "Filing status == SUBMITTED (ERR_FILING_INVALID_STATE)"
          - "An ACTIVE FilingAgentAuthorization exists for (filing.issuer_id, X-User-ID) (ERR_AGENT_NOT_AUTHORIZED)"
        side_effects:
          - "accepted_at = logical clock; accession_number = payload value"
          - "Hop 1: is_late = (date(accepted_at) > filing_deadline), computed once"
          - "Hop 2 (caused by hop 1): if is_late, ReportingPerson.late_filing_count += 1"
          - "Hop 3 (caused by hop 2): if late_filing_count reaches DELINQUENT_LATE_THRESHOLD (2), ReportingPerson.delinquent_flag = true"
          - "All attached SecurityTransactions (filing_id == this.id) -> REPORTED"
          - "If amends_filing_id != null: the amended filing -> SUPERSEDED"
          - "Recompute ReportingPerson.open_obligation_count (-1)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /filings/{filingId}/record-edgar-result {outcome: REJECTED}"
        actor: FilingAgent
        preconditions:
          - "Filing status == SUBMITTED (ERR_FILING_INVALID_STATE)"
          - "An ACTIVE FilingAgentAuthorization exists for (filing.issuer_id, X-User-ID) (ERR_AGENT_NOT_AUTHORIZED)"
        side_effects:
          - "rejection_reason = payload value"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when an amendment filing referencing this filing is ACCEPTED)"
        actor: system
        preconditions:
          - "A SecuritiesFiling with amends_filing_id == this.id transitioned SUBMITTED -> ACCEPTED"
        side_effects: []
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /filings/{filingId}/discard OR system cascade from transaction void"
        actor: FilingCoordinator | system
        preconditions:
          - "Filing status == DRAFT (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "Detach covered transactions (their filing_id -> null) when discarded manually"
          - "Recompute ReportingPerson.open_obligation_count (-1)"

  - entity: TradingPlan10b5_1
    initial_state: DRAFT
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /trading-plans/{planId}/transitions {action: SUBMIT_ADOPTION}"
        actor: ReportingInsider (X-User-ID must equal plan.reporting_person_id)
        preconditions:
          - "Plan status == DRAFT (ERR_PLAN_INVALID_STATE)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: ADOPTED
        trigger: "POST /trading-plans/{planId}/transitions {action: APPROVE}"
        actor: ComplianceOfficer
        preconditions:
          - "Plan status == PENDING_APPROVAL (ERR_PLAN_INVALID_STATE)"
          - "Window overlap: no other TradingPlan10b5_1 of the same reporting_person_id with status IN {ADOPTED, ACTIVE, SUSPENDED} whose half-open window [first_trade_date, expiration_date) intersects this plan's window; intersection iff a.first_trade_date < b.expiration_date AND b.first_trade_date < a.expiration_date (ERR_PLAN_WINDOW_OVERLAP)"
        side_effects:
          - "adoption_date = logical clock date"
          - "cooling_off_end_date computed per cooling_off_end_date calculation; frozen thereafter"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /trading-plans/{planId}/transitions {action: REJECT}"
        actor: ComplianceOfficer
        preconditions:
          - "Plan status == PENDING_APPROVAL (ERR_PLAN_INVALID_STATE)"
        side_effects: []
      - from: ADOPTED
        to: ACTIVE
        trigger: "POST /trading-plans/{planId}/transitions {action: ACTIVATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Plan status == ADOPTED (ERR_PLAN_INVALID_STATE)"
          - "Logical clock date >= cooling_off_end_date (ERR_COOLING_OFF_NOT_SATISFIED); equality satisfies"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trading-plans/{planId}/transitions {action: SUSPEND}"
        actor: ComplianceOfficer
        preconditions:
          - "Plan status == ACTIVE (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "cooling_off_end_date MUST remain unchanged (compliance hold does not reset cooling-off)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trading-plans/{planId}/transitions {action: REINSTATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Plan status == SUSPENDED (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "cooling_off_end_date MUST remain unchanged"
        note: "ACTIVE <-> SUSPENDED loop makes the machine cyclic"
      - from: ADOPTED
        to: TERMINATED
        trigger: "POST /trading-plans/{planId}/transitions {action: TERMINATE}"
        actor: ComplianceOfficer | ReportingInsider (owner)
        preconditions:
          - "Plan status IN {ADOPTED, ACTIVE, SUSPENDED} (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "termination_date = logical clock date"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /trading-plans/{planId}/transitions {action: TERMINATE}"
        actor: ComplianceOfficer | ReportingInsider (owner)
        preconditions:
          - "Plan status IN {ADOPTED, ACTIVE, SUSPENDED} (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "termination_date = logical clock date"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /trading-plans/{planId}/transitions {action: TERMINATE}"
        actor: ComplianceOfficer | ReportingInsider (owner)
        preconditions:
          - "Plan status IN {ADOPTED, ACTIVE, SUSPENDED} (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "termination_date = logical clock date"

  - entity: AnnualSweep
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /annual-sweeps/{sweepId}/run"
        actor: ComplianceOfficer
        preconditions:
          - "Sweep status == OPEN (ERR_SWEEP_INVALID_STATE)"
        side_effects:
          - "run_at = logical clock; results computed per annual_sweep calculation"
          - "For each person with needs_form5 == true: system creates a DRAFT FORM_5 SecuritiesFiling (prepared_by_user_id = null), attaches that person's unreported exempt transactions, filing_deadline = fy_end_date + 45 calendar days, and records the new filing id in results[].form5_filing_id"
          - "Each such creation triggers recomputation of that person's open_obligation_count (+1)"

  - entity: BeneficialHolder
    initial_state: MONITORING
    terminal_states: []
    transitions:
      - from: MONITORING
        to: FILING_REQUIRED
        trigger: "system (automatic on PositionChange posting when current_pct crosses >= 5.00)"
        actor: system
        preconditions:
          - "current_pct >= 5.00 after recompute (equality triggers)"
        side_effects: []
      - from: FILING_REQUIRED
        to: FILED
        trigger: "POST /beneficial-holders/{holderId}/file-schedule"
        actor: ComplianceOfficer
        preconditions:
          - "Holder status IN {FILING_REQUIRED, AMENDMENT_REQUIRED} (ERR_SCHEDULE_NOT_REQUIRED otherwise)"
        side_effects:
          - "last_reported_pct = current_pct; schedule_type = payload value"
      - from: AMENDMENT_REQUIRED
        to: FILED
        trigger: "POST /beneficial-holders/{holderId}/file-schedule"
        actor: ComplianceOfficer
        preconditions:
          - "Holder status IN {FILING_REQUIRED, AMENDMENT_REQUIRED} (ERR_SCHEDULE_NOT_REQUIRED otherwise)"
        side_effects:
          - "last_reported_pct = current_pct; schedule_type = payload value"
      - from: FILED
        to: AMENDMENT_REQUIRED
        trigger: "system (automatic on PositionChange posting when ABS(current_pct - last_reported_pct) >= 1.00)"
        actor: system
        preconditions:
          - "ABS(current_pct - last_reported_pct) >= 1.00 after recompute (equality triggers)"
        side_effects: []
        note: "FILED -> AMENDMENT_REQUIRED -> FILED loop makes the machine cyclic"

  - entity: FilingAgentAuthorization
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /filing-agent-authorizations/{authorizationId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "Authorization status == ACTIVE (ERR_AUTHORIZATION_INVALID_STATE)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: issuer-update-stale-version
    parent_entity: Issuer
    write_endpoint: "PUT /issuers/{issuerId}"
    occ_field: expected_issuer_version
    description: |
      Updating an Issuer (shares_outstanding, edgar_ccc, holiday_dates,
      next_earnings_filing_date) whose version has advanced since the client
      last observed it is rejected. Both updates would legitimately succeed
      under product semantics (issuer config is freely editable), so the
      stale write is detected purely by the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: amendment-create-stale-filing
    parent_entity: SecuritiesFiling
    write_endpoint: "POST /filings/{filingId}/amendments"
    occ_field: expected_filing_version
    description: |
      Creating an amendment against an ACCEPTED filing whose version has
      advanced since the client last observed it is rejected. A new amendment
      legitimately supersedes any earlier pending amendment work, so the
      client holding a stale observation of the filing must be told to re-read.
      Successful amendment creation increments the amended filing's version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_deadline
    trigger: "DRAFT filing creation (auto Form 4 on confirm, Form 3 on designation, Form 5 on sweep, manual POST /filings)"
    algorithm: chronological
    formula: |
      Business-day routine advance_bd(d, n): repeat n times { d += 1 calendar day;
      skip (keep incrementing within the same iteration) while weekday(d) IN {Sat, Sun}
      OR iso(d) IN issuer.holiday_dates }.
      FORM_4: filing_deadline = advance_bd(earliest transaction_date among covered
              transactions, 2). Auto-generated Form 4 covers exactly one transaction.
      FORM_3: filing_deadline = designation_date + 10 calendar days (no business-day shift).
      FORM_5: filing_deadline = fy_end_date + 45 calendar days (manual Form 5 uses the
              fiscal_year input resolved against the issuer's fiscal calendar).
      Timeliness (at acceptance): is_late = (date(accepted_at) > filing_deadline);
      acceptance with date(accepted_at) == filing_deadline is TIMELY (strict >).
    input_set: "Covered transactions (filing_id == filing.id); issuer.holiday_dates at creation time"
    constants:
      FORM4_BUSINESS_DAYS: 2
      FORM3_CALENDAR_DAYS: 10
      FORM5_CALENDAR_DAYS_AFTER_FY_END: 45
    precision: "date granularity, YYYY-MM-DD; comparison on calendar dates"

  - name: short_swing_profit
    trigger: "GET /reporting-persons/{personId}/short-swing-analysis (computed on read)"
    algorithm: chronological
    formula: |
      Eligible set: SecurityTransaction with reporting_person_id = person,
      transaction_code IN {P, S}, status IN {CONFIRMED, REPORTED}.
      Pair matchability: a purchase p (code P) and sale s (code S) are matchable iff
      s.transaction_date < add_calendar_months(p.transaction_date, 6) OR
      p.transaction_date < add_calendar_months(s.transaction_date, 6); i.e. strictly
      less than six calendar months apart in either order (add_calendar_months clamps
      the day to month end). Exactly six months apart is NOT matchable.
      matched_shares(pair) = min(remaining purchase shares, remaining sale shares).
      per_pair_profit = (s.price_per_share - p.price_per_share) * matched_shares,
      rounded to 2 decimal places HALF_UP PER PAIR FIRST, then the rounded per-pair
      values are summed (pinned rounding order: round-per-pair, then sum).
      Only pairs with (sale price > purchase price) participate.
      Variant MAX_RECOVERY (field short_swing_profit): process sales in price DESC
      order (tie: created_at ASC), each sale matched against the remaining purchase
      with the LOWEST price that yields positive spread and is matchable (tie:
      created_at ASC).
      Variant FIFO_CHRONOLOGICAL (field short_swing_profit_fifo): process sales in
      transaction_date ASC order (tie: created_at ASC), each sale matched against the
      EARLIEST remaining purchase that yields positive spread and is matchable
      (order: transaction_date ASC, tie created_at ASC).
    input_set: "Transactions as above; VOID and INGESTED excluded"
    constants:
      WINDOW_MONTHS: 6
    precision: "2 decimal places, round_half_up, applied per matched pair before summation"
    variants:
      - name: MAX_RECOVERY
        when: "Authoritative Section 16(b) recovery figure (short_swing_profit)"
        difference: "Matches highest-priced sales against lowest-priced purchases to maximize recoverable profit"
      - name: FIFO_CHRONOLOGICAL
        when: "Comparison figure (short_swing_profit_fifo)"
        difference: "Matches strictly in time order; can produce a lower total for identical inputs"

  - name: cooling_off_end_date
    trigger: "TradingPlan10b5_1 approval (PENDING_APPROVAL -> ADOPTED); computed once, then frozen"
    algorithm: constraint_propagation
    formula: |
      base_end = adoption_date + 90 calendar days
      If the plan's reporting person has is_officer == true OR is_director == true:
        earnings_end = advance_bd(issuer.next_earnings_filing_date, 2)   # same business-day routine as filing_deadline
        extended = max(base_end, earnings_end)
        cooling_off_end_date = min(extended, adoption_date + 120 calendar days)
      Else (pure 10% owner or unflagged):
        cooling_off_end_date = base_end
      Requires issuer.next_earnings_filing_date non-null when person is officer/director
      (otherwise treat earnings_end as base_end, i.e. no extension).
    input_set: "plan.adoption_date, person.{is_officer, is_director}, issuer.next_earnings_filing_date, issuer.holiday_dates"
    constants:
      BASE_DAYS: 90
      CAP_DAYS: 120
      EARNINGS_LAG_BUSINESS_DAYS: 2
    precision: "date granularity, YYYY-MM-DD"
    variants: []

  - name: beneficial_ownership_pct
    trigger: "PositionChange posting on the holder; issuer.shares_outstanding change via PUT /issuers"
    algorithm: aggregation
    formula: |
      shares_beneficially_owned = SUM(PositionChange.shares_delta) for holder
      exercisable_derivative_shares = SUM(PositionChange.derivative_shares_delta) for holder
      Variant BASIC (field current_pct, threshold-authoritative):
        current_pct = round_half_up(100 * shares_beneficially_owned / issuer.shares_outstanding, 2)
      Variant FULLY_DILUTED (field fully_diluted_pct, informational):
        fully_diluted_pct = round_half_up(
          100 * (shares_beneficially_owned + exercisable_derivative_shares)
            / (issuer.shares_outstanding + exercisable_derivative_shares), 2)
      Threshold transitions evaluate current_pct ONLY:
        MONITORING -> FILING_REQUIRED when current_pct >= 5.00
        FILED -> AMENDMENT_REQUIRED when ABS(current_pct - last_reported_pct) >= 1.00
    input_set: "All PositionChange events for the holder (append-only, no status filter); issuer.shares_outstanding current value"
    constants:
      FILING_THRESHOLD_PCT: 5.00
      AMENDMENT_DELTA_PCT: 1.00
    precision: "2 decimal places, round_half_up, percentage units"
    variants:
      - name: BASIC
        when: "Threshold monitoring and alerts"
        difference: "Denominator is shares_outstanding only"
      - name: FULLY_DILUTED
        when: "Informational disclosure figure"
        difference: "Adds holder's 60-day-exercisable derivatives to BOTH numerator and denominator; diverges from BASIC whenever exercisable_derivative_shares > 0"

  - name: late_filing_delinquency
    trigger: "SecuritiesFiling SUBMITTED -> ACCEPTED"
    algorithm: aggregation
    formula: |
      On acceptance: is_late = (date(accepted_at) > filing.filing_deadline)
      If is_late: person.late_filing_count += 1
      person.delinquent_flag = (person.late_filing_count >= DELINQUENT_LATE_THRESHOLD)
      delinquent_flag is sticky: subsequent timely filings never clear it, and
      SUPERSEDED amendments do not decrement the count.
    input_set: "Filings of the person reaching ACCEPTED"
    constants:
      DELINQUENT_LATE_THRESHOLD: 2
    precision: "integer counts"

  - name: open_filing_obligations
    trigger: "any SecuritiesFiling creation or status change for the person"
    algorithm: aggregation
    formula: |
      ReportingPerson.open_obligation_count =
        COUNT(SecuritiesFiling WHERE reporting_person_id = person.id
              AND status IN {DRAFT, READY, SUBMITTED})
    input_set: "Filings of the person in open states only; ACCEPTED, REJECTED, SUPERSEDED, DISCARDED excluded"
    precision: "integer count"

  - name: insider_shares_balance
    trigger: "SecurityTransaction confirm or void"
    algorithm: chronological
    formula: |
      For the affected (reporting_person_id, security_type) chain:
        consider transactions with status IN {CONFIRMED, REPORTED}
        order by transaction_date ASC, tie-break created_at ASC (never id)
        running = 0
        for each txn: running += shares if direction == ACQUIRED else - shares
        txn.shares_owned_after = running
      Out-of-order confirmation (an earlier-dated transaction confirmed after a
      later-dated one) recomputes the whole chain.
    input_set: "Transactions of the person with status IN {CONFIRMED, REPORTED}, same security_type"
    precision: "integer shares"

  - name: annual_sweep
    trigger: "POST /annual-sweeps/{sweepId}/run"
    algorithm: aggregation
    formula: |
      fy_end_date = last calendar day of issuer.fiscal_year_end_month in sweep.fiscal_year
      fy_start_date = fy_end_date - 1 year + 1 day (both bounds inclusive)
      In-scope persons: ReportingPerson with issuer_id = sweep.issuer_id,
        status IN {ACTIVE, EXITED}, designation_date <= fy_end_date,
        AND (exit_date IS NULL OR exit_date >= fy_start_date).
      Per person:
        late_filing_count = COUNT(SecuritiesFiling: reporting_person_id = person,
          status IN {ACCEPTED, SUPERSEDED}, is_late == true,
          fy_start_date <= date(accepted_at) <= fy_end_date)
        unreported_exempt_count = COUNT(SecurityTransaction: reporting_person_id = person,
          transaction_code == 'G', status == CONFIRMED, filing_id IS NULL,
          fy_start_date <= transaction_date <= fy_end_date)
        needs_form5 = (unreported_exempt_count > 0)
        delinquent = (late_filing_count > 0)
      Persons are emitted into results ordered by full_name ASC, tie created_at ASC.
    input_set: "Persons, filings, transactions as filtered above"
    precision: "integer counts; dates inclusive both ends"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the operation; additionally, when role == ReportingInsider, X-User-ID must equal the reporting_person_id of the target resource (plan create body, plan transitions)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Resource ids in the path exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 3.5
    category: existence
    check: "Request body shape: required fields present, enum values valid, dates well-formed, start_date <= end_date, shares > 0, shares_delta != 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_issuer_version / expected_filing_version, when required by the endpoint, must equal the parent's current version; checked before any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /issuers/{issuerId}; POST /filings/{filingId}/amendments"
  - priority: 5
    category: state
    check: "Target entity in the required state for the requested transition (per state machines)"
    error_id: "ERR_PERSON_INVALID_STATE | ERR_TRANSACTION_INVALID_STATE | ERR_FILING_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_SWEEP_INVALID_STATE | ERR_AUTHORIZATION_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "Cross-entity state: transaction confirm requires ReportingPerson ACTIVE (ERR_PERSON_NOT_ACTIVE); filing submit/record requires an ACTIVE FilingAgentAuthorization for (issuer, X-User-ID) (ERR_AGENT_NOT_AUTHORIZED); manual POST /filings requires the person ACTIVE (ERR_PERSON_NOT_ACTIVE)"
    error_id: "ERR_PERSON_NOT_ACTIVE | ERR_AGENT_NOT_AUTHORIZED"
    http_status: 409
    applies_to: "POST /transactions/{id}/confirm; POST /filings; POST /filings/{id}/submit; POST /filings/{id}/record-edgar-result"
  - priority: 7
    category: business_safety
    check: "Compliance guards, in this order: (a) confirm SOD confirmer != ingester (ERR_SOD_INGESTER_CONFIRMER); (b) submit SOD submitter != non-null prepared_by_user_id (ERR_SOD_PREPARER_SUBMITTER); (c) plan-affiliated transaction confirm requires plan ACTIVE (ERR_PLAN_NOT_ACTIVE); (d) plan ACTIVATE requires clock date >= cooling_off_end_date (ERR_COOLING_OFF_NOT_SATISFIED); (e) non-plan transaction confirm rejected when transaction_date falls inside any issuer BlackoutWindow (closed interval) (ERR_BLACKOUT_PERIOD)"
    error_id: "ERR_SOD_INGESTER_CONFIRMER | ERR_SOD_PREPARER_SUBMITTER | ERR_PLAN_NOT_ACTIVE | ERR_COOLING_OFF_NOT_SATISFIED | ERR_BLACKOUT_PERIOD"
    http_status: 403
    applies_to: "confirm / submit / plan transitions"
  - priority: 8
    category: business_temporal
    check: "transaction_date <= logical clock date at confirm (ERR_FUTURE_TRANSACTION_DATE); PositionChange.effective_date <= logical clock date at posting (ERR_FUTURE_EFFECTIVE_DATE)"
    error_id: "ERR_FUTURE_TRANSACTION_DATE | ERR_FUTURE_EFFECTIVE_DATE"
    http_status: 422
    applies_to: "POST /transactions/{id}/confirm; POST /beneficial-holders/{id}/positions"
  - priority: 9
    category: business_constraint
    check: "Plan window overlap on APPROVE (ERR_PLAN_WINDOW_OVERLAP); blackout window overlap on create (ERR_BLACKOUT_WINDOW_OVERLAP); duplicate sweep for (issuer_id, fiscal_year) with status IN {OPEN, COMPLETED} (ERR_DUPLICATE_SWEEP); amendment target must be ACCEPTED (ERR_AMENDMENT_TARGET_NOT_ACCEPTED); submit edgar_ccc must equal issuer.edgar_ccc (ERR_EDGAR_CREDENTIAL_MISMATCH); file-schedule requires holder status IN {FILING_REQUIRED, AMENDMENT_REQUIRED} (ERR_SCHEDULE_NOT_REQUIRED)"
    error_id: "ERR_PLAN_WINDOW_OVERLAP | ERR_BLACKOUT_WINDOW_OVERLAP | ERR_DUPLICATE_SWEEP | ERR_AMENDMENT_TARGET_NOT_ACCEPTED | ERR_EDGAR_CREDENTIAL_MISMATCH | ERR_SCHEDULE_NOT_REQUIRED"
    http_status: 409
    applies_to: "various; see per-error entries"
  - priority: 10
    category: business_referential
    check: "Body-referenced entity ids exist (ERR_INVALID_REQUEST); confirmed plan-affiliated transaction: plan.reporting_person_id == transaction.reporting_person_id (ERR_PLAN_PERSON_MISMATCH); manual FORM_4 transaction_ids: all CONFIRMED, filing_id null, same reporting_person_id as the filing (ERR_TRANSACTION_NOT_ATTACHABLE)"
    error_id: "ERR_INVALID_REQUEST | ERR_PLAN_PERSON_MISMATCH | ERR_TRANSACTION_NOT_ATTACHABLE"
    http_status: 400
    applies_to: "creation endpoints with body FKs; confirm; POST /filings"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock. May be set to any ISO8601 instant; all system timestamps (submitted_at, accepted_at, designation_date, run_at, ...) read this clock."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Issuers ---
  - method: POST
    path: "/issuers"
    description: "Register a public company issuer"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, ticker, cik, shares_outstanding, fiscal_year_end_month, edgar_ccc, "holiday_dates?", "next_earnings_filing_date?"]
    output: Issuer
    side_effects: []
  - method: GET
    path: "/issuers"
    description: "List issuers (paginated, created_at ASC)"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["limit?", "offset?"]
    output: "Issuer[]"
    side_effects: []
  - method: GET
    path: "/issuers/{issuerId}"
    description: "Get one issuer"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: Issuer
    side_effects: []
  - method: PUT
    path: "/issuers/{issuerId}"
    description: "Update issuer configuration; OCC-guarded"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_issuer_version, "name?", "ticker?", "shares_outstanding?", "fiscal_year_end_month?", "edgar_ccc?", "holiday_dates?", "next_earnings_filing_date?"]
    output: Issuer
    side_effects:
      - "increments Issuer.version by 1"
      - "if shares_outstanding changed: recompute current_pct / fully_diluted_pct for all holders of the issuer and re-evaluate threshold transitions"

  # --- Blackout windows ---
  - method: POST
    path: "/blackout-windows"
    description: "Create an issuer trading blackout window (closed interval [start_date, end_date]); overlapping windows for the same issuer are rejected — two windows conflict iff they share at least one calendar date"
    roles: [ComplianceOfficer]
    code: 201
    input: [issuer_id, start_date, end_date, "reason?"]
    output: BlackoutWindow
    side_effects: []
  - method: GET
    path: "/blackout-windows"
    description: "List blackout windows, filterable by issuer"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "limit?", "offset?"]
    output: "BlackoutWindow[]"
    side_effects: []
  - method: GET
    path: "/blackout-windows/{blackoutWindowId}"
    description: "Get one blackout window"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: []

  # --- Reporting persons ---
  - method: POST
    path: "/reporting-persons"
    description: "Create a proposed insider (status PROPOSED)"
    roles: [ComplianceOfficer]
    code: 201
    input: [issuer_id, full_name, person_cik, "is_director?", "is_officer?", "is_ten_pct_owner?"]
    output: ReportingPerson
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/reporting-persons"
    description: "List reporting persons, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "status?", "limit?", "offset?"]
    output: "ReportingPerson[]"
    side_effects: []
  - method: GET
    path: "/reporting-persons/{personId}"
    description: "Get one reporting person"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: ReportingPerson
    side_effects: []
  - method: POST
    path: "/reporting-persons/{personId}/transitions"
    description: "Drive the designation lifecycle; action in {DESIGNATE, EXIT, REINSTATE} per the ReportingPerson state machine"
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: ReportingPerson
    side_effects: ["per state machine: designation_date/exit_date stamps, auto FORM_3 draft on DESIGNATE/REINSTATE, open_obligation_count recompute"]
  - method: GET
    path: "/reporting-persons/{personId}/short-swing-analysis"
    description: "Computed Section 16(b) short-swing profit analysis over the person's eligible transactions (both matching variants)"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: "{ reporting_person_id: string, as_of_date: string, matchable_pair_count: integer, short_swing_profit: number, short_swing_profit_fifo: number, pairs: array }"
    side_effects: []

  # --- Transactions ---
  - method: POST
    path: "/transactions"
    description: "Ingest an equity transaction (feed or manual); status INGESTED"
    roles: [EquityPlanAdmin, FilingCoordinator]
    code: 201
    input: [reporting_person_id, transaction_date, transaction_code, security_type, shares, "price_per_share?", "plan_id?", "source?"]
    output: SecurityTransaction
    side_effects: ["issuer_id denormalized from person; ingested_by_user_id = X-User-ID; status = INGESTED"]
  - method: GET
    path: "/transactions"
    description: "List transactions, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["reporting_person_id?", "issuer_id?", "filing_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: "SecurityTransaction[]"
    side_effects: []
  - method: GET
    path: "/transactions/{transactionId}"
    description: "Get one transaction"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: SecurityTransaction
    side_effects: []
  - method: POST
    path: "/transactions/{transactionId}/confirm"
    description: "Confirm an ingested transaction (four-eyes: confirmer must differ from ingester); auto-generates a DRAFT Form 4 for codes other than G"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SecurityTransaction
    side_effects: ["per state machine: direction + shares_owned_after, auto FORM_4 creation for code != G, open_obligation_count recompute"]
  - method: POST
    path: "/transactions/{transactionId}/void"
    description: "Void a transaction before it is reported; compensates the confirm cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: SecurityTransaction
    side_effects: ["linked DRAFT/READY filing -> DISCARDED with transactions detached; open_obligation_count recompute; balance recompute"]

  # --- Filings ---
  - method: POST
    path: "/filings"
    description: "Manually create a DRAFT filing (FORM_3 / FORM_4 / FORM_5). FORM_4 requires transaction_ids of CONFIRMED, unfiled transactions of the same person (deadline from earliest transaction_date); FORM_5 requires fiscal_year."
    roles: [FilingCoordinator]
    code: 201
    input: [issuer_id, reporting_person_id, form_type, "transaction_ids?", "fiscal_year?"]
    output: SecuritiesFiling
    side_effects: ["prepared_by_user_id = X-User-ID; filing_deadline computed; transactions attached (filing_id set); open_obligation_count recompute"]
  - method: GET
    path: "/filings"
    description: "List filings, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "reporting_person_id?", "status?", "form_type?", "amends_filing_id?", "limit?", "offset?"]
    output: "SecuritiesFiling[]"
    side_effects: []
  - method: GET
    path: "/filings/{filingId}"
    description: "Get one filing"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: SecuritiesFiling
    side_effects: []
  - method: POST
    path: "/filings/{filingId}/ready"
    description: "Mark a DRAFT filing READY for submission"
    roles: [FilingCoordinator]
    code: 200
    input: []
    output: SecuritiesFiling
    side_effects: ["status -> READY"]
  - method: POST
    path: "/filings/{filingId}/reopen"
    description: "Return a READY or REJECTED filing to DRAFT for editing"
    roles: [FilingCoordinator]
    code: 200
    input: []
    output: SecuritiesFiling
    side_effects: ["status -> DRAFT; clears submitted_at, submitted_by_user_id, rejection_reason"]
  - method: POST
    path: "/filings/{filingId}/discard"
    description: "Discard a DRAFT filing; covered transactions are detached and become re-fileable"
    roles: [FilingCoordinator]
    code: 200
    input: []
    output: SecuritiesFiling
    side_effects: ["status -> DISCARDED; transactions detached; open_obligation_count recompute"]
  - method: POST
    path: "/filings/{filingId}/submit"
    description: "Submit a READY filing to EDGAR; requires an ACTIVE agent authorization for (issuer, X-User-ID), SOD against the preparer, and the current EDGAR CCC"
    roles: [FilingAgent]
    code: 200
    input: [edgar_ccc]
    output: SecuritiesFiling
    side_effects: ["status -> SUBMITTED; submitted_at, submitted_by_user_id stamped from logical clock and X-User-ID"]
  - method: POST
    path: "/filings/{filingId}/record-edgar-result"
    description: "Record the EDGAR disposition for a SUBMITTED filing"
    roles: [FilingAgent]
    code: 200
    input: [outcome, "accession_number?", "rejection_reason?"]
    output: SecuritiesFiling
    side_effects: ["per state machine: ACCEPTED sets accepted_at/accession_number, computes is_late, cascades late_filing_count and delinquent_flag, marks transactions REPORTED, supersedes amended filing; REJECTED sets rejection_reason"]
  - method: POST
    path: "/filings/{filingId}/amendments"
    description: "Create an amendment DRAFT targeting an ACCEPTED filing; OCC-guarded on the amended filing's version"
    roles: [FilingCoordinator]
    code: 201
    input: [expected_filing_version]
    output: SecuritiesFiling
    side_effects: ["increments amended SecuritiesFiling.version by 1; new DRAFT filing copies issuer_id, reporting_person_id, form_type, filing_deadline; amends_filing_id = path id; prepared_by_user_id = X-User-ID; open_obligation_count recompute (+1)"]

  # --- Trading plans (10b5-1) ---
  - method: POST
    path: "/trading-plans"
    description: "Insider drafts a 10b5-1 trading plan; X-User-ID must equal reporting_person_id"
    roles: [ReportingInsider]
    code: 201
    input: [reporting_person_id, plan_name, first_trade_date, expiration_date]
    output: TradingPlan10b5_1
    side_effects: ["issuer_id denormalized from person; status = DRAFT"]
  - method: GET
    path: "/trading-plans"
    description: "List trading plans, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["reporting_person_id?", "issuer_id?", "status?", "limit?", "offset?"]
    output: "TradingPlan10b5_1[]"
    side_effects: []
  - method: GET
    path: "/trading-plans/{planId}"
    description: "Get one trading plan"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: TradingPlan10b5_1
    side_effects: []
  - method: POST
    path: "/trading-plans/{planId}/transitions"
    description: "Drive the plan lifecycle; action in {SUBMIT_ADOPTION (insider owner), APPROVE / REJECT / ACTIVATE / SUSPEND / REINSTATE (ComplianceOfficer), TERMINATE (either ComplianceOfficer or insider owner)}"
    roles: [ReportingInsider, ComplianceOfficer]
    code: 200
    input: [action]
    output: TradingPlan10b5_1
    side_effects: ["per state machine: APPROVE stamps adoption_date and computes cooling_off_end_date; TERMINATE stamps termination_date"]

  # --- Beneficial ownership (13D/G) ---
  - method: POST
    path: "/beneficial-holders"
    description: "Start monitoring a beneficial owner (status MONITORING)"
    roles: [ComplianceOfficer]
    code: 201
    input: [issuer_id, holder_name, "holder_cik?"]
    output: BeneficialHolder
    side_effects: ["status = MONITORING"]
  - method: GET
    path: "/beneficial-holders"
    description: "List beneficial holders, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "status?", "limit?", "offset?"]
    output: "BeneficialHolder[]"
    side_effects: []
  - method: GET
    path: "/beneficial-holders/{holderId}"
    description: "Get one beneficial holder"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: BeneficialHolder
    side_effects: []
  - method: POST
    path: "/beneficial-holders/{holderId}/positions"
    description: "Append a position change event; recomputes ownership percentages and threshold state"
    roles: [ComplianceOfficer]
    code: 201
    input: [shares_delta, "derivative_shares_delta?", effective_date, "note?"]
    output: PositionChange
    side_effects: ["recompute shares_beneficially_owned, exercisable_derivative_shares, current_pct, fully_diluted_pct; threshold transitions per beneficial_ownership_pct calculation"]
  - method: GET
    path: "/position-changes"
    description: "List position change events, filterable by holder"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["holder_id?", "limit?", "offset?"]
    output: "PositionChange[]"
    side_effects: []
  - method: GET
    path: "/position-changes/{positionChangeId}"
    description: "Get one position change event (immutable; no version field)"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: PositionChange
    side_effects: []
  - method: POST
    path: "/beneficial-holders/{holderId}/file-schedule"
    description: "Record a Schedule 13D/13G filing; allowed only from FILING_REQUIRED or AMENDMENT_REQUIRED"
    roles: [ComplianceOfficer]
    code: 200
    input: [schedule_type]
    output: BeneficialHolder
    side_effects: ["status -> FILED; last_reported_pct = current_pct; schedule_type stored"]

  # --- Annual sweep (Form 3/5 & late-filing disclosure) ---
  - method: POST
    path: "/annual-sweeps"
    description: "Open an annual Form 3/5 sweep for (issuer, fiscal_year); duplicates rejected"
    roles: [ComplianceOfficer]
    code: 201
    input: [issuer_id, fiscal_year]
    output: AnnualSweep
    side_effects: ["fy_start_date / fy_end_date computed; status = OPEN"]
  - method: GET
    path: "/annual-sweeps"
    description: "List annual sweeps, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "limit?", "offset?"]
    output: "AnnualSweep[]"
    side_effects: []
  - method: GET
    path: "/annual-sweeps/{sweepId}"
    description: "Get one annual sweep including results"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: AnnualSweep
    side_effects: []
  - method: POST
    path: "/annual-sweeps/{sweepId}/run"
    description: "Execute the sweep: compute per-person late/unreported/delinquent rows and auto-create DRAFT Form 5 filings where needed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnnualSweep
    side_effects: ["per state machine and annual_sweep calculation: results stored, DRAFT FORM_5 filings created with attached gift transactions, open_obligation_count recompute"]

  # --- Filing agent authorizations (EDGAR coordination) ---
  - method: POST
    path: "/filing-agent-authorizations"
    description: "Authorize a filing agent operator (by opaque user id) to submit for an issuer; status ACTIVE"
    roles: [ComplianceOfficer]
    code: 201
    input: [issuer_id, agent_user_id]
    output: FilingAgentAuthorization
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/filing-agent-authorizations"
    description: "List authorizations, filterable"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: ["issuer_id?", "status?", "limit?", "offset?"]
    output: "FilingAgentAuthorization[]"
    side_effects: []
  - method: GET
    path: "/filing-agent-authorizations/{authorizationId}"
    description: "Get one authorization"
    roles: [ComplianceOfficer, FilingCoordinator, FilingAgent, EquityPlanAdmin, ReportingInsider]
    code: 200
    input: []
    output: FilingAgentAuthorization
    side_effects: []
  - method: POST
    path: "/filing-agent-authorizations/{authorizationId}/revoke"
    description: "Revoke an ACTIVE authorization; revoked agents can no longer submit or record EDGAR results"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FilingAgentAuthorization
    side_effects: ["status -> REVOKED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the operation, or ReportingInsider X-User-ID does not match the resource's reporting_person_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum/date, start_date > end_date, shares <= 0, shares_delta == 0, or body-referenced entity id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_issuer_version / expected_filing_version does not match the parent's current version (OCC)" }
  - { id: ERR_PERSON_INVALID_STATE, http: 409, condition: "ReportingPerson transition attempted from a state that does not allow it" }
  - { id: ERR_PERSON_NOT_ACTIVE, http: 409, condition: "Operation requires the ReportingPerson to be ACTIVE (transaction confirm, manual filing creation)" }
  - { id: ERR_TRANSACTION_INVALID_STATE, http: 409, condition: "Transaction confirm/void attempted from a disallowed state, or void blocked by a SUBMITTED/ACCEPTED linked filing" }
  - { id: ERR_FILING_INVALID_STATE, http: 409, condition: "Filing transition attempted from a disallowed state" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Trading plan transition attempted from a disallowed state" }
  - { id: ERR_SWEEP_INVALID_STATE, http: 409, condition: "Run attempted on a non-OPEN sweep" }
  - { id: ERR_AUTHORIZATION_INVALID_STATE, http: 409, condition: "Revoke attempted on a non-ACTIVE authorization" }
  - { id: ERR_FUTURE_TRANSACTION_DATE, http: 422, condition: "transaction_date is later than the logical clock date at confirm" }
  - { id: ERR_FUTURE_EFFECTIVE_DATE, http: 422, condition: "PositionChange effective_date is later than the logical clock date" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 422, condition: "Plan-affiliated transaction confirmed while the 10b5-1 plan is not ACTIVE (includes cooling-off ADOPTED and SUSPENDED)" }
  - { id: ERR_PLAN_PERSON_MISMATCH, http: 422, condition: "plan_id references a plan whose reporting_person_id differs from the transaction's" }
  - { id: ERR_COOLING_OFF_NOT_SATISFIED, http: 422, condition: "ACTIVATE attempted before the logical clock date reaches cooling_off_end_date" }
  - { id: ERR_BLACKOUT_PERIOD, http: 422, condition: "Non-plan transaction's transaction_date falls inside an issuer blackout window (closed interval)" }
  - { id: ERR_BLACKOUT_WINDOW_OVERLAP, http: 409, condition: "New blackout window shares at least one calendar date with an existing window of the same issuer" }
  - { id: ERR_PLAN_WINDOW_OVERLAP, http: 409, condition: "Approved plan's half-open window [first_trade_date, expiration_date) intersects another ADOPTED/ACTIVE/SUSPENDED plan of the same person" }
  - { id: ERR_DUPLICATE_SWEEP, http: 409, condition: "An OPEN or COMPLETED sweep already exists for (issuer_id, fiscal_year)" }
  - { id: ERR_AMENDMENT_TARGET_NOT_ACCEPTED, http: 409, condition: "Amendment attempted against a filing not in ACCEPTED status" }
  - { id: ERR_EDGAR_CREDENTIAL_MISMATCH, http: 422, condition: "Submit payload edgar_ccc does not equal the issuer's current edgar_ccc" }
  - { id: ERR_AGENT_NOT_AUTHORIZED, http: 403, condition: "No ACTIVE FilingAgentAuthorization for (filing.issuer_id, X-User-ID) on submit or record-edgar-result" }
  - { id: ERR_SOD_PREPARER_SUBMITTER, http: 403, condition: "Submitter X-User-ID equals the filing's non-null prepared_by_user_id (segregation of duties)" }
  - { id: ERR_SOD_INGESTER_CONFIRMER, http: 403, condition: "Confirmer X-User-ID equals the transaction's ingested_by_user_id (segregation of duties)" }
  - { id: ERR_SCHEDULE_NOT_REQUIRED, http: 409, condition: "file-schedule attempted while holder status is not FILING_REQUIRED or AMENDMENT_REQUIRED" }
  - { id: ERR_TRANSACTION_NOT_ATTACHABLE, http: 422, condition: "Manual FORM_4 transaction_ids contain a transaction that is not CONFIRMED, is already filed, or belongs to a different person" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Corporate secretary / Section 16 compliance officer; owns issuer config, insider designations, transaction confirmation, plan approvals, sweeps, agent authorizations, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /issuers; PUT /issuers/{id}"
      - "POST /blackout-windows"
      - "POST /reporting-persons; POST /reporting-persons/{id}/transitions"
      - "POST /transactions/{id}/confirm; POST /transactions/{id}/void"
      - "Trading plan APPROVE / REJECT / ACTIVATE / SUSPEND / REINSTATE / TERMINATE"
      - "POST /beneficial-holders; POST /beneficial-holders/{id}/positions; POST /beneficial-holders/{id}/file-schedule"
      - "POST /annual-sweeps; POST /annual-sweeps/{id}/run"
      - "POST /filing-agent-authorizations; POST /filing-agent-authorizations/{id}/revoke"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "Trading plan TERMINATE (shared with owning ReportingInsider)"]
  - name: FilingCoordinator
    description: "Prepares and amends filings; may also key manual transactions; never submits to EDGAR"
    identity: opaque
    exclusive_operations:
      - "POST /filings; POST /filings/{id}/ready; POST /filings/{id}/reopen; POST /filings/{id}/discard; POST /filings/{id}/amendments"
    shared_operations: ["all GET endpoints", "POST /transactions (shared with EquityPlanAdmin)"]
  - name: FilingAgent
    description: "External filing agent operator; submits READY filings with the EDGAR CCC and records EDGAR dispositions; must hold an ACTIVE FilingAgentAuthorization per issuer"
    identity: opaque
    exclusive_operations:
      - "POST /filings/{id}/submit; POST /filings/{id}/record-edgar-result"
    shared_operations: ["all GET endpoints"]
  - name: EquityPlanAdmin
    description: "Equity plan administrator pushing the equity transaction feed"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /transactions (shared with FilingCoordinator)"]
  - name: ReportingInsider
    description: "The insider themself; drafts and manages their own 10b5-1 plans"
    identity: "entity_backed:ReportingPerson"
    exclusive_operations:
      - "POST /trading-plans (reporting_person_id must equal X-User-ID)"
      - "Trading plan SUBMIT_ADOPTION (owner only)"
    shared_operations: ["all GET endpoints", "Trading plan TERMINATE (own plans, shared with ComplianceOfficer)"]
