scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_on_tier_change
        grounds:
          - calculations.order_pricing
          - state_machines.Order.OPEN_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_READY
          - entities.Order.fields.pricing_variant
        distinguishing_aspect: |
          PROVISIONAL discount (computed at submit using BRONZE tier) differs from FINAL discount
          (locked at mark-ready after tier promoted to GOLD) on the Order domain: 1000 msrp * 10 qty,
          PROVISIONAL discount 0, FINAL discount floor(10000*0.10)=1000.
        test_recipe:
          setup:
            - "One ACTIVE product P (msrp 1000, not exclusive), store S, inventory 600 units at S."
            - "Customer C starts BRONZE (lifetime_points 0)."
            - "Order O for C at S, one ACTIVE line qty 10, SUBMITTED while C is still BRONZE (PROVISIONAL discount 0)."
            - "AFTER O is submitted, a warm-up order (qty 500, BRONZE mult 1.0 -> 5000 points) is fulfilled, promoting C to GOLD before O is marked ready."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-1", name: "Blocks", category: "CRAFT_KIT", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 600 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "c@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 10, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { warm_oid: $.data.id } }
            - { call: "POST /orders/${warm_oid}/lines", payload: { product_id: "${pid}", qty: 500, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${warm_oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${warm_oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${warm_oid}/pay", payload: { amount_cents: 500000 }, as: StoreAssociate }
            - { call: "POST /orders/${warm_oid}/fulfill", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate, captures: { final_disc: $.data.discount_cents } }
          assert:
            - "Order.${oid}.pricing_variant == FINAL"
            - "Order.${oid}.discount_cents == 1000"
            - "Order.${oid}.total_cents == 9000"

      - name: loyalty_points_estimate_vs_final_earn
        grounds:
          - calculations.loyalty_points_earned
          - state_machines.Order.READY_to_FULFILLED
          - entities.Customer.fields.lifetime_points
        distinguishing_aspect: |
          Points on Customer domain: PROVISIONAL_ESTIMATE at submit is informational (lifetime_points unchanged),
          FINAL_EARN at fulfill persists floor(floor(total/100)*mult). GOLD customer, total 9000 -> base 90,
          mult 2.0 -> 180 points persisted only at fulfill.
        test_recipe:
          setup:
            - "GOLD customer C (lifetime_points 5000) with an order O total 9000 in READY, fully paid."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-2", name: "Blocks", category: "CRAFT_KIT", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 600 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { warm_oid: $.data.id } }
            - { call: "POST /orders/${warm_oid}/lines", payload: { product_id: "${pid}", qty: 500, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${warm_oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${warm_oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${warm_oid}/pay", payload: { amount_cents: 500000 }, as: StoreAssociate }
            - { call: "POST /orders/${warm_oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 10, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 9000 }, as: StoreAssociate }
          trigger:
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "GET /customers/${cid}", payload: {}, as: Any, captures: { lp: $.data.lifetime_points } }
          assert:
            - "Customer.${cid}.lifetime_points == 5180"
            - "Order.${oid}.total_cents == 9000"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: return_refund_circular_fee_tier_keyed_on_gross
        grounds:
          - calculations.return_refund
          - state_machines.Return.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) circular-looking: net = gross - fee, but fee tier is keyed on gross (the value it reduces);
          evaluation order pinned (gross first, then tier lookup, then floor). gross 20000 -> tier3 0.15 ->
          fee 3000 -> net 17000.
        test_recipe:
          setup:
            - "FULFILLED BOPIS order for BRONZE customer, one line qty 10 of msrp-2000 non-exclusive product (extended 20000, no discount)."
            - "Clock at fulfillment default; return requested within window."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-3", name: "Kit", category: "MODEL_KIT", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 2000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 50 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c3@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 10, recipient_age_months: 120 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 20000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /returns", payload: { order_id: "${oid}", lines: [{ order_line_id: "${lid}", qty: 10 }] }, as: StoreAssociate, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /returns/${rid}/approve", payload: { decision: "APPROVE" }, as: StoreManager, captures: { net: $.data.net_refund_cents } }
          assert:
            - "Return.${rid}.gross_refund_cents == 20000"
            - "Return.${rid}.restocking_fee_cents == 3000"
            - "Return.${rid}.net_refund_cents == 17000"

      - name: layaway_installment_rounding_remainder_on_last
        grounds:
          - calculations.layaway_installment_schedule
          - entities.Layaway.fields.installment_schedule_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: floor(total/N) per installment then remainder pinned to
          FINAL installment. total 10000, N 3 -> base 3333, remainder 1 -> [3333,3333,3334], not [3334,3333,3333].
        test_recipe:
          setup:
            - "A customer exists to own the layaway."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", email: "c4@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /layaways", payload: { customer_id: "${cid}", total_cents: 10000, installment_count: 3 }, as: StoreAssociate, captures: { lid: $.data.id } }
          assert:
            - "Layaway.${lid}.installment_schedule_cents == [3333, 3333, 3334]"
            - "Layaway.${lid}.remaining_cents == 10000"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.OPEN_to_SUBMITTED
          - state_machines.Order.UNPAID_to_PARTIALLY_PAID
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity (Order): payment_status advances UNPAID->PARTIALLY_PAID while
          fulfillment_status stays SUBMITTED — the two axes evolve independently on the same row.
        test_recipe:
          setup:
            - "Order O SUBMITTED, total 5000, no payment yet."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-5", name: "Kit", category: "MODEL_KIT", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 50 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c5@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 5, recipient_age_months: 120 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 2000 }, as: StoreAssociate, captures: { ps: $.data.payment_status, fs: $.data.fulfillment_status } }
          assert:
            - "Order.${oid}.payment_status == PARTIALLY_PAID"
            - "Order.${oid}.fulfillment_status == SUBMITTED"
            - "Order.${oid}.amount_paid_cents == 2000"

      - name: special_order_requote_self_cycle
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_QUOTED
          - entities.SpecialOrder.fields.quote_revision
        distinguishing_aspect: |
          Cyclic shape on a different entity (SpecialOrder): QUOTED->QUOTED self-loop; a second quote from
          QUOTED increments quote_revision to 2, distinct from any linear pipeline.
        test_recipe:
          setup:
            - "SpecialOrder SO in QUOTED (quote_revision 1) after one quote."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-6", name: "Rare", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "c6@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 2 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5200, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5400, deposit_cents: 2200, expected_special_order_version: "${v1}" }, as: StoreManager, captures: { qr: $.data.quote_revision } }
          assert:
            - "SpecialOrder.${soid}.quote_revision == 2"
            - "SpecialOrder.${soid}.status == QUOTED"
            - "SpecialOrder.${soid}.quoted_unit_price_cents == 5400"

  # ==========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_issue_depth3_cascade
        grounds:
          - state_machines.Recall.OPEN_to_ISSUED
          - state_machines.Product.CLEARED_to_RECALLED
          - state_machines.OrderLine.ACTIVE_to_VOIDED
          - calculations.inventory_availability
        distinguishing_aspect: |
          Depth-3 chain, each link caused by the previous: issue recall (link1) -> Product.recall_status RECALLED
          (link2) -> InventoryItem quarantine (link3) -> OrderLine VOIDED + Order total recompute (link4).
        test_recipe:
          setup:
            - "ACTIVE product P with inventory 10 at store S; an OPEN order O with one ACTIVE line qty 3 (reserved)."
            - "An OPEN recall R for P."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-7", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["SMALL_PARTS"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "c7@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 3, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /recalls", payload: { product_id: "${pid}", severity: "MANDATORY", reason: "hazard" }, as: CatalogAdmin, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /recalls/${rid}/issue", payload: {}, as: CatalogAdmin }
            - { call: "GET /inventory/${iid}", payload: {}, as: Any, captures: { q: $.data.quarantined_qty } }
          assert:
            - "Product.${pid}.recall_status == RECALLED"
            - "InventoryItem.${iid}.quarantined_qty == 10"
            - "InventoryItem.${iid}.available_qty == 0"
            - "InventoryItem.${iid}.reserved_qty == 0"
            - "OrderLine.${lid}.status == VOIDED"
            - "Order.${oid}.fulfillment_status == CANCELLED"

      - name: order_cancel_depth2_cascade
        grounds:
          - state_machines.Order.OPEN_to_CANCELLED
          - state_machines.OrderLine.ACTIVE_to_VOIDED
          - calculations.inventory_availability
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (order cancel): cancel order (link1) -> line VOIDED (link2) ->
          InventoryItem reserved released. Distinct propagation pattern from the recall chain.
        test_recipe:
          setup:
            - "OPEN order O with one ACTIVE line qty 4 reserved on inventory of 10 (available now 6)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-8", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "c8@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 4, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/cancel", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "GET /inventory/${iid}", payload: {}, as: Any, captures: { avail: $.data.available_qty } }
          assert:
            - "OrderLine.${lid}.status == VOIDED"
            - "InventoryItem.${iid}.reserved_qty == 0"
            - "InventoryItem.${iid}.available_qty == 10"
            - "Order.${oid}.fulfillment_status == CANCELLED"

  # ==========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: recall_state_beats_age_grade_safety_on_add_line
        grounds:
          - validations[priority=6]
          - validations[priority=5]
          - errors[ERR_PRODUCT_RECALLED]
          - errors[ERR_AGE_GRADE_VIOLATION]
        distinguishing_aspect: |
          business_safety(recall, prio 6, 409) vs business_safety(age-grade, prio 5, 422): a line failing BOTH
          returns ERR_AGE_GRADE_VIOLATION (422) because priority 5 fires before 6. Different from instance 2's pair.
        test_recipe:
          setup:
            - "Product P age_grade_min_months 72; a recall issued so recall_status RECALLED; add line with recipient_age_months 24 (also under age-grade)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-9", name: "Toy", category: "ACTION_FIGURE", age_grade_min_months: 72, safety_labels: ["SMALL_PARTS"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /recalls", payload: { product_id: "${pid}", severity: "MANDATORY", reason: "hazard" }, as: CatalogAdmin, captures: { rid: $.data.id } }
            - { call: "POST /recalls/${rid}/issue", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "c9@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 24 }, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_AGE_GRADE_VIOLATION"

      - name: existence_beats_state_on_convert
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_SPECIAL_ORDER_NOT_APPROVED]
        distinguishing_aspect: |
          existence(prio 3, 404) vs state(prio 4, 409): converting a DRAFT special order that references a missing
          product path yields 404 existence, not 409 state — a different error-category pair from instance 1.
        test_recipe:
          setup:
            - "No special order with the queried id exists (empty DB except a customer)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", email: "c10@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /special-orders/00000000-0000-4000-8000-000000000000/convert", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SPECIAL_ORDER_NOT_FOUND"

  # ==========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: age_grade_inclusive_boundary_passes_at_equal
        grounds:
          - calculations.age_grade_gate
          - validations[priority=5]
        distinguishing_aspect: |
          Numeric threshold on recipient_age_months via POST /orders/{id}/lines: recipient_age_months ==
          age_grade_min_months (36 == 36) PASSES (>= inclusive); 35 would fail. Boundary at exact equality.
        test_recipe:
          setup:
            - "Product P age_grade_min_months 36, ACTIVE, inventory available."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-11", name: "Toy", category: "PLUSH", age_grade_min_months: 36, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c11@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 36 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
          assert:
            - "response.status == 201"
            - "OrderLine.${lid}.status == ACTIVE"

      - name: event_capacity_full_at_exact_count
        grounds:
          - state_machines.DemoEvent.SCHEDULED_to_SCHEDULED
          - validations[priority=9]
          - errors[ERR_EVENT_FULL]
          - entities.DemoEvent.fields.capacity
        distinguishing_aspect: |
          Count-boundary on a different metric and endpoint (POST /events/{id}/register): capacity 1, one
          registration makes registered_count == capacity; the next register hits ERR_EVENT_FULL. Distinct from
          the numeric age boundary.
        test_recipe:
          setup:
            - "Event E capacity 1, one customer already registered."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-12", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /events", payload: { store_id: "${sid}", product_id: "${pid}", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T11:00:00Z", capacity: 1 }, as: StoreAssociate, captures: { eid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C1", email: "c12a@x.com" }, as: StoreAssociate, captures: { cid1: $.data.id } }
            - { call: "POST /customers", payload: { name: "C2", email: "c12b@x.com" }, as: StoreAssociate, captures: { cid2: $.data.id } }
            - { call: "POST /events/${eid}/register", payload: { customer_id: "${cid1}" }, as: Customer, as_user_id: "${cid1}" }
          trigger:
            - { call: "POST /events/${eid}/register", payload: { customer_id: "${cid2}" }, as: Customer, as_user_id: "${cid2}" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EVENT_FULL"

  # ==========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_mark_ready_blocked_by_product_recall_status
        grounds:
          - state_machines.Order.SUBMITTED_to_READY
          - state_machines.Product.CLEARED_to_RECALLED
          - validations[priority=6]
        distinguishing_aspect: |
          Order->Product pair: Order SUBMITTED->READY requires every ACTIVE line's Product.recall_status == CLEARED;
          a recalled product blocks mark-ready with ERR_PRODUCT_RECALLED.
        test_recipe:
          setup:
            - "SUBMITTED order O whose sole line's product gets recalled AFTER the line was added but before mark-ready."
            - "Line was added while CLEARED; recall issued but order not auto-cancelled because we add line, submit, THEN recall a SECOND product... use a distinct setup: order has two lines, one product recalled."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-13a", name: "Safe", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pidA: $.data.id } }
            - { call: "POST /products/${pidA}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /products", payload: { sku: "P-13b", name: "Hazard", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["SMALL_PARTS"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pidB: $.data.id } }
            - { call: "POST /products/${pidB}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pidA}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /inventory", payload: { product_id: "${pidB}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c13@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pidA}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pidB}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /recalls", payload: { product_id: "${pidA}", severity: "MANDATORY", reason: "hazard" }, as: CatalogAdmin, captures: { rid: $.data.id } }
            - { call: "POST /recalls/${rid}/issue", payload: {}, as: CatalogAdmin }
          trigger:
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PRODUCT_RECALLED"

      - name: special_order_convert_blocked_by_allocation_availability
        grounds:
          - state_machines.SpecialOrder.APPROVED_to_CONVERTED
          - entities.Allocation.fields.available_alloc_qty
          - validations[priority=9]
        distinguishing_aspect: |
          SpecialOrder->Allocation pair (different from Order->Product): APPROVED->CONVERTED requires an ACTIVE
          Allocation for product+store with available_alloc_qty >= requested_qty; too small yields
          ERR_INSUFFICIENT_ALLOCATION.
        test_recipe:
          setup:
            - "APPROVED special order requesting qty 5; an ACTIVE allocation for that product+store with allocated_qty 3 (available 3)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-14", name: "Rare", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /allocations", payload: { product_id: "${pid}", store_id: "${sid}", allocated_qty: 3, season_start: "2026-03-01T00:00:00Z", season_end: "2026-12-01T00:00:00Z" }, as: StoreManager }
            - { call: "POST /customers", payload: { name: "C", email: "c14@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 5 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5000, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager }
            - { call: "POST /special-orders/${soid}/approve", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /special-orders/${soid}/convert", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_ALLOCATION"

  # ==========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: demo_event_overlap_with_buffer_closed_interval
        grounds:
          - validations[priority=7]
          - errors[ERR_EVENT_OVERLAP]
          - entities.Store.fields.event_buffer_minutes
          - entities.DemoEvent.fields.start_at
        distinguishing_aspect: |
          DemoEvent on Store resource, closed interval PLUS a buffer: a new event starting within
          event_buffer_minutes (30) after an existing event's end_at collides. Existing ends 11:00, buffer to
          11:30; new at 11:15 rejected. Buffer-inflated closed-interval semantics.
        test_recipe:
          setup:
            - "Store S buffer 30 min; existing SCHEDULED event 10:00-11:00 for product P."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-15", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA", event_buffer_minutes: 30 }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /events", payload: { store_id: "${sid}", product_id: "${pid}", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T11:00:00Z", capacity: 5 }, as: StoreAssociate }
          trigger:
            - { call: "POST /events", payload: { store_id: "${sid}", product_id: "${pid}", start_at: "2026-04-01T11:15:00Z", end_at: "2026-04-01T12:00:00Z", capacity: 5 }, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EVENT_OVERLAP"

      - name: allocation_window_overlap_half_open_interval
        grounds:
          - validations[priority=7]
          - errors[ERR_ALLOCATION_WINDOW_OVERLAP]
          - entities.Allocation.fields.season_start
          - entities.Allocation.fields.season_end
        distinguishing_aspect: |
          Allocation on product+store resource, half-open [start,end) semantics with NO buffer: a new allocation
          starting exactly at the prior allocation's season_end does NOT overlap (adjacent allowed), but one
          starting before season_end does. Different interval arithmetic (half-open, adjacency-allowed) from the
          buffered closed DemoEvent rule.
        test_recipe:
          setup:
            - "Existing ACTIVE allocation for P+S over [2026-03-01, 2026-06-01)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-16", name: "Seasonal", category: "BOARD_GAME", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /allocations", payload: { product_id: "${pid}", store_id: "${sid}", allocated_qty: 10, season_start: "2026-03-01T00:00:00Z", season_end: "2026-06-01T00:00:00Z" }, as: StoreManager }
          trigger:
            - { call: "POST /allocations", payload: { product_id: "${pid}", store_id: "${sid}", allocated_qty: 10, season_start: "2026-05-15T00:00:00Z", season_end: "2026-08-01T00:00:00Z" }, as: StoreManager }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALLOCATION_WINDOW_OVERLAP"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_conservation_fulfill_then_return
        grounds:
          - calculations.inventory_availability
          - state_machines.Order.READY_to_FULFILLED
          - state_machines.Return.REQUESTED_to_APPROVED
          - entities.InventoryItem.fields.on_hand_qty
        distinguishing_aspect: |
          Conserved quantity = InventoryItem.on_hand_qty. Fulfill (decrement by qty) paired with full return
          (restock by same qty) leaves on_hand_qty at its pre-fulfill value: 20 -> 15 -> 20 for qty 5.
        test_recipe:
          setup:
            - "Inventory on_hand 20; FULFILLED order with one line qty 5; return requested for all 5."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-17", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 20 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "c17@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 5, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 5000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /returns", payload: { order_id: "${oid}", lines: [{ order_line_id: "${lid}", qty: 5 }] }, as: StoreAssociate, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /returns/${rid}/approve", payload: { decision: "APPROVE" }, as: StoreManager }
            - { call: "GET /inventory/${iid}", payload: {}, as: Any, captures: { oh: $.data.on_hand_qty } }
          assert:
            - "InventoryItem.${iid}.on_hand_qty == 20"
            - "OrderLine.${lid}.status == RETURNED"

      - name: loyalty_points_conservation_fulfill_then_return
        grounds:
          - calculations.loyalty_points_earned
          - calculations.loyalty_balance
          - state_machines.Return.REQUESTED_to_APPROVED
          - entities.Customer.fields.points_balance
        distinguishing_aspect: |
          Different conserved quantity = Customer.points_balance. Fulfill earns floor(base*mult) points; full
          return reverses the same count into points_redeemed, so points_balance returns to its pre-fulfill value.
          BRONZE, total 5000 -> base 50 -> earn 50; full return reverses 50; balance back to 0.
        test_recipe:
          setup:
            - "BRONZE customer C (points_balance 0); FULFILLED order total 5000 (earned 50 points); full return of the line."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-18", name: "Toy", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000, is_exclusive: false }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "Main", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 20 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "c18@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 5, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 5000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /returns", payload: { order_id: "${oid}", lines: [{ order_line_id: "${lid}", qty: 5 }] }, as: StoreAssociate, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /returns/${rid}/approve", payload: { decision: "APPROVE" }, as: StoreManager }
            - { call: "GET /customers/${cid}", payload: {}, as: Any, captures: { pb: $.data.points_balance } }
          assert:
            - "Customer.${cid}.lifetime_points == 50"
            - "Customer.${cid}.points_redeemed == 50"
            - "Customer.${cid}.points_balance == 0"
