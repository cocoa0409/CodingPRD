        grounds:
          - roles.ProgramDirector.exclusive_operations
          - endpoints["POST /challenge-course/courses/{course_id}/daily-open"]
        distinguishing_aspect: "The daily-open checkpoint is the ProgramDirector's own operation and needs no facilitator identity: on an unstaffed course it succeeds and scores posture RESTRICTED / RESCUE_READINESS while stamping daily_open_index 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with no facilitators, no elements and no bookings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
