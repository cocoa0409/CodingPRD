            - { call: "POST /deposit-products", payload: { product_code: "OVP", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 600, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_ovp: $.data.id } }
