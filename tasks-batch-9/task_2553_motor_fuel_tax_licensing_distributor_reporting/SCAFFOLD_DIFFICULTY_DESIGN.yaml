              as: ReturnsExaminer
              captures: { r_sch_und: $.data.id }
            - call: "POST /mft/schedules/${r_sch_und}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 2000.00, document_date: "2026-08-09", bill_of_lading_number: "BOL-R1-UND-001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${r_ret_id}/file"
              payload: { attest_name: "R. Halvorsen" }
