      - name: renewal_case_rent_track_and_notice_track_advance_independently_and_join_at_execution
        grounds:
          - state_machines.RenewalCase.OPTION_SELECTED_to_RENTS_APPROVED
          - state_machines.RenewalCase.RENTS_APPROVED_to_EXECUTED
          - state_machines.RenewalCase.NOTICES_PENDING_to_RENEWAL_NOTICED
          - entities.RenewalCase.fields.rent_track_status
          - entities.RenewalCase.fields.notice_track_status
          - errors[ERR_TRANSITION_NOT_ALLOWED]
        distinguishing_aspect: |
          Two independent state dimensions on one row: rent_track_status reaches RENTS_APPROVED
          while notice_track_status is still NOTICES_PENDING, execute-renewal is refused with
          ERR_TRANSITION_NOT_ALLOWED at that combined state, and the identical call succeeds
          once and only once the notice dimension has moved to RENEWAL_NOTICED — the guard
          reads the other dimension, not the rent dimension's own from-state.
