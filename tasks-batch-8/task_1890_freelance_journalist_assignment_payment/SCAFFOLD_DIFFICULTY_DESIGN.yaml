              as_user_id: "${contrib_d2}"
          trigger:
            - call: "POST /freelance-desk/assignments/${asg_d2}/invoices"
              payload: { fee_claim_cents: 50000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${contrib_d2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 6 business_safety)"
            - "no Invoice created for assignment ${asg_d2}"

      - name: referential_vs_fiscal_on_invoice_approve
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "errors[ERR_TAX_DOC_MISMATCH]"
          - "errors[ERR_TAX_DOC_MISSING]"
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal), different from the
          sibling's (state, business_safety): on POST
          /contributors/{id}/tax-documents a W8BEN with treaty_country null for
          a FOREIGN contributor fails ERR_TAX_DOC_MISMATCH (priority 9,
          referential) even though the contributor also lacks any VERIFIED doc
          (which would matter only later at invoice approval as
          ERR_TAX_DOC_MISSING, priority 10, fiscal). The earlier referential
          error masks the downstream fiscal gap.
        test_recipe:
          setup:
            - "DeskConfig defaults; FOREIGN contributor G with no tax documents"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Gap Greg", email: "greg@x.com", tax_residency: "FOREIGN" }
              as: DeskAdmin
              captures: { contrib_g: $.data.id }
          trigger:
            - call: "POST /freelance-desk/contributors/${contrib_g}/tax-documents"
              payload: { doc_kind: "W8BEN", tin_last4: "7777" }
              as: Contributor
              as_user_id: "${contrib_g}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_TAX_DOC_MISMATCH (W8BEN without treaty_country)"
            - "no TaxDocument persisted for contributor ${contrib_g}"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: plagiarism_threshold_exact_boundary
        grounds:
          - calculations.assignment_fee_due
          - entities.DeskConfig.fields.flag_threshold_bps
          - state_machines.VerificationReport.PENDING_to_FLAGGED
        distinguishing_aspect: |
          Metric = similarity_score_bps on POST
          /verification-reports/{id}/record-result. The comparison is >=, so
          exactly 2000 bps (the threshold) FLAGS while 1999 CLEARS — two
          reports on two assignments at the exact boundary land in different
          states.
