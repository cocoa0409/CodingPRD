              payload: { fiscal_year: 2026, service_area_name: "A different service area", prior_year_cost_to_charge_ratio: 0.3100, total_operating_expense_cents: 100000000 }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_a}", domain: "CHRONIC_DISEASE", name: "Adult depression prevalence", benchmark_value: 9.5 }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_b}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_DUPLICATE_FISCAL_YEAR — the service_area_name difference does not matter"
            - "trigger call 2: HTTP 409 with data.error_id == ERR_DUPLICATE_INDICATOR_NAME — the name clashes inside cycle A even under a different domain"
            - "trigger call 3: HTTP 201 — the same name is free on cycle B because the scope is per cycle_id"

