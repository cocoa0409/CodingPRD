  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: drill_compliance_ratio_exactly_at_the_075_floor
        grounds:
          - calculations.drill_compliance_ratio
          - state_machines.AnesthesiaPermit.INSPECTION_PENDING_to_ACTIVE
          - state_machines.AnesthesiaPermit.ACTIVE_to_PROBATION
          - endpoints["POST /facility-inspections/{inspectionId}/result"]
        metric: "drill_compliance_ratio (2 dp) against DRILL_COMPLIANCE_FLOOR 0.75, plus the 365-day drill window edge"
        endpoint: "POST /facility-inspections/{inspectionId}/result"
        distinguishing_aspect: |
          The floor comparison is >=, so a MODERATE_SEDATION practice covering exactly 3 of its 4
          required drill types (0.75) passes the inspection into ACTIVE rather than PROBATION. The
          same fixture pins three exclusion rules that all feed that ratio: a drill with
          deficiency_noted true never counts, a repeat of an already-covered type adds nothing
          (distinct types, not row count), and a drill type outside the level's required set is
          ignored. Advancing the clock by one day past the oldest qualifying drill's 365-day
          anniversary drops the ratio to 0.50 and the sweep pushes the permit to PROBATION, so both
          sides of the floor are observed from one dataset.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z, then 2026-09-12T10:00:00Z for the inspection result"
            - "MODERATE_SEDATION permit; required drill types are AIRWAY_OBSTRUCTION, LARYNGOSPASM, LOCAL_ANESTHETIC_TOXICITY, CARDIAC_ARREST"
            - "qualifying drills cover 3 of the 4 types (the AIRWAY_OBSTRUCTION drill sits at 2025-10-01, just inside the 365-day window)"
            - "three non-qualifying drills: a CARDIAC_ARREST drill with deficiency_noted true, a duplicate LARYNGOSPASM, and a MALIGNANT_HYPERTHERMIA drill that this permit level does not require"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MODERATE_SEDATION", applied_on: "2026-09-01T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "AIRWAY_OBSTRUCTION", conducted_at: "2025-10-01T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"] }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "LARYNGOSPASM", conducted_at: "2026-06-02T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"] }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "LOCAL_ANESTHETIC_TOXICITY", conducted_at: "2026-06-03T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"] }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "CARDIAC_ARREST", conducted_at: "2026-06-04T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"], deficiency_noted: true }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "LARYNGOSPASM", conducted_at: "2026-06-05T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"] }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "MALIGNANT_HYPERTHERMIA", conducted_at: "2026-06-06T09:00:00Z", participant_staff_ids: ["${surg_id}", "${author_id}"] }
              as: PracticeAdministrator
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-12T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /facility-inspections/${insp_id}/result"
              payload: { minor_deficiency_count: 0, major_deficiency_count: 0, critical_deficiency_count: 0 }
              as: PracticeAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /_ops/run-compliance-sweep"
              payload: { practice_id: "${prac_id}" }
              as: PracticeAdministrator
          assert:
            - "after trigger[0]: AnesthesiaPermit.${perm_id}.drill_compliance_ratio == 0.75 and drill_compliant == true"
            - "after trigger[0]: FacilityInspection.${insp_id}.inspection_score == 100 and status == PASSED"
            - "after trigger[0]: AnesthesiaPermit.${perm_id}.status == ACTIVE - NOT PROBATION - and last_enforcement_reason == null"
            - "after trigger[0]: Practice.${prac_id}.sedation_privilege_state == PERMITTED"
            - "after trigger[0]: GET /practices/${prac_id}/compliance-summary returns covered_drill_types of length 3 and required_drill_types of length 4"
            - "after trigger[2]: AnesthesiaPermit.${perm_id}.drill_compliance_ratio == 0.50 (the 2025-10-01 drill fell out of the trailing 365-day window)"
            - "after trigger[2]: AnesthesiaPermit.${perm_id}.status == PROBATION, last_enforcement_reason == DRILL_LAPSE, probation_count == 1, remediation_deadline_at == 2026-11-01T10:00:00Z"
            - "after trigger[2]: Practice.${prac_id}.sedation_privilege_state == RESTRICTED"

      - name: auto_size_tolerance_inclusive_edge_and_empty_pool
        grounds:
          - calculations.implant_auto_size_selection
          - validations[priority=82]
          - errors.ERR_NO_ELIGIBLE_IMPLANT_LOT
          - endpoints["POST /surgical-cases/{caseId}/implant-reservations/auto-size"]
        metric: "dimensional tolerance in millimetres (+/- 0.5 mm diameter, +/- 2.0 mm length, both inclusive) and the expiry_date > planned_start edge"
        endpoint: "POST /surgical-cases/{caseId}/implant-reservations/auto-size"
        distinguishing_aspect: |
          A different metric on a different endpoint. Both tolerance comparisons are <=, so the lot
          sitting exactly 0.5 mm wide and exactly 2.0 mm long is INSIDE the pool while the one 0.6 mm
          wide is outside, and a lot expiring exactly at 00:00 on the day of a 13:00 case fails the
          strictly-greater expiry test. That leaves a single candidate, which makes the selection
          observable without relying on the tie-break order. Moving the request 1.3 mm further away
          empties the pool entirely and the endpoint must raise the catalogued error instead of
          silently picking the nearest lot.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, one surgeon, one patient, one DRAFT LOCAL_ONLY IMPLANT case planned 2026-09-14T13:00Z-14:00Z"
            - "lot A: diameter 4.8 mm, length 12.0 mm, on hand 3, unit_cost_cents 20000, expiry 2027-06-30, not consignment"
            - "lot B: diameter 4.9 mm, length 10.0 mm, on hand 3 - 0.6 mm off the request, outside the tolerance"
            - "lot C: diameter 4.3 mm, length 10.0 mm, on hand 3 but expiry 2026-09-14T00:00:00Z, which is not strictly after the 13:00 planned_start"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
