              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { stale_v: $.data.version }
            - call: "POST /api/events/${ev_id}/end"
              payload: {}
