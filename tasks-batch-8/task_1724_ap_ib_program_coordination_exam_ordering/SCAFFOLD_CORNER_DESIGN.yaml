  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: net_fee_late_and_subsidy_floor_math
        claim_type: correct_result
        grounds: [calculations.registration_net_fee]
        distinguishing_aspect: "Two formula branches with exact literals: (a) late registration with approved subsidy nets 9800 + 4000 - min(3600, 13800) = 10200; (b) subsidy floors at the charge — fee 2000 with reduction 3600 nets 0, never negative."
        test_recipe:
          setup:
            - "Cycle OPEN (late fee 4000, reduction 3600); course co1 fee 9800, course co2 fee 2000"
            - "Student s1 has an APPROVED application; r2 (fee-2000 course) registered ON TIME at the default clock; clock then moved past the registration deadline before r1"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co1: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_STUDIO", program: "AP", exam_fee_cents: 2000, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /fee-reduction-applications"
              payload: { student_id: "${s1}", cycle_id: "${cy}", eligibility_basis: "FREE_LUNCH", annual_income_cents: 2500000 }
              as: Student
              as_user_id: "${s1}"
              captures: { fra: $.data.id }
            - call: "POST /fee-reduction-applications/${fra}/approve"
              as: ApCoordinator
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co2}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "GET /registrations/${r2}"
              as: ApCoordinator
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
          assert:
            - "ExamRegistration.${r1}: is_late == true, late_fee_applied_cents == 4000, subsidy_cents == 3600, net_fee_cents == 10200"
            - "ExamRegistration.${r2}: subsidy_cents == 2000 (floored by min(3600, 2000)), net_fee_cents == 0"
            - "statement.balance_cents == 10200 (10200 + 0)"

      - name: order_estimate_excludes_cancelled_registrations
        claim_type: input_set_filtering
        grounds: [calculations.order_invoice, entities.Course.fields.registered_count]
        distinguishing_aspect: "The invoice input set filters CANCELLED rows: after one of two registrations cancels, the DRAFT order's line shows ordered_count 1 and estimate 9800, and the course's derived registered_count drops to 1."
        test_recipe:
          setup: ["Cycle OPEN; course fee 9800; students s1, s2 registered; s2's registration then cancelled; DRAFT order exists"]
