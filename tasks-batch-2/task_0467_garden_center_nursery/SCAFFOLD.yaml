# =============================================================================
# Scaffold: garden-center-nursery (Expert tier)
# =============================================================================

scenario: |
  Garden Center & Plant Nursery Retail: plant/SKU & seasonal/perennial inventory,
  live-goods shrink & care log, hardiness-zone advisory, bulk soil/landscape-yard
  sale, special order & B2B landscaper account, plant warranty/guarantee, delivery,
  loyalty & seasonal event。

domain_name: garden-center-nursery
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - temporal_windowing

  entity_topology: hybrid
  # Nursery is the root aggregate; Account/Product/Order/Vehicle/SeasonalPromotion are
  # peers under it linked by FK; InventoryLot/OrderLine/CareLogEntry/Delivery/SpecialOrder/
  # WarrantyClaim/LoyaltyEvent hang off those peers with cross-cutting FK associations.

  state_machine_shape: parallel
  # Order carries two independent state dimensions (fulfillment_status × payment_status).
  # InventoryLot has a revision cycle (QUARANTINE<->AVAILABLE). SpecialOrder is branching.

  relationship_patterns:
    - one_to_many        # Nursery→Account, Product→InventoryLot, Order→OrderLine
    - cross_aggregate    # OrderLine→InventoryLot, Delivery→Vehicle, WarrantyClaim→OrderLine
    - polymorphic        # LoyaltyEvent.source_ref can point to an Order or a WarrantyClaim

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Nursery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Garden center name" }
      - { name: site_hardiness_zone, type: integer, source: input, description: "USDA hardiness zone of the retail site (1..13)", constraints: "1 <= site_hardiness_zone <= 13" }
      - { name: loyalty_accrual_per_dollar, type: integer, source: input, default: 1, description: "Loyalty points earned per whole dollar of eligible spend" }
      - { name: gold_tier_threshold_points, type: integer, source: input, default: 1000, description: "Lifetime points at/above which an Account is GOLD tier" }
      - { name: shrink_writeoff_zone_grace, type: integer, source: input, default: 2, description: "Allowed |zone delta| before a lot is flagged zone-mismatched for advisory" }

  - name: Account
    parent: Nursery
    common_fields: true
    fields:
      - { name: nursery_id, type: string, source: system, description: "FK -> Nursery.id" }
      - { name: account_type, type: enum, source: input, description: "RETAIL | LANDSCAPER_B2B", constraints: "one of {RETAIL, LANDSCAPER_B2B}" }
      - { name: display_name, type: string, source: input, description: "Account holder / company name" }
      - { name: ship_to_hardiness_zone, type: integer, source: input, description: "Hardiness zone of the account's planting site (1..13)", constraints: "1 <= ship_to_hardiness_zone <= 13" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "B2B credit ceiling; RETAIL accounts are forced to 0 at create" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of net_total_cents over this account's Orders whose payment_status == ON_ACCOUNT" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CREDIT_HOLD (ACTIVE at create; → CREDIT_HOLD when a charge-account draws outstanding to the credit limit; → ACTIVE when paid back down at/below the limit)" }
      - { name: lifetime_points, type: integer, source: computed, default: 0, description: "Running sum of LoyaltyEvent.points_delta (accruals positive, redemptions negative) — never below 0" }
      - { name: loyalty_tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | GOLD, derived from lifetime_points vs Nursery.gold_tier_threshold_points" }
      - { name: points_balance, type: integer, source: computed, default: 0, description: "Redeemable balance = lifetime accruals - lifetime redemptions; never below 0" }

  - name: Product
    parent: Nursery
    common_fields: true
    fields:
      - { name: nursery_id, type: string, source: system, description: "FK -> Nursery.id" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique per Nursery", constraints: "unique per nursery_id" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "LIVE_PLANT | BULK_MATERIAL | DRY_GOOD", constraints: "one of {LIVE_PLANT, BULK_MATERIAL, DRY_GOOD}" }
      - { name: unit, type: enum, source: input, description: "EACH | CUBIC_YARD", constraints: "BULK_MATERIAL must use CUBIC_YARD; others must use EACH" }
      - { name: lifecycle_class, type: enum, source: input, default: "NONE", description: "ANNUAL | PERENNIAL | NONE — only meaningful for LIVE_PLANT", constraints: "LIVE_PLANT must be ANNUAL or PERENNIAL; non-LIVE_PLANT must be NONE" }
      - { name: hardiness_min_zone, type: integer, source: input, default: 1, description: "Coldest USDA zone the plant tolerates (LIVE_PLANT only)", constraints: "1..13; <= hardiness_max_zone" }
      - { name: hardiness_max_zone, type: integer, source: input, default: 13, description: "Warmest USDA zone the plant tolerates (LIVE_PLANT only)", constraints: "1..13; >= hardiness_min_zone" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit before promotions", constraints: ">= 0" }
      - { name: warranty_days, type: integer, source: input, default: 0, description: "Guarantee window in days; PERENNIAL plants must be > 0 to be claimable" }
      - { name: warranty_pct, type: integer, source: input, default: 0, description: "Percent of unit price honored on a valid warranty claim (0..100)", constraints: "0 <= warranty_pct <= 100" }

  - name: InventoryLot
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: nursery_id, type: string, source: system, description: "Denormalized nursery scope (== parent.nursery_id); not a direct FK edge — reach the nursery via this entity's parent" }
      - { name: special_order_id, type: string, source: system, default: null, description: "FK -> SpecialOrder.id; set only when this lot was created by receiving a special order" }
      - { name: received_qty, type: integer, source: input, description: "Units received into this lot", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Acquisition cost per unit (used for shrink valuation)", constraints: ">= 0" }
      - { name: qty_on_hand, type: integer, source: computed, description: "Physically present, sellable units = received_qty - reserved_qty - shrink_qty - sold_qty" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units reserved by ALLOCATED OrderLines drawing on this lot" }
      - { name: shrink_qty, type: integer, source: computed, default: 0, description: "Units lost to shrink (sum of CareLogEntry.qty_lost on this lot)" }
      - { name: sold_qty, type: integer, source: computed, default: 0, description: "Units consumed by FULFILLED OrderLines drawing on this lot" }
      - { name: provisional_shrink_value_cents, type: integer, source: computed, default: 0, description: "Provisional shrink valuation (see calc shrink_valuation, variant PROVISIONAL)" }
      - { name: status, type: enum, source: system, default: "QUARANTINE", description: "QUARANTINE | AVAILABLE | DEPLETED" }

  - name: CareLogEntry
    parent: InventoryLot
    common_fields: false
    fields:
      - { name: inventory_lot_id, type: string, source: system, description: "FK -> InventoryLot.id" }
      - { name: entry_type, type: enum, source: input, description: "WATERING | TREATMENT | INSPECTION | SHRINK_LOSS", constraints: "one of {WATERING, TREATMENT, INSPECTION, SHRINK_LOSS}" }
      - { name: qty_lost, type: integer, source: input, default: 0, description: "Units lost; required > 0 for SHRINK_LOSS, must be 0 for other types", constraints: ">= 0" }
      - { name: note, type: string, source: input, default: "", description: "Free-text care note" }
      - { name: logged_at, type: datetime, source: system, description: "Logical clock time when the entry was recorded" }

  - name: SeasonalPromotion
    parent: Nursery
    common_fields: true
    fields:
      - { name: nursery_id, type: string, source: system, description: "FK -> Nursery.id" }
      - { name: name, type: string, source: input, description: "Promotion name (e.g., Spring Planting Days)" }
      - { name: category_scope, type: enum, source: input, description: "Which product category the promo applies to: LIVE_PLANT | BULK_MATERIAL | DRY_GOOD | ALL", constraints: "one of {LIVE_PLANT, BULK_MATERIAL, DRY_GOOD, ALL}" }
      - { name: discount_pct, type: integer, source: input, description: "Percent off list price for in-scope lines (0..60)", constraints: "0 <= discount_pct <= 60" }
      - { name: starts_at, type: datetime, source: input, description: "Promotion active window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Promotion active window end (exclusive)", constraints: "ends_at > starts_at" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | ENDED" }

  - name: Vehicle
    parent: Nursery
    common_fields: true
    fields:
      - { name: nursery_id, type: string, source: system, description: "FK -> Nursery.id" }
      - { name: label, type: string, source: input, description: "Vehicle label / plate" }
      - { name: vehicle_type, type: enum, source: input, description: "FLATBED | BOX_TRUCK", constraints: "one of {FLATBED, BOX_TRUCK}" }
      - { name: capacity_cubic_yards, type: integer, source: input, description: "Max bulk-material volume per delivery run", constraints: "> 0" }
      - { name: turnaround_minutes, type: integer, source: input, default: 0, description: "Mandatory buffer after a delivery window before the vehicle is free again", constraints: ">= 0" }

  - name: Order
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: nursery_id, type: string, source: system, description: "Denormalized nursery scope (== parent.nursery_id); not a direct FK edge — reach the nursery via this entity's parent" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum over lines of unit_price_cents * qty (pre-discount, pre-redemption)" }
      - { name: promo_discount_cents, type: integer, source: computed, default: 0, description: "Total seasonal-promotion discount applied across lines (see calc line_pricing)" }
      - { name: redemption_cents, type: integer, source: computed, default: 0, description: "Loyalty value redeemed against this order at confirmation" }
      - { name: net_total_cents, type: integer, source: computed, default: 0, description: "gross_total_cents - promo_discount_cents - redemption_cents, floored at 0" }
      - { name: requested_redeem_points, type: integer, source: input, default: 0, description: "Points the buyer asks to redeem at confirmation", constraints: ">= 0" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONFIRMED | ALLOCATED | FULFILLED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | ON_ACCOUNT | PAID" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of Product.unit_price_cents at line-add time" }
      - { name: line_discount_cents, type: integer, source: computed, default: 0, description: "Promo discount applied to this line (see calc line_pricing)" }
      - { name: line_net_cents, type: integer, source: computed, default: 0, description: "qty * unit_price_cents - line_discount_cents" }
      - { name: allocated_lot_id, type: string, source: system, default: null, description: "FK -> InventoryLot.id; the lot reserved/consumed for this line, set at ALLOCATED" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ALLOCATED | FULFILLED | RELEASED" }

  - name: SpecialOrder
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: nursery_id, type: string, source: system, description: "Denormalized nursery scope (== parent.nursery_id); not a direct FK edge — reach the nursery via this entity's parent" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: requested_qty, type: integer, source: input, description: "Units requested", constraints: "> 0" }
      - { name: quoted_unit_cost_cents, type: integer, source: input, description: "Agreed acquisition cost per unit", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: computed, default: 0, description: "Required deposit = ceil(requested_qty * quoted_unit_cost_cents * DEPOSIT_PCT)" }
      - { name: received_lot_id, type: string, source: system, default: null, description: "FK -> InventoryLot.id; the lot minted when the special order is received" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | RECEIVED | CANCELLED" }

  - name: Delivery
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: nursery_id, type: string, source: system, description: "Denormalized nursery scope (== parent.nursery_id); not a direct FK edge — reach the nursery via this entity's parent" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (exclusive)", constraints: "window_end > window_start" }
      - { name: bulk_volume_cubic_yards, type: integer, source: computed, default: 0, description: "Total CUBIC_YARD volume of BULK_MATERIAL lines on the order" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | DISPATCHED | DELIVERED | CANCELLED" }

  - name: WarrantyClaim
    parent: OrderLine
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id" }
      - { name: nursery_id, type: string, source: system, description: "Denormalized nursery scope (== parent.nursery_id); not a direct FK edge — reach the nursery via this entity's parent" }
      - { name: claim_qty, type: integer, source: input, description: "Units claimed dead/failed", constraints: "> 0; <= OrderLine.qty" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock time the claim was filed" }
      - { name: resolution, type: enum, source: input, default: "REPLACEMENT", description: "Requested remedy: REPLACEMENT | REFUND", constraints: "one of {REPLACEMENT, REFUND}" }
      - { name: payout_cents, type: integer, source: computed, default: 0, description: "Refund value when APPROVED with REFUND (see calc warranty_payout); 0 for REPLACEMENT" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | APPROVED | DENIED" }

  - name: LoyaltyEvent
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: event_type, type: enum, source: system, description: "ACCRUAL | REDEMPTION | REVERSAL", constraints: "one of {ACCRUAL, REDEMPTION, REVERSAL}" }
      - { name: points_delta, type: integer, source: system, description: "Signed points change (ACCRUAL/REVERSAL>0 for grants, REDEMPTION<0, REVERSAL<0 for claw-back)" }
      - { name: source_kind, type: enum, source: system, description: "ORDER | WARRANTY_CLAIM", constraints: "one of {ORDER, WARRANTY_CLAIM}" }
      - { name: source_ref_id, type: string, source: system, description: "FK -> Order.id; the Order or WarrantyClaim whose line's order this event was caused by (polymorphic; resolves via source_kind)" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock time the event was recorded" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InventoryLot
    field: status
    initial_state: QUARANTINE
    terminal_states: [DEPLETED]
    transitions:
      - from: QUARANTINE
        to: AVAILABLE
        trigger: "POST /inventory-lots/{id}/release"
        actor: InventoryManager
        preconditions:
          - "Lot status == QUARANTINE (else ERR_LOT_NOT_QUARANTINED)"
          - "qty_on_hand > 0 (else ERR_LOT_EMPTY)"
        side_effects:
          - "status -> AVAILABLE; lot becomes eligible for OrderLine allocation"
          - "increments InventoryLot.version by 1"
      - from: AVAILABLE
        to: QUARANTINE
        trigger: "POST /inventory-lots/{id}/quarantine"
        actor: InventoryManager
        preconditions:
          - "Lot status == AVAILABLE (else ERR_LOT_NOT_AVAILABLE)"
          - "reserved_qty == 0 (else ERR_LOT_HAS_RESERVATIONS)"
        side_effects:
          - "status -> AVAILABLE..QUARANTINE; lot removed from allocation pool until re-released"
          - "increments InventoryLot.version by 1"
        note: "Revision cycle: a lot can bounce AVAILABLE<->QUARANTINE any number of times while it still has stock."
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when qty_on_hand reaches 0 after a SHRINK_LOSS care entry or an order FULFILL consumes the last units)"
        actor: system
        preconditions:
          - "qty_on_hand transitions to exactly 0"
          - "reserved_qty == 0"
        side_effects:
          - "status -> DEPLETED (terminal); lot can no longer be released or allocated"

  - entity: Order
    field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: "Order carries TWO independent state dimensions: fulfillment_status (this machine) and payment_status (next machine). They evolve independently except at confirmation."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesClerk
        preconditions:
          - "Order has >= 1 OrderLine (else ERR_ORDER_EMPTY)"
          - "Account.status == ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
          - "requested_redeem_points <= Account.points_balance (else ERR_INSUFFICIENT_POINTS)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Run calc line_pricing over all lines (sets each line_discount_cents, line_net_cents)"
          - "Run calc order_totals (sets gross_total_cents, promo_discount_cents, redemption_cents, net_total_cents)"
          - "If requested_redeem_points > 0: append LoyaltyEvent(REDEMPTION, points_delta = -requested_redeem_points) → recompute Account.points_balance"
          - "fulfillment_status -> CONFIRMED"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "POST /orders/{id}/allocate"
        actor: InventoryManager
        preconditions:
          - "Every OrderLine can be satisfied from a single AVAILABLE lot of its product with qty_on_hand >= line.qty (else ERR_INSUFFICIENT_STOCK)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "For each line: pick the lot via selector lot_allocation_selector; set line.allocated_lot_id, line.status -> ALLOCATED"
          - "Each chosen InventoryLot.reserved_qty += line.qty → recompute lot.qty_on_hand"
          - "fulfillment_status -> ALLOCATED"
          - "increments Order.version by 1"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: InventoryManager
        preconditions:
          - "payment_status IN {ON_ACCOUNT, PAID} (else ERR_ORDER_NOT_SETTLED)"
          - "If order has a Delivery, that Delivery.status == DELIVERED (else ERR_DELIVERY_NOT_COMPLETED)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "For each line: lot.reserved_qty -= line.qty; lot.sold_qty += line.qty; line.status -> FULFILLED → recompute lot.qty_on_hand"
          - "Any lot whose qty_on_hand hits 0 and reserved_qty == 0 auto-transitions AVAILABLE -> DEPLETED"
          - "Append LoyaltyEvent(ACCRUAL, points_delta = accrual from calc loyalty_accrual) → recompute Account.lifetime_points, loyalty_tier, points_balance"
          - "fulfillment_status -> FULFILLED"
          - "increments Order.version by 1"
      - from: [DRAFT, CONFIRMED, ALLOCATED]
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesClerk
        preconditions:
          - "fulfillment_status != FULFILLED (else ERR_ORDER_ALREADY_FULFILLED)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "If ALLOCATED: for each line, lot.reserved_qty -= line.qty; line.status -> RELEASED → recompute lot.qty_on_hand (compensating: restores lot availability)"
          - "If payment_status == ON_ACCOUNT: reverse the on-account charge → recompute Account.outstanding_balance_cents (compensating)"
          - "If a REDEMPTION LoyaltyEvent was posted at confirm: append LoyaltyEvent(REVERSAL, points_delta = +redemption points) → recompute Account.points_balance (compensating)"
          - "If order has a SCHEDULED/DISPATCHED Delivery: Delivery.status -> CANCELLED, freeing the Vehicle window (compensating)"
          - "fulfillment_status -> CANCELLED (terminal)"
          - "increments Order.version by 1"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: []
    note: "Independent payment dimension on the same Order row. UNPAID may become ON_ACCOUNT (B2B credit) or PAID. ON_ACCOUNT may later become PAID."
    transitions:
      - from: UNPAID
        to: ON_ACCOUNT
        trigger: "POST /orders/{id}/charge-account"
        actor: SalesClerk
        preconditions:
          - "fulfillment_status IN {CONFIRMED, ALLOCATED} (else ERR_ORDER_NOT_CONFIRMED)"
          - "Account.account_type == LANDSCAPER_B2B (else ERR_NOT_B2B_ACCOUNT)"
          - "Account.outstanding_balance_cents + Order.net_total_cents <= Account.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "payment_status -> ON_ACCOUNT"
          - "recompute Account.outstanding_balance_cents (adds Order.net_total_cents)"
          - "If the new outstanding_balance_cents == Account.credit_limit_cents (account is now fully drawn), Account.status -> CREDIT_HOLD (bubble-up: blocks further order confirms until paid down)"
          - "increments Order.version by 1"
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: SalesClerk
        preconditions:
          - "fulfillment_status IN {CONFIRMED, ALLOCATED} (else ERR_ORDER_NOT_CONFIRMED)"
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "payment_status -> PAID"
          - "increments Order.version by 1"
      - from: ON_ACCOUNT
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: SalesClerk
        preconditions:
          - "expected_order_version matches Order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "payment_status -> PAID"
          - "recompute Account.outstanding_balance_cents (subtracts Order.net_total_cents); if balance drops at/below credit_limit and Account.status == CREDIT_HOLD, Account.status -> ACTIVE (compensating bubble-up)"
          - "increments Order.version by 1"

  - entity: SpecialOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    note: "Branching: REQUESTED forks to APPROVED (→RECEIVED) or directly to CANCELLED; each branch has a divergent side-effect set."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /special-orders/{id}/approve"
        actor: InventoryManager
        preconditions:
          - "SpecialOrder status == REQUESTED (else ERR_SPECIAL_ORDER_NOT_REQUESTED)"
          - "Run calc special_order_deposit → deposit_cents set"
        side_effects:
          - "status -> APPROVED; deposit_cents pinned"
          - "increments SpecialOrder.version by 1"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "SpecialOrder status == APPROVED (else ERR_SPECIAL_ORDER_NOT_APPROVED)"
        side_effects:
          - "Mint a new InventoryLot: product_id = SpecialOrder.product_id, received_qty = requested_qty, unit_cost_cents = quoted_unit_cost_cents, special_order_id = this SO, status = QUARANTINE"
          - "Set SpecialOrder.received_lot_id = new lot id; status -> RECEIVED (terminal)"
          - "increments SpecialOrder.version by 1"
      - from: [REQUESTED, APPROVED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: InventoryManager
        preconditions:
          - "SpecialOrder status IN {REQUESTED, APPROVED} (else ERR_SPECIAL_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (terminal); no lot minted"
          - "increments SpecialOrder.version by 1"

  - entity: Delivery
    field: status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /deliveries/{id}/dispatch"
        actor: InventoryManager
        preconditions:
          - "Delivery status == SCHEDULED (else ERR_DELIVERY_NOT_SCHEDULED)"
          - "Parent Order.fulfillment_status == ALLOCATED (else ERR_ORDER_NOT_ALLOCATED)"
        side_effects:
          - "status -> DISPATCHED"
          - "increments Delivery.version by 1"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /deliveries/{id}/complete"
        actor: InventoryManager
        preconditions:
          - "Delivery status == DISPATCHED (else ERR_DELIVERY_NOT_DISPATCHED)"
        side_effects:
          - "status -> DELIVERED (terminal); unblocks parent Order fulfill"
          - "increments Delivery.version by 1"
      - from: [SCHEDULED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /deliveries/{id}/cancel"
        actor: InventoryManager
        preconditions:
          - "Delivery status IN {SCHEDULED, DISPATCHED} (else ERR_DELIVERY_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (terminal); frees the Vehicle window (no overlap held)"
          - "increments Delivery.version by 1"

  - entity: WarrantyClaim
    field: status
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: SalesClerk
        preconditions:
          - "WarrantyClaim status == FILED (else ERR_CLAIM_NOT_FILED)"
          - "Claim filed within Product.warranty_days of the parent Order's FULFILLED time (else ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "If resolution == REFUND: run calc warranty_payout → payout_cents set; append LoyaltyEvent(REVERSAL, points_delta = -(floor(payout_cents / 100) * Nursery.loyalty_accrual_per_dollar)) → recompute Account.lifetime_points, loyalty_tier, points_balance (compensating claw-back of points granted on the refunded value)"
          - "If resolution == REPLACEMENT: payout_cents stays 0; no loyalty claw-back"
          - "status -> APPROVED (terminal)"
          - "increments WarrantyClaim.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: SalesClerk
        preconditions:
          - "WarrantyClaim status == FILED (else ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "status -> DENIED (terminal); no payout, no loyalty change"
          - "increments WarrantyClaim.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already added a line or confirmed the order (legitimately superseding the
      client's view of pricing/redemption), so the current writer's order
      snapshot — including the gross/redemption totals it intends to lock — is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-allocate-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/allocate"
    occ_field: "expected_order_version"
    description: |
      Allocating an Order against a version that has moved on (e.g., a parallel
      payment-dimension transition such as charge-account bumped Order.version
      after the client read it) is rejected on the stale-version check before any
      lot reservation occurs.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "Order confirm (POST /orders/{id}/confirm); recomputed if lines change before confirm"
    algorithm: threshold
    formula: |
      For each OrderLine L with product P:
        applicable_promo = the SeasonalPromotion S on the same nursery where
            S.status == ACTIVE
            AND (S.category_scope == 'ALL' OR S.category_scope == P.category)
            AND S.starts_at <= now < S.ends_at         # half-open window
          ranked by discount_pct DESC, tie-break created_at ASC; pick the single highest.
        if no applicable_promo:
          L.line_discount_cents = 0
        else:
          # round per-line: discount is computed and rounded on each line independently
          L.line_discount_cents = floor(L.qty * L.unit_price_cents * applicable_promo.discount_pct / 100)
        L.line_net_cents = L.qty * L.unit_price_cents - L.line_discount_cents
    input_set: "All OrderLines on the order; only ACTIVE promotions whose half-open [starts_at, ends_at) window contains the clock 'now'."
    constants: {}
    precision: "Integer cents; per-line floor of the percentage product BEFORE summing (rounding order is pinned: round-per-line-then-sum)."

  - name: order_totals
    trigger: "Order confirm (after line_pricing)"
    algorithm: aggregation
    formula: |
      gross_total_cents   = sum over lines of (L.qty * L.unit_price_cents)
      promo_discount_cents = sum over lines of L.line_discount_cents
      redemption_cents    = min(requested_redeem_points * POINT_VALUE_CENTS,
                                gross_total_cents - promo_discount_cents)
      net_total_cents     = max(0, gross_total_cents - promo_discount_cents - redemption_cents)
    input_set: "All OrderLines after line_pricing has run."
    constants:
      POINT_VALUE_CENTS: 5
    precision: "Integer cents. Evaluation order is pinned: line_pricing (per-line floor) → sum into promo_discount_cents → cap redemption against the post-discount subtotal → net."

  - name: loyalty_accrual
    trigger: "Order fulfill (POST /orders/{id}/fulfill)"
    algorithm: threshold
    formula: |
      eligible_dollars = floor(Order.net_total_cents / 100)        # whole dollars only
      base_rate = Nursery.loyalty_accrual_per_dollar
      if Account.loyalty_tier == 'GOLD':
        rate = base_rate * GOLD_MULTIPLIER
      else:
        rate = base_rate
      accrual_points = eligible_dollars * rate
    input_set: "The single fulfilled Order's net_total_cents; the account tier observed at fulfill time."
    constants:
      GOLD_MULTIPLIER: 2
    precision: "Integer points; floor on dollar conversion BEFORE multiplying by rate (order pinned)."
    variants:
      - name: STANDARD
        when: "Account.loyalty_tier == STANDARD at fulfill time"
        difference: "rate = base_rate (no multiplier)"
      - name: GOLD
        when: "Account.loyalty_tier == GOLD at fulfill time"
        difference: "rate = base_rate * GOLD_MULTIPLIER; doubles the same net_total into points"

  - name: shrink_valuation
    trigger: "CareLogEntry of type SHRINK_LOSS posted (POST /inventory-lots/{id}/care-log); and Order fulfill"
    algorithm: aggregation
    formula: |
      lot.shrink_qty = sum of CareLogEntry.qty_lost over SHRINK_LOSS entries on the lot
      PROVISIONAL (live, before any depletion):
        provisional_shrink_value_cents = lot.shrink_qty * lot.unit_cost_cents
      FINAL (when lot transitions to DEPLETED):
        final_shrink_value_cents = (received_qty - sold_qty) * lot.unit_cost_cents
        # at depletion every non-sold unit is treated as shrink-or-reserved-loss
    input_set: "All SHRINK_LOSS CareLogEntries on the lot (provisional); received vs sold quantities (final at depletion)."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: PROVISIONAL
        when: "Lot is QUARANTINE or AVAILABLE (still live)"
        difference: "Values only the explicitly logged SHRINK_LOSS quantity at unit_cost."
      - name: FINAL
        when: "Lot reaches DEPLETED"
        difference: "Values ALL never-sold units (received_qty - sold_qty) at unit_cost — can exceed the provisional figure when reserved units were released without a sale."

  - name: special_order_deposit
    trigger: "SpecialOrder approve (POST /special-orders/{id}/approve)"
    algorithm: threshold
    formula: |
      raw = requested_qty * quoted_unit_cost_cents
      deposit_cents = ceil(raw * DEPOSIT_PCT / 100)
    input_set: "The single SpecialOrder's requested_qty and quoted_unit_cost_cents."
    constants:
      DEPOSIT_PCT: 30
    precision: "Integer cents; ceil of the percentage product."

  - name: warranty_payout
    trigger: "WarrantyClaim approve with resolution == REFUND (POST /warranty-claims/{id}/approve)"
    algorithm: threshold
    formula: |
      line = WarrantyClaim's OrderLine
      effective_unit_net = (line.line_net_cents) / line.qty          # promo-adjusted unit value, real division
      payout_cents = floor(claim_qty * effective_unit_net * Product.warranty_pct / 100)
    input_set: "The claimed OrderLine's net value, the claim_qty, and the product warranty_pct."
    constants: {}
    precision: "Integer cents; single floor at the end (effective_unit_net kept as exact rational until the final floor)."

  - name: lot_allocation_selector
    trigger: "Order allocate (POST /orders/{id}/allocate)"
    algorithm: chronological
    formula: |
      For an OrderLine of product P needing qty Q:
        candidate lots = InventoryLot where product_id == P.id
                         AND status == AVAILABLE
                         AND qty_on_hand >= Q
        if candidate set empty: reject ERR_INSUFFICIENT_STOCK
        rank: oldest-received first by created_at ASC; tie-break id is FORBIDDEN —
              use created_at ASC then, if still tied, the lot with the smaller
              received_qty first (FEFO-style: drain shallow lots earlier).
        chosen = first ranked lot.
    input_set: "AVAILABLE lots of the line's product with sufficient qty_on_hand."
    constants: {}
    precision: "N/A (selection, not arithmetic)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (nurseryId, then accountId/productId/orderId/lotId/etc.)"
    error_id: "ERR_NURSERY_NOT_FOUND / ERR_ACCOUNT_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_LOT_NOT_FOUND / ERR_SPECIAL_ORDER_NOT_FOUND / ERR_DELIVERY_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_LINE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "Body-referenced FK targets exist and belong to the same nursery (product_id on line/special-order, vehicle_id on delivery, order_line_id on claim)"
    error_id: "ERR_PRODUCT_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /orders/{id}/lines, POST /special-orders, POST /orders/{id}/deliveries, POST /order-lines/{id}/warranty-claims"

  - priority: 5
    category: business_constraint
    check: "Field-shape constraints: enums valid; qty > 0; zones 1..13 with min<=max; unit matches category; lifecycle_class matches category; SHRINK_LOSS requires qty_lost > 0 and non-shrink entries require qty_lost == 0; window_end > window_start; ends_at > starts_at; discount_pct 0..60; warranty_pct 0..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/transition endpoints

  - priority: 6
    category: business_constraint
    check: "SKU uniqueness per nursery on Product create"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /nurseries/{id}/products"

  - priority: 7
    category: state
    check: "Target resource is in a state that permits the requested transition (lot status, order fulfillment/payment status, special-order status, delivery status, claim status)"
    error_id: "ERR_LOT_NOT_QUARANTINED / ERR_LOT_NOT_AVAILABLE / ERR_LOT_EMPTY / ERR_LOT_HAS_RESERVATIONS / ERR_ORDER_EMPTY / ERR_ORDER_NOT_CONFIRMED / ERR_ORDER_NOT_ALLOCATED / ERR_ORDER_ALREADY_FULFILLED / ERR_ORDER_NOT_SETTLED / ERR_SPECIAL_ORDER_NOT_REQUESTED / ERR_SPECIAL_ORDER_NOT_APPROVED / ERR_SPECIAL_ORDER_NOT_CANCELLABLE / ERR_DELIVERY_NOT_SCHEDULED / ERR_DELIVERY_NOT_DISPATCHED / ERR_DELIVERY_NOT_CANCELLABLE / ERR_DELIVERY_NOT_COMPLETED / ERR_CLAIM_NOT_FILED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: state
    check: "Cross-entity state precondition: Account.status == ACTIVE for order confirm; Delivery.status == DELIVERED before order fulfill when a delivery exists; parent Order.fulfillment_status == ALLOCATED before delivery dispatch"
    error_id: "ERR_ACCOUNT_NOT_ACTIVE / ERR_DELIVERY_NOT_COMPLETED / ERR_ORDER_NOT_ALLOCATED"
    http_status: 409
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/fulfill, POST /deliveries/{id}/dispatch"

  - priority: 9
    category: business_safety
    check: "Hardiness advisory gate: when adding a LIVE_PLANT line, if the account's ship_to_hardiness_zone falls OUTSIDE [Product.hardiness_min_zone, Product.hardiness_max_zone] the line is rejected unless body carries acknowledge_hardiness_risk == true"
    error_id: ERR_HARDINESS_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/lines"

  - priority: 10
    category: business_safety
    check: "Warranty eligibility: claim filed within Product.warranty_days of the order's FULFILLED timestamp, and Product.warranty_days > 0 (PERENNIAL guarantee); claim_qty <= OrderLine.qty"
    error_id: "ERR_WARRANTY_EXPIRED / ERR_WARRANTY_NOT_OFFERED / ERR_CLAIM_QTY_EXCEEDS_LINE"
    http_status: 422
    applies_to: "POST /order-lines/{id}/warranty-claims, POST /warranty-claims/{id}/approve"

  - priority: 11
    category: business_temporal
    check: "Delivery window must not overlap another non-CANCELLED Delivery on the same Vehicle, counting the vehicle's turnaround_minutes buffer after each window (BUFFERED-ADJACENCY semantics: busy interval is the half-open [start, end + turnaround_minutes); two deliveries collide iff their busy intervals intersect)"
    error_id: ERR_VEHICLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/deliveries"

  - priority: 11.5
    category: business_temporal
    check: "Seasonal promotion window must not overlap another SCHEDULED/ACTIVE SeasonalPromotion on the same nursery whose category_scope collides (same scope, or either is ALL), using PLAIN half-open [starts_at, ends_at) intersection with NO buffer; abutting windows (one ends exactly when the next starts) are allowed"
    error_id: ERR_PROMOTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /nurseries/{id}/promotions"

  - priority: 12
    category: business_constraint
    check: "Bulk volume of the order's BULK_MATERIAL lines must not exceed the chosen Vehicle.capacity_cubic_yards"
    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /orders/{id}/deliveries"

  - priority: 13
    category: business_constraint
    check: "Allocation feasibility: each line must be satisfiable from a single AVAILABLE lot with qty_on_hand >= line.qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /orders/{id}/allocate"

  - priority: 14
    category: business_fiscal
    check: "Loyalty redemption: requested_redeem_points <= Account.points_balance at confirm"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /orders/{id}/confirm"

  - priority: 15
    category: business_fiscal
    check: "B2B credit: only LANDSCAPER_B2B may charge-to-account; outstanding_balance + net_total must not exceed credit_limit"
    error_id: "ERR_NOT_B2B_ACCOUNT / ERR_CREDIT_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /orders/{id}/charge-account"

  - priority: 16
    category: state
    check: "OCC: expected_<parent>_version on guarded writes must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/confirm, /allocate, /fulfill, /cancel, /charge-account, /pay"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Nursery ---
  - method: POST
    path: "/nurseries"
    description: "Create a nursery (root aggregate)"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "site_hardiness_zone", "loyalty_accrual_per_dollar?", "gold_tier_threshold_points?", "shrink_writeoff_zone_grace?"]
    output: Nursery
    side_effects: ["status fields initialized"]
  - method: GET
    path: "/nurseries/{id}"
    description: "Read a nursery"
    roles: [PlatformAdmin, InventoryManager, SalesClerk]
    code: 200
    input: []
    output: Nursery

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for promotion windows, care-log timestamps, warranty math, and delivery overlap. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"

  # --- Account ---
  - method: POST
    path: "/nurseries/{id}/accounts"
    description: "Create a retail or B2B landscaper account"
    roles: [SalesClerk]
    code: 201
    input: ["account_type", "display_name", "ship_to_hardiness_zone", "credit_limit_cents?"]
    output: Account
    side_effects: ["RETAIL accounts forced credit_limit_cents=0; status=ACTIVE; loyalty fields=0/STANDARD"]
  - method: GET
    path: "/nurseries/{id}/accounts"
    description: "List accounts under a nursery (filterable)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["account_type?", "status?", "limit?", "offset?"]
    output: Account[]
  - method: GET
    path: "/accounts/{id}"
    description: "Read an account incl. computed loyalty/balance fields"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: []
    output: Account
  - method: GET
    path: "/accounts/{id}/loyalty-events"
    description: "List loyalty ledger events for an account (reverse-reachability for LoyaltyEvent)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyEvent[]
  - method: GET
    path: "/accounts/{id}/orders"
    description: "List orders for an account (reverse-reachability for Order)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
  - method: GET
    path: "/accounts/{id}/special-orders"
    description: "List special orders for an account (reverse-reachability for SpecialOrder)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SpecialOrder[]

  # --- Product ---
  - method: POST
    path: "/nurseries/{id}/products"
    description: "Create a product/SKU"
    roles: [InventoryManager]
    code: 201
    input: ["sku", "name", "category", "unit", "lifecycle_class?", "hardiness_min_zone?", "hardiness_max_zone?", "unit_price_cents", "warranty_days?", "warranty_pct?"]
    output: Product
    side_effects: ["SKU uniqueness enforced per nursery"]
  - method: GET
    path: "/nurseries/{id}/products"
    description: "List products under a nursery (reverse-reachability for Product)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["category?", "nursery_id?", "limit?", "offset?"]
    output: Product[]
  - method: GET
    path: "/products/{id}"
    description: "Read a product"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: Product
  - method: GET
    path: "/products/{id}/inventory-lots"
    description: "List inventory lots for a product (reverse-reachability for InventoryLot)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InventoryLot[]

  # --- InventoryLot ---
  - method: POST
    path: "/products/{id}/inventory-lots"
    description: "Receive a new inventory lot for a product (starts in QUARANTINE)"
    roles: [InventoryManager]
    code: 201
    input: [received_qty, unit_cost_cents]
    output: InventoryLot
    side_effects: ["qty_on_hand=received_qty; status=QUARANTINE; reserved/shrink/sold=0"]
  - method: GET
    path: "/inventory-lots/{id}"
    description: "Read an inventory lot incl. computed qty/shrink fields"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: InventoryLot
  - method: POST
    path: "/inventory-lots/{id}/release"
    description: "Release a lot from QUARANTINE to AVAILABLE"
    roles: [InventoryManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status QUARANTINE->AVAILABLE; version+1"]
  - method: POST
    path: "/inventory-lots/{id}/quarantine"
    description: "Pull an AVAILABLE lot back to QUARANTINE (revision cycle)"
    roles: [InventoryManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status AVAILABLE->QUARANTINE; version+1"]
  - method: POST
    path: "/inventory-lots/{id}/care-log"
    description: "Append a care-log entry (watering/treatment/inspection/shrink loss)"
    roles: [InventoryManager]
    code: 201
    input: ["entry_type", "qty_lost?", "note?"]
    output: CareLogEntry
    side_effects: ["SHRINK_LOSS: lot.shrink_qty += qty_lost → recompute qty_on_hand & provisional_shrink_value_cents; if qty_on_hand hits 0 & reserved_qty==0, lot AVAILABLE->DEPLETED + final shrink valuation"]
  - method: GET
    path: "/inventory-lots/{id}/care-log"
    description: "List care-log entries for a lot (reverse-reachability for CareLogEntry)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: CareLogEntry[]

  # --- SeasonalPromotion ---
  - method: POST
    path: "/nurseries/{id}/promotions"
    description: "Create a seasonal promotion"
    roles: [SalesClerk]
    code: 201
    input: [name, category_scope, discount_pct, starts_at, ends_at]
    output: SeasonalPromotion
    side_effects: ["promotion-window overlap check vs colliding-scope SCHEDULED/ACTIVE promotions; status=SCHEDULED"]
  - method: GET
    path: "/nurseries/{id}/promotions"
    description: "List promotions under a nursery (reverse-reachability for SeasonalPromotion)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["status?", "category_scope?", "limit?", "offset?"]
    output: SeasonalPromotion[]
  - method: POST
    path: "/promotions/{id}/activate"
    description: "Activate a scheduled promotion (SCHEDULED->ACTIVE)"
    roles: [SalesClerk]
    code: 200
    input: []
    output: SeasonalPromotion
    side_effects: ["status SCHEDULED->ACTIVE"]

  # --- Vehicle ---
  - method: POST
    path: "/nurseries/{id}/vehicles"
    description: "Register a delivery vehicle"
    roles: [InventoryManager]
    code: 201
    input: ["label", "vehicle_type", "capacity_cubic_yards", "turnaround_minutes?"]
    output: Vehicle
  - method: GET
    path: "/nurseries/{id}/vehicles"
    description: "List vehicles under a nursery (reverse-reachability for Vehicle)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["vehicle_type?", "limit?", "offset?"]
    output: Vehicle[]
  - method: GET
    path: "/vehicles/{id}"
    description: "Read a vehicle"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: Vehicle
  - method: GET
    path: "/vehicles/{id}/deliveries"
    description: "List deliveries booked on a vehicle (reverse-reachability for Delivery by vehicle_id)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Delivery[]

  # --- Order ---
  - method: POST
    path: "/accounts/{id}/orders"
    description: "Open a draft order for an account"
    roles: [SalesClerk]
    code: 201
    input: []
    output: Order
    side_effects: ["fulfillment_status=DRAFT; payment_status=UNPAID; totals=0"]
  - method: GET
    path: "/orders/{id}"
    description: "Read an order incl. computed totals and both status dimensions"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: []
    output: Order
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a draft order"
    roles: [SalesClerk]
    code: 201
    input: ["product_id", "qty", "acknowledge_hardiness_risk?"]
    output: OrderLine
    side_effects: ["snapshot unit_price_cents; hardiness advisory gate; recompute gross_total_cents"]
  - method: GET
    path: "/orders/{id}/lines"
    description: "List lines on an order (reverse-reachability for OrderLine)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrderLine[]
  - method: GET
    path: "/orders/{id}/loyalty-events"
    description: "List loyalty events caused by this order (reverse-reachability for LoyaltyEvent.source_ref_id with source_kind == ORDER)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyEvent[]
  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order/product/allocated lot (reverse-reachability for OrderLine.product_id and OrderLine.allocated_lot_id)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["order_id?", "product_id?", "allocated_lot_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
  - method: GET
    path: "/order-lines/{id}"
    description: "Read a single order line"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: []
    output: OrderLine
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm order: run pricing + redemption, lock totals"
    roles: [SalesClerk]
    code: 200
    input: ["requested_redeem_points?", "expected_order_version"]
    output: Order
    side_effects: ["line_pricing; order_totals; optional REDEMPTION LoyaltyEvent; fulfillment_status->CONFIRMED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/allocate"
    description: "Allocate inventory lots to each confirmed line"
    roles: [InventoryManager]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["lot_allocation_selector per line; lot.reserved_qty += qty; line.status->ALLOCATED; fulfillment_status->ALLOCATED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/charge-account"
    description: "Charge a B2B order to the account's credit line"
    roles: [SalesClerk]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["payment_status->ON_ACCOUNT; recompute Account.outstanding_balance_cents; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/pay"
    description: "Mark an order paid (from UNPAID or ON_ACCOUNT)"
    roles: [SalesClerk]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["payment_status->PAID; if was ON_ACCOUNT, recompute outstanding_balance & possibly lift CREDIT_HOLD; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill an allocated, settled order"
    roles: [InventoryManager]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["consume lots (reserved->sold), DEPLETED auto-transition; ACCRUAL LoyaltyEvent; fulfillment_status->FULFILLED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-fulfilled order (compensating reversals)"
    roles: [SalesClerk]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["release reservations; reverse on-account charge; reverse redemption; cancel delivery; fulfillment_status->CANCELLED; increments Order.version by 1"]

  # --- SpecialOrder ---
  - method: POST
    path: "/accounts/{id}/special-orders"
    description: "Request a special / back-order procurement"
    roles: [SalesClerk]
    code: 201
    input: [product_id, requested_qty, quoted_unit_cost_cents]
    output: SpecialOrder
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/special-orders"
    description: "List special orders, filterable by product/received-lot/account (reverse-reachability for SpecialOrder.product_id and SpecialOrder.received_lot_id)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["product_id?", "received_lot_id?", "account_id?", "status?", "limit?", "offset?"]
    output: SpecialOrder[]
  - method: GET
    path: "/special-orders/{id}"
    description: "Read a special order"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: SpecialOrder
  - method: GET
    path: "/special-orders/{id}/inventory-lots"
    description: "List the inventory lot(s) minted by receiving this special order (reverse-reachability for InventoryLot.special_order_id; 1:1 → array of 0–1)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: InventoryLot[]
  - method: POST
    path: "/special-orders/{id}/approve"
    description: "Approve a special order; pins deposit"
    roles: [InventoryManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["special_order_deposit; status->APPROVED"]
  - method: POST
    path: "/special-orders/{id}/receive"
    description: "Receive an approved special order; mints an InventoryLot"
    roles: [InventoryManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["mint InventoryLot in QUARANTINE; set received_lot_id; status->RECEIVED"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a special order before receipt"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status->CANCELLED; no lot minted"]

  # --- Delivery ---
  - method: POST
    path: "/orders/{id}/deliveries"
    description: "Book a delivery for an order onto a vehicle window"
    roles: [InventoryManager]
    code: 201
    input: [vehicle_id, window_start, window_end]
    output: Delivery
    side_effects: ["vehicle overlap + capacity checks; bulk_volume_cubic_yards computed; status=SCHEDULED"]
  - method: GET
    path: "/orders/{id}/deliveries"
    description: "List deliveries for an order (reverse-reachability for Delivery by order_id)"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Delivery[]
  - method: GET
    path: "/deliveries/{id}"
    description: "Read a delivery"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: Delivery
  - method: POST
    path: "/deliveries/{id}/dispatch"
    description: "Dispatch a scheduled delivery"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status SCHEDULED->DISPATCHED"]
  - method: POST
    path: "/deliveries/{id}/complete"
    description: "Mark a dispatched delivery delivered"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status DISPATCHED->DELIVERED; unblocks order fulfill"]
  - method: POST
    path: "/deliveries/{id}/cancel"
    description: "Cancel a delivery, freeing the vehicle window"
    roles: [InventoryManager, SalesClerk]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status->CANCELLED; vehicle window freed"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/order-lines/{id}/warranty-claims"
    description: "File a plant warranty/guarantee claim on a fulfilled order line"
    roles: [SalesClerk]
    code: 201
    input: ["claim_qty", "resolution?"]
    output: WarrantyClaim
    side_effects: ["warranty eligibility checks; status=FILED; filed_at stamped"]
  - method: GET
    path: "/order-lines/{id}/warranty-claims"
    description: "List warranty claims for an order line (reverse-reachability for WarrantyClaim)"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read a warranty claim"
    roles: [SalesClerk, InventoryManager]
    code: 200
    input: []
    output: WarrantyClaim
  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a claim (REFUND computes payout + loyalty claw-back; REPLACEMENT no payout)"
    roles: [SalesClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["warranty_payout if REFUND; REVERSAL LoyaltyEvent if REFUND; status->APPROVED"]
  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a claim"
    roles: [SalesClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status->DENIED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID / X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NURSERY_NOT_FOUND, http: 404, condition: "nurseryId path id does not resolve" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "accountId path id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "productId path/body id does not resolve in nursery" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId path id does not resolve" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "lineId path/body id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lotId path id does not resolve" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "soId path id does not resolve" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "deliveryId path id does not resolve" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicleId path/body id does not resolve in nursery" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claimId path id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Field-shape violation: bad enum, qty<=0, zone out of 1..13 or min>max, unit/category mismatch, lifecycle mismatch, qty_lost rule violation, window/promo ordering, pct out of range" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product SKU already used in this nursery" }
  - { id: ERR_LOT_NOT_QUARANTINED, http: 409, condition: "release attempted on a lot not in QUARANTINE" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "quarantine attempted on a lot not in AVAILABLE" }
  - { id: ERR_LOT_EMPTY, http: 409, condition: "release attempted on a lot with qty_on_hand == 0" }
  - { id: ERR_LOT_HAS_RESERVATIONS, http: 409, condition: "quarantine attempted while reserved_qty > 0" }
  - { id: ERR_ORDER_EMPTY, http: 409, condition: "confirm attempted on an order with no lines" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "confirm attempted while Account.status != ACTIVE" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "charge-account/pay attempted while fulfillment_status not in {CONFIRMED, ALLOCATED}" }
  - { id: ERR_ORDER_NOT_ALLOCATED, http: 409, condition: "fulfill before ALLOCATED, or dispatch while parent order not ALLOCATED" }
  - { id: ERR_ORDER_NOT_SETTLED, http: 409, condition: "fulfill attempted while payment_status == UNPAID" }
  - { id: ERR_ORDER_ALREADY_FULFILLED, http: 409, condition: "cancel attempted on a FULFILLED order" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "no single AVAILABLE lot can satisfy a line at allocate" }
  - { id: ERR_SPECIAL_ORDER_NOT_REQUESTED, http: 409, condition: "approve attempted on a special order not in REQUESTED" }
  - { id: ERR_SPECIAL_ORDER_NOT_APPROVED, http: 409, condition: "receive attempted on a special order not in APPROVED" }
  - { id: ERR_SPECIAL_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on a special order not in {REQUESTED, APPROVED}" }
  - { id: ERR_DELIVERY_NOT_SCHEDULED, http: 409, condition: "dispatch attempted on a delivery not in SCHEDULED" }
  - { id: ERR_DELIVERY_NOT_DISPATCHED, http: 409, condition: "complete attempted on a delivery not in DISPATCHED" }
  - { id: ERR_DELIVERY_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on a delivery not in {SCHEDULED, DISPATCHED}" }
  - { id: ERR_DELIVERY_NOT_COMPLETED, http: 409, condition: "fulfill attempted while an existing delivery is not DELIVERED" }
  - { id: ERR_VEHICLE_WINDOW_CONFLICT, http: 409, condition: "delivery window overlaps another non-CANCELLED window on the vehicle incl. turnaround buffer" }
  - { id: ERR_PROMOTION_WINDOW_CONFLICT, http: 409, condition: "promotion window overlaps an existing SCHEDULED/ACTIVE promotion with a colliding category_scope on the same nursery (plain half-open intersection)" }
  - { id: ERR_VEHICLE_CAPACITY_EXCEEDED, http: 422, condition: "order bulk volume exceeds vehicle capacity_cubic_yards" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "approve/deny attempted on a claim not in FILED" }
  - { id: ERR_HARDINESS_ZONE_MISMATCH, http: 422, condition: "LIVE_PLANT line outside account zone range without acknowledge_hardiness_risk" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "claim filed/approved beyond Product.warranty_days from order FULFILLED time" }
  - { id: ERR_WARRANTY_NOT_OFFERED, http: 422, condition: "claim on a product with warranty_days == 0" }
  - { id: ERR_CLAIM_QTY_EXCEEDS_LINE, http: 422, condition: "claim_qty > OrderLine.qty" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "requested_redeem_points > Account.points_balance at confirm" }
  - { id: ERR_NOT_B2B_ACCOUNT, http: 422, condition: "charge-account attempted on a non-LANDSCAPER_B2B account" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "outstanding + net_total exceeds credit_limit on charge-account" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match Order.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator who provisions nurseries and controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /nurseries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /nurseries/{id}"

  - name: InventoryManager
    description: "Owns inventory: products, lots, care logs, allocation, special orders, deliveries, vehicles"
    identity: opaque
    exclusive_operations:
      - "POST /nurseries/{id}/products"
      - "POST /products/{id}/inventory-lots"
      - "POST /inventory-lots/{id}/release"
      - "POST /inventory-lots/{id}/quarantine"
      - "POST /inventory-lots/{id}/care-log"
      - "POST /nurseries/{id}/vehicles"
      - "POST /orders/{id}/allocate"
      - "POST /orders/{id}/fulfill"
      - "POST /special-orders/{id}/approve"
      - "POST /special-orders/{id}/receive"
      - "POST /orders/{id}/deliveries"
      - "POST /deliveries/{id}/dispatch"
      - "POST /deliveries/{id}/complete"
    shared_operations:
      - "GET (most read endpoints)"
      - "POST /special-orders/{id}/cancel"
      - "POST /deliveries/{id}/cancel"

  - name: SalesClerk
    description: "Owns the customer-facing surface: accounts, orders, lines, promotions, payments, special-order requests, warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /nurseries/{id}/accounts"
      - "POST /accounts/{id}/orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/charge-account"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /nurseries/{id}/promotions"
      - "POST /promotions/{id}/activate"
      - "POST /accounts/{id}/special-orders"
      - "POST /order-lines/{id}/warranty-claims"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/deny"
    shared_operations:
      - "GET (most read endpoints)"
      - "POST /special-orders/{id}/cancel"
      - "POST /deliveries/{id}/cancel"
