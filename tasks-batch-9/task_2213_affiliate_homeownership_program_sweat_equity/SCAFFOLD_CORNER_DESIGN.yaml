  # ===========================================================================
  # SECTION 6 — From Table 6 (Errors)
  # The catalog-wide triggerability audit: one probe per HTTP class, all on the
  # same fixture, checking that the error envelope is identical in shape
  # whatever the class.
  # ===========================================================================
  - section: errors
    instances:

      - name: every_http_class_in_the_catalog_is_reachable_with_one_error_envelope
        claim_type: error_triggerable
        grounds: [errors.ERR_MISSING_AUTH_HEADERS, errors.ERR_ROLE_NOT_PERMITTED, errors.ERR_HOUSEHOLD_NOT_FOUND, errors.ERR_TRANSITION_NOT_ALLOWED, errors.ERR_STALE_SHIFT_VERSION, errors.ERR_VALIDATION, "validations[priority=1]", "validations[priority=3]", "validations[priority=5]", "validations[priority=8]", "validations[priority=9]", "validations[priority=10]"]
        distinguishing_aspect: "Six refusals spanning every HTTP class the catalog uses — 401, 403, 404, 409, 412 and 422 — asserted to share one envelope: response_type error and a data object holding exactly error_id and message, with no leakage of stack traces, field maps or partial entity bodies at any class."
        setup_note: "Three catalogued ids are unreachable by construction and are therefore claimed nowhere in either design file: ERR_EDUCATION_NOT_COMPLETE, ERR_EDUCATION_EXPIRED and ERR_SWEAT_EQUITY_INCOMPLETE all sit on priority 34 and 37 whose only endpoint is POST /mortgage-applications/{id}/close, which requires status CLEARED_TO_CLOSE — a status the APPROVED -> CLEARED_TO_CLOSE guard withholds from exactly the households those three errors describe, so priority 10's ERR_TRANSITION_NOT_ALLOWED always pre-empts them."
        test_recipe:
          setup:
            - "Canonical program with one READY_TO_BUILD site, one adult volunteer on a waiver to 2027-12-31, and an OPEN two-seat shift on 2026-08-05T08:00 to 12:00. One DRAFT household exists. No assignment has been created yet, so the shift version read at open is still current."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_1: $.data.id } }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Omar Vance", birth_date: "1991-02-02T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_2: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 2 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { sv_stale: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv_stale}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_1}" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Doss", household_size: 2, current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
          trigger:
            - { call: "GET /homeownership/programs/${prog_id}", as: null, as_user_id: null, captures: { e401: $.data.error_id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Interloper", household_size: 1, current_bedroom_count: 1, habitability_deficiency_count: 0, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 0, credit_score: 700, on_time_housing_payment_months: 12 }, as: Volunteer, as_user_id: "${vol_2}", captures: { e403: $.data.error_id } }
            - { call: "GET /homeownership/households/00000000-0000-4000-8000-000000000404", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e404: $.data.error_id } }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Referral straight out of DRAFT" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e409: $.data.error_id } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv_stale}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_2}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { e412: $.data.error_id } }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}", limit: 500 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e422: $.data.error_id } }
          assert:
            - "No headers at all: HTTP 401 and ${e401} == ERR_MISSING_AUTH_HEADERS — priority 1 runs before every other check, including the 404 the path would otherwise raise"
            - "Volunteer creating a household: HTTP 403 and ${e403} == ERR_ROLE_NOT_PERMITTED"
            - "Unknown household id: HTTP 404 and ${e404} == ERR_HOUSEHOLD_NOT_FOUND"
            - "Referral from DRAFT: HTTP 409 and ${e409} == ERR_TRANSITION_NOT_ALLOWED"
            - "Reusing the pre-seat shift version: HTTP 412 and ${e412} == ERR_STALE_SHIFT_VERSION"
            - "limit 500: HTTP 422 and ${e422} == ERR_VALIDATION — the declared range is 1..100"
            - "All six responses carry response_type == error, a meta block with api_request_id and api_request_timestamp, and a data object whose only keys are error_id and message"

  # ===========================================================================
  # SECTION 7 — From Table 7 (RBAC)
  # Role denial across the four staff roles, the three-layer auth ladder
  # (priority 1 -> 2 -> 3), and the entity_backed identity / ownership gates
  # that only Applicant and Volunteer carry. The segregation-of-duties row of
  # the role_model table is already carried by a difficulty instance.
  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_are_refused_to_every_other_role_while_shared_ones_are_not
        claim_type: role_denial_matrix
        grounds: ["validations[priority=3]", errors.ERR_ROLE_NOT_PERMITTED, rbac.ProgramAdmin, rbac.FamilyServicesCoordinator, rbac.ConstructionManager, rbac.MortgageOfficer, rbac.SelectionCommitteeMember, rbac.Volunteer, "endpoints.POST /homeownership/cost-entries", "endpoints.POST /homeownership/volunteers"]
        distinguishing_aspect: "Six cross-role writes, one per exclusive operation of each staff role, all refused with the same 403 id; then the two genuinely shared operations succeed for BOTH of their declared roles against the same site, showing the gate keys off the endpoint's declared roles[] and not off a coarse staff-versus-partner split."
        setup_note: "The shared-operation half is demonstrated on POST /volunteers and POST /cost-entries rather than on POST /build-sites/{id}/readiness-advance: the readiness endpoint declares roles [ProgramAdmin, ConstructionManager] while the three readiness transitions in the state machine name actor ProgramAdmin only, so a ConstructionManager readiness advance is ambiguous. The two endpoints used here carry no state machine and therefore no competing actor clause."
        test_recipe:
          setup:
            - "Canonical ACTIVE program, one freshly acquired RAW_LAND build site, one adult volunteer on a waiver to 2027-12-31, and one DRAFT household to address in the denied calls."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_1: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Doss", household_size: 2, current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Intake By Crew", household_size: 2, current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: ConstructionManager, as_user_id: "cm-1", captures: { d_intake: $.data.error_id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-2002", street_address: "14 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { d_site: $.data.error_id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 2 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { d_shift: $.data.error_id } }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { d_review: $.data.error_id } }
            - { call: "POST /homeownership/education-enrollments", payload: { household_id: "${hh_id}", curriculum_code: "HOMEBUYER_CORE", required_module_count: 2 }, as: SelectionCommitteeMember, as_user_id: "committee-alice", captures: { d_enroll: $.data.error_id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: false, amount_cents: 50000, fair_market_value_cents: 0 }, as: Volunteer, as_user_id: "${vol_1}", captures: { d_cost: $.data.error_id } }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Omar Vance", birth_date: "1991-02-02T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: false, amount_cents: 50000, fair_market_value_cents: 0 }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "PERMITS", is_in_kind: false, amount_cents: 30000, fair_market_value_cents: 0 }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/cost-entries", payload: { build_site_id: "${site_id}" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "All six cross-role writes return HTTP 403 with ${d_intake} == ${d_site} == ${d_shift} == ${d_review} == ${d_enroll} == ${d_cost} == ERR_ROLE_NOT_PERMITTED"
            - "None of the six left a row behind: no household named Intake By Crew, no parcel P-2002, no shift on ${site_id}, no SelectionReview on ${hh_id} and no enrollment on ${hh_id}"
            - "volunteers create by ProgramAdmin: HTTP 201, the same endpoint ConstructionManager used in setup — one shared operation, two accepted roles"
            - "cost-entries create by ConstructionManager and then by ProgramAdmin: HTTP 201 each, statuses RECORDED, amounts 50000 and 30000"
            - "Cost entry list for the site: total_count == 2 — exactly the two accepted writes, and nothing from the refused Volunteer attempt"

      - name: auth_ladder_checks_headers_then_role_name_then_permission_before_the_body
        claim_type: auth_layer_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]", "validations[priority=8]", errors.ERR_MISSING_AUTH_HEADERS, errors.ERR_UNKNOWN_ROLE, errors.ERR_ROLE_NOT_PERMITTED, errors.ERR_VALIDATION, rbac.FamilyServicesCoordinator]
        distinguishing_aspect: "The same deliberately malformed intake body is replayed under four identities: absent headers, a role name outside the declared seven, a real-but-unpermitted role, and finally the permitted coordinator. The first three each return their own layer's error and never the body error, pinning the order 1 -> 2 -> 3 -> 8; only the fourth call reaches priority 8 and reports ERR_VALIDATION for the missing household_size."
        test_recipe:
          setup:
            - "Canonical program only. Every probe posts the same intake body, which omits the required household_size, so the body is invalid under priority 8 in all four attempts."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Layered", current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: null, as_user_id: null, captures: { l1: $.data.error_id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Layered", current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: "Auditor", as_user_id: "fsc-1", captures: { l2: $.data.error_id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Layered", current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { l3: $.data.error_id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Layered", current_bedroom_count: 1, habitability_deficiency_count: 1, self_reported_annual_income_cents: 3000000, self_reported_housing_cost_cents: 100000, monthly_debt_payment_cents: 20000, credit_score: 620, on_time_housing_payment_months: 12 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { l4: $.data.error_id } }
            - { call: "GET /homeownership/households", payload: { program_id: "${prog_id}" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "Both X-User-Role and X-User-ID absent: HTTP 401 and ${l1} == ERR_MISSING_AUTH_HEADERS, not ERR_UNKNOWN_ROLE and not ERR_VALIDATION"
            - "X-User-Role Auditor with a present X-User-ID: HTTP 401 and ${l2} == ERR_UNKNOWN_ROLE — priority 2 beats the body check"
            - "MortgageOfficer, a declared role that this endpoint does not list: HTTP 403 and ${l3} == ERR_ROLE_NOT_PERMITTED — priority 3 still beats the body check"
            - "FamilyServicesCoordinator, the permitted role: HTTP 422 and ${l4} == ERR_VALIDATION, the first response that reflects the missing household_size"
            - "Household list for the program: total_count == 0 — none of the four attempts created anything"

      - name: entity_backed_identity_must_resolve_and_may_only_address_its_own_seat
        claim_type: identity_and_ownership
        grounds: ["validations[priority=4]", "validations[priority=7]", errors.ERR_IDENTITY_NOT_FOUND, errors.ERR_NOT_RESOURCE_OWNER, rbac.Volunteer, "endpoints.POST /homeownership/shift-assignments", "endpoints.POST /homeownership/shift-assignments/{id}/cancel"]
        distinguishing_aspect: "Only Applicant and Volunteer carry an entity_backed identity, so only they can fail priority 4 and priority 7. An X-User-ID that matches no VolunteerProfile is refused before any foreign key is read; a real volunteer naming another volunteer's id is refused by ownership even though every foreign key resolves; and the same two calls succeed the moment the acting id and the addressed id coincide."
        test_recipe:
          setup:
            - "Canonical program, a READY_TO_BUILD site, two adult volunteers on waivers to 2027-12-31, and an OPEN shift on 2026-08-05T08:00 to 12:00 with two general seats and no assignments yet."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
