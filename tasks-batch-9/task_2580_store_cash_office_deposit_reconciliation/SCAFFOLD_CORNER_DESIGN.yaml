              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err: $.data.error_id }
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_id}", card_network: "AMEX", gross_card_sales_cents: 100000, txn_count: 10, monthly_volume_cents: 1000000, funded_amount_cents: 97030 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
          assert:
            - "the second VISA_MC call returns HTTP 409 with data.error_id == \"ERR_SETTLEMENT_ALREADY_POSTED\""
            - "CardSettlement.${settlement_id}.gross_card_sales_cents == 50000 and expected_fee_cents == 1490 — untouched by the rejected advice"
            - "the AMEX call returns HTTP 201 with expected_fee_cents == 2970 (round_half_up(100000 * 0.0285) == 2850, plus 120) and settlement_status == \"MATCHED\""
            - "SalesJournal.${journal_id}.settlement_count == 2 and settlement_variance_total_cents == 0"

      - name: pickup_capacity_exceeded_by_two_disjoint_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_PICKUP_CAPACITY_EXCEEDED]
          - entities.Store.fields.max_daily_pickups
        distinguishing_aspect: >
          Capacity is an aggregate limit independent of window collision: at a store capped at one
          pickup a day, a 14:00-14:30 window whose buffered span 13:30-15:00 is disjoint from the
          already-scheduled 08:30-10:00 span is still refused, with 422 ERR_PICKUP_CAPACITY_EXCEEDED and
          not 409 ERR_PICKUP_WINDOW_CONFLICT.
