    - name: the_mvr_failure_cascade_reaches_four_entities_in_one_call
      claim_type: cascading_side_effects
      grounds: [state_machines.Driver.QUALIFIED_to_DISQUALIFIED, state_machines.Dispatch.EN_ROUTE_to_RECALLED, entities.Store.fields.unassigned_order_count]
      excluded_because: {difficulty_instance: transitive_cascade / mvr_failure_four_hop_cascade_recalls_route_and_restores_backlog, rationale: 'That §1.8 instance files a FAILED MVR check on a driver mid-route and asserts the whole chain end-to-end — driver DISQUALIFIED with reason MVR_FAILED, dispatch RECALLED with reason DRIVER_DISQUALIFIED, the undelivered stop RELEASED while its DELIVERED sibling is untouched, that order back to READY, the provisional line VOIDED and Store.unassigned_order_count restored to 1 — which is every claim this layer has.'}
    - name: the_two_reimbursement_variants_price_the_same_route_differently
      claim_type: dual_variant_calculation
      grounds: [calculations.dispatch_reimbursement, entities.Dispatch.fields.estimated_reimbursement_cents, entities.Dispatch.fields.reimbursement_variance_cents]
      excluded_because: {difficulty_instance: dual_variant_calc / reimbursement_estimated_vs_actual_diverge_on_three_stop_route, rationale: 'That §1.8 instance prices one three-stop route on both bases, asserts the PROVISIONAL lines go SUPERSEDED at settle, and pins the +33 variance and the 1203 accrual — variant divergence, variant selection and reconciliation in a single recipe.'}
    - name: the_cash_threshold_fires_at_the_limit_and_not_one_cent_below
      claim_type: rate_threshold_triggers
      grounds: [validations.priority_38, errors.ERR_CASH_LIMIT_REACHED, calculations.driver_cash_position]
      excluded_because: {difficulty_instance: boundary_precision_check / cash_limit_blocks_depart_at_exactly_the_limit_but_not_one_cent_below, rationale: That §1.8 instance pins the instantaneous threshold at both sides of the boundary; the reset half of this layer is covered here by a_safe_drop_resets_the_cash_posture_and_unblocks_the_next_departure.}

  - section: consistency_model
    instances:
    - name: the_order_creation_response_already_carries_every_priced_field
      claim_type: immediate
      grounds: [calculations.customer_delivery_charge, entities.Order.fields.fee_tier, entities.Order.fields.total_charge_cents, entities.Order.fields.promise_minutes_snapshot]
      distinguishing_aspect: 'The declared consistency model is immediate, so no read-after-write is needed to see derived data: the 201 body of the order creation already carries the tier, the surcharged base, the waiver percentage, the charged fee and the ticket total, and a subsequent GET returns byte-identical values.'
      test_recipe:
        setup: ['A store with the default 399 delivery fee and 30-minute promise, an ACTIVE zone version and one IN_ZONE address 3.00 grid miles away whose drive-time estimate is 15 minutes.']
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T12:00:00Z'}
          as: StoreManager
          as_user_id: boot
        - call: POST /store-ops/stores
          payload: {store_number: '7421', name: Riverside, latitude_micro: 39000000, longitude_micro: -84000000}
          as: StoreManager
          as_user_id: boot
          captures: {store_id: $.data.id, store_v1: $.data.version}
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-07-01T00:00:00Z'
            effective_to: '2026-09-01T00:00:00Z'
            expected_store_version: ${store_v1}
            max_drive_time_minutes: 40
            base_drive_minutes: 6
            minutes_per_mile: 3
            peak_surcharge_minutes: 7
            barrier_surcharge_minutes: 4
          as: StoreManager
          as_user_id: ${store_id}
          captures: {zv1_id: $.data.id}
        - call: POST /store-ops/zone-versions/${zv1_id}/activate
          payload: {}
          as: StoreManager
          as_user_id: ${store_id}
        - call: POST /store-ops/service-addresses
          payload: {store_id: '${store_id}', line1: 12 Oak St, latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false}
          as: Dispatcher
          as_user_id: disp-1
          captures: {addr_a_id: $.data.id}
        trigger:
        - call: POST /store-ops/orders
          payload: {store_id: '${store_id}', service_address_id: '${addr_a_id}', customer_name: Ann, customer_phone: 555-0101, food_subtotal_cents: 2200, payment_method: CARD, tip_cents: 500}
          as: Dispatcher
          as_user_id: disp-1
          captures: {o_id: $.data.id, tier: $.data.fee_tier, base: $.data.base_delivery_fee_cents, pct: $.data.fee_waiver_pct, fee: $.data.delivery_fee_cents, total: $.data.total_charge_cents, promise: $.data.promise_minutes_snapshot, placed: $.data.placed_at}
        - call: GET /store-ops/orders/${o_id}
          payload: {}
          as: CustomerCareAgent
          as_user_id: cca-1
          captures: {tier2: $.data.fee_tier, fee2: $.data.delivery_fee_cents, total2: $.data.total_charge_cents, gross2: $.data.order_to_door_gross_minutes}
        assert: ['${tier} == ''BASE'', the 15-minute estimate being at the inclusive 15-minute tier boundary', '${base} == 399 (399 + 0 BASE surcharge) and ${pct} == 50, food 2200 clearing the 2000 half-waiver threshold', '${fee} == 200, i.e. round_half_up(399 * 50 / 100) == round_half_up(199.5)', '${total} == 2900 == 2200 + 200 + 500 and ${promise} == 30', '${placed} == ''2026-08-05T12:00:00Z'', stamped from the logical clock', '${tier2} == ${tier}, ${fee2} == 200 and ${total2} == 2900 — the read adds nothing', '${gross2} == null: fields that genuinely depend on a later event stay null rather than being guessed']
    - name: the_lock_response_already_carries_the_whole_route_projection
      claim_type: immediate
      grounds: [calculations.route_duration_model, calculations.dispatch_reimbursement, entities.Dispatch.fields.route_minutes, entities.Dispatch.fields.expected_return_at, entities.Dispatch.fields.resolved_cost_model_id]
      distinguishing_aspect: 'Locking is where the projection is computed AND published: the 200 body already contains route_minutes 24, the expected return 12:29:00Z, the resolved cost-model id and the 336-cent estimate, so a client never has to re-read the dispatch to learn what it just committed to.'
      test_recipe:
        setup: ['A store with an ACTIVE zone version, one IN_ZONE address 3.00 grid miles away, one ACTIVE CAR cost model (150 per delivery, tier-1 62 cents per mile to 5.00 miles, 100-cent floor) and one QUALIFIED insured CAR driver.', 'One READY, fee-disclosed order stacked as the single stop of a DRAFT dispatch planned to depart at 12:05:00Z.']
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T12:00:00Z'}
          as: StoreManager
          as_user_id: boot
        - call: POST /store-ops/stores
          payload: {store_number: '7421', name: Riverside, latitude_micro: 39000000, longitude_micro: -84000000}
          as: StoreManager
          as_user_id: boot
          captures: {store_id: $.data.id, store_v1: $.data.version}
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-07-01T00:00:00Z'
            effective_to: '2026-09-01T00:00:00Z'
            expected_store_version: ${store_v1}
            max_drive_time_minutes: 40
            base_drive_minutes: 6
            minutes_per_mile: 3
            peak_surcharge_minutes: 7
            barrier_surcharge_minutes: 4
          as: StoreManager
          as_user_id: ${store_id}
          captures: {zv1_id: $.data.id}
        - call: POST /store-ops/zone-versions/${zv1_id}/activate
          payload: {}
          as: StoreManager
          as_user_id: ${store_id}
        - call: POST /store-ops/service-addresses
          payload: {store_id: '${store_id}', line1: 12 Oak St, latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false}
          as: Dispatcher
          as_user_id: disp-1
          captures: {addr_a_id: $.data.id}
        - call: POST /store-ops/vehicle-cost-models
          payload: {store_id: '${store_id}', vehicle_class: CAR, per_delivery_cents: 150, tier1_cap_miles: 5.0, tier1_per_mile_cents: 62, tier2_per_mile_cents: 41, min_reimbursement_per_stop_cents: 100, effective_from: '2026-07-01T00:00:00Z'}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {cm_car_id: $.data.id}
        - call: POST /store-ops/drivers
          payload: {store_id: '${store_id}', full_name: Dana Ortiz, license_number: DL-1001, vehicle_class: CAR}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {drv_id: $.data.id}
        - call: POST /store-ops/drivers/${drv_id}/mvr-checks
          payload: {result: CLEAR, violation_points: 0, checked_on: '2026-08-01T00:00:00Z'}
          as: ComplianceOfficer
          as_user_id: co-1
        - call: GET /store-ops/drivers/${drv_id}
          payload: {}
          as: ComplianceOfficer
          as_user_id: co-1
          captures: {drv_v2: $.data.version}
        - call: POST /store-ops/drivers/${drv_id}/insurance-verifications
          payload: {policy_number: POL-9001, coverage_from: '2026-07-01T00:00:00Z', coverage_to: '2026-12-01T00:00:00Z', liability_limit_cents: 10000000, expected_driver_version: '${drv_v2}'}
          as: ComplianceOfficer
          as_user_id: co-1
        - call: POST /store-ops/drivers/${drv_id}/qualification-decisions
          payload: {decision: QUALIFY}
          as: ComplianceOfficer
          as_user_id: co-2
        - call: POST /store-ops/orders
          payload: {store_id: '${store_id}', service_address_id: '${addr_a_id}', customer_name: Ann, customer_phone: 555-0101, food_subtotal_cents: 2200, payment_method: CARD, tip_cents: 500}
          as: Dispatcher
          as_user_id: disp-1
          captures: {ord_id: $.data.id}
        - call: POST /store-ops/orders/${ord_id}/zone-decision
          payload: {action: CLEAR}
          as: Dispatcher
          as_user_id: disp-1
        - call: POST /store-ops/orders/${ord_id}/disclose-fee
          payload: {disclosed_fee_cents: 200, disclosed_tip_cents: 500, driver_tip_notice_given: true}
          as: CustomerCareAgent
          as_user_id: cca-1
        - call: POST /store-ops/orders/${ord_id}/production
          payload: {action: START}
          as: Dispatcher
          as_user_id: disp-1
        - call: POST /store-ops/orders/${ord_id}/production
          payload: {action: READY}
          as: Dispatcher
          as_user_id: disp-1
        - call: POST /store-ops/dispatches
          payload: {driver_id: '${drv_id}', planned_depart_at: '2026-08-05T12:05:00Z'}
          as: Dispatcher
          as_user_id: disp-1
          captures: {dsp_id: $.data.id}
        - call: POST /store-ops/dispatches/${dsp_id}/stops
          payload: {order_id: '${ord_id}', hot_bag_slots: 1}
          as: Dispatcher
          as_user_id: disp-1
          captures: {stop_id: $.data.id}
        trigger:
        - call: POST /store-ops/dispatches/${dsp_id}/lock
          payload: {}
          as: Dispatcher
          as_user_id: disp-1
          captures: {rm: $.data.route_minutes, eta: $.data.expected_return_at, cmid: $.data.resolved_cost_model_id, est: $.data.estimated_reimbursement_cents, st: $.data.status, act: $.data.actual_reimbursement_cents}
        - call: GET /store-ops/dispatches/${dsp_id}
          payload: {}
          as: Dispatcher
          as_user_id: disp-1
          captures: {rm2: $.data.route_minutes, eta2: $.data.expected_return_at, est2: $.data.estimated_reimbursement_cents}
        assert: ['${st} == ''LOCKED'' and ${rm} == 24 == ceil(3.00 * 3) + 6 * 1 + ceil(3.00 * 3)', '${eta} == ''2026-08-05T12:29:00Z'' == planned_depart_at 12:05 plus 24 minutes', '${cmid} == ${cm_car_id}, resolved once at lock rather than at each door', '${est} == 336 == 150 + round_half_up(3.00 * 62), above the 100-cent floor', '${act} == null, the actual basis existing only after settle', '${rm2} == 24, ${eta2} == ''2026-08-05T12:29:00Z'' and ${est2} == 336 — the read is a mirror', 'GET /store-ops/reimbursement-lines?dispatch_id=${dsp_id} reports total_count 0 at lock time: the estimate lives on the dispatch until the first door arrival writes a PROVISIONAL_STOP line']
