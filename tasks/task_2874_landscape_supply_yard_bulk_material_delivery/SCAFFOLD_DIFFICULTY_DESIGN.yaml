            - "InventoryLot.${lot_id}.net_sellable_cubic_yards == 85.50"
            - "DeliveryLoad.${load1_id}.planned_payload_lb == 10500 (exactly equal to max_payload_lb, accepted)"
            - "DeliveryLoad.${load1_id}.max_allowed_cubic_yards == 10.00 (FLOOR_2DP(10500 / 1050.00) binds below bed 15.0 and CLASS_A cap 999.0)"
            - "the trigger returns 422 with error_id ERR_AXLE_WEIGHT_LIMIT_EXCEEDED because ROUND_HALF_UP(10.01 * 1050.00) == 10511 > 10500"
            - "no second DeliveryLoad row is created; the 2026-08-04 window stays free"

      - name: container_deposit_refund_at_exact_grace_day_versus_one_second_later
        grounds:
          - calculations.container_deposit_refund
          - state_machines.ContainerReturn.OUTSTANDING_to_PARTIALLY_RETURNED
          - state_machines.ContainerReturn.PARTIALLY_RETURNED_to_CLOSED
          - entities.ContractorAccount.fields.pallet_deposit_balance_cents
        distinguishing_aspect: |
          The decay curve is probed one second either side of the grace boundary within a single
          scenario: a pallet received at exactly issued_at + 30 days refunds the full 2500 cents
          (weeks_late 0), while the second pallet received one second later refunds
          ROUND_HALF_UP(2500 * 0.75) = 1875 because CEIL(1 second / 604800) is a whole week. An
          implementation using FLOOR or a >= grace comparison gets exactly one of the two halves
          right.
