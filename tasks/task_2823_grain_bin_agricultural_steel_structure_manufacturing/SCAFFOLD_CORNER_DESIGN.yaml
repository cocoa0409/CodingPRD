            - "completing with consumed_kg 6410.4 plus scrap_kg 300.0 returns HTTP 422 with error_id ERR_RUN_MASS_EXCEEDS_RESERVED because 6710.4 > 6600.0"
            - "after that rejection the run is still SCHEDULED with consumed_kg 0 and scrap_kg 0, and the lot still reports reserved_kg 6600.0"
            - "completing with consumed_kg 6410.4 plus scrap_kg 189.6 - summing to exactly 6600.0 - returns HTTP 200 with status COMPLETED"
            - "the lot then reports reserved_kg 0, consumed_kg 6410.4, scrap_kg 189.6, remaining_kg 13400.0 == 20000.0 - 0 - 6410.4 - 189.6, and status AVAILABLE"
            - "the order moved production_status QUEUED -> KITTED on the completion while financial_status remained AWAITING_DEPOSIT"

      - name: deposit_must_equal_the_required_amount_exactly_and_cannot_be_paid_twice
