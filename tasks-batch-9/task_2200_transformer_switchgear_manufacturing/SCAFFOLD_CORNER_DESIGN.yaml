          assert:
            - "HTTP 201 with data.status == \"HELD\" and data.stage_index == 1."
            - "data.stage_billing_cents == 4000000."
            - "data.is_final_stage == true, data.storage_fee_accrued_cents == 0, data.cleared_at is null."
            - "GET /engineered-orders/${order_id}/financial-summary as ContractAdmin shows net_contract_value_cents == 4000000 and billed_to_date_cents == 0."

      - name: new_supplier_starts_at_index_one_hundred_and_receipt_event_increments_denominator
        claim_type: constants_applied
        grounds:
          - calculations.supplier_quality_index
          - endpoints[create_supplier_receipt_event]
          - entities.Supplier.fields.quality_index_trailing
        distinguishing_aspect: "With zero published failure reports both index variants sit at their initialised value 100 and the supplier stays APPROVED; a receipt event moves only receipt_event_count, never attributed_failure_count nor the status - the PROBATION flip needs an index strictly below 70.00."
        test_recipe:
          setup:
            - "One APPROVED Supplier with no long-lead components and no attributed failure reports."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /suppliers
              payload: { supplier_code: "SUP-CA5-01", legal_name: "Copperline Windings AG", region: "APAC" }
