      - name: weight_zero_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_WEIGHT_INVALID]"]
        distinguishing_aspect: "new_weight 0 fails the > 0 constraint with ERR_WEIGHT_INVALID (422)."
        test_recipe:
          setup: ["director d; scout s exists"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA" }
