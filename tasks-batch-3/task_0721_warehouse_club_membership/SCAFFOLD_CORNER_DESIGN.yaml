# =============================================================================
# task_0721_warehouse_club_membership — SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# Enumerative breadth coverage of §1.1–§1.7 claims NOT already covered by the
# nine Difficulty Rules in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Default clock at startup: 2026-03-01T00:00:00Z
# excluded_because.difficulty_instance values cite §1.8 instance names verbatim.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:
      # --- Creation happy paths ---
      - name: create_plan_basic_returns_201_with_fields
        claim_type: Creation
        grounds:
          - 'entities.MembershipPlan'
          - 'endpoints."POST /plans"'
        distinguishing_aspect: "POST /plans with tier=BASIC and required fields returns 201 and a MembershipPlan whose tier==BASIC and reward_rate_bps defaults to 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response code == 201"
            - "MembershipPlan.${plan_id}.tier == BASIC"
            - "MembershipPlan.${plan_id}.annual_fee_cents == 6000"
            - "MembershipPlan.${plan_id}.reward_rate_bps == 0"

      - name: create_membership_starts_pending_payment
        claim_type: Creation
        grounds:
          - 'entities.Membership'
          - 'endpoints."POST /memberships"'
          - 'entities.Membership.fields.status'
        distinguishing_aspect: "POST /memberships (Anonymous) returns 201 and a Membership whose status==PENDING_PAYMENT and version==1."
        test_recipe:
          setup:
            - "A BASIC plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "New Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "response code == 201"
            - "Membership.${m_id}.status == PENDING_PAYMENT"
            - "Membership.${m_id}.version == 1"

      - name: create_product_returns_201
        claim_type: Creation
        grounds:
          - 'entities.Product'
          - 'endpoints."POST /products"'
        distinguishing_aspect: "POST /products with sku, list_price_cents, member_price_cents returns 201 with member_only defaulting to false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-CREATE", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
          assert:
            - "response code == 201"
            - "Product.${prod_id}.member_only == false"
            - "Product.${prod_id}.per_member_limit == 0"

      - name: create_instant_saving_returns_201
        claim_type: Creation
        grounds:
          - 'entities.InstantSaving'
          - 'endpoints."POST /instant-savings"'
        distinguishing_aspect: "POST /instant-savings with valid window returns 201 with max_units defaulting to 0."
        test_recipe:
          setup:
            - "A product exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-IS", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { is_id: $.data.id }
          assert:
            - "response code == 201"
            - "InstantSaving.${is_id}.max_units == 0"

      # --- Retrieval ---
      - name: get_membership_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - 'entities.Membership'
          - 'endpoints."GET /memberships/{membershipId}"'
        distinguishing_aspect: "GET /memberships/{id} returns the matching Membership with computed fields present."
        test_recipe:
          setup:
            - "A PENDING_PAYMENT membership exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Get Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.primary_member_name == Get Mem"
            - "Membership.${m_id}.reward_accrued_cents == 0"

      - name: get_product_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - 'entities.Product'
          - 'endpoints."GET /products/{productId}"'
        distinguishing_aspect: "GET /products/{id} returns the matching Product with stored prices."
        test_recipe:
          setup:
            - "A product exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-GET", list_price_cents: 12000, member_price_cents: 9000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /products/${prod_id}"
              payload: {}
              as: RegisterClerk
          assert:
            - "Product.${prod_id}.member_price_cents == 9000"
            - "Product.${prod_id}.list_price_cents == 12000"

      # --- Listing / pagination ---
      - name: list_plans_paginated_envelope
        claim_type: Listing
        grounds:
          - 'entities.MembershipPlan'
          - 'endpoints."GET /plans"'
        distinguishing_aspect: "GET /plans returns an array response with pagination fields total_count and has_more."
        test_recipe:
          setup:
            - "Two plans exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
          trigger:
            - call: "GET /plans"
              payload: { limit: 10, offset: 0 }
              as: ClubAdmin
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == false"

      - name: list_products_filter_by_department
        claim_type: Listing
        grounds:
          - 'entities.Product'
          - 'endpoints."GET /products"'
          - 'entities.Product.fields.department'
        distinguishing_aspect: "GET /products?department=PHARMACY returns only PHARMACY products."
        test_recipe:
          setup:
            - "One GENERAL and one PHARMACY product exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-GEN", list_price_cents: 10000, member_price_cents: 8000, department: "GENERAL" }
              as: ClubAdmin
            - call: "POST /products"
              payload: { sku: "P-PHARM", list_price_cents: 5000, member_price_cents: 4000, department: "PHARMACY" }
              as: ClubAdmin
              captures: { pharm_id: $.data.id }
          trigger:
            - call: "GET /products"
              payload: { department: "PHARMACY" }
              as: RegisterClerk
          assert:
            - "total_count == 1"
            - "result data[0].id == ${pharm_id}"

      # --- Not found ---
      - name: get_membership_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_MEMBERSHIP_NOT_FOUND]'
          - 'endpoints."GET /memberships/{membershipId}"'
          - 'validations[priority=3]'
        distinguishing_aspect: "GET /memberships/{nonexistent} returns ERR_MEMBERSHIP_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No membership with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /memberships/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_MEMBERSHIP_NOT_FOUND"

      - name: get_product_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_PRODUCT_NOT_FOUND]'
          - 'endpoints."GET /products/{productId}"'
          - 'validations[priority=3]'
        distinguishing_aspect: "GET /products/{nonexistent} returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No product with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_PRODUCT_NOT_FOUND"

      - name: get_return_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_RETURN_NOT_FOUND]'
          - 'endpoints."GET /returns/{returnId}"'
          - 'validations[priority=3]'
        distinguishing_aspect: "GET /returns/{nonexistent} returns ERR_RETURN_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No return with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /returns/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ServiceDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_RETURN_NOT_FOUND"

      - name: get_card_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_CARD_NOT_FOUND]'
          - 'endpoints."GET /household-cards/{cardId}"'
          - 'validations[priority=3]'
        distinguishing_aspect: "GET /household-cards/{nonexistent} returns ERR_CARD_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No card with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /household-cards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_CARD_NOT_FOUND"

      - name: signup_plan_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_PLAN_NOT_FOUND]'
          - 'endpoints."POST /memberships"'
          - 'validations[priority=3]'
        distinguishing_aspect: "POST /memberships with a non-existent plan_id returns ERR_PLAN_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No plan with the supplied plan_id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /memberships"
              payload: { plan_id: "00000000-0000-0000-0000-000000000000", primary_member_name: "X" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_PLAN_NOT_FOUND"

      - name: open_transaction_membership_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_MEMBERSHIP_NOT_FOUND]'
          - 'endpoints."POST /transactions"'
          - 'validations[priority=3]'
        distinguishing_aspect: "POST /transactions with a non-existent membership_id returns ERR_MEMBERSHIP_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No membership with the supplied id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /transactions"
              payload: { membership_id: "00000000-0000-0000-0000-000000000000" }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_MEMBERSHIP_NOT_FOUND"

      # --- Required fields / type constraints ---
      - name: create_membership_missing_plan_id_invalid_request
        claim_type: Required Fields
        grounds:
          - 'validations[priority=4]'
          - 'errors[ERR_INVALID_REQUEST]'
          - 'endpoints."POST /memberships"'
        distinguishing_aspect: "POST /memberships omitting plan_id returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /memberships"
              payload: { primary_member_name: "No Plan" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_REQUEST"

      - name: add_line_qty_below_one_invalid_request
        claim_type: Type Constraints
        grounds:
          - 'validations[priority=4]'
          - 'errors[ERR_INVALID_REQUEST]'
          - 'entities.TransactionLine.fields.qty'
        distinguishing_aspect: "POST /transactions/{id}/lines with qty=0 violates qty>=1 and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with an OPEN transaction; a product exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-QTY", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Qty Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 0 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_REQUEST"

      - name: create_basic_plan_with_nonzero_reward_rate_invalid_request
        claim_type: Type Constraints
        grounds:
          - 'validations[priority=4]'
          - 'errors[ERR_INVALID_REQUEST]'
          - 'entities.MembershipPlan.fields.reward_rate_bps'
        distinguishing_aspect: "POST /plans tier=BASIC with reward_rate_bps>0 violates 'BASIC must be 0' and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, reward_rate_bps: 200, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_REQUEST"

      - name: invalid_card_kind_rejected
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_CARD_KIND_INVALID]'
          - 'endpoints."POST /household-cards"'
          - 'entities.HouseholdCard.fields.card_kind'
        distinguishing_aspect: "POST /household-cards with card_kind not in {INCLUDED, PAID_ADDON} returns ERR_CARD_KIND_INVALID (400)."
        test_recipe:
          setup:
            - "ACTIVE BASIC member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "CardKind Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Bad", card_kind: "GOLD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_CARD_KIND_INVALID"

      - name: product_member_price_above_list_invalid_price
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_INVALID_PRICE]'
          - 'endpoints."POST /products"'
          - 'entities.Product.fields.member_price_cents'
        distinguishing_aspect: "POST /products with member_price_cents > list_price_cents returns ERR_INVALID_PRICE (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-BADPRICE", list_price_cents: 5000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_PRICE"

      - name: instant_saving_inverted_window_invalid_promo_window
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_INVALID_PROMO_WINDOW]'
          - 'endpoints."POST /instant-savings"'
          - 'entities.InstantSaving.fields.window_end_utc'
        distinguishing_aspect: "POST /instant-savings with window_end_utc <= window_start_utc returns ERR_INVALID_PROMO_WINDOW (400)."
        test_recipe:
          setup:
            - "A product exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-WINBAD", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-06-01T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_PROMO_WINDOW"

      - name: duplicate_product_sku_rejected
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_PRODUCT_SKU_DUPLICATE]'
          - 'endpoints."POST /products"'
          - 'entities.Product.fields.sku'
        distinguishing_aspect: "POST /products with an already-used sku returns ERR_PRODUCT_SKU_DUPLICATE (409)."
        test_recipe:
          setup:
            - "A product with sku P-DUPE exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-DUPE", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "P-DUPE", list_price_cents: 11000, member_price_cents: 9000 }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_PRODUCT_SKU_DUPLICATE"

      - name: invalid_pagination_bounds_rejected
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_INVALID_PAGINATION]'
          - 'endpoints."GET /plans"'
          - 'response_envelope.pagination_defaults'
        distinguishing_aspect: "GET /plans?limit=1000 exceeds max=100 and returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /plans"
              payload: { limit: 1000, offset: 0 }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "err == ERR_INVALID_PAGINATION"

      # --- Defaults ---
      - name: signup_auto_renew_defaults_true
        claim_type: Defaults
        grounds:
          - 'entities.Membership.fields.auto_renew'
          - 'endpoints."POST /memberships"'
        distinguishing_aspect: "POST /memberships omitting auto_renew yields Membership.auto_renew == true (declared default)."
        test_recipe:
          setup:
            - "A BASIC plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Default AR" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Membership.${m_id}.auto_renew == true"

      - name: product_reward_eligible_defaults_true
        claim_type: Defaults
        grounds:
          - 'entities.Product.fields.reward_eligible'
          - 'endpoints."POST /products"'
        distinguishing_aspect: "POST /products omitting reward_eligible yields Product.reward_eligible == true (declared default)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-DEF-RE", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
          assert:
            - "Product.${prod_id}.reward_eligible == true"

      # --- Computed fields ---
      - name: line_unit_price_snapshot_member_when_active
        claim_type: Computed Fields
        grounds:
          - 'entities.TransactionLine.fields.unit_price_cents'
          - 'calculations.line_discounted_amount'
          - 'state_machines.Transaction.OPEN_to_OPEN'
        distinguishing_aspect: "An OPEN transaction line for an ACTIVE membership snapshots unit_price_cents == Product.member_price_cents (8000), not list_price_cents."
        test_recipe:
          setup:
            - "ACTIVE BASIC member; product member 8000, list 10000, no instant savings; OPEN transaction."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-SNAP", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Snap Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
          assert:
            - "TransactionLine.${line_id}.unit_price_cents == 8000"
            - "Transaction.${txn_id}.gross_cents == 16000"
            - "Transaction.${txn_id}.net_cents == 16000"

      - name: household_card_count_computed_after_add
        claim_type: Computed Fields
        grounds:
          - 'entities.Membership.fields.household_card_count'
          - 'calculations.addon_card_fee'
          - 'endpoints."POST /household-cards"'
        distinguishing_aspect: "After adding one ACTIVE INCLUDED card, Membership.household_card_count == 1."
        test_recipe:
          setup:
            - "ACTIVE BASIC member (max_household_cards 1), no cards yet."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Count Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
          assert:
            - "HouseholdCard.${card_id}.fee_charged_cents == 0"
            - "Membership.${m_id}.household_card_count == 1"

      - name: paid_addon_card_fee_charged
        claim_type: Computed Fields
        grounds:
          - 'entities.HouseholdCard.fields.fee_charged_cents'
          - 'calculations.addon_card_fee'
          - 'entities.FeeEvent.fields.kind'
        distinguishing_aspect: "A PAID_ADDON card sets fee_charged_cents == plan.addon_fee_cents (4000) and creates a FeeEvent kind=ADDON amount 4000."
        test_recipe:
          setup:
            - "ACTIVE BASIC member (addon_fee_cents 4000, max_household_cards 1) with the one INCLUDED card already used."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Addon Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Kid", card_kind: "PAID_ADDON" }
              as: Member
              as_user_id: "${m_id}"
              captures: { addon_id: $.data.id }
          assert:
            - "HouseholdCard.${addon_id}.fee_charged_cents == 4000"
            - "FeeEvent for ${m_id} with kind=ADDON has amount_cents == 4000"

      # --- System fields / immutability ---
      - name: membership_version_increments_on_renew
        claim_type: System Fields
        grounds:
          - 'entities.Membership.fields.version'
          - 'state_machines.Membership.ACTIVE_to_ACTIVE'
          - 'endpoints."POST /memberships/{membershipId}/renew"'
        distinguishing_aspect: "A successful renew increments Membership.version from 1 to 2 and rolls the term forward."
        test_recipe:
          setup:
            - "ACTIVE BASIC member (auto_renew false) at version 1."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Ver Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.version == 2"
            - "Membership.${m_id}.status == ACTIVE"

      - name: plan_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - 'entities.MembershipPlan'
          - 'complexity_profile.entity_topology'
        distinguishing_aspect: "MembershipPlan has common_fields:false — it exposes id and created_at but no version field and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "A plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: ClubAdmin
          assert:
            - "MembershipPlan.${plan_id} response has no 'version' field"
            - "MembershipPlan.${plan_id} has a created_at field"

      # --- FK integrity (flat topology) ---
      - name: instant_saving_invalid_product_fk_not_found
        claim_type: Not Found
        grounds:
          - 'entities.InstantSaving.fields.product_id'
          - 'errors[ERR_PRODUCT_NOT_FOUND]'
          - 'endpoints."POST /instant-savings"'
        distinguishing_aspect: "POST /instant-savings with a non-existent product_id returns ERR_PRODUCT_NOT_FOUND (404) — FK integrity on flat topology."
        test_recipe:
          setup:
            - "No product with the supplied id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /instant-savings"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "err == ERR_PRODUCT_NOT_FOUND"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      # --- Valid transitions / initial state ---
      - name: signup_payment_activates_membership
        claim_type: Valid Transition
        grounds:
          - 'state_machines.Membership.PENDING_PAYMENT_to_ACTIVE'
          - 'endpoints."POST /payments"'
          - 'entities.FeeEvent.fields.kind'
        distinguishing_aspect: "A SUCCEEDED SIGNUP payment moves a PENDING_PAYMENT membership to ACTIVE, sets term, and creates a FeeEvent kind=SIGNUP."
        test_recipe:
          setup:
            - "PENDING_PAYMENT BASIC membership; clock at 2026-03-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Act Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == ACTIVE"
            - "FeeEvent for ${m_id} with kind=SIGNUP has amount_cents == 6000"

      - name: transaction_starts_open
        claim_type: Initial State
        grounds:
          - 'state_machines.Transaction.initial_state'
          - 'endpoints."POST /transactions"'
          - 'entities.Transaction.fields.status'
        distinguishing_aspect: "A newly opened transaction starts in OPEN with zeroed totals."
        test_recipe:
          setup:
            - "ACTIVE BASIC member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Open Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.status == OPEN"
            - "Transaction.${txn_id}.gross_cents == 0"
            - "Transaction.${txn_id}.net_cents == 0"

      - name: void_open_transaction_no_ledger
        claim_type: Valid Transition
        grounds:
          - 'state_machines.Transaction.OPEN_to_VOIDED'
          - 'endpoints."POST /transactions/{transactionId}/void"'
        distinguishing_aspect: "Voiding an OPEN transaction moves it to VOIDED and creates no reward ledger entries."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with an OPEN transaction (one line)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-VOID", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Void Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_id}.status == VOIDED"
            - "reward-ledger entries for source_transaction_id=${txn_id} count == 0"

      - name: reject_pending_return_zero_refund
        claim_type: Valid Transition
        grounds:
          - 'state_machines.Return.PENDING_to_REJECTED'
          - 'endpoints."POST /returns/{returnId}/reject"'
        distinguishing_aspect: "Rejecting a PENDING return moves it to REJECTED with refund_cents==0 and no ledger entries."
        test_recipe:
          setup:
            - "ACTIVE BASIC member; FINALIZED txn (P qty 1); a PENDING receipted return exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-REJ", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Rej Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 1, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/reject"
              payload: {}
              as: ServiceDeskClerk
          assert:
            - "Return.${ret_id}.status == REJECTED"
            - "Return.${ret_id}.refund_cents == 0"

      - name: revoke_active_household_card
        claim_type: Valid Transition
        grounds:
          - 'state_machines.HouseholdCard.ACTIVE_to_REVOKED'
          - 'endpoints."POST /household-cards/{cardId}/revoke"'
          - 'entities.Membership.fields.household_card_count'
        distinguishing_aspect: "Explicitly revoking an ACTIVE card moves it to REVOKED and decrements Membership.household_card_count to 0."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with one ACTIVE INCLUDED card."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Rev Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /household-cards/${card_id}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "HouseholdCard.${card_id}.status == REVOKED"
            - "Membership.${m_id}.household_card_count == 0"

      - name: auto_renew_keeps_active_across_boundary
        claim_type: Valid Transition
        grounds:
          - 'state_machines.Membership.ACTIVE_to_ACTIVE'
          - 'entities.Membership.fields.auto_renew'
          - 'endpoints."POST /payments"'
        distinguishing_aspect: "With auto_renew=true and a SUCCEEDED RENEWAL payment for the new term, advancing the clock past term_end keeps the membership ACTIVE (not EXPIRED)."
        test_recipe:
          setup:
            - "BASIC member auto_renew true activated 2026-03-01; a SUCCEEDED RENEWAL payment recorded; clock advanced past term_end."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "AutoR Mem", auto_renew: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "RENEWAL", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { st: $.data.status }
          assert:
            - "st == ACTIVE"

      # --- Cascade: lapse (EXPIRED) revokes cards (separate trigger than §1.8 cancel cascade) ---
      - name: lapse_expired_cascade_revokes_cards
        claim_type: Cross-entity
        grounds:
          - 'state_machines.Membership.ACTIVE_to_EXPIRED'
          - 'state_machines.HouseholdCard.ACTIVE_to_REVOKED'
          - 'entities.Membership.fields.reward_accrued_cents'
        distinguishing_aspect: "A clock advance past term_end with auto_renew=false moves the membership to EXPIRED, zeroes reward_accrued_cents, and cascades all ACTIVE household cards to REVOKED."
        test_recipe:
          setup:
            - "BASIC member auto_renew false activated 2026-03-01 with one ACTIVE INCLUDED card; clock advanced past term_end."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Lapse Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { st: $.data.status }
            - call: "GET /household-cards/${card_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { cst: $.data.status }
          assert:
            - "st == EXPIRED"
            - "cst == REVOKED"
            - "Membership.${m_id}.reward_accrued_cents == 0"

      # --- Invalid transitions / state preconditions ---
      - name: renew_non_active_membership_rejected
        claim_type: Invalid Transitions
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_MEMBERSHIP_NOT_ACTIVE]'
          - 'endpoints."POST /memberships/{membershipId}/renew"'
        distinguishing_aspect: "Renewing a PENDING_PAYMENT membership returns ERR_MEMBERSHIP_NOT_ACTIVE (409)."
        test_recipe:
          setup:
            - "PENDING_PAYMENT membership at version 1 (never paid)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Pend Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_MEMBERSHIP_NOT_ACTIVE"

      - name: add_line_to_finalized_transaction_rejected
        claim_type: Invalid Transitions
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_TRANSACTION_NOT_OPEN]'
          - 'state_machines.Transaction.OPEN_to_FINALIZED'
        distinguishing_aspect: "Adding a line to a FINALIZED transaction returns ERR_TRANSACTION_NOT_OPEN (409)."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with a FINALIZED transaction (one line)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-FINLINE", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "FinLine Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_TRANSACTION_NOT_OPEN"

      - name: void_finalized_transaction_rejected
        claim_type: Invalid Transitions
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_TRANSACTION_NOT_OPEN]'
          - 'state_machines.Transaction.OPEN_to_VOIDED'
        distinguishing_aspect: "Voiding a FINALIZED transaction returns ERR_TRANSACTION_NOT_OPEN (409) — VOID is only valid from OPEN."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with a FINALIZED transaction (one line)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-FINVOID", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "FinVoid Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
