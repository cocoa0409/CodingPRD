scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: water_quota_provisional_vs_final_usage
        grounds:
          - calculations.quota_consumption_provisional_vs_final
          - entities.WaterQuota.fields.provisional_used_liters
          - entities.WaterQuota.fields.final_used_liters
          - state_machines.ControlCommand.PENDING_to_DISPATCHING
          - state_machines.ControlCommand.EXECUTING_to_EXECUTED
        distinguishing_aspect: |
          Operates on the WaterQuota domain: provisional variant counts in-flight ControlCommands
          at requested_volume_liters; final variant counts only EXECUTED at actual_volume_liters.
          Identical inputs (same plot, same period) produce different usage_state when requested != actual.
        test_recipe:
          setup:
            - "Plot p1 area=10ha, crop_type=CORN, crop_stage=VEGETATIVE, pump_id='pump_A'"
            - "WaterQuota q1: plot=p1, period=[T0, T0+30d), allocated_liters=10000, warning_threshold_pct=80, carry_forward=0, approval_extra=0"
            - "ValveGroup vg1: pump_id='pump_A', valve_ids=['v1'], control_mode=SEQUENTIAL"
            - "IrrigationPlan plan1: plot=p1, window inside the quota period, planned_volume_liters=7900, status=ACTIVE"
          trigger:
            - "POST /control-commands {plan_id: plan1, valve_group_id: vg1, requested_volume_liters: 7900}"
            - "GET /water-quotas/{q1.id}  # observe provisional view BEFORE feedback"
            - "POST /control-commands/{cc.id}/dispatch"
            - "POST /control-commands/{cc.id}/feedback {phase: STARTED}"
            - "POST /control-commands/{cc.id}/feedback {phase: COMPLETED, actual_volume_liters: 8200}"
            - "GET /water-quotas/{q1.id}  # observe final view AFTER feedback"
          assert:
            - "After PENDING command but before feedback: q1.provisional_used_liters == 7900 AND q1.final_used_liters == 0 AND q1.usage_state == 'UNDER' (79% < 80%)"
            - "After EXECUTED feedback: q1.provisional_used_liters == 0 AND q1.final_used_liters == 8200 AND q1.usage_state == 'WARNING' (82% >= 80%)"

      - name: alert_severity_provisional_vs_reconciled
        grounds:
          - calculations.alert_severity_score
          - entities.Alert.fields.severity
          - entities.SensorReading.fields.archived
          - endpoints.POST_/_sweep/run
        distinguishing_aspect: |
          Operates on the Alert domain (different entity domain than WaterQuota): provisional variant counts
          ABNORMAL_FILTERED readings within 24h; reconciled variant excludes them after archival sweep.
          Identical inputs produce CRITICAL severity at trigger time but downgrade to WARN post-sweep.
        test_recipe:
          setup:
            - "Plot p1 with one Sensor s1 sensor_type=SOIL_MOISTURE, valid_range [10,90]"
            - "Three SensorReadings on s1 with values [120, 130, 140]; first two classified OUT_OF_RANGE; third triggers ABNORMAL_FILTERED and creates Alert a1 (rule=ABNORMAL_FLOW, subject_type=PLOT)"
          trigger:
            - "GET /alerts/{a1.id}  # observed at trigger time, before sweep"
            - "POST /_sweep/run     # archives the 3 abnormal readings (sets archived=true; ABNORMAL_FILTERED drops out of count)"
            - "GET /alerts/{a1.id}  # observed after sweep"
          assert:
            - "Before sweep: a1.severity == 'CRITICAL' (score = W_RULE[ABNORMAL_FLOW]=3 + W_SUBJECT[PLOT]=2 + 0.5*2 = 6.0 >= 6.0)"
            - "After sweep:  a1.severity == 'WARN' (score = 3 + 2 + 0.5*0 = 5.0; 3.0 <= 5.0 < 6.0)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_water_fee_three_input_nonlinear
        grounds:
          - calculations.tiered_water_fee
          - entities.WaterBill.fields.line_items
          - entities.WaterBill.fields.peak_liters
          - entities.WaterBill.fields.offpeak_liters
          - entities.Tenant.fields.status
        distinguishing_aspect: |
          Mode (a) — formula has ≥3 inputs (peak vs offpeak window, tier slab, tenant_multiplier) interacting
          non-linearly via min(remaining, tier_upper - prev_bound) and conditional tenant_multiplier branch.
          Two valid interpretations of "round" yield different totals; scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Tenant t1 status=ACTIVE (multiplier=1.0); Plot p1 owned by t1"
            - "WaterQuota q1 covers period [T0, T0+30d); carry_forward=0"
            - "Inject 6 EXECUTED ControlCommands totaling 150000 L: 50000 L peak (feedback at hour 7), 100000 L offpeak (feedback at hour 14)"
          trigger:
            - "POST /water-bills {tenant_id: t1, plot_id: p1, period_start: T0, period_end: T0+30d}"
            - "POST /water-bills/{bill.id}/issue"
            - "GET /water-bills/{bill.id}"
          assert:
            - "bill.peak_liters == 50000 AND bill.offpeak_liters == 100000"
            - "bill.line_items has 2 entries: peak tier1 amount_cents == 1500000 (50000*30*1.0), offpeak tier1 amount_cents == 1800000 (100000*18*1.0)"
            - "bill.total_amount_cents == 3300000"

      - name: bill_total_settlement_per_line_then_carry_credit_rounding
        grounds:
          - calculations.bill_total_settlement
          - entities.WaterBill.fields.total_amount_cents
          - entities.WaterQuota.fields.carry_forward_liters
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: line_items rounded per-line FIRST, then sum,
          then carry_forward_credit_cents is computed as round_half_up(carry_forward_liters * 25) and
          subtracted. Sum-then-round on the lines (alternative order) would give a different total because
          per-line rounding is already applied; scaffold pins this exact ordering.
        test_recipe:
          setup:
            - "Tenant t1 ACTIVE; Plot p1; WaterQuota q1 covers [T0, T0+30d) with prior period unused 1235 L → carry_forward_liters = min(1235, prior_alloc*0.20) = 1235 (assume prior_alloc >= 6175)"
            - "Inject EXECUTED ControlCommands: 50000 L offpeak at offpeak tier1 rate (18 cents/L)"
          trigger:
            - "POST /water-bills {tenant_id: t1, plot_id: p1, period_start: T0, period_end: T0+30d}"
            - "POST /water-bills/{bill.id}/issue"
          assert:
            - "Step 1: line_items[0].amount_cents == 900000 (50000*18*1.0, rounded per-line — already integer)"
            - "Step 2: raw_subtotal_cents == 900000"
            - "Step 3: carry_forward_credit_cents == round_half_up(1235 * 25) == 30875"
            - "bill.total_amount_cents == max(0, 900000 - 30875) == 869125"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: irrigation_plan_revision_cycle
        grounds:
          - state_machines.IrrigationPlan.ACTIVE_to_DRAFT
          - state_machines.IrrigationPlan.DRAFT_to_ACTIVE
          - entities.IrrigationPlan.fields.parent_plan_id
          - entities.IrrigationPlan.fields.plan_version
        distinguishing_aspect: |
          Cyclic shape on IrrigationPlan: ACTIVE → DRAFT (via /override) → ACTIVE again (via /activate).
          Each cycle creates a child plan with parent_plan_id and incremented plan_version.
        test_recipe:
          setup:
            - "Plot p1, ValveGroup vg1, WaterQuota q1, IrrigationPlan plan1 ACTIVE plan_version=1"
          trigger:
            - "POST /plots/{p1.id}/irrigation-plans/{plan1.id}/override {planned_volume_liters: 5000}"
            - "POST /plots/{p1.id}/irrigation-plans/{plan2.id}/activate  # plan2 is the new revision"
          assert:
            - "plan1.status == 'DRAFT' (cycled back)"
            - "plan2.parent_plan_id == plan1.id"
            - "plan2.plan_version == 2"
            - "plan2.status == 'ACTIVE' after activate"

      - name: control_command_branching_fork_join
        grounds:
          - state_machines.ControlCommand.DISPATCHING_to_EXECUTING
          - state_machines.ControlCommand.EXECUTING_to_EXECUTED
          - state_machines.ControlCommand.DISPATCHING_to_FAILED
          - state_machines.ControlCommand.PENDING_to_OFFLINE_LOCAL
          - state_machines.ControlCommand.OFFLINE_LOCAL_to_EXECUTED
        distinguishing_aspect: |
          Branching/fork-join shape on ControlCommand (different entity than IrrigationPlan): from
          PENDING the path forks into {DISPATCHING (normal), OFFLINE_LOCAL (degraded local control)};
          from DISPATCHING/EXECUTING it forks into {EXECUTED, FAILED} with divergent side effects
          (debit final_used vs release reservation).
        test_recipe:
          setup:
            - "Plot p1, vg1 SEQUENTIAL pump_A, plan1 ACTIVE, q1 with allocated=10000"
            - "Two ControlCommands cc1 and cc2 both PENDING tied to plan1+vg1 (different valve groups vg1,vg1b on same pump_A)"
          trigger:
            - "POST /control-commands/{cc1.id}/dispatch with X-Device-Mode: OFFLINE  # branch A"
            - "POST /control-commands/{cc2.id}/dispatch  # branch B (normal)"
            - "POST /control-commands/{cc2.id}/feedback {phase: ERROR, failure_reason: 'VALVE_FAULT'}"
          assert:
            - "cc1.status == 'OFFLINE_LOCAL' AND cc1.dispatch_mode == 'LOCAL_DEGRADED'"
            - "cc2.status == 'FAILED' AND cc2.failure_reason == 'VALVE_FAULT'"
            - "An Alert with rule_code=='VALVE_FAULT' and subject_type=='VALVE_GROUP' and subject_id==vg1b.id exists"

      - name: water_quota_parallel_state_dimensions
        grounds:
          - entities.WaterQuota.fields.usage_state
          - entities.WaterQuota.fields.approval_state
          - state_machines.WaterQuota
        distinguishing_aspect: |
          Parallel state dimensions on a single WaterQuota row: usage_state {UNDER, WARNING, OVER}
          evolves with consumption while approval_state {NOT_REQUIRED, PENDING_APPROVAL, APPROVED, REJECTED}
          evolves through workflow endpoints — both axes mutate independently on the same row.
        test_recipe:
          setup:
            - "WaterQuota q1 allocated=10000, threshold=80; usage_state=UNDER, approval_state=NOT_REQUIRED"
          trigger:
            - "Inject EXECUTED command actual_volume_liters=10001 → usage_state flips to OVER"
            - "POST /water-quotas/{q1.id}/request-override {reason: 'drought'}  # approval_state: NOT_REQUIRED → PENDING_APPROVAL"
            - "POST /water-quotas/{q1.id}/approve-override {extra_liters: 3000}  # approval_state: PENDING_APPROVAL → APPROVED"
          assert:
            - "After consumption: q1.usage_state == 'OVER' AND q1.approval_state == 'NOT_REQUIRED' (independent)"
            - "After request:    q1.usage_state == 'OVER' AND q1.approval_state == 'PENDING_APPROVAL'"
            - "After approve:    q1.approval_state == 'APPROVED' AND q1.usage_state recomputed to 'WARNING' because effective_allocation grew to 13000 (10001/13000 < 80%? actually 10001/13000=0.7693 → UNDER); assert q1.usage_state == 'UNDER'"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: feedback_executed_cascade_depth_4
        grounds:
          - state_machines.ControlCommand.EXECUTING_to_EXECUTED
          - state_machines.WaterQuota.WARNING_to_OVER
          - state_machines.IrrigationPlan.ACTIVE_to_SUSPENDED
          - entities.Plot.fields.last_irrigated_at
          - entities.Alert
        distinguishing_aspect: |
          Depth ≥ 3 cascade originating from POST /control-commands/{id}/feedback with phase=COMPLETED:
          (1) ControlCommand EXECUTING → EXECUTED debits WaterQuota.final_used_liters; (2) the new value
          causes WaterQuota.usage_state WARNING → OVER (caused BY hop 1, not by the feedback directly);
          (3) the OVER transition with approval_state==NOT_REQUIRED causes ACTIVE IrrigationPlans on the
          plot to flip ACTIVE → SUSPENDED (caused BY hop 2); (4) the SUSPEND transition causes any
          PENDING ControlCommands on the suspended plan to flip PENDING → FAILED (caused BY hop 3).
        test_recipe:
          setup:
            - "WaterQuota q1 allocated=10000, threshold=80, approval_state=NOT_REQUIRED"
            - "Plan plan1 ACTIVE consuming q1; Plan plan2 ACTIVE on same plot covering a later sub-window"
            - "ControlCommand cc1 EXECUTING tied to plan1 with requested 9500"
            - "ControlCommand cc2 PENDING tied to plan2"
          trigger:
            - "POST /control-commands/{cc1.id}/feedback {phase: COMPLETED, actual_volume_liters: 10500}"
          assert:
            - "Hop 1: cc1.status == 'EXECUTED' AND q1.final_used_liters == 10500"
            - "Hop 2: q1.usage_state == 'OVER'"
            - "Hop 3: plan1.status == 'SUSPENDED' AND plan2.status == 'SUSPENDED'"
            - "Hop 4: cc2.status == 'FAILED' AND cc2.failure_reason == 'PLAN_SUSPENDED'"

      - name: device_offline_event_cascade_depth_3
        grounds:
          - endpoints.POST_/_events/emit
          - entities.Sensor.fields.status
          - entities.Alert
          - calculations.alert_severity_score
        distinguishing_aspect: |
          Different originating trigger (POST /_events/emit, not feedback): (1) event type=DEVICE_OFFLINE
          flips Sensor.status ONLINE → OFFLINE; (2) sensor status flip causes Alert{rule_code=SENSOR_OFFLINE}
          to be emitted (caused BY hop 1); (3) the new abnormal-count makes alert_severity_score recompute
          and may upgrade other live Alerts on the same plot (caused BY hop 2's count change). Depth ≥ 2.
        test_recipe:
          setup:
            - "Plot p1 with Sensors s1 (SOIL_MOISTURE, ONLINE) and s2 (WEATHER_STATION, ONLINE)"
            - "Existing Alert a0 on p1 with rule_code=ABNORMAL_FLOW, severity=WARN (score 5.0)"
          trigger:
            - "POST /_events/emit {event_type: DEVICE_OFFLINE, payload: {sensor_id: s1.id}}"
            - "GET /alerts  # to observe new + recomputed severities"
          assert:
            - "Hop 1: s1.status == 'OFFLINE'"
            - "Hop 2: a new Alert exists with rule_code=='SENSOR_OFFLINE' and subject_id==s1.id"
            - "Hop 3: a0.severity has been recomputed (score now includes the new offline-related abnormal counts) and may be upgraded — assert a0.severity in {'WARN', 'CRITICAL'} and a0.updated_at advanced"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_control_command
        grounds:
          - validations[priority=5]   # state on IrrigationPlan
          - validations[priority=12]  # business_fiscal on quota
          - errors.ERR_INVALID_STATE
          - errors.ERR_QUOTA_EXCEEDED
        distinguishing_aspect: |
          Pair (state, business_fiscal): a request creates a ControlCommand against a SUSPENDED plan AND
          its requested volume would also exceed quota. Priority 5 (plan state) precedes priority 12
          (quota); winner is ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Plan plan1 SUSPENDED; q1 already at usage_state=WARNING"
          trigger:
            - "POST /control-commands {plan_id: plan1, valve_group_id: vg1, requested_volume_liters: 999999}"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (priority 5 wins)"
            - "Response http status == 409"

      - name: business_safety_vs_business_referential_on_dispatch
        grounds:
          - validations[priority=8]  # business_safety: pump interlock
          - validations[priority=9]  # business_referential: valve_group pump mismatch
          - errors.ERR_PUMP_INTERLOCK_BUSY
          - errors.ERR_VALVE_GROUP_PUMP_MISMATCH
        distinguishing_aspect: |
          Different category pair (business_safety, business_referential): a dispatch where the pump is
          busy with another SEQUENTIAL command AND the ControlCommand's valve_group's pump_id mismatches
          the plot's pump_id. Priority 8 (interlock safety) precedes priority 9 (referential mismatch);
          winner is ERR_PUMP_INTERLOCK_BUSY. NOTE: the referential check is tested at command CREATE
          (priority 9 applies_to POST /control-commands); to make both surface at dispatch time, the
          test swaps Plot.pump_id AFTER cc creation — then on /dispatch the safety check fires first.
        test_recipe:
          setup:
            - "Plot p1 with pump_id='pump_A'; ValveGroup vg1 pump_id='pump_A' SEQUENTIAL"
            - "ControlCommand ccA DISPATCHING on pump_A (occupies the pump)"
            - "ControlCommand ccB PENDING tied to vg1"
            - "PATCH /plots/{p1.id} {pump_id: 'pump_B'}  # introduces referential mismatch on ccB's vg1"
          trigger:
            - "POST /control-commands/{ccB.id}/dispatch"
          assert:
            - "Response error_id == 'ERR_PUMP_INTERLOCK_BUSY' (priority 8 wins over priority 9)"
            - "Response http status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: warning_threshold_inclusive_lower_bound
        grounds:
          - calculations.quota_consumption_provisional_vs_final
          - entities.WaterQuota.fields.warning_threshold_pct
          - entities.WaterQuota.fields.usage_state
          - endpoints.POST_/control-commands/{command_id}/feedback
        distinguishing_aspect: |
          Numeric threshold boundary on WaterQuota.usage_state: `final_used_liters / effective_allocation
          >= warning_threshold_pct/100` is INCLUSIVE. At exactly 80.000% the state is WARNING; at
          79.999% it is UNDER. Reachable via POST /control-commands/{id}/feedback.
        test_recipe:
          setup:
            - "WaterQuota q1 allocated=10000, threshold=80, carry_forward=0, approval_extra=0"
            - "ControlCommand cc1 EXECUTING tied to q1's plan"
          trigger:
            - "POST /control-commands/{cc1.id}/feedback {phase: COMPLETED, actual_volume_liters: 7999.99}"
            - "GET /water-quotas/{q1.id}  # observe (Case A)"
            - "Reset: a second cc2 EXECUTED with actual_volume_liters: 0.01 to bring total to 8000.00"
            - "GET /water-quotas/{q1.id}  # observe (Case B)"
          assert:
            - "Case A: q1.final_used_liters == 7999.99 AND q1.usage_state == 'UNDER' (7999.99/10000 = 0.799999 < 0.80)"
            - "Case B: q1.final_used_liters == 8000.00 AND q1.usage_state == 'WARNING' (8000.00/10000 = 0.80 >= 0.80, inclusive)"

      - name: empty_collection_at_plan_activate
        grounds:
          - validations[priority=11]  # ERR_VALVE_GROUP_INVALID — empty valve_ids edge
          - errors.ERR_VALVE_GROUP_INVALID
          - errors.ERR_PRECONDITION_NOT_MET
          - state_machines.IrrigationPlan.DRAFT_to_ACTIVE
          - entities.Sensor.fields.status
        distinguishing_aspect: |
          Empty-collection / zero-count edge on a different metric (count of ONLINE sensors) and
          different endpoint (POST /plots/{plot_id}/irrigation-plans/{id}/activate): when the count
          of Sensors with status==ONLINE on the plot is exactly 0, activate fails with
          ERR_PRECONDITION_NOT_MET; with 1 it succeeds.
        test_recipe:
          setup:
            - "Plot p1 with WaterQuota q1 covering plan window; ValveGroup vg1 valid"
            - "IrrigationPlan plan1 DRAFT on p1"
            - "Sensor s1 on p1 with status=OFFLINE (count of ONLINE = 0)"
          trigger:
            - "POST /plots/{p1.id}/irrigation-plans/{plan1.id}/activate  # Case A: zero ONLINE"
            - "PATCH /sensors/{s1.id} {status: ONLINE}"
            - "POST /plots/{p1.id}/irrigation-plans/{plan1.id}/activate  # Case B: one ONLINE"
          assert:
            - "Case A: HTTP 422, error_id == 'ERR_PRECONDITION_NOT_MET' (count 0)"
            - "Case B: HTTP 200, plan1.status == 'ACTIVE' (count 1, boundary just crossed)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: irrigation_plan_activate_depends_on_sensor_and_quota
        grounds:
          - state_machines.IrrigationPlan.DRAFT_to_ACTIVE
          - entities.Sensor.fields.status
          - entities.WaterQuota.fields.usage_state
          - entities.WaterQuota.fields.approval_state
        distinguishing_aspect: |
          Entity pair (IrrigationPlan, WaterQuota): plan DRAFT→ACTIVE is allowed only if owning
          WaterQuota.usage_state != OVER OR WaterQuota.approval_state == APPROVED. The valid next-state
          set for IrrigationPlan depends on WaterQuota's state.
        test_recipe:
          setup:
            - "Plot p1; q1 usage_state=OVER, approval_state=NOT_REQUIRED"
            - "Plan plan1 DRAFT covering q1's period"
          trigger:
            - "POST /plots/{p1.id}/irrigation-plans/{plan1.id}/activate  # Case A: blocked"
            - "POST /water-quotas/{q1.id}/request-override {reason: 'urgent'}"
            - "POST /water-quotas/{q1.id}/approve-override {extra_liters: 5000}"
            - "POST /plots/{p1.id}/irrigation-plans/{plan1.id}/activate  # Case B: allowed"
          assert:
            - "Case A: error_id == 'ERR_PRECONDITION_NOT_MET', plan1.status == 'DRAFT'"
            - "Case B: plan1.status == 'ACTIVE' (q1.approval_state == 'APPROVED' unblocks)"

      - name: control_command_dispatch_depends_on_plan_and_pump
        grounds:
          - state_machines.ControlCommand.PENDING_to_DISPATCHING
          - entities.IrrigationPlan.fields.status
          - entities.Plot.fields.pump_id
          - entities.ValveGroup.fields.pump_id
          - validations[priority=8]
        distinguishing_aspect: |
          Different entity pair (ControlCommand, IrrigationPlan AND ControlCommand, Plot via pump_id):
          dispatch's valid next-state set depends on the plan being ACTIVE AND on no pump-conflicting
          command existing on the same Plot.pump_id. Two distinct cross-entity preconditions, neither
          one used by Rule 7 instance 1.
        test_recipe:
          setup:
            - "Plot p1 pump_id=pump_A; ValveGroups vg1 (pump_A SEQUENTIAL) and vg2 (pump_A SEQUENTIAL)"
            - "Plan plan1 ACTIVE on p1; ControlCommand ccA EXECUTING tied to plan1+vg1"
            - "ControlCommand ccB PENDING tied to plan1+vg2"
          trigger:
            - "POST /control-commands/{ccB.id}/dispatch  # Case A: blocked by interlock"
            - "POST /control-commands/{ccA.id}/feedback {phase: COMPLETED, actual_volume_liters: 0}"
            - "POST /control-commands/{ccB.id}/dispatch  # Case B: now allowed"
          assert:
            - "Case A: error_id == 'ERR_PUMP_INTERLOCK_BUSY' (cross-entity dependency on Plot.pump_id occupancy)"
            - "Case B: ccB.status == 'DISPATCHING' (after ccA terminal, pump freed)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: irrigation_plan_window_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors.ERR_PLAN_WINDOW_OVERLAP
          - entities.IrrigationPlan.fields.window_start
          - entities.IrrigationPlan.fields.window_end
          - state_machines.IrrigationPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Half-open interval semantics on the IrrigationPlan resource: [start, end) — adjacent windows
          touching at the boundary do NOT overlap (B starts at A.end is OK), but any positive overlap
          is rejected. Specific to plan-window overlap with adjacency-allowed semantics.
        test_recipe:
          setup:
            - "Plot p1 with WaterQuota covering [T0, T0+10d)"
            - "Plan plan1 ACTIVE with window [T0+1d, T0+2d)"
          trigger:
            - "POST /plots/{p1.id}/irrigation-plans {window_start: T0+2d, window_end: T0+3d}  # Case A: adjacent — OK"
            - "POST /plots/{p1.id}/irrigation-plans/{plan2.id}/activate  # activate plan2"
            - "POST /plots/{p1.id}/irrigation-plans {window_start: T0+1d12h, window_end: T0+2d12h}  # Case B: overlapping — REJECT"
            - "POST /plots/{p1.id}/irrigation-plans/{plan3.id}/activate"
          assert:
            - "Case A: plan2 created and activated successfully (boundary touch is allowed under half-open)"
            - "Case B: activate fails with HTTP 409 error_id == 'ERR_PLAN_WINDOW_OVERLAP'"

      - name: pump_aggregate_capacity_overlap
        grounds:
          - state_machines.ControlCommand.PENDING_to_DISPATCHING
          - validations[priority=8]
          - entities.ValveGroup.fields.control_mode
          - entities.ValveGroup.fields.max_parallel_valves
          - errors.ERR_PUMP_INTERLOCK_BUSY
        distinguishing_aspect: |
          Different interval semantics on a different resource (Plot.pump_id occupancy): treats
          concurrent ControlCommand executions as aggregate-capacity overlap rather than [start, end)
          intervals — pump can serve up to ValveGroup.max_parallel_valves valves IF all in-flight
          commands' valve groups have control_mode==PARALLEL; any SEQUENTIAL group on that pump
          collapses capacity to 1. Different geometric treatment than instance 1.
        test_recipe:
          setup:
            - "Plot p1 pump_id=pump_A"
            - "ValveGroup vgPar1 (pump_A, PARALLEL, max_parallel_valves=2)"
            - "ValveGroup vgPar2 (pump_A, PARALLEL, max_parallel_valves=2)"
            - "ValveGroup vgSeq  (pump_A, SEQUENTIAL, max_parallel_valves=1)"
            - "Plan plan1 ACTIVE; CC cc1 EXECUTING tied to vgPar1"
          trigger:
            - "POST /control-commands/{cc2.id}/dispatch where cc2 ties vgPar2  # Case A: parallel co-exists"
            - "POST /control-commands/{cc3.id}/dispatch where cc3 ties vgSeq   # Case B: SEQUENTIAL collapses capacity"
          assert:
            - "Case A: cc2.status == 'DISPATCHING' (aggregate capacity ≥ 2 across vgPar1+vgPar2)"
            - "Case B: error_id == 'ERR_PUMP_INTERLOCK_BUSY' (SEQUENTIAL forces capacity 1 — collides with cc1, cc2)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: quota_reservation_compensation_on_failed_command
        grounds:
          - state_machines.ControlCommand.PENDING_to_DISPATCHING
          - state_machines.ControlCommand.DISPATCHING_to_FAILED
          - state_machines.ControlCommand.EXECUTING_to_FAILED
          - calculations.quota_consumption_provisional_vs_final
          - entities.WaterQuota.fields.provisional_used_liters
          - entities.WaterQuota.fields.final_used_liters
        distinguishing_aspect: |
          Conserved quantity: WaterQuota.provisional_used_liters + WaterQuota.final_used_liters MUST
          remain unchanged across the (create_command + fail_command) pair on a quota — i.e., the
          reservation made on create must be fully released on FAIL, with no leakage to final usage.
          Pinned formula: delta(provisional) + delta(final) == 0 over the create→fail span.
        test_recipe:
          setup:
            - "WaterQuota q1 allocated=10000; provisional_used=0, final_used=0"
            - "Plan plan1 ACTIVE; ValveGroup vg1"
          trigger:
            - "POST /control-commands {plan_id: plan1, valve_group_id: vg1, requested_volume_liters: 3000}"
            - "POST /control-commands/{cc.id}/dispatch"
            - "POST /control-commands/{cc.id}/feedback {phase: ERROR, failure_reason: 'VALVE_FAULT'}"
            - "GET /water-quotas/{q1.id}"
          assert:
            - "After CREATE: q1.provisional_used_liters == 3000, q1.final_used_liters == 0"
            - "After FAILED: q1.provisional_used_liters == 0, q1.final_used_liters == 0"
            - "Invariant: (q1.provisional_used_liters + q1.final_used_liters) == 0 (unchanged from initial)"

      - name: bill_money_invariant_on_dispute_accept_cancel
        grounds:
          - state_machines.WaterBill.DISPUTED_to_CANCELLED
          - calculations.bill_total_settlement
          - entities.WaterBill.fields.total_amount_cents
          - entities.WaterBill.fields.amount_paid_cents
        distinguishing_aspect: |
          Different conserved quantity (cents, not liters): WaterBill.amount_paid_cents must remain
          unchanged across the (dispute, dispute-resolve outcome=ACCEPT) pair — the cancellation zeroes
          total_amount_cents but MUST NOT touch amount_paid_cents (refund obligation surfaces as
          negative balance_due). Pinned: delta(amount_paid_cents) == 0 over the dispute→accept span.
        test_recipe:
          setup:
            - "Tenant t1, Plot p1, Bill b1 ISSUED with total_amount_cents=500000 and amount_paid_cents=200000 (partial payment)"
          trigger:
            - "POST /water-bills/{b1.id}/dispute {dispute_reason: 'meter error'}"
            - "POST /water-bills/{b1.id}/dispute-resolve {outcome: ACCEPT}"
            - "GET /water-bills/{b1.id}"
          assert:
            - "After dispute:  b1.status == 'DISPUTED' AND b1.amount_paid_cents == 200000 (unchanged)"
            - "After accept:   b1.status == 'CANCELLED' AND b1.total_amount_cents == 0 AND b1.amount_paid_cents == 200000"
            - "Invariant: delta(b1.amount_paid_cents) across dispute→accept == 0 (refund obligation = -200000 surfaced as negative balance_due)"
