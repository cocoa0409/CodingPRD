  # =========================================================================
  - section: state_machines
    instances:

      - name: plan_initial_state_is_draft_and_direct_freeze_is_rejected
        claim_type: initial_state
        grounds:
          - state_machines.Plan.DRAFT_to_ACTIVE
          - entities.Plan.fields.status
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "A newly created plan is DRAFT, and DRAFT -> FROZEN is not a declared transition, so the attempt is refused with ERR_INVALID_STATE_TRANSITION at 409 while status stays DRAFT."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer with one freshly created plan."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "FROZEN" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Plan.${p403_id}.status == DRAFT and version == 1"

      - name: terminated_plan_status_change_is_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Plan.ACTIVE_to_TERMINATED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "TERMINATED is a terminal state for Plan, so a follow-up request to move the plan back to ACTIVE is refused with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer with a plan taken DRAFT -> ACTIVE -> TERMINATED."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "TERMINATED" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Plan.${p403_id}.status == TERMINATED"

      - name: plan_termination_cascades_election_revocation_and_agreement_termination
        claim_type: side_effect_execution
        grounds:
          - state_machines.Plan.ACTIVE_to_TERMINATED
          - state_machines.ContributionElection.EFFECTIVE_to_REVOKED
          - state_machines.InformationSharingAgreement.ACTIVE_to_TERMINATED
        distinguishing_aspect: "Terminating an ACTIVE plan drives every SUBMITTED or EFFECTIVE election on that plan to REVOKED and every non-terminal agreement to TERMINATED in the same request, and returns the revoked election's service catch-up to the participant."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan, a valid 2026 notice, one provider with an ACTIVE agreement, one participant born 1970-01-01 with years_of_service 20 and cumulative_special_catchup_used_cents 0, one contract, and an ELIGIBLE determination by co-1."
            - "One EFFECTIVE election for 2750000 cents with catchup_election SERVICE_15_YEAR, so 2450000 lands in the basic bucket and 300000 in the service catch-up bucket."
