          assert:
            - "the first booking is created with status \"HELD\" and moves the case's logistics_status to \"SLOT_HELD\", which bumps WorkupCase.version - the value read back as wc_v_fresh is no longer the wc_v_read the client held"
            - "the second create carrying the pre-booking wc_v_read returns 412 with error_id \"ERR_STALE_WORKUP_VERSION\""
            - "the refused create is inert: no second CollectionBooking row exists, the first booking is still \"HELD\" and the center's committed_slot_minutes is unchanged"
            - "re-reading the case and resubmitting the identical 2026-08-12T08:00:00Z payload with the fresh version returns 201: the new booking is \"HELD\" and the first booking becomes \"SUPERSEDED\" with cancel_reason \"SUPERSEDED_BY_NEW_BOOKING\""
            - "committed_slot_minutes ends at 300 - one PBSC slot - not 600: the supersede released the first booking's minutes, so the OCC guard and the supersede cascade compose without double-counting"

      - name: conditioning_action_rejects_a_stale_patient_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[conditioning-schedule-stale-patient]
          - validations[priority=34]
          - errors[ERR_STALE_PATIENT_VERSION]
        distinguishing_aspect: |
          The patient rule guards a different hazard from the workup rule: a re-SCHEDULE overwrites
          conditioning_start_date and CANCELS bookings that fall outside the new window, so a stale writer
          would destroy a timeline it never read. Here the same stale version is replayed against two
          different actions - START and a re-SCHEDULE - and the second replay is deliberately also illegal
          by state (the patient has already STARTED), which pins the ordering: priority 34 must answer
          before any conditioning state rule, so the response is 412 and not 409. The successful calls
          bracket the failures, proving version advances on every accepted write and on no rejected one.
        test_recipe:
          setup:
            - "the canonical domestic chain up to logistics_status METHOD_SET with method PBSC (identical setup to booking_create_rejects_a_stale_workup_case_version, but conditioning is NOT yet scheduled)"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Midwest Apheresis Center", country_code: "US", concurrent_collection_capacity: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { center_id: "$.data.id" }
