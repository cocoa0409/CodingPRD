scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_persists_fields_and_defaults
        claim_type: creation
        grounds: [entities.NetworkMember]
        distinguishing_aspect: "POST with all required fields returns 201 with charter_status APPLICANT, compliance_posture CLEAR, open_finding_count 0, failed_review_flag false, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Corner Housing", ein: "100000001", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
              captures: { m1: $.data.id, m1_status: $.data.charter_status, m1_posture: $.data.compliance_posture, m1_v: $.data.version }
          trigger:
            - call: "GET /housing-network/members/${m1}"
              payload: {}
              as: GrantOfficer
          assert:
            - "captured charter_status == APPLICANT"
            - "captured compliance_posture == CLEAR"
            - "captured version == 1"
            - "GET returns legal_name == 'Corner Housing' and open_finding_count == 0"

      - name: member_missing_ein_rejected
        claim_type: required_fields
        grounds: [entities.NetworkMember.fields.ein]
        distinguishing_aspect: "Omitting required field ein yields ERR_INVALID_REQUEST 400 and no row is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /housing-network/members"
              payload: { legal_name: "No EIN Org", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: member_duplicate_ein_rejected
        claim_type: type_constraints
        grounds: [entities.NetworkMember.fields.ein, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second member with an identical ein is rejected ERR_DUPLICATE 409 (uniqueness, priority 13)."
        test_recipe:
          setup: ["one member with ein 100000002 exists"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Dup A", ein: "100000002", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
          trigger:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Dup B", ein: "100000002", state_code: "NV", service_regions: ["32001"] }
              as: NetworkDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"

      - name: get_member_not_found
        claim_type: not_found
        grounds: [entities.NetworkMember, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /housing-network/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NetworkDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_members_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /members with limit 1 over 2 members returns pagination fields total_count 2 and has_more true; default limit is 10."
        test_recipe:
          setup: ["two members exist"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Page One", ein: "100000003", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
            - call: "POST /housing-network/members"
              payload: { legal_name: "Page Two", ein: "100000004", state_code: "CA", service_regions: ["06038"] }
              as: NetworkDirector
          trigger:
            - call: "GET /housing-network/members"
              payload: { limit: 1, offset: 0 }
              as: NetworkDirector
          assert:
            - "response data array length == 1"
            - "pagination total_count == 2 and has_more == true"

      - name: course_system_fields_ignore_input
        claim_type: system_fields
        grounds: [entities.Course]
        distinguishing_aspect: "Client-supplied ce_credits: 99 is overridden by the input contract but system fields are never client-settable: server-minted id is a bare UUID with no prefix, version starts at 1, seats_taken starts at 0 regardless of payload noise the server must ignore or reject."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing-network/courses"
              payload: { course_code: "XX-999", title: "SysFields", program_area: "RENTAL", capacity: 3, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-30T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs: $.data.id }
          trigger:
            - call: "GET /housing-network/courses/${crs}"
              payload: {}
              as: TrainingRegistrar
          assert:
            - "Course.version == 1 (system-managed; no client payload can seed it)"
            - "Course.seats_taken == 0"
            - "Course.course_status == SCHEDULED"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: revoke_from_chartered_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.NetworkMember, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "revoke is defined only from PROBATION; calling it on a CHARTERED member returns ERR_INVALID_STATE and nothing cascades."
        test_recipe:
          setup: ["CHARTERED member m1 (assessment STRONG, certified counselor, charter granted)"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "SM Housing", ein: "200000001", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/members/${m1}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a1: $.data.id }
            - call: "POST /housing-network/assessments/${a1}/submit"
              payload: { governance_score: 95, finance_score: 95, program_capacity_score: 95 }
              as: Assessor
              as_user_id: "u-assessor-sm"
            - call: "POST /housing-network/assessments/${a1}/score"
              payload: {}
              as: NetworkDirector
              as_user_id: "u-director-sm"
            - call: "POST /housing-network/assessments/${a1}/adjudicate"
              payload: { site_visit_adjustment: 0 }
              as: NetworkDirector
              as_user_id: "u-director-sm"
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "Csm", email: "csm@x.com" }
              as: NetworkDirector
              captures: { c1: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-111", title: "HO", program_area: "HOMEOWNERSHIP", capacity: 5, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs1: $.data.id }
            - call: "POST /housing-network/courses/${crs1}/enrollments"
              payload: { counselor_id: "${c1}" }
              as: TrainingRegistrar
              captures: { e1: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/enrollments/${e1}/grade"
              payload: { score: 90 }
              as: TrainingRegistrar
            - call: "POST /housing-network/certifications"
              payload: { counselor_id: "${c1}", program_area: "HOMEOWNERSHIP" }
              as: TrainingRegistrar
              captures: { cert1: $.data.id }
            - call: "POST /housing-network/certifications/${cert1}/certify"
              payload: {}
              as: TrainingRegistrar
            - call: "POST /housing-network/members/${m1}/charter"
              payload: {}
              as: NetworkDirector
          trigger:
            - call: "POST /housing-network/members/${m1}/revoke"
              payload: { revocation_reason: "premature" }
              as: NetworkDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "NetworkMember.${m1}.charter_status == CHARTERED (unchanged)"

      - name: terminal_award_lockdown
        claim_type: terminal_state
        grounds: [state_machines.GrantAward]
        distinguishing_aspect: "A TERMINATED award rejects every further action (activate, suspend, disbursement creation) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["member revoked; its award aw5 TERMINATED via cascade (reuse of revocation chain)"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Term Housing", ein: "200000002", state_code: "CA", service_regions: ["06039"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/members/${m1}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a1: $.data.id }
            - call: "POST /housing-network/assessments/${a1}/submit"
              payload: { governance_score: 95, finance_score: 95, program_capacity_score: 95 }
              as: Assessor
              as_user_id: "u-assessor-t"
            - call: "POST /housing-network/assessments/${a1}/score"
              payload: {}
              as: NetworkDirector
              as_user_id: "u-director-t"
            - call: "POST /housing-network/assessments/${a1}/adjudicate"
              payload: { site_visit_adjustment: 0 }
              as: NetworkDirector
              as_user_id: "u-director-t"
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "Ct", email: "ct@x.com" }
              as: NetworkDirector
              captures: { c1: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-112", title: "HO", program_area: "HOMEOWNERSHIP", capacity: 5, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs1: $.data.id }
            - call: "POST /housing-network/courses/${crs1}/enrollments"
              payload: { counselor_id: "${c1}" }
              as: TrainingRegistrar
              captures: { e1: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/enrollments/${e1}/grade"
              payload: { score: 90 }
              as: TrainingRegistrar
            - call: "POST /housing-network/certifications"
              payload: { counselor_id: "${c1}", program_area: "HOMEOWNERSHIP" }
              as: TrainingRegistrar
              captures: { cert1: $.data.id }
            - call: "POST /housing-network/certifications/${cert1}/certify"
              payload: {}
              as: TrainingRegistrar
            - call: "POST /housing-network/members/${m1}/charter"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/grant-cycles"
              payload: { fiscal_year: 2040, formula_pool_cents: 100000, competitive_pool_cents: 0 }
              as: GrantOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /housing-network/grant-applications"
              payload: { cycle_id: "${cyc}", member_id: "${m1}", program_area: "HOMEOWNERSHIP", requested_formula_cents: 50000, requested_competitive_cents: 0, pledged_match_cents: 20000, expected_cycle_version: "${cyc_v}" }
              as: MemberAdmin
              as_user_id: "${m1}"
              captures: { app: $.data.id }
            - call: "POST /housing-network/grant-applications/${app}/submit"
              payload: {}
              as: MemberAdmin
              as_user_id: "${m1}"
            - call: "POST /housing-network/grant-cycles/${cyc}/lock-formula"
              payload: {}
              as: GrantOfficer
            - call: "POST /housing-network/grant-cycles/${cyc}/open-competitive-review"
              payload: {}
              as: GrantOfficer
            - call: "POST /housing-network/grant-cycles/${cyc}/finalize"
              payload: {}
              as: GrantOfficer
            - call: "POST /housing-network/grant-applications/${app}/award"
              payload: {}
              as: GrantOfficer
              as_user_id: "go-appr-t"
              captures: { aw: $.data.id }
            - call: "POST /housing-network/performance-reviews"
              payload: { member_id: "${m1}", review_period: "FY2040-H1" }
              as: NetworkDirector
              captures: { rv: $.data.id }
            - call: "POST /housing-network/performance-reviews/${rv}/score"
              payload: { review_score: 10 }
              as: NetworkDirector
            - call: "POST /housing-network/performance-reviews/${rv}/resolve"
              payload: { verdict: "CORRECTIVE_ACTION" }
              as: NetworkDirector
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/performance-reviews/${rv}/escalate"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/members/${m1}/revoke"
              payload: { revocation_reason: "non-compliance" }
              as: NetworkDirector
          trigger:
            - call: "POST /housing-network/disbursements"
              payload: { award_id: "${aw}", amount_cents: 100 }
              as: GrantOfficer
              captures: { err: $.data.error_id }
          assert:
            - "GrantAward.${aw}.award_status == TERMINATED (cascade fired)"
            - "error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: deficient_assessment_returns_member_to_applicant
        claim_type: side_effect_execution
        grounds: [state_machines.NetworkMember.UNDER_ASSESSMENT_to_APPLICANT]
        distinguishing_aspect: "Adjudication with final rating DEFICIENT (adjustment -10 pulls composite below 50) reverts the member to APPLICANT — the chartering revision loop."
        test_recipe:
          setup: ["member m1 UNDER_ASSESSMENT with assessment scored 55/55/55 (base 55.00)"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Deficient Org", ein: "200000003", state_code: "CA", service_regions: ["06040"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/members/${m1}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a1: $.data.id }
            - call: "POST /housing-network/assessments/${a1}/submit"
              payload: { governance_score: 55, finance_score: 55, program_capacity_score: 55 }
              as: Assessor
              as_user_id: "u-assessor-d"
            - call: "POST /housing-network/assessments/${a1}/score"
              payload: {}
              as: NetworkDirector
              as_user_id: "u-director-d"
          trigger:
            - call: "POST /housing-network/assessments/${a1}/adjudicate"
              payload: { site_visit_adjustment: -10 }
              as: NetworkDirector
              captures: { rating: $.data.final_rating }
          assert:
            - "final_rating == DEFICIENT (composite 45.00)"
            - "NetworkMember.${m1}.charter_status == APPLICANT"
            - "OrganizationalAssessment.${a1}.assessment_status == ADJUDICATED"

      - name: course_conclusion_auto_fails_registered_enrollments
        claim_type: side_effect_execution
        grounds: [state_machines.Course.IN_SESSION_to_CONCLUDED]
        distinguishing_aspect: "Clock advance past delivery_end auto-transitions the course to CONCLUDED and force-fails REGISTERED enrollments without CE credit."
        test_recipe:
          setup: ["course in window, one REGISTERED enrollment, clock before delivery_end"]
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "AutoFail Org", ein: "200000004", state_code: "CA", service_regions: ["06041"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "Caf", email: "caf@x.com" }
              as: NetworkDirector
              captures: { c1: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-113", title: "HO", program_area: "HOMEOWNERSHIP", capacity: 5, ce_eligible: true, ce_credits: 10, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs: $.data.id }
            - call: "POST /housing-network/courses/${crs}/enrollments"
              payload: { counselor_id: "${c1}" }
              as: TrainingRegistrar
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: NetworkDirector
            - call: "GET /housing-network/courses/${crs}"
              payload: {}
              as: TrainingRegistrar
              captures: { crs_status: $.data.course_status }
            - call: "GET /housing-network/enrollments/${e1}"
              payload: {}
              as: TrainingRegistrar
              captures: { e1_status: $.data.enrollment_status }
          assert:
            - "course_status == CONCLUDED"
            - "enrollment_status == FAILED"
            - "Counselor.${c1}.ce_credits_accumulated == 0 (no credit for auto-failure)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: assessment_composite_precision
        claim_type: correct_result
        grounds: [calculations.assessment_composite]
        excluded_because:
          difficulty_instance: assessment_composite_provisional_vs_final
          rationale: "Weighted composite and rating bands asserted with literal values in the named §1.8 instance."

      - name: formula_allocation_waterfall_and_cap
        claim_type: correct_result
        grounds: [calculations.formula_allocation]
        excluded_because:
          difficulty_instance: formula_allocation_rounding_waterfall
          rationale: "Cap + waterfall redistribution with literal cent values asserted in the named §1.8 instance."

      - name: households_rollup_congressional_grouping
        claim_type: input_set_filtering
        grounds: [calculations.households_served_rollup]
        distinguishing_aspect: "The congressional variant counts only OUTCOME_RECORDED/CLOSED files with a non-NO_OUTCOME code opened inside the FY window, grouped by program_area; OPEN files and NO_OUTCOME files are excluded."
        test_recipe:
          setup:
            - "CHARTERED member m1 with certified counselor c1 (HOMEOWNERSHIP); FY2039 window files: f1 OUTCOME_RECORDED PURCHASED_HOME (counts), f2 OUTCOME_RECORDED NO_OUTCOME (excluded), f3 still OPEN (excluded)"
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Rollup Org", ein: "300000001", state_code: "CA", service_regions: ["06042"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/members/${m1}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a1: $.data.id }
            - call: "POST /housing-network/assessments/${a1}/submit"
              payload: { governance_score: 95, finance_score: 95, program_capacity_score: 95 }
              as: Assessor
              as_user_id: "u-assessor-r"
            - call: "POST /housing-network/assessments/${a1}/score"
              payload: {}
              as: NetworkDirector
              as_user_id: "u-director-r"
            - call: "POST /housing-network/assessments/${a1}/adjudicate"
              payload: { site_visit_adjustment: 0 }
              as: NetworkDirector
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "Cro", email: "cro@x.com" }
              as: NetworkDirector
              captures: { c1: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-211", title: "HO", program_area: "HOMEOWNERSHIP", capacity: 5, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs: $.data.id }
            - call: "POST /housing-network/courses/${crs}/enrollments"
              payload: { counselor_id: "${c1}" }
              as: TrainingRegistrar
              captures: { e1: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/enrollments/${e1}/grade"
              payload: { score: 90 }
              as: TrainingRegistrar
            - call: "POST /housing-network/certifications"
              payload: { counselor_id: "${c1}", program_area: "HOMEOWNERSHIP" }
              as: TrainingRegistrar
              captures: { cert1: $.data.id }
            - call: "POST /housing-network/certifications/${cert1}/certify"
              payload: {}
              as: TrainingRegistrar
            - call: "POST /housing-network/members/${m1}/charter"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2038-11-01T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/client-files"
              payload: { member_id: "${m1}", counselor_id: "${c1}", program_area: "HOMEOWNERSHIP", household_size: 4 }
              as: MemberAdmin
              as_user_id: "${m1}"
              captures: { f1: $.data.id }
            - call: "POST /housing-network/client-files"
              payload: { member_id: "${m1}", counselor_id: "${c1}", program_area: "HOMEOWNERSHIP", household_size: 2 }
              as: MemberAdmin
              as_user_id: "${m1}"
              captures: { f2: $.data.id }
            - call: "POST /housing-network/client-files"
              payload: { member_id: "${m1}", counselor_id: "${c1}", program_area: "HOMEOWNERSHIP", household_size: 1 }
              as: MemberAdmin
              as_user_id: "${m1}"
              captures: { f3: $.data.id }
            - call: "POST /housing-network/client-files/${f1}/begin-counseling"
              payload: {}
              as: MemberAdmin
              as_user_id: "${m1}"
            - call: "POST /housing-network/client-files/${f2}/begin-counseling"
              payload: {}
              as: MemberAdmin
              as_user_id: "${m1}"
            - call: "POST /housing-network/client-files/${f1}/record-outcome"
              payload: { outcome_code: "PURCHASED_HOME", counseling_hours: 5.0 }
              as: MemberAdmin
              as_user_id: "${m1}"
            - call: "POST /housing-network/client-files/${f2}/record-outcome"
              payload: { outcome_code: "NO_OUTCOME", counseling_hours: 3.0 }
              as: MemberAdmin
              as_user_id: "${m1}"
          trigger:
            - call: "GET /housing-network/reports/congressional"
              payload: { fiscal_year: 2039 }
              as: NetworkDirector
              captures: { total: $.data.total_households }
          assert:
            - "total_households == 1 (only f1: OUTCOME_RECORDED with real outcome, opened in FY2039 window)"
            - "by_program_area.HOMEOWNERSHIP == 1; no RENTAL key"
            - "f2 (NO_OUTCOME) and f3 (OPEN) excluded"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /housing-network/members"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED or request rejected with 401 before role resolution"

      - name: posture_gate_blocks_frozen_begin_counseling
        claim_type: violation_to_error
