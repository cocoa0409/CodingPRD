            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B01", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { bd1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B02", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { bd2: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B03", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { bd3: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B04", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { bd4: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B05", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B06", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B07", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B08", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B09", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B10", bed_kind: "STANDARD" }
              as: EVSAdministrator
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${bd1}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", reason: "hvac" }
              as: EVSAdministrator
              captures: { w1: $.data.id }
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${bd2}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", reason: "hvac" }
              as: EVSAdministrator
              captures: { w2: $.data.id }
          trigger:
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${bd3}", start_at: "2026-08-01T10:30:00Z", end_at: "2026-08-01T11:30:00Z", reason: "plumbing" }
              as: EVSAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${bd3}", start_at: "2026-08-01T11:00:00Z", end_at: "2026-08-01T12:00:00Z", reason: "plumbing" }
              as: EVSAdministrator
              captures: { w3: $.data.id }
          assert:
            - "err == ERR_CAPACITY_EXCEEDED (422): at instant 10:30 the overlapping count would reach 3 > cap 2"
            - "W3 [11:00, 12:00) is accepted: end==start adjacency does not overlap under half-open semantics"
            - "MaintenanceWindow.${w1}.status == SCHEDULED AND .${w2}.status == SCHEDULED AND .${w3}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
  # ---------------------------------------------------------------------------
    instances:
      - name: supply_reserve_release_conserves_quantities
        grounds:
          - calculations.supply_consumption_bom
          - state_machines.CleanRequest.IN_PROGRESS_to_CANCELLED
          - entities.SupplyItem.fields.on_hand_quantity
          - entities.SupplyItem.fields.reserved_quantity
        distinguishing_aspect: |
          Conserved quantity: the (on_hand_quantity, reserved_quantity) pair
          of every BOM SupplyItem. reserve-then-release (start -> cancel from
          IN_PROGRESS) MUST restore both fields exactly, and
          reserve-then-consume (start -> complete) MUST debit on_hand by the
          BOM amount and reserved by the same amount — no drift either way.
        test_recipe:
          setup:
            - "Unit U, standards, DISINFECTANT on_hand 100 / CLOTH 200, bed B1+B2, tech T1 clocked in, auditor A"
            - "ROUTINE request R1 (bed B1) assigned and started (reserve 2 DISINFECTANT + 4 CLOTH)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
