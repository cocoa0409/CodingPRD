        claim_type: violation_to_error
        grounds: [calculations.backtest_run_selection, "errors[ERR_NO_FINALIZED_RUN]"]
        distinguishing_aspect: "The backtest run selector on an empty candidate set rejects with ERR_NO_FINALIZED_RUN (409) — no FINALIZED run of this model at or before backtest_period."
        test_recipe:
          setup: ["ACTIVE model; no runs at all"]
          setup_api_calls:
