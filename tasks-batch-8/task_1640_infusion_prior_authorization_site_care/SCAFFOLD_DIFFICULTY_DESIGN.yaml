  - rule_id: compensating_invariant
    instances:
      - name: appointment_create_cancel_conserves_chair_load
        grounds:
          - calculations.chair_occupied_count
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: chair_occupied_count(chair) = COUNT(appointments of the chair with status IN
          {SCHEDULED, CONFIRMED, COMPLETED}). Create (+1) followed by cancel (-1) returns the count to its
          pre-create value — zero drift in the occupancy count quantity.
        test_recipe:
          setup:
            - "Approved request (validity 90), OFFICE chair with no appointments; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9081", regimen_name: "InvA", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_ia: $.data.id } }
            - { call: "POST /infusion/infusion-chairs", payload: { site_type: "OFFICE", label: "CH-IA" }, as: PolicyAdmin, as_user_id: "admin-1", captures: { chair_ia: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1001", full_name: "Inv Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_ia: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_ia}", policy_id: "${pol_ia}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_ia: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_ia: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_ia}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_ia: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_ia}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_ia2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_ia2}" }, as: MedicalDirector, as_user_id: "md-2" }
          trigger:
            - { call: "GET /infusion/infusion-chairs/${chair_ia}/appointments", payload: {}, as: Scheduler, as_user_id: "sched-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ia}/appointments", payload: { chair_id: "${chair_ia}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_ia: $.data.id } }
            - { call: "POST /infusion/appointments/${appt_ia}/cancel", payload: {}, as: Scheduler, as_user_id: "sched-1", captures: { appt_ia_st: $.data.status } }
            - { call: "GET /infusion/infusion-chairs/${chair_ia}/appointments", payload: {}, as: Scheduler, as_user_id: "sched-1" }
          assert:
            - "First GET list: zero entries -> chair_occupied_count == 0"
            - "After create: chair_occupied_count == 1 (the SCHEDULED appointment)"
            - "After cancel: chair_occupied_count == 0 again (no drift); the list shows exactly 1 entry and its status == CANCELLED (CANCELLED rows remain queryable but are excluded from the conserved count)"
            - "InfusionAppointment.${appt_ia}.status == CANCELLED"
      - name: line_item_add_void_conserves_estimate
        grounds:
          - calculations.patient_responsibility_estimate
          - state_machines.FinancialClearance
          - entities.ResponsibilityLineItem.fields.status
        distinguishing_aspect: |
          Different conserved quantity: estimated_patient_responsibility_cents (money, not a count).
          Adding a line item (0 -> 60000) then voiding it returns the estimate to exactly 0 — the
          add/void pair leaves the conserved cents quantity unchanged.
        test_recipe:
          setup:
            - "Approved request; patient deductible_remaining_cents 50000, coinsurance 0.20; ESTIMATED clearance with zero line items (estimate 0)"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9082", regimen_name: "InvB", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_ib: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1002", full_name: "InvB Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_ib: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_ib}", policy_id: "${pol_ib}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_ib: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_ib: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_ib}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_ib: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_ib}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_ib2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_ib2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_ib}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_ib: $.data.id, est0: $.data.estimated_patient_responsibility_cents } }
          trigger:
            - { call: "POST /infusion/financial-clearances/${fc_ib}/line-items", payload: { description: "drug", allowed_amount_cents: 100000, billed_charges_cents: 100000 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { li_ib: $.data.id, share_ib: $.data.patient_share_cents } }
            - { call: "GET /infusion/financial-clearances/${fc_ib}", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { est_mid: $.data.estimated_patient_responsibility_cents } }
            - { call: "POST /infusion/responsibility-line-items/${li_ib}/voids", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { li_st: $.data.status } }
            - { call: "GET /infusion/financial-clearances/${fc_ib}", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { est_final: $.data.estimated_patient_responsibility_cents } }
          assert:
            - "Initial estimate == 0"
            - "Line item patient_share_cents == 60000 (deductible 50000 + coinsurance round_half_up(50000*0.20) = 10000)"
            - "Estimate after add == 60000; after void == 0 == initial value (add/void pair conserves the cents quantity)"
            - "ResponsibilityLineItem.${li_ib}.status == VOIDED and is excluded from the estimate input set"
