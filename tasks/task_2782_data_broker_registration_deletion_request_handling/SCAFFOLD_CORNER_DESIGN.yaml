  - section: state_machines
    instances:
      - name: registration_accept_attempted_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Registration.transitions.SUBMITTED_to_ACCEPTED
          - validations.priority_20.ERR_REGISTRATION_INVALID_STATE
        distinguishing_aspect: >
          ACCEPTED is reachable only from SUBMITTED, so accepting a DRAFT filing must return
          ERR_REGISTRATION_INVALID_STATE at HTTP 409 and must not settle any fee: the broker's
          fee_paid_cents stays 0 and fee_credit_cents stays at the full deposit.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA with a 500000-cent deposit."
            - "One Registration for CA covering 2026-09-01 to 2027-03-01, left in DRAFT with no disclosures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/accept"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_REGISTRATION_INVALID_STATE, http_status: 409 }
          assert:
            - "the response carries data.error_id == ERR_REGISTRATION_INVALID_STATE with HTTP 409"
            - "Registration.${reg_id}.status == DRAFT"
            - "Registration.${reg_id}.accepted_at == null"
            - "Registration.${reg_id}.charged_fee_cents == 0"
            - "DataBroker.${broker_id}.fee_paid_cents == 0"
            - "DataBroker.${broker_id}.fee_credit_cents == 500000"

      - name: downstream_recipient_starts_active_at_the_reliability_baseline
        claim_type: initial_state
        grounds:
          - state_machines.DownstreamRecipient.initial_state
          - calculations.recipient_reliability_score.constants.RELIABILITY_START
          - endpoints.POST_downstream_recipients
        distinguishing_aspect: >
          A newly registered recipient must start ACTIVE with reliability_score 90.00 and all four
          outcome counters at 0 — the score is a decay curve seeded at RELIABILITY_START, not a
          zero that climbs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one DataBroker operating in CA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          trigger:
