        grounds:
          - calculations.account_credit_ledger
          - calculations.cut_order_credit_reservation
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          A 120.0-yard order at 4275 cents/yard reserves 513000 cents; cancelling it drops
          credit_used_cents to 0 and zeroes the order's own reserved_credit_cents, so a subsequent
          10.0-yard order sees only its own 42750 — cancelled orders leave no residue in the ledger.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 at 4275 cents/yard and Account AC-01 with a 600000-cent limit."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 600000 }
              as: MillPlanner
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 120.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co1: $.data.id }
            - call: "GET /mill/accounts/${acct}"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/cut-orders/${co1}/cancel"
              payload: { reason: "dealer withdrew" }
              as: MillPlanner
            - call: "GET /mill/accounts/${acct}"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 10.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co2: $.data.id }
            - call: "GET /mill/accounts/${acct}"
              payload: {}
              as: MillPlanner
          assert:
            - "CutOrder.${co1}.reserved_credit_cents == 513000"
            - "on the first GET, Account.${acct}.credit_used_cents == 513000 and Account.${acct}.status == ACTIVE"
            - "after the cancel, CutOrder.${co1}.status == CANCELLED and CutOrder.${co1}.reserved_credit_cents == 0"
            - "on the second GET, Account.${acct}.credit_used_cents == 0"
            - "CutOrder.${co2}.reserved_credit_cents == 42750"
            - "on the third GET, Account.${acct}.credit_used_cents == 42750 and Account.${acct}.status == ACTIVE"

      - name: dye_lot_uncommitted_yards_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.dye_lot_uncommitted_yards
          - entities.DyeLot.fields.uncommitted_yards
          - entities.DyeLot.fields.shipped_basis_uncommitted_yards
        excluded_because:
          difficulty_instance: dye_lot_uncommitted_yards_commitment_aware_vs_shipped_only
          rationale: "The named §1.8 instance asserts both persisted variants on identical data (280.0 vs 400.0) and their convergence after shipping."

      - name: recycled_content_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.style_recycled_content_pct
          - endpoints[GET /mill/styles/{style_id}/recycled-content]
        excluded_because:
          difficulty_instance: style_recycled_content_mass_balance_vs_physical_segregation
          rationale: "The named §1.8 instance reads both bases off the same qualifying mass set (30.00 pct vs 0.00 pct) from one computed-read response."

      - name: nsf_140_basis_selects_the_variant_corner
        claim_type: variant_selection
        grounds:
          - entities.Certification.fields.accounting_basis
          - validations[priority 14]
          - errors[ERR_RECYCLED_CONTENT_INSUFFICIENT]
        excluded_because:
          difficulty_instance: style_recycled_content_mass_balance_vs_physical_segregation
          rationale: "The named §1.8 instance issues NSF_140 under MASS_BALANCE and is refused under PHYSICAL_SEGREGATION on identical data, which is exactly the variant-selection claim."

      - name: uncommitted_yards_is_forward_looking_over_reservations_corner
        claim_type: forward_looking
        grounds:
          - calculations.dye_lot_uncommitted_yards
          - state_machines.DyeLot.APPROVED_to_EXHAUSTED
        excluded_because:
          difficulty_instance: dye_lot_uncommitted_yards_commitment_aware_vs_shipped_only
          rationale: "The named §1.8 instance shows a merely RESERVED commitment already removing yardage from the sellable pool, then re-evaluating on cut and ship."

      - name: machine_window_interval_merge_corner
        claim_type: interval_merge
        grounds:
          - calculations.machine_window_overlap
          - validations[priority 22]
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: tufter_window_exclusive_with_leading_changeover_and_half_open_end
          rationale: "The named §1.8 instance tests the changeover-extended start, the half-open end (gap 0 accepted) and the overlapping rejection on one machine."

      - name: vessel_capacity_interval_merge_corner
        claim_type: interval_merge
        grounds:
          - calculations.vessel_capacity_overlap
          - validations[priority 23]
          - errors[ERR_VESSEL_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: dye_vessel_capacity_aggregates_over_closed_touching_windows
          rationale: "The named §1.8 instance aggregates contending lot_kg across closed touching windows and asserts the boundary-instant sum against capacity."

  # ===========================================================================
  # SECTION 4 — VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:
      - name: reusing_a_style_code_returns_duplicate_code
        claim_type: violation_to_error
        grounds:
          - validations[priority 7]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: |
          style_code is a natural key: a second POST with the same code is refused with 409 even
          though every other field differs, and the first style keeps its identity.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "CUSTOM", gauge_code: "G_1_8", pile_construction: "LOOP", pile_height_mm: 6.0, pattern_repeat_mm: 250.0, plies: 2, target_face_weight_oz: 28.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 5100 }
              as: MillPlanner
            - call: "GET /mill/styles"
              payload: { limit: 10, offset: 0 }
              as: MillPlanner
          assert:
            - "HTTP 409 with error.error_id == ERR_DUPLICATE_CODE"
            - "the list returns meta.total_count == 1 and data[0].id == ${st}"
            - "data[0].line_type == RUNNING_LINE and data[0].gauge_code == G_1_10"

      - name: melt_flow_index_below_twelve_blocks_fiber_batch_creation
        claim_type: violation_to_error
        grounds:
          - validations[priority 17]
          - errors[ERR_MELT_FLOW_OUT_OF_RANGE]
          - calculations.polymer_mass_conservation
        distinguishing_aspect: |
          MIN_MELT_FLOW_INDEX 12.0 is inclusive: a lot at 12.0 spins and a lot at 11.9 does not, and
          the refused draw leaves the low-MFI lot's available_kg untouched — the mass reservation is
          not applied before the feedstock gate.
        test_recipe:
          setup:
            - "PolymerLot PL-OK at melt_flow_index 12.0 and PolymerLot PL-LOW at 11.9, both 5000.000 kg."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-OK", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 12.0 }
              as: ExtrusionOperator
              captures: { plok: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-LOW", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 11.9 }
              as: ExtrusionOperator
              captures: { pllow: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-LOW", polymer_lot_id: "${pllow}", input_kg: 1000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-OK", polymer_lot_id: "${plok}", input_kg: 1000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fbok: $.data.id }
          assert:
            - "the FB-LOW create returns HTTP 422 with error.error_id == ERR_MELT_FLOW_OUT_OF_RANGE"
            - "PolymerLot.${pllow}.available_kg == 5000.000 and PolymerLot.${pllow}.reserved_kg == 0.000"
            - "the FB-OK create returns HTTP 201 with FiberBatch.${fbok}.status == QUEUED"
            - "PolymerLot.${plok}.available_kg == 4000.000 and PolymerLot.${plok}.reserved_kg == 1000.000"

      - name: blending_two_different_polymer_types_returns_blend_incompatible
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 17]
          - errors[ERR_POLYMER_BLEND_INCOMPATIBLE]
          - entities.FiberBatch.fields.blend_polymer_lot_id
        distinguishing_aspect: |
          The blend gate reads the *other* lot's polymer_type: NYLON_66 + PET is refused while
          NYLON_66 + NYLON_66 is accepted, with both lots' reserved_kg moving only in the accepted
          case.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-A and PL-N66-B (NYLON_66) and PL-PET (PET), each 5000.000 kg at melt_flow_index 18.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-A", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pla: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-B", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { plb: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-PET", polymer_type: "PET", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { plp: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-BAD", polymer_lot_id: "${pla}", input_kg: 3000.000, blend_polymer_lot_id: "${plp}", blend_input_kg: 1000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-GOOD", polymer_lot_id: "${pla}", input_kg: 3000.000, blend_polymer_lot_id: "${plb}", blend_input_kg: 1000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fbg: $.data.id }
          assert:
            - "the FB-BAD create returns HTTP 422 with error.error_id == ERR_POLYMER_BLEND_INCOMPATIBLE"
            - "PolymerLot.${plp}.reserved_kg == 0.000 and PolymerLot.${pla}.reserved_kg == 3000.000 only after the accepted create"
            - "the FB-GOOD create returns HTTP 201"
            - "PolymerLot.${pla}.available_kg == 2000.000 and PolymerLot.${plb}.available_kg == 4000.000"
            - "FiberBatch.${fbg}.blend_input_kg == 1000.000"

      - name: drawing_more_mass_than_is_available_returns_mass_unavailable
        claim_type: aggregate_validation
        grounds:
          - validations[priority 17]
          - errors[ERR_POLYMER_MASS_UNAVAILABLE]
          - calculations.polymer_mass_conservation
        distinguishing_aspect: |
          Each draw is individually smaller than received_kg, but the second 600.000 kg draw exceeds
          what is left after the first — the gate is against available_kg, not received_kg, and a
          draw of exactly the remainder is admitted.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-01 with received_kg 1000.000."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 1000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-A", polymer_lot_id: "${pl}", input_kg: 600.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fba: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-B", polymer_lot_id: "${pl}", input_kg: 600.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-C", polymer_lot_id: "${pl}", input_kg: 400.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fbc: $.data.id }
          assert:
            - "the FB-B create returns HTTP 422 with error.error_id == ERR_POLYMER_MASS_UNAVAILABLE"
            - "the FB-C create returns HTTP 201 (400.000 is exactly the remainder)"
            - "PolymerLot.${pl}.available_kg == 0.000 and PolymerLot.${pl}.reserved_kg == 1000.000 and PolymerLot.${pl}.status == DEPLETED"
            - "GET /mill/fiber-batches?polymer_lot_id=${pl} returns meta.total_count == 2"

      - name: reclaim_contamination_gate_is_inclusive_at_twelve_percent
        claim_type: violation_to_error
        grounds:
          - validations[priority 21]
          - errors[ERR_RECLAIM_CONTAMINATION_EXCEEDED]
          - calculations.reclamation_yield
        distinguishing_aspect: |
          MAX_RECLAIM_CONTAMINATION_PCT 12.0 is inclusive and is enforced at depolymerize, not at
          intake: both batches log fine, then 12.0 yields polymer and 12.1 is refused with the batch
          left in RECEIVED and no lot minted.
        test_recipe:
          setup:
            - "ReclamationBatch RB-EDGE at contamination_pct 12.0 and RB-DIRTY at 12.1, both 10000.0 lb NYLON_66."
          setup_api_calls:
            - call: "POST /mill/reclamation-batches"
              payload: { batch_code: "RB-EDGE", intake_lbs: 10000.0, face_fiber_type: "NYLON_66", contamination_pct: 12.0 }
              as: ExtrusionOperator
              captures: { rbe: $.data.id }
            - call: "POST /mill/reclamation-batches"
              payload: { batch_code: "RB-DIRTY", intake_lbs: 10000.0, face_fiber_type: "NYLON_66", contamination_pct: 12.1 }
              as: ExtrusionOperator
              captures: { rbd: $.data.id }
          trigger:
            - call: "POST /mill/reclamation-batches/${rbd}/depolymerize"
              payload: {}
              as: ExtrusionOperator
            - call: "POST /mill/reclamation-batches/${rbe}/depolymerize"
              payload: {}
              as: ExtrusionOperator
            - call: "GET /mill/polymer-lots"
              payload: { reclaim_source: "POST_CONSUMER", limit: 10, offset: 0 }
              as: ExtrusionOperator
          assert:
            - "both intake POSTs returned HTTP 201 with status RECEIVED"
            - "the RB-DIRTY depolymerize returns HTTP 422 with error.error_id == ERR_RECLAIM_CONTAMINATION_EXCEEDED"
            - "ReclamationBatch.${rbd}.status == RECEIVED, depolymerized_kg == 0 and output_polymer_lot_id is null"
            - "the RB-EDGE depolymerize returns HTTP 200 with depolymerized_kg == 1562.172"
            - "the POST_CONSUMER list returns meta.total_count == 1"

      - name: solution_color_code_presence_must_match_the_declared_dye_method
        claim_type: conditional_validation
        grounds:
          - validations[priority 16]
          - errors[ERR_DYE_METHOD_COLOR_MISMATCH]
          - entities.CarpetStyle.fields.solution_color_code
        distinguishing_aspect: |
          The colour field is required *exactly* when dye_method is SOLUTION_DYED, so both a
          SOLUTION_DYED style with no colour and a PIECE_DYED style carrying one are refused with the
          same error — the rule is bidirectional, not a plain required-field check, and it is a
          priority-16 route error rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-A", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
            - call: "POST /mill/styles"
              payload: { style_code: "ST-B", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-X", polymer_lot_id: "00000000-0000-4000-8000-000000000404", input_kg: 100.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
            - call: "GET /mill/styles"
              payload: { limit: 10, offset: 0 }
              as: MillPlanner
          assert:
            - "the ST-A create returns HTTP 422 with error.error_id == ERR_DYE_METHOD_COLOR_MISMATCH"
            - "the ST-B create returns HTTP 422 with error.error_id == ERR_DYE_METHOD_COLOR_MISMATCH"
            - "the FB-X create returns HTTP 422 with error.error_id == ERR_DYE_METHOD_COLOR_MISMATCH (priority 16 outranks the priority-6 unknown polymer_lot_id)"
            - "the list returns meta.total_count == 0"

      - name: piece_dyed_style_with_solution_dyed_fiber_returns_dye_method_mismatch
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 16]
          - errors[ERR_DYE_METHOD_MISMATCH]
          - endpoints[POST /mill/production-runs]
        distinguishing_aspect: |
          The run cannot pair a PIECE_DYED style with a SOLUTION_DYED fibre batch; the batch stays
          RELEASED (not ALLOCATED) after the refusal, so a compliant PIECE_DYED_READY batch can still
          be scheduled on the same machine window afterwards.
        test_recipe:
          setup:
            - "One 8000.000 kg lot; FB-SD (SOLUTION_DYED, SC-BEIGE-01) and FB-PD (PIECE_DYED_READY) both RELEASED at denier_actual 1200.0."
            - "ACTIVE PIECE_DYED style ST-PD-01 and machine TM-01 (G_1_10, changeover 0)."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 8000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-SD", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fbsd: $.data.id }
            - call: "POST /mill/fiber-batches/${fbsd}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fbsd}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-PD", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fbpd: $.data.id }
            - call: "POST /mill/fiber-batches/${fbpd}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fbpd}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-PD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
          trigger:
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-BAD", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fbsd}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-OK", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fbpd}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
          assert:
            - "the PR-BAD create returns HTTP 422 with error.error_id == ERR_DYE_METHOD_MISMATCH"
            - "FiberBatch.${fbsd}.status == RELEASED"
            - "the PR-OK create returns HTTP 201 with ProductionRun.${pr}.status == SCHEDULED"
            - "FiberBatch.${fbpd}.status == ALLOCATED"

      - name: face_weight_out_of_tolerance_leaves_the_run_in_tufting
        claim_type: violation_to_error
        grounds:
          - validations[priority 18]
          - errors[ERR_FACE_WEIGHT_OUT_OF_TOLERANCE]
          - calculations.face_weight_per_square_yard
        distinguishing_aspect: |
          The very setup that yields 32.04 oz/sy passes against a 32.00 target but fails against a
          25.00 target (deviation 7.04 > FACE_WEIGHT_TOLERANCE_OZ 1.6); the refused run stays TUFTING
          with greige_yards unset and its fibre batch still ALLOCATED, so the tolerance check runs
          before any state or ledger effect.
        test_recipe:
          setup:
            - "ACTIVE solution-dyed style ST-LIGHT with target_face_weight_oz 25.00, gauge G_1_10, pile 8.0 mm, plies 3."
            - "Run PR-01 loaded with G_1_10 / 8.0 mm / repeat 300.0 / stitch 10.0 off a RELEASED 1200.0-denier batch."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
