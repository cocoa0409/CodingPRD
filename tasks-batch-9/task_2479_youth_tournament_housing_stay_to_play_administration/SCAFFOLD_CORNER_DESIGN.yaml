              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bk_a2_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_b_id}", room_block_id: "${block10_id}", rooms_requested: 5, check_in_date: "2026-09-12", check_out_date: "2026-09-13", expected_registration_version: "${reg_b_v}" }
              as: HousingManager
              captures: { bk_b2_id: "$.data.id" }
            - call: "POST /housing/bookings/${bk_b2_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 3, minor_occupant_count: 0 }
              as: HousingManager
          trigger:
            - call: "POST /housing/bookings/${bk_b2_id}/confirm"
              payload: {}
              as: HousingManager
          assert:
            - "response.status == 200"
            - "Booking.${bk_a2_id}.nights == 2"
            - "Booking.${bk_a2_id}.projected_room_nights == 8"
            - "Booking.${bk_b2_id}.nights == 1"
            - "Booking.${bk_b2_id}.projected_room_nights == 5"
            - "RoomBlock.${block10_id}.rooms_committed == 5"
            - "RoomBlock.${block10_id}.rooms_available == 5"
            - "RoomBlock.${block10_id}.utilization_pct == 0.5"
            - "RoomBlock.${block10_id}.status == OPEN"

      - name: revenue_split_waterfall_bucket_order
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: revenue_share_split_admin_tier_keyed_on_gross_not_distributable
          rationale: |
            That instance pins the whole waterfall: the pinned bucket order organizer -> rights_holder
            -> destination, floor allocation per bucket, and the entire rounding remainder landing in
            the organizer bucket rather than being split or assigned by bucket size.

      - name: tournament_settles_only_after_distribution_paid
        claim_type: projection
        grounds:
          - calculations.tournament_posture
          - state_machines.Tournament (RECONCILING -> SETTLED)
          - state_machines.RevenueDistribution
        distinguishing_aspect: |
          SETTLED requires all three conditions at once. With the only invoice already PAID, condition
          (a) holds, but the tournament must still stay RECONCILING while the distribution is merely
          CALCULATED and again while it is only APPROVED — condition (c) demands PAID. The very last
          PAY call is what flips the posture, and the transition is evaluated only from RECONCILING,
          so the posture never regresses.
        test_recipe:
          setup:
            - "The fully collected fixture: invoice PAID at 10800 cents and one CALCULATED RevenueDistribution created by mgr-1."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
            - *sc_issue
            - *sc_remit_full
            - *sc_get_invoice
            - *sc_distribution
          trigger:
            - call: "GET /housing/tournaments/${tourn_id}"
              payload: {}
              as: HousingManager
            - call: "POST /housing/revenue-distributions/${dist_id}/advance"
              payload: { action: "APPROVE" }
              as: RightsHolder
              as_user_id: "rights-1"
            - call: "GET /housing/tournaments/${tourn_id}"
              payload: {}
              as: HousingManager
            - call: "POST /housing/revenue-distributions/${dist_id}/advance"
              payload: { action: "PAY" }
              as: HousingManager
              as_user_id: "mgr-1"
          assert:
            - "first response.data.posture == RECONCILING"
            - "third response.data.posture == RECONCILING"
            - "RevenueDistribution.${dist_id}.status == PAID"
            - "RevenueDistribution.${dist_id}.approved_by_user_id == rights-1"
            - "Tournament.${tourn_id}.posture == SETTLED"
            - "RebateInvoice.${inv_id}.status == PAID"
            - "RebateInvoice.${inv_id}.distributed_cents == 9936"

      - name: remedy_credit_clamped_by_credit_already_granted
        claim_type: weighted_scoring
        grounds:
          - calculations.complaint_remedy_credit
          - calculations.cancellation_penalty
          - entities.Booking.fields.penalty_credit_cents
        distinguishing_aspect: |
          The credit is a nested clamp over three inputs, and both arms are exercised on one booking.
          Cancelling 40 days out puts the stay in the quarter tier: ceil(12 * 0.25) = 3 penalty room
          nights at 14900 = 44700. The first complaint asks FEE_WAIVER for 60000 and is clamped to the
          44700 actually charged. The second complaint then asks RATE_ADJUSTMENT, whose raw formula
          value is round_half_up(12 * 14900 * 0.1) = 17880 — but uncredited_penalty is now
          44700 - 44700 = 0, so the credit must be 0 and the booking's penalty_credit_cents must stay
          at 44700 rather than climbing to 62580.
        test_recipe:
          setup:
            - "One 4-room booking confirmed then cancelled at 40 days out, so penalty_cents is 44700."
            - "One PRICING_FAIRNESS complaint on that booking, routed INVESTIGATE and upheld with FEE_WAIVER 60000, leaving penalty_credit_cents 44700."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_cancel
            - *sc_complaint_pricing
            - *sc_triage_investigate_3
            - *sc_uphold_fee_waiver
            - call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "PRICING_FAIRNESS", narrative: "the nightly rate itself was above the posted program rate", affected_booking_id: "${bk_id}" }
              as: HousingManager
              captures: { cmp5_id: "$.data.id" }
            - call: "POST /housing/complaints/${cmp5_id}/triage"
              payload: { route: "ESCALATE" }
              as: HousingManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /housing/complaints/${cmp5_id}/adjudicate"
              payload: { outcome: "UPHOLD", remedy_type: "RATE_ADJUSTMENT" }
              as: RightsHolder
              as_user_id: "rights-1"
          assert:
            - "response.status == 200"
            - "Complaint.${cmp3_id}.remedy_credit_cents == 44700"
            - "Complaint.${cmp5_id}.status == UPHELD"
            - "Complaint.${cmp5_id}.remedy_type == RATE_ADJUSTMENT"
            - "Complaint.${cmp5_id}.remedy_credit_cents == 0"
            - "Booking.${bk_id}.penalty_room_nights == 3"
            - "Booking.${bk_id}.penalty_cents == 44700"
            - "Booking.${bk_id}.penalty_credit_cents == 44700"

      - name: inventory_invariant_reaches_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: room_inventory_conservation_confirm_then_cancel
          rationale: |
            The two invariant calculations exist to be checked across a forward/compensating pair, and
            that instance walks the room-inventory propagation from booking to block counters to
            contract posture to tournament pressure and back to its starting fixed point with zero
            drift.

      - name: roster_requirement_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: roster_room_requirement_segregated_vs_pooled_occupancy
          rationale: |
            That instance feeds one roster (13 players, 3 staff) through both variants in a single
            create and asserts the 6-versus-4 divergence on required_rooms_registered and
            minimum_rooms_for_compliance in one assertion block.

      - name: roster_variant_selection_ceiling_versus_floor
        claim_type: variant_selection
        grounds:
          - calculations.roster_room_requirement.variants
          - validations[priority=84]
          - calculations.registration_compliance_status
        distinguishing_aspect: |
          Divergence is not enough: each variant must gate the RIGHT decision. The segregated value 6
          is the CEILING on rooms_requested, so a 7-room booking is refused with
          ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT, while the pooled value 4 is the FLOOR compliance is
          judged against, so a 4-room booking — two rooms short of the segregated requirement — still
          confirms to HOUSING_COMPLIANT. Swapping the two variants would accept 7 rooms and leave the
          4-room team NON_COMPLIANT.
        test_recipe:
          setup:
            - "One registration (13 players, 3 staff) on a 20-room block, so block capacity cannot be the reason any booking is refused."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 7, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
          assert:
            - "first response.status == 422"
            - "first response.error.error_id == ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT"
            - "TeamRegistration.${reg_id}.required_rooms_registered == 6"
            - "TeamRegistration.${reg_id}.minimum_rooms_for_compliance == 4"
            - "Booking.${bk_id}.rooms_requested == 4"
            - "TeamRegistration.${reg_id}.committed_rooms == 4"
            - "TeamRegistration.${reg_id}.status == HOUSING_COMPLIANT"

      - name: attrition_variant_reconciliation_on_invoice
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: attrition_shortfall_per_block_vs_contract_aggregate
          rationale: |
            The attrition variants never switch mid-life; they coexist on one invoice, one billed and
            one reported. That instance stores both on the same RebateInvoice and proves only the
            per-block figure reaches attrition_penalty_cents and total_due_cents.

  # ===========================================================================
  - section: validations
    instances:
      - name: revenue_shares_not_summing_to_unity_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_REVENUE_SHARE_NOT_UNITY]
        distinguishing_aspect: |
          The three share percentages must total exactly 1.00. 0.50 + 0.30 + 0.30 = 1.10 is each
          individually a legal fraction, so schema validation at priority 10 passes and the rule at
          priority 74 is what must fire: 422 ERR_REVENUE_SHARE_NOT_UNITY, with no Tournament row
          created.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *sc_clock
          trigger:
            - call: "POST /housing/tournaments"
              payload: { name: "Overshare Cup", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.30 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_REVENUE_SHARE_NOT_UNITY"
            - "response.error.error_id != ERR_INVALID_REQUEST"

      - name: revenue_shares_at_exact_unity_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=74]
          - endpoints[POST /housing/tournaments]
        distinguishing_aspect: |
          The same rule must let a satisfying payload through unchanged. Thirds that sum to exactly
          1.00 in two-decimal terms (0.34 + 0.33 + 0.33) are accepted and stored verbatim, proving the
          rule tests the sum rather than requiring equal or "round" shares.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *sc_clock
          trigger:
            - call: "POST /housing/tournaments"
              payload: { name: "Even Thirds Cup", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", share_pct_organizer: 0.34, share_pct_rights_holder: 0.33, share_pct_destination: 0.33 }
              as: HousingManager
              captures: { tourn_u_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Tournament.${tourn_u_id}.share_pct_organizer == 0.34"
            - "Tournament.${tourn_u_id}.share_pct_rights_holder == 0.33"
            - "Tournament.${tourn_u_id}.share_pct_destination == 0.33"
            - "Tournament.${tourn_u_id}.posture == OPEN"

      - name: state_category_outranks_fiscal_category
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_booking_create
          rationale: |
            That instance submits one booking that violates the state rule at priority 21 and the
            fiscal rule at priority 84 at once and pins the answer to ERR_TOURNAMENT_NOT_OPEN, which is
            the priority-ordering claim for this scaffold's widest category gap.

      - name: safety_category_outranks_referential_category
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: safety_beats_referential_on_rooming_list
          rationale: |
            That instance co-violates priority 30 and priority 64 on a single rooming-list submission
            where both rules return 422, so only the error_id distinguishes them — the sharpest form of
            the priority-conflict claim available here.

      - name: restricted_block_refuses_already_housed_team
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=68]
          - errors[ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS]
          - calculations.registration_compliance_status
        distinguishing_aspect: |
          Whether a booking is allowed depends on the state of a DIFFERENT entity: once the block is
          RESTRICTED its last room is reserved for teams still PENDING_HOUSING. A registration already
          settled as EXCEPTION_GRANTED is refused with 409 ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS even
          though it has no overlapping stay and the room physically exists, while an untouched
          PENDING_HOUSING registration takes that same room successfully. Both attempts pass the
          capacity rule at priority 86, so capacity cannot be the explanation.
        test_recipe:
          setup:
            - "A 10-room block driven to RESTRICTED with 9 rooms committed, leaving exactly 1 room."
            - "Registration C is EXCEPTION_GRANTED through a fully approved 4-room hardship exemption and has no bookings."
            - "Registration D is untouched and therefore PENDING_HOUSING."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_block10
            - *sc_teamA
            - *sc_regA
            - *sc_teamB
            - *sc_regB
            - *sc_bkA_overlap
            - *sc_rlA4
            - *sc_confirmA
            - *sc_bkB_overlap
            - *sc_rlB5
            - *sc_confirmB
            - call: "POST /housing/teams"
              payload: { name: "Charlie SC 13U", home_city: "Farville", home_state: "ST", org_contact_email: "charlie@example.com", distance_miles_from_venue: 170.0 }
              as: HousingManager
              captures: { team_c_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_c_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_c_id: "$.data.id" }
            - call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_c_id}", reason_code: "FINANCIAL_HARDSHIP", requested_rooms_exempt: 4, justification: "the club cannot fund program housing this season" }
              as: HousingManager
              captures: { exc_c_id: "$.data.id" }
            - call: "POST /housing/exception-requests/${exc_c_id}/review"
              payload: { action: "START_REVIEW" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - call: "POST /housing/exception-requests/${exc_c_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 4, decision_note: "documented hardship" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - call: "GET /housing/team-registrations/${reg_c_id}"
              payload: {}
              as: HousingManager
              captures: { reg_c_v: "$.data.version" }
            - call: "POST /housing/teams"
              payload: { name: "Delta SC 13U", home_city: "Farville", home_state: "ST", org_contact_email: "delta@example.com", distance_miles_from_venue: 180.0 }
              as: HousingManager
              captures: { team_d_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_d_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_d_id: "$.data.id", reg_d_v: "$.data.version" }
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_c_id}", room_block_id: "${block10_id}", rooms_requested: 1, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_c_v}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_d_id}", room_block_id: "${block10_id}", rooms_requested: 1, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_d_v}" }
              as: HousingManager
              captures: { bk_d_id: "$.data.id" }
          assert:
            - "TeamRegistration.${reg_c_id}.status == EXCEPTION_GRANTED"
            - "TeamRegistration.${reg_d_id}.status == PENDING_HOUSING"
            - "RoomBlock.${block10_id}.status == RESTRICTED"
            - "first response.status == 409"
            - "first response.error.error_id == ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS"
            - "second response.status == 201"
            - "Booking.${bk_d_id}.booking_status == DRAFT"
            - "Booking.${bk_d_id}.rooms_requested == 1"

      - name: booking_after_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=40]
          - errors[ERR_BOOKING_DEADLINE_PASSED]
          - entities.Tournament.fields.booking_deadline
        distinguishing_aspect: |
          The deadline is compared against the logical clock, not against the stay dates. Advancing the
          clock one day past booking_deadline makes an otherwise perfect booking — inside the block
          window, inside the roster ceiling, inside block capacity — fail with 422
          ERR_BOOKING_DEADLINE_PASSED, while the tournament posture is still OPEN so the state rule at
          priority 21 is not the reason.
        test_recipe:
          setup:
            - "An EXECUTED contract with a 20-room block and one registration; booking_deadline is 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: HousingManager
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_BOOKING_DEADLINE_PASSED"
            - "Tournament.${tourn_id}.posture == OPEN"
            - "TeamRegistration.${reg_id}.committed_rooms == 0"
            - "RoomBlock.${block_id}.rooms_committed == 0"

      - name: block_oversell_guard_counts_unconfirmed_holds
        claim_type: aggregate_validation
        grounds:
          - validations[priority=86]
          - errors[ERR_BLOCK_CAPACITY_EXCEEDED]
          - calculations.block_rooms_committed
        distinguishing_aspect: |
          Each booking is individually legal — 4 and 2 rooms against a 5-room block, both inside the
          6-room roster ceiling — but their collective per-night hold is 6, which exceeds the block. The
          guard uses the HELD set, so a DRAFT booking that has moved no counter at all still blocks the
          second request: rooms_committed reads 0 throughout, which is exactly why a rule that consulted
          rooms_committed instead of occupancy_held would have allowed the oversell.
        test_recipe:
          setup:
            - "An EXECUTED contract carrying a 5-room block and two registered teams."
            - "Team A holds a DRAFT 4-room booking on that block; it has never been confirmed."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_teamA
            - *sc_regA
            - *sc_teamB
            - *sc_regB
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "SUITE", block_size_rooms: 5, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block5_id: "$.data.id" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_a_id}", room_block_id: "${block5_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_a_v}" }
              as: HousingManager
              captures: { bk_a5_id: "$.data.id" }
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_b_id}", room_block_id: "${block5_id}", rooms_requested: 2, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_b_v}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_BLOCK_CAPACITY_EXCEEDED"
            - "Booking.${bk_a5_id}.booking_status == DRAFT"
            - "RoomBlock.${block5_id}.rooms_committed == 0"
            - "RoomBlock.${block5_id}.rooms_available == 5"
            - "RoomBlock.${block5_id}.utilization_pct == 0.0"

      - name: local_exemption_rejects_distant_team_only
        claim_type: conditional_validation
        grounds:
          - validations[priority=78]
          - errors[ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE]
          - calculations.roster_room_requirement
        distinguishing_aspect: |
          The rule applies only when the registration carries local_team_flag true, which is itself
          derived from the team's distance against LOCAL_TEAM_RADIUS_MILES 30. The 120-mile team's
          LOCAL_TEAM request is refused with 422 ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE while the 10-mile
          team's otherwise identical request is accepted — same endpoint, same reason_code, same room
          count, opposite outcome, decided purely by the derived flag.
        test_recipe:
          setup:
            - "One registration for a 120-mile team and one for a 10-mile team, both 13 players and 3 staff."
            - "Tournament housing_pressure is NORMAL, so an accepted LOCAL_TEAM request is not auto-approved."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - &sc_local_team
              call: "POST /housing/teams"
              payload: { name: "Metro Rec 16U", home_city: "Metro", home_state: "ST", org_contact_email: "metrorec@example.com", distance_miles_from_venue: 10.0 }
              as: HousingManager
              captures: { local_team_id: "$.data.id" }
            - &sc_local_registration
              call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${local_team_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { local_reg_id: "$.data.id" }
          trigger:
            - call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "LOCAL_TEAM", requested_rooms_exempt: 4, justification: "our families would rather drive in each morning" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - &sc_local_exception
              call: "POST /housing/exception-requests"
              payload: { registration_id: "${local_reg_id}", reason_code: "LOCAL_TEAM", requested_rooms_exempt: 4, justification: "every family lives within ten miles of the venue" }
              as: HousingManager
              captures: { local_exc_id: "$.data.id" }
          assert:
            - "TeamRegistration.${reg_id}.local_team_flag == false"
            - "TeamRegistration.${local_reg_id}.local_team_flag == true"
            - "first response.status == 422"
            - "first response.error.error_id == ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE"
            - "second response.status == 201"
            - "ExceptionRequest.${local_exc_id}.status == SUBMITTED"
            - "ExceptionRequest.${local_exc_id}.requested_rooms_exempt == 4"
            - "ExceptionRequest.${local_exc_id}.approved_rooms_exempt == 0"

      - name: exemption_range_check_runs_before_all_or_nothing_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=82]
          - validations[priority=83]
          - errors[ERR_APPROVED_EXEMPTION_OUT_OF_RANGE]
          - errors[ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN]
        distinguishing_aspect: |
          The all-or-nothing check at priority 83 is only meaningful once the range check at priority 82
          has established that approved_rooms_exempt is present and within 1..requested_rooms_exempt.
          Approving 5 of 4 rooms must therefore answer ERR_APPROVED_EXEMPTION_OUT_OF_RANGE, not
          ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN — even though 5 is also "not equal to 4". Approving 2 of
          4 then passes 82 and is caught by 83, and approving exactly 4 succeeds. All three attempts hit
          the same endpoint on the same request, so only rule ordering explains the three answers.
        test_recipe:
          setup:
            - "A 10-mile team's LOCAL_TEAM exception request for 4 rooms, taken to UNDER_REVIEW by reviewer rev-1."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_local_team
            - *sc_local_registration
            - *sc_local_exception
            - call: "POST /housing/exception-requests/${local_exc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /housing/exception-requests/${local_exc_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 5, decision_note: "granting five" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
              captures: { err1: "$.data.error_id" }
            - call: "POST /housing/exception-requests/${local_exc_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 2, decision_note: "granting two" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
              captures: { err2: "$.data.error_id" }
            - call: "POST /housing/exception-requests/${local_exc_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 4, decision_note: "all four rooms exempt" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
          assert:
            - "first response.status == 422"
            - "first response.error.error_id == ERR_APPROVED_EXEMPTION_OUT_OF_RANGE"
            - "second response.status == 422"
            - "second response.error.error_id == ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN"
            - "third response.status == 200"
            - "ExceptionRequest.${local_exc_id}.status == APPROVED"
            - "ExceptionRequest.${local_exc_id}.approved_rooms_exempt == 4"
            - "ExceptionRequest.${local_exc_id}.decided_by_user_id == rev-1"
            - "TeamRegistration.${local_reg_id}.exempt_rooms_granted == 4"
            - "TeamRegistration.${local_reg_id}.effective_required_rooms == 0"
            - "TeamRegistration.${local_reg_id}.status == EXCEPTION_GRANTED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: rebate_invoice_readable_by_id_and_by_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /housing/rebate-invoices]
          - endpoints[GET /housing/rebate-invoices/{id}]
          - endpoints[GET /housing/rebate-invoices]
        distinguishing_aspect: |
          The write route and both read routes must agree field for field on the same row: the invoice
          created for 10800 cents is retrievable by id and appears in the contract-filtered list with
          identical invoiced_room_nights, total_due_cents and outstanding_cents. There is no update or
          delete route for RebateInvoice, so its whole CRUD surface is create-plus-read and every later
          change comes through the lifecycle and remit action endpoints.
        test_recipe:
          setup:
            - "One EXECUTED contract with a 4-room booking actualized at 12 room nights."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
          trigger:
            - *sc_invoice
            - call: "GET /housing/rebate-invoices/${inv_id}"
              payload: {}
              as: HousingManager
            - call: "GET /housing/rebate-invoices"
              payload: { contract_id: "${contract_id}", status: "DRAFT", limit: 10, offset: 0 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          assert:
            - "first response.status == 201"
            - "second response.status == 200"
            - "second response.data.id == ${inv_id}"
            - "second response.data.period_label == 2026-09"
            - "second response.data.invoiced_room_nights == 12"
            - "second response.data.invoiced_rebate_cents == 10800"
            - "second response.data.total_due_cents == 10800"
            - "second response.data.outstanding_cents == 10800"
            - "second response.data.collected_cents == 0"
            - "second response.data.distributed_cents == 0"
            - "third response.pagination.total_count == 1"
            - "third response.data[0].id == ${inv_id}"
            - "third response.data[0].total_due_cents == 10800"

      - name: negotiation_action_endpoint_dispatch
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: hotel_contract_negotiation_revision_cycle
          rationale: |
            The negotiation route is the scaffold's richest action endpoint, and that instance drives
            all three of its actions across two revision cycles, verifying the transition target,
            revision_round and the countersignature stamp at each step.

      - name: rooming_list_batch_rejected_whole_on_one_bad_entry
        claim_type: bulk_action
        grounds:
          - endpoints[POST /housing/bookings/{id}/rooming-list]
          - validations[priority=32]
          - errors[ERR_ROOM_OCCUPANCY_EXCEEDED]
          - entities.RoomingListEntry
        distinguishing_aspect: |
          The rooming list is the only bulk write and it is all-or-nothing. Three of the four entries
          are perfectly legal, but room 3 carries 5 occupants against MAX_OCCUPANTS_PER_ROOM 4, so the
          entire batch is refused with 422 ERR_ROOM_OCCUPANCY_EXCEEDED: zero RoomingListEntry rows are
          persisted and the booking stays DRAFT at version 1. A per-entry skip-and-continue
          implementation would have left three rows behind.
        test_recipe:
          setup:
            - "One DRAFT booking of 4 rooms on a registration whose roster is 16 people."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
          trigger:
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 5, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 3, minor_occupant_count: 0 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/bookings/${bk_id}/rooming-list"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 422"
            - "first response.error.error_id == ERR_ROOM_OCCUPANCY_EXCEEDED"
            - "second response.pagination.total_count == 0"
            - "second response.data length == 0"
            - "Booking.${bk_id}.booking_status == DRAFT"
            - "Booking.${bk_id}.version == 1"

      - name: supersede_link_cancels_the_referenced_booking
        claim_type: cross_reference_link
        grounds:
          - entities.Booking.fields.supersedes_booking_id
          - validations[priority=70]
          - state_machines.Booking (CONFIRMED -> CANCELLED by supersede)
        distinguishing_aspect: |
          supersedes_booking_id is the self-referential link, and creating the link is what cancels the
          target: the earlier CONFIRMED booking moves to CANCELLED with cancelled_at stamped, and the
          registration's committed_rooms drops back to 0 because the replacement is still only DRAFT.
          Rule 55 exempts same-block stays, so re-housing a team into the same block on the same dates
          is legal and no overlap error masks the supersede behaviour.
        test_recipe:
          setup:
            - "One CONFIRMED 4-room booking on the 20-room block, so committed_rooms is 4 and the registration is HOUSING_COMPLIANT."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: HousingManager
              captures: { reg_v2: "$.data.version" }
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v2}", supersedes_booking_id: "${bk_id}" }
              as: HousingManager
              captures: { bk_new_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Booking.${bk_new_id}.supersedes_booking_id == ${bk_id}"
            - "Booking.${bk_new_id}.booking_status == DRAFT"
            - "Booking.${bk_id}.booking_status == CANCELLED"
            - "Booking.${bk_id}.cancelled_at == 2026-08-01T00:00:00.000Z"
            - "TeamRegistration.${reg_id}.committed_rooms == 0"
            - "TeamRegistration.${reg_id}.status == PENDING_HOUSING"
            - "RoomBlock.${block_id}.rooms_committed == 0"
            - "RoomBlock.${block_id}.rooms_available == 20"

      - name: room_block_read_route_serves_derived_counters
        claim_type: computed_read
        grounds:
          - endpoints[GET /housing/hotel-contracts/{id}/room-blocks]
          - calculations.block_rooms_committed
          - response_envelope
        distinguishing_aspect: |
          The nested read route must serve the derived trio for every block of the contract, not just
          the one that was touched: the booked 20-room block reports 4 / 16 / 0.2 while the untouched
          10-room block reports 0 / 10 / 0.0 in the same response. Rows come back in created_at ASC
          order, so the 20-room block created first is data[0].
        test_recipe:
          setup:
            - "An EXECUTED contract carrying a 20-room block with one CONFIRMED 4-room booking and a second, untouched 10-room block."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_block10
          trigger:
            - call: "GET /housing/hotel-contracts/${contract_id}/room-blocks"
              payload: { status: "OPEN", limit: 10, offset: 0 }
              as: RightsHolder
              as_user_id: "rights-1"
          assert:
            - "response.status == 200"
            - "response.pagination.total_count == 2"
            - "response.data[0].id == ${block_id}"
            - "response.data[0].rooms_committed == 4"
            - "response.data[0].rooms_available == 16"
            - "response.data[0].utilization_pct == 0.2"
            - "response.data[1].id == ${block10_id}"
            - "response.data[1].rooms_committed == 0"
            - "response.data[1].rooms_available == 10"
            - "response.data[1].utilization_pct == 0.0"

      - name: release_before_deadline_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=48]
          - errors[ERR_RELEASE_BEFORE_DEADLINE]
          - state_machines.RoomBlock (OPEN -> RELEASED)
          - calculations.block_rooms_committed
        distinguishing_aspect: |
          Release is gated on the logical clock reaching release_deadline, and the comparison is
          inclusive. At 2026-08-01 the call is refused with 422 ERR_RELEASE_BEFORE_DEADLINE and the
          block stays OPEN; after the clock moves to 2026-08-26 the identical call succeeds, all 20
          unsold rooms are recorded in rooms_released_unsold, and rooms_available switches to the
          RELEASED branch of the calculation, reporting 0 rather than 20.
        test_recipe:
          setup:
            - "An EXECUTED contract with one 20-room block, release_deadline 2026-08-25, and no bookings on it."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
          trigger:
            - call: "POST /housing/room-blocks/${block_id}/release"
              payload: {}
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: HousingManager
            - call: "POST /housing/room-blocks/${block_id}/release"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 422"
            - "first response.error.error_id == ERR_RELEASE_BEFORE_DEADLINE"
            - "third response.status == 200"
            - "RoomBlock.${block_id}.status == RELEASED"
            - "RoomBlock.${block_id}.rooms_released_unsold == 20"
            - "RoomBlock.${block_id}.rooms_committed == 0"
            - "RoomBlock.${block_id}.rooms_available == 0"
            - "HotelContract.${contract_id}.block_posture == AVAILABLE"

  # ===========================================================================
  # Table 6 requires every error id in the catalog to be reachable by at least one
  # test. Coverage map for the 64 declared ids:
  #   asserted in THIS section (claim_type triggerable) —
  #     ERR_TOURNAMENT_NOT_FOUND, ERR_HOTEL_NOT_FOUND, ERR_TEAM_NOT_FOUND,
  #     ERR_CONTRACT_NOT_FOUND, ERR_ROOM_BLOCK_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND,
  #     ERR_BOOKING_NOT_FOUND, ERR_EXCEPTION_REQUEST_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND,
  #     ERR_INVOICE_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND, ERR_MISSING_AUTH_HEADERS,
  #     ERR_UNKNOWN_ROLE, ERR_ACTOR_IDENTITY_UNKNOWN, ERR_ACTION_ROLE_MISMATCH,
  #     ERR_TOURNAMENT_NOT_RECONCILING, ERR_BLOCK_NOT_BOOKABLE, ERR_BOOKING_NOT_CONFIRMED,
  #     ERR_INVOICE_NOT_COLLECTED, ERR_APPEAL_LIMIT_REACHED, ERR_INVALID_DATE_RANGE,
  #     ERR_STAY_OUTSIDE_BLOCK_WINDOW, ERR_BLOCK_OUTSIDE_EVENT_WINDOW,
  #     ERR_RELEASE_DEADLINE_BEFORE_CUTOFF, ERR_ROOMING_LIST_INDEX_INVALID,
  #     ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH, ERR_ROOMING_LIST_OCCUPANT_MISMATCH,
  #     ERR_SUPERSEDE_TARGET_INVALID, ERR_REBATE_MODEL_FIELDS_INVALID,
  #     ERR_DUPLICATE_INVOICE_PERIOD, ERR_EXEMPTION_SCOPE_TOO_BROAD,
  #     ERR_EXEMPTION_EXCEEDS_REQUIREMENT, ERR_DUPLICATE_OPEN_EXCEPTION,
  #     ERR_REMITTANCE_EXCEEDS_OUTSTANDING, ERR_INVOICE_TOTAL_NOT_POSITIVE,
  #     ERR_REMEDY_FIELDS_INVALID, ERR_COMPLAINT_SUBJECT_MISSING
  #   asserted in EARLIER sections of this file —
  #     ERR_INVALID_REQUEST (entities: required_fields, type_constraints),
  #     ERR_INVALID_STATE (state_machines: invalid_transitions, terminal_state_lockdown,
  #       idempotency), ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE (state_machines:
  #       precondition_enforcement), ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT (calculations:
  #       variant_selection), ERR_REVENUE_SHARE_NOT_UNITY (validations: violation_to_error),
  #     ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS (validations: cross_entity_validation),
  #     ERR_BOOKING_DEADLINE_PASSED (validations: temporal_validation),
  #     ERR_BLOCK_CAPACITY_EXCEEDED (validations: aggregate_validation),
  #     ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE (validations: conditional_validation),
  #     ERR_APPROVED_EXEMPTION_OUT_OF_RANGE and ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN
  #       (validations: cascading_validation), ERR_ROOM_OCCUPANCY_EXCEEDED (endpoints:
  #       bulk_action), ERR_RELEASE_BEFORE_DEADLINE (endpoints: conditional_action)
  #   asserted in LATER sections of this file —
  #     ERR_ROLE_NOT_PERMITTED, ERR_TEAM_SCOPE_VIOLATION, ERR_HOTEL_SCOPE_VIOLATION,
  #     ERR_SOD_SAME_REVIEWER, ERR_SOD_ADJUDICATOR_CONFLICT,
  #     ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT (rbac), ERR_STALE_REGISTRATION_VERSION and
  #     ERR_STALE_INVOICE_VERSION (cross_cutting_complexity_layers)
  #   covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml — the six excluded_because stubs below.
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_error_id_selected_by_resource_type
        claim_type: triggerable
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_TOURNAMENT_NOT_FOUND]
          - errors[ERR_HOTEL_NOT_FOUND]
          - errors[ERR_TEAM_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_ROOM_BLOCK_NOT_FOUND]
          - errors[ERR_REGISTRATION_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_EXCEPTION_REQUEST_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_NOT_FOUND]
        distinguishing_aspect: |
          Existence failures do not share one generic code: the error_id is selected by the RESOURCE
          TYPE of the missing row, and body-level foreign keys are resolved the same way as path
          parameters. Eleven probes against the same fabricated UUID must therefore produce eleven
          DIFFERENT ids, all at 404 — a single ERR_NOT_FOUND, or reusing the path-parameter code for a
          body FK, fails this.
        test_recipe:
          setup:
            - "Only one Tournament exists, so that the hotel-contract and registration probes fail on their body FK rather than on the tournament."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
          trigger:
            - call: "GET /housing/tournaments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "00000000-0000-4000-8000-000000000000", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { e2: "$.data.error_id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "00000000-0000-4000-8000-000000000000", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { e3: "$.data.error_id" }
            - call: "GET /housing/hotel-contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e4: "$.data.error_id" }
            - call: "POST /housing/room-blocks/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: HousingManager
              captures: { e5: "$.data.error_id" }
            - call: "GET /housing/team-registrations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e6: "$.data.error_id" }
            - call: "GET /housing/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e7: "$.data.error_id" }
            - call: "GET /housing/exception-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e8: "$.data.error_id" }
            - call: "GET /housing/complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e9: "$.data.error_id" }
            - call: "GET /housing/rebate-invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e10: "$.data.error_id" }
            - call: "GET /housing/revenue-distributions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { e11: "$.data.error_id" }
          assert:
            - "every response.status == 404"
            - "${e1} == ERR_TOURNAMENT_NOT_FOUND"
            - "${e2} == ERR_HOTEL_NOT_FOUND"
            - "${e3} == ERR_TEAM_NOT_FOUND"
            - "${e4} == ERR_CONTRACT_NOT_FOUND"
            - "${e5} == ERR_ROOM_BLOCK_NOT_FOUND"
            - "${e6} == ERR_REGISTRATION_NOT_FOUND"
            - "${e7} == ERR_BOOKING_NOT_FOUND"
            - "${e8} == ERR_EXCEPTION_REQUEST_NOT_FOUND"
            - "${e9} == ERR_COMPLAINT_NOT_FOUND"
            - "${e10} == ERR_INVOICE_NOT_FOUND"
            - "${e11} == ERR_DISTRIBUTION_NOT_FOUND"

      - name: missing_auth_headers_and_invalid_role_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
          - errors[ERR_ACTOR_IDENTITY_UNKNOWN]
          - roles[TeamManager]
        distinguishing_aspect: |
          The three header checks are distinct and ordered. A request with no X-User-Role or X-User-ID
          at all is 401 ERR_MISSING_AUTH_HEADERS; a request whose X-User-Role is a plausible but
          undeclared role is 401 ERR_UNKNOWN_ROLE; and a request whose role is declared and permitted
          but whose X-User-ID matches no row of the backing entity is 403 ERR_ACTOR_IDENTITY_UNKNOWN.
          The third probe proves identity resolution is a separate step from role recognition, since
          TeamManager is a legitimate role on this endpoint.
        test_recipe:
          setup:
            - "One Tournament and one Team exist, so the third probe's failure can only be the unknown actor id."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_team
          trigger:
            - call: "GET /housing/tournaments/${tourn_id}"
              payload: {}
              as: "<no X-User-Role and no X-User-ID header sent>"
              captures: { e1: "$.data.error_id" }
            - call: "GET /housing/tournaments/${tourn_id}"
              payload: {}
              as: "TournamentDirector"
              as_user_id: "who-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: TeamManager
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e3: "$.data.error_id" }
          assert:
            - "first response.status == 401"
            - "${e1} == ERR_MISSING_AUTH_HEADERS"
            - "second response.status == 401"
            - "${e2} == ERR_UNKNOWN_ROLE"
            - "third response.status == 403"
            - "${e3} == ERR_ACTOR_IDENTITY_UNKNOWN"

      - name: hotel_representative_issuing_invoice_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=12]
          - errors[ERR_ACTION_ROLE_MISMATCH]
          - endpoints[POST /housing/rebate-invoices/{id}/lifecycle]
        distinguishing_aspect: |
          The lifecycle route admits both HousingManager and HotelRepresentative, so the role check at
          priority 3 passes for a hotel representative; it is the per-ACTION check at priority 12 that
          fails, because ISSUE is reserved to the housing manager while only DISPUTE is the hotel's to
          send. The answer must therefore be 403 ERR_ACTION_ROLE_MISMATCH, not
          ERR_ROLE_NOT_PERMITTED, and the invoice must stay DRAFT.
        test_recipe:
          setup:
            - "One DRAFT RebateInvoice for 10800 cents on an EXECUTED contract."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
          trigger:
            - call: "POST /housing/rebate-invoices/${inv_id}/lifecycle"
              payload: { action: "ISSUE" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.error.error_id == ERR_ACTION_ROLE_MISMATCH"
            - "response.error.error_id != ERR_ROLE_NOT_PERMITTED"
            - "RebateInvoice.${inv_id}.status == DRAFT"
            - "Tournament.${tourn_id}.posture == BOOKING_CLOSED"

      - name: actualization_while_tournament_open_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=22]
          - errors[ERR_TOURNAMENT_NOT_RECONCILING]
        distinguishing_aspect: |
          Actualization belongs to the post-booking phase: the tournament posture must already be
          BOOKING_CLOSED or RECONCILING. A perfectly CONFIRMED booking therefore cannot be actualized
          while the tournament is still OPEN, and the answer is 409 ERR_TOURNAMENT_NOT_RECONCILING
          rather than ERR_BOOKING_NOT_CONFIRMED, whose condition is satisfied.
        test_recipe:
          setup:
            - "One CONFIRMED 4-room booking on a tournament still in OPEN posture."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
          trigger:
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "premature report" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_TOURNAMENT_NOT_RECONCILING"
            - "response.error.error_id != ERR_BOOKING_NOT_CONFIRMED"
            - "Booking.${bk_id}.booking_status == CONFIRMED"
            - "Booking.${bk_id}.actualized_room_nights == 0"
            - "Booking.${bk_id}.rebate_status == NOT_DUE"

      - name: booking_on_released_block_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=24]
          - errors[ERR_BLOCK_NOT_BOOKABLE]
        distinguishing_aspect: |
          Only OPEN and RESTRICTED blocks are bookable. A RELEASED block has returned its inventory to
          the hotel, so a booking against it is 409 ERR_BLOCK_NOT_BOOKABLE even though the capacity
          rule at priority 86 would still find 20 unsold rooms in block_size_rooms.
        test_recipe:
          setup:
            - "An EXECUTED contract whose 20-room block was released after the clock passed its 2026-08-25 deadline."
            - "The booking deadline 2026-09-01 has not yet passed at the released-state clock of 2026-08-26."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - &sc_clock_after_release_deadline
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: HousingManager
            - &sc_release
              call: "POST /housing/room-blocks/${block_id}/release"
              payload: {}
              as: HousingManager
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_BLOCK_NOT_BOOKABLE"
            - "RoomBlock.${block_id}.status == RELEASED"
            - "RoomBlock.${block_id}.rooms_released_unsold == 20"

      - name: actualization_of_draft_booking_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=25]
          - errors[ERR_BOOKING_NOT_CONFIRMED]
        distinguishing_aspect: |
          The first actualization report requires booking_status CONFIRMED exactly. With the tournament
          already BOOKING_CLOSED the posture rule at priority 22 is satisfied, so a DRAFT booking must
          fail specifically with 409 ERR_BOOKING_NOT_CONFIRMED and no ActualizationReport row may be
          created.
        test_recipe:
          setup:
            - "One DRAFT booking of 4 rooms that was never given a rooming list, on a tournament whose booking phase is closed."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_close_booking
          trigger:
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "hotel reported an unconfirmed stay" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/bookings/${bk_id}/actualization-reports"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 409"
            - "first response.error.error_id == ERR_BOOKING_NOT_CONFIRMED"
            - "Tournament.${tourn_id}.posture == BOOKING_CLOSED"
            - "Booking.${bk_id}.booking_status == DRAFT"
            - "second response.pagination.total_count == 0"

      - name: distribution_from_issued_invoice_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=26]
          - errors[ERR_INVOICE_NOT_COLLECTED]
        distinguishing_aspect: |
          A revenue split can only be computed from money actually in hand, so the source invoice must
          be PARTIALLY_PAID or PAID. An ISSUED invoice with collected_cents 0 is refused with 409
          ERR_INVOICE_NOT_COLLECTED even though the tournament has already advanced to RECONCILING and
          the supplied expected_invoice_version is current.
        test_recipe:
          setup:
            - "One ISSUED RebateInvoice for 10800 cents with nothing remitted; the tournament is RECONCILING."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
            - *sc_issue
            - *sc_get_invoice
          trigger:
            - call: "POST /housing/revenue-distributions"
              payload: { tournament_id: "${tourn_id}", source_invoice_id: "${inv_id}", expected_invoice_version: "${inv_v}" }
              as: HousingManager
              as_user_id: "mgr-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_INVOICE_NOT_COLLECTED"
            - "Tournament.${tourn_id}.posture == RECONCILING"
            - "RebateInvoice.${inv_id}.status == ISSUED"
            - "RebateInvoice.${inv_id}.collected_cents == 0"

      - name: second_appeal_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=27]
          - errors[ERR_APPEAL_LIMIT_REACHED]
          - entities.ExceptionRequest.fields.appeal_count
        distinguishing_aspect: |
          MAX_EXCEPTION_APPEALS is 1 and the guard is appeal_count < 1, so the first APPEAL succeeds and
          raises the counter to 1 while the second is refused with 409 ERR_APPEAL_LIMIT_REACHED. The
          request must stay DENIED and appeal_count must stay 1 — a refused appeal does not consume
          another cycle.
        test_recipe:
          setup:
            - "One FAMILY_MEDICAL exception request denied by rev-1, appealed once, then denied again by rev-2, so appeal_count is 1 and status is DENIED."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
            - *sc_start_review
            - *sc_deny
            - call: "POST /housing/exception-requests/${exc_id}/team-action"
              payload: { action: "APPEAL", justification: "attaching the physician letter" }
              as: TeamManager
              as_user_id: "${team_id}"
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "DENY", decision_note: "still insufficient" }
              as: ExceptionReviewer
              as_user_id: "rev-2"
          trigger:
            - call: "POST /housing/exception-requests/${exc_id}/team-action"
              payload: { action: "APPEAL", justification: "third try" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_APPEAL_LIMIT_REACHED"
            - "ExceptionRequest.${exc_id}.status == DENIED"
            - "ExceptionRequest.${exc_id}.appeal_count == 1"
            - "ExceptionRequest.${exc_id}.decided_by_user_id == rev-2"

      - name: inverted_date_pair_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=42]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: |
          The later date of a supplied pair must be STRICTLY after the earlier one, so an end_date equal
          to start_date is as invalid as an inverted pair. Both probes are 422 ERR_INVALID_DATE_RANGE,
          which also shows the rule is not satisfied by a zero-length event.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *sc_clock
          trigger:
            - call: "POST /housing/tournaments"
              payload: { name: "Backwards Cup", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-13", end_date: "2026-09-10", booking_deadline: "2026-09-01T00:00:00Z", share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/tournaments"
              payload: { name: "Zero Night Cup", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-10", booking_deadline: "2026-09-01T00:00:00Z", share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { e2: "$.data.error_id" }
          assert:
            - "first response.status == 422"
            - "${e1} == ERR_INVALID_DATE_RANGE"
            - "second response.status == 422"
            - "${e2} == ERR_INVALID_DATE_RANGE"

      - name: stay_outside_block_window_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=44]
          - errors[ERR_STAY_OUTSIDE_BLOCK_WINDOW]
        distinguishing_aspect: |
          The stay must sit inside the block's own window, which is narrower than the event window: a
          check_out of 2026-09-14 exceeds the block's departure_date of 2026-09-13 and is refused with
          422 ERR_STAY_OUTSIDE_BLOCK_WINDOW. The date pair itself is well formed, so the rule at
          priority 42 is not the reason.
        test_recipe:
          setup:
            - "An EXECUTED contract with a 20-room block spanning 2026-09-10 to 2026-09-13 and one registration."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-14", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_STAY_OUTSIDE_BLOCK_WINDOW"
            - "RoomBlock.${block_id}.rooms_committed == 0"

      - name: block_beyond_event_window_pad_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=46]
          - errors[ERR_BLOCK_OUTSIDE_EVENT_WINDOW]
        distinguishing_aspect: |
          Blocks may straddle the event by BLOCK_WINDOW_PAD_DAYS 2 on each side, so for a 2026-09-10
          start the earliest legal arrival_date is 2026-09-08. An arrival of 2026-09-07 is one day past
          the pad and must be refused with 422 ERR_BLOCK_OUTSIDE_EVENT_WINDOW, while the release
          deadline and cutoff are consistent so the rule at priority 49 is not the reason.
        test_recipe:
          setup:
            - "One DRAFT HotelContract with cutoff_date 2026-08-20 on a tournament running 2026-09-10 to 2026-09-13."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
          trigger:
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 10, arrival_date: "2026-09-07", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_BLOCK_OUTSIDE_EVENT_WINDOW"
            - "HotelContract.${contract_id}.contracted_room_nights == 0"
            - "HotelContract.${contract_id}.status == DRAFT"

      - name: release_deadline_before_cutoff_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=49]
          - errors[ERR_RELEASE_DEADLINE_BEFORE_CUTOFF]
        distinguishing_aspect: |
          A block cannot be scheduled to release before the contract's own cutoff_date, because the
          hotel's attrition exposure is measured from the cutoff. A release_deadline of 2026-08-19
          against a cutoff of 2026-08-20 is 422 ERR_RELEASE_DEADLINE_BEFORE_CUTOFF; the block window
          itself is inside the padded event window, so priority 46 is satisfied.
        test_recipe:
          setup:
            - "One DRAFT HotelContract with cutoff_date 2026-08-20."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
          trigger:
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 10, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-19" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_RELEASE_DEADLINE_BEFORE_CUTOFF"
            - "HotelContract.${contract_id}.contracted_room_nights == 0"

      - name: rooming_list_index_gap_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=60]
          - errors[ERR_ROOMING_LIST_INDEX_INVALID]
        distinguishing_aspect: |
          Priority 60 owns the SHAPE of the index set: it must start at 1 and run without duplicates or
          gaps. Submitting 1, 2, 3, 5 for a 4-room booking has the right cardinality, so the count rule
          at priority 62 is satisfied and only the gap at 4 can explain the 422
          ERR_ROOMING_LIST_INDEX_INVALID.
        test_recipe:
          setup:
            - "One DRAFT booking of 4 rooms on a 16-person roster."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
          trigger:
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_ROOMING_LIST_INDEX_INVALID"
            - "response.error.error_id != ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH"
            - "Booking.${bk_id}.booking_status == DRAFT"

      - name: rooming_list_entry_count_mismatch_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=62]
          - errors[ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH]
        distinguishing_aspect: |
          Priority 62 owns the CARDINALITY comparison against Booking.rooms_requested, and the two
          rooming-list structural rules are layered so that both stay reachable: a set of 1, 2, 3, 4, 5
          is contiguous from 1 with no duplicates and no gaps, satisfying priority 60, yet it carries
          five entries for a four-room booking, so the answer is 422
          ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH.
        test_recipe:
          setup:
            - "One DRAFT booking of 4 rooms on a 16-person roster."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
          trigger:
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 3, minor_occupant_count: 0 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH"
            - "response.error.error_id != ERR_ROOMING_LIST_INDEX_INVALID"
            - "Booking.${bk_id}.booking_status == DRAFT"

      - name: rooming_list_occupant_total_above_roster_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=64]
          - errors[ERR_ROOMING_LIST_OCCUPANT_MISMATCH]
          - calculations.roster_room_requirement
        distinguishing_aspect: |
          The occupant total must fall in 1..roster total. A 13-person roster (11 players, 2 staff)
          still requires 4 rooms, so four rooms at four occupants each is structurally valid and every
          per-room cap at priority 32 is respected — but 16 heads against a 13-person roster is 422
          ERR_ROOMING_LIST_OCCUPANT_MISMATCH. This is the error that priority 30 suppresses in the
          difficulty design's priority pair, so it needs its own unmasked trigger.
        test_recipe:
          setup:
            - "One registration with 11 players and 2 staff, whose required_rooms_registered is 4 and roster total is 13."
            - "One DRAFT booking of 4 rooms for that registration."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 11, roster_staff_count: 2 }
              as: HousingManager
              captures: { reg_s_id: "$.data.id", reg_s_v: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_s_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_s_v}" }
              as: HousingManager
              captures: { bk_s_id: "$.data.id" }
          trigger:
            - call: "POST /housing/bookings/${bk_s_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "TeamRegistration.${reg_s_id}.required_rooms_registered == 4"
            - "TeamRegistration.${reg_s_id}.minimum_rooms_for_compliance == 4"
            - "response.status == 422"
            - "response.error.error_id == ERR_ROOMING_LIST_OCCUPANT_MISMATCH"
            - "Booking.${bk_s_id}.booking_status == DRAFT"

      - name: supersede_of_cancelled_booking_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=70]
          - errors[ERR_SUPERSEDE_TARGET_INVALID]
          - entities.Booking.fields.supersedes_booking_id
        distinguishing_aspect: |
          Supersession is a re-housing move, so its target must still be a live booking: DRAFT,
          ROOMING_LIST_SUBMITTED or CONFIRMED. A booking that the team already cancelled cannot be
          superseded — the answer is 422 ERR_SUPERSEDE_TARGET_INVALID. The registration version supplied
          is the post-cancellation one, so the concurrency rule at priority 15 is satisfied and cannot
          be the reason.
        test_recipe:
          setup:
            - "One 4-room booking that the team cancelled while it was still DRAFT, incurring the 40-days-out quarter tier penalty of 44700 cents."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_cancel
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: HousingManager
              captures: { reg_v2: "$.data.version" }
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v2}", supersedes_booking_id: "${bk_id}" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_SUPERSEDE_TARGET_INVALID"
            - "Booking.${bk_id}.booking_status == CANCELLED"
            - "Booking.${bk_id}.penalty_cents == 44700"

      - name: tiered_contract_carrying_flat_rebate_field_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=72]
          - errors[ERR_REBATE_MODEL_FIELDS_INVALID]
          - entities.HotelContract.fields.rebate_model
        distinguishing_aspect: |
          The rebate model decides which optional money fields are legal, and the check is exclusive in
          both directions: TIERED_PER_ROOM_NIGHT takes its rates from the tier constants and must carry
          NEITHER rebate_flat_cents_per_room_night nor rebate_percent. Supplying the flat field is 422
          ERR_REBATE_MODEL_FIELDS_INVALID, and a PER_ROOM_NIGHT_FLAT contract that OMITS the flat field
          fails the same rule, proving the requirement is not merely a whitelist.
        test_recipe:
          setup:
            - "One Tournament and one Hotel exist."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
          trigger:
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "TIERED_PER_ROOM_NIGHT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { e2: "$.data.error_id" }
          assert:
            - "first response.status == 422"
            - "${e1} == ERR_REBATE_MODEL_FIELDS_INVALID"
            - "second response.status == 422"
            - "${e2} == ERR_REBATE_MODEL_FIELDS_INVALID"

      - name: duplicate_invoice_period_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=76]
          - validations[priority=90]
          - errors[ERR_DUPLICATE_INVOICE_PERIOD]
        distinguishing_aspect: |
          Period labels are unique per contract, and that uniqueness check outranks the empty-scope
          check. After the first invoice sweeps the only ACCRUED booking into INVOICED, a second
          "2026-09" invoice on the same contract has BOTH problems — a duplicate label and an empty
          billable scope — and the lower-numbered priority 76 must win with 409
          ERR_DUPLICATE_INVOICE_PERIOD rather than 422 ERR_NO_BILLABLE_ROOM_NIGHTS.
        test_recipe:
          setup:
            - "One DRAFT RebateInvoice labelled 2026-09 already covers the contract's single actualized booking."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
          trigger:
            - call: "POST /housing/rebate-invoices"
              payload: { contract_id: "${contract_id}", period_label: "2026-09" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_DUPLICATE_INVOICE_PERIOD"
            - "response.error.error_id != ERR_NO_BILLABLE_ROOM_NIGHTS"
            - "RebateInvoice.${inv_id}.invoiced_room_nights == 12"

      - name: family_medical_request_above_one_room_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=79]
          - errors[ERR_EXEMPTION_SCOPE_TOO_BROAD]
        distinguishing_aspect: |
          FAMILY_MEDICAL is a narrow, single-room reason: requested_rooms_exempt must be exactly 1. A
          request for 2 rooms is 422 ERR_EXEMPTION_SCOPE_TOO_BROAD even though 2 is well within the
          registration's 4-room compliance minimum, so the rule at priority 80 is satisfied and the
          reason-code-specific cap is what fires.
        test_recipe:
          setup:
            - "One registration whose minimum_rooms_for_compliance is 4 and no exception requests yet."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
          trigger:
            - call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "FAMILY_MEDICAL", requested_rooms_exempt: 2, justification: "two siblings with medical needs" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_EXEMPTION_SCOPE_TOO_BROAD"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 0"

      - name: exemption_above_compliance_minimum_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=80]
          - errors[ERR_EXEMPTION_EXCEEDS_REQUIREMENT]
          - calculations.roster_room_requirement
        distinguishing_aspect: |
          An exemption can never exceed what the team actually owes: requested_rooms_exempt must be at
          most minimum_rooms_for_compliance, which is 4 for a 16-person roster, NOT the 6 rooms the
          roster physically needs. Requesting 5 is therefore 422 ERR_EXEMPTION_EXCEEDS_REQUIREMENT, and
          the reason code FINANCIAL_HARDSHIP keeps the single-room cap at priority 79 out of play.
        test_recipe:
          setup:
            - "One registration with 13 players and 3 staff: required_rooms_registered 6, minimum_rooms_for_compliance 4."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
          trigger:
            - call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "FINANCIAL_HARDSHIP", requested_rooms_exempt: 5, justification: "budget shortfall across five rooms" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "TeamRegistration.${reg_id}.required_rooms_registered == 6"
            - "TeamRegistration.${reg_id}.minimum_rooms_for_compliance == 4"
            - "response.status == 422"
            - "response.error.error_id == ERR_EXEMPTION_EXCEEDS_REQUIREMENT"

      - name: second_open_exception_request_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=81]
          - errors[ERR_DUPLICATE_OPEN_EXCEPTION]
        distinguishing_aspect: |
          A registration may have only one exception request in flight, and "in flight" spans the whole
          pre-decision set, not just SUBMITTED. With one SUBMITTED FAMILY_MEDICAL request already open,
          a second request under a DIFFERENT reason code is still 409 ERR_DUPLICATE_OPEN_EXCEPTION, so
          the uniqueness key is the registration alone.
        test_recipe:
          setup:
            - "One SUBMITTED FAMILY_MEDICAL exception request for 1 room on the registration."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
          trigger:
            - call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "FINANCIAL_HARDSHIP", requested_rooms_exempt: 4, justification: "second reason filed while the first is open" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_DUPLICATE_OPEN_EXCEPTION"
            - "ExceptionRequest.${exc_id}.status == SUBMITTED"

      - name: remittance_above_outstanding_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=88]
          - errors[ERR_REMITTANCE_EXCEEDS_OUTSTANDING]
          - calculations.rebate_invoice_amount
        distinguishing_aspect: |
          Hotels may not overpay a rebate invoice: amount_cents must fall in 1..outstanding_cents. On a
          10800-cent ISSUED invoice with nothing collected, 10801 is refused with 422
          ERR_REMITTANCE_EXCEEDS_OUTSTANDING while the ledger stays untouched, proving the clamp is
          enforced before any money is recorded.
        test_recipe:
          setup:
            - "One ISSUED RebateInvoice with total_due_cents 10800 and outstanding_cents 10800."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
            - *sc_issue
          trigger:
            - call: "POST /housing/rebate-invoices/${inv_id}/remit"
              payload: { amount_cents: 10801 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_REMITTANCE_EXCEEDS_OUTSTANDING"
            - "RebateInvoice.${inv_id}.collected_cents == 0"
            - "RebateInvoice.${inv_id}.outstanding_cents == 10800"
            - "RebateInvoice.${inv_id}.status == ISSUED"

      - name: issue_of_fully_offset_invoice_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=92]
          - errors[ERR_INVOICE_TOTAL_NOT_POSITIVE]
          - calculations.attrition_shortfall
          - calculations.rebate_invoice_amount
        distinguishing_aspect: |
          An invoice may legally be CREATED with a positive room-night scope and still be un-issuable,
          because the attrition penalty is netted against the rebate and the total is floored at zero.
          With attrition_threshold_pct 1.00 on a 60-room-night block and only 12 nights actualized, the
          48-night shortfall at 900 cents costs 43200 against a 10800-cent rebate, so total_due_cents is
          0 and ISSUE is refused with 422 ERR_INVOICE_TOTAL_NOT_POSITIVE. Creation must NOT have failed
          at priority 90, since invoiced_room_nights is 12.
        test_recipe:
          setup:
            - "A contract whose attrition threshold is the whole block: attrition_threshold_pct 1.00, penalty 900 cents per room night, flat rebate 900 cents per room night."
            - "A 20-room block over 3 nights (60 contracted room nights, threshold 60) with one 4-room booking actualized at 12 room nights."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 1.00, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { z_contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${z_contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { z_block_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${z_contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${z_contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - *sc_team
            - *sc_registration
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${z_block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { z_bk_id: "$.data.id" }
            - call: "POST /housing/bookings/${z_bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 4 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 4 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 3 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${z_bk_id}/confirm"
              payload: {}
              as: HousingManager
            - *sc_close_booking
            - call: "POST /housing/bookings/${z_bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "as stayed" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/rebate-invoices"
              payload: { contract_id: "${z_contract_id}", period_label: "2026-09" }
              as: HousingManager
              captures: { z_inv_id: "$.data.id" }
          trigger:
            - call: "POST /housing/rebate-invoices/${z_inv_id}/lifecycle"
              payload: { action: "ISSUE" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "RebateInvoice.${z_inv_id}.invoiced_room_nights == 12"
            - "RebateInvoice.${z_inv_id}.invoiced_rebate_cents == 10800"
            - "RebateInvoice.${z_inv_id}.attrition_penalty_cents == 43200"
            - "RebateInvoice.${z_inv_id}.total_due_cents == 0"
            - "response.status == 422"
            - "response.error.error_id == ERR_INVOICE_TOTAL_NOT_POSITIVE"
            - "RebateInvoice.${z_inv_id}.status == DRAFT"
            - "Tournament.${tourn_id}.posture == BOOKING_CLOSED"

      - name: fee_waiver_without_amount_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=94]
          - errors[ERR_REMEDY_FIELDS_INVALID]
        distinguishing_aspect: |
          Money-bearing remedies must carry their money: FEE_WAIVER requires remedy_amount_cents of at
          least 1 and an affected_booking_id on the complaint. Omitting the amount is 422
          ERR_REMEDY_FIELDS_INVALID — not a generic schema rejection, since the field is optional in the
          request shape and only becomes mandatory once the remedy type is chosen.
        test_recipe:
          setup:
            - "One INVESTIGATING pricing complaint that cites a booking."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_complaint_pricing
            - *sc_triage_investigate_3
          trigger:
            - call: "POST /housing/complaints/${cmp3_id}/adjudicate"
              payload: { outcome: "UPHELD", remedy_type: "FEE_WAIVER" }
              as: RightsHolder
              as_user_id: "rh-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_REMEDY_FIELDS_INVALID"
            - "Complaint.${cmp3_id}.status == INVESTIGATING"
            - "Booking.${bk_id}.penalty_credit_cents == 0"

      - name: complaint_without_any_subject_rejected
        claim_type: triggerable
        grounds:
          - validations[priority=96]
          - errors[ERR_COMPLAINT_SUBJECT_MISSING]
        distinguishing_aspect: |
          A complaint must name something concrete: at least one of registration_id,
          cited_exception_request_id or affected_booking_id. A narrative-only filing against the
          tournament is 422 ERR_COMPLAINT_SUBJECT_MISSING, which shows the three links are individually
          optional but collectively required.
        test_recipe:
          setup:
            - "One Tournament in OPEN posture."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
          trigger:
            - call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "PRICING", narrative: "the whole program feels overpriced" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_COMPLAINT_SUBJECT_MISSING"

      - name: booking_creation_after_booking_closed_error
        claim_type: triggerable
        grounds:
          - validations[priority=21]
          - errors[ERR_TOURNAMENT_NOT_OPEN]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_booking_create
          rationale: |
            That instance already drives POST /housing/bookings against a BOOKING_CLOSED tournament and
            asserts 409 ERR_TOURNAMENT_NOT_OPEN as the winner over the fiscal-category rule, so this
            error id is triggerable there.

      - name: booking_creation_on_unexecuted_contract_error
        claim_type: triggerable
        grounds:
          - validations[priority=23]
          - errors[ERR_CONTRACT_NOT_EXECUTED]
        excluded_because:
          difficulty_instance: booking_create_requires_contract_executed
          rationale: |
            That instance books against a NEGOTIATING contract and asserts 409
            ERR_CONTRACT_NOT_EXECUTED, then repeats the call after COUNTERSIGN to show the guard lifts.

      - name: unchaperoned_minor_room_error
        claim_type: triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_CHAPERONE_REQUIRED]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_rooming_list
          rationale: |
            That instance submits a rooming list whose room holds only minors AND miscounts the occupant
            total, and asserts the safety error ERR_CHAPERONE_REQUIRED wins; the occupant-total error is
            triggered unmasked by rooming_list_occupant_total_above_roster_rejected above.

      - name: overlapping_team_stay_error
        claim_type: triggerable
        grounds:
          - validations[priority=55]
          - errors[ERR_TEAM_STAY_OVERLAP]
        excluded_because:
          difficulty_instance: team_stay_closed_interval_adjacent_day_collision
          rationale: |
            That instance places one team in two different blocks on back-to-back stays and asserts 409
            ERR_TEAM_STAY_OVERLAP for the closed-interval adjacency.

      - name: hotel_night_capacity_error
        claim_type: triggerable
        grounds:
          - validations[priority=58]
          - errors[ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: hotel_aggregate_night_capacity_half_open_adjacency_allowed
          rationale: |
            That instance oversubscribes a hotel on one overlapping night to assert 409
            ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED, then shows the half-open adjacent block is accepted.

      - name: empty_billable_scope_error
        claim_type: triggerable
        grounds:
          - validations[priority=90]
          - errors[ERR_NO_BILLABLE_ROOM_NIGHTS]
        excluded_because:
          difficulty_instance: empty_invoice_scope_zero_room_nights
          rationale: |
            That instance creates an invoice on an EXECUTED contract with no actualized bookings and
            asserts 422 ERR_NO_BILLABLE_ROOM_NIGHTS rather than a zero-value invoice.

  - section: rbac
    instances:
      - name: each_role_performs_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles[HousingManager]
          - roles[ExceptionReviewer]
          - roles[RightsHolder]
          - roles[TeamManager]
          - roles[HotelRepresentative]
        distinguishing_aspect: |
          Each of the five roles owns at least one operation nobody else may perform, and all five must
          actually work when invoked by their owner. The walk exercises one exclusive route per role in a
          single scenario — TeamManager submits the rooming list, HousingManager confirms, the
          ExceptionReviewer opens review, the RightsHolder adjudicates and the HotelRepresentative files
          the actualization — so a permission table that is merely restrictive, denying everything, fails
          here rather than passing vacuously.
        test_recipe:
          setup:
            - "One DRAFT 4-room booking, one SUBMITTED exception request and one INVESTIGATING pricing complaint, all on the same OPEN tournament."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_exception_family
            - *sc_complaint_pricing
            - *sc_triage_investigate_3
          trigger:
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 4 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 4 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 3 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: TeamManager
              as_user_id: "${team_id}"
            - call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ExceptionReviewer
              as_user_id: "rev-9"
            - call: "POST /housing/complaints/${cmp3_id}/adjudicate"
              payload: { outcome: "DISMISSED", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rh-9"
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "final" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          assert:
            - "first response.status == 200"
            - "second response.status == 200"
            - "Booking.${bk_id}.booking_status == CONFIRMED"
            - "third response.status == 200"
            - "ExceptionRequest.${exc_id}.status == UNDER_REVIEW"
            - "fourth response.status == 200"
            - "Complaint.${cmp3_id}.status == DISMISSED"
            - "sixth response.status == 201"
            - "Booking.${bk_id}.actualized_room_nights == 12"
            - "Booking.${bk_id}.rebate_status == ACCRUED"

      - name: shared_operations_accept_either_permitted_role
        claim_type: shared_operations
        grounds:
          - roles[HousingManager].shared_operations
          - roles[TeamManager].shared_operations
          - roles[HotelRepresentative].shared_operations
        distinguishing_aspect: |
          Registration, booking and reading are deliberately shared: the housing manager may act on a
          team's behalf and the team manager may act for itself, and both paths must succeed with
          identical effect. The hotel representative additionally reads a booking in its own hotel. A
          model that treats every non-manager role as read-only, or that treats the manager as the only
          writer, fails this claim.
        test_recipe:
          setup:
            - "Two teams exist so each registration path uses a distinct team."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - call: "POST /housing/teams"
              payload: { name: "Lakeside SC 16U", home_city: "Lakeside", home_state: "OH", org_contact_email: "ops@lakeside.example", distance_miles_from_venue: 95.0 }
              as: HousingManager
