            - "UnderwritingCase.${c}.status == QUOTED (expiry does not move the case)"
      - name: claims_period_inclusive_month_span
        grounds:
          - state_machines.ClaimsExperience.PENDING_to_SUBMITTED
          - validations[priority=11]
          - errors[ERR_INSUFFICIENT_EXPERIENCE_MONTHS]
          - entities.ClaimsExperience.fields.months_of_experience
        distinguishing_aspect: |
          Interval semantics = closed-interval inclusive whole-month counting on resource
          ClaimsExperience (distinct from the Quote cutoff window): [2024-01-01, 2024-11-30]
          spans 11 inclusive months and is rejected (ERR_INSUFFICIENT_EXPERIENCE_MONTHS), while
