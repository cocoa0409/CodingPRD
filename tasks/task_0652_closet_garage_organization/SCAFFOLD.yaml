scenario: "652. Closet & Garage Organization Systems (California Closets style): in-home design & 3D rendering, space measure & component config, quote & deposit, manufacture & lead time, install scheduling & crew, change order, warranty & adjustment, financing"
domain_name: closet-garage-organization
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # A Project root owns DesignConsult / SpaceMeasure / ComponentConfig / Quote in a
  # nested tree; Crew, ManufactureOrder, InstallJob, ChangeOrder, WarrantyClaim and
  # FinancingApplication link by FK across the tree (flat references). Crew is a
  # shared resource across many InstallJobs (cross-aggregate).

  state_machine_shape: cyclic
  # Quote ↔ ChangeOrder revision loops (cyclic); InstallJob carries parallel
  # scheduling × payment-ish dimensions; Project is compound (auto-advances from
  # child states); ManufactureOrder is a linear lead-time pipeline.

  relationship_patterns:
    - one_to_many        # Project → DesignConsult, SpaceMeasure, ComponentConfig, Quote
    - cross_aggregate    # InstallJob → Crew (one crew serves many jobs)
    - polymorphic        # ChangeOrder.target references either a ComponentConfig revision or a scheduling change

  role_model: peer_roles
  # Customer owns their Project; Designer authors consults/measures/configs/quotes;
  # Scheduler books crews and install jobs; ManufacturingOps runs the plant;
  # PlatformAdmin operates clock/financing webhooks.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique customer login email"
        constraints: "unique (case-insensitive); non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer display name"
      - name: zip_code
        type: string
        source: input
        description: "Service zip; used to derive install_region"
        constraints: "5-digit string"
      - name: install_region
        type: enum
        source: computed
        description: "Region bucket derived from zip_code; crews are region-scoped"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}; first digit 0-2->NORTH, 3-4->SOUTH, 5-6->EAST, 7-9->WEST"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: room_type
        type: enum
        source: input
        description: "Space being organized"
        constraints: "one of {REACH_IN_CLOSET, WALK_IN_CLOSET, GARAGE, PANTRY, HOME_OFFICE}"
      - name: status
        type: enum
        source: computed
        description: "Compound lifecycle auto-derived from child states (see §1.2)"
        default: LEAD
        constraints: "one of {LEAD, DESIGNING, QUOTED, DEPOSIT_PAID, IN_MANUFACTURE, READY_TO_INSTALL, INSTALLING, COMPLETED, CANCELLED}"
      - name: financing_application_id
        type: string
        source: system
        description: "FK -> FinancingApplication.id; set when a financing application is opened, else null"
        default: null
      - name: accepted_quote_id
        type: string
        source: system
        description: "FK -> Quote.id; the Quote whose deposit was paid; null until DEPOSIT_PAID"
        default: null
      - name: balance_due_cents
        type: integer
        source: computed
        description: "accepted_quote.total_cents minus deposits applied minus financed_amount_cents; recomputed on deposit/financing/change-order events"
        default: 0
      - name: install_region
        type: enum
        source: computed
        description: "Copied from Customer.install_region at project creation; crews must match this"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"

  - name: DesignConsult
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: designer_user_id
        type: string
        source: input
        description: "Opaque Designer operator id who runs the consult"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Consult appointment start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Consult appointment end; must be strictly after scheduled_start"
      - name: status
        type: enum
        source: computed
        description: "Consult lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RENDERED, COMPLETED, CANCELLED}"
      - name: rendering_url
        type: string
        source: input
        description: "3D rendering artifact URL attached at RENDERED transition"
        default: null

  - name: SpaceMeasure
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: wall_count
        type: integer
        source: input
        description: "Number of walls measured"
        constraints: ">= 1"
      - name: linear_feet
        type: number
        source: input
        description: "Total linear feet of run to be fitted"
        constraints: "> 0"
      - name: ceiling_height_in
        type: number
        source: input
        description: "Ceiling height in inches"
        constraints: ">= 84"
      - name: confirmed
        type: boolean
        source: system
        description: "True once a ComponentConfig is FINALIZED against this measure (locks it)"
        default: false

  - name: ComponentConfig
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: space_measure_id
        type: string
        source: input
        description: "FK -> SpaceMeasure.id; the measure this config is fitted to"
      - name: material_grade
        type: enum
        source: input
        description: "Material tier driving per-unit cost"
        constraints: "one of {MELAMINE, LAMINATE, WOOD, PREMIUM_WOOD}"
      - name: line_items
        type: array
        source: input
        description: "Array of {component_type, quantity, unit_price_cents}; component_type in {SHELF, DRAWER, ROD, CABINET, PANEL, ACCESSORY}; quantity>=1; unit_price_cents>=0"
      - name: status
        type: enum
        source: computed
        description: "Config lifecycle; FINALIZED locks the underlying SpaceMeasure"
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, SUPERSEDED}"
      - name: total_units
        type: integer
        source: computed
        description: "Sum of line_items[].quantity; drives volume tier in quote pricing"
        default: 0

  - name: Quote
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: component_config_id
        type: string
        source: input
        description: "FK -> ComponentConfig.id; the FINALIZED config being priced"
      - name: status
        type: enum
        source: computed
        description: "Quote lifecycle (cyclic with ChangeOrder)"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, ACCEPTED, SUPERSEDED, EXPIRED, VOID}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Pre-discount line-item subtotal (see calc quote_estimate_pricing)"
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Volume + promo discount applied (see calc quote_estimate_pricing)"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on (subtotal - discount); region-rate applied"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents + tax_cents; the estimate the customer sees"
        default: 0
      - name: promo_code
        type: string
        source: input
        description: "Optional promotion code applied at issue time"
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Timestamp when quote moved DRAFT->ISSUED; anchors expiry window"
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: "issued_at + QUOTE_VALIDITY_DAYS; quote auto-EXPIRES past this on read-triggered sweep"
        default: null

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED quote being deposited against"
      - name: amount_cents
        type: integer
        source: input
        description: "Deposit amount the customer is paying now"
        constraints: ">= required deposit floor (see calc deposit_requirement)"
      - name: status
        type: enum
        source: computed
        description: "Deposit lifecycle"
        default: PENDING
        constraints: "one of {PENDING, CAPTURED, REFUNDED}"

  - name: ManufactureOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the accepted quote whose config is being built"
      - name: status
        type: enum
        source: computed
        description: "Manufacturing lead-time pipeline"
        default: QUEUED
        constraints: "one of {QUEUED, IN_PRODUCTION, READY, INSTALLED}"
      - name: lead_time_days
        type: integer
        source: computed
        description: "Computed promised lead time (see calc lead_time_estimate)"
        default: 0
      - name: promised_ready_date
        type: datetime
        source: computed
        description: "started_at + lead_time_days; the earliest date an InstallJob may be scheduled"
        default: null
      - name: started_at
        type: datetime
        source: system
        description: "Timestamp when order moved QUEUED->IN_PRODUCTION; anchors promised_ready_date"
        default: null

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_name
        type: string
        source: input
        description: "Install crew label"
      - name: region
        type: enum
        source: input
        description: "Region this crew serves; must match Project.install_region for assignment"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: daily_capacity_units
        type: integer
        source: input
        description: "Max ComponentConfig total_units this crew can install per calendar day"
        constraints: ">= 1"
      - name: active
        type: boolean
        source: input
        description: "Whether the crew is bookable"
        default: true

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: manufacture_order_id
        type: string
        source: input
        description: "FK -> ManufactureOrder.id; must be READY before scheduling"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; assigned install crew"
      - name: window_start
        type: datetime
        source: input
        description: "Install window start (ISO 8601 UTC); must be >= manufacture_order.promised_ready_date"
      - name: window_end
        type: datetime
        source: input
        description: "Install window end; must be strictly after window_start, same calendar day"
      - name: sched_status
        type: enum
        source: computed
        description: "Scheduling dimension (parallel with completion_status)"
        default: PROPOSED
        constraints: "one of {PROPOSED, BOOKED, RESCHEDULING, CANCELLED}"
      - name: completion_status
        type: enum
        source: computed
        description: "Completion dimension (parallel with sched_status)"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, DONE}"
      - name: units_booked
        type: integer
        source: computed
        description: "Copied from the accepted config total_units; consumed against crew daily capacity"
        default: 0

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: base_quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED quote being modified"
      - name: change_type
        type: enum
        source: input
        description: "Polymorphic change target"
        constraints: "one of {CONFIG_REVISION, SCHEDULE_CHANGE}"
      - name: revised_config_id
        type: string
        source: input
        description: "FK -> ComponentConfig.id; required when change_type=CONFIG_REVISION, else null"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Change-order lifecycle (cyclic: REJECTED can loop back to a new submission)"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, APPLIED}"
      - name: delta_cents
        type: integer
        source: computed
        description: "new_quote.total_cents - base_quote.total_cents (signed); see calc change_order_delta"
        default: 0

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project must be COMPLETED"
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the completed install being claimed against"
      - name: defect_type
        type: enum
        source: input
        description: "Class of defect"
        constraints: "one of {HARDWARE, FINISH, FIT, STRUCTURAL}"
      - name: status
        type: enum
        source: computed
        description: "Warranty lifecycle (branching: APPROVED forks to ADJUSTMENT vs REPLACEMENT)"
        default: FILED
        constraints: "one of {FILED, APPROVED, REJECTED, ADJUSTMENT_SCHEDULED, REPLACEMENT_ORDERED, RESOLVED}"
      - name: covered
        type: boolean
        source: computed
        description: "True if filed within WARRANTY_DAYS of install completion AND defect_type covered (see calc warranty_coverage)"
        default: false

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED quote being financed"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Amount the customer asks to finance"
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: "Repayment term"
        constraints: "one of {12, 24, 36, 48}"
      - name: status
        type: enum
        source: computed
        description: "Financing lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, DECLINED, FUNDED}"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Lender-approved principal; <= requested; set on APPROVED (see calc financing_approval)"
        default: 0
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Amortized monthly payment over term at APR (see calc financing_approval)"
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Project
    initial_state: LEAD
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: LEAD
        to: DESIGNING
        trigger: "POST /projects/{id}/design-consults (first consult created)"
        actor: Designer
        preconditions: ["project.status == LEAD"]
        side_effects: ["project.status auto-advances LEAD->DESIGNING", "increments Project.version by 1"]
      - from: DESIGNING
        to: QUOTED
        trigger: "POST /quotes/{id}/issue (first quote issued for this project)"
        actor: Designer
        preconditions: ["project.status == DESIGNING", "quote.status == DRAFT", "quote.component_config.status == FINALIZED"]
        side_effects: ["project.status auto-advances DESIGNING->QUOTED", "increments Project.version by 1"]
      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "POST /deposits/{id}/capture"
        actor: PlatformAdmin
        preconditions: ["project.status == QUOTED", "deposit.status == PENDING", "deposit.quote.status == ACCEPTED"]
        side_effects: ["project.accepted_quote_id set to deposit.quote_id", "recompute Project.balance_due_cents (calc balance_reconciliation)", "project.status auto-advances QUOTED->DEPOSIT_PAID", "increments Project.version by 1"]
      - from: DEPOSIT_PAID
        to: IN_MANUFACTURE
        trigger: "POST /manufacture-orders/{id}/start"
        actor: ManufacturingOps
        preconditions: ["project.status == DEPOSIT_PAID", "manufacture_order.status == QUEUED"]
        side_effects: ["project.status auto-advances DEPOSIT_PAID->IN_MANUFACTURE", "increments Project.version by 1"]
      - from: IN_MANUFACTURE
        to: READY_TO_INSTALL
        trigger: "POST /manufacture-orders/{id}/complete"
        actor: ManufacturingOps
        preconditions: ["project.status == IN_MANUFACTURE", "manufacture_order.status == IN_PRODUCTION"]
        side_effects: ["project.status auto-advances IN_MANUFACTURE->READY_TO_INSTALL", "increments Project.version by 1"]
      - from: READY_TO_INSTALL
        to: INSTALLING
        trigger: "POST /install-jobs/{id}/start"
        actor: Scheduler
        preconditions: ["project.status == READY_TO_INSTALL", "install_job.sched_status == BOOKED"]
        side_effects: ["project.status auto-advances READY_TO_INSTALL->INSTALLING", "increments Project.version by 1"]
      - from: INSTALLING
        to: COMPLETED
        trigger: "POST /install-jobs/{id}/complete"
        actor: Scheduler
        preconditions: ["project.status == INSTALLING", "install_job.completion_status == IN_PROGRESS"]
        side_effects: ["project.status auto-advances INSTALLING->COMPLETED", "recompute Project.balance_due_cents", "increments Project.version by 1"]
      - from: LEAD
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions: ["project.status == LEAD"]
        side_effects: ["cascade: all non-terminal DesignConsult of project -> CANCELLED", "cascade: all DRAFT/ISSUED Quote of project -> VOID", "increments Project.version by 1"]
        note: "Cancel only allowed before a deposit is captured; DEPOSIT_PAID and later are non-cancellable here."
      - from: DESIGNING
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions: ["project.status == DESIGNING"]
        side_effects: ["cascade: all non-terminal DesignConsult of project -> CANCELLED", "cascade: all DRAFT/ISSUED Quote of project -> VOID", "increments Project.version by 1"]
        note: "Same cascade as the LEAD cancel; allowed only before a deposit is captured."
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer
        preconditions: ["project.status == QUOTED"]
        side_effects: ["cascade: all non-terminal DesignConsult of project -> CANCELLED", "cascade: all DRAFT/ISSUED Quote of project -> VOID", "increments Project.version by 1"]
        note: "Last cancellable state; DEPOSIT_PAID and later are non-cancellable here."

  - entity: DesignConsult
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RENDERED
        trigger: "POST /design-consults/{id}/render"
        actor: Designer
        preconditions: ["consult.status == SCHEDULED", "rendering_url provided"]
        side_effects: ["sets consult.rendering_url", "increments DesignConsult.version by 1"]
      - from: RENDERED
        to: COMPLETED
        trigger: "POST /design-consults/{id}/complete"
        actor: Designer
        preconditions: ["consult.status == RENDERED"]
        side_effects: ["increments DesignConsult.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /design-consults/{id}/cancel"
        actor: Designer
        preconditions: ["consult.status == SCHEDULED"]
        side_effects: ["increments DesignConsult.version by 1"]

  - entity: ComponentConfig
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /component-configs/{id}/finalize"
        actor: Designer
        preconditions: ["config.status == DRAFT", "config.line_items non-empty", "config.space_measure.confirmed == false"]
        side_effects: ["recompute ComponentConfig.total_units (calc config_total_units)", "sets SpaceMeasure.confirmed = true (cascade: locks the measure)", "increments ComponentConfig.version by 1", "increments SpaceMeasure.version by 1"]
        note: "Cross-entity: a SpaceMeasure may back at most one FINALIZED config; confirmed flag enforces it."
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: ChangeOrder APPLIED with a revised_config_id replacing this config"
        actor: system
        preconditions: ["config.status == FINALIZED"]
        side_effects: ["increments ComponentConfig.version by 1"]

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /quotes/{id}/issue"
        actor: Designer
        preconditions: ["quote.status == DRAFT", "quote.component_config.status == FINALIZED"]
        side_effects: ["recompute subtotal_cents/discount_cents/tax_cents/total_cents (calc quote_estimate_pricing)", "sets issued_at = now", "sets expires_at = issued_at + QUOTE_VALIDITY_DAYS", "increments Quote.version by 1"]
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions: ["quote.status == ISSUED", "now <= quote.expires_at"]
        side_effects: ["increments Quote.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system: read-triggered sweep when now > expires_at"
        actor: system
        preconditions: ["quote.status == ISSUED", "now > quote.expires_at"]
        side_effects: ["increments Quote.version by 1"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: ChangeOrder of change_type=CONFIG_REVISION APPLIED, producing a new ACCEPTED quote"
        actor: system
        preconditions: ["quote.status == ACCEPTED"]
        side_effects: ["increments Quote.version by 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /projects/{id}/cancel (cascade)"
        actor: system
        preconditions: ["quote.status IN {DRAFT, ISSUED}"]
        side_effects: ["increments Quote.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /projects/{id}/cancel (cascade)"
        actor: system
        preconditions: ["quote.status IN {DRAFT, ISSUED}"]
        side_effects: ["increments Quote.version by 1"]

  - entity: Deposit
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: CAPTURED
        trigger: "POST /deposits/{id}/capture"
        actor: PlatformAdmin
        preconditions: ["deposit.status == PENDING", "deposit.quote.status == ACCEPTED", "deposit.amount_cents >= required deposit floor (calc deposit_requirement)"]
        side_effects: ["drives Project QUOTED->DEPOSIT_PAID", "creates ManufactureOrder (status QUEUED) for the project/quote", "recompute Project.balance_due_cents", "increments Deposit.version by 1"]
        note: "Cross-entity cascade: capture creates the ManufactureOrder child and advances the Project."
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /deposits/{id}/refund"
        actor: PlatformAdmin
        preconditions: ["deposit.status == CAPTURED", "deposit.project.status == DEPOSIT_PAID"]
        side_effects: ["recompute Project.balance_due_cents (refund restores balance)", "increments Deposit.version by 1"]
        note: "Compensation: refund undoes the deposit credit; balance_due returns to pre-deposit value."

  - entity: ManufactureOrder
    initial_state: QUEUED
    terminal_states: [INSTALLED]
    transitions:
      - from: QUEUED
        to: IN_PRODUCTION
        trigger: "POST /manufacture-orders/{id}/start"
        actor: ManufacturingOps
        preconditions: ["order.status == QUEUED", "order.project.status == DEPOSIT_PAID"]
        side_effects: ["recompute lead_time_days (calc lead_time_estimate)", "sets started_at = now", "sets promised_ready_date = started_at + lead_time_days days", "drives Project DEPOSIT_PAID->IN_MANUFACTURE", "increments ManufactureOrder.version by 1"]
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /manufacture-orders/{id}/complete"
        actor: ManufacturingOps
        preconditions: ["order.status == IN_PRODUCTION", "now >= order.promised_ready_date"]
        side_effects: ["drives Project IN_MANUFACTURE->READY_TO_INSTALL", "increments ManufactureOrder.version by 1"]
        note: "Lead-time gate: cannot complete before promised_ready_date (boundary >=)."
      - from: READY
        to: INSTALLED
        trigger: "system: InstallJob completion_status -> DONE"
        actor: system
        preconditions: ["order.status == READY"]
        side_effects: ["increments ManufactureOrder.version by 1"]

  - entity: InstallJob
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PROPOSED
        to: BOOKED
        trigger: "POST /install-jobs/{id}/book"
        actor: Scheduler
        preconditions:
          - "job.sched_status == PROPOSED"
          - "job.manufacture_order.status == READY"
          - "job.crew.active == true"
          - "job.crew.region == job.project.install_region"
          - "job.window_start >= job.manufacture_order.promised_ready_date"
          - "no crew capacity overlap (calc crew_day_capacity); booked units on crew/day + this job units <= crew.daily_capacity_units"
        side_effects: ["sets units_booked = accepted config total_units", "increments InstallJob.version by 1"]
        note: "Resource overlap: crew daily capacity across overlapping same-day jobs."
      - from: BOOKED
        to: RESCHEDULING
        trigger: "POST /install-jobs/{id}/request-reschedule"
        actor: Customer
        preconditions: ["job.sched_status == BOOKED", "job.completion_status == NOT_STARTED"]
        side_effects: ["frees the crew/day capacity held by this job", "increments InstallJob.version by 1"]
        note: "Cyclic: RESCHEDULING re-enters PROPOSED-style booking via /rebook."
      - from: RESCHEDULING
        to: BOOKED
        trigger: "POST /install-jobs/{id}/rebook"
        actor: Scheduler
        preconditions:
          - "job.sched_status == RESCHEDULING"
          - "new window_start >= job.manufacture_order.promised_ready_date"
          - "no crew capacity overlap on the new window (calc crew_day_capacity)"
        side_effects: ["sets new window_start/window_end", "re-holds crew/day capacity", "increments InstallJob.version by 1"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /install-jobs/{id}/cancel"
        actor: Scheduler
        preconditions: ["job.sched_status == BOOKED", "job.completion_status == NOT_STARTED"]
        side_effects: ["frees crew/day capacity", "increments InstallJob.version by 1"]
      # parallel completion dimension
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: Scheduler
        preconditions: ["job.sched_status == BOOKED", "job.completion_status == NOT_STARTED", "now >= job.window_start"]
        side_effects: ["drives Project READY_TO_INSTALL->INSTALLING", "increments InstallJob.version by 1"]
        note: "completion_status axis evolves independently of sched_status (parallel dimensions)."
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /install-jobs/{id}/complete"
        actor: Scheduler
        preconditions: ["job.completion_status == IN_PROGRESS"]
        side_effects: ["drives ManufactureOrder READY->INSTALLED", "drives Project INSTALLING->COMPLETED", "recompute Project.balance_due_cents", "increments InstallJob.version by 1"]
        note: "Cascade depth 3: install complete -> ManufactureOrder INSTALLED -> Project COMPLETED."

  - entity: ChangeOrder
    initial_state: SUBMITTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: Designer
        preconditions: ["co.status == SUBMITTED", "co.base_quote.status == ACCEPTED", "co.project.status IN {DEPOSIT_PAID, IN_MANUFACTURE}"]
        side_effects: ["recompute delta_cents (calc change_order_delta)", "increments ChangeOrder.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: Designer
        preconditions: ["co.status == SUBMITTED"]
        side_effects: ["increments ChangeOrder.version by 1"]
        note: "Cyclic: a rejected change can be resubmitted as a new ChangeOrder."
      - from: APPROVED
        to: APPLIED
        trigger: "POST /change-orders/{id}/apply"
        actor: Designer
        preconditions: ["co.status == APPROVED", "for CONFIG_REVISION: revised_config.status == FINALIZED"]
        side_effects:
          - "for CONFIG_REVISION: creates a new ACCEPTED Quote priced from revised_config (calc quote_estimate_pricing)"
          - "for CONFIG_REVISION: drives base_quote ACCEPTED->SUPERSEDED"
          - "for CONFIG_REVISION: drives the prior FINALIZED config -> SUPERSEDED"
          - "sets Project.accepted_quote_id = new quote id"
          - "recompute Project.balance_due_cents (delta applied)"
          - "increments ChangeOrder.version by 1"
        note: "Cascade depth 3: apply -> new Quote ACCEPTED + base Quote SUPERSEDED -> Project.accepted_quote_id + balance_due recompute."

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [REJECTED, RESOLVED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: ManufacturingOps
        preconditions: ["claim.status == FILED", "claim.covered == true"]
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: FILED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: ManufacturingOps
        preconditions: ["claim.status == FILED"]
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: APPROVED
        to: ADJUSTMENT_SCHEDULED
        trigger: "POST /warranty-claims/{id}/schedule-adjustment"
        actor: ManufacturingOps
        preconditions: ["claim.status == APPROVED", "claim.defect_type IN {FIT, FINISH}"]
        side_effects: ["increments WarrantyClaim.version by 1"]
        note: "Branch A: minor defects get an on-site adjustment."
      - from: APPROVED
        to: REPLACEMENT_ORDERED
        trigger: "POST /warranty-claims/{id}/order-replacement"
        actor: ManufacturingOps
        preconditions: ["claim.status == APPROVED", "claim.defect_type IN {HARDWARE, STRUCTURAL}"]
        side_effects: ["increments WarrantyClaim.version by 1"]
        note: "Branch B: major defects get a replacement; divergent side-effect set from Branch A."
      - from: ADJUSTMENT_SCHEDULED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve"
        actor: ManufacturingOps
        preconditions: ["claim.status IN {ADJUSTMENT_SCHEDULED, REPLACEMENT_ORDERED}"]
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: REPLACEMENT_ORDERED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve"
        actor: ManufacturingOps
        preconditions: ["claim.status IN {ADJUSTMENT_SCHEDULED, REPLACEMENT_ORDERED}"]
        side_effects: ["increments WarrantyClaim.version by 1"]

  - entity: FinancingApplication
    initial_state: DRAFT
    terminal_states: [DECLINED, FUNDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /financing-applications/{id}/submit"
        actor: Customer
        preconditions: ["app.status == DRAFT", "app.quote.status == ACCEPTED", "app.requested_amount_cents <= app.quote.total_cents"]
        side_effects: ["increments FinancingApplication.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /_financing/decision"
        actor: PlatformAdmin
        preconditions: ["app.status == SUBMITTED", "decision == APPROVE"]
        side_effects: ["recompute approved_amount_cents and monthly_payment_cents (calc financing_approval)", "increments FinancingApplication.version by 1"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /_financing/decision"
        actor: PlatformAdmin
        preconditions: ["app.status == SUBMITTED", "decision == DECLINE"]
        side_effects: ["increments FinancingApplication.version by 1"]
      - from: APPROVED
        to: FUNDED
        trigger: "POST /financing-applications/{id}/fund"
        actor: PlatformAdmin
        preconditions: ["app.status == APPROVED", "app.project.status IN {DEPOSIT_PAID, IN_MANUFACTURE, READY_TO_INSTALL}"]
        side_effects: ["sets Project.financing_application_id = app.id", "recompute Project.balance_due_cents (financed amount reduces balance)", "increments FinancingApplication.version by 1"]
        note: "Cross-entity: funding reduces the project's balance_due by approved_amount_cents."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: change-order-apply-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders/{id}/apply"
    occ_field: "expected_project_version"
    description: |
      Applying a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. A prior APPLY (or a funding /
      deposit event) legitimately supersedes the project's accepted_quote and
      bumps balance_due; the current applier's view of the project is therefore
      stale and must re-read before re-applying.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: deposit-capture-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /deposits/{id}/capture"
    occ_field: "expected_quote_version"
    description: |
      Capturing a Deposit against a Quote whose version has advanced since the
      client last observed it is rejected. A ChangeOrder apply may have moved the
      quote ACCEPTED->SUPERSEDED in the interim, so a capture carrying the prior
      quote version is operating on a stale view.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: quote_estimate_pricing
    trigger: "Quote DRAFT->ISSUED, and new quote creation on ChangeOrder apply (CONFIG_REVISION)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs, tiered selection + conditional branch + nested min
      subtotal_cents = sum over line_items of (quantity * unit_price_cents)
      material_multiplier = MATERIAL_MULT[config.material_grade]   # applied to subtotal
      priced_subtotal = round_half_up(subtotal_cents * material_multiplier)   # round AFTER multiply (pinned order)
      # volume discount tier keyed on config.total_units
      vol_rate = VOLUME_DISCOUNT_RATE for the tier total_units falls in
      vol_discount = round_half_up(priced_subtotal * vol_rate)
      # promo discount stacks AFTER volume, capped
      promo_rate = PROMO_RATE[promo_code] if promo_code set and recognized else 0
      promo_discount = min( round_half_up((priced_subtotal - vol_discount) * promo_rate), PROMO_CAP_CENTS )
      discount_cents = vol_discount + promo_discount
      taxable = priced_subtotal - discount_cents
      tax_cents = round_half_up(taxable * TAX_RATE[project.install_region])
      total_cents = priced_subtotal - discount_cents + tax_cents
      # NOTE: subtotal_cents stored = priced_subtotal (post material multiplier)
    input_set: "line_items of the FINALIZED ComponentConfig referenced by the quote; total_units from that config"
    constants:
      MATERIAL_MULT: { MELAMINE: 1.00, LAMINATE: 1.15, WOOD: 1.40, PREMIUM_WOOD: 1.80 }
      VOLUME_DISCOUNT_RATE: { "tier1 total_units 1-19": 0.00, "tier2 total_units 20-49": 0.05, "tier3 total_units 50+": 0.10 }
      PROMO_RATE: { SPRING10: 0.10, VIP15: 0.15 }
      PROMO_CAP_CENTS: 200000
      TAX_RATE: { NORTH: 0.0725, SOUTH: 0.0650, EAST: 0.0800, WEST: 0.0925 }
    precision: "integer cents; round_half_up at each round_half_up() step; rounding order pinned (multiply then round, then discount, then tax)"
    variants:
      - name: estimate
        when: "Quote ISSUED (customer-facing estimate)"
        difference: "Uses config.total_units from the FINALIZED config as-priced; promo applied if present at issue."
      - name: change_order_revised
        when: "new quote created during ChangeOrder CONFIG_REVISION apply"
        difference: "Same formula but priced against revised_config.line_items/total_units; promo_code is NOT carried over (recomputed without promo unless re-supplied), so identical line items can yield a different total than the base quote."

  - name: lead_time_estimate
    trigger: "ManufactureOrder QUEUED->IN_PRODUCTION"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): tiered base by units + conditional add-ons (non-linear)
      base_days = BASE_LEAD_DAYS for the tier config.total_units falls in
      material_add = MATERIAL_LEAD_ADD[config.material_grade]
      region_add = REGION_LEAD_ADD[project.install_region]
      lead_time_days = base_days + material_add + region_add
      promised_ready_date = started_at + lead_time_days (calendar days)
    input_set: "the accepted quote's FINALIZED ComponentConfig (total_units, material_grade) and project.install_region"
    constants:
      BASE_LEAD_DAYS: { "tier1 1-19 units": 14, "tier2 20-49 units": 21, "tier3 50+ units": 35 }
      MATERIAL_LEAD_ADD: { MELAMINE: 0, LAMINATE: 3, WOOD: 7, PREMIUM_WOOD: 14 }
      REGION_LEAD_ADD: { NORTH: 0, SOUTH: 2, EAST: 4, WEST: 6 }
    precision: "integer days"

  - name: change_order_delta
    trigger: "ChangeOrder SUBMITTED->APPROVED (delta_cents); finalized at apply"
    algorithm: aggregation
    formula: |
      # Dual-variant subject: pricing on the ChangeOrder/Quote domain
      new_total = quote_estimate_pricing(revised_config) for CONFIG_REVISION, else base_quote.total_cents (SCHEDULE_CHANGE has zero price delta)
      delta_cents = new_total - base_quote.total_cents   # signed; may be negative for downgrades
    input_set: "base_quote.total_cents and (for CONFIG_REVISION) the revised_config priced via quote_estimate_pricing"
    constants: {}
    precision: "integer cents (inherits quote rounding)"
    variants:
      - name: config_revision_delta
        when: "change_type == CONFIG_REVISION"
        difference: "delta = priced(revised_config) - base_quote.total_cents"
      - name: schedule_change_delta
        when: "change_type == SCHEDULE_CHANGE"
        difference: "delta = 0; price unchanged, only the install window changes"

  - name: financing_approval
    trigger: "FinancingApplication SUBMITTED->APPROVED (POST /_financing/decision approve)"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (c): circular-looking dependency, evaluation order pinned.
      # approved depends on quote total; monthly payment depends on approved; APR depends on term.
      requested = app.requested_amount_cents
      approval_cap = round_half_up(app.quote.total_cents * MAX_FINANCE_LTV)   # cannot finance more than LTV*total
      approved_amount_cents = min(requested, approval_cap)
      apr = APR_BY_TERM[app.term_months]
      monthly_rate = apr / 12
      n = app.term_months
      # standard amortization; pinned evaluation order: compute approved THEN payment
      monthly_payment_cents = round_half_up( approved_amount_cents * monthly_rate / (1 - (1 + monthly_rate) ** (-n)) )
    input_set: "the ACCEPTED quote total, requested amount, term"
    constants:
      MAX_FINANCE_LTV: 0.80
      APR_BY_TERM: { "12": 0.0000, "24": 0.0599, "36": 0.0899, "48": 0.1199 }
    precision: "integer cents, round_half_up; for 0% APR term=12, monthly_payment = round_half_up(approved/12)"
    variants:
      - name: zero_apr_short_term
        when: "term_months == 12 (APR 0%)"
        difference: "monthly_payment = approved_amount_cents / 12 (no interest term); avoids the divide-by-zero monthly_rate branch."
      - name: interest_bearing
        when: "term_months in {24,36,48}"
        difference: "full amortization formula with monthly_rate > 0."

  - name: deposit_requirement
    trigger: "validated on POST /deposits and POST /deposits/{id}/capture"
    algorithm: threshold
    formula: |
      # Combinatorial mode (b): nested rounding where order matters, pinned.
      # required_deposit = round(total * pct) computed from the PER-LINE rounding of total, NOT a re-sum.
      pct = DEPOSIT_PCT_BY_ROOM[project.room_type]
      required_deposit_cents = round_half_up(accepted_or_target_quote.total_cents * pct)
      # boundary: deposit.amount_cents must be >= required_deposit_cents (>=, not >)
    input_set: "the target Quote.total_cents and project.room_type"
    constants:
      DEPOSIT_PCT_BY_ROOM: { REACH_IN_CLOSET: 0.30, WALK_IN_CLOSET: 0.35, GARAGE: 0.25, PANTRY: 0.30, HOME_OFFICE: 0.35 }
    precision: "integer cents, round_half_up"

  - name: balance_reconciliation
    trigger: "deposit capture/refund, financing fund, change-order apply, install complete"
    algorithm: aggregation
    formula: |
      # Dual-variant subject: balance accounting on the Project domain (different domain from quote pricing)
      accepted_total = project.accepted_quote.total_cents   (0 if none)
      deposits_applied = sum of Deposit.amount_cents for project where status == CAPTURED
      financed = project.financing.approved_amount_cents if financing.status == FUNDED else 0
      balance_due_cents = max(accepted_total - deposits_applied - financed, 0)
    input_set: "CAPTURED deposits of the project; FUNDED financing approved amount; project.accepted_quote total"
    constants: {}
    precision: "integer cents; floor at 0 (max with 0)"
    variants:
      - name: provisional_at_deposit
        when: "computed at deposit capture (before financing funded)"
        difference: "financed term is 0 because financing not yet FUNDED; balance reflects total - deposits only."
      - name: final_post_financing
        when: "recomputed after financing FUNDED"
        difference: "financed amount subtracted; balance lower than provisional for the same deposits."

  - name: config_total_units
    trigger: "ComponentConfig DRAFT->FINALIZED"
    algorithm: aggregation
    formula: |
      total_units = sum over line_items of quantity   # excludes ACCESSORY component_type from the unit count
      # ACCESSORY items are priced but do NOT count toward total_units (volume tier / capacity)
    input_set: "line_items where component_type != ACCESSORY"
    constants: {}
    precision: "integer count"

  - name: crew_day_capacity
    trigger: "InstallJob PROPOSED->BOOKED and RESCHEDULING->BOOKED"
    algorithm: interval_merge
    formula: |
      # Resource overlap on Crew daily capacity.
      day = calendar date of window_start (UTC)
      booked_units = sum of InstallJob.units_booked for jobs where
                     crew_id == this.crew_id AND sched_status == BOOKED
                     AND calendar_date(window_start) == day
      # boundary: booked_units + this.units_booked must be <= crew.daily_capacity_units (<=, not <)
      reject if booked_units + this.units_booked > crew.daily_capacity_units
    input_set: "BOOKED InstallJobs on the same crew and same UTC calendar day"
    constants: {}
    precision: "integer units"

  - name: warranty_coverage
    trigger: "POST /warranty-claims (covered flag computed at filing)"
    algorithm: threshold
    formula: |
      install_done_at = install_job.updated_at at the time completion_status became DONE
      within_window = (now <= install_done_at + WARRANTY_DAYS days)
      covered = within_window AND (defect_type IN COVERED_DEFECTS)
      # boundary: filed exactly at install_done_at + WARRANTY_DAYS is still covered (<=)
    input_set: "the InstallJob completion timestamp and the claim defect_type"
    constants:
      WARRANTY_DAYS: 365
      COVERED_DEFECTS: [HARDWARE, FINISH, FIT, STRUCTURAL]
    precision: "boolean; day arithmetic on UTC"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers (registration)"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC matrix (§1.7)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed Customer acting on a Project (or its children), X-User-ID == Project.customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-owned operations: project cancel, quote accept, reschedule, financing submit"

  - priority: 4
    category: existence
    check: "Path/body referenced resources exist, validated left-to-right in path then body FKs"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version on guarded writes (§1.2.1)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /change-orders/{id}/apply"

  - priority: 7
    category: state
    check: "OCC: expected_quote_version matches current quote.version on deposit capture (§1.2.1)"
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /deposits/{id}/capture"

  - priority: 8
    category: business_referential
    check: "Crew region must equal Project.install_region for the install job being booked"
    error_id: ERR_CREW_REGION_MISMATCH
    http_status: 409
    applies_to: "POST /install-jobs/{id}/book, POST /install-jobs/{id}/rebook"

  - priority: 9
    category: business_referential
    check: "ComponentConfig.space_measure must not already be confirmed (one FINALIZED config per measure)"
    error_id: ERR_MEASURE_ALREADY_CONFIRMED
    http_status: 409
    applies_to: "POST /component-configs/{id}/finalize"

  - priority: 10
    category: business_temporal
    check: "ManufactureOrder cannot complete before promised_ready_date (lead-time gate, now >= promised_ready_date)"
    error_id: ERR_LEAD_TIME_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /manufacture-orders/{id}/complete"

  - priority: 11
    category: business_temporal
    check: "InstallJob window_start must be >= manufacture_order.promised_ready_date"
    error_id: ERR_WINDOW_BEFORE_READY
    http_status: 409
    applies_to: "POST /install-jobs, POST /install-jobs/{id}/book, POST /install-jobs/{id}/rebook"

  - priority: 12
    category: business_temporal
    check: "InstallJob window_end must be strictly after window_start and on the same UTC calendar day"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /install-jobs, POST /install-jobs/{id}/rebook"

  - priority: 13
    category: business_safety
    check: "Quote must not be past expires_at when accepted (expiry gate)"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept"

  - priority: 14
    category: business_constraint
    check: "Crew daily capacity: booked units + this job units must be <= crew.daily_capacity_units (calc crew_day_capacity)"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /install-jobs/{id}/book, POST /install-jobs/{id}/rebook"

  - priority: 15
    category: business_constraint
    check: "WarrantyClaim approve requires covered == true (within warranty window and covered defect)"
    error_id: ERR_WARRANTY_NOT_COVERED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "Warranty adjustment branch requires defect_type IN {FIT, FINISH}; replacement branch requires {HARDWARE, STRUCTURAL}"
    error_id: ERR_WARRANTY_BRANCH_MISMATCH
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/schedule-adjustment, POST /warranty-claims/{id}/order-replacement"

  - priority: 17
    category: business_fiscal
    check: "Deposit amount must be >= required_deposit_cents (calc deposit_requirement)"
    error_id: ERR_DEPOSIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /deposits, POST /deposits/{id}/capture"

  - priority: 18
    category: business_fiscal
    check: "Financing requested_amount_cents must be <= quote.total_cents at submit"
    error_id: ERR_FINANCE_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /financing-applications/{id}/submit"

  - priority: 19
    category: business_constraint
    check: "Quote must reference a FINALIZED ComponentConfig to be issued"
    error_id: ERR_CONFIG_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /quotes/{id}/issue, POST /quotes"

  - priority: 20
    category: business_constraint
    check: "ChangeOrder of CONFIG_REVISION requires revised_config_id present and FINALIZED; SCHEDULE_CHANGE forbids it"
    error_id: ERR_CHANGE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /change-orders, POST /change-orders/{id}/apply"

  - priority: 21
    category: business_constraint
    check: "Request body field types/enums valid and required fields present (schema validation)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH with a body"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Customers / Projects ----
  - method: POST
    path: "/customers"
    description: "Register a customer; derives install_region from zip_code"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, zip_code]
    output: Customer
    side_effects: ["computes install_region from zip_code"]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [Customer, Designer, Scheduler, ManufacturingOps, PlatformAdmin]
    code: 200
    input: []
    output: Customer

  - method: POST
    path: "/projects"
    description: "Create a project for a customer (status LEAD)"
    roles: [Customer, Designer]
    code: 201
    input: [customer_id, room_type]
    output: Project
    side_effects: ["copies install_region from customer", "status=LEAD"]

  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project (triggers quote-expiry sweep on its quotes)"
    roles: [Customer, Designer, Scheduler, ManufacturingOps, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["read-triggered: ISSUED quotes past expires_at auto-EXPIRE"]

  - method: GET
    path: "/projects"
    description: "List projects, filter by customer_id, accepted_quote_id, or financing_application_id"
    roles: [Designer, Scheduler, ManufacturingOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "accepted_quote_id?", "financing_application_id?", "status?", "limit?", "offset?"]
    output: Project[]

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project before deposit (cascades to consults & quotes)"
    roles: [Customer]
    code: 200
    input: []
    output: Project
    side_effects: ["cascade non-terminal DesignConsult->CANCELLED", "cascade DRAFT/ISSUED Quote->VOID", "Project->CANCELLED", "increments Project.version by 1"]

  - method: GET
    path: "/projects/{id}/balance"
    description: "Computed read: current balance_due_cents breakdown"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["recompute balance_reconciliation"]

  # ---- Design consults (sub-resource of project) ----
  - method: POST
    path: "/projects/{id}/design-consults"
    description: "Schedule a 3D-design consult (advances LEAD->DESIGNING on first)"
    roles: [Designer]
    code: 201
    input: [designer_user_id, scheduled_start, scheduled_end]
    output: DesignConsult
    side_effects: ["if project.status==LEAD: Project->DESIGNING", "increments Project.version by 1"]

  - method: GET
    path: "/projects/{id}/design-consults"
    description: "List a project's design consults (FK reverse-reachability)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DesignConsult[]

  - method: POST
    path: "/design-consults/{id}/render"
    description: "Attach 3D rendering (SCHEDULED->RENDERED)"
    roles: [Designer]
    code: 200
    input: [rendering_url]
    output: DesignConsult
    side_effects: ["sets rendering_url", "increments DesignConsult.version by 1"]

  - method: POST
    path: "/design-consults/{id}/complete"
    description: "Complete a consult (RENDERED->COMPLETED)"
    roles: [Designer]
    code: 200
    input: []
    output: DesignConsult
    side_effects: ["increments DesignConsult.version by 1"]

  - method: POST
    path: "/design-consults/{id}/cancel"
    description: "Cancel a consult (SCHEDULED->CANCELLED)"
    roles: [Designer]
    code: 200
    input: []
    output: DesignConsult
    side_effects: ["increments DesignConsult.version by 1"]

  # ---- Space measures ----
  - method: POST
    path: "/projects/{id}/space-measures"
    description: "Record a space measurement"
    roles: [Designer]
    code: 201
    input: [wall_count, linear_feet, ceiling_height_in]
    output: SpaceMeasure

  - method: GET
    path: "/projects/{id}/space-measures"
    description: "List a project's space measures (FK reverse-reachability)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SpaceMeasure[]

  # ---- Component configs ----
  - method: POST
    path: "/projects/{id}/component-configs"
    description: "Create a component configuration (DRAFT) against a space measure"
    roles: [Designer]
    code: 201
    input: [space_measure_id, material_grade, line_items]
    output: ComponentConfig

  - method: GET
    path: "/projects/{id}/component-configs"
    description: "List a project's component configs (FK reverse-reachability)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComponentConfig[]

  - method: GET
    path: "/component-configs/{id}"
    description: "Fetch a component config"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: []
    output: ComponentConfig

  - method: GET
    path: "/component-configs"
    description: "List component configs filtered by space_measure_id (FK reverse-reachability)"
    roles: [Designer, PlatformAdmin]
    code: 200
    input: ["space_measure_id?", "limit?", "offset?"]
    output: ComponentConfig[]

  - method: POST
    path: "/component-configs/{id}/finalize"
    description: "Finalize a config (DRAFT->FINALIZED); locks the space measure"
    roles: [Designer]
    code: 200
    input: []
    output: ComponentConfig
    side_effects: ["recompute total_units", "SpaceMeasure.confirmed=true", "increments ComponentConfig.version by 1", "increments SpaceMeasure.version by 1"]

  # ---- Quotes ----
  - method: POST
    path: "/projects/{id}/quotes"
    description: "Create a DRAFT quote referencing a FINALIZED config"
    roles: [Designer]
    code: 201
    input: [component_config_id, "promo_code?"]
    output: Quote

  - method: GET
    path: "/projects/{id}/quotes"
    description: "List a project's quotes (FK reverse-reachability; triggers expiry sweep)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: ["read-triggered: ISSUED quotes past expires_at auto-EXPIRE"]

  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote (triggers expiry sweep)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["read-triggered: if ISSUED and now>expires_at, auto-EXPIRE"]

  - method: GET
    path: "/quotes"
    description: "List quotes filtered by project_id or component_config_id (FK reverse-reachability)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["project_id?", "component_config_id?", "status?", "limit?", "offset?"]
    output: Quote[]

  - method: POST
    path: "/quotes/{id}/issue"
    description: "Issue a quote (DRAFT->ISSUED); prices it (advances project DESIGNING->QUOTED)"
    roles: [Designer]
    code: 200
    input: []
    output: Quote
    side_effects: ["recompute pricing (calc quote_estimate_pricing)", "set issued_at/expires_at", "if project.status==DESIGNING: Project->QUOTED", "increments Quote.version by 1", "increments Project.version by 1"]

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts an issued quote (ISSUED->ACCEPTED)"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["increments Quote.version by 1"]

  # ---- Deposits ----
  - method: POST
    path: "/deposits"
    description: "Create a PENDING deposit against an ACCEPTED quote"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [project_id, quote_id, amount_cents]
    output: Deposit

  - method: GET
    path: "/deposits/{id}"
    description: "Fetch a deposit"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Deposit

  - method: GET
    path: "/deposits"
    description: "List deposits filtered by project_id or quote_id (FK reverse-reachability)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["project_id?", "quote_id?", "limit?", "offset?"]
    output: Deposit[]

  - method: POST
    path: "/deposits/{id}/capture"
    description: "Capture a deposit (PENDING->CAPTURED); creates ManufactureOrder, advances project (OCC on quote)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_quote_version]
    output: Deposit
    side_effects: ["set Project.accepted_quote_id", "create ManufactureOrder QUEUED", "Project QUOTED->DEPOSIT_PAID", "recompute balance_reconciliation", "increments Deposit.version by 1", "increments Project.version by 1", "increments Quote.version by 1"]

  - method: POST
    path: "/deposits/{id}/refund"
    description: "Refund a captured deposit (CAPTURED->REFUNDED); restores balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Deposit
    side_effects: ["recompute balance_reconciliation", "increments Deposit.version by 1", "increments Project.version by 1"]

  # ---- Manufacture orders ----
  - method: GET
    path: "/manufacture-orders/{id}"
    description: "Fetch a manufacture order"
    roles: [ManufacturingOps, Scheduler, Designer, PlatformAdmin]
    code: 200
    input: []
    output: ManufactureOrder

  - method: GET
    path: "/manufacture-orders"
    description: "List manufacture orders filtered by project_id or quote_id (FK reverse-reachability)"
    roles: [ManufacturingOps, Scheduler, PlatformAdmin]
    code: 200
    input: ["project_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: ManufactureOrder[]

  - method: POST
    path: "/manufacture-orders/{id}/start"
    description: "Start production (QUEUED->IN_PRODUCTION); computes lead time (advances project)"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["recompute lead_time_days (calc lead_time_estimate)", "set started_at/promised_ready_date", "Project DEPOSIT_PAID->IN_MANUFACTURE", "increments ManufactureOrder.version by 1", "increments Project.version by 1"]

  - method: POST
    path: "/manufacture-orders/{id}/complete"
    description: "Mark order READY (IN_PRODUCTION->READY); lead-time gate enforced (advances project)"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["Project IN_MANUFACTURE->READY_TO_INSTALL", "increments ManufactureOrder.version by 1", "increments Project.version by 1"]

  # ---- Crews ----
  - method: POST
    path: "/crews"
    description: "Register an install crew"
    roles: [Scheduler, PlatformAdmin]
    code: 201
    input: [crew_name, region, daily_capacity_units, "active?"]
    output: Crew

  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: Crew

  - method: GET
    path: "/crews/{id}/install-jobs"
    description: "List install jobs for a crew (FK reverse-reachability)"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: ["sched_status?", "limit?", "offset?"]
    output: InstallJob[]

  # ---- Install jobs ----
  - method: POST
    path: "/install-jobs"
    description: "Propose an install job (PROPOSED) for a READY manufacture order"
    roles: [Scheduler]
    code: 201
    input: [project_id, manufacture_order_id, crew_id, window_start, window_end]
    output: InstallJob

  - method: GET
    path: "/install-jobs/{id}"
    description: "Fetch an install job"
    roles: [Customer, Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob

  - method: GET
    path: "/install-jobs"
    description: "List install jobs filtered by project_id or manufacture_order_id (FK reverse-reachability)"
    roles: [Customer, Scheduler, PlatformAdmin]
    code: 200
    input: ["project_id?", "manufacture_order_id?", "crew_id?", "limit?", "offset?"]
    output: InstallJob[]

  - method: POST
    path: "/install-jobs/{id}/book"
    description: "Book a proposed job (PROPOSED->BOOKED); crew capacity & region checks"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["set units_booked", "hold crew/day capacity", "increments InstallJob.version by 1"]

  - method: POST
    path: "/install-jobs/{id}/request-reschedule"
    description: "Customer requests reschedule (BOOKED->RESCHEDULING); frees capacity"
    roles: [Customer]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["free crew/day capacity", "increments InstallJob.version by 1"]

  - method: POST
    path: "/install-jobs/{id}/rebook"
    description: "Scheduler rebooks a new window (RESCHEDULING->BOOKED)"
    roles: [Scheduler]
    code: 200
    input: [window_start, window_end]
    output: InstallJob
    side_effects: ["set new window", "re-hold crew/day capacity", "increments InstallJob.version by 1"]

  - method: POST
    path: "/install-jobs/{id}/cancel"
    description: "Cancel a booked job (BOOKED->CANCELLED); frees capacity"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["free crew/day capacity", "increments InstallJob.version by 1"]

  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Start install (completion NOT_STARTED->IN_PROGRESS); advances project to INSTALLING"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["Project READY_TO_INSTALL->INSTALLING", "increments InstallJob.version by 1", "increments Project.version by 1"]

  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "Complete install (completion IN_PROGRESS->DONE); cascades to order & project"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["ManufactureOrder READY->INSTALLED", "Project INSTALLING->COMPLETED", "recompute balance_reconciliation", "increments InstallJob.version by 1", "increments ManufactureOrder.version by 1", "increments Project.version by 1"]

  # ---- Change orders ----
  - method: POST
    path: "/change-orders"
    description: "Submit a change order against an ACCEPTED quote"
    roles: [Customer, Designer]
    code: 201
    input: [project_id, base_quote_id, change_type, "revised_config_id?"]
    output: ChangeOrder

  - method: GET
    path: "/change-orders/{id}"
    description: "Fetch a change order"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: []
    output: ChangeOrder

  - method: GET
    path: "/change-orders"
    description: "List change orders filtered by project_id or base_quote_id (FK reverse-reachability)"
    roles: [Customer, Designer, PlatformAdmin]
    code: 200
    input: ["project_id?", "base_quote_id?", "revised_config_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]

  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve a change order (SUBMITTED->APPROVED); computes delta"
    roles: [Designer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["recompute delta_cents (calc change_order_delta)", "increments ChangeOrder.version by 1"]

  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject a change order (SUBMITTED->REJECTED)"
    roles: [Designer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["increments ChangeOrder.version by 1"]

  - method: POST
    path: "/change-orders/{id}/apply"
    description: "Apply an approved change order (APPROVED->APPLIED); supersedes quote/config (OCC on project)"
    roles: [Designer]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["for CONFIG_REVISION: create new ACCEPTED Quote, base Quote->SUPERSEDED, prior config->SUPERSEDED, set Project.accepted_quote_id", "recompute balance_reconciliation", "increments ChangeOrder.version by 1", "increments Project.version by 1", "increments Quote.version by 1"]

  # ---- Warranty claims ----
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim against a completed install (computes covered)"
    roles: [Customer]
    code: 201
    input: [project_id, install_job_id, defect_type]
    output: WarrantyClaim
    side_effects: ["compute covered (calc warranty_coverage)"]

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim"
    roles: [Customer, ManufacturingOps, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims filtered by project_id or install_job_id (FK reverse-reachability)"
    roles: [Customer, ManufacturingOps, PlatformAdmin]
    code: 200
    input: ["project_id?", "install_job_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a covered claim (FILED->APPROVED)"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/reject"
    description: "Reject a claim (FILED->REJECTED)"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/schedule-adjustment"
    description: "Schedule an on-site adjustment (APPROVED->ADJUSTMENT_SCHEDULED); FIT/FINISH only"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/order-replacement"
    description: "Order a replacement (APPROVED->REPLACEMENT_ORDERED); HARDWARE/STRUCTURAL only"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "Resolve a claim (ADJUSTMENT_SCHEDULED|REPLACEMENT_ORDERED->RESOLVED)"
    roles: [ManufacturingOps]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]

  # ---- Financing ----
  - method: POST
    path: "/financing-applications"
    description: "Create a DRAFT financing application against an ACCEPTED quote"
    roles: [Customer]
    code: 201
    input: [project_id, quote_id, requested_amount_cents, term_months]
    output: FinancingApplication

  - method: GET
    path: "/financing-applications/{id}"
    description: "Fetch a financing application"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication

  - method: GET
    path: "/financing-applications"
    description: "List financing applications filtered by project_id or quote_id (FK reverse-reachability)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["project_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: FinancingApplication[]

  - method: POST
    path: "/financing-applications/{id}/submit"
    description: "Submit a financing application (DRAFT->SUBMITTED)"
    roles: [Customer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["increments FinancingApplication.version by 1"]

  - method: POST
    path: "/financing-applications/{id}/fund"
    description: "Fund an approved financing application (APPROVED->FUNDED); reduces project balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["set Project.financing_application_id", "recompute balance_reconciliation", "increments FinancingApplication.version by 1", "increments Project.version by 1"]

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null

  - method: POST
    path: "/_financing/decision"
    description: "Lender decision webhook: APPROVE or DECLINE a SUBMITTED financing application"
    roles: [PlatformAdmin]
    code: 200
    input: [financing_application_id, decision]
    output: FinancingApplication
    side_effects: ["APPROVE: recompute approved_amount_cents/monthly_payment_cents (calc financing_approval), SUBMITTED->APPROVED", "DECLINE: SUBMITTED->DECLINED", "increments FinancingApplication.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer X-User-ID does not own the target Project"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced path id or body FK does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid from-state for the requested transition"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != current Project.version on change-order apply"
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version != current Quote.version on deposit capture"
  - id: ERR_CREW_REGION_MISMATCH
    http: 409
    condition: "Crew.region != Project.install_region for the install job"
  - id: ERR_MEASURE_ALREADY_CONFIRMED
    http: 409
    condition: "SpaceMeasure already backs a FINALIZED config (confirmed==true)"
  - id: ERR_LEAD_TIME_NOT_ELAPSED
    http: 409
    condition: "ManufactureOrder complete attempted before promised_ready_date"
  - id: ERR_WINDOW_BEFORE_READY
    http: 409
    condition: "InstallJob window_start earlier than manufacture_order.promised_ready_date"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end not strictly after window_start, or window spans more than one UTC calendar day"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "Quote accept attempted after expires_at"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "Crew daily booked units + this job units exceed daily_capacity_units"
  - id: ERR_WARRANTY_NOT_COVERED
    http: 409
    condition: "Warranty approve on a claim with covered==false"
  - id: ERR_WARRANTY_BRANCH_MISMATCH
    http: 409
    condition: "Adjustment requested for non-FIT/FINISH defect, or replacement for non-HARDWARE/STRUCTURAL defect"
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http: 422
    condition: "Deposit amount_cents below required_deposit_cents"
  - id: ERR_FINANCE_EXCEEDS_TOTAL
    http: 422
    condition: "Financing requested_amount_cents exceeds quote.total_cents at submit"
  - id: ERR_CONFIG_NOT_FINALIZED
    http: 409
    condition: "Quote issue/create references a non-FINALIZED ComponentConfig"
  - id: ERR_CHANGE_TARGET_INVALID
    http: 422
    condition: "CONFIG_REVISION missing/invalid revised_config_id, or SCHEDULE_CHANGE supplies one"
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed body: missing required field, bad type, or invalid enum"
  - id: ERR_FINANCE_ALREADY_LINKED
    http: 409
    condition: "Funding a financing application when the project already has a FUNDED financing_application_id"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register a customer"
    identity: opaque
    exclusive_operations: ["POST /customers"]
    shared_operations: []

  - name: Customer
    description: "Owns their Project and its children; accepts quotes, requests reschedules, applies for financing, files warranty claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /projects/{id}/cancel"
      - "POST /quotes/{id}/accept"
      - "POST /install-jobs/{id}/request-reschedule"
      - "POST /financing-applications"
      - "POST /financing-applications/{id}/submit"
      - "POST /warranty-claims"
    shared_operations:
      - "POST /projects (with Designer)"
      - "POST /deposits (with PlatformAdmin)"
      - "GET reads on owned resources"

  - name: Designer
    description: "Runs design consults, records measures, builds & finalizes configs, issues quotes, manages change orders"
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/design-consults"
      - "POST /design-consults/{id}/render"
