      assert:
      - 'the void succeeds: PartOrder.${o1}.status == "VOID"'
      - 'the dependent inspection is now rejected: ${err_dep} == "ERR_RETURN_DESK_STOP_MISSING" with http 409'
      - ToolLoan.${ln1}.status == "RETURNED" and ToolLoan.${ln1}.replacement_part_id is null, so the rejected inspection mutated nothing
      - ToolLoan.${ln1}.deposit_state == "HELD" and CommercialAccount.${acct}.petty_cash_cents == 6000 throughout
      - while the order was still CONFIRMED the identical inspection would have succeeded — the only input that changed is PartOrder.${o1}.status
  - name: loan_close_requires_return_desk_stop_on_uncancelled_route
    grounds:
    - state_machines.ToolLoan.field.status.transitions.INSPECTED_to_CLOSED
    - state_machines.ServiceRoute.field.status.transitions.DISPATCHED_to_CANCELLED
    - entities.RouteStop.fields.stop_kind
    - errors[ERR_RETURN_DESK_STOP_MISSING]
    distinguishing_aspect: 'A different entity pair from the sibling: this dependency crosses

      ToolLoan to ServiceRoute, where a cancelled route removes the desk stop

      that closing an inspected loan depends on, and the same call is

      accepted or rejected purely on the route''s status.

      '
