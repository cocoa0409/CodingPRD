          Entity pair Batch -> Tank. The blocking condition lives entirely on the OTHER entity and
          was created by a THIRD row: dumping batch B-1001 pushed FV-01 from OCCUPIED to DIRTY, and
          a DIRTY vessel must pass CIP before it can be occupied again. Batch B-1002 is itself
          perfectly valid - its own state is SCHEDULED and its window does not overlap anything -
          yet start is refused with 409 ERR_TANK_NOT_IDLE.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT."
            - "Tank FV-01 created (IDLE)."
            - "Batch B-1001 (2026-08-01T06:00Z -> 2026-08-08T06:00Z) started, which set FV-01 to OCCUPIED, then DUMPED, which left FV-01 DIRTY with occupying_batch_id cleared."
            - "Batch B-1002 scheduled on FV-01 for a much later window (2026-08-20T06:00Z -> 2026-08-27T06:00Z), so no tank schedule conflict exists and the DUMPED predecessor is not in the conflict state set."
            - "No CIP service call is made, so FV-01 is still DIRTY."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch1_id: $.data.id }
            - call: "POST /batches/${batch1_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch1_id}/dump"
              payload: { reason: "lactobacillus infection detected at day 3" }
              as: CellarOperator
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1002", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-20T06:00:00Z", brew_end_utc: "2026-08-27T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch2_id: $.data.id }
          trigger:
            - call: "POST /batches/${batch2_id}/start"
              payload: {}
              as: CellarOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_TANK_NOT_IDLE"
            - "Batch.${batch2_id}.state == SCHEDULED (unchanged)"
            - "Batch.${batch1_id}.state == DUMPED"
            - "Tank.${tank_id}.status == DIRTY"
            - "Tank.${tank_id}.occupying_batch_id is null"
            - "Tank.${tank_id}.cip_cycle_count == 0"
            - "After POST /tanks/{tankId}/service with action=CIP at 150 ppm for 60 s the same start call succeeds, proving the gate is the tank's state and nothing on the batch"

      - name: distribution_order_blocked_by_revoked_cola_on_the_beer
        grounds:
          - validations.priority_34
          - state_machines.Beer.label_state.COLA_APPROVED_to_COLA_REVOKED
          - entities.Beer.fields.distribution_sellable
          - errors.ERR_LABEL_NOT_APPROVED
        distinguishing_aspect: |
          A different entity pair - DistributionOrder -> Beer - and a federal-approval gate rather
          than a vessel-cleanliness gate. The license is ACTIVE, the territory matches and the
          brewer's notice is ACTIVE; only the label dimension of the referenced Beer has moved to
          COLA_REVOKED. Order creation is refused with 422 ERR_LABEL_NOT_APPROVED and no order row
          is created at all, while the very same beer remains legal to pour in the taproom.
        test_recipe:
          setup:
            - "Brewery ACTIVE."
            - "Beer 'Ridgeline IPA' FORMULA_EXEMPT; its LABEL was filed and APPROVED with cola_id COLA-24-0917, then REVOKED by the regulator, so label_state is COLA_REVOKED and distribution_sellable is false while taproom_sellable stays true."
            - "ID StateLicense, SELF_DISTRIBUTION, ACTIVE, cap 1000.00."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
