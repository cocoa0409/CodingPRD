          assert:
            - "before the trigger, CourseEnrollment.${enr_id}.proctored_exam_percent == null and mastery_pct == 84.00 (the module average stands in while no exam has been scored)"
            - "the first trigger call returns HTTP 409 with error_id ERR_PROCTORED_EXAM_MISSING (the session exists but is SCHEDULED, so the completed count is zero)"
            - "after that failure CourseEnrollment.${enr_id}.progress_state is still IN_PROGRESS and submitted_by_user_id is null"
            - "after the second trigger call ProctorSession.${ps_id}.status == COMPLETED with score_percent == 78.00 and integrity_incident == false"
            - "CourseEnrollment.${enr_id}.proctored_exam_percent == 78.00 and mastery_pct == 81.60 (0.60 * 84.00 + 0.40 * 78.00 = 50.40 + 31.20), not 84.00 and not 81.00"
            - "the third trigger call returns HTTP 200 with CourseEnrollment.${enr_id}.progress_state == SUBMITTED_FOR_AWARD, final_percent == 84.00 and submitted_by_user_id == 'teach-01'"
            - "CourseEnrollment.${enr_id}.projected_credits == 1.00 (COMPETENCY with mastery_pct 81.60 >= 80.00 pays the full credit_value even with 9 of 10 modules passed)"
            - "ProctorStation.${st_id}.scheduled_session_count == 1 (a COMPLETED session still occupies the station's booked interval)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_create_blocked_by_frozen_center_posture
        entity_pair: "CourseEnrollment (written) depends on Center.intake_posture (read)"
        grounds:
          - calculations.center_intake_posture
          - state_machines.Center.RESTRICTED_to_FROZEN
          - endpoints[POST /course-enrollments]
          - endpoints[PATCH /centers/{center_id}/staffing]
          - errors[ERR_INTAKE_FROZEN]
        distinguishing_aspect: |
          Creating a CourseEnrollment is legal or illegal purely because of a derived field on a
          third entity the request never names: the center's staffing_headroom hits 0 once its single
          1.00-FTE teacher holds one active student, so intake_posture is FROZEN and the enrollment is
          refused. Raising certified_teacher_fte to 2.00 through the Center staffing endpoint (no
          change whatsoever to the placement, the student or the course) makes the identical
          enrollment payload succeed. Note the seat ledger is irrelevant here: seats_available is 9
          throughout, so only the staffing branch of center_intake_posture can explain the block.
        test_recipe:
          setup:
            - "one home school and one PACKET course ALG1 (credit_value 1.00, total_modules 8, required_seat_hours 60.00)"
            - "one center with seat_capacity 10 but certified_teacher_fte 1.00 and max_students_per_teacher 1, so staffing_headroom is 1 and intake_posture starts RESTRICTED"
            - "one grade-10 student whose referral uses the BEHAVIOR pathway (the only pathway a RESTRICTED center may offer to at priority_score below 0.5000)"
            - "the offer is accepted, so active_student_count becomes 1, staffing_headroom drops to 0 and intake_posture becomes FROZEN while seats_available is still 9"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Birch AEC", seat_capacity: 10, certified_teacher_fte: 1.00, support_staff_fte: 1.00, max_students_per_teacher: 1 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9401", full_name: "Quinn Abara", cohort_year: 2028, grade_level: 10 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "BEHAVIOR", deficiency_credits: 0.00, behavior_incident_count: 3, days_disengaged: 0 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "GET /centers/${ctr_id}"
              payload: {}
              as: DistrictAdmin
              captures: { ctr_v3: $.data.version }
          trigger:
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_id}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_v1}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "PATCH /centers/${ctr_id}/staffing"
              payload: { certified_teacher_fte: 2.00, expected_center_version: "${ctr_v3}" }
              as: DistrictAdmin
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_id}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_v1}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_id: $.data.id }
          assert:
            - "before the trigger, Center.${ctr_id}.active_student_count == 1, staffing_headroom == 0, seats_available == 9 and intake_posture == FROZEN"
            - "the first trigger call returns HTTP 409 with error_id ERR_INTAKE_FROZEN and Placement.${pl_id}.version is unchanged (the rejected create must not consume the optimistic-concurrency token)"
            - "GET /course-enrollments?placement_id=${pl_id} returns 0 rows after the first trigger call"
            - "after the staffing change Center.${ctr_id}.certified_teacher_fte == 2.00, staffing_headroom == 1, student_teacher_ratio == 0.50 and intake_posture == RESTRICTED"
            - "the third trigger call returns HTTP 201 (RESTRICTED gates offers, never enrollments) with CourseEnrollment.${enr_id}.progress_state == IN_PROGRESS, integrity_state == CLEAR, enrolled_on == '2026-08-01' and pacing_flag == NOT_YET_RATED"
            - "Placement.${pl_id}.version increments by exactly 1 across the three trigger calls (only the successful create bumps it)"

      - name: re_entry_request_blocked_by_off_track_plan
        entity_pair: "Placement (written) depends on GraduationPlan.posture (read)"
        grounds:
          - calculations.graduation_plan_posture
          - endpoints[POST /placements/{placement_id}/request-re-entry]
          - errors[ERR_PLAN_POSTURE_BLOCKS_RE_ENTRY]
          - entities.GraduationPlan.fields.posture
          - entities.Placement.fields.re_entry_eligible
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency: the placement's own gates
          (attendance_rate 0.9000, readiness_score 0.7800) are both satisfied, yet re-entry is
          refused because the student's GraduationPlan sits at OFF_TRACK. Posting an unrelated
          historical transcript row worth 1.75 credits moves credits_earned across the AT_RISK
          threshold (1.60 of the 2.00 expected at grade 9) and the identical request now succeeds --
          the Placement row itself is never touched in between.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "two PACKET courses: ALG1 (total_modules 8, pacing_days 40) and ENG1"
            - "one grade-9 student with an ACTIVE plan of required_credits_total 8.00 and no credits at all, so expected_credits_by_grade is 2.00 and posture is OFF_TRACK"
            - "one SEAT_TIME placement (referral deficiency_credits 4.00) with one NEW_CREDIT ALG1 enrollment at 8 of 8 modules passed"
            - "the logical clock at 2026-08-11T00:00:00Z, one COMPLETED SupportSession, and attendance 45 present of 50 enrolled -> attendance_rate 0.9000, readiness_score 0.7800"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "ENG1", title: "English I", subject_area: "ELA", credit_value: 2.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
