        claim_type: immediate
        grounds: [state_machines.Case.SCREENED_to_ASSIGNED, entities.Case.fields.assigned_attorney_id]
        distinguishing_aspect: "Immediately after POST /assignments, a GET /cases/{id} shows status ASSIGNED and assigned_attorney_id set (no eventual lag)."
        test_recipe:
          setup: ["Screened case with CLEAR conflict check and active attorney."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-Cm", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Cm", attorney_type: "STAFF", bar_number: "M1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Cn", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
          trigger:
            - { call: "GET /cases/${c}", payload: {}, as: AssignmentCoordinator, captures: { st: $.data.status, aid: $.data.assigned_attorney_id } }
          assert:
            - "Case.${c}.status == ASSIGNED and assigned_attorney_id == ${att} in the same synchronous read"
