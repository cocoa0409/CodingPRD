              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_1}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_1: $.data.id }
            - call: "POST /assessments/${assess_1}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { v_stale: $.data.version, alpha_stale: $.data.alpha_weight_lbs }
          trigger:
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "BIA", assessed_at: "2026-11-01T14:00:00Z", measured_weight_lbs: 158.0, body_fat_pct: 14.0, urine_specific_gravity: 1.018 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_2: $.data.id }
            - call: "POST /assessments/${assess_2}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { a2_min: $.data.minimum_certified_weight_lbs }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_2}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${v_stale}" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { e_occ: $.data.error_id }
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { v_fresh: $.data.version, alpha_fresh: $.data.alpha_weight_lbs }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_2}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${v_fresh}" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { plan_id: $.data.id }
