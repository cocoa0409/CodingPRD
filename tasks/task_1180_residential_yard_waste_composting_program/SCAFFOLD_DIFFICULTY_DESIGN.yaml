  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_half_open_adjacency
        grounds:
          - errors[ERR_ROUTE_WINDOW_OVERLAP]
          - entities.CollectionRoute.fields.effective_start_date
          - validations[priority=9]
        distinguishing_aspect: |
          Resource (zone, weekday) with HALF-OPEN date-interval semantics:
          [2026-07-01, 2026-10-01) overlapping existing [2026-05-01,
          2026-08-01) is rejected, while the adjacent window [2026-08-01,
          2026-10-31) (start == existing end) is allowed.
        test_recipe:
          setup:
            - "Zone O; existing MONDAY route R1 with effective window [2026-05-01, 2026-08-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-08-01", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-07-01", effective_end_date: "2026-10-01", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-08-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { r3: $.data.id } }
          assert:
            - "capture ${err} == ERR_ROUTE_WINDOW_OVERLAP"
            - "CollectionRoute.${r3}.status == DRAFT"
            - "CollectionRoute.${r1}.status == DRAFT"

      - name: delivery_window_buffered_overlap
        grounds:
          - errors[ERR_DELIVERY_WINDOW_OVERLAP]
          - entities.FacilityDelivery.fields.window_start
          - validations[priority=9]
        distinguishing_aspect: |
          Resource (facility, delivery_date) with BUFFERED datetime-interval
          semantics (each window expanded by +/-30 min): a 11:15-12:00 booking
          collides with the existing 10:00-11:00 booking (buffered [09:30,
          11:30)), while 12:00-12:30 only touches the buffer edge (buffered
          [11:30, 13:00) vs [09:30, 11:30) — strict inequality, no overlap)
          and is allowed. Different resource and different interval semantics
          than the route rule.
        test_recipe:
          setup:
            - "Zone O with published MONDAY route; facility OPEN"
            - "Existing delivery D1 on 2026-06-15, window 10:00-11:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /facilities", payload: { name: "Compost Central", daily_receiving_capacity_lbs: 50000, safety_contamination_item_limit: 5 }, as: ProgramAdmin, captures: { fac: $.data.id } }
            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-15", window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T11:00:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-15", window_start: "2026-06-15T11:15:00Z", window_end: "2026-06-15T12:00:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-15", window_start: "2026-06-15T12:00:00Z", window_end: "2026-06-15T12:30:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { d3: $.data.id } }
          assert:
            - "capture ${err} == ERR_DELIVERY_WINDOW_OVERLAP"
            - "FacilityDelivery.${d3}.status == SCHEDULED"
            - "FacilityDelivery.${d1}.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: credit_approve_then_void_balance_unchanged
        grounds:
          - calculations.service_credit_balance
          - state_machines.ServiceCredit.PENDING_APPROVAL_to_GRANTED
          - state_machines.ServiceCredit.GRANTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity is the household's monetary ledger:
          credit_balance_cents == sum(GRANTED credit amounts). Approve (+444)
          followed by its compensating void (-444) returns the balance to
          exactly its pre-approve value — zero drift.
        test_recipe:
          setup:
            - "Opt-in household with ACTIVE paid subscription (base 12000 -> prorated credit 444)"
            - "Ticket on 2026-05-04 reported missed at clock 2026-05-05 and validated by sup_1 -> PENDING_APPROVAL credit 444"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /pickup-tickets/${t1}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /pickup-tickets/${t1}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "GET /service-credits?subscription_id=${sub_a}&status=PENDING_APPROVAL", as: BillingClerk, as_user_id: "clerk_1", captures: { cred: "$.data[0].id" } }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { bal0: $.data.credit_balance_cents } }
          trigger:
            - { call: "POST /service-credits/${cred}/approve", payload: {}, as: BillingClerk, as_user_id: "clerk_1" }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { bal1: $.data.credit_balance_cents } }
            - { call: "POST /service-credits/${cred}/void", payload: {}, as: BillingClerk, as_user_id: "clerk_1", captures: { cred_st: $.data.status } }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { bal2: $.data.credit_balance_cents } }
          assert:
            - "capture ${bal0} == 0"
            - "capture ${bal1} == 444"
            - "capture ${cred_st} == VOIDED"
            - "capture ${bal2} == 0"
            - "capture ${bal2} == ${bal0}"

      - name: surge_book_then_cancel_slots_unchanged
        grounds:
          - calculations.surge_slot_allocation
          - state_machines.SurgeBooking.CONFIRMED_to_CANCELLED
          - entities.SurgeEvent.fields.reserved_slots
        distinguishing_aspect: |
          Conserved quantity is slot COUNT (not money):
          capacity_slots == reserved_slots + available_slots. With no
          waitlisted bookings, a book (+1 reserved) followed by its
          compensating cancel (-1 reserved) leaves reserved_slots at exactly
          its pre-book value.
        test_recipe:
          setup:
            - "Universal zone; household A auto-ACTIVE; LEAF_SURGE event capacity 2, booking window open at clock 2026-10-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 2, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { res0: $.data.reserved_slots } }
          trigger:
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_a}", quantity_bundles: 2, expected_surge_event_version: "${ev_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { bk: $.data.id } }
            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { res1: $.data.reserved_slots } }
            - { call: "POST /surge-bookings/${bk}/cancel", payload: {}, as: Resident, as_user_id: "${hh_a}" }
            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { res2: $.data.reserved_slots } }
          assert:
            - "capture ${res0} == 0"
            - "capture ${res1} == 1"
            - "capture ${res2} == 0"
            - "capture ${res2} == ${res0}"
            - "SurgeBooking.${bk}.status == CANCELLED"
