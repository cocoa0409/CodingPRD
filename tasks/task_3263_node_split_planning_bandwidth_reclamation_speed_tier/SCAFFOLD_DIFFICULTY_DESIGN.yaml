          Boundary on the utilization-percent metric via POST utilization-samples:
          with capacity 760 and crit 85, a sample of exactly 646 Mbps yields 85.0%
          and flips posture to CRITICAL (>= semantics), while 645 Mbps yields 84.9%
          and stays ELEVATED on a sibling service group of the same node.
