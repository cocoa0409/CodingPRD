  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_and_securement_capacity_returns_to_zero_after_decline
        grounds:
          - entities.VehicleBlock.fields.seats_committed
          - entities.VehicleBlock.fields.wav_positions_committed
          - state_machines.PoolAssignment.state.OFFERED_to_DECLINED
          - state_machines.TripRequest.fare_status.QUOTED_to_UNPRICED
        distinguishing_aspect: |
          The invariant is "VehicleBlock.seats_committed / wav_positions_committed / committed_index_min /
          committed_index_max always equal the aggregate over assignments in state {OFFERED, ACCEPTED,
          ONBOARD}", and the decline must restore it EXACTLY — including the corridor span collapsing
          back to null rather than staying pinned at 0..4. The compensation is asymmetric on purpose:
          the assignment row keeps its frozen seats_held 2 and wav_positions_held 1 forever (an audit
          record), the driver's decline counter goes UP, and the trip's fare axis is voided, yet the
          block's four capacity fields must read exactly what they read before the offer existed.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; approved ACCESSIBLE_PATH stops S0 (index 0) and S4 (index 4)."
            - "Vehicle V1 has seat_capacity 6 and wav_positions 2; driver D1 is wav_certified."
            - "Rider RW has mobility_device WHEELCHAIR, so trip T1 (S0->S4, requested 07:00Z, party_size 2) computes wav_required true, seats_held 2 and wav_positions_held 1."
            - "Block B1 (V1/D1) is OPEN [06:00, 10:00) and its capacity fields read 0 / 0 / null / null before the offer."
            - "The offer is created manually, so after it the block reads seats_committed 2, wav_positions_committed 1, committed_index_min 0, committed_index_max 4, and the trip is OFFERED / QUOTED 325."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "RW", fare_category: "FULL", mobility_device: "WHEELCHAIR" }
              as: ZoneAdmin
              captures: { rw_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${rw_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 2 }
              as: Rider
              as_user_id: "${rw_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
          trigger:
            - call: "POST /pool-assignments/${pa1_id}/decline"
              payload: { reason: "securement strap out of service" }
              as: DriverUser
              as_user_id: "${d1_id}"
          assert:
            - "VehicleBlock.${b1_id}.seats_committed == 0"
            - "VehicleBlock.${b1_id}.wav_positions_committed == 0"
            - "VehicleBlock.${b1_id}.committed_index_min == null"
            - "VehicleBlock.${b1_id}.committed_index_max == null"
            - "VehicleBlock.${b1_id}.boardings_count == 0"
            - "VehicleBlock.${b1_id}.state == OPEN"
            - "PoolAssignment.${pa1_id}.state == DECLINED"
            - "PoolAssignment.${pa1_id}.seats_held == 2 (frozen, never rewritten by the compensation)"
            - "PoolAssignment.${pa1_id}.wav_positions_held == 1 (frozen)"
            - "PoolAssignment.${pa1_id}.baseline_direct_minutes == 12 and PoolAssignment.${pa1_id}.projected_detour_minutes == 0"
            - "TripRequest.${t1_id}.status == MATCHING"
            - "TripRequest.${t1_id}.match_attempt_count == 1 (never decremented by the compensation)"
            - "TripRequest.${t1_id}.assigned_block_id == null"
            - "TripRequest.${t1_id}.projected_detour_minutes == null"
            - "TripRequest.${t1_id}.promised_pickup_utc == null and TripRequest.${t1_id}.promised_dropoff_utc == null"
            - "TripRequest.${t1_id}.fare_status == UNPRICED and TripRequest.${t1_id}.quoted_fare_cents == null"
            - "TripRequest.${t1_id}.wav_required == true"
            - "Driver.${d1_id}.consecutive_decline_count == 1 and Driver.${d1_id}.status == ACTIVE"
            - "GET /pool-assignments?block_id=${b1_id}&state=OFFERED returns total_count == 0"
            - "GET /fare-transactions?trip_request_id=${t1_id} returns total_count == 0 (an offer never writes to the ledger)"

      - name: fare_ledger_nets_to_zero_after_capped_charge_is_refunded
        grounds:
          - state_machines.TripRequest.fare_status.CHARGED_to_REFUNDED
          - entities.FareTransaction.fields.amount_cents
          - entities.Rider.fields.daily_fare_paid_cents
          - validations.priority_50.ERR_TRIP_NOT_CHARGED
        distinguishing_aspect: |
          The invariant is a LEDGER identity rather than a counter reset: after the refund the three
          append-only rows for the trip must sum to exactly zero (CHARGE +325, CAP_REBATE -25,
          REFUND -300) and the rider's daily and weekly counters must fall back to 0, even though the
          settled charge (300) differs from the gross fare (325) because the daily cap bound it. The
          compensation must be by APPENDING a REFUND row equal to -charged_fare_cents, never by
          deleting or mutating the earlier rows, and it must not disturb the service-quality metrics:
          completed_trip_count, avg_wait_minutes and avg_ride_minutes are all unchanged by a refund.
          The second refund attempt proves the terminal fare state cannot compensate twice.
        test_recipe:
          setup:
            - "Zone RBM-CAP ACTIVE with fare_cap_cents_daily 300 (below the 325-cent MEDIUM-band full fare) and fare_cap_cents_weekly 2500."
            - "Approved stops S0 (index 0) and S4 (index 4); vehicle V1 (6 seats, 2 WAV); driver D1; rider R1 (FULL, NONE) with both fare counters at 0."
            - "Block B1 (V1/D1) OPEN [06:00, 10:00); trip T1 (S0->S4, requested 07:00Z) is offered, accepted, boarded at exactly 07:00Z (wait 0) and dropped at 07:12Z (ride 12)."
            - "Settlement therefore writes CHARGE +325 and CAP_REBATE -25, charged_fare_cents 300, applied_cap DAILY, and moves the rider's daily and weekly counters to 300."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Capped", zone_code: "RBM-CAP", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 300, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
            - call: "POST /pool-assignments/${pa1_id}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/board"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:12:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/complete"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /trip-requests/${t1_id}/refund"
              payload: { reason: "service failure, fare returned" }
              as: Dispatcher
            - call: "POST /trip-requests/${t1_id}/refund"
              payload: { reason: "duplicate refund attempt" }
              as: Dispatcher
          assert:
            - "the first POST /trip-requests/${t1_id}/refund returns HTTP 200"
            - "TripRequest.${t1_id}.fare_status == REFUNDED"
            - "TripRequest.${t1_id}.charged_fare_cents == 0"
            - "TripRequest.${t1_id}.applied_cap == DAILY (the settlement record is not erased by the compensation)"
            - "TripRequest.${t1_id}.status == COMPLETED (the fulfilment axis is untouched)"
            - "GET /fare-transactions?trip_request_id=${t1_id} returns exactly 3 rows: CHARGE +325, CAP_REBATE -25 and REFUND -300"
            - "the sum of amount_cents over those 3 rows == 0"
            - "no FareTransaction row for ${t1_id} was mutated or removed: the CHARGE row still reads amount_cents == 325"
            - "Rider.${r1_id}.daily_fare_paid_cents == 0"
            - "Rider.${r1_id}.weekly_fare_paid_cents == 0"
            - "Rider.${r1_id}.fare_counter_date == 2026-08-03 and Rider.${r1_id}.fare_counter_week_start == 2026-08-03"
            - "ServiceZone.${z_id}.completed_trip_count == 1 and ServiceZone.${z_id}.avg_wait_minutes == 0.00 and ServiceZone.${z_id}.avg_ride_minutes == 12.00"
            - "VehicleBlock.${b1_id}.boardings_count == 1 and VehicleBlock.${b1_id}.seats_committed == 0"
            - "the second POST /trip-requests/${t1_id}/refund returns HTTP 409 with error_id == ERR_TRIP_NOT_CHARGED"
            - "GET /fare-transactions?trip_request_id=${t1_id} still returns exactly 3 rows after the duplicate attempt"
