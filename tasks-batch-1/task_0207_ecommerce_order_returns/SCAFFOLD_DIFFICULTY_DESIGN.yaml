        distinguishing_aspect: |
          A return targets a final_sale product on a CAPTURED+DELIVERED order whose window has ALSO closed.
          business_safety (priority 8, ERR_FINAL_SALE_NOT_RETURNABLE) outranks business_temporal (priority 9,
          ERR_RETURN_WINDOW_CLOSED), so the server returns ERR_FINAL_SALE_NOT_RETURNABLE — a business_safety-vs-business_temporal pairing.
        test_recipe:
          setup:
