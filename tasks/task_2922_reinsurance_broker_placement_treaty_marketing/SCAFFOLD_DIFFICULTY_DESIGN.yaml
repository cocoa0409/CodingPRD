            - "Reinsurer.${india_id}.available_capacity_minor == 0"
            - "Layer.${layer_p}.status == FULLY_PLACED and Program.${prog_p}.placement_status == FIRM_ORDER"
            - "SigningLine.${sl_q}.status == PROVISIONAL  # the window-edge line still counts and is untouched"

  # ===========================================================================
  # RULE 9 — compensating invariants over two DIFFERENT conserved quantities
  #   instance 1 : Program.fiduciary_holding_minor    (money)
  #   instance 2 : Reinsurer.committed_capacity_minor (underwriting capacity)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reversing_a_settled_remittance_restores_the_fiduciary_balance_exactly
        grounds:
          - calculations.fiduciary_holding
          - state_machines.FiduciaryTransaction.transitions.SETTLED_to_REVERSED
          - entities.FiduciaryTransaction.fields.reverses_transaction_id
          - entities.Program.fields.fiduciary_holding_minor
          - validations[priority=64]
        distinguishing_aspect: |
          Conserved quantity: MONEY — Program.fiduciary_holding_minor. The reversal is
          compensating rather than destructive: the original outflow stays in the ledger as
          REVERSED and a REMITTANCE_REVERSAL inflow of the identical 94696875 is appended, so the
          balance returns to exactly 97125000 — a delta of +94696875 and not one minor unit more,
          with no row rewritten. Instance 2 conserves capacity instead.
        test_recipe:
          setup:
            - "One cedent, Echo Re holding the whole 1000000000 CATASTROPHE layer; the program is BOUND with gross_written_premium_minor 97125000, brokerage_earned_minor 2428125 and net_remittance_minor 94696875."
            - "Documentation is walked SLIP -> WORDING_DRAFT -> AGREED_WORDING so the remittance may settle."
            - "A CEDENT_RECEIPT of 97125000 is booked, approved and settled, and then a REINSURER_REMITTANCE of 94696875 against Echo Re's line is booked, approved and settled — leaving fiduciary_holding_minor at 2428125, exactly the brokerage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
