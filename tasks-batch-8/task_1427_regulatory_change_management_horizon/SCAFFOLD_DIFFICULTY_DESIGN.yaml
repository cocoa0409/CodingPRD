# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# regulatory-change-management (19 instances across the nine §0.5 rules)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_impact_rating_provisional_vs_confirmed
        grounds:
          - calculations.impact_rating
          - entities.RegulatoryChange.fields.provisional_risk_tier
          - entities.ImpactAssessment.fields.impact_tier
        distinguishing_aspect: |
          Two variants of impact_rating on the ImpactAssessment/RegulatoryChange domain:
          provisional (severity_hint HIGH -> 4 x 3 x 1.0 = 12.0 -> HIGH, pinned at triage)
          diverges from confirmed (2 x 3 x 1.0 = 6.0 -> MEDIUM) for the SAME change.
        test_recipe:
          setup:
            - "Empty DB; logical clock at default 2026-08-01T00:00:00Z"
            - "BusinessOwner exists; RegulatoryChange with severity_hint HIGH is TRIAGED_APPLICABLE with provisional_risk_tier HIGH"
            - "ImpactAssessment assigned, started, and submitted with likelihood 2 / severity 3 / 1 business line"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "12 CFR 1005.30", title: "Remittance Rule Update", summary: "Expands remittance disclosure duties", feed_source: "FED_REGISTER", jurisdiction: "US-FED", regulator: "CFPB", published_at: "2026-07-15T00:00:00Z", effective_date: "2026-12-01T00:00:00Z", severity_hint: "HIGH" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ch_id: $.data.id }
            - call: "POST /compliance/regulatory-changes/${ch_id}/triage"
              payload: { verdict: "APPLICABLE", rationale: "Covers our payments business" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { ch_v2: $.data.version, ch_prov_tier: $.data.provisional_risk_tier }
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${ch_id}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${ch_v2}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ia_id: $.data.id }
            - call: "POST /compliance/impact-assessments/${ia_id}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${ia_id}/submit"
              payload: { likelihood_score: 2, severity_score: 3, affected_business_lines: 1, findings_summary: "Limited to one product line" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { ia_raw: $.data.impact_rating_raw, ia_tier: $.data.impact_tier }
          trigger:
            - call: "POST /compliance/impact-assessments/${ia_id}/accept"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/regulatory-changes/${ch_id}"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { ch_final_tier: $.data.risk_tier }
          assert:
            - "RegulatoryChange.${ch_id}.provisional_risk_tier == HIGH (provisional: 4 x 3 x 1.0 = 12.0 -> HIGH)"
            - "ImpactAssessment.${ia_id}.impact_rating_raw == 6.0 (confirmed: 2 x 3 x 1.0)"
            - "ImpactAssessment.${ia_id}.impact_tier == MEDIUM"
            - "After accept: RegulatoryChange.${ch_id}.risk_tier == MEDIUM, diverging from the provisional HIGH pinned earlier"

      - name: dvc_deadline_calendar_vs_business
        grounds:
          - calculations.implementation_deadline
          - validations[priority=6]
        distinguishing_aspect: |
          Two variants of implementation_deadline on the ImplementationPlan domain (different
          entity domain from dvc_impact_rating_provisional_vs_confirmed): identical confirm date
          2026-08-01 yields mandate 2026-08-16 under calendar_days (CRITICAL, N=15) versus
          2026-10-02 under business_days (HIGH, N=45); the calendar reading of N=45 (2026-09-15)
          is rejected as a valid answer.
        test_recipe:
          setup:
            - "Two TRIAGED_APPLICABLE changes, each with an ACTIVE obligation (CRITICAL and HIGH) and an ACCEPTED assessment whose GapAnalysis was CONFIRMED at the default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "12 CFR 1005.31", title: "Critical Change", summary: "c", feed_source: "FED_REGISTER", jurisdiction: "US-FED", regulator: "CFPB", published_at: "2026-07-15T00:00:00Z", effective_date: "2026-09-01T00:00:00Z", severity_hint: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { chA: $.data.id }
            - call: "POST /compliance/regulatory-changes/${chA}/triage"
              payload: { verdict: "APPLICABLE", rationale: "applies" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { chA_v: $.data.version }
            - call: "POST /compliance/obligations"
              payload: { obligation_code: "OBL-2026-C01", title: "Critical obligation", regulatory_change_id: "${chA}", criticality: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { obA: $.data.id }
            - call: "POST /compliance/obligations/${obA}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${chA}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${chA_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { iaA: $.data.id }
            - call: "POST /compliance/impact-assessments/${iaA}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${iaA}/submit"
              payload: { likelihood_score: 3, severity_score: 3, affected_business_lines: 1, findings_summary: "f" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${iaA}/accept"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/gap-analyses?impact_assessment_id=${iaA}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { gaA: "$.data[0].id" }
            - call: "POST /compliance/gap-analyses/${gaA}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/gap-analyses/${gaA}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "31 CFR 1010.230", title: "High Change", summary: "h", feed_source: "STATE_BULLETIN", jurisdiction: "US-CA", regulator: "DFPI", published_at: "2026-07-20T00:00:00Z", effective_date: "2027-01-01T00:00:00Z", severity_hint: "MEDIUM" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { chB: $.data.id }
            - call: "POST /compliance/regulatory-changes/${chB}/triage"
              payload: { verdict: "APPLICABLE", rationale: "applies" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { chB_v: $.data.version }
            - call: "POST /compliance/obligations"
              payload: { obligation_code: "OBL-2026-H02", title: "High obligation", regulatory_change_id: "${chB}", criticality: "HIGH" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { obB: $.data.id }
            - call: "POST /compliance/obligations/${obB}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${chB}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${chB_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { iaB: $.data.id }
            - call: "POST /compliance/impact-assessments/${iaB}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${iaB}/submit"
              payload: { likelihood_score: 4, severity_score: 4, affected_business_lines: 2, findings_summary: "f" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${iaB}/accept"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/gap-analyses?impact_assessment_id=${iaB}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { gaB: "$.data[0].id" }
            - call: "POST /compliance/gap-analyses/${gaB}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/gap-analyses/${gaB}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /compliance/implementation-plans"
              payload: { gap_analysis_id: "${gaA}", title: "Plan A one day late", target_completion_date: "2026-08-17T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { errA: $.data.error_id }
            - call: "POST /compliance/implementation-plans"
              payload: { gap_analysis_id: "${gaA}", title: "Plan A at mandate", target_completion_date: "2026-08-16T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { plA: $.data.id }
            - call: "POST /compliance/implementation-plans"
              payload: { gap_analysis_id: "${gaB}", title: "Plan B one day late", target_completion_date: "2026-10-03T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { errB: $.data.error_id }
            - call: "POST /compliance/implementation-plans"
              payload: { gap_analysis_id: "${gaB}", title: "Plan B at mandate", target_completion_date: "2026-10-02T00:00:00Z" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { plB: $.data.id }
          assert:
            - "CRITICAL plan with target 2026-08-17 rejected with ERR_DEADLINE_EXCEEDS_MANDATE; target 2026-08-16 accepted (15 calendar days from 2026-08-01, Sunday landing NOT rolled)"
            - "HIGH plan with target 2026-10-03 rejected with ERR_DEADLINE_EXCEEDS_MANDATE; target 2026-10-02 accepted (45 business days from 2026-08-01)"
            - "Same confirm date, same rule family, different mandates: calendar variant yields 2026-08-16, business variant yields 2026-10-02 (a naive calendar reading of N=45 would give 2026-09-15)"
            - "ImplementationPlan.${plA}.execution_status == DRAFT and ImplementationPlan.${plB}.execution_status == DRAFT"

  - rule_id: combinatorial_formula
    instances:
      - name: cf_impact_rating_scope_multiplier_tiers
        grounds:
          - calculations.impact_rating
        distinguishing_aspect: |
          Mode (a): three inputs (likelihood, severity, affected_business_lines) interact
          non-linearly through the conditional scope multiplier and tiered banding; the
          raw == 5.0 boundary lands MEDIUM (>= 5), and the 1.2 -> 1.5 multiplier step at
          4 business lines flips tier HIGH -> CRITICAL for identical likelihood/severity.
        test_recipe:
          setup:
            - "Three TRIAGED_APPLICABLE changes with assessments IN_PROGRESS (no obligations needed)"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "C-A", title: "Change A", summary: "a", feed_source: "MANUAL_ENTRY", jurisdiction: "US-FED", regulator: "OCC", published_at: "2026-07-01T00:00:00Z", effective_date: "2026-12-01T00:00:00Z", severity_hint: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { chA: $.data.id }
            - call: "POST /compliance/regulatory-changes/${chA}/triage"
              payload: { verdict: "APPLICABLE", rationale: "r" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { chA_v: $.data.version }
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${chA}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${chA_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { iaA: $.data.id }
            - call: "POST /compliance/impact-assessments/${iaA}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "C-B", title: "Change B", summary: "b", feed_source: "MANUAL_ENTRY", jurisdiction: "US-FED", regulator: "OCC", published_at: "2026-07-01T00:00:00Z", effective_date: "2026-12-01T00:00:00Z", severity_hint: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { chB: $.data.id }
            - call: "POST /compliance/regulatory-changes/${chB}/triage"
              payload: { verdict: "APPLICABLE", rationale: "r" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { chB_v: $.data.version }
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${chB}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${chB_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { iaB: $.data.id }
            - call: "POST /compliance/impact-assessments/${iaB}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "C-C", title: "Change C", summary: "c", feed_source: "MANUAL_ENTRY", jurisdiction: "EU", regulator: "EBA", published_at: "2026-07-01T00:00:00Z", effective_date: "2026-12-01T00:00:00Z", severity_hint: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { chC: $.data.id }
            - call: "POST /compliance/regulatory-changes/${chC}/triage"
              payload: { verdict: "APPLICABLE", rationale: "r" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { chC_v: $.data.version }
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${chC}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${chC_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { iaC: $.data.id }
            - call: "POST /compliance/impact-assessments/${iaC}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
          trigger:
            - call: "POST /compliance/impact-assessments/${iaA}/submit"
              payload: { likelihood_score: 4, severity_score: 4, affected_business_lines: 1, findings_summary: "one line" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { rawA: $.data.impact_rating_raw, tierA: $.data.impact_tier }
            - call: "POST /compliance/impact-assessments/${iaB}/submit"
              payload: { likelihood_score: 4, severity_score: 4, affected_business_lines: 4, findings_summary: "four lines" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { rawB: $.data.impact_rating_raw, tierB: $.data.impact_tier }
            - call: "POST /compliance/impact-assessments/${iaC}/submit"
              payload: { likelihood_score: 1, severity_score: 5, affected_business_lines: 1, findings_summary: "boundary" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { rawC: $.data.impact_rating_raw, tierC: $.data.impact_tier }
          assert:
            - "Assessment A: 4 x 4 x 1.0 = 16.0 -> HIGH"
            - "Assessment B: 4 x 4 x 1.5 = 24.0 -> CRITICAL (multiplier step 1.0 -> 1.5 at 4 lines flips tier with identical likelihood/severity)"
            - "Assessment C: 1 x 5 x 1.0 = 5.0 -> MEDIUM (raw == 5.0 boundary is inclusive of MEDIUM, not LOW)"

      - name: cf_training_pct_nested_rounding
        grounds:
          - calculations.training_completion_pct
          - entities.TrainingRollout.fields.completion_pct
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each department's percentage is rounded
          to 1 decimal FIRST, then averaged unweighted. The pinned order yields exactly 95.0
          for 20/20 ENG + 9/10 OPS, while the rejected pooled interpretation yields 96.7.
        test_recipe:
          setup:
            - "Control with a PUBLISHED policy update; its TrainingRollout is IN_PROGRESS with window [2026-08-01, 2026-08-20]"
            - "Attestations posted: department ENG 20/20 complete, department OPS 9/10 complete"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/controls"
              payload: { control_code: "CTL-AML-014", title: "Sanctions screening", owner_department: "COMP", review_frequency_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct_id: $.data.id, ct_v: $.data.version }
            - call: "POST /compliance/policy-updates"
              payload: { control_id: "${ct_id}", title: "v2 refresh", change_summary: "Expanded screening list", effective_date: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pu_id: $.data.id }
            - call: "POST /compliance/policy-updates/${pu_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/policy-updates/${pu_id}/approve"
              payload: { expected_control_version: "${ct_v}" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/policy-updates/${pu_id}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/training-rollouts?policy_update_id=${pu_id}"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
              captures: { ro_id: "$.data[0].id" }
            - call: "POST /compliance/training-rollouts/${ro_id}/attestations"
