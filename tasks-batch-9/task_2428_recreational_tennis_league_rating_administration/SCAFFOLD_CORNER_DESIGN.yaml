            - "$.data.active_roster_size == 2"
            - "$.data.roster_compliant == true"
            - "a follow-up GET /tennis/leagues/${lg_id} returns $.data.registered_team_count == 1 and $.data.noncompliant_team_count == 0"
            - "a follow-up GET /tennis/teams with league_id=${lg_id} and status=REGISTERED returns $.data.total_count == 1"

      - name: team_withdraw_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Team
          - errors.ERR_INVALID_STATE
          - validations.priority_20
        distinguishing_aspect: "§1.2 declares withdraw only from REGISTERED, ROSTER_LOCKED and IN_PLAY — never from DRAFT. Because §1.4 priority 31 (ERR_TEAM_STATE_INVALID) does not list the withdraw endpoint in its applies_to, DRAFT withdrawal is the clean case where the generic priority-20 rule is the ONLY applicable check, and no roster spot may be swept to REMOVED as a partial side effect."
        test_recipe:
          setup:
            - "A DRAFT team with one ACTIVE roster spot that has never been registered."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
