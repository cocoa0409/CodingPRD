            - "One center with daily_pick_capacity_units 6 and freight_cents_per_kit 100."
            - "One campaign in SAMPLING_ACTIVE with a single kit line whose quantity_per_kit is 4, so every shipment consumes exactly 4 wave units and commits 1134 + 100 = 1234 cents."
