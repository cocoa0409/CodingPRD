            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "PACK_REPLACEMENT", decision_note: "pool holds only the 84.99 pack" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-R8500", pack_type: "REMANUFACTURED", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, stock_region_code: "US-WEST", refurb_soh_pct: 85.00 }
