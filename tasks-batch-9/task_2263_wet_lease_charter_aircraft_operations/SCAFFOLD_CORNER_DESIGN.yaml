        grounds:
          - calculations.return_discrepancy_cost
          - entities.ReturnCondition.fields.billed_to_lessee_cents
          - entities.LeaseAgreement.fields.return_deposit_applied_cents
          - endpoints[POST /wetlease/return-conditions/{returnId}/inspect]
        distinguishing_aspect: |
          Readings 355.50 h / 138 cycles / 3600 kg against ceilings 300.00 / 120 / 4000 price out at
          55.50 x 2500 + 18 x 18000 + 400 x 95 = 138750 + 324000 + 38000 = 500,750 - under the
          900,000 liability cap and over the 500,000 deposit, so the FIRST bucket fills completely
          (applied 500000, remaining 0) and only the 750-cent overflow reaches the lessee. The
          re-inspection is the trap: the waterfall restarts from the FULL 500,000 deposit, so the
          numbers are byte-identical, whereas an implementation that draws from the surviving
          remainder would report applied 0 and billed 500,750 the second time.
          
