# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_1410_playtest_recruitment_feedback_program
# Playtest Recruitment & Feedback Program (game studio user research)
# Difficulty target: beyond Expert band (17 entities, ~70 endpoints, 39 errors,
# 7 calculations with dual variants, 13 state machines incl. cycles + cascades)
# =============================================================================

scenario: |
  Playtest Recruitment & Feedback Program (game studio user research):
  participant screening & NDA execution, build distribution with access keys &
  expiry, session scheduling (remote/in-lab) & moderator assignment, telemetry &
  survey instrument design, feedback synthesis & priority backlog routing,
  incentive/compensation issuance, confidentiality breach handling, cohort
  tracking across builds

domain_name: playtest-recruitment-feedback
api_prefix: /playtests

complexity_profile:
  primary_archetype: compliance_audit        # NDA execution, breach handling, segregation of duties
  secondary_archetype: quota_allocation      # seats, access keys, cohort capacity competed for
  complexity_layers:
    - optimistic_concurrency                 # OCC on Study.version and PlaytestSession.version
    - cascading_side_effects                 # breach substantiation, NDA re-papering, no-show suspension
    - dual_variant_calculation               # provisional vs verified fit; provisional vs final payout
    - rate_threshold_triggers                # no-show strike threshold, incentive tiers, priority tiers

  entity_topology: flat                      # peer entities with foreign-key references, flat URL space
  state_machine_shape: parallel              # per-entity machines vary; dominant shapes are cyclic (ScreeningApplication, FeedbackTicket, IncentivePayout) and guarded (SessionBooking, AccessKey)
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # bookings reference session + enrolled application; payouts aggregate bookings + surveys
  role_model: segregation_of_duties          # payout creator != approver != issuer; breach reporter != adjudicator
  consistency_model: immediate               # all changes atomic and visible in the same request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Participant email; unique across all participants" }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: age_years, type: integer, source: input, description: "Self-declared age in years; must be >= 13" }
      - { name: region_code, type: string, source: input, description: "Self-declared region code, e.g. US-W" }
      - { name: platform_tags, type: array, source: input, description: "Self-declared platform tags, e.g. [PC, PS5, XB]" }
      - { name: verified_platform_tags, type: array, source: system, default: [], description: "Platform tags verified by ops via POST /playtests/participants/{id}/verify-attributes; empty until verified" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | SUSPENDED | BANNED" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of SessionBookings in NO_SHOW with no_show_recorded_at within rolling 90 days before now; reset to 0 on reinstate" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Confidentiality risk score; +10 MINOR / +25 MAJOR / +40 CRITICAL per SUBSTANTIATED breach, capped at 100" }

  - name: Moderator
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Moderator display name" }
      - { name: email, type: string, source: input, description: "Moderator email; unique across all moderators" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: code, type: string, source: input, description: "Study code; unique across all studies" }
      - { name: min_age, type: integer, source: input, description: "Minimum eligible age (inclusive)" }
      - { name: max_age, type: integer, source: input, description: "Maximum eligible age (inclusive); must be >= min_age" }
      - { name: allowed_regions, type: array, source: input, description: "Region codes eligible for this study" }
      - { name: required_platforms, type: array, source: input, description: "Platform tags the study targets; empty array means platform-agnostic" }
      - { name: cohort_capacity, type: integer, source: input, description: "Maximum number of ENROLLED applications; must be >= 1" }
      - { name: incentive_budget_cents, type: integer, source: input, description: "Total incentive budget for the study in cents; must be >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECRUITING | CLOSED | ANALYSIS | COMPLETED" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of ScreeningApplications in ENROLLED for this study" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of amount_final_cents over IncentivePayouts in {APPROVED, ISSUED} for this study" }
      - { name: budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of amount_final_cents over IncentivePayouts in {ISSUED} for this study" }

  - name: ScreeningApplication
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study applied to" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from X-User-ID of the creating Participant call" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | ENROLLED | REJECTED | WITHDRAWN" }
      - { name: fit_score_provisional, type: integer, source: computed, description: "screening_fit_score self_reported variant computed at submission" }
      - { name: fit_score_final, type: integer, source: computed, default: null, description: "screening_fit_score verified variant computed at approve; null until approve is attempted" }
      - { name: pinned_nda_agreement_id, type: string, source: system, default: null, description: "FK -> NdaAgreement.id; the PUBLISHED agreement pinned at approve time" }
      - { name: info_request_note, type: string, source: input, default: null, description: "Note recorded when more info is requested" }
      - { name: decision_reason, type: string, source: input, default: null, description: "Reason recorded on reject" }
      # Uniqueness: at most one application per (study_id, participant_id) in
      # {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, ENROLLED}.

  - name: NdaAgreement
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study this NDA text belongs to" }
      - { name: version_label, type: string, source: input, description: "Version label, e.g. v1; unique per study" }
      - { name: body_text, type: string, source: input, description: "Full NDA text presented for signature" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Timestamp when the agreement entered PUBLISHED" }

  - name: NdaSignature
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> NdaAgreement.id; agreement version being signed" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; signer" }
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; denormalized from the agreement for querying" }
      - { name: application_id, type: string, source: system, description: "FK -> ScreeningApplication.id; application whose enrollment this signature gates" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | VOIDED | EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "= created_at + 7 days; signature must be completed strictly before this instant" }
      - { name: signed_at, type: datetime, source: system, default: null, description: "Timestamp of signature" }
      # Uniqueness: at most one signature per (agreement_id, participant_id) in
      # {PENDING, SIGNED}.

  - name: GameBuild
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study this build belongs to" }
      - { name: build_label, type: string, source: input, description: "Build label, e.g. 0.9.3-qa; unique per study" }
      - { name: max_keys, type: integer, source: input, description: "Maximum number of non-terminal access keys the build may have at any moment; must be >= 1" }
      - { name: key_ttl_hours, type: integer, source: input, default: 72, description: "Hours from issuance until an unredeemed key expires; must be >= 1" }
      - { name: status, type: enum, source: system, description: "STAGED | RELEASED | RETIRED" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Timestamp when the build entered RELEASED" }
      - { name: keys_active_count, type: integer, source: computed, default: 0, description: "Count of AccessKeys in {ISSUED, REDEEMED} for this build" }

  - name: AccessKey
    parent: null
    common_fields: true
    fields:
      - { name: build_id, type: string, source: system, description: "FK -> GameBuild.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; key recipient" }
      - { name: key_code, type: string, source: system, description: "Server-minted unique key code, format KEY-<12 uppercase alnum>" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | EXPIRED | REVOKED" }
      - { name: expires_at, type: datetime, source: system, description: "= issued_at + build.key_ttl_hours hours; redeem requires now < expires_at" }
      - { name: redeemed_at, type: datetime, source: system, default: null, description: "Timestamp of redemption" }
      # Uniqueness: at most one key per (build_id, participant_id) in
      # {ISSUED, REDEEMED}.

  - name: LabStation
    parent: null
    common_fields: true
    fields:
      - { name: station_code, type: string, source: input, description: "Station code; unique across all stations" }
      - { name: location, type: string, source: input, description: "Lab location" }
      - { name: equipment_tags, type: array, source: input, default: [], description: "Equipment available at the station" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OUT_OF_SERVICE" }

  - name: PlaytestSession
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: mode, type: enum, source: input, description: "REMOTE | IN_LAB" }
      - { name: station_id, type: string, source: input, default: null, description: "FK -> LabStation.id; required when mode == IN_LAB, must be null when mode == REMOTE" }
      - { name: moderator_id, type: string, source: system, default: null, description: "FK -> Moderator.id; assigned via assign-moderator" }
      - { name: starts_at, type: datetime, source: input, description: "Session window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Session window end (inclusive for start-gating); must be > starts_at" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum occupied seats; must be >= 1" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of SessionBookings in {BOOKED, PROMOTED, ATTENDED, NO_SHOW} for this session" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: SessionBooking
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> PlaytestSession.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from X-User-ID of the creating Participant call" }
      - { name: status, type: enum, source: system, description: "BOOKED | WAITLISTED | PROMOTED | ATTENDED | NO_SHOW | CANCELLED" }
      - { name: no_show_recorded_at, type: datetime, source: system, default: null, description: "Timestamp when the booking entered NO_SHOW (drives the rolling strike window)" }
      # Uniqueness: at most one booking per (session_id, participant_id) in
      # {BOOKED, WAITLISTED, PROMOTED}.

  - name: SurveyInstrument
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: title, type: string, source: input, description: "Instrument title" }
      - { name: questions, type: array, source: input, description: "Array of { question_key, weight, max_points }; question_key unique within the instrument; weight > 0; max_points >= 1" }
      - { name: pass_threshold, type: number, source: input, description: "score_pct must be >= pass_threshold to pass; 0..100" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }
      # Constraint: at most one PUBLISHED instrument per study at any time.

  - name: SurveyResponse
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> SurveyInstrument.id; must be PUBLISHED at submit time" }
      - { name: session_id, type: string, source: input, description: "FK -> PlaytestSession.id; session this feedback covers" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from X-User-ID of the creating Participant call" }
      - { name: answers, type: array, source: input, description: "Array of { question_key, points }; 0 <= points <= question.max_points" }
      - { name: weighted_score, type: number, source: computed, default: null, description: "survey_weighted_score output; null until SUBMITTED" }
      - { name: score_pct, type: number, source: computed, default: null, description: "Percentage of total weight achieved; null until SUBMITTED" }
      - { name: passed, type: boolean, source: computed, default: null, description: "score_pct >= instrument.pass_threshold; null until SUBMITTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Timestamp of submission" }
      # Uniqueness: at most one response per (instrument_id, session_id,
      # participant_id).

  - name: FeedbackTicket
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: session_id, type: string, source: input, default: null, description: "FK -> PlaytestSession.id; optional session the feedback was observed in" }
      - { name: survey_response_id, type: string, source: input, default: null, description: "FK -> SurveyResponse.id; optional response this ticket synthesizes" }
      - { name: title, type: string, source: input, description: "Short issue title" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: reach_count, type: integer, source: input, description: "Estimated number of affected users; >= 0" }
      - { name: reproducibility_pct, type: number, source: input, description: "Reproduction rate in [0, 1]" }
      - { name: priority_score, type: number, source: computed, default: null, description: "feedback_priority_score output; null until first triage" }
      - { name: priority_tier, type: enum, source: computed, default: null, description: "P1 | P2 | P3 | P4; null until first triage" }
      - { name: backlog_target, type: enum, source: input, default: null, description: "GAMEPLAY | PERFORMANCE | UX | AUDIO | INFRA; set on route" }
      - { name: status, type: enum, source: system, description: "NEW | TRIAGED | NEEDS_INFO | ROUTED | RESOLVED | WONT_FIX" }

  - name: IncentivePayout
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; payee" }
      - { name: amount_provisional_cents, type: integer, source: computed, description: "incentive_amount provisional variant computed at DRAFT creation and frozen" }
      - { name: amount_final_cents, type: integer, source: computed, default: null, description: "incentive_amount final variant recomputed at approve; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | ISSUED | VOID" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the IncentiveOfficer who created the draft" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving IncentiveOfficer; must differ from created_by_user_id" }
      - { name: issued_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the issuing IncentiveOfficer; must differ from approved_by_user_id" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Reason recorded on reject" }
      # Uniqueness: at most one payout per (study_id, participant_id) in
      # {DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, ISSUED}.

  - name: BreachCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; accused participant" }
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; study whose confidentiality was breached" }
      - { name: evidence_summary, type: string, source: input, description: "Free-text evidence summary" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (Moderator or Researcher)" }
      - { name: reported_by_role, type: string, source: system, description: "X-User-Role of the reporter" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LegalCounsel who opened the investigation; must differ from reported_by_user_id" }
      - { name: sanction_type, type: enum, source: input, default: null, description: "WARNING | BAN; set on sanction" }
      - { name: sanction_note, type: string, source: input, default: null, description: "Note recorded on sanction" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | DISMISSED | SUBSTANTIATED | SANCTIONED" }

  - name: ExposureRecord
    parent: null
    common_fields: false   # append-only event log: id + created_at only, no update endpoint, no version
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: build_id, type: string, source: system, description: "FK -> GameBuild.id" }
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; denormalized from the build" }
      - { name: event_type, type: enum, source: system, description: "KEY_ISSUED | KEY_REDEEMED | KEY_REVOKED | KEY_EXPIRED" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when the event was recorded" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Participant
    initial_state: REGISTERED
    terminal_states: [BANNED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /playtests/participants/{id}/activate"
        actor: ResearchOpsAdmin
        preconditions: ["participant.status == REGISTERED"]
        side_effects: ["participant.status := ACTIVE"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /playtests/participants/{id}/suspend, OR auto-transition when no_show_strikes reaches 3, OR cascade from BreachCase substantiation"
        actor: ResearchOpsAdmin | system
        preconditions: ["participant.status == ACTIVE"]
        side_effects:
          - "Every SessionBooking of this participant in {BOOKED, PROMOTED} := CANCELLED; each such cancellation frees a seat and immediately promotes the earliest-created eligible waitlisted booking on the same session (see SessionBooking CANCELLED transition); bookings in WAITLISTED := CANCELLED (no promotion for waitlist slots)"
          - "Every AccessKey of this participant in {ISSUED} := REVOKED, each writing an ExposureRecord KEY_REVOKED and decrementing build.keys_active_count by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /playtests/participants/{id}/reinstate"
        actor: ResearchOpsAdmin
        preconditions:
          - "participant.status == SUSPENDED"
          - "no BreachCase for this participant in {REPORTED, UNDER_INVESTIGATION, SUBSTANTIATED} (else ERR_OPEN_BREACH_EXISTS)"
        side_effects: ["participant.no_show_strikes := 0", "participant.status := ACTIVE"]
      - from: ACTIVE
        to: BANNED
        trigger: "POST /playtests/participants/{id}/ban, OR cascade from BreachCase sanction with sanction_type == BAN"
        actor: LegalCounsel
        preconditions: ["participant.status == ACTIVE"]
        side_effects: ["ban cascade (see SUSPENDED -> BANNED)"]
      - from: SUSPENDED
        to: BANNED
        trigger: "POST /playtests/participants/{id}/ban, OR cascade from BreachCase sanction with sanction_type == BAN"
        actor: LegalCounsel
        preconditions: ["participant.status == SUSPENDED"]
        side_effects:
          - "Every SessionBooking in {BOOKED, PROMOTED, WAITLISTED} := CANCELLED (freed seats promote per the booking-cancel rule)"
          - "Every AccessKey in {ISSUED, REDEEMED} := REVOKED, each writing ExposureRecord KEY_REVOKED and decrementing build.keys_active_count"
          - "Every NdaSignature in {PENDING, SIGNED} := VOIDED; any application in ENROLLED whose signature was voided reverts to APPROVED (study.enrolled_count -= 1 per reverted application)"
          - "Every IncentivePayout in {DRAFT, PENDING_APPROVAL, REJECTED} := VOID; every IncentivePayout in {APPROVED} := VOID and study.budget_committed_cents -= payout.amount_final_cents"

  - entity: ScreeningApplication
    initial_state: SUBMITTED
    terminal_states: [ENROLLED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /playtests/applications/{id}/start-review"
        actor: Researcher
        preconditions: ["application.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /playtests/applications/{id}/request-info"
        actor: Researcher
        preconditions: ["application.status == UNDER_REVIEW"]
        side_effects: ["application.info_request_note := request payload note"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /playtests/applications/{id}/submit-info"
        actor: Participant
        preconditions:
          - "application.status == INFO_REQUESTED"
          - "X-User-ID == application.participant_id (ownership, else ERR_FORBIDDEN)"
        side_effects: []
        note: "cycle: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat without limit"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /playtests/applications/{id}/approve"
        actor: Researcher
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "study.status == RECRUITING (else ERR_STUDY_NOT_RECRUITING)"
          - "a PUBLISHED NdaAgreement exists for the study (selector: status == PUBLISHED; at most one exists by the publish rule; else ERR_NDA_NOT_PUBLISHED)"
          - "study.enrolled_count < study.cohort_capacity (else ERR_COHORT_FULL)"
          - "fit_score_final := screening_fit_score(verified) >= FIT_PASS_THRESHOLD (else ERR_FIT_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "application.fit_score_final := screening_fit_score(verified variant)"
          - "application.pinned_nda_agreement_id := the PUBLISHED agreement's id"
          - "create NdaSignature{agreement_id: pinned id, participant_id, study_id, application_id, status: PENDING, expires_at: now + 7 days}"
      - from: APPROVED
        to: ENROLLED
        trigger: "auto-transition (bubble-up) when this application's PENDING NdaSignature becomes SIGNED"
        actor: system
        preconditions: ["the application's signature just transitioned PENDING -> SIGNED"]
        side_effects: ["study.enrolled_count += 1"]
      - from: ENROLLED
        to: APPROVED
        trigger: "auto-transition (re-papering) when this application's SIGNED NdaSignature becomes VOIDED via NDA re-publish cascade"
        actor: system
        preconditions: ["the application's signature was voided because its agreement was RETIRED by a new publish"]
        side_effects:
          - "study.enrolled_count -= 1"
          - "application.pinned_nda_agreement_id := the newly PUBLISHED agreement's id"
          - "create NdaSignature{agreement_id: new PUBLISHED id, participant_id, study_id, application_id, status: PENDING, expires_at: now + 7 days}"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /playtests/applications/{id}/reject"
        actor: Researcher
        preconditions: ["application.status == UNDER_REVIEW"]
        side_effects: ["application.decision_reason := request payload decision_reason"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /playtests/applications/{id}/withdraw"
        actor: Participant
        preconditions: ["X-User-ID == application.participant_id (ownership)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /playtests/applications/{id}/withdraw"
        actor: Participant
        preconditions: ["X-User-ID == application.participant_id (ownership)"]
        side_effects: []

  - entity: NdaAgreement
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /playtests/nda-agreements/{id}/publish"
        actor: LegalCounsel
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.study_id references an existing Study"
        side_effects:
          - "agreement.published_at := now"
          - "CASCADE link 1: the previously PUBLISHED NdaAgreement for the same study (if any) := RETIRED"
          - "CASCADE link 2: every NdaSignature on that retired agreement in {PENDING, SIGNED} := VOIDED"
          - "CASCADE link 3: every application in ENROLLED whose SIGNED signature was just voided reverts to APPROVED (see ScreeningApplication ENROLLED -> APPROVED: enrolled_count -= 1, pin switches to the newly published agreement, fresh PENDING signature created)"
      - from: PUBLISHED
        to: RETIRED
        trigger: "cascade only: a subsequent NdaAgreement for the same study is published"
        actor: system
        preconditions: ["another agreement for the same study transitions DRAFT -> PUBLISHED"]
        side_effects: ["see publish cascade links 2-3"]

  - entity: NdaSignature
    initial_state: PENDING
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /playtests/nda-signatures/{id}/sign"
        actor: Participant
        preconditions:
          - "signature.status == PENDING"
          - "X-User-ID == signature.participant_id (ownership, else ERR_FORBIDDEN)"
          - "agreement.status == PUBLISHED (else ERR_INVALID_STATE on the agreement)"
          - "now < signature.expires_at (else ERR_SIGNATURE_EXPIRED)"
        side_effects:
          - "signature.signed_at := now"
          - "BUBBLE UP: signature's application APPROVED -> ENROLLED; study.enrolled_count += 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /playtests/_sweeps/run-expiry (system expiry sweep)"
        actor: system
        preconditions: ["signature.status == PENDING", "now >= signature.expires_at (boundary: expires_at == now expires)"]
        side_effects: []
      - from: PENDING
        to: VOIDED
        trigger: "cascade: agreement retired by re-publish, or participant banned"
        actor: system
        preconditions: ["owning agreement PUBLISHED -> RETIRED, or participant -> BANNED"]
        side_effects: []
      - from: SIGNED
        to: VOIDED
        trigger: "cascade: agreement retired by re-publish, or participant banned"
        actor: system
        preconditions: ["owning agreement PUBLISHED -> RETIRED, or participant -> BANNED"]
        side_effects: ["if the parent application was ENROLLED it reverts to APPROVED (see ScreeningApplication)"]

  - entity: GameBuild
    initial_state: STAGED
    terminal_states: [RETIRED]
    transitions:
      - from: STAGED
        to: RELEASED
        trigger: "POST /playtests/builds/{id}/release"
        actor: ResearchOpsAdmin
        preconditions:
          - "build.status == STAGED"
          - "study.status in {RECRUITING, CLOSED, ANALYSIS} (else ERR_INVALID_STATE)"
        side_effects: ["build.released_at := now"]
      - from: RELEASED
        to: RETIRED
        trigger: "POST /playtests/builds/{id}/retire"
        actor: ResearchOpsAdmin
        preconditions: ["build.status == RELEASED"]
        side_effects:
          - "every AccessKey of this build in {ISSUED} := REVOKED, each writing ExposureRecord KEY_REVOKED and decrementing build.keys_active_count by 1 (REDEEMED keys are left untouched)"

  - entity: AccessKey
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /playtests/access-keys/{id}/redeem"
        actor: Participant
        preconditions:
          - "key.status == ISSUED"
          - "X-User-ID == key.participant_id (ownership, else ERR_FORBIDDEN)"
          - "now < key.expires_at (else ERR_KEY_EXPIRED; boundary: now == expires_at is expired)"
        side_effects:
          - "key.redeemed_at := now"
          - "write ExposureRecord{event_type: KEY_REDEEMED} (keys_active_count unchanged: REDEEMED remains in the active set)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /playtests/_sweeps/run-expiry (system expiry sweep)"
        actor: system
        preconditions: ["key.status == ISSUED", "now >= key.expires_at (boundary: expires_at == now expires)"]
        side_effects: ["write ExposureRecord{event_type: KEY_EXPIRED}", "build.keys_active_count -= 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /playtests/access-keys/{id}/revoke, OR cascade from participant suspend/ban, OR cascade from build retire"
        actor: ResearchOpsAdmin | LegalCounsel | system
        preconditions: ["key.status == ISSUED"]
        side_effects: ["write ExposureRecord{event_type: KEY_REVOKED}", "build.keys_active_count -= 1"]
      - from: REDEEMED
        to: REVOKED
        trigger: "cascade from participant ban or breach-sanction BAN only"
        actor: system
        preconditions: ["key.status == REDEEMED", "participant enters BANNED"]
        side_effects: ["write ExposureRecord{event_type: KEY_REVOKED}", "build.keys_active_count -= 1"]

  - entity: PlaytestSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /playtests/sessions/{id}/start"
        actor: Moderator
        preconditions:
          - "session.status == SCHEDULED"
          - "session.moderator_id is not null (else ERR_MODERATOR_REQUIRED)"
          - "X-User-ID == session.moderator_id (ownership, else ERR_FORBIDDEN)"
          - "study.status in {CLOSED, ANALYSIS} (else ERR_STUDY_NOT_CLOSED)"
          - "session.starts_at <= now <= session.ends_at (else ERR_SESSION_NOT_IN_WINDOW)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /playtests/sessions/{id}/complete"
        actor: Moderator
        preconditions:
          - "session.status == IN_PROGRESS"
          - "X-User-ID == session.moderator_id (ownership, else ERR_FORBIDDEN)"
        side_effects:
          - "every booking of this session still in {BOOKED, PROMOTED} := NO_SHOW with no_show_recorded_at := now (auto no-show); each auto-no-show recomputes its participant's no_show_strikes and may trigger the Participant ACTIVE -> SUSPENDED auto-transition with its full cascade (cancel other bookings + promote waitlists + revoke ISSUED keys)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /playtests/sessions/{id}/cancel"
        actor: Researcher | ResearchOpsAdmin
        preconditions: ["session.status == SCHEDULED"]
        side_effects:
          - "every booking of this session in {BOOKED, PROMOTED, WAITLISTED} := CANCELLED (no waitlist promotion: the session is dead)"
          - "session.seats_taken := 0"

  - entity: SessionBooking
    initial_state: BOOKED   # or WAITLISTED when the seat gate evaluates full; see create rule
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /playtests/session-bookings/{id}/cancel, OR cascade from participant suspend/ban, OR cascade from session cancel"
        actor: Participant | ResearchOpsAdmin | system
        preconditions:
          - "booking.status == BOOKED"
          - "Participant actor: X-User-ID == booking.participant_id (ownership, else ERR_FORBIDDEN)"
        side_effects:
          - "session.seats_taken -= 1"
          - "PROMOTION (skipped when the cancellation came from a session-cancel cascade): the earliest-created eligible waitlisted booking on the same session := PROMOTED. Eligible set: bookings with session_id == this session, status == WAITLISTED, and participant.status == ACTIVE. Ranking: created_at ASC. Tie-break: created_at values are distinct by construction (server-stamped at insertion). Empty-set fallback: no promotion, seat stays free. On promotion session.seats_taken += 1."
      - from: PROMOTED
        to: CANCELLED
        trigger: "POST /playtests/session-bookings/{id}/cancel, OR cascades as above"
        actor: Participant | ResearchOpsAdmin | system
        preconditions: ["booking.status == PROMOTED", "ownership as above"]
        side_effects: ["identical to BOOKED -> CANCELLED (seat frees, next waitlisted booking promotes)"]
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /playtests/session-bookings/{id}/cancel, OR cascades as above"
        actor: Participant | ResearchOpsAdmin | system
        preconditions: ["booking.status == WAITLISTED", "ownership as above"]
        side_effects: ["no seat freed (waitlist entries never held a seat); no promotion"]
      - from: WAITLISTED
        to: PROMOTED
        trigger: "auto-transition when a seat frees on the same session (see BOOKED -> CANCELLED promotion rule)"
        actor: system
        preconditions: ["this booking is the earliest-created eligible WAITLISTED booking on that session"]
        side_effects: ["session.seats_taken += 1"]
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /playtests/session-bookings/{id}/mark-attended"
        actor: Moderator
        preconditions:
          - "booking.status in {BOOKED, PROMOTED}"
          - "session.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "X-User-ID == session.moderator_id (ownership, else ERR_FORBIDDEN)"
        side_effects: []
      - from: PROMOTED
        to: ATTENDED
        trigger: "POST /playtests/session-bookings/{id}/mark-attended"
        actor: Moderator
        preconditions: ["as BOOKED -> ATTENDED"]
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /playtests/session-bookings/{id}/mark-no-show, OR auto on session complete"
        actor: Moderator | system
        preconditions:
          - "booking.status in {BOOKED, PROMOTED}"
          - "explicit mark: session.status == IN_PROGRESS and X-User-ID == session.moderator_id; auto: session completing"
        side_effects:
          - "booking.no_show_recorded_at := now"
          - "participant.no_show_strikes := count of this participant's bookings in NO_SHOW with no_show_recorded_at >= now - 90 days (inclusive boundary)"
          - "if participant.status == ACTIVE and no_show_strikes >= 3 (boundary: exactly 3 triggers): participant := SUSPENDED with full suspension cascade"
      - from: PROMOTED
        to: NO_SHOW
        trigger: "POST /playtests/session-bookings/{id}/mark-no-show, OR auto on session complete"
        actor: Moderator | system
        preconditions: ["as BOOKED -> NO_SHOW"]
        side_effects: ["as BOOKED -> NO_SHOW"]

  - entity: SurveyInstrument
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /playtests/survey-instruments/{id}/publish"
        actor: Researcher
        preconditions:
          - "instrument.status == DRAFT"
          - "no other SurveyInstrument for the same study is PUBLISHED (else ERR_INSTRUMENT_ALREADY_PUBLISHED)"
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /playtests/survey-instruments/{id}/retire"
        actor: Researcher
        preconditions: ["instrument.status == PUBLISHED"]
        side_effects: []

  - entity: SurveyResponse
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /playtests/survey-responses/{id}/submit"
        actor: Participant
        preconditions:
          - "response.status == DRAFT"
          - "X-User-ID == response.participant_id (ownership, else ERR_FORBIDDEN)"
          - "instrument.status == PUBLISHED (else ERR_INVALID_STATE)"
          - "a SessionBooking for (session_id == response.session_id, participant_id == response.participant_id) exists in ATTENDED (else ERR_ATTENDANCE_REQUIRED)"
          - "every answers[].question_key exists in instrument.questions (else ERR_UNKNOWN_QUESTION)"
        side_effects:
          - "weighted_score, score_pct, passed := survey_weighted_score(response, instrument)"
          - "response.submitted_at := now"
        note: "SUBMITTED responses are immutable: no endpoint mutates a SUBMITTED response"

  - entity: FeedbackTicket
    initial_state: NEW
    terminal_states: [RESOLVED, WONT_FIX]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /playtests/feedback-tickets/{id}/triage"
        actor: Researcher
        preconditions: ["ticket.status in {NEW, NEEDS_INFO}"]
        side_effects: ["priority_score, priority_tier := feedback_priority_score(ticket)"]
      - from: NEEDS_INFO
        to: TRIAGED
        trigger: "POST /playtests/feedback-tickets/{id}/triage"
        actor: Researcher
        preconditions: ["ticket.status in {NEW, NEEDS_INFO}"]
        side_effects: ["priority_score, priority_tier := feedback_priority_score(ticket)"]
        note: "cycle: TRIAGED -> NEEDS_INFO -> TRIAGED may repeat; each triage recomputes the score"
      - from: TRIAGED
        to: NEEDS_INFO
        trigger: "POST /playtests/feedback-tickets/{id}/request-info"
        actor: Researcher
        preconditions: ["ticket.status == TRIAGED"]
        side_effects: []
      - from: TRIAGED
        to: ROUTED
        trigger: "POST /playtests/feedback-tickets/{id}/route"
        actor: Researcher
        preconditions: ["ticket.status == TRIAGED"]
        side_effects: ["ticket.backlog_target := request payload backlog_target"]
      - from: ROUTED
        to: RESOLVED
        trigger: "POST /playtests/feedback-tickets/{id}/resolve"
        actor: Researcher
        preconditions: ["ticket.status == ROUTED"]
        side_effects: []
      - from: ROUTED
        to: WONT_FIX
        trigger: "POST /playtests/feedback-tickets/{id}/mark-wont-fix"
        actor: Researcher
        preconditions: ["ticket.status == ROUTED"]
        side_effects: []

  - entity: IncentivePayout
    initial_state: DRAFT
    terminal_states: [ISSUED, VOID]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /playtests/incentive-payouts/{id}/submit"
        actor: IncentiveOfficer
        preconditions: ["payout.status == DRAFT"]
        side_effects: []
      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /playtests/incentive-payouts/{id}/resubmit"
        actor: IncentiveOfficer
        preconditions: ["payout.status == REJECTED"]
        side_effects: []
        note: "cycle: PENDING_APPROVAL -> REJECTED -> PENDING_APPROVAL may repeat"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /playtests/incentive-payouts/{id}/approve"
        actor: IncentiveOfficer
        preconditions:
          - "payout.status == PENDING_APPROVAL (else ERR_INVALID_STATE; this state check outranks the budget check)"
          - "X-User-ID != payout.created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "participant.status != BANNED (else ERR_PARTICIPANT_NOT_ACTIVE)"
          - "budget_commit check: study.budget_committed_cents + recomputed final amount <= study.incentive_budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "amount_final_cents := incentive_amount(final variant) recomputed against current bookings/responses"
          - "study.budget_committed_cents += amount_final_cents"
          - "payout.approved_by_user_id := X-User-ID"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /playtests/incentive-payouts/{id}/reject"
        actor: IncentiveOfficer
        preconditions: ["payout.status == PENDING_APPROVAL"]
        side_effects: ["payout.rejection_reason := request payload rejection_reason"]
      - from: APPROVED
        to: ISSUED
        trigger: "POST /playtests/incentive-payouts/{id}/issue"
        actor: IncentiveOfficer
        preconditions:
          - "payout.status == APPROVED"
          - "X-User-ID != payout.approved_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "study.budget_spent_cents += amount_final_cents"
          - "payout.issued_by_user_id := X-User-ID"
      - from: DRAFT
        to: VOID
        trigger: "cascade from participant ban"
        actor: system
        preconditions: ["participant enters BANNED"]
        side_effects: []
      - from: PENDING_APPROVAL
        to: VOID
        trigger: "cascade from participant ban"
        actor: system
        preconditions: ["participant enters BANNED"]
        side_effects: []
      - from: REJECTED
        to: VOID
        trigger: "cascade from participant ban"
        actor: system
        preconditions: ["participant enters BANNED"]
        side_effects: []
      - from: APPROVED
        to: VOID
        trigger: "cascade from participant ban"
        actor: system
        preconditions: ["participant enters BANNED"]
        side_effects: ["study.budget_committed_cents -= payout.amount_final_cents (compensates the approval commit)"]

  - entity: BreachCase
    initial_state: REPORTED
    terminal_states: [DISMISSED, SANCTIONED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /playtests/breach-cases/{id}/open-investigation"
        actor: LegalCounsel
        preconditions:
          - "case.status == REPORTED"
          - "X-User-ID != case.reported_by_user_id (the reporter cannot adjudicate, else ERR_REPORTER_CANNOT_ADJUDICATE)"
        side_effects: ["case.adjudicated_by_user_id := X-User-ID"]
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /playtests/breach-cases/{id}/substantiate"
        actor: LegalCounsel
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
          - "X-User-ID == case.adjudicated_by_user_id (else ERR_FORBIDDEN)"
        side_effects:
          - "participant.risk_score := min(100, risk_score + severity_weight) where severity_weight = MINOR 10 | MAJOR 25 | CRITICAL 40"
          - "CASCADE link 1: if participant.status == ACTIVE then participant := SUSPENDED"
          - "CASCADE link 2 (from the suspension): the participant's bookings in {BOOKED, PROMOTED, WAITLISTED} := CANCELLED; each freed seat promotes the earliest-created eligible waitlisted booking on that session"
          - "CASCADE link 3 (from each freed seat): promoted booking WAITLISTED -> PROMOTED and session.seats_taken unchanged by the cancel+promote pair"
          - "also from the suspension: the participant's AccessKeys in {ISSUED} := REVOKED with ExposureRecord KEY_REVOKED each"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /playtests/breach-cases/{id}/dismiss"
        actor: LegalCounsel
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
          - "X-User-ID == case.adjudicated_by_user_id (else ERR_FORBIDDEN)"
        side_effects: []
      - from: SUBSTANTIATED
        to: SANCTIONED
        trigger: "POST /playtests/breach-cases/{id}/sanction"
        actor: LegalCounsel
        preconditions:
          - "case.status == SUBSTANTIATED"
          - "X-User-ID == case.adjudicated_by_user_id (else ERR_FORBIDDEN)"
          - "sanction_type in {WARNING, BAN}"
        side_effects:
          - "if sanction_type == BAN: participant := BANNED with the full ban cascade (bookings, keys incl. REDEEMED, signatures, payouts)"
          - "if sanction_type == WARNING: participant status unchanged (remains SUSPENDED; the case leaving SUBSTANTIATED unblocks reinstate)"

  - entity: Study
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: RECRUITING
        trigger: "POST /playtests/studies/{id}/open-recruitment"
        actor: ResearchOpsAdmin
        preconditions: ["study.status == DRAFT"]
        side_effects: []
      - from: RECRUITING
        to: CLOSED
        trigger: "POST /playtests/studies/{id}/close-recruitment"
        actor: ResearchOpsAdmin
        preconditions: ["study.status == RECRUITING"]
        side_effects: []
      - from: CLOSED
        to: ANALYSIS
        trigger: "POST /playtests/studies/{id}/begin-analysis"
        actor: Researcher
        preconditions: ["study.status == CLOSED"]
        side_effects: []
      - from: ANALYSIS
        to: COMPLETED
        trigger: "POST /playtests/studies/{id}/complete"
        actor: ResearchOpsAdmin
        preconditions: ["study.status == ANALYSIS"]
        side_effects: []

  - entity: LabStation
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "PATCH /playtests/lab-stations/{id} with status: OUT_OF_SERVICE"
        actor: ResearchOpsAdmin
        preconditions: ["station.status == AVAILABLE"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "PATCH /playtests/lab-stations/{id} with status: AVAILABLE"
        actor: ResearchOpsAdmin
        preconditions: ["station.status == OUT_OF_SERVICE"]
        side_effects: []

  - entity: Moderator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /playtests/moderators/{id} with status: INACTIVE"
        actor: ResearchOpsAdmin
        preconditions: ["moderator.status == ACTIVE"]
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /playtests/moderators/{id} with status: ACTIVE"
        actor: ResearchOpsAdmin
        preconditions: ["moderator.status == INACTIVE"]
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version; see SKILL.md section 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: session-reschedule-stale-version
    parent_entity: PlaytestSession
    write_endpoint: "PATCH /playtests/sessions/{id}/reschedule"
    occ_field: expected_session_version
    description: |
      Rescheduling a PlaytestSession whose version has advanced since the
      client last observed it is rejected. A reschedule legitimately supersedes
      the previously stored window, so a writer holding a stale version would
      silently overwrite another writer's newer window; the stale write is
      rejected with a version conflict instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: study-amend-stale-version
    parent_entity: Study
    write_endpoint: "PATCH /playtests/studies/{id}"
    occ_field: expected_study_version
    description: |
      Amending a Study whose version has advanced since the client last
      observed it is rejected. An amendment legitimately supersedes the
      previously stored cohort criteria or budget, so a writer holding a stale
      version would silently overwrite another writer's newer amendment; the
      stale write is rejected with a version conflict instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_fit_score
    trigger: "provisional variant runs at POST /playtests/applications (stored as fit_score_provisional); verified variant runs at POST /playtests/applications/{id}/approve (stored as fit_score_final)"
    algorithm: weighted_scoring
    formula: |
      age_points     = AGE_POINTS if study.min_age <= participant.age_years <= study.max_age else 0
      region_points  = REGION_POINTS if participant.region_code in study.allowed_regions else 0
      platform_basis = participant.platform_tags            # self_reported variant
                     | participant.verified_platform_tags   # verified variant
      if len(study.required_platforms) == 0:
          platform_points = PLATFORM_POINTS
      else:
          platform_points = round(PLATFORM_POINTS * len(platform_basis intersect study.required_platforms)
                                    / len(study.required_platforms), 0)   # round_half_up to integer
      score = age_points + region_points + platform_points
    input_set: "the single ScreeningApplication's participant and study; participant state filter is not applied (score is pure attribute matching)"
    constants:
      AGE_POINTS: 40
      REGION_POINTS: 30
      PLATFORM_POINTS: 30
      FIT_PASS_THRESHOLD: 60
    precision: "integer; platform_points round_half_up to 0 decimals"
    variants:
      - name: self_reported
        when: "application submission (POST /playtests/applications)"
        difference: "platform_basis := participant.platform_tags as self-declared; result stored in fit_score_provisional"
      - name: verified
        when: "application approval (POST /playtests/applications/{id}/approve)"
        difference: "platform_basis := participant.verified_platform_tags (empty until verify-attributes is called); identical inputs therefore yield a different score whenever verification narrowed the platform set; result stored in fit_score_final and gated on FIT_PASS_THRESHOLD"

  - name: incentive_amount
    trigger: "provisional variant at POST /playtests/incentive-payouts (frozen into amount_provisional_cents); final variant at POST /playtests/incentive-payouts/{id}/approve (stored into amount_final_cents)"
    algorithm: tiered_pricing
    formula: |
      attended         = count(SessionBooking where participant_id == payout.participant_id
                          and session.study_id == payout.study_id and status == ATTENDED)
      no_shows         = count(same set with status == NO_SHOW)
      passed_surveys   = count(SurveyResponse where participant_id == payout.participant_id
                          and instrument.study_id == payout.study_id and status == SUBMITTED and passed == true)
      base             = attended * BASE_PER_SESSION_CENTS
      tier_multiplier  = 1.5 if attended >= 3 else (1.25 if attended == 2 else 1.0)   # boundary: attended == 3 exactly enters the top tier
      survey_bonus     = passed_surveys * SURVEY_BONUS_CENTS
      provisional      = round(base * tier_multiplier, 0) + survey_bonus              # round_half_up to integer cents
      final            = max(0, round(base * tier_multiplier, 0) + survey_bonus - no_shows * NO_SHOW_PENALTY_CENTS)
    input_set: "bookings of sessions belonging to the payout's study; sessions in any status contribute their bookings; responses of instruments belonging to the payout's study; only SUBMITTED responses with passed == true count"
    constants:
      BASE_PER_SESSION_CENTS: 5000
      SURVEY_BONUS_CENTS: 1000
      NO_SHOW_PENALTY_CENTS: 2000
    precision: "integer cents; round_half_up"
    variants:
      - name: provisional
        when: "payout draft creation"
        difference: "no no-show penalty term; snapshot frozen at creation and never recomputed on this payout again"
      - name: final
        when: "payout approval"
        difference: "recomputed live (late attendance/no-show/survey changes flow in) and subtracts no_shows * NO_SHOW_PENALTY_CENTS with a floor of 0; identical underlying data therefore yields final <= provisional, strictly less whenever any NO_SHOW exists"

  - name: budget_commit
    trigger: "POST /playtests/incentive-payouts/{id}/approve, immediately after incentive_amount(final) is computed"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned to remove the circular appearance
      # (committed depends on this payout's final amount; the check compares
      # committed + final against the budget):
      step 1: final  := incentive_amount(final variant) for this payout
      step 2: if study.budget_committed_cents + final > study.incentive_budget_cents
                 -> reject with ERR_BUDGET_EXCEEDED; no state changes
      step 3: payout.amount_final_cents := final
      step 4: study.budget_committed_cents := study.budget_committed_cents + final
    input_set: "payouts of this study in {APPROVED, ISSUED} (the committed set); ISSUED payouts remain committed (spent money stays committed)"
    constants: {}
    precision: "integer cents"

  - name: no_show_strike_count
    trigger: "any SessionBooking enters NO_SHOW (explicit mark-no-show or auto on session complete); also recomputed implicitly on Participant reinstate (reset to 0)"
    algorithm: threshold
    formula: |
      window_start     = now - 90 days
      strikes         := count(SessionBooking where participant_id == P and status == NO_SHOW
                          and no_show_recorded_at >= window_start)   # inclusive boundary
      if participant.status == ACTIVE and strikes >= STRIKE_LIMIT:    # boundary: exactly 3 triggers
          participant := SUSPENDED (with full suspension cascade)
    input_set: "only NO_SHOW bookings whose no_show_recorded_at falls inside the rolling 90-day window; CANCELLED/ATTENDED bookings never count"
    constants:
      STRIKE_LIMIT: 3
      STRIKE_WINDOW_DAYS: 90
    precision: "integer count"

  - name: survey_weighted_score
    trigger: "POST /playtests/survey-responses/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # NESTED ROUNDING ORDER IS PINNED: round each per-question contribution
      # to 2 decimals FIRST, then sum. (Sum-then-round yields different values.)
      total_weight = sum(q.weight for q in instrument.questions)
      for each answer a in response.answers:
          q = instrument.questions[a.question_key]          # missing key -> ERR_UNKNOWN_QUESTION
          contribution[a] = round(a.points / q.max_points * q.weight, 2)   # round_half_up
      weighted_score = round(sum(contribution[a] for a in answers), 2)
      score_pct      = round(weighted_score / total_weight * 100, 2)
      passed         = score_pct >= instrument.pass_threshold            # boundary: equality passes
    input_set: "the response's answers and its instrument's questions; questions with no matching answer contribute 0"
    constants: {}
    precision: "2 decimal places, round_half_up; per-question contribution rounded BEFORE summation"

  - name: feedback_priority_score
    trigger: "POST /playtests/feedback-tickets/{id}/triage (from NEW or NEEDS_INFO)"
    algorithm: weighted_scoring
    formula: |
      severity_weight = {LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 5}[ticket.severity]
      raw   = severity_weight * 100 * ticket.reproducibility_pct + min(ticket.reach_count, REACH_CAP) * REACH_FACTOR
      score = round(raw, 2)                                  # round_half_up
      tier  = P1 if score >= P1_MIN else (P2 if score >= P2_MIN else (P3 if score >= P3_MIN else P4))
      FORCED OVERRIDE: if ticket.severity == CRITICAL and ticket.reach_count >= FORCE_P1_REACH
                       then tier := P1 regardless of score
    input_set: "the ticket's own severity, reach_count, reproducibility_pct fields"
    constants:
      REACH_CAP: 1000
      REACH_FACTOR: 0.5
      P1_MIN: 400
      P2_MIN: 200
      P3_MIN: 80
      FORCE_P1_REACH: 100
    precision: "2 decimal places, round_half_up"

  - name: cohort_build_summary
    trigger: "GET /playtests/studies/{id}/cohort-summary"
    algorithm: aggregation
    formula: |
      builds = GameBuilds of the study with released_at != null, ordered by released_at ASC
               (tie-break: created_at ASC); STAGED builds are excluded
      for each build B at position i:
          keys_issued   = count(ExposureRecord where build_id == B and event_type == KEY_ISSUED)
          keys_redeemed = count(ExposureRecord where build_id == B and event_type == KEY_REDEEMED)
          if i == 0 or keys_issued(previous build) == 0:
              retained_from_previous = null; retention_pct = null
          else:
              prev_participants = distinct participant_ids with KEY_ISSUED on builds[i-1]
              cur_participants  = distinct participant_ids with KEY_ISSUED on B
              retained_from_previous = |prev_participants intersect cur_participants|
              retention_pct = round(retained_from_previous / keys_issued(builds[i-1]) * 100, 2)
    input_set: "ExposureRecords of the study across all event types; only RELEASED-or-later builds (released_at set) appear"
    constants: {}
    precision: "retention_pct 2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint; for Participant/Moderator actors on owned resources, X-User-ID must equal the resource's participant_id/moderator_id ownership field"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request shape: required fields present, enum values valid, numeric ranges valid (age_years >= 13, max_age >= min_age, cohort_capacity >= 1, max_keys >= 1, key_ttl_hours >= 1, seat_capacity >= 1, reach_count >= 0, 0 <= reproducibility_pct <= 1, 0 <= pass_threshold <= 100, 0 <= answer points <= question max_points), ends_at > starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "ends_at <= starts_at on session create/reschedule returns ERR_WINDOW_VIOLATION (422) instead of ERR_INVALID_REQUEST"
  - priority: 4
    category: existence
    check: "path-template ids exist (validated left-to-right), then body foreign-key ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the transition per section 1.2 (includes ERR_INVALID_STATE, ERR_SESSION_NOT_BOOKABLE for booking into a non-SCHEDULED session, ERR_STUDY_NOT_RECRUITING for apply/approve against a non-RECRUITING study, ERR_STUDY_NOT_CLOSED for session start outside CLOSED/ANALYSIS)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "cross-entity state references: build RELEASED for key issue (ERR_BUILD_NOT_RELEASED), application ENROLLED in the session's study for booking (ERR_NOT_ENROLLED), PUBLISHED NDA exists for approve (ERR_NDA_NOT_PUBLISHED), ATTENDED booking for survey submit (ERR_ATTENDANCE_REQUIRED), participant not BANNED for payout approve (ERR_PARTICIPANT_NOT_ACTIVE)"
    error_id: ERR_NOT_ENROLLED
    http_status: 422
    applies_to: "key issue, booking create, application approve, survey submit, payout approve"
  - priority: 7
    category: business_safety
    check: "compliance gates: SIGNED NDA on the study's current PUBLISHED agreement before key issue (ERR_NDA_NOT_SIGNED); segregation of duties on payout approve/issue (ERR_SEGREGATION_OF_DUTIES); breach reporter cannot adjudicate (ERR_REPORTER_CANNOT_ADJUDICATE); reinstate blocked while a breach case is open (ERR_OPEN_BREACH_EXISTS)"
    error_id: ERR_NDA_NOT_SIGNED
    http_status: 422
    applies_to: "access-key issue, payout approve, payout issue, breach open-investigation, participant reinstate"
  - priority: 8
    category: business_constraint
    check: "uniqueness and capacity constraints: one non-terminal application per (study, participant) (ERR_DUPLICATE_APPLICATION); one active key per (build, participant) (ERR_DUPLICATE_KEY); one non-terminal booking per (session, participant) (ERR_DUPLICATE_BOOKING); one response per (instrument, session, participant) (ERR_DUPLICATE_RESPONSE); one non-VOID payout per (study, participant) (ERR_DUPLICATE_PAYOUT); one PUBLISHED instrument per study (ERR_INSTRUMENT_ALREADY_PUBLISHED); cohort_capacity on approve (ERR_COHORT_FULL); max_keys quota on issue (ERR_KEY_QUOTA_EXCEEDED); IN_LAB requires station (ERR_STATION_REQUIRED); start requires assigned moderator (ERR_MODERATOR_REQUIRED); payout requires >= 1 ATTENDED booking (ERR_NO_COMPENSABLE_ACTIVITY); all answer question_keys exist (ERR_UNKNOWN_QUESTION)"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "creation and transition endpoints with uniqueness/capacity constraints"
  - priority: 9
    category: business_temporal
    check: "temporal rules: station half-open overlap (ERR_STATION_CONFLICT), moderator 15-minute buffered overlap (ERR_MODERATOR_CONFLICT), participant closed-interval overlap (ERR_PARTICIPANT_CONFLICT), session start within window (ERR_SESSION_NOT_IN_WINDOW), signature sign before expiry (ERR_SIGNATURE_EXPIRED), key redeem before expiry (ERR_KEY_EXPIRED)"
    error_id: ERR_STATION_CONFLICT
    http_status: 409
    applies_to: "session create, session reschedule, assign-moderator, booking create, session start, signature sign, key redeem"
  - priority: 10
    category: business_fiscal
    check: "budget check on payout approve: budget_committed_cents + final amount <= incentive_budget_cents; evaluated LAST so state/compliance errors always win over budget errors"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /playtests/incentive-payouts/{id}/approve"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # ---- logical clock + sweeps (test-driving surface) ----
  - method: POST
    path: "/playtests/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["all subsequent time-gated preconditions, sweeps, expiry timestamps, and rolling windows evaluate against this logical clock"]
  - method: POST
    path: "/playtests/_sweeps/run-expiry"
    description: "Ops-run expiry checkpoint: expires every PENDING NdaSignature with expires_at <= now and every ISSUED AccessKey with expires_at <= now (boundary: equality expires), writing ExposureRecord KEY_EXPIRED per expired key."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: "{ signatures_expired: integer, keys_expired: integer }"
    side_effects: ["NdaSignature PENDING -> EXPIRED", "AccessKey ISSUED -> EXPIRED + ExposureRecord + build.keys_active_count -= 1 per key"]

  # ---- participants ----
  - method: POST
    path: "/playtests/participants"
    description: "Register a participant (status REGISTERED, no_show_strikes 0, risk_score 0, verified_platform_tags [])."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [email, full_name, age_years, region_code, platform_tags]
    output: Participant
    side_effects: []
  - method: GET
    path: "/playtests/participants"
    description: "List participants with optional filters and pagination."
    roles: [ResearchOpsAdmin, Researcher, IncentiveOfficer, LegalCounsel, Moderator]
    code: 200
    input: ["status?", "region_code?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/playtests/participants/{id}"
    description: "Fetch one participant."
    roles: [ResearchOpsAdmin, Researcher, IncentiveOfficer, LegalCounsel, Moderator, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/playtests/participants/{id}/activate"
    description: "REGISTERED -> ACTIVE."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant REGISTERED -> ACTIVE"]
  - method: POST
    path: "/playtests/participants/{id}/verify-attributes"
    description: "Set verified_platform_tags (drives the verified variant of screening_fit_score at approve time)."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [verified_platform_tags]
    output: Participant
    side_effects: ["participant.verified_platform_tags := payload", "increments Participant.version by 1"]
  - method: POST
    path: "/playtests/participants/{id}/suspend"
    description: "ACTIVE -> SUSPENDED with suspension cascade (bookings cancelled + waitlist promotion; ISSUED keys revoked)."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant ACTIVE -> SUSPENDED + suspension cascade"]
  - method: POST
    path: "/playtests/participants/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE; blocked while any breach case is open; resets no_show_strikes to 0."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant SUSPENDED -> ACTIVE", "no_show_strikes := 0"]
  - method: POST
    path: "/playtests/participants/{id}/ban"
    description: "ACTIVE|SUSPENDED -> BANNED with ban cascade (bookings, all keys, signatures, payouts voided)."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant -> BANNED + ban cascade"]

  # ---- moderators ----
  - method: POST
    path: "/playtests/moderators"
    description: "Create a moderator (status ACTIVE)."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [display_name, email]
    output: Moderator
    side_effects: []
  - method: GET
    path: "/playtests/moderators"
    description: "List moderators."
    roles: [ResearchOpsAdmin, Researcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Moderator[]
    side_effects: []
  - method: GET
    path: "/playtests/moderators/{id}"
    description: "Fetch one moderator."
    roles: [ResearchOpsAdmin, Researcher, Moderator]
    code: 200
    input: []
    output: Moderator
    side_effects: []
  - method: PATCH
    path: "/playtests/moderators/{id}"
    description: "Set moderator status ACTIVE <-> INACTIVE."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [status]
    output: Moderator
    side_effects: ["Moderator status transition", "increments Moderator.version by 1"]

  # ---- studies ----
  - method: POST
    path: "/playtests/studies"
    description: "Create a study (status DRAFT, counters 0)."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [title, code, min_age, max_age, allowed_regions, required_platforms, cohort_capacity, incentive_budget_cents]
    output: Study
    side_effects: []
  - method: GET
    path: "/playtests/studies"
    description: "List studies with optional filters and pagination."
    roles: [ResearchOpsAdmin, Researcher, IncentiveOfficer, LegalCounsel, Moderator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Study[]
    side_effects: []
  - method: GET
    path: "/playtests/studies/{id}"
    description: "Fetch one study (includes enrolled_count, budget_committed_cents, budget_spent_cents, version)."
    roles: [ResearchOpsAdmin, Researcher, IncentiveOfficer, LegalCounsel, Moderator, Participant]
    code: 200
    input: []
    output: Study
    side_effects: []
  - method: PATCH
    path: "/playtests/studies/{id}"
    description: "Amend cohort criteria or budget while DRAFT or RECRUITING. OCC-guarded: expected_study_version must equal the study's current version."
    roles: [ResearchOpsAdmin]
    code: 200
    input: [expected_study_version, "title?", "min_age?", "max_age?", "allowed_regions?", "required_platforms?", "cohort_capacity?", "incentive_budget_cents?"]
    output: Study
    side_effects: ["increments Study.version by 1", "existing applications' fit scores are NOT recomputed (pin: amendments affect future evaluations only)"]
  - method: POST
    path: "/playtests/studies/{id}/open-recruitment"
    description: "DRAFT -> RECRUITING."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Study
    side_effects: ["Study DRAFT -> RECRUITING"]
  - method: POST
    path: "/playtests/studies/{id}/close-recruitment"
    description: "RECRUITING -> CLOSED."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Study
    side_effects: ["Study RECRUITING -> CLOSED"]
  - method: POST
    path: "/playtests/studies/{id}/begin-analysis"
    description: "CLOSED -> ANALYSIS."
    roles: [Researcher]
    code: 200
    input: []
    output: Study
    side_effects: ["Study CLOSED -> ANALYSIS"]
  - method: POST
    path: "/playtests/studies/{id}/complete"
    description: "ANALYSIS -> COMPLETED."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: Study
    side_effects: ["Study ANALYSIS -> COMPLETED"]
  - method: GET
    path: "/playtests/studies/{id}/cohort-summary"
    description: "Cohort tracking across builds: per released build, keys issued/redeemed and retention from the previous build (cohort_build_summary calculation)."
    roles: [ResearchOpsAdmin, Researcher]
    code: 200
    input: []
    output: "{ study_id: string, builds: array }"
    side_effects: []

  # ---- screening applications ----
  - method: POST
    path: "/playtests/applications"
    description: "Participant applies to a study. participant_id is taken from X-User-ID. Computes fit_score_provisional (self_reported variant). Requires participant ACTIVE and study RECRUITING."
    roles: [Participant]
    code: 201
    input: [study_id]
    output: ScreeningApplication
    side_effects: ["fit_score_provisional := screening_fit_score(self_reported)"]
  - method: GET
    path: "/playtests/applications"
    description: "List applications with optional filters."
    roles: [ResearchOpsAdmin, Researcher, Participant]
    code: 200
    input: ["study_id?", "participant_id?", "status?", "pinned_nda_agreement_id?", "limit?", "offset?"]
    output: ScreeningApplication[]
    side_effects: []
  - method: GET
    path: "/playtests/applications/{id}"
    description: "Fetch one application."
    roles: [ResearchOpsAdmin, Researcher, Participant]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: []
  - method: POST
    path: "/playtests/applications/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW."
    roles: [Researcher]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["ScreeningApplication SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/playtests/applications/{id}/request-info"
    description: "UNDER_REVIEW -> INFO_REQUESTED."
    roles: [Researcher]
    code: 200
    input: [info_request_note]
    output: ScreeningApplication
    side_effects: ["ScreeningApplication UNDER_REVIEW -> INFO_REQUESTED"]
  - method: POST
    path: "/playtests/applications/{id}/submit-info"
    description: "INFO_REQUESTED -> UNDER_REVIEW (participant answers the info request)."
    roles: [Participant]
    code: 200
    input: ["supplemental_note?"]
    output: ScreeningApplication
    side_effects: ["ScreeningApplication INFO_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/playtests/applications/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED: computes fit_score_final (verified variant), gates on threshold/cohort capacity/published NDA, pins the PUBLISHED agreement, creates a PENDING NdaSignature."
    roles: [Researcher]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["fit_score_final := screening_fit_score(verified)", "pinned_nda_agreement_id := published agreement", "create NdaSignature PENDING (expires_at = now + 7 days)"]
  - method: POST
    path: "/playtests/applications/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED."
    roles: [Researcher]
    code: 200
    input: [decision_reason]
    output: ScreeningApplication
    side_effects: ["ScreeningApplication UNDER_REVIEW -> REJECTED"]
  - method: POST
    path: "/playtests/applications/{id}/withdraw"
    description: "SUBMITTED|UNDER_REVIEW -> WITHDRAWN (owner only)."
    roles: [Participant]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["ScreeningApplication -> WITHDRAWN"]

  # ---- NDA agreements & signatures ----
  - method: POST
    path: "/playtests/nda-agreements"
    description: "Create an NDA agreement version for a study (status DRAFT)."
    roles: [LegalCounsel]
    code: 201
    input: [study_id, version_label, body_text]
    output: NdaAgreement
    side_effects: []
  - method: GET
    path: "/playtests/nda-agreements"
    description: "List NDA agreements with optional filters."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: NdaAgreement[]
    side_effects: []
  - method: GET
    path: "/playtests/nda-agreements/{id}"
    description: "Fetch one NDA agreement."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: []
    output: NdaAgreement
    side_effects: []
  - method: POST
    path: "/playtests/nda-agreements/{id}/publish"
    description: "DRAFT -> PUBLISHED. Retires the previously PUBLISHED agreement for the study, voids its PENDING/SIGNED signatures, and re-papers ENROLLED applications back to APPROVED with a fresh PENDING signature on the new version."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: NdaAgreement
    side_effects: ["publish cascade links 1-3 (see state machine)"]
  - method: GET
    path: "/playtests/nda-signatures"
    description: "List NDA signatures with optional filters."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: ["agreement_id?", "participant_id?", "study_id?", "application_id?", "status?", "limit?", "offset?"]
    output: NdaSignature[]
    side_effects: []
  - method: GET
    path: "/playtests/nda-signatures/{id}"
    description: "Fetch one NDA signature."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: []
    output: NdaSignature
    side_effects: []
  - method: POST
    path: "/playtests/nda-signatures/{id}/sign"
    description: "PENDING -> SIGNED (owner only; agreement must be PUBLISHED; now < expires_at). Bubbles the application APPROVED -> ENROLLED and increments study.enrolled_count."
    roles: [Participant]
    code: 200
    input: []
    output: NdaSignature
    side_effects: ["NdaSignature PENDING -> SIGNED", "application APPROVED -> ENROLLED", "study.enrolled_count += 1"]

  # ---- builds & access keys ----
  - method: POST
    path: "/playtests/builds"
    description: "Register a game build for a study (status STAGED)."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [study_id, build_label, max_keys, "key_ttl_hours?"]
    output: GameBuild
    side_effects: []
  - method: GET
    path: "/playtests/builds"
    description: "List builds with optional filters."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant]
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: GameBuild[]
    side_effects: []
  - method: GET
    path: "/playtests/builds/{id}"
    description: "Fetch one build (includes keys_active_count)."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant]
    code: 200
    input: []
    output: GameBuild
    side_effects: []
  - method: POST
    path: "/playtests/builds/{id}/release"
    description: "STAGED -> RELEASED (study must be RECRUITING/CLOSED/ANALYSIS)."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: GameBuild
    side_effects: ["GameBuild STAGED -> RELEASED", "released_at := now"]
  - method: POST
    path: "/playtests/builds/{id}/retire"
    description: "RELEASED -> RETIRED; revokes all ISSUED keys (writes KEY_REVOKED exposure records)."
    roles: [ResearchOpsAdmin]
    code: 200
    input: []
    output: GameBuild
    side_effects: ["GameBuild RELEASED -> RETIRED", "ISSUED keys -> REVOKED + ExposureRecords"]
  - method: POST
    path: "/playtests/access-keys"
    description: "Issue an access key for a build to a participant. Gates: build RELEASED, NDA SIGNED (safety, outranks quota), max_keys quota, one active key per (build, participant)."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [build_id, participant_id]
    output: AccessKey
    side_effects: ["AccessKey ISSUED created (expires_at = now + build.key_ttl_hours)", "build.keys_active_count += 1", "write ExposureRecord KEY_ISSUED"]
  - method: GET
    path: "/playtests/access-keys"
    description: "List access keys with optional filters."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: ["build_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: AccessKey[]
    side_effects: []
  - method: GET
    path: "/playtests/access-keys/{id}"
    description: "Fetch one access key."
    roles: [ResearchOpsAdmin, Researcher, LegalCounsel, Participant]
    code: 200
    input: []
    output: AccessKey
    side_effects: []
  - method: POST
    path: "/playtests/access-keys/{id}/redeem"
    description: "ISSUED -> REDEEMED (owner only; now < expires_at)."
    roles: [Participant]
    code: 200
    input: []
    output: AccessKey
    side_effects: ["AccessKey ISSUED -> REDEEMED", "redeemed_at := now", "write ExposureRecord KEY_REDEEMED"]
  - method: POST
    path: "/playtests/access-keys/{id}/revoke"
    description: "ISSUED -> REVOKED (manual ops/legal revocation)."
    roles: [ResearchOpsAdmin, LegalCounsel]
    code: 200
    input: []
    output: AccessKey
    side_effects: ["AccessKey ISSUED -> REVOKED", "write ExposureRecord KEY_REVOKED", "build.keys_active_count -= 1"]

  # ---- lab stations ----
  - method: POST
    path: "/playtests/lab-stations"
    description: "Create a lab station (status AVAILABLE)."
    roles: [ResearchOpsAdmin]
    code: 201
    input: [station_code, location, "equipment_tags?"]
    output: LabStation
    side_effects: []
  - method: GET
    path: "/playtests/lab-stations"
    description: "List lab stations."
    roles: [ResearchOpsAdmin, Researcher, Moderator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LabStation[]
    side_effects: []
  - method: GET
    path: "/playtests/lab-stations/{id}"
    description: "Fetch one lab station."
    roles: [ResearchOpsAdmin, Researcher, Moderator]
    code: 200
    input: []
    output: LabStation
    side_effects: []
  - method: PATCH
    path: "/playtests/lab-stations/{id}"
    description: "Set station status AVAILABLE <-> OUT_OF_SERVICE."
