              payload: { name: "Payer WI", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "WI-2026", effective_date: "2026-01-01", expiration_date: "2026-07-01" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_CONTRACT_WINDOW_INVALID"
            - "PayerContract.${contract_id}.status still == DRAFT"

      - name: err_amendment_effective_out_of_term_rejected
        claim_type: triggerable
        grounds: ["errors[ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM]", "validations[priority=9]"]
        distinguishing_aspect: "Amendment effective_date 2027-02-01 lies outside the contract term (ends 2026-12-31) -> ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term"]
          setup_api_calls:
