              as: CarrierOps
              captures: { p3: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${p2}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${p3}/deliver"
              payload: {}
              as: CarrierOps
