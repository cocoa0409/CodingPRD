# =============================================================================
# Task 1824: Faculty Workload & Course Assignment — benchmark seed tables
# Generated per prd-bench-scaffold-generator SKILL.md (§1.0–§1.7 live here;
# §1.8 -> SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 -> SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  1824. Faculty Workload & Course Assignment (academic department chair): workload
  policy (teaching/research/service) & credit equivalencies, course-section
  assignment honoring qualification & preference, overload approval & extra
  compensation, release time for grants & administrative roles, class-size &
  modality constraints, last-minute reassignment & cancellation rules, department
  load balancing & reporting, union/contract compliance

domain_name: faculty-workload-course-assignment
# Flat topology: several top-level collections; all cross-references are body/query
# foreign keys, so the shared API prefix is the root "/".
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: "Quota / allocation"        # finite faculty load capacity allocated across competing sections
  secondary_archetype: "Compliance / audit"      # union contract caps, approval chains, segregation of duties
  complexity_layers:
    - dual_variant_calculation                   # provisional vs census-final credit; salary-prorate vs flat-rate buyout
    - cascading_side_effects                     # section cancel -> assignment -> load sheet -> overload request
    - optimistic_concurrency                     # OCC on WorkloadTerm.version and CourseSection.version
    - rate_threshold_triggers                    # overload threshold, large-class threshold, late-cancel window
  entity_topology: flat
  state_machine_shape: cyclic                    # OPEN<->LOCKED, SCHEDULED<->STAFFED, ACTIVE<->ON_LEAVE, DENIED->SUBMITTED
  relationship_patterns:
    - many_to_many                               # Qualification and Assignment junction FacultyMember x Course/Section
    - cross_aggregate                            # Assignment/Grant/OverloadRequest/LoadSheet reference Term + Faculty peers
  role_model: segregation_of_duties              # overload endorser may not approve; faculty consent is ownership-checked
  consistency_model: immediate
  difficulty_target: expert                      # 9 entities, 38 endpoints, ~40 error codes, 10 calculations

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: WorkloadTerm
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: term_code, type: string, source: input, description: "Unique term code, e.g. 2026-FA", constraints: "unique across all terms" }
      - { name: title, type: string, source: input, description: "Display title" }
      - { name: start_date, type: string, source: input, description: "First day of classes, ISO date YYYY-MM-DD" }
      - { name: census_date, type: string, source: input, description: "Enrollment census date, ISO date; must be >= start_date" }
      - { name: base_teaching_credits, type: number, source: input, default: 12, description: "Department standard full-time teaching load per term" }
      - { name: comp_budget_cents, type: integer, source: input, description: "Term compensation budget for overload comp + late-cancel stipends (integer cents)" }
      - { name: comp_budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of DEAN_APPROVED overload comp_cents + all assignment stipend_cents in this term" }
      # --- inline workload policy / credit equivalency fields (editable while DRAFT) ---
      - { name: lecture_multiplier, type: number, source: input, default: 1.0, description: "Credit equivalency multiplier for LECTURE courses" }
      - { name: lab_multiplier, type: number, source: input, default: 0.75, description: "Credit equivalency multiplier for LAB courses" }
      - { name: seminar_multiplier, type: number, source: input, default: 1.25, description: "Credit equivalency multiplier for SEMINAR courses" }
      - { name: online_premium_credits, type: number, source: input, default: 0.5, description: "Flat credit premium added for ONLINE modality sections" }
      - { name: large_class_threshold, type: integer, source: input, default: 40, description: "Section enrolled_count >= this triggers large-class bonus" }
      - { name: large_class_bonus_credits, type: number, source: input, default: 1.0, description: "Flat credit bonus when enrolled_count >= large_class_threshold" }
      - { name: overload_comp_rate_cents, type: integer, source: input, default: 150000, description: "Extra compensation per overload credit (integer cents)" }
      - { name: union_max_overload_credits, type: number, source: input, default: 6, description: "Union contract: absolute max overload credits per union-covered faculty per term" }
      - { name: reassignment_notice_days, type: integer, source: input, default: 14, description: "Rescind/cancel strictly fewer than this many days before start_date is 'late' and pays a stipend" }
      - { name: late_cancel_stipend_cents, type: integer, source: input, default: 100000, description: "Stipend per late-cancelled CONFIRMED assignment (integer cents)" }
      - { name: flat_release_rate_cents, type: integer, source: input, default: 80000, description: "Flat buyout rate per released credit for ADMINISTRATIVE/SABBATICAL grants" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | PUBLISHED", constraints: "initial DRAFT; terminal PUBLISHED" }

  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Faculty full name" }
      - { name: email, type: string, source: input, description: "Faculty email", constraints: "unique across all faculty" }
      - { name: rank, type: enum, source: input, description: "ADJUNCT | LECTURER | ASSISTANT_PROFESSOR | ASSOCIATE_PROFESSOR | PROFESSOR" }
      - { name: is_union_covered, type: boolean, source: input, default: true, description: "Whether the union contract (overload cap) applies" }
      - { name: base_load_credits, type: number, source: input, default: 12, description: "Contractual teaching load per term" }
      - { name: base_salary_cents, type: integer, source: input, description: "Annual base salary in integer cents; drives SALARY_PRORATE buyout" }
      - { name: preferred_course_ids, type: array, source: input, default: [], description: "Course ids the faculty prefers to teach; drives Assignment.matches_preference" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | SEPARATED", constraints: "initial ACTIVE; SEPARATED terminal" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Unique course code, e.g. CS-301", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: course_type, type: enum, source: input, description: "LECTURE | LAB | SEMINAR" }
      - { name: base_credits, type: number, source: input, description: "Catalog credit hours before equivalency multiplier" }
      - { name: default_enrollment_cap, type: integer, source: input, description: "Default per-section enrollment cap" }
      - { name: allowed_modalities, type: array, source: input, description: "Non-empty subset of [IN_PERSON, ONLINE, HYBRID]" }

  - name: Qualification
    parent: null
    common_fields: true
    fields:
      - { name: faculty_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: expires_on, type: string, source: input, description: "ISO date; qualification lapses when current date > expires_on" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED", constraints: "initial ACTIVE; at most one ACTIVE per (faculty_id, course_id); EXPIRED applied lazily by the system when the logical clock passes expires_on" }

  - name: CourseSection
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> WorkloadTerm.id" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: section_number, type: string, source: input, description: "Section number within (term, course), e.g. 01", constraints: "unique per (term_id, course_id)" }
      - { name: modality, type: enum, source: input, description: "IN_PERSON | ONLINE | HYBRID; must be in course.allowed_modalities" }
      - { name: meeting_day, type: enum, source: input, description: "MON | TUE | WED | THU | FRI (one weekly meeting)" }
      - { name: start_minute, type: integer, source: input, description: "Meeting start, minutes since midnight, 0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Meeting end; must be > start_minute" }
      - { name: enrollment_cap, type: integer, source: input, default: "course.default_enrollment_cap", description: "Max enrolled students" }
      - { name: enrolled_count, type: integer, source: system, default: 0, description: "Current enrollment; mutated only via enrollment-sync" }
      - { name: is_late_cancelled, type: boolean, source: computed, default: false, description: "True when cancelled inside the reassignment notice window" }
      - { name: status, type: enum, source: system, description: "PROPOSED | SCHEDULED | STAFFED | CANCELLED", constraints: "initial PROPOSED; CANCELLED terminal" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> WorkloadTerm.id; copied from the section's term" }
      - { name: section_id, type: string, source: input, description: "FK -> CourseSection.id" }
      - { name: faculty_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: credit_units, type: number, source: computed, description: "Provisional workload credits, snapshotted at creation from current enrolled_count and term policy (2dp)" }
      - { name: final_credit_units, type: number, source: computed, default: null, description: "Census-final credits, populated by close-census from census enrollment; null until then" }
      - { name: stipend_cents, type: integer, source: computed, default: 0, description: "Late-cancel stipend charged when this CONFIRMED assignment is rescinded/cancelled late" }
      - { name: matches_preference, type: boolean, source: computed, description: "True when section.course_id is in faculty.preferred_course_ids (evaluated at creation)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | DECLINED | WITHDRAWN | RESCINDED | CANCELLED", constraints: "initial PROPOSED; DECLINED/WITHDRAWN/RESCINDED/CANCELLED terminal" }

  - name: ReleaseTimeGrant
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> WorkloadTerm.id" }
      - { name: faculty_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: grant_type, type: enum, source: input, description: "RESEARCH_BUYOUT | ADMINISTRATIVE | SABBATICAL" }
      - { name: credits_released, type: number, source: input, description: "Teaching credits bought out; must be > 0 and <= faculty.base_load_credits" }
      - { name: start_date, type: string, source: input, description: "Release period start, ISO date (closed interval)" }
      - { name: end_date, type: string, source: input, description: "Release period end, ISO date (closed interval); must be >= start_date" }
      - { name: buyout_value_cents, type: integer, source: computed, default: null, description: "Computed at APPROVED: SALARY_PRORATE for RESEARCH_BUYOUT, FLAT_RATE otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | REVOKED", constraints: "initial REQUESTED; DENIED/REVOKED terminal" }

  - name: OverloadRequest
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> WorkloadTerm.id" }
      - { name: faculty_id, type: string, source: input, description: "FK -> FacultyMember.id" }
      - { name: overload_credits, type: number, source: computed, description: "Snapshot of the LoadSheet.overload_credits at submission; must be > 0" }
      - { name: comp_cents, type: integer, source: computed, description: "= round_half_up(overload_credits * term.overload_comp_rate_cents), integer cents" }
      - { name: endorsed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the chair who endorsed; approver must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CHAIR_ENDORSED | DEAN_APPROVED | DENIED | WITHDRAWN", constraints: "initial SUBMITTED; DEAN_APPROVED/DENIED terminal; WITHDRAWN terminal; DENIED -> SUBMITTED resubmit allowed" }

  - name: LoadSheet
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> WorkloadTerm.id" }
      - { name: faculty_id, type: string, source: system, description: "FK -> FacultyMember.id" }
      - { name: teaching_credits, type: number, source: computed, default: 0, description: "Sum of assignment credits (final_credit_units when set, else credit_units) over PROPOSED/CONFIRMED assignments for (term, faculty)" }
      - { name: release_credits, type: number, source: computed, default: 0, description: "Sum of credits_released over APPROVED grants for (term, faculty)" }
      - { name: effective_obligation_credits, type: number, source: computed, description: "= max(0, faculty.base_load_credits - release_credits)" }
      - { name: overload_credits, type: number, source: computed, default: 0, description: "= max(0, teaching_credits - effective_obligation_credits)" }
      - { name: underload_credits, type: number, source: computed, default: 0, description: "= max(0, effective_obligation_credits - teaching_credits)" }
      # One LoadSheet per (term_id, faculty_id); auto-created by the first assignment
      # or release-time grant for that pair. No direct create/update endpoint.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkloadTerm
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /workload-terms/{termId}/transition {to_state: OPEN}"
        actor: DepartmentChair
        preconditions: []
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /workload-terms/{termId}/transition {to_state: LOCKED}"
        actor: DepartmentChair
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "POST /workload-terms/{termId}/transition {to_state: OPEN} (unlock)"
        actor: DepartmentChair
        preconditions: []
        side_effects: []
        note: "Cyclic revert: unlocking re-opens assignment/section writes"
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /workload-terms/{termId}/transition {to_state: PUBLISHED}"
        actor: DepartmentChair
        preconditions:
          - "No CourseSection of this term in {PROPOSED, SCHEDULED} (ERR_UNSTAFFED_SECTIONS)"
          - "Every LoadSheet of this term with overload_credits > 0 has a DEAN_APPROVED OverloadRequest for the same (term_id, faculty_id) (ERR_UNCOVERED_OVERLOAD)"
        side_effects:
          - "status -> PUBLISHED (terminal; schedule becomes read-only)"
      - from: "OPEN | LOCKED | PUBLISHED"
        to: "(no state change)"
        trigger: "POST /workload-terms/{termId}/close-census"
        actor: DepartmentChair
        preconditions:
          - "logical clock >= census_date (ERR_CENSUS_NOT_REACHED)"
        side_effects:
          - "For every CONFIRMED assignment in this term: final_credit_units = assignment_credit_units formula evaluated with the section's CURRENT enrolled_count"
          - "Every LoadSheet in this term recomputed (final_credit_units takes precedence over credit_units where set)"
          - "Overload auto-withdraw rule then applies to any LoadSheet whose overload_credits became 0"
        note: "Not a state transition of the term; recorded here because it is a term-scoped ops checkpoint with cascading recompute. DRAFT terms rejected with ERR_INVALID_TERM_STATE."

  - entity: FacultyMember
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "PATCH /faculty-members/{facultyId} {status: ON_LEAVE}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "Every PROPOSED assignment of this faculty -> WITHDRAWN (no stipend)"
          - "Every CONFIRMED assignment of this faculty -> RESCINDED (stipend_cents stays 0: leave cascade is not a late chair rescind)"
          - "Each affected CourseSection with no remaining CONFIRMED assignment demotes STAFFED -> SCHEDULED"
          - "Each affected LoadSheet recomputed; overload auto-withdraw rule applies"
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "PATCH /faculty-members/{facultyId} {status: ACTIVE}"
        actor: DepartmentChair
        preconditions: []
        side_effects: []
        note: "Cyclic: faculty may return from leave; previously withdrawn/rescinded assignments are NOT restored"
      - from: ACTIVE
        to: SEPARATED
        trigger: "PATCH /faculty-members/{facultyId} {status: SEPARATED}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "Same assignment/section/LoadSheet cascade as ACTIVE -> ON_LEAVE"
      - from: ON_LEAVE
        to: SEPARATED
        trigger: "PATCH /faculty-members/{facultyId} {status: SEPARATED}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> ON_LEAVE"

  - entity: Qualification
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "PATCH /qualifications/{qualificationId} {status: REVOKED}"
        actor: DepartmentChair
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: whenever the qualification is read or used in validation while logical clock date > expires_on)"
        actor: system
        preconditions: ["current logical date > expires_on"]
        side_effects: []
        note: "Boundary: on expires_on itself the qualification is still ACTIVE (strictly-greater comparison)"

  - entity: CourseSection
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PROPOSED
        to: SCHEDULED
        trigger: "POST /course-sections/{sectionId}/transition {to_state: SCHEDULED}"
        actor: DepartmentChair
        preconditions:
          - "Term status in {DRAFT, OPEN} (ERR_INVALID_TERM_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: STAFFED
        trigger: "system (automatic when an assignment on this section becomes CONFIRMED)"
        actor: system
        preconditions: [">= 1 CONFIRMED assignment exists for this section"]
        side_effects: []
      - from: STAFFED
        to: SCHEDULED
        trigger: "system (automatic demotion when the last CONFIRMED assignment leaves CONFIRMED)"
        actor: system
        preconditions: ["no CONFIRMED assignment remains for this section"]
        side_effects: []
        note: "Cyclic SCHEDULED <-> STAFFED driven entirely by child assignment state"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /course-sections/{sectionId}/transition {to_state: CANCELLED}"
        actor: DepartmentChair
        preconditions:
          - "If term is PUBLISHED: dean_override must be true (ERR_DEAN_OVERRIDE_REQUIRED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /course-sections/{sectionId}/transition {to_state: CANCELLED}"
        actor: DepartmentChair
        preconditions:
          - "If term is PUBLISHED: dean_override must be true (ERR_DEAN_OVERRIDE_REQUIRED)"
        side_effects:
          - "is_late_cancelled = (logical clock is strictly fewer than term.reassignment_notice_days days before term.start_date, or past it)"
      - from: STAFFED
        to: CANCELLED
        trigger: "POST /course-sections/{sectionId}/transition {to_state: CANCELLED}"
        actor: DepartmentChair
        preconditions:
          - "If term is PUBLISHED: dean_override must be true (ERR_DEAN_OVERRIDE_REQUIRED)"
          - "If late and any CONFIRMED assignment exists: term.comp_budget_spent_cents + late_cancel_stipend_cents * (#CONFIRMED assignments) must be <= term.comp_budget_cents (ERR_COMP_BUDGET_EXCEEDED)"
        side_effects:
          - "Cascade link 1: every CONFIRMED assignment on this section -> CANCELLED; when late, each sets stipend_cents = term.late_cancel_stipend_cents and term.comp_budget_spent_cents += stipend"
          - "Cascade link 2: each affected faculty LoadSheet recomputed (teaching_credits drops)"
          - "Cascade link 3: for each affected faculty whose overload_credits became 0, every non-terminal OverloadRequest of (term, faculty) auto -> WITHDRAWN"
          - "PROPOSED assignments on this section -> WITHDRAWN (no stipend)"
          - "is_late_cancelled set as in SCHEDULED -> CANCELLED"

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, WITHDRAWN, RESCINDED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{assignmentId}/transition {to_state: CONFIRMED}"
        actor: FacultyMember
        preconditions:
          - "X-User-ID == assignment.faculty_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
          - "FacultyMember status == ACTIVE (ERR_INVALID_FACULTY_STATE)"
        side_effects:
          - "Section transitions SCHEDULED -> STAFFED (first CONFIRMED)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /assignments/{assignmentId}/transition {to_state: DECLINED}"
        actor: FacultyMember
        preconditions:
          - "X-User-ID == assignment.faculty_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "LoadSheet recomputed (credit removed)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /assignments/{assignmentId}/transition {to_state: WITHDRAWN}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "LoadSheet recomputed (credit removed)"
      - from: CONFIRMED
        to: RESCINDED
        trigger: "POST /assignments/{assignmentId}/transition {to_state: RESCINDED}"
        actor: DepartmentChair
        preconditions:
          - "Term status must not be PUBLISHED (ERR_INVALID_TERM_STATE)"
          - "If late (clock strictly fewer than term.reassignment_notice_days days before start_date, or past it): term.comp_budget_spent_cents + late_cancel_stipend_cents <= comp_budget_cents (ERR_COMP_BUDGET_EXCEEDED)"
        side_effects:
          - "If late: stipend_cents = term.late_cancel_stipend_cents; term.comp_budget_spent_cents += stipend_cents"
          - "LoadSheet recomputed (credit removed)"
          - "Section demotes STAFFED -> SCHEDULED if no other CONFIRMED assignment remains"
          - "Overload auto-withdraw rule applies if faculty overload_credits became 0"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from CourseSection STAFFED -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "stipend_cents set when the section cancel is late (see section cascade)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system (cascade from section cancel or faculty leave/separation)"
        actor: system
        preconditions: []
        side_effects: []
        note: "System cascade target shares the WITHDRAWN terminal state"

  - entity: ReleaseTimeGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /release-time-grants/{grantId}/transition {to_state: APPROVED}"
        actor: DeanOffice
        preconditions: []
        side_effects:
          - "buyout_value_cents computed (SALARY_PRORATE for RESEARCH_BUYOUT, FLAT_RATE otherwise)"
          - "LoadSheet (auto-created if absent): release_credits += credits_released; effective_obligation/overload recomputed"
          - "Overload auto-withdraw rule applies if overload_credits became 0"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /release-time-grants/{grantId}/transition {to_state: DENIED}"
        actor: DeanOffice
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /release-time-grants/{grantId}/transition {to_state: REVOKED}"
        actor: "DepartmentChair | DeanOffice"
        preconditions: []
        side_effects:
          - "Compensation: LoadSheet.release_credits -= credits_released; overload/underload recomputed"
          - "buyout_value_cents remains recorded (audit), but the release credit is returned"

  - entity: OverloadRequest
    initial_state: SUBMITTED
    terminal_states: [DEAN_APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: CHAIR_ENDORSED
        trigger: "POST /overload-requests/{requestId}/transition {to_state: CHAIR_ENDORSED}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "endorsed_by_user_id = X-User-ID of the endorsing chair"
      - from: CHAIR_ENDORSED
        to: DEAN_APPROVED
        trigger: "POST /overload-requests/{requestId}/transition {to_state: DEAN_APPROVED}"
        actor: DeanOffice
        preconditions:
          - "X-User-ID != endorsed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "term.comp_budget_spent_cents + comp_cents <= term.comp_budget_cents (ERR_COMP_BUDGET_EXCEEDED)"
        side_effects:
          - "term.comp_budget_spent_cents += comp_cents"
      - from: CHAIR_ENDORSED
        to: DENIED
        trigger: "POST /overload-requests/{requestId}/transition {to_state: DENIED}"
        actor: DeanOffice
        preconditions: []
        side_effects: []
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /overload-requests/{requestId}/transition {to_state: CHAIR_ENDORSED} is NOT how resubmission works; resubmit = POST transition {to_state: SUBMITTED}"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "overload_credits and comp_cents recomputed from the CURRENT LoadSheet (still must be > 0, else ERR_NO_OVERLOAD)"
        note: "Cyclic negotiation loop: DENIED -> SUBMITTED -> CHAIR_ENDORSED -> ..."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /overload-requests/{requestId}/transition {to_state: WITHDRAWN} OR system auto-withdraw when LoadSheet.overload_credits becomes 0"
        actor: "DepartmentChair | system"
        preconditions: []
        side_effects: []
      - from: CHAIR_ENDORSED
        to: WITHDRAWN
        trigger: "POST /overload-requests/{requestId}/transition {to_state: WITHDRAWN} OR system auto-withdraw when LoadSheet.overload_credits becomes 0"
        actor: "DepartmentChair | system"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: term-policy-patch-stale-version
    parent_entity: WorkloadTerm
    write_endpoint: "PATCH /workload-terms/{termId}"
    occ_field: expected_term_version
    description: |
      Editing a DRAFT term's policy/equivalency fields with an
      expected_term_version that no longer matches the term's current version is
      rejected. This captures the case where another chair has just committed a
      policy edit (advancing WorkloadTerm.version) and the current writer's view
      of the term is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-sync-stale-section-version
    parent_entity: CourseSection
    write_endpoint: "POST /course-sections/{sectionId}/enrollment-sync"
    occ_field: expected_section_version
    description: |
      An enrollment sync carrying an expected_section_version that no longer
      matches the section's current version is rejected, because the registrar
      feed's view of the section is stale (a prior sync has already advanced
      CourseSection.version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assignment_credit_units
    trigger: "POST /assignments (provisional snapshot at creation); the SAME formula is re-evaluated with census enrollment by POST /workload-terms/{termId}/close-census to populate final_credit_units"
    algorithm: aggregation
    formula: |
      c = section.course; t = section.term
      type_mult = t.lecture_multiplier if c.course_type == LECTURE
                  else t.lab_multiplier if c.course_type == LAB
                  else t.seminar_multiplier           # SEMINAR
      base_component   = round_half_up(c.base_credits * type_mult, 2)
      online_component = round_half_up(t.online_premium_credits, 2) if section.modality == ONLINE else 0
      large_component  = round_half_up(t.large_class_bonus_credits, 2) if section.enrolled_count >= t.large_class_threshold else 0
      credit_units = round_half_up(base_component + online_component + large_component, 2)
    input_set: "the assignment's own section + course + term policy fields; enrolled_count is the value at creation time (provisional) or at close-census time (final)"
    precision: "2 decimal places, round_half_up; ROUNDING ORDER PINNED: each of the three components is rounded to 2dp FIRST, then summed (per-component-round-then-sum, NOT sum-then-round)"
    constants:
      ROUNDING: "round_half_up to 2 decimal places, applied per component before summation"
    variants:
      - name: provisional
        when: "assignment creation; snapshot of current enrolled_count"
        difference: "stored in Assignment.credit_units; enrollment-sync afterwards does NOT change it"
      - name: census_final
        when: "POST /workload-terms/{termId}/close-census; enrolled_count at census time"
        difference: "stored in Assignment.final_credit_units; LoadSheet recompute prefers final_credit_units over credit_units when set"
    key_insight: |
      For identical formula inputs the two variants agree, but enrollment drift
      between proposal and census makes provisional != census_final — the
      LoadSheet reconciliation delta at close-census is the observable.
      Rounding order is pinned: rounding each component to 2dp before summing
      can differ from rounding the raw sum (e.g. lab_multiplier 0.333 and
      online_premium_credits 0.555: 0.67 + 0.56 = 1.23 vs round(1.221) = 1.22).

  - name: release_buyout_value
    trigger: "ReleaseTimeGrant REQUESTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      if grant_type == RESEARCH_BUYOUT:   # SALARY_PRORATE
        buyout_value_cents = round_half_up(faculty.base_salary_cents * credits_released / (faculty.base_load_credits * TERMS_PER_YEAR), 0)
      else:                                # FLAT_RATE (ADMINISTRATIVE | SABBATICAL)
        buyout_value_cents = round_half_up(credits_released * term.flat_release_rate_cents, 0)
    input_set: "the grant, its faculty (salary/load), its term (flat rate)"
    constants:
      TERMS_PER_YEAR: 2
    precision: "integer cents, round_half_up"
    variants:
      - name: SALARY_PRORATE
        when: "grant_type == RESEARCH_BUYOUT (external grant pays the faculty's actual prorated salary)"
        difference: "uses base_salary_cents / (base_load_credits * 2) as the per-credit rate"
      - name: FLAT_RATE
        when: "grant_type in {ADMINISTRATIVE, SABBATICAL} (institution pays the flat policy rate)"
        difference: "uses term.flat_release_rate_cents per credit; for the same credits_released the two variants produce different buyout_value_cents"

  - name: load_sheet_recompute
    trigger: "assignment create/confirm/decline/withdraw/rescind/cancel; grant approve/revoke; close-census; faculty base_load_credits edit"
    algorithm: aggregation
    formula: |
      credits_of(a) = a.final_credit_units if a.final_credit_units is not null else a.credit_units
      teaching_credits = sum(credits_of(a) for a in assignments
                             where a.term_id == sheet.term_id and a.faculty_id == sheet.faculty_id
                               and a.status in {PROPOSED, CONFIRMED})
      release_credits  = sum(g.credits_released for g in grants
                             where g.term_id == sheet.term_id and g.faculty_id == sheet.faculty_id
                               and g.status == APPROVED)
      effective_obligation_credits = max(0, faculty.base_load_credits - release_credits)
      overload_credits  = max(0, teaching_credits - effective_obligation_credits)
      underload_credits = max(0, effective_obligation_credits - teaching_credits)
    input_set: "assignments filtered to status in {PROPOSED, CONFIRMED} (DECLINED/WITHDRAWN/RESCINDED/CANCELLED excluded); grants filtered to status == APPROVED (REQUESTED/DENIED/REVOKED excluded)"
    precision: "2 decimal places, round_half_up (inputs are already 2dp; sums stay exact)"
    note: "Nested max() with 4 inputs (teaching, base_load, release, 0-floor) and status-conditional input sets. After every recompute: if overload_credits == 0, every OverloadRequest of this (term, faculty) in {SUBMITTED, CHAIR_ENDORSED} auto-transitions to WITHDRAWN."

  - name: overload_comp_cents
    trigger: "POST /overload-requests (snapshot at submission); recomputed on DENIED -> SUBMITTED resubmit"
    algorithm: threshold
    formula: |
      sheet = LoadSheet(term_id, faculty_id)   # must exist with overload_credits > 0
      overload_credits = sheet.overload_credits
      comp_cents = round_half_up(overload_credits * term.overload_comp_rate_cents, 0)
    input_set: "current LoadSheet for (term_id, faculty_id)"
    precision: "integer cents, round_half_up"
    constants: {}

  - name: late_cancel_stipend
    trigger: "Assignment CONFIRMED -> RESCINDED (chair) and CourseSection STAFFED -> CANCELLED cascade"
    algorithm: threshold
    formula: |
      days_remaining = (term.start_date - current_logical_date).days   # calendar days
      is_late = days_remaining < term.reassignment_notice_days          # STRICT <: exactly N days out is NOT late
      stipend_cents = term.late_cancel_stipend_cents if (is_late and assignment was CONFIRMED) else 0
      term.comp_budget_spent_cents += stipend_cents
    input_set: "assignments leaving CONFIRMED via chair rescind or section-cancel cascade; faculty-leave cascade sets stipend 0"
    constants: {}
    precision: "integer cents"
    note: "Boundary pinned: days_remaining == reassignment_notice_days exactly -> NOT late; days_remaining == notice_days - 1 -> late."

  - name: faculty_schedule_overlap_check
    trigger: "POST /assignments"
    algorithm: interval_merge
    formula: |
      For the candidate section S and every other section S2 that has a
      non-terminal assignment (status in {PROPOSED, CONFIRMED}) for the same
      faculty in the same term:
        if S.meeting_day == S2.meeting_day:
          overlap = S.start_minute < S2.end_minute and S2.start_minute < S.end_minute
          if overlap: reject ERR_MEETING_TIME_CONFLICT
      HALF-OPEN interval semantics [start, end): back-to-back meetings
      (S.start_minute == S2.end_minute) do NOT overlap.
    input_set: "sections of the faculty's non-terminal assignments in the same term"
    constants: {}

  - name: release_period_overlap_check
    trigger: "POST /release-time-grants"
    algorithm: interval_merge
    formula: |
      For the candidate grant G and every other grant G2 of the same
      (faculty_id, term_id) with status in {REQUESTED, APPROVED}:
        overlap = G.start_date <= G2.end_date and G2.start_date <= G.end_date
        if overlap: reject ERR_RELEASE_PERIOD_OVERLAP
      CLOSED interval semantics [start, end]: two grants sharing a single
      calendar day (G.start_date == G2.end_date) DO overlap.
    input_set: "grants of the same (faculty, term) filtered to status in {REQUESTED, APPROVED}"
    constants: {}
    note: "Deliberately different interval semantics from faculty_schedule_overlap_check: closed (touching = conflict) vs half-open (adjacent = allowed)."

  - name: union_overload_cap_check
    trigger: "POST /assignments"
    algorithm: threshold
    formula: |
      if not faculty.is_union_covered: pass   # cap applies only to union-covered faculty
      projected_teaching = sheet.teaching_credits + new_assignment.credit_units
      projected_overload = max(0, projected_teaching - sheet.effective_obligation_credits)
      if projected_overload > term.union_max_overload_credits: reject ERR_UNION_OVERLOAD_CAP_EXCEEDED
      # STRICTLY greater: projected_overload == union_max_overload_credits is allowed
    input_set: "current LoadSheet (auto-created empty if absent) + the new assignment's provisional credit_units"
    constants: {}

  - name: comp_budget_ledger
    trigger: "OverloadRequest CHAIR_ENDORSED -> DEAN_APPROVED; late assignment rescind; late section-cancel cascade"
    algorithm: aggregation
    formula: |
      INVARIANT: term.comp_budget_spent_cents
                 == sum(r.comp_cents for r in overload_requests where r.term_id == term.id and r.status == DEAN_APPROVED)
                  + sum(a.stipend_cents for a in assignments where a.term_id == term.id)
      comp_budget_remaining_cents = term.comp_budget_cents - term.comp_budget_spent_cents
    input_set: "all OverloadRequests and Assignments of the term"
    precision: "integer cents"

  - name: department_load_summary
    trigger: "GET /workload-terms/{termId}/load-summary"
    algorithm: aggregation
    formula: |
      sheets = all LoadSheets with term_id == term.id whose faculty.status != SEPARATED
      total_teaching_credits = sum(s.teaching_credits for s in sheets)
      overloaded_faculty_count  = count(s where s.overload_credits > 0)
      underloaded_faculty_count = count(s where s.underload_credits > 0)
      fairness_spread_credits = (max(s.teaching_credits) - min(s.teaching_credits)) if sheets else 0
      comp_budget_spent_cents / comp_budget_remaining_cents from comp_budget_ledger
      preference_satisfied_count   = count(assignments a in term where a.status in {PROPOSED, CONFIRMED} and a.matches_preference)
      preference_unsatisfied_count = count(assignments a in term where a.status in {PROPOSED, CONFIRMED} and not a.matches_preference)
    input_set: "LoadSheets of the term excluding SEPARATED faculty; assignments in {PROPOSED, CONFIRMED}"
    precision: "2 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint (per-to_state role gates on transition endpoints included)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 2.1
    category: auth
    check: "Ownership: FacultyMember caller may only confirm/decline an assignment whose faculty_id == X-User-ID"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
    http_status: 403
    applies_to: "POST /assignments/{assignmentId}/transition (to_state CONFIRMED | DECLINED)"

  - priority: 2.2
    category: auth
    check: "Segregation of duties: DEAN_APPROVED approver's X-User-ID must differ from endorsed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /overload-requests/{requestId}/transition (to_state DEAN_APPROVED)"

  - priority: 3
    category: existence
    check: "Request shape: required fields present, types correct, enum members valid, end_minute > start_minute, credits_released in (0, base_load], end_date >= start_date, enrolled_count >= 0, term.census_date >= start_date"
    error_id: "ERR_VALIDATION | ERR_INVALID_TIME_RANGE"
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Referenced resources exist: path ids left-to-right, then body FKs in declared input order (term_id before section_id/faculty_id before course_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_TERM_NOT_FOUND, ERR_FACULTY_NOT_FOUND, ERR_COURSE_NOT_FOUND, ERR_QUALIFICATION_NOT_FOUND, ERR_SECTION_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_OVERLOAD_REQUEST_NOT_FOUND, ERR_LOAD_SHEET_NOT_FOUND)"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Entity state preconditions: term accepts the write (sections creatable/schedulable in DRAFT|OPEN; assignments only in OPEN; rescind/cancel blocked in PUBLISHED unless override; close-census needs OPEN|LOCKED|PUBLISHED); section in {SCHEDULED, STAFFED} for assignment create; transition endpoints require the documented from-state; faculty must be ACTIVE to confirm; publish requires no {PROPOSED, SCHEDULED} sections and no uncovered overload"
    error_id: "ERR_INVALID_TERM_STATE | ERR_INVALID_SECTION_TRANSITION | ERR_SECTION_NOT_ASSIGNABLE | ERR_INVALID_ASSIGNMENT_TRANSITION | ERR_INVALID_GRANT_TRANSITION | ERR_INVALID_OVERLOAD_TRANSITION | ERR_INVALID_FACULTY_STATE | ERR_INVALID_QUALIFICATION_TRANSITION | ERR_CENSUS_NOT_REACHED | ERR_UNSTAFFED_SECTIONS | ERR_UNCOVERED_OVERLOAD | ERR_DEAN_OVERRIDE_REQUIRED"
    http_status: 409
    applies_to: "state transition endpoints, POST /assignments, POST /course-sections, POST /workload-terms/{termId}/close-census"

  - priority: 5.1
    category: state
    check: "OCC: expected_term_version (PATCH term) / expected_section_version (enrollment-sync) must equal the entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /workload-terms/{termId}, POST /course-sections/{sectionId}/enrollment-sync"

  - priority: 6
    category: business_referential
    check: "An ACTIVE qualification (lazy EXPIRED applied) must exist for (faculty_id, section.course_id)"
    error_id: ERR_NOT_QUALIFIED_FOR_COURSE
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 7
    category: business_temporal
    check: "Faculty schedule half-open overlap (ERR_MEETING_TIME_CONFLICT); release-grant closed-interval overlap (ERR_RELEASE_PERIOD_OVERLAP)"
    error_id: "ERR_MEETING_TIME_CONFLICT | ERR_RELEASE_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /assignments, POST /release-time-grants"

  - priority: 8
    category: business_constraint
    check: "Uniqueness (term_code, faculty email, section number per term+course, one ACTIVE qualification per faculty+course, one non-terminal assignment per section, one non-terminal overload request per faculty+term); modality in course.allowed_modalities; enrolled_count <= enrollment_cap; union overload cap (union-covered faculty only)"
    error_id: "ERR_DUPLICATE_TERM_CODE | ERR_DUPLICATE_FACULTY_EMAIL | ERR_DUPLICATE_SECTION | ERR_DUPLICATE_QUALIFICATION | ERR_MODALITY_NOT_ALLOWED | ERR_ENROLLMENT_EXCEEDS_CAP | ERR_UNION_OVERLOAD_CAP_EXCEEDED | ERR_SECTION_ALREADY_ASSIGNED | ERR_NO_OVERLOAD | ERR_OVERLOAD_REQUEST_EXISTS"
    http_status: 409
    applies_to: "create endpoints, enrollment-sync, POST /overload-requests"
    note: "http_status per error_id: duplicates/conflicts 409; ERR_MODALITY_NOT_ALLOWED / ERR_ENROLLMENT_EXCEEDS_CAP / ERR_UNION_OVERLOAD_CAP_EXCEEDED / ERR_NO_OVERLOAD are 422"

  - priority: 9
    category: business_fiscal
    check: "Compensation budget: DEAN_APPROVED comp or late stipends must not push comp_budget_spent_cents above comp_budget_cents"
    error_id: ERR_COMP_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /overload-requests/{requestId}/transition (DEAN_APPROVED), POST /assignments/{assignmentId}/transition (RESCINDED, late), POST /course-sections/{sectionId}/transition (CANCELLED, late, staffed)"

# =============================================================================
# §1.5 API Endpoint Table (38 endpoints)
# =============================================================================
# GET endpoints permit every declared role; written out explicitly so callers
# always send a real X-User-Role.
endpoints:
  # --- WorkloadTerm ---
  - { method: POST, path: "/workload-terms", description: "Create a term with inline workload policy fields (defaults applied when omitted)", roles: [DepartmentChair], code: 201, input: ["term_code", "title", "start_date", "census_date", "comp_budget_cents", "base_teaching_credits?", "lecture_multiplier?", "lab_multiplier?", "seminar_multiplier?", "online_premium_credits?", "large_class_threshold?", "large_class_bonus_credits?", "overload_comp_rate_cents?", "union_max_overload_credits?", "reassignment_notice_days?", "late_cancel_stipend_cents?", "flat_release_rate_cents?"], output: WorkloadTerm, side_effects: ["status DRAFT; comp_budget_spent_cents = 0"] }
  - { method: GET, path: "/workload-terms", description: "List terms", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkloadTerm[]", side_effects: [] }
  - { method: GET, path: "/workload-terms/{termId}", description: "Get one term", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: WorkloadTerm, side_effects: [] }
  - { method: PATCH, path: "/workload-terms/{termId}", description: "Edit policy/equivalency fields; only while DRAFT (ERR_INVALID_TERM_STATE otherwise); OCC via expected_term_version", roles: [DepartmentChair], code: 200, input: ["expected_term_version", "title?", "census_date?", "base_teaching_credits?", "comp_budget_cents?", "lecture_multiplier?", "lab_multiplier?", "seminar_multiplier?", "online_premium_credits?", "large_class_threshold?", "large_class_bonus_credits?", "overload_comp_rate_cents?", "union_max_overload_credits?", "reassignment_notice_days?", "late_cancel_stipend_cents?", "flat_release_rate_cents?"], output: WorkloadTerm, side_effects: ["increments WorkloadTerm.version by 1"] }
  - { method: POST, path: "/workload-terms/{termId}/transition", description: "Term lifecycle: to_state OPEN (from DRAFT or LOCKED), LOCKED (from OPEN), PUBLISHED (from LOCKED; publish preconditions apply)", roles: [DepartmentChair], code: 200, input: ["to_state"], output: WorkloadTerm, side_effects: ["state machine WorkloadTerm", "increments WorkloadTerm.version by 1"] }
  - { method: POST, path: "/workload-terms/{termId}/close-census", description: "Census checkpoint: freeze final_credit_units for all CONFIRMED assignments using current enrolled_count, recompute all LoadSheets (final preferred over provisional), then apply overload auto-withdraw", roles: [DepartmentChair], code: 200, input: [], output: WorkloadTerm, side_effects: ["assignment_final_credit_units", "load_sheet_recompute", "overload auto-withdraw"] }
  - { method: GET, path: "/workload-terms/{termId}/load-summary", description: "Department load balancing report", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: "{ term_id: string, total_teaching_credits: number, overloaded_faculty_count: integer, underloaded_faculty_count: integer, fairness_spread_credits: number, comp_budget_spent_cents: integer, comp_budget_remaining_cents: integer, preference_satisfied_count: integer, preference_unsatisfied_count: integer }", side_effects: [] }

  # --- FacultyMember ---
  - { method: POST, path: "/faculty-members", description: "Create faculty member", roles: [DepartmentChair], code: 201, input: ["full_name", "email", "rank", "base_salary_cents", "is_union_covered?", "base_load_credits?", "preferred_course_ids?"], output: FacultyMember, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/faculty-members", description: "List faculty", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["status?", "rank?", "limit?", "offset?"], output: "FacultyMember[]", side_effects: [] }
  - { method: GET, path: "/faculty-members/{facultyId}", description: "Get one faculty member", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: FacultyMember, side_effects: [] }
  - { method: PATCH, path: "/faculty-members/{facultyId}", description: "Status transitions (ON_LEAVE/ACTIVE/SEPARATED) and base_load_credits / preferred_course_ids edits", roles: [DepartmentChair], code: 200, input: ["status?", "base_load_credits?", "preferred_course_ids?"], output: FacultyMember, side_effects: ["leave/separation cascade: PROPOSED assignments -> WITHDRAWN, CONFIRMED -> RESCINDED (stipend 0), sections demote STAFFED -> SCHEDULED, LoadSheets recomputed, overload auto-withdraw"] }

  # --- Course ---
  - { method: POST, path: "/courses", description: "Create course", roles: [DepartmentChair], code: 201, input: ["course_code", "title", "course_type", "base_credits", "default_enrollment_cap", "allowed_modalities"], output: Course, side_effects: [] }
  - { method: GET, path: "/courses", description: "List courses", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["course_type?", "limit?", "offset?"], output: "Course[]", side_effects: [] }
  - { method: GET, path: "/courses/{courseId}", description: "Get one course", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: Course, side_effects: [] }

  # --- Qualification ---
  - { method: POST, path: "/qualifications", description: "Grant a course qualification to faculty (at most one ACTIVE per faculty+course)", roles: [DepartmentChair], code: 201, input: ["faculty_id", "course_id", "expires_on"], output: Qualification, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/qualifications", description: "List qualifications", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["faculty_id?", "course_id?", "status?", "limit?", "offset?"], output: "Qualification[]", side_effects: [] }
  - { method: GET, path: "/qualifications/{qualificationId}", description: "Get one qualification (lazy EXPIRED applied)", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: Qualification, side_effects: [] }
  - { method: PATCH, path: "/qualifications/{qualificationId}", description: "Revoke a qualification (status must be REVOKED)", roles: [DepartmentChair], code: 200, input: ["status"], output: Qualification, side_effects: ["status -> REVOKED"] }

  # --- CourseSection ---
  - { method: POST, path: "/course-sections", description: "Create a section in a DRAFT|OPEN term; enrollment_cap defaults from course", roles: [DepartmentChair], code: 201, input: ["term_id", "course_id", "section_number", "modality", "meeting_day", "start_minute", "end_minute", "enrollment_cap?"], output: CourseSection, side_effects: ["status PROPOSED; enrolled_count = 0"] }
  - { method: GET, path: "/course-sections", description: "List sections", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["term_id?", "course_id?", "status?", "limit?", "offset?"], output: "CourseSection[]", side_effects: [] }
  - { method: GET, path: "/course-sections/{sectionId}", description: "Get one section", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: CourseSection, side_effects: [] }
  - { method: POST, path: "/course-sections/{sectionId}/transition", description: "to_state SCHEDULED (from PROPOSED) or CANCELLED (from PROPOSED/SCHEDULED/STAFFED; late/publish rules + cascades)", roles: [DepartmentChair], code: 200, input: ["to_state", "dean_override?"], output: CourseSection, side_effects: ["state machine CourseSection incl. assignment cascade, stipends, LoadSheet recompute, overload auto-withdraw", "increments CourseSection.version by 1"] }
  - { method: POST, path: "/course-sections/{sectionId}/enrollment-sync", description: "Registrar enrollment sync; OCC via expected_section_version; enrolled_count must be <= enrollment_cap", roles: [Registrar], code: 200, input: ["enrolled_count", "expected_section_version"], output: CourseSection, side_effects: ["enrolled_count updated", "increments CourseSection.version by 1"] }

  # --- Assignment ---
  - { method: POST, path: "/assignments", description: "Chair proposes a section assignment; computes provisional credit_units; auto-creates LoadSheet; full validation chain (qualification, overlap, union cap, one-open-assignment-per-section)", roles: [DepartmentChair], code: 201, input: ["section_id", "faculty_id"], output: Assignment, side_effects: ["assignment_credit_units (provisional)", "LoadSheet auto-create + load_sheet_recompute", "union_overload_cap_check"] }
  - { method: GET, path: "/assignments", description: "List assignments", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["term_id?", "section_id?", "faculty_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/assignments/{assignmentId}", description: "Get one assignment", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{assignmentId}/transition", description: "to_state CONFIRMED/DECLINED (FacultyMember self) or WITHDRAWN (chair, from PROPOSED) / RESCINDED (chair, from CONFIRMED; late stipend rules)", roles: [DepartmentChair, FacultyMember], code: 200, input: ["to_state"], output: Assignment, side_effects: ["state machine Assignment incl. section STAFFED/SCHEDULED bubble, stipend + comp_budget_ledger, LoadSheet recompute, overload auto-withdraw"] }

  # --- ReleaseTimeGrant ---
  - { method: POST, path: "/release-time-grants", description: "Request release time (research buyout / administrative / sabbatical); closed-interval overlap rejected", roles: [DepartmentChair], code: 201, input: ["term_id", "faculty_id", "grant_type", "credits_released", "start_date", "end_date"], output: ReleaseTimeGrant, side_effects: ["status REQUESTED; LoadSheet auto-created if absent"] }
  - { method: GET, path: "/release-time-grants", description: "List release-time grants", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["term_id?", "faculty_id?", "status?", "limit?", "offset?"], output: "ReleaseTimeGrant[]", side_effects: [] }
  - { method: GET, path: "/release-time-grants/{grantId}", description: "Get one grant", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: ReleaseTimeGrant, side_effects: [] }
  - { method: POST, path: "/release-time-grants/{grantId}/transition", description: "to_state APPROVED / DENIED (DeanOffice) or REVOKED (DepartmentChair | DeanOffice, from APPROVED); approve computes buyout_value_cents and credits the LoadSheet; revoke compensates", roles: [DepartmentChair, DeanOffice], code: 200, input: ["to_state"], output: ReleaseTimeGrant, side_effects: ["release_buyout_value on APPROVED", "load_sheet_recompute", "overload auto-withdraw"] }

  # --- OverloadRequest ---
  - { method: POST, path: "/overload-requests", description: "Submit overload approval request; snapshots current overload_credits (> 0 required) and comp_cents; one non-terminal per (faculty, term)", roles: [DepartmentChair], code: 201, input: ["term_id", "faculty_id"], output: OverloadRequest, side_effects: ["overload_comp_cents snapshot"] }
  - { method: GET, path: "/overload-requests", description: "List overload requests", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["term_id?", "faculty_id?", "status?", "limit?", "offset?"], output: "OverloadRequest[]", side_effects: [] }
  - { method: GET, path: "/overload-requests/{requestId}", description: "Get one overload request", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: OverloadRequest, side_effects: [] }
  - { method: POST, path: "/overload-requests/{requestId}/transition", description: "to_state CHAIR_ENDORSED (chair, from SUBMITTED or DENIED-resubmit), DEAN_APPROVED / DENIED (DeanOffice, from CHAIR_ENDORSED; SoD + budget checks on approve), WITHDRAWN (chair, from SUBMITTED | CHAIR_ENDORSED)", roles: [DepartmentChair, DeanOffice], code: 200, input: ["to_state"], output: OverloadRequest, side_effects: ["comp_budget_ledger on DEAN_APPROVED", "endorsed_by_user_id recorded on endorse"] }

  # --- LoadSheet (read-only; auto-created) ---
  - { method: GET, path: "/load-sheets", description: "List load sheets", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: ["term_id?", "faculty_id?", "limit?", "offset?"], output: "LoadSheet[]", side_effects: [] }
  - { method: GET, path: "/load-sheets/{loadSheetId}", description: "Get one load sheet", roles: [DepartmentChair, FacultyMember, DeanOffice, Registrar, SystemAdmin], code: 200, input: [], output: LoadSheet, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Drives late-cancel windows, qualification expiry, and census gating.", roles: [SystemAdmin], code: 200, input: ["to_iso8601"], output: "{ current_utc: string }", side_effects: ["lazy qualification expiry becomes observable on subsequent reads/validations"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint (or for the requested to_state on a shared transition endpoint)" }
  - { id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP, http: 403, condition: "FacultyMember caller's X-User-ID != assignment.faculty_id on confirm/decline" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "DEAN_APPROVED approver's X-User-ID equals endorsed_by_user_id" }
  # --- Not found ---
  - { id: ERR_TERM_NOT_FOUND, http: 404, condition: "termId path id or term_id body FK does not exist" }
  - { id: ERR_FACULTY_NOT_FOUND, http: 404, condition: "facultyId path id or faculty_id body FK does not exist" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "courseId path id or course_id body FK does not exist" }
  - { id: ERR_QUALIFICATION_NOT_FOUND, http: 404, condition: "qualificationId path id does not exist" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "sectionId path id or section_id body FK does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId path id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "grantId path id does not exist" }
  - { id: ERR_OVERLOAD_REQUEST_NOT_FOUND, http: 404, condition: "requestId path id does not exist" }
  - { id: ERR_LOAD_SHEET_NOT_FOUND, http: 404, condition: "loadSheetId path id does not exist" }
  # --- Request shape ---
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, type mismatch, invalid enum member, out-of-range scalar (e.g. credits_released > base_load_credits), or census_date < start_date" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "Section end_minute <= start_minute, or minutes outside 0..1439" }
  # --- State ---
  - { id: ERR_INVALID_TERM_STATE, http: 409, condition: "Term status forbids the write (e.g. assignment create outside OPEN, policy PATCH outside DRAFT, section create/schedule outside DRAFT|OPEN, rescind in PUBLISHED, close-census in DRAFT, illegal term transition)" }
  - { id: ERR_INVALID_SECTION_TRANSITION, http: 409, condition: "Section not in a from-state for the requested to_state (e.g. CANCELLED is terminal, PROPOSED -> STAFFED not directly allowed)" }
  - { id: ERR_SECTION_NOT_ASSIGNABLE, http: 409, condition: "Assignment create requires section status in {SCHEDULED, STAFFED}" }
  - { id: ERR_INVALID_ASSIGNMENT_TRANSITION, http: 409, condition: "Assignment not in a from-state for the requested to_state (terminal states: DECLINED/WITHDRAWN/RESCINDED/CANCELLED)" }
  - { id: ERR_INVALID_GRANT_TRANSITION, http: 409, condition: "Grant not in a from-state for the requested to_state (terminal: DENIED/REVOKED)" }
  - { id: ERR_INVALID_OVERLOAD_TRANSITION, http: 409, condition: "Overload request not in a from-state for the requested to_state (terminal: DEAN_APPROVED/DENIED/WITHDRAWN; DENIED -> SUBMITTED resubmit is the only loop)" }
  - { id: ERR_INVALID_FACULTY_STATE, http: 409, condition: "Faculty status forbids the operation (e.g. confirm while ON_LEAVE/SEPARATED, or PATCH to a status not reachable from current)" }
  - { id: ERR_INVALID_QUALIFICATION_TRANSITION, http: 409, condition: "PATCH status other than REVOKED, or qualification already terminal" }
  - { id: ERR_CENSUS_NOT_REACHED, http: 409, condition: "close-census before the logical clock reaches census_date" }
  - { id: ERR_UNSTAFFED_SECTIONS, http: 409, condition: "Publish blocked: sections remain in PROPOSED or SCHEDULED" }
  - { id: ERR_UNCOVERED_OVERLOAD, http: 409, condition: "Publish blocked: a LoadSheet has overload_credits > 0 without a DEAN_APPROVED OverloadRequest for that (term, faculty)" }
  - { id: ERR_DEAN_OVERRIDE_REQUIRED, http: 409, condition: "Cancelling a section while the term is PUBLISHED requires dean_override=true" }
  # --- Business referential / temporal ---
  - { id: ERR_NOT_QUALIFIED_FOR_COURSE, http: 422, condition: "No ACTIVE qualification for (faculty_id, section.course_id) — missing, REVOKED, or EXPIRED" }
  - { id: ERR_MEETING_TIME_CONFLICT, http: 409, condition: "New section's [start_minute, end_minute) half-open interval overlaps another section with a non-terminal assignment for the same faculty on the same meeting_day" }
  - { id: ERR_RELEASE_PERIOD_OVERLAP, http: 409, condition: "New grant's closed [start_date, end_date] interval touches or overlaps another REQUESTED/APPROVED grant for the same (faculty, term)" }
  # --- Business constraint ---
  - { id: ERR_DUPLICATE_TERM_CODE, http: 409, condition: "term_code already exists" }
  - { id: ERR_DUPLICATE_FACULTY_EMAIL, http: 409, condition: "email already exists" }
  - { id: ERR_DUPLICATE_SECTION, http: 409, condition: "section_number already used for (term_id, course_id)" }
  - { id: ERR_DUPLICATE_QUALIFICATION, http: 409, condition: "an ACTIVE qualification already exists for (faculty_id, course_id)" }
  - { id: ERR_MODALITY_NOT_ALLOWED, http: 422, condition: "section modality not in course.allowed_modalities" }
  - { id: ERR_ENROLLMENT_EXCEEDS_CAP, http: 422, condition: "enrollment-sync enrolled_count > enrollment_cap" }
  - { id: ERR_UNION_OVERLOAD_CAP_EXCEEDED, http: 422, condition: "Union-covered faculty: projected overload after this assignment would be strictly greater than union_max_overload_credits" }
  - { id: ERR_SECTION_ALREADY_ASSIGNED, http: 409, condition: "Section already has a non-terminal (PROPOSED/CONFIRMED) assignment" }
  - { id: ERR_NO_OVERLOAD, http: 422, condition: "Overload request submitted while LoadSheet.overload_credits == 0 (or no LoadSheet exists)" }
  - { id: ERR_OVERLOAD_REQUEST_EXISTS, http: 409, condition: "A non-terminal overload request already exists for (faculty_id, term_id)" }
  # --- Fiscal / OCC ---
  - { id: ERR_COMP_BUDGET_EXCEEDED, http: 402, condition: "Approving comp or charging a late stipend would push comp_budget_spent_cents above comp_budget_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_term_version / expected_section_version does not match the entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DepartmentChair
    description: "Academic department chair: owns term setup, policy, sections, assignments, grants, overload endorsement, publishing"
    identity: opaque
    exclusive_operations:
      - "POST /workload-terms; PATCH /workload-terms/{id}; POST /workload-terms/{id}/transition; POST /workload-terms/{id}/close-census"
      - "POST /faculty-members; PATCH /faculty-members/{id}"
      - "POST /courses"
      - "POST /qualifications; PATCH /qualifications/{id}"
      - "POST /course-sections; POST /course-sections/{id}/transition"
      - "POST /assignments; POST /assignments/{id}/transition with to_state WITHDRAWN | RESCINDED"
      - "POST /release-time-grants; POST /release-time-grants/{id}/transition with to_state REVOKED"
      - "POST /overload-requests; POST /overload-requests/{id}/transition with to_state CHAIR_ENDORSED | WITHDRAWN"
    shared_operations: ["all GET endpoints"]

  - name: FacultyMember
    description: "A faculty member acting on their own assignments (consent under the union contract)"
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /assignments/{id}/transition with to_state CONFIRMED | DECLINED, only when X-User-ID == assignment.faculty_id"
    shared_operations: ["all GET endpoints"]

  - name: DeanOffice
    description: "Dean's office: approves/denies release time and overload compensation (segregated from the endorsing chair)"
    identity: opaque
    exclusive_operations:
      - "POST /release-time-grants/{id}/transition with to_state APPROVED | DENIED | REVOKED"
      - "POST /overload-requests/{id}/transition with to_state DEAN_APPROVED | DENIED"
    shared_operations: ["all GET endpoints"]

  - name: Registrar
    description: "Registrar feed operator: enrollment syncs only"
    identity: opaque
    exclusive_operations:
      - "POST /course-sections/{id}/enrollment-sync"
    shared_operations: ["all GET endpoints"]

  - name: SystemAdmin
    description: "Test/ops operator: logical clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
