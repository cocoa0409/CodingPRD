              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "u-7"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "u-7"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "u-7"
              captures: { negotiator: "$.data.negotiated_by_user_id" }
          trigger:
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "u-7"
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-2"
          assert:
            - "MileSaleAgreement.${agr_id}.negotiated_by_user_id == \"u-7\""
            - "the first trigger returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "MileSaleAgreement.${agr_id}.status == ISSUER_REVIEW"
            - "MileSaleAgreement.${agr_id}.ratified_by_user_id == null"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 0"
            - "the second trigger returns HTTP 200"
            - "MileSaleAgreement.${agr_id}.status == RATIFIED"
            - "MileSaleAgreement.${agr_id}.ratified_by_user_id == \"co-2\""
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 1000000"
            - "CoBrandIssuer.${issuer_id}.status == ACTIVE"

      - name: a_member_cannot_read_another_members_booking
        claim_type: peer_roles
        grounds:
          - roles.Member
          - validations[priority=3]
          - errors.ERR_MEMBER_SCOPE_VIOLATION
        distinguishing_aspect: "Both members are legitimate Member principals on the same program and the booking id resolves, so the answer is ERR_MEMBER_SCOPE_VIOLATION (403) rather than ERR_BOOKING_NOT_FOUND (404) - and the owning member's own read of the same row returns 200."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "Two MemberAccounts M1 and M2 at elite_tier BASE."
            - "One AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, holding one 1-seat FLEX booking owned by M1."
