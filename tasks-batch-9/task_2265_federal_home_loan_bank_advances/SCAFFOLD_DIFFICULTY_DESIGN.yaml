            - "before the trigger: MemberBank.latest_review_outcome == \"FAIL\", verification_haircut_bps == 1500, lendable_collateral_value_cents == 12600000, committed_advances_cents == 1000000, borrowing_capacity_cents == 11600000, shortfall_status == \"NONE\", collateral_posture == \"RESTRICTED\""
            - "the trigger returns HTTP 409 with error_id == \"ERR_COLLATERAL_POSTURE_FROZEN\" because funding requires collateral_posture == OPEN and RESTRICTED is not OPEN"
            - "Advance.credit_status stays \"CREDIT_APPROVED\", collateral_status stays \"PENDING_VERIFICATION\", funded_at is null and outstanding_principal_cents == 0"
            - "no ACTIVITY StockSubscription was created for the advance: GET /fhlb/stock-subscriptions?advance_id={advance_d} returns total_count == 0"
            - "MemberBank.total_outstanding_advances_cents == 0 and version is unchanged by the refused call"
            - "capacity is NOT the obstacle: 11600000 far exceeds the 1000000 gross, so a 409 citing ERR_INSUFFICIENT_BORROWING_CAPACITY would be wrong, and a 201 indicates the parent's posture was never consulted"

      - name: review_retest_rejected_while_critical_finding_open
        entity_pair: "CollateralVerificationReview -> ReviewFinding"
        grounds:
          - "state_machines.CollateralVerificationReview REMEDIATION -> FIELD_WORK (precondition: no OPEN CRITICAL finding)"
          - "errors.ERR_CRITICAL_FINDINGS_OPEN"
          - "entities.ReviewFinding.status"
        distinguishing_aspect: |
          The gating pair is (CollateralVerificationReview, ReviewFinding) — a PARENT blocked
          by an aggregate predicate over its CHILDREN ("no child in {OPEN} with severity
          CRITICAL"), which is a fundamentally different dependency direction from instance
          1's child-blocked-by-parent and instance 3's peer dependency. It also shows that
          the refusal leaves the counter untouched, so a blocked cycle does not consume one
          of the two permitted retests.
        test_recipe:
          setup: |
            Harbor Savings ACTIVE with an executed pledge and one submitted asset. Review R
            over [2026-08-01, 2026-08-20) with sample_size 40 has begun field work; the
            auditor raises one MINOR and one CRITICAL finding and issues them, which
            auto-advances the review to REMEDIATION. The MINOR finding is remediated by the
            treasury officer; the CRITICAL one is deliberately left OPEN.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_id: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_id}/begin-field-work"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/collateral-verification-reviews/${review_id}/findings"
              payload: { collateral_asset_id: "${asset_sf}", finding_type: "DOCUMENT_MISMATCH", severity: "MINOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_minor: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_id}/findings"
              payload: { collateral_asset_id: "${asset_sf}", finding_type: "LIEN_DEFECT", severity: "CRITICAL" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_critical: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_id}/issue-findings"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/review-findings/${finding_minor}/remediate"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "${member_id}"
          trigger:
            call: "POST /fhlb/collateral-verification-reviews/${review_id}/retest"
            payload: {}
            as: CollateralReviewAuditor
            captures: { error_code: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with error_id == \"ERR_CRITICAL_FINDINGS_OPEN\""
            - "CollateralVerificationReview.status stays \"REMEDIATION\" and retest_count == 0 — a refused cycle does not consume one of the two permitted retests"
            - "ReviewFinding finding_critical has status == \"OPEN\" and ReviewFinding finding_minor has status == \"REMEDIATED\""
            - "the same retest succeeds immediately after the CRITICAL finding is waived or remediated, moving the review to \"FIELD_WORK\" with retest_count == 1"
            - "a review carrying only the MINOR finding as OPEN would retest successfully, proving the gate reads severity and not merely the existence of a child"

      - name: safekeeping_receipt_rejected_for_substituted_asset
        entity_pair: "SafekeepingReceipt -> CollateralAsset"
        grounds:
          - "validations.asset-eligible-for-safekeeping (priority 10, status IN {INELIGIBLE, SUBSTITUTED})"
          - "state_machines.CollateralAsset ELIGIBLE -> SUBSTITUTED"
          - "endpoints.POST /fhlb/collateral-assets/{collateral_asset_id}/safekeeping-receipts"
        distinguishing_aspect: |
          The gating pair is (SafekeepingReceipt, CollateralAsset): the creation of a NEW
          child row is refused because of the lifecycle state of the row it would hang from.
          Neither of the other instances is a creation gate — instance 1 blocks a transition
          on an existing row and instance 2 blocks a transition on a parent. This instance
          also exercises the OCC-guarded substitution path, so the asset reaches SUBSTITUTED
          through a version-checked write rather than through an audit cascade.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with one ELIGIBLE SF_MORTGAGE asset A1 (lendable
            15,600,000). The treasury officer substitutes A1 with an identical replacement
            asset, supplying the member's current version, which moves A1 to SUBSTITUTED and
            creates the replacement in UNDER_REVIEW with replaces_asset_id set to A1. The
            custodian then tries to book a safekeeping receipt against the retired A1.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/substitute"
              payload: { expected_member_bank_version: "${ver_a}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_replacement: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
            payload: { file_count: 12, delivery_date: "2026-08-10T00:00:00Z", return_date: "2026-08-20T00:00:00Z" }
            as: CollateralCustodian
            captures: { error_code: "$.data.error_id" }
          assert:
            - "before the trigger the outgoing asset A1 has status == \"SUBSTITUTED\" with lendable_value_cents == 0, and the replacement asset has status == \"UNDER_REVIEW\" with replaces_asset_id == the A1 id and lendable_value_cents == 0"
            - "the trigger returns HTTP 409 with error_id == \"ERR_ASSET_NOT_ELIGIBLE\""
            - "no SafekeepingReceipt row is created: GET /fhlb/safekeeping-receipts?collateral_asset_id={asset_sf} returns total_count == 0"
            - "the identical receipt booked against the replacement asset AFTER it is approved ELIGIBLE succeeds with HTTP 201 and status \"PENDING_DELIVERY\", proving the endpoint itself works and only the peer entity's state was the obstacle"
            - "MemberBank.lendable_collateral_value_cents == 0 while the replacement is still UNDER_REVIEW, and 15600000 once it is approved"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    applied: true
    summary: |
      Two interval-conflict rules over two different resources with two different interval
      semantics: half-open field-work windows per MemberBank, and closed custody windows
      per CollateralAsset expanded by a two-day buffer.
    instances:
      - name: review_window_adjacent_allowed_overlap_rejected
        resource: MemberBank
        interval_semantics: "half-open [window_start, window_end) — touching endpoints do NOT conflict; no buffer"
        grounds:
          - "validations.review-window-no-overlap (priority 11, ERR_REVIEW_WINDOW_OVERLAP)"
          - "entities.CollateralVerificationReview.window_start / window_end"
        distinguishing_aspect: |
          The contended resource is the MEMBER BANK (only one open field-work window per
          member) and the interval is HALF-OPEN with no grace expansion, so the adjacency
          case new.window_start == existing.window_end is explicitly legal. The candidate
          set is also filtered by review status (CLOSED reviews never conflict). Instance 2
          contends over a single CollateralAsset with CLOSED intervals and a symmetric
          two-day buffer, where adjacency is instead a conflict.
        test_recipe:
          setup: |
            Harbor Savings ACTIVE with an executed pledge and one submitted asset. Review 1
            covers [2026-08-01, 2026-08-20) and stays SCHEDULED. Review 2 is then created
            over [2026-08-20, 2026-08-30) — it starts exactly where review 1 ends, which is
            the adjacency case and must be accepted. The third request spans
            [2026-08-19, 2026-08-25), which overlaps review 1 by one day and review 2 by
            five days.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_one: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-30T00:00:00Z", sample_size: 25 }
              as: CollateralReviewAuditor
              captures: { review_two: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-verification-reviews"
            payload: { member_bank_id: "${member_id}", window_start: "2026-08-19T00:00:00Z", window_end: "2026-08-25T00:00:00Z", sample_size: 30 }
            as: CollateralReviewAuditor
            captures: { error_code: "$.data.error_id" }
          assert:
            - "review 2 was accepted with HTTP 201 and status \"SCHEDULED\": new.window_start == existing.window_end is adjacency, not overlap, under half-open semantics"
            - "the trigger returns HTTP 409 with error_id == \"ERR_REVIEW_WINDOW_OVERLAP\""
            - "GET /fhlb/collateral-verification-reviews?member_bank_id={member_id} returns total_count == 2, holding only review 1 and review 2"
            - "a request for [2026-08-30, 2026-09-05) is accepted (adjacent to review 2's end), and a request for [2026-08-29, 2026-09-05) is refused"
            - "once review 1 is driven to CLOSED, a request for [2026-08-05, 2026-08-15) is accepted, proving the candidate set excludes CLOSED reviews"

      - name: custody_window_buffer_boundary_conflict_rejected
        resource: CollateralAsset
        interval_semantics: "closed [delivery_date, return_date] expanded symmetrically by CUSTODY_BUFFER_DAYS = 2 — touching endpoints DO conflict"
        grounds:
          - "validations.custody-window-no-conflict (priority 11, ERR_CUSTODY_WINDOW_CONFLICT)"
          - "entities.SafekeepingReceipt.delivery_date / return_date"
          - "endpoints.POST /fhlb/collateral-assets/{collateral_asset_id}/safekeeping-receipts"
        distinguishing_aspect: |
          The contended resource is a single COLLATERAL ASSET's loan file, and the interval
          semantics are the opposite of instance 1's: the window is CLOSED at both ends and
          then expanded by a two-day handling buffer on each side, so a gap of exactly two
          days still conflicts and a gap of three days does not. The candidate set is
          filtered by receipt status rather than review status. The boundary being probed is
          therefore the buffer edge, not the adjacency edge.
        test_recipe:
          setup: |
            Harbor Savings ACTIVE with one ELIGIBLE SF_MORTGAGE asset A1. Receipt 1 holds
            the file over [2026-08-10, 2026-08-20] in PENDING_DELIVERY. Receipt 2 over
            [2026-08-23, 2026-08-28] is accepted: its delivery date is three days after
            receipt 1's return, one day clear of the two-day buffer. The third request asks
            for [2026-08-22, 2026-08-26], exactly two days after receipt 1's return, which
            sits ON the buffer edge and must conflict (and it also overlaps receipt 2
            outright).
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
              payload: { file_count: 12, delivery_date: "2026-08-10T00:00:00Z", return_date: "2026-08-20T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_one: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
              payload: { file_count: 12, delivery_date: "2026-08-23T00:00:00Z", return_date: "2026-08-28T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_two: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
            payload: { file_count: 12, delivery_date: "2026-08-22T00:00:00Z", return_date: "2026-08-26T00:00:00Z" }
            as: CollateralCustodian
            captures: { error_code: "$.data.error_id" }
          assert:
            - "receipt 1 and receipt 2 both exist with status \"PENDING_DELIVERY\"; receipt 2 was accepted because 2026-08-23 > 2026-08-20 + 2 days"
            - "the trigger returns HTTP 409 with error_id == \"ERR_CUSTODY_WINDOW_CONFLICT\""
            - "GET /fhlb/safekeeping-receipts?collateral_asset_id={asset_sf} returns total_count == 2"
            - "a request for [2026-08-22, 2026-08-26] filed against a DIFFERENT collateral asset is accepted, proving the conflict scope is the single asset and not the member"
            - "the buffer is symmetric: a request for [2026-08-01, 2026-08-08] is also refused because its return date is within two days of receipt 1's delivery date, while [2026-08-01, 2026-08-07] is accepted"
            - "unlike the half-open review window, touching endpoints conflict here: a request for [2026-08-20, 2026-08-21] is refused"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    applied: true
    summary: |
      Two conserved quantities, each round-tripped through a compensating operation: the
      member's stock capital against the sum of its live subscriptions, and the community
      allocation's pool against the sum of its per-bucket commitments.
    instances:
      - name: stock_capital_conservation_across_fund_repay_repurchase
        conserved_quantity: "MemberBank.stock_held_cents == sum of StockSubscription.amount_cents over status IN {ISSUED, REDEMPTION_REQUESTED}, with required_total = required_membership + required_activity at every checkpoint"
        grounds:
          - "calculations.activity_stock_requirement (held / required / deficiency / excess)"
          - "state_machines.StockSubscription ISSUED -> REDEMPTION_REQUESTED -> REPURCHASED"
          - "validations.redemption-preserves-requirement (ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT)"
        distinguishing_aspect: |
          The conserved quantity is STOCK CAPITAL — a member-level ledger reconciled against
          a set of subscription rows, where the compensating operation is a repurchase that
          must return the ledger to exactly its pre-advance value (9,600,000) with zero
          drift in either direction. Instance 2 conserves a completely different quantity (a
          subsidy pool partitioned into three named buckets) on a different entity, and its
          compensation is a release cascade rather than a deliberate operator action.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with one ELIGIBLE SF_MORTGAGE asset (lendable 15,600,000)
            and membership stock of exactly 9,600,000 ISSUED. Advance D asks for 950,000 of
            net proceeds with fund_stock_from_advance true, so gross is 1,000,000 and the
            activity stock obligation is 50,000 (450 bps of 1,000,000, already a par
            multiple); the term is 30 days, so funding on 2026-08-01 gives a maturity of
            2026-08-31. The advance is funded, which mints a 50,000 ACTIVITY subscription;
            the clock is then moved to maturity and the advance repaid, which moves that
            subscription to REDEMPTION_REQUESTED and leaves 50,000 of excess stock.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 30, requested_net_proceeds_cents: 950000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: true }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_d: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_d}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /fhlb/advances/${advance_d}/fund"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-2"
            - call: "GET /fhlb/stock-subscriptions"
              payload: { advance_id: "${advance_d}" }
              as: CreditOfficer
              captures: { sub_activity: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-31T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/advances/${advance_d}/repay"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-2"
          trigger:
            call: "POST /fhlb/stock-subscriptions/${sub_activity}/repurchase"
            payload: {}
            as: CreditOfficer
          assert:
            - "checkpoint A (after membership issue): stock_held_cents == 9600000, required_membership_stock_cents == 9600000, required_activity_stock_cents == 0, required_total_stock_cents == 9600000, stock_deficiency_cents == 0, excess_stock_cents == 0"
            - "checkpoint B (after funding): the minted ACTIVITY subscription has amount_cents == 50000, status \"ISSUED\" and advance_id == the advance; stock_held_cents == 9650000, required_activity_stock_cents == 50000, required_total_stock_cents == 9650000, deficiency 0, excess 0"
            - "checkpoint C (after repay): Advance.credit_status == \"REPAID\", collateral_status == \"RELEASED\", outstanding_principal_cents == 0; the ACTIVITY subscription is \"REDEMPTION_REQUESTED\"; stock_held_cents is STILL 9650000 because REDEMPTION_REQUESTED counts as held, required_activity_stock_cents == 0, required_total_stock_cents == 9600000, excess_stock_cents == 50000, deficiency 0"
            - "checkpoint D (after the trigger): the ACTIVITY subscription is \"REPURCHASED\", stock_held_cents == 9600000 exactly, required_total_stock_cents == 9600000, excess_stock_cents == 0 and stock_deficiency_cents == 0 — the ledger is back to its checkpoint-A value with zero drift"
            - "the invariant holds at all four checkpoints: stock_held_cents equals the sum of amount_cents over subscriptions in ISSUED or REDEMPTION_REQUESTED (9600000, 9650000, 9650000, 9600000)"
            - "the repurchase sits exactly on its guard: 9650000 - 50000 == 9600000 == required_total_stock_cents, so it is permitted; repurchasing the MEMBERSHIP subscription instead would leave 50000 < 9600000 and must fail with ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT"

      - name: community_subsidy_pool_conservation_across_commit_and_release
        conserved_quantity: "CommunityProgramAllocation.total_pool_cents == remaining_cents + committed_cents, and committed_cents == the sum of the three bucket_committed_* fields, with each bucket_committed never exceeding its bucket_capacity"
        grounds:
          - "calculations.setaside_bucket_capacities (3500 / 2500 / 4000 with the residual on GENERAL)"
          - "calculations.setaside_waterfall_commit (purpose bucket first, spill to GENERAL only; release reverses spill-first)"
          - "state_machines.Advance CREDIT_APPROVED -> CANCELLED_FOR_COLLATERAL (releases the committed subsidy)"
        distinguishing_aspect: |
          The conserved quantity is a SUBSIDY POOL partitioned into three named buckets, so
          conservation must hold both in total AND per bucket, and the compensation is an
          involuntary release cascade whose ORDER matters (the GENERAL spill must be returned
          before the purpose-bucket take). Instance 1 conserves a single unpartitioned
          capital ledger through an operator-initiated repurchase; there is no partition, no
          spill and no ordering question there.
        test_recipe:
          setup: |
            Harbor Savings tier 1, THRIFT, community_lending_eligible true, with A1
            SF_MORTGAGE (lendable 15,600,000) and A3 HELOC (lendable 500,000), so lendable
            is 16,100,000. Allocation CIP 2026 with total_pool_cents 400,000 at 75 bps:
            capacities 140,000 FIRST_TIME_HOMEBUYER, 100,000 REHABILITATION, 160,000
            GENERAL. Activity stock of 710,000 is pre-purchased so nothing is stock-blocked.
            Advance E (community product, gross 1,500,000, subsidy 300,000, bucket
            FIRST_TIME_HOMEBUYER) is approved: 140,000 fills the purpose bucket and the
            160,000 remainder spills to GENERAL. Advance F (gross 1,000,000, subsidy
            100,000, bucket REHABILITATION) is approved: 100,000 fills REHABILITATION,
            remaining_cents hits 0 and the allocation CLOSES. Advance D (gross 13,000,000,
            term 360) is then funded, leaving capacity 16,100,000 - 13,000,000 - 2,500,000 =
            600,000. The trigger is a custodian documentation exception on A1.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "ACTIVITY", amount_cents: 710000 }
              as: CreditOfficer
              captures: { sub_activity: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_activity}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_heloc: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_heloc}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "CIP-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "NONE", activity_stock_pct_bps: 450, min_principal_cents: 500000, community_program_flag: true }
              as: SystemAdmin
              captures: { product_community: "$.data.id" }
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_plain: "$.data.id" }
            - call: "POST /fhlb/community-program-allocations"
              payload: { program_code: "CIP", fiscal_year: 2026, total_pool_cents: 400000, subsidy_rate_bps: 75 }
              as: CommunityLendingManager
              captures: { allocation_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_community}", term_days: 360, requested_net_proceeds_cents: 1500000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: false, community_program_allocation_id: "${allocation_id}", community_bucket: "FIRST_TIME_HOMEBUYER", requested_subsidy_cents: 300000 }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_e: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_e}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_b: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_community}", term_days: 360, requested_net_proceeds_cents: 1000000, expected_member_bank_version: "${ver_b}", fund_stock_from_advance: false, community_program_allocation_id: "${allocation_id}", community_bucket: "REHABILITATION", requested_subsidy_cents: 100000 }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_f: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_f}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_c: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_plain}", term_days: 360, requested_net_proceeds_cents: 13000000, expected_member_bank_version: "${ver_c}", fund_stock_from_advance: false }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_d: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_d}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /fhlb/advances/${advance_d}/fund"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-2"
          trigger:
            call: "PATCH /fhlb/collateral-assets/${asset_sf}/documentation"
            payload: { documentation_status: "EXCEPTION" }
            as: CollateralCustodian
          assert:
            - "before the trigger the allocation is fully committed: bucket_capacity_first_time_cents == 140000, bucket_capacity_rehabilitation_cents == 100000, bucket_capacity_general_cents == 160000; bucket_committed_first_time_cents == 140000, bucket_committed_rehabilitation_cents == 100000, bucket_committed_general_cents == 160000; committed_cents == 400000, remaining_cents == 0, status == \"CLOSED\""
            - "before the trigger MemberBank.borrowing_capacity_cents == 600000 (16100000 - 13000000 outstanding - 2500000 committed) and collateral_posture == \"RESTRICTED\" (600000 is below the 5% buffer on 13000000, which is 650000)"
            - "the trigger moves the SF_MORTGAGE asset to \"UNDER_REVIEW\" with lendable_value_cents == 0, so MemberBank.lendable_collateral_value_cents == 500000 and the capacity at that instant is -15000000, which forces collateral_posture \"FROZEN\", shortfall_status \"OPEN\", shortfall_required_cure_cents == 15260000 (15000000 + 2% of 13000000) and shortfall_cure_deadline == \"2026-08-06T00:00:00Z\""
            - "advance D keeps credit_status \"FUNDED\" and moves collateral_status to \"SHORTFALL\"; advances E and F both move to credit_status \"CANCELLED_FOR_COLLATERAL\""
            - "the compensation restores every bucket exactly: bucket_committed_first_time_cents == 0, bucket_committed_rehabilitation_cents == 0, bucket_committed_general_cents == 0, committed_cents == 0, remaining_cents == 400000, status back to \"OPEN\"; the capacities are untouched at 140000 / 100000 / 160000"
            - "conservation holds at both checkpoints: total_pool_cents == remaining_cents + committed_cents (400000 == 0 + 400000 before, 400000 == 400000 + 0 after) and committed_cents equals the sum of the three bucket_committed fields"
            - "release order matters: E's 160000 GENERAL spill must be returned before its 140000 purpose take, otherwise a naive implementation that credits the purpose bucket first would leave bucket_committed_general_cents at 160000 and remaining_cents at 240000"
            - "after the cancellations MemberBank.committed_advances_cents == 0, required_activity_stock_cents == 590000, required_total_stock_cents == 10190000, stock_held_cents == 10310000 and excess_stock_cents == 120000"
