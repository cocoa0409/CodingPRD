scaffold_corner_design:
  - section: entities
    instances:
      - name: artwork_creation_applies_declared_defaults_and_success_envelope
        claim_type: creation
        grounds:
          - response_envelope.success
          - entities.Artwork
          - entities.Site.fields.installed_units_used
        distinguishing_aspect: "Creating an artwork with recognized_stature omitted must return 201 in the declared success envelope with version 1, both status dimensions at their initial values, every computed field at its declared default, and the site footprint counter already advanced."
        test_recipe:
          setup:
            - "logical clock pinned to 2026-08-01T00:00:00Z"
            - "one living artist with no waiver and one URBAN site with capacity_units 20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
          assert:
            - "response status is 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "data.id is a bare UUID with no type prefix and data.version == 1"
            - "Artwork.${artwork_id}.recognized_stature == false (declared default)"
            - "Artwork.${artwork_id}.custody_status == ON_VIEW and conservation_status == MONITORED"
            - "Artwork.${artwork_id}.condition_index is null, treatment_priority_score is null, treatment_priority_rank is null, priority_basis == NONE"
            - "Artwork.${artwork_id}.moral_rights_status == ACTIVE, open_notice_count == 0, maintenance_applications_ytd == 0, next_maintenance_due_on is null"
            - "Site.${site_id}.installed_units_used == 6 and concurrent_work_capacity == 1 (declared default)"

      - name: artwork_listing_filters_and_paginates_with_totals
        claim_type: listing
        grounds:
          - endpoints["GET /public-art/artworks"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three works at one site, two BRONZE and one STONE: a material_class filter with limit 1 reports total_count 2 and has_more true against the filtered set, and the unfiltered second page reports total_count 3 with has_more false."
        test_recipe:
          setup:
            - "one artist, one URBAN site with capacity_units 20, three artworks of footprint 6 created in a fixed order"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Bronze One", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { work_1: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.002", title: "Bronze Two", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "STANDARD", footprint_units: 6, insured_value_cents: 8000000, acquisition_date: "2016-05-01", acquisition_document_ref: "DEED-2016-002" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { work_2: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.003", title: "Granite Bench", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "STONE", significance_tier: "STANDARD", footprint_units: 6, insured_value_cents: 4000000, acquisition_date: "2018-03-01", acquisition_document_ref: "DEED-2018-003" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { work_3: $.data.id }
          trigger:
            - call: "GET /public-art/artworks"
              payload: { material_class: "BRONZE", limit: 1, offset: 0 }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "GET /public-art/artworks"
              payload: { limit: 2, offset: 2 }
              as: PublicArtManager
              as_user_id: "mgr-1"
          assert:
            - "the first trigger call returns response_type == array with limit 1, offset 0, total_count 2, has_more true and exactly one row whose material_class == BRONZE"
            - "the second trigger call returns limit 2, offset 2, total_count 3, has_more false and exactly one row"
            - "GET /public-art/artworks with no pagination arguments returns limit 10 and offset 0"

      - name: unresolved_path_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_ARTWORK_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
        distinguishing_aspect: "Every templated path must resolve its id before anything else and must return its own entity's 404 code, not a generic one; fourteen reads against the same non-existent UUID must produce fourteen distinct error_id values."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /public-art/artists/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_artist: $.data.error_id }
            - call: "GET /public-art/sites/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_site: $.data.error_id }
            - call: "GET /public-art/artworks/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_artwork: $.data.error_id }
            - call: "GET /public-art/maintenance-protocols/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_protocol: $.data.error_id }
            - call: "GET /public-art/maintenance-visits/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_visit: $.data.error_id }
            - call: "GET /public-art/condition-assessments/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_assessment: $.data.error_id }
            - call: "GET /public-art/conservators/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_conservator: $.data.error_id }
            - call: "GET /public-art/treatment-proposals/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_proposal: $.data.error_id }
            - call: "GET /public-art/artist-consultations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_consultation: $.data.error_id }
            - call: "GET /public-art/moral-rights-notices/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_notice: $.data.error_id }
            - call: "GET /public-art/deaccession-cases/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_case: $.data.error_id }
            - call: "GET /public-art/funding-pools/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_pool: $.data.error_id }
            - call: "GET /public-art/funding-allocations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_allocation: $.data.error_id }
            - call: "GET /public-art/damage-incidents/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_incident: $.data.error_id }
          assert:
            - "every trigger call returns 404 with response_type == error"
            - "the captured error_id values are, in call order, ERR_ARTIST_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_ARTWORK_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CONSERVATOR_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_CONSULTATION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_INCIDENT_NOT_FOUND"
            - "each error body carries data.error_id and data.message and no data payload row"

      - name: body_foreign_keys_that_do_not_resolve_are_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - complexity_profile.entity_topology
          - errors[ERR_POOL_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so referential integrity lives entirely in body foreign keys: each of the eight write endpoints below carries exactly one dangling reference alongside otherwise valid data and must answer with the referenced entity's own 404 code before any business rule runs."
        test_recipe:
          setup:
            - "one artist, one URBAN site, one BRONZE artwork of footprint 6, one BRONZE conservator, one DRAFT ConditionAssessment, one WASH protocol, one SCHEDULED visit and one ENDOWMENT pool"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id, aw_v: $.data.version }
            - call: "POST /public-art/conservators"
              payload: { firm_name: "Patina Studio", accreditation: "AIC_PA", material_specialties: ["BRONZE"], hourly_rate_cents: 14500, insurance_expires_on: "2027-01-31" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-08-01", surface_score: 2, structural_score: 2, coating_score: 1, mount_score: 1, graffiti_score: 1 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { assess_id: $.data.id }
            - call: "POST /public-art/maintenance-protocols"
              payload: { protocol_code: "WASH-BR", material_class: "BRONZE", method: "WASH", cycle_days: 180 }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { protocol_id: $.data.id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${protocol_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_id: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-2026", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 450 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_id: $.data.id, pool_v: $.data.version }
          trigger:
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.900", title: "Dangling Artist", artist_id: "00000000-0000-4000-8000-0000000000ff", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "STANDARD", footprint_units: 1, insured_value_cents: 1000, acquisition_date: "2020-01-01", acquisition_document_ref: "DEED-X" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e_artist: $.data.error_id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.901", title: "Dangling Site", artist_id: "${artist_id}", site_id: "00000000-0000-4000-8000-0000000000ff", material_class: "BRONZE", significance_tier: "STANDARD", footprint_units: 1, insured_value_cents: 1000, acquisition_date: "2020-01-01", acquisition_document_ref: "DEED-X" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e_site: $.data.error_id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "00000000-0000-4000-8000-0000000000ff", cycle_year: 2026, assessed_on: "2026-08-01", surface_score: 1, structural_score: 1, coating_score: 1, mount_score: 1, graffiti_score: 1 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { e_artwork: $.data.error_id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "00000000-0000-4000-8000-0000000000ff", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-21T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { e_protocol: $.data.error_id }
            - call: "POST /public-art/treatment-proposals"
              payload: { artwork_id: "${artwork_id}", conservator_id: "00000000-0000-4000-8000-0000000000ff", assessment_id: "${assess_id}", treatment_scope: "COATING", engagement_start: "2026-09-01T00:00:00Z", engagement_end: "2026-09-05T00:00:00Z", expected_artwork_version: "${aw_v}" }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { e_conservator: $.data.error_id }
            - call: "POST /public-art/treatment-proposals"
              payload: { artwork_id: "${artwork_id}", conservator_id: "${cons_id}", assessment_id: "00000000-0000-4000-8000-0000000000ff", treatment_scope: "COATING", engagement_start: "2026-09-01T00:00:00Z", engagement_end: "2026-09-05T00:00:00Z", expected_artwork_version: "${aw_v}" }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { e_assessment: $.data.error_id }
            - call: "POST /public-art/damage-incidents"
              payload: { artwork_id: "${artwork_id}", incident_type: "GRAFFITI", damage_extent_pct: 0.10, narrative: "tagged base", linked_proposal_id: "00000000-0000-4000-8000-0000000000ff" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e_proposal: $.data.error_id }
            - call: "POST /public-art/funding-allocations"
              payload: { pool_id: "00000000-0000-4000-8000-0000000000ff", purpose: "MAINTENANCE", amount_cents: 1000, expected_pool_version: "${pool_v}", visit_id: "${visit_id}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { e_pool: $.data.error_id }
            - call: "POST /public-art/funding-allocations"
              payload: { pool_id: "${pool_id}", purpose: "MAINTENANCE", amount_cents: 1000, expected_pool_version: "${pool_v}", visit_id: "00000000-0000-4000-8000-0000000000ff" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { e_visit: $.data.error_id }
          assert:
            - "the captured error_id values are, in call order, ERR_ARTIST_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_ARTWORK_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_CONSERVATOR_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_VISIT_NOT_FOUND"
            - "every trigger call returns 404 and persists nothing: GET /public-art/artworks reports total_count 1"
            - "FundingPool.${pool_id}.version and available_cents are unchanged, so the dangling-FK check ran before the version check"

      - name: missing_required_fields_are_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /public-art/artists"]
        distinguishing_aspect: "Each input field declared without a default is mandatory: omitting full_name, capacity_units, insured_value_cents, graffiti_score or supplying an empty criteria array must each return 400 ERR_INVALID_REQUEST and persist nothing."
        test_recipe:
          setup:
            - "one artist and one URBAN site so the artwork attempt fails only on the omitted field"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
          trigger:
            - call: "POST /public-art/artists"
              payload: { is_living: true, contact_email: "nobody@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e1: $.data.error_id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-2", name: "Second Plaza", address_ref: "2 Civic Center", exposure_class: "PARK" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e2: $.data.error_id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-08-01", surface_score: 2, structural_score: 2, coating_score: 1, mount_score: 1 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { e3: $.data.error_id }
            - call: "POST /public-art/deaccession-cases"
              payload: { artwork_id: "${artwork_id}", criteria: [], disposition: "SALE", disposition_target_ref: "Auction House" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e4: $.data.error_id }
          assert:
            - "all four trigger calls return 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /public-art/artists reports total_count 1 and GET /public-art/sites reports total_count 1"
            - "GET /public-art/condition-assessments?artwork_id=${artwork_id} returns an empty list"
            - "GET /public-art/deaccession-cases?artwork_id=${artwork_id} returns an empty list"

      - name: system_and_computed_fields_supplied_by_the_client_are_rejected
        claim_type: system_fields
        grounds:
          - validations[priority=4]
          - entities.Artwork.fields.condition_index
          - entities.Site.fields.installed_units_used
        distinguishing_aspect: "condition_index, installed_units_used, photo_count, id and version are server-owned; supplying any of them is an unknown input field for the endpoint's schema and must be refused with 400 rather than silently ignored."
        test_recipe:
          setup:
            - "one artist, one URBAN site and one BRONZE artwork"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
          trigger:
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.902", title: "Injected Index", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "STANDARD", footprint_units: 1, insured_value_cents: 1000, acquisition_date: "2020-01-01", acquisition_document_ref: "DEED-X", condition_index: 95.0 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e1: $.data.error_id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-3", name: "Third Plaza", address_ref: "3 Civic Center", exposure_class: "PARK", capacity_units: 10, installed_units_used: 5 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { e2: $.data.error_id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-08-01", surface_score: 2, structural_score: 2, coating_score: 1, mount_score: 1, graffiti_score: 1, photo_count: 5 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { e3: $.data.error_id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-X", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 1000000, draw_rate_bps: 450, available_cents: 999999 }
              as: FinanceOfficer
