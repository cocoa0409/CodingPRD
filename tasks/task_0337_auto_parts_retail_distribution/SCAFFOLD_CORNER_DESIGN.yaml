              as: InventoryManager
              captures: { xr: $.data.id }
          trigger:
            - call: "GET /cross-references?part_id=${oe}"
              as: CounterClerk
          assert:
            - "response array contains the cross-reference ${xr} with interchange_part_id == ${am}"

      - name: ep_fitment_part_not_found_on_create
        claim_type: Cross-reference link
        grounds: ["endpoints", "entities.Fitment.fields.part_id", "errors[ERR_PART_NOT_FOUND]"]
