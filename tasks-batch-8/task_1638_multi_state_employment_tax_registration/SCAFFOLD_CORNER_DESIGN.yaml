  # --------------------------------------------- cross_cutting_layers ---
  - section: cross_cutting_layers
    instances:
      - name: occ_registration_create_stale_employer
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[registration-create-stale-employer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential creates carrying the same observed Employer.version: the first succeeds and advances the version; the second (different agency, so no uniqueness conflict) is rejected purely as stale."
        test_recipe:
          setup: ["Employer (version 1 captured); OR-WH and NJ-WH agencies"]
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "NJ", agency_name: "NJ Div Tax", withholding_rate_bp: 600 }, as: TaxDirector, captures: { ag_nj_wh: $.data.id } }
          trigger:
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_nj_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "First create succeeds (${reg_or} exists) and increments Employer.version to 2"
            - "Second create with the same observed version: error_id == ERR_STALE_VERSION (http 412)"

      - name: occ_election_create_stale_employee
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-create-stale-employee]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The second election create carries the pre-first-create Employee.version: rejected with 412 before the overlap/constraint checks would even run."
        test_recipe:
          setup: ["NJ location; employee (resident PA, working NJ) with version captured at creation"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-7001", full_name: "BI One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-08-01T00:00:00Z", expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { el_a: $.data.id } }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_id}", election_type: "RECIPROCITY_EXEMPTION", work_state_code: "NJ", effective_from: "2026-08-01T00:00:00Z", supersede_existing: true, expected_employee_version: "${e_v}" }, as: Employee, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "First election created (${el_a}); Employee.version advanced to 2"
            - "Second create with stale version: error_id == ERR_STALE_VERSION (OCC, priority 7, precedes the overlap constraint)"

      - name: occ_assignment_override_stale_employee
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-override-stale-employee]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential manual overrides on the same employee: the second reusing the creation-time version is stale."
        test_recipe:
          setup: ["OR location; employee with version captured at creation"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-7002", full_name: "BJ One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "POST /etax/local-assignments/override", payload: { employee_id: "${e_id}", work_location_id: "${wl_or}", effective_from: "2026-08-15T00:00:00Z", override_reason: "Audit correction", expected_employee_version: "${e_v}" }, as: TaxDirector, captures: { ovr1: $.data.id, src1: $.data.resolution_source } }
            - { call: "POST /etax/local-assignments/override", payload: { employee_id: "${e_id}", work_location_id: "${wl_or}", effective_from: "2026-09-01T00:00:00Z", override_reason: "Second correction", expected_employee_version: "${e_v}" }, as: TaxDirector, captures: { err: $.data.error_id } }
          assert:
            - "First override succeeds (resolution_source == MANUAL_OVERRIDE) and increments Employee.version"
            - "Second override with stale version: error_id == ERR_STALE_VERSION"

      - name: occ_uirate_create_stale_registration
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[uirate-create-stale-registration]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Corrected-rate supersede is legitimate only with a fresh Registration.version; reusing the activation-time version on the second rate intake is rejected."
        test_recipe:
          setup: ["PA-UI registration ACTIVE; registration version captured from the activate response"]
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
