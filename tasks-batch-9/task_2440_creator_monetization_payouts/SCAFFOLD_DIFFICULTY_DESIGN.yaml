            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${ads_id}", content_item_id: "${ci_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${ads_id}", content_item_id: "${ci_id}", gross_amount_cents: 5000, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
              captures: { ev2_id: "$.data.id" }
            - call: "POST /monetization/content-items/${ci_id}/rate"
              payload: { suitability_rating: "RED", rating_source: "MANUAL", note: "Depicts unsafe stunts." }
              as: PolicyReviewer
