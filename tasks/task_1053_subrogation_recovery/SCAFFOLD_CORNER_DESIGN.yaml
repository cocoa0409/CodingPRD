# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage index)
# Subrogation & Recovery Vendor. Walks references/claim-extraction-guide.md
# section-by-section against §1.1–§1.7. Stubs (excluded_because) cite a §1.8
# instance by name; live corners carry a full test_recipe.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: carrier_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Carrier, endpoints]
        distinguishing_aspect: "POST /subro/carriers with all required fields returns 201 and echoes name, naic_code, commission_rate_bps, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { cid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response http status == 201"
            - "Carrier.${cid}.status == ACTIVE"
            - "Carrier.${cid}.version == 1"

      - name: claim_create_missing_paid_loss_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Claim.fields.paid_loss_cents, "validations[priority=5]"]
        distinguishing_aspect: "Omitting the required paid_loss_cents on POST /subro/claims returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["ACTIVE carrier + adverse party exist"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv X", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-M", loss_date: "2026-05-01T00:00:00Z", deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_claim_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "validations[priority=3]"]
        distinguishing_aspect: "GET /subro/claims/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /subro/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              as_user_id: "reader-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: carrier_commission_basis_defaults_net
        claim_type: Defaults
        grounds: [entities.Carrier.fields.commission_basis]
        distinguishing_aspect: "Omitting commission_basis on carrier create applies the default NET."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /subro/carriers"
              payload: { name: "Default Ins", naic_code: "99999", commission_rate_bps: 2000 }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { cid: $.data.id, basis: $.data.commission_basis }
          assert:
            - "Carrier.${cid}.commission_basis == NET"

      - name: claim_ledger_fields_default_zero_on_referral
        claim_type: Computed Fields
        grounds: [entities.Claim.fields.final_recovered_cents, entities.Claim.fields.deductible_reimbursed_cents, entities.Claim.fields.accrued_commission_cents]
        distinguishing_aspect: "A freshly referred claim reports final_recovered_cents, deductible_reimbursed_cents, carrier_recovered_cents, accrued_commission_cents all == 0 and status REFERRED."
        test_recipe:
          setup: ["ACTIVE carrier + adverse party exist"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv Y", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-Z", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id, st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == REFERRED"
            - "Claim.${claim_id}.final_recovered_cents == 0"
            - "Claim.${claim_id}.accrued_commission_cents == 0"

      - name: assess_liability_pct_above_100_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Claim.fields.liability_pct, "validations[priority=5]"]
        distinguishing_aspect: "assess-liability with liability_pct 150 (outside 0..100) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Claim referred (REFERRED)"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv W", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-T", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 150 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: claim_document_append_only_created
        claim_type: Immutability
        grounds: [entities.ClaimDocument, endpoints]
        distinguishing_aspect: "ClaimDocument is common_fields:false (append-only): POST returns 201 with id + created_at only, no version field, and is retrievable via the claim's documents sub-resource."
        test_recipe:
          setup: ["Claim referred"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv D", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-DOC", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /subro/claims/${claim_id}/documents"
              payload: { doc_type: "POLICE_REPORT", title: "Report 1", uri: "s3://x/1" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { doc_id: $.data.id }
          assert:
            - "response http status == 201"
            - "GET /subro/claims/${claim_id}/documents returns exactly 1 item with id == ${doc_id}"

      - name: claim_create_unknown_adverse_party_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Claim.fields.adverse_party_id, "validations[priority=3]"]
        distinguishing_aspect: "POST /subro/claims with an adverse_party_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["ACTIVE carrier exists"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "00000000-0000-4000-8000-000000000abc", claim_reference: "CLM-NF", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 404"
            - "data.error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: claim_initial_state_is_referred
        claim_type: Initial State
        grounds: [state_machines.Claim, entities.Claim.fields.status]
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_recoverable_provisional_vs_final
          rationale: "The referral -> LIABILITY_ASSESSED chain in that §1.8 instance already asserts the claim begins in REFERRED before assess-liability."

      - name: assess_liability_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.REFERRED_to_LIABILITY_ASSESSED, "validations[priority=7]"]
        distinguishing_aspect: "A second assess-liability on a claim already LIABILITY_ASSESSED returns ERR_INVALID_STATE (no valid REFERRED->LIABILITY_ASSESSED from LIABILITY_ASSESSED)."
        test_recipe:
          setup: ["Claim assessed (LIABILITY_ASSESSED)"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv S", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-S", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 60 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: withdraw_already_withdrawn_claim_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim.REFERRED_to_WITHDRAWN, "validations[priority=7]"]
        distinguishing_aspect: "Withdrawing a claim already in terminal WITHDRAWN returns ERR_INVALID_STATE (no transition out of a terminal state)."
        test_recipe:
          setup: ["Claim withdrawn (WITHDRAWN)"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv Q", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-WD", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/withdraw"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /subro/claims/${claim_id}/withdraw"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: clear_already_cleared_payment_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.RecoveryPayment.RECEIVED_to_CLEARED, "validations[priority=7]"]
        distinguishing_aspect: "Clearing a RecoveryPayment already CLEARED returns ERR_INVALID_STATE (clear is not idempotent; the second call is rejected)."
        test_recipe:
          setup: ["Claim SETTLED at 3000000; payment 3000000 already CLEARED"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv I", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-IDEM", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 3000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
            - call: "POST /subro/settlements/${settlement_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-2"
            - call: "POST /subro/settlements/${settlement_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
            - call: "POST /subro/claims/${claim_id}/recovery-payments"
              payload: { amount_cents: 3000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay_id: $.data.id }
            - call: "POST /subro/recovery-payments/${pay_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          trigger:
            - call: "POST /subro/recovery-payments/${pay_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: demand_record_response_honored_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Demand.ISSUED_to_HONORED]
        distinguishing_aspect: "Recording outcome HONORED on an ISSUED demand within its window moves the demand to HONORED and sets outcome."
        test_recipe:
          setup: ["Claim in DEMAND_ISSUED with an ISSUED demand"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv H", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-HON", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { demand_id: $.data.id }
          trigger:
            - call: "POST /subro/demands/${demand_id}/record-response"
              payload: { outcome: "HONORED" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { st: $.data.status }
          assert:
            - "Demand.${demand_id}.status == HONORED"
            - "Demand.${demand_id}.outcome == HONORED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: recoverable_three_way_min_covered
        claim_type: Correct Result
        grounds: [calculations.claim_recoverable]
        excluded_because:
          difficulty_instance: combinatorial_formula / recoverable_three_way_min_policy_binds
          rationale: "Nested three-way min result is pinned as a literal in that §1.8 instance."

      - name: waterfall_full_split_covered
        claim_type: Correct Result
        grounds: [calculations.recovery_waterfall_allocation]
        excluded_because:
          difficulty_instance: compensating_invariant / payment_allocation_sum_conserved
          rationale: "Full deductible/commission/carrier split and its sum are asserted as literals there."

      - name: statement_total_round_order_covered
        claim_type: Correct Result
        grounds: [calculations.statement_commission_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / commission_statement_round_per_line_then_sum
          rationale: "Per-line-then-sum total is pinned as a literal there."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: sod_approver_equals_proposer_returns_error
        claim_type: Violation to Error
        grounds: ["validations[priority=6]", state_machines.Settlement.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Approving with the same X-User-ID that proposed the settlement returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Claim in DEMAND_ISSUED with a PROPOSED settlement (1000000) proposed by user spec-1"]
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv SoD", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-SOD", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
          trigger:
            - call: "POST /subro/settlements/${settlement_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 403"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: priority_state_over_fiscal_covered
        claim_type: Priority Ordering
        grounds: ["validations[priority=7]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_settlement_approve
          rationale: "The state-vs-fiscal precedence on approve is the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_claims_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
