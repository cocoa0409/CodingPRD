  - rule_id: transitive_cascade
    instances:
      - name: order_confirm_three_hop_cascade
        grounds:
          - state_machines.CookieOrder.SUBMITTED_to_CONFIRMED
          - calculations.season_remaining_units
          - calculations.forecast_attainment_pct
          - state_machines.CookieSeason.OPEN_to_SELLING
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /orders/{id}/confirm: (1) confirm
          swaps pending->initial commitment on CookieSeason AND posts charge +
          proceeds to TroopAccount; (2) the season commitment change recomputes
          forecast_attainment_pct; (3) attainment crossing 80.00 auto-flips
          season OPEN->SELLING; each hop caused by the previous one. Observable:
          order CONFIRMED -> season fields recomputed -> season.status SELLING.
        test_recipe:
          setup:
            - "Season OPEN; purchased 100; troop T1 with one SUBMITTED order of 80 units (confirming pushes attainment to exactly 80.00)"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2033", name: "S33", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
