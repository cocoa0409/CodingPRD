      - name: record_delivery_cascades_event_status_to_delivery_mode_to_draft_snapshot_rates_to_or_bed_turnover
        grounds:
          - state_machines.EmergencyCesareanEvent.INCISION_RECORDED_to_DELIVERED
          - state_machines.EmergencyCesareanEvent.DELIVERED_to_REVIEW_PENDING
          - state_machines.Bed.OCCUPIED_to_TURNOVER
          - calculations.quality_measure_rates
          - calculations.decision_to_incision_measurement
          - calculations.unit_posture_derivation
          - endpoints[POST /emergency-cesareans/{eventId}/record-delivery]
        distinguishing_aspect: |
          A single /record-delivery call reaches a DRAFT snapshot that the caller
          never names, through three strictly ordered hops that only the previous
          hop enables:
            hop 1  the event moves INCISION_RECORDED -> DELIVERED and then, in
                   the SAME request, DELIVERED -> REVIEW_PENDING, because
                   met_target is false (34 measured minutes against the
                   CATEGORY_2_URGENT target of 30) — a CATEGORY_2_URGENT event
                   that HAD met target would instead land on CLOSED in one call,
                   so the branch is decided by a number computed one call
                   earlier, not by anything in this payload;
            hop 2  only because hop 1 succeeded, the ENCOUNTER (a different
                   entity, untouched by the payload) receives
                   delivery_mode := CESAREAN_PRIMARY — chosen by the server from
                   prior_cesarean == false, never by the caller — plus
                   delivery_recorded_at := delivery_at and review_required := true;
            hop 3  only because hop 2 stamped delivery_recorded_at does the
                   encounter fall inside the half-open [2026-09-01, 2026-10-01)
                   window of the pre-existing DRAFT snapshot, which is
                   recomputed IN PLACE: ntsv_cesarean_denominator 0 -> 1,
                   numerator 0 -> 1, ntsv_cesarean_rate_pct null -> 100.0000,
                   while episiotomy_denominator stays 0 so episiotomy_rate_pct
                   stays null and composite_quality_index stays null (a null
                   component nulls the composite — it is NOT treated as 0.0);
            hop 4  the OR bed leaves OCCUPIED for TURNOVER with
                   turnover_clear_at := clock_now + the unit's CURRENT
                   turnover_buffer_minutes, which is 75 rather than 45 because
                   the earlier mobilize-team set one_to_one_required and pushed
                   coverage_deficit_units to 4.0 and the posture to
                   INDUCTION_FROZEN.
          Implementations fail this by closing a missed-target CATEGORY_2_URGENT
          event, by asking the caller for delivery_mode, by leaving the DRAFT
          snapshot stale until someone re-POSTs it, by emitting 0.0 instead of
          null for the empty episiotomy denominator, or by clearing the OR bed
          with the 45-minute OPEN buffer.
