              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
