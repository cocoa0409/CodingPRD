        claim_type: correct_result
        grounds:
          - calculations.loan_maximum_amount
        distinguishing_aspect: "After fully repaying a 2,000,000c loan within the trailing 12 months, current outstanding is 0 but the high-water mark is 2,000,000c, so the IRC cap shrinks to 5,000,000 - 2,000,000 = 3,000,000c and binds below the vested component (10,000,000c) and plan cap (5,000,000c)."
        test_recipe:
          setup:
            - "Plan with max_loan_amount_cents 5,000,000 (default); participant vested 20,000,000c"
            - "Loan 2,000,000c / 12mo disbursed 2026-05-01, then fully repaid by one 2,054,580c remittance on 2026-05-15 (loan REPAID inside the 12-month lookback)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan HighWater" }, as: RecordkeeperAdmin, captures: { pl_hw: "$.data.id" } }
            - { call: "POST /plans/${pl_hw}/participants", payload: { full_name: "High Heidi", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_hw: "$.data.id" } }
            - { call: "POST /participants/${p_hw}/loans", payload: { principal_amount_cents: 2000000, term_months: 12 }, as: Participant, as_user_id: "${p_hw}", captures: { loan_hw: "$.data.id" } }
            - { call: "GET /loans/${loan_hw}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { hw_t1: "$.data[0].id", hw_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${hw_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${hw_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_hw}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_hw}/remittances", payload: { amount_cents: 2054580, pay_date: "2026-05-15T00:00:00Z" }, as: PayrollProvider }
          trigger:
            - { call: "GET /participants/${p_hw}/loan-eligibility", payload: {}, as: RecordkeeperAdmin, captures: { hw_max: "$.data.max_loan_amount_cents", hw_elig: "$.data.eligible" } }
          assert:
            - "captured hw_max == 3000000 (IRC cap reduced by the 2,000,000c trailing-12-month high-water mark)"
            - "captured hw_elig == true"

      - name: hardship_fee_tier_boundary_at_provisional_gross
        claim_type: boundary_edge
        grounds:
          - calculations.hardship_gross_up
        distinguishing_aspect: "NET 800,000c lands provisional gross exactly on the 1,000,000c tier threshold and selects the LOW 5,000c fee (<= is inclusive), while NET 800,001c crosses it and selects the HIGH 7,500c fee — a one-cent input change flips the fee tier."
        test_recipe:
          setup: ["default plan; participants P1/P2 vested 20,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Fee" }, as: RecordkeeperAdmin, captures: { pl_fe: "$.data.id" } }
            - { call: "POST /plans/${pl_fe}/participants", payload: { full_name: "Fee Finn", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_f1: "$.data.id" } }
            - { call: "POST /plans/${pl_fe}/participants", payload: { full_name: "Fee Fiona", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_f2: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_f1}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_f1}", captures: { f1_fee: "$.data.fee_cents", f1_gross: "$.data.gross_withdrawal_cents" } }
            - { call: "POST /participants/${p_f2}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800001, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_f2}", captures: { f2_fee: "$.data.fee_cents", f2_gross: "$.data.gross_withdrawal_cents" } }
          assert:
            - "captured f1_fee == 5000 and f1_gross == 1006250"
            - "captured f2_fee == 7500 and f2_gross == 1009376"

      - name: document_retention_stamp_seven_years_after_payment
        claim_type: correct_result
        grounds:
          - entities.HardshipDocument.fields.retained_until
        distinguishing_aspect: "Documentation retention: uploaded documents carry retained_until null before payment and exactly paid_on + 7 calendar years (2026-05-01 -> 2033-05-01) once the request is PAID."
        test_recipe:
          setup: ["1-step hardship chain plan; participant vested 20,000,000c; hardship 200,000c GROSS with one document; approved"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Ret", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { pl_rt: "$.data.id" } }
            - { call: "POST /plans/${pl_rt}/participants", payload: { full_name: "Ret Rita", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_rt: "$.data.id" } }
            - { call: "POST /participants/${p_rt}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_rt}", captures: { h_rt: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_rt}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 200000 }, as: Participant, as_user_id: "${p_rt}", captures: { rt_doc: "$.data.id", rt_ret_before: "$.data.retained_until" } }
            - { call: "GET /hardship-requests/${h_rt}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { rt_t1: "$.data[0].id" } }
            - { call: "POST /approval-tasks/${rt_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /hardship-requests/${h_rt}/pay", payload: {}, as: RecordkeeperAdmin }
            - { call: "GET /hardship-requests/${h_rt}/documents", payload: {}, as: RecordkeeperAdmin, captures: { rt_ret_after: "$.data[0].retained_until" } }
          assert:
            - "captured rt_ret_before == null"
            - "captured rt_ret_after == 2033-05-01T00:00:00Z (paid_on 2026-05-01 + 7 calendar years)"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails at priority 1 with 401 ERR_UNAUTHENTICATED, before role, existence, or business checks — even for a well-formed body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plans", payload: { name: "NoAuth Plan" }, as: Anonymous, captures: { na_err: "$.data.error_id" } }
          assert:
            - "captured na_err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: loan_below_plan_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_LOAN_BELOW_MINIMUM]
        distinguishing_aspect: "principal 50,000c < default min_loan_amount_cents 100,000c yields ERR_LOAN_BELOW_MINIMUM, a constraint error distinct from the fiscal limit error."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Min" }, as: RecordkeeperAdmin, captures: { pl_mn: "$.data.id" } }
            - { call: "POST /plans/${pl_mn}/participants", payload: { full_name: "Min Manny", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_mn: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_mn}/loans", payload: { principal_amount_cents: 50000, term_months: 12 }, as: Participant, as_user_id: "${p_mn}", captures: { mn_err: "$.data.error_id" } }
          assert:
            - "captured mn_err == ERR_LOAN_BELOW_MINIMUM"

      - name: hardship_amount_above_vested_balance_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_INSUFFICIENT_VESTED_BALANCE]
        distinguishing_aspect: "At hardship create, amount_cents 25,000,000c > vested 20,000,000c fails the fiscal vested-balance gate with ERR_INSUFFICIENT_VESTED_BALANCE before any approval task is created."
        test_recipe:
          setup: ["default plan; participant vested 20,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Vest" }, as: RecordkeeperAdmin, captures: { pl_vs: "$.data.id" } }
            - { call: "POST /plans/${pl_vs}/participants", payload: { full_name: "Vest Vic", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_vs: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_vs}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 25000000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_vs}", captures: { vs_err: "$.data.error_id" } }
          assert:
            - "captured vs_err == ERR_INSUFFICIENT_VESTED_BALANCE"

      - name: hardship_need_cap_exceeded_at_final_approval
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED]
        distinguishing_aspect: "FULL_DOCUMENTATION need cap: documents sum to 799,999c against an 800,000c request — one cent short — so the final APPROVE returns ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED and the request stays UNDER_REVIEW."
        test_recipe:
          setup: ["default plan; participant vested 20,000,000c; hardship 800,000c GROSS with one 799,999c document; step 1 approved"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Need" }, as: RecordkeeperAdmin, captures: { pl_nd: "$.data.id" } }
            - { call: "POST /plans/${pl_nd}/participants", payload: { full_name: "Need Ned", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_nd: "$.data.id" } }
            - { call: "POST /participants/${p_nd}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_nd}", captures: { h_nd: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_nd}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 799999 }, as: Participant, as_user_id: "${p_nd}" }
            - { call: "GET /hardship-requests/${h_nd}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { nd_t1: "$.data[0].id", nd_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${nd_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
          trigger:
            - { call: "POST /approval-tasks/${nd_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01", captures: { nd_err: "$.data.error_id" } }
          assert:
            - "captured nd_err == ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED"
            - "HardshipRequest.${h_nd}.status remains UNDER_REVIEW"

      - name: employment_terminated_blocks_new_loan
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_EMPLOYMENT_NOT_ACTIVE]
        distinguishing_aspect: "A participant with employment_status TERMINATED (and no outstanding loans, so no offset cascade fired) cannot open a new loan: ERR_EMPLOYMENT_NOT_ACTIVE at the constraint priority."
        test_recipe:
          setup: ["default plan; participant enrolled then PATCHed TERMINATED with no loans"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan TermBlk" }, as: RecordkeeperAdmin, captures: { pl_tb: "$.data.id" } }
            - { call: "POST /plans/${pl_tb}/participants", payload: { full_name: "Gone Gus", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_tb: "$.data.id" } }
            - { call: "PATCH /participants/${p_tb}", payload: { employment_status: "TERMINATED" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /participants/${p_tb}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_tb}", captures: { tb_err: "$.data.error_id" } }
          assert:
            - "captured tb_err == ERR_EMPLOYMENT_NOT_ACTIVE"

      - name: refinance_disabled_by_plan_policy
        claim_type: conditional_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_REFINANCE_NOT_ALLOWED]
          - entities.Plan.fields.allows_refinance
        distinguishing_aspect: "Conditional validation: the same refinance call succeeds only when plan.allows_refinance is true; under the default false it fails ERR_REFINANCE_NOT_ALLOWED regardless of loan health (lookback is neutralized via refinance_min_months_since_disbursement=0 so only the flag is under test)."
        test_recipe:
          setup: ["plan with allows_refinance defaulting to false and refinance_min_months_since_disbursement=0; participant vested 10,000,000c; loan 500,000c / 12mo disbursed"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan NoRefi", refinance_min_months_since_disbursement: 0 }, as: RecordkeeperAdmin, captures: { pl_nr: "$.data.id" } }
            - { call: "POST /plans/${pl_nr}/participants", payload: { full_name: "NoRefi Nora", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_nr: "$.data.id" } }
            - { call: "POST /participants/${p_nr}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_nr}", captures: { loan_nr: "$.data.id" } }
            - { call: "GET /loans/${loan_nr}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { nr_t1: "$.data[0].id", nr_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${nr_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${nr_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_nr}/disburse", payload: {}, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /loans/${loan_nr}/refinance", payload: { cash_out_cents: 0 }, as: RecordkeeperAdmin, captures: { nr_err: "$.data.error_id" } }
          assert:
            - "captured nr_err == ERR_REFINANCE_NOT_ALLOWED"
            - "Loan.${loan_nr}.lifecycle_status remains DISBURSED"

      - name: self_certify_plan_requires_attestation_at_approval
        claim_type: conditional_validation
        grounds:
          - validations[priority=9]
          - entities.Plan.fields.substantiation_standard
          - errors[ERR_SUBSTANTIATION_INCOMPLETE]
        distinguishing_aspect: "Conditional validation on plan config: under SELF_CERTIFY no documents are needed, but attestation must be true — a request created without attestation passes creation yet its final APPROVE fails ERR_SUBSTANTIATION_INCOMPLETE, while an identical request with attestation true approves."
        test_recipe:
          setup: ["SELF_CERTIFY plan with 1-step hardship chain; participants P1 (no attestation) and P2 (attestation true), each vested 20,000,000c; both have a 200,000c GROSS MEDICAL request with its single task at PENDING"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan SC", substantiation_standard: "SELF_CERTIFY", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { pl_scf: "$.data.id" } }
            - { call: "POST /plans/${pl_scf}/participants", payload: { full_name: "NoAtt Nate", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_sc1: "$.data.id" } }
            - { call: "POST /plans/${pl_scf}/participants", payload: { full_name: "Att Anna", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_sc2: "$.data.id" } }
            - { call: "POST /participants/${p_sc1}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_sc1}", captures: { h_sc1: "$.data.id" } }
            - { call: "POST /participants/${p_sc2}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS", attestation: true }, as: Participant, as_user_id: "${p_sc2}", captures: { h_sc2: "$.data.id" } }
            - { call: "GET /hardship-requests/${h_sc1}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { sc1_t1: "$.data[0].id" } }
            - { call: "GET /hardship-requests/${h_sc2}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { sc2_t1: "$.data[0].id" } }
          trigger:
            - { call: "POST /approval-tasks/${sc1_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01", captures: { sc1_err: "$.data.error_id" } }
            - { call: "POST /approval-tasks/${sc2_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01", captures: { sc2_task: "$.data.status" } }
          assert:
            - "captured sc1_err == ERR_SUBSTANTIATION_INCOMPLETE (attestation missing under SELF_CERTIFY)"
            - "captured sc2_task == APPROVED and HardshipRequest.${h_sc2}.status == APPROVED"

      - name: existence_checked_before_state_on_nested_paths
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: "Priority ordering: POST /loans/{bad-id}/withdraw on a nonexistent loan returns 404 ERR_LOAN_NOT_FOUND, never the 409 state error — existence (priority 5) precedes state (priority 6)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/withdraw", payload: {}, as: Participant, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { xs_err: "$.data.error_id" } }
          assert:
            - "captured xs_err == ERR_LOAN_NOT_FOUND"
            - "HTTP status == 404"

      - name: schema_checked_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: "A schema-invalid body (missing decision field) to a decide call on a nonexistent task returns ERR_INVALID_REQUEST (400), proving schema validation at priority 4 precedes existence at priority 5."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /approval-tasks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: {}, as: PlanSponsor, as_user_id: "sponsor-01", captures: { sx_err: "$.data.error_id" } }
          assert:
            - "captured sx_err == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id, meta.api_request_timestamp, response_type, data; the error body carries data.error_id and data.message with response_type error."
        test_recipe:
          setup: ["one plan"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Env" }, as: RecordkeeperAdmin, captures: { pl_ev: "$.data.id" } }
          trigger:
            - { call: "GET /plans/${pl_ev}", payload: {}, as: RecordkeeperAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "GET /plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RecordkeeperAdmin, captures: { ev_err: "$.data.error_id", ev_msg: "$.data.message" } }
          assert:
            - "success response contains meta.api_request_id, meta.api_request_timestamp, response_type == object, data"
            - "captured ev_err == ERR_PLAN_NOT_FOUND and ev_msg is a non-empty string"
            - "error response has response_type == error"

      - name: list_loans_pagination_defaults_and_fields
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints["GET /participants/{id}/loans"]
        distinguishing_aspect: "Omitting pagination params applies the fixed defaults (limit 10, offset 0); the response includes total_count and has_more, and with 1 loan total_count == 1 and has_more == false."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c with exactly one loan requested"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Page" }, as: RecordkeeperAdmin, captures: { pl_pg: "$.data.id" } }
            - { call: "POST /plans/${pl_pg}/participants", payload: { full_name: "Page Paige", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_pg: "$.data.id" } }
            - { call: "POST /participants/${p_pg}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_pg}", captures: { loan_pg: "$.data.id" } }
          trigger:
            - { call: "GET /participants/${p_pg}/loans", payload: {}, as: RecordkeeperAdmin, captures: { pg_first: "$.data[0].id" } }
          assert:
            - "response data is an array of length 1 and captured pg_first == ${loan_pg}"
            - "response includes total_count == 1 and has_more == false"
            - "default limit 10 and offset 0 are applied (no parameters sent)"

      - name: computed_amortization_schedule_reconciles_to_principal
        claim_type: computed_read
        grounds:
          - endpoints["GET /loans/{id}/installments"]
          - calculations.amortization_schedule
        distinguishing_aspect: "The computed schedule read reconciles: 12 rows exist for a 12-month term, due dates step monthly from 2026-06-01 to 2027-05-01, and the principal portions sum exactly to the 1,000,000c disbursed principal."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Recon" }, as: RecordkeeperAdmin, captures: { pl_rc: "$.data.id" } }
            - { call: "POST /plans/${pl_rc}/participants", payload: { full_name: "Recon Rae", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_rc: "$.data.id" } }
            - { call: "POST /participants/${p_rc}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_rc}", captures: { loan_rc: "$.data.id" } }
            - { call: "GET /loans/${loan_rc}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { rc_t1: "$.data[0].id", rc_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${rc_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${rc_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_rc}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { rc_pmt: "$.data.scheduled_payment_cents" } }
          trigger:
            - { call: "GET /loans/${loan_rc}/installments", payload: { limit: 100 }, as: RecordkeeperAdmin, captures: { rc_d1: "$.data[0].due_date", rc_d12: "$.data[11].due_date", rc_n1: "$.data[0].installment_number", rc_st1: "$.data[0].status" } }
          assert:
            - "captured rc_pmt == 85607"
            - "exactly 12 rows; captured rc_n1 == 1 and rc_st1 == PENDING"
            - "captured rc_d1 == 2026-06-01T00:00:00Z and rc_d12 == 2027-05-01T00:00:00Z"
            - "sum of principal_portion_cents over all 12 rows == 1000000"

      - name: plan_scoped_list_endpoints_return_children
        claim_type: standard_crud
        grounds:
          - endpoints["GET /plans/{id}/loans"]
          - endpoints["GET /plans/{id}/hardship-requests"]
          - endpoints["GET /plans/{id}/approval-tasks"]
        distinguishing_aspect: "Reverse-reachability: children are discoverable from the plan — one loan + one hardship yield exactly 1 loan, 1 hardship request, and 4 approval tasks (2 per subject) under the plan's list endpoints."
        test_recipe:
          setup: ["default plan; participant vested 20,000,000c; one 500,000c loan requested; one 200,000c GROSS hardship created"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Scope" }, as: RecordkeeperAdmin, captures: { pl_sc: "$.data.id" } }
            - { call: "POST /plans/${pl_sc}/participants", payload: { full_name: "Scope Scott", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_sc: "$.data.id" } }
            - { call: "POST /participants/${p_sc}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_sc}", captures: { loan_sc: "$.data.id" } }
            - { call: "POST /participants/${p_sc}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_sc}", captures: { h_sc: "$.data.id" } }
          trigger:
            - { call: "GET /plans/${pl_sc}/loans", payload: {}, as: RecordkeeperAdmin, captures: { sc_loan: "$.data[0].id" } }
            - { call: "GET /plans/${pl_sc}/hardship-requests", payload: {}, as: RecordkeeperAdmin, captures: { sc_h: "$.data[0].id" } }
            - { call: "GET /plans/${pl_sc}/approval-tasks", payload: { limit: 100 }, as: RecordkeeperAdmin }
          assert:
            - "captured sc_loan == ${loan_sc} and captured sc_h == ${h_sc}"
            - "plan approval-tasks list has total_count == 4 (two per subject)"

      - name: clock_default_is_fixed_startup_constant
        claim_type: conditional_action
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "Before any set call the logical clock reads exactly 2026-05-01T00:00:00Z (never wall-clock): a disbursement with no prior clock call anchors installment 1 to 2026-06-01; setting the clock returns the new value."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan fully approved; no clock call made yet"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Clock" }, as: RecordkeeperAdmin, captures: { pl_ck: "$.data.id" } }
            - { call: "POST /plans/${pl_ck}/participants", payload: { full_name: "Clock Cloe", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_ck: "$.data.id" } }
            - { call: "POST /participants/${p_ck}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_ck}", captures: { loan_ck: "$.data.id" } }
            - { call: "GET /loans/${loan_ck}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { ck_t1: "$.data[0].id", ck_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${ck_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${ck_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /loans/${loan_ck}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { ck_disb: "$.data.disbursed_on" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: RecordkeeperAdmin, captures: { ck_now: "$.data.current_utc" } }
          assert:
            - "captured ck_disb == 2026-05-01T00:00:00Z (the fixed startup default, not wall-clock)"
            - "captured ck_now == 2026-08-01T00:00:00Z"

