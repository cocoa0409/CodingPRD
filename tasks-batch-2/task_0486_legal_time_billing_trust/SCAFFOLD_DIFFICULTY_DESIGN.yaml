scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_wip_provisional_vs_final
        grounds:
          - calculations.invoice_total
          - state_machines.Invoice.billing_status=DRAFT_to_billing_status=ISSUED
          - entities.Matter.fields.wip_fees_cents
          - entities.Invoice.fields.fees_subtotal_cents
        distinguishing_aspect: |
          On the MATTER/INVOICE cost domain: GET /firm/matters/{id}/wip-summary returns the
          provisional WIP (80000 fees) with NO line write-downs applied, while finalize pins the
          FINAL invoice fees_subtotal_cents at 60000 after a 20000 line write-down — same captured
          entries, two different numbers.
        test_recipe:
          setup:
            - "BillingCodes L110(TASK), A101(ACTIVITY), E101(EXPENSE) exist."
            - "PARTNER timekeeper standard 50000; client; matter (matter_rate 40000) CONFLICT_CLEARED then OPEN."
            - "Two CAPTURED time entries on the matter: min90 -> 60000, min30 -> 20000; WIP fees 80000."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme v Opposing", matter_rate_cents: 40000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 90, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te1: $.data.id }
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T11:00:00Z", minutes: 30, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te2: $.data.id }
          trigger:
            - call: "GET /firm/matters/${m_id}/wip-summary"
              payload: {}
              as: BillingClerk
              captures: { wip: $.data.wip_fees_cents }
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: { line_write_downs: [ { time_entry_id: "${te2}", amount_cents: 20000 } ] }
              as: BillingClerk
              captures: { fees_final: $.data.fees_subtotal_cents }
          assert:
            - "GET /firm/matters/${m_id}/wip-summary before finalize returns wip_fees_cents == 80000 (provisional, no write-down)"
            - "Invoice.${inv_id}.fees_subtotal_cents == 60000 (final, after 20000 line write-down)"
            - "Invoice.${inv_id}.written_off_cents == 20000"
            - "Invoice.${inv_id}.total_cents == 60000"

      - name: client_ar_provisional_vs_realization_final
        grounds:
          - calculations.ar_realization
          - entities.Client.fields.ar_balance_cents
          - state_machines.Invoice.billing_status=ISSUED_to_billing_status=WRITTEN_OFF
        distinguishing_aspect: |
          On the CLIENT A/R domain (different entity from the invoice-cost dual above): while the
          invoice is ISSUED the provisional ar_balance_cents counts the full 50000 outstanding; once
          WRITTEN_OFF it drops out of A/R (ar_balance 0) yet feeds realization_pct (collected/billed),
          a different conserved quantity than outstanding A/R.
        test_recipe:
          setup:
            - "Client with one OPEN matter; one ISSUED invoice total 50000, unpaid."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "GET /firm/clients/${cl_id}/ar-summary"
              payload: {}
              as: BillingClerk
              captures: { ar_before: $.data.ar_balance_cents }
            - call: "POST /firm/invoices/${inv_id}/write-off"
              payload: { amount_cents: 50000 }
              as: Attorney
            - call: "GET /firm/clients/${cl_id}/ar-summary"
              payload: {}
              as: BillingClerk
              captures: { ar_after: $.data.ar_balance_cents, real_pct: $.data.realization_pct }
          assert:
            - "ar-summary before write-off: ar_balance_cents == 50000 (provisional, invoice ISSUED)"
            - "ar-summary after write-off: ar_balance_cents == 0 (invoice WRITTEN_OFF drops out of A/R)"
            - "ar-summary after write-off: realization_pct == 0.0 (billed_final 50000, collected_final 0)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rate_ladder_three_input_precedence
        grounds:
          - calculations.billable_rate_resolution
          - entities.Matter.fields.matter_rate_cents
          - entities.TimeEntry.fields.resolved_rate_cents
        distinguishing_aspect: |
          MODE (a) non-linear ≥3-input conditional selection: resolved_rate_cents is picked from the
          ladder {matter_rate_cents, client_override_rate, timekeeper.standard_rate} by a branch on
          which is non-null; with a client override 45000 present BUT matter_rate null, the middle
          tier wins (resolved 45000), not the standard 50000 nor any matter rate.
        test_recipe:
          setup:
            - "PARTNER timekeeper standard 50000; client with a PARTNER rate-override 45000; matter has NO matter_rate."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/clients/${cl_id}/rate-overrides"
              payload: { role_kind: "PARTNER", rate_cents: 45000 }
              as: BillingClerk
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "No Matter Rate" }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 90, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te_id: $.data.id, rrate: $.data.resolved_rate_cents, bamt: $.data.billable_amount_cents }
          assert:
            - "TimeEntry.${te_id}.resolved_rate_cents == 45000 (client override beats standard, no matter rate)"
            - "TimeEntry.${te_id}.billable_amount_cents == 67500 (45000 * ceil(90/6)/10 = 45000*15/10)"

      - name: invoice_rounding_order_round_per_line_then_sum
        grounds:
          - calculations.time_entry_amount
          - calculations.invoice_total
          - entities.Invoice.fields.fees_subtotal_cents
        distinguishing_aspect: |
          MODE (b) nested-rounding order pinned: two time entries each min5 at odd rate 33333 round
          per-line to 3333 (sum 6666). The scaffold pins round-PER-LINE-then-sum; round-after-sum would
          give 6667. The asserted 6666 is only reachable under the pinned order — a different
          combinatorial axis than the precedence-ladder instance above.
        test_recipe:
          setup:
            - "Matter with matter_rate 33333; two CAPTURED time entries each minutes=5 -> 3333 cents each."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Odd Rate", matter_rate_cents: 33333 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 5, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te1: $.data.id, a1: $.data.billable_amount_cents }
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T10:00:00Z", minutes: 5, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te2: $.data.id, a2: $.data.billable_amount_cents }
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { fees: $.data.fees_subtotal_cents }
          assert:
            - "TimeEntry.${te1}.billable_amount_cents == 3333"
            - "TimeEntry.${te2}.billable_amount_cents == 3333"
            - "Invoice.${inv_id}.fees_subtotal_cents == 6666 (round-per-line then sum; NOT 6667 from round-after-sum)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_parallel_billing_x_collection_dimensions
        grounds:
          - state_machines.Invoice
          - entities.Invoice.fields.billing_status
          - entities.Invoice.fields.collection_status
          - calculations.collection_aging
        distinguishing_aspect: |
          PARALLEL dimensions on the Invoice entity: advancing the clock past due_date flips
          collection_status ISSUED-invoice from CURRENT to OVERDUE WITHOUT touching billing_status
          (stays ISSUED) — the two axes evolve independently on the same row.
        test_recipe:
          setup:
            - "One ISSUED invoice total 50000, issue 2026-06-01, net 30 (due 2026-07-01), unpaid, collection_status CURRENT at clock 2026-06-01."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /firm/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { bstat: $.data.billing_status, cstat: $.data.collection_status }
          assert:
            - "Invoice.${inv_id}.billing_status == ISSUED (billing dimension unchanged by clock)"
            - "Invoice.${inv_id}.collection_status == OVERDUE (collection dimension advanced by clock past due_date)"

      - name: matter_conflict_cyclic_block_then_waive_clear
        grounds:
          - state_machines.Matter.CONFLICT_PENDING_to_CONFLICT_BLOCKED
          - state_machines.Matter.CONFLICT_BLOCKED_to_CONFLICT_CLEARED
          - calculations.conflict_screen
          - entities.ConflictCheck.fields.result
        distinguishing_aspect: |
          CYCLIC/branching shape on the Matter entity (different entity from Invoice above): a FLAGGED
          screen drives the matter to terminal-looking CONFLICT_BLOCKED, then a partner waive re-opens
          it back to CONFLICT_CLEARED (a loop out of a near-terminal state), not a forward-only pipeline.
        test_recipe:
          setup:
            - "Two clients exist: 'Acme Corp' (subject) and 'Rival Inc' (adverse). A matter for Acme is in INTAKE."
          setup_api_calls:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Rival Inc", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { rival_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme v Rival" }
              as: BillingClerk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Rival Inc" }
              as: BillingClerk
              captures: { cc_id: $.data.id, res: $.data.result, matched: $.data.matched_client_id }
            - call: "POST /firm/conflict-checks/${cc_id}/waive"
              payload: {}
              as: Attorney
              captures: { res2: $.data.result }
          assert:
            - "ConflictCheck.${cc_id}.result == FLAGGED immediately after the screen"
            - "ConflictCheck.${cc_id}.matched_client_id == ${rival_id}"
            - "Matter.${m_id}.status == CONFLICT_BLOCKED after the FLAGGED screen"
            - "ConflictCheck.${cc_id}.result == WAIVED after waive"
            - "Matter.${m_id}.status == CONFLICT_CLEARED after waive (cyclic re-open)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trust_sweep_depth3_paid_settled_chain
        grounds:
          - state_machines.Invoice.billing_status=ISSUED_to_billing_status=PAID
          - concurrency_rules[trust-sweep-stale-invoice]
          - entities.Invoice.fields.amount_paid_cents
          - entities.Invoice.fields.collection_status
          - entities.Client.fields.ar_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from the TRUST-SWEEP trigger: sweep mutates Invoice.amount_paid_cents (A);
          A reaching total flips billing_status -> PAID (B, caused by A); B flips collection_status ->
          SETTLED and recomputes Client.ar_balance_cents -> 0 (C, caused by B). Each link is caused by
          the previous, not by the sweep directly.
        test_recipe:
          setup:
            - "Client matter OPEN; ISSUED invoice total 50000 unpaid; trust sub-ledger for the client funded 100000 (DEPOSIT confirmed)."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/trust-accounts"
              payload: { name: "IOLTA Pool" }
              as: PlatformAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/trust-ledgers"
              payload: { trust_account_id: "${ta_id}", client_id: "${cl_id}", retainer_floor_cents: 0 }
              as: BillingClerk
              captures: { led_id: $.data.id }
            - call: "POST /firm/trust-transactions"
              payload: { client_trust_ledger_id: "${led_id}", kind: "DEPOSIT", amount_cents: 100000, initiated_by_user_id: "clerk-1" }
              as: BillingClerk
              captures: { dep_id: $.data.id }
            - call: "POST /firm/trust-transactions/${dep_id}/confirm"
              payload: {}
              as: BillingClerk
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "Acme Matter", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { inv_v: $.data.version }
          trigger:
            - call: "POST /firm/invoices/${inv_id}/trust-sweep"
              payload: { amount_cents: 50000, client_trust_ledger_id: "${led_id}", initiated_by_user_id: "clerk-1", expected_invoice_version: "${inv_v}" }
              as: Attorney
              as_user_id: "att-9"
            - call: "GET /firm/invoices/${inv_id}"
              payload: {}
              as: BillingClerk
              captures: { bstat: $.data.billing_status, cstat: $.data.collection_status, paid: $.data.amount_paid_cents }
            - call: "GET /firm/clients/${cl_id}/ar-summary"
              payload: {}
              as: BillingClerk
              captures: { ar: $.data.ar_balance_cents }
          assert:
            - "Invoice.${inv_id}.amount_paid_cents == 50000 (A)"
            - "Invoice.${inv_id}.billing_status == PAID (B, caused by amount_paid reaching total)"
            - "Invoice.${inv_id}.collection_status == SETTLED (C, caused by PAID)"
            - "client ar-summary ar_balance_cents == 0 (C, caused by PAID dropping the invoice from A/R)"

      - name: finalize_depth2_invoiced_wip_chain
        grounds:
          - state_machines.Invoice.billing_status=DRAFT_to_billing_status=ISSUED
          - entities.TimeEntry.fields.status
          - entities.Matter.fields.wip_fees_cents
          - entities.Client.fields.ar_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade from the FINALIZE trigger (a different triggering transition than the sweep):
          finalize flips each attached TimeEntry CAPTURED -> INVOICED (A); their leaving CAPTURED
          drives Matter.wip_fees_cents -> 0 (B, caused by A). Distinct propagation origin from the
          depth-3 sweep chain.
        test_recipe:
          setup:
            - "Matter OPEN with one CAPTURED time entry min60 rate 50000 -> 50000; matter WIP fees 50000; a DRAFT invoice on the matter."
          setup_api_calls:
            - call: "POST /firm/billing-codes"
