        grounds: ["errors[ERR_PERMIT_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_dispatch_gated_on_permit_application_state
          rationale: "Asserted as the failure path of that §1.8 instance, together with the success path after approval."

