# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Air Traffic Flow Management & Ground Delay Program Administration
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and replays from empty-DB.
# Logical clock default: 2026-09-01T00:00:00Z; every recipe sets 2026-09-15T12:00:00Z
# before any windowed create, so no recipe date precedes the clock start.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_forecast_planning_vs_operational
        grounds:
          - calculations.capacity_forecast_rate
          - entities.CapacityForecast.fields.predicted_acceptance_rate
        distinguishing_aspect: |
          Facility-capacity domain variant: identical facility + identical events yield
          predicted_acceptance_rate 21 under PLANNING (CONFIRMED only) but 17 under
          OPERATIONAL (REPORTED added at half weight). Distinct entity domain from
          flight_delay_provisional_vs_final (flight/operator delay attribution).
        test_recipe:
          setup:
            - "Facility KEWR, AIRPORT, base_acceptance_rate 30"
            - "One CONFIRMED WEATHER severity-2 event and one REPORTED STAFFING severity-3 event, both covering 13:00-16:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 2, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { ev_w: $.data.id }
            - call: "POST /atfm/constraint-events/${ev_w}/confirm"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "STAFFING", severity: 3, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { ev_s: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { plan_rate: $.data.predicted_acceptance_rate }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "OPERATIONAL", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { ops_rate: $.data.predicted_acceptance_rate }
          assert:
            - "plan_rate == 21  (floor(30 * (1 - 0.15*2)) = floor(21.0))"
            - "ops_rate == 17  (floor(30 * 0.70 * (1 - 0.10*3*0.5)) = floor(17.85))"
            - "plan_rate != ops_rate for identical inputs; variant selection alone drives the delta"
            - "PLANNING forecast included_event_ids holds only ${ev_w}; OPERATIONAL holds ${ev_w} and ${ev_s}"

      - name: flight_delay_provisional_vs_final
        grounds:
          - calculations.provisional_vs_final_delay
          - entities.Flight.fields.final_delay_minutes
        distinguishing_aspect: |
          Flight-delay domain variant: the same slot data yields provisional delay 5 but
          final delay 0 for a flight whose operator self-inflicted 10 minutes of ETA slip,
          while a clean flight keeps 14 == 14. Distinct entity domain from
          capacity_forecast_planning_vs_operational (facility capacity).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z on facility base 30 with published PLANNING forecast"
            - "Flights F1(13:05),F2(13:10),F3(13:20) op_a and F4(13:15),F5(13:26) op_b; CTAs 13:00/13:10/13:30/13:20/13:40 after RBS"
            - "F4's operator then reports ETA 13:25 (10 minutes beyond schedule) and goes AIRBORNE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:10:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:20:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL4", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:15:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f4: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL5", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:26:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f5: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/flights/${f4}"
              as: FlowManager
              captures: { f4_v: $.data.version }
            - call: "POST /atfm/flights/${f4}/updates"
              payload: { new_eta: "2026-09-15T13:25:00Z", new_ops_status: "AIRBORNE", expected_flight_version: "${f4_v}" }
              as: Operator
              as_user_id: "${op_b}"
          trigger:
            - call: "POST /atfm/tmis/${tmi}/complete"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
          assert:
            - "Flight ${f4}.provisional_delay_minutes == 5 (CTA 13:20 vs sched 13:15)"
            - "Flight ${f4}.final_delay_minutes == 0 (max(0, 5 - self_inflicted 10))"
            - "Flight ${f5}.provisional_delay_minutes == 14 and final_delay_minutes == 14 (no self-inflicted slip: estimated == scheduled 13:26)"
            - "Operator ${op_b}.cumulative_delay_minutes == 14 (0 from F4 + 14 from F5)"
            - "Identical slot data, different reading: F4 provisional 5 vs final 0 proves variant divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: max_feasible_rate_gate
        grounds:
          - calculations.max_feasible_rate
          - validations[priority=20]
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: nested min(forecast, base),
          subtractive AFP aggregate load, and a conditional GROUND_STOP zero-branch.
          max_feasible is 17 with one AFP(4) against forecast 21/base 30, and 0 once a
          ground stop publishes — each branch falsifiable. Distinct mode from
          delay_distribution_largest_remainder (b) and compression_evaluation_order (c).
        test_recipe:
          setup:
            - "Facility base 30; CONFIRMED WEATHER sev-2 event 13:00-15:00Z; PLANNING forecast 13:00-15:00Z predicted 21, PUBLISHED"
            - "AFP rate 4 ACTIVE over 13:00-15:00Z; GDP-A rate 18 PROPOSED over 13:00-14:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 2, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
            - call: "POST /atfm/constraint-events/${ev}/confirm"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "AIRSPACE_FLOW_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 4 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { afp: $.data.id }
            - call: "POST /atfm/tmis/${afp}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${afp}/activate"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T14:00:00Z", controlled_rate: 18 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { gdp_a: $.data.id }
          trigger:
            - call: "POST /atfm/tmis/${gdp_a}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_over: $.data.error_id }
            - call: "POST /atfm/tmis/${gdp_a}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T14:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 16 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { gdp_b: $.data.id }
            - call: "POST /atfm/tmis/${gdp_b}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { gdp_b_status: $.data.status }
            - call: "POST /atfm/tmis/${gdp_b}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_STOP", program_start: "2026-09-15T13:30:00Z", program_end: "2026-09-15T14:30:00Z", controlled_rate: 0 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { gs: $.data.id }
            - call: "POST /atfm/tmis/${gs}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "AIRSPACE_FLOW_PROGRAM", program_start: "2026-09-15T13:30:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 60 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { afp2: $.data.id }
            - call: "POST /atfm/tmis/${afp2}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_gs: $.data.error_id }
          assert:
            - "err_over == ERR_RATE_EXCEEDS_CAPACITY (max_feasible = max(0, min(21, 30) - 4) = 17 < 18)"
            - "gdp_b_status == PUBLISHED (16 <= 17: boundary value admitted)"
            - "err_gs == ERR_RATE_EXCEEDS_CAPACITY (ground-stop zero-branch: max_feasible == 0 while GS is PUBLISHED)"
            - "The conditional branch (GS present), the min() and the subtractive AFP load each change the result — >= 3 interacting inputs"

      - name: delay_distribution_largest_remainder
        grounds:
          - calculations.operator_delay_distribution
          - entities.OperatorDelayLedger.fields.fair_share_minutes
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: per-ledger floor THEN
          largest-remainder top-up conserves the 35-minute total (17+1 / 17), whereas
          round-half-each would over-allocate to 36 (18+18). The 0.5/0.5 remainder tie is
          broken by earliest in-program scheduled_arrival, not by id. Distinct mode from
          max_feasible_rate_gate (a) and compression_evaluation_order (c).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 12, window 13:00-14:00Z, facility base 30, published PLANNING forecast"
            - "op_a flights A1(13:02),A2(13:04),A3(13:06); op_b flights B1(13:08),B2(13:10),B3(13:12)"
            - "RBS assigns CTAs 13:00/13:05/13:10/13:15/13:20/13:25; delays A:0,1,4 and B:7,10,13 (totals 5 and 30, grand 35)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T14:00:00Z", controlled_rate: 12 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:02:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:04:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:06:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL1", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:08:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { b1: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL2", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:10:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { b2: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL3", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:12:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { b3: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
          trigger:
            - call: "GET /atfm/tmis/${tmi}/delay-ledgers"
              as: FlowManager
          assert:
            - "ledger(${op_a}): flight_count == 3, attributed_delay_minutes == 5"
            - "ledger(${op_b}): flight_count == 3, attributed_delay_minutes == 30"
            - "raw shares 35*3/6 == 17.5 each; floors sum to 34, leftover 1"
            - "ledger(${op_a}).fair_share_minutes == 18 (tie-break: earliest in-program flight is A1 at 13:02 < 13:08)"
            - "ledger(${op_b}).fair_share_minutes == 17"
            - "fair_share sum == 35 == total delay (round-half-each would give 18+18 == 36 != 35)"
            - "deviation_minutes == -13 (${op_a}) and +13 (${op_b})"

      - name: compression_evaluation_order
        grounds:
          - calculations.compression_reallocation
          - entities.CompressionRun.fields.moves_made
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the slot A2
          frees becomes A3's target INSIDE the same pass (waterfall), passes stop after a
          no-move pass, and GA promotion runs before carrier moves. Any other evaluation
          order yields a different moves_made / CTA assignment. Distinct mode from (a) and (b).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 12, window 13:00-14:00Z (12 slots, last slot 13:55 GA-reserved), facility base 30"
            - "A1(13:02),A2(13:07),A3(13:12) op_a and B1(13:17),B2(13:22) op_b slotted at 13:00/13:05/13:10/13:15/13:20"
            - "A1 cancelled, releasing slot 13:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T14:00:00Z", controlled_rate: 12 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:02:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:07:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:12:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL1", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:17:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { b1: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL2", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:22:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { b2: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/flights/${a1}/cancel"
              as: Operator
              as_user_id: "${op_a}"
          trigger:
            - call: "POST /atfm/tmis/${tmi}/compression-runs"
              as: FlowManager
              captures: { run_moves: $.data.moves_made, run_passes: $.data.passes_executed, run_released: $.data.released_slot_count, run_open: $.data.remaining_open_slots }
          assert:
            - "run_released == 1 (only A1's slot 13:00)"
            - "run_moves == 4 and run_passes == 2 (pass 1 moves A2,A3,B1,B2; pass 2 finds no earlier pool slot and stops)"
            - "Flight ${a2}.controlled_arrival == 2026-09-15T13:00:00Z"
            - "Flight ${a3}.controlled_arrival == 2026-09-15T13:05:00Z — only possible if A2's freed slot re-entered the pool within the SAME pass (pinned waterfall order)"
            - "Flight ${b2}.controlled_arrival == 2026-09-15T13:15:00Z"
            - "run_open == 8 (six never-assigned carrier slots 13:25-13:50 + reopened 13:20 + GA-reserved 13:55)"
            - "count(ASSIGNED slots) == 4 == 5 initial - 1 cancelled (slot-count conservation through compression)"

  - rule_id: non_linear_state_machine
    instances:
      - name: tmi_revision_cycle
        grounds:
          - state_machines.TrafficManagementInitiative.ACTIVE_to_REVISING
          - state_machines.TrafficManagementInitiative.REVISING_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on TrafficManagementInitiative: ACTIVE -> REVISING -> ACTIVE
          across two separate requests, with REVISING observable (substitutions rejected)
          and the return leg re-deriving slots at the revised rate. Distinct entity and
          shape from flight_parallel_dimensions (parallel dimensions on Flight).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z; flights F1(13:05),F2(13:10),F3(13:20) op_a, F4(13:15),F5(13:26) op_b slotted at 13:00/13:10/13:30/13:20/13:40"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER", cdm_member: true }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:10:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:20:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL4", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:15:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f4: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL5", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:26:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f5: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_v: $.data.version }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/revisions"
              payload: { new_controlled_rate: 10, reason: "weather improving", expected_tmi_version: "${tmi_v}" }
              as: FlowManager
              captures: { rev_id: $.data.id, rev_applied: $.data.applied }
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_status_revising: $.data.status }
            - call: "POST /atfm/tmis/${tmi}/substitutions"
              payload: { flight_id_1: "${f1}", flight_id_2: "${f3}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { err_revising: $.data.error_id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/flights/${f5}"
              as: FlowManager
              captures: { f5_cta: $.data.controlled_arrival, f5_delay: $.data.provisional_delay_minutes }
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_status_after: $.data.status, tmi_rate_after: $.data.controlled_rate }
          assert:
            - "tmi_status_revising == REVISING and rev_applied == false (cycle leg 1)"
            - "err_revising == ERR_TMI_NOT_ACTIVE (REVISING gates substitutions even though flights are SLOTTED and data is fresh)"
            - "tmi_status_after == ACTIVE and tmi_rate_after == 10 (cycle leg 2 applied the revision)"
            - "f5_cta == 2026-09-15T13:24:00Z and f5_delay == 0 (re-derived at rate 10: slot index 4 at 13:00 + 4*360s; was CTA 13:40 / delay 14 before)"
            - "exactly 4 REVISION_MOVE SlotTransactions (F1's CTA 13:00 unchanged -> no transaction; F2/F3/F4/F5 changed)"
            - "GET /atfm/tmis/${tmi}/slots total_count == 20 (floor(7200/360); last 2 slots GA-reserved)"

      - name: flight_parallel_dimensions
        grounds:
          - state_machines.Flight
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: ops_status and control_status evolve
          independently — a flight can be AIRBORNE while SLOTTED, and a TMI cancel returns
          control_status to UNCONTROLLED without touching ops_status. Distinct entity and
          shape from tmi_revision_cycle (cycle on TrafficManagementInitiative).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z; F3 (op_a, sched 13:20) slotted at 13:30; F4 (op_b, sched 13:15) slotted at 13:20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:20:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL4", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:15:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f4: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/flights/${f3}"
              as: FlowManager
              captures: { f3_v: $.data.version }
          trigger:
            - call: "POST /atfm/flights/${f3}/updates"
              payload: { new_ops_status: "AIRBORNE", expected_flight_version: "${f3_v}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f3_ops: $.data.ops_status, f3_ctl: $.data.control_status }
            - call: "POST /atfm/tmis/${tmi}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "GET /atfm/flights/${f3}"
              as: FlowManager
              captures: { f3_ops2: $.data.ops_status, f3_ctl2: $.data.control_status, f3_cta2: $.data.controlled_arrival }
            - call: "GET /atfm/flights/${f4}"
              as: FlowManager
              captures: { f4_ops2: $.data.ops_status, f4_ctl2: $.data.control_status }
          assert:
            - "after update: f3_ops == AIRBORNE while f3_ctl == SLOTTED (dimensions move independently)"
            - "after TMI cancel: f3_ops2 == AIRBORNE (untouched by the cascade) while f3_ctl2 == UNCONTROLLED and f3_cta2 == null"
            - "f4_ops2 == SCHEDULED and f4_ctl2 == UNCONTROLLED (cancel cascade touched control only)"

  - rule_id: transitive_cascade
    instances:
      - name: constraint_confirm_downgrades_program
        grounds:
          - state_machines.ConstraintEvent.REPORTED_to_CONFIRMED
          - state_machines.CapacityForecast.PUBLISHED_to_STALE
          - state_machines.TrafficManagementInitiative.ACTIVE_to_REVISING
        distinguishing_aspect: |
          Depth-3 chain triggered by constraint confirmation: event CONFIRMED mutates the
          forecast (PUBLISHED -> STALE); the capacity collapse mutates the ACTIVE GDP
          (-> REVISING); that transition itself creates a SYSTEM_AUTO_DOWNGRADE
          TMIRevision record with new_controlled_rate 12. Distinct trigger from
          tmi_cancel_compensates_slots.
        test_recipe:
          setup:
            - "Facility base 30; PLANNING forecast 13:00-15:00Z predicted 30 PUBLISHED; GDP rate 30 ACTIVE over 13:00-15:00Z (zero flights filed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 30 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 4, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /atfm/constraint-events/${ev}/confirm"
              as: FlowManager
            - call: "GET /atfm/facilities/${fac}/capacity-forecasts"
              as: FlowManager
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_status: $.data.status, tmi_revs: $.data.revision_count }
            - call: "GET /atfm/tmis/${tmi}/revisions"
              as: FlowManager
          assert:
            - "link 1: CapacityForecast ${fc}.status == STALE (only PUBLISHED forecast on the facility, window overlap)"
            - "link 2: tmi_status == REVISING and tmi_revs == 1"
            - "link 3: the TMIRevision has origin == SYSTEM_AUTO_DOWNGRADE, previous_controlled_rate == 30, new_controlled_rate == 12 (implied = floor(30 * (1 - 0.15*4)) = 12; 12 is a valid GDP rate), applied == false"
            - "Each link caused by the previous link, not by the confirm call directly (fan-out would not create the revision record)"

      - name: tmi_cancel_compensates_slots
        grounds:
          - state_machines.TrafficManagementInitiative.ACTIVE_to_CANCELLED
          - state_machines.ArrivalSlot.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Depth-2 chain triggered by TMI cancel: the cancel releases ASSIGNED slots
          (link 1); each slot release itself reverts the holder flight (CTA null,
          UNCONTROLLED, delay zeroed), writes a REVERSAL transaction and reverses the
          operator ledger (link 2). Distinct trigger from constraint_confirm_downgrades_program.
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z; F1(13:05),F2(13:10),F3(13:20) op_a; F4(13:15),F5(13:26) op_b"
            - "Attributed delay: op_a 10 (F3), op_b 19 (F4 5 + F5 14)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Bravo Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_b: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:10:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL3", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:20:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f3: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL4", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:15:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f4: $.data.id }
            - call: "POST /atfm/operators/${op_b}/flights"
              payload: { designator: "BAL5", origin: "KDEN", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:26:00Z" }
              as: Operator
              as_user_id: "${op_b}"
              captures: { f5: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
          trigger:
            - call: "POST /atfm/tmis/${tmi}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "GET /atfm/tmis/${tmi}/slots"
              payload: {}
              as: FlowManager
            - call: "GET /atfm/flights/${f3}"
              as: FlowManager
              captures: { f3_cta: $.data.controlled_arrival, f3_ctl: $.data.control_status, f3_delay: $.data.provisional_delay_minutes }
            - call: "GET /atfm/tmis/${tmi}/slot-transactions"
              as: FlowManager
            - call: "GET /atfm/tmis/${tmi}/delay-ledgers"
              as: FlowManager
          assert:
            - "link 1: all 5 formerly ASSIGNED slots are RELEASED"
            - "link 2: f3_cta == null, f3_ctl == UNCONTROLLED, f3_delay == 0"
            - "5 REVERSAL transactions with delay_delta 0, 0, -5, -10, -14 (mirroring the INITIAL_ASSIGNMENT deltas)"
            - "ledger(${op_a}): attributed_delay_minutes == 0 and reversed_delay_minutes == 10"
            - "ledger(${op_b}): attributed_delay_minutes == 0 and reversed_delay_minutes == 19"
            - "Operator ${op_b}.cumulative_delay_minutes == 0 (cancel never credits final delay)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reroute_state_beats_sector_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_TMI_TERMINAL]
          - errors[ERR_SECTOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair (state, business_safety): one reroute-assignment request violates
          both — the TMI is CANCELLED and the sector bucket is full — and the
          state-category error ERR_TMI_TERMINAL (priority 5) MUST win over
          ERR_SECTOR_CAPACITY_EXCEEDED (priority 7). Distinct pair from
          revision_temporal_beats_fiscal.
        test_recipe:
          setup:
            - "Facility KEWR (AIRPORT, 30) and sector ZDC42 (EN_ROUTE_SECTOR, base_acceptance_rate 2)"
            - "REROUTE TMI R1 ACTIVE; flights X1(13:30),X2(13:40),X3(13:50) of op_a, all UNCONTROLLED, ETA bucket 13:00h"
            - "R1 already holds 2 reroute assignments via ZDC42 in the 13:00h bucket (bucket full: load == rate == 2)"
            - "REROUTE TMI R2 PUBLISHED then CANCELLED"
