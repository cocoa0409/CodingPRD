              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 308.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "WATER_MIST", expected_production_order_version: "${po_v}" }
