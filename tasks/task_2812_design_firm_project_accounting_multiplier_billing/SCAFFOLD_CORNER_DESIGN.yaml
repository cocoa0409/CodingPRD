            - "the 250000.00 child is created 201; the 200000.00 sibling returns 422 ERR_WBS_FEE_ROLLUP_MISMATCH because 450000.00 > 400000.00"
            - "the 150000.00 sibling returns 201: the rollup comparison admits an exact match at 400000.00"
            - "the repeated wbs_code 02-DD returns 409 ERR_WBS_CODE_DUPLICATE, and the code is scoped to the project, not to the parent"
            - "Phase.${ph_root}.is_leaf == false while Phase.${ph_c1}.is_leaf and Phase.${ph_c2}.is_leaf are true"
