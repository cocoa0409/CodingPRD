            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id" } }
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 455 }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/portfolios", payload: { name: "PRO", discount_rate_bps: 1200, valuation_method: "PROSPECTIVE", allocations: [] }, as: PortfolioManager, captures: { pf: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/assign-portfolio", payload: { portfolio_id: "${pf}" }, as: PortfolioManager }
            - { call: "GET /api/cases/${c1}/closing-package", as: CaseManager, captures: { pkg: "$.data[0].id" } }
