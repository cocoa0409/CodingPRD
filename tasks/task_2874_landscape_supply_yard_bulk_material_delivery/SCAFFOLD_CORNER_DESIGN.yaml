          - errors[ERR_ORDER_ALREADY_TERMINAL]
        distinguishing_aspect: "CANCELLED is terminal on the fulfillment axis, so a second cancel is refused with 409 ERR_ORDER_ALREADY_TERMINAL and the version does not advance a second time."
        test_recipe:
          setup:
            - "A DRAFT order that has been cancelled once."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Terminal Lockdown Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
