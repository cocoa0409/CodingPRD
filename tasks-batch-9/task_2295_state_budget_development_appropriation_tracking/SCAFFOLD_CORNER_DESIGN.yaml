              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_a_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_a_id}"
              captures: { req_a_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_a_id}", base_budget_cents: 1200000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_b_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_a_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_b_id}"
            - call: "POST /fiscal/agency-requests/${req_a_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_b_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_a_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_a_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_a_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_a_id}"
          assert:
            - "the foreign create returns HTTP 403 with error_id == ERR_AGENCY_SCOPE_VIOLATION, not ERR_DUPLICATE_AGENCY_REQUEST"
            - "the foreign package attach returns HTTP 403 with error_id == ERR_AGENCY_SCOPE_VIOLATION, resolved through AgencyRequest.${req_a_id}.agency_id"
            - "the foreign submit returns HTTP 403 with error_id == ERR_AGENCY_SCOPE_VIOLATION and leaves the row DRAFT"
            - "the owning officer's package attach returns HTTP 201 and the owning officer's submit returns HTTP 200 with status == SUBMITTED"
            - "AgencyRequest.${req_a_id}.total_request_cents == 1300000000 after the successful submit"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: forecast_create_against_a_stale_cycle_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.forecast-create-stale-cycle
          - validations[priority=9]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /fiscal/revenue-forecasts]
        distinguishing_aspect: |
          The forecast OCC race, keyed on the parent BudgetCycle: adopting the first forecast
          bumps the cycle version as a side effect, so a token captured before the adoption is
          stale and the second create returns ERR_STALE_VERSION at 412. Re-reading the cycle
          and retrying with the fresh token succeeds, and the stale attempt persisted nothing.
        test_recipe:
          setup:
            - "BudgetCycle 2027 in phase DEVELOPMENT with one DRAFT GENERAL RevenueForecast of 10000000000 cents"
            - "The cycle version captured at creation time, before the adoption"
          setup_api_calls:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v_stale: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v_stale}" }
              as: BudgetAnalyst
              captures: { fc_1_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_1_id}/adopt"
              payload: {}
              as: BudgetDirector
          trigger:
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "INCOME_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 3000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v_stale}" }
              as: BudgetAnalyst
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { cyc_v_fresh: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "INCOME_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 3000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v_fresh}" }
              as: BudgetAnalyst
              captures: { fc_2_id: $.data.id }
            - call: "GET /fiscal/budget-cycles/${cyc_id}/revenue-forecasts"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "the stale create returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "${cyc_v_fresh} is greater than ${cyc_v_stale}, the bump coming from the adopt side effect"
            - "the retry with the fresh token returns HTTP 201 with RevenueForecast.${fc_2_id}.status == DRAFT"
            - "the list returns total_count == 2, so the rejected create persisted nothing"
            - "BudgetCycle.${cyc_id}.adopted_general_fund_revenue_cents is still 10000000000, since the new forecast is only DRAFT"

      - name: recommendation_create_against_a_stale_request_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.recommendation-create-stale-request
          - validations[priority=9]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /fiscal/executive-recommendations]
        distinguishing_aspect: |
          The recommendation OCC race, keyed on the parent AgencyRequest rather than the cycle:
          the review workflow bumps the request version at submit, begin-review and accept, so
          a token captured at creation time is three revisions behind. The 412 is returned even
          though the referenced packages and the phase are all valid, and the check at priority
          9 fires before the package membership rules at priorities 18 and 19.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 with an ADOPTED GENERAL forecast of 10000000000 cents, advanced to phase EXECUTIVE_PREP"
            - "ACCEPTED AgencyRequest with base_budget_cents 1000000000 and one RECOMMENDED TECHNICAL package of 300000000"
            - "The request version captured at creation time, before submit, begin-review and accept"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id, req_v_stale: $.data.version }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages/${pkg_id}/recommend"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
          trigger:
            - call: "POST /fiscal/executive-recommendations"
              payload: { agency_request_id: "${req_id}", recommended_base_cents: 1000000000, recommended_package_ids: ["${pkg_id}"], policy_priority: "HIGH", expected_agency_request_version: "${req_v_stale}" }
              as: BudgetAnalyst
