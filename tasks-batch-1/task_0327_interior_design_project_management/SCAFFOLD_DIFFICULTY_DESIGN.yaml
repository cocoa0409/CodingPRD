          - calculations.order_subtotal
          - entities.Project.fields.committed_cents
        distinguishing_aspect: "Conserved quantity #1 = Project.committed_cents. Forward (place order, committed += subtotal) paired with compensating (cancel order, committed -= subtotal) MUST leave committed_cents == its pre-place value (0). Pinned formula: committed_cents = SUM order_subtotal_cents over orders with status IN {ORDERED, IN_TRANSIT, DELIVERED}."
