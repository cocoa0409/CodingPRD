# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances.
# Every ${var} traces to a captures: on an earlier line of the same instance.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_diverge_on_guarantee
        grounds:
          - calculations.guarantee_fee
          - entities.Guarantee.fields.provisional_fee_cents
          - entities.Guarantee.fields.final_fee_cents
          - state_machines.Guarantee.QUOTED_to_APPROVED
        distinguishing_aspect: "On the Guarantee (pricing domain) the provisional fee uses fixed tier C (0.12) while the final fee uses the verified tier A (0.05); identical coverage/term yields 161999 vs 67500."
        test_recipe:
          setup:
            - "Portfolio with a large exposure cap; applicant verified at tier A (credit 740, dti 0.20); guarantee quoted at monthly_rent 249999, coverage_months 6, term_months 12."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Book DV1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R DV1", email: "rdv1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-DV1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
          trigger:
            - call: "POST /guarantees/${g_id}/approve"
              as: Underwriter
              as_user_id: "uw1"
              payload: {}
              captures: { final_fee: $.data.final_fee_cents }
          assert:
            - "Guarantee.${g_id}.provisional_fee_cents == 161999"
            - "Guarantee.${g_id}.final_fee_cents == 67500"
            - "Guarantee.${g_id}.provisional_fee_cents != Guarantee.${g_id}.final_fee_cents"

      - name: claim_payout_accelerated_vs_chronological_diverge
        grounds:
          - calculations.claim_payout
          - entities.Claim.fields.payout_amount_cents
          - entities.Claim.fields.payout_variant
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "On the Claim (loss domain) the accelerated variant pays the full covered term (6 months → 1349994) whereas chronological would pay only the 5 missed months (1124995); different algorithm, different entity domain than the fee dual-variant."
        test_recipe:
          setup:
            - "Active guarantee (remaining_coverage 1349994) bound to landlord; clock 2026-09-15; landlord files an accelerated claim; adjuster (ca1) distinct from underwriter (uw1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book DV2", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL DV2", email: "lldv2@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R DV2", email: "rdv2@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-DV2", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-DV2", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 12, acceleration_requested: true }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
              captures: { payout: $.data.payout_amount_cents }
          assert:
            - "Claim.${cl_id}.payout_variant == ACCELERATED"
            - "Claim.${cl_id}.payout_amount_cents == 1349994"
            - "Guarantee.${g_id}.remaining_coverage_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_min_floor_clamp_tier_and_term
        grounds:
          - calculations.guarantee_fee
          - entities.Guarantee.fields.final_fee_cents
          - state_machines.Guarantee.QUOTED_to_APPROVED
        distinguishing_aspect: "Mode (a): non-linear min/max clamp over ≥3 inputs (tier-rate 0.05, total_coverage 90000, term_factor 1.0) — raw fee 4500 is clamped UP to the MIN_FEE_CENTS floor 15000."
        test_recipe:
          setup:
            - "Applicant verified tier A; low-coverage guarantee (rent 100000, coverage_months 1, term 12) whose raw fee falls below the 15000 floor."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Book CF1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R CF1", email: "rcf1@x.com", annual_income_cents: 6000000, credit_score: 740, monthly_obligations_cents: 100000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-CF1", monthly_rent_cents: 100000, coverage_months: 1, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
              captures: { final_fee: $.data.final_fee_cents }
          assert:
            - "Guarantee.${g_id}.final_fee_cents == 15000"

      - name: claim_payout_round_per_month_then_sum
        grounds:
          - calculations.claim_payout
          - calculations.guarantee_fee
          - entities.Guarantee.fields.per_month_coverage_cents
          - entities.Claim.fields.payout_amount_cents
        distinguishing_aspect: "Mode (b): pinned rounding order — per_month_coverage_cents is rounded once (round(249999*0.90)=224999) then multiplied by 5 missed months = 1124995; the sum-then-round order round(249999*0.90*5)=1124996 is NOT used."
        test_recipe:
          setup:
            - "Active guarantee (per_month_coverage 224999) bound to landlord; clock 2026-09-15; landlord files a chronological claim for 5 missed months; adjuster ca1 ≠ underwriter uw1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book CF2", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL CF2", email: "llcf2@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R CF2", email: "rcf2@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-CF2", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-CF2", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 5, acceleration_requested: false }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
              captures: { payout: $.data.payout_amount_cents }
          assert:
            - "Claim.${cl_id}.payout_variant == CHRONOLOGICAL"
            - "Claim.${cl_id}.payout_amount_cents == 1124995"
            - "Guarantee.${g_id}.remaining_coverage_cents == 224999"

  - rule_id: non_linear_state_machine
    instances:
      - name: guarantee_renewal_cycle_returns_to_active
        grounds:
          - state_machines.Guarantee.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Guarantee.RENEWAL_PENDING_to_ACTIVE
          - entities.Guarantee.fields.renewal_count
        distinguishing_aspect: "Cyclic shape on Guarantee: ACTIVE→RENEWAL_PENDING→ACTIVE re-enters ACTIVE with renewal_count incremented to 1 — a loop, not a forward pipeline."
        test_recipe:
          setup:
            - "Active guarantee; underwriter opens a renewal, applicant re-pays the fee, underwriter confirms the renewal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book NL1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL NL1", email: "llnl1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R NL1", email: "rnl1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-NL1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-NL1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/renew"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /guarantees/${g_id}/confirm-renewal"
              payload: {}
              as: Underwriter
              captures: { st: $.data.status }
          assert:
            - "Guarantee.${g_id}.status == ACTIVE"
            - "Guarantee.${g_id}.renewal_count == 1"
            - "Guarantee.${g_id}.remaining_coverage_cents == 1349994"

      - name: claim_fork_denied_branch_has_no_side_effects
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Guarantee.fields.remaining_coverage_cents
        distinguishing_aspect: "Branching fork on Claim: the UNDER_REVIEW→DENIED edge leaves guarantee.remaining_coverage_cents untouched (1349994) and creates no RecoveryPlan, unlike the UNDER_REVIEW→APPROVED edge which debits coverage."
        test_recipe:
          setup:
            - "Active guarantee (remaining 1349994); a chronological claim reviewed then DENIED by the adjuster."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book NL2", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL NL2", email: "llnl2@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R NL2", email: "rnl2@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-NL2", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-NL2", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 3, acceleration_requested: false }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/deny"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
              captures: { st: $.data.status }
          assert:
            - "Claim.${cl_id}.status == DENIED"
            - "Guarantee.${g_id}.remaining_coverage_cents == 1349994"
            - "GET /recovery-plans?claim_id=${cl_id} returns total_count == 0"

  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_cascades_coverage_recovery_applicant
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Guarantee.fields.remaining_coverage_cents
          - entities.RecoveryPlan.fields.principal_cents
          - entities.Applicant.fields.open_recovery_count
        distinguishing_aspect: "Depth-3 chain from claim approve: Claim→Guarantee (coverage debited to 224999)→RecoveryPlan (created, principal 1124995)→Applicant (open_recovery_count 1); each link is caused by the previous, not by the approve action directly."
        test_recipe:
          setup:
            - "Active guarantee (remaining 1349994); chronological claim for 5 missed months reviewed and about to be approved by adjuster ca1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book TC1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL TC1", email: "lltc1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R TC1", email: "rtc1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-TC1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-TC1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 5, acceleration_requested: false }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          assert:
            - "Guarantee.${g_id}.remaining_coverage_cents == 224999"
            - "GET /recovery-plans?claim_id=${cl_id} returns total_count == 1 with principal_cents == 1124995"
            - "Applicant.${ap_id}.open_recovery_count == 1"

      - name: guarantee_default_cascades_applicant_and_compliance
        grounds:
          - state_machines.Guarantee.ACTIVE_to_DEFAULTED
          - entities.Applicant.fields.default_count
          - entities.ComplianceReview.fields.reason
