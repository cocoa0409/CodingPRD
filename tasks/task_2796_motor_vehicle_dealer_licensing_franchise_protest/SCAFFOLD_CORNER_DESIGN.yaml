              payload: { dealer_id: "${dlr_c37_id}", application_type: "INITIAL", facility_sqft: 5000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
