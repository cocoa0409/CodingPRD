  # =========================================================================
  # RULE 7 — cross_entity_state_dependency across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fair_entry_confirm_requires_member_eligible
        grounds:
          - state_machines.FairEntry.ENTERED_to_CONFIRMED
          - entities.Member.fields.eligibility_posture
        distinguishing_aspect: |
          Pair FairEntry -> Member: a FairEntry can only transition ENTERED->CONFIRMED when its
          (separate) Member entity has eligibility_posture == ELIGIBLE. A member whose posture is
          INELIGIBLE blocks confirmation even though the FairEntry itself is in a valid from-state.
        test_recipe:
          setup:
            - "Member with eligibility_posture == INELIGIBLE (no approved record book) and an ENTERED fair entry"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Ash FFA", county_code: "AS" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol F", email: "vf@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem I", birth_date: "2008-05-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
