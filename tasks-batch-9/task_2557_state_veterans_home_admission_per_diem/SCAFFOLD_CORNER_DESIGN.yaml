      - name: sm_decertified_unit_returns_to_conditional_not_certified
        claim_type: valid_transition
        grounds:
          - state_machines.CareUnit.DECERTIFIED_to_CONDITIONAL
          - calculations.survey_compliance_score
          - calculations.care_unit_operational_posture
          - state_machines.VeteransHome.SUSPENDED_to_RECOGNIZED
        distinguishing_aspect: |
          Reinstatement never jumps straight to CERTIFIED: a clean survey (empty deficiencies,
          score 0) on a DECERTIFIED unit lands CONDITIONAL with posture RESTRICTED - not CERTIFIED
          with posture OPEN - while the home's decertified_unit_count falls to 0 and its recognition
          returns to RECOGNIZED with a null suspended reason.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING CareUnit (licensed 2, out_of_service 0, no residents)."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Yellow Birch State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
