# §1.9 Scaffold Corner Design (Claim Coverage Index)
# Domain: public-records-redaction-bwc-release  (api_prefix: /records)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every instance is replayable from an empty database using only §1.5 endpoints.
# The logical clock starts at exactly 2026-08-01T00:00:00Z; any instance whose
# claim depends on time sets it explicitly through POST /_clock/set_current_utc.
# Instances whose corner is already pinned by a §1.8 difficulty instance carry an
# `excluded_because` stub and no test_recipe, so nothing is written twice.
scaffold_corner_design:
  - section: entities
    instances:
      - name: video_asset_create_returns_declared_defaults_and_state
        claim_type: Creation
        grounds:
          - "endpoints.POST /records/video-assets"
          - entities.VideoAsset.fields.disposition_state
          - entities.VideoAsset.fields.retention_locked
          - entities.VideoAsset.fields.depicted_individual_count
          - entities.VideoAsset.fields.is_critical_incident
          - state_machines.VideoAsset.initial_state.SCHEDULED
          - response_envelope.success
        distinguishing_aspect: |
          A create call that supplies only the nine declared inputs must come back
          with the four computed fields already materialised (SCHEDULED, false, 0,
          null) and is_critical_incident defaulted to false — the row is never
          returned in a half-initialised shape that a later GET has to fix up.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
            - "is_critical_incident is deliberately omitted from the payload so the declared default is exercised."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          trigger:
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0601", device_serial: "AXON-0601", officer_badge: "B-1101", recorded_start_at: "2026-07-25T08:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2027-01-21T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
          assert:
            - "HTTP 201"
            - "VideoAsset.${asset_id}.disposition_state == SCHEDULED"
            - "VideoAsset.${asset_id}.retention_locked == false"
            - "VideoAsset.${asset_id}.depicted_individual_count == 0"
            - "VideoAsset.${asset_id}.suspended_by_hold_id == null"
            - "VideoAsset.${asset_id}.is_critical_incident == false"
            - "VideoAsset.${asset_id}.duration_ms == 600000"
            - "VideoAsset.${asset_id}.version == 1"
            - "response.data.id and response.data.created_at are both non-null"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are both present, and response.response_type is the declared success discriminator"
      - name: video_asset_get_returns_stored_representation
        claim_type: Retrieval
        grounds:
          - "endpoints.GET /records/video-assets/{id}"
          - "endpoints.POST /records/video-assets"
          - entities.VideoAsset
        distinguishing_aspect: |
          The read-back of a freshly created recording is byte-identical on every
          input field and carries the same id and version as the create response,
          proving the GET projection reads storage rather than recomputing inputs.
        test_recipe:
          setup:
            - "One VideoAsset created at clock 2026-08-01T00:00:00Z with is_critical_incident true."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0602", device_serial: "AXON-0602", officer_badge: "B-1102", recorded_start_at: "2026-07-26T21:15:00Z", duration_ms: 1200000, classification: "OFFICER_INVOLVED_SHOOTING", retention_category: "EVIDENTIARY_7Y", scheduled_purge_at: "2033-07-26T00:00:00Z", is_critical_incident: true }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id, asset_v: $.data.version } }
          trigger:
            - { call: "GET /records/video-assets/${asset_id}", as: RecordsSupervisor, as_user_id: "supv-1" }
          assert:
            - "HTTP 200"
            - "VideoAsset.${asset_id}.incident_number == INC-2026-0602"
            - "VideoAsset.${asset_id}.device_serial == AXON-0602"
            - "VideoAsset.${asset_id}.officer_badge == B-1102"
            - "VideoAsset.${asset_id}.recorded_start_at == 2026-07-26T21:15:00Z"
            - "VideoAsset.${asset_id}.duration_ms == 1200000"
            - "VideoAsset.${asset_id}.classification == OFFICER_INVOLVED_SHOOTING"
            - "VideoAsset.${asset_id}.retention_category == EVIDENTIARY_7Y"
            - "VideoAsset.${asset_id}.scheduled_purge_at == 2033-07-26T00:00:00Z"
            - "VideoAsset.${asset_id}.is_critical_incident == true"
            - "VideoAsset.${asset_id}.version == ${asset_v} (still 1; a read never bumps the version)"
      - name: requests_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET /records/requests"
          - response_envelope.pagination
          - entities.PublicRecordsRequest
        distinguishing_aspect: |
          With exactly three requests on file, limit=2 must report total_count 3 and
          has_more true while returning 2 rows, and the offset=2 page must report the
          same total_count 3 with has_more false and 1 row — total_count counts the
          whole filtered set, never the page.
        test_recipe:
          setup:
            - "One GENERAL_PUBLIC Requester with three requests received on the same day."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Ada Public", email: "ada@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0603", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", scope_narrative: "First request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_a: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0604", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", scope_narrative: "Second request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_b: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0605", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", scope_narrative: "Third request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_c: $.data.id } }
          trigger:
            - { call: "GET /records/requests?limit=2&offset=0", as: RecordsClerk, as_user_id: "clerk-1", captures: { first_row_id: "$.data[0].id" } }
            - { call: "GET /records/requests?limit=2&offset=2", as: RecordsClerk, as_user_id: "clerk-1" }
          assert:
            - "first response: HTTP 200, response.total_count == 3, response.has_more == true, response.limit == 2, response.offset == 0, len(response.data) == 2"
            - "second response: HTTP 200, response.total_count == 3, response.has_more == false, response.limit == 2, response.offset == 2, len(response.data) == 1"
            - "the union of the two pages is exactly {${req_a}, ${req_b}, ${req_c}} with no id repeated across pages"
      - name: unknown_path_ids_return_their_own_not_found_code
        claim_type: Not Found
        grounds:
          - validations.priority_4
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_VIDEO_ASSET_NOT_FOUND
          - errors.ERR_RESPONSIVE_RECORD_NOT_FOUND
          - errors.ERR_EXEMPTION_CLAIM_NOT_FOUND
          - errors.ERR_REDACTION_TASK_NOT_FOUND
          - errors.ERR_DEPICTED_INDIVIDUAL_NOT_FOUND
          - errors.ERR_DENIAL_LETTER_NOT_FOUND
          - errors.ERR_LITIGATION_HOLD_NOT_FOUND
          - errors.ERR_LEDGER_ENTRY_NOT_FOUND
        distinguishing_aspect: |
          Nine different resource families must each answer a syntactically valid but
          unknown UUID with their OWN 404 code, not one shared generic not-found —
          a single ERR_REQUEST_NOT_FOUND for every path fails this instance.
        test_recipe:
          setup:
            - "Empty database; no entity of any kind exists, so every id below is unknown."
            - "The UUID 00000000-0000-0000-0000-0000000000ff is well formed, so ERR_VALIDATION must not fire."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          trigger:
            - { call: "GET /records/requests/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e1: $.data.error_id } }
            - { call: "GET /records/video-assets/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e2: $.data.error_id } }
            - { call: "GET /records/responsive-records/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e3: $.data.error_id } }
            - { call: "GET /records/exemption-claims/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e4: $.data.error_id } }
            - { call: "GET /records/redaction-tasks/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e5: $.data.error_id } }
            - { call: "GET /records/depicted-individuals/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e6: $.data.error_id } }
            - { call: "GET /records/denial-letters/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e7: $.data.error_id } }
            - { call: "GET /records/litigation-holds/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e8: $.data.error_id } }
            - { call: "GET /records/fee-ledger-entries/00000000-0000-0000-0000-0000000000ff", as: RecordsClerk, as_user_id: "clerk-1", captures: { e9: $.data.error_id } }
          assert:
            - "every one of the nine responses is HTTP 404 with a non-empty data.message"
            - "${e1} == ERR_REQUEST_NOT_FOUND"
            - "${e2} == ERR_VIDEO_ASSET_NOT_FOUND"
            - "${e3} == ERR_RESPONSIVE_RECORD_NOT_FOUND"
            - "${e4} == ERR_EXEMPTION_CLAIM_NOT_FOUND"
            - "${e5} == ERR_REDACTION_TASK_NOT_FOUND"
            - "${e6} == ERR_DEPICTED_INDIVIDUAL_NOT_FOUND"
            - "${e7} == ERR_DENIAL_LETTER_NOT_FOUND"
            - "${e8} == ERR_LITIGATION_HOLD_NOT_FOUND"
            - "${e9} == ERR_LEDGER_ENTRY_NOT_FOUND"
      - name: requester_create_missing_required_email_returns_validation
        claim_type: Required Fields
        grounds:
          - validations.priority_3
          - errors.ERR_VALIDATION
          - entities.Requester.fields.email
          - "endpoints.POST /records/requesters"
        distinguishing_aspect: |
          email carries source input with no default, so omitting it is a 400
          ERR_VALIDATION and no Requester row is created — it must not be accepted
          as null nor silently defaulted to an empty string.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          trigger:
            - { call: "POST /records/requesters", payload: { full_name: "No Email", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /records/requesters", payload: { full_name: "No Email", email: "noemail@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
          assert:
            - "first response: HTTP 400 and ${err} == ERR_VALIDATION with data.message naming the email field"
            - "second response: HTTP 201, so the only difference between rejection and acceptance was the missing required field"
            - "Requester.${requester_id}.email == noemail@example.org"
      - name: requester_fee_waiver_pct_computed_from_type_and_indigency
        claim_type: Computed Fields
        grounds:
          - entities.Requester.fields.fee_waiver_pct
          - entities.Requester.fields.indigency_certified
          - entities.Requester.fields.open_request_count
          - "endpoints.POST /records/requesters"
        distinguishing_aspect: |
          fee_waiver_pct is a three-way computed field decided at creation only:
          indigency beats type (1.00 even for a MEDIA filer), MEDIA without indigency
          is 0.25, and COMMERCIAL is 0.00 — indigency_certified defaults to false.
        test_recipe:
          setup:
            - "Empty database; three requesters created back to back with no requests yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          trigger:
            - { call: "POST /records/requesters", payload: { full_name: "Mel Media", email: "mel@press.example", requester_type: "MEDIA" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { media_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Indy Gent", email: "indy@press.example", requester_type: "MEDIA", indigency_certified: true }, as: RecordsClerk, as_user_id: "clerk-1", captures: { indigent_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Comm Broker", email: "broker@data.example", requester_type: "COMMERCIAL" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { commercial_id: $.data.id } }
          assert:
            - "Requester.${media_id}.fee_waiver_pct == 0.25"
            - "Requester.${media_id}.indigency_certified == false"
            - "Requester.${indigent_id}.fee_waiver_pct == 1.00 (indigency overrides the MEDIA rate)"
            - "Requester.${commercial_id}.fee_waiver_pct == 0.00"
            - "all three have open_request_count == 0"
      - name: exemption_claim_ignores_client_supplied_claim_source_extra_field
        claim_type: System Fields
        grounds:
          - entities.ExemptionClaim.fields.claim_source
          - entities.ExemptionClaim.fields.asserted_by_staff_id
          - entities.ExemptionClaim.fields.depicted_individual_id
          - "endpoints.POST /records/responsive-records/{id}/exemption-claims"
          - roles.LegalCounsel
        distinguishing_aspect: |
          claim_source, asserted_by_staff_id and depicted_individual_id are system
          fields: a staff-asserted claim must come back STAFF_ANALYSIS with
          asserted_by_staff_id equal to the caller's X-User-ID even when the payload
          tries to declare DEPICTED_OBJECTION and a forged staff id.
        test_recipe:
          setup:
            - "One COUNSEL StaffMember (level 3), one GENERAL_PUBLIC Requester, one 20-minute ROUTINE recording."
            - "One request clarified once (SCOPING) with one ResponsiveRecord ruled RESPONSIVE, so the request is EXEMPTION_REVIEW."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Dana Counsel", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_a_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0606", device_serial: "AXON-0606", officer_badge: "B-1106", recorded_start_at: "2026-07-27T10:00:00Z", duration_ms: 1200000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-27T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0606", requested_date_from: "2026-07-27T00:00:00Z", requested_date_to: "2026-07-28T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0606" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Arrest sequence only", requested_date_from: "2026-07-27T00:00:00Z", requested_date_to: "2026-07-27T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /records/responsive-records/${rec_id}/exemption-claims", payload: { exemption_code: "PERSONAL_PRIVACY", statutory_citation: "119.071(4)(d)", asserted_scope: "PARTIAL_REDACT", claim_source: "DEPICTED_OBJECTION", asserted_by_staff_id: "00000000-0000-0000-0000-0000000000aa", status: "SUSTAINED", id: "client-chosen-id" }, as: LegalCounsel, as_user_id: "${counsel_a_id}", captures: { claim_id: $.data.id } }
          assert:
            - "HTTP 201"
            - "ExemptionClaim.${claim_id}.claim_source == STAFF_ANALYSIS (the payload's DEPICTED_OBJECTION is ignored)"
            - "ExemptionClaim.${claim_id}.asserted_by_staff_id == ${counsel_a_id} (the forged staff id is ignored)"
            - "ExemptionClaim.${claim_id}.depicted_individual_id == null"
            - "ExemptionClaim.${claim_id}.status == ASSERTED (the payload's SUSTAINED is ignored)"
            - "${claim_id} != client-chosen-id and ExemptionClaim.${claim_id}.version == 1"
      - name: redaction_task_rejects_undeclared_target_type_enum
        claim_type: Type Constraints
        grounds:
          - validations.priority_3
          - errors.ERR_VALIDATION
          - entities.RedactionTask.fields.target_type
          - "endpoints.POST /records/responsive-records/{id}/redaction-tasks"
        distinguishing_aspect: |
          target_type accepts exactly FACE, LICENSE_PLATE, AUDIO_IDENTIFIER and
          PROTECTED_CONTENT; TATTOO is rejected with 400 ERR_VALIDATION before any
          clip-range or certification check runs, and the identical payload with
          FACE then succeeds.
        test_recipe:
          setup:
            - "One TECHNICIAN StaffMember with redaction_certification_level 2 and one RESPONSIVE record on a 20-minute ROUTINE recording (request in EXEMPTION_REVIEW)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Tess Tech", role_type: "TECHNICIAN", redaction_certification_level: 2 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { tech_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0607", device_serial: "AXON-0607", officer_badge: "B-1107", recorded_start_at: "2026-07-28T10:00:00Z", duration_ms: 1200000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-28T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0607", requested_date_from: "2026-07-28T00:00:00Z", requested_date_to: "2026-07-29T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0607" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Arrest sequence only", requested_date_from: "2026-07-28T00:00:00Z", requested_date_to: "2026-07-28T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "TATTOO", clip_start_ms: 0, clip_end_ms: 60000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "FACE", clip_start_ms: 0, clip_end_ms: 60000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_id: $.data.id } }
          assert:
            - "first response: HTTP 400 and ${err} == ERR_VALIDATION"
            - "no RedactionTask exists after the first call: GET /records/redaction-tasks?responsive_record_id=${rec_id} returns total_count == 0"
            - "second response: HTTP 201 and RedactionTask.${task_id}.target_type == FACE"
            - "RedactionTask.${task_id}.status == DRAFT and rework_count == 0 and logged_labor_minutes == 0"
      - name: fee_ledger_entry_is_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.FeeLedgerEntry
          - "endpoints.GET /records/fee-ledger-entries/{id}"
          - "endpoints.POST /records/requests/{id}/payments"
          - calculations.ledger_conservation
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          FeeLedgerEntry is the one entity declared common_fields false: the posted row
          exposes created_at but no version and no updated_at, §1.5 declares no PATCH,
          PUT or DELETE for it, and the only way to undo it is a compensating
          REVERSAL row.
        test_recipe:
          setup:
            - "One GENERAL_PUBLIC Requester, one 60-minute USE_OF_FORCE recording, one request received 2026-08-01."
            - "The record is ruled RESPONSIVE (request EXEMPTION_REVIEW) and a PRESUMPTIVE DIGITAL_DOWNLOAD estimate is issued: review 120 + burden 15 - 60 allowance = 75 billable minutes -> 5250 labor, tier T2 credit 525, total 4725, deposit 2363, so fee_status is DEPOSIT_DUE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0608", device_serial: "AXON-0608", officer_badge: "B-1108", recorded_start_at: "2026-07-29T10:00:00Z", duration_ms: 3600000, classification: "USE_OF_FORCE", retention_category: "EVIDENTIARY_7Y", scheduled_purge_at: "2033-07-29T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0608", requested_date_from: "2026-07-29T00:00:00Z", requested_date_to: "2026-07-30T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0608" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Full incident video", requested_date_from: "2026-07-29T00:00:00Z", requested_date_to: "2026-07-29T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { req_v_est: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DIGITAL_DOWNLOAD", expected_request_version: "${req_v_est}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests/${req_id}/payments", payload: { amount_cents: 2363, memo: "Deposit paid by card" }, as: Requester, as_user_id: "${requester_id}", captures: { entry_id: $.data.id } }
            - { call: "GET /records/fee-ledger-entries/${entry_id}", as: RecordsSupervisor, as_user_id: "supv-1" }
          assert:
            - "HTTP 201 on the payment and HTTP 200 on the read-back"
            - "FeeLedgerEntry.${entry_id}.entry_type == DEPOSIT_PAYMENT"
            - "FeeLedgerEntry.${entry_id}.source_kind == DEPOSIT"
            - "FeeLedgerEntry.${entry_id}.amount_cents == 2363"
            - "FeeLedgerEntry.${entry_id}.reverses_entry_id == null and memo == Deposit paid by card"
            - "the ledger row exposes created_at but exposes neither version nor updated_at, and §1.5 declares no PATCH, PUT or DELETE on /records/fee-ledger-entries/{id}"
            - "PublicRecordsRequest.${req_id}.deposit_paid_cents == 2363"
            - "PublicRecordsRequest.${req_id}.deposit_balance_cents == 2363 (2363 paid + 0 waiver - 0 recognized)"
            - "PublicRecordsRequest.${req_id}.fee_status == DEPOSIT_PAID"
            - "FeeEstimate.${est_id}.estimated_total_cents == 4725 and deposit_required_cents == 2363"
      - name: responsive_record_creation_rejects_unknown_request_or_asset_fk
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_VIDEO_ASSET_NOT_FOUND
          - errors.ERR_REQUESTER_NOT_FOUND
          - entities.ResponsiveRecord.fields.video_asset_id
        distinguishing_aspect: |
          ResponsiveRecord needs both a real path parent and a real body FK, and the
          path id is checked FIRST: a call with an unknown request AND an unknown
          video_asset_id must answer ERR_REQUEST_NOT_FOUND, never
          ERR_VIDEO_ASSET_NOT_FOUND.
        test_recipe:
          setup:
            - "One GENERAL_PUBLIC Requester, one recording and one request in INTAKE (no clarification needed: priorities 4 and 5 run before the state check at priority 8)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0609", device_serial: "AXON-0609", officer_badge: "B-1109", recorded_start_at: "2026-07-30T10:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-30T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0609", requested_date_from: "2026-07-30T00:00:00Z", requested_date_to: "2026-07-31T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0609" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests/00000000-0000-0000-0000-0000000000ff/responsive-records", payload: { video_asset_id: "00000000-0000-0000-0000-0000000000fe" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_path: $.data.error_id } }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "00000000-0000-0000-0000-0000000000fe" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_body: $.data.error_id } }
            - { call: "POST /records/requests", payload: { requester_id: "00000000-0000-0000-0000-0000000000fd", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0609", requested_date_from: "2026-07-30T00:00:00Z", requested_date_to: "2026-07-31T00:00:00Z", scope_narrative: "Orphan request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_requester: $.data.error_id } }
          assert:
            - "first response: HTTP 404 and ${e_path} == ERR_REQUEST_NOT_FOUND (the path id wins over the equally bogus body FK)"
            - "second response: HTTP 404 and ${e_body} == ERR_VIDEO_ASSET_NOT_FOUND"
            - "third response: HTTP 404 and ${e_requester} == ERR_REQUESTER_NOT_FOUND"
            - "GET /records/responsive-records?request_id=${req_id} returns total_count == 0, so no partial row was written"
      - name: graph_topology_same_asset_serves_two_requests_independently
        claim_type: Many-to-many junction
        grounds:
          - complexity_profile.entity_topology
          - complexity_profile.relationship_patterns
          - entities.ResponsiveRecord
          - entities.VideoAsset.fields.retention_locked
          - entities.PublicRecordsRequest.fields.responsive_record_count
        distinguishing_aspect: |
          ResponsiveRecord is the junction of the request-asset graph: one recording
          requested by two filers yields two independent rows, and EXCLUDING it on
          one request leaves the other request's row RESPONSIVE while the asset stays
          retention_locked because of that surviving open request.
        test_recipe:
          setup:
            - "Two GENERAL_PUBLIC Requesters, one 10-minute ROUTINE recording, two requests (both clarified once) over the same incident."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Ann One", email: "ann@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_a: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Bob Two", email: "bob@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_b: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0610", device_serial: "AXON-0610", officer_badge: "B-1110", recorded_start_at: "2026-07-31T10:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-31T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_a}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0610", requested_date_from: "2026-07-31T00:00:00Z", requested_date_to: "2026-08-01T00:00:00Z", scope_narrative: "Ann's request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_a: $.data.id, req_a_v1: $.data.version } }
            - { call: "POST /records/requests/${req_a}/scope-clarification", payload: { scope_narrative: "Ann narrowed", requested_date_from: "2026-07-31T00:00:00Z", requested_date_to: "2026-07-31T23:59:59Z", expected_request_version: "${req_a_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_b}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0610", requested_date_from: "2026-07-31T00:00:00Z", requested_date_to: "2026-08-01T00:00:00Z", scope_narrative: "Bob's request" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_b: $.data.id, req_b_v1: $.data.version } }
            - { call: "POST /records/requests/${req_b}/scope-clarification", payload: { scope_narrative: "Bob narrowed", requested_date_from: "2026-07-31T00:00:00Z", requested_date_to: "2026-07-31T23:59:59Z", expected_request_version: "${req_b_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /records/requests/${req_a}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_a: $.data.id } }
            - { call: "POST /records/requests/${req_b}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_b: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_a}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_b}/inclusion", payload: { inclusion_status: "EXCLUDED" }, as: RecordsClerk, as_user_id: "clerk-1" }
          assert:
            - "${rec_a} != ${rec_b} and both rows carry video_asset_id == ${asset_id}"
            - "ResponsiveRecord.${rec_a}.inclusion_status == RESPONSIVE"
            - "ResponsiveRecord.${rec_b}.inclusion_status == EXCLUDED"
            - "PublicRecordsRequest.${req_a}.responsive_record_count == 1 and processing_status == EXEMPTION_REVIEW"
            - "PublicRecordsRequest.${req_b}.responsive_record_count == 0 (EXCLUDED rows do not count) and processing_status == SCOPING"
            - "VideoAsset.${asset_id}.retention_locked == true, held by Ann's still-open request alone"
            - "GET /records/responsive-records?video_asset_id=${asset_id} returns total_count == 2"
      - name: duplicate_depicted_label_rejected_per_video_asset
        claim_type: Uniqueness
        grounds:
          - validations.priority_17
          - errors.ERR_DUPLICATE_DEPICTED_LABEL
          - entities.DepictedIndividual.fields.display_label
          - "endpoints.POST /records/video-assets/{id}/depicted-individuals"
        distinguishing_aspect: |
          display_label is unique per video_asset_id, not globally: the same label
          Subject A is rejected on the recording that already holds it and accepted on
          a different recording in the same call sequence.
        test_recipe:
          setup:
            - "Two recordings and one VICTIM DepictedIndividual labelled Subject A on the first."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0611", device_serial: "AXON-0611", officer_badge: "B-1111", recorded_start_at: "2026-07-31T11:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-31T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_one: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0612", device_serial: "AXON-0612", officer_badge: "B-1112", recorded_start_at: "2026-07-31T12:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-31T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_two: $.data.id } }
            - { call: "POST /records/video-assets/${asset_one}/depicted-individuals", payload: { display_label: "Subject A", relationship: "VICTIM" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_one: $.data.id } }
          trigger:
            - { call: "POST /records/video-assets/${asset_one}/depicted-individuals", payload: { display_label: "Subject A", relationship: "WITNESS" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /records/video-assets/${asset_two}/depicted-individuals", payload: { display_label: "Subject A", relationship: "WITNESS" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_two: $.data.id } }
          assert:
            - "first response: HTTP 409 and ${err} == ERR_DUPLICATE_DEPICTED_LABEL"
            - "second response: HTTP 201, so uniqueness is scoped to the recording"
            - "VideoAsset.${asset_one}.depicted_individual_count == 1"
            - "VideoAsset.${asset_two}.depicted_individual_count == 1"
            - "DepictedIndividual.${di_one}.notification_required == true and notification_status == PENDING"
            - "DepictedIndividual.${di_two}.notification_required == true and notification_status == PENDING"

  - section: state_machines
    instances:
      - name: request_starts_in_intake_with_fee_not_assessed
        claim_type: Initial State
        grounds:
          - state_machines.PublicRecordsRequest.processing_status.initial_state.INTAKE
          - state_machines.PublicRecordsRequest.fee_status.initial_state.NOT_ASSESSED
          - calculations.statutory_deadline
          - entities.PublicRecordsRequest.fields.tolled_days
          - entities.Requester.fields.open_request_count
        distinguishing_aspect: |
          Both parallel dimensions of a brand-new request are pinned in the same
          response: processing_status INTAKE and fee_status NOT_ASSESSED, with a
          statutory deadline already struck at received_at + 20 days even though no
          record has been ruled responsive yet.
        test_recipe:
          setup:
            - "One GENERAL_PUBLIC Requester; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0613", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0613" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id } }
          assert:
            - "HTTP 201"
            - "PublicRecordsRequest.${req_id}.processing_status == INTAKE"
            - "PublicRecordsRequest.${req_id}.fee_status == NOT_ASSESSED"
            - "PublicRecordsRequest.${req_id}.scope_clarification_count == 0"
            - "PublicRecordsRequest.${req_id}.extension_days_granted == 0"
            - "PublicRecordsRequest.${req_id}.tolled_days == 0"
            - "PublicRecordsRequest.${req_id}.is_critical_incident == false"
            - "PublicRecordsRequest.${req_id}.statutory_deadline_at == 2026-08-21T00:00:00Z"
            - "PublicRecordsRequest.${req_id}.responsive_record_count == 0 and unadjudicated_claim_count == 0 and open_notification_count == 0"
            - "PublicRecordsRequest.${req_id}.estimated_total_cents == 0 and deposit_required_cents == 0 and invoiced_total_cents == 0 and deposit_paid_cents == 0 and deposit_balance_cents == 0 and billable_labor_minutes == 0"
            - "PublicRecordsRequest.${req_id}.version == 1"
            - "Requester.${requester_id}.open_request_count == 1"
      - name: depicted_individual_initialises_in_not_required_for_non_protected_roles
        claim_type: Initial State
        grounds:
          - state_machines.DepictedIndividual.transitions.PENDING->NOT_REQUIRED
          - entities.DepictedIndividual.fields.notification_required
          - "endpoints.POST /records/video-assets/{id}/depicted-individuals"
        distinguishing_aspect: |
          The initialisation branch is decided by relationship alone: BYSTANDER,
          OFFICER and SUSPECT rows are born terminal in NOT_REQUIRED with
          notification_required false, while a JUVENILE row is born PENDING — no
          notification call is ever needed to settle the first three.
        test_recipe:
          setup:
            - "One recording with no depicted individuals yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0614", device_serial: "AXON-0614", officer_badge: "B-1114", recorded_start_at: "2026-07-31T13:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-31T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
          trigger:
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Bystander 1", relationship: "BYSTANDER" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_bystander: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Officer 1", relationship: "OFFICER" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_officer: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Suspect 1", relationship: "SUSPECT" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_suspect: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "Juvenile 1", relationship: "JUVENILE" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { di_juvenile: $.data.id } }
          assert:
            - "DepictedIndividual.${di_bystander}.notification_status == NOT_REQUIRED and notification_required == false"
            - "DepictedIndividual.${di_officer}.notification_status == NOT_REQUIRED and notification_required == false"
            - "DepictedIndividual.${di_suspect}.notification_status == NOT_REQUIRED and notification_required == false"
            - "DepictedIndividual.${di_juvenile}.notification_status == PENDING and notification_required == true"
            - "all four rows have notified_at == null, objection_deadline_at == null, notice_method == null and objection_basis == null"
            - "VideoAsset.${asset_id}.depicted_individual_count == 4"
      - name: adjudicating_a_sustained_claim_twice_returns_already_adjudicated
        claim_type: Idempotency
        grounds:
          - state_machines.ExemptionClaim.transitions.ASSERTED->SUSTAINED
          - state_machines.ExemptionClaim.terminal_states
          - validations.priority_8
          - errors.ERR_CLAIM_ALREADY_ADJUDICATED
          - state_machines.PublicRecordsRequest.processing_status.transitions.EXEMPTION_REVIEW->REDACTION
        distinguishing_aspect: |
          The second adjudication of the same claim is a 409 ERR_CLAIM_ALREADY_ADJUDICATED
          (not a silent re-run and not the generic ERR_REQUEST_STATE_INVALID), and the
          first decision's adjudicated_at, disposition and downstream record posture are
          all left untouched.
        test_recipe:
          setup:
            - "Two COUNSEL StaffMembers (Dana asserts, Rex adjudicates)."
            - "One 20-minute ROUTINE recording; one request clarified once with the record ruled RESPONSIVE."
            - "One PERSONAL_PRIVACY PARTIAL_REDACT claim asserted by Dana, then SUSTAINED by Rex: the record becomes RESTRICTED with presumptive and adjudicated burden both 13 (baseline 5 + 8) and the request auto-advances EXEMPTION_REVIEW -> REDACTION."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Dana Counsel", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_a_id: $.data.id } }
            - { call: "POST /records/staff", payload: { full_name: "Rex Counsel", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_b_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
