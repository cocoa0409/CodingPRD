            - "${e_partial} == \"ERR_INVALID_LOT_STATE\" for the same reason after only SPARK has passed - one half of the inline pair does not promote the lot"
            - "the 2.4 kV HIPOT row is written with result \"FAIL\" (2.4 < 2.5) and drives quality_state to \"NONCONFORMING\" while process_state stays \"EXTRUDED\""
            - "${e_state} == \"ERR_INVALID_LOT_STATE\" with HTTP 409: release is declared only from quality_state PENDING"
            - "the REWORK disposition returns quality_state to \"PENDING\", sets rework_count 1, rewinds process_state to \"STRANDED\" and clears measured_min_wall_mils, measured_max_wall_mils, measured_avg_od_mm, surface_marking_text and concentricity_pct"
            - "after the re-extrusion and the 2.5 kV HIPOT PASS the latest SPARK row (retained from before the rework) and the latest HIPOT row are both PASS, so process_state == \"TESTED\" with quality_state == \"PENDING\" - and GET /production-lots/${lot_id}/tests still returns 3 rows, one of them the FAIL"
            - "${e_failed} == \"ERR_LOT_TEST_FAILED\" with HTTP 422: priorities 40, 50, 52 and 54 are all satisfied now, so the retained FAIL row is what blocks the release"
            - "ProductionLot.${lot_id}.quality_state is still \"PENDING\" and packaged_length_ft is still null - a lot that ever failed a test can be re-tested to TESTED but never released"

      - name: rework_limit_of_two_is_enforced_then_the_lot_must_be_scrapped
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_REWORK_LIMIT_EXCEEDED]
          - state_machines.ProductionLot.transitions.NONCONFORMING_to_PENDING
          - calculations.rod_mass_ledger
        distinguishing_aspect: "REWORK_LIMIT is 2 and the guard is rework_count < 2, so the third attempt is refused while the lot sits at NONCONFORMING with nowhere to go but SCRAPPED - and the scrap then moves 99.00 lbs from committed to scrapped without tripping the 10 percent quarantine threshold (99.00 / 20000.00 = 0.50 percent)."
        test_recipe:
          setup:
            - "SKU THHN-12-CU with the default concentricity_min_pct of 85; lot LOT-A extruded at 24.0 / 30.0 mils, i.e. concentricity 80.00, so it lands NONCONFORMING each time."
