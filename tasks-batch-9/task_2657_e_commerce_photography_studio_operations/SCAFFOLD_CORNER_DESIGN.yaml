        grounds:
          - state_machines.Sample.IN_STUDIO_to_LOST
          - state_machines.Style.SCHEDULED_to_BLOCKED
          - state_machines.ShotListItem.ASSIGNED_to_BLOCKED
        excluded_because:
          difficulty_instance: transitive_cascade / report_lost_sample_blocks_style_then_items_then_unlocks_session
          rationale: "The four-level downward cascade and its non-terminal-children restriction are asserted end to end there."

      - name: style_completes_once_every_required_item_owns_a_delivered_asset
        claim_type: bubble_up
        grounds:
          - state_machines.Style.IN_POST_to_DELIVERED
          - entities.Style.fields.delivered_asset_count
        excluded_because:
          difficulty_instance: transitive_cascade / deliver_asset_completes_style_and_pushes_sample_into_return_queue
          rationale: "That instance asserts the parent Style auto-transitioning to DELIVERED off the last child delivery, plus the onward sample cascade."

      - name: booking_cancellation_reverses_every_ledger_it_posted
        claim_type: compensation
        grounds:
          - state_machines.TalentBooking.CONFIRMED_to_CANCELLED
          - entities.ShootSession.fields.committed_talent_cost_cents
        excluded_because:
          difficulty_instance: compensating_invariant / cancelling_a_confirmed_booking_unwinds_the_session_money_commitment_to_zero
          rationale: "Money and minute reversal with no residue is asserted there with literal before/after values."

      - name: vendor_custody_ledger_reconciles_after_every_custody_exit
        claim_type: ledger_sync
        grounds:
          - calculations.custody_ledger_counters
          - entities.Vendor.fields.outstanding_sample_count
        excluded_because:
          difficulty_instance: compensating_invariant / vendor_outstanding_count_drains_the_same_way_for_a_return_and_for_a_write_off
          rationale: "Both custody exit doors are driven and the ancestor counter is reconciled to 0 with the strike count pinned."

      - name: locking_is_guarded_by_a_sample_state_two_hops_away
        claim_type: guarded transitions
        grounds:
          - state_machines.ShootSession.BOOKED_to_LOCKED
          - validations[priority=46].ERR_SAMPLE_NOT_IN_STUDIO
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / session_lock_blocked_by_sample_custody_then_admitted_after_the_box_hits_the_rack
          rationale: "The cross-entity guard is asserted in both directions - refused while RECEIVED, admitted once IN_STUDIO."

  # ==================================================== Table 3: calculations
  - section: calculations
    instances:
      - name: booking_charge_of_a_four_hour_photographer_call_is_forty_eight_thousand_cents
        claim_type: correct_result
        grounds:
          - calculations.talent_booking_charge
          - entities.TalentBooking.fields.charge_cents
          - entities.TalentBooking.fields.booked_minutes
        distinguishing_aspect: "Photographer at 12000 cents/hour booked 09:00-13:00 with minimum_call_hours 4 and max_daily_minutes 480: billable 240, all regular, base = round_half_up(12000 * 240 / 60) = 48000, no overtime, and the 80000 day-rate cap is not binding."
        test_recipe:
          setup:
            - "One MODEL station, one provider, photographer Pia Ren (12000/h, 80000 day, min call 4h, max 480 min/day) and a BOOKED 09:00-13:00 session."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
          trigger:
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk_id: $.data.id }
          assert:
            - "response status == 201"
            - "TalentBooking.${bk_id}.booked_minutes == 240"
            - "TalentBooking.${bk_id}.regular_minutes == 240"
            - "TalentBooking.${bk_id}.overtime_minutes == 0"
            - "TalentBooking.${bk_id}.charge_cents == 48000"
            - "TalentProfile.${ph_id}.booked_minutes_today == 240"

      - name: prior_minutes_ignores_cancelled_bookings_and_other_calendar_dates
        claim_type: input_set_filtering
        grounds:
          - calculations.talent_booking_charge.input_set
          - state_machines.TalentBooking.HELD_to_CANCELLED
        distinguishing_aspect: "The model already has a CANCELLED 240-minute booking on 03 Aug and a HELD 240-minute booking on 04 Aug; neither may feed prior_minutes, so the new 03 Aug booking is charged wholly at the regular rate (100000) instead of wholly as overtime (150000)."
        test_recipe:
          setup:
            - "Model Ada Vell: 25000/h, day rate 150000, minimum_call_hours 0, max_daily_minutes 240."
            - "Session A on 03 Aug spans 09:00-18:00; session B on 04 Aug spans 09:00-13:00."
            - "Booking A1 (03 Aug 09:00-13:00) is created then CANCELLED; booking B1 (04 Aug 09:00-13:00) stays HELD."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Ada Vell", talent_type: "MODEL", hourly_rate_cents: 25000, day_rate_cents: 150000, minimum_call_hours: 0, max_daily_minutes: 240 }
              as: StudioAdmin
              captures: { md_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T18:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 900000 }
              as: Producer
              captures: { sesA_id: $.data.id, sesA_v1: $.data.version }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 900000 }
              as: Producer
              captures: { sesB_id: $.data.id, sesB_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${sesA_id}", talent_id: "${md_id}", role_on_set: "MODEL", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${sesA_v1}" }
