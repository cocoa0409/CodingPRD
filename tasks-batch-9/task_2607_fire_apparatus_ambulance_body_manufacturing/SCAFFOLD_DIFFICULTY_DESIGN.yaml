  - rule_id: resource_temporal_overlap
    instances:

      - name: slot_window_half_open_comparison_with_seven_day_changeover_buffer
        grounds:
          - calculations.slot_window_conflict
          - calculations.slot_line_utilization
          - validations[priority=38]
          - errors.ERR_SLOT_WINDOW_CONFLICT
        distinguishing_aspect: |
          The window test is half-open but each occupying window is first inflated by
          changeover_buffer_days on BOTH sides, so back-to-back booking is a conflict
          and the first admissible start is exactly existing.slot_end_date + 7 days,
          while a window ending exactly on the inflated start is admitted.
        test_recipe:
          setup:
            - "one ApparatusProgram ACTIVE and one SupplierSlotLine with total_slot_count 4 and changeover_buffer_days 7 (default)"
            - "one occupying RESERVED ChassisReservation with slot_start_date 2026-09-01 and slot_end_date 2026-09-15 (inflated window 2026-08-25 .. 2026-09-22)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Slot geometry program", agency_name: "Cedar Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, v0: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v0}" }
