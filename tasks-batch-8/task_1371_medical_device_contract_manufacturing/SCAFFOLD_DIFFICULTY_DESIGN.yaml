            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-P", name: "Plastics Inc" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-P", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-P", description: "casing", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 100 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-P", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-P" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
