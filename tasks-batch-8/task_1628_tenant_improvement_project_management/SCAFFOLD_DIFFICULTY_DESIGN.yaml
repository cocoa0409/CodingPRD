  - rule_id: compensating_invariant
    instances:
      - name: allowance_pool_conservation_across_approve_and_void
        grounds:
          - state_machines.DisbursementRequest.SUBMITTED_to_APPROVED
          - state_machines.DisbursementRequest.APPROVED_to_VOIDED
          - calculations.allowance_consumption
        distinguishing_aspect: |
          Conserved quantity = the allowance pool split: for every approve/void
          pair, allowance_consumed_cents + allowance_remaining_cents ==
          allowance_total_cents (50000000) with zero drift; distinct quantity
          from the retainage-escrow sibling.
