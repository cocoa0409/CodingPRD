scenario: "2255. Theatrical Capitalization & Investor Reporting (Broadway general management office): capitalization budget with production, rehearsal, advertising and reserve components, investor syndication with limited partnership or limited liability company offering documents and subscription processing, weekly operating budget with running costs, royalty pools and break-even calculation, royalty pool structure converting fixed royalties into a percentage of weekly operating profit, weekly wrap reporting with grosses, attendance, capacity and running expenses, recoupment tracking against capitalization with investor distribution once recouped, subsidiary rights participation and licensing income allocation to investors, closing decisions with notice requirements, closing costs and reserve release"

domain_name: theatrical-capitalization-investor-reporting

api_prefix: ""           # flat peer collections: /productions, /weekly-wraps, /subscriptions, ...

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parentage is expressed
  # exclusively through FK fields in request bodies (`production_id`,
  # `offering_document_id`, `wrap_id`, ...). No nested resource paths.

  state_machine_shape: parallel
  # Production carries TWO independent state axes (offering_status x
  # operating_status) that evolve on the same row; Subscription, WeeklyWrap and
  # RoyaltyParticipant each carry a cycle; Subscription additionally branches on
  # a single trigger (return-for-cure -> RETURNED_FOR_CURE or -> REJECTED).

  relationship_patterns:
    - one_to_many          # Production -> BudgetLine / WeeklyWrap / OfferingDocument / ...
    - many_to_many         # Investor <-> Production via InvestorAccount; RoyaltyParticipant <-> WeeklyWrap via RoyaltyAllocation
    - cross_aggregate      # WeeklyWrap pins OperatingBudget.version; ClosingNotice drives BudgetLine

  role_model: segregation_of_duties
  # Wrap submitter may not certify it; closing-notice issuer may not settle it.
  # Beyond that, roles own disjoint resource families (peer-role flavour).

  consistency_model: immediate

  difficulty_level: "beyond Expert"
  # 15 entities / 69 endpoints / 48 error codes / 10 calculations (2 dual-variant)
  # / 13 state machines. Density target: every mutation on a WeeklyWrap or a
  # Subscription re-derives at least three fields on Production.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Theatre
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: House name as printed on the license agreement
        constraints: "1..120 chars"
      - name: seat_count
        type: integer
        source: input
        description: Sellable seats per performance; drives capacity gross
        constraints: ">= 1"
      - name: top_ticket_price_cents
        type: integer
        source: input
        description: Highest scaled ticket price; capacity gross uses this price for every seat
        constraints: ">= 1"
      - name: changeover_buffer_days
        type: integer
        source: input
        default: 3
        description: Dark days required between two engagements in this house; used by the TheatreEngagement overlap rule
        constraints: ">= 0"
      - name: weekly_fixed_rent_cents
        type: integer
        source: input
        default: 0
        description: Informational weekly house rent; not used by any calculation
        constraints: ">= 0"

  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Show title
        constraints: "1..200 chars"
      - name: offering_entity_type
        type: enum
        source: input
        description: Legal form of the producing entity
        constraints: "LP | LLC"
      - name: capitalization_target_cents
        type: integer
        source: input
        description: Total capitalization to be raised; the recoupment denominator
        constraints: ">= 1"
      - name: reserve_target_cents
        type: integer
        source: input
        description: Target size of the closing reserve component of the capitalization budget
        constraints: ">= 0"
      - name: theatre_id
        type: string
        source: input
        description: "FK -> Theatre.id; the performance house whose seat_count and top_ticket_price_cents define capacity gross for every WeeklyWrap of this Production"
      - name: pre_recoupment_pool_pct
        type: number
        source: input
        default: 0.3500
        description: Royalty-pool percentage of weekly operating profit applied while recoupment_status == UNRECOUPED
        constraints: "4 decimals, 0.0000 <= x < 1.0000"
      - name: post_recoupment_pool_pct
        type: number
        source: input
        default: 0.4000
        description: Royalty-pool percentage of weekly operating profit applied once recoupment_status == RECOUPED
        constraints: "4 decimals, 0.0000 <= x < 1.0000"
      - name: subsidiary_rights_investor_share_pct
        type: number
        source: input
        default: 0.4000
        description: Investor participation in subsidiary rights licensing income
        constraints: "4 decimals, 0.0000 <= x <= 1.0000"
      - name: closing_notice_min_days
        type: integer
        source: input
        default: 14
        description: Minimum whole days between ClosingNotice.notice_date and final_performance_date
        constraints: ">= 0"
      - name: royalty_basis
        type: enum
        source: system
        default: FIXED_GROSS
        description: Which variant of wrap_settlement applies; flipped once by POST /productions/{id}/convert-royalties-to-pool
        constraints: "FIXED_GROSS | POOL"
      - name: offering_status
        type: enum
        source: system
        default: DRAFT
        description: Syndication axis of the Production state (independent of operating_status)
        constraints: "DRAFT | OFFERING | FULLY_SUBSCRIBED | CAPITALIZED"
      - name: operating_status
        type: enum
        source: system
        default: PRE_PRODUCTION
        description: Production-calendar axis of the Production state (independent of offering_status)
        constraints: "PRE_PRODUCTION | REHEARSAL | PREVIEWS | RUNNING | CLOSING_NOTICE | CLOSED"
      - name: recoupment_status
        type: enum
        source: computed
        default: UNRECOUPED
        description: RECOUPED once recouped_amount_cents >= capitalization_target_cents (see recoupment_progress)
        constraints: "UNRECOUPED | RECOUPED"
      - name: budget_status
        type: enum
        source: system
        default: DRAFT
        description: Capitalization-budget approval state; BudgetLine commitment requires APPROVED
        constraints: "DRAFT | APPROVED"
      - name: budget_total_cents
        type: integer
        source: computed
        description: Sum of BudgetLine.amount_cents for this Production with commitment_status IN {PLANNED, COMMITTED, SPENT}
      - name: budget_committed_cents
        type: integer
        source: computed
        description: Sum of BudgetLine.amount_cents for this Production with commitment_status IN {COMMITTED, SPENT}
      - name: capital_raised_cents
        type: integer
        source: computed
        description: Sum of Subscription.amount_cents with status == ACCEPTED across all OfferingDocuments of this Production
      - name: released_capital_cents
        type: integer
        source: computed
        description: Capital released from escrow to the producing entity; set to capital_raised_cents by POST /productions/{id}/capitalize, otherwise 0
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: capital_raised_cents - released_capital_cents
      - name: recouped_amount_cents
        type: integer
        source: computed
        description: Cash-basis recoupment ledger (see recoupment_progress, variant CASH_BASIS)
      - name: recoupment_pct
        type: number
        source: computed
        description: round_half_up(recouped_amount_cents / capitalization_target_cents, 4)
        constraints: "4 decimals"
      - name: deferred_royalty_cents
        type: integer
        source: computed
        description: Accrued but unpaid royalty minimum guarantees from wraps whose royalty_base_cents was 0; reduces the ACCRUAL_BASIS recoupment variant only
      - name: distributed_total_cents
        type: integer
        source: computed
        description: Sum of InvestorDistribution.total_amount_cents for this Production with status IN {DECLARED, PAID}
      - name: distributable_cash_cents
        type: integer
        source: computed
        description: max(0, recouped_amount_cents - distributed_total_cents)
      - name: total_pool_points
        type: integer
        source: computed
        description: Sum of RoyaltyParticipant.pool_points for this Production with status == ACTIVE
      - name: active_investor_count
        type: integer
        source: computed
        description: Count of InvestorAccount rows for this Production with units_total > 0

  - name: TheatreEngagement
    parent: null
    common_fields: false
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production occupying the house"
      - name: theatre_id
        type: string
        source: input
        description: "FK -> Theatre.id; the occupied house, and the resource against which overlap is detected"
      - name: engagement_type
        type: enum
        source: input
        description: Purpose of the occupation
        constraints: "REHEARSAL | TECH | PERFORMANCE_RUN"
      - name: start_date
        type: string
        source: input
        description: First occupied calendar day (ISO 8601 date, inclusive)
      - name: end_date
        type: string
        source: input
        description: Last occupied calendar day (ISO 8601 date, inclusive)
        constraints: ">= start_date"

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the capitalization budget this line belongs to"
      - name: component
        type: enum
        source: input
        description: Capitalization budget component
        constraints: "PRODUCTION | REHEARSAL | ADVERTISING | RESERVE | BONDS_AND_DEPOSITS"
      - name: description
        type: string
        source: input
        description: Line item description
        constraints: "1..200 chars"
      - name: amount_cents
        type: integer
        source: input
        description: Budgeted amount for this line
        constraints: ">= 1"
      - name: commitment_status
        type: enum
        source: system
        default: PLANNED
        description: Commitment lifecycle of the line
        constraints: "PLANNED | COMMITTED | SPENT"

  - name: OfferingDocument
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production being syndicated"
      - name: doc_type
        type: enum
        source: input
        description: Offering instrument; must agree with Production.offering_entity_type
        constraints: "LP_AGREEMENT | LLC_OPERATING_AGREEMENT"
      - name: offering_amount_cents
        type: integer
        source: input
        description: Maximum aggregate subscription amount this document may accept
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: Price of one investment unit
        constraints: ">= 1"
      - name: max_investors
        type: integer
        source: input
        description: Maximum number of distinct investors with an ACCEPTED subscription under this document
        constraints: ">= 1"
      - name: effective_date
        type: string
        source: input
        description: First day the document may be made EFFECTIVE (ISO 8601 date, inclusive)
      - name: expiration_date
        type: string
        source: input
        description: Last day the document remains EFFECTIVE (ISO 8601 date, inclusive)
        constraints: ">= effective_date"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Offering document lifecycle
        constraints: "DRAFT | EFFECTIVE | EXPIRED | WITHDRAWN"
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason recorded by POST /offering-documents/{id}/withdraw; null otherwise
      - name: submitted_units_total
        type: integer
        source: computed
        description: Sum of Subscription.units under this document with status == SUBMITTED
      - name: accepted_units_total
        type: integer
        source: computed
        description: Sum of Subscription.units under this document with status == ACCEPTED
      - name: accepted_amount_cents
        type: integer
        source: computed
        description: Sum of Subscription.amount_cents under this document with status == ACCEPTED
      - name: accepted_investor_count
        type: integer
        source: computed
        description: Count of distinct investor_id values with an ACCEPTED subscription under this document

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Investor legal name as it appears on the subscription agreement
        constraints: "1..200 chars"
      - name: jurisdiction
        type: string
        source: input
        description: Two-letter US state or ISO country code of the investor's domicile
        constraints: "2..2 chars"
      - name: contact_email
        type: string
        source: input
        description: Investor relations contact address
      - name: accreditation_status
        type: enum
        source: system
        default: UNVERIFIED
        description: Securities accreditation determination; only ACCREDITED investors may subscribe
        constraints: "UNVERIFIED | ACCREDITED | NON_ACCREDITED"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: offering_document_id
        type: string
        source: input
        description: "FK -> OfferingDocument.id; the instrument subscribed under"
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the subscribing investor and the X-User-ID the Investor role must present"
      - name: units
        type: integer
        source: input
        description: Number of units subscribed for
        constraints: ">= 1"
      - name: amount_cents
        type: integer
        source: computed
        description: units * OfferingDocument.unit_price_cents, recomputed on every resubmit
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Subscription processing lifecycle
        constraints: "SUBMITTED | RETURNED_FOR_CURE | ACCEPTED | REJECTED | RESCINDED"
      - name: cure_round_count
        type: integer
        source: system
        default: 0
        description: Number of times this subscription has been returned for cure; a return that would raise it above MAX_CURE_ROUNDS rejects the subscription instead
      - name: defect_note
        type: string
        source: input
        description: Latest defect note recorded by POST /subscriptions/{id}/return-for-cure; null otherwise
      - name: rescission_reason
        type: string
        source: input
        description: Reason recorded by POST /subscriptions/{id}/rescind; null otherwise

  - name: InvestorAccount
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production the capital account belongs to"
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the account holder"
      - name: units_total
        type: integer
        source: computed
        description: Sum of Subscription.units for this investor across all OfferingDocuments of this Production with status == ACCEPTED
      - name: contributed_cents
        type: integer
        source: computed
        description: Sum of Subscription.amount_cents for this investor with status == ACCEPTED
      - name: ownership_pct
        type: number
        source: computed
        description: Share of the production's accepted units (see investor_ownership_allocation); 6 decimals
        constraints: "6 decimals, 0.000000 .. 1.000000"
      - name: basis
        type: enum
        source: computed
        default: RECOUPMENT_RETURN
        description: Flips to NET_PROFIT for every account of the Production when recoupment_status becomes RECOUPED, and back to RECOUPMENT_RETURN if recoupment is reversed
        constraints: "RECOUPMENT_RETURN | NET_PROFIT"
      - name: recoupment_credited_cents
        type: integer
        source: computed
        description: round_half_up(Production.recouped_amount_cents * ownership_pct) at the moment of the most recent recoupment recompute
      - name: declared_distribution_cents
        type: integer
        source: computed
        description: Cumulative sum of this account's share across InvestorDistribution rows with status IN {DECLARED, PAID}
      - name: distributions_paid_cents
        type: integer
        source: computed
        description: Cumulative sum of this account's share across InvestorDistribution rows with status == PAID

  - name: OperatingBudget
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production this weekly operating budget governs"
      - name: weekly_fixed_running_cost_cents
        type: integer
        source: input
        description: Budgeted weekly running cost used by break_even_analysis (actual running costs are reported per wrap)
        constraints: ">= 1"
      - name: variable_cost_pct
        type: number
        source: input
        description: Credit-card fees plus group commissions as a fraction of gross receipts; converts gross to adjusted gross
        constraints: "4 decimals, 0.0000 <= x < 1.0000"
      - name: performances_per_week
        type: integer
        source: input
        default: 8
        description: Scheduled performances per week used by break_even_analysis for the capacity-gross projection
        constraints: "1 .. 16"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Only one budget per Production may be ACTIVE; activating a second supersedes the first
        constraints: "DRAFT | ACTIVE | SUPERSEDED"

  - name: RoyaltyParticipant
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production the royalty is payable by"
      - name: participant_name
        type: string
        source: input
        description: Royalty participant legal name
        constraints: "1..200 chars"
      - name: role
        type: enum
        source: input
        description: Creative or producing role the royalty attaches to
        constraints: "AUTHOR | COMPOSER | DIRECTOR | CHOREOGRAPHER | DESIGNER | LEAD_PRODUCER | STAR"
      - name: fixed_gross_pct
        type: number
        source: input
        description: Contractual royalty as a fraction of adjusted gross; used only by wrap_settlement variant FIXED_GROSS_BASIS
        constraints: "4 decimals, 0.0000 <= x < 1.0000"
      - name: pool_points
        type: integer
        source: input
        description: Points in the royalty pool; used only by wrap_settlement variant POOL_BASIS
        constraints: ">= 0"
      - name: min_guarantee_cents
        type: integer
        source: input
        description: Weekly minimum guarantee; participates ONLY in the aggregate pool floor and in the deferral accrual. Per-participant guarantees are never topped up.
        constraints: ">= 0"
      - name: pool_share_pct
        type: number
        source: computed
        description: See royalty_pool_share_pct; 0.0000 while status == TERMINATED
        constraints: "4 decimals"
      - name: cumulative_royalty_cents
        type: integer
        source: computed
        description: Sum of RoyaltyAllocation.allocated_cents for this participant with status == ALLOCATED
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Participation state; only ACTIVE participants enter the pool floor, the point total and the split
        constraints: "ACTIVE | TERMINATED"

  - name: WeeklyWrap
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production being wrapped, and the resource against which performance-week overlap is detected"
      - name: operating_budget_id
        type: string
        source: system
        description: "FK -> OperatingBudget.id; the ACTIVE operating budget selected at wrap creation/amendment"
      - name: operating_budget_version_pinned
        type: integer
        source: system
        description: OperatingBudget.version observed when this wrap was created or last amended; certification requires it to still match
      - name: week_ending_date
        type: string
        source: input
        description: Last day of the performance week (ISO 8601 date); the wrap occupies the half-open interval [week_ending_date - 7 days, week_ending_date)
      - name: performances
        type: integer
        source: input
        description: Performances actually played in the week
        constraints: "1 .. 16"
      - name: gross_receipts_cents
        type: integer
        source: input
        description: Box-office gross receipts for the week
        constraints: ">= 0"
      - name: paid_attendance
        type: integer
        source: input
        description: Paid admissions for the week
        constraints: ">= 0"
      - name: running_expenses_cents
        type: integer
        source: input
        description: Actual weekly running expenses excluding all royalties
        constraints: ">= 0"
      - name: capacity_gross_cents
        type: integer
        source: computed
        description: Theatre.seat_count * Theatre.top_ticket_price_cents * performances
      - name: paid_capacity_pct
        type: number
        source: computed
        description: round_half_up(paid_attendance / (Theatre.seat_count * performances), 4)
        constraints: "4 decimals"
      - name: variable_cost_cents
        type: integer
        source: computed
        description: round_half_up(gross_receipts_cents * OperatingBudget.variable_cost_pct)
      - name: adjusted_gross_cents
        type: integer
        source: computed
        description: gross_receipts_cents - variable_cost_cents
      - name: royalty_base_cents
        type: integer
        source: computed
        description: max(0, adjusted_gross_cents - running_expenses_cents)
      - name: royalty_basis_applied
        type: enum
        source: computed
        description: Production.royalty_basis captured at certification; determines which wrap_settlement variant produced royalty_pool_cents
        constraints: "FIXED_GROSS | POOL"
      - name: royalty_pool_cents
        type: integer
        source: computed
        description: Total royalty burden for the week under the applied variant (see wrap_settlement)
      - name: weekly_operating_profit_cents
        type: integer
        source: computed
        description: royalty_base_cents - royalty_pool_cents
      - name: deferred_royalty_added_cents
        type: integer
        source: computed
        description: Minimum guarantees deferred by this wrap (non-zero only when royalty_base_cents == 0 under POOL basis)
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Wrap reporting lifecycle
        constraints: "DRAFT | SUBMITTED | CERTIFIED | DISPUTED | AMENDED | VOID"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who submitted the wrap; the certifier must be a different operator
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who certified the wrap; null until CERTIFIED
      - name: dispute_note
        type: string
        source: input
        description: Note recorded by POST /weekly-wraps/{id}/dispute; null otherwise
      - name: void_reason
        type: string
        source: input
        description: Reason recorded by POST /weekly-wraps/{id}/void; null otherwise

  - name: RoyaltyAllocation
    parent: null
    common_fields: true
    fields:
      - name: wrap_id
        type: string
        source: system
        description: "FK -> WeeklyWrap.id; the certified wrap that produced this allocation"
      - name: royalty_participant_id
        type: string
        source: system
        description: "FK -> RoyaltyParticipant.id; the participant paid"
      - name: basis
        type: enum
        source: computed
        description: Which wrap_settlement variant produced the amount
        constraints: "POOL | FIXED_GROSS"
      - name: points_at_allocation
        type: integer
        source: computed
        description: RoyaltyParticipant.pool_points observed at certification (0 under FIXED_GROSS basis)
      - name: allocated_cents
        type: integer
        source: computed
        description: Amount allocated to this participant for the week
      - name: status
        type: enum
        source: system
        default: ALLOCATED
        description: Flipped to REVERSED when the producing wrap is voided
        constraints: "ALLOCATED | REVERSED"

  - name: SubsidiaryRightsIncome
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production whose subsidiary rights were licensed"
      - name: source
        type: enum
        source: input
        description: Subsidiary rights category
        constraints: "CAST_ALBUM | FILM_LICENSE | STOCK_AND_AMATEUR | TOURING_LICENSE | MERCHANDISE"
      - name: gross_income_cents
        type: integer
        source: input
        description: Gross licensing income received
        constraints: ">= 1"
      - name: received_date
        type: string
        source: input
        description: Date the income was received (ISO 8601 date)
      - name: investor_share_cents
        type: integer
        source: computed
        description: round_half_up(gross_income_cents * Production.subsidiary_rights_investor_share_pct); 0 while status == RECORDED
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: RECORDED income feeds only the ACCRUAL_BASIS recoupment variant; ALLOCATED income enters the cash ledger
        constraints: "RECORDED | ALLOCATED"

  - name: InvestorDistribution
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production distributing cash"
      - name: distribution_type
        type: enum
        source: input
        description: Character of the distribution; NET_PROFIT requires recoupment_status == RECOUPED
        constraints: "RECOUPMENT_RETURN | NET_PROFIT | SUBSIDIARY_RIGHTS | RESERVE_RELEASE"
      - name: total_amount_cents
        type: integer
        source: input
        description: Aggregate cash distributed
        constraints: ">= 1"
      - name: allocation_breakdown
        type: array
        source: computed
        description: "Per-account shares frozen at declaration: [{ investor_account_id, investor_id, amount_cents }] (see distribution_allocation)"
      - name: status
        type: enum
        source: system
        default: DECLARED
        description: Declaration then payment
        constraints: "DECLARED | PAID"

  - name: ClosingNotice
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production being closed"
      - name: notice_date
        type: string
        source: input
        description: Date the closing notice is posted (ISO 8601 date)
      - name: final_performance_date
        type: string
        source: input
        description: Date of the final performance (ISO 8601 date)
      - name: reason
        type: enum
        source: input
        description: Basis for the closing decision
        constraints: "SCHEDULED_END | ECONOMIC | VENUE_LOSS"
      - name: notice_days
        type: integer
        source: computed
        description: Whole days from notice_date to final_performance_date (final_performance_date - notice_date)
      - name: closing_costs_cents
        type: integer
        source: input
        description: Actual closing costs supplied at settlement; null until SETTLED
        constraints: ">= 0"
      - name: reserve_balance_at_settlement_cents
        type: integer
        source: computed
        description: Sum of BudgetLine.amount_cents with component == RESERVE and commitment_status == COMMITTED at settlement
      - name: reserve_released_cents
        type: integer
        source: computed
        description: max(0, reserve_balance_at_settlement_cents - closing_costs_cents); credited to the recoupment ledger
      - name: closing_cost_shortfall_cents
        type: integer
        source: computed
        description: max(0, closing_costs_cents - reserve_balance_at_settlement_cents)
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Closing notice lifecycle
        constraints: "ISSUED | WITHDRAWN | SETTLED"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who issued the notice; the settling operator must be different
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who settled the notice; null until SETTLED
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason recorded by POST /closing-notices/{id}/withdraw; null otherwise

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Production
  # Two independent axes on the same row (parallel dimensions).
  - entity: Production
    state_field: offering_status
    initial_state: DRAFT
    terminal_states: [CAPITALIZED]
    transitions:
      - from: DRAFT
        to: OFFERING
        trigger: "POST /productions/{id}/open-offering"
        actor: SyndicationCounsel
        preconditions:
          - "production.offering_status == DRAFT"
        side_effects:
          - "increments Production.version by 1"
        note: "OfferingDocument may not be made EFFECTIVE until this axis reads OFFERING."

      - from: OFFERING
        to: FULLY_SUBSCRIBED
        trigger: "system: POST /subscriptions/{id}/accept whose cascade raises Production.capital_raised_cents to >= capitalization_target_cents"
        actor: system
        preconditions:
          - "production.offering_status == OFFERING"
          - "capital_raised_cents >= capitalization_target_cents after this acceptance"
        side_effects:
          - "increments Production.version by 1"

      - from: FULLY_SUBSCRIBED
        to: OFFERING
        trigger: "system: POST /subscriptions/{id}/rescind whose cascade drops Production.capital_raised_cents below capitalization_target_cents"
        actor: system
        preconditions:
          - "production.offering_status == FULLY_SUBSCRIBED"
          - "capital_raised_cents < capitalization_target_cents after this rescission"
        side_effects:
          - "increments Production.version by 1"
        note: "Cycle on the offering axis: OFFERING -> FULLY_SUBSCRIBED -> OFFERING."

      - from: FULLY_SUBSCRIBED
        to: CAPITALIZED
        trigger: "POST /productions/{id}/capitalize"
        actor: Comptroller
        preconditions:
          - "production.offering_status == FULLY_SUBSCRIBED"
        side_effects:
          - "sets Production.released_capital_cents = Production.capital_raised_cents"
          - "recomputes Production.escrow_balance_cents to 0"
          - "increments Production.version by 1"

  - entity: Production
    state_field: operating_status
    initial_state: PRE_PRODUCTION
    terminal_states: [CLOSED]
    transitions:
      - from: PRE_PRODUCTION
        to: REHEARSAL
        trigger: "POST /productions/{id}/operating-status with to_status == REHEARSAL"
        actor: LeadProducer
        preconditions:
          - "production.operating_status == PRE_PRODUCTION"
          - "production.offering_status == CAPITALIZED"
        side_effects:
          - "increments Production.version by 1"
        note: "Cross-axis guard: the operating axis cannot leave PRE_PRODUCTION until the offering axis reaches CAPITALIZED."

      - from: REHEARSAL
        to: PREVIEWS
        trigger: "POST /productions/{id}/operating-status with to_status == PREVIEWS"
        actor: LeadProducer
        preconditions:
          - "production.operating_status == REHEARSAL"
          - "exactly one OperatingBudget with production_id == production.id and status == ACTIVE exists"
        side_effects:
          - "increments Production.version by 1"

      - from: PREVIEWS
        to: RUNNING
        trigger: "POST /productions/{id}/operating-status with to_status == RUNNING"
        actor: LeadProducer
        preconditions:
          - "production.operating_status == PREVIEWS"
        side_effects:
          - "increments Production.version by 1"

      - from: PREVIEWS
        to: CLOSING_NOTICE
        trigger: "system: POST /closing-notices creating an ISSUED notice for this production"
        actor: system
        preconditions:
          - "production.operating_status IN {PREVIEWS, RUNNING}"
          - "no ClosingNotice for this production with status == ISSUED exists"
        side_effects:
          - "cascade hop 2: every BudgetLine of this production with component == RESERVE and commitment_status == PLANNED becomes COMMITTED"
          - "cascade hop 3: because those lines became COMMITTED, Production.budget_committed_cents is recomputed by capitalization_budget_rollup"
          - "increments Production.version by 1"

      - from: RUNNING
        to: CLOSING_NOTICE
        trigger: "system: POST /closing-notices creating an ISSUED notice for this production"
        actor: system
        preconditions:
          - "production.operating_status IN {PREVIEWS, RUNNING}"
          - "no ClosingNotice for this production with status == ISSUED exists"
        side_effects:
          - "cascade hop 2: every BudgetLine of this production with component == RESERVE and commitment_status == PLANNED becomes COMMITTED"
          - "cascade hop 3: because those lines became COMMITTED, Production.budget_committed_cents is recomputed by capitalization_budget_rollup"
          - "increments Production.version by 1"

      - from: CLOSING_NOTICE
        to: RUNNING
        trigger: "system: POST /closing-notices/{id}/withdraw"
        actor: system
        preconditions:
          - "production.operating_status == CLOSING_NOTICE"
          - "closing_notice.status == ISSUED"
        side_effects:
          - "cascade hop 2: every BudgetLine of this production with component == RESERVE and commitment_status == COMMITTED reverts to PLANNED"
          - "cascade hop 3: because those lines reverted, Production.budget_committed_cents is recomputed by capitalization_budget_rollup"
          - "increments Production.version by 1"
        note: "Cycle on the operating axis: RUNNING -> CLOSING_NOTICE -> RUNNING."

      - from: CLOSING_NOTICE
        to: CLOSED
        trigger: "system: POST /closing-notices/{id}/settle"
        actor: system
        preconditions:
          - "production.operating_status == CLOSING_NOTICE"
          - "closing_notice.status == ISSUED"
          - "no WeeklyWrap of this production has status IN {DRAFT, SUBMITTED, DISPUTED, AMENDED}"
        side_effects:
          - "cascade hop 2: every BudgetLine with component == RESERVE and commitment_status == COMMITTED becomes SPENT and closing_reserve_settlement books ClosingNotice.reserve_released_cents"
          - "cascade hop 3: because reserve_released_cents was booked, recoupment_progress recomputes Production.recouped_amount_cents / recoupment_pct / distributable_cash_cents"
          - "cascade hop 4: if that recompute crosses the threshold, Production.recoupment_status becomes RECOUPED and every InvestorAccount of the production flips basis to NET_PROFIT and refreshes recoupment_credited_cents"
          - "increments Production.version by 1"

  # ---------------------------------------------------------- OfferingDocument
  - entity: OfferingDocument
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /offering-documents/{id}/make-effective"
        actor: SyndicationCounsel
        preconditions:
          - "offering_document.status == DRAFT"
          - "production.offering_status == OFFERING"
          - "effective_date <= current logical UTC date <= expiration_date"
        side_effects:
          - "increments OfferingDocument.version by 1"

      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system: lazy evaluation at the start of any request that reads or writes this document (GET /offering-documents/{id}, GET /offering-documents, POST /subscriptions, POST /subscriptions/{id}/accept, POST /subscriptions/{id}/resubmit)"
        actor: system
        preconditions:
          - "offering_document.status == EFFECTIVE"
          - "current logical UTC date > expiration_date"
        side_effects:
          - "increments OfferingDocument.version by 1"
        note: "The lazy transition is applied BEFORE the request's own validations run, so a subscription attempt against a lapsed document sees EXPIRED."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /offering-documents/{id}/withdraw"
        actor: SyndicationCounsel
        preconditions:
          - "offering_document.status IN {DRAFT, EFFECTIVE}"
        side_effects:
          - "records withdrawal_reason"
          - "increments OfferingDocument.version by 1"

      - from: EFFECTIVE
        to: WITHDRAWN
        trigger: "POST /offering-documents/{id}/withdraw"
        actor: SyndicationCounsel
        preconditions:
          - "offering_document.status IN {DRAFT, EFFECTIVE}"
        side_effects:
          - "records withdrawal_reason"
          - "increments OfferingDocument.version by 1"

  # ---------------------------------------------------------------- Investor
  - entity: Investor
    state_field: accreditation_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: ACCREDITED
        trigger: "POST /investors/{id}/accredit with accreditation_status == ACCREDITED"
        actor: SyndicationCounsel
        preconditions: ["investor exists"]
        side_effects: ["increments Investor.version by 1"]
      - from: UNVERIFIED
        to: NON_ACCREDITED
        trigger: "POST /investors/{id}/accredit with accreditation_status == NON_ACCREDITED"
        actor: SyndicationCounsel
        preconditions: ["investor exists"]
        side_effects: ["increments Investor.version by 1"]
      - from: ACCREDITED
        to: NON_ACCREDITED
        trigger: "POST /investors/{id}/accredit with accreditation_status == NON_ACCREDITED"
        actor: SyndicationCounsel
        preconditions: ["investor exists"]
        side_effects: ["increments Investor.version by 1"]
      - from: NON_ACCREDITED
        to: ACCREDITED
        trigger: "POST /investors/{id}/accredit with accreditation_status == ACCREDITED"
        actor: SyndicationCounsel
        preconditions: ["investor exists"]
        side_effects: ["increments Investor.version by 1"]

  # ------------------------------------------------------------- Subscription
  - entity: Subscription
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: SUBMITTED
        to: RETURNED_FOR_CURE
        trigger: "POST /subscriptions/{id}/return-for-cure"
        actor: SyndicationCounsel
        preconditions:
          - "subscription.status == SUBMITTED"
          - "subscription.cure_round_count + 1 <= MAX_CURE_ROUNDS (2)"
        side_effects:
          - "increments Subscription.cure_round_count by 1"
          - "records defect_note"
          - "recomputes OfferingDocument.submitted_units_total and increments OfferingDocument.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /subscriptions/{id}/return-for-cure"
        actor: SyndicationCounsel
        preconditions:
          - "subscription.status == SUBMITTED"
          - "subscription.cure_round_count + 1 > MAX_CURE_ROUNDS (2)"
        side_effects:
          - "increments Subscription.cure_round_count by 1"
          - "records defect_note"
          - "recomputes OfferingDocument.submitted_units_total and increments OfferingDocument.version by 1"
        note: "Branch: the same trigger from the same state resolves to RETURNED_FOR_CURE or REJECTED purely on the cure counter."

      - from: RETURNED_FOR_CURE
        to: SUBMITTED
        trigger: "POST /subscriptions/{id}/resubmit"
        actor: Investor
        preconditions:
          - "subscription.status == RETURNED_FOR_CURE"
          - "X-User-ID == subscription.investor_id"
          - "offering_document.status == EFFECTIVE"
        side_effects:
          - "recomputes Subscription.amount_cents via investor_ownership_allocation step 1 (units * unit_price_cents)"
          - "recomputes OfferingDocument.submitted_units_total and increments OfferingDocument.version by 1"
        note: "Cycle: SUBMITTED -> RETURNED_FOR_CURE -> SUBMITTED, at most twice."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /subscriptions/{id}/accept"
        actor: SyndicationCounsel
        preconditions:
          - "subscription.status == SUBMITTED"
          - "offering_document.status == EFFECTIVE"
          - "investor.accreditation_status == ACCREDITED"
          - "offering_document.accepted_investor_count + (1 if this investor has no other ACCEPTED subscription under the document else 0) <= offering_document.max_investors"
          - "offering_document.accepted_amount_cents + subscription.amount_cents <= offering_document.offering_amount_cents"
        side_effects:
          - "cascade hop 2: an InvestorAccount for (production_id, investor_id) is created if absent, and its units_total / contributed_cents are recomputed"
          - "cascade hop 3: because that account's units changed, investor_ownership_allocation recomputes ownership_pct for EVERY InvestorAccount of the production"
          - "cascade hop 4: because ownership and contributions changed, Production.capital_raised_cents / escrow_balance_cents / active_investor_count are recomputed and, if capital_raised_cents >= capitalization_target_cents, offering_status advances OFFERING -> FULLY_SUBSCRIBED"
          - "recomputes OfferingDocument.accepted_units_total / accepted_amount_cents / accepted_investor_count / submitted_units_total and increments OfferingDocument.version by 1"
          - "increments Production.version by 1"

      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /subscriptions/{id}/rescind"
        actor: SyndicationCounsel
        preconditions:
          - "subscription.status == ACCEPTED"
          - "production.offering_status IN {OFFERING, FULLY_SUBSCRIBED}"
        side_effects:
          - "records rescission_reason"
          - "cascade hop 2: the investor's InvestorAccount units_total / contributed_cents are recomputed downward"
          - "cascade hop 3: because that account's units changed, investor_ownership_allocation recomputes ownership_pct for EVERY InvestorAccount of the production"
          - "cascade hop 4: because contributions changed, Production.capital_raised_cents / escrow_balance_cents / active_investor_count are recomputed and, if capital_raised_cents < capitalization_target_cents, offering_status reverts FULLY_SUBSCRIBED -> OFFERING"
          - "recomputes OfferingDocument.accepted_* fields and increments OfferingDocument.version by 1"
          - "increments Production.version by 1"
        note: "Compensating action for accept; conserves Production.capital_raised_cents (see compensating_invariant capital)."

  # ----------------------------------------------------------- OperatingBudget
  - entity: OperatingBudget
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /operating-budgets/{id}/activate"
        actor: Comptroller
        preconditions:
          - "operating_budget.status == DRAFT"
        side_effects:
          - "the previously ACTIVE OperatingBudget of the same production, if any, transitions ACTIVE -> SUPERSEDED"
          - "increments OperatingBudget.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: activation of another OperatingBudget for the same production"
        actor: system
        preconditions:
          - "operating_budget.status == ACTIVE"
        side_effects:
          - "increments OperatingBudget.version by 1, which invalidates every WeeklyWrap whose operating_budget_version_pinned referenced this row"

  # --------------------------------------------------------------- BudgetLine
  - entity: BudgetLine
    state_field: commitment_status
    initial_state: PLANNED
    terminal_states: [SPENT]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /budget-lines/{id}/commit"
        actor: GeneralManager
        preconditions:
          - "budget_line.commitment_status == PLANNED"
          - "production.budget_status == APPROVED"
        side_effects:
          - "recomputes Production.budget_committed_cents via capitalization_budget_rollup"
          - "increments Production.version by 1"
          - "increments BudgetLine.version by 1"

      - from: PLANNED
        to: COMMITTED
        trigger: "system: POST /closing-notices for the production, for lines with component == RESERVE"
        actor: system
        preconditions:
          - "budget_line.component == RESERVE"
          - "budget_line.commitment_status == PLANNED"
        side_effects:
          - "recomputes Production.budget_committed_cents via capitalization_budget_rollup"
          - "increments BudgetLine.version by 1"

      - from: COMMITTED
        to: PLANNED
        trigger: "system: POST /closing-notices/{id}/withdraw, for lines with component == RESERVE"
        actor: system
        preconditions:
          - "budget_line.component == RESERVE"
          - "budget_line.commitment_status == COMMITTED"
        side_effects:
          - "recomputes Production.budget_committed_cents via capitalization_budget_rollup"
          - "increments BudgetLine.version by 1"

      - from: COMMITTED
        to: SPENT
        trigger: "system: POST /closing-notices/{id}/settle, for lines with component == RESERVE"
        actor: system
        preconditions:
          - "budget_line.component == RESERVE"
          - "budget_line.commitment_status == COMMITTED"
        side_effects:
          - "closing_reserve_settlement books ClosingNotice.reserve_released_cents / closing_cost_shortfall_cents"
          - "increments BudgetLine.version by 1"

  # -------------------------------------------------------- RoyaltyParticipant
  - entity: RoyaltyParticipant
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /royalty-participants/{id}/terminate"
        actor: LeadProducer
        preconditions:
          - "royalty_participant.status == ACTIVE"
        side_effects:
          - "sets RoyaltyParticipant.pool_share_pct to 0.0000"
          - "recomputes Production.total_pool_points and every ACTIVE sibling's pool_share_pct via royalty_pool_share_pct"
          - "increments Production.version by 1"

      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /royalty-participants/{id}/reinstate"
        actor: LeadProducer
        preconditions:
          - "royalty_participant.status == TERMINATED"
        side_effects:
          - "recomputes Production.total_pool_points and every ACTIVE participant's pool_share_pct via royalty_pool_share_pct"
          - "increments Production.version by 1"
        note: "Cycle and compensating pair: terminate+reinstate conserves Production.total_pool_points."

  # ---------------------------------------------------------------- WeeklyWrap
  - entity: WeeklyWrap
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /weekly-wraps/{id}/submit"
        actor: GeneralManager
        preconditions:
          - "weekly_wrap.status IN {DRAFT, AMENDED}"
          - "production.operating_status IN {PREVIEWS, RUNNING, CLOSING_NOTICE}"
        side_effects:
          - "sets WeeklyWrap.submitted_by_user_id to the caller's X-User-ID"
          - "increments WeeklyWrap.version by 1"

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /weekly-wraps/{id}/submit"
        actor: GeneralManager
        preconditions:
          - "weekly_wrap.status IN {DRAFT, AMENDED}"
          - "production.operating_status IN {PREVIEWS, RUNNING, CLOSING_NOTICE}"
        side_effects:
          - "sets WeeklyWrap.submitted_by_user_id to the caller's X-User-ID"
          - "increments WeeklyWrap.version by 1"

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /weekly-wraps/{id}/certify"
        actor: Comptroller
        preconditions:
          - "weekly_wrap.status == SUBMITTED"
          - "X-User-ID != weekly_wrap.submitted_by_user_id"
          - "OperatingBudget(weekly_wrap.operating_budget_id).version == weekly_wrap.operating_budget_version_pinned"
        side_effects:
          - "wrap_settlement recomputes variable_cost_cents / adjusted_gross_cents / royalty_base_cents / royalty_pool_cents / weekly_operating_profit_cents and freezes royalty_basis_applied = production.royalty_basis"
          - "cascade hop 2: because the wrap certified, royalty_pool_split creates one RoyaltyAllocation per eligible RoyaltyParticipant (none when royalty_pool_cents == 0)"
          - "cascade hop 3: because those allocations were created, each RoyaltyParticipant.cumulative_royalty_cents is recomputed"
          - "cascade hop 4: because weekly_operating_profit_cents entered the ledger, recoupment_progress recomputes Production.recouped_amount_cents / recoupment_pct / distributable_cash_cents (and adds deferred_royalty_added_cents to Production.deferred_royalty_cents when royalty_base_cents == 0)"
          - "cascade hop 5: because that recompute crossed recouped_amount_cents >= capitalization_target_cents, Production.recoupment_status becomes RECOUPED and every InvestorAccount of the production flips basis to NET_PROFIT and refreshes recoupment_credited_cents"
          - "sets WeeklyWrap.certified_by_user_id"
          - "increments Production.version by 1"
          - "increments WeeklyWrap.version by 1"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /weekly-wraps/{id}/dispute"
        actor: Comptroller
        preconditions:
          - "weekly_wrap.status == SUBMITTED"
        side_effects:
          - "records dispute_note"
          - "increments WeeklyWrap.version by 1"

      - from: DISPUTED
        to: AMENDED
        trigger: "POST /weekly-wraps/{id}/amend"
        actor: GeneralManager
        preconditions:
          - "weekly_wrap.status == DISPUTED"
        side_effects:
          - "overwrites the supplied input fields and re-derives capacity_gross_cents / paid_capacity_pct / variable_cost_cents / adjusted_gross_cents / royalty_base_cents provisionally"
          - "re-pins operating_budget_id and operating_budget_version_pinned to the production's current ACTIVE OperatingBudget"
          - "clears submitted_by_user_id"
          - "increments WeeklyWrap.version by 1"
        note: "Cycle: SUBMITTED -> DISPUTED -> AMENDED -> SUBMITTED."

      - from: CERTIFIED
        to: VOID
        trigger: "POST /weekly-wraps/{id}/void"
        actor: Comptroller
        preconditions:
          - "weekly_wrap.status == CERTIFIED"
          - "production.operating_status != CLOSED"
        side_effects:
          - "records void_reason"
          - "cascade hop 2: every RoyaltyAllocation with wrap_id == this wrap and status == ALLOCATED becomes REVERSED"
          - "cascade hop 3: because those allocations reversed, each RoyaltyParticipant.cumulative_royalty_cents is recomputed downward"
          - "cascade hop 4: because the wrap left the CERTIFIED input set, recoupment_progress recomputes Production.recouped_amount_cents / recoupment_pct / distributable_cash_cents and subtracts this wrap's deferred_royalty_added_cents from Production.deferred_royalty_cents"
          - "cascade hop 5: if the recompute drops recouped_amount_cents below capitalization_target_cents, Production.recoupment_status reverts to UNRECOUPED and every InvestorAccount flips basis back to RECOUPMENT_RETURN"
          - "increments Production.version by 1"
          - "increments WeeklyWrap.version by 1"
        note: "Compensating action for certify; conserves Production.recouped_amount_cents."

  # --------------------------------------------------------- RoyaltyAllocation
  - entity: RoyaltyAllocation
    state_field: status
    initial_state: ALLOCATED
    terminal_states: [REVERSED]
    transitions:
      - from: ALLOCATED
        to: REVERSED
        trigger: "system: POST /weekly-wraps/{id}/void for the producing wrap"
        actor: system
        preconditions:
          - "royalty_allocation.status == ALLOCATED"
          - "weekly_wrap.status transitions CERTIFIED -> VOID"
        side_effects:
          - "recomputes RoyaltyParticipant.cumulative_royalty_cents"
          - "increments RoyaltyAllocation.version by 1"

  # ---------------------------------------------------- SubsidiaryRightsIncome
  - entity: SubsidiaryRightsIncome
    state_field: status
    initial_state: RECORDED
    terminal_states: [ALLOCATED]
    transitions:
      - from: RECORDED
        to: ALLOCATED
        trigger: "POST /subsidiary-rights-income/{id}/allocate"
        actor: Comptroller
        preconditions:
          - "subsidiary_rights_income.status == RECORDED"
          - "production.offering_status == CAPITALIZED"
        side_effects:
          - "subsidiary_rights_investor_share sets investor_share_cents"
          - "cascade hop 2: because investor_share_cents entered the cash ledger, recoupment_progress recomputes Production.recouped_amount_cents / recoupment_pct / distributable_cash_cents"
          - "cascade hop 3: if that recompute crosses the threshold, Production.recoupment_status becomes RECOUPED and every InvestorAccount flips basis to NET_PROFIT"
          - "increments Production.version by 1"

  # ------------------------------------------------------ InvestorDistribution
  - entity: InvestorDistribution
    state_field: status
    initial_state: DECLARED
    terminal_states: [PAID]
    transitions:
      - from: DECLARED
        to: PAID
        trigger: "POST /investor-distributions/{id}/pay"
        actor: Comptroller
        preconditions:
          - "investor_distribution.status == DECLARED"
        side_effects:
          - "for each entry in allocation_breakdown, increases the referenced InvestorAccount.distributions_paid_cents by entry.amount_cents"
          - "increments InvestorDistribution.version by 1"

  # ------------------------------------------------------------- ClosingNotice
  - entity: ClosingNotice
    state_field: status
    initial_state: ISSUED
    terminal_states: [WITHDRAWN, SETTLED]
    transitions:
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /closing-notices/{id}/withdraw"
        actor: LeadProducer
        preconditions:
          - "closing_notice.status == ISSUED"
          - "production.operating_status == CLOSING_NOTICE"
        side_effects:
          - "records withdrawal_reason"
          - "drives Production.operating_status CLOSING_NOTICE -> RUNNING and the RESERVE BudgetLine reversion cascade"
          - "increments ClosingNotice.version by 1"

      - from: ISSUED
        to: SETTLED
        trigger: "POST /closing-notices/{id}/settle"
        actor: Comptroller
        preconditions:
          - "closing_notice.status == ISSUED"
          - "production.operating_status == CLOSING_NOTICE"
          - "X-User-ID != closing_notice.issued_by_user_id"
          - "no WeeklyWrap of this production has status IN {DRAFT, SUBMITTED, DISPUTED, AMENDED}"
        side_effects:
          - "closing_reserve_settlement sets reserve_balance_at_settlement_cents / reserve_released_cents / closing_cost_shortfall_cents and settled_by_user_id"
          - "drives Production.operating_status CLOSING_NOTICE -> CLOSED and the RESERVE BudgetLine SPENT + recoupment cascade"
          - "increments ClosingNotice.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: budget-line-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /budget-lines"
    occ_field: "expected_production_version"
    description: |
      Creating a BudgetLine against a Production whose version has advanced
      since the client last observed it is rejected. A budget line draws on the
      same capitalization headroom as every other line, so a line created after
      the client's read legitimately shrinks the headroom the client believed it
      had; the stale-version check forces the client to re-read the rolled-up
      budget_total_cents before allocating again.
      VERSION SEMANTICS (applies to every entity carrying a version field): a
      successful request increments the version of each row it writes by exactly
      1, no matter how many cascade hops of that request touch the row. A single
      POST /subscriptions/{id}/accept that both re-rolls Production money fields
      and advances Production.offering_status therefore moves Production.version
      by 1, not by 2. A rejected request increments nothing.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412

  - rule_id: distribution-declare-stale-production
    parent_entity: Production
    write_endpoint: "POST /investor-distributions"
    occ_field: "expected_production_version"
    description: |
      Declaring an InvestorDistribution against a Production whose version has
      advanced since the client last observed it is rejected. Distributable cash
      is a rolled-up field that any wrap certification, subsidiary-rights
      allocation, reserve release or prior declaration legitimately moves, so a
      declaration written against a stale view of distributable_cash_cents is
      refused rather than silently over-distributing.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wrap_settlement
    trigger: "POST /weekly-wraps (provisional, through royalty_base_cents only), POST /weekly-wraps/{id}/amend (provisional), POST /weekly-wraps/{id}/certify (final, all fields)"
    algorithm: threshold
    formula: |
      # --- inputs -------------------------------------------------------------
      # T  = Theatre(production.theatre_id)
      # OB = OperatingBudget(wrap.operating_budget_id)          # pinned at create/amend
      # P  = Production(wrap.production_id)
      # A  = RoyaltyParticipant rows with production_id == P.id AND status == ACTIVE
      #      AND pool_points > 0, ordered by pool_points DESC, created_at ASC
      # --- step 1: capacity and attendance ------------------------------------
      capacity_gross_cents = T.seat_count * T.top_ticket_price_cents * wrap.performances
      paid_capacity_pct    = round_half_up(wrap.paid_attendance / (T.seat_count * wrap.performances), 4)
      # --- step 2: gross to adjusted gross ------------------------------------
      variable_cost_cents  = round_half_up(wrap.gross_receipts_cents * OB.variable_cost_pct, 0)
      adjusted_gross_cents = wrap.gross_receipts_cents - variable_cost_cents
      # --- step 3: royalty base ----------------------------------------------
      royalty_base_cents   = max(0, adjusted_gross_cents - wrap.running_expenses_cents)
      # --- step 4: royalty burden (VARIANT SELECTION, certify only) ----------
      royalty_basis_applied = P.royalty_basis
      pool_floor_cents = sum(p.min_guarantee_cents for p in A)
      IF royalty_basis_applied == FIXED_GROSS:
          # fixed royalties as a percentage of adjusted gross, rounded PER
          # PARTICIPANT then summed (order pinned by A's ordering)
          royalty_pool_cents = sum(round_half_up(adjusted_gross_cents * p.fixed_gross_pct, 0) for p in A)
          deferred_royalty_added_cents = 0
      ELSE:  # POOL
          pool_pct = (P.recoupment_status == RECOUPED) ? P.post_recoupment_pool_pct
                                                       : P.pre_recoupment_pool_pct
          IF royalty_base_cents <= 0:
              royalty_pool_cents           = 0
              deferred_royalty_added_cents = pool_floor_cents
          ELSE:
              royalty_pool_cents = min(max(round_half_up(royalty_base_cents * pool_pct, 0),
                                           pool_floor_cents),
                                       royalty_base_cents)
              deferred_royalty_added_cents = 0
      # --- step 5: weekly operating profit -----------------------------------
      weekly_operating_profit_cents = royalty_base_cents - royalty_pool_cents
    input_set: |
      Royalty participants: RoyaltyParticipant rows of the wrap's production with
      status == ACTIVE and pool_points > 0. TERMINATED participants and ACTIVE
      participants with pool_points == 0 are excluded from pool_floor_cents, from
      the FIXED_GROSS sum and from the split. Theatre and OperatingBudget values
      are read from the pinned rows, never re-selected at certification time.
    constants:
      MAX_PERFORMANCES_PER_WEEK: 16
    precision: "All money fields are integer cents; every rounding step is round_half_up to 0 decimals. paid_capacity_pct is 4 decimals round_half_up."
    variants:
      - name: FIXED_GROSS_BASIS
        when: "Production.royalty_basis == FIXED_GROSS (the state every Production starts in)"
        difference: |
          royalty_pool_cents is the sum of per-participant percentages of
          ADJUSTED GROSS, so the royalty burden is insensitive to running
          expenses and is owed even in a losing week. pool_floor_cents and
          pool_pct are ignored entirely.
      - name: POOL_BASIS
        when: "Production.royalty_basis == POOL, i.e. after POST /productions/{id}/convert-royalties-to-pool"
        difference: |
          royalty_pool_cents is a percentage of WEEKLY OPERATING PROFIT
          (royalty_base_cents), floored at the aggregate of minimum guarantees
          and capped at royalty_base_cents, with the percentage itself switching
          on Production.recoupment_status. Identical wrap inputs therefore yield
          a different royalty_pool_cents and a different
          weekly_operating_profit_cents under the two variants.

  - name: royalty_pool_split
    trigger: "cascade hop 2 of POST /weekly-wraps/{id}/certify"
    algorithm: waterfall_allocation
    formula: |
      # A = RoyaltyParticipant rows with production_id == wrap.production_id
      #     AND status == ACTIVE AND pool_points > 0,
      #     ORDERED BY pool_points DESC, created_at ASC   (order pinned)
      total_points = sum(p.pool_points for p in A)
      IF wrap.royalty_pool_cents == 0 OR total_points == 0 OR len(A) == 0:
          create no RoyaltyAllocation rows and stop
      IF wrap.royalty_basis_applied == FIXED_GROSS:
          # no reconciliation: each participant's own percentage IS the amount,
          # and their sum is by construction wrap.royalty_pool_cents
          for p in A:
              allocated_cents = round_half_up(wrap.adjusted_gross_cents * p.fixed_gross_pct, 0)
              basis = FIXED_GROSS ; points_at_allocation = 0
      ELSE:  # POOL
          # ROUNDING ORDER IS PINNED: round each participant's raw share to whole
          # cents FIRST, then reconcile the residue. Summing exact rationals and
          # rounding once at the end is NOT the specified order.
          for p in A:
              share[p] = round_half_up(wrap.royalty_pool_cents * p.pool_points / total_points, 0)
          residue = wrap.royalty_pool_cents - sum(share[p] for p in A)   # may be negative
          winner  = first element of A                                   # highest pool_points, then earliest created_at
          share[winner] = share[winner] + residue
          for p in A:
              allocated_cents = share[p] ; basis = POOL ; points_at_allocation = p.pool_points
    input_set: "ACTIVE participants of the wrap's production with pool_points > 0, as of the certification instant."
    constants: {}
    precision: "Integer cents; round_half_up per participant, then a single signed residue adjustment on the highest-points participant (tie-break created_at ASC)."
    variants:
      - name: POOL_SPLIT
        when: "wrap.royalty_basis_applied == POOL"
        difference: "Points-proportional with residue reconciliation; sum(allocated_cents) == wrap.royalty_pool_cents by construction."
      - name: FIXED_GROSS_SPLIT
        when: "wrap.royalty_basis_applied == FIXED_GROSS"
        difference: "No residue step; wrap.royalty_pool_cents was itself defined as the sum of the per-participant amounts."

  - name: royalty_pool_share_pct
    trigger: "POST /royalty-participants, POST /royalty-participants/{id}/terminate, POST /royalty-participants/{id}/reinstate, POST /productions/{id}/convert-royalties-to-pool"
    algorithm: aggregation
    formula: |
      # A = RoyaltyParticipant rows of the production with status == ACTIVE AND
      #     pool_points > 0, ORDERED BY pool_points DESC, created_at ASC
      total_pool_points = sum(p.pool_points for p in RoyaltyParticipant
                              where production_id == P.id AND status == ACTIVE)
      IF total_pool_points == 0 OR len(A) == 0:
          every participant's pool_share_pct = 0.0000 and stop
      for p in A: share[p] = round_half_up(p.pool_points / total_pool_points, 4)
      residue = 1.0000 - sum(share[p] for p in A)
      share[first element of A] += residue          # highest points, then earliest created_at
      participants with status == TERMINATED or pool_points == 0 get 0.0000
    input_set: "All RoyaltyParticipant rows of the production; the point total counts every ACTIVE participant (even with pool_points == 0, contributing 0)."
    constants: {}
    precision: "4 decimals, round_half_up per participant then one signed residue adjustment; sum over A is exactly 1.0000 (or exactly 0.0000 when A is empty)."

  - name: break_even_analysis
    trigger: "GET /productions/{id}/break-even-analysis"
    algorithm: constraint_propagation
    formula: |
      # OB = the OperatingBudget of the production with status == ACTIVE
      #      (exactly one; ERR_ACTIVE_OPERATING_BUDGET_MISSING when none)
      # A  = ACTIVE RoyaltyParticipant rows with pool_points > 0
      # T  = Theatre(production.theatre_id)
      v                            = OB.variable_cost_pct
      royalty_min_guarantee_floor_cents = sum(p.min_guarantee_cents for p in A)
      # Break-even is the smallest weekly gross whose weekly_operating_profit_cents
      # is STRICTLY positive. Under POOL basis profit > 0 exactly when
      # royalty_base_cents > pool floor, so the adjusted-gross target is:
      target_adjusted_gross_cents  = OB.weekly_fixed_running_cost_cents
                                     + royalty_min_guarantee_floor_cents + 1
      # CIRCULARITY: adjusted gross depends on gross, and the gross we want
      # depends on adjusted gross. Evaluation order is PINNED as follows and the
      # predicate G - round_half_up(G*v) >= target is monotone non-decreasing in G,
      # so both walks terminate within 100 steps.
      G = ceil(target_adjusted_gross_cents / (1 - v))            # step 1: seed
      while G > 0 and (G-1) - round_half_up((G-1)*v, 0) >= target_adjusted_gross_cents:
          G = G - 1                                              # step 2: walk down to the minimum
      while G - round_half_up(G*v, 0) < target_adjusted_gross_cents:
          G = G + 1                                              # step 3: walk up if the seed undershot
      break_even_gross_cents = G
      capacity_gross_projection_cents = T.seat_count * T.top_ticket_price_cents * OB.performances_per_week
      break_even_paid_capacity_pct = round_half_up(break_even_gross_cents / capacity_gross_projection_cents, 4)
      # run-rate projection off the most recent certified week
      W = the WeeklyWrap of this production with status == CERTIFIED and the
          greatest week_ending_date; tie-break created_at DESC
      IF W is absent OR W.weekly_operating_profit_cents <= 0:
          weeks_to_recoup_at_last_certified_run_rate = null
      ELSE:
          remaining = max(0, P.capitalization_target_cents - P.recouped_amount_cents)
          weeks_to_recoup_at_last_certified_run_rate = ceil(remaining / W.weekly_operating_profit_cents)
    input_set: "The single ACTIVE OperatingBudget; ACTIVE participants with pool_points > 0 (empty set => floor 0); CERTIFIED wraps only for the run-rate."
    constants:
      BREAK_EVEN_WALK_LIMIT: 100
    precision: "break_even_gross_cents is integer cents; break_even_paid_capacity_pct is 4 decimals round_half_up; weeks are ceil integers."

  - name: recoupment_progress
    trigger: "cascade hop 4 of POST /weekly-wraps/{id}/certify, cascade hop 4 of POST /weekly-wraps/{id}/void, cascade hop 2 of POST /subsidiary-rights-income/{id}/allocate, cascade hop 3 of POST /closing-notices/{id}/settle, POST /investor-distributions, and GET /productions/{id}/recoupment-report (read-only, both variants)"
    algorithm: aggregation
    formula: |
      # --- CASH_BASIS (authoritative; persisted on Production) ---------------
      wrap_profit   = sum(w.weekly_operating_profit_cents for w in WeeklyWrap
                          where production_id == P.id AND status == CERTIFIED)
      sub_rights    = sum(s.investor_share_cents for s in SubsidiaryRightsIncome
                          where production_id == P.id AND status == ALLOCATED)
      reserve_rel   = sum(c.reserve_released_cents for c in ClosingNotice
                          where production_id == P.id AND status == SETTLED)
      recouped_amount_cents  = wrap_profit + sub_rights + reserve_rel
      recoupment_pct         = round_half_up(recouped_amount_cents / P.capitalization_target_cents, 4)
      recoupment_status      = (recouped_amount_cents >= P.capitalization_target_cents)
                               ? RECOUPED : UNRECOUPED       # >= , not >
      distributed_total_cents = sum(d.total_amount_cents for d in InvestorDistribution
                                    where production_id == P.id AND status IN {DECLARED, PAID})
      distributable_cash_cents = max(0, recouped_amount_cents - distributed_total_cents)
      # --- ACCRUAL_BASIS (reporting only; never drives recoupment_status) ----
      receivable    = sum(round_half_up(s.gross_income_cents * P.subsidiary_rights_investor_share_pct, 0)
                          for s in SubsidiaryRightsIncome
                          where production_id == P.id AND status == RECORDED)
      accrual_basis_recouped_cents = recouped_amount_cents - P.deferred_royalty_cents + receivable
      accrual_basis_recoupment_pct = round_half_up(accrual_basis_recouped_cents / P.capitalization_target_cents, 4)
    input_set: |
      CASH_BASIS counts only WeeklyWrap rows with status == CERTIFIED (DRAFT,
      SUBMITTED, DISPUTED, AMENDED and VOID are excluded), SubsidiaryRightsIncome
      rows with status == ALLOCATED, and ClosingNotice rows with status ==
      SETTLED. ACCRUAL_BASIS starts from that number, subtracts accrued unpaid
      minimum guarantees and adds the investor share of RECORDED-but-unallocated
      licensing income.
    constants: {}
    precision: "Integer cents; percentages 4 decimals round_half_up. Note that recoupment_pct can round to 1.0000 while recoupment_status is still UNRECOUPED."
    variants:
      - name: CASH_BASIS
        when: "Always; this is the variant persisted on Production and the only one that may flip recoupment_status."
        difference: "Ignores Production.deferred_royalty_cents and every RECORDED subsidiary-rights row."
      - name: ACCRUAL_BASIS
        when: "Reported by GET /productions/{id}/recoupment-report alongside CASH_BASIS."
        difference: |
          Subtracts Production.deferred_royalty_cents and adds the investor share
          of RECORDED SubsidiaryRightsIncome, so for identical stored data the two
          variants report different recouped amounts and different percentages.

  - name: investor_ownership_allocation
    trigger: "cascade hop 3 of POST /subscriptions/{id}/accept and of POST /subscriptions/{id}/rescind"
    algorithm: aggregation
    formula: |
      # step 1 (also run at POST /subscriptions and /resubmit):
      Subscription.amount_cents = units * OfferingDocument.unit_price_cents
      # step 2: per-account roll-up over ACCEPTED subscriptions only
      for each InvestorAccount ia of the production:
          ia.units_total       = sum(s.units        for s in Subscription
                                      where s.investor_id == ia.investor_id
                                        AND s.offering_document_id IN docs(P)
                                        AND s.status == ACCEPTED)
          ia.contributed_cents = sum(s.amount_cents for the same set)
      # step 3: ownership, ORDERED BY units_total DESC, created_at ASC
      total_units = sum(ia.units_total for all accounts of P)
      IF total_units == 0: every ownership_pct = 0.000000 and stop
      for ia in ordered accounts: ia.ownership_pct = round_half_up(ia.units_total / total_units, 6)
      residue = 1.000000 - sum(ia.ownership_pct)
      first ordered account (largest units_total, then earliest created_at).ownership_pct += residue
      # step 4: recoupment credit snapshot
      for ia: ia.recoupment_credited_cents = round_half_up(P.recouped_amount_cents * ia.ownership_pct, 0)
    input_set: "Subscription rows with status == ACCEPTED under any OfferingDocument of the production; all other statuses are excluded."
    constants: {}
    precision: "ownership_pct 6 decimals round_half_up per account then one signed residue adjustment; sum is exactly 1.000000 whenever total_units > 0."

  - name: distribution_allocation
    trigger: "POST /investor-distributions (declaration freezes the breakdown), consumed by POST /investor-distributions/{id}/pay"
    algorithm: waterfall_allocation
    formula: |
      # ACC = InvestorAccount rows of the production with units_total > 0,
      #       ORDERED BY units_total DESC, created_at ASC   (order pinned)
      IF len(ACC) == 0: reject with ERR_NO_INVESTOR_ACCOUNTS
      # ROUNDING ORDER IS PINNED: round each account's share first, then push the
      # signed residue onto the first ordered account.
      for ia in ACC: share[ia] = round_half_up(total_amount_cents * ia.ownership_pct, 0)
      residue = total_amount_cents - sum(share[ia] for ia in ACC)
      share[first element of ACC] += residue
      allocation_breakdown = [{investor_account_id: ia.id, investor_id: ia.investor_id,
                               amount_cents: share[ia]} for ia in ACC]
      # declaration effects
      for ia in ACC: ia.declared_distribution_cents += share[ia]
      # payment effects (POST .../pay) replay the FROZEN breakdown, never recompute
      for entry in allocation_breakdown: account(entry).distributions_paid_cents += entry.amount_cents
    input_set: "InvestorAccount rows of the production with units_total > 0; accounts reduced to zero units by rescission are excluded."
    constants: {}
    precision: "Integer cents; sum(allocation_breakdown[*].amount_cents) == total_amount_cents exactly."

  - name: subsidiary_rights_investor_share
    trigger: "POST /subsidiary-rights-income/{id}/allocate"
    algorithm: aggregation
    formula: |
      investor_share_cents = round_half_up(gross_income_cents
                                           * P.subsidiary_rights_investor_share_pct, 0)
    input_set: "The single SubsidiaryRightsIncome row being allocated; the percentage is read from the Production at allocation time."
    constants: {}
    precision: "Integer cents, round_half_up."

  - name: closing_reserve_settlement
    trigger: "POST /closing-notices/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      reserve_balance_at_settlement_cents =
          sum(bl.amount_cents for bl in BudgetLine
              where production_id == P.id AND component == RESERVE
                AND commitment_status == COMMITTED)
      # bucket 1: closing costs are paid from the reserve
      # bucket 2: whatever survives is released to the recoupment ledger
      reserve_released_cents      = max(0, reserve_balance_at_settlement_cents - closing_costs_cents)
      closing_cost_shortfall_cents = max(0, closing_costs_cents - reserve_balance_at_settlement_cents)
    input_set: "RESERVE BudgetLines in commitment_status COMMITTED at the settlement instant (they were moved PLANNED -> COMMITTED when the notice was issued); PLANNED and SPENT lines are excluded."
    constants: {}
    precision: "Integer cents; no rounding required."

  - name: capitalization_budget_rollup
    trigger: "POST /budget-lines, POST /budget-lines/{id}/commit, POST /productions/{id}/approve-budget, and the RESERVE cascades of POST /closing-notices, /withdraw and /settle"
    algorithm: aggregation
    formula: |
      budget_total_cents     = sum(bl.amount_cents for bl in BudgetLine
                                   where production_id == P.id
                                     AND commitment_status IN {PLANNED, COMMITTED, SPENT})
      budget_committed_cents = sum(bl.amount_cents for bl in BudgetLine
                                   where production_id == P.id
                                     AND commitment_status IN {COMMITTED, SPENT})
      # fiscal gate applied on POST /budget-lines only
      assert budget_total_cents <= P.capitalization_target_cents
    input_set: "Every BudgetLine of the production; there is no soft-delete, so all three commitment statuses are in scope for budget_total_cents."
    constants: {}
    precision: "Integer cents."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves to an existing row, validated left-to-right"
    error_id: "ERR_THEATRE_NOT_FOUND | ERR_PRODUCTION_NOT_FOUND | ERR_THEATRE_ENGAGEMENT_NOT_FOUND | ERR_BUDGET_LINE_NOT_FOUND | ERR_OPERATING_BUDGET_NOT_FOUND | ERR_OFFERING_DOCUMENT_NOT_FOUND | ERR_INVESTOR_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_INVESTOR_ACCOUNT_NOT_FOUND | ERR_ROYALTY_PARTICIPANT_NOT_FOUND | ERR_WEEKLY_WRAP_NOT_FOUND | ERR_ROYALTY_ALLOCATION_NOT_FOUND | ERR_SUBSIDIARY_RIGHTS_INCOME_NOT_FOUND | ERR_INVESTOR_DISTRIBUTION_NOT_FOUND | ERR_CLOSING_NOTICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "Required body fields are present; enum fields hold a declared member; integer fields are integers within their declared constraint; percentage fields carry at most their declared decimals; date fields are ISO 8601 calendar dates; end_date >= start_date and expiration_date >= effective_date; limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body or query parameters"

  - priority: 5
    category: business_referential
    check: "Every FK supplied in the body resolves to an existing row (production_id, theatre_id, offering_document_id, investor_id)"
    error_id: "ERR_PRODUCTION_NOT_FOUND | ERR_THEATRE_NOT_FOUND | ERR_OFFERING_DOCUMENT_NOT_FOUND | ERR_INVESTOR_NOT_FOUND"
    http_status: 404
    applies_to: "POST /productions, POST /theatre-engagements, POST /budget-lines, POST /operating-budgets, POST /offering-documents, POST /subscriptions, POST /royalty-participants, POST /weekly-wraps, POST /subsidiary-rights-income, POST /investor-distributions, POST /closing-notices"

  - priority: 6
    category: auth
    check: "When X-User-Role == Investor, the acting investor owns the resource: X-User-ID == Subscription.investor_id (or == body investor_id on create, or == InvestorAccount.investor_id on read)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/resubmit, GET /subscriptions/{id}, GET /investor-accounts/{id}, GET /investors/{id}"

  - priority: 7
    category: auth
    check: "Segregation of duties: the certifying operator differs from WeeklyWrap.submitted_by_user_id, and the settling operator differs from ClosingNotice.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /weekly-wraps/{id}/certify, POST /closing-notices/{id}/settle"

  - priority: 8
    category: state
    check: "The target row is in a state from which the requested transition exists (see §1.2 for each machine)"
    error_id: "ERR_INVALID_OFFERING_STATE | ERR_INVALID_OPERATING_STATE | ERR_INVALID_OFFERING_DOCUMENT_STATE | ERR_INVALID_SUBSCRIPTION_STATE | ERR_INVALID_OPERATING_BUDGET_STATE | ERR_INVALID_BUDGET_LINE_STATE | ERR_INVALID_PARTICIPANT_STATE | ERR_INVALID_WRAP_STATE | ERR_INVALID_INCOME_STATE | ERR_INVALID_DISTRIBUTION_STATE | ERR_INVALID_CLOSING_NOTICE_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "Cross-entity state gates: a Subscription may only be created, accepted or resubmitted while its OfferingDocument.status == EFFECTIVE, and status IN {DRAFT, WITHDRAWN} raises ERR_OFFERING_NOT_EFFECTIVE here while status == EXPIRED is deliberately deferred to priority 12 so the lapsed-window case reports the more specific ERR_OFFERING_EXPIRED; a WeeklyWrap may only be created, submitted or amended while Production.operating_status IN {PREVIEWS, RUNNING, CLOSING_NOTICE}; an OfferingDocument may only be made EFFECTIVE while Production.offering_status == OFFERING; a SubsidiaryRightsIncome may only be allocated while Production.offering_status == CAPITALIZED; a ClosingNotice may only be settled while no WeeklyWrap of the production has status IN {DRAFT, SUBMITTED, DISPUTED, AMENDED}; a wrap may only be certified while its pinned OperatingBudget.version is unchanged; a WeeklyWrap may only be created or amended while exactly one OperatingBudget of the production has status == ACTIVE; the operating axis may only be advanced REHEARSAL -> PREVIEWS while exactly one OperatingBudget of the production has status == ACTIVE (ERR_ACTIVE_OPERATING_BUDGET_MISSING)"
    error_id: "ERR_OFFERING_NOT_EFFECTIVE | ERR_PRODUCTION_NOT_PERFORMING | ERR_PRODUCTION_NOT_OFFERING | ERR_PRODUCTION_NOT_CAPITALIZED | ERR_UNCERTIFIED_WRAPS_EXIST | ERR_OPERATING_BUDGET_CHANGED | ERR_ACTIVE_OPERATING_BUDGET_MISSING"
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/accept, POST /subscriptions/{id}/resubmit, POST /weekly-wraps, POST /weekly-wraps/{id}/submit, POST /weekly-wraps/{id}/certify, POST /weekly-wraps/{id}/amend, POST /offering-documents/{id}/make-effective, POST /subsidiary-rights-income/{id}/allocate, POST /closing-notices/{id}/settle, POST /productions/{id}/operating-status, GET /productions/{id}/break-even-analysis"

  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_production_version equals the current Production.version"
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412
    applies_to: "POST /budget-lines, POST /investor-distributions"

  - priority: 11
    category: business_safety
    check: "Securities compliance: the subscribing Investor.accreditation_status == ACCREDITED; the OfferingDocument.doc_type agrees with Production.offering_entity_type (LP -> LP_AGREEMENT, LLC -> LLC_OPERATING_AGREEMENT); accepting the subscription keeps distinct accepted investors <= OfferingDocument.max_investors"
    error_id: "ERR_INVESTOR_NOT_ACCREDITED | ERR_OFFERING_TYPE_MISMATCH | ERR_MAX_INVESTORS_EXCEEDED"
    http_status: 422
    applies_to: "POST /offering-documents, POST /subscriptions, POST /subscriptions/{id}/accept"

  - priority: 12
    category: business_temporal
    check: "Temporal rules: the current logical UTC date is within [effective_date, expiration_date] when a document is made effective and when a subscription is created or accepted; WeeklyWrap.week_ending_date is not later than the current logical UTC date; ClosingNotice.notice_date is not earlier than the current logical UTC date; final_performance_date - notice_date >= Production.closing_notice_min_days"
    error_id: "ERR_OFFERING_EXPIRED | ERR_WRAP_WEEK_IN_FUTURE | ERR_NOTICE_DATE_IN_PAST | ERR_INSUFFICIENT_CLOSING_NOTICE"
    http_status: 422
    applies_to: "POST /offering-documents/{id}/make-effective, POST /subscriptions, POST /subscriptions/{id}/accept, POST /weekly-wraps, POST /weekly-wraps/{id}/amend, POST /closing-notices"

  - priority: 13
    category: business_constraint
    check: "Occupation and uniqueness constraints: a TheatreEngagement may not collide with another engagement of the same theatre_id under the buffered closed-interval rule; a WeeklyWrap may not collide with another non-VOID wrap of the same production under the half-open week rule; a production may not already have an ISSUED ClosingNotice; a production must not already have an ACTIVE OperatingBudget when a second is activated is allowed (it supersedes), but a production must have exactly one ACTIVE budget to create a wrap; royalty_basis may only be converted once"
    error_id: "ERR_THEATRE_ENGAGEMENT_OVERLAP | ERR_WRAP_WEEK_OVERLAP | ERR_CLOSING_NOTICE_ALREADY_ISSUED | ERR_ROYALTY_BASIS_ALREADY_POOL"
    http_status: 409
    applies_to: "POST /theatre-engagements, POST /weekly-wraps, POST /closing-notices, POST /productions/{id}/convert-royalties-to-pool"

  - priority: 14
    category: business_fiscal
    check: "Fiscal ceilings, evaluated in exactly this order: (14a) accepting a subscription may not push OfferingDocument.accepted_amount_cents above offering_amount_cents; (14b) a new BudgetLine may not push Production.budget_total_cents above capitalization_target_cents; (14c) a distribution requires at least one InvestorAccount of the production with units_total > 0 — this is a structural check on the existence of a payee set and is evaluated BEFORE any cash ceiling, so a production with no capital accounts reports ERR_NO_INVESTOR_ACCOUNTS and never the amount error; (14d) a NET_PROFIT distribution requires Production.recoupment_status == RECOUPED; (14e) a declared distribution may not exceed Production.distributable_cash_cents"
    error_id: "ERR_OVERSUBSCRIPTION | ERR_BUDGET_EXCEEDS_CAPITALIZATION | ERR_DISTRIBUTION_EXCEEDS_DISTRIBUTABLE | ERR_NOT_YET_RECOUPED | ERR_NO_INVESTOR_ACCOUNTS"
    http_status: 422
    applies_to: "POST /subscriptions/{id}/accept, POST /budget-lines, POST /investor-distributions"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ------------------------------------------------------------------ Theatre
  - method: POST
    path: "/theatres"
    description: "Register a house with its seat count and top ticket price"
    roles: [GeneralManager]
    code: 201
    input: [name, seat_count, top_ticket_price_cents, "changeover_buffer_days?", "weekly_fixed_rent_cents?"]
    output: Theatre
    side_effects: ["none"]

  - method: GET
    path: "/theatres/{id}"
    description: "Read one house"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: []
    output: Theatre
    side_effects: []

  # --------------------------------------------------------------- Production
  - method: POST
    path: "/productions"
    description: "Open a production file with its capitalization target and performance house"
    roles: [GeneralManager]
    code: 201
    input: [title, offering_entity_type, capitalization_target_cents, reserve_target_cents, theatre_id, "pre_recoupment_pool_pct?", "post_recoupment_pool_pct?", "subsidiary_rights_investor_share_pct?", "closing_notice_min_days?"]
    output: Production
    side_effects:
      - "offering_status = DRAFT, operating_status = PRE_PRODUCTION, recoupment_status = UNRECOUPED, budget_status = DRAFT, royalty_basis = FIXED_GROSS"
      - "all computed money and point roll-ups initialise to 0; version = 1"

  - method: GET
    path: "/productions/{id}"
    description: "Read one production including every rolled-up ledger field"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: GET
    path: "/productions"
    description: "List productions, filterable by house and by either state axis"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: ["theatre_id?", "offering_status?", "operating_status?", "recoupment_status?", "limit?", "offset?"]
    output: Production[]
    side_effects: []

  - method: POST
    path: "/productions/{id}/open-offering"
    description: "Move the offering axis DRAFT -> OFFERING"
    roles: [SyndicationCounsel]
    code: 200
    input: []
    output: Production
    side_effects: ["offering_status = OFFERING", "increments Production.version by 1"]

  - method: POST
    path: "/productions/{id}/capitalize"
    description: "Release escrowed capital and move the offering axis FULLY_SUBSCRIBED -> CAPITALIZED"
    roles: [Comptroller]
    code: 200
    input: []
    output: Production
    side_effects:
      - "released_capital_cents = capital_raised_cents; escrow_balance_cents = 0"
      - "increments Production.version by 1"

  - method: POST
    path: "/productions/{id}/operating-status"
    description: "Advance the operating axis (PRE_PRODUCTION -> REHEARSAL -> PREVIEWS -> RUNNING)"
    roles: [LeadProducer]
    code: 200
    input: [to_status]
    output: Production
    side_effects: ["operating_status = to_status", "increments Production.version by 1"]

  - method: POST
    path: "/productions/{id}/convert-royalties-to-pool"
    description: "Convert fixed gross royalties into a royalty pool expressed as a percentage of weekly operating profit"
    roles: [LeadProducer]
    code: 200
    input: []
    output: Production
    side_effects:
      - "royalty_basis = POOL"
      - "recomputes Production.total_pool_points and every participant's pool_share_pct via royalty_pool_share_pct"
      - "increments Production.version by 1"

  - method: POST
    path: "/productions/{id}/approve-budget"
    description: "Approve the capitalization budget, unlocking line commitment"
    roles: [LeadProducer]
    code: 200
    input: []
    output: Production
    side_effects:
      - "budget_status = APPROVED"
      - "recomputes budget_total_cents / budget_committed_cents via capitalization_budget_rollup"
      - "increments Production.version by 1"

  - method: GET
    path: "/productions/{id}/break-even-analysis"
    description: "Weekly break-even gross and capacity, plus the run-rate recoupment projection"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: []
    output: "{ production_id: string, operating_budget_id: string, royalty_min_guarantee_floor_cents: integer, target_adjusted_gross_cents: integer, break_even_gross_cents: integer, capacity_gross_projection_cents: integer, break_even_paid_capacity_pct: number, weeks_to_recoup_at_last_certified_run_rate: integer }"
    side_effects: []

  - method: GET
    path: "/productions/{id}/recoupment-report"
    description: "Both recoupment variants side by side for investor reporting"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: []
    output: "{ production_id: string, capitalization_target_cents: integer, cash_basis_recouped_cents: integer, cash_basis_recoupment_pct: number, accrual_basis_recouped_cents: integer, accrual_basis_recoupment_pct: number, deferred_royalty_cents: integer, subsidiary_rights_receivable_cents: integer, recoupment_status: string, distributable_cash_cents: integer }"
    side_effects: []

  # -------------------------------------------------------- TheatreEngagement
  - method: POST
    path: "/theatre-engagements"
    description: "Book a rehearsal, tech or performance occupation of a house"
    roles: [GeneralManager]
    code: 201
    input: [production_id, theatre_id, engagement_type, start_date, end_date]
    output: TheatreEngagement
    side_effects: ["rejects any occupation colliding with an existing engagement of the same theatre under the buffered closed-interval rule"]

  - method: GET
    path: "/theatre-engagements/{id}"
    description: "Read one engagement"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: []
    output: TheatreEngagement
    side_effects: []

  - method: GET
    path: "/theatre-engagements"
    description: "List engagements by production, house or type"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: ["production_id?", "theatre_id?", "engagement_type?", "limit?", "offset?"]
    output: TheatreEngagement[]
    side_effects: []

  # --------------------------------------------------------------- BudgetLine
  - method: POST
    path: "/budget-lines"
    description: "Add a line to the capitalization budget under optimistic concurrency on the production"
    roles: [GeneralManager]
    code: 201
    input: [production_id, component, description, amount_cents, expected_production_version]
    output: BudgetLine
    side_effects:
      - "commitment_status = PLANNED"
      - "recomputes Production.budget_total_cents via capitalization_budget_rollup"
      - "increments Production.version by 1"

  - method: POST
    path: "/budget-lines/{id}/commit"
    description: "Commit a budget line against approved capitalization"
    roles: [GeneralManager]
    code: 200
    input: []
    output: BudgetLine
    side_effects:
      - "commitment_status = COMMITTED"
      - "recomputes Production.budget_committed_cents"
      - "increments Production.version by 1"

  - method: GET
    path: "/budget-lines/{id}"
    description: "Read one budget line"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: GET
    path: "/budget-lines"
    description: "List budget lines by production, component or commitment status"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: ["production_id?", "component?", "commitment_status?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []

  # ----------------------------------------------------------- OperatingBudget
  - method: POST
    path: "/operating-budgets"
    description: "Draft a weekly operating budget with running costs and variable cost percentage"
    roles: [GeneralManager]
    code: 201
    input: [production_id, weekly_fixed_running_cost_cents, variable_cost_pct, "performances_per_week?"]
    output: OperatingBudget
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/operating-budgets/{id}/activate"
    description: "Activate a weekly operating budget, superseding the previous one"
    roles: [Comptroller]
    code: 200
    input: []
    output: OperatingBudget
    side_effects:
      - "status = ACTIVE"
      - "the production's previously ACTIVE budget becomes SUPERSEDED and its version increments by 1"

  - method: GET
    path: "/operating-budgets/{id}"
    description: "Read one operating budget"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: []
    output: OperatingBudget
    side_effects: []

  - method: GET
    path: "/operating-budgets"
    description: "List operating budgets by production or status"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: OperatingBudget[]
    side_effects: []

  # ---------------------------------------------------------- OfferingDocument
  - method: POST
    path: "/offering-documents"
    description: "Create the LP agreement or LLC operating agreement offering instrument"
    roles: [SyndicationCounsel]
    code: 201
    input: [production_id, doc_type, offering_amount_cents, unit_price_cents, max_investors, effective_date, expiration_date]
    output: OfferingDocument
    side_effects: ["status = DRAFT", "rejects a doc_type that disagrees with Production.offering_entity_type"]

  - method: POST
    path: "/offering-documents/{id}/make-effective"
    description: "Make the offering document effective so subscriptions may be accepted"
    roles: [SyndicationCounsel]
    code: 200
    input: []
    output: OfferingDocument
    side_effects: ["status = EFFECTIVE", "increments OfferingDocument.version by 1"]

  - method: POST
    path: "/offering-documents/{id}/withdraw"
    description: "Withdraw the offering document"
    roles: [SyndicationCounsel]
    code: 200
    input: [withdrawal_reason]
    output: OfferingDocument
    side_effects: ["status = WITHDRAWN", "increments OfferingDocument.version by 1"]

  - method: GET
    path: "/offering-documents/{id}"
    description: "Read one offering document; applies the lazy EFFECTIVE -> EXPIRED transition first"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: []
    output: OfferingDocument
    side_effects: ["EFFECTIVE documents past expiration_date transition to EXPIRED before the response is built"]

  - method: GET
    path: "/offering-documents"
    description: "List offering documents by production or status"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: OfferingDocument[]
    side_effects: ["EFFECTIVE documents past expiration_date transition to EXPIRED before the response is built"]

  # --------------------------------------------------------------- Investor
  - method: POST
    path: "/investors"
    description: "Register a prospective investor"
    roles: [SyndicationCounsel]
    code: 201
    input: [legal_name, jurisdiction, contact_email]
    output: Investor
    side_effects: ["accreditation_status = UNVERIFIED"]

  - method: POST
    path: "/investors/{id}/accredit"
    description: "Record the accreditation determination for an investor"
    roles: [SyndicationCounsel]
    code: 200
    input: [accreditation_status]
    output: Investor
    side_effects: ["accreditation_status = the supplied value", "increments Investor.version by 1"]

  - method: GET
    path: "/investors/{id}"
    description: "Read one investor; the Investor role may only read itself"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: []
    output: Investor
    side_effects: []

  # ------------------------------------------------------------- Subscription
  - method: POST
    path: "/subscriptions"
    description: "Submit a subscription for units under an effective offering document"
    roles: [Investor]
    code: 201
    input: [offering_document_id, investor_id, units]
    output: Subscription
    side_effects:
      - "status = SUBMITTED, cure_round_count = 0, amount_cents = units * unit_price_cents"
      - "recomputes OfferingDocument.submitted_units_total and increments OfferingDocument.version by 1"

  - method: POST
    path: "/subscriptions/{id}/return-for-cure"
    description: "Return a subscription to the investor for cure, or reject it once the cure limit is passed"
    roles: [SyndicationCounsel]
    code: 200
    input: [defect_note]
    output: Subscription
    side_effects:
      - "increments cure_round_count by 1; status = RETURNED_FOR_CURE, or REJECTED when the incremented count exceeds MAX_CURE_ROUNDS (2)"
      - "increments OfferingDocument.version by 1"

  - method: POST
    path: "/subscriptions/{id}/resubmit"
    description: "Investor resubmits a cured subscription, optionally with a different unit count"
    roles: [Investor]
    code: 200
    input: [units]
    output: Subscription
    side_effects:
      - "status = SUBMITTED; amount_cents recomputed"
      - "increments OfferingDocument.version by 1"

  - method: POST
    path: "/subscriptions/{id}/accept"
    description: "Accept a subscription into the capital account, escrow the funds and roll up ownership"
    roles: [SyndicationCounsel]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "status = ACCEPTED"
      - "creates or updates the investor's InvestorAccount, then recomputes ownership_pct for every account via investor_ownership_allocation"
      - "recomputes Production.capital_raised_cents / escrow_balance_cents / active_investor_count and may advance offering_status OFFERING -> FULLY_SUBSCRIBED"
      - "increments OfferingDocument.version by 1 and Production.version by 1"

  - method: POST
    path: "/subscriptions/{id}/rescind"
    description: "Rescind an accepted subscription and unwind its capital account effects"
    roles: [SyndicationCounsel]
    code: 200
    input: [rescission_reason]
    output: Subscription
    side_effects:
      - "status = RESCINDED"
      - "recomputes the investor's InvestorAccount downward, then ownership_pct for every account"
      - "recomputes Production.capital_raised_cents / escrow_balance_cents and may revert offering_status FULLY_SUBSCRIBED -> OFFERING"
      - "increments OfferingDocument.version by 1 and Production.version by 1"

  - method: GET
    path: "/subscriptions/{id}"
    description: "Read one subscription; the Investor role may only read its own"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions by offering document, investor or status"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: ["offering_document_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  # ------------------------------------------------------------ InvestorAccount
  - method: GET
    path: "/investor-accounts/{id}"
    description: "Read one capital account; the Investor role may only read its own"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer, Investor]
    code: 200
    input: []
    output: InvestorAccount
    side_effects: []

  - method: GET
    path: "/investor-accounts"
    description: "List capital accounts by production or investor"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: ["production_id?", "investor_id?", "limit?", "offset?"]
    output: InvestorAccount[]
    side_effects: []

  # -------------------------------------------------------- RoyaltyParticipant
  - method: POST
    path: "/royalty-participants"
    description: "Add a royalty participant with both a fixed gross percentage and pool points"
    roles: [GeneralManager]
    code: 201
    input: [production_id, participant_name, role, fixed_gross_pct, pool_points, min_guarantee_cents]
    output: RoyaltyParticipant
    side_effects:
      - "status = ACTIVE"
      - "recomputes Production.total_pool_points and every participant's pool_share_pct via royalty_pool_share_pct"
      - "increments Production.version by 1"

  - method: POST
    path: "/royalty-participants/{id}/terminate"
    description: "Terminate a royalty participation, removing its points and guarantee from the pool"
    roles: [LeadProducer]
    code: 200
    input: []
    output: RoyaltyParticipant
    side_effects:
      - "status = TERMINATED, pool_share_pct = 0.0000"
      - "recomputes Production.total_pool_points and surviving participants' pool_share_pct"
      - "increments Production.version by 1"

  - method: POST
    path: "/royalty-participants/{id}/reinstate"
    description: "Reinstate a terminated royalty participation"
    roles: [LeadProducer]
    code: 200
    input: []
    output: RoyaltyParticipant
    side_effects:
      - "status = ACTIVE"
      - "recomputes Production.total_pool_points and every participant's pool_share_pct"
      - "increments Production.version by 1"

  - method: GET
    path: "/royalty-participants/{id}"
    description: "Read one royalty participant"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: []
    output: RoyaltyParticipant
    side_effects: []

  - method: GET
    path: "/royalty-participants"
    description: "List royalty participants by production or status"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: ["production_id?", "status?", "role?", "limit?", "offset?"]
    output: RoyaltyParticipant[]
    side_effects: []

  # ---------------------------------------------------------------- WeeklyWrap
  - method: POST
    path: "/weekly-wraps"
    description: "Open the weekly wrap with grosses, attendance and running expenses; pins the active operating budget"
    roles: [GeneralManager]
    code: 201
    input: [production_id, week_ending_date, performances, gross_receipts_cents, paid_attendance, running_expenses_cents]
    output: WeeklyWrap
    side_effects:
      - "status = DRAFT; operating_budget_id and operating_budget_version_pinned captured from the single ACTIVE OperatingBudget"
      - "wrap_settlement steps 1-3 compute capacity_gross_cents / paid_capacity_pct / variable_cost_cents / adjusted_gross_cents / royalty_base_cents provisionally"
      - "rejects a week colliding with another non-VOID wrap of the same production"

  - method: POST
    path: "/weekly-wraps/{id}/submit"
    description: "Submit the wrap for certification"
    roles: [GeneralManager]
    code: 200
    input: []
    output: WeeklyWrap
    side_effects: ["status = SUBMITTED; submitted_by_user_id = caller's X-User-ID", "increments WeeklyWrap.version by 1"]

  - method: POST
    path: "/weekly-wraps/{id}/certify"
    description: "Certify the wrap, settle the royalty burden and post the week to the recoupment ledger"
    roles: [Comptroller]
    code: 200
    input: []
    output: WeeklyWrap
    side_effects:
      - "status = CERTIFIED; certified_by_user_id set; royalty_basis_applied frozen"
      - "wrap_settlement step 4-5 then royalty_pool_split then participant ledgers then recoupment_progress then the RECOUPED cascade onto every InvestorAccount"
      - "increments Production.version by 1"

  - method: POST
    path: "/weekly-wraps/{id}/dispute"
    description: "Dispute a submitted wrap"
    roles: [Comptroller]
    code: 200
    input: [dispute_note]
    output: WeeklyWrap
    side_effects: ["status = DISPUTED", "increments WeeklyWrap.version by 1"]

  - method: POST
    path: "/weekly-wraps/{id}/amend"
    description: "Amend a disputed wrap's reported figures and re-pin the operating budget"
    roles: [GeneralManager]
    code: 200
    input: ["performances?", "gross_receipts_cents?", "paid_attendance?", "running_expenses_cents?"]
    output: WeeklyWrap
    side_effects:
      - "status = AMENDED; supplied fields overwritten; provisional derivations refreshed; submitted_by_user_id cleared"
      - "operating_budget_id / operating_budget_version_pinned re-captured from the current ACTIVE OperatingBudget"

  - method: POST
    path: "/weekly-wraps/{id}/void"
    description: "Void a certified wrap and unwind its royalty and recoupment effects"
    roles: [Comptroller]
    code: 200
    input: [void_reason]
    output: WeeklyWrap
    side_effects:
      - "status = VOID"
      - "reverses every RoyaltyAllocation, participant ledger, the recoupment ledger and any RECOUPED flag it caused"
      - "increments Production.version by 1"

  - method: GET
    path: "/weekly-wraps/{id}"
    description: "Read one wrap"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: []
    output: WeeklyWrap
    side_effects: []

  - method: GET
    path: "/weekly-wraps"
    description: "List wraps by production, pinned operating budget or status"
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: ["production_id?", "operating_budget_id?", "status?", "limit?", "offset?"]
    output: WeeklyWrap[]
    side_effects: []

  # --------------------------------------------------------- RoyaltyAllocation
  - method: GET
    path: "/royalty-allocations/{id}"
    description: "Read one royalty allocation"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: []
    output: RoyaltyAllocation
    side_effects: []

  - method: GET
    path: "/royalty-allocations"
    description: "List royalty allocations by wrap, participant or status; the only discovery channel for cascade-created allocations"
    roles: [GeneralManager, Comptroller, LeadProducer]
    code: 200
    input: ["wrap_id?", "royalty_participant_id?", "status?", "limit?", "offset?"]
    output: RoyaltyAllocation[]
    side_effects: []

  # ---------------------------------------------------- SubsidiaryRightsIncome
  - method: POST
    path: "/subsidiary-rights-income"
    description: "Record subsidiary rights licensing income"
    roles: [GeneralManager]
    code: 201
    input: [production_id, source, gross_income_cents, received_date]
    output: SubsidiaryRightsIncome
    side_effects: ["status = RECORDED; investor_share_cents = 0"]

  - method: POST
    path: "/subsidiary-rights-income/{id}/allocate"
    description: "Allocate the investor participation in licensing income to the recoupment ledger"
    roles: [Comptroller]
    code: 200
    input: []
    output: SubsidiaryRightsIncome
    side_effects:
      - "status = ALLOCATED; investor_share_cents computed"
      - "recoupment_progress recomputes the production ledger and may flip recoupment_status"
      - "increments Production.version by 1"

  - method: GET
    path: "/subsidiary-rights-income/{id}"
    description: "Read one licensing income row"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: []
    output: SubsidiaryRightsIncome
    side_effects: []

  - method: GET
    path: "/subsidiary-rights-income"
    description: "List licensing income by production, status or source"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: ["production_id?", "status?", "source?", "limit?", "offset?"]
    output: SubsidiaryRightsIncome[]
    side_effects: []

  # ------------------------------------------------------ InvestorDistribution
  - method: POST
    path: "/investor-distributions"
    description: "Declare a distribution to investors under optimistic concurrency on the production"
    roles: [Comptroller]
    code: 201
    input: [production_id, distribution_type, total_amount_cents, expected_production_version]
    output: InvestorDistribution
    side_effects:
      - "status = DECLARED; allocation_breakdown frozen by distribution_allocation"
      - "each account's declared_distribution_cents increases by its frozen share"
      - "recomputes Production.distributed_total_cents / distributable_cash_cents"
      - "increments Production.version by 1"

  - method: POST
    path: "/investor-distributions/{id}/pay"
    description: "Pay a declared distribution using its frozen breakdown"
    roles: [Comptroller]
    code: 200
    input: []
    output: InvestorDistribution
    side_effects: ["status = PAID; each account's distributions_paid_cents increases by its frozen share", "increments InvestorDistribution.version by 1"]

  - method: GET
    path: "/investor-distributions/{id}"
    description: "Read one distribution including its frozen breakdown"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: []
    output: InvestorDistribution
    side_effects: []

  - method: GET
    path: "/investor-distributions"
    description: "List distributions by production, status or type"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: ["production_id?", "status?", "distribution_type?", "limit?", "offset?"]
    output: InvestorDistribution[]
    side_effects: []

  # ------------------------------------------------------------- ClosingNotice
  - method: POST
    path: "/closing-notices"
    description: "Post a closing notice, moving the production onto the closing calendar and committing the reserve"
    roles: [LeadProducer]
    code: 201
    input: [production_id, notice_date, final_performance_date, reason]
    output: ClosingNotice
    side_effects:
      - "status = ISSUED; notice_days computed; issued_by_user_id = caller's X-User-ID"
      - "Production.operating_status -> CLOSING_NOTICE; RESERVE budget lines PLANNED -> COMMITTED; budget_committed_cents recomputed"
      - "increments Production.version by 1"

  - method: POST
    path: "/closing-notices/{id}/withdraw"
    description: "Withdraw a closing notice and return the production to performance"
    roles: [LeadProducer]
    code: 200
    input: [withdrawal_reason]
    output: ClosingNotice
    side_effects:
      - "status = WITHDRAWN"
      - "Production.operating_status -> RUNNING; RESERVE budget lines COMMITTED -> PLANNED; budget_committed_cents recomputed"
      - "increments Production.version by 1"

  - method: POST
    path: "/closing-notices/{id}/settle"
    description: "Settle closing costs against the reserve, release the surplus and close the production"
    roles: [Comptroller]
    code: 200
    input: [closing_costs_cents]
    output: ClosingNotice
    side_effects:
      - "status = SETTLED; settled_by_user_id set; closing_reserve_settlement computes the reserve release and any shortfall"
      - "RESERVE budget lines COMMITTED -> SPENT; Production.operating_status -> CLOSED; recoupment ledger and RECOUPED cascade refreshed"
      - "increments Production.version by 1"

  - method: GET
    path: "/closing-notices/{id}"
    description: "Read one closing notice"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: []
    output: ClosingNotice
    side_effects: []

  - method: GET
    path: "/closing-notices"
    description: "List closing notices by production or status"
    roles: [GeneralManager, Comptroller, LeadProducer, Investor]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: ClosingNotice[]
    side_effects: []

  # --------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the logical clock reads that instant and never falls back to real wall-clock time. Every date comparison (offering effective window, wrap week, closing notice period) reads this clock."
    roles: [GeneralManager, Comptroller, SyndicationCounsel, LeadProducer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock; no entity is mutated by the call itself"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Investor role acting on a Subscription, InvestorAccount or Investor row whose investor_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Certifying operator equals WeeklyWrap.submitted_by_user_id, or settling operator equals ClosingNotice.issued_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, undeclared enum member, non-integer or out-of-range number, malformed date, end before start, or pagination parameter out of 1..100 / >= 0"
  - id: ERR_THEATRE_NOT_FOUND
    http: 404
    condition: "theatre_id in path or body does not resolve"
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "production id in path or body does not resolve"
  - id: ERR_THEATRE_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "TheatreEngagement id in path does not resolve"
  - id: ERR_BUDGET_LINE_NOT_FOUND
    http: 404
    condition: "BudgetLine id in path does not resolve"
  - id: ERR_OPERATING_BUDGET_NOT_FOUND
    http: 404
    condition: "OperatingBudget id in path does not resolve"
  - id: ERR_OFFERING_DOCUMENT_NOT_FOUND
    http: 404
    condition: "OfferingDocument id in path or body does not resolve"
  - id: ERR_INVESTOR_NOT_FOUND
    http: 404
    condition: "Investor id in path or body does not resolve"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "Subscription id in path does not resolve"
  - id: ERR_INVESTOR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "InvestorAccount id in path does not resolve"
  - id: ERR_ROYALTY_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "RoyaltyParticipant id in path does not resolve"
  - id: ERR_WEEKLY_WRAP_NOT_FOUND
    http: 404
    condition: "WeeklyWrap id in path does not resolve"
  - id: ERR_ROYALTY_ALLOCATION_NOT_FOUND
    http: 404
    condition: "RoyaltyAllocation id in path does not resolve"
  - id: ERR_SUBSIDIARY_RIGHTS_INCOME_NOT_FOUND
    http: 404
    condition: "SubsidiaryRightsIncome id in path does not resolve"
  - id: ERR_INVESTOR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "InvestorDistribution id in path does not resolve"
  - id: ERR_CLOSING_NOTICE_NOT_FOUND
    http: 404
    condition: "ClosingNotice id in path does not resolve"
  - id: ERR_INVALID_OFFERING_STATE
    http: 409
    condition: "Production.offering_status does not permit the requested offering-axis transition (open-offering from a non-DRAFT state, capitalize from a non-FULLY_SUBSCRIBED state)"
  - id: ERR_INVALID_OPERATING_STATE
    http: 409
    condition: "Production.operating_status does not permit the requested to_status on the operating axis"
  - id: ERR_INVALID_OFFERING_DOCUMENT_STATE
    http: 409
    condition: "OfferingDocument.status does not permit make-effective or withdraw"
  - id: ERR_INVALID_SUBSCRIPTION_STATE
    http: 409
    condition: "Subscription.status does not permit return-for-cure, resubmit, accept or rescind"
  - id: ERR_INVALID_OPERATING_BUDGET_STATE
    http: 409
    condition: "OperatingBudget.status is not DRAFT when activation is requested"
  - id: ERR_INVALID_BUDGET_LINE_STATE
    http: 409
    condition: "BudgetLine.commitment_status is not PLANNED when commitment is requested"
  - id: ERR_INVALID_PARTICIPANT_STATE
    http: 409
    condition: "RoyaltyParticipant.status is not ACTIVE for terminate, or not TERMINATED for reinstate"
  - id: ERR_INVALID_WRAP_STATE
    http: 409
    condition: "WeeklyWrap.status does not permit submit, certify, dispute, amend or void"
  - id: ERR_INVALID_INCOME_STATE
    http: 409
    condition: "SubsidiaryRightsIncome.status is not RECORDED when allocation is requested"
  - id: ERR_INVALID_DISTRIBUTION_STATE
    http: 409
    condition: "InvestorDistribution.status is not DECLARED when payment is requested"
  - id: ERR_INVALID_CLOSING_NOTICE_STATE
    http: 409
    condition: "ClosingNotice.status is not ISSUED when withdraw or settle is requested"
  - id: ERR_OFFERING_NOT_EFFECTIVE
    http: 409
    condition: "A subscription is created, resubmitted or accepted while its OfferingDocument.status is DRAFT or WITHDRAWN. Status EXPIRED is excluded here on purpose: the lapsed-window case is reported by ERR_OFFERING_EXPIRED at priority 12."
  - id: ERR_PRODUCTION_NOT_PERFORMING
    http: 409
    condition: "A wrap is created, submitted or amended while Production.operating_status is not in {PREVIEWS, RUNNING, CLOSING_NOTICE}"
  - id: ERR_PRODUCTION_NOT_OFFERING
    http: 409
    condition: "An offering document is made effective while Production.offering_status is not OFFERING"
  - id: ERR_PRODUCTION_NOT_CAPITALIZED
    http: 409
    condition: "Subsidiary rights income is allocated while Production.offering_status is not CAPITALIZED"
  - id: ERR_UNCERTIFIED_WRAPS_EXIST
    http: 409
    condition: "A closing notice is settled while some WeeklyWrap of the production is still in {DRAFT, SUBMITTED, DISPUTED, AMENDED}"
  - id: ERR_OPERATING_BUDGET_CHANGED
    http: 409
    condition: "A wrap is certified after the OperatingBudget it pinned has changed version (typically because a newer budget superseded it)"
  - id: ERR_ACTIVE_OPERATING_BUDGET_MISSING
    http: 409
    condition: "A wrap is created or amended, a break-even analysis is requested, or the operating axis is advanced to PREVIEWS, while the production has no OperatingBudget with status == ACTIVE"
  - id: ERR_STALE_PRODUCTION_VERSION
    http: 412
    condition: "expected_production_version does not equal the current Production.version on POST /budget-lines or POST /investor-distributions"
  - id: ERR_INVESTOR_NOT_ACCREDITED
    http: 422
    condition: "The subscribing Investor.accreditation_status is not ACCREDITED at creation or at acceptance"
  - id: ERR_OFFERING_TYPE_MISMATCH
    http: 422
    condition: "doc_type LP_AGREEMENT with offering_entity_type LLC, or LLC_OPERATING_AGREEMENT with LP"
  - id: ERR_MAX_INVESTORS_EXCEEDED
    http: 422
    condition: "Accepting the subscription would raise the document's distinct accepted-investor count above max_investors"
  - id: ERR_OFFERING_EXPIRED
    http: 422
    condition: "The current logical UTC date is outside [effective_date, expiration_date] when a document is made effective, or a subscription is created or accepted against a document whose lazy transition has moved it to EXPIRED"
  - id: ERR_WRAP_WEEK_IN_FUTURE
    http: 422
    condition: "week_ending_date is later than the current logical UTC date"
  - id: ERR_NOTICE_DATE_IN_PAST
    http: 422
    condition: "ClosingNotice.notice_date is earlier than the current logical UTC date"
  - id: ERR_INSUFFICIENT_CLOSING_NOTICE
    http: 422
    condition: "final_performance_date - notice_date is fewer than Production.closing_notice_min_days whole days"
  - id: ERR_THEATRE_ENGAGEMENT_OVERLAP
    http: 409
    condition: "A new engagement collides with an existing engagement of the same theatre once the house changeover buffer is applied to both sides"
  - id: ERR_WRAP_WEEK_OVERLAP
    http: 409
    condition: "A new wrap's half-open performance week intersects the week of another non-VOID wrap of the same production"
  - id: ERR_CLOSING_NOTICE_ALREADY_ISSUED
    http: 409
    condition: "A production already has a ClosingNotice with status == ISSUED"
  - id: ERR_ROYALTY_BASIS_ALREADY_POOL
    http: 409
    condition: "Conversion to a royalty pool is requested when Production.royalty_basis is already POOL"
  - id: ERR_OVERSUBSCRIPTION
    http: 422
    condition: "Accepting the subscription would raise OfferingDocument.accepted_amount_cents above offering_amount_cents"
  - id: ERR_BUDGET_EXCEEDS_CAPITALIZATION
    http: 422
    condition: "A new budget line would raise Production.budget_total_cents above capitalization_target_cents"
  - id: ERR_DISTRIBUTION_EXCEEDS_DISTRIBUTABLE
    http: 422
    condition: "total_amount_cents exceeds Production.distributable_cash_cents"
  - id: ERR_NOT_YET_RECOUPED
    http: 422
    condition: "A NET_PROFIT distribution is declared while Production.recoupment_status is UNRECOUPED"
  - id: ERR_NO_INVESTOR_ACCOUNTS
    http: 422
    condition: "A distribution is declared for a production with no InvestorAccount whose units_total > 0"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GeneralManager
    description: "General management office staff who build the capitalization budget, the weekly operating budget and the weekly wraps"
    identity: opaque
    exclusive_operations:
      - "POST /theatres"
      - "POST /productions"
      - "POST /theatre-engagements"
      - "POST /budget-lines"
      - "POST /budget-lines/{id}/commit"
      - "POST /operating-budgets"
      - "POST /royalty-participants"
      - "POST /weekly-wraps"
      - "POST /weekly-wraps/{id}/submit"
      - "POST /weekly-wraps/{id}/amend"
      - "POST /subsidiary-rights-income"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /theatres/{id}, GET /productions, GET /productions/{id}, GET /productions/{id}/break-even-analysis, GET /productions/{id}/recoupment-report"
      - "all GET list and read endpoints except none"

  - name: Comptroller
    description: "Production comptroller who certifies wraps, keeps the recoupment ledger and moves investor cash"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/capitalize"
      - "POST /operating-budgets/{id}/activate"
      - "POST /weekly-wraps/{id}/certify"
      - "POST /weekly-wraps/{id}/dispute"
      - "POST /weekly-wraps/{id}/void"
      - "POST /subsidiary-rights-income/{id}/allocate"
      - "POST /investor-distributions"
      - "POST /investor-distributions/{id}/pay"
      - "POST /closing-notices/{id}/settle"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET read and list endpoints"

  - name: SyndicationCounsel
    description: "Counsel running the offering: documents, accreditation and subscription processing"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/open-offering"
      - "POST /offering-documents"
      - "POST /offering-documents/{id}/make-effective"
      - "POST /offering-documents/{id}/withdraw"
      - "POST /investors"
      - "POST /investors/{id}/accredit"
      - "POST /subscriptions/{id}/return-for-cure"
      - "POST /subscriptions/{id}/accept"
      - "POST /subscriptions/{id}/rescind"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /theatres/{id}, GET /productions, GET /productions/{id}, GET /offering-documents, GET /subscriptions, GET /investor-accounts, GET /weekly-wraps"

  - name: LeadProducer
    description: "Lead producer who approves the budget, converts royalties to a pool, manages participations and makes the closing decision"
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/operating-status"
      - "POST /productions/{id}/convert-royalties-to-pool"
      - "POST /productions/{id}/approve-budget"
      - "POST /royalty-participants/{id}/terminate"
      - "POST /royalty-participants/{id}/reinstate"
      - "POST /closing-notices"
      - "POST /closing-notices/{id}/withdraw"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET read and list endpoints"

  - name: Investor
    description: "Limited partner or member who subscribes for units and reads only its own syndication records"
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/resubmit"
    shared_operations:
      - "GET /investors/{id} (own row only)"
      - "GET /subscriptions/{id} (own subscriptions only)"
      - "GET /investor-accounts/{id} (own accounts only)"
      - "GET /productions, GET /productions/{id}, GET /productions/{id}/recoupment-report"
      - "GET /offering-documents, GET /offering-documents/{id}"
      - "GET /subsidiary-rights-income, GET /subsidiary-rights-income/{id}"
      - "GET /investor-distributions, GET /investor-distributions/{id}"
      - "GET /closing-notices, GET /closing-notices/{id}"
