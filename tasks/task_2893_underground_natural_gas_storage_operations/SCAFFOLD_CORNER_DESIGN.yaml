# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 2893
# Underground Natural Gas Storage Operations.
#
# Breadth probe. Every instance grounds only in elements declared in SCAFFOLD.yaml
# §1.1-§1.7, and every numeric literal in an `assert:` line was produced by executing
# the relevant §1.3 formula against its `constants:` (workspace/.scratch/compute9.py).
# `name` is unique across the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Three field fixtures recur, all with max_pressure_psig 3000 (posture pressure
# ceiling round_half_up(3000 * 95 / 100, 0) == 2850) and base 800 / span 1400:
#
#   F_MINI   total 1,000,000 / cushion 500,000 -> max_working 500,000,
#            opening 250,000 -> inventory_pct 50.00, TIER_3, pressure 1500 psig,
#            two-point curve (0, 0, 300000) and (100, 300000, 0) so the
#            interpolated rates at 50.00% are withdrawal 150000 / injection 150000.
#   F_TIGHT  total 300,000 / cushion 100,000 -> max_working 200,000, opening
#            190,000 -> inventory_pct 95.00, TIER_4, pressure 2130 psig,
#            same two-point curve -> withdrawal 285000 / injection 15000.
#   F_STD    total 10,000,000 / cushion 2,000,000 -> max_working 8,000,000, with
#            the five-point curve (0,0,400000) (25,150000,350000) (50,300000,250000)
#            (75,450000,150000) (100,600000,0).
#
# The logical clock reads 2026-08-01T00:00:00Z until a call to
# POST /_clock/set_current_utc moves it. Unless an instance says otherwise every
# well is well_type INJECTION_WITHDRAWAL rated 600000 Dth/day with
# last_mit_passed_at 2026-06-01T00:00:00Z (mit_due_at 2027-06-01T00:00:00Z, so
# integrity_state is MIT_CURRENT), which keeps the well-capacity cap off the
# deliverability curve. The bogus id 00000000-0000-4000-8000-000000000000 is used
# wherever an unresolvable reference is required.

scaffold_corner_design:

  # =========================================================================
  # ENTITIES
  # =========================================================================
  - section: entities
    instances:

      - name: storage_field_creation_with_no_wells_is_frozen_with_zero_rates
        claim_type: creation
        grounds:
          - endpoints[POST /storage-fields]
          - entities.StorageField.fields.max_working_gas_dth
          - entities.StorageField.fields.field_posture
          - calculations.deliverability_rates
          - calculations.field_posture_derivation
        distinguishing_aspect: |
          A field created with opening working gas already at 50.00% of its ceiling still comes
          back FROZEN with both deliverability rates exactly 0, because deliverability_rates caps
          each curve rate by the in-service well capacity (0) and field_posture_derivation's FIRST
          clause is wells_in_service_count == 0 — the inventory-derived tier TIER_3 and the
          pressure 1500 are nevertheless fully populated on the same row.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
          assert:
            - "HTTP 201 and the response envelope carries response_type == object"
            - "StorageField.${f1}.max_working_gas_dth == 500000"
            - "StorageField.${f1}.working_gas_inventory_dth == 250000"
            - "StorageField.${f1}.inventory_pct == 50.00"
            - "StorageField.${f1}.current_pressure_psig == 1500"
            - "StorageField.${f1}.deliverability_tier == TIER_3"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 0"
            - "StorageField.${f1}.max_injection_rate_dth_per_day == 0"
            - "StorageField.${f1}.wells_in_service_count == 0"
            - "StorageField.${f1}.field_posture == FROZEN"
            - "StorageField.${f1}.fuel_gas_used_dth == 0 and retained_fuel_pool_dth == 0"
            - "StorageField.${f1}.season == INJECTION and deliverability_method == CURVE_INTERPOLATED"

      - name: well_creation_opens_the_field_and_stamps_mit_due_at_from_the_interval
        claim_type: creation
        grounds:
          - endpoints[POST /wells]
          - entities.Well.fields.mit_due_at
          - entities.Well.fields.integrity_state
          - global_constants.MIT_INTERVAL_DAYS
          - state_machines.StorageField.transitions.FROZEN_to_OPEN
        distinguishing_aspect: |
          Registering the first IN_SERVICE INJECTION_WITHDRAWAL well both stamps
          mit_due_at = last_mit_passed_at + MIT_INTERVAL_DAYS (2026-06-01T00:00:00Z -> exactly
          2027-06-01T00:00:00Z, which is in the future so integrity_state is MIT_CURRENT and not
          MIT_DUE) and re-derives the parent field in the same request: posture FROZEN -> OPEN and
          both rates jump from 0 to the curve values 150000 / 150000 at inventory_pct 50.00.
        test_recipe:
          setup:
            - "Field F_MINI exists with no wells (posture FROZEN, both rates 0)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "HTTP 201 on the well create"
            - "Well.${w1}.mit_due_at == 2027-06-01T00:00:00Z"
            - "Well.${w1}.integrity_state == MIT_CURRENT"
            - "Well.${w1}.operational_state == IN_SERVICE"
            - "Well.${w1}.shut_in_reason == null"
            - "Well.${w1}.service_change_count == 0"
            - "Well.${w1}.casing_pressure_psig == 0"
            - "StorageField.${f1}.wells_in_service_count == 1"
            - "StorageField.${f1}.field_posture == OPEN"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 150000"
            - "StorageField.${f1}.max_injection_rate_dth_per_day == 150000"
            - "StorageField.${f1}.inventory_pct == 50.00 and current_pressure_psig == 1500"

      - name: well_retrieval_returns_both_state_dimensions_for_every_reader_role
        claim_type: retrieval
        grounds:
          - endpoints[GET /wells/{id}]
          - entities.Well.fields.operational_state
          - entities.Well.fields.integrity_state
        distinguishing_aspect: |
          GET /wells/{id} returns the stored row verbatim — including both orthogonal state
          dimensions and the derived mit_due_at — and returns byte-identical data to an
          IntegrityEngineer and to a Shipper, because the well read is a shared_operation with no
          ownership narrowing (unlike the contract reads).
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 rated 600000 Dth/day, last_mit_passed_at 2026-06-01T00:00:00Z, casing_pressure_psig 1200."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z", casing_pressure_psig: 1200 }
              as: FieldOperator
              captures: { w1: $.data.id }
          trigger:
            - call: "GET /wells/${w1}"
              payload: {}
              as: IntegrityEngineer
            - call: "GET /wells/${w1}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200 on both reads"
            - "Well.${w1}.storage_field_id == ${f1} on both reads"
            - "Well.${w1}.well_name == MINI-1 and well_type == INJECTION_WITHDRAWAL"
            - "Well.${w1}.rated_rate_dth_per_day == 600000 and casing_pressure_psig == 1200"
            - "Well.${w1}.operational_state == IN_SERVICE and integrity_state == MIT_CURRENT"
            - "Well.${w1}.mit_due_at == 2027-06-01T00:00:00Z"
            - "the two responses carry identical data payloads"

      - name: wells_listing_pages_by_created_at_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /wells]
          - response_envelope.pagination_fields
          - response_envelope.list_ordering
        distinguishing_aspect: |
          Three wells created in the order MINI-1, MINI-2, MINI-3 come back in created_at ASC
          order, never id order: limit 2 / offset 0 returns MINI-1 then MINI-2 with total_count 3
          and has_more true, and limit 2 / offset 2 returns MINI-3 alone with has_more false —
          total_count stays 3 on both pages because it counts filter matches before limit/offset.
        test_recipe:
          setup:
            - "Field F_MINI with three INJECTION_WITHDRAWAL wells created in the order MINI-1, MINI-2, MINI-3."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-3", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w3: $.data.id }
          trigger:
            - call: "GET /wells"
              payload: { storage_field_id: "${f1}", limit: 2, offset: 0 }
              as: SchedulingCoordinator
            - call: "GET /wells"
              payload: { storage_field_id: "${f1}", limit: 2, offset: 2 }
              as: SchedulingCoordinator
          assert:
            - "first page: HTTP 200, response_type == array, exactly 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "first page: data[0].well_name == MINI-1 and data[0].id == ${w1}"
            - "first page: data[1].well_name == MINI-2 and data[1].id == ${w2}"
            - "second page: exactly 1 row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "second page: data[0].well_name == MINI-3 and data[0].id == ${w3}"

      - name: storage_field_and_contract_get_by_unknown_id_return_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_STORAGE_FIELD_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - validations.priority_4_ERR_STORAGE_FIELD_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown path UUID resolves per resource TYPE, not to one
          generic 404: the same bogus id yields ERR_STORAGE_FIELD_NOT_FOUND on /storage-fields/{id}
          and ERR_CONTRACT_NOT_FOUND on /storage-contracts/{id}, and the sub-resource list under an
          unknown parent 404s rather than returning an empty array.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /storage-fields/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "GET /storage-contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchedulingCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /storage-fields/00000000-0000-4000-8000-000000000000/regulatory-reports"
              payload: {}
              as: ComplianceOfficer
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_STORAGE_FIELD_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_CONTRACT_NOT_FOUND with HTTP 404"
            - "${e3} == ERR_STORAGE_FIELD_NOT_FOUND with HTTP 404 (not HTTP 200 with an empty array)"
            - "every error body carries response_type == error and a non-empty data.message"

      - name: creates_omitting_a_required_field_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /storage-fields]
          - endpoints[POST /storage-contracts]
          - endpoints[POST /gas-movement-tickets]
        distinguishing_aspect: |
          Every `input:` entry without a trailing `?` is genuinely required: omitting
          cushion_gas_dth on POST /storage-fields, cash_out_method on POST /storage-contracts and
          well_id on POST /gas-movement-tickets each return ERR_INVALID_REQUEST (400) at priority 3
          — before any 404 FK resolution, so the bogus contract id in the third body is never
          reported and no row is created.
        test_recipe:
          setup:
            - "Field F_MINI with one well, one shipper — enough context that only the omitted field can be at fault."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /storage-fields"
              payload: { name: "No Cushion", field_code: "F-NOCU", total_capacity_dth: 1000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-NOCM", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500 }
              as: SchedulingCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "00000000-0000-4000-8000-000000000000", actual_volume_dth: 1000 }
              as: FieldOperator
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 (cushion_gas_dth omitted)"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 (cash_out_method omitted)"
            - "${e3} == ERR_INVALID_REQUEST with HTTP 400 (well_id omitted; priority 3 beats the priority 5 FK check on the bogus nomination_id, so ERR_NOMINATION_NOT_FOUND is NOT returned)"
            - "GET /storage-contracts returns total_count == 0 — the rejected create persisted nothing"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StorageField.fields.season
          - entities.StorageField.fields.opening_working_gas_dth
          - entities.StorageField.fields.deliverability_method
          - entities.Well.fields.casing_pressure_psig
          - entities.CompressorUnit.fields.derate_factor
          - entities.StorageContract.fields.status
        distinguishing_aspect: |
          A create that supplies only the required inputs materialises every declared default in
          one pass: season INJECTION, opening_working_gas_dth 0 (so inventory_pct 0.00, pressure
          exactly base_pressure_psig 800 and TIER_1), deliverability_method CURVE_INTERPOLATED
          (evaluated at 0.00% -> withdrawal 0 / injection 300000, so the withdrawal rate is 0 for a
          curve reason rather than a well reason), well casing_pressure_psig 0 with
          initial_operational_state IN_SERVICE, unit derate_factor 0.0 with status AVAILABLE, and a
          contract in DRAFT with every balancing quantity zeroed and cash_out_through_date null.
        test_recipe:
          setup:
            - "Empty database; every create below omits all optional inputs."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /storage-fields"
              payload: { name: "Default Dome", field_code: "F-DFLT", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "DFLT-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-DFLT", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "StorageField.${f1}.season == INJECTION and deliverability_method == CURVE_INTERPOLATED"
            - "StorageField.${f1}.working_gas_inventory_dth == 0 and inventory_pct == 0.00"
            - "StorageField.${f1}.current_pressure_psig == 800 and deliverability_tier == TIER_1"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 0 and max_injection_rate_dth_per_day == 300000"
            - "StorageField.${f1}.wells_in_service_count == 1 and field_posture == OPEN"
            - "Well.${w1}.casing_pressure_psig == 0 and operational_state == IN_SERVICE and integrity_state == MIT_CURRENT and service_change_count == 0"
            - "CompressorUnit.${u1}.derate_factor == 0.0 and status == AVAILABLE and lifetime_fuel_dth == 0 and scheduled_run_count == 0"
            - "StorageContract.${c1}.status == DRAFT and activated_at == null"
            - "StorageContract.${c1}.inventory_balance_dth == 0.000 and imbalance_dth == 0.000"
            - "StorageContract.${c1}.scheduled_injection_dth == 0 and scheduled_withdrawal_dth == 0"
            - "StorageContract.${c1}.cash_out_amount_usd == 0.00 and cash_out_through_date == null"
            - "Shipper.${s1}.outstanding_penalty_usd == 0.00 and credit_status == GOOD"

      - name: storage_field_computed_field_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.StorageField.fields.inventory_pct
          - entities.StorageField.fields.deliverability_tier
          - entities.StorageField.fields.field_posture
          - calculations.deliverability_rates
        distinguishing_aspect: |
          Client-supplied values for `source: computed` fields are discarded, not merged: a create
          that ships inventory_pct 99.99, max_working_gas_dth 12345, current_pressure_psig 2999,
          deliverability_tier TIER_1, field_posture OPEN and max_withdrawal_rate_dth_per_day 999999
          still returns the derived 50.00 / 500000 / 1500 / TIER_3 / FROZEN / 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }], inventory_pct: 99.99, max_working_gas_dth: 12345, current_pressure_psig: 2999, deliverability_tier: "TIER_1", field_posture: "OPEN", max_withdrawal_rate_dth_per_day: 999999, wells_in_service_count: 7 }
              as: FieldOperator
              captures: { f1: $.data.id }
          assert:
            - "HTTP 201 — the undeclared computed keys are ignored, not rejected"
            - "StorageField.${f1}.inventory_pct == 50.00 (not 99.99)"
            - "StorageField.${f1}.max_working_gas_dth == 500000 (not 12345)"
            - "StorageField.${f1}.current_pressure_psig == 1500 (not 2999)"
            - "StorageField.${f1}.deliverability_tier == TIER_3 (not TIER_1)"
            - "StorageField.${f1}.field_posture == FROZEN (not OPEN)"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 0 (not 999999)"
            - "StorageField.${f1}.wells_in_service_count == 0 (not 7)"

      - name: well_system_field_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Well.fields.mit_due_at
          - entities.Well.fields.service_change_count
          - endpoints[POST /wells]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-owned: a create shipping
          id 11111111-1111-4111-8111-111111111111, created_at 1999-01-01T00:00:00Z and version 42
          returns a different server-generated id, a created_at at the current logical clock
          (2026-08-01T00:00:00Z), and ignores the supplied version — while the computed mit_due_at
          is still derived from last_mit_passed_at rather than taken from the body.
        test_recipe:
          setup:
            - "Field F_MINI exists."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z", id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00Z", updated_at: "1999-01-01T00:00:00Z", version: 42, mit_due_at: "2099-01-01T00:00:00Z", service_change_count: 9 }
              as: FieldOperator
              captures: { w1: $.data.id }
          assert:
            - "HTTP 201 and ${w1} != 11111111-1111-4111-8111-111111111111"
            - "Well.${w1}.created_at == 2026-08-01T00:00:00Z (the logical clock, not 1999-01-01T00:00:00Z)"
            - "Well.${w1}.updated_at == 2026-08-01T00:00:00Z"
            - "Well.${w1}.version != 42"
            - "Well.${w1}.mit_due_at == 2027-06-01T00:00:00Z (not 2099-01-01T00:00:00Z)"
            - "Well.${w1}.service_change_count == 0 (not 9)"
            - "GET /wells/11111111-1111-4111-8111-111111111111 would return ERR_WELL_NOT_FOUND — the supplied id was never used"

      - name: well_type_invalid_enum_and_out_of_range_numerics_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.Well.fields.well_type
          - entities.CompressorUnit.fields.derate_factor
          - entities.StorageField.fields.cushion_gas_dth
          - entities.StorageField.fields.deliverability_curve
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Every declared constraint in §1.1 is enforced at priority 3 and each maps to
          ERR_INVALID_REQUEST (400) rather than to a domain 422: an off-enum well_type, a negative
          rated_rate_dth_per_day, a derate_factor above the 0.50 ceiling, cushion_gas_dth equal to
          total_capacity_dth, a max_pressure_psig below base + span, a curve whose last point is not
          at inventory_pct 100, term_end_date before term_start_date, and limit 101 above the
          declared pagination maximum of 100.
        test_recipe:
          setup:
            - "Field F_MINI and one shipper exist; the field has no wells yet, so only the constraint under test can be at fault in each trigger call."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "BAD-TYPE", well_type: "MONITORING", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "BAD-RATE", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: -1, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { e2: $.data.error_id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-BAD", rated_horsepower: 6000, derate_factor: 0.75 }
              as: FieldOperator
              captures: { e3: $.data.error_id }
            - call: "POST /storage-fields"
              payload: { name: "All Cushion", field_code: "F-CUSH", total_capacity_dth: 1000000, cushion_gas_dth: 1000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { e4: $.data.error_id }
            - call: "POST /storage-fields"
              payload: { name: "Low Ceiling", field_code: "F-LOWP", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 2000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { e5: $.data.error_id }
            - call: "POST /storage-fields"
              payload: { name: "Short Curve", field_code: "F-CURV", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 80, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { e6: $.data.error_id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-BADTERM", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-12-31", term_end_date: "2026-08-01", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { e7: $.data.error_id }
            - call: "GET /wells"
              payload: { storage_field_id: "${f1}", limit: 101 }
              as: FieldOperator
              captures: { e8: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 (well_type MONITORING is outside INJECTION_WITHDRAWAL | OBSERVATION)"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 (rated_rate_dth_per_day must be >= 0)"
            - "${e3} == ERR_INVALID_REQUEST with HTTP 400 (derate_factor must be within [0.00, 0.50])"
            - "${e4} == ERR_INVALID_REQUEST with HTTP 400 (cushion_gas_dth must be strictly below total_capacity_dth)"
            - "${e5} == ERR_INVALID_REQUEST with HTTP 400 (max_pressure_psig must be >= base 800 + span 1400 == 2200)"
            - "${e6} == ERR_INVALID_REQUEST with HTTP 400 (the last curve point must sit at inventory_pct 100)"
            - "${e7} == ERR_INVALID_REQUEST with HTTP 400 (term_end_date must be >= term_start_date)"
            - "${e8} == ERR_INVALID_REQUEST with HTTP 400 (limit 101 exceeds the declared maximum of 100)"
            - "GET /wells with limit 100 on the same field returns HTTP 200 with total_count == 0"

      - name: imbalance_ledger_entries_are_immutable_rows_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ImbalanceLedgerEntry
          - entities.ImbalanceLedgerEntry.fields.volume_dth
          - endpoints[GET /storage-contracts/{id}/imbalance-ledger-entries]
          - state_machines.GasMovementTicket.transitions.CONFIRMED_to_REVERSED
        distinguishing_aspect: |
          ImbalanceLedgerEntry is the one entity declared with common_fields: false — it has no
          version and no updated_at, no POST/PATCH/DELETE endpoint exists for it, and a correction
          is expressed by APPENDING an offsetting row rather than editing the original: reversing a
          ticket that under-delivered 4000 Dth leaves the -4000.000 row untouched and adds a
          +4000.000 row, so the ledger holds 2 rows while the contract's imbalance_dth nets to
          0.000.
        test_recipe:
          setup:
            - "Field F_MINI with one well; shipper NORTHLINE with a 500000.00 USD penalty threshold."
            - "FIRM contract CN-1 (MSQ 1000000, daily rights 100000 each way, index 3.4500, commodity 0.0450, MONTHLY_AGGREGATE), ACTIVE."
            - "Nomination of 80000 Dth INJECTION for gas day 2026-08-20 is CONFIRMED at 80000, metered at 76000 Dth and confirmed, then reversed."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 76000 }
              as: FieldOperator
              captures: { t1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
            - call: "POST /gas-movement-tickets/${t1}/confirm"
              payload: { expected_storage_field_version: "${fv1}" }
              as: FieldOperator
          trigger:
            - call: "POST /gas-movement-tickets/${t1}/reverse"
              payload: { reversal_reason: "meter re-read after chart correction" }
              as: FieldOperator
            - call: "GET /storage-contracts/${c1}/imbalance-ledger-entries"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "the ledger read returns total_count == 2 and has_more == false"
            - "data[0].entry_type == DAILY_IMBALANCE, data[0].gas_day == 2026-08-20, data[0].volume_dth == -4000.000, data[0].amount_usd == 0.00"
            - "data[1].entry_type == DAILY_IMBALANCE, data[1].gas_day == 2026-08-20, data[1].volume_dth == 4000.000, data[1].amount_usd == 0.00"
            - "neither ledger row carries a `version` key nor an `updated_at` key; both carry id and created_at only"
            - "data[0] is byte-identical to the row the confirm appended — the reversal did not edit it"
            - "StorageContract.${c1}.imbalance_dth == 0.000 and inventory_balance_dth == 0.000"
            - "GasMovementTicket.${t1}.status == REVERSED and reversal_reason == meter re-read after chart correction"
            - "StorageField.${f1}.working_gas_inventory_dth == 250000 and retained_fuel_pool_dth == 0.000"

      - name: gas_movement_ticket_well_on_another_field_is_reported_as_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_5_ERR_CONTRACT_NOT_FOUND
          - errors.ERR_WELL_NOT_FOUND
          - errors.ERR_STORAGE_FIELD_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          On a flat topology every body FK is validated AND scoped: a Well that exists but sits on a
          different StorageField than the nomination's contract is reported as ERR_WELL_NOT_FOUND
          (404), not as a 422 — the same code an entirely unknown id would produce — and the same
          scoping applies to EmergencyEvent.well_id against the supplied storage_field_id, while an
          unknown storage_field_id on POST /wells maps to ERR_STORAGE_FIELD_NOT_FOUND.
        test_recipe:
          setup:
            - "Two independent fields: F_MINI (field A) with well A-1 and F-MINI-B (field B) with well B-1."
            - "Shipper NORTHLINE holds an ACTIVE FIRM contract on field A with a CONFIRMED 80000 Dth INJECTION nomination for gas day 2026-08-20."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fa: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fa}", well_name: "A-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wa: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini B", field_code: "F-MINI-B", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fb: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fb}", well_name: "B-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wb: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${fa}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${wb}", actual_volume_dth: 76000 }
