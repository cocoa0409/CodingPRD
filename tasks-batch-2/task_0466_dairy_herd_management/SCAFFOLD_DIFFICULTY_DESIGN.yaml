              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CD-001", birth_date: "2024-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
