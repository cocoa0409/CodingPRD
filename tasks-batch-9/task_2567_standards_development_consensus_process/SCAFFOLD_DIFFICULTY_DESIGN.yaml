  # =====================================================================
  # Rule 7 — cross-entity state dependency on two different entity pairs
  #   7a: Ballot creation gated on TechnicalCommittee.status
  #   7b: WorkItem publication gated on Appeal.status
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ballot_creation_blocked_while_sponsoring_committee_is_suspended
        grounds:
          - state_machines[TechnicalCommittee].ACTIVE_to_SUSPENDED
          - state_machines[TechnicalCommittee].SUSPENDED_to_ACTIVE
          - state_machines[CommitteeMembership].ACTIVE_to_SUSPENDED
          - validations[priority=78]
          - errors[ERR_COMMITTEE_NOT_ACTIVE]
          - calculations.committee_balance_evaluation
        distinguishing_aspect: |
          Entity pair Ballot <-> TechnicalCommittee. The Ballot being created is legal in every
          respect that can be read off its own row — a DRAFTING draft, a free overlap slot, a 14-day
          window, the right chair — yet it is refused because a THIRD entity, the sponsoring
          committee, left ACTIVE when one of its seats was suspended. Restoring the seat is not
          enough either: the committee has to be explicitly re-activated before the identical
          request succeeds.
        test_recipe:
          setup:
            - "Balanced ACTIVE committee TC-14 with 3 voting seats in 3 interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 with scope approved (which itself required an ACTIVE committee) and a revision-1 draft in DRAFTING."
            - "The GENERAL_INTEREST seat is then suspended, dropping the voting basis to 2 members, which is below MIN_ACTIVE_MEMBERS 3, so balance_status becomes UNBALANCED and the committee is system-suspended."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
            - call: "PATCH /sdo/memberships/${m3}"
              payload: { status: "SUSPENDED" }
              as: StandardsStaff
          trigger:
            - call: "GET /sdo/committees/${c1}"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { err_committee_not_active: $.data.error_id }
            - call: "PATCH /sdo/memberships/${m3}"
              payload: { status: "ACTIVE" }
              as: StandardsStaff
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
          assert:
            - "after the seat suspension TechnicalCommittee.${c1}.status == SUSPENDED"
            - "after the seat suspension TechnicalCommittee.${c1}.active_member_count == 2"
            - "after the seat suspension TechnicalCommittee.${c1}.balance_status == UNBALANCED"
            - "after the seat suspension TechnicalCommittee.${c1}.roster_member_count == 3 and roster_balance_status == BALANCED"
            - "after the seat suspension WorkItem.${w1}.consensus_gate == BLOCKED"
            - "the first ballot attempt returns HTTP 409 with response.data.error_id == ERR_COMMITTEE_NOT_ACTIVE"
            - "GET /sdo/ballots?draft_id=${d1} returns total_count == 0 at that point"
            - "Draft.${d1}.status == DRAFTING at that point"
            - "after the seat is restored and the committee re-activated TechnicalCommittee.${c1}.status == ACTIVE and balance_status == BALANCED"
            - "after re-activation WorkItem.${w1}.consensus_gate == OPEN"
            - "the identical second ballot attempt returns HTTP 201 and Ballot.${b1}.status == OPEN"
            - "Ballot.${b1}.eligible_voter_count == 3"
            - "Ballot.${b1}.hold_reason == NONE"

      - name: publication_blocked_while_a_filed_appeal_holds_the_consensus_gate
        grounds:
          - calculations.consensus_gate_evaluation
          - validations[priority=91]
          - errors[ERR_CONSENSUS_GATE_BLOCKED]
          - state_machines[Appeal].FILED_to_DENIED
          - endpoints[POST /sdo/work-items/{workItemId}/publish]
        distinguishing_aspect: |
          Entity pair WorkItem <-> Appeal. The WorkItem is fully ripe on its own fields —
          progress_status CONSENSUS_APPROVED, ip_status IP_CLEARED, unresolved_negative_count 0 — and
          publication still fails, because an Appeal row in status FILED on a completely different
          table sets consensus_gate to BLOCKED. Deciding that appeal DENY (which by definition
          touches neither the ballot nor the draft) is the only thing that changes, and the identical
          publish request then succeeds. The blocker is a foreign entity's state, not any field of
          the entity being written.
        test_recipe:
          setup:
            - "Balanced ACTIVE committee TC-14 with 3 voting seats in 3 interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 carried all the way to consensus: revision-1 draft, unanimous SUBCOMMITTEE ballot closed 2026-08-01, a zero-comment public review 2026-08-01 .. 2026-09-14 closed at 2026-09-15 into DISPOSITION_APPROVED, then a unanimous CONSENSUS_BODY ballot 2026-09-15 .. 2026-10-15 closed early at 2026-09-15 with all three seats returned."
            - "No patent disclosure was ever filed, so the consensus approval closed the call for patents and ip_status latched to IP_CLEARED."
            - "The GENERAL_INTEREST member — an interested party by virtue of her seat — then files an appeal citing the consensus ballot, well inside the 30-day window that ends 2026-10-15T00:00:00Z."
