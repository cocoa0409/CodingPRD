            - "no ArbitrationDecision was created — GET /arbitration/cases/${case_id}/decision returns 0 rows"
            - "the case is unchanged — GET /arbitration/cases/${case_id} still returns status == \"ARBITRATOR_REVIEW\""
            - "nothing moved on the money side — GET /arbitration/cases/${case_id}/ledger-entries returns 0 rows and GET /arbitration/sellers/${seller_id} returns lifetime_upheld_count == 0 and policy_tier == \"GOOD_STANDING\""

      - name: pair_c_expired_window_beats_below_minimum_claim_rejected
