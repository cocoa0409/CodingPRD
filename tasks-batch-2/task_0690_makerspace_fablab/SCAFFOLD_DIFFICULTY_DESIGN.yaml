              payload: { member_id: "${m15}", machine_class: "PRINTER_3D", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m15}"
              captures: { cert15: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m15}", machine_id: "${printer_a}", certification_id: "${cert15}", start_at: "2026-04-30T10:00:00Z", end_at: "2026-04-30T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m15}"
              captures: { resP: $.data.id }
            - call: "POST /reservations/${resP}/confirm"
              payload: { expected_member_version: "${m15_v0}" }
              as: Member
              as_user_id: "${m15}"
            - call: "POST /reservations"
              payload: { member_id: "${m15}", machine_id: "${printer_a}", certification_id: "${cert15}", start_at: "2026-04-30T11:00:00Z", end_at: "2026-04-30T12:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m15}"
              captures: { resQ: $.data.id }
            - call: "GET /members/${m15}"
              payload: {}
              as: Member
              as_user_id: "${m15}"
              captures: { m15_v1: $.data.version }
          trigger:
            - call: "POST /reservations/${resQ}/confirm"
              payload: { expected_member_version: "${m15_v1}" }
              as: Member
              as_user_id: "${m15}"
              captures: { resQ_status: $.data.occupancy_status }
          assert:
            - "Reservation.${resQ}.occupancy_status == CONFIRMED (11:00 adjacency allowed, no cooldown)"
            - "Reservation.${resP}.occupancy_status == CONFIRMED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_credit_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
          - calculations.session_charge
        distinguishing_aspect: |
          Conserved quantity = member wallet cents: confirm debits estimate, cancel
          refunds the identical estimate. Invariant: wallet_credit_cents + sum(active
          HOLD_PLACED estimate_charge_cents for this member) is unchanged across the
          confirm→cancel pair. After cancel, wallet returns to exactly its pre-confirm value.
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER cooldown 15; ACTIVE cert; reservation 60 reserved min CONFIRMED (hold 4820)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "m16@x.com", full_name: "M Sixteen", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { m16: $.data.id }
            - call: "POST /members/${m16}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m16}"
            - call: "POST /members/${m16}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${m16}"
            - call: "POST /members/${m16}/activate"
              payload: {}
              as: Member
              as_user_id: "${m16}"
              captures: { m16_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser H", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_h: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m16}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m16}"
              captures: { cert16: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m16}", machine_id: "${laser_h}", certification_id: "${cert16}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m16}"
              captures: { res16: $.data.id }
            - call: "POST /reservations/${res16}/confirm"
              payload: { expected_member_version: "${m16_v}" }
              as: Member
              as_user_id: "${m16}"
              captures: { res16_est: $.data.estimate_charge_cents }
          trigger:
            - call: "POST /reservations/${res16}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m16}"
          assert:
            - "Reservation.${res16}.estimate_charge_cents == 4820 (60 min * 4800/60 = 4800, *0.9 = 4320, +500 setup)"
            - "Member.${m16}.wallet_credit_cents == 10000 after cancel (exactly the pre-confirm balance)"
            - "Reservation.${res16}.billing_status == REFUNDED"

      - name: prepaid_minutes_conserved_on_confirm_then_release
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_HELD
          - entities.Member.fields.prepaid_minutes_remaining
          - calculations.session_charge
        distinguishing_aspect: |
          A different conserved quantity = prepaid machine minutes: confirm decrements
          prepaid_minutes_remaining by free_minutes_applied, release-hold restores the
          exact same minutes. Invariant: prepaid_minutes_remaining + sum(active
          free_minutes_applied) == tier.prepaid_machine_minutes is preserved.
        test_recipe:
          setup:
            - "PRO tier prepaid 60; member activated (prepaid_minutes_remaining reset to 60), wallet 20000."
            - "CNC machine min_billing 60; ACTIVE cert; reservation 120 reserved min CONFIRMED (consumes 60 free)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRO", name: "Pro", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 2000, prepaid_machine_minutes: 60, locker_free_liters: 100, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_pro: $.data.id }
            - call: "POST /members"
              payload: { email: "m17@x.com", full_name: "M Seventeen", tier_id: "${tier_pro}" }
              as: FacilityAdmin
              captures: { m17: $.data.id }
            - call: "POST /members/${m17}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${m17}"
            - call: "POST /members/${m17}/topup"
              payload: { amount_cents: 20000 }
              as: Member
              as_user_id: "${m17}"
            - call: "POST /members/${m17}/activate"
              payload: {}
              as: Member
              as_user_id: "${m17}"
              captures: { m17_v: $.data.version, m17_prepaid0: $.data.prepaid_minutes_remaining }
            - call: "POST /machines"
              payload: { name: "CNC B", machine_class: "CNC", hourly_rate_cents: 9000, setup_fee_cents: 1500, min_billing_minutes: 60, cooldown_minutes: 30, requires_certification: true }
              as: FacilityAdmin
              captures: { cnc_b: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${m17}", machine_class: "CNC", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${m17}"
              captures: { cert17: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${m17}", machine_id: "${cnc_b}", certification_id: "${cert17}", start_at: "2026-05-03T09:00:00Z", end_at: "2026-05-03T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${m17}"
              captures: { res17: $.data.id }
            - call: "POST /reservations/${res17}/confirm"
              payload: { expected_member_version: "${m17_v}" }
              as: Member
              as_user_id: "${m17}"
              captures: { res17_free: $.data.free_minutes_applied }
          trigger:
            - call: "POST /reservations/${res17}/release-hold"
              payload: {}
              as: Member
              as_user_id: "${m17}"
          assert:
            - "Reservation.${res17}.free_minutes_applied == 60 at confirm"
            - "Member.${m17}.prepaid_minutes_remaining == 0 immediately after confirm"
            - "Member.${m17}.prepaid_minutes_remaining == 60 after release-hold (exactly restored)"
