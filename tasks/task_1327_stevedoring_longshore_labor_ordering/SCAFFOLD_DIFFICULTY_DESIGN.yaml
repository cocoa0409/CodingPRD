  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: gang_order_suspend_resume_cycle_requires_equipment_reacquisition
        grounds:
          - state_machines.GangOrder.WORKING_to_SUSPENDED
          - state_machines.GangOrder.SUSPENDED_to_WORKING
          - calculations.work_posture_derivation
        distinguishing_aspect: |
          GangOrder machine is cyclic (WORKING -> SUSPENDED -> WORKING), and the cycle is
          not free: suspension releases all equipment (assigned_equipment_ok -> false), so
          the resume leg is rejected with ERR_NO_EQUIPMENT_ASSIGNED until a fresh
          EquipmentAssignment restores coverage. suspension_count ends at exactly 1.
        test_recipe:
          setup:
            - "Vessel with DAY shift; gang G (headcount 1, RTG x1) WORKING with W1 WORKING and RTG-1 ACTIVE"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Cycle", voyage_number: "CY-601", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 200, planned_tons: 100, contracted_mph_target: 25.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "CRANE_GANG", required_classification: "CRANE_OPERATOR", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "Crane Op", registration_number: "R010", classification: "CRANE_OPERATOR", registered_on: "2010-01-01", base_hourly_rate_cents: 5000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/equipment-units"
              payload: { unit_code: "RTG-1", equipment_type: "RTG" }
              as: StevedoreAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { ea1: $.data.id }
            - call: "GET /api/gang-orders/${g}"
              as: StevedoreSuperintendent
              captures: { g_v_now: $.data.version }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v_now}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/safety-incidents"
