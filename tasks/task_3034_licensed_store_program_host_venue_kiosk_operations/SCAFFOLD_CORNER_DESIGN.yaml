            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 60, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
