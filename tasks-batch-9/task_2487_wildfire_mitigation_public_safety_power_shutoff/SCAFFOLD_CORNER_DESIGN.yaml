            - "PSPSEvent.${evm_id}.adjusted_customer_impact_score == 24.06 and net_benefit_ratio == 0.2743"
            - "the ignition_risk_avoided_score is unchanged at 6.60 — resource centres reduce impact, never risk"

      - name: mitigation_risk_reduction_score_and_truncated_budget_cents
        claim_type: Constants Applied
        grounds:
          - calculations.mitigation_risk_reduction_score
          - entities.MitigationProject.fields.budget_cents
        distinguishing_aspect: "Each program type carries its own effectiveness factor and each tier its own multiplier, and the two are multiplied at creation: the same 3.0 miles scores 1.50 as undergrounding on a NON_HFTD circuit but 1.62 as a fast-trip setting on TIER_2. budget_cents is TRUNCATED, not rounded, so 2.5 miles at 333 cents/mile is 832 rather than 833."
        test_recipe:
          setup:
            - "Four circuits, one per HFTD tier: ALPHA (TIER_3), BRAVO (TIER_2), INSPECT-1 (TIER_1) and DELTA (NON_HFTD)."
