# =============================================================================
# Wine-Storage & Cellar Management — PRD Benchmark Seed Tables (Expert)
# =============================================================================

scenario: |
  Wine-Storage & Cellar Management: locker/unit & bottle inventory, climate &
  monitoring, intake/withdrawal & delivery, appraisal/insurance, provenance &
  drink-window, membership & billing, auction/consignment linkage, waitlist

domain_name: wine-storage-cellar
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # finite locker units reserved / committed / released, waitlist promotion
  secondary_archetype: temporal_windowing       # courier delivery slots + locker maintenance windows
  complexity_layers:
    - optimistic_concurrency                     # OCC on Bottle.version at appraisal finalize (CREATE-with-supersede)
    - cascading_side_effects                     # member suspend / consignment settle multi-hop cascades
    - dual_variant_calculation                   # appraisal valuation + consignment proceeds
    - derived_field_reconciliation               # locker occupancy + member wallet balance

  entity_topology: flat                          # peer entities joined by foreign keys; no nested-URL ownership tree
  state_machine_shape: cyclic                    # Member ACTIVE<->SUSPENDED, Consignment negotiation loop; MovementRequest branching
  relationship_patterns:
    - one_to_many                                # Member -> Locker, Locker -> Bottle, Member -> LedgerEntry
    - many_to_many                               # InsurancePolicy.covered_bottle_ids, DeliveryOrder.bottle_ids
    - cross_aggregate                            # Consignment references Bottle + Member across aggregates
  role_model: segregation_of_duties              # appraisal creator != finalizer; plus peer resource ownership
  consistency_model: immediate                   # all cascades resolved within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: membership_tier, type: enum, source: input, description: "STANDARD | PREMIUM | RESERVE — service tier", constraints: "one of STANDARD, PREMIUM, RESERVE" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED | CLOSED — lifecycle", constraints: "one of PENDING, ACTIVE, SUSPENDED, CLOSED" }
      - { name: wallet_balance_cents, type: integer, source: computed, default: 0, description: "Signed sum of all LedgerEntry.signed_amount_cents for this member; negative means member owes" }

  - name: Locker
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label / bin code" }
      - { name: size_tier, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — physical size band", constraints: "one of SMALL, MEDIUM, LARGE" }
      - { name: climate_zone, type: enum, source: input, description: "RED | WHITE | SPARKLING — target climate profile", constraints: "one of RED, WHITE, SPARKLING" }
      - { name: capacity_bottles, type: integer, source: input, description: "Maximum bottles the locker holds", constraints: ">= 1" }
      - { name: member_id, type: string, source: system, default: null, description: "FK -> Member.id; member this locker is assigned to (null while AVAILABLE)" }
      - { name: occupied_bottles, type: integer, source: computed, default: 0, description: "count of Bottle rows with locker_id == this AND status == STORED" }
      - { name: reserved_bottles, type: integer, source: computed, default: 0, description: "sum of MovementRequest.quantity for INTAKE requests on this locker in status {REQUESTED, APPROVED}" }
      - { name: free_bottles, type: integer, source: computed, default: 0, description: "= capacity_bottles - occupied_bottles - reserved_bottles" }
      - { name: occupancy_status, type: enum, source: computed, description: "VACANT | PARTIAL | FULL — derived from occupied_bottles vs capacity_bottles", constraints: "one of VACANT, PARTIAL, FULL" }
      - { name: climate_status, type: enum, source: computed, default: "NOMINAL", description: "NOMINAL | BREACH — set BREACH by an out-of-band ClimateReading, cleared when a MaintenanceWindow completes", constraints: "one of NOMINAL, BREACH" }
      - { name: monthly_fee_cents, type: integer, source: computed, default: 0, description: "Storage fee for this locker per storage_fee calculation (size_tier x climate_zone x occupancy)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | ASSIGNED | FROZEN | MAINTENANCE | RETIRED — lifecycle", constraints: "one of AVAILABLE, ASSIGNED, FROZEN, MAINTENANCE, RETIRED" }

  - name: Bottle
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner (copied from the locker's member_id at creation)" }
      - { name: locker_id, type: string, source: input, default: null, description: "FK -> Locker.id; current locker (null once WITHDRAWN / SOLD / DELIVERED)" }
      - { name: wine_name, type: string, source: input, description: "Producer + cuvee label" }
      - { name: vintage_year, type: integer, source: input, description: "Vintage year" }
      - { name: varietal, type: string, source: input, description: "Grape varietal / blend" }
      - { name: format_ml, type: enum, source: input, description: "375 | 750 | 1500 | 3000 — bottle format in millilitres", constraints: "one of 375, 750, 1500, 3000" }
      - { name: provenance_status, type: enum, source: input, default: "UNVERIFIED", description: "DOCUMENTED | UNVERIFIED | DISPUTED — chain-of-custody state", constraints: "one of DOCUMENTED, UNVERIFIED, DISPUTED" }
      - { name: drink_window_start_year, type: integer, source: input, description: "First year the wine is considered ready" }
      - { name: drink_window_end_year, type: integer, source: input, description: "Last year of peak drinking window" }
      - { name: drink_window_status, type: enum, source: computed, description: "TOO_YOUNG | IN_WINDOW | PAST_PEAK — derived by comparing the logical-clock year to the drink window", constraints: "one of TOO_YOUNG, IN_WINDOW, PAST_PEAK" }
      - { name: appraised_value_cents, type: integer, source: computed, default: 0, description: "assessed_value_cents of the latest FINALIZED Appraisal for this bottle (0 if none)" }
      - { name: status, type: enum, source: system, default: "STORED", description: "STORED | WITHDRAWN | IN_TRANSIT | CONSIGNED | SOLD | DELIVERED — inventory state", constraints: "one of STORED, WITHDRAWN, IN_TRANSIT, CONSIGNED, SOLD, DELIVERED" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: bottle_id, type: string, source: input, description: "FK -> Bottle.id; bottle being appraised" }
      - { name: method, type: enum, source: input, description: "MARKET_COMPARABLE | REPLACEMENT_COST — valuation method (variant selector)", constraints: "one of MARKET_COMPARABLE, REPLACEMENT_COST" }
      - { name: base_value_cents, type: integer, source: input, description: "Raw reference value (auction comp or replacement quote) before method uplift", constraints: ">= 0" }
      - { name: assessed_value_cents, type: integer, source: computed, description: "Value after method variant applied to base_value_cents (see appraisal_valuation)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Appraiser who created this appraisal (segregation-of-duties key)" }
      - { name: effective_date, type: datetime, source: system, default: null, description: "Logical-clock timestamp when finalized (null while DRAFT)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED | SUPERSEDED — lifecycle", constraints: "one of DRAFT, FINALIZED, SUPERSEDED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; policyholder" }
      - { name: coverage_tier, type: enum, source: input, description: "BASIC | FULL — coverage level (rate multiplier)", constraints: "one of BASIC, FULL" }
      - { name: covered_bottle_ids, type: array, source: input, description: "Bottle ids covered by this policy (many-to-many; validated to belong to member)" }
      - { name: insured_value_cents, type: integer, source: computed, description: "Sum of appraised_value_cents over covered bottles at quote time" }
      - { name: premium_cents, type: integer, source: computed, description: "Annual premium per insurance_premium calculation (round-per-bottle then sum)" }
      - { name: bound_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when bound (null while QUOTED)" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | BOUND | LAPSED | CANCELLED — lifecycle", constraints: "one of QUOTED, BOUND, LAPSED, CANCELLED" }

  - name: MovementRequest
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; requesting member" }
      - { name: locker_id, type: string, source: input, description: "FK -> Locker.id; locker affected" }
      - { name: request_type, type: enum, source: input, description: "INTAKE | WITHDRAWAL — reserve units for future deposits, or pull stored bottles out", constraints: "one of INTAKE, WITHDRAWAL" }
      - { name: quantity, type: integer, source: input, description: "Units reserved (INTAKE) or number of bottles withdrawn (WITHDRAWAL == len(bottle_ids))", constraints: ">= 1" }
      - { name: bottle_ids, type: array, source: input, default: null, description: "Bottles to withdraw (required for WITHDRAWAL; must be STORED in locker_id)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REJECTED | COMPLETED | CANCELLED — lifecycle", constraints: "one of REQUESTED, APPROVED, REJECTED, COMPLETED, CANCELLED" }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; recipient member" }
      - { name: bottle_ids, type: array, source: input, description: "Bottles to deliver (each must be WITHDRAWN and owned by member)" }
      - { name: courier_ref, type: string, source: input, description: "Courier resource key; delivery slots must not overlap per courier_ref" }
      - { name: slot_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: slot_end, type: datetime, source: input, description: "Delivery window end (exclusive; half-open [slot_start, slot_end))" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | DELIVERED | CANCELLED — lifecycle", constraints: "one of SCHEDULED, DELIVERED, CANCELLED" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: bottle_id, type: string, source: input, description: "FK -> Bottle.id; bottle put up for auction/consignment" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; seller (copied from bottle.member_id)" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Minimum acceptable hammer/offer price", constraints: ">= 0" }
      - { name: offer_price_cents, type: integer, source: system, default: null, description: "Latest broker offer (set on OFFERED)" }
      - { name: counter_price_cents, type: integer, source: system, default: null, description: "Latest seller counter (set on COUNTERED)" }
      - { name: hammer_price_cents, type: integer, source: system, default: null, description: "Final sale price recorded at settlement" }
      - { name: commission_pct, type: number, source: computed, default: null, description: "Broker commission fraction, tiered on hammer_price_cents (see consignment_proceeds)" }
      - { name: net_proceeds_cents, type: integer, source: computed, default: null, description: "Seller payout at settlement per consignment_proceeds (final variant)" }
      - { name: estimated_proceeds_cents, type: integer, source: computed, default: null, description: "Provisional payout estimate at acceptance per consignment_proceeds (provisional variant)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LISTED | OFFERED | COUNTERED | ACCEPTED | SETTLED | WITHDRAWN — negotiation lifecycle", constraints: "one of DRAFT, LISTED, OFFERED, COUNTERED, ACCEPTED, SETTLED, WITHDRAWN" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; waiting member" }
      - { name: requested_size_tier, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — desired locker size", constraints: "one of SMALL, MEDIUM, LARGE" }
      - { name: requested_climate_zone, type: enum, source: input, description: "RED | WHITE | SPARKLING — desired climate zone", constraints: "one of RED, WHITE, SPARKLING" }
      - { name: position, type: integer, source: computed, description: "1-based rank among WAITING entries with the same (requested_size_tier, requested_climate_zone), ordered by created_at ASC" }
      - { name: offered_locker_id, type: string, source: system, default: null, description: "Locker offered to this member during operations promotion (plain reference id, null until OFFERED)" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | OFFERED | FULFILLED | EXPIRED | CANCELLED — lifecycle", constraints: "one of WAITING, OFFERED, FULFILLED, EXPIRED, CANCELLED" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: locker_id, type: string, source: input, description: "FK -> Locker.id; locker under maintenance" }
      - { name: window_start, type: datetime, source: input, description: "Maintenance window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Maintenance window end (inclusive; closed interval [window_start, window_end])" }
      - { name: reason, type: string, source: input, description: "Maintenance reason / work order note" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED — lifecycle", constraints: "one of SCHEDULED, ACTIVE, COMPLETED, CANCELLED" }

  - name: LedgerEntry
    parent: null
    common_fields: false          # append-only event: id + created_at only, immutable, no version
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; account the entry posts to" }
      - { name: entry_type, type: enum, source: input, description: "DEBIT | CREDIT — DEBIT subtracts from wallet, CREDIT adds", constraints: "one of DEBIT, CREDIT" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude of the entry", constraints: ">= 1" }
      - { name: signed_amount_cents, type: integer, source: computed, description: "= +amount_cents for CREDIT, -amount_cents for DEBIT" }
      - { name: reason, type: string, source: input, description: "Human-readable reason" }
      - { name: related_entity_type, type: string, source: input, default: null, description: "Optional originating entity type (e.g., InsurancePolicy, Consignment)" }
      - { name: related_entity_id, type: string, source: input, default: null, description: "Optional originating entity id" }

  - name: ClimateReading
    parent: null
    common_fields: false          # append-only monitoring event: id + created_at only
    fields:
      - { name: locker_id, type: string, source: input, description: "FK -> Locker.id; monitored locker" }
      - { name: temperature_c, type: number, source: input, description: "Measured temperature in Celsius" }
      - { name: humidity_pct, type: number, source: input, description: "Measured relative humidity percent" }
      - { name: in_band, type: boolean, source: computed, description: "True iff TEMP_MIN<=temperature_c<=TEMP_MAX AND HUMID_MIN<=humidity_pct<=HUMID_MAX" }

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-finalize-stale-bottle
    parent_entity: Bottle
    write_endpoint: "POST /appraisals/{appraisalId}/finalize"
    occ_field: "expected_bottle_version"
    description: |
      Finalizing an Appraisal against a Bottle whose version has advanced since
      the client last observed it is rejected. Finalization supersedes the prior
      FINALIZED appraisal for the bottle and rewrites Bottle.appraised_value_cents;
      a client whose view of the bottle predates a just-finalized appraisal holds
      a stale version and its finalize is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{memberId}/activate"
        actor: CellarManager
        preconditions: ["member.status == PENDING"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{memberId}/suspend"
        actor: CellarManager
        preconditions: ["member.status == ACTIVE"]
        side_effects:
          - "CASCADE hop 1: every Locker with member_id == member.id AND status == ASSIGNED transitions ASSIGNED -> FROZEN"
          - "CASCADE hop 2 (per frozen locker): every MovementRequest on that locker in status {REQUESTED, APPROVED} transitions -> CANCELLED"
          - "CASCADE hop 3 (per cancelled INTAKE request): locker.reserved_bottles is recomputed (the cancelled request no longer counts), so locker.free_bottles rises"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{memberId}/reactivate"
        actor: CellarManager
        preconditions: ["member.status == SUSPENDED"]
        side_effects:
          - "every Locker with member_id == member.id AND status == FROZEN transitions FROZEN -> ASSIGNED (cancelled movement requests are NOT resurrected)"
        note: "Cyclic: ACTIVE <-> SUSPENDED (Rule 3 non-linear machine)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /members/{memberId}/close"
        actor: CellarManager
        preconditions:
          - "member.status in {ACTIVE, SUSPENDED}"
          - "member has no Locker with status in {ASSIGNED, FROZEN, MAINTENANCE} (ERR_MEMBER_HAS_ACTIVE_LOCKERS)"
          - "member.wallet_balance_cents >= 0 (no outstanding balance, ERR_OUTSTANDING_BALANCE)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /members/{memberId}/close"
        actor: CellarManager
        preconditions:
          - "member.status in {ACTIVE, SUSPENDED}"
          - "member has no Locker with status in {ASSIGNED, FROZEN, MAINTENANCE} (ERR_MEMBER_HAS_ACTIVE_LOCKERS)"
          - "member.wallet_balance_cents >= 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects: []

  - entity: Locker
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /lockers/{lockerId}/assign"
        actor: CellarManager
        preconditions:
          - "locker.status == AVAILABLE"
          - "target Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE) — cross-entity dependency Locker->Member"
        side_effects: ["locker.member_id = member.id", "increments Locker.version by 1"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /lockers/{lockerId}/release"
        actor: CellarManager
        preconditions:
          - "locker.status == ASSIGNED"
          - "locker.occupied_bottles == 0 AND locker.reserved_bottles == 0 (ERR_LOCKER_NOT_EMPTY)"
        side_effects: ["locker.member_id = null", "increments Locker.version by 1"]
      - from: ASSIGNED
        to: FROZEN
        trigger: "system (member suspended cascade hop 1)"
        actor: system
        preconditions: []
        side_effects: ["locker rejects new intake/withdrawal while FROZEN"]
      - from: FROZEN
        to: ASSIGNED
        trigger: "system (member reactivated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: MAINTENANCE
        trigger: "system (MaintenanceWindow activated)"
        actor: system
        preconditions: []
        side_effects: ["locker rejects bottle create / movement while MAINTENANCE"]
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "system (MaintenanceWindow activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: ASSIGNED
        trigger: "system (MaintenanceWindow completed and locker.member_id is not null)"
        actor: system
        preconditions: []
        side_effects: ["locker.climate_status = NOMINAL"]
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "system (MaintenanceWindow completed and locker.member_id is null)"
        actor: system
        preconditions: []
        side_effects: ["locker.climate_status = NOMINAL"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /lockers/{lockerId}/retire"
        actor: CellarManager
        preconditions: ["locker.status == AVAILABLE", "locker.occupied_bottles == 0"]
        side_effects: []

  - entity: Bottle
    initial_state: STORED
    terminal_states: [SOLD, DELIVERED]
    transitions:
      - from: STORED
        to: WITHDRAWN
        trigger: "system (MovementRequest WITHDRAWAL completed)"
        actor: system
        preconditions: ["bottle.status == STORED"]
        side_effects: ["bottle.locker_id = null", "source locker occupied_bottles/free_bottles recomputed"]
      - from: STORED
        to: CONSIGNED
        trigger: "system (Consignment listed)"
        actor: system
        preconditions: ["bottle.status == STORED"]
        side_effects: []
      - from: CONSIGNED
        to: STORED
        trigger: "system (Consignment withdrawn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONSIGNED
        to: SOLD
        trigger: "system (Consignment settled)"
        actor: system
        preconditions: []
        side_effects: ["bottle.locker_id = null", "source locker occupied_bottles/free_bottles recomputed"]
      - from: WITHDRAWN
        to: IN_TRANSIT
        trigger: "system (DeliveryOrder created including this bottle)"
        actor: system
        preconditions: ["bottle.status == WITHDRAWN"]
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (DeliveryOrder delivered)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: WITHDRAWN
        trigger: "system (DeliveryOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appraisal
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /appraisals/{appraisalId}/finalize"
        actor: Appraiser
        preconditions:
          - "appraisal.status == DRAFT"
          - "X-User-ID != appraisal.created_by_user_id (ERR_SEGREGATION_OF_DUTIES) — SoD"
          - "expected_bottle_version == bottle.version (ERR_STALE_VERSION) — OCC"
        side_effects:
          - "any prior FINALIZED Appraisal for the same bottle transitions FINALIZED -> SUPERSEDED"
          - "Bottle.appraised_value_cents = this.assessed_value_cents"
          - "appraisal.effective_date = current logical clock"
          - "increments Bottle.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer Appraisal for the same bottle is finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsurancePolicy
    initial_state: QUOTED
    terminal_states: [CANCELLED, LAPSED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /insurance-policies/{policyId}/bind"
        actor: InsuranceAgent
        preconditions:
          - "policy.status == QUOTED"
          - "member.wallet_balance_cents - policy.premium_cents >= WALLET_FLOOR_CENTS (ERR_INSUFFICIENT_FUNDS)"
        side_effects:
          - "post LedgerEntry DEBIT premium_cents to member (wallet_balance_cents decreases)"
          - "policy.bound_at = current logical clock"
      - from: BOUND
        to: LAPSED
        trigger: "system (POST /operations/cycle when member.wallet_balance_cents < 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /insurance-policies/{policyId}/cancel"
        actor: InsuranceAgent
        preconditions: ["policy.status in {QUOTED, BOUND}"]
        side_effects: []
      - from: BOUND
        to: CANCELLED
        trigger: "POST /insurance-policies/{policyId}/cancel"
        actor: InsuranceAgent
        preconditions: ["policy.status in {QUOTED, BOUND}"]
        side_effects:
          - "post LedgerEntry CREDIT premium_cents refund to member (compensating; wallet returns to pre-bind value)"

  - entity: MovementRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /movement-requests/{movementRequestId}/approve"
        actor: CellarManager
        preconditions:
          - "request.status == REQUESTED"
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE) — cross-entity dependency MovementRequest->Member"
          - "locker.status not in {FROZEN, MAINTENANCE, RETIRED} (ERR_LOCKER_IN_MAINTENANCE)"
        side_effects: []
        note: "Branching fork: REQUESTED -> {APPROVED, REJECTED} with divergent effects (Rule 3)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /movement-requests/{movementRequestId}/reject"
        actor: CellarManager
        preconditions: ["request.status == REQUESTED"]
        side_effects:
          - "if request_type == INTAKE: locker.reserved_bottles recomputed (this request drops out), free_bottles rises"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /movement-requests/{movementRequestId}/complete"
        actor: CellarManager
        preconditions:
          - "request.status == APPROVED"
          - "for WITHDRAWAL: every bottle in bottle_ids has status == STORED and locker_id == request.locker_id (ERR_BOTTLE_NOT_STORED)"
        side_effects:
          - "if WITHDRAWAL: each listed Bottle STORED -> WITHDRAWN; locker occupied_bottles/free_bottles recomputed"
          - "if INTAKE: locker.reserved_bottles recomputed (this request drops out); the reserved units are now free for POST /bottles"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /movement-requests/{movementRequestId}/cancel"
        actor: CellarMember
        preconditions: ["request.status in {REQUESTED, APPROVED}"]
        side_effects:
          - "if request_type == INTAKE: locker.reserved_bottles recomputed, free_bottles rises"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /movement-requests/{movementRequestId}/cancel"
        actor: CellarMember
        preconditions: ["request.status in {REQUESTED, APPROVED}"]
        side_effects:
          - "if request_type == INTAKE: locker.reserved_bottles recomputed, free_bottles rises"

  - entity: Consignment
    initial_state: DRAFT
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /consignments/{consignmentId}/list"
        actor: AuctionBroker
        preconditions:
          - "consignment.status == DRAFT"
          - "Bottle.status == STORED (ERR_BOTTLE_NOT_STORED) — cross-entity dependency Consignment->Bottle"
          - "Bottle.provenance_status == DOCUMENTED (ERR_PROVENANCE_NOT_DOCUMENTED)"
        side_effects: ["Bottle STORED -> CONSIGNED"]
      - from: LISTED
        to: OFFERED
        trigger: "POST /consignments/{consignmentId}/offer"
        actor: AuctionBroker
        preconditions: ["consignment.status in {LISTED, COUNTERED}"]
        side_effects: ["consignment.offer_price_cents = offer_price_cents"]
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /consignments/{consignmentId}/offer"
        actor: AuctionBroker
        preconditions: ["consignment.status in {LISTED, COUNTERED}"]
        side_effects: ["consignment.offer_price_cents = offer_price_cents"]
        note: "Cyclic negotiation loop OFFERED <-> COUNTERED (Rule 3 non-linear machine)"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /consignments/{consignmentId}/counter"
        actor: CellarMember
        preconditions: ["consignment.status == OFFERED"]
        side_effects: ["consignment.counter_price_cents = counter_price_cents"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /consignments/{consignmentId}/accept"
        actor: CellarMember
        preconditions:
          - "consignment.status == OFFERED"
          - "consignment.offer_price_cents >= consignment.reserve_price_cents (ERR_OFFER_BELOW_RESERVE)"
        side_effects:
          - "consignment.estimated_proceeds_cents = consignment_proceeds(provisional variant over offer_price_cents)"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /consignments/{consignmentId}/settle"
        actor: AuctionBroker
        preconditions: ["consignment.status == ACCEPTED", "hammer_price_cents >= consignment.reserve_price_cents (ERR_OFFER_BELOW_RESERVE)"]
        side_effects:
          - "consignment.hammer_price_cents = hammer_price_cents"
          - "consignment.commission_pct + net_proceeds_cents = consignment_proceeds(final variant over hammer_price_cents)"
          - "CASCADE hop 1: Bottle CONSIGNED -> SOLD, bottle.locker_id = null"
          - "CASCADE hop 2: source locker occupied_bottles/free_bottles/occupancy_status recomputed"
          - "post LedgerEntry CREDIT net_proceeds_cents to seller member (wallet_balance_cents rises)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /consignments/{consignmentId}/withdraw"
        actor: CellarMember
        preconditions: ["consignment.status in {DRAFT, LISTED, OFFERED, COUNTERED}"]
        side_effects: ["if Bottle.status == CONSIGNED: Bottle CONSIGNED -> STORED"]
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /consignments/{consignmentId}/withdraw"
        actor: CellarMember
        preconditions: ["consignment.status in {DRAFT, LISTED, OFFERED, COUNTERED}"]
        side_effects: ["Bottle CONSIGNED -> STORED"]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /consignments/{consignmentId}/withdraw"
        actor: CellarMember
        preconditions: ["consignment.status in {DRAFT, LISTED, OFFERED, COUNTERED}"]
        side_effects: ["Bottle CONSIGNED -> STORED"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /consignments/{consignmentId}/withdraw"
        actor: CellarMember
        preconditions: ["consignment.status in {DRAFT, LISTED, OFFERED, COUNTERED}"]
        side_effects: ["Bottle CONSIGNED -> STORED"]

  - entity: DeliveryOrder
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-orders/{deliveryOrderId}/deliver"
        actor: CellarManager
        preconditions: ["order.status == SCHEDULED"]
        side_effects: ["each Bottle in bottle_ids IN_TRANSIT -> DELIVERED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-orders/{deliveryOrderId}/cancel"
        actor: CellarManager
        preconditions: ["order.status == SCHEDULED"]
        side_effects: ["each Bottle in bottle_ids IN_TRANSIT -> WITHDRAWN (returns to withdrawn pool)"]

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system (POST /operations/cycle promotes the position-1 entry to a matching AVAILABLE locker)"
        actor: system
        preconditions: []
        side_effects: ["waitlist.offered_locker_id = matched locker id"]
      - from: OFFERED
        to: FULFILLED
        trigger: "POST /waitlist-entries/{waitlistEntryId}/accept"
        actor: CellarMember
        preconditions: ["waitlist.status == OFFERED", "offered locker still AVAILABLE (ERR_INVALID_STATE)"]
        side_effects: ["offered Locker AVAILABLE -> ASSIGNED with member_id = waitlist.member_id"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system (POST /operations/cycle when an OFFERED entry was not accepted by the next cycle)"
        actor: system
        preconditions: []
        side_effects: ["offered locker released back to AVAILABLE candidate pool"]
      - from: WAITING
        to: CANCELLED
        trigger: "POST /waitlist-entries/{waitlistEntryId}/cancel"
        actor: CellarMember
        preconditions: ["waitlist.status in {WAITING, OFFERED}"]
        side_effects: []
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /waitlist-entries/{waitlistEntryId}/cancel"
        actor: CellarMember
        preconditions: ["waitlist.status in {WAITING, OFFERED}"]
        side_effects: ["offered locker released back to AVAILABLE"]

  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /maintenance-windows/{maintenanceWindowId}/activate"
        actor: CellarManager
        preconditions: ["window.status == SCHEDULED", "locker.status not in {RETIRED} (ERR_INVALID_STATE)"]
        side_effects: ["Locker (AVAILABLE or ASSIGNED) -> MAINTENANCE"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /maintenance-windows/{maintenanceWindowId}/complete"
        actor: CellarManager
        preconditions: ["window.status == ACTIVE"]
        side_effects: ["Locker MAINTENANCE -> ASSIGNED (if member_id set) or AVAILABLE; locker.climate_status = NOMINAL"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{maintenanceWindowId}/cancel"
        actor: CellarManager
        preconditions: ["window.status == SCHEDULED"]
        side_effects: []

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: locker_occupancy
    trigger: "any change to a Bottle.status/locker_id in the locker, or to an INTAKE MovementRequest on the locker"
    algorithm: aggregation
    formula: |
      occupied_bottles = count(Bottle b where b.locker_id == locker.id AND b.status == STORED)
      reserved_bottles = sum(mr.quantity for MovementRequest mr
                             where mr.locker_id == locker.id
                               AND mr.request_type == INTAKE
                               AND mr.status in {REQUESTED, APPROVED})
      free_bottles = capacity_bottles - occupied_bottles - reserved_bottles
      if occupied_bottles == 0: occupancy_status = VACANT
      elif occupied_bottles >= capacity_bottles: occupancy_status = FULL   # boundary: >= not >
      else: occupancy_status = PARTIAL
    input_set: "STORED bottles + {REQUESTED, APPROVED} INTAKE requests on the locker only"
    precision: "integer counts (no rounding)"
    note: "Conserved invariant: occupied_bottles + reserved_bottles + free_bottles == capacity_bottles at all times"

  - name: storage_fee
    trigger: "locker create; any occupancy_status change; POST /operations/cycle"
    algorithm: tiered_pricing
    formula: |
      base = STORAGE_BASE_RATE_CENTS[size_tier]           # SMALL/MEDIUM/LARGE
      climate = CLIMATE_MULTIPLIER[climate_zone]           # RED/WHITE/SPARKLING
      surcharge = FULL_OCCUPANCY_SURCHARGE if occupancy_status == FULL else 0.0
      raw = base * climate * (1 + surcharge)
      monthly_fee_cents = min(MAX_MONTHLY_FEE_CENTS, max(MIN_MONTHLY_FEE_CENTS, round_half_up(raw)))
    input_set: "single locker; three inputs interact (size_tier, climate_zone, occupancy_status) with nested min/max floor+cap"
    constants:
      STORAGE_BASE_RATE_CENTS: { SMALL: 2000, MEDIUM: 3500, LARGE: 6000 }
      CLIMATE_MULTIPLIER: { RED: 1.00, WHITE: 1.15, SPARKLING: 1.30 }
      FULL_OCCUPANCY_SURCHARGE: 0.10
      MIN_MONTHLY_FEE_CENTS: 2500
      MAX_MONTHLY_FEE_CENTS: 9000
    precision: "2 decimal places on the cents product, round_half_up, then integer cents"
    note: "Rule 2 mode (a): >=3 interacting inputs with nested min/max clamp"

  - name: insurance_premium
    trigger: "POST /insurance-policies (quote time)"
    algorithm: weighted_scoring
    formula: |
      # Round-per-bottle THEN sum (pinned order — do NOT sum raw then round once).
      rate(provenance, coverage_tier):
        base_rate = INSURANCE_BASE_RATE[provenance]        # DOCUMENTED/UNVERIFIED/DISPUTED
        return base_rate * (COVERAGE_TIER_FACTOR[coverage_tier])
      per_bottle_premium(b) = round_half_up(b.appraised_value_cents * rate(b.provenance_status, coverage_tier))
      insured_value_cents = sum(b.appraised_value_cents for b in covered bottles)
      premium_cents = sum(per_bottle_premium(b) for b in covered bottles)   # sum of pre-rounded terms
    input_set: "covered_bottle_ids resolved to Bottle rows; appraised_value_cents at quote time"
    constants:
      INSURANCE_BASE_RATE: { DOCUMENTED: 0.015, UNVERIFIED: 0.025, DISPUTED: 0.040 }
      COVERAGE_TIER_FACTOR: { BASIC: 0.5, FULL: 1.0 }
    precision: "round_half_up at the per-bottle term, integer cents; empty covered set -> premium_cents == 0"
    note: "Rule 2 mode (b): nested rounding where per-line rounding order is pinned and observable"

  - name: appraisal_valuation
    trigger: "POST /appraisals (compute assessed_value_cents)"
    algorithm: threshold
    formula: |
      if method == MARKET_COMPARABLE:
        assessed_value_cents = base_value_cents                                  # as-is comp
      elif method == REPLACEMENT_COST:
        assessed_value_cents = round_half_up(base_value_cents * REPLACEMENT_UPLIFT)
    input_set: "single Appraisal; identical base_value_cents yields different assessed_value_cents per method"
    constants:
      REPLACEMENT_UPLIFT: 1.20
    precision: "round_half_up, integer cents"
    variants:
      - name: market_comparable
        when: "method == MARKET_COMPARABLE"
        difference: "assessed = base_value_cents (no uplift)"
      - name: replacement_cost
        when: "method == REPLACEMENT_COST"
        difference: "assessed = round_half_up(base_value_cents * 1.20)"
    note: "Rule 1 dual-variant instance A (Bottle valuation domain)"

  - name: consignment_proceeds
    trigger: "POST /consignments/{id}/accept (provisional over offer_price_cents); POST /consignments/{id}/settle (final over hammer_price_cents)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned (Rule 2 mode-c circular-looking guard):
      #   1) commission_pct is selected from the price TIER,
      #   2) commission = round_half_up(price * commission_pct),
      #   3) net = price - commission,
      #   4) platform_fee = round_half_up(net * PLATFORM_FEE_PCT),
      #   5) proceeds = net - platform_fee.
      select_commission_pct(price):
        if price <= COMMISSION_TIER_1_CENTS: return 0.20
        elif price <= COMMISSION_TIER_2_CENTS: return 0.15
        else: return 0.10
      commission_pct = select_commission_pct(price)
      commission = round_half_up(price * commission_pct)
      net = price - commission
      platform_fee = round_half_up(net * PLATFORM_FEE_PCT)
      proceeds = net - platform_fee
    input_set: "single Consignment; provisional uses offer_price_cents, final uses hammer_price_cents"
    constants:
      COMMISSION_TIER_1_CENTS: 5000000      # <= $50,000 -> 20%
      COMMISSION_TIER_2_CENTS: 20000000     # <= $200,000 -> 15%; else 10%
      PLATFORM_FEE_PCT: 0.03
    precision: "round_half_up at each of commission and platform_fee, integer cents"
    variants:
      - name: provisional
        when: "on accept — price = offer_price_cents"
        difference: "writes estimated_proceeds_cents; does not touch ledger or bottle"
      - name: final
        when: "on settle — price = hammer_price_cents"
        difference: "writes commission_pct + net_proceeds_cents, posts CREDIT ledger entry, marks bottle SOLD"
    note: "Rule 1 dual-variant instance B (Consignment/Member payout domain — different entity domain from appraisal_valuation)"

  - name: member_wallet_balance
    trigger: "any LedgerEntry created for the member"
    algorithm: aggregation
    formula: |
      signed_amount_cents(e) = +e.amount_cents if e.entry_type == CREDIT else -e.amount_cents
      wallet_balance_cents = sum(signed_amount_cents(e) for LedgerEntry e where e.member_id == member.id)
    input_set: "all LedgerEntry rows for the member (append-only; ordered by created_at ASC, no tie-break needed for a sum)"
    constants:
      WALLET_FLOOR_CENTS: -100000      # binding a premium may not drop wallet below this overdraft floor
    precision: "integer cents"
    note: "Conserved quantity: a DEBIT paired with an equal CREDIT (compensation) leaves wallet_balance_cents unchanged"

  - name: courier_slot_overlap
    trigger: "POST /delivery-orders"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [slot_start, slot_end) on a shared courier_ref.
      # New order conflicts with any existing DeliveryOrder e (status != CANCELLED,
      # same courier_ref) iff: new.slot_start < e.slot_end AND e.slot_start < new.slot_end.
      # Adjacency (new.slot_start == e.slot_end, or new.slot_end == e.slot_start) is ALLOWED.
      conflict = exists e: (new.slot_start < e.slot_end) and (e.slot_start < new.slot_end)
      if conflict: reject ERR_COURIER_SLOT_CONFLICT
    input_set: "non-CANCELLED DeliveryOrders on the same courier_ref"
    precision: "no buffer; strict half-open comparison"
    note: "Rule 8 overlap instance A: half-open, zero-buffer, courier resource"

  - name: maintenance_window_overlap
    trigger: "POST /maintenance-windows"
    algorithm: interval_merge
    formula: |
      # Closed intervals [window_start, window_end] on a shared locker, PLUS a
      # MAINTENANCE_BUFFER_MINUTES gap required between windows. Two windows on the
      # same locker (status != CANCELLED) conflict iff they come within the buffer:
      #   new.window_start <= e.window_end + BUFFER AND e.window_start <= new.window_end + BUFFER
      # i.e. adjacency and near-adjacency within the buffer are REJECTED (unlike courier slots).
      conflict = exists e: (new.window_start <= e.window_end + BUFFER)
                       and (e.window_start <= new.window_end + BUFFER)
      if conflict: reject ERR_MAINTENANCE_WINDOW_CONFLICT
    input_set: "non-CANCELLED MaintenanceWindows on the same locker"
    constants:
      MAINTENANCE_BUFFER_MINUTES: 120
    precision: "closed interval + 120-minute buffer; comparison at minute granularity"
    note: "Rule 8 overlap instance B: closed interval WITH buffer, locker resource (different interval semantics from courier_slot_overlap)"

  - name: climate_band_check
    trigger: "POST /climate-readings (compute in_band)"
    algorithm: threshold
    formula: |
      in_band = (TEMP_MIN_C <= temperature_c <= TEMP_MAX_C)
                and (HUMID_MIN_PCT <= humidity_pct <= HUMID_MAX_PCT)
      if not in_band: locker.climate_status = BREACH
    input_set: "single ClimateReading vs band constants"
    constants:
      TEMP_MIN_C: 10.0
      TEMP_MAX_C: 16.0
      HUMID_MIN_PCT: 60.0
      HUMID_MAX_PCT: 80.0
    precision: "inclusive band boundaries"
    note: "Monitoring cascade trigger: out-of-band reading flips locker.climate_status to BREACH"

  - name: drink_window_status
    trigger: "read of Bottle; consignment listing gate"
    algorithm: threshold
    formula: |
      y = year(current_logical_clock_utc)
      if y < drink_window_start_year: drink_window_status = TOO_YOUNG        # boundary at start_year
      elif y > drink_window_end_year: drink_window_status = PAST_PEAK
      else: drink_window_status = IN_WINDOW
    input_set: "single Bottle vs logical-clock year"
    precision: "integer year comparison; y == start_year is IN_WINDOW (inclusive)"
    note: "Rule 6 boundary metric B (temporal year boundary), distinct endpoint from capacity"

  - name: waitlist_position
    trigger: "read of WaitlistEntry; POST /operations/cycle promotion"
    algorithm: chronological
    formula: |
      peers = [w for WaitlistEntry w where w.status == WAITING
               AND w.requested_size_tier == this.requested_size_tier
               AND w.requested_climate_zone == this.requested_climate_zone]
      order peers by created_at ASC (no id tie-break; created_at is unique per row)
      position = 1-based index of this entry within peers
    input_set: "WAITING entries matching (size_tier, climate_zone)"
    precision: "integer rank; promotion always offers the position-1 entry"
    note: "created_at ASC ordering (never id) governs promotion order"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix; for entity_backed CellarMember, X-User-ID must own the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id and every FK/reference in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, enum values legal, integers within stated constraints"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a legal state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Appraisal finalize: acting Appraiser (X-User-ID) differs from appraisal.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appraisals/{appraisalId}/finalize"
  - priority: 7
    category: state
    check: "Cross-entity actor state: Member.status == ACTIVE where the operation requires it (assign locker, approve movement)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /lockers/{lockerId}/assign, POST /movement-requests/{movementRequestId}/approve"
  - priority: 8
    category: business_referential
    check: "Cross-entity object state: Bottle.status == STORED (list/withdraw), provenance_status == DOCUMENTED (list), Bottle.status == WITHDRAWN (delivery)"
    error_id: "ERR_BOTTLE_NOT_STORED | ERR_PROVENANCE_NOT_DOCUMENTED | ERR_DELIVERY_BOTTLE_NOT_WITHDRAWN"
    http_status: 422
    applies_to: "POST /consignments/{consignmentId}/list, POST /movement-requests/{movementRequestId}/complete, POST /delivery-orders"
  - priority: 9
    category: business_temporal
    check: "Temporal gates: drink-window open for listing; courier slot non-overlap; maintenance window non-overlap within buffer"
    error_id: "ERR_DRINK_WINDOW_NOT_OPEN | ERR_COURIER_SLOT_CONFLICT | ERR_MAINTENANCE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /consignments/{consignmentId}/list, POST /delivery-orders, POST /maintenance-windows"
  - priority: 10
    category: business_constraint
    check: "Capacity / occupancy: locker free_bottles sufficient for POST /bottles or INTAKE reservation; locker empty to release; locker not FROZEN/MAINTENANCE/RETIRED"
    error_id: "ERR_LOCKER_CAPACITY_EXCEEDED | ERR_LOCKER_NOT_EMPTY | ERR_LOCKER_IN_MAINTENANCE"
    http_status: 409
    applies_to: "POST /bottles, POST /movement-requests, POST /lockers/{lockerId}/release"
  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: accepted/settled price >= reserve; member wallet stays >= WALLET_FLOOR_CENTS after a premium debit; no outstanding balance at close"
    error_id: "ERR_OFFER_BELOW_RESERVE | ERR_INSUFFICIENT_FUNDS | ERR_OUTSTANDING_BALANCE"
    http_status: 422
    applies_to: "POST /consignments/{consignmentId}/accept, POST /consignments/{consignmentId}/settle, POST /insurance-policies/{policyId}/bind, POST /members/{memberId}/close"
  - priority: 12
    category: business_constraint
    check: "OCC: expected_bottle_version matches Bottle.version on appraisal finalize"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appraisals/{appraisalId}/finalize"

# =============================================================================
# 1.5 API Endpoint Table  (flat topology; api_prefix == "")
# =============================================================================
endpoints:
  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Onboard a member account (status PENDING, wallet_balance_cents 0)"
    roles: [CellarManager]
    code: 201
    input: [full_name, email, membership_tier]
    output: Member
    side_effects: ["status = PENDING", "wallet_balance_cents = 0"]
  - method: GET
    path: "/members/{memberId}"
    description: "Read a member"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members (filter by tier/status)"
    roles: [CellarManager, InsuranceAgent, AuctionBroker]
    code: 200
    input: ["membership_tier?", "status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/members/{memberId}/activate"
    description: "PENDING -> ACTIVE"
    roles: [CellarManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/members/{memberId}/suspend"
    description: "ACTIVE -> SUSPENDED; freeze lockers, cancel their open movement requests, release reservations (cascade)"
    roles: [CellarManager]
    code: 200
    input: []
    output: Member
    side_effects:
      - "status -> SUSPENDED"
      - "hop1: ASSIGNED lockers of member -> FROZEN"
      - "hop2: {REQUESTED, APPROVED} MovementRequests on those lockers -> CANCELLED"
      - "hop3: reserved_bottles / free_bottles recomputed for each affected locker"
  - method: POST
    path: "/members/{memberId}/reactivate"
    description: "SUSPENDED -> ACTIVE; unfreeze lockers (FROZEN -> ASSIGNED)"
    roles: [CellarManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE", "FROZEN lockers -> ASSIGNED"]
  - method: POST
    path: "/members/{memberId}/close"
    description: "ACTIVE/SUSPENDED -> CLOSED (requires no active lockers, no outstanding balance)"
    roles: [CellarManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/members/{memberId}/ledger-adjustments"
    description: "Post a manual DEBIT/CREDIT ledger entry (billing/adjustment); recomputes wallet_balance_cents"
    roles: [CellarManager]
    code: 201
    input: [entry_type, amount_cents, reason, "related_entity_type?", "related_entity_id?"]
    output: LedgerEntry
    side_effects: ["append LedgerEntry", "member.wallet_balance_cents recomputed"]

  # ---- LedgerEntry (read) ----
  - method: GET
    path: "/ledger-entries/{ledgerEntryId}"
    description: "Read a ledger entry"
    roles: [CellarMember, CellarManager, InsuranceAgent, AuctionBroker]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries for a member (reverse-reachability for LedgerEntry.member_id)"
    roles: [CellarMember, CellarManager, InsuranceAgent, AuctionBroker]
    code: 200
    input: ["member_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- Locker ----
  - method: POST
    path: "/lockers"
    description: "Create an AVAILABLE locker"
    roles: [CellarManager]
    code: 201
    input: [label, size_tier, climate_zone, capacity_bottles]
    output: Locker
    side_effects: ["status = AVAILABLE", "occupancy_status = VACANT", "monthly_fee_cents = storage_fee", "climate_status = NOMINAL"]
  - method: GET
    path: "/lockers/{lockerId}"
    description: "Read a locker"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: []
    output: Locker
    side_effects: []
  - method: GET
    path: "/lockers"
    description: "List lockers (reverse-reachability for Locker.member_id)"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: ["member_id?", "status?", "size_tier?", "climate_zone?", "limit?", "offset?"]
    output: Locker[]
    side_effects: []
  - method: POST
    path: "/lockers/{lockerId}/assign"
    description: "AVAILABLE -> ASSIGNED to an ACTIVE member"
    roles: [CellarManager]
    code: 200
    input: [member_id]
    output: Locker
    side_effects: ["locker.member_id = member_id", "status -> ASSIGNED"]
  - method: POST
    path: "/lockers/{lockerId}/release"
    description: "ASSIGNED -> AVAILABLE (must be empty and unreserved)"
    roles: [CellarManager]
    code: 200
    input: []
    output: Locker
    side_effects: ["locker.member_id = null", "status -> AVAILABLE"]
  - method: POST
    path: "/lockers/{lockerId}/retire"
    description: "AVAILABLE -> RETIRED (empty only)"
    roles: [CellarManager]
    code: 200
    input: []
    output: Locker
    side_effects: ["status -> RETIRED"]

  # ---- Bottle ----
  - method: POST
    path: "/bottles"
    description: "Store a bottle into the member's assigned locker (consumes 1 free unit)"
    roles: [CellarMember, CellarManager]
    code: 201
    input: [locker_id, wine_name, vintage_year, varietal, format_ml, drink_window_start_year, drink_window_end_year, "provenance_status?"]
    output: Bottle
    side_effects: ["status = STORED", "member_id = locker.member_id", "locker occupied_bottles/free_bottles/occupancy_status recomputed"]
  - method: GET
    path: "/bottles/{bottleId}"
    description: "Read a bottle (includes computed drink_window_status, appraised_value_cents)"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: []
    output: Bottle
    side_effects: []
  - method: GET
    path: "/bottles"
    description: "List bottles (reverse-reachability for Bottle.member_id and Bottle.locker_id)"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: ["member_id?", "locker_id?", "status?", "limit?", "offset?"]
    output: Bottle[]
    side_effects: []
  - method: POST
    path: "/bottles/{bottleId}/provenance"
    description: "Set provenance_status (chain-of-custody update)"
    roles: [CellarManager, Appraiser]
    code: 200
    input: [provenance_status]
    output: Bottle
    side_effects: ["bottle.provenance_status = provenance_status"]

  # ---- Appraisal ----
  - method: POST
    path: "/appraisals"
    description: "Create a DRAFT appraisal; computes assessed_value_cents from method; records created_by_user_id = X-User-ID"
    roles: [Appraiser]
    code: 201
    input: [bottle_id, method, base_value_cents]
    output: Appraisal
    side_effects: ["assessed_value_cents = appraisal_valuation(method, base_value_cents)", "created_by_user_id = X-User-ID", "status = DRAFT"]
  - method: POST
    path: "/appraisals/{appraisalId}/finalize"
    description: "DRAFT -> FINALIZED (SoD: finalizer != creator; OCC on Bottle.version). Supersedes prior FINALIZED appraisal and rewrites Bottle.appraised_value_cents"
    roles: [Appraiser]
    code: 200
    input: [expected_bottle_version]
    output: Appraisal
    side_effects:
      - "status -> FINALIZED"
      - "prior FINALIZED appraisal for bottle -> SUPERSEDED"
      - "Bottle.appraised_value_cents = this.assessed_value_cents"
      - "effective_date = current logical clock"
      - "increments Bottle.version by 1"
  - method: GET
    path: "/appraisals/{appraisalId}"
    description: "Read an appraisal"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: GET
    path: "/appraisals"
    description: "List appraisals (reverse-reachability for Appraisal.bottle_id)"
    roles: [CellarMember, CellarManager, Appraiser, InsuranceAgent, AuctionBroker]
    code: 200
    input: ["bottle_id?", "status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  # ---- InsurancePolicy ----
  - method: POST
    path: "/insurance-policies"
    description: "Quote a policy over covered bottles (computes insured_value_cents + premium_cents)"
    roles: [InsuranceAgent]
    code: 201
    input: [member_id, coverage_tier, covered_bottle_ids]
    output: InsurancePolicy
    side_effects: ["insured_value_cents computed", "premium_cents = insurance_premium(...)", "status = QUOTED"]
  - method: POST
    path: "/insurance-policies/{policyId}/bind"
    description: "QUOTED -> BOUND; debits premium to member wallet"
    roles: [InsuranceAgent]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> BOUND", "LedgerEntry DEBIT premium_cents", "bound_at set", "member.wallet_balance_cents recomputed"]
  - method: POST
    path: "/insurance-policies/{policyId}/cancel"
    description: "QUOTED/BOUND -> CANCELLED; refunds premium if it was BOUND (compensating CREDIT)"
    roles: [InsuranceAgent]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> CANCELLED", "if was BOUND: LedgerEntry CREDIT premium_cents refund; wallet recomputed"]
  - method: GET
    path: "/insurance-policies/{policyId}"
    description: "Read a policy"
    roles: [CellarMember, CellarManager, InsuranceAgent]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "List policies (reverse-reachability for InsurancePolicy.member_id)"
    roles: [CellarMember, CellarManager, InsuranceAgent]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  # ---- MovementRequest ----
  - method: POST
    path: "/movement-requests"
    description: "Create INTAKE (reserve units) or WITHDRAWAL (pull stored bottles) request"
    roles: [CellarMember]
    code: 201
    input: [member_id, locker_id, request_type, quantity, "bottle_ids?"]
    output: MovementRequest
    side_effects: ["status = REQUESTED", "if INTAKE: locker.reserved_bottles/free_bottles recomputed"]
  - method: POST
    path: "/movement-requests/{movementRequestId}/approve"
    description: "REQUESTED -> APPROVED (member must be ACTIVE, locker not frozen/maintenance)"
    roles: [CellarManager]
    code: 200
    input: []
    output: MovementRequest
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/movement-requests/{movementRequestId}/reject"
    description: "REQUESTED -> REJECTED (releases INTAKE reservation)"
    roles: [CellarManager]
    code: 200
    input: []
    output: MovementRequest
    side_effects: ["status -> REJECTED", "if INTAKE: reserved_bottles/free_bottles recomputed"]
  - method: POST
    path: "/movement-requests/{movementRequestId}/complete"
    description: "APPROVED -> COMPLETED; WITHDRAWAL pulls bottles (STORED -> WITHDRAWN); INTAKE releases reservation"
    roles: [CellarManager]
    code: 200
    input: []
    output: MovementRequest
    side_effects: ["status -> COMPLETED", "WITHDRAWAL: listed bottles -> WITHDRAWN, locker occupancy recomputed", "INTAKE: reservation released"]
  - method: POST
    path: "/movement-requests/{movementRequestId}/cancel"
    description: "REQUESTED/APPROVED -> CANCELLED (releases INTAKE reservation)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: MovementRequest
    side_effects: ["status -> CANCELLED", "if INTAKE: reserved_bottles/free_bottles recomputed"]
  - method: GET
    path: "/movement-requests/{movementRequestId}"
    description: "Read a movement request"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: MovementRequest
    side_effects: []
  - method: GET
    path: "/movement-requests"
    description: "List movement requests (reverse-reachability for member_id and locker_id)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: ["member_id?", "locker_id?", "status?", "request_type?", "limit?", "offset?"]
    output: MovementRequest[]
    side_effects: []

  # ---- DeliveryOrder ----
  - method: POST
    path: "/delivery-orders"
    description: "Schedule a delivery of WITHDRAWN bottles in a courier slot (half-open, per-courier non-overlap)"
    roles: [CellarManager]
    code: 201
    input: [member_id, bottle_ids, courier_ref, slot_start, slot_end]
    output: DeliveryOrder
    side_effects: ["status = SCHEDULED", "each bottle WITHDRAWN -> IN_TRANSIT"]
  - method: POST
    path: "/delivery-orders/{deliveryOrderId}/deliver"
    description: "SCHEDULED -> DELIVERED (bottles IN_TRANSIT -> DELIVERED)"
    roles: [CellarManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> DELIVERED", "bottles -> DELIVERED"]
  - method: POST
    path: "/delivery-orders/{deliveryOrderId}/cancel"
    description: "SCHEDULED -> CANCELLED (bottles IN_TRANSIT -> WITHDRAWN)"
    roles: [CellarManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> CANCELLED", "bottles -> WITHDRAWN"]
  - method: GET
    path: "/delivery-orders/{deliveryOrderId}"
    description: "Read a delivery order"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders (reverse-reachability for DeliveryOrder.member_id)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: ["member_id?", "courier_ref?", "status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: []

  # ---- Consignment ----
  - method: POST
    path: "/consignments"
    description: "Seller opens a DRAFT consignment for a stored bottle (member_id copied from bottle owner)"
    roles: [CellarMember]
    code: 201
    input: [bottle_id, reserve_price_cents]
    output: Consignment
    side_effects: ["status = DRAFT", "member_id = bottle.member_id"]
  - method: POST
    path: "/consignments/{consignmentId}/list"
    description: "DRAFT -> LISTED (bottle STORED+DOCUMENTED+drink-window open; bottle -> CONSIGNED)"
    roles: [AuctionBroker]
    code: 200
    input: []
    output: Consignment
    side_effects: ["status -> LISTED", "Bottle STORED -> CONSIGNED"]
  - method: POST
    path: "/consignments/{consignmentId}/offer"
    description: "LISTED/COUNTERED -> OFFERED (broker records offer_price_cents)"
    roles: [AuctionBroker]
    code: 200
    input: [offer_price_cents]
    output: Consignment
    side_effects: ["status -> OFFERED", "offer_price_cents recorded"]
  - method: POST
    path: "/consignments/{consignmentId}/counter"
    description: "OFFERED -> COUNTERED (seller records counter_price_cents; negotiation loop)"
    roles: [CellarMember]
    code: 200
    input: [counter_price_cents]
    output: Consignment
    side_effects: ["status -> COUNTERED", "counter_price_cents recorded"]
  - method: POST
    path: "/consignments/{consignmentId}/accept"
    description: "OFFERED -> ACCEPTED (offer >= reserve); computes estimated_proceeds_cents (provisional variant)"
    roles: [CellarMember]
    code: 200
    input: []
    output: Consignment
    side_effects: ["status -> ACCEPTED", "estimated_proceeds_cents = consignment_proceeds(provisional)"]
  - method: POST
    path: "/consignments/{consignmentId}/settle"
    description: "ACCEPTED -> SETTLED with hammer_price_cents; final proceeds, CREDIT ledger, bottle SOLD (cascade)"
    roles: [AuctionBroker]
    code: 200
    input: [hammer_price_cents]
    output: Consignment
    side_effects:
      - "status -> SETTLED"
      - "commission_pct + net_proceeds_cents = consignment_proceeds(final)"
      - "hop1: Bottle CONSIGNED -> SOLD, locker_id = null"
      - "hop2: source locker occupancy recomputed"
      - "LedgerEntry CREDIT net_proceeds_cents to seller; wallet recomputed"
  - method: POST
    path: "/consignments/{consignmentId}/withdraw"
    description: "Non-terminal -> WITHDRAWN (bottle CONSIGNED -> STORED if applicable)"
    roles: [CellarMember]
    code: 200
    input: []
    output: Consignment
    side_effects: ["status -> WITHDRAWN", "if bottle CONSIGNED: -> STORED"]
  - method: GET
    path: "/consignments/{consignmentId}"
    description: "Read a consignment"
    roles: [CellarMember, CellarManager, AuctionBroker]
    code: 200
    input: []
    output: Consignment
    side_effects: []
  - method: GET
    path: "/consignments"
    description: "List consignments (reverse-reachability for Consignment.bottle_id and member_id)"
    roles: [CellarMember, CellarManager, AuctionBroker]
    code: 200
    input: ["member_id?", "bottle_id?", "status?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  # ---- WaitlistEntry ----
  - method: POST
    path: "/waitlist-entries"
    description: "Join the waitlist for a (size_tier, climate_zone) locker"
    roles: [CellarMember]
    code: 201
    input: [member_id, requested_size_tier, requested_climate_zone]
    output: WaitlistEntry
    side_effects: ["status = WAITING", "position computed"]
  - method: POST
    path: "/waitlist-entries/{waitlistEntryId}/accept"
    description: "OFFERED -> FULFILLED; claims the offered locker (AVAILABLE -> ASSIGNED)"
    roles: [CellarMember]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> FULFILLED", "offered locker -> ASSIGNED with member_id"]
  - method: POST
    path: "/waitlist-entries/{waitlistEntryId}/cancel"
    description: "WAITING/OFFERED -> CANCELLED (releases offered locker)"
    roles: [CellarMember]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> CANCELLED", "if OFFERED: offered locker released to AVAILABLE"]
  - method: GET
    path: "/waitlist-entries/{waitlistEntryId}"
    description: "Read a waitlist entry (includes computed position)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries (reverse-reachability for WaitlistEntry.member_id)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # ---- MaintenanceWindow ----
  - method: POST
    path: "/maintenance-windows"
    description: "Schedule a maintenance window on a locker (closed interval, per-locker non-overlap within buffer)"
    roles: [CellarManager]
    code: 201
    input: [locker_id, window_start, window_end, reason]
    output: MaintenanceWindow
    side_effects: ["status = SCHEDULED"]
  - method: POST
    path: "/maintenance-windows/{maintenanceWindowId}/activate"
    description: "SCHEDULED -> ACTIVE (locker -> MAINTENANCE)"
    roles: [CellarManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> ACTIVE", "locker -> MAINTENANCE"]
  - method: POST
    path: "/maintenance-windows/{maintenanceWindowId}/complete"
    description: "ACTIVE -> COMPLETED (locker leaves MAINTENANCE; climate_status = NOMINAL)"
    roles: [CellarManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> COMPLETED", "locker -> ASSIGNED/AVAILABLE", "locker.climate_status = NOMINAL"]
  - method: POST
    path: "/maintenance-windows/{maintenanceWindowId}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [CellarManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> CANCELLED"]
  - method: GET
    path: "/maintenance-windows/{maintenanceWindowId}"
    description: "Read a maintenance window"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []
  - method: GET
    path: "/maintenance-windows"
    description: "List maintenance windows (reverse-reachability for MaintenanceWindow.locker_id)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: ["locker_id?", "status?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  # ---- ClimateReading ----
  - method: POST
    path: "/climate-readings"
    description: "Record a climate reading; an out-of-band reading sets locker.climate_status = BREACH (monitoring cascade)"
    roles: [CellarManager]
    code: 201
    input: [locker_id, temperature_c, humidity_pct]
    output: ClimateReading
    side_effects: ["in_band computed", "if not in_band: locker.climate_status = BREACH"]
  - method: GET
    path: "/climate-readings/{climateReadingId}"
    description: "Read a climate reading"
    roles: [CellarMember, CellarManager]
    code: 200
    input: []
    output: ClimateReading
    side_effects: []
  - method: GET
    path: "/climate-readings"
    description: "List climate readings (reverse-reachability for ClimateReading.locker_id)"
    roles: [CellarMember, CellarManager]
    code: 200
    input: ["locker_id?", "limit?", "offset?"]
    output: ClimateReading[]
    side_effects: []

  # ---- Operations / clock (epoch + determinism) ----
  - method: POST
    path: "/operations/cycle"
    description: "Advance the operations epoch: promote position-1 waitlist entries to matching AVAILABLE lockers, expire stale OFFERED entries, lapse BOUND policies of negative-wallet members"
    roles: [CellarManager]
    code: 200
    input: []
    output: "{ promoted_waitlist_ids: array, expired_waitlist_ids: array, lapsed_policy_ids: array }"
    side_effects: ["WAITING -> OFFERED promotions", "OFFERED -> EXPIRED for stale offers", "BOUND -> LAPSED for negative wallets"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock setter. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CellarManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint, or CellarMember acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body reference does not resolve to an existing resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, illegal enum value, or integer outside stated constraint" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a legal state for the requested transition (includes waitlist accept on a taken locker)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appraisal finalize attempted by the same X-User-ID that created the appraisal" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires target Member.status == ACTIVE (assign locker, approve movement)" }
  - { id: ERR_BOTTLE_NOT_STORED, http: 422, condition: "Bottle is not STORED where the op requires it (consignment list, withdrawal complete)" }
  - { id: ERR_PROVENANCE_NOT_DOCUMENTED, http: 422, condition: "Consignment listing requires Bottle.provenance_status == DOCUMENTED" }
  - { id: ERR_DELIVERY_BOTTLE_NOT_WITHDRAWN, http: 422, condition: "Delivery order includes a bottle whose status is not WITHDRAWN" }
  - { id: ERR_DRINK_WINDOW_NOT_OPEN, http: 409, condition: "Consignment listing on a bottle whose drink_window_status == TOO_YOUNG (clock year < drink_window_start_year)" }
  - { id: ERR_COURIER_SLOT_CONFLICT, http: 409, condition: "Delivery slot [slot_start, slot_end) overlaps an existing non-cancelled order on the same courier_ref (half-open; adjacency allowed)" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "Maintenance window [window_start, window_end] is within MAINTENANCE_BUFFER_MINUTES of another non-cancelled window on the same locker (closed interval + buffer)" }
  - { id: ERR_LOCKER_CAPACITY_EXCEEDED, http: 409, condition: "POST /bottles or INTAKE reservation would drive free_bottles below 0 (free_bottles == 0 boundary blocks)" }
  - { id: ERR_LOCKER_NOT_EMPTY, http: 409, condition: "Release/retire a locker whose occupied_bottles or reserved_bottles is not 0" }
  - { id: ERR_LOCKER_IN_MAINTENANCE, http: 409, condition: "Movement approve / bottle create on a locker in status FROZEN, MAINTENANCE, or RETIRED" }
  - { id: ERR_OFFER_BELOW_RESERVE, http: 422, condition: "Accept with offer_price_cents < reserve, or settle with hammer_price_cents < reserve" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Binding a policy would drop member.wallet_balance_cents below WALLET_FLOOR_CENTS" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 422, condition: "Closing a member whose wallet_balance_cents < 0" }
  - { id: ERR_MEMBER_HAS_ACTIVE_LOCKERS, http: 409, condition: "Closing a member that still holds a locker in ASSIGNED/FROZEN/MAINTENANCE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bottle_version does not match Bottle.version at appraisal finalize (OCC)" }
  - { id: ERR_BOTTLE_NOT_OWNED, http: 422, condition: "Policy covered_bottle_ids or consignment/movement bottle references a bottle not owned by the acting/target member" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CellarMember
    description: "A storage client. Owns lockers assigned to them, their bottles, movement requests, consignments, insurance policies, and waitlist entries. Ownership: X-User-ID == the resource's member_id."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /bottles (into own assigned locker)"
      - "POST /movement-requests (own locker)"
      - "POST /consignments (own bottle)"
      - "POST /consignments/{id}/counter, /accept, /withdraw (own consignment)"
      - "POST /waitlist-entries, /waitlist-entries/{id}/accept, /cancel (own)"
    shared_operations:
      - "POST /movement-requests/{id}/cancel (with CellarManager)"
      - "GET reads of own resources (bottles, lockers, movement-requests, consignments, insurance-policies, waitlist-entries, delivery-orders, ledger-entries)"
  - name: CellarManager
    description: "Facility operator. Manages members, lockers, movement approvals, deliveries, maintenance, climate readings, ledger adjustments, and the operations cycle. Opaque operator identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /members, /members/{id}/activate|suspend|reactivate|close|ledger-adjustments"
      - "POST /lockers, /lockers/{id}/assign|release|retire"
      - "POST /movement-requests/{id}/approve|reject|complete"
      - "POST /delivery-orders and its transitions"
      - "POST /maintenance-windows and its transitions"
      - "POST /climate-readings"
      - "POST /operations/cycle, POST /_clock/set_current_utc"
    shared_operations:
      - "POST /bottles (on behalf of a member), POST /movement-requests/{id}/cancel"
      - "GET reads across resources"
  - name: Appraiser
    description: "Independent valuator. Creates and finalizes appraisals; segregation of duties requires the finalizer differ from the creator. Opaque identity (X-User-ID tracked for SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /appraisals, POST /appraisals/{id}/finalize"
      - "POST /bottles/{id}/provenance (shared with CellarManager)"
    shared_operations:
      - "POST /bottles/{id}/provenance (with CellarManager)"
      - "GET reads of bottles, appraisals, lockers, members"
  - name: InsuranceAgent
    description: "Underwriter. Quotes, binds, and cancels insurance policies. Opaque identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-policies, POST /insurance-policies/{id}/bind|cancel"
    shared_operations:
      - "GET reads of members, bottles, insurance-policies, lockers, ledger-entries"
  - name: AuctionBroker
    description: "Consignment/auction intermediary. Lists consignments, records offers, and settles. Opaque identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /consignments/{id}/list|offer|settle"
    shared_operations:
      - "GET reads of consignments, bottles, members, ledger-entries"

# __END__
