# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Bearing & Power-Transmission Rebuild — 9 rule_ids, 21 instances.
#
# Shared literals used across recipes (all pinned, none derived at test time):
#   Standard "SKF-22324-CCK": base_core_value_cents 90000, max_rebuild_count 3,
#     warranty_hours 8000, warranty_months 18, required_feature_codes ["BORE"],
#     bands  BORE        [40, 90]  ext 15  ded 0.10  w 0.40
#            JOURNAL     [25, 60]  ext 10  ded 0.07  w 0.30
#            HOUSING_FIT [10, 45]  ext 10  ded 0.05  w 0.20
#            END_PLAY    [50, 150] ext 20  ded 0.03  w 0.10
#   Core: rebuild_count 1, declared_condition_grade GRADE_D
#         -> provisional credit round(90000*0.20) - round(90000*0.08*1) = 18000 - 7200 = 10800
#   Measurements BORE 85 / JOURNAL 58 / HOUSING_FIT 44 / END_PLAY 160
#         -> IN_SPEC, IN_SPEC, IN_SPEC, REWORKABLE(dev 0.10, score 90)
#   Reading v=2.10 -> iso_zone B (penalty 5); rebuild penalty 6*1 = 6
#         STANDARD asset -> COMPOSITE 99.0 -> 99 - 5 - 6 = 88 -> GRADE_A
#         CRITICAL asset -> CONSERVATIVE 90.0 -> 90 - 5 - 6 = 79 -> GRADE_B
#   final credit GRADE_A = 90000 - 7200 - round(90000*0.03*0.5)=1350 -> 81450
#   final credit GRADE_B = 67500 - 7200 - 1350 -> 58950
#   Quote: labor 6.5h * 14500 = 94250; OEM line 2 x 38500 = 77000;
#          pre 171250; cap floor(171250*0.40) = 68500; covered_base 171250
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: core_credit_provisional_vs_final_diverge_on_same_core
        grounds:
          - calculations.core_credit_valuation
          - entities.CoreUnit.fields.provisional_core_credit_cents
          - entities.CoreUnit.fields.final_core_credit_cents
          - state_machines.CoreUnit.INSPECTING_to_GRADED
          - entities.CreditNote.fields.status
        distinguishing_aspect: |
          Exchange-core valuation on the CoreUnit entity domain: the provisional
          variant values the same physical core at 10800 cents from the
          customer-declared GRADE_D, while the final variant values it at 81450
          cents from the bench-verified GRADE_A plus one rounded REWORKABLE
          deduction line — a 70650-cent divergence on identical inputs, settled
          by voiding the provisional CreditNote and posting a replacement.
        test_recipe:
          setup:
            - "One customer with a STANDARD-criticality asset and the SKF-22324-CCK standard."
            - "One core received at rebuild_count 1 with declared_condition_grade GRADE_D, so a provisional CORE_EXCHANGE note of 10800 is already POSTED."
            - "One inspection carrying the four canonical measurements, linked to a zone-B reading, SUBMITTED by inspector insp-1."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Northgate Mill", account_code: "NGM-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "CONV-04-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}, {feature_code: "JOURNAL", min_um: 25, max_um: 60, rework_extension_um: 10, deduction_pct: 0.07, weight: 0.30}, {feature_code: "HOUSING_FIT", min_um: 10, max_um: 45, rework_extension_um: 10, deduction_pct: 0.05, weight: 0.20}, {feature_code: "END_PLAY", min_um: 50, max_um: 150, rework_extension_um: 20, deduction_pct: 0.03, weight: 0.10}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-77001", rebuild_count: 1, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_id: $.data.id, prov_credit: $.data.provisional_core_credit_cents }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 6.5 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "JOURNAL", measured_um: 58 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "HOUSING_FIT", measured_um: 44 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "END_PLAY", measured_um: 160 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "GET /shop/core-units/${core_id}"
              as: ShopAdmin
            - call: "GET /shop/credit-notes"
              payload: { core_unit_id: "${core_id}" }
              as: ShopAdmin
          assert:
            - "CoreUnit.${core_id}.provisional_core_credit_cents == 10800"
            - "CoreUnit.${core_id}.final_core_credit_cents == 81450"
            - "CoreUnit.${core_id}.condition_grade == GRADE_A"
            - "GET /shop/credit-notes?core_unit_id=${core_id} returns total_count == 2"
            - "the CORE_EXCHANGE note with amount_cents == 10800 has status == VOID"
            - "the CORE_EXCHANGE note with amount_cents == 81450 has status == POSTED"
            - "Customer.${cust_id}.core_credit_balance_cents == 81450"
            - "Customer.${cust_id}.total_credit_balance_cents == 81450"

      - name: warranty_hours_basis_overrides_calendar_basis_on_same_claim
        grounds:
          - calculations.warranty_pro_rata_credit
          - entities.WarrantyClaim.fields.governing_basis
          - entities.WarrantyClaim.fields.pro_rata_credit_cents
          - entities.Installation.fields.covered_base_cents_snapshot
        distinguishing_aspect: |
          Warranty settlement on the WarrantyClaim entity domain — a different
          subject from the CoreUnit valuation above: the hours basis consumes
          0.650000 of the warranty while the calendar basis consumes only
          0.333333 of it, and the scaffold's max-consumption rule pays 59938
          cents where a calendar-basis reading of the same prose would pay
          114167 cents.
        test_recipe:
          setup:
            - "A full rebuild pipeline delivered on the canonical fixture, so the order's covered_base_cents is 171250."
            - "The rebuilt unit installed on 2026-08-05, run 5200 hours, then failed in service on 2027-02-01 (180 elapsed days against an 8000-hour / 18-month warranty)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Northgate Mill", account_code: "NGM-002" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "CONV-04-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}, {feature_code: "JOURNAL", min_um: 25, max_um: 60, rework_extension_um: 10, deduction_pct: 0.07, weight: 0.30}, {feature_code: "HOUSING_FIT", min_um: 10, max_um: 45, rework_extension_um: 10, deduction_pct: 0.05, weight: 0.20}, {feature_code: "END_PLAY", min_um: 50, max_um: 150, rework_extension_um: 20, deduction_pct: 0.03, weight: 0.10}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-1", parallel_slots: 1, cleanroom: false }
              as: ShopAdmin
              captures: { bench_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-77002", rebuild_count: 1, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 6.5 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "GET /shop/rebuild-orders/${order_id}"
              as: Planner
              captures: { order_v: $.data.version }
            - call: "POST /shop/rebuild-orders/${order_id}/part-lines"
              payload: { part_no: "BRG-22324", source_class: "OEM", qty: 2, unit_cost_cents: 38500, expected_order_version: "${order_v}" }
              as: Planner
              captures: { pl_id: $.data.id }
            - call: "POST /shop/part-lines/${pl_id}/advance"
              payload: { action: "SUBMIT" }
              as: Planner
            - call: "POST /shop/part-lines/${pl_id}/decide"
              payload: { decision: "APPROVE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "QUOTE" }
              as: Planner
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "JOURNAL", measured_um: 58 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "HOUSING_FIT", measured_um: 44 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "END_PLAY", measured_um: 160 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_id}", bench_id: "${bench_id}", window_start_at: "2026-08-03T08:00:00Z", window_end_at: "2026-08-03T12:00:00Z" }
              as: Planner
              captures: { res_id: $.data.id }
            - call: "POST /shop/bench-reservations/${res_id}/advance"
              payload: { action: "CONFIRM" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "SCHEDULE" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "START" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "COMPLETE" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "DELIVER" }
              as: Planner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ShopAdmin
            - call: "GET /shop/assets/${asset_id}"
              as: ShopAdmin
              captures: { asset_v: $.data.version }
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${asset_v}" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /shop/installations/${inst_id}/advance"
              payload: { action: "RECORD_HOURS", run_hours_delta: 5200 }
              as: ShopAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /shop/installations/${inst_id}/advance"
              payload: { action: "FAIL" }
              as: ShopAdmin
          trigger:
            - call: "POST /shop/warranty-claims"
              payload: { installation_id: "${inst_id}", claimed_reason: "outer race spall at 5200 hours" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "Installation.${inst_id}.covered_base_cents_snapshot == 171250"
            - "WarrantyClaim.${claim_id}.elapsed_days == 180"
            - "WarrantyClaim.${claim_id}.hours_consumed_fraction == 0.650000"
            - "WarrantyClaim.${claim_id}.calendar_consumed_fraction == 0.333333"
            - "WarrantyClaim.${claim_id}.governing_basis == HOURS"
            - "WarrantyClaim.${claim_id}.remaining_fraction == 0.350000"
            - "WarrantyClaim.${claim_id}.pro_rata_credit_cents == 59938"
            - "WarrantyClaim.${claim_id}.pro_rata_credit_cents != 114167 (the calendar-basis result on the same data)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: life_score_conservative_min_vs_composite_weighted_average
        grounds:
          - calculations.remaining_life_score
          - entities.Inspection.fields.life_score_variant
          - entities.Inspection.fields.remaining_life_score
          - entities.CustomerAsset.fields.criticality
          - calculations.core_credit_valuation
        distinguishing_aspect: |
          Mode (a) — a four-input non-linear formula: a weight-renormalised
          average competing with a min() over the same governing feature scores,
          selected by a conditional branch on CustomerAsset.criticality, then
          reduced by two tiered integer penalties. On identical metrology the
          CRITICAL branch yields 79/GRADE_B where the STANDARD branch yields
          88/GRADE_A, which carries all the way into a 58950 vs 81450 core credit.
        test_recipe:
          setup:
            - "The canonical fixture, but the destination asset is criticality CRITICAL."
            - "The four canonical measurements produce feature scores 100, 100, 100 and 90; the composite is 99.0 and the minimum is 90.0."
            - "A zone-B reading (penalty 5) and rebuild_count 1 (penalty 6) apply."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Northgate Mill", account_code: "NGM-003" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "PUMP-11-GBX", criticality: "CRITICAL", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}, {feature_code: "JOURNAL", min_um: 25, max_um: 60, rework_extension_um: 10, deduction_pct: 0.07, weight: 0.30}, {feature_code: "HOUSING_FIT", min_um: 10, max_um: 45, rework_extension_um: 10, deduction_pct: 0.05, weight: 0.20}, {feature_code: "END_PLAY", min_um: 50, max_um: 150, rework_extension_um: 20, deduction_pct: 0.03, weight: 0.10}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-77003", rebuild_count: 1, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 6.5 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "JOURNAL", measured_um: 58 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "HOUSING_FIT", measured_um: 44 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "END_PLAY", measured_um: 160 }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "GET /shop/core-units/${core_id}"
              as: ShopAdmin
          assert:
            - "Inspection.${insp_id}.life_score_variant == CONSERVATIVE"
            - "Inspection.${insp_id}.remaining_life_score == 79"
            - "Inspection.${insp_id}.remaining_life_grade == GRADE_B"
            - "CoreUnit.${core_id}.condition_grade == GRADE_B"
            - "CoreUnit.${core_id}.final_core_credit_cents == 58950"
            - "Customer.${cust_id}.total_credit_balance_cents == 58950"

      - name: core_credit_rounds_each_deduction_line_before_summing
        grounds:
          - calculations.core_credit_valuation
          - entities.ClearanceStandard.fields.feature_bands
          - entities.Measurement.fields.band_result
          - entities.CoreUnit.fields.final_core_credit_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order changes the cents: three
          REWORKABLE deduction lines of exactly 123.4 cents each round
          individually to 123 (sum 369), whereas summing first gives 370.2 which
          rounds to 370. The scaffold pins per-line rounding, so the final core
          credit is 631 and never 630.
        test_recipe:
          setup:
            - "A dedicated standard ROUND-TEST-1 with base_core_value_cents 1000 and deduction_pct 0.2468 on all three bands."
            - "A core at rebuild_count 0 declared GRADE_A, so the provisional credit is exactly 1000 and the decay term is 0."
            - "Three measurements each one micrometre past their band, all REWORKABLE, giving feature scores 98.000000, 97.142900 and 97.142900 and a composite of 97.48574."
            - "A zone-A reading (velocity 1.00) so the vibration penalty is 0."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Rounding Works", account_code: "RND-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "MIX-02-GBX", criticality: "STANDARD", duty_class: "INTERMITTENT" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "ROUND-TEST-1", base_core_value_cents: 1000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.2468, weight: 0.40}, {feature_code: "JOURNAL", min_um: 25, max_um: 60, rework_extension_um: 10, deduction_pct: 0.2468, weight: 0.30}, {feature_code: "HOUSING_FIT", min_um: 10, max_um: 45, rework_extension_um: 10, deduction_pct: 0.2468, weight: 0.30}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-RND-1", rebuild_count: 0, declared_condition_grade: "GRADE_A" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 2.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 1.00, bpfo_amplitude_g: 0.10, bpfi_amplitude_g: 0.10, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
