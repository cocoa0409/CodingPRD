            - { call: "POST /ballots", payload: { event_id: "${ev}", registration_id: "${r1}" }, as: Participant, as_user_id: "${pv}", captures: { bal: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "CANCELLED", reason: "tornado warning" }, as: Organizer }
            - { call: "GET /registrations/${r1}", payload: {}, as: Organizer, captures: { r1_st: $.data.status } }
            - { call: "GET /registrations/${r2}", payload: {}, as: Organizer, captures: { r2_st: $.data.status } }
            - { call: "GET /ballots", payload: {}, as: Organizer }
            - { call: "GET /events/${ev}/zones", payload: {}, as: Organizer }
            - { call: "GET /events/${ev}/summary", payload: {}, as: Organizer }
          assert:
            - "Registration.${r1}.status == REFUNDED with refunded_cents == 3000 (L1->L2->L3)"
            - "Registration.${r2}.status == REFUNDED with refunded_cents == 3000"
            - "Ballot.${bal}.status == VOID (L4 caused by R1 -> REFUNDED)"
            - "zones[0].assigned_count == 0 (L4 zone release for the formerly CHECKED_IN R1)"
            - "summary.treasury_cents == 0 (6000 fees - 6000 refunds; no pro-rata scaling needed)"

      - name: sheet_submit_bubble_up_locks_sheets
        grounds:
          - state_machines.Event.JUDGING_to_TABULATING
          - state_machines.ScoreSheet.DRAFT_to_SUBMITTED
          - state_machines.ScoreSheet.SUBMITTED_to_LOCKED
        distinguishing_aspect: |
          Trigger POST /score-sheets/{id}/submit (different trigger than the weather cascade):
          depth-3 bubble-up — L1 the submit flips the last outstanding (registration x judge)
          pair, completing the class; L2 class completion flips Event JUDGING -> TABULATING;
          L3 entering TABULATING locks every SUBMITTED sheet. The first submit must NOT fire L2/L3.
        test_recipe:
          setup:
            - "Event JUDGING; judged class MUSCLE with ONE assigned judge J1; TWO CHECKED_IN registrations R1, R2; clock 12:30 inside judging window"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Bubble Up", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
