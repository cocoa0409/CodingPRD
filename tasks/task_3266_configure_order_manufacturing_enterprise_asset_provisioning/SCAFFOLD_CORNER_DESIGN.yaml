            - { call: "POST /api/orders/${sm8_o}/lines", payload: { configuration_id: "${sm8_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${sm8_a}" }
            - { call: "POST /api/orders/${sm8_o}/submit", payload: { expected_configuration_version: "${sm8_cv}" }, as: CustomerUser, as_user_id: "${sm8_a}" }
