  # =======================================================================
  # Rule 3 — non-linear state machines on three different entities
  #   instance 1 = CorrectiveActionPlan  (bounded SUBMITTED->REJECTED->SUBMITTED cycle)
  #   instance 2 = PublicReportPosting   (bounded CORRECTED self-loop + terminal lockdown)
  #   instance 3 = Provider.license_status (two different edges into FULL)
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_cap_review_cycle_bounded_at_three
        grounds:
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_REJECTED
          - state_machines.CorrectiveActionPlan.REJECTED_to_SUBMITTED
          - entities.CorrectiveActionPlan.fields.review_cycle_count
          - calculations.corrective_action_due_date
          - errors.ERR_CAP_REVIEW_CYCLE_EXHAUSTED
          - errors.ERR_INVALID_CAP_STATE
        distinguishing_aspect: |
          The CAP machine is cyclic, not linear: REJECTED returns to SUBMITTED
          via resubmit, and the loop is bounded by review_cycle_count <
          CAP_MAX_REVIEW_CYCLES with the counter starting at 1, so exactly two
          resubmits succeed and the third is refused with
          ERR_CAP_REVIEW_CYCLE_EXHAUSTED while the row stays in REJECTED.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One RA-201 SERIOUS ChecklistItem, one Inspector, one CENTER provider, one Complaint."
            - "A COMPLAINT inspection carrying one RA-201/PRESCHOOL violation, submitted CONDITIONAL_PASS and FINALIZED at 2026-08-01T00:00:00Z (submission window ends 2026-08-11T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Cedar Lane Center", county_code: "CTY-01", site_address: "4 Cedar Ln", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RATIO", affected_age_group: "PRESCHOOL", narrative: "Caller reports the preschool room is routinely over ratio.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room at 13 children to one staff member." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v1: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
              captures: { insp_ver: $.data.version }
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${insp_id}", violation_ids: ["${v1}"], narrative: "Hire two additional preschool aides.", proposed_completion_date: "2026-08-09", expected_inspection_version: "${insp_ver}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { cap: $.data.id }
          trigger:
            - call: "POST /licensing/corrective-action-plans/${cap}/review"
              payload: { decision: "REJECT", review_note: "Staffing plan lacks named hires." }
              as: LicensingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/corrective-action-plans/${cap}/resubmit"
              payload: { violation_ids: ["${v1}"], narrative: "Two named aides start 2026-08-10.", proposed_completion_date: "2026-08-11" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/corrective-action-plans/${cap}/review"
              payload: { decision: "REJECT", review_note: "No supervision schedule attached." }
              as: LicensingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/corrective-action-plans/${cap}/resubmit"
              payload: { violation_ids: ["${v1}"], narrative: "Aides plus a posted supervision schedule.", proposed_completion_date: "2026-08-13" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/corrective-action-plans/${cap}/review"
              payload: { decision: "REJECT", review_note: "Schedule still leaves the 15:00 hour uncovered." }
              as: LicensingSupervisor
            - call: "POST /licensing/corrective-action-plans/${cap}/resubmit"
              payload: { violation_ids: ["${v1}"], narrative: "Third attempt with full-day coverage.", proposed_completion_date: "2026-08-14" }
              as: Applicant
              as_user_id: "${prov}"
          assert:
            - "after creation CorrectiveActionPlan.${cap}.status == \"SUBMITTED\", review_cycle_count == 1 and due_at == \"2026-08-11T00:00:00Z\" (now + CORRECTION_DAYS[SERIOUS] 10 days)"
            - "after the first REJECT: status == \"REJECTED\", reviewed_at == \"2026-08-01T00:00:00Z\", review_cycle_count still 1"
            - "after the first resubmit: status == \"SUBMITTED\", review_cycle_count == 2, submitted_at == \"2026-08-03T00:00:00Z\", due_at recomputed to \"2026-08-13T00:00:00Z\""
            - "after the second resubmit: status == \"SUBMITTED\", review_cycle_count == 3, due_at == \"2026-08-15T00:00:00Z\""
            - "the third resubmit returns ERR_CAP_REVIEW_CYCLE_EXHAUSTED (409) because review_cycle_count 3 is not < CAP_MAX_REVIEW_CYCLES 3"
            - "after the refused resubmit CorrectiveActionPlan.${cap}.status == \"REJECTED\", review_cycle_count == 3 and version is unchanged from the value after the third REJECT"
            - "a REJECT review issued while the plan is already REJECTED returns ERR_INVALID_CAP_STATE (409)"
            - "CorrectiveActionPlan.${cap}.version incremented on each of the 5 accepted writes and on no refused one"

      - name: non_linear_posting_correction_self_loop_bounded_at_two
        grounds:
          - state_machines.PublicReportPosting.POSTED_to_CORRECTED
          - state_machines.PublicReportPosting.CORRECTED_to_CORRECTED
          - state_machines.PublicReportPosting.CORRECTED_to_WITHDRAWN
          - entities.PublicReportPosting.fields.correction_count
          - entities.PublicReportPosting.fields.expires_at
          - calculations.public_display_score
          - errors.ERR_POSTING_CORRECTION_LIMIT
          - errors.ERR_INVALID_POSTING_STATE
        distinguishing_aspect: |
          PublicReportPosting has a genuine self-loop: CORRECTED -> CORRECTED
          re-enters the same state, bumps correction_count and re-runs the
