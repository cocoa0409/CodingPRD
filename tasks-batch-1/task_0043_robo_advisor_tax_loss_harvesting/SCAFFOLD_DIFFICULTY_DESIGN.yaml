# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Robo-Advisor Tax-Loss Harvesting
# 9 rule_ids × 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls / trigger call resolves to a
# §1.5 endpoint; every ${var} is bound by an earlier captures: block.
#
# Shared bootstrap pattern used by most instances (re-derived per instance):
#   1) POST /_clock/set_current_utc to pin the clock
#   2) POST /model-portfolios  (targets sum to 100; a band [min,max] for risk_score)
#   3) POST /securities        (one or more with prices and correlation map)
#   4) POST /accounts          (client_email)
#   5) POST /questionnaires    (scores -> assigned model)
#   6) POST /questionnaires/{id}/accept  (account -> ACTIVE, version advances)
#   7) POST /tax-lots          (open lots; account.version advances each time)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fifo_vs_hifo_partial_sell_realizes_different_gain
        grounds:
          - calculations.capital_gain_realization
          - entities.TaxLot.fields.realized_gain_cents
          - entities.ModelPortfolio.fields.targets
        distinguishing_aspect: |
          On a 50/50 US_EQUITY/BOND model, an account holding only two US_EQUITY lots in X (lot A
          3sh cost 24000 acquired first; lot B 3sh cost 36000 acquired second; price 10000) is at
          100% US_EQUITY (drift 50) so a rebalance must SELL exactly 3 shares of X to reach the
          50000 US_EQUITY target. The FIFO model consumes lot A and realizes +6000; an identical
          HIFO model consumes lot B and realizes -6000 — a 12000-cent divergence on the TaxLot
          entity domain from identical holdings.
        test_recipe:
          setup:
            - "ModelPortfolio FIFO: lot_selection FIFO, band [70,100], targets US_EQUITY 50 / BOND 50, threshold 5."
            - "ACTIVE account holding two OPEN US_EQUITY lots in X (price 10000): lot A 3sh cost 24000 acquired 2026-01-10, lot B 3sh cost 36000 acquired 2026-02-10. invested 60000, US 100% -> REBALANCE_DUE (drift 50)."
            - "A planned 2026-Q1 rebalance sells 3 shares of X (down to 30000) and buys 30000 of BOND."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "FIFO model", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 50}, {asset_class: "BOND", target_pct: 50}], drift_threshold_pct: 5, lot_selection: "FIFO" }
              as: Advisor
              captures: { fifo_model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "X", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_x_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "BX", asset_class: "BOND", price_cents: 10000 }
              as: Advisor
              captures: { sec_bx_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "fifo@x.com" }
              as: Advisor
              captures: { acct_fifo_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_fifo_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_fifo_id: $.data.id }
            - call: "POST /questionnaires/${q_fifo_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_fifo_id}", security_id: "${sec_x_id}", quantity: 3, cost_basis_cents: 24000 }
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00.000Z" }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_fifo_id}", security_id: "${sec_x_id}", quantity: 3, cost_basis_cents: 36000 }
              as: Advisor
              captures: { acct_fifo_v: $.data.version }
          trigger:
            - call: "POST /rebalance-events"
              payload: { account_id: "${acct_fifo_id}", quarter_label: "2026-Q1", expected_account_version: "${acct_fifo_v}" }
              as: Advisor
              captures: { reb_fifo_id: $.data.id }
            - call: "POST /rebalance-events/${reb_fifo_id}/execute"
              payload: {}
              as: Advisor
          assert:
            - "FIFO account consumes lot A (acquired 2026-01-10): GET /tax-lots?account_id=${acct_fifo_id}&security_id=${sec_x_id}&status=CLOSED shows the CLOSED X lot with realized_gain_cents == 6000"
            - "An equivalent HIFO-model account selling 3 shares consumes lot B and realizes realized_gain_cents == -6000"
            - "FIFO_realized - HIFO_realized == 12000"

      - name: net_1099b_gain_adds_back_wash_sale_disallowance
        grounds:
          - calculations.form_1099b_totals
          - calculations.wash_sale_disallowance
          - entities.TaxForm1099B.fields.net_realized_gain_cents
          - entities.TaxForm1099B.fields.total_wash_sale_disallowed_cents
        distinguishing_aspect: |
          On the TaxForm1099B domain, the same disposed lot (proceeds 50000, basis 60000, raw
          realized -10000) yields two different "net gain" figures: the naive sum-of-deltas
          interpretation gives -10000, but the pinned formula ADDS BACK the 4000 wash-sale
          disallowance to give net_realized_gain_cents == -6000. This add-back-vs-no-add-back
          divergence is a dual interpretation distinct from the FIFO/HIFO lot-selection variant
          on TaxLot.
        test_recipe:
          setup:
            - "In 2025, an account harvested a 5sh/60000 loss lot in A (mkt 50000) with a 2sh in-window lot in A present, producing one CLOSED lot: proceeds 50000, basis 60000, wash_sale_disallowed 4000."
            - "Clock then moved to 2026; a draft 1099-B for 2025 is generated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "1099 model", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "T1", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "T2", correlation: 0.10}] }
              as: Advisor
              captures: { sec_t1_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "T2", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "T1", correlation: 0.10}] }
              as: Advisor
              captures: { sec_t2_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "f1099@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_t1_id}", quantity: 2, cost_basis_cents: 24000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_t1_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_t2_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
            - call: "POST /harvest-events/${harvest_id}/execute"
              payload: {}
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: Advisor
          trigger:
            - call: "POST /tax-forms"
              payload: { account_id: "${acct_id}", tax_year: 2025 }
              as: Advisor
              captures: { form_id: $.data.id }
          assert:
            - "TaxForm1099B.${form_id}.total_proceeds_cents == 50000 and total_cost_basis_cents == 60000"
            - "TaxForm1099B.${form_id}.total_wash_sale_disallowed_cents == 4000"
            - "TaxForm1099B.${form_id}.net_realized_gain_cents == -6000 (raw -10000 plus 4000 add-back) and line_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_single_round_then_clamp_order_pinned
        grounds:
          - calculations.risk_scoring
          - entities.RiskQuestionnaire.fields.risk_score
        distinguishing_aspect: |
          Mode (b) nested rounding order: risk_scoring sums all four weighted terms into raw
          (81.5 for horizon30/tol9/inc8/liq1) THEN rounds once to 82; rounding each term first
          (28.0+31.5+16.0-1.0) would land differently — the formula pins sum-then-round.
        test_recipe:
          setup:
            - "Clock pinned; questionnaire submitted with horizon_years 30, loss_tolerance 9, liquidity_need 1, income_band 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /accounts"
              payload: { client_email: "round@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
          assert:
            - "RiskQuestionnaire.${q_id}.risk_score == 82"
            - "RiskQuestionnaire.${q_id}.status == SCORED"

      - name: wash_sale_proration_min_and_basis_carryover
        grounds:
          - calculations.wash_sale_disallowance
          - entities.TaxLot.fields.wash_sale_disallowed_cents
          - entities.TaxLot.fields.cost_basis_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula with a nested min: disallowed = min(abs(loss),
          round_half_up(replacement_shares/closing_shares * abs(loss))) over (loss magnitude,
          in-window replacement shares, closing shares) — 2 in-window shares of 5 closing shares on
          a 10000 loss yields min(10000, 4000) = 4000, and that 4000 carries over onto the
          replacement lot's cost_basis_cents.
        test_recipe:
          setup:
            - "Account ACTIVE on a US_EQUITY model. Security A price 10000. Source lot: 5sh cost 60000 (basis 12000/sh), now a 10000 loss."
            - "A SECOND OPEN lot in the SAME security A of 2sh bought 10 days before the harvest (inside the 30-day window) is the wash-sale-triggering purchase."
            - "Replacement security B (price 4000, correlation 0.10 vs A) is bought with proceeds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "EQ model", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90, lot_selection: "FIFO" }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "AAA", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "BBB", correlation: 0.10}] }
              as: Advisor
              captures: { sec_a_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "BBB", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "AAA", correlation: 0.10}] }
              as: Advisor
              captures: { sec_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "wash@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_a_id}", quantity: 2, cost_basis_cents: 24000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_a_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_b_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
            - call: "POST /harvest-events/${harvest_id}/execute"
              payload: {}
              as: Advisor
          assert:
            - "Closed source lot wash_sale_disallowed_cents == 4000"
            - "The in-window 2-share lot's cost_basis_cents increases from 24000 to 28000 (basis carryover of 4000)"
            - "HarvestEvent.${harvest_id}.disallowed_loss_cents == 4000 and realized_loss_cents == 10000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: harvest_branch_execute_vs_reject_vs_reverse
        grounds:
          - state_machines.HarvestEvent.PROPOSED_to_EXECUTED
          - state_machines.HarvestEvent.PROPOSED_to_REJECTED
          - state_machines.HarvestEvent.EXECUTED_to_REVERSED
        distinguishing_aspect: |
          HarvestEvent is a branching fork-join with divergent side-effect sets: PROPOSED forks to
          EXECUTED (full cascade) or REJECTED (no ledger change), and EXECUTED branches again to
          REVERSED (compensation) — three terminal states reachable from PROPOSED with different
          side effects, on the HarvestEvent entity.
        test_recipe:
          setup:
            - "Account ACTIVE; a loss lot in security A; replacement security B uncorrelated."
            - "A proposed harvest exists; we reject it (no ledger change)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "EQ2", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "CCC", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "DDD", correlation: 0.05}] }
              as: Advisor
              captures: { sec_c_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "DDD", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "CCC", correlation: 0.05}] }
              as: Advisor
              captures: { sec_d_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "branch@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_c_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_d_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
          trigger:
            - call: "POST /harvest-events/${harvest_id}/reject"
              payload: {}
              as: Compliance
          assert:
            - "HarvestEvent.${harvest_id}.status == REJECTED"
            - "TaxLot.${source_lot_id}.status == OPEN (no ledger change on reject)"
            - "A second POST /harvest-events/${harvest_id}/execute returns ERR_INVALID_STATE (cannot execute a REJECTED harvest)"

      - name: account_active_rebalance_due_freeze_branch_cycle
        grounds:
          - state_machines.Account.ACTIVE_to_REBALANCE_DUE
          - state_machines.Account.REBALANCE_DUE_to_ACTIVE
          - state_machines.Account.ACTIVE_to_FROZEN
          - state_machines.Account.FROZEN_to_ACTIVE
        distinguishing_aspect: |
          The Account entity has a non-linear cycle: ACTIVE→REBALANCE_DUE (auto on drift) →ACTIVE
          (rebalance execute) plus a FROZEN side-branch ACTIVE→FROZEN→ACTIVE — distinct from the
          HarvestEvent branch machine and on a different entity.
        test_recipe:
          setup:
            - "Account ACTIVE on model US_EQUITY 60 / BOND 40, threshold 5."
            - "Open lots driving US_EQUITY to 70% so drift 10 >= 5 auto-flips status to REBALANCE_DUE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "6040", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 60}, {asset_class: "BOND", target_pct: 40}], drift_threshold_pct: 5 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "EQ", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_eq_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "BD", asset_class: "BOND", price_cents: 10000 }
              as: Advisor
              captures: { sec_bd_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "cyc@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_eq_id}", quantity: 7, cost_basis_cents: 70000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_bd_id}", quantity: 3, cost_basis_cents: 30000 }
              as: Advisor
              captures: { acct_v_after_lots: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/freeze"
              payload: {}
              as: Compliance
            - call: "POST /accounts/${acct_id}/unfreeze"
              payload: {}
              as: Compliance
          assert:
            - "After both lots open, Account.${acct_id}.max_drift_pct == 10 and status == REBALANCE_DUE"
            - "After freeze, Account.${acct_id}.status == FROZEN"
            - "After unfreeze, status returns to REBALANCE_DUE (drift still 10 >= 5), not ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: harvest_close_to_washscan_to_ytd_ledger_depth3
        grounds:
          - state_machines.HarvestEvent.PROPOSED_to_EXECUTED
          - calculations.wash_sale_disallowance
          - entities.Account.fields.wash_sale_disallowed_cents_ytd
          - entities.Account.fields.realized_gain_cents_ytd
        distinguishing_aspect: |
          Depth-3 chain from harvest execute: (L1) source lot CLOSED realizes the loss → (L2) that
          close itself triggers the wash-sale scan that sets the lot's wash_sale_disallowed_cents
          and bumps the survivor's basis → (L3) that wash-sale recompute itself updates
          Account.wash_sale_disallowed_cents_ytd and realized_gain_cents_ytd. Each link is caused
          by the previous, not by the harvest action directly.
        test_recipe:
          setup:
            - "Same wash-sale setup as wash_sale_proration: source lot 5sh/60000 in A, a 2sh in-window lot in A, replacement B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "EQ3", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "EEE", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "FFF", correlation: 0.10}] }
              as: Advisor
              captures: { sec_e_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "FFF", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "EEE", correlation: 0.10}] }
              as: Advisor
              captures: { sec_f_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "casc@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_e_id}", quantity: 2, cost_basis_cents: 24000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_e_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_f_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
          trigger:
            - call: "POST /harvest-events/${harvest_id}/execute"
              payload: {}
              as: Advisor
          assert:
            - "L1: TaxLot.${source_lot_id}.status == CLOSED with realized_gain_cents == -10000"
            - "L2: TaxLot.${source_lot_id}.wash_sale_disallowed_cents == 4000"
            - "L3: Account.${acct_id}.wash_sale_disallowed_cents_ytd == 4000 and realized_gain_cents_ytd == -6000 (-10000 + 4000 add-back)"

      - name: questionnaire_accept_supersede_then_reassign_model_depth2
        grounds:
          - state_machines.RiskQuestionnaire.ACCEPTED_to_SUPERSEDED
          - state_machines.Account.ACTIVE_to_ACTIVE
          - entities.Account.fields.model_portfolio_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (re-profile accept): (L1) accepting a new
