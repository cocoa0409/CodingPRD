  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_completion_five_link_cascade
        grounds:
          - state_machines.Withdrawal.CLEARED_to_COMPLETED
          - state_machines.Student.WITHDRAWAL_PENDING_to_WITHDRAWN
          - state_machines.CumulativeFile.NOT_STARTED_to_IN_ASSEMBLY
          - entities.RetentionSchedule.fields.exit_anchor_at
          - entities.RetentionSchedule.fields.destruction_eligible_at
          - entities.Student.fields.records_disposition_date
          - calculations.retention_destruction_eligible_at
        distinguishing_aspect: |
          Depth 5 from one POST: Withdrawal COMPLETED (1) -> Student WITHDRAWN + exit_effective_date
          (2) -> CumulativeFile NOT_STARTED -> IN_ASSEMBLY (3) -> a RetentionSchedule row is minted
          with computed anchors (4) -> Student.records_disposition_date mirrors that schedule's
          destruction_eligible_at (5). An implementation that stops at link 3 leaves the retention
          schedule absent and records_disposition_date null. The trigger is withdrawal completion,
          not legal-demand production.
        test_recipe:
          setup:
            - "CA rule with destruction_min_age_years 5; SEND01 in CA; one student with has_iep false."
            - "A withdrawal with effective_date 2026-08-14 is opened, then two holds are placed and both released so the Withdrawal is back to CLEARED with hold_count 0."
            - "No FileComponent is ever touched, so the CumulativeFile is still NOT_STARTED when the withdrawal completes and link 3 is observable."
            - "Clock at 2026-08-15T12:00:00Z when complete is called."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Hana", last_name: "Sorensen", dob: "2012-12-01", grade_level: 8, has_iep: false, guardian_user_id: "guardian-hana" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "POST /records-office/students/${student_id}/withdrawals"
              payload: { effective_date: "2026-08-14", destination_district_code: "RECV01", withdrawal_reason: "TRANSFER_OUT" }
              as: RecordsClerk
              captures: { withdrawal_id: "$.data.id" }
            - call: "POST /records-office/withdrawals/${withdrawal_id}/holds"
              payload: { hold_type: "LIBRARY_FINE" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/holds"
              payload: { hold_type: "MEAL_ACCOUNT" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/hold-releases"
              payload: { hold_type: "MEAL_ACCOUNT" }
              as: RecordsClerk
            - call: "POST /records-office/withdrawals/${withdrawal_id}/hold-releases"
              payload: { hold_type: "LIBRARY_FINE" }
              as: RecordsClerk
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /records-office/withdrawals/${withdrawal_id}/complete"
              payload: {}
              as: RecordsOfficer
              as_user_id: "officer-1"
          assert:
            - "Withdrawal.${withdrawal_id}.status == \"COMPLETED\""
            - "Withdrawal.${withdrawal_id}.hold_count == 0"
            - "Withdrawal.${withdrawal_id}.active_hold_types == []"
            - "Withdrawal.${withdrawal_id}.completed_at == \"2026-08-15T12:00:00.000Z\""
            - "Student.${student_id}.enrollment_status == \"WITHDRAWN\""
            - "Student.${student_id}.exit_effective_date == \"2026-08-14\""
            - "CumulativeFile.${file_id}.assembly_status == \"IN_ASSEMBLY\""
            - "CumulativeFile.${file_id}.completeness_pct == 0.0"
            - "GET /records-office/cumulative-files/${file_id}/retention-schedules returns exactly 1 row"
            - "that RetentionSchedule.status == \"ACTIVE\""
            - "that RetentionSchedule.exit_anchor_at == \"2026-08-14T00:00:00.000Z\""
            - "that RetentionSchedule.last_activity_at == \"2026-08-14T00:00:00.000Z\""
            - "that RetentionSchedule.destruction_min_age_years == 5"
            - "that RetentionSchedule.destruction_eligible_at == \"2031-08-14T00:00:00.000Z\""
            - "that RetentionSchedule.exit_anchored_eligible_at == \"2031-08-14T00:00:00.000Z\""
            - "Student.${student_id}.records_disposition_date == \"2031-08-14T00:00:00.000Z\""

      - name: legal_demand_production_four_link_cascade
        grounds:
          - state_machines.LegalDemand.RECEIVED_to_PRODUCED
          - entities.LegalDemand.fields.notification_waived
          - entities.LegalDemand.fields.waiver_basis
          - entities.DisclosureLogEntry.fields.disclosure_type
          - entities.RetentionSchedule.fields.last_activity_at
          - entities.Student.fields.records_disposition_date
          - calculations.retention_destruction_eligible_at
        distinguishing_aspect: |
          Depth 4 from one POST on the notification-WAIVED fork (RECEIVED -> PRODUCED, skipping
          NOTIFIED entirely): LegalDemand PRODUCED (1) -> a LEGAL_DEMAND DisclosureLogEntry is
          appended (2) -> the pre-existing RetentionSchedule's last_activity_at and
          destruction_eligible_at move to the production instant (3) ->
          Student.records_disposition_date is re-mirrored (4). Unlike the withdrawal cascade, this
          chain mutates an already-minted RetentionSchedule instead of creating one, and it starts
          from a legal demand rather than an enrollment event.
        test_recipe:
          setup:
            - "CA rule with destruction_min_age_years 5 and notification_wait_days 7; SEND01 in CA."
            - "One student withdrawn effective 2026-08-14 and completed, so a RetentionSchedule already exists with destruction_eligible_at 2031-08-14T00:00:00.000Z."
            - "Clock moved to 2026-10-02T08:30:00Z, then an EX_PARTE_ORDER demand is filed with notification_waived true and waiver_basis EX_PARTE_COURT_ORDER, so no notification is owed and production is immediately allowed."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
