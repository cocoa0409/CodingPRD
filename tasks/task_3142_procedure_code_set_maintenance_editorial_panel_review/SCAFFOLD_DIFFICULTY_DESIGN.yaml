              captures: { ter_n: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "First Southwest Clinic", vendor_worldwide: false, expected_users: 12, sales_unit_count: 6, base_fee_cents: 0, territory_id: "${ter_n}" }
              as: LicensingOfficer
              captures: { lic_n1: $.data.id }
            - call: "POST /cpt/licensing-agreements/${lic_n1}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_n1_v1: $.data.version }
          trigger:
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Second Southwest Clinic", vendor_worldwide: false, expected_users: 9, sales_unit_count: 5, base_fee_cents: 0, territory_id: "${ter_n}" }
              as: LicensingOfficer
              captures: { err7: $.data.error_id }
          assert:
            - "${err7} == ERR_TERRITORY_OCCUPIED"
            - "the returned http status is 409"
            - "the count of LicensingAgreement rows for territory ${ter_n} is 1"

  - rule_id: compensating_invariant
    instances:
      - name: errata_publish_reverse_conserves_corrected_payment
        grounds:
          - state_machines.ErrataNotice.PROPOSED_to_PUBLISHED
          - calculations.errata_proration_recalculation
          - entities.ErrataNotice.fields.corrected_facility_payment_cents
          - entities.ReviewErratum.fields.applied_status
        distinguishing_aspect: |
          The conserved quantity is the corrected payment dollars held on
          ErrataNotice.corrected_facility_payment_cents: publishing the revised
          notice followed by reversing the review leaves that figure at 1817,
          the reversal value, rather than drifting back to the 6074 published
          before the review or compounding to 2726.
        test_recipe:
          setup:
            - "One SpecialtySociety supplying national GPCIs"
            - "One DistributionTerritory on the SITE method bound to an active licence"
            - "One CodeValue 00030 with aggregated facility_payment_cents 18173 and rounding_variant AGGREGATE_ROUNDING"
            - "One LicensingAgreement of class PROVIDER on the licence"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One ErrataNotice against that code value with errata_effective_date 2027-05-03 and prior_facility_payment_cents 18173"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Lambda Society", specialty_code: "LAM", voting_seat_count: 1, gpci_work: 1.0521, gpci_pe: 1.1234, gpci_mp: 0.6980 }
              as: EditorialStaff
              captures: { soc_l: $.data.id }
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-GREATLAKES", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_r: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Great Lakes Clinic", vendor_worldwide: false, expected_users: 22, sales_unit_count: 11, base_fee_cents: 0, territory_id: "${ter_r}" }
              as: LicensingOfficer
              captures: { lic_r: $.data.id }
            - call: "POST /cpt/code-values"
              payload: { code: "00030", specialty_id: "${soc_l}", work_rvu: 2.80, facility_pe_rvu: 1.80, nonfacility_pe_rvu: 1.90, mp_rvu: 0.36, conversion_factor: 34.63, rounding_variant: "AGGREGATE_ROUNDING" }
              as: LicensingOfficer
              captures: { cv_r: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-values/${cv_r}/effective-dates"
              payload: { effective_date: "2027-01-01T00:00:00Z" }
              as: LicensingOfficer
              captures: { cv_r_v1: $.data.version }
            - call: "POST /cpt/errata-notices"
              payload: { code_value_id: "${cv_r}", errata_effective_date: "2027-05-03T00:00:00Z", prior_facility_payment_cents: 18173, reason: "Practice-expense RVU overstated" }
              as: EditorialStaff
              captures: { err_r: $.data.id }
            - call: "POST /cpt/errata-reviews"
              payload: { original_notice_id: "${err_r}", review_outcome: "REVERSED", corrected_proration_ratio: 0.25 }
              as: EditorialPanelChair
              captures: { rev_r: $.data.id }
          trigger:
            - call: "POST /cpt/errata-notices/${err_r}/publications"
              payload: {}
              as: EditorialStaff
              captures: { err_r_v1: $.data.version }
            - call: "POST /cpt/errata-reviews/${rev_r}/outcomes"
              payload: { confirmation: "REVERSAL_CONFIRMED" }
              as: EditorialPanelChair
              captures: { rev_r_v1: $.data.version }
          assert:
            - "ErrataNotice.${err_r}.status == PUBLISHED"
            - "ErrataNotice.${err_r}.corrected_facility_payment_cents == 1817"
            - "ReviewErratum.${rev_r}.applied_status == APPLIED"
            - "the sum of the pre-publication figure 6074 and the post-reversal figure 1817 equals 7891"

      - name: license_fee_gate_conserves_per_unit_helper
        grounds:
          - calculations.license_royalty_schedule
          - errors[ERR_LICENSE_FEE_BELOW_MINIMUM]
          - validations[priority=20]
          - state_machines.LicensingAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          The conserved quantity is the per-unit helper 0.9: a four-unit licence
          and a three-unit licence are priced from that same helper as 4 and 3
          cents, so the gate that rejects the below-minimum licence leaves the
          helper unchanged rather than zeroing it.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and a second on the SITE method"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-PLAINS", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
