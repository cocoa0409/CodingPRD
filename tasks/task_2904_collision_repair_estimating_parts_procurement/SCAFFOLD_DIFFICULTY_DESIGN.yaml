  - rule_id: boundary_precision_check
    instances:
      - name: consent_threshold_is_inclusive_at_exactly_50000_on_estimate_lock
        grounds:
          - calculations.authorization_posture_derivation
          - calculations.estimate_totals
          - entities.RepairOrder.fields.customer_pay_cents
          - entities.RepairOrder.fields.authorization_posture
        distinguishing_aspect: |
          Metric: customer_pay_cents against CONSENT_THRESHOLD_CENTS, on POST
          /repair-orders/{id}/estimate/lock. Two orders differing only in deductible_cents (49999 vs
          50000) land on customer_pay_cents 49999 and 50000 over identical labor, and only the second
          becomes CONSENT_REQUIRED - the comparison is >=, so exactly the threshold already blocks.
        test_recipe:
          setup:
            - "One insurer with the standard ceilings; two repair orders each with initial_authorized_cents 400000 and one BODY 4.5 h plus one FRAME 3.0 h line (labor 51000, supplies 2040, pre-tax 53040, no parts)."
            - "Order A carries deductible_cents 49999, order B carries deductible_cents 50000; nothing else differs."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mo Adler", phone: "555-0200", email: "mo@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-12", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77119A", vehicle_vin: "1HGCV1F30LA000121", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 49999 }
              as: ShopAdmin
              captures: { ro_a_id: $.data.id }
            - call: "POST /repair-orders/${ro_a_id}/teardown-findings"
