            - "CHECKPOINT 1 after the first reserve: ${a1} == 24.000, ${r1} == 24.000, ${c1} == 0.000, and 24.000 + 24.000 + 0.000 == 48.000 == received_kg"
            - "ResinCharge.${ch1}.virgin_kg == 21.600 and ResinCharge.${ch1}.charge_regrind_pct == 10.00   (2.400 / 24.000 * 100)"
            - "the second reserve is ACCEPTED because the gate is available_kg >= charge_kg and 24.000 >= 24.000 is an equality — draining the lot to exactly 0.000 is legal"
            - "CHECKPOINT 2 after the second reserve: ${a2} == 0.000, ${r2} == 48.000, ${c2} == 0.000, sum 48.000, and ${st2} == DEPLETED (the lot depletes at exactly 0.000, not at 0.001)"
            - "CHECKPOINT 3 after releasing ${ch2}: ${a3} == 24.000, ${r3} == 24.000, ${c3} == 0.000, sum 48.000 — the COMPENSATING move returned the reservation exactly, and ${st3} == AVAILABLE because available_kg rose above 0.000"
            - "${ch2_reason} == CYCLE_ABORTED   (the default released_reason when the request body omits it)"
            - "the release is sequenced BEFORE start-oven on purpose: start-oven requires every referenced ResinLot to be AVAILABLE, so a DEPLETED lot would have failed with ERR_RESIN_LOT_NOT_AVAILABLE instead of consuming"
            - "CHECKPOINT 4 after start-oven: ${a4} == 24.000, ${r4} == 0.000, ${c4} == 24.000, sum 48.000 — mass moved from reserved to consumed with nothing created or destroyed, and ${st4} == AVAILABLE"
            - "ResinCharge.${ch1}.status == CONSUMED and MoldingCycle.${cyc1}.status was OVEN_RUNNING before the abort"
            - "CHECKPOINT 5 after aborting from OVEN_RUNNING: ${a5} == 24.000, ${r5} == 0.000, ${c5} == 24.000, sum still 48.000, ${st5} == AVAILABLE — the invariant HOLDS but nothing was returned"
            - "${cyc1_status} == ABORTED and ResinCharge.${ch1}.status is still CONSUMED: consumed_kg is never decremented, so the compensating move is asymmetric — aborting from SCHEDULED would have restored the full 24.000 kg, aborting from OVEN_RUNNING restores nothing"
            - "MoldingCycle.${cyc2}.status is still SCHEDULED with no participating charge, so the abort touched only cyc1's ledger rows"

      - name: warranty_reserve_ledger_conserved_across_approve_and_void
        grounds:
          - calculations.warranty_reserve_ledger
          - calculations.warranty_payout
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_VOIDED
          - concurrency_rules[claim-approve-stale-product-model]
          - validations[priority=76]
          - errors.ERR_WARRANTY_RESERVE_EXHAUSTED
        distinguishing_aspect: |
          The conserved quantity is MONEY in integer cents held in a two-bucket ledger,
          warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents, and unlike
          the resin ledger its compensating move is an EXACT reversal: voiding an approved claim moves
          the identical integer back, restores the pre-approval headroom, and yet deliberately RETAINS
          the claim's money fields as the audit record instead of zeroing them.
        test_recipe:
          setup:
