          assert:
            - "trigger 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — MERCURY is not in {SO2, NOX_RATE, CO2, FLOW}"
            - "trigger 2 returns HTTP 422 with error_id == ERR_VALUE_OUT_OF_RANGE — op_time_fraction must be within [0, 1]"
            - "trigger 3 returns HTTP 422 with error_id == ERR_VALUE_OUT_OF_RANGE — co2_conc_pct must be within (0, 20]"
            - "trigger 4 returns HTTP 422 with error_id == ERR_VALUE_OUT_OF_RANGE — flow_scfh must be > 0"
            - "trigger 5 returns HTTP 422 with error_id == ERR_VALUE_OUT_OF_RANGE — limit_value must be > 0"
            - "no OperatingHour was created: GET /emissions/operating-hours?unit_id=${unit_id} returns total_count == 0 and QuarterlyReport.${q2_id}.version == 1"

      - name: entity_operating_hour_and_daily_calibration_carry_no_version_or_update_path
        claim_type: immutability
        grounds:
          - entities.OperatingHour
          - entities.DailyCalibration
          - endpoints[GET /emissions/operating-hours/{id}]
          - endpoints[GET /emissions/daily-calibrations/{id}]
        distinguishing_aspect: "OperatingHour and DailyCalibration are the only two entities declared with common_fields false, so their GET responses expose no version field and §1.5 declares no PATCH or DELETE for either — measurement records are appended, never edited."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED SO2 CEM holding one PASSED daily calibration and a DRAFT 2026 Q2 report with one CEMS hour"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cal_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_id: $.data.id }
          trigger:
            - call: "GET /emissions/operating-hours/${h_id}"
              payload: {}
              as: RegulatoryReviewer
            - call: "GET /emissions/daily-calibrations/${cal_id}"
              payload: {}
              as: RegulatoryReviewer
          assert:
            - "trigger 1 returns HTTP 200 with no version field on the OperatingHour body"
            - "trigger 1 body carries created_at == 2026-04-02T00:00:00Z and quarterly_report_version_after == 2"
            - "trigger 2 returns HTTP 200 with no version field on the DailyCalibration body"
            - "trigger 2 body carries calibration_error_pct == 2.00 and result == PASSED"
            - "§1.5 declares no PATCH or DELETE path for either entity, so the only mutation route for an hour is the substitution endpoint"

      - name: entity_child_create_under_an_unknown_parent_returns_the_parent_code
        claim_type: parent_relationships
        grounds:
          - validations[priority=100]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_MONITORING_SYSTEM_NOT_FOUND]
        distinguishing_aspect: "A nested create names its parent in the path, so an unknown parent id fails with the PARENT's 404 code before any body validation runs — even when the body itself is also invalid."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities/00000000-0000-4000-8000-000000000000/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000 }
              as: RegulatoryReviewer
              captures: { e_fac: $.data.error_id }
            - call: "POST /emissions/units/00000000-0000-4000-8000-000000000000/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_unit: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/00000000-0000-4000-8000-000000000000/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { e_sys: $.data.error_id }
            - call: "POST /emissions/units/00000000-0000-4000-8000-000000000000/monitoring-systems"
              payload: { parameter: "MERCURY", system_type: "CEM", span_value: 400.0 }
              as: QAAnalyst
              captures: { e_both: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 404 with error_id == ERR_FACILITY_NOT_FOUND"
            - "trigger 2 returns HTTP 404 with error_id == ERR_UNIT_NOT_FOUND"
            - "trigger 3 returns HTTP 404 with error_id == ERR_MONITORING_SYSTEM_NOT_FOUND"
            - "trigger 4 returns HTTP 404 with error_id == ERR_UNIT_NOT_FOUND, not ERR_INVALID_REQUEST — path existence at priority 100 precedes body shape at priority 90 only for path ids, and the parameter enum is never reached"
            - "no row of any entity exists afterwards: GET /emissions/units returns total_count == 0"

      - name: entity_operating_hour_associates_across_three_aggregates_at_once
        claim_type: cross_cutting_associations
        grounds:
          - entities.OperatingHour.fields.quarterly_report_id
          - entities.OperatingHour.fields.fuel_sample_id
          - validations[priority=110]
          - validations[priority=330]
          - errors[ERR_HOUR_OUTSIDE_REPORT_PERIOD]
          - errors[ERR_FUEL_SAMPLE_NOT_FOUND]
        distinguishing_aspect: "The hybrid topology is exercised on one row: an OperatingHour resolves a unit from the path, a report from its (year, quarter) and a FuelSample by body FK, and a mismatch on any of the three is refused with that association's own error."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "units U1 and U2 in one facility; U1 has a CERTIFIED CO2 EXCEPTED_APPENDIX_D system and a DRAFT 2026 Q2 report"
            - "FuelSample A is ANALYZED on U1; FuelSample Z is ANALYZED on U2"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u1_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U2", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u2_id: $.data.id }
            - call: "POST /emissions/units/${u1_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "EXCEPTED_APPENDIX_D", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { appd_id: $.data.id, appd_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${appd_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${appd_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 18.0, span_measured_value: 18.1 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${appd_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${u1_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-A" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_a: $.data.id }
            - call: "POST /emissions/fuel-samples/${fs_a}/analysis"
              payload: { outcome: "ANALYZED", gcv_btu_per_lb: 12500.0, sulfur_content_pct: 0.85, analysis_method: "ASTM_D5865" }
              as: QAAnalyst
            - call: "POST /emissions/units/${u2_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-Z" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_z: $.data.id }
            - call: "POST /emissions/fuel-samples/${fs_z}/analysis"
              payload: { outcome: "ANALYZED", gcv_btu_per_lb: 12500.0, sulfur_content_pct: 0.85, analysis_method: "ASTM_D5865" }
              as: QAAnalyst
            - call: "POST /emissions/units/${u1_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${u1_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-07-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_quarter: $.data.error_id }
            - call: "POST /emissions/units/${u1_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:30:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_half_hour: $.data.error_id }
            - call: "POST /emissions/units/${u1_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_z}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_foreign_sample: $.data.error_id }
            - call: "POST /emissions/units/${u1_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_HOUR_OUTSIDE_REPORT_PERIOD — 2026-07-01 belongs to Q3 and no report exists for it"
            - "trigger 2 returns HTTP 422 with error_id == ERR_HOUR_OUTSIDE_REPORT_PERIOD — hour_begin_utc must land exactly on the hour"
            - "trigger 3 returns HTTP 404 with error_id == ERR_FUEL_SAMPLE_NOT_FOUND — sample Z belongs to U2, so it is not visible from U1's create path"
            - "trigger 4 returns HTTP 201 with OperatingHour.${h_id}.unit_id == ${u1_id}, quarterly_report_id == ${q2_id} and fuel_sample_id == ${fs_a}"
            - "OperatingHour.${h_id}.heat_input_mmbtu == 562.500 and so2_mass_lbs == 765.0 — all three associations resolved to the same row"
            - "QuarterlyReport.${q2_id}.version == 2 after trigger 4; the three rejected triggers left it at 1"

      - name: entity_report_totals_are_computed_never_supplied
        claim_type: computed_fields
        grounds:
          - entities.QuarterlyReport.fields.total_so2_lbs
          - calculations.quarterly_report_totals
        excluded_because:
          difficulty_instance: invariant_hour_classification_partition_and_heat_input_survive_flip_and_substitution
          rationale: "That instance reads every computed count and total of the report at three checkpoints (876.6 / 292.2 / 1115.6 lbs against a constant 1666.668 mmBtu) and no endpoint accepts them as input, so computed-field correctness is asserted there."

  # ===========================================================================
  # From Table 2 (State Machines)
