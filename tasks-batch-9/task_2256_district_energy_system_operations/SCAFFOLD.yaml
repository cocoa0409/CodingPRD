        side_effects: ["sets PipeSegment.condition = UNDER_REPAIR", "increments PipeSegment.version by 1"]
      - from: MONITORED
        to: UNDER_REPAIR
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/begin-excavation"
        actor: system
        preconditions: ["PipeSegment.condition == MONITORED"]
        side_effects: ["sets PipeSegment.condition = UNDER_REPAIR", "increments PipeSegment.version by 1"]
      - from: SUSPECT
        to: UNDER_REPAIR
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/begin-excavation"
        actor: system
        preconditions: ["PipeSegment.condition == SUSPECT"]
        side_effects: ["sets PipeSegment.condition = UNDER_REPAIR", "decrements NetworkLoop.suspect_segment_count by 1", "increments PipeSegment.version by 1", "increments NetworkLoop.version by 1"]
      - from: UNDER_REPAIR
        to: SOUND
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/complete"
        actor: system
        preconditions: ["PipeSegment.condition == UNDER_REPAIR", "recomputed leak_risk_score < MONITORED_SCORE_FLOOR"]
        side_effects: ["sets PipeSegment.makeup_water_ratio = 0.0", "increments PipeSegment.historical_leak_count by 1 when WorkOrder.work_type == LEAK_REPAIR", "recomputes PipeSegment.leak_risk_score", "sets PipeSegment.condition = SOUND", "increments PipeSegment.version by 1"]
      - from: UNDER_REPAIR
        to: MONITORED
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/complete"
        actor: system
        preconditions: ["PipeSegment.condition == UNDER_REPAIR", "recomputed leak_risk_score >= MONITORED_SCORE_FLOOR and < SUSPECT_SCORE_FLOOR"]
        side_effects: ["sets PipeSegment.makeup_water_ratio = 0.0", "increments PipeSegment.historical_leak_count by 1 when WorkOrder.work_type == LEAK_REPAIR", "recomputes PipeSegment.leak_risk_score", "sets PipeSegment.condition = MONITORED", "increments PipeSegment.version by 1"]
      - from: UNDER_REPAIR
        to: SUSPECT
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/complete"
        actor: system
        preconditions: ["PipeSegment.condition == UNDER_REPAIR", "recomputed leak_risk_score >= SUSPECT_SCORE_FLOOR"]
        side_effects: ["sets PipeSegment.makeup_water_ratio = 0.0", "increments PipeSegment.historical_leak_count by 1 when WorkOrder.work_type == LEAK_REPAIR", "recomputes PipeSegment.leak_risk_score", "sets PipeSegment.condition = SUSPECT", "increments NetworkLoop.suspect_segment_count by 1", "increments PipeSegment.version by 1", "increments NetworkLoop.version by 1"]

  - entity: FuelSupplyContract
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=SUSPENDED"
        actor: SystemController
        preconditions: ["FuelSupplyContract.status == ACTIVE"]
        side_effects: ["sets FuelSupplyContract.status = SUSPENDED", "cascades every ProductionAsset whose fuel_contract_id == this contract and availability_state == AVAILABLE to DERATED", "cascades every DispatchPlan on the affected assets' loops whose plan_state == APPROVED to DRAFT", "cascades affected NetworkLoop.posture NORMAL to CONSTRAINED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=ACTIVE"
        actor: SystemController
        preconditions: ["FuelSupplyContract.status == SUSPENDED"]
        side_effects: ["sets FuelSupplyContract.status = ACTIVE", "cascades every ProductionAsset whose fuel_contract_id == this contract and availability_state == DERATED to AVAILABLE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=EXPIRED"
        actor: SystemController
        preconditions: ["FuelSupplyContract.status == ACTIVE"]
        side_effects: ["sets FuelSupplyContract.status = EXPIRED", "cascades every ProductionAsset whose fuel_contract_id == this contract to OUTAGE"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=EXPIRED"
        actor: SystemController
        preconditions: ["FuelSupplyContract.status == SUSPENDED"]
        side_effects: ["sets FuelSupplyContract.status = EXPIRED", "cascades every ProductionAsset whose fuel_contract_id == this contract to OUTAGE"]

  - entity: ProductionAsset
    initial_state: AVAILABLE
