  - rule_id: boundary_precision_check
    instances:

      - name: audit_risk_score_blocks_at_exactly_seventy_and_passes_at_sixty_nine
        grounds:
          - calculations.fraud_risk_score
          - validations[priority=92]
          - errors[ERR_FRAUD_RISK_BLOCKED]
          - state_machines.Redemption.PENDING_to_FAILED
          - entities.Redemption.fields.audit_risk_score
          - entities.Redemption.fields.risk_block_reason
        distinguishing_aspect: |
          The metric under test is audit_risk_score against FRAUD_BLOCK_THRESHOLD 70 on the
          endpoint POST /perks/redemptions/{id}/verify: a gross of 150000 scores exactly 70
          (15 LEAVE + 40 capped velocity + 15 amount) and is refused, while 149999 scores 69
          because amount_points floors to 14, and is accepted.
