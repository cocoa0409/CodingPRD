  - { method: GET, path: "/awards", description: "Filtered list of awards", roles: [CommitteeAdmin, AgencyReviewer, Judge, Entrant], code: 200, input: ["limit?", "offset?", "parade_id?", "winner_entry_id?", "status?"], output: "Award[]", side_effects: [] }
  - { method: GET, path: "/awards/{id}", description: "Get one award", roles: [CommitteeAdmin, AgencyReviewer, Judge, Entrant], code: 200, input: [], output: Award, side_effects: [] }
  - { method: POST, path: "/awards/{id}/announce", description: "PENDING -> ANNOUNCED; resolves winner via deterministic selector over FINALIZED scores", roles: [CommitteeAdmin], code: 200, input: [], output: Award, side_effects: ["winner_entry_id set", "announced_at set"] }
  - { method: POST, path: "/awards/{id}/present", description: "ANNOUNCED -> PRESENTED", roles: [CommitteeAdmin], code: 200, input: [], output: Award, side_effects: [] }
  - { method: POST, path: "/awards/{id}/cancel", description: "PENDING -> CANCELLED", roles: [CommitteeAdmin], code: 200, input: [], output: Award, side_effects: [] }

  # --- SponsorPackage ---
  - { method: POST, path: "/parades/{id}/sponsors", description: "Register a sponsor package", roles: [CommitteeAdmin], code: 201, input: [sponsor_name, tier, contribution_cents], output: SponsorPackage, side_effects: [] }
  - { method: GET, path: "/parades/{id}/sponsors", description: "List sponsors of a parade", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: ["limit?", "offset?", "status?"], output: "SponsorPackage[]", side_effects: [] }
  - { method: GET, path: "/sponsors/{id}", description: "Get one sponsor incl. allocated_seconds", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: SponsorPackage, side_effects: [] }
  - { method: POST, path: "/sponsors/{id}/activate", description: "PLEDGED -> ACTIVE", roles: [CommitteeAdmin], code: 200, input: [], output: SponsorPackage, side_effects: [] }

  # --- AnnouncerScriptItem ---
  - { method: POST, path: "/parades/{id}/script-items", description: "Add a script item; SPONSOR_READ requires ACTIVE sponsor_id, ENTRY_INTRO requires entry_id", roles: [CommitteeAdmin], code: 201, input: [item_type, sequence_index, duration_minutes, "sponsor_id?", "entry_id?"], output: AnnouncerScriptItem, side_effects: ["duration_seconds computed via per-item rounding"] }
  - { method: GET, path: "/parades/{id}/script-items", description: "List script items of a parade", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: ["limit?", "offset?", "status?", "item_type?"], output: "AnnouncerScriptItem[]", side_effects: [] }
  - { method: GET, path: "/script-items", description: "Filtered list of script items", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: ["limit?", "offset?", "parade_id?", "sponsor_id?", "entry_id?", "status?"], output: "AnnouncerScriptItem[]", side_effects: [] }
  - { method: GET, path: "/script-items/{id}", description: "Get one script item", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: AnnouncerScriptItem, side_effects: [] }
  - { method: POST, path: "/script-items/{id}/approve", description: "DRAFT -> APPROVED; recomputes sponsor/parade allocated seconds for SPONSOR_READ", roles: [CommitteeAdmin], code: 200, input: [], output: AnnouncerScriptItem, side_effects: ["allocated_seconds recompute"] }
  - { method: POST, path: "/script-items/{id}/reopen", description: "APPROVED -> DRAFT before lineup publication", roles: [CommitteeAdmin], code: 200, input: [], output: AnnouncerScriptItem, side_effects: ["allocated_seconds recompute"] }
  - { method: POST, path: "/script-items/{id}/cancel", description: "DRAFT|APPROVED -> CANCELLED", roles: [CommitteeAdmin], code: 200, input: [], output: AnnouncerScriptItem, side_effects: ["allocated_seconds recompute"] }
  - { method: POST, path: "/parades/{id}/finalize-script", description: "Verify every ACTIVE sponsor meets its tier minimum seconds; sets script_finalized", roles: [CommitteeAdmin], code: 200, input: [], output: ParadeEvent, side_effects: ["script_finalized = true"] }

  # --- DispersalPlan ---
  - { method: POST, path: "/parades/{id}/dispersal-plan", description: "Create the parade's emergency lane & dispersal plan (at most one)", roles: [CommitteeAdmin], code: 201, input: [emergency_lane_width_m, dispersal_corridors, "evacuation_notes?"], output: DispersalPlan, side_effects: [] }
  - { method: GET, path: "/parades/{id}/dispersal-plan", description: "Fetch the dispersal plan of a parade (array of 0-1)", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: "DispersalPlan[]", side_effects: [] }
  - { method: GET, path: "/dispersal-plans/{id}", description: "Get one dispersal plan", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: DispersalPlan, side_effects: [] }
  - { method: POST, path: "/dispersal-plans/{id}/submit", description: "DRAFT -> SUBMITTED; enforces emergency lane width >= 3.0", roles: [CommitteeAdmin], code: 200, input: [], output: DispersalPlan, side_effects: [] }
  - { method: POST, path: "/dispersal-plans/{id}/approve", description: "SUBMITTED -> APPROVED; posture recompute", roles: [AgencyReviewer], code: 200, input: [], output: DispersalPlan, side_effects: ["posture recompute"] }
  - { method: POST, path: "/dispersal-plans/{id}/reject", description: "SUBMITTED -> REJECTED; posture recompute", roles: [AgencyReviewer], code: 200, input: [], output: DispersalPlan, side_effects: ["posture recompute"] }
  - { method: POST, path: "/dispersal-plans/{id}/revise", description: "REJECTED -> DRAFT (revision cycle)", roles: [CommitteeAdmin], code: 200, input: [], output: DispersalPlan, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [CommitteeAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or ownership check failed (applicant/marshal/judge id mismatch)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request body schema violation: missing required field, bad enum, bad range, violated conditional FK (sponsor_id/entry_id by item_type), checklist_score on wrong side of 70" }
  - { id: ERR_PARADE_NOT_FOUND, http: 404, condition: "No ParadeEvent with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No PermitApplication with the given id" }
  - { id: ERR_ENDORSEMENT_NOT_FOUND, http: 404, condition: "No AgencyEndorsement with the given id" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "No EntryApplication with the given id" }
  - { id: ERR_FLOAT_NOT_FOUND, http: 404, condition: "No Float with the given id" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "No SafetyInspection with the given id" }
  - { id: ERR_STAGING_AREA_NOT_FOUND, http: 404, condition: "No StagingArea with the given id" }
  - { id: ERR_ROUTE_SEGMENT_NOT_FOUND, http: 404, condition: "No RouteSegment with the given id" }
  - { id: ERR_LINEUP_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No LineupAssignment with the given id" }
  - { id: ERR_MARSHAL_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No MarshalAssignment with the given id" }
  - { id: ERR_SCORE_SHEET_NOT_FOUND, http: 404, condition: "No JudgingScoreSheet with the given id" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "No Award with the given id" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "No SponsorPackage with the given id" }
  - { id: ERR_SCRIPT_ITEM_NOT_FOUND, http: 404, condition: "No AnnouncerScriptItem with the given id" }
  - { id: ERR_DISPERSAL_PLAN_NOT_FOUND, http: 404, condition: "No DispersalPlan with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. publish with no active lineup, complete with non-terminal lineup, second permit/plan creation, SPONSOR_READ referencing a non-ACTIVE sponsor)" }
  - { id: ERR_EVENT_FROZEN, http: 409, condition: "ParadeEvent.posture == FROZEN blocks the mutation" }
  - { id: ERR_ENTRY_NOT_APPROVED, http: 409, condition: "Lineup confirm requires EntryApplication.status == APPROVED" }
  - { id: ERR_PERMIT_NOT_GRANTED, http: 409, condition: "Lock requires the permit in GRANTED (parade PERMIT_GRANTED with posture OPERATIONAL)" }
  - { id: ERR_LINEUP_NOT_PUBLISHED, http: 409, condition: "Check-in and award announce require ParadeEvent.status == LINEUP_PUBLISHED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_parade_version or expected_permit_version does not equal the parent's current version" }
  - { id: ERR_PERMIT_ALREADY_EXISTS, http: 409, condition: "A PermitApplication already exists for the parade" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "A DispersalPlan already exists for the parade" }
  - { id: ERR_DUPLICATE_AGENCY_ENDORSEMENT, http: 409, condition: "An endorsement with status in {PENDING, ENDORSED} already exists for this (permit, agency_type)" }
  - { id: ERR_DUPLICATE_SCORE_SHEET, http: 409, condition: "A score sheet already exists for this (entry, judge)" }
  - { id: ERR_LINEUP_POSITION_TAKEN, http: 409, condition: "position_number held by another active assignment of the parade" }
  - { id: ERR_CATEGORY_WITHOUT_FLOAT, http: 422, condition: "Float registration requires the entry APPROVED with assigned_category in {FLOAT, VEHICLE}" }
  - { id: ERR_STAGING_CAPACITY_FULL, http: 422, condition: "Confirm would exceed staging capacity: reserved_slots >= capacity" }
  - { id: ERR_WINDOW_OUTSIDE_STAGING_HOURS, http: 422, condition: "[arrive_at, depart_at] not contained in staging area [open_time, close_time]" }
  - { id: ERR_FLOAT_UNCERTIFIED, http: 422, condition: "Confirm requires every Float of the entry to be CERTIFIED" }
  - { id: ERR_REINSPECTION_SOD, http: 422, condition: "Segregation of duties: re-inspection inspector must differ from the inspector of the float's latest FAILED inspection" }
  - { id: ERR_EMERGENCY_LANE_TOO_NARROW, http: 422, condition: "DispersalPlan.emergency_lane_width_m < 3.0 at submit" }
  - { id: ERR_STAGING_WINDOW_CONFLICT, http: 409, condition: "Expanded closed staging window intersects another CONFIRMED|CHECKED_IN assignment on the same staging area" }
  - { id: ERR_MARSHAL_WINDOW_OVERLAP, http: 409, condition: "Half-open shift overlaps another ASSIGNED|CONFIRMED shift of the same marshal" }
  - { id: ERR_ENTRY_DEADLINE_PASSED, http: 422, condition: "Entry creation after parade entry_deadline (logical clock)" }
  - { id: ERR_CHECKIN_WINDOW_NOT_OPEN, http: 422, condition: "Check-in outside [arrive_at, depart_at]; no-show before depart_at; marshal complete before shift_end" }
  - { id: ERR_ENTRY_FEE_OUTSTANDING, http: 402, condition: "Confirm requires fee_paid == true" }
  - { id: ERR_SPONSOR_MINUTES_UNMET, http: 422, condition: "finalize-script: an ACTIVE sponsor has allocated_seconds < TIER_MIN_SECONDS[tier]" }
  - { id: ERR_NO_ELIGIBLE_WINNER, http: 422, condition: "Award announce found no APPROVED entry of the eligible category with a FINALIZED score sheet" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommitteeAdmin
    description: "Parade organizing committee administrator; drives the parade, review, lineup, script, and award lifecycle"
    identity: opaque
    exclusive_operations: ["parade lifecycle (submit-permit, lock, publish-lineup, complete, cancel)", "route/staging/sponsor/script/award/lineup creation and actions", "entry review actions (start-review, approve, reject, request-revision)", "score-sheet finalize", "logical clock control"]
    shared_operations: ["read access to all resources"]
  - name: AgencyReviewer
    description: "External agency officer (police/fire/transit/sanitation) deciding endorsements, permit outcomes, and dispersal approval"
    identity: opaque
    exclusive_operations: ["endorse/reject endorsements", "grant/deny/revoke permits", "approve/reject dispersal plans"]
    shared_operations: ["read access to parade-scoped resources"]
  - name: SafetyInspector
    description: "Certified float/vehicle inspector; schedules and records inspections; cannot re-inspect a float whose latest FAILED inspection they recorded"
    identity: opaque
    exclusive_operations: ["schedule inspection", "pass/fail/cancel inspection"]
    shared_operations: ["read floats and inspections"]
  - name: Entrant
    description: "Representative of a marching organization; owns its EntryApplications via applicant_user_id"
    identity: opaque
    exclusive_operations: ["create entry application", "resubmit own entry", "withdraw own entry", "pay own entry fee", "register floats for own entry"]
    shared_operations: ["read parades, entries, staging areas, lineup assignments"]
  - name: Judge
    description: "Panel judge; owns its JudgingScoreSheets via judge_user_id"
    identity: opaque
    exclusive_operations: ["create score sheet", "submit own sheet", "reopen own sheet"]
    shared_operations: ["read entries, awards, score sheets"]
  - name: Marshal
    description: "Route volunteer; owns its MarshalAssignments via marshal_user_id"
    identity: opaque
    exclusive_operations: ["confirm own marshal assignment", "complete own marshal assignment"]
    shared_operations: ["read route segments and marshal assignments"]
