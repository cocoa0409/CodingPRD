              as: AssetCurator
            - call: "POST /rights/assets/${a_cert}/diligence-logs"
              payload: { search_channel: PERFORMING_RIGHTS_ORG, outcome: NO_RESULT, notes: "l2" }
              as: AssetCurator
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/assets/${a_cert}/diligence-logs"
              payload: { search_channel: DIRECT_OUTREACH, outcome: NO_RESULT, notes: "l3" }
              as: AssetCurator
            - call: "POST /rights/assets"
              payload: { title: "Pend Orphan", work_kind: STILL_IMAGE, permitted_media: [PRINT] }
              as: AssetCurator
              captures: { a_pend: "$.data.id" }
            - call: "POST /rights/assets/${a_pend}/diligence-logs"
              payload: { search_channel: COPYRIGHT_OFFICE, outcome: NO_RESULT, notes: "only one" }
              as: AssetCurator
            - call: "POST /rights/assets/${a_cert}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-10-01T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_c_16
              captures: { r_cert: "$.data.id", r_cert_v: "$.data.version" }
            - call: "POST /rights/assets/${a_pend}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-10-01T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_c_16
              captures: { r_pend: "$.data.id", r_pend_v: "$.data.version" }
          trigger:
            - call: "POST /rights/clearance-requests/${r_pend}/advance"
              payload: { expected_clearance_version: "${r_pend_v}" }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
            - call: "POST /rights/clearance-requests/${r_cert}/advance"
              payload: { expected_clearance_version: "${r_cert_v}" }
              as: ClearanceOfficer
              captures: { r_cert_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r_cert}/advance"
              payload: { expected_clearance_version: "${r_cert_v2}" }
              as: ClearanceOfficer
              captures: { r_cert_status: "$.data.status" }
          assert:
            - "err == ERR_ORPHAN_DILIGENCE_INCOMPLETE  (advance from SUBMITTED blocked while DILIGENCE_PENDING)"
            - "r_cert_status == NEGOTIATING  (ORPHAN_CERTIFIED with null holder passes both gates)"

      - name: world_territory_superset_overlap_blocks_grant
        claim_type: correct_result
        grounds: [calculations.territory_weight, calculations.license_overlap]
        distinguishing_aspect: "An ACTIVE NA license blocks a new WORLD grant on the same asset+media (WORLD ⊇ NA via territory_contains), and an ACTIVE WORLD license blocks a new APAC grant."
        test_recipe:
          setup: ["License L1 ACTIVE: STREAMING/NA [2026-08-10, 2027-08-10); request R2 WORLD approved; request R3 APAC approved against L1 after L1 replaced... see chain: single L1 NA, R2 WORLD grant attempt fails"]
