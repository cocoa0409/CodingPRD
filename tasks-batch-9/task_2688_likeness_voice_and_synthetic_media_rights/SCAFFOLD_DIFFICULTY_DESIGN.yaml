# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: likeness-rights-clearance (task 2688)
# Nine §0.5 difficulty rules, 22 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup chain runs from an empty database using
# only endpoints declared in §1.5; every numeric assert is a pre-computed literal.
# The logical clock starts at 2026-08-01T00:00:00Z unless an instance moves it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: per_use_royalty_provisional_versus_final_divergence
        grounds:
          - calculations.per_use_compensation
          - entities.GeneratedPerformance.fields.provisional_compensation_cents
          - entities.UsageLicense.fields.per_use_final_cents
          - entities.CompensationEntry.fields.entry_type
        distinguishing_aspect: >-
          The PROVISIONAL variant reads GeneratedPerformance.projected_impressions (6000000, reach
          tier 2 -> 1.40) while the FINAL variant reads UsageLicense.actual_impressions (12000000,
          reach tier 3 -> 1.90) over the identical base fee, media type and territory set, so the
          same performance yields 346500 provisionally and 470250 finally — a 123750 delta that
          both survive in the ledger because issuance does not reverse the provisional accrual.
        test_recipe:
          setup:
            - "CA law profile and the 2026-07-01 SAG_AFTRA/ADVERTISING union row (minimum_initial 300000, minimum_per_use 150000) exist"
            - "Living CA/SAG talent with an ACTIVE non-exclusive ADVERTISING grant over US and MX, initial fee 300000, per-use base 150000"
            - "One VOICE_SAMPLE asset, one APPROVED_FOR_USE voice replica, one APPROVED performance projecting 6000000 impressions across US and MX"
            - "Clock left at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US", "MX"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
              captures: { r_v: $.data.version }
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northwind Ads", media_type: "ADVERTISING", territory_codes: ["US", "MX"], intended_use_description: "30 second radio spot", projected_impressions: 6000000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p_id: $.data.id, p_prov: $.data.provisional_compensation_cents }
            - call: "POST /generated-performances/${p_id}/review"
              payload: { decision: "APPROVE", review_note: "sounds right" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p_id}", channel: "ADVERTISING", territory_codes: ["US", "MX"], distribution_start: "2026-09-01T00:00:00Z", distribution_end: "2027-06-01T00:00:00Z", actual_impressions: 12000000, expected_replica_version: "${r_v}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { l_id: $.data.id }
          assert:
            - "GeneratedPerformance.${p_id}.provisional_compensation_cents == 346500"
            - "UsageLicense.${l_id}.per_use_final_cents == 470250"
            - "UsageLicense.${l_id}.per_use_final_cents - GeneratedPerformance.${p_id}.provisional_compensation_cents == 123750"
            - "GET /compensation-entries?consent_grant_id=${g_id} returns exactly 3 entries with entry_type INITIAL_CREATION (300000), PER_USE_PROVISIONAL (346500) and PER_USE_FINAL (470250)"
            - "ConsentGrant.${g_id}.total_compensation_cents == 1116750"
            - "GeneratedPerformance.${p_id}.provisional_compensation_cents is unchanged by issuance (no REVERSAL entry exists)"

      - name: postmortem_expiry_domicile_versus_use_state_divergence
        grounds:
          - calculations.postmortem_rights_expiry
          - entities.Talent.fields.postmortem_rights_until
          - entities.InfringementCase.fields.use_state_rights_until
          - entities.InfringementCase.fields.enforceable_under_use_state
          - validations[priority=58]
        distinguishing_aspect: >-
          For one deceased talent the DOMICILE_LAW variant resolves CA's 70-year term to
          2090-03-15T00:00:00Z (rights alive) while the USE_STATE_LAW variant resolves TX's
          zero-year term to null (nothing to enforce), so Talent.postmortem_rights_until and
          InfringementCase.enforceable_under_use_state disagree on the same instant and the
          takedown is refused with ERR_POSTMORTEM_RIGHTS_EXPIRED.
        test_recipe:
          setup:
            - "CA law profile (70 post-mortem years) and TX law profile (0 post-mortem years) both exist"
            - "One CA-domiciled talent whose death was recorded with date_of_death 2020-03-15T00:00:00Z"
            - "No consent grants, so the talent's rights_posture stays CLEAR"
            - "One MONITORING_FEED case opened on a use detected in TX with match_confidence 0.500 and 400000 views"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /state-law-profiles"
              payload: { state_code: "TX", postmortem_rights_years: 0, postmortem_requires_registration: false, biometric_retention_max_days: 90, deletion_grace_days: 10, removal_window_days: 21, disclosure_required_advertising: false, disclosure_required_entertainment: false, min_disclosure_rank_advertising: 1, min_disclosure_rank_entertainment: 1 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Marguerite Vale", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /talents/${t_id}/death-record"
              payload: { date_of_death: "2020-03-15T00:00:00Z" }
              as: RightsAdministrator
              captures: { pm_until: $.data.postmortem_rights_until }
          trigger:
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://example.tx/clip-99", detected_channel: "ADVERTISING", detected_state_code: "TX", detected_view_count: 400000, match_confidence: 0.5 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "Talent.${t_id}.postmortem_rights_until == 2090-03-15T00:00:00Z"
            - "InfringementCase.${c_id}.use_state_rights_until == null"
            - "InfringementCase.${c_id}.enforceable_under_use_state == false"
            - "InfringementCase.${c_id}.severity_score == 0.3550"
            - "the triage call returns 422 with error_id ERR_POSTMORTEM_RIGHTS_EXPIRED"
            - "InfringementCase.${c_id}.status == DETECTED (unchanged) and takedown_issued_at == null"

  - rule_id: combinatorial_formula
    instances:
      - name: initial_creation_single_rounding_of_composed_product
        grounds:
          - calculations.initial_creation_compensation
          - entities.ConsentGrant.fields.initial_compensation_cents
          - entities.ConsentGrant.fields.union_topup_cents
        distinguishing_aspect: >-
          Mode (a) — rounding position. The three scope factors (breadth 1.15, duration 1.25,
          exclusivity 1.35) are composed into one product and rounded exactly once, giving
          123457 * 1.940625 = 239583.740625 -> 239584; rounding after each factor instead yields
          141976 -> 177470 -> 239585, so the two policies differ by one cent on the same inputs.
          A non-union talent is used so the union floor cannot mask the difference.
        test_recipe:
          setup:
            - "CA law profile exists"
            - "One living CA talent with union_code NONE, so union_code_snapshot is null and the floor is 0"
            - "One EXCLUSIVE grant over ADVERTISING and EPISODIC, term 2026-08-01 -> 2029-08-01 (36 months), initial fee 123457"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ines Okafor", domicile_state_code: "CA", union_code: "NONE" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING", "EPISODIC"], permitted_use_notes: "Exclusive three-year replica licence", territory_codes: ["US", "MX"], exclusivity: "EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2029-08-01T00:00:00Z", initial_creation_fee_cents: 123457, per_use_base_fee_cents: 90000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
          assert:
            - "ConsentGrant.${g_id}.initial_compensation_cents == 239584"
            - "ConsentGrant.${g_id}.initial_compensation_cents != 239585 (the per-factor rounding answer)"
            - "ConsentGrant.${g_id}.union_topup_cents == 0"
            - "ConsentGrant.${g_id}.total_compensation_cents == 239584"
            - "GET /compensation-entries?consent_grant_id=${g_id} returns exactly 1 entry, entry_type INITIAL_CREATION, amount_cents 239584, talent_share_cents 179688, agency_share_cents 47917, administrator_share_cents 11979"

      - name: royalty_split_per_participant_rounding_with_signed_remainder
        grounds:
          - calculations.royalty_share_split
          - entities.CompensationEntry.fields.talent_share_cents
          - entities.CompensationEntry.fields.agency_share_cents
          - entities.CompensationEntry.fields.administrator_share_cents
        distinguishing_aspect: >-
          Mode (b) — allocation and remainder placement. Each of the three shares of 470250 is
          rounded independently (352687.5 -> 352688, 94050, 23512.5 -> 23513), the three rounded
          shares over-allocate by exactly one cent, and the signed remainder of -1 is swept into
          the talent share, giving 352687 / 94050 / 23513. A single-rounding-of-the-total policy
          would leave the shares summing to 470251.
        test_recipe:
          setup:
            - "CA law profile and the 2026-07-01 SAG_AFTRA/ADVERTISING union row exist"
            - "Living CA/SAG talent with an ACTIVE grant at the default 0.75 / 0.20 / 0.05 split, per-use base 150000"
            - "One APPROVED performance over US and MX, and a license about to be issued for 12000000 actual impressions across US and MX"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US", "MX"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
