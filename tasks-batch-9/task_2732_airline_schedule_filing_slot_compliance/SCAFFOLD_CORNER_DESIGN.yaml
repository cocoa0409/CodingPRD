      - name: a_dispatch_after_the_notify_deadline_needs_a_regulator_reference
        claim_type: temporal_window
        grounds:
          - "validations.priority_76_ERR_LATE_NOTIFICATION_UNREFERENCED"
          - entities.PassengerNotificationObligation.fields.late_dispatch
        distinguishing_aspect: |
          The rule is conditional on the logical clock: the identical dispatch payload that would have
          been accepted before notify_deadline_utc is refused with ERR_LATE_NOTIFICATION_UNREFERENCED
          (422) after it, and is accepted once regulator_reference is supplied — at which point
          late_dispatch flips to true. An implementation that always demands the reference fails the
          normal path; one that never demands it fails here.
