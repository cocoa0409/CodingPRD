              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "PF-SYS", name: "Propagation Flight System", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 2 }
              as: MpiAdmin
              captures: { sys_s8_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s8_id}", mrn: "S8-1000", last_name: "Castellanos", first_name: "Mateo", dob: "1994-03-27", sex: "M", ssn_last4: "9494", postal_code: "35203", phone: "2055550101", clinical_element_count: 6 }
              as: IdentityAnalyst
              captures: { rec_s8a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s8_id}", mrn: "S8-2000", last_name: "Castellanos", first_name: "Mateo", dob: "1994-03-27", sex: "M", ssn_last4: "9494", postal_code: "35203", phone: "2055550101", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_s8b_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
