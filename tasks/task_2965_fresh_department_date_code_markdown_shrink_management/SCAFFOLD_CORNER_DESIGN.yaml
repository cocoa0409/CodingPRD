            - "data.shrink_units == 2 (SAMPLING excluded)"
            - "data.shrink_rate_pct == 8.33"
            - "data.open_units == 18"
            - "data.recommended_order_units == 37 (round_half_up(20.00 * 3 * (1 - 8.33 / 100)) minus 18 open units, computed as round_half_up(55.002 - 18))"
