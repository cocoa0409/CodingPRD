            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "PHL", metro_name: "Philadelphia", country_code: "US", radius_miles: 100, exclusivity_window_days: 30, territory_rank: 2 }
              as: TourManager
              captures: { m2: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${m1}", venue_name: "MSG", capacity: 2000, base_rent_cents: 500000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { v1: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${m2}", venue_name: "WellsFargo", capacity: 1800, base_rent_cents: 400000, curfew_local_time: "23:00", available_dates: ["2026-09-15"] }
              as: TourManager
              captures: { v2: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            # S1 — NYC 2026-08-01, CONFIRMED
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${m1}", venue_id: "${v1}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 8000 }
              as: TourManager
              captures: { s1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1500000, versus_pct: 80 }
              as: Promoter
              captures: { h1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds/${h1}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s1}/confirm"
              payload: { expected_tour_version: "${tv1}" }
              as: TourManager
            # S2 — PHL 2026-08-15 (within 30d of S1 → radius conflict), venue not available
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${m2}", venue_id: "${v2}", show_date: "2026-08-15", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 8000 }
              as: TourManager
              captures: { s2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1500000, versus_pct: 80 }
              as: Promoter
              captures: { h2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds/${h2}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${s2}/confirm"
              payload: { expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VENUE_UNAVAILABLE (priority 8 business_temporal beats priority 10 business_safety)"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: on_sale_lead_exactly_14_days_passes
        grounds:
          - calculations.on_sale_lead_check
          - errors[ERR_ON_SALE_LEAD_VIOLATED]
        distinguishing_aspect: |
          Boundary on on_sale_lead (days): exactly MIN_ON_SALE_LEAD_DAYS=14 passes
          (>=, not >), 13 days fails. Metric is the on-sale lead interval; reached
          via POST /tours/{id}/shows/{sid}/confirm.
        test_recipe:
          setup:
            - "Show S_pass: show_date=2026-08-01, on_sale_at=2026-07-18T00:00:00Z (exactly 14 days)"
            - "Show S_fail: show_date=2026-08-02, on_sale_at=2026-07-20T00:00:00Z (13 days)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TBnd1", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "HOU", metro_name: "Houston", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Toyota", capacity: 1500, base_rent_cents: 200000, curfew_local_time: "23:00", available_dates: ["2026-08-01", "2026-08-02"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            # Pass case
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-01", on_sale_at: "2026-07-18T00:00:00Z", avg_ticket_price_cents: 8000 }
              as: TourManager
              captures: { s_pass: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s_pass}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1000000, versus_pct: 80 }
              as: Promoter
              captures: { h_pass: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s_pass}/holds/${h_pass}/accept"
              payload: {}
              as: Promoter
            # Fail case
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-02", on_sale_at: "2026-07-20T00:00:00Z", avg_ticket_price_cents: 8000 }
              as: TourManager
              captures: { s_fail: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s_fail}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1000000, versus_pct: 80 }
              as: Promoter
              captures: { h_fail: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s_fail}/holds/${h_fail}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${s_pass}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
              captures: { pass_status: $.data.status }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s_fail}/confirm"
              payload: { expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { fail_err: $.data.error_id }
          assert:
            - "pass_status == CONFIRMED (14 days exactly satisfies >=14)"
            - "fail_err == ERR_ON_SALE_LEAD_VIOLATED (13 days < 14)"

      - name: crew_rest_at_exactly_480_minutes
        grounds:
          - calculations.routing_leg_drive_time
          - entities.RoutingLeg.fields.crew_rest_required
        distinguishing_aspect: |
          Boundary on drive_minutes (integer minutes): exactly
          MAX_DRIVE_MINUTES_BEFORE_REST=480 → crew_rest_required=false
          (strictly >, not >=); 481 → true. Different metric (drive time, not
          lead days); different endpoint (POST /routing-legs).
        test_recipe:
          setup:
            - "Leg A: drive_miles chosen so drive_minutes = exactly 480"
            - "  drive_minutes = round(miles * 60 / 55) = 480 → miles = 440"
            - "Leg B: drive_miles = 441 → round(441*60/55) = round(481.09) = 481"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
