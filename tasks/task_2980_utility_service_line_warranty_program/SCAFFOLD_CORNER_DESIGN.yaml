      - name: cc_idempotency_is_undeclared_so_replays_are_new_rows_or_business_refusals
        claim_type: idempotency
        grounds:
          - response_envelope
          - endpoints[POST /premises]
          - endpoints[POST /enrollments]
          - endpoints[POST /campaigns/{campaignId}/submission]
          - endpoints[POST /claims/{claimId}/triage-decision]
          - endpoints[POST /operations/nightly-run]
          - errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]
          - errors[ERR_INVALID_CAMPAIGN_STATE]
          - errors[ERR_INVALID_CLAIM_STATE]
        distinguishing_aspect: "No idempotency key exists anywhere in §1.0 or §1.5, so replay protection is purely a business property: an identical POST /premises creates a second independent row, an identical POST /enrollments is refused by the duplicate rule, a replayed state transition is refused by its state gate, and the batch is naturally idempotent because a second run at the same clock finds nothing left to do."
        test_recipe:
          setup:
            - "An ACTIVE partner with one AVAILABLE product and one premises; the clock starts at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "August water drop", piece_type: "POSTCARD", drop_date: "2026-08-01", requested_quantity: 1000 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "August water drop", piece_type: "POSTCARD", drop_date: "2026-08-01", requested_quantity: 1000 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_twin: $.data.id, twin_version: $.data.version, twin_status: $.data.status }
            - call: "GET /campaigns?partner_id=${partner_id}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_total: $.data.total_count }
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "First submission." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { submit_status: $.data.status, submit_version: $.data.version }
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "First submission." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { e_resubmit: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "GET /premises/${premises_id}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_v_after: $.data.version }
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v_after}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { e_duplicate: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { run1_activated: $.data.activated_enrollment_ids, run1_ran_at: $.data.ran_at }
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { run2_activated: $.data.activated_enrollment_ids, run2_ran_at: $.data.ran_at }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { coverage_after_two_runs: $.data.coverage_status, version_after_two_runs: $.data.version }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Wet patch above the service line." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "DENY", coverage_note: "The failed section lies past the ownership boundary.", denial_reason: "NOT_COVERED_SEGMENT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { triage_status: $.data.status, triage_version: $.data.version }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "DENY", coverage_note: "The failed section lies past the ownership boundary.", denial_reason: "NOT_COVERED_SEGMENT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_retriage: $.data.error_id }
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_status_final: $.data.status, claim_version_final: $.data.version }
          assert:
            - "${campaign_twin} != ${campaign_id} with ${twin_version} == 1, ${twin_status} == DRAFT and ${campaign_total} == 2  # §1.0/§1.5 GAP: no Idempotency-Key header or request-id dedupe is declared anywhere, so a byte-identical create is simply a second row (POST /premises could not show this because §1.1 declares street_address unique per partner)"
            - "${submit_status} == PARTNER_REVIEW and ${submit_version} == 2"
            - "${e_resubmit} == ERR_INVALID_CAMPAIGN_STATE with HTTP 409  # the replayed transition is refused by the state gate, not by a dedupe key"
            - "${premises_v_after} == 2  # the accepted enrollment bumped the premises, so the replay must carry version 2 for the duplicate rule to be what refuses it"
            - "${e_duplicate} == ERR_DUPLICATE_ACTIVE_ENROLLMENT with HTTP 409  # priority 60; had the replay reused version 1 the priority-10 ERR_STALE_PREMISES_VERSION would have masked it"
            - "${run1_activated} == [${enrollment_id}] and ${run2_activated} == []  # the batch is idempotent by construction: the second run at the same clock finds no PENDING_WAITING_PERIOD enrollment left"
            - "${run1_ran_at} == 2026-09-10T08:00:00.000Z and ${run2_ran_at} == 2026-09-10T08:00:00.000Z"
            - "${coverage_after_two_runs} == ACTIVE and ${version_after_two_runs} == 2  # the second run bumped nothing"
            - "${triage_status} == DENIED and ${triage_version} == 2"
            - "${e_retriage} == ERR_INVALID_CLAIM_STATE with HTTP 409"
            - "${claim_status_final} == DENIED and ${claim_version_final} == 2  # the replayed triage left the claim exactly as the first one did"

      - name: cc_derived_field_reconciliation_across_the_cash_ledger_and_the_partner_counter
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Enrollment.premium_collected_cents
          - entities.Enrollment.premium_refunded_cents
          - entities.UtilityPartner.enrolled_premises_count
          - entities.Premises.suppression_reason
          - endpoints[POST /enrollments/{enrollmentId}/billing-events]
          - calculations.cancellation_refund_proration
        distinguishing_aspect: "Each derived field is reconciled against its own declared source set rather than against 'all cash movement': a WRITE_OFF appends a CASH row that raises premium_refunded_cents while leaving premium_collected_cents untouched, a MISSED_PAYMENT moves the billing dimension while writing no row at all, enrolled_premises_count counts premises rather than enrollments and drops back when coverage leaves the live set, and Premises.suppression_reason stays NONE after an enrollment because ACTIVE_ENROLLMENT is campaign-scoped."
        test_recipe:
          setup:
            - "An ACTIVE partner with one AVAILABLE product and two premises; premises 1 takes a DIRECT_BILL enrollment and premises 2 a BILL_INSERT enrollment, both on 2026-08-05 and both activated at 2026-09-10T08:00:00.000Z."
