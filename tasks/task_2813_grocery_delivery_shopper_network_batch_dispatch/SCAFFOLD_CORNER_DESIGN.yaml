            - "${cat} == 460 (rhu(400 * 1.15)) and ${pay} == ESTIMATE_AUTHORIZED"
            - "${offered} == ${s1} and ${st} == CLAIMED - the Shopper's exclusive claim is honoured on the batch offered to it"
            - "${credit} == 500 and GET /customers/${c1} reports credit_balance_cents 500"

      - name: a_role_cannot_perform_another_roles_exclusive_write
