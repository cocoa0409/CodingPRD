          assert:
            - "complaint A is reportable true after a HIGH malfunction triage; deciding a CORRECTION moves it to FIELD_ACTION_DECIDED"
            - "closing A while reported_at is null returns HTTP 409 ERR_MALFUNCTION_REPORT_PENDING — the gate is conditional on reportable being true"
            - "filing the malfunction report from FIELD_ACTION_DECIDED is accepted, and the close then succeeds with status CLOSED, so the two branches join in either order"
            - "complaint B is reportable false after a MEDIUM non-malfunction triage; a REMOVAL decision returns HTTP 409 ERR_FIELD_ACTION_NOT_JUSTIFIED because REMOVAL demands severity HIGH"
