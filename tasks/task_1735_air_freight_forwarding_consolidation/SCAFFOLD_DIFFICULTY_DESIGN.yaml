            - "C (0.5 kg over the exact fill) is rejected: captured ${err} == ERR_CAPACITY_EXCEEDED"
            - "HouseWaybill.${hwc}.status == CLEARED and mawb_id == null after the rejection"

      - name: claim_deadline_exact_boundary
        grounds:
