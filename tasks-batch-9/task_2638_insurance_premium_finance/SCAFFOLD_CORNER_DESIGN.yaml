            - call: "POST /agreements"
              payload: { insured_id: "${xr_insured}", producer_agent_id: "${xr_agent}", state_rule_id: "${xr_rule}", down_payment_cents: 200000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { xr_agr: "$.data.id", xr_agr_pc0: "$.data.policy_count" }
            - call: "POST /agreements"
              payload: { insured_id: "${xr_insured}", producer_agent_id: "${xr_agent}", state_rule_id: "${xr_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
