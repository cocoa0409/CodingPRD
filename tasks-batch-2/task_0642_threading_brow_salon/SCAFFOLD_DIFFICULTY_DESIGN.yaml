  - name: estimate_evaluation_order_pinned_credit_before_discount
    grounds:
    - calculations.finalize_settlement
    - entities.ServiceVisit.fields.final_total_cents
    distinguishing_aspect: 'Mode (c) — circular-looking dependency resolved by a PINNED evaluation order: the discount base

