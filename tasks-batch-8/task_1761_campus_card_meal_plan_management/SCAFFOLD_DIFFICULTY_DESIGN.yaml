  - rule_id: non_linear_state_machine
    instances:
      - name: campus_card_parallel_dimensions_with_freeze_cycle
        grounds:
          - state_machines.CampusCard.lifecycle_status
          - state_machines.CampusCard.photo_status
          - entities.CampusCard.fields.is_provisional
        distinguishing_aspect: |
          CampusCard carries TWO independent state dimensions (lifecycle_status x photo_status)
          plus a cycle ACTIVE -> LOST_FROZEN -> ACTIVE: the card can be ACTIVE while its photo
          is still NOT_SUBMITTED (provisional), and photo approval mutates is_provisional without
          touching lifecycle_status. Distinct entity from the settlement cycle instance.
        test_recipe:
          setup:
            - "Holder U4001 with card c issued (PENDING_PHOTO / NOT_SUBMITTED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U4001", full_name: "Fay Staff", email: "fay@x.edu", holder_type: "STAFF", housing_status: "OFF_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_id: "$.data.id", c_lc0: "$.data.lifecycle_status", c_ps0: "$.data.photo_status" }
          trigger:
            - call: "POST /api/cards/${c_id}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
              captures: { c_lc1: "$.data.lifecycle_status", c_ps1: "$.data.photo_status", c_prov1: "$.data.is_provisional" }
            - call: "POST /api/cards/${c_id}/photos"
              payload: { image_ref: "img://fay" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - call: "GET /api/cards/${c_id}"
              payload: {}
              as: CardOfficeAdmin
              captures: { c_lc2: "$.data.lifecycle_status", c_ps2: "$.data.photo_status" }
            - call: "POST /api/photos/${photo_id}/review"
              payload: { decision: "APPROVED" }
              as: CardOfficeAdmin
            - call: "GET /api/cards/${c_id}"
              payload: {}
              as: CardOfficeAdmin
              captures: { c_lc3: "$.data.lifecycle_status", c_ps3: "$.data.photo_status", c_prov3: "$.data.is_provisional" }
            - call: "POST /api/cards/${c_id}/report-lost"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { c_lc4: "$.data.lifecycle_status" }
            - call: "POST /api/cards/${c_id}/unfreeze"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { c_lc5: "$.data.lifecycle_status", c_ps5: "$.data.photo_status" }
          assert:
            - "At issuance: lifecycle_status == PENDING_PHOTO and photo_status == NOT_SUBMITTED"
            - "After provisional activation: lifecycle_status == ACTIVE, photo_status == NOT_SUBMITTED, is_provisional == true (dimensions independent)"
            - "After photo submit: lifecycle_status still == ACTIVE, photo_status == PENDING_REVIEW"
            - "After approval: lifecycle_status still == ACTIVE, photo_status == APPROVED, is_provisional == false"
            - "After report-lost: lifecycle_status == LOST_FROZEN; after unfreeze: lifecycle_status == ACTIVE (cycle) with photo_status unchanged APPROVED"

      - name: settlement_rejection_resubmission_cycle
        grounds:
          - state_machines.MerchantSettlement.REJECTED_to_SUBMITTED
          - state_machines.MerchantSettlement.DRAFT_to_SUBMITTED
          - calculations.merchant_settlement_sweep
        distinguishing_aspect: |
          MerchantSettlement is a cyclic machine (DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED):
          resubmission re-runs the sweep and recomputes gross/commission over the re-eligible
          transaction set, which has grown between rejection and resubmission. Distinct entity
          from the CampusCard parallel-dimension instance.
        test_recipe:
          setup:
            - "Term SETT26C; ACTIVE merchant MCYC (PER_TRANSACTION, 275 bps); holder with verified card, CAMPUS_CASH funded 10000"
            - "One 999-cent merchant transaction at 2026-09-05; settlement S over 2026-09-01..2026-09-30 submitted (gross 999)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "SETT26C", name: "Settle C", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
