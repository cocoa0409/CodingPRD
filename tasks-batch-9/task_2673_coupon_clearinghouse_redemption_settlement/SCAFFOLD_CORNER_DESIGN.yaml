      - name: retailer_watchlist_then_admin_suspend_reinstate_restores_base_tier
        claim_type: valid_transition
        grounds:
          - state_machines.Retailer.transitions.ACTIVE_to_WATCHLIST
          - state_machines.Retailer.transitions.ACTIVE_to_SUSPENDED[trigger=suspend]
          - state_machines.Retailer.transitions.SUSPENDED_to_ACTIVE
          - calculations.retailer_fraud_score
        distinguishing_aspect: |
          Walks the operator arm of the Retailer machine end to end:
          fraud-rescore drives ACTIVE -> WATCHLIST and overwrites
          handling_fee_tier with PROBATION, the admin suspend from WATCHLIST
          leaves the tier at PROBATION (it only moves status), and only
