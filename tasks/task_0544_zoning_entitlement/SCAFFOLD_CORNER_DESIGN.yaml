              as: Admin
              captures: { a_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Other B", email: "ob@x.com" }
              as: Admin
              captures: { b_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "VARIANCE", parcel_id: "${parcel_id}", applicant_id: "${a_id}", requested_use: "x" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 403"
            - "$.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: commissioner_equals_planner_returns_segregation
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "A Commissioner whose X-User-ID equals the application's assigned_planner_user_id deciding the item -> ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["A VARIANCE application SCHEDULED; assigned_planner_user_id = 'shared-1'; Commissioner acts as 'shared-1'."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "R-3", zoning_district: "RES", area_acres: 2, neighbor_parcel_count: 4, expanded_neighbor_count: 8, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
