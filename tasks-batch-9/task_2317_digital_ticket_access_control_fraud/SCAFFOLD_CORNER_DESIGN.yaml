              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { seed_b: $.data.barcode_seed }
          trigger:
            - call: "POST /scan-sessions/${s1_id}/offline-batch"
              payload:
                scans:
                  - { presented_barcode: "${seed_a}-18", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "B1", scanned_at: "2026-09-12T18:09:00Z" }
                  - { presented_barcode: "${seed_a}-18", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "B2", scanned_at: "2026-09-12T18:09:10Z" }
                  - { presented_barcode: "${seed_b}-18", device_fingerprint: "DEV-BOB", direction: "IN", dedupe_key: "B3", scanned_at: "2026-09-12T18:09:20Z" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { acc: $.data.accepted_count, dup: $.data.duplicate_suppressed_count, den: $.data.denied_count, ids: $.data.scan_event_ids }
            - call: "GET /scan-sessions/${s1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s_status: $.data.status, s_up: $.data.offline_uploaded_count, s_dup: $.data.duplicate_suppressed_count, s_online: $.data.online_scan_count }
            - call: "GET /events/${ev_id}/occupancy"
              as: GateOperator
              as_user_id: "gate-op-1"
