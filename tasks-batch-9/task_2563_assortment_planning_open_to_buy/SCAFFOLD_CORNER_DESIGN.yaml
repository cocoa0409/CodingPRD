            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${mv0}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc1: $.data.id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${mv0}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc2: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc1}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc1_status: $.data.commit_status }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${mv0}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { e_stale_month: $.data.error_id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { mv1: $.data.version, open1: $.data.otb_open_cents }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${mv1}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc3: $.data.id, rc3_status: $.data.commit_status }
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { pv0: $.data.version, ratio0: $.data.open_ratio_bps }
            - call: "POST /otb/receipt-commitments/${rc2}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc2_status: $.data.commit_status }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "stale plan version", expected_category_plan_version: "${pv0}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_stale_plan: $.data.error_id }
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { pv1: $.data.version, ratio1: $.data.open_ratio_bps, status1: $.data.status, round1: $.data.reforecast_round }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "fresh plan version", expected_category_plan_version: "${pv1}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { cyc_id: $.data.id, cyc_status: $.data.status, cyc_round: $.data.round_index }
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { status2: $.data.status, round2: $.data.reforecast_round }
          assert:
            - "${open0} == 18200000 at ${mv0}, and both ${rc1} and ${rc2} are created against that SAME captured version: a PROPOSED commitment consumes no budget and does not bump PlanMonth.version"
            - "${rc1_status} == COMMITTED, and that write is what advances the month: ${mv1} == ${mv0} + 1 with ${open1} == 17160000"
            - "${e_stale_month} == ERR_STALE_PLAN_MONTH_VERSION with HTTP 412 for the third create replaying ${mv0} - the payload is byte-identical to the two that succeeded, so only the version is at fault"
            - "${rc3_status} == PROPOSED after re-reading ${mv1}: the identical request succeeds once the client refreshes, so 412 is a retryable staleness signal and not a permanent rejection"
            - "GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count 3 (rc1, rc2, rc3): the rejected create persisted nothing"
            - "${ratio0} == 9741 at ${pv0}, then ${rc2_status} == COMMITTED drives ${ratio1} == 9482 (round_half_up(10000 * (16,120,000 + 21,970,000) / 40,170,000)) and ${pv1} > ${pv0}"
            - "${e_stale_plan} == ERR_STALE_CATEGORY_PLAN_VERSION with HTTP 412 - a DIFFERENT code from the month rule, on a different parent entity and a different guard field"
            - "${status1} == APPROVED and ${round1} == 0 after the 412: the refused reforecast created no cycle and did not advance the round counter"
            - "${cyc_status} == OPEN with ${cyc_round} == 1 once ${pv1} is supplied, and ${status2} == REFORECAST_OPEN with ${round2} == 1"
            - "no 412 in this instance is decided by request timing or by any retry counter; both are pure comparisons of the submitted expected version against the stored one"

      - name: approval_cascade_runs_five_links_in_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CategoryPlan.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: approve_cascade_budget_to_size_allocation
          rationale: "The §1.8 instance walks cascade-B end to end across five links and pins the ordering sensitivity (each link consumes the field the previous link wrote), and cancel_cascade_release_to_deferred_restore covers the four-link release path plus the FROZEN partial-abort case."

      - name: planned_and_projected_bases_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.plan_month_open_to_buy.variants
        excluded_because:
          difficulty_instance: otb_basis_divergence_planned_vs_projected
          rationale: "Both variants and the exact delta on the basis switch are pinned there, and sell_through_basis_divergence_new_vs_carryover covers the second dual-variant calculation."

      - name: month_dollars_reconcile_with_their_commitments
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.plan_month_open_to_buy
        excluded_because:
          difficulty_instance: plan_month_otb_dollar_conservation
          rationale: "The conservation identity otb_open + otb_committed + otb_received == otb_planned is verified there after create, commit, partial receipt, full receipt and cancel, which is exactly the derived-field-reconciliation claim across the source's whole lifecycle."

  # === 9. From Consistency Model ===
  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.item_sell_through_forecast
          - calculations.plan_month_open_to_buy
        distinguishing_aspect: "The declared model is immediate, so no derived value is ever allowed to lag: the adopt response itself already carries sell_through_bps 7455, sell_through_basis CARRYOVER_PRIOR and planned_units 276, and the commit response's month effects are visible on the very next read with no second call, no polling and no background settle. An eventually-consistent implementation would return nulls or pre-cascade values in the action response and only converge on a later read - here the action response and the immediate re-read must be field-for-field identical."
        test_recipe:
          setup:
            - "an APPROVED plan with M1 LOCKED_PLAN at otb_planned 18,200,000, a SLOTTED option plan with target_units_per_option 276, and one CARRYOVER item with prior_season_sell_through_bps 7100"
