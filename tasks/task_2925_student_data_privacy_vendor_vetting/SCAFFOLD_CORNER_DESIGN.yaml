      - name: shared_read_operations_work_for_the_teacher_role
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles.Teacher.shared_operations
          - endpoints[GET /catalog-entries]
          - endpoints[GET /applications]
          - endpoints[GET /teachers/{teacherId}]
        distinguishing_aspect: |
          The Teacher role is deliberately not read-blind: the catalog, the application
          registry, a vendor row and its own teacher row are all readable (200 with a
          well-formed paginated envelope), while the telemetry surface is not. An
          implementation that locks Teachers out of GET /catalog-entries makes the published
          catalog unusable by the people it is published for.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V with Application A and Teacher T exist; no catalog entry has been published yet."
