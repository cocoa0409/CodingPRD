              captures: { lic_a: $.data.id }
            - call: "POST /licensees"
              payload: { name: "Cobalt Analytics", licensee_class: "DEVELOPER", tier: "BRONZE", granted_units: 1000, biometric_entitled: false }
              as: LeagueDataOps
              as_user_id: "ops-01"
