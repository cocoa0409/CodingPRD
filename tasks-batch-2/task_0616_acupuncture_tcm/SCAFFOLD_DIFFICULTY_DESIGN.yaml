            - "Dispense create response error_id == ERR_PLAN_NOT_ACTIVE, HTTP 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_cleanup_buffer
        grounds:
          - validations[priority=12]
          - calculations.room_practitioner_availability
          - entities.TreatmentRoom.fields.cleanup_buffer_minutes
        distinguishing_aspect: |
          Room interval semantics: existing appointment occupies [start, end + cleanup_buffer); a new booking
          whose start falls inside the buffer tail (after the appointment's end but before end+buffer) is
          rejected with ERR_ROOM_CONFLICT. Buffer-extended occupancy — distinct from the practitioner gap rule.
        test_recipe:
          setup:
            - "Room with cleanup_buffer_minutes 30. Two patients each with ACTIVE plan and finalized intake."
            - "First appointment 10:00-10:45 (room busy until 11:15 incl. buffer)."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr A", license_number: "LIC-15" }
              as: ClinicAdmin
              captures: { pracA: $.data.id }
            - call: "POST /practitioners"
              payload: { full_name: "Dr B", license_number: "LIC-15B" }
              as: ClinicAdmin
              captures: { pracB: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Buffer Room", cleanup_buffer_minutes: 30 }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "RA Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { p1: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${p1}", chief_complaint: "pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${pracA}"
              captures: { i1: $.data.id }
            - call: "POST /intakes/${i1}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${pracA}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p1}", practitioner_id: "${pracA}", intake_id: "${i1}", acupoints: ["LI4"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${pracA}"
              captures: { pl1: $.data.id, pl1v: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${p1}", treatment_plan_id: "${pl1}", practitioner_id: "${pracA}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${pl1v}" }
              as: ClinicAdmin
              captures: { ap1: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "RB Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { p2: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${p2}", chief_complaint: "pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${pracB}"
              captures: { i2: $.data.id }
            - call: "POST /intakes/${i2}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${pracB}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p2}", practitioner_id: "${pracB}", intake_id: "${i2}", acupoints: ["ST36"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${pracB}"
              captures: { pl2: $.data.id, pl2v: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${p2}", treatment_plan_id: "${pl2}", practitioner_id: "${pracB}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-10T11:00:00Z", scheduled_end: "2026-06-10T11:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${pl2v}" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Second booking at 11:00 (inside 10:45-11:15 cleanup buffer of same room) error_id == ERR_ROOM_CONFLICT, HTTP 409"

      - name: practitioner_gap_below_turnover_buffer
        grounds:
          - validations[priority=13]
          - calculations.room_practitioner_availability
          - entities.Practitioner.fields.turnover_buffer_minutes
        distinguishing_aspect: |
          Practitioner interval semantics (distinct from room buffer): a symmetric turnover gap — two
          appointments on the same practitioner conflict when their gap is strictly < turnover_buffer, even in
          DIFFERENT rooms. A 0-minute gap (adjacent) with a 15-min buffer is rejected; a >=15-min gap is fine.
        test_recipe:
          setup:
            - "Practitioner turnover_buffer 15 min. Two rooms so room conflict cannot mask the practitioner rule."
            - "Patient with ACTIVE plan; first appt 10:00-10:45 in room1; second appt 10:45-11:30 in room2 (gap 0 < 15)."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Busy", license_number: "LIC-16", turnover_buffer_minutes: 15 }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room K1", cleanup_buffer_minutes: 0 }
              as: ClinicAdmin
              captures: { room1: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room K2", cleanup_buffer_minutes: 0 }
              as: ClinicAdmin
              captures: { room2: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "PG Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["LI4"], planned_sessions: 4 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room1}", charge_source: "PER_VISIT", scheduled_start: "2026-06-11T10:00:00Z", scheduled_end: "2026-06-11T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { ap1: $.data.id }
            - call: "GET /treatment-plans/${pl_id}"
              payload: {}
              as: ClinicAdmin
              captures: { plvA: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room2}", charge_source: "PER_VISIT", scheduled_start: "2026-06-11T10:45:00Z", scheduled_end: "2026-06-11T11:30:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plvA}" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Second booking (gap 0 < 15-min turnover, different room) error_id == ERR_PRACTITIONER_CONFLICT, HTTP 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: package_credits_conserved_book_then_cancel
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - calculations.package_credit_balance
          - entities.PackageSeries.fields.total_credits
          - entities.PackageSeries.fields.reserved_credits
        distinguishing_aspect: |
          Conserved quantity = credit COUNT: across book (reserve) then cancel (release), the invariant
          total_credits == reserved_credits + consumed_credits + provisional_remaining_credits holds exactly,
          and provisional returns to its pre-booking value with zero drift.
        test_recipe:
          setup:
            - "Patient, finalized intake, ACTIVE plan, 5-credit package (provisional 5 at start)."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-17" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room L" }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cons Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["LI4"], planned_sessions: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /package-series"
              payload: { patient_id: "${pt_id}", total_credits: 5, price_paid_cents: 45000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", package_series_id: "${pkg_id}", charge_source: "PACKAGE", scheduled_start: "2026-06-12T09:00:00Z", scheduled_end: "2026-06-12T09:45:00Z", base_fee_cents: 0, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /appointments/${a1}/cancel"
              payload: {}
              as: ClinicAdmin
              captures: { cs: $.data.clinical_status }
            - call: "GET /package-series/${pkg_id}"
              payload: {}
              as: ClinicAdmin
              captures: { res: $.data.reserved_credits, prov: $.data.provisional_remaining_credits }
          assert:
            - "After booking: reserved_credits == 1, provisional_remaining_credits == 4"
            - "After cancel: reserved_credits == 0, consumed_credits == 0, provisional_remaining_credits == 5"
            - "Invariant holds: total_credits (5) == reserved_credits (0) + consumed_credits (0) + provisional_remaining_credits (5)"

      - name: inventory_mass_conserved_fill_then_reverse
        grounds:
          - state_machines.FormulaDispense.REQUESTED_to_FILLED
          - state_machines.FormulaDispense.FILLED_to_REVERSED
          - calculations.inventory_deduction
          - entities.HerbItem.fields.initial_grams
          - entities.HerbItem.fields.on_hand_grams
        distinguishing_aspect: |
          Conserved quantity = inventory MASS in grams (distinct from credit count): across fill (debit) then
          reverse (restore), on_hand_grams returns exactly to initial_grams with zero drift, and stock_status
          reverts LOW_STOCK->IN_STOCK.
        test_recipe:
          setup:
            - "Herb H initial 500g, threshold 400g. Formula H @ 120g/dose. Patient, finalized intake, ACTIVE plan, REQUESTED dispense (1 dose), then FILLED."
          setup_api_calls:
            - call: "POST /herb-items"
              payload: { herb_name: "Huang Qi", initial_grams: 500, reorder_threshold_grams: 400 }
              as: Pharmacist
              captures: { h_id: $.data.id }
            - call: "POST /formulas"
              payload: { formula_name: "Tonify", line_items: [ { herb_item_id: "${h_id}", grams_per_dose: 120 } ] }
              as: Pharmacist
              captures: { f_id: $.data.id }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-18" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Inv Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "fatigue", tongue_finding: "PALE", tongue_coating: "THIN_WHITE", pulse_finding: "THREADY", tcm_pattern: "BLOOD_DEFICIENCY" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["ST36"], planned_sessions: 4 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /dispenses"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", herbal_formula_id: "${f_id}", doses: 1, expected_treatment_plan_version: "${plv0}" }
              as: Pharmacist
              captures: { d_id: $.data.id }
            - call: "POST /dispenses/${d_id}/fill"
              payload: {}
              as: Pharmacist
              captures: { dvFilled: $.data.version }
          trigger:
            - call: "POST /dispenses/${d_id}/reverse"
              payload: { expected_formula_dispense_version: "${dvFilled}" }
              as: Pharmacist
              captures: { dst: $.data.status }
            - call: "GET /herb-items/${h_id}"
              payload: {}
              as: Pharmacist
              captures: { oh: $.data.on_hand_grams, ss: $.data.stock_status }
          assert:
            - "After fill: HerbItem.${h_id}.on_hand_grams == 380, stock_status == LOW_STOCK"
            - "After reverse: HerbItem.${h_id}.on_hand_grams == 500 (== initial_grams, zero drift), stock_status == IN_STOCK"
            - "FormulaDispense.${d_id}.status == REVERSED"
