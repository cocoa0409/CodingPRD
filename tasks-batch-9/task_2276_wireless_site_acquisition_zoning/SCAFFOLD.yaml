scenario: "2276. Wireless Site Acquisition & Zoning (wireless carrier site development): search ring definition from radio frequency design with coverage and capacity objectives, candidate identification across towers, rooftops and raw land with landlord outreach, lease negotiation with rent, escalation, term, renewal options and equipment expansion rights, zoning application with variance or conditional use requirements, visual simulations and public hearings, structural analysis for loading with modification design when capacity is insufficient, environmental and historic review requirements with tribal consultation where applicable, construction permitting, utility and fiber backhaul coordination, on-air milestone tracking with schedule risk from jurisdictional review timelines"
domain_name: "wireless-site-acquisition-zoning"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  # Candidate carries two independent state dimensions (acquisition_status x
  # feasibility_status); LeaseAgreement, ZoningApplication and ModificationDesign
  # are cyclic (negotiation / incompleteness / peer-review loops);
  # EnvironmentalReview is a fork-join over two review branches.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SearchRing
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: RF search ring label
      - name: market_code
        type: string
        source: input
        description: market the ring belongs to; jurisdiction and landlord market_code must match this value
      - name: center_lat
        type: number
        source: input
        description: ring center latitude
      - name: center_lon
        type: number
        source: input
        description: ring center longitude
      - name: radius_m
        type: integer
        source: input
        description: ring radius in meters; denominator of the distance component of rf_qualification_score
        constraints: ">= 100"
      - name: required_agl_m
        type: integer
        source: input
        description: antenna centerline height above ground level required by the RF design
        constraints: ">= 10"
      - name: objective_type
        type: enum
        source: input
        description: RF design objective driving the scoring weights
        constraints: "COVERAGE | CAPACITY | COVERAGE_AND_CAPACITY"
      - name: target_rsrp_dbm
        type: number
        source: input
        description: target reference signal received power in dBm (negative)
      - name: target_capacity_gbps
        type: number
        source: input
        description: backhaul capacity objective in Gbps
        constraints: "> 0"
      - name: market_benchmark_monthly_rent_usd
        type: number
        source: input
        description: market benchmark monthly ground rent; denominator of LeaseAgreement.rent_variance_pct
        constraints: "> 0"
      - name: capex_budget_usd
        type: number
        source: input
        description: capital budget ceiling compared against committed_capex_usd
        constraints: ">= 0"
      - name: priority_rank
        type: integer
        source: input
        description: RF program priority (1 = highest)
      - name: status
        type: enum
        source: system
        description: ring lifecycle state
        default: DRAFT
        constraints: "DRAFT | OPEN | SITE_SELECTED | ON_AIR"
      - name: selected_candidate_id
        type: string
        source: system
        description: "FK -> Candidate.id; null until select-site picks a candidate, cleared by reopen"
        default: null
      - name: candidate_count
        type: integer
        source: computed
        description: count of Candidate rows for this ring whose acquisition_status != RELINQUISHED
        default: 0
      - name: committed_capex_usd
        type: number
        source: computed
        description: aggregate certified modification cost committed against this ring (see calculations.ring_committed_capex)
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: number of times select-site was compensated by reopen
        default: 0

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: landlord legal name
      - name: entity_type
        type: enum
        source: input
        description: landlord legal form; TRIBAL_AUTHORITY forces tribal consultation on every EnvironmentalReview of its candidates
        constraints: "INDIVIDUAL | LLC | REIT | MUNICIPALITY | TRIBAL_AUTHORITY"
      - name: contact_email
        type: string
        source: input
        description: outreach email address
      - name: market_code
        type: string
        source: input
        description: market the landlord operates in; must equal SearchRing.market_code of any candidate linking to it
      - name: outreach_optout
        type: boolean
        source: input
        description: landlord has refused outreach; blocks outreach events and lease creation
        default: false
      - name: standing
        type: enum
        source: system
        description: commercial standing gate for lease execution
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | BLACKLISTED"
      - name: executed_lease_count
        type: integer
        source: computed
        description: number of LeaseAgreement rows for this landlord with status == EXECUTED (conserved quantity of calculations.landlord_executed_lease_ledger)
        default: 0

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: zoning authority name
      - name: market_code
        type: string
        source: input
        description: market the jurisdiction covers; must equal SearchRing.market_code
      - name: by_right_review_days
        type: integer
        source: input
        description: nominal review days for BY_RIGHT applications
        constraints: ">= 1"
      - name: conditional_use_review_days
        type: integer
        source: input
        description: nominal review days for CONDITIONAL_USE applications
        constraints: ">= 1"
      - name: variance_review_days
        type: integer
        source: input
        description: nominal review days for VARIANCE applications
        constraints: ">= 1"
      - name: hearing_cadence_days
        type: integer
        source: input
        description: minimum whole-day separation required between two hearing dates booked in this jurisdiction; also the per-continuance schedule penalty
        constraints: ">= 1"
      - name: requires_visual_simulation
        type: boolean
        source: input
        description: jurisdiction requires photo simulations before an application may be submitted
      - name: min_visual_simulations
        type: integer
        source: input
        description: minimum simulation count enforced when requires_visual_simulation is true
        default: 2
      - name: max_continuances
        type: integer
        source: input
        description: maximum number of hearing continuances permitted per application
        constraints: ">= 0"
      - name: historic_district_flag
        type: boolean
        source: input
        description: sites in this jurisdiction sit in a historic district; adds the historic surcharge to zoning fees
      - name: tribal_consultation_required
        type: boolean
        source: input
        description: jurisdiction mandates TCNS tribal consultation on every site
      - name: historical_delay_factor
        type: number
        source: input
        description: observed schedule inflation multiplier applied to the risk-adjusted forecast variant
        constraints: ">= 1.0"
      - name: appeal_window_days
        type: integer
        source: input
        description: days after decision_date during which a zoning decision may be appealed
        constraints: ">= 0"

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: search_ring_id
        type: string
        source: input
        description: "FK -> SearchRing.id"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id"
      - name: owning_agent_user_id
        type: string
        source: input
        description: opaque SiteAcquisitionAgent X-User-ID that owns this candidate; ownership checks compare X-User-ID to this field
      - name: site_type
        type: enum
        source: input
        description: structure class of the candidate
        constraints: "TOWER | ROOFTOP | RAW_LAND"
      - name: lat
        type: number
        source: input
        description: candidate latitude
      - name: lon
        type: number
        source: input
        description: candidate longitude
      - name: distance_from_center_m
        type: integer
        source: input
        description: surveyed distance from the ring center in meters
        constraints: ">= 0"
      - name: agl_m
        type: integer
        source: input
        description: available antenna centerline height above ground level in meters
        constraints: ">= 0"
      - name: months_to_availability
        type: integer
        source: input
        description: months until the site can be occupied; months beyond 6 penalize the RF score
        constraints: ">= 0"
      - name: measured_rsrp_dbm
        type: number
        source: input
        description: drive-tested RSRP at this candidate in dBm (negative)
      - name: offered_capacity_gbps
        type: number
        source: input
        description: backhaul capacity available at this candidate in Gbps
        constraints: ">= 0"
      - name: rf_qualification_score
        type: number
        source: computed
        description: cross-entity RF fitness score against the parent ring's objectives (see calculations.rf_qualification_score)
        default: null
      - name: acquisition_status
        type: enum
        source: system
        description: real-estate dimension of the candidate's parallel state machine
        default: PROSPECTING
        constraints: "PROSPECTING | OUTREACH_SENT | LANDLORD_ENGAGED | LEASE_EXECUTED | RELINQUISHED"
      - name: feasibility_status
        type: enum
        source: system
        description: engineering/entitlement dimension of the candidate's parallel state machine
        default: UNSCREENED
        constraints: "UNSCREENED | RF_QUALIFIED | STRUCTURAL_HOLD | STRUCTURALLY_CLEARED | ENTITLED | BUILD_READY | DISQUALIFIED"
      - name: outreach_event_count
        type: integer
        source: system
        description: number of recorded landlord outreach events
        default: 0
      - name: environmental_cleared
        type: boolean
        source: system
        description: set true when the candidate's EnvironmentalReview reaches CLEARED
        default: false
      - name: permit_issued
        type: boolean
        source: system
        description: set true when a ConstructionPermit for this candidate reaches ISSUED; cleared on revoke or expiry
        default: false

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; must equal Candidate.landlord_id"
      - name: negotiating_agent_user_id
        type: string
        source: input
        description: opaque SiteAcquisitionAgent X-User-ID that negotiated the lease; the executing ProgramDirector X-User-ID must differ from it
      - name: base_monthly_rent_usd
        type: number
        source: input
        description: year-1 monthly ground rent; overwritten with last_counter_rent_usd when a round is ACCEPTED
        constraints: "> 0"
      - name: escalation_type
        type: enum
        source: input
        description: rent escalation mechanism selecting the annual-rent branch of the committed-rent formula
        constraints: "FIXED_PCT | CPI_CAPPED | FLAT_STEP"
      - name: escalation_pct
        type: number
        source: input
        description: annual escalation rate used by FIXED_PCT and (before capping) CPI_CAPPED
        default: 0
      - name: escalation_step_usd
        type: number
        source: input
        description: flat monthly step added per elapsed lease year under FLAT_STEP
        default: 0
      - name: cpi_cap_pct
        type: number
        source: input
        description: escalation ceiling applied under CPI_CAPPED
        default: 0
      - name: initial_term_years
        type: integer
        source: input
        description: initial lease term in whole years; the provisional variant's horizon
        constraints: ">= 1"
      - name: renewal_option_count
        type: integer
        source: input
        description: number of renewal options; the final variant assumes all are exercised
        constraints: ">= 0"
      - name: renewal_term_years
        type: integer
        source: input
        description: length in years of each renewal option
        constraints: ">= 0"
      - name: equipment_expansion_sqft
        type: number
        source: input
        description: contracted equipment expansion area in square feet
        constraints: ">= 0"
      - name: revenue_share_pct
        type: number
        source: input
        description: landlord revenue share applied only in the final committed-rent variant
        default: 0
      - name: round_count
        type: integer
        source: system
        description: number of SUBMIT/COUNTER/REVISE negotiation rounds recorded
        default: 0
      - name: last_counter_rent_usd
        type: number
        source: system
        description: rent carried by the most recent negotiation round
        default: null
      - name: rent_variance_pct
        type: number
        source: computed
        description: percent deviation of last_counter_rent_usd from the ring's market benchmark (see calculations.lease_rent_variance)
        default: null
      - name: committed_rent_provisional_usd
        type: number
        source: computed
        description: provisional variant of the committed rent (initial term only, no revenue share)
        default: null
      - name: committed_rent_final_usd
        type: number
        source: computed
        description: final variant of the committed rent (initial term plus all renewal options, plus revenue share uplift)
        default: null
      - name: execution_date
        type: datetime
        source: input
        description: date the executed lease takes effect; supplied on execute, must not be after the logical clock
        default: null
      - name: status
        type: enum
        source: system
        description: negotiation and execution lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | COUNTERED | REVISED | ACCEPTED | EXECUTED | WITHDRAWN | TERMINATED"

  - name: ZoningApplication
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the jurisdiction is read through Candidate.jurisdiction_id"
      - name: application_type
        type: enum
        source: input
        description: entitlement path; selects which jurisdiction review-day field drives the shot clock and which base fee applies
        constraints: "BY_RIGHT | CONDITIONAL_USE | VARIANCE"
      - name: filed_by_user_id
        type: string
        source: input
        description: opaque ZoningPlanner X-User-ID that filed the application
      - name: status
        type: enum
        source: system
        description: application lifecycle including the incompleteness and continuance loops
        default: PREPARING
        constraints: "PREPARING | SUBMITTED | UNDER_REVIEW | INCOMPLETE | HEARING_SCHEDULED | HEARING_HELD | APPROVED | DENIED | DEEMED_GRANTED | WITHDRAWN"
      - name: submitted_date
        type: datetime
        source: system
        description: logical-clock instant at which submit was accepted; shot-clock origin
        default: null
      - name: visual_simulation_count
        type: integer
        source: system
        description: number of visual simulations attached; also a zoning fee input
        default: 0
      - name: hearing_date
        type: datetime
        source: input
        description: currently scheduled public hearing instant
        default: null
      - name: hearings_held_count
        type: integer
        source: system
        description: number of hearings actually held
        default: 0
      - name: continuance_count
        type: integer
        source: system
        description: number of continuances granted; capped by Jurisdiction.max_continuances
        default: 0
      - name: incomplete_since_date
        type: datetime
        source: system
        description: logical-clock instant the application was flagged INCOMPLETE; tolling origin
        default: null
      - name: tolled_days
        type: integer
        source: system
        description: accumulated whole tolled days added to the shot clock while INCOMPLETE
        default: 0
      - name: shot_clock_deadline_date
        type: datetime
        source: computed
        description: submitted_date + review days for application_type + tolled_days (see calculations.zoning_shot_clock_deadline)
        default: null
      - name: zoning_fee_total_usd
        type: number
        source: computed
        description: total filing fee with expedite surcharge (see calculations.zoning_fee_total)
        default: null
      - name: decision_date
        type: datetime
        source: input
        description: date the authority rendered its decision; supplied on decide, must not be after the logical clock
        default: null

  - name: StructuralAnalysis
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: analysis_type
        type: enum
        source: input
        description: TIA-222 revision governing the analysis; selects the code factor
        constraints: "TIA_222_H | TIA_222_G"
      - name: existing_load_pct
        type: number
        source: input
        description: structure capacity already consumed by existing loading, in percent
        constraints: ">= 0"
      - name: appurtenance_count
        type: integer
        source: input
        description: number of new appurtenances (mounts, lines, RRUs) added by this build
        constraints: ">= 0"
      - name: wind_speed_mph
        type: number
        source: input
        description: design basic wind speed in mph
        constraints: "> 0"
      - name: ice_thickness_in
        type: number
        source: input
        description: design radial ice thickness in inches
        constraints: ">= 0"
      - name: performed_by_user_id
        type: string
        source: input
        description: opaque StructuralEngineer X-User-ID that performed the analysis; may not certify a modification design derived from it
      - name: capacity_utilization_pct
        type: number
        source: computed
        description: total post-build capacity utilization (see calculations.structural_capacity_utilization)
        default: null
      - name: result
        type: enum
        source: system
        description: pass/fail classification derived from capacity_utilization_pct on completion
        default: PENDING
        constraints: "PENDING | PASS | PASS_WITH_MOD | FAIL"
      - name: status
        type: enum
        source: system
        description: analysis lifecycle; a newer analysis on the same candidate supersedes a COMPLETED one
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | COMPLETED | SUPERSEDED"

  - name: ModificationDesign
    parent: null
    common_fields: true
    fields:
      - name: structural_analysis_id
        type: string
        source: input
        description: "FK -> StructuralAnalysis.id"
      - name: scope
        type: enum
        source: input
        description: modification scope
        constraints: "REINFORCEMENT | MOUNT_UPGRADE | TOWER_REPLACEMENT"
      - name: estimated_cost_usd
        type: number
        source: input
        description: modification capex; enters SearchRing.committed_capex_usd once CERTIFIED
        constraints: "> 0"
      - name: designed_by_user_id
        type: string
        source: input
        description: opaque StructuralEngineer X-User-ID that authored the design; may not certify it
      - name: certified_by_user_id
        type: string
        source: system
        description: opaque StructuralEngineer X-User-ID that certified the design (taken from X-User-ID on CERTIFY)
        default: null
      - name: status
        type: enum
        source: system
        description: peer-review lifecycle with a reject/revise loop
        default: DRAFT
        constraints: "DRAFT | PEER_REVIEW | CERTIFIED | REJECTED"
      - name: revision_count
        type: integer
        source: system
        description: number of times the design returned to DRAFT after rejection
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: peer reviewer's rejection rationale
        default: null

  - name: EnvironmentalReview
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: nepa_category
        type: enum
        source: input
        description: NEPA screening outcome class
        constraints: "CATEGORICAL_EXCLUSION | ENVIRONMENTAL_ASSESSMENT"
      - name: section106_required
        type: boolean
        source: input
        description: Section 106 historic-properties review applies
      - name: tribal_consultation_required
        type: boolean
        source: computed
        description: true when Jurisdiction.tribal_consultation_required is true OR Landlord.entity_type == TRIBAL_AUTHORITY (see calculations.tribal_consultation_scope)
        default: null
      - name: tcns_notice_date
        type: datetime
        source: system
        description: logical-clock instant the TCNS tribal notice was issued (set on screen)
        default: null
      - name: tribal_response_deadline_date
        type: datetime
        source: computed
        description: tcns_notice_date + TRIBAL_RESPONSE_DAYS; the tribal branch may not be closed before it
        default: null
      - name: public_notice_branch_status
        type: enum
        source: system
        description: state of the public-notice / Section 106 branch of the fork-join
        default: NOT_STARTED
        constraints: "NOT_STARTED | PENDING | COMPLETE"
      - name: tribal_branch_status
        type: enum
        source: system
        description: state of the tribal-consultation branch of the fork-join
        default: NOT_STARTED
        constraints: "NOT_STARTED | PENDING | COMPLETE | NOT_APPLICABLE"
      - name: status
        type: enum
        source: system
        description: aggregate review state derived from the two branch dimensions
        default: NOT_STARTED
        constraints: "NOT_STARTED | SCREENING | IN_CONSULTATION | CLEARED | ADVERSE_EFFECT"

  - name: ConstructionPermit
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: permit_type
        type: enum
        source: input
        description: permit class
        constraints: "BUILDING | ELECTRICAL | ROW"
      - name: valid_days
        type: integer
        source: input
        description: validity window in days added to issued_date to obtain expiry_date
        default: 180
      - name: status
        type: enum
        source: system
        description: permit lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | ISSUED | EXPIRED | REVOKED"
      - name: submitted_date
        type: datetime
        source: system
        description: logical-clock instant the permit application was created
        default: null
      - name: issued_date
        type: datetime
        source: input
        description: issuance date supplied on issue; must not be after the logical clock
        default: null
      - name: expiry_date
        type: datetime
        source: computed
        description: issued_date + valid_days; once the logical clock passes it the permit is EXPIRED
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: reason recorded when the permit is revoked
        default: null

  - name: UtilityProvider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: power or fiber provider name
      - name: market_code
        type: string
        source: input
        description: market served by this provider
      - name: concurrent_crew_capacity
        type: integer
        source: input
        description: maximum number of orders whose half-open windows may cover the same UTC day
        constraints: ">= 1"
      - name: quoted_interval_days
        type: integer
        source: input
        description: quoted lead time in days for a new order at this provider
        constraints: ">= 0"
      - name: committed_crew_days
        type: integer
        source: computed
        description: sum of crew_days over this provider's orders with status IN {REQUESTED, SCHEDULED} (conserved quantity of calculations.provider_crew_day_ledger)
        default: 0

  - name: UtilityBackhaulOrder
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: provider_id
        type: string
        source: input
        description: "FK -> UtilityProvider.id"
      - name: order_type
        type: enum
        source: input
        description: utility discipline; both POWER and FIBER must be DELIVERED before a plan may be activated
        constraints: "POWER | FIBER"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the crew window (half-open interval start)
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the crew window (half-open interval end); must be strictly after window_start
      - name: crew_days
        type: integer
        source: computed
        description: whole UTC days in the half-open window [window_start, window_end)
        default: null
      - name: delivered_date
        type: datetime
        source: input
        description: date delivery was recorded; must not be after the logical clock
        default: null
      - name: status
        type: enum
        source: system
        description: order lifecycle
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | DELIVERED | CANCELLED"

  - name: OnAirPlan
    parent: null
    common_fields: true
    fields:
      - name: search_ring_id
        type: string
        source: input
        description: "FK -> SearchRing.id"
      - name: target_on_air_date
        type: datetime
        source: input
        description: committed on-air milestone date
      - name: baseline_forecast_date
        type: datetime
        source: computed
        description: nominal-duration forecast variant (see calculations.on_air_schedule_forecast)
        default: null
      - name: risk_adjusted_forecast_date
        type: datetime
        source: computed
        description: delay-factor forecast variant including continuance penalties
        default: null
      - name: schedule_risk_score
        type: number
        source: computed
        description: 0-100 schedule risk score derived from the risk-adjusted slip
        default: null
      - name: risk_band
        type: enum
        source: computed
        description: banding of schedule_risk_score
        default: null
        constraints: "LOW | MEDIUM | HIGH"
      - name: driver_candidate_id
        type: string
        source: computed
        description: candidate whose remaining work drives the forecast, resolved by the selector in calculations.on_air_schedule_forecast (not an FK declaration)
        default: null
      - name: status
        type: enum
        source: system
        description: plan lifecycle
        default: PLANNED
        constraints: "PLANNED | AT_RISK | RESET | ON_AIR"
      - name: actual_on_air_date
        type: datetime
        source: input
        description: recorded on-air instant supplied on activate; must not be after the logical clock
        default: null
      - name: variance_days
        type: integer
        source: computed
        description: whole days between actual_on_air_date and target_on_air_date (negative = early)
        default: null
      - name: reset_count
        type: integer
        source: system
        description: number of times the target date was reset
        default: 0

state_machines:
  - entity: SearchRing
    initial_state: DRAFT
    terminal_states: [ON_AIR]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /search-rings/{id}/open"
        actor: RfEngineer
        preconditions: ["status == DRAFT"]
        side_effects: ["status = OPEN", "increments SearchRing.version by 1"]
      - from: OPEN
        to: SITE_SELECTED
        trigger: "POST /search-rings/{id}/select-site"
        actor: ProgramDirector
        preconditions:
          - "status == OPEN"
          - "expected_search_ring_version == SearchRing.version"
          - "at least one Candidate of this ring has acquisition_status == LEASE_EXECUTED AND feasibility_status == BUILD_READY"
        side_effects:
          - "selected_candidate_id = the winner of the selector in calculations.site_selection_winner"
          - "status = SITE_SELECTED"
          - "recomputes committed_capex_usd (calculations.ring_committed_capex)"
          - "increments SearchRing.version by 1"
      - from: SITE_SELECTED
        to: OPEN
        trigger: "POST /search-rings/{id}/reopen"
        actor: ProgramDirector
        preconditions: ["status == SITE_SELECTED"]
        side_effects:
          - "selected_candidate_id = null"
          - "status = OPEN"
          - "reopen_count += 1"
          - "recomputes committed_capex_usd (calculations.ring_committed_capex)"
          - "increments SearchRing.version by 1"
        note: "Compensating action for select-site; conserves the committed-capex ledger."
      - from: SITE_SELECTED
        to: OPEN
        trigger: "system: selected candidate leaves the eligible pool (acquisition_status = RELINQUISHED or feasibility_status = DISQUALIFIED)"
        actor: system
        preconditions: ["status == SITE_SELECTED", "selected_candidate_id == the candidate that just left the pool"]
        side_effects:
          - "selected_candidate_id = null"
          - "status = OPEN"
          - "recomputes candidate_count and committed_capex_usd"
          - "increments SearchRing.version by 1"
        note: "Third link of cascade B and fourth link of cascade A."
      - from: SITE_SELECTED
        to: ON_AIR
        trigger: "system: OnAirPlan for this ring reaches ON_AIR"
        actor: system
        preconditions: ["status == SITE_SELECTED"]
        side_effects: ["status = ON_AIR", "increments SearchRing.version by 1"]

  - entity: Candidate
    initial_state: "PROSPECTING (acquisition_status) + UNSCREENED (feasibility_status)"
    terminal_states: [RELINQUISHED, DISQUALIFIED]
    note: >
      Two independent state dimensions on one row: acquisition_status (real-estate track)
      and feasibility_status (engineering/entitlement track). They advance through
      different endpoints and neither blocks the other except where a precondition
      names the other dimension explicitly.
    transitions:
      - from: PROSPECTING
        to: OUTREACH_SENT
        trigger: "POST /candidates/{id}/outreach-events with event_type OUTREACH_SENT"
        actor: SiteAcquisitionAgent
        preconditions: ["acquisition_status == PROSPECTING", "Landlord.outreach_optout == false", "X-User-ID == owning_agent_user_id"]
        side_effects: ["acquisition_status = OUTREACH_SENT", "outreach_event_count += 1", "increments Candidate.version by 1"]
      - from: OUTREACH_SENT
        to: LANDLORD_ENGAGED
        trigger: "POST /candidates/{id}/outreach-events with event_type LANDLORD_REPLY"
        actor: SiteAcquisitionAgent
        preconditions: ["acquisition_status == OUTREACH_SENT", "X-User-ID == owning_agent_user_id"]
        side_effects: ["acquisition_status = LANDLORD_ENGAGED", "outreach_event_count += 1", "increments Candidate.version by 1"]
      - from: OUTREACH_SENT
        to: RELINQUISHED
        trigger: "POST /candidates/{id}/outreach-events with event_type LANDLORD_DECLINED"
        actor: SiteAcquisitionAgent
        preconditions: ["acquisition_status IN {OUTREACH_SENT, LANDLORD_ENGAGED}", "X-User-ID == owning_agent_user_id"]
        side_effects:
          - "acquisition_status = RELINQUISHED"
          - "outreach_event_count += 1"
          - "each LeaseAgreement of this candidate with status IN {DRAFT, SUBMITTED, COUNTERED, REVISED} -> WITHDRAWN"
          - "recomputes SearchRing.candidate_count and SearchRing.committed_capex_usd"
          - "increments Candidate.version by 1"
      - from: LANDLORD_ENGAGED
        to: RELINQUISHED
        trigger: "POST /candidates/{id}/outreach-events with event_type LANDLORD_DECLINED"
        actor: SiteAcquisitionAgent
        preconditions: ["acquisition_status == LANDLORD_ENGAGED", "X-User-ID == owning_agent_user_id"]
        side_effects:
          - "acquisition_status = RELINQUISHED"
          - "outreach_event_count += 1"
          - "each LeaseAgreement of this candidate with status IN {DRAFT, SUBMITTED, COUNTERED, REVISED} -> WITHDRAWN"
          - "recomputes SearchRing.candidate_count and SearchRing.committed_capex_usd"
          - "increments Candidate.version by 1"
      - from: LANDLORD_ENGAGED
        to: LEASE_EXECUTED
        trigger: "system: POST /leases/{id}/execute succeeds for a lease on this candidate"
        actor: system
        preconditions: ["acquisition_status == LANDLORD_ENGAGED"]
        side_effects: ["acquisition_status = LEASE_EXECUTED", "increments Candidate.version by 1"]
      - from: LEASE_EXECUTED
        to: RELINQUISHED
        trigger: "system: the candidate's EXECUTED LeaseAgreement becomes TERMINATED"
        actor: system
        preconditions: ["acquisition_status == LEASE_EXECUTED"]
        side_effects:
          - "acquisition_status = RELINQUISHED"
          - "recomputes SearchRing.candidate_count and SearchRing.committed_capex_usd"
          - "if SearchRing.selected_candidate_id == this candidate then SearchRing.status = OPEN and selected_candidate_id = null"
          - "increments Candidate.version by 1"
        note: "Third link of cascade B (landlord blacklisting)."
      - from: UNSCREENED
        to: RF_QUALIFIED
        trigger: "POST /candidates/{id}/rf-qualify"
        actor: RfEngineer
        preconditions: ["feasibility_status == UNSCREENED", "SearchRing.status == OPEN", "rf_qualification_score >= RF_QUALIFY_MIN_SCORE"]
        side_effects: ["rf_qualification_score = calculations.rf_qualification_score", "feasibility_status = RF_QUALIFIED", "increments Candidate.version by 1"]
      - from: UNSCREENED
        to: DISQUALIFIED
        trigger: "POST /candidates/{id}/rf-qualify"
        actor: RfEngineer
        preconditions: ["feasibility_status == UNSCREENED", "SearchRing.status == OPEN", "rf_qualification_score < RF_QUALIFY_MIN_SCORE"]
        side_effects:
          - "rf_qualification_score = calculations.rf_qualification_score"
          - "feasibility_status = DISQUALIFIED"
          - "recomputes SearchRing.committed_capex_usd"
          - "increments Candidate.version by 1"
      - from: RF_QUALIFIED
        to: STRUCTURAL_HOLD
        trigger: "system: POST /structural-analyses creates an analysis for this candidate"
        actor: system
        preconditions: ["feasibility_status IN {RF_QUALIFIED, STRUCTURALLY_CLEARED}"]
        side_effects: ["feasibility_status = STRUCTURAL_HOLD", "increments Candidate.version by 1"]
      - from: STRUCTURALLY_CLEARED
        to: STRUCTURAL_HOLD
        trigger: "system: POST /structural-analyses creates a superseding analysis for this candidate"
        actor: system
        preconditions: ["feasibility_status == STRUCTURALLY_CLEARED"]
        side_effects: ["feasibility_status = STRUCTURAL_HOLD", "increments Candidate.version by 1"]
      - from: STRUCTURAL_HOLD
        to: STRUCTURALLY_CLEARED
        trigger: "system: the candidate's COMPLETED StructuralAnalysis has result PASS, or a ModificationDesign derived from it becomes CERTIFIED"
        actor: system
        preconditions: ["feasibility_status == STRUCTURAL_HOLD"]
        side_effects: ["feasibility_status = STRUCTURALLY_CLEARED", "increments Candidate.version by 1"]
      - from: STRUCTURAL_HOLD
        to: DISQUALIFIED
        trigger: "system: the candidate's StructuralAnalysis completes with result FAIL"
        actor: system
        preconditions: ["feasibility_status == STRUCTURAL_HOLD"]
        side_effects:
          - "feasibility_status = DISQUALIFIED"
          - "each ZoningApplication of this candidate with status NOT IN {APPROVED, DENIED, DEEMED_GRANTED, WITHDRAWN} -> WITHDRAWN"
          - "recomputes SearchRing.candidate_count and SearchRing.committed_capex_usd"
          - "increments Candidate.version by 1"
        note: "Second link of cascade A; the zoning withdrawal it causes is the third link."
      - from: STRUCTURALLY_CLEARED
        to: ENTITLED
        trigger: "system: the candidate's ZoningApplication reaches APPROVED or DEEMED_GRANTED"
        actor: system
        preconditions: ["feasibility_status == STRUCTURALLY_CLEARED"]
        side_effects: ["feasibility_status = ENTITLED", "increments Candidate.version by 1"]
      - from: ENTITLED
        to: BUILD_READY
        trigger: "POST /candidates/{id}/mark-build-ready"
        actor: ConstructionManager
        preconditions:
          - "feasibility_status IN {STRUCTURALLY_CLEARED, ENTITLED}"
          - "acquisition_status == LEASE_EXECUTED"
          - "environmental_cleared == true"
          - "permit_issued == true AND the issuing ConstructionPermit.status == ISSUED"
        side_effects: ["feasibility_status = BUILD_READY", "increments Candidate.version by 1"]
        note: >
          The state gate admits STRUCTURALLY_CLEARED as well as ENTITLED so that the
          environmental and permit checks (validations priority 41 and 45) are reachable;
          only an ENTITLED candidate can satisfy them, because permit issuance itself
          requires ENTITLED.
      - from: BUILD_READY
        to: ENTITLED
        trigger: "system: the candidate's ISSUED ConstructionPermit becomes REVOKED or EXPIRED"
        actor: system
        preconditions: ["feasibility_status == BUILD_READY"]
        side_effects:
          - "permit_issued = false"
          - "feasibility_status = ENTITLED"
          - "if SearchRing.selected_candidate_id == this candidate then SearchRing.status = OPEN and selected_candidate_id = null"
          - "increments Candidate.version by 1"

  - entity: LeaseAgreement
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /leases/{id}/rounds with action SUBMIT"
        actor: SiteAcquisitionAgent
        preconditions: ["status == DRAFT", "counter_rent_usd present", "round_count < MAX_NEGOTIATION_ROUNDS", "Landlord.standing == ACTIVE"]
        side_effects: ["last_counter_rent_usd = counter_rent_usd", "round_count += 1", "recomputes rent_variance_pct", "status = SUBMITTED", "increments LeaseAgreement.version by 1"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /leases/{id}/rounds with action COUNTER"
        actor: SiteAcquisitionAgent
        preconditions: ["status IN {SUBMITTED, REVISED}", "counter_rent_usd present", "round_count < MAX_NEGOTIATION_ROUNDS"]
        side_effects: ["last_counter_rent_usd = counter_rent_usd", "round_count += 1", "recomputes rent_variance_pct", "status = COUNTERED", "increments LeaseAgreement.version by 1"]
      - from: COUNTERED
        to: REVISED
        trigger: "POST /leases/{id}/rounds with action REVISE"
        actor: SiteAcquisitionAgent
        preconditions: ["status == COUNTERED", "counter_rent_usd present", "round_count < MAX_NEGOTIATION_ROUNDS"]
        side_effects: ["last_counter_rent_usd = counter_rent_usd", "round_count += 1", "recomputes rent_variance_pct", "status = REVISED", "increments LeaseAgreement.version by 1"]
      - from: REVISED
        to: COUNTERED
        trigger: "POST /leases/{id}/rounds with action COUNTER"
        actor: SiteAcquisitionAgent
        preconditions: ["status == REVISED", "counter_rent_usd present", "round_count < MAX_NEGOTIATION_ROUNDS"]
        side_effects: ["last_counter_rent_usd = counter_rent_usd", "round_count += 1", "recomputes rent_variance_pct", "status = COUNTERED", "increments LeaseAgreement.version by 1"]
        note: "Negotiation cycle COUNTERED -> REVISED -> COUNTERED."
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /leases/{id}/rounds with action ACCEPT"
        actor: SiteAcquisitionAgent
        preconditions: ["status IN {SUBMITTED, COUNTERED, REVISED}", "last_counter_rent_usd != null", "rent_variance_pct <= MAX_RENT_VARIANCE_PCT"]
        side_effects:
          - "base_monthly_rent_usd = last_counter_rent_usd"
          - "committed_rent_provisional_usd = calculations.lease_committed_rent variant provisional"
          - "status = ACCEPTED"
          - "increments LeaseAgreement.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /leases/{id}/rounds with action ACCEPT"
        actor: SiteAcquisitionAgent
        preconditions: ["status == SUBMITTED", "last_counter_rent_usd != null", "rent_variance_pct <= MAX_RENT_VARIANCE_PCT"]
        side_effects:
          - "base_monthly_rent_usd = last_counter_rent_usd"
          - "committed_rent_provisional_usd = calculations.lease_committed_rent variant provisional"
          - "status = ACCEPTED"
          - "increments LeaseAgreement.version by 1"
      - from: REVISED
        to: ACCEPTED
        trigger: "POST /leases/{id}/rounds with action ACCEPT"
        actor: SiteAcquisitionAgent
        preconditions: ["status == REVISED", "last_counter_rent_usd != null", "rent_variance_pct <= MAX_RENT_VARIANCE_PCT"]
        side_effects:
          - "base_monthly_rent_usd = last_counter_rent_usd"
          - "committed_rent_provisional_usd = calculations.lease_committed_rent variant provisional"
          - "status = ACCEPTED"
          - "increments LeaseAgreement.version by 1"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /leases/{id}/execute"
        actor: ProgramDirector
        preconditions:
          - "status == ACCEPTED"
          - "Landlord.standing == ACTIVE"
          - "X-User-ID != negotiating_agent_user_id"
          - "execution_date <= logical clock"
        side_effects:
          - "execution_date = supplied execution_date"
          - "committed_rent_final_usd = calculations.lease_committed_rent variant final"
          - "status = EXECUTED"
          - "Candidate.acquisition_status = LEASE_EXECUTED"
          - "recomputes Landlord.executed_lease_count"
          - "increments LeaseAgreement.version by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: ProgramDirector
        preconditions: ["status == EXECUTED"]
        side_effects:
          - "status = TERMINATED"
          - "recomputes Landlord.executed_lease_count"
          - "Candidate.acquisition_status = RELINQUISHED"
          - "increments LeaseAgreement.version by 1"
        note: "Compensating action for execute; conserves the executed-lease ledger."
      - from: EXECUTED
        to: TERMINATED
        trigger: "system: Landlord.standing becomes BLACKLISTED"
        actor: system
        preconditions: ["status == EXECUTED"]
        side_effects:
          - "status = TERMINATED"
          - "recomputes Landlord.executed_lease_count"
          - "Candidate.acquisition_status = RELINQUISHED"
          - "increments LeaseAgreement.version by 1"
        note: "Second link of cascade B."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: the lease's Candidate becomes RELINQUISHED"
        actor: system
        preconditions: ["status IN {DRAFT, SUBMITTED, COUNTERED, REVISED}"]
        side_effects: ["status = WITHDRAWN", "increments LeaseAgreement.version by 1"]

  - entity: ZoningApplication
    initial_state: PREPARING
    terminal_states: [APPROVED, DENIED, DEEMED_GRANTED, WITHDRAWN]
    transitions:
      - from: PREPARING
        to: SUBMITTED
        trigger: "POST /zoning-applications/{id}/submit"
        actor: ZoningPlanner
        preconditions:
          - "status == PREPARING"
          - "Candidate.acquisition_status == LEASE_EXECUTED"
          - "if Jurisdiction.requires_visual_simulation then visual_simulation_count >= Jurisdiction.min_visual_simulations"
        side_effects:
          - "submitted_date = logical clock"
          - "zoning_fee_total_usd = calculations.zoning_fee_total"
          - "shot_clock_deadline_date = calculations.zoning_shot_clock_deadline"
          - "status = SUBMITTED"
          - "increments ZoningApplication.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /zoning-applications/{id}/completeness with outcome COMPLETE"
        actor: ZoningPlanner
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status = UNDER_REVIEW", "increments ZoningApplication.version by 1"]
      - from: SUBMITTED
        to: INCOMPLETE
        trigger: "POST /zoning-applications/{id}/completeness with outcome INCOMPLETE"
        actor: ZoningPlanner
        preconditions: ["status IN {SUBMITTED, UNDER_REVIEW}"]
        side_effects: ["incomplete_since_date = logical clock", "status = INCOMPLETE", "increments ZoningApplication.version by 1"]
      - from: UNDER_REVIEW
        to: INCOMPLETE
        trigger: "POST /zoning-applications/{id}/completeness with outcome INCOMPLETE"
        actor: ZoningPlanner
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["incomplete_since_date = logical clock", "status = INCOMPLETE", "increments ZoningApplication.version by 1"]
      - from: INCOMPLETE
        to: UNDER_REVIEW
        trigger: "POST /zoning-applications/{id}/completeness with outcome CURED"
        actor: ZoningPlanner
        preconditions: ["status == INCOMPLETE", "incomplete_since_date != null"]
        side_effects:
          - "tolled_days += floor(whole UTC days between incomplete_since_date and the logical clock)"
          - "recomputes shot_clock_deadline_date"
          - "incomplete_since_date = null"
          - "status = UNDER_REVIEW"
          - "increments ZoningApplication.version by 1"
        note: "Tolling cycle INCOMPLETE -> UNDER_REVIEW -> INCOMPLETE is repeatable and each pass adds tolled days."
      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: "POST /zoning-applications/{id}/hearings with action SCHEDULE"
        actor: ZoningPlanner
        preconditions:
          - "status IN {UNDER_REVIEW, HEARING_HELD}"
          - "hearing_date >= logical clock"
          - "no other ZoningApplication in the same Jurisdiction has a hearing_date within Jurisdiction.hearing_cadence_days whole days of the requested hearing_date"
        side_effects: ["hearing_date = supplied hearing_date", "status = HEARING_SCHEDULED", "increments ZoningApplication.version by 1"]
      - from: HEARING_SCHEDULED
        to: HEARING_HELD
        trigger: "POST /zoning-applications/{id}/hearings with action HOLD"
        actor: ZoningPlanner
        preconditions: ["status == HEARING_SCHEDULED", "logical clock >= hearing_date"]
        side_effects: ["hearings_held_count += 1", "status = HEARING_HELD", "increments ZoningApplication.version by 1"]
      - from: HEARING_HELD
        to: HEARING_SCHEDULED
        trigger: "POST /zoning-applications/{id}/hearings with action CONTINUE"
        actor: ZoningPlanner
        preconditions:
          - "status == HEARING_HELD"
          - "continuance_count < Jurisdiction.max_continuances"
          - "hearing_date >= logical clock"
        side_effects:
          - "continuance_count += 1"
          - "hearing_date = supplied hearing_date"
          - "status = HEARING_SCHEDULED"
          - "each OnAirPlan of the candidate's ring is re-forecast on its next reforecast call with a continuance penalty"
          - "increments ZoningApplication.version by 1"
        note: "Hearing cycle HEARING_HELD -> HEARING_SCHEDULED -> HEARING_HELD."
      - from: HEARING_HELD
        to: APPROVED
        trigger: "POST /zoning-applications/{id}/decide with outcome APPROVED"
        actor: ZoningPlanner
        preconditions: ["status IN {HEARING_HELD, UNDER_REVIEW}", "if status == UNDER_REVIEW then application_type == BY_RIGHT", "decision_date >= submitted_date", "decision_date <= logical clock"]
        side_effects:
          - "decision_date = supplied decision_date"
          - "status = APPROVED"
          - "if Candidate.feasibility_status == STRUCTURALLY_CLEARED then Candidate.feasibility_status = ENTITLED"
          - "increments ZoningApplication.version by 1"
      - from: HEARING_HELD
        to: DENIED
        trigger: "POST /zoning-applications/{id}/decide with outcome DENIED"
        actor: ZoningPlanner
        preconditions: ["status IN {HEARING_HELD, UNDER_REVIEW}", "decision_date >= submitted_date", "decision_date <= logical clock"]
        side_effects: ["decision_date = supplied decision_date", "status = DENIED", "increments ZoningApplication.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /zoning-applications/{id}/decide with outcome APPROVED (BY_RIGHT only)"
        actor: ZoningPlanner
        preconditions: ["status == UNDER_REVIEW", "application_type == BY_RIGHT", "decision_date >= submitted_date", "decision_date <= logical clock"]
        side_effects:
          - "decision_date = supplied decision_date"
          - "status = APPROVED"
          - "if Candidate.feasibility_status == STRUCTURALLY_CLEARED then Candidate.feasibility_status = ENTITLED"
          - "increments ZoningApplication.version by 1"
      - from: UNDER_REVIEW
        to: DEEMED_GRANTED
        trigger: "POST /zoning-applications/{id}/deem-granted"
        actor: ProgramDirector
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INCOMPLETE, HEARING_SCHEDULED, HEARING_HELD}"
          - "logical clock > shot_clock_deadline_date"
        side_effects:
          - "decision_date = logical clock"
          - "status = DEEMED_GRANTED"
          - "if Candidate.feasibility_status == STRUCTURALLY_CLEARED then Candidate.feasibility_status = ENTITLED"
          - "increments ZoningApplication.version by 1"
      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "system: the application's Candidate becomes DISQUALIFIED or RELINQUISHED"
        actor: system
        preconditions: ["status NOT IN {APPROVED, DENIED, DEEMED_GRANTED, WITHDRAWN}"]
        side_effects:
          - "status = WITHDRAWN"
          - "each UtilityBackhaulOrder of the same Candidate with status IN {REQUESTED, SCHEDULED} -> CANCELLED"
          - "increments ZoningApplication.version by 1"
        note: "Third link of cascade A; the backhaul cancellation it causes is the fourth link."

  - entity: StructuralAnalysis
    initial_state: IN_PROGRESS
    terminal_states: [SUPERSEDED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /structural-analyses/{id}/complete"
        actor: StructuralEngineer
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "capacity_utilization_pct = calculations.structural_capacity_utilization"
          - "result = PASS | PASS_WITH_MOD | FAIL per the utilization thresholds"
          - "status = COMPLETED"
          - "if result == PASS then Candidate.feasibility_status = STRUCTURALLY_CLEARED"
          - "if result == FAIL then Candidate.feasibility_status = DISQUALIFIED (first link of cascade A)"
          - "increments StructuralAnalysis.version by 1"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: POST /structural-analyses creates a newer analysis for the same candidate"
        actor: system
        preconditions: ["status == COMPLETED"]
        side_effects: ["status = SUPERSEDED", "increments StructuralAnalysis.version by 1"]
      - from: IN_PROGRESS
        to: SUPERSEDED
        trigger: "system: POST /structural-analyses creates a newer analysis for the same candidate"
        actor: system
        preconditions: ["status == IN_PROGRESS"]
        side_effects: ["status = SUPERSEDED", "increments StructuralAnalysis.version by 1"]

  - entity: ModificationDesign
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: PEER_REVIEW
        trigger: "POST /modification-designs/{id}/peer-review with action SUBMIT"
        actor: StructuralEngineer
        preconditions: ["status == DRAFT", "StructuralAnalysis.status == COMPLETED", "StructuralAnalysis.result == PASS_WITH_MOD"]
        side_effects: ["status = PEER_REVIEW", "increments ModificationDesign.version by 1"]
      - from: PEER_REVIEW
        to: CERTIFIED
        trigger: "POST /modification-designs/{id}/peer-review with action CERTIFY"
        actor: StructuralEngineer
        preconditions:
          - "status == PEER_REVIEW"
          - "StructuralAnalysis.status == COMPLETED"
          - "X-User-ID != designed_by_user_id AND X-User-ID != StructuralAnalysis.performed_by_user_id"
          - "SearchRing.committed_capex_usd including this design <= SearchRing.capex_budget_usd"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "status = CERTIFIED"
          - "recomputes SearchRing.committed_capex_usd (calculations.ring_committed_capex)"
          - "Candidate.feasibility_status = STRUCTURALLY_CLEARED when it is STRUCTURAL_HOLD"
          - "increments ModificationDesign.version by 1"
      - from: PEER_REVIEW
        to: REJECTED
        trigger: "POST /modification-designs/{id}/peer-review with action REJECT"
        actor: StructuralEngineer
        preconditions: ["status == PEER_REVIEW", "rejection_reason present", "X-User-ID != designed_by_user_id"]
        side_effects: ["rejection_reason = supplied reason", "status = REJECTED", "increments ModificationDesign.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /modification-designs/{id}/peer-review with action REVISE"
        actor: StructuralEngineer
        preconditions: ["status == REJECTED"]
        side_effects: ["revision_count += 1", "rejection_reason = null", "status = DRAFT", "increments ModificationDesign.version by 1"]
        note: "Peer-review cycle DRAFT -> PEER_REVIEW -> REJECTED -> DRAFT."

  - entity: EnvironmentalReview
    initial_state: NOT_STARTED
    terminal_states: [CLEARED, ADVERSE_EFFECT]
    transitions:
      - from: NOT_STARTED
        to: SCREENING
        trigger: "POST /environmental-reviews/{id}/screen"
        actor: EnvironmentalReviewer
        preconditions: ["status == NOT_STARTED"]
        side_effects:
          - "public_notice_branch_status = PENDING"
          - "tribal_branch_status = PENDING when tribal_consultation_required == true, else NOT_APPLICABLE"
          - "tcns_notice_date = logical clock when tribal_consultation_required == true, else stays null"
          - "tribal_response_deadline_date = tcns_notice_date + TRIBAL_RESPONSE_DAYS when tribal_consultation_required == true, else stays null"
          - "status = SCREENING"
          - "increments EnvironmentalReview.version by 1"
        note: "Fork point of the two-branch review."
      - from: SCREENING
        to: IN_CONSULTATION
        trigger: "POST /environmental-reviews/{id}/branch-complete closing one branch while the other is still PENDING"
        actor: EnvironmentalReviewer
        preconditions: ["status == SCREENING", "the named branch status == PENDING", "finding == NO_ADVERSE_EFFECT", "if branch == TRIBAL then logical clock >= tribal_response_deadline_date"]
        side_effects: ["the named branch status = COMPLETE", "status = IN_CONSULTATION", "increments EnvironmentalReview.version by 1"]
      - from: IN_CONSULTATION
        to: CLEARED
        trigger: "POST /environmental-reviews/{id}/branch-complete closing the last PENDING branch"
        actor: EnvironmentalReviewer
        preconditions:
          - "status IN {SCREENING, IN_CONSULTATION}"
          - "the named branch status == PENDING"
          - "finding == NO_ADVERSE_EFFECT"
          - "if branch == TRIBAL then logical clock >= tribal_response_deadline_date"
          - "after this call public_notice_branch_status == COMPLETE AND tribal_branch_status IN {COMPLETE, NOT_APPLICABLE}"
        side_effects:
          - "the named branch status = COMPLETE"
          - "status = CLEARED"
          - "Candidate.environmental_cleared = true"
          - "increments EnvironmentalReview.version by 1"
        note: "Join point; also fires directly from SCREENING when the other branch is NOT_APPLICABLE."
      - from: SCREENING
        to: CLEARED
        trigger: "POST /environmental-reviews/{id}/branch-complete for PUBLIC_NOTICE when tribal_branch_status == NOT_APPLICABLE"
        actor: EnvironmentalReviewer
        preconditions: ["status == SCREENING", "public_notice_branch_status == PENDING", "tribal_branch_status == NOT_APPLICABLE", "finding == NO_ADVERSE_EFFECT"]
        side_effects:
          - "public_notice_branch_status = COMPLETE"
          - "status = CLEARED"
          - "Candidate.environmental_cleared = true"
          - "increments EnvironmentalReview.version by 1"
      - from: SCREENING
        to: ADVERSE_EFFECT
        trigger: "POST /environmental-reviews/{id}/branch-complete with finding ADVERSE_EFFECT"
        actor: EnvironmentalReviewer
        preconditions: ["status IN {SCREENING, IN_CONSULTATION}", "the named branch status == PENDING", "if branch == TRIBAL then logical clock >= tribal_response_deadline_date"]
        side_effects:
          - "the named branch status = COMPLETE"
          - "status = ADVERSE_EFFECT"
          - "Candidate.environmental_cleared = false"
          - "increments EnvironmentalReview.version by 1"
        note: "Divergent side-effect set of the branch fork: an adverse finding on either branch short-circuits the join."
      - from: IN_CONSULTATION
        to: ADVERSE_EFFECT
        trigger: "POST /environmental-reviews/{id}/branch-complete with finding ADVERSE_EFFECT"
        actor: EnvironmentalReviewer
        preconditions: ["status == IN_CONSULTATION", "the named branch status == PENDING", "if branch == TRIBAL then logical clock >= tribal_response_deadline_date"]
        side_effects: ["the named branch status = COMPLETE", "status = ADVERSE_EFFECT", "Candidate.environmental_cleared = false", "increments EnvironmentalReview.version by 1"]

  - entity: ConstructionPermit
    initial_state: SUBMITTED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /construction-permits/{id}/issue"
        actor: ConstructionManager
        preconditions:
          - "status == SUBMITTED"
          - "Candidate.feasibility_status IN {ENTITLED, BUILD_READY}"
          - "Candidate.environmental_cleared == true"
          - "issued_date <= logical clock"
        side_effects:
          - "issued_date = supplied issued_date"
          - "expiry_date = issued_date + valid_days days"
          - "status = ISSUED"
          - "Candidate.permit_issued = true"
          - "increments ConstructionPermit.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /construction-permits/{id}/revoke"
        actor: ConstructionManager
        preconditions: ["status == ISSUED", "revocation_reason present"]
        side_effects:
          - "revocation_reason = supplied reason"
          - "status = REVOKED"
          - "Candidate.permit_issued = false"
          - "Candidate.feasibility_status = ENTITLED when it is BUILD_READY"
          - "increments ConstructionPermit.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: evaluated whenever the permit is read or relied upon and the logical clock > expiry_date"
        actor: system
        preconditions: ["status == ISSUED", "logical clock > expiry_date"]
        side_effects:
          - "status = EXPIRED"
          - "Candidate.permit_issued = false"
          - "Candidate.feasibility_status = ENTITLED when it is BUILD_READY"
          - "increments ConstructionPermit.version by 1"

  - entity: UtilityBackhaulOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /backhaul-orders/{id}/status-actions with action SCHEDULE"
        actor: ConstructionManager
        preconditions: ["status == REQUESTED"]
        side_effects: ["status = SCHEDULED", "recomputes UtilityProvider.committed_crew_days", "increments UtilityBackhaulOrder.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /backhaul-orders/{id}/status-actions with action CANCEL"
        actor: ConstructionManager
        preconditions: ["status IN {REQUESTED, SCHEDULED}"]
        side_effects: ["status = CANCELLED", "recomputes UtilityProvider.committed_crew_days", "increments UtilityBackhaulOrder.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /backhaul-orders/{id}/status-actions with action CANCEL"
        actor: ConstructionManager
        preconditions: ["status == SCHEDULED"]
        side_effects: ["status = CANCELLED", "recomputes UtilityProvider.committed_crew_days", "increments UtilityBackhaulOrder.version by 1"]
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /backhaul-orders/{id}/status-actions with action DELIVER"
        actor: ConstructionManager
        preconditions: ["status == SCHEDULED", "delivered_date present", "delivered_date <= logical clock"]
        side_effects: ["delivered_date = supplied delivered_date", "status = DELIVERED", "recomputes UtilityProvider.committed_crew_days", "increments UtilityBackhaulOrder.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: a ZoningApplication of the same Candidate becomes WITHDRAWN"
        actor: system
        preconditions: ["status IN {REQUESTED, SCHEDULED}"]
        side_effects: ["status = CANCELLED", "recomputes UtilityProvider.committed_crew_days", "increments UtilityBackhaulOrder.version by 1"]
        note: "Fourth link of cascade A."

  - entity: OnAirPlan
    initial_state: PLANNED
    terminal_states: [ON_AIR]
    transitions:
      - from: PLANNED
        to: AT_RISK
        trigger: "POST /on-air-plans/{id}/reforecast"
        actor: ProgramDirector
        preconditions: ["status IN {PLANNED, RESET}", "risk_band after recomputation == HIGH"]
        side_effects: ["recomputes baseline_forecast_date, risk_adjusted_forecast_date, schedule_risk_score, risk_band, driver_candidate_id", "status = AT_RISK", "increments OnAirPlan.version by 1"]
      - from: AT_RISK
        to: PLANNED
        trigger: "POST /on-air-plans/{id}/reforecast"
        actor: ProgramDirector
        preconditions: ["status == AT_RISK", "risk_band after recomputation IN {LOW, MEDIUM}"]
        side_effects: ["recomputes the forecast fields", "status = PLANNED", "increments OnAirPlan.version by 1"]
      - from: PLANNED
        to: RESET
        trigger: "POST /on-air-plans/{id}/reset"
        actor: ProgramDirector
        preconditions: ["status IN {PLANNED, AT_RISK}", "new_target_on_air_date > logical clock"]
        side_effects: ["target_on_air_date = new_target_on_air_date", "reset_count += 1", "recomputes the forecast fields", "status = RESET", "increments OnAirPlan.version by 1"]
      - from: AT_RISK
        to: RESET
        trigger: "POST /on-air-plans/{id}/reset"
        actor: ProgramDirector
        preconditions: ["status == AT_RISK", "new_target_on_air_date > logical clock"]
        side_effects: ["target_on_air_date = new_target_on_air_date", "reset_count += 1", "recomputes the forecast fields", "status = RESET", "increments OnAirPlan.version by 1"]
      - from: RESET
        to: PLANNED
        trigger: "POST /on-air-plans/{id}/reforecast"
        actor: ProgramDirector
        preconditions: ["status == RESET", "risk_band after recomputation IN {LOW, MEDIUM}"]
        side_effects: ["recomputes the forecast fields", "status = PLANNED", "increments OnAirPlan.version by 1"]
      - from: RESET
        to: AT_RISK
        trigger: "POST /on-air-plans/{id}/reforecast"
        actor: ProgramDirector
        preconditions: ["status == RESET", "risk_band after recomputation == HIGH"]
        side_effects: ["recomputes the forecast fields", "status = AT_RISK", "increments OnAirPlan.version by 1"]
        note: "A reset target that is still unreachable re-enters AT_RISK rather than stranding the plan in RESET."
      - from: PLANNED
        to: ON_AIR
        trigger: "POST /on-air-plans/{id}/activate"
        actor: ConstructionManager
        preconditions:
          - "status IN {PLANNED, AT_RISK, RESET}"
          - "SearchRing.status == SITE_SELECTED"
          - "the ring's selected Candidate has feasibility_status == BUILD_READY"
          - "the selected Candidate has at least one DELIVERED UtilityBackhaulOrder of order_type POWER and one of order_type FIBER"
          - "actual_on_air_date <= logical clock"
        side_effects:
          - "actual_on_air_date = supplied actual_on_air_date"
          - "variance_days = whole days between actual_on_air_date and target_on_air_date"
          - "status = ON_AIR"
          - "SearchRing.status = ON_AIR"
          - "increments OnAirPlan.version by 1"
      - from: AT_RISK
        to: ON_AIR
        trigger: "POST /on-air-plans/{id}/activate"
        actor: ConstructionManager
        preconditions: ["status == AT_RISK", "same preconditions as the PLANNED -> ON_AIR transition"]
        side_effects: ["same side effects as the PLANNED -> ON_AIR transition"]

concurrency_rules:
  - rule_id: structural-analysis-create-stale-candidate
    parent_entity: Candidate
    write_endpoint: "POST /structural-analyses"
    occ_field: "expected_candidate_version"
    description: |
      Creating a StructuralAnalysis against a Candidate whose version has advanced
      since the client last read it is rejected. A newer analysis legitimately
      supersedes the candidate's prior COMPLETED analysis and rewrites
      feasibility_status, so a writer holding a stale view of the candidate would
      supersede an analysis it never observed.
    error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412
  - rule_id: select-site-stale-ring
    parent_entity: SearchRing
    write_endpoint: "POST /search-rings/{id}/select-site"
    occ_field: "expected_search_ring_version"
    description: |
      Selecting the winning site on a SearchRing whose version has advanced since
      the client last read it is rejected. Selection legitimately supersedes an
      earlier selection after a reopen, so a writer holding a stale ring view
      would commit capex against a candidate pool it never observed.
    error_id: ERR_STALE_RING_VERSION
    http_status: 412

calculations:
  - name: rf_qualification_score
    trigger: "POST /candidates/{id}/rf-qualify (writes Candidate.rf_qualification_score)"
    algorithm: weighted_scoring
    formula: |
      ring = SearchRing[candidate.search_ring_id]
      rsrp_component     = clamp(50 + (candidate.measured_rsrp_dbm - ring.target_rsrp_dbm) * RSRP_POINTS_PER_DB, 0, 100)
      distance_component = clamp(100 * (1 - candidate.distance_from_center_m / ring.radius_m), 0, 100)
      height_component   = 100 if candidate.agl_m >= ring.required_agl_m
                           else clamp(100 * candidate.agl_m / ring.required_agl_m, 0, 100)
      capacity_component = 100 if ring.objective_type == COVERAGE
                           else clamp(100 * candidate.offered_capacity_gbps / ring.target_capacity_gbps, 0, 100)
      site_type_bonus    = SITE_TYPE_BONUS[candidate.site_type]
      availability_penalty = AVAILABILITY_PENALTY_PER_MONTH * max(0, candidate.months_to_availability - AVAILABILITY_GRACE_MONTHS)
      raw = W_RSRP * rsrp_component + W_DISTANCE * distance_component
          + W_HEIGHT * height_component + W_CAPACITY * capacity_component
          + site_type_bonus - availability_penalty
      rf_qualification_score = round(clamp(raw, 0, 100), 2)      # single final rounding; components stay unrounded
      qualification: score >= RF_QUALIFY_MIN_SCORE -> feasibility_status RF_QUALIFIED, else DISQUALIFIED
    input_set: "the single Candidate named in the path plus its SearchRing (candidate.search_ring_id); no aggregation over siblings"
    constants:
      RSRP_POINTS_PER_DB: 5
      W_RSRP: 0.35
      W_DISTANCE: 0.25
      W_HEIGHT: 0.20
      W_CAPACITY: 0.20
      SITE_TYPE_BONUS: { TOWER: 10, ROOFTOP: 5, RAW_LAND: 0 }
      AVAILABILITY_PENALTY_PER_MONTH: 2.5
      AVAILABILITY_GRACE_MONTHS: 6
      RF_QUALIFY_MIN_SCORE: 55.00
    precision: "2 decimal places, round_half_up, applied once to the clamped raw score"

  - name: lease_committed_rent
    trigger: "POST /leases/{id}/rounds with action ACCEPT (provisional variant) and POST /leases/{id}/execute (final variant)"
    algorithm: aggregation
    formula: |
      annual_rent(y) =                                     # y is the 1-based lease year
        FIXED_PCT   -> lease.base_monthly_rent_usd * 12 * (1 + lease.escalation_pct) ** (y - 1)
        CPI_CAPPED  -> lease.base_monthly_rent_usd * 12 * (1 + min(lease.escalation_pct, lease.cpi_cap_pct)) ** (y - 1)
        FLAT_STEP   -> (lease.base_monthly_rent_usd + lease.escalation_step_usd * (y - 1)) * 12
      ROUNDING ORDER (PINNED): round EACH lease year to cents FIRST, then sum the rounded years.
        per_year(y) = round(annual_rent(y), 2)
      provisional_total = round(sum(per_year(y) for y in 1..lease.initial_term_years), 2)
      total_years       = lease.initial_term_years + lease.renewal_option_count * lease.renewal_term_years
      base_total        = round(sum(per_year(y) for y in 1..total_years), 2)
      revenue_share_uplift = round(base_total * lease.revenue_share_pct, 2)
      final_total       = round(base_total + revenue_share_uplift, 2)
      delta             = round(final_total - provisional_total, 2)
    input_set: "the single LeaseAgreement named in the path; lease years 1..initial_term_years for the provisional variant, 1..(initial_term_years + renewal_option_count * renewal_term_years) for the final variant"
    constants:
      ROUNDING_ORDER: "round_per_lease_year_then_sum"
    precision: "2 decimal places, round_half_up per lease year and again on each total; summing first and rounding once is explicitly WRONG"
    variants:
      - name: provisional
        when: "written to committed_rent_provisional_usd when a negotiation round is ACCEPTED"
        difference: "horizon is the initial term only; renewal options are ignored and revenue_share_pct is not applied"
      - name: final
        when: "written to committed_rent_final_usd when the lease is EXECUTED"
        difference: "horizon assumes every renewal option is exercised and adds the revenue_share_pct uplift on the whole-horizon base total"

  - name: lease_rent_variance
    trigger: "POST /leases/{id}/rounds with action SUBMIT, COUNTER or REVISE (writes LeaseAgreement.rent_variance_pct)"
    algorithm: threshold
    formula: |
      ring = SearchRing[Candidate[lease.candidate_id].search_ring_id]
      rent_variance_pct = round(100 * (lease.last_counter_rent_usd - ring.market_benchmark_monthly_rent_usd)
                                    / ring.market_benchmark_monthly_rent_usd, 2)
      gate on ACCEPT: rent_variance_pct > MAX_RENT_VARIANCE_PCT -> ERR_RENT_VARIANCE_EXCEEDED
                      (exactly MAX_RENT_VARIANCE_PCT is permitted)
    input_set: "the lease's last_counter_rent_usd and the market benchmark of the ring reached through candidate.search_ring_id"
    constants:
      MAX_RENT_VARIANCE_PCT: 15.00
    precision: "2 decimal places, round_half_up; the threshold comparison uses the rounded value"

  - name: structural_capacity_utilization
    trigger: "POST /structural-analyses/{id}/complete (writes StructuralAnalysis.capacity_utilization_pct and result)"
    algorithm: threshold
    formula: |
      appurtenance_load_pct = APPURTENANCE_LOAD_PCT_EACH * analysis.appurtenance_count
      wind_factor = (analysis.wind_speed_mph / BASE_WIND_MPH) ** 2
      ice_factor  = 1 + ICE_FACTOR_PER_INCH * analysis.ice_thickness_in
      code_factor = CODE_FACTOR[analysis.analysis_type]
      proposed_load_pct = (NEW_ANTENNA_LOAD_PCT + appurtenance_load_pct) * wind_factor * ice_factor
      capacity_utilization_pct = round((analysis.existing_load_pct + proposed_load_pct) * code_factor, 2)
      result = PASS          if capacity_utilization_pct <= PASS_MAX_PCT
             = PASS_WITH_MOD if capacity_utilization_pct <= MOD_MAX_PCT
             = FAIL          otherwise
    input_set: "the single StructuralAnalysis named in the path; no sibling analyses are considered (older ones are SUPERSEDED)"
    constants:
      NEW_ANTENNA_LOAD_PCT: 9.5
      APPURTENANCE_LOAD_PCT_EACH: 1.8
      BASE_WIND_MPH: 90
      ICE_FACTOR_PER_INCH: 0.15
      CODE_FACTOR: { TIA_222_H: 1.00, TIA_222_G: 0.95 }
      PASS_MAX_PCT: 85.00
      MOD_MAX_PCT: 100.00
    precision: "2 decimal places, round_half_up applied once at the end; intermediate factors stay unrounded"

  - name: zoning_fee_total
    trigger: "POST /zoning-applications/{id}/submit (writes ZoningApplication.zoning_fee_total_usd)"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED TO EXACTLY THESE FOUR STEPS - NO RE-DERIVATION, NO ITERATION:
        step 1: subtotal = BASE_FEE[application_type]
                         + VISUAL_SIM_FEE * visual_simulation_count
                         + (HISTORIC_SURCHARGE if Jurisdiction.historic_district_flag else 0)
        step 2: expedite_rate = EXPEDITE_TIER keyed on the STEP-1 SUBTOTAL:
                  subtotal >= 6000 -> 0.12 ; subtotal >= 4000 -> 0.08 ; else 0.04
        step 3: expedite_fee = round(subtotal * expedite_rate, 2)
        step 4: zoning_fee_total_usd = round(subtotal + expedite_fee, 2)
      The tier is keyed on the subtotal, NOT on the final total; re-deriving the tier
      from the step-4 total (which the expedite fee itself inflates) is explicitly WRONG.
    input_set: "the single ZoningApplication named in the path plus the Jurisdiction reached through candidate.jurisdiction_id"
    constants:
      BASE_FEE: { BY_RIGHT: 1500.00, CONDITIONAL_USE: 3200.00, VARIANCE: 4800.00 }
      VISUAL_SIM_FEE: 250.00
      HISTORIC_SURCHARGE: 900.00
      EXPEDITE_TIER: { "6000_and_up": 0.12, "4000_to_5999": 0.08, "below_4000": 0.04 }
    precision: "2 decimal places, round_half_up on the expedite fee and again on the total"

  - name: zoning_shot_clock_deadline
    trigger: "POST /zoning-applications/{id}/submit and POST /zoning-applications/{id}/completeness with outcome CURED (writes ZoningApplication.shot_clock_deadline_date)"
    algorithm: chronological
    formula: |
      review_days = Jurisdiction.by_right_review_days          if application_type == BY_RIGHT
                  = Jurisdiction.conditional_use_review_days   if application_type == CONDITIONAL_USE
                  = Jurisdiction.variance_review_days          if application_type == VARIANCE
      on CURED: tolled_days += floor((logical_clock - incomplete_since_date) / 1 day)   # whole UTC days, floor
      shot_clock_deadline_date = submitted_date + review_days days + tolled_days days
      deemed-granted gate: logical_clock > shot_clock_deadline_date (strictly greater; equality is NOT expired)
    input_set: "the single ZoningApplication plus its Jurisdiction; tolling accrues once per INCOMPLETE -> UNDER_REVIEW cure, in cure order"
    constants:
      TOLLING_ROUNDING: "floor to whole UTC days"
    precision: "whole days; deadline stored as an ISO 8601 UTC instant"

  - name: tribal_consultation_scope
    trigger: "POST /environmental-reviews (writes EnvironmentalReview.tribal_consultation_required) and POST /environmental-reviews/{id}/screen (writes tribal_response_deadline_date)"
    algorithm: constraint_propagation
    formula: |
      candidate = Candidate[review.candidate_id]
      tribal_consultation_required = Jurisdiction[candidate.jurisdiction_id].tribal_consultation_required
                                     OR Landlord[candidate.landlord_id].entity_type == TRIBAL_AUTHORITY
      on screen, when tribal_consultation_required:
        tcns_notice_date = logical clock
        tribal_response_deadline_date = tcns_notice_date + TRIBAL_RESPONSE_DAYS days
      the TRIBAL branch may be closed only when logical_clock >= tribal_response_deadline_date
      (equality closes the branch; one second earlier does not)
    input_set: "the review's Candidate, that candidate's Jurisdiction and Landlord"
    constants:
      TRIBAL_RESPONSE_DAYS: 30
    precision: "whole days; deadline stored as an ISO 8601 UTC instant"

  - name: on_air_schedule_forecast
    trigger: "POST /on-air-plans, POST /on-air-plans/{id}/reforecast, POST /on-air-plans/{id}/reset (writes baseline_forecast_date, risk_adjusted_forecast_date, schedule_risk_score, risk_band, driver_candidate_id) and GET /on-air-plans/{id}/forecast"
    algorithm: forward_looking
    formula: |
      DRIVER SELECTION (explicit, no id involvement):
        if ring.selected_candidate_id != null -> driver = that candidate
        else eligibility filter: Candidates of the ring with acquisition_status != RELINQUISHED
                                 AND feasibility_status != DISQUALIFIED
             ranking: rf_qualification_score DESC (null scores rank last)
             tie-break: created_at ASC
             empty pool -> ERR_NO_ELIGIBLE_CANDIDATE
      REMAINING WORK (whole days, summed in this fixed order):
        structural_days = STRUCTURAL_DAYS if driver.feasibility_status IN {UNSCREENED, RF_QUALIFIED, STRUCTURAL_HOLD} else 0
        env_days        = ENV_DAYS        if driver.environmental_cleared == false else 0
        zoning_app      = the driver's ZoningApplication with status NOT IN {WITHDRAWN, DENIED}
                          (validations priority 55 guarantees at most one such row)
        zoning_days     = 0 if zoning_app exists AND zoning_app.status IN {APPROVED, DEEMED_GRANTED}
                          else review_days for zoning_app.application_type
                          else Jurisdiction.conditional_use_review_days when no such application exists
        permit_days     = PERMIT_DAYS if driver.permit_issued == false else 0
        backhaul_days   = 0 if the driver has a DELIVERED order of order_type POWER AND one of order_type FIBER
                          else max(0, whole days from the logical clock to the greatest window_end over the
                                   driver's orders with status IN {REQUESTED, SCHEDULED})
                          else BACKHAUL_DEFAULT_DAYS when the driver has no order at all
        remaining_days = structural_days + env_days + zoning_days + permit_days + backhaul_days
        continuance_count = zoning_app.continuance_count if zoning_app exists else 0
      VARIANT baseline:      baseline_forecast_date = logical_clock + remaining_days days
      VARIANT risk_adjusted: risk_days = ceil(remaining_days * Jurisdiction.historical_delay_factor)
                                        + continuance_count * Jurisdiction.hearing_cadence_days
                             risk_adjusted_forecast_date = logical_clock + risk_days days
      slip_days = whole days (risk_adjusted_forecast_date - target_on_air_date)      # negative when early
      schedule_risk_score = round(clamp(RISK_BASE + SLIP_DAY_WEIGHT * slip_days
                                        + CONTINUANCE_WEIGHT * continuance_count
                                        + (STRUCTURAL_HOLD_PENALTY if driver.feasibility_status == STRUCTURAL_HOLD else 0),
                                        0, 100), 2)
      risk_band = HIGH   if schedule_risk_score >= HIGH_BAND_MIN
                = MEDIUM if schedule_risk_score >= MEDIUM_BAND_MIN
                = LOW    otherwise
      variance_days (on activate) = whole days (actual_on_air_date - target_on_air_date)
    input_set: "the plan's SearchRing, the driver candidate resolved above, that candidate's non-withdrawn/non-denied ZoningApplication, its Jurisdiction, and its UtilityBackhaulOrders with status IN {REQUESTED, SCHEDULED, DELIVERED}"
    constants:
      STRUCTURAL_DAYS: 21
      ENV_DAYS: 30
      PERMIT_DAYS: 25
      BACKHAUL_DEFAULT_DAYS: 45
      RISK_BASE: 50
      SLIP_DAY_WEIGHT: 2.0
      CONTINUANCE_WEIGHT: 5
      STRUCTURAL_HOLD_PENALTY: 10
      HIGH_BAND_MIN: 70.00
      MEDIUM_BAND_MIN: 40.00
    precision: "score to 2 decimal places, round_half_up; risk_days uses ceil on the delay-factor product; all date arithmetic in whole UTC days"
    variants:
      - name: baseline
        when: "written to baseline_forecast_date on every forecast write"
        difference: "uses nominal remaining days with no delay factor and no continuance penalty"
      - name: risk_adjusted
        when: "written to risk_adjusted_forecast_date and used for schedule_risk_score / risk_band"
        difference: "inflates remaining days by ceil(remaining_days * historical_delay_factor) and adds hearing_cadence_days per granted continuance"

  - name: site_selection_winner
    trigger: "POST /search-rings/{id}/select-site (writes SearchRing.selected_candidate_id)"
    algorithm: weighted_scoring
    formula: |
      eligibility filter: Candidates with search_ring_id == ring.id
                          AND acquisition_status == LEASE_EXECUTED
                          AND feasibility_status == BUILD_READY
      ranking: rf_qualification_score DESC
      tie-break 1: the EXECUTED LeaseAgreement's committed_rent_final_usd ASC (cheapest total rent wins)
      tie-break 2: Candidate.created_at ASC
      empty pool: ERR_NO_ELIGIBLE_CANDIDATE (409); no candidate is selected and the ring stays OPEN
    input_set: "Candidates of this ring in exactly the two states above; RELINQUISHED and DISQUALIFIED candidates are excluded"
    constants:
      TIE_BREAK_CHAIN: "rf_qualification_score DESC, committed_rent_final_usd ASC, created_at ASC"
    precision: "exact comparison on stored 2-decimal values; ids never participate"

  - name: ring_committed_capex
    trigger: "POST /modification-designs/{id}/peer-review with action CERTIFY, POST /structural-analyses/{id}/complete, candidate RELINQUISHED/DISQUALIFIED cascades, POST /search-rings/{id}/select-site, POST /search-rings/{id}/reopen (writes SearchRing.committed_capex_usd)"
    algorithm: aggregation
    formula: |
      committed_capex_usd = round(sum(design.estimated_cost_usd
        for design in ModificationDesign
        where design.status == CERTIFIED
          and StructuralAnalysis[design.structural_analysis_id].status == COMPLETED
          and Candidate[analysis.candidate_id].search_ring_id == ring.id
          and Candidate.acquisition_status != RELINQUISHED
          and Candidate.feasibility_status != DISQUALIFIED), 2)
      budget gate on CERTIFY: the recomputed committed_capex_usd > ring.capex_budget_usd
                              -> ERR_CAPEX_BUDGET_EXCEEDED (equality is permitted)
    input_set: "ModificationDesign rows with status == CERTIFIED whose analysis is COMPLETED and whose candidate belongs to this ring and is neither RELINQUISHED nor DISQUALIFIED; window is all time; the sum is order-insensitive so no tie-break is needed"
    constants:
      BUDGET_COMPARISON: "committed_capex_usd <= capex_budget_usd passes"
    precision: "2 decimal places, round_half_up on the sum"

  - name: provider_crew_day_ledger
    trigger: "POST /backhaul-orders (writes crew_days) and POST /backhaul-orders/{id}/status-actions (recomputes UtilityProvider.committed_crew_days)"
    algorithm: interval_merge
    formula: |
      crew_days = floor((order.window_end - order.window_start) / 1 day)      # half-open [start, end)
      crew_days <= 0 -> ERR_INVALID_WINDOW
      committed_crew_days(provider) = sum(o.crew_days for o in provider's orders
                                          where o.status IN {REQUESTED, SCHEDULED})
      CONCURRENCY GATE on create: for every UTC day d covered by the new half-open window,
        count(existing orders o of the same provider with o.status IN {REQUESTED, SCHEDULED}
              and o.window_start <= d < o.window_end) + 1 <= provider.concurrent_crew_capacity
        else ERR_PROVIDER_CAPACITY_EXCEEDED.
        Because the interval is half-open, an order starting exactly at another order's
        window_end shares no day and never conflicts.
      INVARIANT: committed_crew_days == sum of crew_days over the provider's REQUESTED/SCHEDULED
                 orders after every create, SCHEDULE, CANCEL and DELIVER.
    input_set: "UtilityBackhaulOrder rows of the same provider_id with status IN {REQUESTED, SCHEDULED}; DELIVERED and CANCELLED rows are excluded from both the sum and the day-coverage count"
    constants:
      INTERVAL_SEMANTICS: "half_open_start_inclusive_end_exclusive"
    precision: "whole days"

  - name: landlord_executed_lease_ledger
    trigger: "POST /leases/{id}/execute, POST /leases/{id}/terminate and the landlord-blacklist cascade (recomputes Landlord.executed_lease_count)"
    algorithm: aggregation
    formula: |
      executed_lease_count = count(lease for lease in LeaseAgreement
                                   where lease.landlord_id == landlord.id
                                     and lease.status == EXECUTED)
      INVARIANT: executed_lease_count equals that count after every execute, terminate and
                 blacklist cascade; an execute followed by its terminate leaves the count
                 exactly as it was before the execute.
    input_set: "LeaseAgreement rows with landlord_id == landlord.id and status == EXECUTED; all other statuses excluded; window is all time"
    constants:
      COUNTED_STATUS: "EXECUTED"
    precision: "integer count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "body contains every required input field, no unknown fields, types and enum members valid, numeric constraints (>= 0, > 0) respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: business_constraint
    check: "limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 5
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: ERR_SEARCH_RING_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_LANDLORD_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_ZONING_APPLICATION_NOT_FOUND | ERR_STRUCTURAL_ANALYSIS_NOT_FOUND | ERR_MODIFICATION_DESIGN_NOT_FOUND | ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_UTILITY_PROVIDER_NOT_FOUND | ERR_BACKHAUL_ORDER_NOT_FOUND | ERR_ON_AIR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 6
    category: existence
    check: "every foreign-key id in the body exists, validated in the order the fields are declared in §1.1"
    error_id: ERR_SEARCH_RING_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_LANDLORD_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_STRUCTURAL_ANALYSIS_NOT_FOUND | ERR_UTILITY_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /candidates, POST /leases, POST /zoning-applications, POST /structural-analyses, POST /modification-designs, POST /environmental-reviews, POST /construction-permits, POST /backhaul-orders, POST /on-air-plans"
  - priority: 8
    category: business_temporal
    check: "window_end is strictly after window_start and the half-open window spans at least one whole UTC day"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /backhaul-orders"
  - priority: 10
    category: business_referential
    check: "Jurisdiction.market_code and Landlord.market_code both equal SearchRing.market_code"
    error_id: ERR_MARKET_MISMATCH
    http_status: 409
    applies_to: "POST /candidates"
  - priority: 12
    category: business_referential
    check: "lease.landlord_id equals Candidate.landlord_id"
    error_id: ERR_LANDLORD_MISMATCH
    http_status: 409
    applies_to: "POST /leases"
  - priority: 14
    category: business_constraint
    check: "the acting SiteAcquisitionAgent's X-User-ID equals Candidate.owning_agent_user_id"
    error_id: ERR_NOT_CANDIDATE_OWNER
    http_status: 403
    applies_to: "PATCH /candidates/{id}, POST /candidates/{id}/outreach-events, POST /leases, POST /leases/{id}/rounds"
  - priority: 16
    category: business_safety
    check: "the acting user is not the same person as the counterpart of the duty: the executing ProgramDirector's X-User-ID differs from LeaseAgreement.negotiating_agent_user_id; the certifying StructuralEngineer's X-User-ID differs from both ModificationDesign.designed_by_user_id and StructuralAnalysis.performed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /leases/{id}/execute, POST /modification-designs/{id}/peer-review"
  - priority: 18
    category: business_referential
    check: "Landlord.outreach_optout is false"
    error_id: ERR_LANDLORD_OPTED_OUT
    http_status: 409
    applies_to: "POST /candidates/{id}/outreach-events, POST /leases"
  - priority: 20
    category: state
    check: "expected_candidate_version equals Candidate.version / expected_search_ring_version equals SearchRing.version"
    error_id: ERR_STALE_CANDIDATE_VERSION | ERR_STALE_RING_VERSION
    http_status: 412
    applies_to: "POST /structural-analyses, POST /search-rings/{id}/select-site"
  - priority: 25
    category: state
    check: "SearchRing.status == OPEN"
    error_id: ERR_RING_NOT_OPEN
    http_status: 409
    applies_to: "POST /candidates/{id}/rf-qualify, POST /search-rings/{id}/select-site"
  - priority: 26
    category: state
    check: "SearchRing.status matches the transition's from-state (open requires DRAFT, reopen requires SITE_SELECTED)"
    error_id: ERR_INVALID_RING_STATE
    http_status: 409
    applies_to: "POST /search-rings/{id}/open, POST /search-rings/{id}/reopen"
  - priority: 27
    category: state
    check: "the candidate's acquisition_status and feasibility_status satisfy the transition's from-states (mark-build-ready requires acquisition_status == LEASE_EXECUTED and feasibility_status IN {STRUCTURALLY_CLEARED, ENTITLED})"
    error_id: ERR_INVALID_CANDIDATE_STATE
    http_status: 409
    applies_to: "POST /candidates/{id}/outreach-events, POST /candidates/{id}/rf-qualify, POST /candidates/{id}/mark-build-ready, POST /structural-analyses, PATCH /candidates/{id}"
  - priority: 28
    category: state
    check: "LeaseAgreement.status permits the requested round action / execution / termination"
    error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    applies_to: "POST /leases/{id}/rounds, POST /leases/{id}/execute, POST /leases/{id}/terminate"
  - priority: 29
    category: state
    check: "ZoningApplication.status permits the requested action"
    error_id: ERR_INVALID_ZONING_STATE
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/visual-simulations, POST /zoning-applications/{id}/submit, POST /zoning-applications/{id}/completeness, POST /zoning-applications/{id}/hearings, POST /zoning-applications/{id}/decide, POST /zoning-applications/{id}/deem-granted"
  - priority: 30
    category: state
    check: "the referenced StructuralAnalysis.status == COMPLETED (a SUPERSEDED or IN_PROGRESS analysis cannot back a design action)"
    error_id: ERR_ANALYSIS_SUPERSEDED
    http_status: 409
    applies_to: "POST /modification-designs, POST /modification-designs/{id}/peer-review"
  - priority: 31
    category: state
    check: "StructuralAnalysis.status == IN_PROGRESS for completion"
    error_id: ERR_INVALID_ANALYSIS_STATE
    http_status: 409
    applies_to: "POST /structural-analyses/{id}/complete"
  - priority: 32
    category: state
    check: "ModificationDesign.status permits the requested peer-review action and the analysis result is PASS_WITH_MOD for SUBMIT"
    error_id: ERR_INVALID_DESIGN_STATE
    http_status: 409
    applies_to: "POST /modification-designs/{id}/peer-review"
  - priority: 33
    category: state
    check: "EnvironmentalReview.status and the named branch status permit the action (screen requires NOT_STARTED; branch-complete requires the branch PENDING)"
    error_id: ERR_INVALID_REVIEW_STATE
    http_status: 409
    applies_to: "POST /environmental-reviews/{id}/screen, POST /environmental-reviews/{id}/branch-complete"
  - priority: 34
    category: state
    check: "ConstructionPermit.status permits the action (issue requires SUBMITTED, revoke requires ISSUED)"
    error_id: ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "POST /construction-permits/{id}/issue, POST /construction-permits/{id}/revoke"
  - priority: 35
    category: state
    check: "UtilityBackhaulOrder.status permits the action"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /backhaul-orders/{id}/status-actions"
  - priority: 36
    category: state
    check: "OnAirPlan.status permits the action and SearchRing.status == SITE_SELECTED for activate"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "POST /on-air-plans, POST /on-air-plans/{id}/reforecast, POST /on-air-plans/{id}/reset, POST /on-air-plans/{id}/activate"
  - priority: 41
    category: business_safety
    check: "Candidate.environmental_cleared == true"
    error_id: ERR_ENVIRONMENTAL_NOT_CLEARED
    http_status: 409
    applies_to: "POST /candidates/{id}/mark-build-ready, POST /construction-permits/{id}/issue"
  - priority: 42
    category: business_safety
    check: "the TRIBAL branch is closed only when the logical clock is at or after tribal_response_deadline_date"
    error_id: ERR_TRIBAL_RESPONSE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /environmental-reviews/{id}/branch-complete"
  - priority: 45
    category: business_referential
    check: "Candidate.permit_issued == true and the candidate has a ConstructionPermit with status == ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /candidates/{id}/mark-build-ready"
  - priority: 46
    category: business_referential
    check: "the candidate's ISSUED permit has not passed expiry_date at the current logical clock"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /candidates/{id}/mark-build-ready"
  - priority: 47
    category: business_referential
    check: "Candidate.feasibility_status IN {ENTITLED, BUILD_READY} (the candidate's ZoningApplication reached APPROVED or DEEMED_GRANTED)"
    error_id: ERR_ZONING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /construction-permits/{id}/issue"
  - priority: 48
    category: business_referential
    check: "Landlord.standing == ACTIVE"
    error_id: ERR_LANDLORD_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /leases/{id}/rounds with action SUBMIT, POST /leases/{id}/execute"
  - priority: 49
    category: business_referential
    check: "Candidate.acquisition_status == LEASE_EXECUTED"
    error_id: ERR_LEASE_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/submit"
  - priority: 50
    category: business_referential
    check: "the ring's selected candidate has feasibility_status == BUILD_READY"
    error_id: ERR_CANDIDATE_NOT_BUILD_READY
    http_status: 409
    applies_to: "POST /on-air-plans/{id}/activate"
  - priority: 51
    category: business_referential
    check: "the ring's selected candidate has at least one DELIVERED UtilityBackhaulOrder of order_type POWER and at least one of order_type FIBER"
    error_id: ERR_BACKHAUL_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /on-air-plans/{id}/activate"
  - priority: 52
    category: business_constraint
    check: "when Jurisdiction.requires_visual_simulation is true, visual_simulation_count >= Jurisdiction.min_visual_simulations"
    error_id: ERR_VISUAL_SIMULATION_REQUIRED
    http_status: 422
    applies_to: "POST /zoning-applications/{id}/submit"
  - priority: 53
    category: business_constraint
    check: "continuance_count < Jurisdiction.max_continuances"
    error_id: ERR_CONTINUANCE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/hearings with action CONTINUE"
  - priority: 54
    category: business_constraint
    check: "round_count < MAX_NEGOTIATION_ROUNDS (6)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /leases/{id}/rounds with action SUBMIT, COUNTER or REVISE"
  - priority: 55
    category: business_constraint
    check: "the candidate has no other ZoningApplication whose status is NOT IN {WITHDRAWN, DENIED}"
    error_id: ERR_DUPLICATE_ZONING_APPLICATION
    http_status: 409
    applies_to: "POST /zoning-applications"
  - priority: 56
    category: business_constraint
    check: "the candidate has no other EnvironmentalReview whose status is NOT IN {ADVERSE_EFFECT}"
    error_id: ERR_DUPLICATE_ENVIRONMENTAL_REVIEW
    http_status: 409
    applies_to: "POST /environmental-reviews"
  - priority: 58
    category: business_temporal
    check: "no other ZoningApplication in the same Jurisdiction has a hearing_date strictly within Jurisdiction.hearing_cadence_days whole days of the requested hearing_date (a separation exactly equal to the cadence is allowed)"
    error_id: ERR_HEARING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/hearings with action SCHEDULE or CONTINUE"
  - priority: 59
    category: business_temporal
    check: "for every UTC day covered by the new half-open crew window, the count of the provider's REQUESTED/SCHEDULED orders covering that day plus one does not exceed concurrent_crew_capacity"
    error_id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /backhaul-orders"
  - priority: 60
    category: business_temporal
    check: "the logical clock is strictly after shot_clock_deadline_date"
    error_id: ERR_SHOT_CLOCK_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/deem-granted"
  - priority: 61
    category: business_temporal
    check: "hearing_date is at or after the current logical clock"
    error_id: ERR_HEARING_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /zoning-applications/{id}/hearings with action SCHEDULE or CONTINUE"
  - priority: 62
    category: business_temporal
    check: "the logical clock is at or after hearing_date"
    error_id: ERR_HEARING_NOT_YET_HELD
    http_status: 409
    applies_to: "POST /zoning-applications/{id}/hearings with action HOLD"
  - priority: 63
    category: business_temporal
    check: "supplied historical dates (execution_date, decision_date, issued_date, delivered_date, actual_on_air_date) are not after the current logical clock"
    error_id: ERR_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /leases/{id}/execute, POST /zoning-applications/{id}/decide, POST /construction-permits/{id}/issue, POST /backhaul-orders/{id}/status-actions with action DELIVER, POST /on-air-plans/{id}/activate"
  - priority: 64
    category: business_temporal
    check: "decision_date is at or after submitted_date"
    error_id: ERR_DECISION_DATE_INVALID
    http_status: 422
    applies_to: "POST /zoning-applications/{id}/decide"
  - priority: 65
    category: business_temporal
    check: "new_target_on_air_date is strictly after the current logical clock"
    error_id: ERR_TARGET_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /on-air-plans/{id}/reset"
  - priority: 70
    category: business_fiscal
    check: "the recomputed SearchRing.committed_capex_usd including this design does not exceed SearchRing.capex_budget_usd (equality passes)"
    error_id: ERR_CAPEX_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /modification-designs/{id}/peer-review with action CERTIFY"
  - priority: 71
    category: business_fiscal
    check: "rent_variance_pct <= MAX_RENT_VARIANCE_PCT (15.00; equality passes)"
    error_id: ERR_RENT_VARIANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /leases/{id}/rounds with action ACCEPT"
  - priority: 75
    category: business_constraint
    check: "the selector's eligible candidate pool is non-empty"
    error_id: ERR_NO_ELIGIBLE_CANDIDATE
    http_status: 409
    applies_to: "POST /search-rings/{id}/select-site, POST /on-air-plans, POST /on-air-plans/{id}/reforecast"

endpoints:
  # --- test-driving surface (logical clock) -----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to wall-clock time."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock moves to to_iso8601", "no entity is mutated; permit expiry is re-evaluated lazily when a permit is next read or relied upon"]

  # --- SearchRing -------------------------------------------------------------
  - method: POST
    path: "/search-rings"
    description: "Creates an RF search ring in DRAFT."
    roles: [RfEngineer]
    code: 201
    input: [name, market_code, center_lat, center_lon, radius_m, required_agl_m, objective_type, target_rsrp_dbm, target_capacity_gbps, market_benchmark_monthly_rent_usd, capex_budget_usd, priority_rank]
    output: SearchRing
    side_effects: ["status = DRAFT", "candidate_count = 0", "committed_capex_usd = 0", "reopen_count = 0"]
  - method: GET
    path: "/search-rings/{id}"
    description: "Reads one search ring (including version for OCC)."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: []
    output: SearchRing
    side_effects: []
  - method: GET
    path: "/search-rings"
    description: "Lists search rings with pagination; filterable by market, status and selected candidate (reverse lookup for SearchRing.selected_candidate_id)."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: ["market_code?", "status?", "selected_candidate_id?", "limit?", "offset?"]
    output: SearchRing[]
    side_effects: []
  - method: POST
    path: "/search-rings/{id}/open"
    description: "Opens a DRAFT ring for candidate development."
    roles: [RfEngineer]
    code: 200
    input: []
    output: SearchRing
    side_effects: ["status = OPEN", "increments SearchRing.version by 1"]
  - method: POST
    path: "/search-rings/{id}/select-site"
    description: "Selects the winning candidate for an OPEN ring using the selector in calculations.site_selection_winner. Guarded by OCC on the ring's version."
    roles: [ProgramDirector]
    code: 200
    input: [expected_search_ring_version]
    output: SearchRing
    side_effects: ["selected_candidate_id = selector winner (calculations.site_selection_winner)", "status = SITE_SELECTED", "recomputes committed_capex_usd (calculations.ring_committed_capex)", "increments SearchRing.version by 1"]
  - method: POST
    path: "/search-rings/{id}/reopen"
    description: "Compensating action that undoes a site selection and returns the ring to OPEN."
    roles: [ProgramDirector]
    code: 200
    input: [reason]
    output: SearchRing
    side_effects: ["selected_candidate_id = null", "status = OPEN", "reopen_count += 1", "recomputes committed_capex_usd (calculations.ring_committed_capex)", "increments SearchRing.version by 1"]

  # --- Landlord ---------------------------------------------------------------
  - method: POST
    path: "/landlords"
    description: "Registers a landlord."
    roles: [SiteAcquisitionAgent]
    code: 201
    input: [legal_name, entity_type, contact_email, market_code, "outreach_optout?"]
    output: Landlord
    side_effects: ["standing = ACTIVE", "executed_lease_count = 0"]
  - method: GET
    path: "/landlords/{id}"
    description: "Reads one landlord."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/landlords/{id}/standing"
    description: "Sets a landlord's commercial standing. BLACKLISTED triggers cascade B."
    roles: [ProgramDirector]
    code: 200
    input: [standing, "reason?"]
    output: Landlord
    side_effects:
      - "standing = supplied value"
      - "when BLACKLISTED: each LeaseAgreement of this landlord with status == EXECUTED -> TERMINATED (link 2)"
      - "each terminated lease drives its Candidate.acquisition_status -> RELINQUISHED (link 3)"
      - "each relinquished candidate recomputes SearchRing.candidate_count / committed_capex_usd and clears the ring's selection when it was the selected candidate (link 4)"
      - "recomputes executed_lease_count (calculations.landlord_executed_lease_ledger)"
      - "increments Landlord.version by 1"

