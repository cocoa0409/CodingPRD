              as_user_id: "${cdocc1}"
            - call: "GET /wholesale/allocation-runs/${crunocc1}/dealer-allocations"
              payload: { dealer_id: "${cdocc1}" }
              as: RegionalAllocator
              captures: { cdaocc_v2: "$.data[0].version" }
          assert:
            - "cdaocc_v0 == 1 (creation), cdaocc_v1 == 2 (publish recompute), cdaocc_v2 == 3 (order accept)"
