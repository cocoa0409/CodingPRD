# =============================================================================
# SCAFFOLD.yaml — Fresh-Cut Produce Processing (§1.0–§1.7)
# Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Corner design   (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2941. Fresh-Cut Produce Processing (fresh-cut vegetable processor): raw product
  receiving with grower lot identification, temperature verification and testing
  programs, trimming, cutting and washing lines with wash water antimicrobial
  concentration monitoring and change-out schedules, product-specific processing
  parameters with dwell time, spin drying and packaging atmosphere, allergen and
  cross-contamination controls between product changeovers with sanitation
  validation, shelf-life determination with hold-and-release testing and code
  date assignment, traceability from grower lot through finished case for rapid
  recall, sanitation shift with equipment disassembly, environmental monitoring
  and corrective action on positive findings, customer specification management
  across foodservice and retail formats

domain_name: fresh-cut-produce-processing

# All business resources are mounted at the server root (flat, peer collections:
# /products, /lines, /wash-systems, /process-runs, ...). The empty prefix is
# deliberate: this API has no single top-level aggregate — grower lots, lines,
# wash systems and runs are peers joined by foreign keys and by the
# LotConsumption junction.
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # Peer aggregates joined by FKs plus a true many-to-many junction
  # (LotConsumption links ProcessRun x RawReceipt) plus a self-referential edge
  # (ProcessRun.rework_source_run_id). Recall traversal walks the resulting DAG
  # in both directions, which is why the topology is graph rather than hybrid.

  state_machine_shape: parallel
  # ProcessRun carries two independent state dimensions (run_status x
  # disposition_status). Also present: a cyclic machine (HoldRecord retest
  # loop), a branching-with-revert machine (SanitationEvent validate ->
  # VALIDATED | FAILED -> re-clean), a cyclic CAPA machine (CorrectiveAction
  # verify FAIL -> IN_PROGRESS) and a compound/posture machine (Line.posture
  # derived from its sanitation, CAPA and swab children).

  relationship_patterns:
    - one_to_many          # Line -> SanitationEvent / EnvironmentalSwab / CorrectiveAction
    - many_to_many         # ProcessRun <-> RawReceipt through LotConsumption
    - self_referential     # ProcessRun.rework_source_run_id -> ProcessRun.id
    - polymorphic          # CorrectiveAction.source_ref_id resolves by source_type
    - cross_aggregate      # ProcessRun -> WashSystem / CustomerSpec across aggregates

  role_model: segregation_of_duties
  # Three named SoD controls: the technician who performed a sanitation cannot
  # validate it; the technician who recorded the release test result cannot
  # release the hold; the technician who implemented a corrective action cannot
  # verify it. All roles are `opaque` operator identities, so one human may hold
  # two roles - which is exactly what makes the SoD checks testable.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Surface is above the Expert bands of §0.4 (14 entities / 50 endpoints /
  # 54 errors). 19 of the 50 endpoints are read endpoints mandated by §1.5's
  # FK reverse-reachability rule, and every error code is triggerable from a
  # declared endpoint. The difficulty is carried by density, not volume: two
  # dual-variant calculations on different subjects, two five-hop cascades,
  # a frozen-at-start evaluation-order pin, an exact-cent allocation waterfall,
  # and posture gating that couples five entities to every run start.

  logical_clock_note: |
    Every server-stamped timestamp in this scaffold - `created_at`, `updated_at`,
    `ProcessRun.started_at`, `ProcessRun.closed_at`, `SanitationEvent.validated_at`,
    `HoldRecord.opened_at` / `closed_at`, `FinishedCase.shipped_at`,
    `GrowerLot.recalled_at`, `WashSystem.last_changeout_at`,
    `CorrectiveAction.opened_at` / `verified_at`, `EnvironmentalSwab.resulted_at` -
    reads the logical clock (§1.5 `POST /_clock/set_current_utc`), never the host
    wall clock. Because two rows created without an intervening clock advance
    therefore share `created_at`, every order-sensitive rule in §1.3 that could
    tie on `created_at` also pins a monotonic domain tie-break
    (`AntimicrobialReading.sequence_no`, `SanitationEvent.sequence_no`,
    `FinishedCase.case_sequence`, `CustomerSpec.spec_revision`).

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Product
    parent: null
    common_fields: true
    # Configuration entity. No lifecycle of its own; its `version` is the OCC
    # anchor for customer-specification authoring (§1.2.1).
    fields:
      - name: code
        type: string
        source: input
        description: "Plant product code, e.g. RML-SHRED"
        constraints: "Non-empty, unique across all Product rows (ERR_DUPLICATE_CODE)"
      - name: name
        type: string
        source: input
        description: "Human-readable product name"
      - name: commodity_class
        type: enum
        source: input
        description: "Soil/organic-load class driving the wash-water load factor"
        constraints: "One of LEAFY, ROOT, FRUIT"
      - name: allergen_group
        type: enum
        source: input
        description: "Allergen carried by this product; drives changeover sanitation"
        default: NONE
        constraints: "One of NONE, CELERY, SESAME, MUSTARD, SULFITE"
      - name: min_dwell_seconds
        type: integer
        source: input
        description: "Product-specific minimum wash flume dwell time in seconds"
        constraints: ">= 1"
      - name: min_spin_rpm
        type: integer
        source: input
        description: "Minimum spin-dryer speed; a slower run costs one shelf-life day"
        constraints: ">= 1"
      - name: min_antimicrobial_ppm
        type: number
        source: input
        description: "Minimum free chlorine ppm required in the wash water for this product"
        constraints: "> 0, two decimal places"
      - name: base_shelf_life_days
        type: integer
        source: input
        description: "Validated shelf life in days before customer and quality deductions"
        constraints: ">= 1"
      - name: min_yield_pct
        type: number
        source: input
        description: "Lowest acceptable case-weight-out over raw-pounds-in percentage"
        constraints: "0 < value <= 100, two decimal places"
      - name: hold_and_release_required
        type: boolean
        source: input
        description: "When true, closing a run automatically opens a HOLD_AND_RELEASE_TESTING hold"
        default: false
      - name: active_spec_count
        type: integer
        source: computed
        description: "Count of CustomerSpec rows for this product with status == ACTIVE"
        default: 0

  - name: CustomerSpec
    parent: Product
    common_fields: true
    # Customer specification management across foodservice and retail formats.
    # Creating a new spec for the same (product_id, channel) supersedes the prior
    # ACTIVE one, which is why authoring is OCC-guarded on Product.version.
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this specification governs"
      - name: customer_code
        type: string
        source: input
        description: "Customer account code, e.g. FSVC-NORTH"
      - name: channel
        type: enum
        source: input
        description: "Distribution format this specification serves"
        constraints: "One of FOODSERVICE, RETAIL"
      - name: spec_revision
        type: integer
        source: computed
        description: "1 + count of CustomerSpec rows with the same product_id and channel that existed before this one"
      - name: status
        type: enum
        source: system
        description: "ACTIVE until a newer spec for the same product_id and channel supersedes it"
        default: ACTIVE
        constraints: "One of ACTIVE, SUPERSEDED"
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this spec was superseded; null while ACTIVE"
      - name: max_shelf_life_days_offered
        type: integer
        source: input
        description: "Longest shelf life this customer accepts; caps the product base"
        constraints: ">= 1"
      - name: min_remaining_shelf_life_days_at_ship
        type: integer
        source: input
        description: "Days of code-date life that must remain on the ship date"
        constraints: ">= 0"
      - name: atmosphere_required
        type: enum
        source: input
        description: "Packaging atmosphere the customer requires"
        constraints: "One of AIR, MAP_LOW_O2, MAP_HIGH_CO2"
      - name: case_net_weight_lb
        type: number
        source: input
        description: "Net finished weight of one case in pounds"
        constraints: "> 0, two decimal places"
      - name: code_date_format
        type: enum
        source: input
        description: "Code-date label format printed on the case"
        constraints: "One of JULIAN, CALENDAR"

  - name: GrowerLot
    parent: null
    common_fields: true
    # Grower lot identification plus the preharvest testing program. Carries the
    # dual-variant risk score (§1.3 grower_lot_risk_score).
    fields:
      - name: grower_code
        type: string
        source: input
        description: "Grower account code, e.g. GRW-100"
      - name: ranch_block
        type: string
        source: input
        description: "Ranch and block identifier of the harvested field"
      - name: commodity_class
        type: enum
        source: input
        description: "Commodity class of the harvested raw product"
        constraints: "One of LEAFY, ROOT, FRUIT"
      - name: harvest_datetime
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the block was harvested; anchors harvest-lag deductions"
      - name: water_source
        type: enum
        source: input
        description: "Preharvest irrigation water source"
        constraints: "One of MUNICIPAL, WELL, SURFACE"
      - name: adjacent_animal_operation
        type: boolean
        source: input
        description: "True when a concentrated animal feeding operation adjoins the block"
        default: false
      - name: preharvest_test_result
        type: enum
        source: input
        description: "Result of the preharvest pathogen testing program for this block"
        constraints: "One of NEGATIVE, PRESUMPTIVE, POSITIVE"
      - name: prior_rejected_receipt_count
        type: integer
        source: input
        description: "Historical rejected-load count carried in from the grower scorecard"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 GrowerLot"
        default: PENDING_APPROVAL
        constraints: "One of PENDING_APPROVAL, APPROVED, REJECTED, SUSPENDED, RECALLED"
      - name: preharvest_risk_score
        type: integer
        source: computed
        description: "PREHARVEST variant of grower_lot_risk_score, frozen at approval; null before approval"
      - name: trailing_risk_score
        type: integer
        source: computed
        description: "TRAILING variant of grower_lot_risk_score, recomputed on receipt disposition and on hold opening"
      - name: out_of_spec_receipt_count
        type: integer
        source: computed
        description: "Count of RawReceipt rows for this lot with temp_grade == OUT_OF_SPEC"
        default: 0
      - name: env_positive_run_count
        type: integer
        source: computed
        description: "Count of distinct ProcessRun rows consuming this lot that carry a HoldRecord with reason in {ENVIRONMENTAL_POSITIVE, RECALL}"
        default: 0
      - name: recalled_at
        type: datetime
        source: system
        description: "Logical-clock instant the lot was recalled; null otherwise"

  - name: RawReceipt
    parent: GrowerLot
    common_fields: true
    # Raw product receiving with temperature verification. Holds the pound
    # balance that the mass-balance invariant conserves (§1.3 run_mass_balance).
    fields:
      - name: grower_lot_id
        type: string
        source: input
        description: "FK -> GrowerLot.id; the grower lot delivered on this load"
      - name: received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the load was received at the dock"
      - name: pulp_temp_c
        type: number
        source: input
        description: "Verified pulp temperature in Celsius at receiving"
        constraints: "One decimal place"
      - name: gross_weight_lb
        type: number
        source: input
        description: "Gross scale weight in pounds"
        constraints: "> 0, two decimal places"
      - name: tare_weight_lb
        type: number
        source: input
        description: "Tare weight in pounds"
        constraints: ">= 0 and < gross_weight_lb"
      - name: net_weight_lb
        type: number
        source: computed
        description: "gross_weight_lb - tare_weight_lb"
      - name: trim_loss_lb
        type: number
        source: input
        description: "Trim and cull pounds declared at disposition; null before disposition"
        constraints: ">= 0 and <= net_weight_lb"
      - name: accepted_lb
        type: number
        source: computed
        description: "net_weight_lb - trim_loss_lb; set only when status becomes ACCEPTED"
      - name: remaining_lb
        type: number
        source: computed
        description: "accepted_lb minus the sum of consumed_lb over LotConsumption rows for this receipt with status == ACTIVE"
      - name: temp_grade
        type: enum
        source: computed
        description: "Temperature verification grade; see §1.3 receipt_temperature_grade"
        constraints: "One of IN_SPEC, MARGINAL, OUT_OF_SPEC"
      - name: shelf_life_deduction_days
        type: integer
        source: computed
        description: "Days deducted from finished shelf life because of this load's temperature grade"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 RawReceipt"
        default: PENDING_INSPECTION
        constraints: "One of PENDING_INSPECTION, ACCEPTED, REJECTED, QUARANTINED"
      - name: override_justification
        type: string
        source: input
        description: "QAManager justification required to accept an OUT_OF_SPEC load; null otherwise"
      - name: dispositioned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who dispositioned the load"

  - name: Line
    parent: null
    common_fields: true
    # Trim / cut / wash line. `posture` is a compound derived field: it is a pure
    # function of this line's sanitation, corrective-action and swab children
    # (§1.3 line_posture) and it gates every run operation on the line.
    fields:
      - name: line_code
        type: string
        source: input
        description: "Line identifier, e.g. L1"
        constraints: "Non-empty, unique across all Line rows (ERR_DUPLICATE_CODE)"
      - name: required_disassembly_component_count
        type: integer
        source: input
        description: "Components that must be disassembled before a sanitation event may be submitted"
        constraints: ">= 1"
      - name: max_atp_rlu
        type: integer
        source: input
        description: "Highest post-sanitation ATP swab reading in RLU that still passes validation"
        constraints: ">= 1"
      - name: posture
        type: enum
        source: computed
        description: "Derived gating posture; see §1.3 line_posture"
        default: RESTRICTED
        constraints: "One of OPEN, RESTRICTED, FROZEN"
      - name: open_corrective_action_count
        type: integer
        source: computed
        description: "Count of CorrectiveAction rows for this line with status in {OPEN, IN_PROGRESS, VERIFICATION_PENDING}"
        default: 0
      - name: last_validated_sanitation_at
        type: datetime
        source: computed
        description: "validated_at of the newest VALIDATED SanitationEvent for this line; null when none"
      - name: last_run_allergen_group
        type: enum
        source: computed
        description: "allergen_group of the Product of the most recently STARTED run on this line; null before the first start"
        constraints: "One of NONE, CELERY, SESAME, MUSTARD, SULFITE"
      - name: last_run_ended_at
        type: datetime
        source: computed
        description: "closed_at of the most recently CLOSED run on this line; null when no run has closed"

  - name: WashSystem
    parent: null
    common_fields: true
    # Shared wash flume / antimicrobial recirculation system. Referenced by runs
    # on any line, which is what makes its overlap rule an aggregate-capacity
    # rule rather than a pairwise-exclusion rule (§1.4 priority 65).
    fields:
      - name: system_code
        type: string
        source: input
        description: "Wash system identifier, e.g. W1"
        constraints: "Non-empty, unique across all WashSystem rows (ERR_DUPLICATE_CODE)"
      - name: water_volume_gal
        type: number
        source: input
        description: "Working water volume in gallons; denominator of the organic load index"
        constraints: "> 0"
      - name: max_concurrent_runs
        type: integer
        source: input
        description: "Highest number of runs whose planned windows may overlap on this system"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "IN_SERVICE until the load index or a sanitation failure forces a change-out"
        default: IN_SERVICE
        constraints: "One of IN_SERVICE, DUMP_REQUIRED"
      - name: last_changeout_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last water change-out; set at creation and at every change-out"
      - name: weighted_load_lb
        type: number
        source: computed
        description: "Load-factor-weighted pounds washed since last_changeout_at; see §1.3 wash_water_load_and_target_ppm"
        default: 0
      - name: organic_load_index
        type: number
        source: computed
        description: "Normalized organic load, three decimal places; see §1.3 wash_water_load_and_target_ppm"
        default: 0
      - name: target_free_chlorine_ppm
        type: number
        source: computed
        description: "Tier-selected free chlorine target in ppm for the current organic_load_index"
      - name: changeout_count
        type: integer
        source: computed
        description: "Number of completed water change-outs on this system"
        default: 0
      - name: reading_sequence_high_water
        type: integer
        source: computed
        description: "Highest sequence_no assigned to an AntimicrobialReading on this system"
        default: 0

  - name: AntimicrobialReading
    parent: WashSystem
    common_fields: false
    # Append-only wash-water monitoring event. Immutable: it carries only `id`
    # and `created_at`, has no update endpoint and no version field.
    fields:
      - name: wash_system_id
        type: string
        source: input
        description: "FK -> WashSystem.id; the wash system sampled"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-wash-system counter starting at 1; the deterministic tie-break for latest-reading selection"
      - name: reading_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the sample was taken"
      - name: free_chlorine_ppm
        type: number
        source: input
        description: "Measured free chlorine in ppm"
        constraints: ">= 0, one decimal place"
      - name: ph
        type: number
        source: input
        description: "Measured wash water pH"
        constraints: "0 < value <= 14, one decimal place"
      - name: orp_mv
        type: integer
        source: input
        description: "Measured oxidation reduction potential in millivolts"
      - name: turbidity_ntu
        type: number
        source: input
        description: "Measured turbidity in NTU"
        constraints: ">= 0, one decimal place"
      - name: taken_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded the reading"
      - name: organic_load_index_at_reading
        type: number
        source: computed
        description: "WashSystem.organic_load_index evaluated at the moment this reading was recorded"
      - name: target_free_chlorine_ppm_at_reading
        type: number
        source: computed
        description: "Tier-selected target ppm evaluated at the moment this reading was recorded"
      - name: topup_ppm_required
        type: number
        source: computed
        description: "max(0, target_free_chlorine_ppm_at_reading - free_chlorine_ppm); the sanitizer dosing gap"
      - name: below_target
        type: boolean
        source: computed
        description: "True when free_chlorine_ppm < target_free_chlorine_ppm_at_reading"

  - name: ProcessRun
    parent: null
    common_fields: true
    # Trim / cut / wash / spin / pack run. Two independent state dimensions:
    # `run_status` (production progress) and `disposition_status` (quality
    # release). Self-referential through rework_source_run_id.
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> Line.id; the line this run occupies"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product being processed"
      - name: customer_spec_id
        type: string
        source: input
        description: "FK -> CustomerSpec.id; the customer specification this run packs to"
      - name: wash_system_id
        type: string
        source: input
        description: "FK -> WashSystem.id; the wash system this run draws on"
      - name: rework_source_run_id
        type: string
        source: input
        description: "FK -> ProcessRun.id; optional, the REJECTED run whose product is reworked into this run"
      - name: planned_start_at
        type: datetime
        source: input
        description: "Start of the planned occupancy window, treated as inclusive"
      - name: planned_end_at
        type: datetime
        source: input
        description: "End of the planned occupancy window, treated as exclusive"
        constraints: "> planned_start_at"
      - name: crew_size
        type: integer
        source: input
        description: "Crew head count on the run; multiplies the labor cost component"
        constraints: ">= 1"
      - name: run_status
        type: enum
        source: system
        description: "Production dimension; see §1.2 ProcessRun (run_status)"
        default: SETUP
        constraints: "One of SETUP, RUNNING, CLOSED, CANCELLED"
      - name: disposition_status
        type: enum
        source: system
        description: "Quality dimension, evolving independently of run_status; see §1.2 ProcessRun (disposition_status)"
        default: UNRESTRICTED
        constraints: "One of UNRESTRICTED, HELD, RELEASED, REJECTED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the start transition; null while SETUP"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the close transition; null before close"
      - name: target_ppm_at_start
        type: number
        source: computed
        description: "WashSystem target ppm frozen at the start transition; see §1.3 wash_water_load_and_target_ppm"
      - name: required_dwell_seconds_at_start
        type: integer
        source: computed
        description: "Dwell requirement frozen at the start transition; later consumption never revises it"
      - name: actual_dwell_seconds
        type: integer
        source: input
        description: "Measured flume dwell time reported at close"
        constraints: ">= 0"
      - name: spin_rpm
        type: integer
        source: input
        description: "Spin dryer speed reported at close"
        constraints: ">= 0"
      - name: spin_seconds
        type: integer
        source: input
        description: "Spin dryer cycle length in seconds reported at close"
        constraints: ">= 0"
      - name: atmosphere_actual
        type: enum
        source: input
        description: "Packaging atmosphere actually applied, reported at close"
        constraints: "One of AIR, MAP_LOW_O2, MAP_HIGH_CO2"
      - name: water_gal_used
        type: number
        source: input
        description: "Wash water gallons consumed by the run, reported at close"
        constraints: ">= 0"
      - name: cases_produced
        type: integer
        source: input
        description: "Cases packed on the run, reported at close; drives FinishedCase creation"
        constraints: ">= 1"
      - name: input_lb
        type: number
        source: computed
        description: "Sum of consumed_lb over LotConsumption rows for this run with status == ACTIVE"
        default: 0
      - name: output_lb
        type: number
        source: computed
        description: "cases_produced * CustomerSpec.case_net_weight_lb"
      - name: yield_pct
        type: number
        source: computed
        description: "round(output_lb / input_lb * 100, 2); see §1.3 run_mass_balance_and_yield"
      - name: min_ppm_observed
        type: number
        source: computed
        description: "Lowest free_chlorine_ppm among readings inside the run window; see §1.3 antimicrobial_compliance_check"
      - name: antimicrobial_excursion_count
        type: integer
        source: computed
        description: "Count of in-window readings below Product.min_antimicrobial_ppm"
        default: 0
      - name: allergen_changeover_required
        type: boolean
        source: computed
        description: "True when Line.last_run_allergen_group is non-null and differs from this run's Product.allergen_group"
        default: false
      - name: provisional_shelf_life_days
        type: integer
        source: computed
        description: "PROVISIONAL variant of run_shelf_life_and_code_date, computed at close"
      - name: provisional_code_date
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD) of pack date + provisional_shelf_life_days"
      - name: final_shelf_life_days
        type: integer
        source: computed
        description: "FINAL variant of run_shelf_life_and_code_date, computed at hold release; null until then"
      - name: final_code_date
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD) of pack date + final_shelf_life_days; null until release"
      - name: total_run_cost_cents
        type: integer
        source: computed
        description: "Sum of the four independently rounded cost components; see §1.3 run_cost_allocation_per_case"
      - name: per_case_cost_cents
        type: integer
        source: computed
        description: "floor(total_run_cost_cents / cases_produced)"
      - name: cost_remainder_cents
        type: integer
        source: computed
        description: "total_run_cost_cents - per_case_cost_cents * cases_produced; distributed by the allocation waterfall"
      - name: cases_available
        type: integer
        source: computed
        description: "Count of this run's FinishedCase rows with status == IN_INVENTORY"
        default: 0
      - name: cases_on_hold
        type: integer
        source: computed
        description: "Count of this run's FinishedCase rows with status == ON_HOLD"
        default: 0
      - name: cases_shipped
        type: integer
        source: computed
        description: "Count of this run's FinishedCase rows with status == SHIPPED"
        default: 0
      - name: cases_destroyed
        type: integer
        source: computed
        description: "Count of this run's FinishedCase rows with status == DESTROYED"
        default: 0

  - name: LotConsumption
    parent: ProcessRun
    common_fields: true
    # Junction entity realizing the many-to-many traceability edge between a run
    # and the raw receipts it consumed. Voidable, which is what makes the
    # pound-balance invariant a compensating-action invariant.
    fields:
      - name: process_run_id
        type: string
        source: input
        description: "FK -> ProcessRun.id; the run that consumed the pounds"
      - name: raw_receipt_id
        type: string
        source: input
        description: "FK -> RawReceipt.id; the received load drawn down"
      - name: consumed_lb
        type: number
        source: input
        description: "Pounds drawn from the receipt onto the run"
        constraints: "> 0, two decimal places"
      - name: status
        type: enum
        source: system
        description: "ACTIVE until voided; VOIDED rows are excluded from every balance and load aggregate"
        default: ACTIVE
        constraints: "One of ACTIVE, VOIDED"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded the consumption"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant the row was voided; null while ACTIVE"

  - name: FinishedCase
    parent: ProcessRun
    common_fields: true
    # Finished case, the far end of the traceability chain. Created in bulk by
    # the run close transition; never created directly by a client.
    fields:
      - name: process_run_id
        type: string
        source: input
        description: "FK -> ProcessRun.id; the run that packed this case"
      - name: case_sequence
        type: integer
        source: system
        description: "1-based pack order within the run; the deterministic key of the cost allocation waterfall"
      - name: case_code
        type: string
        source: computed
        description: "Line.line_code + '-' + pack date as YYYYMMDD + '-' + case_sequence zero-padded to 4 digits"
      - name: net_weight_lb
        type: number
        source: computed
        description: "CustomerSpec.case_net_weight_lb copied at pack time"
      - name: code_date
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD): the run's provisional_code_date at pack, replaced by final_code_date on release"
      - name: code_date_label
        type: string
        source: computed
        description: "code_date rendered per CustomerSpec.code_date_format: JULIAN as YYYYDDD, CALENDAR as YYYY-MM-DD"
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: "This case's share of total_run_cost_cents under the allocation waterfall"
      - name: status
        type: enum
        source: system
        description: "Disposition of the physical case; see §1.2 FinishedCase"
        default: IN_INVENTORY
        constraints: "One of IN_INVENTORY, ON_HOLD, SHIPPED, DESTROYED"
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant the case shipped; null otherwise"

  - name: HoldRecord
    parent: ProcessRun
    common_fields: true
    # Hold-and-release testing. Cyclic machine: a sample may be resubmitted from
    # RETEST_REQUIRED up to MAX_TEST_ROUNDS times.
    fields:
      - name: process_run_id
        type: string
        source: input
        description: "FK -> ProcessRun.id; the run whose product is held"
      - name: reason
        type: enum
        source: input
        description: "Why the hold was opened; ENVIRONMENTAL_POSITIVE and RECALL also depress grower risk"
        constraints: "One of HOLD_AND_RELEASE_TESTING, ENVIRONMENTAL_POSITIVE, SANITATION_FAILURE, ANTIMICROBIAL_EXCURSION, RECALL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 HoldRecord"
        default: HELD
        constraints: "One of HELD, UNDER_TEST, RETEST_REQUIRED, RELEASED, REJECTED"
      - name: test_round
        type: integer
        source: computed
        description: "Number of samples submitted on this hold; incremented by every submit-sample transition"
        default: 0
      - name: latest_test_type
        type: enum
        source: input
        description: "Assay of the most recent recorded result; null before the first result"
        constraints: "One of APC, LISTERIA, ECOLI_O157, SALMONELLA"
      - name: latest_test_result
        type: enum
        source: input
        description: "Outcome of the most recent recorded result; null before the first result"
        constraints: "One of NEGATIVE, POSITIVE, INDETERMINATE"
      - name: latest_apc_cfu_g
        type: integer
        source: input
        description: "Aerobic plate count in CFU per gram from the most recent result; drives the FINAL shelf-life micro penalty"
        constraints: ">= 0"
      - name: resulted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the technician who recorded the most recent result; SoD counterparty of the release"
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the manager who released or rejected the hold"
      - name: cases_held_count
        type: integer
        source: computed
        description: "Count of FinishedCase rows moved from IN_INVENTORY to ON_HOLD when this hold opened"
        default: 0
      - name: shipped_case_count
        type: integer
        source: computed
        description: "Count of the run's FinishedCase rows already SHIPPED when this hold opened; the customer notification list size"
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the hold opened"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the hold reached RELEASED or REJECTED; null before"

  - name: SanitationEvent
    parent: Line
    common_fields: true
    # Sanitation shift with equipment disassembly and pre-operational validation.
    # Branching with revert: AWAITING_VALIDATION forks to VALIDATED or FAILED,
    # and FAILED re-enters IN_PROGRESS for a re-clean.
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> Line.id; the line being cleaned"
      - name: shift
        type: enum
        source: input
        description: "Shift on which the sanitation is performed"
        constraints: "One of FIRST, SECOND, SANITATION"
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the sanitation is scheduled for; primary sort key of latest-sanitation selection"
      - name: is_allergen_changeover
        type: boolean
        source: input
        description: "True when this sanitation is the documented allergen changeover clean"
        default: false
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-line counter starting at 1; tie-break of latest-sanitation selection"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 SanitationEvent"
        default: SCHEDULED
        constraints: "One of SCHEDULED, IN_PROGRESS, AWAITING_VALIDATION, VALIDATED, FAILED"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the technician who started the clean; SoD counterparty of the validation"
      - name: validated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the technician who validated the clean"
      - name: disassembled_component_count
        type: integer
        source: input
        description: "Components disassembled, reported at submit"
        constraints: ">= 0"
      - name: atp_rlu
        type: integer
        source: input
        description: "Post-clean ATP swab reading in RLU, reported at validation"
        constraints: ">= 0"
      - name: allergen_swab_result
        type: enum
        source: input
        description: "Allergen-specific swab outcome, reported at validation"
        constraints: "One of NEGATIVE, POSITIVE"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of times this event entered IN_PROGRESS"
        default: 0
      - name: failed_reason
        type: enum
        source: system
        description: "Why validation failed; null unless status == FAILED"
        constraints: "One of ATP_ABOVE_LIMIT, ALLERGEN_POSITIVE, MANUAL_FAIL"
      - name: validated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the VALIDATED transition; null otherwise"

  - name: EnvironmentalSwab
    parent: Line
    common_fields: true
    # Environmental monitoring program. A confirmed positive is the trigger of
    # the five-hop containment cascade (§1.2 EnvironmentalSwab).
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> Line.id; the line whose environment was swabbed"
      - name: zone
        type: enum
        source: input
        description: "Hygienic zone of the swab site; ZONE_1 positives are CRITICAL, others MAJOR"
        constraints: "One of ZONE_1, ZONE_2, ZONE_3, ZONE_4"
      - name: site_code
        type: string
        source: input
        description: "Swab site identifier from the environmental monitoring map"
      - name: organism
        type: enum
        source: input
        description: "Target organism of the swab"
        constraints: "One of LISTERIA_SPP, LISTERIA_MONOCYTOGENES, SALMONELLA, APC"
      - name: collected_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the swab was collected; anchors the closed-run lookback window"
      - name: result
        type: enum
        source: system
        description: "Laboratory result; see §1.2 EnvironmentalSwab"
        default: PENDING
        constraints: "One of PENDING, NEGATIVE, PRESUMPTIVE_POSITIVE, CONFIRMED_POSITIVE"
      - name: resulted_at
        type: datetime
        source: system
        description: "Logical-clock instant the most recent result was recorded; null while PENDING"
      - name: resulted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the technician who recorded the most recent result"

  - name: CorrectiveAction
    parent: Line
    common_fields: true
    # Corrective action on a positive or out-of-spec finding. Cyclic machine: a
    # failed verification returns the action to IN_PROGRESS.
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> Line.id; the line whose posture this action gates"
      - name: source_type
        type: enum
        source: system
        description: "Kind of finding that opened this action"
        constraints: "One of ENV_SWAB, SANITATION_FAILURE, ANTIMICROBIAL_EXCURSION"
      - name: source_ref_id
        type: string
        source: system
        description: "Polymorphic reference to the finding: resolves to EnvironmentalSwab.id when source_type == ENV_SWAB, SanitationEvent.id when source_type == SANITATION_FAILURE, AntimicrobialReading.id when source_type == ANTIMICROBIAL_EXCURSION"
      - name: severity
        type: enum
        source: system
        description: "CRITICAL freezes the line; MAJOR restricts it"
        constraints: "One of MAJOR, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 CorrectiveAction"
        default: OPEN
        constraints: "One of OPEN, IN_PROGRESS, VERIFICATION_PENDING, VERIFIED"
      - name: action_taken
        type: string
        source: input
        description: "Narrative of the corrective action, supplied at submit-verification"
      - name: implemented_by_user_id
        type: string
        source: system
        description: "X-User-ID of the technician who started the action; SoD counterparty of the verification"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the manager who verified the action"
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of failed verifications that returned this action to IN_PROGRESS"
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the action was opened"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant the action was verified; null before"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: GrowerLot
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, RECALLED]
    shape: branching_with_derived_guards
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grower-lots/{id}/approve"
        actor: QAManager
        preconditions:
          - "GrowerLot.status == PENDING_APPROVAL"
          - "GrowerLot.preharvest_test_result != POSITIVE"
          - "the PREHARVEST variant of grower_lot_risk_score evaluates to >= RISK_SUSPEND_THRESHOLD (50)"
        side_effects:
          - "sets GrowerLot.preharvest_risk_score to the PREHARVEST variant of §1.3 grower_lot_risk_score"
          - "sets GrowerLot.trailing_risk_score to the same value (no trailing evidence exists yet)"
          - "sets GrowerLot.out_of_spec_receipt_count and env_positive_run_count to their current counts"
      - from: PENDING_APPROVAL
        to: SUSPENDED
        trigger: "POST /grower-lots/{id}/approve"
        actor: QAManager
        preconditions:
          - "GrowerLot.status == PENDING_APPROVAL"
          - "GrowerLot.preharvest_test_result != POSITIVE"
          - "the PREHARVEST variant of grower_lot_risk_score evaluates to < RISK_SUSPEND_THRESHOLD (50)"
        side_effects:
          - "sets GrowerLot.preharvest_risk_score and trailing_risk_score to the PREHARVEST variant value"
        note: "Branch of the same trigger: a lot whose preharvest score is below the suspension threshold is approved-into-suspension and cannot be consumed."
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /grower-lots/{id}/approve"
        actor: QAManager
        preconditions:
          - "GrowerLot.status == PENDING_APPROVAL"
          - "GrowerLot.preharvest_test_result == POSITIVE"
        side_effects:
          - "sets GrowerLot.preharvest_risk_score and trailing_risk_score to 0"
        note: "A confirmed preharvest pathogen positive is a hard rejection regardless of the weighted score."
      - from: APPROVED
        to: SUSPENDED
        trigger: "system: TRAILING recompute of grower_lot_risk_score after a RawReceipt disposition or a HoldRecord opening"
        actor: system
        preconditions:
          - "GrowerLot.status == APPROVED"
          - "the TRAILING variant of grower_lot_risk_score evaluates to < RISK_SUSPEND_THRESHOLD (50)"
        side_effects:
          - "sets GrowerLot.trailing_risk_score to the TRAILING variant value"
          - "sets GrowerLot.status = SUSPENDED, which blocks every later LotConsumption against this lot's receipts (§1.4 priority 39)"
      - from: APPROVED
        to: RECALLED
        trigger: "POST /grower-lots/{id}/recall"
        actor: QAManager
        preconditions:
          - "GrowerLot.status IN {APPROVED, SUSPENDED}"
        side_effects:
          - "hop 1: sets GrowerLot.status = RECALLED and recalled_at = logical clock now"
          - "hop 2 (caused by hop 1): every RawReceipt with grower_lot_id == this lot and status IN {PENDING_INSPECTION, ACCEPTED} transitions to QUARANTINED, processed in RawReceipt.received_at ASC order, tie-break created_at ASC"
          - "hop 3 (caused by hop 2): for every receipt that just became QUARANTINED, every ProcessRun referenced by one of that receipt's LotConsumption rows with status == ACTIVE and whose disposition_status != REJECTED transitions disposition_status to HELD and gets a new HoldRecord(reason = RECALL, status = HELD, opened_at = now); runs processed in ProcessRun.planned_start_at ASC order, tie-break created_at ASC"
          - "hop 4 (caused by hop 3): for every run just HELD, its FinishedCase rows with status == IN_INVENTORY become ON_HOLD in case_sequence ASC order; the opening HoldRecord.cases_held_count is set to that count and shipped_case_count to the run's SHIPPED case count; ProcessRun.cases_available and cases_on_hold are recomputed. Cases already SHIPPED or DESTROYED are left untouched (conditional cascade)"
          - "hop 5 (caused by hop 2 and hop 3): the rework DAG is then walked downward from EVERY run that holds an ACTIVE consumption of a receipt quarantined in hop 2 - including the runs hop 3 skipped because their disposition_status was already REJECTED, which are precisely the runs a later rework run may name - following rework_source_run_id edges to a maximum depth of REWORK_MAX_DEPTH (5); every descendant reached whose disposition_status != REJECTED transitions to HELD with its own HoldRecord(reason = RECALL) and its cases follow hop 4"
          - "hop 6: GrowerLot.env_positive_run_count and trailing_risk_score are recomputed for every grower lot consumed by any run held in hops 3 and 5, which may SUSPEND those lots"
          - "increments GrowerLot.version by 1 and refreshes updated_at on every row touched by hops 1-6"
        note: "Rapid-recall cascade. Five caused hops: lot -> receipts -> runs+holds -> cases+counters -> rework descendants."
      - from: SUSPENDED
        to: RECALLED
        trigger: "POST /grower-lots/{id}/recall"
        actor: QAManager
        preconditions:
          - "GrowerLot.status IN {APPROVED, SUSPENDED}"
        side_effects:
          - "identical hop 1-6 chain as the APPROVED -> RECALLED transition"

  - entity: RawReceipt
    initial_state: PENDING_INSPECTION
    terminal_states: [REJECTED, QUARANTINED]
    shape: branching
    transitions:
      - from: PENDING_INSPECTION
        to: ACCEPTED
        trigger: "POST /raw-receipts/{id}/disposition with decision == ACCEPT"
        actor: QATechnician
        preconditions:
          - "RawReceipt.status == PENDING_INSPECTION"
          - "trim_loss_lb <= RawReceipt.net_weight_lb"
          - "RawReceipt.temp_grade != OUT_OF_SPEC, unless the actor's role is QAManager and override_justification is a non-empty string"
        side_effects:
          - "sets RawReceipt.accepted_lb = round(net_weight_lb - trim_loss_lb, 2) and remaining_lb = accepted_lb (§1.3 receipt_temperature_grade)"
          - "sets RawReceipt.dispositioned_by_user_id to the acting X-User-ID"
          - "recomputes GrowerLot.out_of_spec_receipt_count and, when GrowerLot.preharvest_risk_score is non-null, the TRAILING variant of grower_lot_risk_score, which may transition the lot APPROVED -> SUSPENDED"
      - from: PENDING_INSPECTION
        to: REJECTED
        trigger: "POST /raw-receipts/{id}/disposition with decision == REJECT"
        actor: QATechnician
        preconditions:
          - "RawReceipt.status == PENDING_INSPECTION"
        side_effects:
          - "leaves accepted_lb and remaining_lb null so the load can never be consumed"
          - "recomputes GrowerLot.out_of_spec_receipt_count and the TRAILING variant of grower_lot_risk_score when preharvest_risk_score is non-null"
      - from: PENDING_INSPECTION
        to: QUARANTINED
        trigger: "system: hop 2 of the GrowerLot recall cascade"
        actor: system
        preconditions:
          - "the parent GrowerLot transitioned to RECALLED in hop 1"
        side_effects:
          - "refreshes updated_at and increments RawReceipt.version by 1"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "system: hop 2 of the GrowerLot recall cascade"
        actor: system
        preconditions:
          - "the parent GrowerLot transitioned to RECALLED in hop 1"
        side_effects:
          - "leaves remaining_lb unchanged (the pounds are physically still on site, they are simply unusable)"
          - "propagates to hop 3: the runs that consumed this receipt are held"

  - entity: Line
    initial_state: RESTRICTED
    terminal_states: []
    shape: compound_posture
    transitions:
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recompute of §1.3 line_posture after any SanitationEvent, CorrectiveAction or EnvironmentalSwab change on this line"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to OPEN for this line"
        side_effects:
          - "sets Line.last_validated_sanitation_at to the validated_at of the newest VALIDATED SanitationEvent"
          - "unblocks POST /process-runs/{id}/start on this line (§1.4 priority 41)"
        note: "A brand-new Line is RESTRICTED: it has no VALIDATED sanitation yet, so runs may be created but not started."
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recompute of §1.3 line_posture"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to RESTRICTED for this line"
        side_effects:
          - "blocks further run starts on this line while leaving RUNNING runs closable"
      - from: OPEN
        to: FROZEN
        trigger: "system: hop 3 of the EnvironmentalSwab confirmation cascade, or any other recompute that finds an open CRITICAL corrective action"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to FROZEN for this line"
        side_effects:
          - "propagates to hop 4: SETUP runs on the line are CANCELLED and RUNNING plus recently CLOSED runs are HELD"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: recompute of §1.3 line_posture"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to FROZEN for this line"
        side_effects:
          - "same hop 4 propagation as OPEN -> FROZEN"
      - from: FROZEN
        to: OPEN
        trigger: "system: recompute of §1.3 line_posture after POST /corrective-actions/{id}/verify with outcome == PASS"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to OPEN for this line"
        side_effects:
          - "decrements Line.open_corrective_action_count"
          - "does NOT un-cancel runs cancelled in hop 4 and does NOT release holds opened in hop 4 (the cascade is not self-reversing; release runs through POST /hold-records/{id}/release)"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: recompute of §1.3 line_posture after POST /corrective-actions/{id}/verify with outcome == PASS"
        actor: system
        preconditions:
          - "§1.3 line_posture evaluates to RESTRICTED for this line"
        side_effects:
          - "decrements Line.open_corrective_action_count"

  - entity: WashSystem
    initial_state: IN_SERVICE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: IN_SERVICE
        to: DUMP_REQUIRED
        trigger: "system: POST /wash-systems/{id}/antimicrobial-readings when the recomputed organic_load_index >= CHANGEOUT_LOAD_INDEX_MAX (3.000)"
        actor: system
        preconditions:
          - "WashSystem.status == IN_SERVICE"
          - "the organic_load_index recomputed for this reading is >= 3.000"
        side_effects:
          - "sets WashSystem.target_free_chlorine_ppm to null (no tier is defined above the change-out ceiling)"
          - "blocks POST /process-runs/{id}/start for every run on this system (§1.4 priority 42)"
      - from: IN_SERVICE
        to: DUMP_REQUIRED
        trigger: "system: hop 4 of the SanitationEvent validation-failure cascade"
        actor: system
        preconditions:
          - "a SanitationEvent on some Line transitioned AWAITING_VALIDATION -> FAILED"
          - "this wash system is referenced by at least one ProcessRun on that line with run_status IN {SETUP, RUNNING}"
        side_effects:
          - "propagates to hop 5: SETUP runs referencing this wash system are CANCELLED"
      - from: DUMP_REQUIRED
        to: IN_SERVICE
        trigger: "POST /wash-systems/{id}/changeout"
        actor: SanitationTech
        preconditions:
          - "WashSystem.status IN {IN_SERVICE, DUMP_REQUIRED}"
        side_effects:
          - "sets last_changeout_at = logical clock now, which resets the load window: weighted_load_lb, organic_load_index and target_free_chlorine_ppm are recomputed over LotConsumption rows created at or after the new last_changeout_at, i.e. back to 0 / 0.000 / 20.0"
          - "increments changeout_count by 1"
        note: "Also legal from IN_SERVICE (a scheduled change-out ahead of the load ceiling); the state is then unchanged but the window resets."

  - entity: ProcessRun
    dimension: run_status
    initial_state: SETUP
    terminal_states: [CLOSED, CANCELLED]
    shape: parallel_dimension_1_of_2
    transitions:
      - from: SETUP
        to: RUNNING
        trigger: "POST /process-runs/{id}/start"
        actor: LineOperator
        preconditions:
          - "ProcessRun.run_status == SETUP"
          - "Line.posture == OPEN (which itself requires the newest SanitationEvent on the line to be VALIDATED - §1.3 line_posture)"
          - "WashSystem.status == IN_SERVICE"
          - "the latest AntimicrobialReading for the wash system has free_chlorine_ppm >= Product.min_antimicrobial_ppm"
          - "that reading's reading_at is at most ANTIMICROBIAL_READING_MAX_AGE_MINUTES (60) minutes before the logical clock now, inclusive"
          - "when ProcessRun.allergen_changeover_required is true, the newest VALIDATED SanitationEvent on the line has is_allergen_changeover == true, allergen_swab_result == NEGATIVE and validated_at >= Line.last_run_ended_at"
        side_effects:
          - "sets started_at = logical clock now"
          - "sets target_ppm_at_start and required_dwell_seconds_at_start by evaluating §1.3 wash_water_load_and_target_ppm in its pinned step order; both values are frozen and never revised by later consumption"
          - "sets Line.last_run_allergen_group = Product.allergen_group"
          - "recomputes ProcessRun.allergen_changeover_required to false"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /process-runs/{id}/close"
        actor: LineOperator
        preconditions:
          - "ProcessRun.run_status == RUNNING"
          - "at least one AntimicrobialReading exists for the wash system with reading_at inside the closed window [started_at, closed_at]"
          - "at least one LotConsumption row for the run has status == ACTIVE"
          - "the computed yield_pct is >= Product.min_yield_pct and <= 100"
        side_effects:
          - "sets closed_at = logical clock now and Line.last_run_ended_at = closed_at"
          - "runs §1.3 antimicrobial_compliance_check, setting min_ppm_observed and antimicrobial_excursion_count"
          - "runs §1.3 run_mass_balance_and_yield, setting output_lb and yield_pct"
          - "runs §1.3 run_shelf_life_and_code_date in the PROVISIONAL variant, setting provisional_shelf_life_days and provisional_code_date"
          - "runs §1.3 run_cost_allocation_per_case, setting total_run_cost_cents, per_case_cost_cents and cost_remainder_cents"
          - "creates cases_produced FinishedCase rows with case_sequence 1..cases_produced, each carrying case_code, net_weight_lb, code_date = provisional_code_date, code_date_label and allocated_cost_cents from the allocation waterfall; sets cases_available = cases_produced"
          - "when Product.hold_and_release_required is true: opens a HoldRecord(reason = HOLD_AND_RELEASE_TESTING), moves disposition_status UNRESTRICTED -> HELD and moves every new case IN_INVENTORY -> ON_HOLD"
          - "when antimicrobial_excursion_count > 0: opens a HoldRecord(reason = ANTIMICROBIAL_EXCURSION) plus a CorrectiveAction(source_type = ANTIMICROBIAL_EXCURSION, severity = MAJOR, source_ref_id = the id of the in-window reading with the lowest free_chlorine_ppm, tie-break lowest sequence_no) on Line, and recomputes Line.posture"
          - "recomputes WashSystem.weighted_load_lb, organic_load_index and target_free_chlorine_ppm"
      - from: SETUP
        to: CANCELLED
        trigger: "system: hop 4 of the EnvironmentalSwab confirmation cascade, or hop 5 of the SanitationEvent validation-failure cascade"
        actor: system
        preconditions:
          - "ProcessRun.run_status == SETUP"
          - "either Line.posture became FROZEN, or the run's WashSystem became DUMP_REQUIRED through hop 4 of the sanitation-failure cascade"
        side_effects:
          - "leaves disposition_status untouched at UNRESTRICTED, demonstrating the independence of the two dimensions"
          - "no FinishedCase rows exist yet, so no case cascade fires"

  - entity: ProcessRun
    dimension: disposition_status
    initial_state: UNRESTRICTED
    terminal_states: [REJECTED]
    shape: parallel_dimension_2_of_2
    transitions:
      - from: UNRESTRICTED
        to: HELD
        trigger: "POST /process-runs/{id}/hold-records"
        actor: QATechnician
        preconditions:
          - "ProcessRun.disposition_status != REJECTED"
          - "ProcessRun.run_status != CANCELLED"
        side_effects:
          - "creates a HoldRecord in state HELD with test_round = 0"
          - "moves every FinishedCase of the run with status == IN_INVENTORY to ON_HOLD and recomputes cases_available / cases_on_hold"
          - "sets HoldRecord.cases_held_count to the number of cases just moved and shipped_case_count to the run's SHIPPED case count"
        note: "A run may be held while still RUNNING (run_status and disposition_status advance independently); the two dimensions never gate each other except that a CANCELLED run cannot be held."
      - from: UNRESTRICTED
        to: HELD
        trigger: "system: hop 3 of the recall cascade, hop 4 of the environmental cascade, or the auto-hold branch of POST /process-runs/{id}/close"
        actor: system
        preconditions:
          - "ProcessRun.disposition_status != REJECTED"
        side_effects:
          - "same HoldRecord creation and case cascade as the operator-initiated hold, with reason RECALL, ENVIRONMENTAL_POSITIVE, ANTIMICROBIAL_EXCURSION or HOLD_AND_RELEASE_TESTING"
      - from: HELD
        to: RELEASED
        trigger: "POST /hold-records/{id}/release"
        actor: QAManager
        preconditions:
          - "the HoldRecord being released is in state UNDER_TEST with latest_test_result == NEGATIVE"
          - "no other HoldRecord on this run is in a non-terminal state {HELD, UNDER_TEST, RETEST_REQUIRED}"
          - "the releasing X-User-ID differs from HoldRecord.resulted_by_user_id (segregation of duties)"
        side_effects:
          - "re-runs §1.3 run_shelf_life_and_code_date in the FINAL variant, setting final_shelf_life_days and final_code_date"
          - "rewrites code_date and code_date_label on every FinishedCase of the run that is not SHIPPED and not DESTROYED"
          - "moves every ON_HOLD case of the run back to IN_INVENTORY and restores cases_available / cases_on_hold to their pre-hold values (compensating invariant)"
        note: "The run returns to a shippable disposition, but with the FINAL code date, which is never later than the PROVISIONAL one."
      - from: RELEASED
        to: HELD
        trigger: "system: hop 3 of the recall cascade or hop 4 of the environmental cascade; or POST /process-runs/{id}/hold-records"
        actor: system
        preconditions:
          - "ProcessRun.disposition_status == RELEASED"
        side_effects:
          - "a released run can be re-held by later evidence; only cases still IN_INVENTORY move to ON_HOLD"
        note: "Non-linear: the disposition dimension is not monotonic, RELEASED can revert to HELD."
      - from: HELD
        to: REJECTED
        trigger: "POST /hold-records/{id}/reject"
        actor: QAManager
        preconditions:
          - "the HoldRecord is in state UNDER_TEST or RETEST_REQUIRED"
        side_effects:
          - "moves every ON_HOLD case of the run to DESTROYED and recomputes cases_on_hold / cases_destroyed"
          - "makes the run eligible to be named as rework_source_run_id by a later ProcessRun (§1.4 priority 53)"

  - entity: HoldRecord
    initial_state: HELD
    terminal_states: [RELEASED, REJECTED]
    shape: cyclic
    transitions:
      - from: HELD
        to: UNDER_TEST
        trigger: "POST /hold-records/{id}/submit-sample"
        actor: QATechnician
        preconditions:
          - "HoldRecord.status IN {HELD, RETEST_REQUIRED}"
          - "HoldRecord.test_round < MAX_TEST_ROUNDS (3)"
        side_effects:
          - "increments test_round by 1 and sets latest_test_type from the request"
          - "clears latest_test_result, latest_apc_cfu_g and resulted_by_user_id"
      - from: UNDER_TEST
        to: UNDER_TEST
        trigger: "POST /hold-records/{id}/record-result with result IN {NEGATIVE, POSITIVE}"
        actor: QATechnician
        preconditions:
          - "HoldRecord.status == UNDER_TEST"
        side_effects:
          - "sets latest_test_result, latest_apc_cfu_g and resulted_by_user_id = the acting X-User-ID"
          - "an apc_cfu_g >= APC_ELEVATED_CFU_G (1000000) contributes the micro penalty to the FINAL shelf-life variant"
        note: "Self-loop: recording a result leaves the record UNDER_TEST so the same round can be resulted once and then released or rejected."
      - from: UNDER_TEST
        to: RETEST_REQUIRED
        trigger: "POST /hold-records/{id}/record-result with result == INDETERMINATE"
        actor: QATechnician
        preconditions:
          - "HoldRecord.status == UNDER_TEST"
        side_effects:
          - "sets latest_test_result = INDETERMINATE and resulted_by_user_id"
          - "leaves test_round unchanged so the next submit-sample consumes one of the MAX_TEST_ROUNDS rounds"
      - from: RETEST_REQUIRED
        to: UNDER_TEST
        trigger: "POST /hold-records/{id}/submit-sample"
        actor: QATechnician
        preconditions:
          - "HoldRecord.status IN {HELD, RETEST_REQUIRED}"
          - "HoldRecord.test_round < MAX_TEST_ROUNDS (3)"
        side_effects:
          - "increments test_round by 1; the third round therefore leaves test_round == 3 and a fourth submit-sample is refused with ERR_MAX_RETEST_ROUNDS_EXCEEDED"
        note: "Closes the cycle UNDER_TEST -> RETEST_REQUIRED -> UNDER_TEST with a bounded loop counter."
      - from: UNDER_TEST
        to: RELEASED
        trigger: "POST /hold-records/{id}/release"
        actor: QAManager
        preconditions:
          - "HoldRecord.status == UNDER_TEST"
          - "HoldRecord.latest_test_result == NEGATIVE"
          - "the acting X-User-ID differs from HoldRecord.resulted_by_user_id"
          - "every other HoldRecord on the same run is in a terminal state"
        side_effects:
          - "sets closed_at = logical clock now and released_by_user_id"
          - "drives the run's disposition dimension HELD -> RELEASED with the FINAL shelf-life recomputation and the case restoration"
      - from: UNDER_TEST
        to: REJECTED
        trigger: "POST /hold-records/{id}/reject"
        actor: QAManager
        preconditions:
          - "HoldRecord.status IN {UNDER_TEST, RETEST_REQUIRED}"
        side_effects:
          - "sets closed_at and released_by_user_id; drives the run's disposition dimension to REJECTED and destroys the held cases"
      - from: RETEST_REQUIRED
        to: REJECTED
        trigger: "POST /hold-records/{id}/reject"
        actor: QAManager
        preconditions:
          - "HoldRecord.status IN {UNDER_TEST, RETEST_REQUIRED}"
        side_effects:
          - "same as UNDER_TEST -> REJECTED; this is the escape hatch once the retest rounds are exhausted"

  - entity: SanitationEvent
    initial_state: SCHEDULED
    terminal_states: [VALIDATED]
    shape: branching_with_revert
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sanitation-events/{id}/start"
        actor: SanitationTech
        preconditions:
          - "SanitationEvent.status IN {SCHEDULED, FAILED}"
          - "no ProcessRun on the line has run_status == RUNNING"
        side_effects:
          - "sets started_at = logical clock now, performed_by_user_id = the acting X-User-ID and increments attempt_count by 1"
          - "resets disassembled_component_count to 0, atp_rlu and allergen_swab_result to null"
      - from: IN_PROGRESS
        to: AWAITING_VALIDATION
        trigger: "POST /sanitation-events/{id}/submit"
        actor: SanitationTech
        preconditions:
          - "SanitationEvent.status == IN_PROGRESS"
          - "disassembled_component_count >= Line.required_disassembly_component_count"
        side_effects:
          - "records disassembled_component_count, atp_rlu and allergen_swab_result from the request"
          - "sets completed_at = logical clock now"
      - from: AWAITING_VALIDATION
        to: VALIDATED
        trigger: "POST /sanitation-events/{id}/validate with outcome == PASS"
        actor: QATechnician
        preconditions:
          - "SanitationEvent.status == AWAITING_VALIDATION"
          - "atp_rlu <= Line.max_atp_rlu"
          - "allergen_swab_result == NEGATIVE"
          - "the validating X-User-ID differs from performed_by_user_id (segregation of duties)"
        side_effects:
          - "sets validated_at = logical clock now and validated_by_user_id"
          - "recomputes §1.3 line_posture, which can move the Line RESTRICTED -> OPEN"
          - "sets Line.last_validated_sanitation_at = validated_at"
      - from: AWAITING_VALIDATION
        to: FAILED
        trigger: "POST /sanitation-events/{id}/validate with outcome == FAIL, or with outcome == PASS when atp_rlu > Line.max_atp_rlu or allergen_swab_result == POSITIVE"
        actor: QATechnician
        preconditions:
          - "SanitationEvent.status == AWAITING_VALIDATION"
          - "the validating X-User-ID differs from performed_by_user_id"
        side_effects:
          - "hop 1: sets status = FAILED and failed_reason to ATP_ABOVE_LIMIT, ALLERGEN_POSITIVE or MANUAL_FAIL (evaluated in that order)"
          - "hop 2 (caused by hop 1): opens a CorrectiveAction(source_type = SANITATION_FAILURE, source_ref_id = this event's id, severity = MAJOR, line_id = this line) and increments Line.open_corrective_action_count"
          - "hop 3 (caused by hop 1 and hop 2): recomputes §1.3 line_posture, which yields RESTRICTED"
          - "hop 4 (caused by hop 3): every WashSystem referenced by a ProcessRun on this line with run_status IN {SETUP, RUNNING} transitions IN_SERVICE -> DUMP_REQUIRED, processed in WashSystem.created_at ASC order"
          - "hop 5 (caused by hop 4): every ProcessRun on any line with run_status == SETUP whose wash_system_id is one of the systems just marked DUMP_REQUIRED transitions run_status SETUP -> CANCELLED"
        note: "A validation failure is never silently retried: the FAILED -> IN_PROGRESS revert requires a fresh start call, and the line stays RESTRICTED until the MAJOR corrective action is VERIFIED even after a later sanitation passes."
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /sanitation-events/{id}/start"
        actor: SanitationTech
        preconditions:
          - "SanitationEvent.status IN {SCHEDULED, FAILED}"
          - "no ProcessRun on the line has run_status == RUNNING"
        side_effects:
          - "increments attempt_count, resets the measurement fields and re-stamps performed_by_user_id, so a different technician may re-clean"
        note: "Revert edge: the same event row cycles through the clean-and-verify loop rather than being recreated."

  - entity: EnvironmentalSwab
    initial_state: PENDING
    terminal_states: [NEGATIVE, CONFIRMED_POSITIVE]
    shape: branching
    transitions:
      - from: PENDING
        to: NEGATIVE
        trigger: "POST /environmental-swabs/{id}/result with result == NEGATIVE"
        actor: QATechnician
        preconditions:
          - "EnvironmentalSwab.result == PENDING"
        side_effects:
          - "sets resulted_at, resulted_by_user_id and recomputes §1.3 line_posture (a negative swab can clear a RESTRICTED presumptive posture)"
      - from: PENDING
        to: PRESUMPTIVE_POSITIVE
        trigger: "POST /environmental-swabs/{id}/result with result == PRESUMPTIVE_POSITIVE"
        actor: QATechnician
        preconditions:
          - "EnvironmentalSwab.result == PENDING"
        side_effects:
          - "sets resulted_at and resulted_by_user_id"
          - "recomputes §1.3 line_posture: a presumptive positive in ZONE_1 or ZONE_2 makes the Line RESTRICTED but never FROZEN, and opens no corrective action"
      - from: PRESUMPTIVE_POSITIVE
        to: CONFIRMED_POSITIVE
        trigger: "POST /environmental-swabs/{id}/result with result == CONFIRMED_POSITIVE"
        actor: QATechnician
        preconditions:
          - "EnvironmentalSwab.result == PRESUMPTIVE_POSITIVE"
        side_effects:
          - "hop 1: sets result = CONFIRMED_POSITIVE, resulted_at = logical clock now and resulted_by_user_id"
          - "hop 2 (caused by hop 1): opens a CorrectiveAction(status = OPEN, source_type = ENV_SWAB, source_ref_id = this swab's id, line_id = this swab's line, severity = CRITICAL when zone == ZONE_1 else MAJOR) and increments Line.open_corrective_action_count"
          - "hop 3 (caused by hop 2): recomputes §1.3 line_posture, which yields FROZEN for a CRITICAL action and RESTRICTED for a MAJOR one"
          - "hop 4 (caused by hop 3, only when the posture became FROZEN): every ProcessRun on the line with run_status == SETUP transitions to CANCELLED in planned_start_at ASC order; every ProcessRun on the line with run_status == RUNNING, and every ProcessRun on the line with run_status == CLOSED whose closed_at >= collected_at minus ENV_CLOSED_RUN_LOOKBACK_HOURS (24) hours, whose disposition_status != REJECTED, transitions disposition_status to HELD with a new HoldRecord(reason = ENVIRONMENTAL_POSITIVE)"
          - "hop 5 (caused by hop 4): for every run just held, its IN_INVENTORY cases become ON_HOLD in case_sequence ASC order, the HoldRecord's cases_held_count and shipped_case_count are set, the run's case counters are recomputed, and every GrowerLot consumed by that run gets env_positive_run_count incremented and its TRAILING risk score recomputed, which may transition those lots APPROVED -> SUSPENDED"
        note: "Environmental cascade. Five caused hops: swab -> corrective action -> line posture -> runs (cancel plus hold) -> cases and grower-lot trailing risk."
      - from: PRESUMPTIVE_POSITIVE
        to: NEGATIVE
        trigger: "POST /environmental-swabs/{id}/result with result == NEGATIVE"
        actor: QATechnician
        preconditions:
          - "EnvironmentalSwab.result == PRESUMPTIVE_POSITIVE"
        side_effects:
          - "sets resulted_at and resulted_by_user_id, and recomputes §1.3 line_posture, which can restore OPEN"
        note: "Confirmation testing ruled the presumptive finding out; no corrective action is opened, so nothing cascades."

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /corrective-actions/{id}/start"
        actor: QATechnician
        preconditions:
          - "CorrectiveAction.status == OPEN"
        side_effects:
          - "sets implemented_by_user_id = the acting X-User-ID"
      - from: IN_PROGRESS
        to: VERIFICATION_PENDING
        trigger: "POST /corrective-actions/{id}/submit-verification"
        actor: QATechnician
        preconditions:
          - "CorrectiveAction.status == IN_PROGRESS"
        side_effects:
          - "records action_taken from the request"
      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify with outcome == PASS"
        actor: QAManager
        preconditions:
          - "CorrectiveAction.status == VERIFICATION_PENDING"
          - "the verifying X-User-ID differs from implemented_by_user_id (segregation of duties)"
        side_effects:
          - "sets verified_at = logical clock now and verified_by_user_id"
          - "decrements Line.open_corrective_action_count and recomputes §1.3 line_posture, which can move the Line FROZEN -> RESTRICTED or FROZEN -> OPEN"
      - from: VERIFICATION_PENDING
        to: IN_PROGRESS
        trigger: "POST /corrective-actions/{id}/verify with outcome == FAIL"
        actor: QAManager
        preconditions:
          - "CorrectiveAction.status == VERIFICATION_PENDING"
          - "the verifying X-User-ID differs from implemented_by_user_id"
        side_effects:
          - "increments reopen_count by 1, clears action_taken and leaves the line posture unchanged"
        note: "Cycle: IN_PROGRESS -> VERIFICATION_PENDING -> IN_PROGRESS is unbounded; only a PASS verification terminates the record."

  - entity: FinishedCase
    initial_state: IN_INVENTORY
    terminal_states: [SHIPPED, DESTROYED]
    shape: cyclic
    transitions:
      - from: IN_INVENTORY
        to: ON_HOLD
        trigger: "system: any HoldRecord opening on the parent ProcessRun (operator hold, close-time auto-hold, recall hop 4, environmental hop 5)"
        actor: system
        preconditions:
          - "FinishedCase.status == IN_INVENTORY"
        side_effects:
          - "decrements ProcessRun.cases_available and increments cases_on_hold"
      - from: ON_HOLD
        to: IN_INVENTORY
        trigger: "system: POST /hold-records/{id}/release on the last non-terminal hold of the parent run"
        actor: system
        preconditions:
          - "FinishedCase.status == ON_HOLD"
        side_effects:
          - "increments ProcessRun.cases_available and decrements cases_on_hold, restoring both counters exactly"
          - "rewrites code_date and code_date_label from the FINAL shelf-life variant"
      - from: IN_INVENTORY
        to: SHIPPED
        trigger: "POST /finished-cases/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "FinishedCase.status == IN_INVENTORY"
          - "the parent ProcessRun.disposition_status IN {UNRESTRICTED, RELEASED}"
          - "code_date minus ship_date, in whole days, is >= the parent run's CustomerSpec.min_remaining_shelf_life_days_at_ship"
        side_effects:
          - "sets shipped_at = logical clock now"
          - "decrements ProcessRun.cases_available and increments cases_shipped"
      - from: ON_HOLD
        to: DESTROYED
        trigger: "system: POST /hold-records/{id}/reject on the parent run"
        actor: system
        preconditions:
          - "FinishedCase.status == ON_HOLD"
        side_effects:
          - "decrements ProcessRun.cases_on_hold and increments cases_destroyed"
          - "the conservation invariant cases_available + cases_on_hold + cases_shipped + cases_destroyed == cases_produced continues to hold"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version only)
# =============================================================================
concurrency_rules:

  - rule_id: spec-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /products/{id}/customer-specs"
    occ_field: "expected_product_version"
    description: |
      Creating a CustomerSpec against a Product whose version has advanced since the
      client last observed it is rejected. A new spec for a channel legitimately
      supersedes the prior ACTIVE spec on the same product_id and channel, so a writer
      holding a stale view of the product would silently supersede a revision it never
      saw. The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: consumption-create-stale-run
    parent_entity: ProcessRun
    write_endpoint: "POST /process-runs/{id}/lot-consumptions"
    occ_field: "expected_process_run_version"
    description: |
      Adding a LotConsumption to a ProcessRun whose version has advanced since the
      client last observed it is rejected. Each consumption changes the wash-system
      organic load and the run's mass balance, both of which the writer computed from
      its observed view of the run, so a writer whose view is stale would post pounds
      against a balance that no longer exists. The stale-version check makes the
      rejection deterministic.
    error_id: ERR_STALE_PROCESS_RUN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: receipt_temperature_grade_and_accepted_weight
    trigger: "on POST /raw-receipts (grade) and again on POST /raw-receipts/{id}/disposition with decision == ACCEPT (accepted pounds)"
    algorithm: threshold
    formula: |
      net_weight_lb = round_half_up(gross_weight_lb - tare_weight_lb, 2)

      # temp_grade uses two strict-greater breakpoints on the pulp temperature
      if pulp_temp_c > MAX_RECEIVING_TEMP_C:            temp_grade = OUT_OF_SPEC
      elif pulp_temp_c > WARN_RECEIVING_TEMP_C:         temp_grade = MARGINAL
      else:                                            temp_grade = IN_SPEC

      # the grade is frozen onto the receipt as a day count for the shelf-life rule
      shelf_life_deduction_days = TEMP_DEDUCTION_DAYS[temp_grade]      # 0 / 1 / 2

      # accepted pounds, only on ACCEPT
      accepted_lb  = round_half_up(net_weight_lb - trim_loss_lb, 2)
      remaining_lb = accepted_lb
    input_set: "The single RawReceipt row being created or dispositioned. No aggregation."
    constants:
      MAX_RECEIVING_TEMP_C: 4.4
      WARN_RECEIVING_TEMP_C: 3.3
      TEMP_DEDUCTION_DAYS: "{IN_SPEC: 0, MARGINAL: 1, OUT_OF_SPEC: 2}"
    precision: "weights: 2 decimal places, round_half_up. Temperatures are compared at exactly 1 decimal place with no rounding."
    notes:
      - "Both breakpoints are strict >. A pulp temperature of exactly 4.4 is MARGINAL, not OUT_OF_SPEC; exactly 3.3 is IN_SPEC, not MARGINAL."
      - "temp_grade feeds TEMP_DEDUCTION_DAYS in run_shelf_life_and_code_date and out_of_spec_receipt_count in grower_lot_risk_score, so the grade is stored, never recomputed at read time."
      - "An OUT_OF_SPEC receipt can still be ACCEPTED, but only by a QAManager supplying override_justification (§1.4 priority 3 and 38)."

  - name: wash_water_load_and_target_ppm
    trigger: "on POST /wash-systems/{id}/antimicrobial-readings, on POST /process-runs/{id}/lot-consumptions, on POST /lot-consumptions/{id}/void, on POST /process-runs/{id}/close and on POST /wash-systems/{id}/changeout"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - weighted organic load since the last change-out
      weighted_load_lb = 0
      for c in in_window_consumptions:                      # see input_set
          weighted_load_lb += c.consumed_lb * LOAD_FACTOR[product_of(c).commodity_class]
      weighted_load_lb = round_half_up(weighted_load_lb, 2)

      # STEP 2 - normalise against the flume volume, then pick the ppm tier
      organic_load_index = round_half_up(
          weighted_load_lb / (wash_system.water_volume_gal * LOAD_NORMALIZER), 3)

      if   organic_load_index >= CHANGEOUT_LOAD_INDEX_MAX: status = DUMP_REQUIRED
                                                           target_free_chlorine_ppm = null
      elif organic_load_index >= 1.500:                     target_free_chlorine_ppm = 55.0
      elif organic_load_index >= 0.500:                     target_free_chlorine_ppm = 35.0
      else:                                                 target_free_chlorine_ppm = 20.0

      # STEP 3 - the dwell requirement is derived FROM the tier chosen in step 2,
      #          using the latest reading's measured ppm as the denominator
      if target_free_chlorine_ppm is null or latest_reading is null:
          required_dwell_seconds = null
      else:
          required_dwell_seconds = max(
              BASE_DWELL_SECONDS,
              ceil(BASE_DWELL_SECONDS * target_free_chlorine_ppm
                                      / latest_reading.free_chlorine_ppm))

      # STEP 4 - the top-up requirement is derived FROM step 2 and the same reading
      topup_ppm_required = max(0.0, round_half_up(
          target_free_chlorine_ppm - latest_reading.free_chlorine_ppm, 1))
    input_set: |
      in_window_consumptions = every LotConsumption with status == ACTIVE whose
      process_run.wash_system_id == this wash system, whose process_run.run_status is
      RUNNING or CLOSED, and whose created_at >= wash_system.last_changeout_at
      (inclusive). Consumptions on SETUP or CANCELLED runs are excluded, as are
      consumptions with status == VOIDED. latest_reading is the AntimicrobialReading for
      this wash system with the greatest reading_at, tie-broken by the greatest
      sequence_no.
    constants:
      LOAD_FACTOR: "{LEAFY: 1.0, ROOT: 1.8, FRUIT: 0.5}"
      LOAD_NORMALIZER: 10
      CHANGEOUT_LOAD_INDEX_MAX: 3.000
      BASE_DWELL_SECONDS: 90
    precision: "weighted_load_lb 2 dp round_half_up; organic_load_index exactly 3 dp round_half_up; required_dwell_seconds an integer via ceil; topup_ppm_required 1 dp round_half_up"
    notes:
      - "The four steps are strictly ordered and each consumes the previous step's output: load -> tier -> dwell -> top-up. Deriving the dwell from the measured ppm instead of the tier ppm, or picking the tier before rounding the index to 3 dp, changes the answer."
      - "Both tier breakpoints are inclusive-lower (>=), and the change-out ceiling is also >=: an index of exactly 0.500 targets 35.0, exactly 1.500 targets 55.0, and exactly 3.000 forces a change-out."
      - "ProcessRun.start freezes target_ppm_at_start and required_dwell_seconds_at_start from this rule. The starting run's own consumptions are always created after started_at, so they never appear in the run's own frozen values."
      - "POST /wash-systems/{id}/changeout moves last_changeout_at forward, which empties in_window_consumptions and resets the index to 0.000 and the target to 20.0."

  - name: antimicrobial_compliance_check
    trigger: "on POST /process-runs/{id}/close"
    algorithm: aggregation
    formula: |
      window_readings = readings for run.wash_system_id with
                        run.started_at <= reading_at <= run.closed_at     # both ends inclusive
      if window_readings is empty: reject with ERR_NO_ANTIMICROBIAL_READINGS

      min_ppm_observed = min(r.free_chlorine_ppm for r in window_readings)   # 1 dp, no rounding
      antimicrobial_excursion_count = count(r for r in window_readings
                                            if r.free_chlorine_ppm < product.min_antimicrobial_ppm)
      excursion_ref_id = the id of the window reading with the lowest free_chlorine_ppm,
                         tie-broken by the lowest sequence_no
    input_set: "AntimicrobialReading rows for the run's wash_system_id whose reading_at falls in the inclusive window [started_at, closed_at]. Readings taken before the run started or after it closed are excluded even if they belong to the same wash system and the same change-out window."
    constants:
      MIN_WINDOW_READINGS: 1
    precision: "ppm values are compared at exactly 1 decimal place; counts are integers"
    notes:
      - "A reading exactly at started_at or exactly at closed_at is inside the window (both bounds inclusive)."
      - "The comparison against Product.min_antimicrobial_ppm is strict <, so a reading exactly equal to the minimum is compliant."
      - "antimicrobial_excursion_count > 0 does not block the close; it triggers the auto-hold plus corrective-action branch of the close cascade."

  - name: run_shelf_life_and_code_date
    trigger: "PROVISIONAL variant on POST /process-runs/{id}/close; FINAL variant on POST /hold-records/{id}/release"
    algorithm: threshold
    formula: |
      # base window: the product's own shelf life, capped by what the customer spec offers
      base_days = min(product.base_shelf_life_days, customer_spec.max_shelf_life_days_offered)

      # worst temperature grade across the run's ACTIVE consumptions' receipts
      worst_grade   = the grade with the greatest TEMP_DEDUCTION_DAYS among
                      {receipt.temp_grade for ACTIVE consumptions of the run}
      temp_penalty  = TEMP_DEDUCTION_DAYS[worst_grade]

      # harvest lag: whole days between the OLDEST harvest and the reference instant,
      # measured in whole hours then floored, less a grace day
      oldest_harvest = min(grower_lot.harvest_datetime for ACTIVE consumptions of the run)
      elapsed_hours  = floor((reference_instant - oldest_harvest) / 1 hour)
      lag_days       = floor(elapsed_hours / 24)
      harvest_penalty = max(0, lag_days - HARVEST_LAG_GRACE_DAYS)

      # spin shortfall: under-dried product loses a day
      spin_penalty = SPIN_SHORTFALL_PENALTY_DAYS if run.spin_rpm < product.min_spin_rpm else 0

      shelf_life_days = max(SHELF_LIFE_FLOOR_DAYS,
                            base_days - temp_penalty - harvest_penalty
                                      - spin_penalty - micro_penalty)

      code_date  = date_part(reference_instant) + shelf_life_days days     # UTC calendar days
      code_label = format(code_date, customer_spec.code_date_format)
                   # CALENDAR -> "YYYY-MM-DD";  JULIAN -> "YYYYDDD" zero-padded day-of-year
    input_set: "The run's LotConsumption rows with status == ACTIVE, their RawReceipts and those receipts' GrowerLots, plus the run's Product and CustomerSpec. VOIDED consumptions never contribute a temperature grade or a harvest date."
    constants:
      TEMP_DEDUCTION_DAYS: "{IN_SPEC: 0, MARGINAL: 1, OUT_OF_SPEC: 2}"
      HARVEST_LAG_GRACE_DAYS: 1
      SHELF_LIFE_FLOOR_DAYS: 3
      SPIN_SHORTFALL_PENALTY_DAYS: 1
      APC_ELEVATED_CFU_G: 1000000
      MICRO_PENALTY_DAYS: 2
    precision: "all day counts are integers; the floor is applied last, after every deduction"
    variants:
      - name: PROVISIONAL
        when: "computed at POST /process-runs/{id}/close and written to provisional_shelf_life_days / provisional_code_date"
        difference: "reference_instant = run.started_at, and micro_penalty = 0 because no micro result exists yet."
      - name: FINAL
        when: "recomputed at POST /hold-records/{id}/release and written to final_shelf_life_days / final_code_date, then stamped onto every non-SHIPPED, non-DESTROYED case of the run"
        difference: "reference_instant = run.closed_at (later, so the harvest lag can be a full day larger), and micro_penalty = MICRO_PENALTY_DAYS (2) when the releasing HoldRecord's latest_apc_cfu_g >= APC_ELEVATED_CFU_G, else 0."
    notes:
      - "The two variants can differ in both the day count and the code date: FINAL is never later than PROVISIONAL, and the divergence comes from two independent sources (a later reference instant and the micro penalty)."
      - "spin_penalty is evaluated in BOTH variants from the same reported spin_rpm, so it is never the source of a PROVISIONAL/FINAL divergence."
      - "The floor is a max, not a clamp on each term: base 12 with penalties totalling 11 yields 3, not 1."
      - "harvest_penalty subtracts the grace day AFTER flooring the lag, so 47 elapsed hours give lag_days 1 and penalty 0, while 51 elapsed hours give lag_days 2 and penalty 1."

  - name: grower_lot_risk_score
    trigger: "PREHARVEST variant on POST /grower-lots/{id}/approve; TRAILING variant on POST /raw-receipts/{id}/disposition, on hop 5 of the environmental cascade and on hop 6 of the recall cascade"
    algorithm: weighted_scoring
    formula: |
      # PREHARVEST: static field evidence only, evaluated once at approval
      preharvest_risk_score = 100
          - (WATER_SOURCE_PENALTY   if water_source == SURFACE           else 0)
          - (ANIMAL_ADJACENCY_PENALTY if adjacent_animal_operation is true else 0)
          - (PRESUMPTIVE_TEST_PENALTY if preharvest_test_result == PRESUMPTIVE else 0)
          - min(PRIOR_REJECT_PENALTY_CAP,
                PRIOR_REJECT_PENALTY_PER_LOAD * prior_rejected_receipt_count)
      preharvest_risk_score = clamp(preharvest_risk_score, 0, 100)

      # TRAILING: starts from the frozen preharvest score and subtracts operating evidence
      trailing_risk_score = preharvest_risk_score
          - OUT_OF_SPEC_RECEIPT_PENALTY * out_of_spec_receipt_count
          - ENV_POSITIVE_RUN_PENALTY    * env_positive_run_count
      trailing_risk_score = clamp(trailing_risk_score, 0, 100)

      if status == APPROVED and trailing_risk_score < RISK_SUSPEND_THRESHOLD:
          status = SUSPENDED
    input_set: |
      PREHARVEST reads only the GrowerLot's own input fields, so it is stable for the life of
      the lot. TRAILING reads out_of_spec_receipt_count (RawReceipt rows for this lot with
      temp_grade == OUT_OF_SPEC and status != REJECTED) and env_positive_run_count (distinct
      ProcessRun rows with an ACTIVE LotConsumption against one of this lot's receipts that
      carry a HoldRecord with reason == ENVIRONMENTAL_POSITIVE). Both counters are monotonic,
      so the trailing score never rises.
    constants:
      WATER_SOURCE_PENALTY: 25
      ANIMAL_ADJACENCY_PENALTY: 15
      PRESUMPTIVE_TEST_PENALTY: 20
      PRIOR_REJECT_PENALTY_PER_LOAD: 5
      PRIOR_REJECT_PENALTY_CAP: 20
      OUT_OF_SPEC_RECEIPT_PENALTY: 10
      ENV_POSITIVE_RUN_PENALTY: 12
      RISK_SUSPEND_THRESHOLD: 50
    precision: "integer arithmetic throughout; no intermediate rounding, so no rounding drift can accumulate across the weight terms"
    variants:
      - name: PREHARVEST
        when: "at POST /grower-lots/{id}/approve, written to preharvest_risk_score and copied into trailing_risk_score"
        difference: "Uses only the four static field-evidence penalties. A score below RISK_SUSPEND_THRESHOLD approves the lot straight into SUSPENDED; a POSITIVE preharvest test bypasses the score entirely and rejects the lot with score 0."
      - name: TRAILING
        when: "recomputed whenever operating evidence lands against the lot: a receipt disposition, an environmental confirmation, or a recall"
        difference: "Subtracts OUT_OF_SPEC_RECEIPT_PENALTY per out-of-spec receipt and ENV_POSITIVE_RUN_PENALTY per environmentally-implicated run from the FROZEN preharvest score, never from a re-derived one. Crossing below RISK_SUSPEND_THRESHOLD transitions the lot APPROVED -> SUSPENDED."
    notes:
      - "The prior-reject term is capped BEFORE subtraction, so 4 and 40 prior rejected loads both cost 20 points."
      - "The suspension comparison is strict <: a trailing score of exactly 50 keeps the lot APPROVED."
      - "REJECTED receipts do not count as out-of-spec receipts; only ACCEPTED or QUARANTINED loads with temp_grade == OUT_OF_SPEC do."

  - name: run_cost_allocation_per_case
    trigger: "on POST /process-runs/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      # PHASE 1 - four components, each rounded to whole cents INDEPENDENTLY, then summed
      water_cost_cents     = round_half_up(water_gal_used * WATER_RATE_CENTS_PER_GAL)
      sanitizer_cost_cents = round_half_up(closing_topup_ppm * water_gal_used
                                                             * SANITIZER_RATE_CENTS_PER_PPM_GAL)
      run_minutes          = floor((closed_at - started_at) / 1 minute)
      labor_cost_cents     = round_half_up(run_minutes * crew_size
                                                       * LABOR_RATE_CENTS_PER_CREW_MINUTE)
      energy_cost_cents    = round_half_up(spin_seconds * cases_produced
                                                       * ENERGY_RATE_CENTS_PER_SPIN_SECOND_CASE)
      total_run_cost_cents = water_cost_cents + sanitizer_cost_cents
                           + labor_cost_cents + energy_cost_cents

      # PHASE 2 - allocate the total across the cases with no cent created or destroyed
      per_case_cost_cents  = floor(total_run_cost_cents / cases_produced)
      cost_remainder_cents = total_run_cost_cents - per_case_cost_cents * cases_produced

      # the remainder is a waterfall over case_sequence ASC: the first
      # cost_remainder_cents cases absorb one extra cent each
      for case in cases ordered by case_sequence ASC:
          if case.case_sequence <= cost_remainder_cents:
              case.allocated_cost_cents = per_case_cost_cents + 1
          else:
              case.allocated_cost_cents = per_case_cost_cents
    input_set: "The closing ProcessRun's own reported fields (water_gal_used, crew_size, spin_seconds, cases_produced), its started_at/closed_at instants, and closing_topup_ppm = topup_ppm_required of the AntimicrobialReading for the run's wash system with the greatest reading_at inside the inclusive window [started_at, closed_at], tie-broken by the greatest sequence_no."
    constants:
      WATER_RATE_CENTS_PER_GAL: 0.37
      SANITIZER_RATE_CENTS_PER_PPM_GAL: 0.0021
      LABOR_RATE_CENTS_PER_CREW_MINUTE: 58
      ENERGY_RATE_CENTS_PER_SPIN_SECOND_CASE: 0.014
    precision: "every component is rounded half-up to whole cents before the sum; the allocation uses integer floor division and an integer remainder; no monetary value is ever stored as a fraction of a cent"
    notes:
      - "Two rounding orders are in play and both are pinned. Components are rounded first and then summed. The allocation floors the per-case share and distributes the remainder, so sum(allocated_cost_cents) == total_run_cost_cents exactly."
      - "Allocating round_half_up(total / cases) to every case instead would inflate the allocated total above total_run_cost_cents whenever the remainder is more than half the case count; the invariant test in §1.8 pins the difference."
      - "The waterfall key is case_sequence, never FinishedCase.id: the ids are opaque UUIDs and are never used in a business decision."
      - "A run closed in the same logical-clock instant it started has run_minutes 0 and therefore zero labor cost; the allocation still holds."

  - name: line_posture
    trigger: "recomputed on every SanitationEvent transition, every CorrectiveAction transition, every EnvironmentalSwab result, and read as a precondition of POST /process-runs/{id}/start"
    algorithm: projection
    formula: |
      latest_sanitation = the SanitationEvent for this line with the greatest scheduled_for,
                          tie-broken by the greatest sequence_no
      open_critical  = exists CorrectiveAction on this line with severity == CRITICAL
                       and status != VERIFIED
      open_major     = exists CorrectiveAction on this line with severity == MAJOR
                       and status != VERIFIED
      open_presumptive = exists EnvironmentalSwab on this line with
                         result == PRESUMPTIVE_POSITIVE

      if   open_critical:                                  posture = FROZEN
      elif open_major or open_presumptive:                 posture = RESTRICTED
      elif latest_sanitation is null:                      posture = RESTRICTED
      elif latest_sanitation.status != VALIDATED:          posture = RESTRICTED
      else:                                                posture = OPEN
    input_set: "Every SanitationEvent, CorrectiveAction and EnvironmentalSwab whose line_id is this line. Rows on other lines never affect this line's posture, even when they share a wash system."
    constants:
      NEW_LINE_POSTURE: RESTRICTED
    precision: "not applicable; the result is an enum"
    notes:
      - "This is a compound (derived-parent) state: the Line has no posture-changing endpoint of its own, and every posture value is a pure projection of its children."
      - "The branches are evaluated strictly in order, so a line carrying both an open CRITICAL and an open MAJOR action is FROZEN, and a line with a VALIDATED sanitation but an unverified MAJOR action is still RESTRICTED."
      - "Passing a fresh sanitation does NOT clear an unverified corrective action: the posture stays RESTRICTED until the action reaches VERIFIED. This is the cross-entity gate behind ERR_LINE_NOT_OPEN."
      - "latest_sanitation is keyed on scheduled_for, not created_at, so back-filling an earlier-scheduled clean after a later one does not change the posture."

  - name: run_mass_balance_and_yield
    trigger: "on POST /process-runs/{id}/lot-consumptions, on POST /lot-consumptions/{id}/void and on POST /process-runs/{id}/close"
    algorithm: aggregation
    formula: |
      # receipt-side balance, maintained incrementally per receipt
      receipt.remaining_lb = round_half_up(
          receipt.accepted_lb
          - sum(c.consumed_lb for c in LotConsumption where c.raw_receipt_id == receipt.id
                                                        and c.status == ACTIVE), 2)

      # run-side balance
      run.input_lb  = round_half_up(
          sum(c.consumed_lb for c in LotConsumption where c.process_run_id == run.id
                                                      and c.status == ACTIVE), 2)
      run.output_lb = round_half_up(cases_produced * customer_spec.case_net_weight_lb, 2)
      run.yield_pct = round_half_up(run.output_lb / run.input_lb * 100, 2)

      if run.input_lb == 0:                        reject the close with ERR_NO_LOTS_CONSUMED
      if run.yield_pct < product.min_yield_pct
         or run.yield_pct > MAX_YIELD_PCT:          reject the close with ERR_YIELD_OUT_OF_TOLERANCE
    input_set: "LotConsumption rows with status == ACTIVE only. Voiding a row removes its pounds from both balances, which is what makes the void a true compensating operation."
    constants:
      MAX_YIELD_PCT: 100.00
    precision: "pounds 2 dp round_half_up; yield_pct exactly 2 dp round_half_up; the tolerance comparisons are made on the rounded yield_pct, not on the unrounded quotient"
    notes:
      - "A consumption is refused when consumed_lb > receipt.remaining_lb (ERR_INSUFFICIENT_RECEIPT_BALANCE), evaluated against the balance including every earlier ACTIVE consumption from any run."
      - "Voiding a consumption restores receipt.remaining_lb to exactly its pre-consumption value and removes the pounds from run.input_lb; no residue is left behind (compensating invariant)."
      - "The lower tolerance is strict < against product.min_yield_pct, so a yield exactly equal to the product minimum passes; the upper bound is strict > against 100.00, because more finished pounds than raw pounds in is physically impossible."

  - name: case_disposition_counts
    trigger: "recomputed on POST /process-runs/{id}/close, on every HoldRecord opening, on POST /hold-records/{id}/release, on POST /hold-records/{id}/reject and on POST /finished-cases/{id}/ship"
    algorithm: aggregation
    formula: |
      cases_available = count(c for c in run.cases if c.status == IN_INVENTORY)
      cases_on_hold   = count(c for c in run.cases if c.status == ON_HOLD)
      cases_shipped   = count(c for c in run.cases if c.status == SHIPPED)
      cases_destroyed = count(c for c in run.cases if c.status == DESTROYED)

      # conservation invariant, true after every one of the triggers above
      assert cases_available + cases_on_hold + cases_shipped + cases_destroyed
             == run.cases_produced
    input_set: "Every FinishedCase row with process_run_id == this run. Cases are never deleted, only re-dispositioned, so cases_produced is a fixed denominator once the run has closed."
    constants:
      CASE_STATUS_PARTITION: "{IN_INVENTORY, ON_HOLD, SHIPPED, DESTROYED}"
    precision: "integer counts"
    notes:
      - "The four counters partition the run's cases: no case is ever counted twice and none is ever dropped."
      - "A hold opened after some cases have shipped moves only the IN_INVENTORY cases; HoldRecord.shipped_case_count records how many cases had already left, which is the recall-effectiveness number."
      - "Releasing a hold restores cases_available and cases_on_hold to their exact pre-hold values, so the pair (available, on_hold) round-trips."

# =============================================================================
# §1.4 Validation Rules Table (unique ascending priorities; lowest wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty; a header sent as an empty string counts as absent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles in §1.7 AND appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "override_justification may only be supplied by X-User-Role == QAManager; any other role sending a non-null override_justification is refused before the payload is examined"
    error_id: ERR_OVERRIDE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /raw-receipts/{id}/disposition"

  - priority: 4
    category: existence
    check: "request body is a JSON object, every required input field is present, every enum value is a declared member, every numeric field is a number of the right sign, every datetime field is an ISO 8601 UTC instant, and no field carries a null where a value is required. Unknown fields are ignored, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every {id} path segment naming a Product resolves to an existing Product; path segments are resolved left to right and always before any body field"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "GET /products/{id}, POST /products/{id}/customer-specs, GET /products/{id}/customer-specs"

  - priority: 6
    category: existence
    check: "every {id} path segment naming a GrowerLot resolves to an existing GrowerLot"
    error_id: ERR_GROWER_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /grower-lots/{id}, POST /grower-lots/{id}/approve, POST /grower-lots/{id}/recall, GET /grower-lots/{id}/raw-receipts"

  - priority: 7
    category: existence
    check: "every {id} path segment naming a RawReceipt resolves to an existing RawReceipt"
    error_id: ERR_RAW_RECEIPT_NOT_FOUND
    http_status: 404
    applies_to: "GET /raw-receipts/{id}, POST /raw-receipts/{id}/disposition, GET /raw-receipts/{id}/lot-consumptions"

  - priority: 8
    category: existence
    check: "every {id} path segment naming a Line resolves to an existing Line"
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /lines/{id}, POST and GET /lines/{id}/sanitation-events, POST and GET /lines/{id}/environmental-swabs, GET /lines/{id}/corrective-actions"

  - priority: 9
    category: existence
    check: "every {id} path segment naming a WashSystem resolves to an existing WashSystem"
    error_id: ERR_WASH_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /wash-systems/{id}, POST and GET /wash-systems/{id}/antimicrobial-readings, POST /wash-systems/{id}/changeout"

  - priority: 10
    category: existence
    check: "every {id} path segment naming a ProcessRun resolves to an existing ProcessRun"
    error_id: ERR_PROCESS_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /process-runs/{id}, POST /process-runs/{id}/start, POST /process-runs/{id}/close, POST and GET /process-runs/{id}/lot-consumptions, GET /process-runs/{id}/finished-cases, GET /process-runs/{id}/traceability, POST and GET /process-runs/{id}/hold-records"

  - priority: 11
    category: existence
    check: "every {id} path segment naming a LotConsumption resolves to an existing LotConsumption"
    error_id: ERR_LOT_CONSUMPTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /lot-consumptions/{id}/void"

  - priority: 12
    category: existence
    check: "every {id} path segment naming a FinishedCase resolves to an existing FinishedCase"
    error_id: ERR_FINISHED_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /finished-cases/{id}/ship"

  - priority: 13
    category: existence
    check: "every {id} path segment naming a HoldRecord resolves to an existing HoldRecord"
    error_id: ERR_HOLD_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "POST /hold-records/{id}/submit-sample, POST /hold-records/{id}/record-result, POST /hold-records/{id}/release, POST /hold-records/{id}/reject"

  - priority: 14
    category: existence
    check: "every {id} path segment naming a SanitationEvent resolves to an existing SanitationEvent"
    error_id: ERR_SANITATION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sanitation-events/{id}/start, POST /sanitation-events/{id}/submit, POST /sanitation-events/{id}/validate"

  - priority: 15
    category: existence
    check: "every {id} path segment naming an EnvironmentalSwab resolves to an existing EnvironmentalSwab"
    error_id: ERR_ENVIRONMENTAL_SWAB_NOT_FOUND
    http_status: 404
    applies_to: "POST /environmental-swabs/{id}/result"

  - priority: 16
    category: existence
    check: "every {id} path segment naming a CorrectiveAction resolves to an existing CorrectiveAction"
    error_id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /corrective-actions/{id}/start, POST /corrective-actions/{id}/submit-verification, POST /corrective-actions/{id}/verify"

  - priority: 17
    category: existence
    check: "body field grower_lot_id resolves to an existing GrowerLot"
    error_id: ERR_GROWER_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /raw-receipts"

  - priority: 18
    category: existence
    check: "body field line_id resolves to an existing Line; body foreign keys are resolved in the order they are declared in the endpoint's input list, which for POST /process-runs is line_id, product_id, customer_spec_id, wash_system_id, rework_source_run_id"
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs"

  - priority: 19
    category: existence
    check: "body field product_id resolves to an existing Product"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs"

  - priority: 20
    category: existence
    check: "body field customer_spec_id resolves to an existing CustomerSpec"
    error_id: ERR_CUSTOMER_SPEC_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs"

  - priority: 21
    category: existence
    check: "body field wash_system_id resolves to an existing WashSystem"
    error_id: ERR_WASH_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs"

  - priority: 22
    category: existence
    check: "body field rework_source_run_id, when present and non-null, resolves to an existing ProcessRun"
    error_id: ERR_PROCESS_RUN_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs"

  - priority: 23
    category: existence
    check: "body field raw_receipt_id resolves to an existing RawReceipt"
    error_id: ERR_RAW_RECEIPT_NOT_FOUND
    http_status: 404
    applies_to: "POST /process-runs/{id}/lot-consumptions"

  - priority: 24
    category: state
    check: "expected_product_version equals the current Product.version (§1.2.1 spec-create-stale-product)"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /products/{id}/customer-specs"

  - priority: 25
    category: state
    check: "expected_process_run_version equals the current ProcessRun.version (§1.2.1 consumption-create-stale-run)"
    error_id: ERR_STALE_PROCESS_RUN_VERSION
    http_status: 412
    applies_to: "POST /process-runs/{id}/lot-consumptions, POST /lot-consumptions/{id}/void"

  - priority: 26
    category: state
    check: "GrowerLot.status == PENDING_APPROVAL for approve, and GrowerLot.status IN {APPROVED, SUSPENDED} for recall"
    error_id: ERR_GROWER_LOT_INVALID_STATE
    http_status: 409
    applies_to: "POST /grower-lots/{id}/approve, POST /grower-lots/{id}/recall"

  - priority: 27
    category: state
    check: "RawReceipt.status == PENDING_INSPECTION"
    error_id: ERR_RECEIPT_NOT_PENDING
    http_status: 409
    applies_to: "POST /raw-receipts/{id}/disposition"

  - priority: 28
    category: state
    check: "ProcessRun.run_status == SETUP"
    error_id: ERR_RUN_NOT_IN_SETUP
    http_status: 409
    applies_to: "POST /process-runs/{id}/start"

  - priority: 29
    category: state
    check: "ProcessRun.run_status == RUNNING for close; ProcessRun.run_status IN {SETUP, RUNNING} for adding or voiding a consumption"
    error_id: ERR_RUN_NOT_RUNNING
    http_status: 409
    applies_to: "POST /process-runs/{id}/close, POST /process-runs/{id}/lot-consumptions, POST /lot-consumptions/{id}/void"

  - priority: 30
    category: state
    check: "LotConsumption.status == ACTIVE"
    error_id: ERR_CONSUMPTION_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /lot-consumptions/{id}/void"

  - priority: 31
    category: state
    check: "SanitationEvent.status IN {SCHEDULED, FAILED} for start, == IN_PROGRESS for submit, == AWAITING_VALIDATION for validate"
    error_id: ERR_SANITATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /sanitation-events/{id}/start, POST /sanitation-events/{id}/submit, POST /sanitation-events/{id}/validate"

  - priority: 32
    category: state
    check: "the requested result is a legal transition of §1.2 EnvironmentalSwab: PENDING accepts NEGATIVE and PRESUMPTIVE_POSITIVE; PRESUMPTIVE_POSITIVE accepts CONFIRMED_POSITIVE and NEGATIVE; a swab already NEGATIVE or CONFIRMED_POSITIVE accepts nothing"
    error_id: ERR_SWAB_INVALID_RESULT_TRANSITION
    http_status: 409
    applies_to: "POST /environmental-swabs/{id}/result"

  - priority: 33
    category: state
    check: "CorrectiveAction.status == OPEN for start, == IN_PROGRESS for submit-verification, == VERIFICATION_PENDING for verify"
    error_id: ERR_CORRECTIVE_ACTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /corrective-actions/{id}/start, POST /corrective-actions/{id}/submit-verification, POST /corrective-actions/{id}/verify"

  - priority: 34
    category: state
    check: "HoldRecord.status IN {HELD, RETEST_REQUIRED} for submit-sample, == UNDER_TEST for record-result and release, IN {UNDER_TEST, RETEST_REQUIRED} for reject; and for release, every OTHER HoldRecord on the same run is in a terminal state"
    error_id: ERR_HOLD_INVALID_STATE
    http_status: 409
    applies_to: "POST /hold-records/{id}/submit-sample, POST /hold-records/{id}/record-result, POST /hold-records/{id}/release, POST /hold-records/{id}/reject"

  - priority: 35
    category: state
    check: "the parent ProcessRun.disposition_status IN {UNRESTRICTED, RELEASED}; a run that is HELD or REJECTED cannot ship. Evaluated BEFORE the case's own status so that a held case reports the run-level cause rather than the case-level symptom."
    error_id: ERR_HOLD_NOT_RELEASED
    http_status: 409
    applies_to: "POST /finished-cases/{id}/ship"

  - priority: 36
    category: state
    check: "FinishedCase.status == IN_INVENTORY; reachable for an already SHIPPED or DESTROYED case whose run disposition is UNRESTRICTED or RELEASED"
    error_id: ERR_CASE_NOT_IN_INVENTORY
    http_status: 409
    applies_to: "POST /finished-cases/{id}/ship"

  - priority: 37
    category: business_constraint
    check: "the acting X-User-ID differs from the counterparty user on the record: SanitationEvent.performed_by_user_id at validate, HoldRecord.resulted_by_user_id at release, CorrectiveAction.implemented_by_user_id at verify"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /sanitation-events/{id}/validate, POST /hold-records/{id}/release, POST /corrective-actions/{id}/verify"

  - priority: 38
    category: business_safety
    check: "RawReceipt.temp_grade != OUT_OF_SPEC, unless X-User-Role == QAManager and override_justification is a non-empty string"
    error_id: ERR_RECEIPT_TEMP_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST /raw-receipts/{id}/disposition with decision == ACCEPT"

  - priority: 39
    category: business_safety
    check: "the GrowerLot behind the referenced RawReceipt has status == APPROVED; PENDING_APPROVAL, SUSPENDED, REJECTED and RECALLED lots may never be consumed"
    error_id: ERR_GROWER_LOT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /process-runs/{id}/lot-consumptions"

  - priority: 40
    category: business_safety
    check: "the referenced RawReceipt has status == ACCEPTED; PENDING_INSPECTION, REJECTED and QUARANTINED loads may never be consumed. Evaluated BEFORE the pound balance so an unusable load never reports a balance error."
    error_id: ERR_RECEIPT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /process-runs/{id}/lot-consumptions"

  - priority: 41
    category: business_safety
    check: "Line.posture == OPEN per §1.3 line_posture; RESTRICTED and FROZEN lines cannot start a run"
    error_id: ERR_LINE_NOT_OPEN
    http_status: 409
    applies_to: "POST /process-runs/{id}/start"

  - priority: 42
    category: business_safety
    check: "the run's WashSystem.status == IN_SERVICE"
    error_id: ERR_WASH_SYSTEM_DUMP_REQUIRED
    http_status: 422
    applies_to: "POST /process-runs/{id}/start"

  - priority: 43
    category: business_safety
    check: "at start, at least one AntimicrobialReading exists for the run's wash system; at close, at least one reading falls inside the inclusive window [started_at, closed_at]"
    error_id: ERR_NO_ANTIMICROBIAL_READINGS
    http_status: 422
    applies_to: "POST /process-runs/{id}/start, POST /process-runs/{id}/close"

  - priority: 44
    category: business_safety
    check: "the latest AntimicrobialReading for the wash system has reading_at no earlier than the logical clock now minus ANTIMICROBIAL_READING_MAX_AGE_MINUTES (60); exactly 60 minutes old is still fresh"
    error_id: ERR_ANTIMICROBIAL_READING_STALE
    http_status: 422
    applies_to: "POST /process-runs/{id}/start"

  - priority: 45
    category: business_safety
    check: "the latest AntimicrobialReading has free_chlorine_ppm >= Product.min_antimicrobial_ppm; exactly equal passes"
    error_id: ERR_ANTIMICROBIAL_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /process-runs/{id}/start"

  - priority: 46
    category: business_safety
    check: "when ProcessRun.allergen_changeover_required is true, the newest VALIDATED SanitationEvent on the line has is_allergen_changeover == true, allergen_swab_result == NEGATIVE, and validated_at >= Line.last_run_ended_at"
    error_id: ERR_ALLERGEN_CHANGEOVER_NOT_VALIDATED
    http_status: 422
    applies_to: "POST /process-runs/{id}/start"

  - priority: 47
    category: business_safety
    check: "disassembled_component_count >= Line.required_disassembly_component_count; exactly equal passes"
    error_id: ERR_DISASSEMBLY_INCOMPLETE
    http_status: 422
    applies_to: "POST /sanitation-events/{id}/submit"

  - priority: 48
    category: business_safety
    check: "actual_dwell_seconds >= max(Product.min_dwell_seconds, ProcessRun.required_dwell_seconds_at_start); exactly equal passes"
    error_id: ERR_DWELL_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /process-runs/{id}/close"

  - priority: 49
    category: business_referential
    check: "the referenced CustomerSpec.product_id equals the referenced product_id"
    error_id: ERR_SPEC_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /process-runs"

  - priority: 50
    category: business_referential
    check: "the referenced CustomerSpec.status == ACTIVE; a superseded revision cannot be packed to"
    error_id: ERR_SPEC_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /process-runs"

  - priority: 51
    category: business_referential
    check: "the GrowerLot behind the referenced RawReceipt has commodity_class equal to the run's Product.commodity_class"
    error_id: ERR_COMMODITY_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /process-runs/{id}/lot-consumptions"

  - priority: 52
    category: business_referential
    check: "atmosphere_actual equals the run's CustomerSpec.atmosphere_required"
    error_id: ERR_ATMOSPHERE_MISMATCH
    http_status: 422
    applies_to: "POST /process-runs/{id}/close"

  - priority: 53
    category: business_referential
    check: "when rework_source_run_id is supplied, that run has disposition_status == REJECTED; only rejected product may be reworked"
    error_id: ERR_REWORK_SOURCE_NOT_REJECTED
    http_status: 422
    applies_to: "POST /process-runs"

  - priority: 54
    category: business_temporal
    check: "the half-open window [planned_start_at, planned_end_at) must not overlap the window of any other ProcessRun on the same line whose run_status IN {SETUP, RUNNING}; touching windows (one ends exactly when the next begins) do not overlap. planned_end_at must also be strictly after planned_start_at."
    error_id: ERR_LINE_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /process-runs"

  - priority: 55
    category: business_temporal
    check: "when the immediately preceding non-terminal run on the line (the one with the greatest planned_end_at <= the new planned_start_at) packs a Product with a different allergen_group, the gap between that planned_end_at and the new planned_start_at must be >= CHANGEOVER_BUFFER_MINUTES (45); exactly 45 minutes passes"
    error_id: ERR_CHANGEOVER_BUFFER_REQUIRED
    http_status: 409
    applies_to: "POST /process-runs"

  - priority: 56
    category: business_temporal
    check: "the whole days between the ship date (the UTC date of the logical clock now) and FinishedCase.code_date must be >= the run's CustomerSpec.min_remaining_shelf_life_days_at_ship; exactly equal passes"
    error_id: ERR_INSUFFICIENT_REMAINING_SHELF_LIFE
    http_status: 422
    applies_to: "POST /finished-cases/{id}/ship"

  - priority: 57
    category: business_constraint
    check: "no ProcessRun on the line has run_status == RUNNING when a sanitation event is started"
    error_id: ERR_LINE_RUN_IN_PROGRESS
    http_status: 409
    applies_to: "POST /sanitation-events/{id}/start"

  - priority: 58
    category: business_constraint
    check: "HoldRecord.test_round < MAX_TEST_ROUNDS (3); the fourth submitted sample is refused"
    error_id: ERR_MAX_RETEST_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /hold-records/{id}/submit-sample"

  - priority: 59
    category: business_constraint
    check: "HoldRecord.latest_test_result == NEGATIVE; a POSITIVE or INDETERMINATE latest result cannot be released"
    error_id: ERR_TEST_RESULT_NOT_NEGATIVE
    http_status: 409
    applies_to: "POST /hold-records/{id}/release"

  - priority: 60
    category: business_constraint
    check: "trim_loss_lb <= RawReceipt.net_weight_lb"
    error_id: ERR_TRIM_LOSS_EXCEEDS_NET
    http_status: 422
    applies_to: "POST /raw-receipts/{id}/disposition with decision == ACCEPT"

  - priority: 61
    category: business_constraint
    check: "at least one LotConsumption row for the run has status == ACTIVE, so input_lb > 0"
    error_id: ERR_NO_LOTS_CONSUMED
    http_status: 422
    applies_to: "POST /process-runs/{id}/close"

  - priority: 62
    category: business_constraint
    check: "the computed yield_pct is >= Product.min_yield_pct and <= MAX_YIELD_PCT (100.00), both bounds inclusive (§1.3 run_mass_balance_and_yield)"
    error_id: ERR_YIELD_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /process-runs/{id}/close"

  - priority: 63
    category: business_constraint
    check: "Product.code, Line.line_code and WashSystem.system_code are each unique across the plant; CustomerSpec is deliberately NOT unique per (product_id, channel) because a new revision supersedes the prior one"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /products, POST /lines, POST /wash-systems"

  - priority: 64
    category: business_fiscal
    check: "consumed_lb <= RawReceipt.remaining_lb, where remaining_lb already nets out every earlier ACTIVE consumption from any run; exactly equal passes and drives the balance to 0"
    error_id: ERR_INSUFFICIENT_RECEIPT_BALANCE
    http_status: 422
    applies_to: "POST /process-runs/{id}/lot-consumptions"

  - priority: 65
    category: business_fiscal
    check: "the count of other ProcessRun rows on the same wash system with run_status IN {SETUP, RUNNING} whose half-open planned window overlaps the new run's window must be < WashSystem.max_concurrent_runs; the new run is the (count + 1)-th occupant"
    error_id: ERR_WASH_SYSTEM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /process-runs"

# =============================================================================
# §1.5 API Endpoint Table (api_prefix is "", so every path is root-mounted)
# =============================================================================
endpoints:

  - method: POST
    path: "/products"
    description: "Register a fresh-cut product with its processing parameters and shelf-life basis."
    roles: [PlantAdmin]
    code: 201
    input: [code, name, commodity_class, allergen_group, min_dwell_seconds, min_spin_rpm, min_antimicrobial_ppm, base_shelf_life_days, min_yield_pct, hold_and_release_required]
    output: Product
    side_effects: ["sets active_spec_count to 0", "rejects a duplicate code with ERR_DUPLICATE_CODE"]

  - method: GET
    path: "/products"
    description: "List products."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator]
    code: 200
    input: ["commodity_class?", "allergen_group?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Retrieve one product."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{id}/customer-specs"
    description: "Publish a customer specification revision for this product and channel. The new revision supersedes the prior ACTIVE spec on the same product and channel, so the caller must present the product version it observed (§1.2.1 spec-create-stale-product)."
    roles: [PlantAdmin]
    code: 201
    input: [customer_code, channel, max_shelf_life_days_offered, min_remaining_shelf_life_days_at_ship, atmosphere_required, case_net_weight_lb, code_date_format, expected_product_version]
    output: CustomerSpec
    side_effects:
      - "computes spec_revision as 1 + the count of existing specs for the same product_id and channel"
      - "sets the prior ACTIVE spec for the same product_id and channel to SUPERSEDED and stamps its superseded_at"
      - "recomputes Product.active_spec_count"
      - "increments Product.version by 1"
      - "rejects a stale expected_product_version with ERR_STALE_PRODUCT_VERSION (412)"

  - method: GET
    path: "/products/{id}/customer-specs"
    description: "List the customer specification revisions of this product."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, ShippingClerk]
    code: 200
    input: ["channel?", "status?", "limit?", "offset?"]
    output: CustomerSpec[]
    side_effects: []

  - method: POST
    path: "/lines"
    description: "Register a cutting and washing line with its sanitation acceptance criteria."
    roles: [PlantAdmin]
    code: 201
    input: [line_code, required_disassembly_component_count, max_atp_rlu]
    output: Line
    side_effects:
      - "sets posture to RESTRICTED: a line with no VALIDATED sanitation cannot start a run"
      - "sets open_corrective_action_count to 0 and last_validated_sanitation_at, last_run_allergen_group, last_run_ended_at to null"
      - "rejects a duplicate line_code with ERR_DUPLICATE_CODE"

  - method: GET
    path: "/lines"
    description: "List lines with their derived posture."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, SanitationTech]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Line[]
    side_effects: []

  - method: GET
    path: "/lines/{id}"
    description: "Retrieve one line, including the posture derived by §1.3 line_posture."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, SanitationTech]
    code: 200
    input: []
    output: Line
    side_effects: []

  - method: POST
    path: "/wash-systems"
    description: "Register a wash flume with its working volume and concurrent-run capacity."
    roles: [PlantAdmin]
    code: 201
    input: [system_code, water_volume_gal, max_concurrent_runs]
    output: WashSystem
    side_effects:
      - "sets status IN_SERVICE, last_changeout_at to the logical clock now, weighted_load_lb 0, organic_load_index 0.000, target_free_chlorine_ppm 20.0, changeout_count 0 and reading_sequence_high_water 0"
      - "rejects a duplicate system_code with ERR_DUPLICATE_CODE"

  - method: GET
    path: "/wash-systems/{id}"
    description: "Retrieve one wash system with its current organic load index and target free chlorine."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, SanitationTech]
    code: 200
    input: []
    output: WashSystem
    side_effects: []

  - method: POST
    path: "/grower-lots"
    description: "Identify a grower lot at receiving with its preharvest risk evidence."
    roles: [QATechnician]
    code: 201
    input: ["grower_code", "ranch_block", "commodity_class", "harvest_datetime", "water_source", "adjacent_animal_operation", "preharvest_test_result", "prior_rejected_receipt_count?"]
    output: GrowerLot
    side_effects:
      - "sets status PENDING_APPROVAL and leaves preharvest_risk_score and trailing_risk_score null until approval"
      - "defaults prior_rejected_receipt_count to 0 when omitted"
      - "sets out_of_spec_receipt_count and env_positive_run_count to 0"

  - method: GET
    path: "/grower-lots"
    description: "List grower lots with their risk scores."
    roles: [PlantAdmin, QAManager, QATechnician, ReceivingClerk]
    code: 200
    input: ["status?", "grower_code?", "limit?", "offset?"]
    output: GrowerLot[]
    side_effects: []

  - method: GET
    path: "/grower-lots/{id}"
    description: "Retrieve one grower lot."
    roles: [PlantAdmin, QAManager, QATechnician, ReceivingClerk]
    code: 200
    input: []
    output: GrowerLot
    side_effects: []

  - method: POST
    path: "/grower-lots/{id}/approve"
    description: "Adjudicate a pending grower lot: compute the PREHARVEST risk score and approve, approve-into-suspension, or reject."
    roles: [QAManager]
    code: 200
    input: []
    output: GrowerLot
    side_effects:
      - "computes the PREHARVEST variant of §1.3 grower_lot_risk_score into preharvest_risk_score and copies it into trailing_risk_score"
      - "moves status to APPROVED, SUSPENDED (score below RISK_SUSPEND_THRESHOLD) or REJECTED (preharvest_test_result == POSITIVE)"
      - "increments GrowerLot.version by 1"

  - method: POST
    path: "/grower-lots/{id}/recall"
    description: "Recall a grower lot and propagate the five-hop traceability cascade to receipts, runs, holds, cases and rework descendants."
    roles: [QAManager]
    code: 200
    input: []
    output: GrowerLot
    side_effects:
      - "runs hops 1-6 of the recall cascade declared on §1.2 GrowerLot APPROVED -> RECALLED"
      - "quarantines the lot's receipts, holds every non-REJECTED run with an ACTIVE consumption of them plus every non-REJECTED rework descendant of any run that consumed one of those receipts (a REJECTED run is itself skipped but is still walked through, since only a REJECTED run can be a rework source), moves their IN_INVENTORY cases to ON_HOLD and records shipped_case_count on each opened HoldRecord"
      - "recomputes the TRAILING risk score of every grower lot consumed by an affected run"

  - method: POST
    path: "/raw-receipts"
    description: "Record a raw product load at the dock with its verified pulp temperature."
    roles: [ReceivingClerk]
    code: 201
    input: [grower_lot_id, received_at, pulp_temp_c, gross_weight_lb, tare_weight_lb]
    output: RawReceipt
    side_effects:
      - "computes net_weight_lb, temp_grade and shelf_life_deduction_days per §1.3 receipt_temperature_grade_and_accepted_weight"
      - "sets status PENDING_INSPECTION and leaves trim_loss_lb, accepted_lb and remaining_lb null"

  - method: GET
    path: "/raw-receipts/{id}"
    description: "Retrieve one raw receipt with its temperature grade and remaining pounds."
    roles: [PlantAdmin, QAManager, QATechnician, ReceivingClerk, LineOperator]
    code: 200
    input: []
    output: RawReceipt
    side_effects: []

  - method: GET
    path: "/grower-lots/{id}/raw-receipts"
    description: "List the loads received against this grower lot."
    roles: [PlantAdmin, QAManager, QATechnician, ReceivingClerk, LineOperator]
    code: 200
    input: ["status?", "temp_grade?", "limit?", "offset?"]
    output: RawReceipt[]
    side_effects: []

  - method: POST
    path: "/raw-receipts/{id}/disposition"
    description: "Accept or reject a load after temperature verification and trim declaration. Accepting an OUT_OF_SPEC load requires a QAManager override."
    roles: [QATechnician, QAManager]
    code: 200
    input: ["decision", "trim_loss_lb?", "override_justification?"]
    output: RawReceipt
    side_effects:
      - "on ACCEPT: sets accepted_lb and remaining_lb, stamps dispositioned_by_user_id and moves status to ACCEPTED"
      - "on REJECT: moves status to REJECTED and leaves the pound fields null"
      - "recomputes GrowerLot.out_of_spec_receipt_count and the TRAILING risk score, which can move the lot APPROVED -> SUSPENDED"
      - "increments RawReceipt.version by 1"

  - method: POST
    path: "/wash-systems/{id}/antimicrobial-readings"
    description: "Record a wash-water antimicrobial reading. The reading freezes the load index, tier target and top-up requirement in force at that moment."
    roles: [LineOperator, SanitationTech]
    code: 201
    input: [reading_at, free_chlorine_ppm, ph, orp_mv, turbidity_ntu]
    output: AntimicrobialReading
    side_effects:
      - "assigns the next per-wash-system sequence_no and advances WashSystem.reading_sequence_high_water"
      - "recomputes §1.3 wash_water_load_and_target_ppm and copies organic_load_index_at_reading, target_free_chlorine_ppm_at_reading, topup_ppm_required and below_target onto the reading"
      - "moves the WashSystem IN_SERVICE -> DUMP_REQUIRED when the recomputed organic_load_index >= 3.000"
      - "stamps taken_by_user_id from X-User-ID"

  - method: GET
    path: "/wash-systems/{id}/antimicrobial-readings"
    description: "List the antimicrobial readings recorded on this wash system, newest reading_at first."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, SanitationTech]
    code: 200
    input: ["below_target?", "limit?", "offset?"]
    output: AntimicrobialReading[]
    side_effects: []

  - method: POST
    path: "/wash-systems/{id}/changeout"
    description: "Record a wash-water change-out, which resets the organic load window and returns the system to service."
    roles: [SanitationTech]
    code: 200
    input: []
    output: WashSystem
    side_effects:
      - "sets last_changeout_at to the logical clock now, increments changeout_count and moves status to IN_SERVICE"
      - "recomputes weighted_load_lb to 0, organic_load_index to 0.000 and target_free_chlorine_ppm to 20.0 because the load window is now empty"
      - "increments WashSystem.version by 1"

  - method: POST
    path: "/lines/{id}/sanitation-events"
    description: "Schedule a sanitation shift on this line, optionally as the documented allergen changeover clean."
    roles: [SanitationTech, QATechnician]
    code: 201
    input: [shift, scheduled_for, is_allergen_changeover]
    output: SanitationEvent
    side_effects:
      - "assigns the next per-line sequence_no and sets status SCHEDULED with attempt_count 0"
      - "does not change Line.posture: only a VALIDATED or FAILED outcome does"

  - method: GET
    path: "/lines/{id}/sanitation-events"
    description: "List the sanitation events of this line, newest scheduled_for first."
    roles: [PlantAdmin, QAManager, QATechnician, SanitationTech]
    code: 200
    input: ["status?", "shift?", "limit?", "offset?"]
    output: SanitationEvent[]
    side_effects: []

  - method: POST
    path: "/sanitation-events/{id}/start"
    description: "Begin equipment disassembly and cleaning. Also the re-clean entry point after a failed validation."
    roles: [SanitationTech]
    code: 200
    input: []
    output: SanitationEvent
    side_effects:
      - "sets started_at, stamps performed_by_user_id from X-User-ID and increments attempt_count"
      - "clears disassembled_component_count, atp_rlu, allergen_swab_result and failed_reason"
      - "refuses to start while any run on the line is RUNNING (ERR_LINE_RUN_IN_PROGRESS)"

  - method: POST
    path: "/sanitation-events/{id}/submit"
    description: "Submit the completed clean with the disassembly count and the post-clean swab measurements."
    roles: [SanitationTech]
    code: 200
    input: [disassembled_component_count, atp_rlu, allergen_swab_result]
    output: SanitationEvent
    side_effects:
      - "records the measurements, sets completed_at and moves status to AWAITING_VALIDATION"
      - "refuses a disassembly count below Line.required_disassembly_component_count (ERR_DISASSEMBLY_INCOMPLETE)"

  - method: POST
    path: "/sanitation-events/{id}/validate"
    description: "Validate the sanitation. A PASS requires the ATP reading at or under the line limit and a NEGATIVE allergen swab; anything else fails the clean and opens a corrective action."
    roles: [QATechnician]
    code: 200
    input: [outcome]
    output: SanitationEvent
    side_effects:
      - "on PASS with atp_rlu <= Line.max_atp_rlu and allergen_swab_result == NEGATIVE: sets validated_at, validated_by_user_id, status VALIDATED, and recomputes §1.3 line_posture (which can open the line)"
      - "otherwise: sets status FAILED with failed_reason, then runs hops 2-5 of the sanitation-failure cascade - opens a MAJOR CorrectiveAction, recomputes the posture to RESTRICTED, marks the wash systems of the line's non-terminal runs DUMP_REQUIRED, and cancels every SETUP run on those wash systems"
      - "refuses a validator equal to performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"

  - method: POST
    path: "/process-runs"
    description: "Plan a processing run: line, product, customer spec, wash system and the planned occupancy window."
    roles: [LineOperator]
    code: 201
    input: ["line_id", "product_id", "customer_spec_id", "wash_system_id", "planned_start_at", "planned_end_at", "crew_size", "rework_source_run_id?"]
    output: ProcessRun
    side_effects:
      - "sets run_status SETUP and disposition_status UNRESTRICTED"
      - "computes allergen_changeover_required from Line.last_run_allergen_group versus the product's allergen_group"
      - "enforces the pairwise line interval exclusion, the allergen changeover buffer and the wash-system aggregate capacity (ERR_LINE_INTERVAL_CONFLICT, ERR_CHANGEOVER_BUFFER_REQUIRED, ERR_WASH_SYSTEM_CAPACITY_EXCEEDED)"
      - "enforces spec-to-product agreement and spec activity (ERR_SPEC_PRODUCT_MISMATCH, ERR_SPEC_NOT_ACTIVE) and, when supplied, that rework_source_run_id names a REJECTED run"

  - method: GET
    path: "/process-runs"
    description: "List processing runs, filterable by every foreign key and by either state dimension."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, ShippingClerk]
    code: 200
    input: ["line_id?", "product_id?", "customer_spec_id?", "wash_system_id?", "rework_source_run_id?", "run_status?", "disposition_status?", "limit?", "offset?"]
    output: ProcessRun[]
    side_effects: []

  - method: GET
    path: "/process-runs/{id}"
    description: "Retrieve one processing run with both state dimensions, the frozen wash targets, the computed costs and the case counters."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: ProcessRun
    side_effects: []

  - method: POST
    path: "/process-runs/{id}/start"
    description: "Start the run. Freezes the wash-water target and the required dwell time, and enforces the sanitation, wash-water and allergen changeover gates."
    roles: [LineOperator]
    code: 200
    input: []
    output: ProcessRun
    side_effects:
      - "sets started_at, target_ppm_at_start and required_dwell_seconds_at_start from §1.3 wash_water_load_and_target_ppm in its pinned step order"
      - "moves run_status SETUP -> RUNNING and sets Line.last_run_allergen_group; clears allergen_changeover_required"
      - "enforces Line.posture == OPEN, WashSystem.status == IN_SERVICE, reading freshness, the product ppm minimum and the allergen changeover validation"
      - "increments ProcessRun.version by 1"

  - method: POST
    path: "/process-runs/{id}/lot-consumptions"
    description: "Draw pounds from an accepted receipt onto the run. The caller must present the run version it observed (§1.2.1 consumption-create-stale-run)."
    roles: [LineOperator]
    code: 201
    input: [raw_receipt_id, consumed_lb, expected_process_run_version]
    output: LotConsumption
    side_effects:
      - "sets status ACTIVE and stamps recorded_by_user_id"
      - "reduces RawReceipt.remaining_lb and raises ProcessRun.input_lb per §1.3 run_mass_balance_and_yield"
      - "recomputes §1.3 wash_water_load_and_target_ppm on the run's wash system, which can force DUMP_REQUIRED"
      - "increments ProcessRun.version by 1 and rejects a stale expected_process_run_version with ERR_STALE_PROCESS_RUN_VERSION (412)"
      - "enforces the grower-lot approval, receipt acceptance, commodity-class agreement and pound-balance rules"

  - method: GET
    path: "/process-runs/{id}/lot-consumptions"
    description: "List the lot consumptions recorded on this run."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LotConsumption[]
    side_effects: []

  - method: GET
    path: "/raw-receipts/{id}/lot-consumptions"
    description: "List the consumptions drawn from this receipt, the receipt-side view of the same junction."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LotConsumption[]
    side_effects: []

  - method: POST
    path: "/lot-consumptions/{id}/void"
    description: "Void a consumption recorded in error, restoring the receipt balance and the run input exactly."
    roles: [LineOperator]
    code: 200
    input: [expected_process_run_version]
    output: LotConsumption
    side_effects:
      - "sets status VOIDED and voided_at"
      - "restores RawReceipt.remaining_lb to its pre-consumption value and lowers ProcessRun.input_lb by the same pounds"
      - "recomputes the wash system's weighted_load_lb, organic_load_index and target_free_chlorine_ppm"
      - "increments ProcessRun.version by 1 and rejects a stale expected_process_run_version with ERR_STALE_PROCESS_RUN_VERSION (412)"

  - method: POST
    path: "/process-runs/{id}/close"
    description: "Close the run: verify antimicrobial compliance over the run window, compute yield, provisional shelf life and code date, allocate the run cost across the packed cases, and open any automatic hold."
    roles: [LineOperator]
    code: 200
    input: [actual_dwell_seconds, spin_rpm, spin_seconds, atmosphere_actual, water_gal_used, cases_produced]
    output: ProcessRun
    side_effects:
      - "sets closed_at, moves run_status RUNNING -> CLOSED and sets Line.last_run_ended_at"
      - "runs §1.3 antimicrobial_compliance_check, run_mass_balance_and_yield, run_shelf_life_and_code_date (PROVISIONAL) and run_cost_allocation_per_case"
      - "creates cases_produced FinishedCase rows numbered from 1 with their code dates, labels and allocated cost cents"
      - "opens a HOLD_AND_RELEASE_TESTING hold when the product requires it, and an ANTIMICROBIAL_EXCURSION hold plus MAJOR corrective action when any in-window reading fell below the product minimum"
      - "enforces the dwell, atmosphere, consumption and yield rules (ERR_DWELL_TIME_INSUFFICIENT, ERR_ATMOSPHERE_MISMATCH, ERR_NO_LOTS_CONSUMED, ERR_YIELD_OUT_OF_TOLERANCE)"
      - "increments ProcessRun.version by 1"

  - method: GET
    path: "/process-runs/{id}/finished-cases"
    description: "List the cases packed on this run with their code dates and allocated costs, in case_sequence order."
    roles: [PlantAdmin, QAManager, QATechnician, LineOperator, ShippingClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinishedCase[]
    side_effects: []

  - method: GET
    path: "/process-runs/{id}/traceability"
    description: "One-hop recall view: every grower lot and receipt that fed the run, the cases it produced, how many already shipped, and the rework ancestry."
    roles: [PlantAdmin, QAManager, QATechnician]
    code: 200
    input: []
    output: "{ process_run_id: string, product_code: string, customer_code: string, grower_lot_ids: string[], grower_codes: string[], raw_receipt_ids: string[], active_consumption_count: integer, voided_consumption_count: integer, case_count: integer, shipped_case_count: integer, on_hold_case_count: integer, destroyed_case_count: integer, effective_code_date: string, rework_source_run_id: string, rework_ancestor_run_ids: string[] }"
    side_effects: []

  - method: POST
    path: "/process-runs/{id}/hold-records"
    description: "Place the run's product on quality hold pending micro testing."
    roles: [QATechnician]
    code: 201
    input: [reason]
    output: HoldRecord
    side_effects:
      - "creates the hold in state HELD with test_round 0, moves the run's disposition_status to HELD and its IN_INVENTORY cases to ON_HOLD"
      - "sets cases_held_count and shipped_case_count, and recomputes the run's case counters per §1.3 case_disposition_counts"

  - method: GET
    path: "/process-runs/{id}/hold-records"
    description: "List the holds opened on this run, newest opened_at first."
    roles: [PlantAdmin, QAManager, QATechnician]
    code: 200
    input: ["status?", "reason?", "limit?", "offset?"]
    output: HoldRecord[]
    side_effects: []

  - method: POST
    path: "/hold-records/{id}/submit-sample"
    description: "Submit a micro sample against the hold, consuming one of the bounded test rounds."
    roles: [QATechnician]
    code: 200
    input: [latest_test_type]
    output: HoldRecord
    side_effects:
      - "increments test_round, moves status to UNDER_TEST and clears the previous result fields"
      - "refuses a fourth round with ERR_MAX_RETEST_ROUNDS_EXCEEDED"

  - method: POST
    path: "/hold-records/{id}/record-result"
    description: "Record the laboratory result. NEGATIVE or POSITIVE keeps the hold under test; INDETERMINATE demands a retest."
    roles: [QATechnician]
    code: 200
    input: ["latest_test_result", "latest_apc_cfu_g?"]
    output: HoldRecord
    side_effects:
      - "sets latest_test_result, latest_apc_cfu_g and resulted_by_user_id"
      - "moves status to RETEST_REQUIRED on INDETERMINATE, otherwise leaves it UNDER_TEST"

  - method: POST
    path: "/hold-records/{id}/release"
    description: "Release the hold on a NEGATIVE result. Recomputes the FINAL shelf life and re-dates every case that has not left the plant."
    roles: [QAManager]
    code: 200
    input: []
    output: HoldRecord
    side_effects:
      - "sets closed_at and released_by_user_id and moves the hold to RELEASED"
      - "recomputes §1.3 run_shelf_life_and_code_date in the FINAL variant and rewrites code_date and code_date_label on every non-SHIPPED, non-DESTROYED case"
      - "returns the run's ON_HOLD cases to IN_INVENTORY, restoring cases_available and cases_on_hold exactly, and moves the run's disposition_status to RELEASED"
      - "refuses a releaser equal to resulted_by_user_id (ERR_SEGREGATION_OF_DUTIES) and a non-NEGATIVE latest result (ERR_TEST_RESULT_NOT_NEGATIVE)"

  - method: POST
    path: "/hold-records/{id}/reject"
    description: "Reject the held product; the run becomes rework-eligible and its held cases are destroyed."
    roles: [QAManager]
    code: 200
    input: []
    output: HoldRecord
    side_effects:
      - "sets closed_at and released_by_user_id and moves the hold to REJECTED"
      - "moves the run's disposition_status to REJECTED and every ON_HOLD case to DESTROYED"
      - "recomputes the run's case counters"

  - method: POST
    path: "/finished-cases/{id}/ship"
    description: "Ship a case to the customer. Requires an unrestricted or released run disposition and enough code-date life left for the customer's specification."
    roles: [ShippingClerk]
    code: 200
    input: []
    output: FinishedCase
    side_effects:
      - "sets shipped_at and moves the case to SHIPPED"
      - "decrements ProcessRun.cases_available and increments cases_shipped"
      - "enforces ERR_HOLD_NOT_RELEASED before ERR_CASE_NOT_IN_INVENTORY, then ERR_INSUFFICIENT_REMAINING_SHELF_LIFE"
      - "increments FinishedCase.version by 1"

  - method: POST
    path: "/lines/{id}/environmental-swabs"
    description: "Log an environmental monitoring swab against a hygienic zone of the line."
    roles: [QATechnician]
    code: 201
    input: [zone, site_code, organism, collected_at]
    output: EnvironmentalSwab
    side_effects:
      - "sets result PENDING; a pending swab does not affect the line posture"

  - method: GET
    path: "/lines/{id}/environmental-swabs"
    description: "List the environmental swabs of this line."
    roles: [PlantAdmin, QAManager, QATechnician]
    code: 200
    input: ["result?", "zone?", "organism?", "limit?", "offset?"]
    output: EnvironmentalSwab[]
    side_effects: []

  - method: POST
    path: "/environmental-swabs/{id}/result"
    description: "Record a laboratory result on the swab. A CONFIRMED_POSITIVE runs the five-hop environmental cascade."
    roles: [QATechnician]
    code: 200
    input: [result]
    output: EnvironmentalSwab
    side_effects:
      - "sets resulted_at and resulted_by_user_id and applies the transition declared in §1.2 EnvironmentalSwab"
      - "on CONFIRMED_POSITIVE: opens a CorrectiveAction (CRITICAL in ZONE_1, otherwise MAJOR), recomputes the line posture, cancels the line's SETUP runs when the posture becomes FROZEN, holds its RUNNING runs and its runs closed within the 24-hour lookback, moves their IN_INVENTORY cases to ON_HOLD, and depresses the TRAILING risk score of every grower lot those runs consumed"
      - "on PRESUMPTIVE_POSITIVE: recomputes the posture to RESTRICTED without opening any corrective action"

  - method: GET
    path: "/lines/{id}/corrective-actions"
    description: "List the corrective actions gating this line's posture."
    roles: [PlantAdmin, QAManager, QATechnician, SanitationTech]
    code: 200
    input: ["status?", "severity?", "source_type?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []

  - method: POST
    path: "/corrective-actions/{id}/start"
    description: "Take ownership of the corrective action and begin implementing it."
    roles: [QATechnician]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects:
      - "stamps implemented_by_user_id from X-User-ID and moves status to IN_PROGRESS"

  - method: POST
    path: "/corrective-actions/{id}/submit-verification"
    description: "Submit the implemented action for management verification."
    roles: [QATechnician]
    code: 200
    input: [action_taken]
    output: CorrectiveAction
    side_effects:
      - "records action_taken and moves status to VERIFICATION_PENDING"

  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "Verify the corrective action. A PASS closes it and can lift the line posture; a FAIL returns it to implementation."
    roles: [QAManager]
    code: 200
    input: [outcome]
    output: CorrectiveAction
    side_effects:
      - "on PASS: sets verified_at and verified_by_user_id, moves status to VERIFIED, decrements Line.open_corrective_action_count and recomputes §1.3 line_posture"
      - "on FAIL: increments reopen_count, clears action_taken and returns status to IN_PROGRESS"
      - "refuses a verifier equal to implemented_by_user_id (ERR_SEGREGATION_OF_DUTIES)"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every system timestamp and every window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock to current_utc; the clock only ever moves forward within a test"
      - "changes no stored row, but every later created_at, updated_at and window evaluation reads the new value"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing or is an empty string"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not one of the seven declared roles, or is not listed on the endpoint"
  - id: ERR_OVERRIDE_NOT_PERMITTED
    http: 403
    condition: "a role other than QAManager supplies override_justification on a receipt disposition"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is not a declared member, a numeric or datetime field has the wrong type or sign, or a required field is null"

  # --- existence ---
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a product_id body field names no Product"
  - id: ERR_CUSTOMER_SPEC_NOT_FOUND
    http: 404
    condition: "a customer_spec_id body field names no CustomerSpec"
  - id: ERR_GROWER_LOT_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a grower_lot_id body field names no GrowerLot"
  - id: ERR_RAW_RECEIPT_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a raw_receipt_id body field names no RawReceipt"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a line_id body field names no Line"
  - id: ERR_WASH_SYSTEM_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a wash_system_id body field names no WashSystem"
  - id: ERR_PROCESS_RUN_NOT_FOUND
    http: 404
    condition: "a {id} path segment or a rework_source_run_id body field names no ProcessRun"
  - id: ERR_LOT_CONSUMPTION_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no LotConsumption"
  - id: ERR_FINISHED_CASE_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no FinishedCase"
  - id: ERR_HOLD_RECORD_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no HoldRecord"
  - id: ERR_SANITATION_EVENT_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no SanitationEvent"
  - id: ERR_ENVIRONMENTAL_SWAB_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no EnvironmentalSwab"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "a {id} path segment names no CorrectiveAction"

  # --- optimistic concurrency ---
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the Product's current version"
  - id: ERR_STALE_PROCESS_RUN_VERSION
    http: 412
    condition: "expected_process_run_version does not equal the ProcessRun's current version"

  # --- state preconditions ---
  - id: ERR_GROWER_LOT_INVALID_STATE
    http: 409
    condition: "approve on a lot that is not PENDING_APPROVAL, or recall on a lot that is not APPROVED or SUSPENDED"
  - id: ERR_RECEIPT_NOT_PENDING
    http: 409
    condition: "disposition on a receipt that is not PENDING_INSPECTION"
  - id: ERR_RUN_NOT_IN_SETUP
    http: 409
    condition: "start on a run whose run_status is not SETUP"
  - id: ERR_RUN_NOT_RUNNING
    http: 409
    condition: "close on a run that is not RUNNING, or a consumption write against a run that is CLOSED or CANCELLED"
  - id: ERR_CONSUMPTION_ALREADY_VOIDED
    http: 409
    condition: "void on a LotConsumption that is already VOIDED"
  - id: ERR_SANITATION_INVALID_STATE
    http: 409
    condition: "a sanitation action whose required source state does not hold: start needs SCHEDULED or FAILED, submit needs IN_PROGRESS, validate needs AWAITING_VALIDATION"
  - id: ERR_SWAB_INVALID_RESULT_TRANSITION
    http: 409
    condition: "a swab result that is not a legal transition from the swab's current result, including any write to an already terminal swab"
  - id: ERR_CORRECTIVE_ACTION_INVALID_STATE
    http: 409
    condition: "a corrective-action action whose required source state does not hold: start needs OPEN, submit-verification needs IN_PROGRESS, verify needs VERIFICATION_PENDING"
  - id: ERR_HOLD_INVALID_STATE
    http: 409
    condition: "a hold action whose required source state does not hold, or a release attempted while another hold on the same run is still open"
  - id: ERR_HOLD_NOT_RELEASED
    http: 409
    condition: "ship on a case whose run disposition_status is HELD or REJECTED"
  - id: ERR_CASE_NOT_IN_INVENTORY
    http: 409
    condition: "ship on a case that is already SHIPPED or has been DESTROYED, while the run disposition permits shipping"

  # --- safety and compliance ---
  - id: ERR_RECEIPT_TEMP_OUT_OF_SPEC
    http: 422
    condition: "accepting a load graded OUT_OF_SPEC without a QAManager override justification"
  - id: ERR_GROWER_LOT_NOT_APPROVED
    http: 422
    condition: "consuming a receipt whose grower lot is not APPROVED"
  - id: ERR_RECEIPT_NOT_ACCEPTED
    http: 422
    condition: "consuming a receipt that is not ACCEPTED"
  - id: ERR_LINE_NOT_OPEN
    http: 409
    condition: "starting a run on a line whose derived posture is RESTRICTED or FROZEN"
  - id: ERR_WASH_SYSTEM_DUMP_REQUIRED
    http: 422
    condition: "starting a run on a wash system whose status is DUMP_REQUIRED"
  - id: ERR_NO_ANTIMICROBIAL_READINGS
    http: 422
    condition: "starting a run on a wash system with no readings at all, or closing a run with no reading inside the run window"
  - id: ERR_ANTIMICROBIAL_READING_STALE
    http: 422
    condition: "the latest wash-water reading is older than 60 minutes at the start instant"
  - id: ERR_ANTIMICROBIAL_BELOW_MINIMUM
    http: 422
    condition: "the latest wash-water reading is below the product's minimum free chlorine ppm at the start instant"
  - id: ERR_ALLERGEN_CHANGEOVER_NOT_VALIDATED
    http: 422
    condition: "starting a run that needs an allergen changeover without a VALIDATED changeover clean carrying a NEGATIVE allergen swab since the previous run ended"
  - id: ERR_DISASSEMBLY_INCOMPLETE
    http: 422
    condition: "submitting a sanitation event with fewer disassembled components than the line requires"
  - id: ERR_DWELL_TIME_INSUFFICIENT
    http: 422
    condition: "closing a run whose reported dwell is below the greater of the product minimum and the dwell frozen at start"

  # --- referential business rules ---
  - id: ERR_SPEC_PRODUCT_MISMATCH
    http: 422
    condition: "the customer spec on a run belongs to a different product than the run's product_id"
  - id: ERR_SPEC_NOT_ACTIVE
    http: 422
    condition: "the customer spec on a run has been superseded"
  - id: ERR_COMMODITY_CLASS_MISMATCH
    http: 422
    condition: "consuming a receipt whose grower lot commodity class differs from the run product's commodity class"
  - id: ERR_ATMOSPHERE_MISMATCH
    http: 422
    condition: "closing a run whose reported packaging atmosphere differs from the customer spec requirement"
  - id: ERR_REWORK_SOURCE_NOT_REJECTED
    http: 422
    condition: "naming a rework source run whose disposition_status is not REJECTED"

  # --- temporal business rules ---
  - id: ERR_LINE_INTERVAL_CONFLICT
    http: 409
    condition: "the planned window overlaps another non-terminal run on the same line, or planned_end_at is not strictly after planned_start_at"
  - id: ERR_CHANGEOVER_BUFFER_REQUIRED
    http: 409
    condition: "the gap after the preceding non-terminal run of a different allergen group is under 45 minutes"
  - id: ERR_INSUFFICIENT_REMAINING_SHELF_LIFE
    http: 422
    condition: "the case's code date leaves fewer days than the customer spec requires on the ship date"

  # --- constraint business rules ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID is the same operator as the counterparty on the record: validating a clean they performed, releasing a hold whose result they recorded, or verifying a corrective action they implemented"
  - id: ERR_LINE_RUN_IN_PROGRESS
    http: 409
    condition: "starting a sanitation event while a run on the same line is RUNNING"
  - id: ERR_MAX_RETEST_ROUNDS_EXCEEDED
    http: 409
    condition: "submitting a fourth micro sample against the same hold"
  - id: ERR_TEST_RESULT_NOT_NEGATIVE
    http: 409
    condition: "releasing a hold whose latest recorded result is POSITIVE or INDETERMINATE"
  - id: ERR_TRIM_LOSS_EXCEEDS_NET
    http: 422
    condition: "declared trim loss exceeds the load's net weight"
  - id: ERR_NO_LOTS_CONSUMED
    http: 422
    condition: "closing a run with no ACTIVE lot consumption"
  - id: ERR_YIELD_OUT_OF_TOLERANCE
    http: 422
    condition: "the computed yield is below the product minimum or above 100.00 percent"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a product code, line code or wash system code is already registered"

  # --- fiscal and capacity ---
  - id: ERR_INSUFFICIENT_RECEIPT_BALANCE
    http: 422
    condition: "the consumed pounds exceed the receipt's remaining pounds"
  - id: ERR_WASH_SYSTEM_CAPACITY_EXCEEDED
    http: 409
    condition: "the planned window would make the run one occupant too many on the wash system"

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties; every role identity is opaque)
# =============================================================================
roles:

  - name: PlantAdmin
    description: "Plant systems administrator: maintains the product, spec, line and wash-system master data and drives the logical clock. Holds no quality or production authority."
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/customer-specs"
      - "POST /lines"
      - "POST /wash-systems"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /products, GET /products/{id}, GET /products/{id}/customer-specs"
      - "GET /lines, GET /lines/{id}, GET /wash-systems/{id}"
      - "GET /grower-lots, GET /grower-lots/{id}, GET /grower-lots/{id}/raw-receipts, GET /raw-receipts/{id}"
      - "GET /process-runs, GET /process-runs/{id}, GET /process-runs/{id}/lot-consumptions, GET /raw-receipts/{id}/lot-consumptions, GET /process-runs/{id}/finished-cases, GET /process-runs/{id}/traceability, GET /process-runs/{id}/hold-records"
      - "GET /wash-systems/{id}/antimicrobial-readings, GET /lines/{id}/sanitation-events, GET /lines/{id}/environmental-swabs, GET /lines/{id}/corrective-actions"

  - name: ReceivingClerk
    description: "Dock receiver: records incoming loads with their verified pulp temperatures. Cannot decide the disposition of what they receive."
    identity: opaque
    exclusive_operations:
      - "POST /raw-receipts"
    shared_operations:
      - "GET /grower-lots, GET /grower-lots/{id}, GET /grower-lots/{id}/raw-receipts, GET /raw-receipts/{id}"

  - name: QATechnician
    description: "Quality technician: identifies grower lots, dispositions in-spec loads, validates sanitation, runs environmental monitoring, opens holds and micro tests, and implements corrective actions. Cannot approve a lot, release a hold or verify their own corrective action."
    identity: opaque
    exclusive_operations:
      - "POST /grower-lots"
      - "POST /sanitation-events/{id}/validate"
      - "POST /process-runs/{id}/hold-records"
      - "POST /hold-records/{id}/submit-sample"
      - "POST /hold-records/{id}/record-result"
      - "POST /lines/{id}/environmental-swabs"
      - "POST /environmental-swabs/{id}/result"
      - "POST /corrective-actions/{id}/start"
      - "POST /corrective-actions/{id}/submit-verification"
    shared_operations:
      - "POST /raw-receipts/{id}/disposition (shared with QAManager, but without the OUT_OF_SPEC override)"
      - "POST /lines/{id}/sanitation-events (shared with SanitationTech)"
      - "every GET in the catalogue except GET /lines and GET /wash-systems/{id} listings restricted to operations roles"

  - name: QAManager
    description: "Quality manager: the approval and release authority. Adjudicates grower lots, recalls, out-of-spec overrides, hold release or rejection, and corrective-action verification. Never performs the work they verify."
    identity: opaque
    exclusive_operations:
      - "POST /grower-lots/{id}/approve"
      - "POST /grower-lots/{id}/recall"
      - "POST /hold-records/{id}/release"
      - "POST /hold-records/{id}/reject"
      - "POST /corrective-actions/{id}/verify"
      - "POST /raw-receipts/{id}/disposition with override_justification (the OUT_OF_SPEC override)"
    shared_operations:
      - "POST /raw-receipts/{id}/disposition (shared with QATechnician)"
      - "every GET in the catalogue"

  - name: LineOperator
    description: "Processing line operator: plans and runs the lines, records wash-water readings and lot consumption, and closes runs. Holds no quality authority and cannot see the recall or corrective-action views."
    identity: opaque
    exclusive_operations:
      - "POST /process-runs"
      - "POST /process-runs/{id}/start"
      - "POST /process-runs/{id}/close"
      - "POST /process-runs/{id}/lot-consumptions"
      - "POST /lot-consumptions/{id}/void"
    shared_operations:
      - "POST /wash-systems/{id}/antimicrobial-readings (shared with SanitationTech)"
      - "GET /products, GET /products/{id}, GET /products/{id}/customer-specs, GET /lines, GET /lines/{id}, GET /wash-systems/{id}, GET /raw-receipts/{id}, GET /grower-lots/{id}/raw-receipts"
      - "GET /process-runs, GET /process-runs/{id}, GET /process-runs/{id}/lot-consumptions, GET /raw-receipts/{id}/lot-consumptions, GET /process-runs/{id}/finished-cases"
      - "GET /wash-systems/{id}/antimicrobial-readings"

  - name: SanitationTech
    description: "Sanitation shift technician: disassembles and cleans the lines and changes the wash water. Never validates their own clean."
    identity: opaque
    exclusive_operations:
      - "POST /sanitation-events/{id}/start"
      - "POST /sanitation-events/{id}/submit"
      - "POST /wash-systems/{id}/changeout"
    shared_operations:
      - "POST /lines/{id}/sanitation-events (shared with QATechnician)"
      - "POST /wash-systems/{id}/antimicrobial-readings (shared with LineOperator)"
      - "GET /lines, GET /lines/{id}, GET /wash-systems/{id}, GET /lines/{id}/sanitation-events, GET /wash-systems/{id}/antimicrobial-readings, GET /lines/{id}/corrective-actions"

  - name: ShippingClerk
    description: "Shipping clerk: releases cases to customers against the code date and the run disposition. Cannot influence either."
    identity: opaque
    exclusive_operations:
      - "POST /finished-cases/{id}/ship"
    shared_operations:
      - "GET /process-runs, GET /process-runs/{id}, GET /process-runs/{id}/finished-cases, GET /products/{id}/customer-specs"
