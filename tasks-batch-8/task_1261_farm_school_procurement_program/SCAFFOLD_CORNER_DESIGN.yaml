  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_insurance_minimum_acreage_boundary
        claim_type: constants_applied
        grounds:
          - calculations.insurance_minimum
          - errors[ERR_FARM_COMPLIANCE_INCOMPLETE]
          - errors[ERR_COVERAGE_BELOW_MINIMUM]
        distinguishing_aspect: "Threshold at exactly 500 acres: a 500-acre farm needs 500000 (policy at exactly 500000 satisfies, >= semantics); a 501-acre farm needs 1000000 so 600000 fails approval with ERR_FARM_COMPLIANCE_INCOMPLETE; a 100-acre farm offering 400000 fails document creation with ERR_COVERAGE_BELOW_MINIMUM."
        test_recipe:
          setup: ["Three farms: A100 (100 acres), A500 (500 acres), A501 (501 acres)"]
          setup_api_calls:
            - { call: "POST /f2s/farms", payload: { legal_name: "A100", contact_email: "a@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { f100: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "A500", contact_email: "b@x.com", distance_miles_to_hub: 30, acres: 500 }, as: DistrictProgramAdmin, captures: { f500: $.data.id, req500: $.data.required_insurance_cents } }
            - { call: "POST /f2s/farms", payload: { legal_name: "A501", contact_email: "c@x.com", distance_miles_to_hub: 30, acres: 501 }, as: DistrictProgramAdmin, captures: { f501: $.data.id, req501: $.data.required_insurance_cents } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${f500}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${f500}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${f500}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 500000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${f500}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${f501}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${f501}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${f501}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${f501}" }
          trigger:
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${f100}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 400000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${f100}", captures: { e1: $.data.error_id } }
            - { call: "POST /f2s/farms/${f500}/approve", payload: {}, as: DistrictProgramAdmin, captures: { st500: $.data.status } }
            - { call: "POST /f2s/farms/${f501}/approve", payload: {}, as: DistrictProgramAdmin, captures: { e2: $.data.error_id } }
          assert:
            - "Farm.${f500}.required_insurance_cents == 500000 (acres == 500 is small-farm)"
            - "Farm.${f501}.required_insurance_cents == 1000000"
            - "Coverage 400000 < 500000 at creation: e1 == ERR_COVERAGE_BELOW_MINIMUM"
            - "Coverage == minimum: Farm.${f500} approve succeeds (APPROVED)"
            - "Coverage 600000 < 1000000 at approve: e2 == ERR_FARM_COMPLIANCE_INCOMPLETE"

      - name: calc_delivered_aggregation_order_independent
        claim_type: correct_result
        grounds:
          - calculations.delivered_aggregation
        distinguishing_aspect: "Chronological aggregation is order-insensitive in sum: accepting the LATER-dated delivery first still yields delivered_quantity == 50 (10 + 40)."
        test_recipe:
          setup: ["Standard chain; two SCHEDULED deliveries: 2026-08-10 qty 40 and 2026-08-17 qty 10"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
