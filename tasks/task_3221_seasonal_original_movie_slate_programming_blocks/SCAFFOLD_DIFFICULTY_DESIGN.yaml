  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: location_shoot_half_open_overlap
        grounds:
          - calculations.location_overlap_check
          - errors.ERR_LOCATION_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the Location resource: a shoot whose
          start equals the existing slot's end (touching endpoints) is allowed,
          while a one-hour intersection is rejected — endpoint-touching passes,
          interior overlap fails.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 2, max_shoot_days 100), two approved titles T1 T2."
            - "Location L with no blackouts. Existing BOOKED slot on L: 2027-03-10T00:00:00Z..2027-03-20T00:00:00Z (10 days) for T1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
