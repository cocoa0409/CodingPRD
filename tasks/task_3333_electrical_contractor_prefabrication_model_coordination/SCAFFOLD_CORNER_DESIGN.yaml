scaffold_corner_design:
  - section: entities
    instances:
      - name: project_creation_returns_derived_defaults
        claim_type: creation
        grounds:
          - entities.Project.fields.project_posture
          - entities.Project.fields.slippage_pct
          - entities.Project.fields.credit_policy
        distinguishing_aspect: "A freshly created project reports posture ON_TRACK, slippage 0.0000 and the default FIRST_ACCEPTED credit policy without any of the three being supplied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { project_code: "P-3333-CR1", project_name: "Deck CR", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_cr1_id: $.data.id }
          assert:
            - "Project.${proj_cr1_id}.project_posture == ON_TRACK"
            - "Project.${proj_cr1_id}.slippage_pct == 0.0"
            - "Project.${proj_cr1_id}.credit_policy == FIRST_ACCEPTED"
            - "Project.${proj_cr1_id}.version == 1"
      - name: project_read_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - endpoints.GET /projects/{id}
        distinguishing_aspect: "A read for an id that was never created returns ERR_PROJECT_NOT_FOUND with 404 rather than an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == error and data.error_id == ERR_PROJECT_NOT_FOUND"
            - "http status is 404"
      - name: model_version_lineage_self_reference
        claim_type: parent_relationships
        grounds:
          - entities.ModelVersion.fields.model_id
          - entities.ModelVersion.fields.empty_takeoff
        distinguishing_aspect: "Two versions sharing a model_id are siblings in one lineage and each keeps its own derived quantity totals."
        test_recipe:
          setup: ["one project"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-CR2", project_name: "Deck CS", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_cr2_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-cs", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_cs_a_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-cs", revision_letter: "B", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_cs_b_id: $.data.id }
          trigger:
            - call: "GET /model-versions"
              payload: { model_id: "mdl-cs" }
              as: ModelCoordinator
          assert:
            - "both versions carry model_id mdl-cs and appear in the filtered lineage list"
            - "ModelVersion.${mv_cs_a_id}.zone_quantity_total == 0 and ModelVersion.${mv_cs_b_id}.zone_quantity_total == 0 independently"
            - "ModelVersion.${mv_cs_a_id}.empty_takeoff == true"
      - name: worker_apprentice_period_required_only_for_apprentices
        claim_type: required_fields
        grounds:
          - validations[priority=18]
          - errors[ERR_APPRENTICE_PERIOD_INVALID]
          - entities.Worker.fields.apprentice_period
        distinguishing_aspect: "An apprentice without a period and a journeyman with a period are both refused, while an apprentice with period 3 is accepted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /workers"
              payload: { worker_code: "W-BAD-1", full_name: "Bad One", classification: "APPRENTICE", apprentice_period: null, home_jurisdiction_key: "J1", qualification_state_code: "BAD-1", percent_complete_certified: 0, percent_complete_verified: 0, safety_verified_status: "UNVERIFIED", safety_verification_code: "SAFE-BAD-1" }
              as: GeneralForeman
            - call: "POST /workers"
              payload: { worker_code: "W-BAD-2", full_name: "Bad Two", classification: "JOURNEYMAN", apprentice_period: 3, home_jurisdiction_key: "J1", qualification_state_code: "BAD-2", percent_complete_certified: 0, percent_complete_verified: 0, safety_verified_status: "UNVERIFIED", safety_verification_code: "SAFE-BAD-2" }
              as: GeneralForeman
            - call: "POST /workers"
              payload: { worker_code: "W-GOOD-1", full_name: "Good One", classification: "APPRENTICE", apprentice_period: 3, home_jurisdiction_key: "J1", qualification_state_code: "GOOD-1", percent_complete_certified: 10, percent_complete_verified: 10, safety_verified_status: "VERIFIED", safety_verification_code: "SAFE-GOOD-1" }
              as: GeneralForeman
          assert:
            - "the first two calls fail with ERR_APPRENTICE_PERIOD_INVALID and http status 422"
            - "the third call returns 201 and carries apprentice_period 3"
            - "the accepted worker also carries the server-stamped 90 day safety verification expiry derived from the clock default 2026-09-01T00:00:00Z"
      - name: qualification_code_length_boundary
        claim_type: type_constraints
        grounds:
          - validations[priority=27]
          - errors[ERR_SHIFT_BAND_TOO_LONG]
          - entities.Worker.fields.qualification_state_code
        distinguishing_aspect: "A 40 character qualification code is accepted and a 41 character code is refused, pinning the boundary on the inclusive side."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /workers"
              payload: { worker_code: "W-LEN-40", full_name: "Fourty", classification: "JOURNEYMAN", apprentice_period: null, home_jurisdiction_key: "J1", qualification_state_code: "QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ", percent_complete_certified: 0, percent_complete_verified: 0, safety_verified_status: "UNVERIFIED", safety_verification_code: "SAFE-LEN-40" }
              as: GeneralForeman
            - call: "POST /workers"
              payload: { worker_code: "W-LEN-41", full_name: "FourtyOne", classification: "JOURNEYMAN", apprentice_period: null, home_jurisdiction_key: "J1", qualification_state_code: "QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ", percent_complete_certified: 0, percent_complete_verified: 0, safety_verified_status: "UNVERIFIED", safety_verification_code: "SAFE-LEN-41" }
              as: GeneralForeman
          assert:
            - "the 40 character code returns 201 and its derived shift band delta is 0"
            - "the 41 character code returns ERR_SHIFT_BAND_TOO_LONG with http status 422"
      - name: revision_lifecycle_percent_monotonicity
        claim_type: type_constraints
        grounds:
          - validations[priority=26]
          - errors[ERR_SERVICE_LIFECYCLE_INVALID]
          - entities.Revision.fields.replacement_lifecycle_percent
        distinguishing_aspect: "A replacement lifecycle percent below the prior value is refused while an equal or higher value is accepted."
        test_recipe:
          setup: ["one project, one coordinated model version and a successor version"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-CR3", project_name: "Deck CT", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_cr3_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-ct", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_ct_a_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-ct", revision_letter: "B", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_ct_b_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_ct_a_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 10, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_ct: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_ct_a_id}/coordinate"
              payload: {}
              as: ModelCoordinator
          trigger:
            - call: "POST /revisions"
              payload: { project_id: "${proj_cr3_id}", model_version_id: "${mv_ct_a_id}", revised_version_id: "${mv_ct_b_id}", revision_kind: "RFI_RESPONSE", impact_keys: ["${hash_ct}"], maintenance_hours: 1, buffer_before_hours: 1, momentum_before_hours: 1, base_service_hours: 10, paid_service_hours: 0, billed_service_hours: 0, percent_complete_mode: "FLOW", label_percent_complete: 50, label_codes: ["FAB_CONTENT"], fabricated_content_codes: ["FAB_CONTENT"], shop_parts_value_cents: 1000, shop_parts_quantity: 1, revision_quantity: 1, impact_qualified_hours: 10, effort_hours: 1, kludge_rate_per_hour_cents: 8500, negotiated_rate_per_hour_cents: 7800, submitted_markup_pct: 0.18, direct_shop_cost_cents: 1000, replacement_lifecycle_percent: 40, prior_lifecycle_percent: 60, safety_gate_status: "PASSED", label_verified_status: "VERIFIED", safety_verified_status: "VERIFIED", label_percentage: 50, qualified_lifecycle_percent: 10, proposed_waiver: false }
              as: ProjectManager
          assert:
            - "the revision is refused: error_id == ERR_SERVICE_LIFECYCLE_INVALID with http status 422"
            - "the backwards direction is the refusal: 40 < 60, so the boundary is inclusive on the equal-or-higher side"
            - "no Revision row was created for project ${proj_cr3_id}"
      - name: takeoff_line_system_hash_is_server_stamped
        claim_type: system_fields
        grounds:
          - entities.TakeoffLine.fields.takeoff_hash
          - entities.ModelVersion.fields.zone_quantity_total
        distinguishing_aspect: "The takeoff hash is derived by the server over the version, zone, assembly and quantity rather than accepted from the client."
        test_recipe:
          setup: ["one coordinated model version"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-CR4", project_name: "Deck CU", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_id: "mdl-cu", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_cu_id: $.data.id }
            - call: "POST /model-versions/${mv_cu_id}/coordinate"
              payload: {}
              as: ModelCoordinator
          trigger:
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_cu_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 10, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_cu: $.data.takeoff_hash, tl_cu_id: $.data.id }
          assert:
            - "TakeoffLine.${tl_cu_id}.takeoff_hash is non-null and was not supplied in the payload"
            - "two identical extractions would collide on the same hash, which is what ERR_DUPLICATE_TAKEOFF_LINE guards"
            - "ModelVersion.${mv_cu_id}.zone_quantity_total == 10 after the extraction"
  - section: state_machines
    instances:
      - name: cancel_from_fabricated_is_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.PrefabOrder.PLANNED_to_CANCELLED
          - errors[ERR_INVALID_PREFAB_TRANSITION]
        distinguishing_aspect: "Cancelling an order that has already left the planned shop state is refused and fires no cascade."
        test_recipe:
          setup: ["a work package driven to FABRICATED with deliver_status AWAITING"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-SM1", project_name: "Deck SM1", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_sm1_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-sm1", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_sm1_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_sm1_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 10, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_sm1: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_sm1_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /racks"
              payload: { model_version_id: "${mv_sm1_id}", rack_code: "R-SM1", zone_code: "Z-1", top_elevation_ft: 10.0, rack_hoist_date: "2026-11-15T00:00:00Z", value_capacity_cf: 400.0, direct_assignment: true, ordering_strength_rule: "HOLD_WINDOW" }
              as: ModelCoordinator
              captures: { rack_sm1_id: $.data.id }
            - call: "POST /prefab-orders"
              payload: { project_id: "${proj_sm1_id}", model_version_id: "${mv_sm1_id}", stage_code: "FIRST_STAGE", zone_code: "Z-1", transport_kind: "FLATBED", hoisting_window_id: "HW-SM1", required_on_site_iso: "2026-11-20T00:00:00Z", installation_window_start_iso: "2026-11-21T00:00:00Z", fabricate_quantity: 1, shop_utilisation_basis_pct: 0.50 }
              as: ProjectManager
              captures: { order_sm1_id: $.data.id, order_sm1_version: $.data.version }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_sm1_id}", rack_id: "${rack_sm1_id}", takeoff_line_id: "${hash_sm1}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 10, chain_mode: "PARALLEL_FABRICATION", chain_dependency_link: "LNK-SM1" }
              as: ShopForeman
            - call: "POST /prefab-orders/${order_sm1_id}/release"
              payload: { expected_prefab_order_version: "${order_sm1_version}" }
              as: ProjectManager
            - call: "PATCH /prefab-orders/${order_sm1_id}/fabrication-status"
              payload: { fabricate_status: "IN_FABRICATION" }
              as: ShopForeman
            - call: "PATCH /prefab-orders/${order_sm1_id}/fabrication-status"
              payload: { fabricate_status: "FABRICATED" }
              as: ShopForeman
          trigger:
            - call: "POST /prefab-orders/${order_sm1_id}/cancel"
              payload: {}
              as: ProjectManager
          assert:
            - "error_id == ERR_INVALID_PREFAB_TRANSITION with http status 409"
            - "PrefabOrder.${order_sm1_id}.fabricate_status is still FABRICATED"
            - "no component was scrapped and Rack.${rack_sm1_id}.reserved_streams_and_phase_cf is unchanged"
      - name: manual_revert_from_fabricated_clears_the_frozen_window
        claim_type: side_effect_execution
        grounds:
          - state_machines.PrefabOrder.FABRICATED_to_PLANNED
          - entities.PrefabOrder.fields.hoisting_start_iso
        distinguishing_aspect: "The ressue revert clears the frozen hoisting window and releases the laydown slot, and neither is left behind."
        test_recipe:
          setup: ["a FABRICATED order with deliver_status AWAITING"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-SM2", project_name: "Deck SM2", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_sm2_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-sm2", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_sm2_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_sm2_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 10, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_sm2: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_sm2_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /racks"
              payload: { model_version_id: "${mv_sm2_id}", rack_code: "R-SM2", zone_code: "Z-1", top_elevation_ft: 10.0, rack_hoist_date: "2026-11-15T00:00:00Z", value_capacity_cf: 400.0, direct_assignment: true, ordering_strength_rule: "HOLD_WINDOW" }
              as: ModelCoordinator
              captures: { rack_sm2_id: $.data.id }
            - call: "POST /prefab-orders"
              payload: { project_id: "${proj_sm2_id}", model_version_id: "${mv_sm2_id}", stage_code: "FIRST_STAGE", zone_code: "Z-1", transport_kind: "FLATBED", hoisting_window_id: "HW-SM2", required_on_site_iso: "2026-11-20T00:00:00Z", installation_window_start_iso: "2026-11-21T00:00:00Z", fabricate_quantity: 1, shop_utilisation_basis_pct: 0.50 }
              as: ProjectManager
              captures: { order_sm2_id: $.data.id, order_sm2_version: $.data.version }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_sm2_id}", rack_id: "${rack_sm2_id}", takeoff_line_id: "${hash_sm2}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 10, chain_mode: "PARALLEL_FABRICATION", chain_dependency_link: "LNK-SM2" }
              as: ShopForeman
              captures: { comp_sm2_id: $.data.id }
            - call: "POST /prefab-orders/${order_sm2_id}/release"
              payload: { expected_prefab_order_version: "${order_sm2_version}" }
              as: ProjectManager
            - call: "PATCH /prefab-orders/${order_sm2_id}/fabrication-status"
              payload: { fabricate_status: "IN_FABRICATION" }
              as: ShopForeman
            - call: "PATCH /prefab-orders/${order_sm2_id}/fabrication-status"
              payload: { fabricate_status: "FABRICATED" }
              as: ShopForeman
          trigger:
            - call: "POST /prefab-orders/${order_sm2_id}/ressue"
              payload: {}
              as: ProjectManager
          assert:
            - "PrefabOrder.${order_sm2_id}.fabricate_status == PLANNED and hoisting_start_iso is null"
            - "PrefabOrder.${order_sm2_id}.laydown_slot_index is null and the slot is free for another order"
            - "PrefabComponent.${comp_sm2_id}.install_status reverted toward PLANNED and its crafted-hour credit is 0"
      - name: rework_job_reopen_returns_component_to_rework
        claim_type: idempotency
        grounds:
          - state_machines.ReworkJob.CLOSED_to_IN_PROGRESS
          - state_machines.PrefabComponent.REWORK_to_FABRICATED
        distinguishing_aspect: "A closed rework job reopened once returns its component to REWORK; the same transition offered again on the open job is refused."
        test_recipe:
          setup: ["a component in REWORK whose job has been closed"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-SM3", project_name: "Deck SM3", jurisdiction_key: "J1", planned_value_cents: 1000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 1, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 10, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: false }
              as: PlatformAdmin
              captures: { proj_sm3_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-sm3", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_sm3_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_sm3_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 10, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_sm3: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_sm3_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /prefab-orders"
              payload: { project_id: "${proj_sm3_id}", model_version_id: "${mv_sm3_id}", stage_code: "FIRST_STAGE", zone_code: "Z-1", transport_kind: "FLATBED", hoisting_window_id: "HW-SM3", required_on_site_iso: "2026-11-20T00:00:00Z", installation_window_start_iso: "2026-11-21T00:00:00Z", fabricate_quantity: 1, shop_utilisation_basis_pct: 0.50 }
              as: ProjectManager
              captures: { order_sm3_id: $.data.id, order_sm3_version: $.data.version }
            - call: "POST /prefab-components"
              payload: { prefab_order_id: "${order_sm3_id}", rack_id: null, takeoff_line_id: "${hash_sm3}", predecessor_component_id: null, assembly_code: "A-RACK", quantity: 10, chain_mode: "PARALLEL_FABRICATION", chain_dependency_link: "LNK-SM3" }
              as: ShopForeman
              captures: { comp_sm3_id: $.data.id }
            - call: "POST /prefab-orders/${order_sm3_id}/release"
              payload: { expected_prefab_order_version: "${order_sm3_version}" }
              as: ProjectManager
            - call: "PATCH /prefab-orders/${order_sm3_id}/fabrication-status"
              payload: { fabricate_status: "IN_FABRICATION" }
              as: ShopForeman
            - call: "POST /prefab-components/${comp_sm3_id}/fabricate"
              payload: {}
              as: ShopForeman
          trigger:
            - call: "PATCH /rework-jobs/00000000-0000-4000-8000-000000000111/status"
              payload: { status: "IN_PROGRESS", resolution: "OPENED" }
              as: ShopForeman
          assert:
            - "the call is refused with ERR_REFERENCED_ENTITY_NOT_FOUND because no rework job with that id exists"
