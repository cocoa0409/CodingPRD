            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/recalls", payload: { reason: "label defect", lot_ids: ["${lot}"] }, as: ComplianceOfficer, captures: { rec: $.data.id, scope: $.data.units_in_scope } }
          trigger:
            - { call: "POST /api/recalls/${rec}/recoveries", payload: { recovered_units: 51 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
