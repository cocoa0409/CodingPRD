    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts filtered by organization, player, originating offer or status (FK reverse for all three PlayerContract keys)"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent, FinanceOfficer]
    code: 200
    input: ["organization_id?", "player_id?", "offer_id?", "contract_status?", "obligation_status?", "limit?", "offset?"]
    output: PlayerContract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/suspend"
