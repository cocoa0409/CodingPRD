# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 beyond §1.8's nine rules
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: supplier_creation_applies_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Supplier.fields.status, entities.Supplier.fields.social_criteria_score]
        distinguishing_aspect: "A created supplier starts PROSPECT with null social_criteria_score and version 1; server-minted id/created_at present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Defaults Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id, s_status: $.data.status, s_score: $.data.social_criteria_score, s_v: $.data.version }
          trigger: []
          assert:
            - "s_status == PROSPECT"
            - "s_score is null"
            - "s_v == 1"
            - "Supplier.${s_id}.created_at is set by the server"

      - name: flavor_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Flavor.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field name on flavor create returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /creamery/flavors"
              payload: { base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: flavor_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Flavor.fields.base_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "base_type GELATO is outside the declared enum and returns 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /creamery/flavors"
              payload: { name: "Gelato Gate", base_type: "GELATO", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_ENUM (HTTP 400)"

      - name: supplier_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Supplier.fields.social_criteria_score]
        distinguishing_aspect: "Client-supplied social_criteria_score is ignored on create; the computed field stays null until a VERIFIED audit sets it."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /creamery/suppliers"
              payload: { name: "Presumptuous Produce", country_code: "US", ingredient_category: "FRUIT", social_criteria_score: 99 }
              as: SourcingManager
              captures: { s_score: $.data.social_criteria_score }
          assert:
            - "s_score is null (client input for a computed field ignored)"

      - name: enrollment_blended_score_computed
        claim_type: computed_fields
        grounds: [entities.FarmProgramEnrollment.fields.blended_score]
        distinguishing_aspect: "blended_score rounds half-up: env 81 / welfare 70 yields 76 (75.5 -> 76), not 75."
        test_recipe:
          setup: ["Enrollment ENROLLED"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Rounding Ranch", region: "VT", herd_size: 80, season_year: 2026, baseline_volume_liters: 5000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 81, welfare_practice_score: 70 }
              as: DairyProgramManager
              captures: { blended: $.data.blended_score }
          assert:
            - "blended == 76 (round_half_up(75.5))"

      - name: shop_franchise_fee_computed_by_operator_type
        claim_type: computed_fields
        grounds: [entities.ScoopShop.fields.franchise_fee_cents, entities.ScoopShop.fields.operator_type]
        distinguishing_aspect: "franchise_fee_cents is computed from operator_type: 3500000 for FRANCHISEE, 0 for NONPROFIT_PARTNER (partner shop fee waived)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Fee Shop", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { fee_f: $.data.franchise_fee_cents }
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Partner Shop", operator_type: "NONPROFIT_PARTNER", nonprofit_verified: true, city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { fee_p: $.data.franchise_fee_cents }
          trigger: []
          assert:
            - "fee_f == 3500000"
            - "fee_p == 0"

      - name: flavor_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FLAVOR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent flavor id returns 404 ERR_FLAVOR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /creamery/flavors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLAVOR_NOT_FOUND (HTTP 404)"

      - name: campaign_notice_status_initialized_by_impact
        claim_type: defaults
        grounds: [entities.Campaign.fields.retail_notice_status, state_machines.Campaign.retail_notice_status]
        distinguishing_aspect: "retail_notice_status initializes to NOT_REQUIRED when impact is NONE and PENDING otherwise."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Quiet Campaign", issue_area: "CLIMATE", retail_partner_impact: "NONE" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { notice_none: $.data.retail_notice_status }
            - call: "POST /creamery/campaigns"
              payload: { title: "Loud Campaign", issue_area: "FAIR_TRADE", retail_partner_impact: "HIGH" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { notice_high: $.data.retail_notice_status }
          trigger: []
          assert:
            - "notice_none == NOT_REQUIRED"
            - "notice_high == PENDING"

  - section: state_machines
    instances:
      - name: supplier_terminate_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Supplier.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From TERMINATED no transition is defined: suspend on a terminated supplier fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Supplier PROSPECT, then TERMINATED"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Doomed Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/terminate"
              as: SourcingManager
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/suspend"
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); TERMINATED is terminal"

      - name: commitment_lapses_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.SourcingCommitment.ACTIVE_to_LAPSED]
        distinguishing_aspect: "A commitment whose effective_to has passed moves ACTIVE -> LAPSED when the logical clock advances; observable on the next read."
        test_recipe:
          setup: ["Supplier APPROVED with ACTIVE commitment effective_to 2026-12-31"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Lapse Supplier", country_code: "US", ingredient_category: "SUGAR" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "SUGAR", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_supplier_version: "${s_v}" }
              as: SourcingManager
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ParentOpsController
            - call: "GET /creamery/suppliers/${s_id}/commitments"
              as: SourcingManager
              captures: { cm_status: "$.data[0].status" }
          assert:
            - "cm_status == LAPSED (clock advanced past effective_to 2026-12-31)"

      - name: audit_complete_before_start_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Audit.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is undefined from SCHEDULED; only IN_PROGRESS audits can complete."
        test_recipe:
          setup: ["Supplier PROSPECT with a SCHEDULED audit"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Early Audit Co", country_code: "US", ingredient_category: "NUTS" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"

      - name: payment_approve_provisional_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PremiumPayment.CALCULATED_to_APPROVED, "errors[ERR_PAYMENT_NOT_FINAL]"]
        distinguishing_aspect: "Approving a payment still in PROVISIONAL variant fails with ERR_PAYMENT_NOT_FINAL, not generic state."
        test_recipe:
          setup: ["Enrollment ASSESSED (env 80, welfare 70); payment created, still PROVISIONAL"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Provisional Farm", region: "VT", herd_size: 80, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 10000, commodity_price_cents_per_liter: 45 }
              as: DairyProgramManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /creamery/premium-payments/${p_id}/approve"
              as: DairyProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PAYMENT_NOT_FINAL (HTTP 409)"

      - name: payment_pay_before_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PremiumPayment.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "pay is defined only from APPROVED; a CALCULATED payment cannot be paid."
        test_recipe:
          setup: ["Enrollment ASSESSED; payment CALCULATED (never approved)"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Skip Farm", region: "VT", herd_size: 80, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 10000, commodity_price_cents_per_liter: 45 }
              as: DairyProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /creamery/premium-payments/${p_id}/finalize"
              payload: { metered_volume_liters: 10000, non_conformance_count: 0 }
              as: DairyProgramManager
          trigger:
            - call: "POST /creamery/premium-payments/${p_id}/pay"
              as: ParentOpsController
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"

      - name: payment_double_finalize_rejected
        claim_type: idempotency
        grounds: [state_machines.PremiumPayment.CALCULATED_to_CALCULATED]
        distinguishing_aspect: "finalize is defined only from calc_variant PROVISIONAL; a second finalize on a FINAL payment fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Enrollment ASSESSED; payment already FINAL"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Twice Farm", region: "VT", herd_size: 80, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 10000, commodity_price_cents_per_liter: 45 }
              as: DairyProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /creamery/premium-payments/${p_id}/finalize"
              payload: { metered_volume_liters: 10000, non_conformance_count: 0 }
              as: DairyProgramManager
          trigger:
            - call: "POST /creamery/premium-payments/${p_id}/finalize"
              payload: { metered_volume_liters: 9000, non_conformance_count: 0 }
              as: DairyProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); FINAL payments cannot be re-finalized"

      - name: flavor_promote_skip_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flavor.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "promote with target_state LIMITED_RUN from DEVELOPMENT skips TEST_BATCH and is rejected; only the next pipeline state is reachable."
        test_recipe:
          setup: ["Flavor DEVELOPMENT"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Skipper", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"

      - name: revival_sign_after_qualified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RevivalRequest.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "sign is defined only from OPEN; a request already QUALIFIED rejects further signatures."
        test_recipe:
          setup: ["Retired flavor with a revival request that just reached 500 signatures (QUALIFIED)"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Threshold Treat", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "start@x.com", title: "Revive" }
              as: Fan
              captures: { r_id: $.data.id }
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "mass@x.com", count: 500 }
              as: Fan
          trigger:
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "late@x.com", count: 1 }
              as: Fan
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); request already QUALIFIED"

      - name: revival_decline_from_open_valid
        claim_type: valid_transition
        grounds: [state_machines.RevivalRequest.OPEN_to_DECLINED]
        distinguishing_aspect: "The board may decline an OPEN request before it qualifies; no signature threshold is required for DECLINED."
        test_recipe:
          setup: ["Retired flavor with an OPEN revival request (0 signatures)"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Nope Nugget", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "start@x.com", title: "Revive" }
              as: Fan
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /creamery/revival-requests/${r_id}/decline"
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { st: $.data.status }
          assert:
            - "st == DECLINED"

      - name: campaign_board_reject_blocks_schedule
        claim_type: invalid_transition
        grounds: [state_machines.Campaign.approval_status.BOARD_REVIEW_to_BOARD_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A BOARD_REJECTED campaign is terminal for the approval dimension: schedule-ops fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Campaign proposed by board-1, rejected by board-2"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Doomed Drive", issue_area: "CLIMATE", retail_partner_impact: "LOW" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { camp_id: $.data.id }
            - call: "POST /creamery/campaigns/${camp_id}/board-decision"
              payload: { approve: false }
              as: IndependentBoardMember
              as_user_id: "board-2"
          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/schedule-ops"
              as: ParentOpsController
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"

      - name: campaign_launch_with_pending_notices_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Campaign.approval_status.OPS_SCHEDULED_to_LAUNCHED, "errors[ERR_RETAIL_NOTICES_PENDING]"]
        distinguishing_aspect: "HIGH-impact campaign with retail_notice_status PENDING cannot launch; notices must be DISPATCHED first."
        test_recipe:
          setup: ["Campaign impact HIGH: proposed by board-1, approved by board-2, ops scheduled; notices still PENDING"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Shelf Shock", issue_area: "FAIR_TRADE", retail_partner_impact: "HIGH" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { camp_id: $.data.id }
            - call: "POST /creamery/campaigns/${camp_id}/board-decision"
              payload: { approve: true }
              as: IndependentBoardMember
              as_user_id: "board-2"
            - call: "POST /creamery/campaigns/${camp_id}/schedule-ops"
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/launch"
              as: ParentOpsController
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RETAIL_NOTICES_PENDING (HTTP 409)"

      - name: campaign_dispatch_before_approval_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Campaign.retail_notice_status.PENDING_to_DISPATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retail notices may only dispatch once the campaign is BOARD_APPROVED or OPS_SCHEDULED; from BOARD_REVIEW the transition is undefined."
        test_recipe:
          setup: ["Campaign impact LOW in BOARD_REVIEW (notice PENDING)"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Early Notices", issue_area: "CLIMATE", retail_partner_impact: "LOW" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/dispatch-retail-notices"
              as: ParentOpsController
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409)"

      - name: campaign_veto_withdraws_launched_campaign
        claim_type: valid_transition
        grounds: [state_machines.Campaign.approval_status.LAUNCHED_to_WITHDRAWN]
        distinguishing_aspect: "The independent board's veto reaches into LAUNCHED: board authority over social mission overrides parent operational control even after launch."
        test_recipe:
          setup: ["Campaign impact NONE approved, ops-scheduled, launched (notice NOT_REQUIRED)"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Veto Bait", issue_area: "DEMOCRACY", retail_partner_impact: "NONE" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { camp_id: $.data.id }
            - call: "POST /creamery/campaigns/${camp_id}/board-decision"
              payload: { approve: true }
              as: IndependentBoardMember
              as_user_id: "board-2"
            - call: "POST /creamery/campaigns/${camp_id}/schedule-ops"
              as: ParentOpsController
            - call: "POST /creamery/campaigns/${camp_id}/launch"
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/veto"
              as: IndependentBoardMember
              as_user_id: "board-3"
              captures: { st: $.data.approval_status }
          assert:
            - "st == WITHDRAWN (veto from LAUNCHED succeeds)"

      - name: shop_reject_site_closes_application
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScoopShop.SITE_REVIEW_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reject-site moves SITE_REVIEW -> CLOSED (terminal); a later approve-site on the CLOSED shop fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ScoopShop SITE_REVIEW, then rejected"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Rejected Corner", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/reject-site"
              as: FranchiseAdmin
              captures: { st: $.data.status }
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "st == CLOSED after reject-site"
            - "err == ERR_INVALID_STATE (HTTP 409); CLOSED is terminal"

      - name: shop_suspend_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.ScoopShop.OPERATING_to_SUSPENDED, state_machines.ScoopShop.SUSPENDED_to_OPERATING]
        distinguishing_aspect: "OPERATING -> SUSPENDED -> OPERATING cycle works; the shop returns to service with fields unchanged."
        test_recipe:
          setup: ["ScoopShop OPERATING (FRANCHISEE)"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "YoYo Scoops", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_id}/suspend"
              as: FranchiseAdmin
              captures: { mid: $.data.status }
            - call: "POST /creamery/scoop-shops/${shop_id}/reopen"
              as: FranchiseAdmin
              captures: { end: $.data.status }
          assert:
            - "mid == SUSPENDED"
            - "end == OPERATING (cycle closed)"

      - name: partner_shop_open_requires_verification
        claim_type: precondition_enforcement
        grounds: [state_machines.ScoopShop.SITE_APPROVED_to_OPERATING, "errors[ERR_NONPROFIT_VERIFICATION_REQUIRED]"]
        distinguishing_aspect: "A NONPROFIT_PARTNER shop with nonprofit_verified false cannot open; the partner-shop model requires verified nonprofit status."
        test_recipe:
          setup: ["ScoopShop NONPROFIT_PARTNER, nonprofit_verified false, SITE_APPROVED"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
