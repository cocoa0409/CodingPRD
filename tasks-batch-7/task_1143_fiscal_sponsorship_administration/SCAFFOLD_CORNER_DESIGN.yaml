  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_fund_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fund-adjustment-stale-version]", "errors[ERR_STALE_FUND_VERSION]"]
        distinguishing_aspect: "Adjustment 1 with the observed version succeeds (version 2 -> 3); adjustment 2 carrying the now-stale version 2 fails with ERR_STALE_FUND_VERSION (412) — the race is resolved purely by OCC on FundAccount.version."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; fund version observed after countersign"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "OC1", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "oc1@x.org" }, as: Applicant, as_user_id: user_c_o1, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_o1 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id, f: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_o1 }
            - { call: "GET /fsa/fund-accounts/${f}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { f_v: $.data.version } }
          trigger:
            - { call: "POST /fsa/fund-accounts/${f}/adjustments", payload: { expected_fund_account_version: "${f_v}", amount_cents: 5000, memo: "correction in" }, as: FinanceOfficer, as_user_id: user_fo_1, captures: { v_after: $.data.version } }
            - { call: "POST /fsa/fund-accounts/${f}/adjustments", payload: { expected_fund_account_version: "${f_v}", amount_cents: -5000, memo: "stale writer" }, as: FinanceOfficer, as_user_id: user_fo_2, captures: { e: $.data.error_id } }
          assert:
            - "first adjustment succeeds: version advanced by exactly 1 from ${f_v}"
            - "second adjustment with the same observed version: error_id == ERR_STALE_FUND_VERSION (HTTP 412); total_adjustments_cents == 5000 unchanged by the loser"

      - name: occ_agreement_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-amend-stale-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "Amend 1 with the observed version succeeds; amend 2 carrying the stale version fails with ERR_STALE_AGREEMENT_VERSION (412) — OCC on SponsorshipAgreement.version, no wall-clock dependence."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; agreement version observed"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "OC2", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "oc2@x.org" }, as: Applicant, as_user_id: user_c_o2, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_o2 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_o2 }
            - { call: "GET /fsa/agreements/${ag}", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { ag_v: $.data.version } }
          trigger:
            - { call: "POST /fsa/agreements/${ag}/amend", payload: { expected_agreement_version: "${ag_v}", note: "first" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { v_after: $.data.version } }
            - { call: "POST /fsa/agreements/${ag}/amend", payload: { expected_agreement_version: "${ag_v}", note: "stale second" }, as: SponsorAdmin, as_user_id: user_sa_2, captures: { e: $.data.error_id } }
          assert:
            - "first amend succeeds: version advanced by exactly 1"
            - "second amend with stale version: error_id == ERR_STALE_AGREEMENT_VERSION (HTTP 412); amendment_note remains 'first'"

      - name: layer_derived_available_after_partial_refund
        claim_type: derived_field_reconciliation
        grounds: [entities.FundAccount.fields.available_cents, state_machines.Donation.REFUND_REQUESTED_to_RECEIVED]
        distinguishing_aspect: "The denormalized available_cents reconciles immediately with refund posting: 100,000 received (fee 8,000) then 40,000 refunded -> available 52,000; the fee stays charged until period close."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; donation 100,000 RECEIVED"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "DR", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "drc@x.org" }, as: Applicant, as_user_id: user_c_o3, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_o3 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id, f: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_o3 }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 100000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
          trigger:
            - { call: "POST /fsa/donations/${d}/request-refund", payload: { amount_cents: 40000, reason: "partial" }, as: Donor, as_user_id: user_donor_1 }
            - { call: "POST /fsa/donations/${d}/decide-refund", payload: { decision: "APPROVE" }, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "GET /fsa/fund-accounts/${f}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { avail: $.data.available_cents, ref: $.data.total_refunded_cents, fees: $.data.total_fees_charged_cents } }
          assert:
            - "available_cents == 52000 (100,000 - 40,000 - 8,000); total_refunded_cents == 40000; total_fees_charged_cents still 8000 (reversal deferred to close-period)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [state_machines.ComplianceReview.FINDINGS_ISSUED_to_ESCALATED]
        excluded_because:
          difficulty_instance: transitive_cascade / escalate_suspends_project_rejects_inflight_releases_funds
          rationale: "The N-level cascade is asserted hop-by-hop in the named difficulty instance."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [calculations.admin_fee_on_receipt, calculations.available_spend_balance]
        excluded_because:
          difficulty_instance: dual_variant_calc / admin_fee_model_variants_diverge
          rationale: "Both dual-variant calculations are covered by the named difficulty instance and spend_basis_settled_vs_forward."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cm_immediate_consistency_on_pay
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.DisbursementRequest.APPROVED_FOR_PAYMENT_to_PAID]
        distinguishing_aspect: "Immediate consistency: the pay response itself shows PAID, and a follow-up GET in the same logical instant shows committed reduced and disbursed increased — no eventual lag."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; received 100,000 (fee 8,000; available 92,000); disbursement 30,000 APPROVED_FOR_PAYMENT (committed 30,000; available 62,000)"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "CM", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "cm@x.org" }, as: Applicant, as_user_id: user_c_m1, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_m1 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id, f: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_m1 }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 100000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 30000, purpose: "x", payee_type: "VENDOR", payee_name: "V", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr}/submit", payload: {}, as: ProjectLead, as_user_id: "${p}" }
            - { call: "POST /fsa/disbursement-requests/${dr}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
          trigger:
            - { call: "POST /fsa/disbursement-requests/${dr}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { st: $.data.status } }
