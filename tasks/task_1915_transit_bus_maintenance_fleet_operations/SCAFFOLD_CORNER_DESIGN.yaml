            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { odo: $.data.odometer_miles } }
          assert:
            - "Voiding older log L1: err == ERR_LOG_NOT_LATEST (409)"
            - "Voiding latest log L2: status == VOIDED and bus odometer_miles recomputed to 600 (L1's odometer_end)"

      - name: part_stock_insufficient_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors[ERR_PART_STOCK_INSUFFICIENT]
        distinguishing_aspect: "Reservation requires quantity_available >= qty: requesting 3 units with only 2 available (on_hand 2, reserved 0) fails with ERR_PART_STOCK_INSUFFICIENT and reserves nothing."
        test_recipe:
          setup: ["Part with on_hand 2; IN_PROGRESS CORRECTIVE WO led by m1"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y37", vin: "VINY37", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-Y37", description: "Scarce relay", part_class: "CONSUMABLE", unit_cost_cents: 1500, reorder_point: 0, initial_on_hand: 2, warranty_eligible: false }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "Y37A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 4500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 3 }, as: PartsClerk, captures: { err: $.data.error_id } }
            - { call: "GET /fleet/parts/${p}", payload: {}, as: PartsClerk, captures: { oh: $.data.quantity_on_hand, rs: $.data.quantity_reserved } }
          assert:
            - "err == ERR_PART_STOCK_INSUFFICIENT (409)"
            - "Part unchanged: quantity_on_hand == 2, quantity_reserved == 0"

  # --------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: envelope_shape
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + response_type 'object' + data; errors have response_type 'error' + data.error_id + data.message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/buses", payload: { fleet_number: "N1", vin: "VINN1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { rid: "$.meta.api_request_id" } }
            - { call: "GET /fleet/buses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FleetManager, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "Success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.id present"
            - "Error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

      - name: defect_list_filter_by_status
        claim_type: filtering
        grounds:
          - endpoints."GET /fleet/defect-reports"
        distinguishing_aspect: "Filtered list: two defects (one WITHDRAWN, one OPEN) — ?status=WITHDRAWN returns exactly the withdrawn one, ?status=OPEN the other."
        test_recipe:
          setup: ["One bus; two MINOR defects; the first withdrawn by its operator"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "N2", vin: "VINN2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MINOR", defect_code: "TIRE", description: "worn", odometer_at_report: 10 }, as: Operator, captures: { d1: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MINOR", defect_code: "HVAC", description: "rattle", odometer_at_report: 10 }, as: Operator, captures: { d2: $.data.id } }
            - { call: "POST /fleet/defect-reports/${d1}/events", payload: { event_type: "WITHDRAW" }, as: Operator }
          trigger:
            - { call: "GET /fleet/defect-reports?status=WITHDRAWN", payload: {}, as: FleetManager, captures: { withdrawn: $.data } }
            - { call: "GET /fleet/defect-reports?status=OPEN", payload: {}, as: FleetManager, captures: { open: $.data } }
          assert:
            - "status=WITHDRAWN: exactly [${d1}]; status=OPEN: exactly [${d2}]"

  # --------------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: operator_cannot_create_bus_forbidden
        claim_type: role_denial
        grounds:
          - roles.FleetManager
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /fleet/fleet/buses is FleetManager-exclusive; Operator is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/buses", payload: { fleet_number: "R1", vin: "VINR1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: Operator, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN", "HTTP 403"]

      - name: mechanic_cannot_create_part_forbidden
        claim_type: role_denial
        grounds:
          - roles.PartsClerk
