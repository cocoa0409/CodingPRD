      - name: corner_release_decision_on_an_untreated_pallet_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_LOT_CUSTODY_STATE]
          - validations.p8[POST /lots/{id}/release-decision -> ERR_INVALID_LOT_CUSTODY_STATE]
        distinguishing_aspect: "Release is meaningless before treatment: a pallet sitting IN_COLD_STORAGE is refused on the custody dimension even though its release dimension (NOT_RELEASED) is a legal from-state and the version is current."
        test_recipe:
          setup:
            - "PAL-001 is accepted into CR-1 and has never been loaded"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_lot1
            - *c_accept1
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { early_v: $.data.version } }
          trigger:
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${early_v}" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_custody: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_LOT_CUSTODY_STATE"
            - "data.error_id != ERR_STALE_LOT_VERSION (the supplied version was current)"
            - "Lot.${lot1_id}.custody_state == IN_COLD_STORAGE, release_state == NOT_RELEASED, version == ${early_v}"

      - name: corner_release_decision_after_release_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_LOT_RELEASE_STATE]
          - validations.p8[POST /lots/{id}/release-decision -> ERR_INVALID_LOT_RELEASE_STATE]
          - state_machines.Lot.release_state.terminal_states
        distinguishing_aspect: "RELEASED is terminal on the release dimension: a second decision with a correct fresh version is still refused, and released_by_user_id keeps the original signer."
        test_recipe:
          setup:
            - "the standard world; C1 DISPOSITIONED and PAL-001 RELEASED by qm_alice"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - *c_get_lot1
            - *c_release1
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { lot1_v2: $.data.version } }
          trigger:
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "REJECT", expected_lot_version: "${lot1_v2}" }, as: QualityManager, as_user_id: "qm_carol", captures: { e_relstate: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_LOT_RELEASE_STATE"
            - "Lot.${lot1_id}.release_state == RELEASED, custody_state == TREATED, released_by_user_id == qm_alice"
            - "Lot.${lot1_id}.units_treated == 1000 and units_disposed == 0"

      - name: corner_second_adjudication_of_a_deviation_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_DEVIATION_STATE]
          - validations.p8[POST /deviations/{id}/adjudicate -> ERR_INVALID_DEVIATION_STATE]
        distinguishing_aspect: "All three adjudicated states are terminal, and the priority-8 state gate fires ahead of the priority-9 disposition rules, so a REPROCESS attempt on an already-ACCEPTED deviation reports the state error rather than a disposition error."
        test_recipe:
          setup:
            - "the standard world; C1 COMPLETED_DEVIATED after a 179 s hold and its MAJOR deviation adjudicated ACCEPT by qm_alice"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_dev
            - *c_get_dev
            - &c_accept_dev { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "ACCEPT", root_cause_code: "EQUIP_PUMP_FAULT" }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "REPROCESS", root_cause_code: "PKG_FILM_SPEC" }, as: QualityManager, as_user_id: "qm_carol", captures: { e_devstate: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_DEVIATION_STATE"
            - "Deviation.${dev_id}.status == ADJUDICATED_ACCEPT, chargeback_party == FACILITY, adjudicated_by_user_id == qm_alice"
            - "VesselCycle.${cyc1_id}.state is still COMPLETED_DEVIATED and Lot.${lot1_id}.units_treated == 1000"

      - name: corner_second_waive_on_a_waived_line_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_CHARGEBACK_STATE]
          - validations.p8[POST /chargeback-lines/{id}/waive -> ERR_INVALID_CHARGEBACK_STATE]
          - entities.ChargebackLine.fields.status
        distinguishing_aspect: "WAIVED is terminal on the money line: the second waive is refused and the balance stays at 0 rather than being credited twice."
        test_recipe:
          setup:
            - "the standard world; load L1 inspected at 3000 ppm minted a 6788-cent PACKAGE_LEAKER line which has been waived once"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - *c_inspect1
