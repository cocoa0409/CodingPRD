      - name: repeated_moe_assessment_overwrites_the_stored_basis_ratio_and_verdict
        claim_type: Reconciliation
        grounds:
          - calculations.federal_moe_compliance
          - entities.FederalGrant.fields.moe_assessed_basis
          - entities.FederalGrant.fields.moe_compliance_ratio
          - endpoints[POST /fiscal/federal-grants/{id}/moe-assessment]
        distinguishing_aspect: |
          Reconciliation claim on a re-runnable assessment: the grant stores exactly one
          verdict, so three assessments over identical expenditure data walk
          NOT_ASSESSED -> DEFICIENT -> COMPLIANT -> DEFICIENT, overwriting basis, ratio and
          status each time and bumping version each time. No history row is retained and the
          COMPLIANT verdict does not stick after the basis is switched back.
