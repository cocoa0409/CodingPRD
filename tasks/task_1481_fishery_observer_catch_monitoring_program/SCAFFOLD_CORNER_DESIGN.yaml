          assert:
            - "Precondition: Deployment.${d_id}.status == SCHEDULED (initial_state)"
            - "board from SCHEDULED -> ERR_SAFETY_CHECK_REQUIRED (409)"
            - "Deployment.${d_id}.status remains SCHEDULED"

      - name: observer_decertify_blocked_while_active_deployment_exists
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Observer.ACTIVE_to_DECERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Observer ACTIVE->DECERTIFIED carries the guarded precondition "no
          Deployment of this observer in SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY|
          AT_SEA"; with a SCHEDULED deployment present the PATCH fails with
