              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "ENGLISH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_read}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
