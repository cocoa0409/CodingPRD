scenario: "978. Accessibility Ramp & Home-Modification: assessment & ADA/CAPS scope, quote & funding (waiver/VA/grant), install & permit, rental-ramp program, inspection & warranty, OT collaboration, reassessment, billing"

domain_name: accessibility-ramp-home-modification
api_prefix: /cases

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: client_name, type: string, source: input, description: "Client full name" }
      - { name: client_address, type: string, source: input, description: "Property address" }
      - { name: client_phone, type: string, source: input, description: "Contact phone" }
      - { name: referral_source, type: enum, source: input, description: "PHYSICIAN | OT | VA | SELF | AGENCY", default: "SELF" }
      - { name: status, type: enum, source: system, description: "INTAKE | ASSESSMENT_SCHEDULED | ASSESSED | QUOTE_DRAFTED | QUOTE_SUBMITTED | FUNDING_PENDING | FUNDING_APPROVED | INSTALLATION_SCHEDULED | INSTALLED | INSPECTED | WARRANTY_ACTIVE | CLOSED | CANCELLED" }
      - { name: funding_posture, type: enum, source: computed, description: "UNFUNDED | PARTIALLY_FUNDED | FULLY_FUNDED | OVERFUNDED" }
      - { name: total_quoted_cents, type: integer, source: computed, description: "Sum of all line items across active quotes" }
      - { name: total_funded_cents, type: integer, source: computed, description: "Sum of all APPROVED funding source amounts" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of all SENT/PAID invoice amounts" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of all PAID invoice amounts" }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_billed_cents - total_paid_cents, never negative" }
      - { name: ada_scope_score, type: integer, source: computed, description: "Composite ADA compliance score 0-100, derived from assessments" }
      - { name: caps_scope_score, type: integer, source: computed, description: "CAPS certification scope score 0-100" }
      - { name: safety_risk_index, type: number, source: computed, description: "Weighted risk index 0.0-10.0 from hazard assessments" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Assessment
    parent: Case
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; parent case" }
      - { name: assessor_id, type: string, source: input, description: "OT or CAPS assessor identifier" }
      - { name: assessor_role, type: enum, source: input, description: "OT | CAPS | BOTH" }
      - { name: assessment_type, type: enum, source: input, description: "INITIAL | REASSESSMENT | POST_INSTALL" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled assessment date" }
      - { name: completed_date, type: datetime, source: system, description: "Actual completion timestamp, null until completed" }
      - { name: mobility_score, type: integer, source: input, description: "0-100 mobility limitation score" }
      - { name: hazard_count, type: integer, source: input, description: "Number of identified hazards" }
      - { name: ada_compliance_pct, type: number, source: computed, description: "Percentage of ADA standards met 0.0-100.0" }
      - { name: caps_recommendation_score, type: integer, source: computed, description: "CAPS scope recommendation 0-100" }
      - { name: recommended_modifications, type: array, source: input, description: "List of recommended modification codes" }
      - { name: rental_eligible, type: boolean, source: computed, description: "Whether rental ramp is clinically appropriate" }
      - { name: purchase_required, type: boolean, source: computed, description: "Whether permanent installation is medically necessary" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: notes, type: string, source: input, required: false, description: "Clinical notes" }

  - name: Quote
    parent: Case
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; parent case" }
      - { name: quote_number, type: string, source: system, description: "Human-readable quote number, format Q-YYYYMMDD-NNN" }
      - { name: revision, type: integer, source: system, description: "Revision number, starts at 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SUPERSEDED | EXPIRED" }
      - { name: valid_until, type: datetime, source: input, description: "Quote expiration date" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Computed labor cost" }
      - { name: material_cost_cents, type: integer, source: computed, description: "Computed material cost" }
      - { name: permit_fee_cents, type: integer, source: computed, description: "Permit fee estimate" }
      - { name: equipment_cost_cents, type: integer, source: computed, description: "Equipment rental/purchase cost" }
      - { name: contingency_pct, type: number, source: input, default: 10.0, description: "Contingency percentage 0-25" }
      - { name: contingency_cents, type: integer, source: computed, description: "Contingency amount" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of cost components" }
      - { name: discount_cents, type: integer, source: computed, description: "Applied discount amount" }
      - { name: total_cents, type: integer, source: computed, description: "Final quote total" }
      - { name: funding_gap_cents, type: integer, source: computed, description: "total_cents - case.total_funded_cents at submission time" }
      - { name: superseded_by_id, type: string, source: system, required: false, description: "FK -> Quote.id; replacement quote if superseded" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Submission timestamp" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "Approval/rejection timestamp" }

  - name: QuoteLineItem
