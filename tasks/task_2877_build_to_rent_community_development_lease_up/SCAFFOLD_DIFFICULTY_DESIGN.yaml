  - rule_id: non_linear_state_machine
    instances:
      - name: plat_revision_loop_returns_submitted_to_submitted_and_increments_round
        grounds:
          - state_machines.Community.plat.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Community.plat.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.Community.plat.SUBMITTED_to_APPROVED
          - entities.Community.fields.plat_revision_round
          - entities.Community.fields.plat_status
          - validations[priority=59]
        distinguishing_aspect: |
          The entitlement dimension is a true cycle, not a forward-only ladder: SUBMITTED ->
          REVISION_REQUESTED -> SUBMITTED revisits a state already occupied, and the loop is bounded by
          plat_revision_round (0..2) rather than by the state name — so after one full loop the
          community is SUBMITTED again but with plat_revision_round 1, and posture stays FROZEN for the
          entire loop until the terminal APPROVE.
        test_recipe:
          setup:
            - "Community 'Granite Row' created with single_ownership_covenant true; plat_status DRAFT, plat_revision_round 0, posture FROZEN."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Granite Row", market_code: "TX-HOU", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 1 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c6: $.data.id }
          trigger:
            - call: "POST /communities/${c6}/plat-submissions"
              payload: { plat_package_reference: "PLAT-GR-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c6}/plat-decisions"
              payload: { decision: "REQUEST_REVISION", decision_note: "Reduce lot coverage on the north edge" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /communities/${c6}/plat-submissions"
              payload: { plat_package_reference: "PLAT-GR-2" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c6}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
          assert:
            - "After the REQUEST_REVISION decision: Community.${c6}.plat_status == REVISION_REQUESTED and plat_revision_round == 1"
            - "After the second submission: Community.${c6}.plat_status == SUBMITTED and plat_revision_round == 1 (the round does not increment on resubmission)"
            - "After the APPROVE decision: Community.${c6}.plat_status == APPROVED and plat_revision_round == 1"
            - "Community.${c6}.posture == FROZEN at every point before the APPROVE decision and == OPEN immediately after it"
            - "Community.${c6}.plat_submitted_by_user_id == 'u_dev_1'"

