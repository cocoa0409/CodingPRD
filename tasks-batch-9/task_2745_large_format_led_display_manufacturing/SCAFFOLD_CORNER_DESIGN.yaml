            - "ServiceContract.${sc}.version is unchanged and DisplayProject.${pj}.service_posture == 'NORMAL'"

      - name: releasing_a_module_that_is_not_this_contracts_spare_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors.ERR_SPARE_NOT_RESERVED
          - endpoints[POST /service-contracts/{service_contract_id}/spare-releases]
        excluded_because:
          difficulty_instance: state_outranks_business_constraint_on_case_fulfil
          rationale: |
            ERR_SPARE_NOT_RESERVED is triggered in isolation as the control step of
            that §1.8 ordering instance: once the case reaches APPROVED, a fulfil
            naming a module that is not reserved to the contract returns exactly
            this code. A §1.9 copy would assert the same single comparison.

      - name: soak_window_shorter_than_the_model_requirement_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors.ERR_BURN_IN_DURATION_TOO_SHORT
        excluded_because:
          difficulty_instance: business_safety_outranks_business_temporal_on_burn_in_create
          rationale: |
            ERR_BURN_IN_DURATION_TOO_SHORT is triggered on its own inside that §1.8
            ordering instance, which sends a 23-hour window against a 24-hour model
            requirement after clearing the drive-level ceiling, and also shows the
            exactly-24-hour window passing. Re-asserting the duration rule here
            would duplicate both halves.

      - name: case_actions_require_an_active_contract
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_CONTRACT_NOT_ACTIVE
        excluded_because:
          difficulty_instance: service_case_open_requires_contract_active
          rationale: |
            That §1.8 instance opens a case against a PENDING contract, then against
            a SUSPENDED one, and shows ERR_CONTRACT_NOT_ACTIVE in both directions
            plus the ACTIVE case succeeding in between — the whole content of
            priority 24.

      - name: crew_cannot_arrive_before_every_cabinet_is_mounted
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors.ERR_CABINETS_NOT_MOUNTED
        excluded_because:
          difficulty_instance: visit_arrive_requires_all_cabinets_mounted
          rationale: |
            ERR_CABINETS_NOT_MOUNTED is the subject of that §1.8 instance, which
            keeps one cabinet of a two-cabinet project unmounted, fails the arrive,
            mounts it, and then succeeds inside the same window.

      - name: chamber_slot_budget_is_aggregate_over_the_closed_interval
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
          - calculations.chamber_slot_occupancy
        excluded_because:
          difficulty_instance: chamber_closed_interval_with_turnaround_aggregate_capacity
          rationale: |
