              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Disbursee", email: "d@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1, gpa_hundredths: 300, cumulative_attempted_credits: 30, cumulative_completed_credits: 30 }
              as: AidOfficer
              captures: { stu_d: "$.data.id" }
            - call: "POST /api/students/${stu_d}/evaluate-sap"
              payload: {}
              as: AidOfficer
