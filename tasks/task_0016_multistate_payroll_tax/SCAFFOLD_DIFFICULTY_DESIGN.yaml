  # =====================================================================
  # Rule 9 — compensating_invariant (≥ 2, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_run_preserves_employee_ytd_quantities
        grounds:
          - state_machines.PaycheckRun.PAID_to_VOID
          - state_machines.PaycheckRun.APPROVED_to_PAID
          - entities.Employee.fields.ytd_wages_cents
          - entities.Employee.fields.ytd_fed_withheld_cents
          - entities.Employee.fields.ytd_ss_wages_cents
          - entities.Employee.fields.ytd_medicare_wages_cents
        distinguishing_aspect: |
          Conserved quantity: Employee YTD fields (ytd_wages_cents, ytd_fed_withheld_cents,
          ytd_ss_wages_cents, ytd_medicare_wages_cents). For any Paycheck p, the forward action
          PaycheckRun PAID adds (p.gross_wages_cents, p.fed_withheld_cents, p.gross_wages_cents
          capped at SS base, p.gross_wages_cents) to those fields; the compensating action
          PaycheckRun VOID subtracts exactly the same amounts. The named invariant is:
          Employee.ytd_wages_cents BEFORE_PAY == Employee.ytd_wages_cents AFTER_VOID (and same
          for the other three YTD fields). Pinned formula: forall p in PaycheckRun.children,
          Employee[p.employee_id].ytd_wages_cents net change == 0 across the PAID->VOID sequence.
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED; YTD baseline pre-action: ytd_wages_cents=500000, ytd_fed_withheld_cents=40000, ytd_ss_wages_cents=500000, ytd_medicare_wages_cents=500000"
            - "PaycheckRun PAID (just paid) with one $2000 REGULAR paycheck for the employee"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Quinn CI1", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /_employees/${emp_id}/set_ytd"
              payload: { ytd_wages_cents: 500000, ytd_fed_withheld_cents: 40000, ytd_ss_wages_cents: 500000, ytd_medicare_wages_cents: 500000 }
              as: PlatformAdmin
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
