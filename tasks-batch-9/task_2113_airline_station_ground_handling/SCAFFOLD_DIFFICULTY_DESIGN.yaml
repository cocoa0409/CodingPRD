            - "BillingLine.${bl_id}.gross_amount_cents == 18000"

  # =======================================================================
  # Rule 6 - boundary-precision checks on different metrics and endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: otp_tolerance_inclusive_boundary_15_vs_16_minutes
        grounds:
          - calculations.turn_otp_classification
          - entities.Station.fields.otp_tolerance_minutes
          - entities.Turn.fields.delay_minutes
          - entities.Turn.fields.otp_result
          - state_machines.Turn.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Metric = whole-minute departure delay against otp_tolerance_minutes, reached through
          POST /turns/{turnId}/lifecycle. The comparison is `<=`, so exactly 15 minutes late is
          ON_TIME and 16 minutes late is DELAYED; the station's otp_rolling_pct therefore lands
          on 50.00 with one turn on each side of the boundary.
        test_recipe:
          setup:
            - "Station ZRH is OPEN with otp_tolerance_minutes 15 and otp_target_pct 85.00."
            - "FlightBank AM1 is PUBLISHED with staffing APPROVED and planned_headcount 2."
            - "Turn ONE is TOWING_ONLY scheduled 06:00-06:20; Turn TWO is TOWING_ONLY scheduled 08:00-08:20."
            - "One direct agent and one tug serve both turns in sequence; the first turn's occupations are RELEASED by its completion before the second turn is resourced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
