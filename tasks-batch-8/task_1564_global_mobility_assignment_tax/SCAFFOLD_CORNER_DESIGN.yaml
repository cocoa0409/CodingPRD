# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1564: Global Mobility & Assignment Tax Equalization
# Sections follow references/claim-extraction-guide.md. Claims already exercised
# by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.MobilityProgram.fields.cost_overrun_threshold_pct, entities.MobilityProgram.fields.max_assignment_duration_days, entities.MobilityProgram.fields.per_diem_annual_day_cap, entities.MobilityProgram.fields.status]
        distinguishing_aspect: "Omitting the three optional program knobs yields defaults 110 / 1825 / 365, status ACTIVE, total_posted_chargeback_cents 0, and common fields id/created_at/updated_at/version=1 stamped by the system."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mobility/programs", payload: { name: "Defaults Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id", prog_threshold: "$.data.cost_overrun_threshold_pct", prog_durcap: "$.data.max_assignment_duration_days", prog_daycap: "$.data.per_diem_annual_day_cap", prog_status: "$.data.status", prog_version: "$.data.version", prog_cb_total: "$.data.total_posted_chargeback_cents" } }
          assert:
            - "prog_threshold == 110, prog_durcap == 1825, prog_daycap == 365"
            - "prog_status == ACTIVE and prog_cb_total == 0 and prog_version == 1"
            - "Response envelope has meta.api_request_id and response_type == object"

      - name: employee_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Employee.fields.employee_ref, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "employee_ref has no default; omitting it must fail with ERR_INVALID_REQUEST (400) while omitting family_size succeeds with the default 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mobility/employees", payload: { full_name: "No Ref", home_country_code: "US", annual_base_salary_cents: 5000000 }, as: MobilityAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E9", full_name: "Has Default", home_country_code: "US", annual_base_salary_cents: 5000000 }, as: MobilityAdmin, captures: { emp_family: "$.data.family_size" } }
          assert:
            - "First create: err == ERR_INVALID_REQUEST (400)"
            - "Second create succeeds with family_size == 1 (default applied)"

      - name: get_assignment_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but unknown UUID in the path yields ERR_NOT_FOUND (404) after auth/role checks pass."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mobility/assignments/11111111-2222-3333-4444-555555555555", as: MobilityAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: assignment_create_invalid_enum_and_date_range_rejected
        claim_type: type_constraints
        grounds: [entities.Assignment.fields.assignment_type, entities.Assignment.fields.start_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "assignment_type outside {SHORT_TERM, LONG_TERM} and planned_end_date earlier than start_date are both request-shape failures (400), checked before any business rule."
        test_recipe:
          setup: ["Program, employee, and policy exist"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
          trigger:
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "SIDEWAYS", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { err_enum: "$.data.error_id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2027-08-31", planned_end_date: "2026-09-01" }, as: MobilityAdmin, captures: { err_dates: "$.data.error_id" } }
          assert:
            - "err_enum == ERR_INVALID_REQUEST (400) — SIDEWAYS is not in the enum"
            - "err_dates == ERR_INVALID_REQUEST (400) — end before start"

      - name: policy_create_inverted_window_rejected
        claim_type: type_constraints
        grounds: [entities.AllowancePolicy.fields.effective_to, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "effective_to == effective_from is an empty half-open window and must be rejected (400); this is distinct from the overlap rule, which needs a second policy."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "Empty Window", host_country_code: "JP", effective_from: "2026-06-01", effective_to: "2026-06-01", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000 }, as: MobilityAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: shadow_record_create_returns_computed_fields_immediately
        claim_type: computed_fields
        grounds: [entities.ShadowPayrollRecord.fields.home_gross_cents, entities.ShadowPayrollRecord.fields.host_gross_cents, calculations.shadow_split_math]
        distinguishing_aspect: "Immediate consistency: the 201 create response already carries server-computed home_gross_cents 540000 / host_gross_cents 360000 / per_diem_cents 172500 / housing_cents 300000 / hypothetical_tax_cents 135000 / employer_host_tax_cents 240000 / employer_socsec_cents 0 — no re-fetch needed, and client-supplied values for computed fields are impossible (not in input schema)."
        test_recipe:
          setup: ["Fully activated assignment (exempt CoC), canonical fixtures"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2027-08-31" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id", r_home: "$.data.home_gross_cents", r_host: "$.data.host_gross_cents", r_pd: "$.data.per_diem_cents", r_house: "$.data.housing_cents", r_hypo: "$.data.hypothetical_tax_cents", r_etax: "$.data.employer_host_tax_cents", r_soc: "$.data.employer_socsec_cents", r_status: "$.data.status" } }
          assert:
            - "r_home == 540000 and r_host == 360000 (home rounded, host residual; 540000 + 360000 == 900000)"
            - "r_pd == 172500, r_house == 300000, r_hypo == 135000, r_etax == 240000, r_soc == 0 (coc_exempt)"
            - "r_status == DRAFT (initial state)"

      - name: initial_states_on_entity_creation
        claim_type: initial_state
        grounds: [state_machines.CompensationPackage, state_machines.VendorEngagement, state_machines.CertificateOfCoverage]
        distinguishing_aspect: "Every lifecycle entity starts in its declared initial_state: package DRAFT, engagement ENGAGED, certificate REQUESTED, extension request PENDING, and each carries version == 1."
        test_recipe:
          setup: ["DRAFT assignment exists"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id", asg_status: "$.data.status" } }
          trigger:
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_status: "$.data.status", pkg_v: "$.data.version" } }
            - { call: "POST /mobility/vendor-engagements", payload: { assignment_id: "${asg_id}", tax_year: 2026, scope: "HOME_ONLY", vendor_name: "TaxCo", fee_cents: 500000 }, as: VendorCoordinator, captures: { ven_status: "$.data.status", ven_rev: "$.data.revision_count" } }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_status: "$.data.status" } }
          assert:
            - "asg_status == DRAFT; pkg_status == DRAFT with version 1; ven_status == ENGAGED with revision_count 0; coc_status == REQUESTED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_bu_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Assignment.PENDING_BU_APPROVAL_to_PENDING_MOBILITY_APPROVAL, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve-bu is defined only from PENDING_BU_APPROVAL; invoking it on a DRAFT assignment fails with ERR_INVALID_STATE and leaves status and submitted_by_user_id untouched."
        test_recipe:
          setup: ["Assignment in DRAFT"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
          trigger:
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "Assignment.${asg_id}.status remains DRAFT"

      - name: terminal_states_reject_all_transitions
        claim_type: terminal_lockdown
        grounds: [state_machines.Assignment, state_machines.ExtensionRequest]
        distinguishing_aspect: "Terminal lockdown on two machines: a CANCELLED assignment rejects submit, and a DECLINED extension request rejects approve — both ERR_INVALID_STATE, proving terminal states absorb every trigger."
        test_recipe:
          setup: ["A1 cancelled while DRAFT; A2 ACTIVE (totalization false) with a DECLINED extension request"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "A One", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp1: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1002", full_name: "B Two", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp2: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp1}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg1: "$.data.id" } }
            - { call: "POST /mobility/assignments/${asg1}/cancel", as: MobilityAdmin }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp2}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg2: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg2}", letter_title: "L2", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg2: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg2}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg2}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg2}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl2: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl2}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg2}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg2}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg2}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "GET /mobility/assignments/${asg2}", as: MobilityAdmin, captures: { asg2_v: "$.data.version" } }
            - { call: "POST /mobility/extension-requests", payload: { assignment_id: "${asg2}", requested_new_end_date: "2027-10-31", expected_assignment_version: "${asg2_v}" }, as: MobilityAdmin, captures: { ext2: "$.data.id" } }
            - { call: "POST /mobility/extension-requests/${ext2}/decline", as: BusinessUnitApprover, as_user_id: "bu-1" }
          trigger:
            - { call: "POST /mobility/assignments/${asg1}/submit", as: MobilityAdmin, as_user_id: "adm-1", captures: { err1: "$.data.error_id" } }
            - { call: "POST /mobility/extension-requests/${ext2}/approve", as: BusinessUnitApprover, as_user_id: "bu-1", captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_STATE — CANCELLED assignment cannot re-enter the approval flow"
            - "err2 == ERR_INVALID_STATE — DECLINED extension request cannot be approved"

      - name: double_post_record_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.ShadowPayrollRecord.DRAFT_to_POSTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Posting the same record twice is a state error, not a duplicate success: the second post finds status POSTED (not DRAFT) and fails with ERR_INVALID_STATE; ytd aggregates move exactly once."
        test_recipe:
          setup: ["Activated assignment (totalization false); September record created"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 20, housing_receipts_cents: 310000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist }
          trigger:
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist, captures: { err: "$.data.error_id" } }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { ytd_gross: "$.data.ytd_gross_cents" } }
          assert:
            - "err == ERR_INVALID_STATE on the second post"
            - "ytd_gross == 900000 — counted exactly once"

      - name: package_revise_cycle_increments_revision_and_clears_approval
        claim_type: side_effect_execution
        grounds: [state_machines.CompensationPackage.APPROVED_to_DRAFT, entities.CompensationPackage.fields.revision_number]
        distinguishing_aspect: "Revise from APPROVED returns the package to DRAFT, increments revision_number to 1, and clears approved_by_user_id; revising is forbidden once the assignment has left DRAFT (ERR_INVALID_STATE), which pins the compensation side effect's guard."
        test_recipe:
          setup: ["Assignment DRAFT with an APPROVED package; a second ACTIVE assignment with an APPROVED package"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
