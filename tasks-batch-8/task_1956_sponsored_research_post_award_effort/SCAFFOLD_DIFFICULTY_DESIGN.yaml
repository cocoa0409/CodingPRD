  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cost_transfer_deny_revise_resubmit_cycle
        grounds:
          - state_machines.CostTransfer.DENIED_to_DRAFT
          - state_machines.CostTransfer.SUBMITTED_to_DENIED
          - state_machines.CostTransfer.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          CostTransfer is cyclic: SUBMITTED -> DENIED -> (revise) DRAFT -> (submit) SUBMITTED ->
          APPROVED; the entity loops through DRAFT twice and only the second submit/approve pair
          applies ledger effects (source TRANSFERRED_OUT, mirror POSTED).
        test_recipe:
          setup:
            - "Source award S: TRAVEL 200000 (F&A 100000, obligated 300000), ACTIVE; target award T (same sponsor): TRAVEL 100000 (F&A 50000, obligated 150000), ACTIVE"
            - "Posted TRAVEL expenditure e 100000 on S (timely: posted and submitted at the default clock)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "S-001", title: "Source", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_s: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "T-001", title: "Target", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_t: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_s}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { s_travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_t}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { t_travel: $.data.id } }
            - { call: "POST /api/awards/${aw_s}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_t}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_s}", budget_line_id: "${s_travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${aw_t}", target_budget_line_id: "${t_travel}", justification: "move travel charge to correct award" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { tr: $.data.id } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantCoordinator, as_user_id: "gc-1" }
          trigger:
            - { call: "POST /api/cost-transfers/${tr}/deny", payload: { deny_reason: "insufficient documentation provided" }, as: GrantsAccountant, as_user_id: "ga-1", captures: { st1: $.data.status } }
            - { call: "POST /api/cost-transfers/${tr}/revise", payload: { justification: "move travel charge to correct award per PO" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { st2: $.data.status } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantCoordinator, as_user_id: "gc-1", captures: { st3: $.data.status } }
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-1", captures: { st4: $.data.status } }
            - { call: "GET /api/expenditures/${e}", as: GrantsAccountant, captures: { src_status: $.data.status } }
            - { call: "GET /api/expenditures", payload: { transferred_from_id: "${e}" }, as: GrantsAccountant, captures: { mirror_amt: "$.data[0].amount_cents", mirror_status: "$.data[0].status" } }
          assert:
            - "st1 == DENIED"
            - "st2 == DRAFT  (cycle: revision loop reopens the same transfer)"
            - "st3 == SUBMITTED"
            - "st4 == APPROVED"
            - "src_status == TRANSFERRED_OUT"
            - "mirror_amt == 100000 and mirror_status == POSTED (ledger effects fired only after the final approve)"

      - name: effort_statement_reopen_recertify_cycle
        grounds:
          - state_machines.EffortStatement.CERTIFIED_to_REOPENED
          - state_machines.EffortStatement.REOPENED_to_RECERTIFIED
          - concurrency_rules[effort-certify-stale-statement]
        distinguishing_aspect: |
          EffortStatement is cyclic with an OCC twist: PENDING -> CERTIFIED -> REOPENED -> RECERTIFIED,
          and each mutation bumps version (1 -> 2 -> 3 -> 4), so the re-certification must carry the
          version minted by the reopen response, not the original certification's.
        test_recipe:
          setup:
            - "Award K: SAL 1000000 + FRINGE 300000 (directs 1300000, F&A 650000, obligated 1950000), ACTIVE, fringe 3000"
            - "PA (IBS 24000000/12) committed 50% key; salary posted: effort 25% 1mo on 2026-03-01 -> 416667 (fringe 125000)"
            - "Cycle 2026-H1 CERTIFYING; AWARD statement charged 3.47; NON_SPONSORED statement exists"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pa}", award_number: "K-001", title: "Reopen project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 1950000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 1000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 300000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 25.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${aw}" }, as: GrantsAccountant, captures: { st: "$.data[0].id", st_v1: "$.data[0].version", st_charged: "$.data[0].charged_effort_pct" } }
          trigger:
            - { call: "POST /api/effort-statements/${st}/certify", payload: { certified_effort_pct: 3.47, expected_effort_statement_version: "${st_v1}" }, as: PrincipalInvestigator, as_user_id: "${pa}", captures: { st_c1: $.data.status, v2: $.data.version } }
            - { call: "POST /api/effort-statements/${st}/reopen", payload: { reason: "late payroll adjustment posted" }, as: GrantsAccountant, captures: { st_ro: $.data.status, v3: $.data.version } }
            - { call: "POST /api/effort-statements/${st}/certify", payload: { certified_effort_pct: 3.47, expected_effort_statement_version: "${v3}" }, as: PrincipalInvestigator, as_user_id: "${pa}", captures: { st_c2: $.data.status, v4: $.data.version } }
          assert:
            - "st_charged == 3.47  (416667 / 12000000 = 3.4722% -> 2dp)"
            - "st_c1 == CERTIFIED and v2 == 2"
            - "st_ro == REOPENED and v3 == 3"
            - "st_c2 == RECERTIFIED and v4 == 4 — the cycle completes and the OCC token moved 1->2->3->4"

      - name: subaward_invoice_return_resubmit_cycle
        grounds:
          - state_machines.SubawardInvoice.RETURNED_FOR_REVISION_to_UNDER_REVIEW
          - calculations.subaward_mtdc_cap_portion
        distinguishing_aspect: |
          SubawardInvoice loops UNDER_REVIEW -> RETURNED_FOR_REVISION -> UNDER_REVIEW with revised
          amounts, and the chronological MTDC cap recomputation follows the revised figures
          (cumulative 3000000 -> 2900000 after revision; mtdc portion stays pinned at the 2500000 cap).
        test_recipe:
          setup:
            - "Prime award P: SUBAWARDS 4000000 (mtdc_eligible 2500000) + OTHER_DIRECT 1000000 (directs 5000000, MTDC 3500000, F&A 1750000, obligated 6750000), ACTIVE"
            - "Subaward SB: total 4000000, LOW risk, 2026-01-01..2026-12-31, ACTIVE"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "P-001", title: "Prime", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 6750000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 4000000, mtdc_eligible_cents: 2500000 }, as: GrantCoordinator, captures: { sub_line: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 1000000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subawards", payload: { award_id: "${aw}", subrecipient_name: "Sub U", total_subaward_cents: 4000000, risk_rating: "LOW", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { sb: $.data.id } }
            - { call: "POST /api/subawards/${sb}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subaward-invoices", payload: { subaward_id: "${sb}", invoice_number: "INV-1", period_start: "2026-02-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", current_period_direct_cents: 3000000, current_period_f_and_a_cents: 150000 }, as: GrantCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /api/subaward-invoices/${inv}/begin-review", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/subaward-invoices/${inv}/return-for-revision", payload: { return_reason: "backup documentation incomplete" }, as: SponsoredProgramsOfficer, captures: { st1: $.data.status } }
            - { call: "POST /api/subaward-invoices/${inv}/resubmit", payload: { current_period_direct_cents: 2900000, current_period_f_and_a_cents: 145000 }, as: GrantCoordinator, captures: { st2: $.data.status, cum: $.data.cumulative_direct_cents, mtdc: $.data.mtdc_portion_cents } }
            - { call: "POST /api/subaward-invoices/${inv}/approve", payload: {}, as: SponsoredProgramsOfficer, captures: { st3: $.data.status, prime_e: $.data.prime_expenditure_id } }
            - { call: "GET /api/budget-lines/${sub_line}", as: GrantsAccountant, captures: { line_spent: $.data.spent_cents } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { mtdc_spent: $.data.mtdc_spent_cents, fa_accrued: $.data.f_and_a_accrued_cents } }
          assert:
            - "st1 == RETURNED_FOR_REVISION"
            - "st2 == UNDER_REVIEW and cum == 2900000 and mtdc == 2500000 (cap still binds after revision)"
            - "st3 == PAID"
            - "line_spent == 3045000  (2900000 + 145000 mirror posted to the prime SUBAWARDS line)"
            - "mtdc_spent == 2500000 and fa_accrued == 1250000 (round(0.5 * 2500000))"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: expenditure_post_depth4_ledger_cascade
        grounds:
          - state_machines.Expenditure.PENDING_REVIEW_to_POSTED
          - calculations.mtdc_base_aggregation
          - calculations.f_and_a_accrual
          - calculations.drawdown_eligible_pool
          - calculations.effort_charged_percentage
        distinguishing_aspect: |
          User-triggered depth-4 chain: posting one salary expenditure mutates (1) two BudgetLines
          (SAL +416667, FRINGE +125000), whose mutation recomputes (2) award MTDC/F&A aggregates,
          which recompute (3) the LOC available draw pool (625001), and (4) the open EffortStatement's
          charged_effort_pct (3.47) with its version bumped — each hop caused by the previous one.
        test_recipe:
          setup:
            - "Award K2: SAL 1000000 + FRINGE 300000 (directs 1300000, F&A 650000, obligated 1950000), ACTIVE, LOC, fringe 3000"
            - "PA committed 50% key; cycle 2026-H1 OPEN (statement exists with charged 0.0, version 1) BEFORE the posting"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pa}", award_number: "K2-001", title: "Cascade project", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 1950000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 1000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 300000 }, as: GrantCoordinator, captures: { fr: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 25.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/budget-lines/${sal}", as: GrantsAccountant, captures: { sal_spent: $.data.spent_cents } }
            - { call: "GET /api/budget-lines/${fr}", as: GrantsAccountant, captures: { fr_spent: $.data.spent_cents } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { mtdc: $.data.mtdc_spent_cents, fa: $.data.f_and_a_accrued_cents, pool: $.data.available_draw_pool_cents } }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${aw}" }, as: GrantsAccountant, captures: { st_charged: "$.data[0].charged_effort_pct", st_v: "$.data[0].version" } }
          assert:
            - "sal_spent == 416667  (link 1: round(1666667 * 0.25 * 1) = round(416666.75))"
            - "fr_spent == 125000   (link 1: round(416667 * 0.30) = round(125000.1))"
            - "mtdc == 416667 and fa == 208334  (link 2: round(0.5 * 416667) = round(208333.5))"
            - "pool == 625001  (link 3: 416667 + 208334)"
            - "st_charged == 3.47 and st_v == 2  (link 4: statement recomputed and version bumped by the cascade)"

      - name: clock_overdue_posture_frozen_drawdown_cascade
        grounds:
          - state_machines.ReportRequirement.PENDING_to_OVERDUE
          - calculations.award_posture_derivation
          - state_machines.DrawdownRequest.DRAFT_to_CANCELLED
          - state_machines.DrawdownRequest.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          System-clock-triggered depth-3 chain (different trigger from the posting cascade): clock
          advance mutates (1) ReportRequirement PENDING -> OVERDUE, whose days_overdue mutation drives
          (2) award posture OPEN -> RESTRICTED -> FROZEN, whose entry into FROZEN (3) auto-cancels the
          DRAFT and SUBMITTED DrawdownRequests and releases the 100000 reservation (pool back to 150000).
        test_recipe:
          setup:
            - "Award D: TRAVEL 100000 (F&A 50000, obligated 150000), ACTIVE, LOC; TRAVEL 100000 posted cash -> pool 150000"
            - "FINAL_TECHNICAL report due 2026-08-10; draw d1 DRAFT 50000; draw d2 SUBMITTED 100000 (reserved 100000, available 50000)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "D-001", title: "Cascade clock", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/report-requirements", payload: { award_id: "${aw}", report_type: "FINAL_TECHNICAL", due_date: "2026-08-10T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { rpt: $.data.id } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v4: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 50000, expected_award_version: "${v4}" }, as: GrantsAccountant, captures: { d1: $.data.id } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v5: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 100000, expected_award_version: "${v5}" }, as: GrantsAccountant, captures: { d2: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d2}/submit", payload: {}, as: GrantsAccountant }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/report-requirements/${rpt}", as: GrantsAccountant, captures: { rpt_s1: $.data.status, rpt_d1: $.data.days_overdue } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { post1: $.data.posture, d1s_a: $.data.reserved_draw_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/report-requirements/${rpt}", as: GrantsAccountant, captures: { rpt_d2: $.data.days_overdue } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { post2: $.data.posture, avail2: $.data.available_draw_pool_cents, res2: $.data.reserved_draw_cents } }
            - { call: "GET /api/drawdown-requests/${d1}", as: GrantsAccountant, captures: { d1_s: $.data.status } }
            - { call: "GET /api/drawdown-requests/${d2}", as: GrantsAccountant, captures: { d2_s: $.data.status } }
          assert:
            - "rpt_s1 == OVERDUE and rpt_d1 == 1 and post1 == RESTRICTED  (link 1-2: overdue drives posture)"
            - "d1s_a == 100000  (RESTRICTED does not cancel draws)"
            - "rpt_d2 == 31 and post2 == FROZEN  (FINAL_TECHNICAL overdue > 30 days)"
            - "d1_s == CANCELLED and d2_s == CANCELLED  (link 3: FROZEN auto-cancels DRAFT and SUBMITTED draws)"
            - "res2 == 0 and avail2 == 150000  (reservation released; pool restored)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_expenditure_post
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_AWARD_NOT_ACTIVE]
          - errors[ERR_BUDGET_LINE_EXCEEDED]
        distinguishing_aspect: |
          Pair (state, business_fiscal): posting expenditure e2 while the award is SUSPENDED *and* the
          TRAVEL line lacks headroom (60000 spent + 50000 new > 100000) must return
          ERR_AWARD_NOT_ACTIVE (priority 6 state), never ERR_BUDGET_LINE_EXCEEDED (priority 12 fiscal).
        test_recipe:
          setup:
            - "Award S2: TRAVEL 100000 (F&A 50000, obligated 150000), ACTIVE; e1 TRAVEL 60000 posted; e2 TRAVEL 50000 PENDING_REVIEW"
            - "Award suspended by the sponsor before e2's review"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "S2-001", title: "Prio1", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 60000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 50000, transaction_date: "2026-03-02T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/awards/${aw}/suspend", payload: { reason: "sponsor audit hold" }, as: SponsorOfficial }
          trigger:
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AWARD_NOT_ACTIVE  (state priority 6 beats fiscal priority 12, although the line would also overflow)"
            - "Expenditure.${e2}.status == PENDING_REVIEW (no side effects fired)"

      - name: temporal_beats_constraint_on_invoice_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVOICE_PERIOD_OUT_OF_RANGE]
          - errors[ERR_INVOICE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Pair (business_temporal, business_constraint): invoice inv2 [2026-12-15, 2027-02-15] both
          overruns the subaward end date (2026-12-31) and overlaps inv1 [2026-11-01, 2026-12-31];
          the temporal range error ERR_INVOICE_PERIOD_OUT_OF_RANGE (priority 9) must win over the
          closed-interval overlap ERR_INVOICE_PERIOD_OVERLAP (priority 10).
        test_recipe:
          setup:
            - "Prime award P2: SUBAWARDS 9000000 (eligible 2500000) + OTHER_DIRECT 500000 (directs 9500000, MTDC 3000000, F&A 1500000, obligated 11000000), ACTIVE"
            - "Subaward SB: 2026-01-01..2026-12-31, total 9000000, LOW, ACTIVE; inv1 [2026-11-01, 2026-12-31] direct 1000000 + fa 50000 RECEIVED"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "P2-001", title: "Prio2", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 11000000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 9000000, mtdc_eligible_cents: 2500000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 500000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subawards", payload: { award_id: "${aw}", subrecipient_name: "Sub U", total_subaward_cents: 9000000, risk_rating: "LOW", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { sb: $.data.id } }
            - { call: "POST /api/subawards/${sb}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subaward-invoices", payload: { subaward_id: "${sb}", invoice_number: "INV-1", period_start: "2026-11-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", current_period_direct_cents: 1000000, current_period_f_and_a_cents: 50000 }, as: GrantCoordinator }
          trigger:
            - { call: "POST /api/subaward-invoices", payload: { subaward_id: "${sb}", invoice_number: "INV-2", period_start: "2026-12-15T00:00:00Z", period_end: "2027-02-15T00:00:00Z", current_period_direct_cents: 500000, current_period_f_and_a_cents: 25000 }, as: GrantCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVOICE_PERIOD_OUT_OF_RANGE  (temporal priority 9 beats overlap priority 10, though both hold)"

      - name: segregation_of_duties_beats_fiscal_on_transfer_approve
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_BUDGET_LINE_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): an accountant approving their OWN submitted transfer
          into a target line with insufficient headroom (40000 remaining < 100000) must get
          ERR_SEGREGATION_OF_DUTIES (priority 8 compliance); only when a *different* accountant retries
          does the fiscal ERR_BUDGET_LINE_EXCEEDED (priority 12) surface.
        test_recipe:
          setup:
            - "Source award S3: TRAVEL 200000 (obligated 300000), ACTIVE, posted expenditure e 100000"
            - "Target award T3: TRAVEL 100000 (obligated 150000), ACTIVE, already 60000 spent (remaining 40000 < 100000)"
            - "Transfer created AND submitted by GrantsAccountant user ga-1"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "S3-001", title: "SoD source", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_s: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "T3-001", title: "SoD target", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_t: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_s}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { s_travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_t}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { t_travel: $.data.id } }
            - { call: "POST /api/awards/${aw_s}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_t}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_s}", budget_line_id: "${s_travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant, as_user_id: "ga-1" }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_t}", budget_line_id: "${t_travel}", expenditure_type: "TRAVEL", amount_cents: 60000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant, as_user_id: "ga-1" }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${aw_t}", target_budget_line_id: "${t_travel}", justification: "reallocate travel to the correct award" }, as: GrantsAccountant, as_user_id: "ga-1", captures: { tr: $.data.id } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantsAccountant, as_user_id: "ga-1" }
          trigger:
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-2", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SEGREGATION_OF_DUTIES  (compliance priority 8 beats fiscal priority 12 for the self-approval)"
            - "err2 == ERR_BUDGET_LINE_EXCEEDED  (a different approver clears SoD; the fiscal failure then surfaces)"
            - "CostTransfer.${tr}.status == SUBMITTED  (neither failed attempt mutated state)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rebudget_exactly_25pct_not_significant_vs_one_cent_over
        grounds:
          - calculations.rebudget_significance_test
          - entities.ModificationRequest.fields.requires_sponsor
        distinguishing_aspect: |
          Metric = cumulative rebudget ratio on the SAL baseline (4000000): exactly +25%
          (new 5000000, abs*100 == 25*baseline) is NOT significant and approves under grantee
          authority, while one cent more (5000001: 1000001*100 > 100000000) flips requires_sponsor
          and routes the second award's request to SPONSOR_REVIEW.
        test_recipe:
          setup:
            - "Two identical awards R and R2: SAL 4000000, FRINGE 2400000, TRAVEL 600000, MATERIALS_SUPPLIES 600000, OTHER_DIRECT 400000, EQUIPMENT 500000, SUBAWARDS 1000000 (eligible 250000) — directs 9500000, MTDC 8250000, F&A 4125000, obligated 13625000, ACTIVE (baselines snapshotted)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "R-001", title: "Rebudget exact", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 13625000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 4000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 2400000 }, as: GrantCoordinator, captures: { fr: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 600000 }, as: GrantCoordinator, captures: { tr: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "MATERIALS_SUPPLIES", authorized_cents: 600000 }, as: GrantCoordinator, captures: { mat: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 400000 }, as: GrantCoordinator, captures: { oth: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "EQUIPMENT", authorized_cents: 500000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 1000000, mtdc_eligible_cents: 250000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { aw_v: $.data.version } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "R-002", title: "Rebudget over", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 13625000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "PERSONNEL_SALARIES", authorized_cents: 4000000 }, as: GrantCoordinator, captures: { sal2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "FRINGE_BENEFITS", authorized_cents: 2400000 }, as: GrantCoordinator, captures: { fr2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "TRAVEL", authorized_cents: 600000 }, as: GrantCoordinator, captures: { tr2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "MATERIALS_SUPPLIES", authorized_cents: 600000 }, as: GrantCoordinator, captures: { mat2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "OTHER_DIRECT", authorized_cents: 400000 }, as: GrantCoordinator, captures: { oth2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "EQUIPMENT", authorized_cents: 500000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw2}", category: "SUBAWARDS", authorized_cents: 1000000, mtdc_eligible_cents: 250000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw2}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { aw2_v: $.data.version } }
          trigger:
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "REBUDGET", justification: "exactly-25-percent salary realignment", rebudget_lines: [ { budget_line_id: "${sal}", new_authorized_cents: 5000000 }, { budget_line_id: "${fr}", new_authorized_cents: 1800000 }, { budget_line_id: "${tr}", new_authorized_cents: 450000 }, { budget_line_id: "${mat}", new_authorized_cents: 450000 }, { budget_line_id: "${oth}", new_authorized_cents: 300000 } ], expected_award_version: "${aw_v}" }, as: GrantCoordinator, captures: { m1: $.data.id, m1_rs: $.data.requires_sponsor } }
            - { call: "POST /api/modification-requests/${m1}/submit", payload: {}, as: GrantCoordinator }
            - { call: "POST /api/modification-requests/${m1}/internal-approve", payload: {}, as: SponsoredProgramsOfficer, captures: { m1_st: $.data.status } }
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw2}", mod_type: "REBUDGET", justification: "one-cent-over salary realignment plan", rebudget_lines: [ { budget_line_id: "${sal2}", new_authorized_cents: 5000001 }, { budget_line_id: "${fr2}", new_authorized_cents: 1800000 }, { budget_line_id: "${tr2}", new_authorized_cents: 450000 }, { budget_line_id: "${mat2}", new_authorized_cents: 450000 }, { budget_line_id: "${oth2}", new_authorized_cents: 299999 } ], expected_award_version: "${aw2_v}" }, as: GrantCoordinator, captures: { m2: $.data.id, m2_rs: $.data.requires_sponsor } }
            - { call: "POST /api/modification-requests/${m2}/submit", payload: {}, as: GrantCoordinator }
            - { call: "POST /api/modification-requests/${m2}/internal-approve", payload: {}, as: SponsoredProgramsOfficer, captures: { m2_st: $.data.status } }
            - { call: "POST /api/modification-requests/${m2}/sponsor-decision", payload: { decision: "APPROVE" }, as: SponsorOfficial, captures: { m2_fin: $.data.status } }
            - { call: "GET /api/budget-lines/${sal}", as: GrantsAccountant, captures: { sal_auth: $.data.authorized_cents, sal_base: $.data.baseline_authorized_cents } }
            - { call: "GET /api/budget-lines/${sal2}", as: GrantsAccountant, captures: { sal2_base: $.data.baseline_authorized_cents } }
          assert:
            - "m1_rs == false and m1_st == APPROVED  (exactly 25% on every touched line: grantee authority)"
            - "sal_auth == 5000000 and sal_base == 4000000  (grantee-approved rebudget does NOT refresh the sponsor baseline)"
            - "m2_rs == true and m2_st == SPONSOR_REVIEW  (one cent over 25% flips routing)"
            - "m2_fin == APPROVED and sal2_base == 5000001  (sponsor approval refreshes baselines)"

      - name: interest_grace_day60_vs_day61
        grounds:
          - calculations.late_interest_accrual
          - calculations.receivable_aging_buckets
          - entities.Receivable.fields.accrued_interest_cents
        distinguishing_aspect: |
          Metric = days outstanding on a receivable: at exactly 60 days the grace period still holds
          (interest 0, bucket D31_60); at day 61 exactly one day of interest accrues
          (round(425000 * 0.10/365 * 1) = 116) and the bucket flips to D61_90 — both boundaries pinned.
        test_recipe:
          setup:
            - "INVOICE sponsor (late_payment_apr_bps 1000); award I2: TRAVEL 100000 + MATERIALS 50000 + EQUIPMENT 200000 (obligated 425000), ACTIVE"
            - "Three posted expenditures (100000 / 50000 / 200000, txn 2026-03-01); receivable created at the default clock 2026-08-01 -> amount 425000, invoice_date 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NIH-INV", sponsor_type: "FEDERAL", payment_method: "COST_REIMBURSABLE_INVOICE", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 1000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "I2-001", title: "Aging", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 425000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "MATERIALS_SUPPLIES", authorized_cents: 50000 }, as: GrantCoordinator, captures: { mat: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "EQUIPMENT", authorized_cents: 200000 }, as: GrantCoordinator, captures: { equip: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${mat}", expenditure_type: "SUPPLIES", amount_cents: 50000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${equip}", expenditure_type: "EQUIPMENT", amount_cents: 200000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true }, as: GrantCoordinator, captures: { e3: $.data.id } }
            - { call: "POST /api/expenditures/${e3}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/receivables", payload: { award_id: "${aw}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }, as: GrantsAccountant, captures: { r: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/receivables/${r}", as: GrantsAccountant, captures: { d60: $.data.days_outstanding, b60: $.data.aging_bucket, i60: $.data.accrued_interest_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/receivables/${r}", as: GrantsAccountant, captures: { d61: $.data.days_outstanding, b61: $.data.aging_bucket, i61: $.data.accrued_interest_cents } }
          assert:
            - "d60 == 60 and b60 == D31_60 and i60 == 0  (grace boundary is inclusive: day 60 accrues nothing)"
            - "d61 == 61 and b61 == D61_90 and i61 == 116  (one day past grace: round(425000 * 0.10 / 365 * 1) = round(116.438))"

      - name: activation_allocation_exact_cent
        grounds:
          - calculations.budget_load_ceiling_check
          - errors[ERR_BUDGET_NOT_FULLY_ALLOCATED]
        distinguishing_aspect: |
          Metric = allocated cents at activation: obligated 149999 vs computed total 150000 fails by
          exactly one cent (ERR_BUDGET_NOT_FULLY_ALLOCATED), while the identical award at 150000
          activates — a strict-equality boundary, not a >= threshold.
        test_recipe:
          setup:
            - "Awards A1 (obligated 149999) and A2 (obligated 150000), each with a single TRAVEL 100000 line (F&A 5000bps -> 50000)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "A1-001", title: "Short by a cent", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 149999, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { a1: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "A2-001", title: "Exact", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { a2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${a1}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${a2}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
          trigger:
            - { call: "POST /api/awards/${a1}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /api/awards/${a2}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { st2: $.data.status } }
          assert:
            - "err1 == ERR_BUDGET_NOT_FULLY_ALLOCATED  (150000 != 149999: one cent short fails)"
            - "st2 == ACTIVE  (exact match activates)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: drawdown_submit_gated_by_award_posture
        grounds:
          - state_machines.DrawdownRequest.DRAFT_to_SUBMITTED
          - calculations.award_posture_derivation
          - errors[ERR_AWARD_RESTRICTED]
        distinguishing_aspect: |
          Pair (DrawdownRequest, GrantAward.posture): the SAME drawdown submit succeeds while the
          award posture is OPEN, then an unrelated MILESTONE report lapses (OVERDUE -> RESTRICTED) and
          the next submit — against an unchanged pool — is rejected with ERR_AWARD_RESTRICTED.
        test_recipe:
          setup:
            - "Award DG: TRAVEL 100000 (obligated 150000), ACTIVE, LOC; TRAVEL 100000 posted cash -> pool 150000"
            - "MILESTONE report due 2026-08-05; default clock 2026-08-01 still OPEN"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "DG-001", title: "Posture gate", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/report-requirements", payload: { award_id: "${aw}", report_type: "MILESTONE", due_date: "2026-08-05T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { rpt: $.data.id } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v1: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 50000, expected_award_version: "${v1}" }, as: GrantsAccountant, captures: { d1: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d1}/submit", payload: {}, as: GrantsAccountant, captures: { d1_st: $.data.status } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { post: $.data.posture, v2: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 50000, expected_award_version: "${v2}" }, as: GrantsAccountant, captures: { d2: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d2}/submit", payload: {}, as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "d1_st == SUBMITTED  (posture OPEN: submit succeeded with an identical pool)"
            - "post == RESTRICTED  (MILESTONE overdue by 1 day)"
            - "err == ERR_AWARD_RESTRICTED  (DrawdownRequest submit gated by the Award's derived posture)"
            - "DrawdownRequest.${d2}.status == DRAFT"

      - name: invoice_approve_requires_subaward_active
        grounds:
          - state_machines.SubawardInvoice.UNDER_REVIEW_to_PAID
          - state_machines.Subaward.DRAFT_to_ACTIVE
          - errors[ERR_SUBAWARD_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (SubawardInvoice, Subaward.status): an invoice can be received and reviewed while the
          subaward is still DRAFT, but approval is rejected with ERR_SUBAWARD_NOT_ACTIVE until the
          subaward is activated — and succeeds immediately after, with no change to the invoice.
        test_recipe:
          setup:
            - "Prime award PB: SUBAWARDS 500000 (eligible 250000) + OTHER_DIRECT 500000 (directs 1000000, MTDC 750000, F&A 375000, obligated 1375000), ACTIVE"
            - "Subaward SBD total 500000 LOW 2026-01-01..2026-12-31 left in DRAFT; invoice INV-1 [2026-02-01, 2026-03-31] direct 100000 + fa 5000 UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "PB-001", title: "Invoice gate", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 1375000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 500000, mtdc_eligible_cents: 250000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 500000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subawards", payload: { award_id: "${aw}", subrecipient_name: "Sub V", total_subaward_cents: 500000, risk_rating: "LOW", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { sb: $.data.id } }
            - { call: "POST /api/subaward-invoices", payload: { subaward_id: "${sb}", invoice_number: "INV-1", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", current_period_direct_cents: 100000, current_period_f_and_a_cents: 5000 }, as: GrantCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /api/subaward-invoices/${inv}/begin-review", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/subaward-invoices/${inv}/approve", payload: {}, as: SponsoredProgramsOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /api/subawards/${sb}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/subaward-invoices/${inv}/approve", payload: {}, as: SponsoredProgramsOfficer, captures: { st: $.data.status } }
          assert:
            - "err == ERR_SUBAWARD_NOT_ACTIVE  (invoice approve depends on the parent Subaward's state)"
            - "st == PAID  (same invoice approves once the subaward activates)"

      - name: transfer_approve_gated_by_target_award_frozen
        grounds:
          - state_machines.CostTransfer.SUBMITTED_to_APPROVED
          - calculations.award_posture_derivation
          - errors[ERR_AWARD_FROZEN]
        distinguishing_aspect: |
          Pair (CostTransfer, GrantAward[arget].posture): a fully-valid timely transfer with a clean
          SoD approver is still rejected with ERR_AWARD_FROZEN because the TARGET award independently
          froze (its own FINAL_TECHNICAL report lapsed 31+ days) between submit and approve.
        test_recipe:
          setup:
            - "Source A1: TRAVEL 200000 (obligated 300000), ACTIVE, posted e 100000 (2026-03-01); transfer created+submitted by gc-1 at the default clock (timely)"
            - "Target A2: TRAVEL 200000 (obligated 300000), ACTIVE, FINAL_TECHNICAL due 2026-08-10; clock then advances to 2026-09-10 -> A2 FROZEN"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "A1-777", title: "Transfer source", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { a1: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "A2-777", title: "Transfer target", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { a2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${a1}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${a2}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l2: $.data.id } }
            - { call: "POST /api/awards/${a1}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${a2}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${a1}", budget_line_id: "${l1}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/report-requirements", payload: { award_id: "${a2}", report_type: "FINAL_TECHNICAL", due_date: "2026-08-10T00:00:00Z" }, as: SponsoredProgramsOfficer }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${a2}", target_budget_line_id: "${l2}", justification: "reallocate travel to the correct award" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { tr: $.data.id } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantCoordinator, as_user_id: "gc-1" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/awards/${a2}", as: GrantsAccountant, captures: { post: $.data.posture } }
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-9", captures: { err: $.data.error_id } }
          assert:
            - "post == FROZEN  (FINAL_TECHNICAL 31 days overdue on the target)"
            - "err == ERR_AWARD_FROZEN  (approval blocked by the TARGET award's posture, not the transfer's own state)"
            - "CostTransfer.${tr}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: effort_cycle_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.EffortCycle.fields.period_start
          - errors[ERR_CYCLE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Semantics = HALF-OPEN [start, end) on resource EffortCycle: a cycle beginning exactly at
          another's end (2026-07-01) is legal adjacency, while one beginning a day earlier
          (2026-06-30) overlaps and is rejected — boundary instant is exclusive.
        test_recipe:
          setup: ["Empty DB; cycles are global (institution-wide) resources"]
          setup_api_calls:
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H2", period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { c2: $.data.id } }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-X", period_start: "2026-06-30T00:00:00Z", period_end: "2026-12-31T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "c2 is created  (half-open: [2026-01-01, 2026-07-01) and [2026-07-01, 2027-01-01) share only the boundary instant)"
            - "err == ERR_CYCLE_PERIOD_OVERLAP  (2026-06-30 < 2026-07-01 intrudes one day into 2026-H1)"

      - name: subaward_invoice_closed_interval_shared_day
        grounds:
          - validations[priority=10]
          - entities.SubawardInvoice.fields.period_end
          - errors[ERR_INVOICE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Semantics = CLOSED [start, end] on resource SubawardInvoice: back-to-back periods
          (03-31 then 04-01) are legal, but a third invoice sharing ONE boundary day with each
          ([2026-03-31, 2026-04-01]) is rejected — the boundary day itself is occupied, unlike the
          half-open cycle rule.
        test_recipe:
          setup:
            - "Prime award PW: SUBAWARDS 9000000 (eligible 2500000) + OTHER_DIRECT 500000 (directs 9500000, MTDC 3000000, F&A 1500000, obligated 11000000), ACTIVE; subaward ACTIVE total 9000000, 2026-01-01..2026-12-31"
            - "inv1 [2026-01-01, 2026-03-31] and inv2 [2026-04-01, 2026-06-30] recorded (1000 + 0 each)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "PW-001", title: "Overlap", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 11000000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 9000000, mtdc_eligible_cents: 2500000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 500000 }, as: GrantCoordinator }
