# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances; grounds resolve into SCAFFOLD.yaml §1.1-§1.7
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_diverge
        grounds:
          - calculations.farm_premium_payment
          - entities.PremiumPayment.fields.calc_variant
          - entities.PremiumPayment.fields.gross_amount_cents
        distinguishing_aspect: |
          Dual-variant logic on the PremiumPayment domain: identical enrollment
          (blended 75, tier 8%) yields 36900 cents under the PROVISIONAL variant
          (declared volume 10000, no deductions) but 24750 cents under the FINAL
          variant (metered volume 9000, one non-conformance deduction) — the two
          variants of the same payment produce different money.
        test_recipe:
          setup:
            - "FarmProgramEnrollment ASSESSED with blended_score 75 (env 80, welfare 70), baseline_volume_liters 8000"
            - "PremiumPayment Q1 created with declared_volume_liters 10000, commodity_price_cents_per_liter 45"
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Elm Farm", region: "VT", herd_size: 120, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 10000, commodity_price_cents_per_liter: 45 }
              as: DairyProgramManager
              captures: { pay_id: $.data.id, prov_gross: $.data.gross_amount_cents, prov_pct: $.data.premium_pct }
          trigger:
            - call: "POST /creamery/premium-payments/${pay_id}/finalize"
              payload: { metered_volume_liters: 9000, non_conformance_count: 1 }
              as: DairyProgramManager
              captures: { fin_gross: $.data.gross_amount_cents, fin_pct: $.data.premium_pct }
          assert:
            - "prov_gross == 36900 (8000*45*0.08 + 2000*45*0.09)"
            - "prov_pct == 8"
            - "fin_gross == 24750 (8000*45*0.06 + 1000*45*0.07)"
            - "fin_pct == 6 (tier 8 minus 2-point non-conformance deduction)"
            - "PremiumPayment.${pay_id}.calc_variant == FINAL"
            - "fin_gross != prov_gross for the same enrollment inputs"

      - name: claim_coverage_declared_vs_verified_diverge
        grounds:
          - calculations.claim_coverage
          - entities.Flavor.fields.claim_coverage_declared_pct
          - entities.Flavor.fields.claim_coverage_verified_pct
        distinguishing_aspect: |
          Dual-variant logic on the Flavor claim domain (different entity domain
          from premium_provisional_vs_final_diverge): the same two cited
          certifications yield declared coverage 95.0 but verified coverage 85.0,
          because the DECLARED variant averages declared_coverage_pct over all
          cited certs while the VERIFIED variant averages verified_coverage_pct.
        test_recipe:
          setup:
            - "Supplier APPROVED via a PASS audit (composite 71)"
            - "Two VERIFIED FAIR_TRADE certifications: DAIRY scope declared 100 / verified 90; COCOA scope declared 90 / verified 80 (non-overlapping scopes so no window conflict)"
            - "Flavor DAIRY promoted to TEST_BATCH"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Green Dairy Co", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-D1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 100 }
              as: SourcingManager
              captures: { c1_id: $.data.id }
            - call: "POST /creamery/certifications/${c1_id}/verify"
              payload: { verified_coverage_pct: 90 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-C1", ingredient_scope: "COCOA", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { c2_id: $.data.id }
            - call: "POST /creamery/certifications/${c2_id}/verify"
              payload: { verified_coverage_pct: 80 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Fudge Duet", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 199 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
          trigger:
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c1_id}", "${c2_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
          assert:
            - "Flavor.${f_id}.claim_coverage_declared_pct == 95.0 (mean of 100 and 90)"
            - "Flavor.${f_id}.claim_coverage_verified_pct == 85.0 (mean of 90 and 80)"
            - "Flavor.${f_id}.claim_status == SUBSTANTIATED"
            - "declared and verified bases diverge by exactly 10 points for identical cited certifications"

  - rule_id: combinatorial_formula
    instances:
      - name: premium_tier_boundary_with_deduction
        grounds:
          - calculations.farm_premium_payment
          - entities.FarmProgramEnrollment.fields.blended_score
        distinguishing_aspect: |
          Mode (a) combinatorial: four interacting inputs (blended-score tier
          selection, baseline/excess volume split, non-conformance deduction,
          commodity price) with the tier boundary inclusive at the lower bound —
          blended exactly 60 earns tier 5%, and the FINAL deduction of 2 points
          pulls the effective rate to 3%, yielding exactly 9600 cents.
        test_recipe:
          setup:
            - "Enrollment ASSESSED with env 70 / welfare 50 -> blended_score exactly 60"
            - "Payment declared 8000 (= baseline, zero excess), price 40"
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Boundary Farm", region: "NY", herd_size: 90, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 70, welfare_practice_score: 50 }
              as: DairyProgramManager
              captures: { blended: $.data.blended_score }
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q2", declared_volume_liters: 8000, commodity_price_cents_per_liter: 40 }
              as: DairyProgramManager
              captures: { pay_id: $.data.id, prov_gross: $.data.gross_amount_cents, prov_pct: $.data.premium_pct }
          trigger:
            - call: "POST /creamery/premium-payments/${pay_id}/finalize"
              payload: { metered_volume_liters: 8000, non_conformance_count: 1 }
              as: DairyProgramManager
              captures: { fin_gross: $.data.gross_amount_cents, fin_pct: $.data.premium_pct }
          assert:
            - "blended == 60"
            - "prov_pct == 5 (tier boundary 60 is inclusive)"
            - "prov_gross == 16000 (8000*40*0.05)"
            - "fin_pct == 3 (5 - 2*1 deduction)"
            - "fin_gross == 9600 (8000*40*0.03)"

      - name: order_total_round_per_line_then_sum
        grounds:
          - calculations.supply_order_total
          - entities.ShopSupplyOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from premium_tier_boundary_with_deduction):
          nested rounding where order matters — the scaffold pins round-per-line-
          then-sum, so a partner-shop order of 3x199-cent and 1x299-cent pints at
          15% discount totals 761 cents (507 + 254); the sum-then-round
          interpretation would yield 762 (round(896*0.85)) — one cent apart.
        test_recipe:
          setup:
            - "ScoopShop NONPROFIT_PARTNER, nonprofit_verified true, OPERATING, credit_limit_cents 10000000"
            - "Flavor A pint_price_cents 199 and Flavor B pint_price_cents 299, both LIMITED_RUN"
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Partner Shop One", operator_type: "NONPROFIT_PARTNER", nonprofit_verified: true, city: "Burlington", country_code: "US", credit_limit_cents: 10000000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Fudge A", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 199 }
              as: FlavorManager
              captures: { fa_id: $.data.id }
            - call: "POST /creamery/flavors/${fa_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${fa_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors"
              payload: { name: "Fudge B", base_type: "NON_DAIRY", chunk_load_pct: 0, swirl_load_pct: 0, pint_price_cents: 299 }
              as: FlavorManager
              captures: { fb_id: $.data.id }
            - call: "POST /creamery/flavors/${fb_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${fb_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${fa_id}", quantity_pints: 3 }, { flavor_id: "${fb_id}", quantity_pints: 1 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { o_id: $.data.id, o_total: $.data.total_cents }
          assert:
            - "ShopSupplyOrder.${o_id}.total_cents == 761 (round(597*0.85)=507 + round(299*0.85)=254)"
            - "total_cents != 762 (sum-then-round value is NOT produced)"
            - "ShopSupplyOrder.${o_id}.total_pints == 4"

  - rule_id: non_linear_state_machine
    instances:
      - name: supplier_suspend_reinstate_cycle
        grounds:
          - state_machines.Supplier.APPROVED_to_SUSPENDED
          - state_machines.Supplier.SUSPENDED_to_APPROVED
          - entities.Supplier.fields.social_criteria_score
        distinguishing_aspect: |
          Cyclic machine on Supplier (APPROVED -> SUSPENDED -> APPROVED): a manual
          suspend followed by reinstate returns the supplier to APPROVED with its
          social_criteria_score retained and its ACTIVE commitment untouched —
          manual suspension, unlike the audit-fail cascade, does not lapse
          commitments.
        test_recipe:
          setup:
            - "Supplier APPROVED via PASS audit (composite 71) with one ACTIVE COCOA commitment"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Cocoa Collective", country_code: "GH", ingredient_category: "COCOA" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "COCOA", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v}" }
              as: SourcingManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/suspend"
              as: SourcingManager
            - call: "GET /creamery/suppliers/${s_id}/commitments?status=ACTIVE"
              as: SourcingManager
              captures: { active_c_id: "$.data[0].id" }
            - call: "POST /creamery/suppliers/${s_id}/reinstate"
              as: SourcingManager
              captures: { s_status: $.data.status, s_score: $.data.social_criteria_score }
          assert:
            - "after suspend: Supplier.${s_id}.status == SUSPENDED"
            - "commitment ${c_id} remains ACTIVE through the manual suspension (active_c_id == c_id)"
            - "after reinstate: Supplier.${s_id}.status == APPROVED (cycle closed)"
            - "s_score == 71 (score retained across the cycle)"

      - name: flavor_cycle_with_parallel_claim_dimension
        grounds:
          - state_machines.Flavor.CORE_LINE_to_RETIRED
          - state_machines.Flavor.RETIRED_to_REVIVED
          - state_machines.Flavor.REVIVED_to_CORE_LINE
          - "state_machines.Flavor.claim_status.PUBLISHED_to_RETRACTED"
        distinguishing_aspect: |
          Parallel state dimensions on Flavor (different entity from Supplier):
          the lifecycle dimension cycles CORE_LINE -> RETIRED -> REVIVED ->
          CORE_LINE while the claim dimension independently moves PUBLISHED ->
          RETRACTED on retire and can be re-substantiated from RETRACTED without
          touching lifecycle status.
        test_recipe:
          setup:
            - "Supplier APPROVED with one VERIFIED DAIRY cert (declared 95, verified 95)"
            - "Flavor DAIRY in CORE_LINE with claim FAIR_TRADE_SOURCING PUBLISHED citing that cert"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Dairy Pure", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-X1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Cyclic Swirl", base_type: "DAIRY", chunk_load_pct: 10, swirl_load_pct: 10, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "CORE_LINE" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/publish-claim"
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
              captures: { retired_status: $.data.status, retired_claim: $.data.claim_status }
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "fan1@x.com", title: "Bring it back" }
              as: Fan
              captures: { r_id: $.data.id }
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "fan1@x.com", count: 500 }
              as: Fan
            - call: "POST /creamery/revival-requests/${r_id}/adopt"
              as: IndependentBoardMember
              as_user_id: "board-1"
          trigger:
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { mid_status: $.data.status, mid_claim: $.data.claim_status, f_v2: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/return-to-line"
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v2}" }
              as: FlavorManager
              captures: { final_claim: $.data.claim_status }
          assert:
            - "retired_status == RETIRED and retired_claim == RETRACTED (retire retracts the claim dimension)"
            - "mid_status == REVIVED while mid_claim == RETRACTED (dimensions evolve independently)"
            - "after return-to-line: Flavor.${f_id}.status == CORE_LINE (cycle CORE_LINE->RETIRED->REVIVED->CORE_LINE closed)"
            - "final_claim == SUBSTANTIATED (claim dimension re-cycles from RETRACTED without touching lifecycle)"

  - rule_id: transitive_cascade
    instances:
      - name: audit_fail_depth3_cascade
        grounds:
          - state_machines.Audit.COMPLETED_to_VERIFIED
          - state_machines.Supplier.APPROVED_to_SUSPENDED
          - "state_machines.Certification.VERIFIED_to_REVOKED"
          - "state_machines.Flavor.claim_status.PUBLISHED_to_CHALLENGED"
          - state_machines.SourcingCommitment.ACTIVE_to_LAPSED
        distinguishing_aspect: |
          Depth-3 cascade triggered by audit verification: verify(FAIL) suspends
          the supplier (link 1); the suspension revokes the supplier's VERIFIED
          certifications (link 2); each revocation challenges every published
          flavor claim citing it (link 3) — and lapses ACTIVE commitments as a
          sibling hop. Each link is caused by the previous link, not by the
          verify call directly.
        test_recipe:
          setup:
            - "Supplier APPROVED via PASS audit, with one ACTIVE DAIRY commitment and one VERIFIED DAIRY cert (declared 95, verified 95)"
            - "Flavor DAIRY LIMITED_RUN with claim FAIR_TRADE_SOURCING PUBLISHED citing that cert"
            - "A second audit on the same supplier completed with failing scores (composite 50, findings 5)"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Cascade Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a1_id: $.data.id }
            - call: "POST /creamery/audits/${a1_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a1_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a1_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "DAIRY", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 8, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v}" }
              as: SourcingManager
              captures: { cm_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-K1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Cascade Crunch", base_type: "DAIRY", chunk_load_pct: 10, swirl_load_pct: 10, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/publish-claim"
              as: FlavorManager
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-06T00:00:00Z" }
              as: SourcingManager
              captures: { a2_id: $.data.id }
            - call: "POST /creamery/audits/${a2_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-2"
            - call: "POST /creamery/audits/${a2_id}/complete"
              payload: { labor_score: 50, environment_score: 50, community_score: 50, findings_count: 5 }
              as: SustainabilityAuditor
              as_user_id: "aud-2"
          trigger:
            - call: "POST /creamery/audits/${a2_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_status: $.data.status, s_score: $.data.social_criteria_score }
            - call: "GET /creamery/suppliers/${s_id}/certifications"
              as: SourcingManager
              captures: { cert_status: "$.data[0].status" }
            - call: "GET /creamery/suppliers/${s_id}/commitments?status=ACTIVE"
              as: SourcingManager
              captures: { active_list: $.data }
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_claim: $.data.claim_status }
          assert:
            - "s_status == SUSPENDED and s_score == 50 (link 1: verify FAIL suspends supplier)"
            - "cert_status == REVOKED (link 2: suspension revokes the VERIFIED cert)"
            - "f_claim == CHALLENGED (link 3: revocation challenges the PUBLISHED claim citing it)"
            - "commitment ${cm_id} == LAPSED: the ACTIVE-filtered commitment list (active_list) is empty"

      - name: clock_expiry_depth2_cascade
        grounds:
          - "state_machines.Certification.VERIFIED_to_EXPIRED"
          - "state_machines.Flavor.claim_status.PUBLISHED_to_RETRACTED"
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than audit_fail_depth3_cascade:
          a logical-clock advance (not an audit verdict) expires a VERIFIED
          certification (link 1), and the expiry itself retracts the PUBLISHED
          claim citing it (link 2) — expiry retracts where revocation challenges.
        test_recipe:
          setup:
            - "Supplier APPROVED with VERIFIED DAIRY cert valid_until 2026-10-01T00:00:00Z (declared 95, verified 95)"
            - "Flavor DAIRY LIMITED_RUN with claim FAIR_TRADE_SOURCING PUBLISHED citing that cert, all at the default logical time 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Clock Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-E1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Clockwork Orange", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/publish-claim"
              as: FlavorManager
          trigger:
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ParentOpsController
            - call: "GET /creamery/suppliers/${s_id}/certifications"
              as: SourcingManager
              captures: { cert_status: "$.data[0].status" }
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_claim: $.data.claim_status }
          assert:
            - "cert_status == EXPIRED (link 1: clock advance past valid_until expires the cert)"
            - "f_claim == RETRACTED (link 2: expiry retracts the PUBLISHED claim; it does NOT become CHALLENGED)"
            - "Flavor.${f_id}.status remains LIMITED_RUN (claim cascade does not touch lifecycle)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_order_confirm
        grounds:
          - "validations[priority=9]"
          - "validations[priority=22]"
          - state_machines.ShopSupplyOrder.PLACED_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): confirming an order that
          is already CANCELLED AND whose total_cents exceed the shop credit limit
          returns the state error ERR_INVALID_STATE (priority 9), not the fiscal
          error ERR_CREDIT_LIMIT_EXCEEDED (priority 22).
        test_recipe:
          setup:
            - "ScoopShop FRANCHISEE OPERATING with credit_limit_cents 100"
            - "Flavor LIMITED_RUN price 199; order of 10 pints (total 1990 > credit limit) created then CANCELLED by the shop operator"
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Tight Credit Shop", operator_type: "FRANCHISEE", city: "Albany", country_code: "US", credit_limit_cents: 100 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
