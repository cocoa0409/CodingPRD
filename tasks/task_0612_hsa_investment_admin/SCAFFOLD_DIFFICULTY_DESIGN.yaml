  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contribution_post_requires_account_active_open
        grounds:
          - state_machines.Contribution.PENDING_to_POSTED
          - entities.HsaAccount.fields.lifecycle_status
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Contribution PENDING->POSTED depends on the PARENT HsaAccount being lifecycle ACTIVE: posting a
          PENDING contribution on a FROZEN account fails ERR_INVALID_STATE. Entity pair Contribution->HsaAccount
          (distinct from instance #2's Distribution->DebitCard pair).
        test_recipe:
          setup:
            - "Account verified ACTIVE, a PENDING INDIVIDUAL contribution created, then the account is FROZEN before the post is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ida Joo", email: "ida.joo@x.com", date_of_birth: "1989-09-19" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 50000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/freeze"
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (parent HsaAccount.lifecycle_status == FROZEN blocks the post)"
            - "Contribution.${c_id}.status remains PENDING; HsaAccount.${acc_id}.cash_balance_cents == 0"

      - name: distribution_clear_requires_card_active
        grounds:
          - state_machines.Distribution.REQUESTED_to_CLEARED
          - entities.DebitCard.fields.status
          - validations[priority=18]
          - errors[ERR_CARD_NOT_ACTIVE]
        distinguishing_aspect: |
          A DEBIT_CARD Distribution REQUESTED->CLEARED depends on the referenced DebitCard being ACTIVE:
          clearing when the card is SUSPENDED fails ERR_CARD_NOT_ACTIVE. Entity pair Distribution->DebitCard
          (distinct from instance #1's Contribution->HsaAccount pair).
        test_recipe:
          setup:
            - "ACTIVE account with cash 80000 (posted contribution), an ACTIVE DebitCard then SUSPENDED, and a REQUESTED DEBIT_CARD distribution d for 50000 referencing that card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
