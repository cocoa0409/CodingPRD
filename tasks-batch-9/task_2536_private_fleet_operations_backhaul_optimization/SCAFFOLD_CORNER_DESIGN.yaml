              as: TransportManager
              captures: { posting_id: $.data.id, v0: $.data.version, count0: $.data.bid_count }
          trigger:
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v0}" }
              as: Driver
              as_user_id: "${driver_a}"
              captures: { bid_a: $.data.id, bid_a_status: $.data.status }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { v1: $.data.version, count1: $.data.bid_count }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v0}" }
              as: Driver
              as_user_id: "${driver_b}"
              captures: { stale_err: $.data.error_id }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { v1_again: $.data.version, count1_again: $.data.bid_count }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${v1}" }
              as: Driver
              as_user_id: "${driver_b}"
              captures: { bid_b: $.data.id }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { v2: $.data.version, count2: $.data.bid_count }
            - call: "POST /fleet/route-bids/${bid_a}/withdraw"
              payload: {}
              as: Driver
              as_user_id: "${driver_a}"
              captures: { withdrawn: $.data.status }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { v3: $.data.version, count3: $.data.bid_count }
