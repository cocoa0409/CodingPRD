  # ============================================================
  # Rule 5: priority_pair_validation_conflict — different category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_double_book_suspended_client
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair = (state, business_safety). When a Project is already BOOKED (state
          precondition violated at priority 5) AND its Client is SUSPENDED (priority 6
          business_safety violated), the higher-priority ERR_INVALID_STATE (priority 5)
          wins over ERR_ENTITY_NOT_ACTIVE (priority 6). Tests that the priority ladder
          is enforced even when multiple categories are violated.
        test_recipe:
          setup:
            - "Client C was ACTIVE, Project P booked, then C SUSPENDED (which cascades P to CANCELLED per cascade rule)"
            - "We rebuild: re-activate C, create new Project P2 in DRAFT (never booked), then suspend C so client is SUSPENDED but P2 still DRAFT — wait, suspend cascades DRAFT→CANCELLED. So we cannot get DRAFT+SUSPENDED via cascade. Instead we test the OTHER direction: P2 in BOOKED (priority-5 violated on second book), client also SUSPENDED (priority-6 violated). But suspend cancels BOOKED projects too."
            - "Cleanest setup: client PROSPECT (never activated), project P in DRAFT. Booking would fail priority-6 (client not ACTIVE). Force priority-5 failure by attempting to begin-intake on a DRAFT project — no that doesn't combine. Alternative: client is ACTIVE, project already BOOKED → second book violates priority-5 (state) AND the OCC version will be stale (priority-20) — but those are different categories. The (state, business_safety) pair is realized by trying to confirm a session slot (priority-5 state: slot already BOOKED) when the engineer is ON_LEAVE (priority-6 business_safety)."
            - "Engineer E set to ON_LEAVE"
            - "SessionSlot S already BOOKED (state precondition fails for second confirm)"
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/session-slots"
              payload: { engineer_id: "${eng_id}", slot_start_at: "2026-05-11T10:00:00Z", slot_end_at: "2026-05-11T11:00:00Z" }
              as: StudioManager
              captures: { slot_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/session-slots/${slot_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/engineers/${eng_id}/set-availability"
              payload: { availability_status: "ON_LEAVE" }
              as: StudioManager
          trigger:
            - call: "POST /studio/session-slots/${slot_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: business_constraint_vs_business_fiscal_on_approve
        grounds:
          - validations[priority=12]
          - validations[priority=14]
        distinguishing_aspect: |
          Pair = (business_constraint, business_fiscal). Different pair than
          (state, business_safety). When a metadata-tag POST has BOTH a malformed ISRC
          (priority 12 business_constraint / format) AND would be posted on a project
          where client credit would go negative at a subsequent approval (priority 14
          fiscal), the format error wins. Concretely: ISRC "xxBAD" is rejected with
          ERR_INVALID_FORMAT (400), NOT ERR_INSUFFICIENT_CREDIT (402), even when the
          client's balance is 1 cent and the project's final price would exceed it.
        test_recipe:
          setup:
            - "Client has account_credit_cents=1 (insufficient for any real charge)"
            - "Project reaches DELIVERING with a deliverable READY"
            - "Attempting to embed metadata with malformed ISRC 'xxBAD'"
          setup_api_calls:
