    claim_type: aggregation
    grounds:
    - calculations.program_follow_up_compliance
    - calculations.follow_up_completeness
    - calculations.compliance_posture
    - entities.TransplantProgram.fields.follow_up_compliance_pct
    distinguishing_aspect: 'Only rows whose due_on has passed are countable, so the denominator is 1 out
      of three DUE rows: one complete submission moves compliance 0.00 -> 100.00 and the posture RESTRICTED
      -> OPEN inside the same request.'
