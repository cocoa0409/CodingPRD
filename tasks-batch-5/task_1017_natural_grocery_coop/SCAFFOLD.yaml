# =============================================================================
# SCAFFOLD — Natural-Grocery & Consumer Co-op (task_1017)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  1017. Natural-Grocery & Consumer Co-op: member-owner equity & patronage dividend,
  SKU & bulk/tare, working-member discount, local-vendor & DSD, weekly ad & member deal,
  board/governance, cafe/deli, shrink/reorder.

domain_name: natural-grocery-coop
api_prefix: /coop

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK; no entity-parent nesting in URLs
  state_machine_shape: parallel    # Sale carries parallel checkout_status x payment_status; BoardProposal + Member are cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FiscalYear
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: year, type: integer, source: input, description: "Calendar year label, e.g. 2026" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN, constraints: "enum: OPEN, CLOSED; at most one OPEN FiscalYear may exist at a time" }
      - { name: patronage_rate, type: number, source: input, description: "Interim/estimated dividend rate applied to member YTD patronage; 0 < rate < 1" }
      - { name: equity_share_price_cents, type: integer, source: input, description: "Price of one member-owner equity share; the minimum equity_paid_in required to activate a member" }
      - { name: total_equity_cents, type: integer, source: computed, description: "Running sum of equity_paid_in_cents over all non-DROPPED members; conserved quantity", default: 0 }
      - { name: total_patronage_cents, type: integer, source: computed, description: "Running sum of patronage-eligible spend accrued across all finalized member sales this year", default: 0 }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only. X-User-ID for role Member equals this id" }
      - { name: full_name, type: string, source: input, description: "Member-owner name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: member_number, type: integer, source: system, description: "Monotonic co-op-scoped member number, assigned at creation in creation order (created_at ASC)" }
      - { name: is_board_member, type: boolean, source: input, description: "Eligible to cast board votes when ACTIVE", default: false }
      - { name: membership_status, type: enum, source: system, description: "PENDING | ACTIVE | LAPSED | DROPPED", default: PENDING, constraints: "enum: PENDING, ACTIVE, LAPSED, DROPPED" }
      - { name: equity_paid_in_cents, type: integer, source: computed, description: "Accumulated equity contributions (incl. retained-patronage credits) minus refunds", default: 0 }
      - { name: patronage_cents_ytd, type: integer, source: computed, description: "Year-to-date patronage-eligible spend; increases on member sale finalize, decreases on refund", default: 0 }
      - { name: working_hours_balance, type: number, source: computed, description: "Sum of hours over this member's COMPLETED WorkingMemberShifts in the OPEN fiscal year", default: 0 }
      - { name: is_working_member, type: boolean, source: computed, description: "True when working_hours_balance >= WORKING_MEMBER_MIN_HOURS", default: false }
      - { name: patronage_dividend_cents, type: integer, source: computed, description: "Dividend computed for this member by the most recent FINALIZED PatronageAllocation", default: 0 }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Local vendor / DSD supplier name" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | SUSPENDED", default: PENDING, constraints: "enum: PENDING, APPROVED, SUSPENDED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; primary supplier of this SKU" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: department, type: enum, source: input, description: "GROCERY | PRODUCE | BULK | CAFE_DELI", constraints: "enum: GROCERY, PRODUCE, BULK, CAFE_DELI" }
      - { name: unit_type, type: enum, source: input, description: "EACH (priced per unit) | WEIGHT (priced per kg on net weight after tare)", constraints: "enum: EACH, WEIGHT" }
      - { name: base_price_cents, type: integer, source: input, description: "Shelf price: cents per unit (EACH) or cents per kilogram (WEIGHT)" }
      - { name: tare_grams, type: integer, source: input, description: "Container tare deducted from gross weight for WEIGHT items; 0 for EACH", default: 0 }
      - { name: is_taxable, type: boolean, source: input, description: "Whether TAX_RATE applies to line subtotals of this product", default: false }
      - { name: is_prepared_food, type: boolean, source: input, description: "Cafe/deli prepared food; when true the product is NOT patronage-eligible", default: false }
      - { name: reorder_point, type: integer, source: input, description: "Total on-hand units at or below which the product is flagged for reorder" }
      - { name: reorder_qty, type: integer, source: input, description: "Suggested reorder quantity" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECALLED | DISCONTINUED", default: ACTIVE, constraints: "enum: ACTIVE, RECALLED, DISCONTINUED" }
      - { name: qty_on_hand_total, type: integer, source: computed, description: "Sum of qty_on_hand over this product's POSTED InventoryLots", default: 0 }
      - { name: needs_reorder, type: boolean, source: computed, description: "True when qty_on_hand_total <= reorder_point", default: false }
      - { name: inventory_value_cents, type: integer, source: computed, description: "Weighted-average on-hand valuation: sum(lot.qty_on_hand * lot.unit_cost_cents) over POSTED lots", default: 0 }
      - { name: last_shrink_cost_cents, type: integer, source: computed, description: "FIFO write-off cost of the most recent shrink event on this product", default: 0 }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the SKU this lot stocks" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the DSD supplier that delivered this lot" }
      - { name: received_qty, type: integer, source: input, description: "Units received in this DSD delivery; conserved: received_qty == qty_on_hand + qty_sold + qty_shrunk" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed cost per unit for this lot" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 UTC expiry instant for this lot", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED", default: DRAFT, constraints: "enum: DRAFT, POSTED" }
      - { name: qty_on_hand, type: integer, source: computed, description: "Units still on the shelf from this lot", default: 0 }
      - { name: qty_sold, type: integer, source: computed, description: "Units of this lot sold via finalized sales (net of refunds)", default: 0 }
      - { name: qty_shrunk, type: integer, source: computed, description: "Units of this lot written off via shrink", default: 0 }

  - name: Register
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "POS register label" }
      - { name: status, type: enum, source: system, description: "CLOSED | OPEN", default: CLOSED, constraints: "enum: CLOSED, OPEN" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: register_id, type: string, source: input, description: "FK -> Register.id; the POS register ringing this sale" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the basket, or null for a non-member sale", default: null }
      - { name: checkout_status, type: enum, source: system, description: "Fulfillment dimension: BUILDING | FINALIZED", default: BUILDING, constraints: "enum: BUILDING, FINALIZED" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (independent of checkout_status): UNPAID | PAID | REFUNDED", default: UNPAID, constraints: "enum: UNPAID, PAID, REFUNDED" }
      - { name: lines, type: array, source: system, description: "Embedded SaleLine objects; each: {product_id, inventory_lot_id, quantity, gross_weight_grams, net_weight_grams, units, unit_price_cents, line_subtotal_cents, line_tax_cents, line_total_cents, is_patronage_eligible, applied_member_only}", default: [] }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of line_subtotal_cents (round-per-line then sum)", default: 0 }
      - { name: tax_total_cents, type: integer, source: computed, description: "Sum over lines of line_tax_cents (round-per-line then sum)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_total_cents", default: 0 }
      - { name: patronage_eligible_cents, type: integer, source: computed, description: "Sum of line_subtotal_cents over lines whose product is patronage-eligible (not prepared food)", default: 0 }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the SKU this weekly-ad / member deal prices" }
      - { name: deal_type, type: enum, source: input, description: "AD (weekly ad, everyone) | MEMBER_DEAL (member-only)", constraints: "enum: AD, MEMBER_DEAL" }
      - { name: promo_price_cents, type: integer, source: input, description: "Fixed promotional unit price in cents while active" }
      - { name: member_only, type: boolean, source: input, description: "True for MEMBER_DEAL; the deal applies only to ACTIVE members and blocks the working-member discount", default: false }
      - { name: start_date, type: datetime, source: input, description: "ISO 8601 UTC window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "ISO 8601 UTC window end (exclusive)" }

  - name: WorkingMemberShift
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the working member volunteering this shift" }
      - { name: department, type: enum, source: input, description: "GROCERY | PRODUCE | BULK | CAFE_DELI", constraints: "enum: GROCERY, PRODUCE, BULK, CAFE_DELI" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC shift start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC shift end (exclusive)" }
      - { name: hours, type: number, source: computed, description: "(end_at - start_at) in hours" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED", default: SCHEDULED, constraints: "enum: SCHEDULED, COMPLETED" }

  - name: BoardProposal
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: title, type: string, source: input, description: "Proposal title" }
      - { name: proposal_type, type: enum, source: input, description: "BYLAW | BUDGET | POLICY", constraints: "enum: BYLAW, BUDGET, POLICY" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | VOTING | APPROVED | REJECTED | WITHDRAWN", default: DRAFT, constraints: "enum: DRAFT, UNDER_REVIEW, VOTING, APPROVED, REJECTED, WITHDRAWN" }
      - { name: eligible_board_member_count, type: integer, source: system, description: "Snapshot of ACTIVE board-member count taken when the proposal enters VOTING", default: 0 }
      - { name: voter_member_ids, type: array, source: system, description: "Ids of members who have already voted on this proposal (double-vote guard)", default: [] }
      - { name: for_count, type: integer, source: computed, description: "Count of FOR votes", default: 0 }
      - { name: against_count, type: integer, source: computed, description: "Count of AGAINST votes", default: 0 }
      - { name: abstain_count, type: integer, source: computed, description: "Count of ABSTAIN votes", default: 0 }
      - { name: quorum_met, type: boolean, source: computed, description: "True when for_count + against_count + abstain_count >= ceil(QUORUM_PCT * eligible_board_member_count)", default: false }
      - { name: outcome, type: enum, source: computed, description: "PENDING | APPROVED | REJECTED after tally", default: PENDING, constraints: "enum: PENDING, APPROVED, REJECTED" }

  - name: PatronageAllocation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; the year whose patronage is being distributed" }
      - { name: method, type: enum, source: input, description: "ESTIMATED (interim, uses fiscal_year.patronage_rate; year must be OPEN) | FINAL (uses declared_rate; year must be CLOSED)", constraints: "enum: ESTIMATED, FINAL" }
      - { name: declared_rate, type: number, source: input, description: "Board-declared final dividend rate; required for FINAL, ignored for ESTIMATED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED", default: DRAFT, constraints: "enum: DRAFT, FINALIZED, SUPERSEDED" }
      - { name: total_dividend_cents, type: integer, source: computed, description: "Sum of member dividends produced at finalize", default: 0 }
      - { name: total_retained_cents, type: integer, source: computed, description: "Sum of retained-to-equity portions produced at finalize", default: 0 }
      - { name: member_count, type: integer, source: computed, description: "Number of eligible members that received a dividend at finalize", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FiscalYear
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /coop/fiscal-years/{id}/close"
        actor: FinanceManager
        preconditions: ["FiscalYear.status == OPEN"]
        side_effects:
          - "Every Member with membership_status == ACTIVE and patronage_cents_ytd < MIN_PATRONAGE_CENTS transitions ACTIVE -> LAPSED (participation lapse)"
          - "Year becomes read-only; ESTIMATED allocations are no longer creatable, FINAL allocations become creatable"

  - entity: Member
    field: membership_status
    initial_state: PENDING
    terminal_states: [DROPPED]
    transitions:
      - from: [PENDING, LAPSED]
        to: ACTIVE
        trigger: "POST /coop/members/{id}/approve"
        actor: CoopAdmin
        preconditions:
          - "Member.membership_status in {PENDING, LAPSED}"
          - "Member.equity_paid_in_cents >= (the current or most-recent FiscalYear).equity_share_price_cents"
        side_effects: ["Member becomes eligible to earn patronage and (if is_board_member) to vote; a LAPSED member is thereby reactivated"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system (FiscalYear close sweep: participation below minimum)"
        actor: system
        preconditions: ["Member.membership_status == ACTIVE", "patronage_cents_ytd < MIN_PATRONAGE_CENTS"]
        side_effects: []
      - from: [PENDING, ACTIVE, LAPSED]
        to: DROPPED
        trigger: "POST /coop/members/{id}/drop"
        actor: CoopAdmin
        preconditions: ["Member.membership_status in {PENDING, ACTIVE, LAPSED}"]
        side_effects:
          - "Equity refunded: OPEN FiscalYear.total_equity_cents -= Member.equity_paid_in_cents, then Member.equity_paid_in_cents := 0 (compensating: conserves total_equity_cents == sum of member equity)"

  - entity: Vendor
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /coop/vendors/{id}/set-status {status: APPROVED}"
        actor: InventoryManager
        preconditions: ["Vendor.status == PENDING"]
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /coop/vendors/{id}/set-status {status: SUSPENDED}"
        actor: InventoryManager
        preconditions: ["Vendor.status == APPROVED"]
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /coop/vendors/{id}/set-status {status: APPROVED}"
        actor: InventoryManager
        preconditions: ["Vendor.status == SUSPENDED"]
        side_effects: []

  - entity: Product
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: RECALLED
        trigger: "PATCH /coop/products/{id} {status: RECALLED}"
        actor: InventoryManager
        preconditions: ["Product.status == ACTIVE"]
        side_effects: ["Product may not be added to any BUILDING sale and blocks sale finalize (safety)"]
      - from: RECALLED
        to: ACTIVE
        trigger: "PATCH /coop/products/{id} {status: ACTIVE}"
        actor: InventoryManager
        preconditions: ["Product.status == RECALLED"]
        side_effects: []
      - from: [ACTIVE, RECALLED]
        to: DISCONTINUED
        trigger: "PATCH /coop/products/{id} {status: DISCONTINUED}"
        actor: InventoryManager
        preconditions: ["Product.status in {ACTIVE, RECALLED}"]
        side_effects: ["No new lots may be received; product becomes read-only for pricing"]

  - entity: InventoryLot
    field: status
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /coop/inventory-lots/{id}/post"
        actor: InventoryManager
        preconditions:
          - "InventoryLot.status == DRAFT"
          - "Vendor(lot.vendor_id).status == APPROVED  (cross-entity: DSD receiving requires an approved vendor)"
          - "Product(lot.product_id).status != DISCONTINUED"
        side_effects:
          - "qty_on_hand := received_qty; qty_sold := 0; qty_shrunk := 0"
          - "Product.qty_on_hand_total recomputed; Product.needs_reorder recomputed; Product.inventory_value_cents recomputed"

  - entity: Register
    field: status
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /coop/registers/{id}/set-open {is_open: true}"
        actor: Cashier
        preconditions: ["Register.status == CLOSED"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /coop/registers/{id}/set-open {is_open: false}"
        actor: Cashier
        preconditions: ["Register.status == OPEN"]
        side_effects: []

  - entity: Sale
    field: checkout_status
    initial_state: BUILDING
    terminal_states: [FINALIZED]
    transitions:
      - from: BUILDING
        to: FINALIZED
        trigger: "POST /coop/sales/{id}/finalize"
        actor: Cashier
        preconditions:
          - "Sale.checkout_status == BUILDING"
          - "Register(sale.register_id).status == OPEN  (cross-entity)"
          - "No line references a product whose status == RECALLED (safety)"
          - "For every line: InventoryLot(line.inventory_lot_id).qty_on_hand >= line.units (fiscal)"
        side_effects:
          - "checkout_status -> FINALIZED"
          - "For each line: InventoryLot.qty_sold += units; InventoryLot.qty_on_hand -= units"
          - "Each affected Product.qty_on_hand_total, needs_reorder, inventory_value_cents recomputed (cascade hop from lot depletion)"
          - "If member set and ACTIVE: Member.patronage_cents_ytd += patronage_eligible_cents; OPEN FiscalYear.total_patronage_cents += patronage_eligible_cents"

  - entity: Sale
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /coop/sales/{id}/pay"
        actor: Cashier
        preconditions: ["Sale.payment_status == UNPAID"]
        side_effects: ["payment_status -> PAID (independent of checkout_status)"]
      - from: PAID
        to: REFUNDED
        trigger: "POST /coop/sales/{id}/refund"
        actor: Cashier
        preconditions:
          - "Sale.payment_status == PAID"
          - "Sale.checkout_status == FINALIZED  (guarded: cannot refund inventory that was never drawn)"
        side_effects:
          - "payment_status -> REFUNDED"
          - "For each line: InventoryLot.qty_sold -= units; InventoryLot.qty_on_hand += units (compensating; conserves lot received_qty == on_hand + sold + shrunk)"
          - "Each affected Product.qty_on_hand_total, needs_reorder, inventory_value_cents recomputed"
          - "If member set and ACTIVE: Member.patronage_cents_ytd -= patronage_eligible_cents; OPEN FiscalYear.total_patronage_cents -= patronage_eligible_cents (cascade hop from sale reversal)"

  - entity: WorkingMemberShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /coop/working-shifts/{id}/complete"
        actor: InventoryManager
        preconditions: ["WorkingMemberShift.status == SCHEDULED"]
        side_effects:
          - "Member.working_hours_balance += shift.hours"
          - "Member.is_working_member recomputed (working_hours_balance >= WORKING_MEMBER_MIN_HOURS)"

  - entity: BoardProposal
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /coop/board-proposals/{id}/advance {action: SUBMIT}"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status == DRAFT"]
        side_effects: []
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /coop/board-proposals/{id}/advance {action: REQUEST_REVISIONS}"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status == UNDER_REVIEW"]
        side_effects: ["Revision loop: proposal returns to DRAFT for editing (cyclic)"]
      - from: UNDER_REVIEW
        to: VOTING
        trigger: "POST /coop/board-proposals/{id}/advance {action: OPEN_VOTING}"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status == UNDER_REVIEW"]
        side_effects:
          - "eligible_board_member_count := count of Members with is_board_member == true and membership_status == ACTIVE (snapshot)"
      - from: VOTING
        to: APPROVED
        trigger: "POST /coop/board-proposals/{id}/tally (quorum met and for_count > against_count)"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status == VOTING", "quorum_met == true"]
        side_effects: ["outcome := APPROVED"]
      - from: VOTING
        to: REJECTED
        trigger: "POST /coop/board-proposals/{id}/tally (quorum met and for_count <= against_count)"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status == VOTING", "quorum_met == true"]
        side_effects: ["outcome := REJECTED"]
      - from: [DRAFT, UNDER_REVIEW, VOTING]
        to: WITHDRAWN
        trigger: "POST /coop/board-proposals/{id}/advance {action: WITHDRAW}"
        actor: BoardAdmin
        preconditions: ["BoardProposal.status in {DRAFT, UNDER_REVIEW, VOTING}"]
        side_effects: []

  - entity: PatronageAllocation
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer PatronageAllocation is created for the same fiscal_year_id)"
        actor: system
        preconditions: ["PatronageAllocation.status == DRAFT"]
        side_effects: ["Prior DRAFT allocation for this fiscal year is superseded when a fresh run is created"]
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /coop/patronage-allocations/{id}/finalize"
        actor: FinanceManager
        preconditions:
          - "PatronageAllocation.status == DRAFT"
          - "If method == ESTIMATED: FiscalYear.status == OPEN; if method == FINAL: FiscalYear.status == CLOSED"
        side_effects:
          - "For each ACTIVE Member with patronage_cents_ytd >= MIN_PATRONAGE_CENTS: dividend computed (see calc patronage_dividend)"
          - "Member.patronage_dividend_cents := dividend"
          - "retained := round_half_up(dividend * RETENTION_PCT); Member.equity_paid_in_cents += retained (cascade hop 1)"
          - "allocation's FiscalYear.total_equity_cents += retained per member (cascade hop 2 from member equity credit)"
          - "total_dividend_cents, total_retained_cents, member_count set"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-fiscal-year
    parent_entity: FiscalYear
    write_endpoint: "POST /coop/patronage-allocations"
    occ_field: "expected_fiscal_year_version"
    description: |
      Creating a PatronageAllocation against a FiscalYear whose version has advanced
      since the client last observed it is rejected. A prior allocation run legitimately
      supersedes the earlier one (a fresh distribution replaces the previous DRAFT), and
      that prior create already incremented FiscalYear.version; a create still carrying
      the pre-advance version is therefore working from a stale view and is refused.
    error_id: ERR_STALE_FISCAL_YEAR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sale_line_price
    trigger: "POST /coop/sales/{id}/lines (line added to a BUILDING sale)"
    algorithm: tiered_pricing
    formula: |
      # --- resolve the applicable promotion (selector) ---
      candidates = Promotions P where
          P.product_id == line.product_id
          AND clock >= P.start_date AND clock < P.end_date          # half-open [start, end)
          AND (P.member_only == false OR (sale.member_id != null AND member.membership_status == ACTIVE))
      if candidates is empty:
          unit_price = product.base_price_cents
          applied_member_only = false
      else:
          best = the candidate minimizing promo_price_cents
          tie-break: earliest start_date, then earliest created_at    # never id
          unit_price = best.promo_price_cents
          applied_member_only = best.member_only
      # --- working-member discount (stacks on AD & shelf price, NOT on a member_only deal) ---
      if sale.member_id != null AND member.is_working_member == true AND applied_member_only == false:
          unit_price = round_half_up(unit_price * (1 - WORKING_MEMBER_DISCOUNT_PCT))
      # --- units (bulk/tare) ---
      if product.unit_type == EACH:
          units = line.quantity
      else:  # WEIGHT
          net_weight_grams = line.gross_weight_grams - product.tare_grams
          units = net_weight_grams / 1000.0                          # kilograms
      line_subtotal_cents = round_half_up(unit_price * units)
      line_tax_cents = round_half_up(line_subtotal_cents * TAX_RATE) if product.is_taxable else 0
      line_total_cents = line_subtotal_cents + line_tax_cents
      is_patronage_eligible = (product.is_prepared_food == false)
    input_set: "The single product on the line, the sale's member (if any) and their is_working_member flag, and all Promotions active at the current clock for that product."
    constants:
      WORKING_MEMBER_DISCOUNT_PCT: 0.10
      TAX_RATE: 0.08
    precision: "round_half_up to whole cents; unit_type WEIGHT prices net kilograms (grams/1000)"

  - name: sale_totals
    trigger: "POST /coop/sales/{id}/lines and POST /coop/sales/{id}/finalize (running totals refreshed on every line change and at finalize)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED as round-per-line-then-sum (NOT sum-then-round):
      subtotal_cents        = sum(line.line_subtotal_cents for line in sale.lines)
      tax_total_cents       = sum(line.line_tax_cents      for line in sale.lines)
      total_cents           = subtotal_cents + tax_total_cents
      patronage_eligible_cents = sum(line.line_subtotal_cents for line in sale.lines if line.is_patronage_eligible)
    input_set: "All lines currently attached to the sale. Each line_subtotal_cents / line_tax_cents was already rounded at line-add time; totals only sum the pre-rounded line values."
    constants: {}
    precision: "Integer cent sums of already-rounded line values; no re-rounding at the sale level"

  - name: patronage_dividend
    trigger: "POST /coop/patronage-allocations/{id}/finalize"
    algorithm: forward_looking
    formula: |
      eligible members = Members with membership_status == ACTIVE AND patronage_cents_ytd >= MIN_PATRONAGE_CENTS
      rate = (allocation.method == ESTIMATED) ? fiscal_year.patronage_rate : allocation.declared_rate
      per member:
        dividend_cents = round_half_up(rate * member.patronage_cents_ytd)
        retained_cents = round_half_up(dividend_cents * RETENTION_PCT)
    input_set: "Members ACTIVE with patronage_cents_ytd >= MIN_PATRONAGE_CENTS at finalize time."
    constants:
      MIN_PATRONAGE_CENTS: 5000
      RETENTION_PCT: 0.20
    precision: "round_half_up to whole cents"
    variants:
      - name: ESTIMATED
        when: "Interim run while FiscalYear.status == OPEN"
        difference: "rate = fiscal_year.patronage_rate (the conservative interim rate)"
      - name: FINAL
        when: "Year-end run after FiscalYear.status == CLOSED"
        difference: "rate = allocation.declared_rate (the board-declared surplus rate); for the same member patronage this yields a different dividend than ESTIMATED"

  - name: shrink_writeoff_cost
    trigger: "POST /coop/products/{id}/shrink"
    algorithm: waterfall_allocation
    formula: |
      # deplete on-hand units across this product's POSTED lots, oldest first
      remaining = shrink_quantity
      cost = 0
      for lot in POSTED lots of product ordered by created_at ASC:   # FIFO; never id
          take = min(remaining, lot.qty_on_hand)
          cost += take * lot.unit_cost_cents
          lot.qty_on_hand -= take
          lot.qty_shrunk  += take
          remaining -= take
          if remaining == 0: break
      product.last_shrink_cost_cents = cost                          # FIFO write-off (applied)
      # Product.inventory_value_cents (weighted-average valuation) is recomputed after depletion.
    input_set: "This product's POSTED InventoryLots with qty_on_hand > 0, ordered created_at ASC."
    constants: {}
    precision: "Integer cents"
    variants:
      - name: FIFO
        when: "Applied for the recorded write-off cost (product.last_shrink_cost_cents) and for which lots are depleted"
        difference: "Consumes oldest lots first; cost is the sum over consumed lots of take * that lot's unit_cost_cents"
      - name: WEIGHTED_AVERAGE
        when: "Reference basis used only for the reported product.inventory_value_cents metric"
        difference: "Values every unit at the pooled average cost = round(total_value / total_on_hand); for lots of differing unit_cost this yields a different write-off figure than FIFO for the same shrink quantity"

  - name: reorder_flag
    trigger: "InventoryLot post/deplete, sale finalize/refund, shrink"
    algorithm: threshold
    formula: |
      qty_on_hand_total = sum(lot.qty_on_hand for lot in product's POSTED lots)
      needs_reorder = (qty_on_hand_total <= reorder_point)          # boundary: <= (at point flags), not <
    input_set: "This product's POSTED lots."
    constants: {}
    precision: "Integer units"

  - name: working_member_hours
    trigger: "POST /coop/working-shifts/{id}/complete"
    algorithm: aggregation
    formula: |
      working_hours_balance = sum(s.hours for s in member's WorkingMemberShifts where s.status == COMPLETED)
      is_working_member = (working_hours_balance >= WORKING_MEMBER_MIN_HOURS)   # boundary: >= (at threshold qualifies)
    input_set: "Member's COMPLETED shifts."
    constants:
      WORKING_MEMBER_MIN_HOURS: 12
    precision: "Hours to 2 decimals"

  - name: board_tally
    trigger: "POST /coop/board-proposals/{id}/tally"
    algorithm: threshold
    formula: |
      votes_cast = for_count + against_count + abstain_count
      quorum_required = ceil(QUORUM_PCT * eligible_board_member_count)
      quorum_met = (votes_cast >= quorum_required)
      if not quorum_met: reject the tally request with ERR_QUORUM_NOT_MET
      outcome = APPROVED if for_count > against_count else REJECTED   # strict majority of cast; ABSTAIN excluded from the comparison
    input_set: "The proposal's own vote counts and its eligible_board_member_count snapshot."
    constants:
      QUORUM_PCT: 0.5
    precision: "Integer vote counts; quorum uses ceil"

  - name: equity_conservation
    trigger: "member equity-contribution, member drop refund, allocation finalize retention"
    algorithm: aggregation
    formula: |
      INVARIANT: FiscalYear.total_equity_cents == sum(m.equity_paid_in_cents for m in Members where membership_status != DROPPED)
      contribution: member.equity_paid_in_cents += amount; OPEN fiscal_year.total_equity_cents += amount
      drop refund:  OPEN fiscal_year.total_equity_cents -= member.equity_paid_in_cents; member.equity_paid_in_cents := 0
      retained dividend: member.equity_paid_in_cents += retained; allocation's fiscal_year.total_equity_cents += retained
    input_set: "All non-DROPPED members and the OPEN fiscal year."
    constants: {}
    precision: "Integer cents; the invariant holds exactly after every mutation"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body resolves to an existing resource (validated left-to-right)"
    error_id: "ERR_FISCAL_YEAR_NOT_FOUND / ERR_MEMBER_NOT_FOUND / ERR_VENDOR_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_LOT_NOT_FOUND / ERR_REGISTER_NOT_FOUND / ERR_SALE_NOT_FOUND / ERR_PROMOTION_NOT_FOUND / ERR_SHIFT_NOT_FOUND / ERR_PROPOSAL_NOT_FOUND / ERR_ALLOCATION_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path id or FK body field

  - priority: 4
    category: state
    check: "Target resource (and any register/sale/proposal/allocation gate) is in the correct state for this transition"
    error_id: "ERR_INVALID_STATE (domain-specific: ERR_SALE_NOT_BUILDING, ERR_REGISTER_CLOSED, ERR_LOT_NOT_DRAFT, ERR_PROPOSAL_NOT_VOTING, ERR_MEMBER_NOT_APPROVABLE, ERR_ALLOCATION_NOT_DRAFT, ERR_PAYMENT_NOT_PAID, ERR_FISCAL_YEAR_NOT_OPEN, ERR_FISCAL_YEAR_NOT_CLOSED)"
    http_status: 409
    applies_to: all state-transition endpoints
    note: "Includes cross-entity state gates such as Register(sale.register_id).status == OPEN for sale finalize."

  - priority: 5
    category: business_safety
    check: "No line on a finalizing sale references a product whose status == RECALLED"
    error_id: ERR_PRODUCT_RECALLED
    http_status: 422
    applies_to: "POST /coop/sales/{id}/lines, POST /coop/sales/{id}/finalize"

  - priority: 6
    category: business_temporal
    check: "New Promotion window must not overlap an existing promotion on the same product; new WorkingMemberShift must be >= REST_BUFFER_MINUTES (=60) from the member's other shifts"
    error_id: "ERR_PROMO_WINDOW_OVERLAP / ERR_SHIFT_OVERLAP"
    http_status: 409
    applies_to: "POST /coop/promotions, POST /coop/working-shifts"

  - priority: 7
    category: business_referential
    check: "Cross-reference integrity: lot post requires Vendor APPROVED; sale line's inventory_lot_id must belong to the line's product; only ACTIVE board members may vote"
    error_id: "ERR_VENDOR_NOT_APPROVED / ERR_LOT_PRODUCT_MISMATCH / ERR_NOT_ELIGIBLE_VOTER"
    http_status: 409
    applies_to: "POST /coop/inventory-lots/{id}/post, POST /coop/sales/{id}/lines, POST /coop/board-proposals/{id}/votes"

  - priority: 8
    category: business_constraint
    check: "Uniqueness / participation constraints: a member may vote at most once per proposal; tally requires quorum; at most one OPEN fiscal year; OCC stale-version guard on allocation create"
    error_id: "ERR_ALREADY_VOTED / ERR_QUORUM_NOT_MET / ERR_OPEN_FISCAL_YEAR_EXISTS / ERR_STALE_FISCAL_YEAR_VERSION"
    http_status: "409 (412 for ERR_STALE_FISCAL_YEAR_VERSION)"
    applies_to: "POST /coop/board-proposals/{id}/votes, POST /coop/board-proposals/{id}/tally, POST /coop/fiscal-years, POST /coop/patronage-allocations"

  - priority: 9
    category: business_fiscal
    check: "Quantity/equity scarcity checks last: sale finalize requires each lot on-hand >= line units; member approve/reactivate requires equity_paid_in >= equity_share_price; FINAL allocation requires declared_rate present"
    error_id: "ERR_INSUFFICIENT_INVENTORY / ERR_EQUITY_BELOW_SHARE_PRICE / ERR_DECLARED_RATE_REQUIRED"
    http_status: 422
    applies_to: "POST /coop/sales/{id}/finalize, POST /coop/members/{id}/approve, POST /coop/patronage-allocations/{id}/finalize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time. All window/expiry/eligibility rules read this clock."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601"]

  # --- FiscalYear ---
  - method: POST
    path: "/coop/fiscal-years"
    description: "Create a fiscal year (OPEN). Rejected with ERR_OPEN_FISCAL_YEAR_EXISTS if an OPEN year already exists."
    roles: [CoopAdmin]
    code: 201
    input: [year, patronage_rate, equity_share_price_cents]
    output: FiscalYear
    side_effects: ["status=OPEN, total_equity_cents=0, total_patronage_cents=0"]
  - method: GET
    path: "/coop/fiscal-years/{id}"
    description: "Fetch a fiscal year"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: FiscalYear
    side_effects: []
  - method: POST
    path: "/coop/fiscal-years/{id}/close"
    description: "Close the year (OPEN -> CLOSED); lapses under-funded active members"
    roles: [FinanceManager]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["status -> CLOSED", "ACTIVE members with patronage_cents_ytd < MIN_PATRONAGE_CENTS -> LAPSED"]

  # --- Member ---
  - method: POST
    path: "/coop/members"
    description: "Register a prospective member-owner (PENDING)"
    roles: [CoopAdmin]
    code: 201
    input: [full_name, email, "is_board_member?"]
    output: Member
    side_effects: ["membership_status=PENDING, member_number assigned, equity_paid_in_cents=0"]
  - method: GET
    path: "/coop/members/{id}"
    description: "Fetch a member"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/coop/members/{id}/approve"
    description: "Approve/reactivate a PENDING or LAPSED member to ACTIVE (requires equity_paid_in_cents >= equity_share_price_cents)"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status {PENDING, LAPSED} -> ACTIVE"]
  - method: POST
    path: "/coop/members/{id}/equity-contribution"
    description: "Record an equity contribution against the OPEN fiscal year (adds to member equity; does not itself change membership_status)"
    roles: [FinanceManager]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["equity_paid_in_cents += amount_cents", "OPEN FiscalYear.total_equity_cents += amount_cents"]
  - method: POST
    path: "/coop/members/{id}/drop"
    description: "Drop a membership (-> DROPPED) and refund equity"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status -> DROPPED", "OPEN FiscalYear.total_equity_cents -= equity_paid_in_cents", "equity_paid_in_cents := 0"]

  # --- Vendor ---
  - method: POST
    path: "/coop/vendors"
    description: "Create a local vendor / DSD supplier (PENDING)"
    roles: [InventoryManager]
    code: 201
    input: [name]
    output: Vendor
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/coop/vendors/{id}"
    description: "Fetch a vendor"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/coop/vendors/{id}/set-status"
    description: "Approve or suspend a vendor"
    roles: [InventoryManager]
    code: 200
    input: [status]
    output: Vendor
    side_effects: ["status -> APPROVED or SUSPENDED per body"]

  # --- Product ---
  - method: POST
    path: "/coop/products"
    description: "Create a SKU (ACTIVE)"
    roles: [InventoryManager]
    code: 201
    input: [vendor_id, sku, name, department, unit_type, base_price_cents, reorder_point, reorder_qty, "tare_grams?", "is_taxable?", "is_prepared_food?"]
    output: Product
    side_effects: ["status=ACTIVE, qty_on_hand_total=0, needs_reorder recomputed"]
  - method: GET
    path: "/coop/products"
    description: "List products; filter by vendor_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/coop/products/{id}"
    description: "Fetch a product"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: PATCH
    path: "/coop/products/{id}"
    description: "Update price / reorder point / status (recall, un-recall, discontinue)"
    roles: [InventoryManager]
    code: 200
    input: ["base_price_cents?", "reorder_point?", "reorder_qty?", "status?"]
    output: Product
    side_effects: ["status transition per §1.2; needs_reorder recomputed if reorder_point changes"]
  - method: POST
    path: "/coop/products/{id}/shrink"
    description: "Record shrink/spoilage; FIFO-depletes POSTED lots and writes off cost"
    roles: [InventoryManager]
    code: 200
    input: [quantity]
    output: Product
    side_effects: ["FIFO deplete lots; last_shrink_cost_cents set; qty_on_hand_total, needs_reorder, inventory_value_cents recomputed"]

  # --- InventoryLot ---
  - method: POST
    path: "/coop/inventory-lots"
    description: "Create a DSD receiving lot (DRAFT)"
    roles: [InventoryManager]
    code: 201
    input: [product_id, vendor_id, received_qty, unit_cost_cents, "expiry_date?"]
    output: InventoryLot
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/coop/inventory-lots"
    description: "List lots; filter by product_id and/or vendor_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["product_id?", "vendor_id?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/coop/inventory-lots/{id}"
    description: "Fetch a lot"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/coop/inventory-lots/{id}/post"
    description: "Post a DRAFT lot to the shelf (requires APPROVED vendor)"
    roles: [InventoryManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status DRAFT -> POSTED", "qty_on_hand := received_qty", "Product.qty_on_hand_total, needs_reorder, inventory_value_cents recomputed"]

  # --- Register ---
  - method: POST
    path: "/coop/registers"
    description: "Create a POS register (CLOSED)"
    roles: [Cashier]
    code: 201
    input: [name]
    output: Register
    side_effects: ["status=CLOSED"]
  - method: GET
    path: "/coop/registers/{id}"
    description: "Fetch a register"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Register
    side_effects: []
  - method: POST
    path: "/coop/registers/{id}/set-open"
    description: "Open or close a register"
    roles: [Cashier]
    code: 200
    input: [is_open]
    output: Register
    side_effects: ["status -> OPEN or CLOSED per is_open"]

  # --- Sale ---
  - method: POST
    path: "/coop/sales"
    description: "Open a basket on a register (BUILDING/UNPAID); member_id optional for non-member sale"
    roles: [Cashier]
    code: 201
    input: [register_id, "member_id?"]
    output: Sale
    side_effects: ["checkout_status=BUILDING, payment_status=UNPAID, empty lines"]
  - method: GET
    path: "/coop/sales"
    description: "List sales; filter by member_id and/or register_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["member_id?", "register_id?", "limit?", "offset?"]
    output: "Sale[]"
    side_effects: []
  - method: GET
    path: "/coop/sales/{id}"
    description: "Fetch a sale (with embedded lines)"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/coop/sales/{id}/lines"
    description: "Add a line to a BUILDING sale; prices it immediately per calc sale_line_price"
    roles: [Cashier]
    code: 200
    input: [product_id, inventory_lot_id, "quantity?", "gross_weight_grams?"]
    output: Sale
    side_effects: ["line appended with computed pricing; sale running totals refreshed"]
  - method: POST
    path: "/coop/sales/{id}/finalize"
    description: "Finalize the basket (BUILDING -> FINALIZED); draws inventory, accrues patronage"
    roles: [Cashier]
    code: 200
    input: []
    output: Sale
    side_effects: ["checkout_status -> FINALIZED", "lots drawn (qty_sold += units, qty_on_hand -= units)", "products recomputed (reorder cascade)", "member patronage + fiscal year total_patronage accrued"]
  - method: POST
    path: "/coop/sales/{id}/pay"
    description: "Mark the sale paid (UNPAID -> PAID); independent of checkout_status"
    roles: [Cashier]
    code: 200
    input: []
    output: Sale
    side_effects: ["payment_status -> PAID"]
  - method: POST
    path: "/coop/sales/{id}/refund"
    description: "Refund a paid, finalized sale (PAID -> REFUNDED); restocks inventory, reverses patronage"
    roles: [Cashier]
    code: 200
    input: []
    output: Sale
    side_effects: ["payment_status -> REFUNDED", "lots restocked (qty_sold -= units, qty_on_hand += units)", "products recomputed", "member patronage + fiscal year total_patronage reversed"]

  # --- Promotion ---
  - method: POST
    path: "/coop/promotions"
    description: "Create a weekly-ad or member deal on a product; rejects overlapping windows on the same product"
    roles: [InventoryManager]
    code: 201
    input: [product_id, deal_type, promo_price_cents, start_date, end_date, "member_only?"]
    output: Promotion
    side_effects: []
  - method: GET
    path: "/coop/promotions"
    description: "List promotions; filter by product_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: "Promotion[]"
    side_effects: []
  - method: GET
    path: "/coop/promotions/{id}"
    description: "Fetch a promotion"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  # --- WorkingMemberShift ---
  - method: POST
    path: "/coop/working-shifts"
    description: "Schedule a working-member shift; rejects shifts within REST_BUFFER_MINUTES (=60) of the member's other shifts"
    roles: [Member, CoopAdmin]
    code: 201
    input: [member_id, department, start_at, end_at]
    output: WorkingMemberShift
    side_effects: ["status=SCHEDULED, hours computed"]
  - method: GET
    path: "/coop/working-shifts"
    description: "List shifts; filter by member_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "WorkingMemberShift[]"
    side_effects: []
  - method: GET
    path: "/coop/working-shifts/{id}"
    description: "Fetch a shift"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: WorkingMemberShift
    side_effects: []
  - method: POST
    path: "/coop/working-shifts/{id}/complete"
    description: "Mark a shift COMPLETED; credits member hours"
    roles: [InventoryManager, CoopAdmin]
    code: 200
    input: []
    output: WorkingMemberShift
    side_effects: ["status -> COMPLETED", "Member.working_hours_balance += hours; is_working_member recomputed"]

  # --- BoardProposal ---
  - method: POST
    path: "/coop/board-proposals"
    description: "Create a board proposal (DRAFT)"
    roles: [BoardAdmin]
    code: 201
    input: [title, proposal_type]
    output: BoardProposal
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/coop/board-proposals/{id}"
    description: "Fetch a proposal (with vote counts)"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: BoardProposal
    side_effects: []
  - method: POST
    path: "/coop/board-proposals/{id}/advance"
    description: "Advance proposal lifecycle: SUBMIT, REQUEST_REVISIONS, OPEN_VOTING, WITHDRAW"
    roles: [BoardAdmin]
    code: 200
    input: [action]
    output: BoardProposal
    side_effects: ["status transition per §1.2; OPEN_VOTING snapshots eligible_board_member_count"]
  - method: POST
    path: "/coop/board-proposals/{id}/votes"
    description: "Cast a board vote (FOR/AGAINST/ABSTAIN); one vote per member; proposal must be VOTING"
    roles: [Member]
    code: 200
    input: [member_id, vote]
    output: BoardProposal
    side_effects: ["vote counted; voter_member_ids appended; quorum_met recomputed"]
  - method: POST
    path: "/coop/board-proposals/{id}/tally"
    description: "Tally votes (VOTING -> APPROVED/REJECTED); requires quorum"
    roles: [BoardAdmin]
    code: 200
    input: []
    output: BoardProposal
    side_effects: ["status -> APPROVED or REJECTED; outcome set"]

  # --- PatronageAllocation ---
  - method: POST
    path: "/coop/patronage-allocations"
    description: "Create a patronage allocation run (DRAFT) against a fiscal year; supersedes any prior DRAFT run and advances FiscalYear.version (OCC via expected_fiscal_year_version)"
    roles: [FinanceManager]
    code: 201
    input: [fiscal_year_id, method, expected_fiscal_year_version, "declared_rate?"]
    output: PatronageAllocation
    side_effects: ["status=DRAFT", "prior DRAFT allocation for this fiscal year -> SUPERSEDED", "increments FiscalYear.version by 1"]
  - method: GET
    path: "/coop/patronage-allocations"
    description: "List allocations; filter by fiscal_year_id"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: ["fiscal_year_id?", "limit?", "offset?"]
    output: "PatronageAllocation[]"
    side_effects: []
  - method: GET
    path: "/coop/patronage-allocations/{id}"
    description: "Fetch an allocation"
    roles: [CoopAdmin, FinanceManager, InventoryManager, Cashier, BoardAdmin, Member]
    code: 200
    input: []
    output: PatronageAllocation
    side_effects: []
  - method: POST
    path: "/coop/patronage-allocations/{id}/finalize"
    description: "Finalize an allocation (DRAFT -> FINALIZED); posts member dividends and retained equity"
    roles: [FinanceManager]
    code: 200
    input: []
    output: PatronageAllocation
    side_effects: ["member dividends computed and posted", "retained equity credited to members and OPEN fiscal year", "totals set"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or bad enum/type" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FISCAL_YEAR_NOT_FOUND, http: 404, condition: "Fiscal year id does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not resolve" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "Vendor id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Inventory lot id does not resolve" }
  - { id: ERR_REGISTER_NOT_FOUND, http: 404, condition: "Register id does not resolve" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "Sale id does not resolve" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Promotion id does not resolve" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "Working shift id does not resolve" }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "Board proposal id does not resolve" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Patronage allocation id does not resolve" }
  - { id: ERR_MEMBER_NOT_APPROVABLE, http: 409, condition: "Approve/reactivate requires membership_status in {PENDING, LAPSED}" }
  - { id: ERR_FISCAL_YEAR_NOT_OPEN, http: 409, condition: "Operation requires the fiscal year to be OPEN (e.g. ESTIMATED allocation, equity accrual)" }
  - { id: ERR_FISCAL_YEAR_NOT_CLOSED, http: 409, condition: "FINAL allocation requires the fiscal year to be CLOSED" }
  - { id: ERR_LOT_NOT_DRAFT, http: 409, condition: "Post requires the lot to be in DRAFT" }
  - { id: ERR_REGISTER_CLOSED, http: 409, condition: "Sale line/finalize requires Register.status == OPEN" }
  - { id: ERR_SALE_NOT_BUILDING, http: 409, condition: "Add-line/finalize requires checkout_status == BUILDING" }
  - { id: ERR_PAYMENT_NOT_UNPAID, http: 409, condition: "Pay requires payment_status == UNPAID" }
  - { id: ERR_PAYMENT_NOT_PAID, http: 409, condition: "Refund requires payment_status == PAID" }
  - { id: ERR_SALE_NOT_FINALIZED, http: 409, condition: "Refund requires checkout_status == FINALIZED" }
  - { id: ERR_PROPOSAL_INVALID_ACTION, http: 409, condition: "Advance action not legal from the proposal's current status" }
  - { id: ERR_PROPOSAL_NOT_VOTING, http: 409, condition: "Vote/tally requires status == VOTING" }
  - { id: ERR_ALLOCATION_NOT_DRAFT, http: 409, condition: "Finalize requires allocation status == DRAFT" }
  - { id: ERR_PRODUCT_RECALLED, http: 422, condition: "A line references a product whose status == RECALLED (safety)" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "New promotion window overlaps an existing promotion on the same product (half-open [start,end))" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift is closer than REST_BUFFER_MINUTES (=60) to another shift of the same member" }
  - { id: ERR_VENDOR_NOT_APPROVED, http: 409, condition: "Lot post requires Vendor.status == APPROVED" }
  - { id: ERR_LOT_PRODUCT_MISMATCH, http: 409, condition: "Sale line inventory_lot_id belongs to a different product than product_id" }
  - { id: ERR_NOT_ELIGIBLE_VOTER, http: 409, condition: "Voter is not an ACTIVE board member" }
  - { id: ERR_ALREADY_VOTED, http: 409, condition: "Member has already voted on this proposal" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Tally attempted before quorum of cast votes reached" }
  - { id: ERR_OPEN_FISCAL_YEAR_EXISTS, http: 409, condition: "Cannot create a fiscal year while another is OPEN" }
  - { id: ERR_STALE_FISCAL_YEAR_VERSION, http: 412, condition: "expected_fiscal_year_version does not match the fiscal year's current version (OCC)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "A line's lot has qty_on_hand < line units at finalize" }
  - { id: ERR_EQUITY_BELOW_SHARE_PRICE, http: 422, condition: "Approve/reactivate requires equity_paid_in_cents >= equity_share_price_cents" }
  - { id: ERR_DECLARED_RATE_REQUIRED, http: 422, condition: "FINAL allocation requires declared_rate in the body" }
  - { id: ERR_LINE_UNIT_INPUT_INVALID, http: 400, condition: "EACH line requires quantity; WEIGHT line requires gross_weight_grams" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoopAdmin
    description: "Co-op administrator: fiscal years, member lifecycle, working-shift completion"
    identity: opaque
    exclusive_operations:
      - "POST /coop/fiscal-years"
      - "POST /coop/members"
      - "POST /coop/members/{id}/approve"
      - "POST /coop/members/{id}/drop"
    shared_operations:
      - "POST /coop/working-shifts (also Member)"
      - "POST /coop/working-shifts/{id}/complete (also InventoryManager)"
      - "GET (all read endpoints)"

  - name: FinanceManager
    description: "Finance: equity contributions, fiscal-year close, patronage allocations"
    identity: opaque
    exclusive_operations:
      - "POST /coop/fiscal-years/{id}/close"
      - "POST /coop/members/{id}/equity-contribution"
      - "POST /coop/patronage-allocations"
      - "POST /coop/patronage-allocations/{id}/finalize"
    shared_operations:
      - "GET (all read endpoints)"

  - name: InventoryManager
    description: "Merchandising: vendors, products, DSD lots, promotions, shrink, shift completion"
    identity: opaque
    exclusive_operations:
      - "POST /coop/vendors"
      - "POST /coop/vendors/{id}/set-status"
      - "POST /coop/products"
      - "PATCH /coop/products/{id}"
      - "POST /coop/products/{id}/shrink"
      - "POST /coop/inventory-lots"
      - "POST /coop/inventory-lots/{id}/post"
      - "POST /coop/promotions"
    shared_operations:
      - "POST /coop/working-shifts/{id}/complete (also CoopAdmin)"
      - "GET (all read endpoints)"

  - name: Cashier
    description: "Point of sale: registers and sales"
    identity: opaque
    exclusive_operations:
      - "POST /coop/registers"
      - "POST /coop/registers/{id}/set-open"
      - "POST /coop/sales"
      - "POST /coop/sales/{id}/lines"
      - "POST /coop/sales/{id}/finalize"
      - "POST /coop/sales/{id}/pay"
      - "POST /coop/sales/{id}/refund"
    shared_operations:
      - "GET (all read endpoints)"

  - name: BoardAdmin
    description: "Governance clerk: board proposal lifecycle and tally"
    identity: opaque
    exclusive_operations:
      - "POST /coop/board-proposals"
      - "POST /coop/board-proposals/{id}/advance"
      - "POST /coop/board-proposals/{id}/tally"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Member
    description: "Member-owner: schedules own working shifts and casts own board votes"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/board-proposals/{id}/votes (X-User-ID must equal the body member_id)"
    shared_operations:
      - "POST /coop/working-shifts (also CoopAdmin)"
      - "GET (all read endpoints)"
