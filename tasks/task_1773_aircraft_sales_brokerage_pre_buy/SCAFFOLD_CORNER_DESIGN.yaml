      - name: valuation_input_set_excludes_non_matching_and_unverified
        claim_type: input_set_filtering
        grounds: [calculations.market_comparables_valuation]
        distinguishing_aspect: "Comps with different make/model or comp_status UNVERIFIED are excluded: polluting rows (a 100.00 UNVERIFIED G550 comp, a VERIFIED Citation X comp) do not move the PROVISIONAL mean off 4151152.20."
        test_recipe:
          setup: ["Listing G550 tt 2900; 3 canonical VERIFIED G550 comps plus 1 UNVERIFIED G550 comp at 100.00 and 1 VERIFIED Cessna/Citation X comp at 9000000.00"]
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1773GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
