          assert:
            - "${e_room} == \"ERR_STALE_ROOM_VERSION\" at HTTP 412; the room is unchanged (still ${room_v1} on the following read) and case_2 is still DRAFT"
            - "trigger call 3 succeeds with the re-read ${room_v1}: case_2 becomes SCHEDULED and the room's occupied_block_count reaches 2"
            - "${e_scope} == \"ERR_STALE_SCOPE_VERSION\" at HTTP 412 and not ERR_SCOPE_NOT_AVAILABLE (409): the scope is IN_USE on case_1, but priority 30 precedes priority 51"
            - "${e_lot} == \"ERR_STALE_LOT_VERSION\" at HTTP 412; the lot still reports quantity_reserved 1, quantity_available 9"
            - "trigger call 7 succeeds with the re-read ${lot_v1}: case_2 holds device_state \"RESERVED\" with device_quantity 2 and the lot reports quantity_reserved 3, quantity_available 7"
            - "${e_patient} == \"ERR_STALE_PATIENT_VERSION\" at HTTP 412 — the PATCH that changed egfr advanced the patient past ${pat_v0}; no SurveillanceRecall row exists at that point"
            - "the final call succeeds with ${pat_v1}: the recall is created with protocol \"STONE\", risk_tier \"LOW\", interval_months 24, due_on \"2028-09-01\", status \"SCHEDULED_DUE\", and the patient's outstanding_recall_count becomes 1"
            - "no refused call changed any version: each parent's version read immediately after its refusal equals the value read immediately before it"

      - name: ccl_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - response_envelope
          - concurrency_rules[case-schedule-stale-room]
          - endpoints[POST /urology/procedure-cases/{id}/schedule]
          - endpoints[POST /urology/procedure-cases/{id}/check-in]
        distinguishing_aspect: "Version is a write counter, not a state counter: a case's version advances by exactly one on each of five successive successful writes even when two of them leave schedule_status untouched (a prep acknowledgement and a clearance review), stays put across reads, and stays put when a write is refused. The room's version advances only on the writes that rewrite its occupancy ledger, so it moves once across the same five case writes."
        test_recipe:
