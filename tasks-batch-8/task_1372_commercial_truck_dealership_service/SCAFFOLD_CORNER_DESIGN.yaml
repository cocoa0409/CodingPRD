            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1" }
            - { call: "POST /dealership/warranty-claims/${claim_id}/adjudicate", payload: { outcome: "APPROVE" }, as: OEMClaimsAdjudicator, as_user_id: "oem-9" }
            - { call: "POST /dealership/warranty-claims/${claim_id}/post-payment", payload: { amount_cents: 16500 }, as: Controller }
          trigger:
            - { call: "POST /dealership/warranty-claims/${claim_id}/appeal", payload: { appeal_notes: "too late" }, as: WarrantyAdministrator, captures: { e1: $.data.error_id } }
            - { call: "POST /dealership/warranty-claims/${claim_id}/post-payment", payload: { amount_cents: 100 }, as: Controller, captures: { e2: $.data.error_id } }
          assert:
