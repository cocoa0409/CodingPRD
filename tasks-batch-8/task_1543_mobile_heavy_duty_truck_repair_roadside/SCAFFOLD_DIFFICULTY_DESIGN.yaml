      - name: temporal_beats_referential_on_dispatch_create
        grounds:
          - validations[priority=16]
          - validations[priority=21]
        distinguishing_aspect: |
          Pair business_temporal-vs-business_referential: the fleet was manually suspended AFTER
          call A reached DISPATCHED, and the replacement-dispatch window overlaps the
          technician's existing PROPOSED dispatch. Both ERR_DISPATCH_WINDOW_OVERLAP (16) and
          ERR_FLEET_SUSPENDED (21) are satisfiable on the dispatch create; temporal must win.
        test_recipe:
          setup:
            - "Fleet call A is DISPATCHED: PROPOSED dispatch D_A for T2 window 09:00-12:00. Fleet then SUSPENDED (ADMIN) by OpsAdmin."
