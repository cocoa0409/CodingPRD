              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
          trigger:
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "Order create against APPROVED formula rejected with error_id ERR_FORMULA_NOT_ACTIVE"
            - "After activation the same create succeeds: ProductionOrder.${ord} exists with status DRAFT"

      - name: run_start_requires_batch_released
        grounds:
          - validations[priority=28]
          - state_machines.FillingRun.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_BATCH_NOT_RELEASED]
        distinguishing_aspect: |
          Pair FillingRun -> Batch (distinct from Order -> Formula): a run whose
          batch is still MIXING cannot start (ERR_BATCH_NOT_RELEASED); once the
          batch passes IPC and is released, the same start succeeds.
        test_recipe:
          setup:
            - "CONFIRMED order with a MIXING 100kg batch (fully allocated) and a SCHEDULED run referencing it"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
