  - section: rbac
    instances:
      - name: resident_cannot_create_a_network_segment
        claim_type: role_denied
        grounds: ["roles.Resident", "endpoints.POST /pavement/segments", "validations.ERR_UNAUTHORIZED"]
        distinguishing_aspect: "The Resident role is a reader plus exactly one writer op (filing a service request): the identical, perfectly valid segment body that PavementEngineer accepts is 403 ERR_UNAUTHORIZED from a Resident, and no row is created — the authorization check precedes the priority-30 shape check and the write."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "No segment exists."
            - "The Resident caller sends a body that is valid in every respect (Maple St, Z1, LOCAL, ASPHALT, 1000.00 x 30.00, baseline 92.0)."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: Resident
              as_user_id: "resident-1"
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/segments"
              payload: { geo_zone: "Z1" }
              as: Resident
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
          assert:
            - "HTTP 403."
            - "data.error_id == 'ERR_UNAUTHORIZED'."
            - "GET /pavement/segments?geo_zone=Z1 as the same Resident returns HTTP 200 with meta.total_count == 0 — the read is permitted, the write was not, and nothing was created."
            - "The identical body from PavementEngineer then returns HTTP 201 with area_sy 3333.33 and condition_index 76.0."

