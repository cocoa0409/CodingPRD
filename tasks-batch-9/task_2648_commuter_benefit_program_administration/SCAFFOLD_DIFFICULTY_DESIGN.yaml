  - rule_id: non_linear_state_machine
    instances:
      - name: election_funding_and_fulfillment_axes_advance_independently
        grounds:
          - state_machines.Election.PENDING_to_FUNDED
          - state_machines.Election.ORDERED_to_IN_TRANSIT
          - state_machines.Election.IN_TRANSIT_to_REPLACEMENT_PENDING
          - state_machines.Election.REPLACEMENT_PENDING_to_ORDERED
          - state_machines.MediaOrder.SHIPPED_to_UNDELIVERED
          - state_machines.MediaOrder.UNDELIVERED_to_SUBMITTED
          - calculations.election_fulfillment_rollup
          - entities.Election.fields.funding_status
          - entities.Election.fields.fulfillment_status
        distinguishing_aspect: |
          PARALLEL state dimensions on ONE Election row: funding_status and fulfillment_status are two
          independent axes. fulfillment_status traverses ORDERED -> IN_TRANSIT -> REPLACEMENT_PENDING
          -> ORDERED while funding_status sits unmoved at FUNDED and excluded_amount_cents stays
          8000, proving neither axis reads the other.
