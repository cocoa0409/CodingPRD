          The only endpoint whose entire job is to notice that time has passed: the consent carries
          an expires_at, the clock moves beyond it, and nothing changes until this checkpoint is
          called, which then runs the revocation cascade with blocked_reason CONSENT_REVOKED even
          though no revocation was ever requested. revoked_at must stay null, distinguishing an
          expiry from a revocation.
