  - rule_id: transitive_cascade
    instances:
      - name: vendor_suspension_depth_three_cascade
        grounds:
          - state_machines.AssessmentVendor.ACTIVE_to_SUSPENDED
          - state_machines.AssessmentVendor.SUSPENDED_to_ACTIVE
          - entities.InterviewSession.fields.cancellation_reason
          - calculations.interviewer_committed_minutes
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: vendor suspend -> instruments flagged
          vendor_suspended (link 1) -> cycles referencing them FROZEN with frozen_from_posture
          captured (link 2, caused by link 1) -> their SCHEDULED sessions CANCELLED with
          committed-minutes debit (link 3, caused by link 2). Reinstate is an ASYMMETRIC
          compensation: cycles unfreeze but cancelled sessions and minutes are NOT restored.
        test_recipe:
          setup:
            - "Vendor v ACTIVE; instrument i VALIDATED; guide APPROVED; cycle ACTIVE (window 2026-08-10..2026-08-20, capacity 8)"
            - "c1 COMPLETED (raw 72); session s1 iv1 2026-08-14T10:00-11:00 SCHEDULED (60 min -> committed_minutes_total == 60)"
