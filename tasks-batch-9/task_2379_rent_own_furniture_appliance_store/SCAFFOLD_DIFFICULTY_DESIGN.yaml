            - "ServiceTicket.${ticket_id}.status == RESOLVED, resolution == SWAPPED, rent_credit_days == 3 and Agreement.${agr_id}.service_credit_days == 3"
            - "Agreement.${agr_id}.possession_status == DELIVERED, unit_id == ${unit_b_id} and swap_count == 1"
            - "InventoryUnit.${unit_a_id}.status == AVAILABLE with condition_grade stepped NEW -> GRADE_A and rent_cycle_count == 1; InventoryUnit.${unit_b_id}.status == ON_RENT with replaced_unit_id == ${unit_a_id}, condition_grade still NEW and rent_cycle_count still 0"
