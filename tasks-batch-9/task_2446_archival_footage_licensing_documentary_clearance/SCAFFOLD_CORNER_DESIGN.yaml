  - section: complexity_layers
    instances:

      - name: stale_production_version_blocks_the_second_chart_pin
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.chart-pin-stale-production
          - endpoints.POST_/productions/{id}/clearance-charts
          - errors.ERR_STALE_PRODUCTION_VERSION
        distinguishing_aspect: "Pinning bumps Production.version as a side effect, so a second writer replaying the version it read before the first pin must get 412 ERR_STALE_PRODUCTION_VERSION — and after re-reading the production the identical request succeeds and supersedes the first chart."
        test_recipe:
          setup: ["A production in CLEARANCE with no assets (posture OPEN). Both writers hold the version read before either pin."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Two Pinners", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { pv_shared: $.data.version }
          trigger:
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "writer one", expected_production_version: "${pv_shared}" }
              as: ClearanceSupervisor
              captures: { chart1: $.data.id }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "writer two", expected_production_version: "${pv_shared}" }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { pv_fresh: $.data.version }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "writer two retry", expected_production_version: "${pv_fresh}" }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { chart2: $.data.id }
          assert:
            - "call 1 returns 201 with status PINNED and Production.${prod_id}.version == ${pv_shared} + 1"
            - "call 2 returns 412 ERR_STALE_PRODUCTION_VERSION; no second chart exists and ClearanceChart.${chart1}.status is still PINNED"
            - "${pv_fresh} == ${pv_shared} + 1"
            - "call 4 returns 201: ClearanceChart.${chart2}.status == PINNED and ClearanceChart.${chart1}.status == SUPERSEDED"
            - "GET /productions/${prod_id}/clearance-charts?status=PINNED returns exactly 1 row (${chart2})"

      - name: stale_license_version_blocks_the_counter_round
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.negotiation-round-stale-license
          - endpoints.POST_/licenses/{id}/negotiation-rounds
          - errors.ERR_STALE_LICENSE_VERSION
        distinguishing_aspect: "Each round overwrites current_proposed_fee_cents and bumps License.version, so a producer countering on the version read at licence creation — before the licensor's quote landed — must get 412 ERR_STALE_LICENSE_VERSION rather than silently discarding a quote it never saw."
        test_recipe:
          setup: ["A production in CLEARANCE with a 45-second footage asset, a SELECTED AVAILABLE candidate, an ACTIVE archive with the standard card, and a DRAFT licence whose creation version is captured."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Stale Counter", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Dawn skyline", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 300000, expected_license_version: "${v0}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "PRODUCER", proposed_fee_cents: 200000, expected_license_version: "${v0}" }
              as: ClearanceSupervisor
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { v1: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "PRODUCER", proposed_fee_cents: 200000, expected_license_version: "${v1}" }
              as: ClearanceSupervisor
          assert:
            - "call 1 returns 201: License.${lic_id}.status == QUOTED, current_proposed_fee_cents == 300000, round_count == 1, version == ${v0} + 1"
            - "call 2 returns 412 ERR_STALE_LICENSE_VERSION; current_proposed_fee_cents is still 300000 and round_count is still 1"
            - "${v1} == ${v0} + 1"
            - "call 4 returns 201: status == COUNTERED, current_proposed_fee_cents == 200000, round_count == 2, version == ${v0} + 2"
            - "rate_card_fee_cents stays 258750 throughout — negotiated proposals never rewrite the rate-card figure"

      - name: sweep_epoch_is_monotonic_across_repeated_checkpoints
        claim_type: ops_run_checkpoint
        grounds:
          - entities.Production.fields.sweep_epoch
          - endpoints.POST_/productions/{id}/rights-sweep
          - calculations.rights_sweep_epoch
        distinguishing_aspect: "The sweep is the domain's ops checkpoint: its epoch counter must increase by exactly one per invocation and be echoed in the response, and Production.version must advance with it, so three consecutive runs on an unchanged production read 1, 2, 3 with no gaps and no reuse."
        test_recipe:
          setup: ["Logical clock 2026-08-20. A production in CLEARANCE with no assets, freshly created, sweep_epoch 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ClearanceSupervisor
            - call: "POST /productions"
              payload: { title: "Checkpoint Walk", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { v_before: $.data.version, e_before: $.data.sweep_epoch }
          trigger:
            - call: "POST /productions/${prod_id}/rights-sweep"
              payload: {}
              as: ClearanceSupervisor
              captures: { e1: $.data.sweep_epoch }
            - call: "POST /productions/${prod_id}/rights-sweep"
              payload: {}
              as: ProductionAdmin
              captures: { e2: $.data.sweep_epoch }
            - call: "POST /productions/${prod_id}/rights-sweep"
              payload: {}
              as: ClearanceSupervisor
              captures: { e3: $.data.sweep_epoch }
          assert:
            - "${e_before} == 0 and Production.${prod_id}.sweep_epoch == 0 before any run"
            - "${e1} == 1, ${e2} == 2, ${e3} == 3 — strictly monotonic, one per invocation, whichever of the two permitted roles calls"
            - "Production.${prod_id}.version == ${v_before} + 3 — every checkpoint is a write"
            - "production_posture == OPEN and committed_fee_cents == 0 in all three responses (asset_count 0)"
            - "all six id lists are empty in every response"

      - name: five_hop_cascade_from_license_expiry
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / rights_sweep_expiry_cascades_five_hops_to_eo_remediation"
          rationale: "The end-to-end five-hop chain (licence -> asset -> posture -> delivered package -> bound E&O -> LOCKED production) and its ordering sensitivity are the named §1.8 instance."

      - name: both_fee_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / license_fee_festival_versus_all_media_window_variant"
          rationale: "Both window variants on identical inputs and the 235462-cent delta are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:

      - name: every_write_returns_its_recomputed_derived_fields_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.asset_clearance_rollup
          - calculations.production_committed_fee_ledger
          - calculations.production_clearance_posture
          - response_envelope
        distinguishing_aspect: "Consistency is immediate, so the licence-execution response and the very next read must already show every derived consequence — asset rollup, production ledger and posture — with no second sweep, no re-read delay and no interim inconsistent window."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second footage asset, a SELECTED AVAILABLE candidate, an ACTIVE archive with the standard card, and a QUOTED licence at 258750."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "No Lag", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Level crossing", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 258750, expected_license_version: "${lic_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
          trigger:
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: ClearanceSupervisor
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
          assert:
            - "the execution response itself is the envelope { data: License } with status EXECUTED and executed_fee_cents == 258750"
            - "the immediately following GET /assets/${asset_id} shows licensing_status CLEARED and rights_basis LICENSED — no sweep was run in between"
            - "the immediately following GET /productions/${prod_id} shows committed_fee_cents == 258750, cleared_asset_count == 1, open_asset_count == 0 and posture == OPEN"
            - "no field required a second read to settle: the same values are returned by a repeated GET with no intervening write"
            - "error responses in this instance's siblings use the { error: { id, message } } envelope, never a bare string"
