        distinguishing_aspect: |
          ForeclosureCase runs the cycle SALE_SCHEDULED -> SOLD -> (void) ->
          NOTS_RECORDED -> SALE_SCHEDULED with divergent side effects per leg
          (close settles registrations and disbursements; void reverses them);
          distinct entity from the AuctionSale self-loop instance.
        test_recipe:
