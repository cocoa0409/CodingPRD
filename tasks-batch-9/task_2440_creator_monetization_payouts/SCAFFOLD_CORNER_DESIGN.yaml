              as: FinanceOperator
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_MISSING_REQUIRED_FIELD'"
            - "GET /monetization/revenue-events: total_count == 0"

      - name: field_shape_check_outranks_retired_product_state
        claim_type: priority_conflict
        grounds:
          - "validations[priority 7]"
          - "validations[priority 17]"
        distinguishing_aspect: "PATCHing a RETIRED product with the string \"6000\" violates both the type rule at 7 and the frozen-terms rule at 17; the response is 422 ERR_INVALID_FIELD_VALUE, not 409 ERR_PRODUCT_ALREADY_RETIRED."
        test_recipe:
          setup: ["One product that has been retired after creation."]
          setup_api_calls:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "SUBSCRIPTIONS", name: "Memberships", creator_share_bps: 7000, platform_fee_bps: 3000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { prod: "$.data.id", prod_v1: "$.data.version" }
            - call: "POST /monetization/revenue-products/${prod}/retire"
