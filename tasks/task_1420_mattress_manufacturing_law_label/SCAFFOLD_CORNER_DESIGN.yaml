# =============================================================================
# §1.9 Scaffold Corner Design — mattress-law-label
# Breadth coverage of §1.1–§1.7 claims not covered by §1.8. Sections and
# claim_type values follow references/claim-extraction-guide.md. Names are
# unique across BOTH design files. `excluded_because:` stubs cite §1.8
# instances that already cover the corner.
# Role ids: PlantManager pm-1, ComplianceOfficer co-1 (creator) / co-2
# (approver), LineSupervisor ls-1, QcInspector qc-1, LogisticsCoordinator
# log-1. Default logical clock (unset): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: retailer_creation_defaults_and_computed_balance
        claim_type: creation
        grounds: ["entities.Retailer.fields.credit_balance_cents", "endpoints.POST_/plant/retailers"]
        distinguishing_aspect: "A new retailer is created with credit_balance_cents computed to 0 (never client-settable) and version 1; input fields echo back."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: false, credit_limit_cents: 500000 }, as: PlantManager, captures: { r_id: $.data.id, bal: $.data.credit_balance_cents, ver: $.data.version, ds: $.data.drop_ship_enabled } }
          assert:
            - "${bal} == 0"
            - "${ver} == 1"
            - "${ds} == true"

      - name: model_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MODEL_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent modelId returns ERR_MODEL_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/models/00000000-0000-0000-0000-000000000000", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MODEL_NOT_FOUND"

      - name: bom_line_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_VALIDATION_FAILED]", "validations[priority=4]", "entities.BomLine.fields.unit_cost_cents"]
        distinguishing_aspect: "Omitting required unit_cost_cents on BomLine create fails with ERR_VALIDATION_FAILED before any state or business check."
        test_recipe:
          setup: ["model in DRAFT"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-RQ1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION_FAILED"

      - name: certificate_inverted_dates_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.ComplianceCertificate.fields.expires_on"]
        distinguishing_aspect: "expires_on strictly before issued_on is rejected with ERR_VALIDATION_FAILED even though both timestamps are individually well-formed."
        test_recipe:
          setup: ["model in CERT_REVIEW (one BomLine, submitted)"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-TC1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "PROP65_CA", jurisdiction_state_code: "CA", issued_on: "2027-01-01T00:00:00Z", expires_on: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION_FAILED"

      - name: foam_batch_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.FoamBatch.fields.foam_density_class"]
        distinguishing_aspect: "foam_density_class outside {STANDARD, HIGH_DENSITY, MEMORY} is rejected with ERR_VALIDATION_FAILED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "GEL_SUPER", poured_mass_kg: 100, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION_FAILED"

      - name: unit_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET_/plant/units"]
        distinguishing_aspect: "GET /plant/units with limit 2 over 4 manufactured units returns exactly 2 rows with total_count 4 and has_more true, per the fixed response envelope."
        test_recipe:
          setup:
            - "COMPLETE order with quantity 4 (units u1..u4 MANUFACTURED)"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-PG1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 4, unit_price_cents: 200000, foam_mass_required_kg: 40, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
          trigger:
            - { call: "GET /plant/units", payload: { limit: 2, offset: 0 }, as: PlantManager }
          assert:
            - "response envelope data length == 2"
            - "total_count == 4"
            - "has_more == true"

      - name: credit_adjustment_immutable_ledger_entry
        claim_type: immutability
        grounds: ["entities.CreditAdjustment"]
        distinguishing_aspect: "CreditAdjustment has common_fields false: ledger entries expose id and created_at but no version and no updated_at, and no update/delete endpoint exists for them."
        test_recipe:
          setup: ["retailer with one manual adjustment"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /plant/retailers/${r_id}/credit-adjustments", payload: { amount_cents: 5000, reason: "promo", expected_retailer_version: "${r_v}" }, as: PlantManager }
          trigger:
            - { call: "GET /plant/retailers/${r_id}/credit-adjustments", payload: {}, as: PlantManager, captures: { a_src: "$.data[0].source", a_amt: "$.data[0].amount_cents" } }
          assert:
            - "${a_src} == MANUAL"
            - "${a_amt} == 5000"
            - "ledger entry JSON has no `version` key and no `updated_at` key"

      - name: model_create_response_immediate_consistency
        claim_type: system_fields
        grounds: ["entities.MattressModel.fields.status", "entities.MattressModel.fields.bom_cost_cents"]
        distinguishing_aspect: "Immediate consistency: the POST /plant/models response itself shows status DRAFT, bom_cost_cents 0, version 1 — no re-read needed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/models", payload: { model_code: "SRT-IC1", quilt_pattern: "ZIGZAG" }, as: PlantManager, captures: { st: $.data.status, cost: $.data.bom_cost_cents, ver: $.data.version } }
          assert:
            - "${st} == DRAFT"
            - "${cost} == 0"
            - "${ver} == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: certify_cured_from_poured_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FoamBatch", "errors[ERR_BATCH_NOT_CURING]"]
        distinguishing_aspect: "certify-cured on a POURED batch (never entered CURING) fails with ERR_BATCH_NOT_CURING; no fields change."
        test_recipe:
          setup: ["batch POURED"]
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BATCH_NOT_CURING"
            - "FoamBatch.${b_id}.status == POURED"

      - name: shipment_deliver_from_created_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Shipment", "errors[ERR_SHIPMENT_NOT_DISPATCHED]"]
        distinguishing_aspect: "deliver on a CREATED (never dispatched) shipment fails with ERR_SHIPMENT_NOT_DISPATCHED; units stay MANUFACTURED."
        test_recipe:
          setup:
            - "COMPLETE order with unit u1 MANUFACTURED; shipment s CREATED for u1"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-SM1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "GET /plant/units", payload: {}, as: PlantManager, captures: { u1: "$.data[0].id" } }
            - { call: "POST /plant/shipments", payload: { order_id: "${o_id}", unit_ids: ["${u1}"] }, as: LogisticsCoordinator, as_user_id: log-1, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /plant/shipments/${s_id}/deliver", payload: {}, as: LogisticsCoordinator, as_user_id: log-1, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SHIPMENT_NOT_DISPATCHED"
            - "MattressUnit.${u1}.status == MANUFACTURED"

      - name: claim_pay_from_filed_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WarrantyClaim", "errors[ERR_CLAIM_NOT_APPROVED]"]
        distinguishing_aspect: "pay on a FILED (not yet APPROVED) claim fails with ERR_CLAIM_NOT_APPROVED; no CreditAdjustment is created."
        test_recipe:
          setup:
            - "FILED claim for a delivered unit"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-SM2", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "GET /plant/units", payload: {}, as: PlantManager, captures: { u1: "$.data[0].id" } }
            - { call: "POST /plant/shipments", payload: { order_id: "${o_id}", unit_ids: ["${u1}"] }, as: LogisticsCoordinator, as_user_id: log-1, captures: { s_id: $.data.id } }
            - { call: "POST /plant/shipments/${s_id}/dispatch", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/shipments/${s_id}/deliver", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u1}", retailer_id: "${r_id}", claim_type: "WORKMANSHIP", measured_sag_inches: 0.5 }, as: Retailer, as_user_id: "${r_id}", captures: { cl1: $.data.id } }
          trigger:
            - { call: "POST /plant/warranty-claims/${cl1}/pay", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
            - { call: "GET /plant/retailers/${r_id}/credit-adjustments", payload: {}, as: PlantManager }
          assert:
            - "${err} == ERR_CLAIM_NOT_APPROVED"
            - "GET credit-adjustments returns total_count == 0"
            - "Retailer.${r_id}.credit_balance_cents == 0"

      - name: label_activate_from_generated_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LawLabel", "errors[ERR_LABEL_NOT_APPROVED]"]
        distinguishing_aspect: "activate on a GENERATED (unapproved) label fails with ERR_LABEL_NOT_APPROVED — approval is a mandatory intermediate state."
        test_recipe:
          setup: ["CERTIFIED model; PUBLISHED CA spec; label GENERATED (not approved)"]
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-SM3", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
