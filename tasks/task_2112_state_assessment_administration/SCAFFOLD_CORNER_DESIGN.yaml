          - errors[ERR_CUSTODY_CHAIN_BROKEN]
          - validations[priority=12]
        distinguishing_aspect: >-
          The RETURN_TO_DISTRICT edge is conditional on the school bucket emptying: a
          return of 6 out of 10 is rejected with ERR_CUSTODY_CHAIN_BROKEN and the lot stays
          IN_DISTRIBUTION with quantity_at_school still 10.
        test_recipe:
          setup:
            - "One district, school and window with a 10-booklet lot received and transferred whole to the school."
