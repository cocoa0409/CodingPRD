              as: QualityInspector
              as_user_id: "insp-1"
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_v2: $.data.version }
            - call: "POST /mfg/lining-inspections"
