# =============================================================================
# Cashback & Receipt-Rebate Rewards (Rakuten / Ibotta style) — seed tables
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  504. Cashback & Receipt-Rebate Rewards (Rakuten/Ibotta style): linked-offer &
  receipt-scan rebate, per-merchant rate & click tracking, pending->available->paid
  lifecycle, threshold cash-out (PayPal/check/gift card), referral & bonus streak,
  return clawback/expiration, in-store vs online attribution, double-dip rule

domain_name: receipt-rebate-rewards
api_prefix: ""
# Flat top-level resource collections (/merchants, /offers, /members, /clickthroughs,
# /receipt-scans, /reward-claims, /cashouts, /referrals, /return-events,
# /ledger-entries); api_prefix is empty so each collection sits at the root.

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # online vs in-store attribution; gross vs net balance
    - rate_threshold_triggers       # per-method cash-out minimums; maturity / attribution windows
    - cascading_side_effects        # return -> clawback -> ledger -> wallet -> cashout reversal
    - optimistic_concurrency        # cash-out create against a stale Member wallet version
    - derived_field_reconciliation  # Member wallet balances derived from LedgerEntry log

  entity_topology: flat
  # Member is the path-prefix anchor for member-owned sub-resources, but Merchant,
  # Offer, ClickThrough, ReceiptScan, RewardClaim, CashOut, Referral, BonusStreak,
  # LedgerEntry, ReturnEvent are peers linked by foreign keys (no deep URL nesting).

  state_machine_shape: parallel
  # RewardClaim: branching with multiple terminal exits + cross-entity guards.
  # ReceiptScan: cyclic (REJECTED -> IN_REVIEW resubmit loop).
  # CashOut: cyclic (FAILED -> REQUESTED retry loop).
  # Referral: branching.
  # Member: parallel dimensions (account_status x verification_status).

  relationship_patterns:
    - one_to_many       # Merchant -> Offer; Member -> RewardClaim / LedgerEntry / CashOut
    - cross_aggregate   # RewardClaim references Offer, Merchant, ClickThrough, ReceiptScan
    - self_referential  # Referral references referrer Member and referee Member

  role_model: peer_roles
  # Member owns its own claims/cashouts; ReviewAgent reviews receipts; FinanceAdmin
  # runs payout batches & clawbacks; PlatformAdmin configures merchants/offers.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1) — 11 entities
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Merchant display name" }
      - { name: online_rate_bps, type: integer, source: input, description: "Base cashback rate for ONLINE (click-attributed) purchases, in basis points (100 bps = 1.00%)", constraints: "0..10000" }
      - { name: instore_rate_bps, type: integer, source: input, description: "Base cashback rate for IN_STORE (receipt-attributed) purchases, in basis points", constraints: "0..10000" }
      - { name: attribution_window_hours, type: integer, source: input, description: "Hours after a ClickThrough during which an online purchase is still click-attributable", default: 168, constraints: ">= 1" }
      - { name: double_dip_allowed, type: boolean, source: input, description: "If true, a single qualifying purchase may earn BOTH a click-attributed reward and a receipt-rebate offer reward; if false the two are mutually exclusive", default: false }
      - { name: maturity_hold_days, type: integer, source: input, description: "Days a RewardClaim stays PENDING before it auto-matures to AVAILABLE (return window)", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED — DISABLED merchants reject new claims", default: ACTIVE, constraints: "ACTIVE, DISABLED" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the merchant this offer belongs to" }
      - { name: offer_type, type: enum, source: input, description: "LINKED (click-attributed bonus rate) | RECEIPT_REBATE (flat rebate when scanned receipt contains the item)", constraints: "LINKED, RECEIPT_REBATE" }
      - { name: bonus_rate_bps, type: integer, source: input, description: "For LINKED offers: extra basis points stacked on the merchant ONLINE base rate", default: 0, constraints: "0..10000" }
      - { name: rebate_cents, type: integer, source: input, description: "For RECEIPT_REBATE offers: flat rebate amount in cents per qualifying receipt", default: 0, constraints: ">= 0" }
      - { name: min_spend_cents, type: integer, source: input, description: "Minimum purchase amount (cents) required for this offer to apply", default: 0, constraints: ">= 0" }
      - { name: starts_at, type: datetime, source: input, description: "Offer activation instant (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Offer expiry instant; claims attributed after this instant are ineligible (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED — EXPIRED set by clock crossing expires_at", default: ACTIVE, constraints: "ACTIVE, EXPIRED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email (unique)" }
      - { name: referred_by_member_id, type: string, source: input, required: false, description: "FK -> Member.id; the referrer who invited this member, if any" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED — parallel dimension; SUSPENDED blocks cash-out creation", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED — parallel dimension; cash-out requires VERIFIED", default: UNVERIFIED, constraints: "UNVERIFIED, VERIFIED" }
      - { name: pending_balance_cents, type: integer, source: computed, description: "Sum of amount_cents of RewardClaim in PENDING (claims not yet matured)" }
      - { name: available_balance_cents, type: integer, source: computed, description: "gross_available_cents = sum of amount_cents of RewardClaim in AVAILABLE; this is the gross figure including amounts already RESERVED by an open CashOut" }
      - { name: reserved_balance_cents, type: integer, source: computed, description: "Sum of amount_cents of RewardClaim in RESERVED (locked by a CashOut in REQUESTED or PROCESSING)" }
      - { name: net_cashoutable_cents, type: integer, source: computed, description: "available_balance_cents - reserved_balance_cents; the net figure a new CashOut may draw against" }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of amount_cents of RewardClaim in PAID" }

  - name: ClickThrough
    parent: null
    common_fields: false   # append-only event: carries only id + created_at
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member who clicked the affiliate link" }
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the merchant clicked through to" }
      - { name: offer_id, type: string, source: input, required: false, description: "FK -> Offer.id; the LINKED offer in context at click time, if any" }
      - { name: clicked_at, type: datetime, source: system, description: "Logical-clock instant the click was recorded (ISO 8601 UTC); copied from current clock" }

  - name: ReceiptScan
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member who uploaded the receipt" }
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the merchant the receipt is from" }
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; the RECEIPT_REBATE offer being claimed" }
      - { name: purchase_total_cents, type: integer, source: input, description: "Receipt grand total in cents", constraints: ">= 0" }
      - { name: purchased_at, type: datetime, source: input, description: "Purchase instant printed on the receipt (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> IN_REVIEW -> APPROVED / REJECTED; REJECTED can resubmit back to IN_REVIEW", default: SUBMITTED, constraints: "SUBMITTED, IN_REVIEW, APPROVED, REJECTED" }
      - { name: review_note, type: string, source: input, required: false, description: "ReviewAgent note recorded on approve/reject" }
      - { name: reward_claim_id, type: string, source: computed, required: false, description: "FK -> RewardClaim.id; the claim spawned on APPROVED (null until approved)" }

  - name: RewardClaim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the earning member" }
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the merchant the reward is for" }
      - { name: offer_id, type: string, source: input, required: false, description: "FK -> Offer.id; the offer applied, if any" }
      - { name: click_through_id, type: string, source: input, required: false, description: "FK -> ClickThrough.id; the click for ONLINE attribution, if online" }
      - { name: receipt_scan_id, type: string, source: input, required: false, description: "FK -> ReceiptScan.id; the receipt for IN_STORE attribution, if in-store" }
      - { name: attribution, type: enum, source: system, description: "ONLINE (click-attributed) | IN_STORE (receipt-attributed) — fixes which rate variant computed amount_cents", constraints: "ONLINE, IN_STORE" }
      - { name: purchase_amount_cents, type: integer, source: input, description: "Qualifying purchase amount in cents that the reward is computed from", constraints: ">= 0" }
      - { name: amount_cents, type: integer, source: computed, description: "Reward amount in cents per reward_amount_computation (locked at creation, not recomputed later)" }
      - { name: status, type: enum, source: system, description: "PENDING -> AVAILABLE -> RESERVED -> PAID; plus CLAWED_BACK and EXPIRED terminal exits", default: PENDING, constraints: "PENDING, AVAILABLE, RESERVED, PAID, CLAWED_BACK, EXPIRED" }
      - { name: matures_at, type: datetime, source: computed, description: "created_at + merchant.maturity_hold_days; PENDING claim auto-matures to AVAILABLE at/after this instant" }
      - { name: expires_at, type: datetime, source: computed, description: "matures_at + AVAILABLE_EXPIRY_DAYS; AVAILABLE claim auto-expires if not cashed out by this instant" }
      - { name: cashout_id, type: string, source: system, required: false, description: "FK -> CashOut.id; the cash-out that reserved/paid this claim (null until reserved)" }

  - name: CashOut
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the cashing-out member" }
      - { name: method, type: enum, source: input, description: "PAYPAL | CHECK | GIFT_CARD — sets the minimum threshold and fee schedule", constraints: "PAYPAL, CHECK, GIFT_CARD" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Gross amount the member wants to cash out (cents); must be <= net_cashoutable_cents and >= method minimum", constraints: ">= 1" }
      - { name: fee_cents, type: integer, source: computed, description: "Processing fee per cashout_payout_and_fee" }
      - { name: net_payout_cents, type: integer, source: computed, description: "requested_amount_cents - fee_cents; what the member actually receives" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> PROCESSING -> PAID / FAILED; FAILED can retry back to REQUESTED", default: REQUESTED, constraints: "REQUESTED, PROCESSING, PAID, FAILED" }
      - { name: expected_member_version, type: integer, source: input, description: "OCC: the Member.version the client last observed; the create is rejected if it has advanced" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_member_id, type: string, source: input, description: "FK -> Member.id; the member who sent the invite" }
      - { name: referee_email, type: string, source: input, description: "Email the invite was sent to" }
      - { name: referee_member_id, type: string, source: system, required: false, description: "FK -> Member.id; set when the invitee signs up" }
      - { name: referee_qualifying_cents, type: integer, source: input, description: "Cumulative AVAILABLE/PAID reward cents the referee must reach for the referral to QUALIFY", default: 1000, constraints: ">= 0" }
      - { name: bonus_cents, type: integer, source: input, description: "Bonus paid to the referrer (and referee) when the referral is REWARDED", default: 500, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "INVITED -> SIGNED_UP -> QUALIFIED -> REWARDED; INVITED -> EXPIRED", default: INVITED, constraints: "INVITED, SIGNED_UP, QUALIFIED, REWARDED, EXPIRED" }

  - name: BonusStreak
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member whose activity streak this tracks (one per member)" }
      - { name: current_streak_weeks, type: integer, source: computed, description: "Consecutive weekly periods (Mon-Sun UTC) in which the member earned >= 1 AVAILABLE/PAID claim", default: 0 }
      - { name: longest_streak_weeks, type: integer, source: computed, description: "Maximum current_streak_weeks ever reached", default: 0 }
      - { name: last_activity_week_index, type: integer, source: computed, required: false, description: "Week index (weeks since 1970-01-05 Monday epoch, UTC) of the most recent qualifying claim" }
      - { name: pending_streak_bonus_cents, type: integer, source: computed, description: "Streak bonus accrued but not yet credited per streak_bonus_computation" }

  - name: LedgerEntry
    parent: Member
    common_fields: false   # append-only audit log: carries only id + created_at
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member whose wallet this entry moves" }
      - { name: entry_type, type: enum, source: system, description: "CLAIM_PENDING | CLAIM_MATURED | CLAIM_CLAWBACK | CLAIM_EXPIRED | CASHOUT_DEBIT | CASHOUT_REVERSAL | REFERRAL_BONUS | STREAK_BONUS", constraints: "CLAIM_PENDING, CLAIM_MATURED, CLAIM_CLAWBACK, CLAIM_EXPIRED, CASHOUT_DEBIT, CASHOUT_REVERSAL, REFERRAL_BONUS, STREAK_BONUS" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount (cents) this entry moves; sign convention pinned per entry_type in wallet_balance_reconciliation" }
      - { name: reward_claim_id, type: string, source: system, required: false, description: "FK -> RewardClaim.id; the claim this entry references, if any" }
      - { name: cashout_id, type: string, source: system, required: false, description: "FK -> CashOut.id; the cash-out this entry references, if any" }
      - { name: referral_id, type: string, source: system, required: false, description: "FK -> Referral.id; the referral this entry references, if any" }

  - name: ReturnEvent
    parent: null
    common_fields: false   # append-only event: carries only id + created_at
    fields:
      - { name: reward_claim_id, type: string, source: input, description: "FK -> RewardClaim.id; the claim whose underlying purchase was returned" }
      - { name: returned_amount_cents, type: integer, source: input, description: "Amount of the purchase that was returned in cents (full or partial)", constraints: ">= 1" }
      - { name: clawback_cents, type: integer, source: computed, description: "Reward cents reversed by this return per clawback_amount" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant the return was reported (ISO 8601 UTC)" }

# =============================================================================
# Table 2: State Machine Table (§1.2) — 5 machines
# =============================================================================
state_machines:
  # ----- Member: PARALLEL dimensions (account_status x verification_status) ---
  - entity: Member
    note: "Two independent state dimensions evolve on the same row; combined gating is the product of both."
    dimensions:
      - field: verification_status
        initial_state: UNVERIFIED
        terminal_states: []
        transitions:
          - from: UNVERIFIED
            to: VERIFIED
            trigger: "POST /members/{id}/verify"
            actor: FinanceAdmin
            preconditions: []
            side_effects:
              - "increments Member.version by 1"
      - field: account_status
        initial_state: ACTIVE
        terminal_states: []
        transitions:
          - from: ACTIVE
            to: SUSPENDED
            trigger: "POST /members/{id}/suspend"
            actor: FinanceAdmin
            preconditions: []
            side_effects:
              - "Any RewardClaim in RESERVED for this member that is locked by a REQUESTED CashOut is left intact; the CashOut may still be processed"
              - "increments Member.version by 1"
          - from: SUSPENDED
            to: ACTIVE
            trigger: "POST /members/{id}/reinstate"
            actor: FinanceAdmin
            preconditions: []
            side_effects:
              - "increments Member.version by 1"

  # ----- ReceiptScan: CYCLIC (REJECTED -> IN_REVIEW resubmit loop) -----------
  - entity: ReceiptScan
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /receipt-scans/{id}/start-review"
        actor: ReviewAgent
        preconditions:
          - "Offer.status == ACTIVE and current clock is within [Offer.starts_at, Offer.expires_at] (else ERR_OFFER_INACTIVE)"
        side_effects: ["increments ReceiptScan.version by 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /receipt-scans/{id}/approve"
        actor: ReviewAgent
        preconditions:
          - "ReceiptScan.purchase_total_cents >= Offer.min_spend_cents (else ERR_MIN_SPEND_NOT_MET)"
          - "Member.account_status == ACTIVE (else ERR_MEMBER_SUSPENDED)"
          - "If Merchant.double_dip_allowed == false: no existing non-clawed RewardClaim with ONLINE attribution exists for the same member+merchant whose ClickThrough.clicked_at is within 24h of ReceiptScan.purchased_at (else ERR_DOUBLE_DIP_BLOCKED)"
        side_effects:
          - "Creates a RewardClaim (attribution=IN_STORE, status=PENDING) for this member/merchant/offer; amount_cents per reward_amount_computation IN_STORE variant — CASCADE step 1"
          - "That new RewardClaim emits a LedgerEntry(entry_type=CLAIM_PENDING) — CASCADE step 2"
          - "ReceiptScan.reward_claim_id := new claim id"
          - "increments ReceiptScan.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /receipt-scans/{id}/reject"
        actor: ReviewAgent
        preconditions: []
        side_effects: ["records review_note", "increments ReceiptScan.version by 1"]
      - from: REJECTED
        to: IN_REVIEW
        trigger: "POST /receipt-scans/{id}/start-review (resubmit)"
        actor: ReviewAgent
        preconditions:
          - "Offer.status == ACTIVE and current clock is within [Offer.starts_at, Offer.expires_at] (else ERR_OFFER_INACTIVE)"
        side_effects: ["increments ReceiptScan.version by 1"]
        note: "Cycle: a rejected receipt may be re-reviewed."

  # ----- RewardClaim: BRANCHING + cross-entity guards, multiple terminal exits
  - entity: RewardClaim
    initial_state: PENDING
    terminal_states: [PAID, CLAWED_BACK, EXPIRED]
    transitions:
      - from: PENDING
        to: AVAILABLE
        trigger: "system: clock reaches matures_at (fired by POST /_clock/set_current_utc) or POST /reward-claims/{id}/mature"
        actor: system
        preconditions:
          - "current clock >= RewardClaim.matures_at"
        side_effects:
          - "Emits LedgerEntry(entry_type=CLAIM_MATURED, +amount_cents)"
          - "Member.pending_balance_cents decreases, available_balance_cents increases (derived via wallet_balance_reconciliation)"
          - "Recomputes the owning member's BonusStreak (a now-AVAILABLE claim may extend current_streak_weeks) — CASCADE"
          - "increments RewardClaim.version by 1"
      - from: PENDING
        to: CLAWED_BACK
        trigger: "system: POST /return-events on this claim before maturity"
        actor: FinanceAdmin
        preconditions:
          - "A ReturnEvent references this claim"
        side_effects:
          - "Emits LedgerEntry(entry_type=CLAIM_CLAWBACK, -clawback_cents)"
          - "Member.pending_balance_cents decreases by clawback_cents"
          - "increments RewardClaim.version by 1"
      - from: AVAILABLE
        to: RESERVED
        trigger: "system: POST /cashouts reserves this claim"
        actor: system
        preconditions:
          - "Claim is AVAILABLE and not already reserved by another CashOut"
        side_effects:
          - "RewardClaim.cashout_id := the new CashOut id"
          - "Member.reserved_balance_cents increases, net_cashoutable_cents decreases"
          - "increments RewardClaim.version by 1"
      - from: AVAILABLE
        to: CLAWED_BACK
        trigger: "system: POST /return-events on this claim after maturity but before reservation"
        actor: FinanceAdmin
        preconditions:
          - "A ReturnEvent references this claim and claim is AVAILABLE (not RESERVED/PAID)"
        side_effects:
          - "Emits LedgerEntry(entry_type=CLAIM_CLAWBACK, -clawback_cents)"
          - "Member.available_balance_cents decreases by clawback_cents — CASCADE step: this may drop net_cashoutable_cents below an open CashOut's reserved set is impossible because AVAILABLE (unreserved) claims are clawed here"
          - "increments RewardClaim.version by 1"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system: clock reaches expires_at (fired by POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current clock >= RewardClaim.expires_at and claim still AVAILABLE (unreserved)"
        side_effects:
          - "Emits LedgerEntry(entry_type=CLAIM_EXPIRED, -amount_cents)"
          - "Member.available_balance_cents decreases by amount_cents"
          - "increments RewardClaim.version by 1"
      - from: RESERVED
        to: PAID
        trigger: "system: parent CashOut transitions PROCESSING -> PAID"
        actor: system
        preconditions:
          - "Owning CashOut.status transitioning to PAID"
        side_effects:
          - "Member.reserved_balance_cents decreases, lifetime_paid_cents increases"
          - "increments RewardClaim.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: parent CashOut transitions PROCESSING -> FAILED (or REQUESTED -> cancelled-by-failure)"
        actor: system
        preconditions:
          - "Owning CashOut moved to FAILED"
        side_effects:
          - "RewardClaim.cashout_id := null; claim returns to AVAILABLE"
          - "Member.reserved_balance_cents decreases, net_cashoutable_cents increases"
          - "increments RewardClaim.version by 1"
      - from: RESERVED
        to: CLAWED_BACK
        trigger: "system: POST /return-events on a RESERVED claim"
        actor: FinanceAdmin
        preconditions:
          - "A ReturnEvent references this claim and claim is RESERVED by a CashOut still in REQUESTED/PROCESSING"
        side_effects:
          - "Emits LedgerEntry(entry_type=CLAIM_CLAWBACK, -clawback_cents)"
          - "The owning CashOut transitions to FAILED — CASCADE step 1 (cross-entity)"
          - "All OTHER claims reserved by that CashOut revert RESERVED -> AVAILABLE — CASCADE step 2"
          - "Member.reserved_balance_cents and available_balance_cents recomputed — CASCADE step 3"
          - "increments RewardClaim.version by 1"

  # ----- CashOut: CYCLIC (FAILED -> REQUESTED retry loop) --------------------
  - entity: CashOut
    initial_state: REQUESTED
    terminal_states: [PAID]
    transitions:
      - from: REQUESTED
        to: PROCESSING
        trigger: "POST /cashouts/{id}/process"
        actor: FinanceAdmin
        preconditions:
          - "Member.account_status == ACTIVE (else ERR_MEMBER_SUSPENDED)"
          - "Member.verification_status == VERIFIED (else ERR_MEMBER_NOT_VERIFIED)"
        side_effects: ["increments CashOut.version by 1"]
      - from: PROCESSING
        to: PAID
        trigger: "POST /cashouts/{id}/settle (outcome=PAID)"
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "Emits LedgerEntry(entry_type=CASHOUT_DEBIT, -requested_amount_cents)"
          - "All claims with cashout_id == this id transition RESERVED -> PAID — CASCADE (cross-entity)"
          - "Member.reserved_balance_cents decreases, lifetime_paid_cents increases"
          - "increments CashOut.version by 1"
      - from: PROCESSING
        to: FAILED
        trigger: "POST /cashouts/{id}/settle (outcome=FAILED)"
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "All claims with cashout_id == this id revert RESERVED -> AVAILABLE; cashout_id cleared — CASCADE step 1 (cross-entity)"
          - "Member.reserved_balance_cents decreases, net_cashoutable_cents increases — CASCADE step 2"
          - "increments CashOut.version by 1"
      - from: FAILED
        to: REQUESTED
        trigger: "POST /cashouts/{id}/retry"
        actor: FinanceAdmin
        preconditions:
          - "Member.net_cashoutable_cents >= CashOut.requested_amount_cents at retry time (else ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Re-reserves AVAILABLE claims up to requested_amount_cents (oldest created_at first); each RewardClaim AVAILABLE -> RESERVED — CASCADE"
          - "Member.reserved_balance_cents increases, net_cashoutable_cents decreases"
          - "increments CashOut.version by 1"
        note: "Cycle: a failed cash-out can be retried, re-entering the lifecycle."

  # ----- Referral: BRANCHING -------------------------------------------------
  - entity: Referral
    initial_state: INVITED
    terminal_states: [REWARDED, EXPIRED]
    transitions:
      - from: INVITED
        to: SIGNED_UP
        trigger: "system: a Member registers with referred_by_member_id == referrer and email == referee_email"
        actor: system
        preconditions:
          - "No existing Referral for this referee_email already SIGNED_UP/QUALIFIED/REWARDED"
        side_effects:
          - "Referral.referee_member_id := new member id"
          - "increments Referral.version by 1"
      - from: SIGNED_UP
        to: QUALIFIED
        trigger: "system: referee's cumulative (AVAILABLE+PAID) reward cents reaches referee_qualifying_cents"
        actor: system
        preconditions:
          - "referee_member_id is set and its cumulative qualifying cents >= referee_qualifying_cents"
        side_effects: ["increments Referral.version by 1"]
      - from: QUALIFIED
        to: REWARDED
        trigger: "POST /referrals/{id}/reward"
        actor: FinanceAdmin
        preconditions:
          - "Referral.status == QUALIFIED"
        side_effects:
          - "Creates a RewardClaim(attribution=ONLINE, amount_cents=bonus_cents, status=AVAILABLE) for the REFERRER — CASCADE step 1"
          - "That claim emits LedgerEntry(entry_type=REFERRAL_BONUS, +bonus_cents) — CASCADE step 2"
          - "Member.available_balance_cents for the referrer increases by bonus_cents — CASCADE step 3"
          - "increments Referral.version by 1"
      - from: INVITED
        to: EXPIRED
        trigger: "system: clock reaches created_at + REFERRAL_EXPIRY_DAYS without sign-up"
        actor: system
        preconditions:
          - "current clock >= created_at + REFERRAL_EXPIRY_DAYS and status still INVITED"
        side_effects: ["increments Referral.version by 1"]

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on Member.version
# =============================================================================
concurrency_rules:
  - rule_id: cashout-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /cashouts"
    occ_field: "expected_member_version"
    description: |
      Creating a CashOut against a Member whose version has advanced since the
      client last observed it is rejected with a stale-version error. A CashOut
      reserves AVAILABLE claims up to requested_amount_cents; if another writer
      has, in the interim, matured/clawed/expired claims or opened a competing
      CashOut, the Member.version has advanced and the reservation the client
      believes it is making against net_cashoutable_cents is computed from a
      stale view. The OCC check on Member.version forces the client to re-read
      before reserving.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3) — 6 calculations
# =============================================================================
calculations:
  # --- Rule 1 dual-variant instance #1 (RewardClaim domain) ; Rule 2 mode (a) -
  - name: reward_amount_computation
    trigger: "RewardClaim creation (online claim via POST /reward-claims, or in-store claim cascaded from ReceiptScan approve, or referral bonus claim)"
    algorithm: tiered_pricing
    formula: |
      effective_rate_bps and rebate are chosen by attribution (>=3 inputs:
      attribution, merchant rates, offer fields, double_dip flag):

      ONLINE attribution (purchase qualified via ClickThrough within
      merchant.attribution_window_hours of clicked_at):
        base = merchant.online_rate_bps
        if offer present and offer.offer_type == LINKED and purchase_amount_cents >= offer.min_spend_cents:
          rate_bps = base + offer.bonus_rate_bps      # linked-offer stack
        else:
          rate_bps = base
        rate_bps = min(rate_bps, RATE_CAP_BPS)         # non-linear cap
        amount_cents = floor(purchase_amount_cents * rate_bps / 10000)

      IN_STORE attribution (purchase qualified via approved ReceiptScan):
        if offer.offer_type == RECEIPT_REBATE and purchase_amount_cents >= offer.min_spend_cents:
          flat = offer.rebate_cents
        else:
          flat = 0
        pct  = floor(purchase_amount_cents * merchant.instore_rate_bps / 10000)
        amount_cents = min(flat + pct, purchase_amount_cents)   # never exceed spend (non-linear cap)
    input_set: "Single RewardClaim plus its Merchant and Offer; purchase_amount_cents is the qualifying spend."
    constants:
      RATE_CAP_BPS: 5000        # 50.00% hard cap on combined online rate
    precision: "integer cents; floor (truncate) on each percentage multiply BEFORE summing flat (per-component floor, then sum)"
    variants:
      - name: online_attributed
        when: "attribution == ONLINE"
        difference: "Uses merchant.online_rate_bps plus a LINKED offer's bonus_rate_bps, capped at RATE_CAP_BPS; ignores rebate_cents."
      - name: in_store_attributed
        when: "attribution == IN_STORE"
        difference: "Uses merchant.instore_rate_bps as a percentage PLUS a RECEIPT_REBATE flat rebate_cents, capped at purchase_amount_cents; ignores bonus_rate_bps."

  # --- Rule 1 dual-variant instance #2 (Member/wallet domain) ----------------
  - name: wallet_balance_reconciliation
    trigger: "Any LedgerEntry append, RewardClaim status change, or CashOut status change"
    algorithm: aggregation
    formula: |
      Two distinct balance views are derived from RewardClaim rows owned by the member:
        pending_balance_cents   = sum amount_cents WHERE status == PENDING
        gross_available_cents   = sum amount_cents WHERE status IN {AVAILABLE, RESERVED}
        reserved_balance_cents  = sum amount_cents WHERE status == RESERVED
        available_balance_cents = sum amount_cents WHERE status == AVAILABLE   # excludes RESERVED
        net_cashoutable_cents   = available_balance_cents                       # only unreserved AVAILABLE is drawable
        lifetime_paid_cents     = sum amount_cents WHERE status == PAID
      LedgerEntry sign convention (the audit mirror): CLAIM_PENDING / CLAIM_MATURED
      (informational, no net wallet move at maturity since it shifts PENDING->AVAILABLE),
      REFERRAL_BONUS / STREAK_BONUS are +amount; CLAIM_CLAWBACK / CLAIM_EXPIRED /
      CASHOUT_DEBIT are -amount; CASHOUT_REVERSAL is +amount.
    input_set: "All RewardClaim rows for the member; LedgerEntry log is the append-only audit mirror, NOT the source of the balance figures."
    precision: "integer cents; exact (no rounding)"
    variants:
      - name: gross_available
        when: "displayed as Member.available balance to the user"
        difference: "available_balance_cents counts ONLY status==AVAILABLE (unreserved); a separately reported gross_available_cents counts AVAILABLE+RESERVED."
      - name: net_cashoutable
        when: "computing how much a NEW CashOut may draw"
        difference: "net_cashoutable_cents == available_balance_cents (RESERVED claims are excluded), so an open CashOut shrinks the drawable amount even though gross_available is unchanged."

  # --- Rule 2 mode (c): circular-looking fee/payout (CashOut domain) ----------
  - name: cashout_payout_and_fee
    trigger: "CashOut creation"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED to break the circular look:
      STEP 1 (fee tier keyed on GROSS requested_amount_cents, NOT net):
        if method == PAYPAL:    pct_bps = 0;   flat = 0
        if method == CHECK:     pct_bps = 0;   flat = CHECK_FEE_CENTS
        if method == GIFT_CARD: pct_bps = 0;   flat = 0
        # PayPal/GiftCard percentage fee tier on gross:
        if method in {PAYPAL, GIFT_CARD}:
          if requested_amount_cents >= LARGE_CASHOUT_CENTS: pct_bps = 0          # large cash-outs fee-free
          else: pct_bps = SMALL_CASHOUT_FEE_BPS                                  # small cash-outs charged
      STEP 2 (fee from the tier chosen in STEP 1):
        fee_cents = flat + floor(requested_amount_cents * pct_bps / 10000)
      STEP 3:
        net_payout_cents = requested_amount_cents - fee_cents
      The "circular look": fee depends on the gross tier, net depends on fee; the
      pin is that the tier is keyed on GROSS requested_amount_cents (STEP 1), never
      on net_payout_cents — so the value is well-defined and order-independent only
      under this pinning.
    input_set: "Single CashOut: method and requested_amount_cents."
    constants:
      CHECK_FEE_CENTS: 200
      SMALL_CASHOUT_FEE_BPS: 200     # 2.00%
      LARGE_CASHOUT_CENTS: 5000      # $50.00; at/above this, PayPal & gift card are fee-free
    precision: "integer cents; floor on the percentage component"

  # --- Rule 2 mode (b): rounding-order pin (BonusStreak domain) --------------
  - name: streak_bonus_computation
    trigger: "RewardClaim PENDING->AVAILABLE maturity (recomputes the member's BonusStreak)"
    algorithm: weighted_scoring
    formula: |
      A week is the Mon-Sun UTC period; week_index = floor((days since 1970-01-05) / 7).
      current_streak_weeks = count of consecutive week_indexes (ending at the latest
      qualifying week) in which the member had >= 1 claim reach AVAILABLE.
      Per-week bonus uses PER-WEEK ROUNDING THEN SUM (pinned order):
        for each week w in the current streak:
          week_bonus_cents[w] = round_half_up( STREAK_BASE_CENTS * (1 + STREAK_GROWTH * (position_of_w - 1)) )
        pending_streak_bonus_cents = sum over w of week_bonus_cents[w]
      The rounding order is PINNED: round EACH week's bonus to whole cents FIRST,
      THEN sum. (sum-then-round would differ by up to a cent per week.)
    input_set: "All AVAILABLE/PAID RewardClaim rows for the member, bucketed by week_index."
    constants:
      STREAK_BASE_CENTS: 25
      STREAK_GROWTH: 0.5            # each additional consecutive week adds 50% of base to that week's bonus
    precision: "integer cents; round_half_up PER WEEK, then sum (order pinned)"

  # --- threshold / boundary precision (CashOut domain) -----------------------
  - name: cashout_threshold_eligibility
    trigger: "CashOut creation (validation)"
    algorithm: threshold
    formula: |
      min_cents = per-method minimum:
        PAYPAL    -> MIN_PAYPAL_CENTS
        CHECK     -> MIN_CHECK_CENTS
        GIFT_CARD -> MIN_GIFT_CARD_CENTS
      Eligible iff requested_amount_cents >= min_cents (INCLUSIVE: exactly min is OK)
      AND requested_amount_cents <= Member.net_cashoutable_cents (INCLUSIVE).
      Below min -> ERR_BELOW_CASHOUT_MINIMUM; above net -> ERR_INSUFFICIENT_BALANCE.
    input_set: "Single CashOut and the owning Member's net_cashoutable_cents."
    constants:
      MIN_PAYPAL_CENTS: 500       # $5.00
      MIN_CHECK_CENTS: 2500       # $25.00
      MIN_GIFT_CARD_CENTS: 1000   # $10.00
    precision: "integer cents; comparison is >= (inclusive at the minimum boundary)"

  # --- clawback amount (compensating; RewardClaim/ReturnEvent domain) --------
  - name: clawback_amount
    trigger: "POST /return-events"
    algorithm: aggregation
    formula: |
      A return reverses the PROPORTIONAL share of the reward:
        proportion = returned_amount_cents / claim.purchase_amount_cents   (clamped to [0,1])
        clawback_cents = ceil(claim.amount_cents * proportion)
      A full return (returned_amount_cents >= claim.purchase_amount_cents) claws back
      the ENTIRE amount_cents (clawback_cents == claim.amount_cents), guaranteeing the
      conservation invariant: original reward credit + clawback debit == 0 on full return.
    input_set: "Single RewardClaim and the ReturnEvent against it."
    precision: "integer cents; ceil (round up) so the platform never under-claws"

# =============================================================================
# Table 4: Validation Rules Table (§1.4 — ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced FKs (merchant_id, offer_id, member_id, reward_claim_id, click_through_id, receipt_scan_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /clickthroughs, POST /receipt-scans, POST /reward-claims, POST /cashouts, POST /return-events, POST /offers, POST /referrals"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative where constrained"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all POST

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Optimistic concurrency: expected_member_version matches current Member.version on cash-out creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cashouts"

  - priority: 8
    category: business_safety
    check: "Offer is ACTIVE and within [starts_at, expires_at] when attributing a claim or starting receipt review"
    error_id: ERR_OFFER_INACTIVE
    http_status: 409
    applies_to: "POST /reward-claims, POST /receipt-scans/{id}/start-review, POST /receipt-scans/{id}/approve"

  - priority: 9
    category: business_safety
    check: "Double-dip rule: when Merchant.double_dip_allowed == false, a member may not earn BOTH an online (click) and an in-store (receipt) reward for the same merchant within DOUBLE_DIP_WINDOW_HOURS"
    error_id: ERR_DOUBLE_DIP_BLOCKED
    http_status: 409
    applies_to: "POST /reward-claims, POST /receipt-scans/{id}/approve"

  - priority: 10
    category: business_temporal
    check: "Online attribution: a ClickThrough must exist for the member+merchant with clicked_at within merchant.attribution_window_hours before the claim, else the claim cannot be ONLINE-attributed"
    error_id: ERR_ATTRIBUTION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /reward-claims"

  - priority: 11
    category: business_safety
    check: "Member.account_status == ACTIVE for cash-out creation/processing"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /cashouts, POST /cashouts/{id}/process, POST /receipt-scans/{id}/approve"

  - priority: 12
    category: business_safety
    check: "Member.verification_status == VERIFIED to process a cash-out to payout"
    error_id: ERR_MEMBER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /cashouts/{id}/process"

  - priority: 13
    category: business_constraint
    check: "Receipt purchase_total_cents >= Offer.min_spend_cents on approve"
    error_id: ERR_MIN_SPEND_NOT_MET
    http_status: 409
    applies_to: "POST /receipt-scans/{id}/approve"

  - priority: 14
    category: business_fiscal
    check: "Cash-out requested_amount_cents >= per-method minimum (cashout_threshold_eligibility)"
    error_id: ERR_BELOW_CASHOUT_MINIMUM
    http_status: 422
    applies_to: "POST /cashouts"

  - priority: 15
    category: business_fiscal
    check: "Cash-out requested_amount_cents <= Member.net_cashoutable_cents (and on retry)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /cashouts, POST /cashouts/{id}/retry"

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5) — 31 endpoints
# =============================================================================
endpoints:
  # ----- Merchant -----------------------------------------------------------
  - method: POST
    path: "/merchants"
    description: "Create a merchant configuration"
    roles: [PlatformAdmin]
    code: 201
    input: [name, online_rate_bps, instore_rate_bps, "attribution_window_hours?", "double_dip_allowed?", "maturity_hold_days?"]
    output: Merchant
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/merchants/{id}"
    description: "Get a merchant"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: GET
    path: "/merchants"
    description: "List merchants (paginated)"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Merchant[]
    side_effects: []

  - method: POST
    path: "/merchants/{id}/disable"
    description: "Disable a merchant (rejects new claims)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status=DISABLED"]

  # ----- Offer --------------------------------------------------------------
  - method: POST
    path: "/offers"
    description: "Create an offer under a merchant"
    roles: [PlatformAdmin]
    code: 201
    input: [merchant_id, offer_type, starts_at, expires_at, "bonus_rate_bps?", "rebate_cents?", "min_spend_cents?"]
    output: Offer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/offers/{id}"
    description: "Get an offer"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers; filter by merchant_id (FK reverse-reachability for Offer.merchant_id)"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: ["merchant_id?", "offer_type?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  # ----- Member -------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register a member; if referred_by_member_id + matching Referral by email exists, that Referral transitions INVITED->SIGNED_UP"
    roles: [PlatformAdmin, Member]
    code: 201
    input: [email, "referred_by_member_id?"]
    output: Member
    side_effects:
      - "account_status=ACTIVE, verification_status=UNVERIFIED, balances=0"
      - "Matching Referral (by referee_email + referrer) INVITED->SIGNED_UP"

  - method: GET
    path: "/members/{id}"
    description: "Get a member (includes computed wallet balances)"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members; filter by referred_by_member_id (FK reverse-reachability for Member.referred_by_member_id, self-referential)"
    roles: [PlatformAdmin, FinanceAdmin]
    code: 200
    input: ["referred_by_member_id?", "account_status?", "verification_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/verify"
    description: "Mark a member VERIFIED (verification dimension)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["verification_status=VERIFIED", "increments Member.version by 1"]

  - method: POST
    path: "/members/{id}/suspend"
    description: "Suspend a member (account dimension)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["account_status=SUSPENDED", "increments Member.version by 1"]

  - method: POST
    path: "/members/{id}/reinstate"
    description: "Reinstate a suspended member (account dimension)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["account_status=ACTIVE", "increments Member.version by 1"]

  - method: GET
    path: "/members/{id}/ledger-entries"
    description: "List a member's append-only ledger entries (sub-resource form of FK reverse-reachability for LedgerEntry.member_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries; filter by member_id, reward_claim_id, cashout_id, referral_id (FK reverse-reachability for all LedgerEntry FKs)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["member_id?", "reward_claim_id?", "cashout_id?", "referral_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries/{id}"
    description: "Get a single ledger entry (establishes the LedgerEntry collection segment)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/members/{id}/bonus-streak"
    description: "Get the member's BonusStreak (FK reverse-reachability for BonusStreak.member_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: BonusStreak[]
    side_effects: []

  # ----- ClickThrough -------------------------------------------------------
  - method: POST
    path: "/clickthroughs"
    description: "Record an affiliate click (online attribution source); clicked_at stamped from logical clock"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [member_id, merchant_id, "offer_id?"]
    output: ClickThrough
    side_effects: ["clicked_at = current clock"]

  - method: GET
    path: "/clickthroughs/{id}"
    description: "Get a click-through event"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: ClickThrough
    side_effects: []

  - method: GET
    path: "/clickthroughs"
    description: "List click-throughs; filter by member_id, merchant_id, offer_id (FK reverse-reachability for ClickThrough.member_id / merchant_id / offer_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["member_id?", "merchant_id?", "offer_id?", "limit?", "offset?"]
    output: ClickThrough[]
    side_effects: []

  # ----- ReceiptScan --------------------------------------------------------
  - method: POST
    path: "/receipt-scans"
    description: "Upload a receipt to claim a RECEIPT_REBATE offer"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [member_id, merchant_id, offer_id, purchase_total_cents, purchased_at]
    output: ReceiptScan
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/receipt-scans/{id}"
    description: "Get a receipt scan"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: []
    output: ReceiptScan
    side_effects: []

  - method: GET
    path: "/receipt-scans"
    description: "List receipt scans; filter by member_id, merchant_id, offer_id, reward_claim_id (FK reverse-reachability for ReceiptScan.member_id / merchant_id / offer_id / reward_claim_id)"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: ["member_id?", "merchant_id?", "offer_id?", "reward_claim_id?", "status?", "limit?", "offset?"]
    output: ReceiptScan[]
    side_effects: []

  - method: POST
    path: "/receipt-scans/{id}/start-review"
    description: "Move a receipt SUBMITTED->IN_REVIEW (also resubmit REJECTED->IN_REVIEW)"
    roles: [ReviewAgent]
    code: 200
    input: []
    output: ReceiptScan
    side_effects: ["status=IN_REVIEW", "increments ReceiptScan.version by 1"]

  - method: POST
    path: "/receipt-scans/{id}/approve"
    description: "Approve a receipt IN_REVIEW->APPROVED; cascades creation of an IN_STORE RewardClaim (PENDING) + LedgerEntry"
    roles: [ReviewAgent]
    code: 200
    input: ["review_note?"]
    output: ReceiptScan
    side_effects:
      - "status=APPROVED"
      - "Creates RewardClaim(attribution=IN_STORE, status=PENDING); amount per reward_amount_computation IN_STORE variant"
      - "Emits LedgerEntry(CLAIM_PENDING)"
      - "ReceiptScan.reward_claim_id set"
      - "increments ReceiptScan.version by 1"

  - method: POST
    path: "/receipt-scans/{id}/reject"
    description: "Reject a receipt IN_REVIEW->REJECTED"
    roles: [ReviewAgent]
    code: 200
    input: ["review_note?"]
    output: ReceiptScan
    side_effects: ["status=REJECTED", "increments ReceiptScan.version by 1"]

  # ----- RewardClaim --------------------------------------------------------
  - method: POST
    path: "/reward-claims"
    description: "Create an ONLINE (click-attributed) reward claim; requires a qualifying ClickThrough within the attribution window"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [member_id, merchant_id, click_through_id, purchase_amount_cents, "offer_id?"]
    output: RewardClaim
    side_effects:
      - "attribution=ONLINE, status=PENDING; amount per reward_amount_computation ONLINE variant"
      - "matures_at = created_at + merchant.maturity_hold_days; expires_at = matures_at + AVAILABLE_EXPIRY_DAYS"
      - "Emits LedgerEntry(CLAIM_PENDING)"

  - method: GET
    path: "/reward-claims/{id}"
    description: "Get a reward claim"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: []
    output: RewardClaim
    side_effects: []

  - method: GET
    path: "/reward-claims"
    description: "List reward claims; filter by member_id, merchant_id, offer_id, click_through_id, receipt_scan_id, cashout_id, status (FK reverse-reachability for all RewardClaim FKs)"
    roles: [PlatformAdmin, ReviewAgent, FinanceAdmin, Member]
    code: 200
    input: ["member_id?", "merchant_id?", "offer_id?", "click_through_id?", "receipt_scan_id?", "cashout_id?", "status?", "limit?", "offset?"]
    output: RewardClaim[]
    side_effects: []

  - method: POST
    path: "/reward-claims/{id}/mature"
    description: "Force a PENDING claim that has reached matures_at to AVAILABLE (idempotent with the clock-driven auto-maturation)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: RewardClaim
    side_effects:
      - "status PENDING->AVAILABLE"
      - "Emits LedgerEntry(CLAIM_MATURED)"
      - "Recomputes owning member's BonusStreak"
      - "increments RewardClaim.version by 1"

  # ----- ReturnEvent (clawback trigger) -------------------------------------
  - method: POST
    path: "/return-events"
    description: "Report a return against a reward claim; computes clawback and transitions the claim to CLAWED_BACK with cascades"
    roles: [FinanceAdmin]
    code: 201
    input: [reward_claim_id, returned_amount_cents]
    output: ReturnEvent
    side_effects:
      - "clawback_cents per clawback_amount; reported_at = current clock"
      - "Target RewardClaim -> CLAWED_BACK; LedgerEntry(CLAIM_CLAWBACK)"
      - "If claim was RESERVED: owning CashOut->FAILED, sibling reserved claims revert to AVAILABLE (cascade)"

  - method: GET
    path: "/return-events"
    description: "List return events; filter by reward_claim_id (FK reverse-reachability for ReturnEvent.reward_claim_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["reward_claim_id?", "limit?", "offset?"]
    output: ReturnEvent[]
    side_effects: []

  - method: GET
    path: "/return-events/{id}"
    description: "Get a single return event (establishes the ReturnEvent collection segment)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: ReturnEvent
    side_effects: []

  # ----- CashOut ------------------------------------------------------------
  - method: POST
    path: "/cashouts"
    description: "Request a cash-out; reserves AVAILABLE claims (oldest created_at first) up to requested_amount_cents; OCC on Member.version"
    roles: [Member]
    code: 201
    input: [member_id, method, requested_amount_cents, expected_member_version]
    output: CashOut
    side_effects:
      - "status=REQUESTED; fee/net per cashout_payout_and_fee"
      - "Reserves AVAILABLE claims (RewardClaim AVAILABLE->RESERVED, cashout_id set), oldest created_at first"
      - "increments Member.version by 1"

  - method: GET
    path: "/cashouts/{id}"
    description: "Get a cash-out"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: CashOut
    side_effects: []

  - method: GET
    path: "/cashouts"
    description: "List cash-outs; filter by member_id (FK reverse-reachability for CashOut.member_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["member_id?", "status?", "method?", "limit?", "offset?"]
    output: CashOut[]
    side_effects: []

  - method: POST
    path: "/cashouts/{id}/process"
    description: "Move a cash-out REQUESTED->PROCESSING (requires member ACTIVE + VERIFIED)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: CashOut
    side_effects: ["status=PROCESSING", "increments CashOut.version by 1"]

  - method: POST
    path: "/cashouts/{id}/settle"
    description: "Settle a PROCESSING cash-out: outcome=PAID (claims->PAID) or FAILED (claims revert to AVAILABLE)"
    roles: [FinanceAdmin]
    code: 200
    input: [outcome]
    output: CashOut
    side_effects:
      - "outcome=PAID: LedgerEntry(CASHOUT_DEBIT), reserved claims->PAID"
      - "outcome=FAILED: reserved claims revert AVAILABLE, cashout_id cleared"
      - "increments CashOut.version by 1"

  - method: POST
    path: "/cashouts/{id}/retry"
    description: "Retry a FAILED cash-out FAILED->REQUESTED; re-reserves claims (cyclic)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: CashOut
    side_effects:
      - "status=REQUESTED; re-reserves AVAILABLE claims up to requested_amount_cents"
      - "increments CashOut.version by 1"

  # ----- Referral -----------------------------------------------------------
  - method: POST
    path: "/referrals"
    description: "Create a referral invite from a referrer to a referee email"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [referrer_member_id, referee_email, "referee_qualifying_cents?", "bonus_cents?"]
    output: Referral
    side_effects: ["status=INVITED"]

  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals; filter by referrer_member_id, referee_member_id (FK reverse-reachability for Referral.referrer_member_id / referee_member_id)"
    roles: [PlatformAdmin, FinanceAdmin, Member]
    code: 200
    input: ["referrer_member_id?", "referee_member_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/reward"
    description: "Pay out a QUALIFIED referral; cascades a REFERRAL_BONUS AVAILABLE claim to the referrer"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "status=REWARDED"
      - "Creates RewardClaim(attribution=ONLINE, amount_cents=bonus_cents, status=AVAILABLE) for referrer"
      - "Emits LedgerEntry(REFERRAL_BONUS)"

  # ----- Test-driving: logical clock ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to a fixed UTC instant. Server startup default is 2026-01-01T00:00:00Z (before all default fixtures); the clock never falls back to wall-clock. Advancing the clock fires due auto-transitions: PENDING claims at/after matures_at -> AVAILABLE; AVAILABLE claims at/after expires_at -> EXPIRED; INVITED referrals past expiry -> EXPIRED; Offers past expires_at -> EXPIRED."
    roles: [PlatformAdmin, FinanceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock set to to_iso8601"
      - "Fires due RewardClaim PENDING->AVAILABLE and AVAILABLE->EXPIRED transitions"
      - "Fires due Referral INVITED->EXPIRED and Offer ACTIVE->EXPIRED transitions"
      - "Maturation recomputes affected members' BonusStreak"

# =============================================================================
# Table 6: Error Code Catalog (§1.6) — 22 errors
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A body FK (merchant_id/offer_id/member_id/reward_claim_id/click_through_id/receipt_scan_id) does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum, or negative value where non-negative required" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version does not match current Member.version on cash-out creation (OCC)" }
  - { id: ERR_OFFER_INACTIVE, http: 409, condition: "Offer is EXPIRED/DISABLED or current clock is outside [starts_at, expires_at]" }
  - { id: ERR_DOUBLE_DIP_BLOCKED, http: 409, condition: "double_dip_allowed is false and member already has the complementary attribution reward within the double-dip window" }
  - { id: ERR_ATTRIBUTION_WINDOW_EXPIRED, http: 409, condition: "No qualifying ClickThrough within merchant.attribution_window_hours for an ONLINE claim" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member.account_status is SUSPENDED for an operation requiring ACTIVE" }
  - { id: ERR_MEMBER_NOT_VERIFIED, http: 409, condition: "Member.verification_status is UNVERIFIED when processing a cash-out" }
  - { id: ERR_MIN_SPEND_NOT_MET, http: 409, condition: "Receipt purchase_total_cents below Offer.min_spend_cents on approve" }
  - { id: ERR_BELOW_CASHOUT_MINIMUM, http: 422, condition: "Cash-out requested_amount_cents below the per-method minimum" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 422, condition: "Cash-out requested_amount_cents exceeds Member.net_cashoutable_cents (on create or retry)" }
  - { id: ERR_MERCHANT_DISABLED, http: 409, condition: "Attempt to create a claim/receipt/click for a DISABLED merchant" }
  - { id: ERR_CLAIM_ALREADY_TERMINAL, http: 409, condition: "Return/clawback or maturation attempted on a claim already in PAID/CLAWED_BACK/EXPIRED" }
  - { id: ERR_RETURN_EXCEEDS_PURCHASE, http: 422, condition: "ReturnEvent returned_amount_cents exceeds the claim's purchase_amount_cents" }
  - { id: ERR_REFERRAL_NOT_QUALIFIED, http: 409, condition: "Referral reward attempted while status is not QUALIFIED" }
  - { id: ERR_DUPLICATE_REFERRAL, http: 409, condition: "A referral for this referee_email already exists past INVITED" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of bounds (limit 1..100, offset >= 0)" }
  - { id: ERR_CASHOUT_NOT_RESERVABLE, http: 409, condition: "Cash-out creation/retry found no AVAILABLE claims summing to requested_amount_cents" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7) — peer_roles
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Configures merchants and offers; may seed members/clicks/receipts/claims/referrals on behalf of operations"
    identity: opaque
    exclusive_operations:
      - "POST /merchants — create merchant"
      - "POST /merchants/{id}/disable — disable merchant"
      - "POST /offers — create offer"
    shared_operations:
      - "POST /members, POST /clickthroughs, POST /receipt-scans, POST /reward-claims, POST /referrals (shared with Member)"
      - "POST /_clock/set_current_utc (shared with FinanceAdmin)"
      - "GET reads across all resources"

  - name: ReviewAgent
    description: "Reviews uploaded receipts: starts review, approves, rejects"
    identity: opaque
    exclusive_operations:
      - "POST /receipt-scans/{id}/start-review — begin/resume review"
      - "POST /receipt-scans/{id}/approve — approve receipt (spawns claim)"
      - "POST /receipt-scans/{id}/reject — reject receipt"
    shared_operations:
      - "GET reads on merchants, offers, receipt-scans, reward-claims"

  - name: FinanceAdmin
    description: "Runs the payout pipeline, clawbacks, member verification/suspension, referral payouts, and forced maturation"
    identity: opaque
    exclusive_operations:
      - "POST /members/{id}/verify, /suspend, /reinstate"
      - "POST /reward-claims/{id}/mature"
      - "POST /return-events — report return / clawback"
      - "POST /cashouts/{id}/process, /settle, /retry"
      - "POST /referrals/{id}/reward"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with PlatformAdmin)"
      - "GET reads across all resources"

  - name: Member
    description: "End user: clicks affiliate links, uploads receipts, owns reward claims, and requests cash-outs against own wallet"
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /cashouts — request a cash-out against own wallet (X-User-ID must equal member_id)"
    shared_operations:
      - "POST /members (self-register), POST /clickthroughs, POST /receipt-scans, POST /reward-claims, POST /referrals (shared with PlatformAdmin; X-User-ID must own the member_id)"
      - "GET own resources (members, ledger-entries, bonus-streak, reward-claims, cashouts, referrals, receipt-scans, clickthroughs)"
