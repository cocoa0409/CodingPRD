      - name: install_window_end_not_after_start_invalid
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "window_end equal to window_start -> ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup:
