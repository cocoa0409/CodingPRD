            - "Order.${order_a}.fulfillment_status still == ACCEPTED"
            - "StaffingDeployment.${deploy_id}.status == DRAFT (never published)"
            - "after publish + lock by a different user, start-production succeeds"

      - name: order_acceptance_gated_on_menuitem_suppression
        grounds:
          - state_machines.Order
          - entities.MenuItem.fields.suppression_state
          - errors.ERR_ITEM_SUPPRESSED
        distinguishing_aspect: |
          Different entity pair — Order -> MenuItem (not StaffingDeployment):
          Order's PLACED->ACCEPTED acceptance transition is gated on each line's
          MenuItem.suppression_state permitting the channel. A SUPPRESSED_ALL
