            - "CoilLot CL2 of coating G90, heat H-88, gauge_mm 1.6, received_kg 20000 in status AVAILABLE."
            - "RollFormingRun RUN1 scheduled on LINE_A against CL1 for O_BASE, 2026-08-03T08:00Z..12:00Z, planned_kg 6600, so CL1 reads reserved_kg 6600 and remaining_kg 13400."
            - "FieldFailure FF on O_BASE with failure_mode CORROSION_PERFORATION, observed_load_kpa 5.0, measured_coating_loss_pct 55.0 (above the 40.0 C3 limit) and service_years 12.0, advanced to ANALYSIS_IN_PROGRESS."
