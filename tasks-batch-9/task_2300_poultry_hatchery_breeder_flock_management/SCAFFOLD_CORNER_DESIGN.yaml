  - section: calculations
    instances:
      - name: forecast_age_tier_zero_below_stimulation_then_first_tier
        claim_type: correct_result
        grounds:
          - calculations.flock_settable_forecast
          - calculations.flock_settable_forecast.constants.BASE_PHOTOPERIOD_HOURS
          - endpoints.POST_/breeder-flocks/{id}/recompute-forecast
        distinguishing_aspect: "A 20-week-old flock is below every lighting and feed step, so it must fall back to BASE_PHOTOPERIOD_HOURS 8.0 (lighting_factor 0.7000) and TARGET_FEED_G (nutrition_factor 1.0000) while production_rate_pct is 0.0, forcing settable_forecast to exactly 0; one week later the same flock jumps to the 45.0 tier and 2605."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z. Program P1 photostimulates at week 21 with lighting steps 21->12.0 h, 24->14.0 h, 30->16.0 h and feed steps 21->150.0 g, 26->168.0 g."
            - "Flock F1 is hatched 2026-03-14 so it is exactly 20 weeks old at creation ((140 days + 12 h) / 7 floors to 20)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
          trigger:
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-03-14T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-08T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /breeder-flocks/${f1}/recompute-forecast", payload: {}, as: FlockManager}
          assert:
            - "At creation: age_weeks == 20, production_rate_pct == 0.0, photoperiod_hours == 8.0, feed_grams_per_hen_day == 160.0"
            - "At creation: lighting_factor == 0.7000 (0.70 + 0.03 * max(0, 8.0 - 11.0) clamped at the max(0,...) term), nutrition_factor == 1.0000, settable_forecast == 0"
            - "After the clock moves one week and recompute-forecast runs: age_weeks == 21, production_rate_pct == 45.0"
            - "photoperiod_hours == 12.0 and feed_grams_per_hen_day == 150.0 (the week-21 steps, not the week-24/26 steps)"
            - "lighting_factor == 0.7300, nutrition_factor == 0.9375 (150.0 / 160.0)"
            - "settable_forecast == 2605 (floor(9000 * 0.45 * 0.7300 * 0.9375 * 0.94) = floor(2605.415625))"
