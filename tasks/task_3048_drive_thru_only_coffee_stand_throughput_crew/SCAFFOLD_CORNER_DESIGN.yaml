              payload: {}
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { ps: $.data.status }
          assert:
            - "Stand.status == SUSPENDED (from THROTTLED)"
            - "Order.queue_status == ABANDONED and payment_status == VOIDED"
            - "Payment.status == VOIDED"
            - "lane_occupancy.A == 0 (slot released by cascade)"

      - name: derived_lane_occupancy_tracks_every_queue_mutation
        claim_type: derived_field_reconciliation
