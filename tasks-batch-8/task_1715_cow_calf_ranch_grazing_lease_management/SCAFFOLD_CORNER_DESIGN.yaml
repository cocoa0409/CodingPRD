# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cow-Calf Ranch & Grazing Lease Management
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------
  - section: entities
    instances:
      - name: ranch_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Ranch, state_machines.Ranch]
        distinguishing_aspect: "A ranch created with only required fields starts NORMAL with grace 30, seq 0, pct 100.0, version 1 and a prefix-free UUID id."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/ranches", payload: { name: "Default Ranch", hq_state: "MT" }, as: RanchManager, captures: { r: $.data.id } }
          assert:
            - "Ranch.${r}.drought_posture == NORMAL, destock_grace_days == 30, assessment_seq == 0, ranch_production_pct == 100.0, version == 1"
            - "Ranch.${r}.id matches the UUID shape 8-4-4-4-12 hex with NO type prefix"
            - "Response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == 'object'"

      - name: pasture_create_computed_field_rejected
        claim_type: computed_fields
        grounds: [entities.Pasture.fields.available_aum, "validations[priority=5]"]
        distinguishing_aspect: "Client-supplied computed fields (available_aum) in a create payload are rejected, not silently ignored."
        test_recipe:
          setup: ["Ranch R exists"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
          trigger:
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 100, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100, available_aum: 5 }, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (computed field supplied)"

      - name: herd_group_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.HerdGroup.fields.animal_class, "validations[priority=5]"]
        distinguishing_aspect: "animal_class 'STEER' is not a declared enum member and fails fast."
        test_recipe:
          setup: ["Ranch R exists"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
          trigger:
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Bad", animal_class: "STEER", head_count: 10, avg_weight_lbs: 500 }, as: HerdManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_pasture_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/pastures/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND and HTTP status == 404"

      - name: pasture_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/pastures]"]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave per envelope defaults: 3 pastures, limit=2 page 1 then offset=2 page 2."
        test_recipe:
          setup: ["Ranch R with 3 pastures P1, P2, P3"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P1", acreage: 100, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P2", acreage: 100, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P3", acreage: 100, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager }
          trigger:
            - { call: "GET /api/pastures?ranch_id=${ranch_id}&limit=2", payload: {}, as: RangeManager }
            - { call: "GET /api/pastures?ranch_id=${ranch_id}&limit=2&offset=2", payload: {}, as: RangeManager }
          assert:
            - "Page 1: response_type == 'array', total_count == 3, has_more == true, 2 items returned"
            - "Page 2: total_count == 3, has_more == false, exactly 1 item returned"

      - name: ranch_patch_increments_version_and_updated_at
        claim_type: system_fields
        grounds: [entities.Ranch, "endpoints[PATCH /api/ranches/{id}]"]
        distinguishing_aspect: "Every mutation increments version by exactly 1 and refreshes updated_at; id and created_at are stable."
        test_recipe:
          setup: ["Ranch R created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { r: $.data.id } }
          trigger:
            - { call: "PATCH /api/ranches/${r}", payload: { destock_grace_days: 21 }, as: RanchManager }
          assert:
            - "Ranch.${r}.version == 2 and destock_grace_days == 21"
            - "updated_at advanced from the creation timestamp; id and created_at unchanged"

  # ---------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.GrazingLease, state_machines.BreedingSeason, state_machines.Bull, state_machines.SupplementProgram]
        distinguishing_aspect: "Newly created resources start in their declared initial states: lease DRAFT, season PLANNED, bull UNTESTED x ACTIVE, supplement program ACTIVE."
        test_recipe:
          setup: ["Ranch R; LEASED pasture P; group G 60 MATURE_COW"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 50, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 25 }, as: HerdManager, captures: { s: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b: $.data.id } }
            - { call: "POST /api/supplement-programs", payload: { herd_group_id: "${g}", ranch_id: "${ranch_id}", program_type: "MINERAL", start_date: "2026-01-01", end_date: "2026-02-28", feed_rate_oz_per_head_day: 4, cost_cents_per_ton: 240000 }, as: HerdManager, captures: { sp: $.data.id } }
          assert:
            - "GrazingLease.${lease}.lease_status == DRAFT"
            - "BreedingSeason.${s}.season_status == PLANNED and required_bull_count == 1 (ceil(25/25))"
            - "Bull.${b}.bse_status == UNTESTED and life_status == ACTIVE"
            - "SupplementProgram.${sp}.program_status == ACTIVE and delivered_lbs_total == 0"

      - name: lease_invalid_transition_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.GrazingLease, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "suspend on a DRAFT lease is not in the transition table and fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Ranch R; LEASED pasture P; lease L in DRAFT"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 50, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-leases/${lease}/suspend", payload: {}, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION and GrazingLease.${lease}.lease_status == DRAFT"

      - name: terminal_lockdown_settled_lot
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SaleLot, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A SETTLED lot rejects every further transition (settle, cancel, dispute) with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Ranch R; season S in GESTATION (1 bull, exposed 25); crop C 10 steers / 0 heifers WEANED 2026-09-15 (clock set)"
            - "Lot L: 10 STEER claim NONE, OFFERED -> CONTRACTED -> DELIVERED at 500 -> SETTLED by u-ranch-9"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 25 }, as: HerdManager, captures: { s: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b: $.data.id } }
            - { call: "POST /api/bulls/${b}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b}", breeding_season_id: "${s}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t: $.data.id } }
            - { call: "POST /api/bull-turnouts/${t}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${s}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 10, heifer_head: 0 }, as: HerdManager, captures: { c: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${c}/record-weaning", payload: { weaning_date: "2026-09-15", avg_wean_weight_lbs: 540, avg_wean_age_days: 195, avg_birth_weight_lbs: 80, avg_dam_age_years: 5 }, as: HerdManager }
            - { call: "POST /api/sale-lots", payload: { calf_crop_id: "${c}", ranch_id: "${ranch_id}", lot_class: "STEER", head_count: 10, base_price_cents_per_cwt: 23000, slide_cents_per_lb: 10, base_weight_lbs: 520, shrink_pct: 0.03, precon_claim: "NONE", freight_cents_per_head: 3000, commission_pct: 0.025 }, as: SalesAgent, as_user_id: "u-sale-1", captures: { lot: $.data.id } }
            - { call: "POST /api/sale-lots/${lot}/offer", payload: {}, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot}/contract", payload: { buyer_name: "X" }, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot}/deliver", payload: { delivered_avg_weight_lbs: 500 }, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot}/settle", payload: {}, as: RanchManager, as_user_id: "u-ranch-9" }
          trigger:
            - { call: "POST /api/sale-lots/${lot}/settle", payload: {}, as: RanchManager, as_user_id: "u-ranch-9", captures: { err1: $.data.error_id } }
            - { call: "POST /api/sale-lots/${lot}/cancel", payload: {}, as: SalesAgent, as_user_id: "u-sale-1", captures: { err2: $.data.error_id } }
            - { call: "POST /api/sale-lots/${lot}/dispute", payload: { reason: "late" }, as: SalesAgent, as_user_id: "u-sale-1", captures: { err3: $.data.error_id } }
          assert:
            - "${err1} == ERR_ALREADY_TERMINAL and ${err2} == ERR_ALREADY_TERMINAL and ${err3} == ERR_ALREADY_TERMINAL"
            - "SaleLot.${lot}.lot_status == SETTLED throughout"

      - name: lease_auto_expires_past_end_date
        claim_type: valid_transition
        grounds: [state_machines.GrazingLease.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "The lazy system transition fires on read: an ACTIVE lease whose end_date is in the past reads back EXPIRED."
        test_recipe:
          setup: ["Ranch R; LEASED pasture P; lease L window 2026-01-01..2026-06-30, ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-06-30", aum_allotment: 50, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RanchManager }
          trigger:
            - { call: "GET /api/grazing-leases/${lease}", payload: {}, as: RangeManager }
          assert:
            - "GrazingLease.${lease}.lease_status == EXPIRED (2026-07-01 > end_date 2026-06-30)"

      - name: assignment_complete_sets_rest_window
        claim_type: side_effect_execution
        grounds: [state_machines.GrazingAssignment.ACTIVE_to_COMPLETED, state_machines.Pasture]
        distinguishing_aspect: "Completion sets resting_until = actual_end + min_rest_days (45): pasture reads RESTING on day 44 and GRAZEABLE on day 45."
        test_recipe:
          setup: ["Ranch R; DEEDED pasture P base 200 min_rest 45; group G 10 MATURE_COW @1000; assignment 2026-05-01..2026-06-01 completed on 2026-06-01"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 900, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200, min_rest_days: 45 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 10, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-05-01", planned_end_date: "2026-06-01" }, as: RangeManager, captures: { a: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a}/complete", payload: { actual_end_date: "2026-06-01" }, as: RangeManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: RanchManager }
            - { call: "GET /api/pastures/${p}", payload: {}, as: RangeManager, captures: { st1: $.data.condition_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-16T00:00:00Z" }, as: RanchManager }
            - { call: "GET /api/pastures/${p}", payload: {}, as: RangeManager, captures: { st2: $.data.condition_status } }
          assert:
            - "Pasture.${p}.resting_until == 2026-07-16 (2026-06-01 + 45)"
            - "${st1} == RESTING (day 44) and ${st2} == GRAZEABLE (day 45 — inclusive boundary)"
            - "GrazingAssignment.${a}.assignment_status == COMPLETED and consumed_aum == 10.33 (10 x 1.0 x 31/30)"

      - name: preg_check_double_finalize_rejected
        claim_type: idempotency
        grounds: [state_machines.PregCheck, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED preg check fails; results from the first finalize are not re-applied (marked_open_head stays 3, not 6)."
        test_recipe:
          setup: ["Ranch R; group G 60 cows; season S (exposed 40) in PREG_CHECK with a FINALIZED PregCheck (36 pregnant / 3 open / 1 dead)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 40 }, as: HerdManager, captures: { s: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b: $.data.id } }
            - { call: "POST /api/bulls/${b}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b}", breeding_season_id: "${s}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t: $.data.id } }
            - { call: "POST /api/bull-turnouts/${t}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/preg-checks", payload: { breeding_season_id: "${s}", ranch_id: "${ranch_id}", check_date: "2026-09-01" }, as: HerdManager, captures: { pc: $.data.id } }
            - { call: "POST /api/preg-checks/${pc}/finalize", payload: { pregnant_count: 36, open_count: 3, dead_count: 1 }, as: HerdManager }
          trigger:
            - { call: "POST /api/preg-checks/${pc}/finalize", payload: { pregnant_count: 36, open_count: 3, dead_count: 1 }, as: HerdManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL (FINALIZED is terminal; re-finalize rejected)"
            - "HerdGroup.${g}.marked_open_head == 3 (side effects applied exactly once)"

      - name: bull_bse_expiry_and_retest_cycle
        claim_type: valid_transition
        grounds: [state_machines.Bull (bse_status), entities.Bull.fields.bse_status, entities.Bull.fields.last_bse_date]
        distinguishing_aspect: "BSE validity is a lazy clock transition: PASSED on exam 2026-03-01 reads PASSED at day 120 (2026-06-29) and EXPIRED at day 121 (2026-06-30); a fresh exam retests EXPIRED -> PASSED (cyclic), and retire CULLED is terminal for life_status."
        test_recipe:
          setup: ["Ranch R; bulls B1, B2 registered"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B2", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b2: $.data.id } }
            - { call: "POST /api/bulls/${b1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bulls/${b2}/record-bse", payload: { result: "FAILED", exam_date: "2026-03-01", scrotal_cm: 29.0 }, as: HerdManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-29T00:00:00Z" }, as: RanchManager }
            - { call: "GET /api/bulls/${b1}", payload: {}, as: HerdManager, captures: { s1: $.data.bse_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T00:00:00Z" }, as: RanchManager }
            - { call: "GET /api/bulls/${b1}", payload: {}, as: HerdManager, captures: { s2: $.data.bse_status } }
            - { call: "POST /api/bulls/${b1}/record-bse", payload: { result: "PASSED", exam_date: "2026-07-05", scrotal_cm: 35.5 }, as: HerdManager }
            - { call: "POST /api/bulls/${b2}/retire", payload: { disposition: "CULLED" }, as: HerdManager }
          assert:
            - "${s1} == PASSED at 2026-06-29 (exactly exam_date + 120 days — validity is inclusive)"
            - "${s2} == EXPIRED at 2026-06-30 (day 121)"
            - "After retest: Bull.${b1}.bse_status == PASSED with last_bse_date == 2026-07-05 (EXPIRED -> PASSED cycle)"
            - "Bull.${b2}.life_status == CULLED and bse_status remains FAILED (independent dimensions)"

      - name: turnout_double_turnin_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BullTurnout, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "turn-in on an already-TURNED_IN turnout fails; cancel from SCHEDULED is the only valid early exit."
        test_recipe:
          setup: ["Ranch R; group G; season S (exposed 25, PLANNED); bull B1 with turnout T SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 25 }, as: HerdManager, captures: { s: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b}", breeding_season_id: "${s}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /api/bull-turnouts/${t}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t}/turn-in", payload: {}, as: HerdManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/bull-turnouts/${t}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (TURNED_IN -> turn-in not in table)"
            - "Sequence ends REMOVED with actual_removal_date == 2026-06-15"

  # ---------------------------------------------------------------------
  - section: calculations
    instances:
      - name: preg_finalize_accounting_and_rate
        claim_type: correct_result
        grounds: [calculations.pregnancy_rate, state_machines.PregCheck.DRAFT_to_FINALIZED, state_machines.BreedingSeason.PREG_CHECK_to_CLOSED]
        distinguishing_aspect: "Finalize enforces the accounting identity and computes the rate: 36/40 = 90.0 pct; side effects mark 3 open head on the group and close the season."
        test_recipe:
          setup: ["Ranch R; group G 60 cows; season S (exposed 40) driven to GESTATION; PregCheck created (season -> PREG_CHECK)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 40 }, as: HerdManager, captures: { s: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b: $.data.id } }
            - { call: "POST /api/bulls/${b}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b}", breeding_season_id: "${s}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t: $.data.id } }
            - { call: "POST /api/bull-turnouts/${t}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${s}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/preg-checks", payload: { breeding_season_id: "${s}", ranch_id: "${ranch_id}", check_date: "2026-09-01" }, as: HerdManager, captures: { pc: $.data.id } }
          trigger:
            - { call: "POST /api/preg-checks/${pc}/finalize", payload: { pregnant_count: 36, open_count: 3, dead_count: 1 }, as: HerdManager }
          assert:
            - "PregCheck.${pc}.pregnancy_rate_pct == 90.0 and check_status == FINALIZED"
            - "PregCheck.${pc}.exposed_head_count == 40 (snapshot from season)"
            - "HerdGroup.${g}.marked_open_head == 3"
            - "BreedingSeason.${s}.season_status == CLOSED (bubble-up on finalize)"

      - name: statement_usage_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.lease_usage_measurement, entities.LeaseStatement.fields.actual_aum_used]
        distinguishing_aspect: "Only COMPLETED/SHORTENED assignments count toward measured usage: an ACTIVE assignment and a CANCELLED assignment on the same pasture in the same period contribute 0."
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base 600 min_rest 45; lease L (allotment 500, ACTUAL_USE, min_commit 10, rate 2500, tiers 75@3000 / @3750, window 2026-01-01..2026-12-31) ACTIVE"
            - "Group G 20 MATURE_COW @1000. Clock pinned 2026-04-01 for creates/cancel."
            - "A1 2026-05-01..2026-05-31 (30d, reserved 20.0) -> completed 2026-05-21 (20 days grazed, consumed 13.33)"
            - "A2 2026-07-16..2026-08-15 (ACTIVE, excluded); A3 2026-10-01..2026-10-31 (created then CANCELLED at clock 2026-04-01, excluded)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 2400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 600, min_rest_days: 45 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 500, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 75, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-05-01", planned_end_date: "2026-05-31" }, as: RangeManager, captures: { a1: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-07-16", planned_end_date: "2026-08-15" }, as: RangeManager, captures: { a2: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-10-01", planned_end_date: "2026-10-31" }, as: RangeManager, captures: { a3: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a3}/cancel", payload: {}, as: RangeManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/grazing-assignments/${a1}/complete", payload: { actual_end_date: "2026-05-21" }, as: RangeManager }
          trigger:
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, as_user_id: "u-range-1", captures: { stmt: $.data.id } }
          assert:
            - "LeaseStatement.${stmt}.actual_aum_used == 13.33 — only A1 (COMPLETED) counts; A2 ACTIVE and A3 CANCELLED contribute 0"
            - "base_charge_cents == 33325.0 (max(13.33, 10) x 2500) and overage_charge_cents == 0.0 and total_due_cents == 33325.0"

      - name: lease_overage_tier_boundary
        claim_type: constants_applied
        grounds: [calculations.lease_settlement_charge]
        distinguishing_aspect: "Tier boundary precision: usage 575.0 against allotment 500 gives overage exactly 75 == tier1 cap, so the entire overage bills at tier1 (225000.0) and tier2 contributes 0; total 1662500.0."
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base 600 min_rest 45; lease L (allotment 500, ACTUAL_USE, min_commit 300, rate 2500, tier1 75@3000, tier2 @3750, window 2026-01-01..2026-12-31) ACTIVE"
            - "Group G 50 MATURE_COW @1000; assignment 2026-01-01..2026-12-12 (345 days, reserved 575.0) completed on 2026-12-12 => consumed 575.0"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 2400, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 600, min_rest_days: 45 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 500, rate_per_aum_cents: 2500, minimum_commit_aum: 300, overage_tier1_cap_aum: 75, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 50, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-01-01", planned_end_date: "2026-12-12" }, as: RangeManager, captures: { a: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/grazing-assignments/${a}/complete", payload: { actual_end_date: "2026-12-12" }, as: RangeManager }
          trigger:
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, as_user_id: "u-range-1", captures: { stmt: $.data.id } }
          assert:
            - "LeaseStatement.${stmt}.actual_aum_used == 575.0"
            - "overage_charge_cents == 225000.0 (overage 75 == tier1 cap 75 — entirely tier1 at 3000; tier2 untouched)"
            - "base_charge_cents == 1437500.0 (max(575, 300) x 2500) and total_due_cents == 1662500.0"

      - name: posture_threshold_constants_applied
        claim_type: constants_applied
        grounds: [calculations.ranch_production_pct_and_posture, calculations.effective_pasture_capacity]
        distinguishing_aspect: "Threshold boundaries use the pinned half-open bands: pct 90 -> NORMAL, 74 -> ALERT, 54 -> CRITICAL; the CRITICAL finalize halves effective capacity (100 -> 50.0)."
        test_recipe:
          setup: ["Ranch R; one DEEDED pasture P base 100; group G 10 GROWING @800 (demand 7.5/mo — never a deficit, so no DestockOrder noise)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id, rv1: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "GROWING", head_count: 10, avg_weight_lbs: 800 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-06-01", pasture_measurements: [ { pasture_id: "${p}", production_pct_of_normal: 90 } ] }, as: RangeManager, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${a1}/finalize", payload: { expected_ranch_version: "${rv1}" }, as: RangeManager }
            - { call: "GET /api/ranches/${ranch_id}", payload: {}, as: RangeManager, captures: { rv2: $.data.version, post1: $.data.drought_posture } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-07-01", pasture_measurements: [ { pasture_id: "${p}", production_pct_of_normal: 74 } ] }, as: RangeManager, captures: { a2: $.data.id } }
            - { call: "POST /api/drought-assessments/${a2}/finalize", payload: { expected_ranch_version: "${rv2}" }, as: RangeManager }
            - { call: "GET /api/ranches/${ranch_id}", payload: {}, as: RangeManager, captures: { rv3: $.data.version, post2: $.data.drought_posture } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p}", production_pct_of_normal: 54 } ] }, as: RangeManager, captures: { a3: $.data.id } }
            - { call: "POST /api/drought-assessments/${a3}/finalize", payload: { expected_ranch_version: "${rv3}" }, as: RangeManager }
            - { call: "GET /api/pastures/${p}", payload: {}, as: RangeManager, captures: { eff: $.data.effective_capacity_aum } }
          assert:
            - "${post1} == NORMAL (pct 90 >= THRESHOLD_WATCH 90 — lower band is exclusive at the boundary)"
            - "${post2} == ALERT (74 < 75)"
            - "After pct 54 finalize: Ranch.drought_posture == CRITICAL (54 < 55)"
            - "${eff} == 50.0 (100 x 0.50 CRITICAL factor)"
            - "No DestockOrder was ever created (demand 7.5 always below supply; GET /api/destock-orders?ranch_id total_count == 0)"

      - name: supplement_cost_accumulation
        claim_type: correct_result
        grounds: [calculations.supplement_costs, "endpoints[POST /api/supplement-programs/{id}/deliveries]"]
        distinguishing_aspect: "Deliveries accumulate: 500 lbs then 300 lbs at 240000c/ton give cost_to_date 60000.0 then 96000.0; projection uses head x window days x rate (750.0 lbs)."
        test_recipe:
          setup: ["Ranch R; group G 50 MATURE_COW @1000; MINERAL program 2026-01-01..2026-02-28 (59-day inclusive window -> 59 days) at 4 oz/head/day, 240000c/ton"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 50, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /api/supplement-programs", payload: { herd_group_id: "${g}", ranch_id: "${ranch_id}", program_type: "MINERAL", start_date: "2026-01-01", end_date: "2026-02-28", feed_rate_oz_per_head_day: 4, cost_cents_per_ton: 240000 }, as: HerdManager, captures: { sp: $.data.id } }
            - { call: "POST /api/supplement-programs/${sp}/deliveries", payload: { delivered_lbs: 500, delivery_date: "2026-01-10" }, as: HerdManager }
            - { call: "POST /api/supplement-programs/${sp}/deliveries", payload: { delivered_lbs: 300, delivery_date: "2026-01-25" }, as: HerdManager }
            - { call: "POST /api/supplement-programs/${sp}/complete", payload: {}, as: HerdManager }
            - { call: "POST /api/supplement-programs/${sp}/deliveries", payload: { delivered_lbs: 50, delivery_date: "2026-02-01" }, as: HerdManager, captures: { err: $.data.error_id } }
          assert:
            - "SupplementProgram.${sp}.projected_consumption_lbs == 737.5 (50 head x 59 days x 4 oz / 16)"
            - "After first delivery cost_to_date_cents == 60000.0; after second: delivered_lbs_total == 800 and cost_to_date_cents == 96000.0"
            - "Program COMPLETED is terminal: ${err} == ERR_ALREADY_TERMINAL and delivered_lbs_total stays 800"

