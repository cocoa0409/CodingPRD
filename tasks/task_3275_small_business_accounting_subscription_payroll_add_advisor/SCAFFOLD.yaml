# =============================================================================
errors:
  # --- Generic / envelope ---
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-Role or X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted to call this endpoint per §1.7" }
  - { id: ERR_IDENTITY_MISMATCH, http: 403, condition: "Entity-backed role's X-User-ID does not match the persisted entity id, or ownership scope (company_id / firm_id) violated" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body foreign-key id does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or type violation" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in declared constraint set" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 400, condition: "Requested transition not allowed from the entity's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match parent's current version" }

  # --- Subscription / tier gating ---
  - { id: ERR_SUBSCRIPTION_NOT_WRITABLE, http: 400, condition: "Subscription.lifecycle_status is CANCELLED_READ_ONLY or CANCELLED_EXPIRED; mutating endpoints blocked" }
  - { id: ERR_FEATURE_NOT_IN_TIER, http: 400, condition: "Operation requires a feature flag not present on current plan (inventory / project_profitability / multi_currency / bank_rules)" }
  - { id: ERR_SEAT_LIMIT_REACHED, http: 400, condition: "Adding one more user would exceed plan's max_seats (boundary: occupied+1 > max_seats)" }
  - { id: ERR_REQUIRES_PRIMARY_ADMIN, http: 403, condition: "Operation requires permission_level == PRIMARY_ADMIN; COMPANY_ADMIN cannot substitute (segregation of duties)" }
  - { id: ERR_TRIAL_EXPIRED, http: 400, condition: "Trial has ended and no payment method recorded; subscription moving to CANCELLED_READ_ONLY" }
  - { id: ERR_REACTIVATION_WINDOW_EXPIRED, http: 400, condition: "now >= read_only_expires_at; reactivation no longer possible" }

  # --- Payroll ---
  - { id: ERR_PAYROLL_ALREADY_ACTIVE, http: 409, condition: "An ACTIVE or PAUSED PayrollAddon already exists for the subscription" }
  - { id: ERR_PAYROLL_NOT_ACTIVE, http: 400, condition: "Payroll operation requires addon_status == ACTIVE" }
  - { id: ERR_PAYROLL_CANCEL_BLOCKED_BY_FILING, http: 400, condition: "FULL_SERVICE payroll cannot cancel while tax_filing_status == FILED_CURRENT pending ack" }
  - { id: ERR_EMPLOYEE_ALREADY_TERMINATED, http: 400, condition: "PayrollEmployee.employment_status is already TERMINATED" }

  # --- Billing / invoices / transfers ---
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 400, condition: "Invoice not in ISSUED (or DRAFT for issue) state" }
  - { id: ERR_BILLING_STATE_BLOCKED, http: 400, condition: "Billing lifecycle action blocked by outstanding state (unpaid invoices, in-flight transfers, open recons)" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "Another BillingTransfer in PENDING_* for this subscription" }
  - { id: ERR_TRANSFER_EXPIRED, http: 400, condition: "now >= expires_at on BillingTransfer" }
  - { id: ERR_FIRM_NOT_ACTIVE, http: 400, condition: "AccountantFirm.firm_status != ACTIVE" }

  # --- Bank feed ---
  - { id: ERR_CONNECTION_NOT_AUTHORIZABLE, http: 400, condition: "BankConnection not in a state allowing authorize (must be PENDING_AUTH or STALE)" }
  - { id: ERR_CONSENT_EXPIRED, http: 400, condition: "consent_expires_at <= now at authorize/reauthorize" }
  - { id: ERR_CONNECTION_ALREADY_EXISTS, http: 409, condition: "Duplicate (company_id, institution_name, external_account_mask) triple on a non-terminal connection" }
  - { id: ERR_TXN_LOCKED_BY_RECONCILIATION, http: 400, condition: "BankTransaction has reconciled_in_id set; cannot modify" }

  # --- Reconciliation ---
  - { id: ERR_STATEMENT_WINDOW_OVERLAP, http: 409, condition: "[statement_period_start, statement_period_end] intersects another IN_PROGRESS or COMPLETED recon on the same bank_connection_id (closed intervals)" }
  - { id: ERR_RECON_DIFFERENCE_NOT_ZERO, http: 400, condition: "Reconciliation.difference_cents != 0 at complete" }

  # --- Rules ---
  - { id: ERR_RULE_NOT_PAUSABLE, http: 400, condition: "CategorizationRule not in ACTIVE state" }
  - { id: ERR_RULE_NOT_RESUMABLE, http: 400, condition: "CategorizationRule not in PAUSED state OR tier does not include bank_rules" }

  # --- Integrations ---
  - { id: ERR_INTEGRATION_NOT_ACTIVE, http: 400, condition: "AppIntegration not ACTIVE for sync operations" }
  - { id: ERR_INTEGRATION_RESUME_BLOCKED, http: 400, condition: "conflict_count > 0; cannot resume CONFLICT_PAUSED integration" }
  - { id: ERR_CONFLICT_NOT_OPEN, http: 400, condition: "SyncConflict not in OPEN state" }

  # --- Migration ---
  - { id: ERR_MIGRATION_ALREADY_IN_FLIGHT, http: 409, condition: "Another MigrationJob in QUEUED or CONVERTING for this company" }
  - { id: ERR_MIGRATION_NOT_CANCELLABLE, http: 400, condition: "MigrationJob not in QUEUED or CONVERTING" }

  # --- Access grants ---
  - { id: ERR_GRANT_NOT_ACCEPTABLE, http: 400, condition: "AccessGrant not in PENDING_ACCEPT or has expired" }
  - { id: ERR_GRANT_NOT_REVOCABLE, http: 400, condition: "AccessGrant in terminal state" }
  - { id: ERR_DUPLICATE_ACTIVE_GRANT, http: 409, condition: "An ACTIVE AccessGrant already exists for (company_id, accountant_user_id)" }

  # --- Exports ---
  - { id: ERR_EXPORT_NOT_DOWNLOADABLE, http: 400, condition: "ExportRequest not in READY state or download_expires_at <= now" }
  - { id: ERR_EXPORT_SCOPE_REQUIRES_PRIMARY_ADMIN, http: 403, condition: "scope=FULL_LEDGER requires PRIMARY_ADMIN" }

  # --- Cross-cutting ---
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique-key violation per §1.4 priority 12" }
  - { id: ERR_WINDOW_EXPIRED, http: 400, condition: "Time window for the action has closed (transfer / grant / export / reactivate)" }
  - { id: ERR_COMPANY_READ_ONLY, http: 400, condition: "ClientCompany.company_status == READ_ONLY blocks mutating endpoints other than export/reactivate" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Internal Intuit operations; manages plans, firms, simulations, and clock"
    identity: opaque
    exclusive_operations:
      - "POST /plans, GET /plans/{id}, GET /plans"
      - "POST /firms, POST /firms/{id}/suspend, POST /firms/{id}/reactivate, POST /firms/{id}/close"
      - "POST /firms/{id}/users (create accountant users)"
      - "POST /companies (onboard a new client company)"
      - "POST /companies/{id}/users (initial PRIMARY_ADMIN invite at onboarding; subsequent invites require CompanyUser role)"
      - "POST /companies/{id}/invoices/{iid}/issue, POST /companies/{id}/invoices/{iid}/void"
      - "POST /companies/{id}/migration_jobs/{mid}/start, /complete, /cancel"
      - "POST /companies/{id}/integrations/{iid}/conflicts (record a sync conflict)"
      - "POST /companies/{id}/exports/{eid}/mark_ready"
      - "POST /_clock/set_current_utc, POST /_payments/simulate, POST /_sync/bank_feed_tick"
    shared_operations:
      - "GET endpoints (read-only access to all resources)"

  - name: CompanyUser
    description: "A user within a client company; permission_level field gates further operations"
    identity: "entity_backed:CompanyUser"
    exclusive_operations:
      - "POST /companies/{id}/users (invite), /users/{uid}/accept, /users/{uid}/disable"
      - "POST /companies/{id}/subscription/activate, /change_plan, /cancel, /reactivate, /resume"
      - "POST /companies/{id}/payroll/* (addon lifecycle)"
      - "POST /companies/{id}/bank_connections* (create, authorize, reauthorize, disconnect, revoke)"
      - "POST /companies/{id}/categories"
      - "POST /companies/{id}/categorization_rules* (create, pause, resume, delete)"
      - "POST /companies/{id}/integrations* (create, activate, resume, disconnect)"
      - "POST /companies/{id}/access_grants (issue), /revoke"
      - "POST /companies/{id}/billing_transfers/{tid}/accept, /counter, /decline, /cancel (client-side actions)"
      - "POST /companies/{id}/reconciliations* (create, start, complete, abandon)"
    shared_operations:
      - "POST /companies/{id}/bank_transactions/{tid}/categorize, /accept_suggestion, /reject_suggestion, /uncategorize, /exclude, /unexclude"
      - "POST /companies/{id}/payroll/employees, /terminate"
      - "POST /companies/{id}/invoices/{iid}/pay"
      - "POST /companies/{id}/integrations/{iid}/conflicts/{cid}/resolve"
      - "POST /companies/{id}/exports, /download"
      - "POST /companies/{id}/migration_jobs (request), /cancel (request cancellation)"
      - "All GET endpoints"

  - name: AccountantUser
    description: "Advisor at a firm; acts on a client company only when an ACTIVE AccessGrant authorizes the action at the required access_level"
    identity: "entity_backed:AccountantUser"
    exclusive_operations:
      - "POST /firms/{id}/access_grants/{gid}/accept (accept grant)"
      - "POST /firms/{id}/billing_transfers/{tid}/accept (firm-side accept, requires is_firm_admin=true)"
      - "POST /companies/{id}/billing_transfers (initiate when to_owner=FIRM, requires is_firm_admin=true)"
    shared_operations:
      - "POST /companies/{id}/bank_transactions/* (requires FULL_BOOKKEEPING grant)"
      - "POST /companies/{id}/payroll/employees, /terminate (requires FULL_BOOKKEEPING or PAYROLL_ONLY grant)"
      - "POST /companies/{id}/invoices/{iid}/pay (requires FULL_BOOKKEEPING)"
      - "POST /companies/{id}/integrations/{iid}/conflicts/{cid}/resolve (requires FULL_BOOKKEEPING)"
      - "POST /companies/{id}/exports, /download (download requires FULL_BOOKKEEPING; FULL_LEDGER scope restricted to PRIMARY_ADMIN only)"
      - "POST /companies/{id}/reconciliations* (requires FULL_BOOKKEEPING)"
      - "POST /companies/{id}/categorization_rules (create only; requires FULL_BOOKKEEPING)"
      - "All GET endpoints"


