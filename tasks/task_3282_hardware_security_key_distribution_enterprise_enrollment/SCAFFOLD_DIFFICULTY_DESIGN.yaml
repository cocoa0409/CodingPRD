scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: purchase_order_provisional_vs_final_total
    grounds:
    - calculations.purchase_order_total
    - entities.PurchaseOrder.fields.quoted_total_cents
    - entities.PurchaseOrder.fields.final_total_cents
    distinguishing_aspect: 'Same order lines produce different totals under the two variants of

      purchase_order_total: provisional (at creation) is base-only (19000),

      final (at approve) applies sequential per-line coverage then per-line

      floored discount yielding 16245. Entity domain: PurchaseOrder fiscal

      totals.

      '
    test_recipe:
      setup:
      - Organization ORG1 (STANDARD assurance, STANDARD policy, idp [FIDO2], minimum 2)
      - KeyModels M-A (150c, USB_C, FIDO2) and M-B (250c, USB_A, FIDO2+U2F)
      - 'Subscription SUB1 ACTIVE: 100 credits, coverage_cents_total 1900, percent_discount 0'
      - PurchaseOrder PO1 lines [{M-A,60},{M-B,40}] created by proca1 (quoted 19000)
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
          legal_name: Acme Corp
          assurance_tier: STANDARD
          authentication_policy: STANDARD
          idp_protocols:
          - FIDO2
          backup_key_minimum: 2
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          org1: $.data.id
      - call: POST /v1/key-models
        payload:
          model_code: M-A
          connectors:
          - USB_C
          protocols:
          - FIDO2
          form_factor: KEYCHAIN
          unit_price_cents: 150
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/key-models
        payload:
          model_code: M-B
          connectors:
          - USB_A
          protocols:
          - FIDO2
          - U2F
          form_factor: NANO
          unit_price_cents: 250
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/organizations/${org1}/subscriptions
        payload:
          tier: ENTERPRISE
          refresh_interval_days: 90
          replacement_credits_total: 100
          coverage_cents_total: 1900
          percent_discount: 0
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          sub1: $.data.id
      - call: POST /v1/organizations/${org1}/purchase-orders
        payload:
          lines:
          - model_code: M-A
            quantity: 60
          - model_code: M-B
            quantity: 40
          shipping_location: HQ
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          po1: $.data.id
          po1_v: $.data.version
          quoted1: $.data.quoted_total_cents
      trigger:
      - call: POST /v1/organizations/${org1}/purchase-orders/${po1}/approve
        payload:
          expected_purchase_order_version: ${po1_v}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          final1: $.data.final_total_cents
          credit1: $.data.credit_applied_cents
          disc1: $.data.quantity_discount_cents
      assert:
      - quoted1 == 19000
      - final1 == 16245
      - credit1 == 1900
      - disc1 == 855
      - final1 != quoted1
  - name: backup_compliance_standard_vs_strict
    grounds:
    - calculations.backup_key_compliance
    - entities.IdentityAccount.fields.backup_compliant
    distinguishing_aspect: 'Same registered_key_count (2) yields different backup_compliant values

      under the two variants of backup_key_compliance: STANDARD policy uses

      the minimum as-is (2 >= 2 -> true) while PHISHING_RESISTANT applies

      minimum + 1 (2 >= 3 -> false). Entity domain: IdentityAccount

      compliance — a different domain from PurchaseOrder fiscal totals.

      '
    test_recipe:
      setup:
      - ORG_S (STANDARD policy) and ORG_P (PHISHING_RESISTANT policy), both STANDARD assurance, idp [FIDO2], minimum 2
      - KeyModel M-C (150c, USB_C, FIDO2)
      - 'Each org: one employee (auto-created account), one RECEIVED order with two VERIFIED DISTRIBUTED keys assigned to the account, two ACTIVE enrollments'
