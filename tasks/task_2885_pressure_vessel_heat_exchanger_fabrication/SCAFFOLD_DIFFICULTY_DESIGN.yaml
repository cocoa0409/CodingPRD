              as_user_id: "${we1_id}"
              captures: { w6_id: $.data.id, w6_pct: $.data.required_volumetric_pct, w6_method: $.data.volumetric_method }
          assert:
            - "Just below the RT threshold: ${w1_pct} == 25 and ${w1_method} == RT (1.4990 < B_FULL_RT_THICKNESS_THRESHOLD_IN = 1.500, so the FULL declaration still only buys a 25 percent spot sample)"
            - "Exactly at the RT threshold: ${w2_pct} == 100 and ${w2_method} == RT — the comparison is >= 1.500, not > 1.500"
            - "Just above: ${w3_pct} == 100 and ${w3_method} == RT"
            - "Just below the UT crossover: ${w4_pct} == 100 and ${w4_method} == RT (1.9990 < UT_THICKNESS_THRESHOLD_IN = 2.000)"
            - "Exactly at the UT crossover: ${w5_pct} == 100 and ${w5_method} == UT — again >= 2.000, and the percentage is unaffected by the method flip"
            - "Control on the other axis: ${w6_pct} == 0 and ${w6_method} == null for the 2.5000 in category C FILLET joint, whose thickness is above BOTH thresholds — the thresholds are gated on joint_category B and never promote a category C joint"
            - "ProductionWeld.${w6_id}.required_surface_method == MT while ProductionWeld.${w1_id}.required_surface_method through ProductionWeld.${w5_id}.required_surface_method are all null (carbon steel, category B, BUTT)"
            - "All six calls return HTTP 201 and every row starts at fab_status PLANNED, nde_status NOT_PLANNED and pwht_status NOT_REQUIRED"

      - name: boundary_heat_mass_ledger_exhaustion_at_exactly_zero_remaining
        grounds:
          - calculations.material_balance
          - validations[priority=66]
          - validations[priority=90]
          - state_machines.MaterialHeat.ACCEPTED_to_DEPLETED
          - entities.MaterialHeat.fields.quantity_remaining_lb
          - endpoints.POST_/vessel-jobs/{job_id}/parts
        distinguishing_aspect: |
          The boundary is a conserved quantity reaching EXACTLY zero on a different endpoint and a
          different metric from the thickness thresholds: one hundredth of a pound over the
          remaining mass is refused, the exact remainder is admitted and immediately retires the
          heat to DEPLETED, and the very next hundredth-pound request is refused by a DIFFERENT
          and higher-priority rule (66, heat acceptance) than the one that guarded the previous
          attempt (90, mass ledger) — so the error_id changes even though the arithmetic reason
          looks the same to a caller.
