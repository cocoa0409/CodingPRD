  # ===========================================================================
  # Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_quote_in_create_response
        claim_type: immediate
        grounds:
          - entities.Reservation.fields.provisional_quote_cents
          - calculations.compute_parking_charge
        distinguishing_aspect: "The provisional_quote_cents computed at booking is present in the same POST /reservations response (immediate consistency), equal to 4000 for a DAILY 2-day booking at daily_cap_cents=2000."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; DAILY plan daily_cap_cents=2000; STANDARD vehicle; reservation exactly 2 days."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cim@x.com", full_name: "CIM" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lim", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDim", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-03T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id, prov: $.data.provisional_quote_cents }
          assert:
            - "the POST /reservations response data.provisional_quote_cents == 4000"
