  - rule_id: compensating_invariant
    instances:
      - name: warehouse_occupancy_checkin_release_roundtrip
        grounds:
          - entities.Warehouse.fields.occupied_cwt
          - state_machines.SITLot.IN_STORAGE_to_RELEASED
          - calculations.sit_storage_accrual
        distinguishing_aspect: |
          Conserved quantity = warehouse cwt: occupied_cwt == sum(stored_weight_cwt over lots IN_STORAGE at that
          warehouse) at every observation; the check-in (+96) paired with its compensating release (-96) returns
          the warehouse to exactly its pre-chain value with zero drift.
