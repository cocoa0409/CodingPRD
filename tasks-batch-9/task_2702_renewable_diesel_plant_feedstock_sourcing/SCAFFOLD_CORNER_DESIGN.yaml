              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "MASS_BALANCE_STATEMENT", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-mb-2702-y2" }
