            - "NotificationBatch.${batch_late_id}.status == PENDING with dispatched_at == null and lead_time_minutes == null"
            - "GET /notification-records?notification_batch_id=${batch_late_id} returns total_count 0"
            - "PSPSEvent.${ev1_id}.notification_status == ADVANCE_SENT (advanced once, by the accepted dispatch only)"

      - name: observation_window_right_endpoint_is_exclusive
        grounds:
          - calculations.fire_potential_index
          - errors[ERR_OBSERVATION_WINDOW_EMPTY]
          - validations[priority=14]
        distinguishing_aspect: |
          The selection window is half-open [forecast_date-24h, forecast_date+24h): an observation stamped
          exactly 2026-08-16T00:00:00Z is OUTSIDE the window for forecast_date 2026-08-15 and leaves the
          circuit with zero contributing stations (ERR_OBSERVATION_WINDOW_EMPTY), while an observation
          stamped exactly 2026-08-14T00:00:00Z is INSIDE it and alone produces fpi_score 75.00.
        test_recipe:
          setup:
            - "Circuit INDIA is TIER_2 with overhead_miles 6.0, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle, and one ONLINE station of representativeness_weight 1.00."
            - "That station's only observation is stamped exactly 2026-08-16T00:00:00Z, the excluded right endpoint of the window for forecast_date 2026-08-15."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "INDIA", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { india_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-I1", circuit_id: "${india_id}", elevation_ft: 2400, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_i1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_i1_id}", observed_at: "2026-08-16T00:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 10.0, temperature_f: 103.0, dead_fuel_moisture_pct: 6.0 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${india_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_i1_id}", observed_at: "2026-08-14T00:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 10.0, temperature_f: 103.0, dead_fuel_moisture_pct: 6.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${india_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_i_id: $.data.id }
          assert:
            - "The first index call returns HTTP 422 with data.error_id == ERR_OBSERVATION_WINDOW_EMPTY"
            - "GET /circuits/${india_id}/fire-potential-indices returns total_count 0 immediately after that refusal"
            - "The second index call returns HTTP 201"
            - "FirePotentialIndex.${fpi_i_id}.contributing_station_count == 1"
            - "FirePotentialIndex.${fpi_i_id}.effective_wind_gust_mph == 52.0"
            - "FirePotentialIndex.${fpi_i_id}.fpi_score == 75.00 and fpi_tier == R5"
            - "WeatherStation.${ws_i1_id}.observation_count == 2 and last_observation_at == 2026-08-16T00:00:00Z"

