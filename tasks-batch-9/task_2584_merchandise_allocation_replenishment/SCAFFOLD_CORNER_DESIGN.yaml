              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex10: $.data.error_id }
            - call: "POST /allocation/receipts/${rcpt_id}/adjust"
              payload: { units_received: 10, size_received: [{ size_code: "S", units: 2 }, { size_code: "M", units: 4 }, { size_code: "XXL", units: 4 }], adjustment_reason: "carton mis-scan" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex11: $.data.error_id }
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/size-profiles"
              payload: { program_id: "${prog_id}" }
              as: PlanningAdmin
          assert:
            - "A curve with S listed twice (3000 + 3000 + M 4000 = 10000) returns 422 ERR_SIZE_CURVE_INVALID - the sum is right and the codes are not unique"
            - "A curve summing to 9999 returns 422 ERR_SIZE_CURVE_INVALID and a curve summing to 10001 returns the same code: the check is exact equality with 10000, not a rounding tolerance"
            - "An item declared APPAREL_BOTTOM pointing at the APPAREL_TOP profile returns 422 ERR_ITEM_CLASS_MISMATCH - a different code from all three curve failures"
            - "A position declaring on_hand_units 10 against sizes summing to 9 returns 422 ERR_SIZE_UNITS_MISMATCH"
            - "A position whose sizes reconcile (5 + 4 = 9) but name XXL, absent from the curve, returns 422 ERR_SIZE_CODE_UNKNOWN - the two codes are reachable independently on the same endpoint"
            - "A position that BOTH mis-reconciles (10 declared, 9 supplied) and names XXL returns ERR_SIZE_UNITS_MISMATCH, proving rung 17 is evaluated before rung 18"
            - "A receipt declaring 12 units against sizes summing to 11 returns 422 ERR_SIZE_UNITS_MISMATCH, and one whose 6 + 6 reconciles but names XXS returns 422 ERR_SIZE_CODE_UNKNOWN - the same two rules apply to the receipt endpoint"
            - "The adjust endpoint inherits both: a recount to 10 against sizes summing to 9 returns ERR_SIZE_UNITS_MISMATCH, and a reconciling recount naming XXL returns ERR_SIZE_CODE_UNKNOWN"
            - "Every rejection was total: Receipt.${rcpt_id} still reports units_received == 12 with size_received == [{S:2},{M:4},{L:4},{XL:2}] and version unchanged from its creation"
            - "GET /allocation/size-profiles?program_id=${prog_id} still has total_count == 1 - none of the three invalid curves was persisted"
      - name: propose_separates_an_empty_candidate_set_from_a_zero_need_network
        claim_type: error_triggerable
        grounds:
          - validations[priority:30]
          - validations[priority:31]
          - errors.ERR_NO_ELIGIBLE_STORES
          - errors.ERR_ZERO_NETWORK_NEED
          - calculations.receipt_proration.input_set
        distinguishing_aspect: |
          Two adjacent rungs both make a propose impossible and they must not be merged: rung 30 says the
          candidate filter emptied the network, rung 31 says the candidates are there but want nothing. The
          first item has two positions and both of its stores were moved out of ACTIVE, so the filter empties
          and the answer is 422 ERR_NO_ELIGIBLE_STORES; the third item has no StorePosition anywhere, which
          empties the filter for a completely different reason and must give the SAME code; the second item
          has a healthy ACTIVE store whose pipeline already covers its target exactly, so the candidate set
          is non-empty and the answer must be 409 ERR_ZERO_NETWORK_NEED with its different status. A single
          PATCH that lifts the forecast from 5 to 8 then makes the identical run succeed, which proves the
          run was never structurally broken - and that a failed propose leaves the run in DRAFT rather than
          burning it.
