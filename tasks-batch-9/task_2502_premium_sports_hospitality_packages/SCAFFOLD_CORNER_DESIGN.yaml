            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Single restricted-view seat", quantity: 1, unit_cost_cents: 10001, markup_pct: 0.5000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { lc: "$.data.line_cost_cents", lp: "$.data.line_price_cents" } }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version", list: "$.data.list_price_cents", marg: "$.data.margin_pct" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
