  - { method: GET, path: "/noise-program/noise-monitors/{id}/outages", description: "List outages of a monitor", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?"], output: "MonitorOutage[]", side_effects: [] }
