      - name: deposit_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_CONDEMNATION_STATE]
        distinguishing_aspect: |
          A second deposit both violates the state precondition (condemnation already DEPOSIT_MADE, category state, priority 6)
          and the fiscal floor (1 < 28,000,000, category business_fiscal, priority 12); the state check wins -> ERR_INVALID_CONDEMNATION_STATE, not ERR_DEPOSIT_BELOW_COMPENSATION.
        test_recipe:
          setup:
            - "Condemnation already in DEPOSIT_MADE (first deposit 28,000,000 accepted)."
          setup_api_calls:
