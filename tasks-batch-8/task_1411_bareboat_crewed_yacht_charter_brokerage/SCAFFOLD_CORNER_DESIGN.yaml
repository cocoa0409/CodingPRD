            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca2_id}", captures: { err: $.data.error_id } }
