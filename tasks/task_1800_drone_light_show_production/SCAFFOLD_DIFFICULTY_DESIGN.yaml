            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-H01", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-H02", model: "LUM-2" }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-H03", model: "LUM-2" }, as: FleetManager, captures: { d3: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d3}", grid_row: 0, grid_col: 2 }, as: FleetManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T18:45:00Z" }, as: OpsAdmin }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-10T18:30:00Z", wind_speed_kt: 8, gust_kt: 11, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/go-no-go-evaluations", payload: { show_event_id: "${show_id}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { eval_id: $.data.id, eval_status: $.data.status } }
          trigger:
            - { call: "POST /api/show-events/${show_id}/certify-go", payload: { evaluation_id: "${eval_id}" }, as: SafetyOfficer, as_user_id: "so-2", captures: { err: $.data.error_id } }
            - { call: "POST /api/go-no-go-evaluations/${eval_id}/certify", payload: {}, as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /api/show-events/${show_id}/certify-go", payload: { evaluation_id: "${eval_id}" }, as: SafetyOfficer, as_user_id: "so-2", captures: { final_status: $.data.lifecycle_status, final_posture: $.data.readiness_posture } }
          assert:
            - "while PROVISIONAL (${eval_status} == PROVISIONAL): ${err} == ERR_EVALUATION_NOT_CERTIFIED"
            - "after certification: ${final_status} == GO_CERTIFIED and ${final_posture} == GO"

      - name: charge_session_requires_available_drone
        grounds:
          - state_machines.Drone.AVAILABLE_to_CHARGING
          - state_machines.ChargeSession
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair ChargeSession x Drone (different pair than assignment x drone):
          session start is gated on drone status — GROUNDED rejects, AVAILABLE
          accepts, and while the session is ACTIVE (drone CHARGING) a second
          session for the same drone rejects.
        test_recipe:
          setup:
            - "Site A with ChargeBay BAY-1 (2 ports); drone d1 charge 50, drone d2 charge 60"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/charge-bays", payload: { site_id: "${site_id}", bay_code: "BAY-1", port_count: 2 }, as: FleetManager, captures: { bay_id: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-I01", model: "LUM-2", charge_pct: 50 }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-I02", model: "LUM-2", charge_pct: 60 }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones/${d1}/ground", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d1}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { err_grounded: $.data.error_id } }
            - { call: "POST /api/drones/${d1}/release", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d1}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { sess1: $.data.id, sess1_status: $.data.status, from1: $.data.charge_from_pct } }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d1}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { err_busy: $.data.error_id } }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d2}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { sess2: $.data.id } }
          assert:
            - "GROUNDED drone: ${err_grounded} == ERR_INVALID_STATE"
            - "AVAILABLE drone: ${sess1_status} == ACTIVE and ${from1} == 50"
            - "same drone while CHARGING: ${err_busy} == ERR_INVALID_STATE (drone not AVAILABLE)"
            - "different drone on same bay: ${sess2} created (port 2 of 2)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: authorization_half_open_adjacency_allowed
        grounds:
          - calculations.authorization_window_overlap
          - errors[ERR_AUTHORIZATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) semantics on the site-airspace resource:
          auth B starting exactly when auth A ends (21:00 == 21:00) does NOT
          conflict, while 20:59-23:00 does — adjacency is allowed, true overlap
          is rejected.
        test_recipe:
          setup:
            - "Site A; Show A window 2026-08-10T19:00-19:30Z (auth A UNDER_REVIEW 18:00-21:00); Show B window 2026-08-10T21:30-22:00Z; Show C window 2026-08-11T00:30-01:00Z"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show A", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_a: $.data.id } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show B", window_start: "2026-08-10T21:30:00Z", window_end: "2026-08-10T22:00:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { show_b: $.data.id } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show C", window_start: "2026-08-11T00:30:00Z", window_end: "2026-08-11T01:00:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { show_c: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_a}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_a: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_a}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_b}", window_start: "2026-08-10T21:00:00Z", window_end: "2026-08-10T23:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_b: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_c}", window_start: "2026-08-10T20:00:00Z", window_end: "2026-08-11T01:30:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_c: $.data.id } }
          trigger:
            - { call: "POST /api/airspace-authorizations/${auth_b}/submit", payload: {}, as: ProductionPlanner, captures: { b_status: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_c}/submit", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${b_status} == UNDER_REVIEW — window 21:00-23:00 adjacent to auth A's 18:00-21:00 (start == other.end is NOT an overlap, half-open)"
            - "${err} == ERR_AUTHORIZATION_WINDOW_OVERLAP — window 20:00-01:30 truly overlaps auth A (20:00 < 21:00)"

      - name: charge_bay_aggregate_port_capacity
        grounds:
          - errors[ERR_BAY_CAPACITY_EXCEEDED]
          - entities.ChargeBay.fields.port_count
        distinguishing_aspect: |
          Aggregate-capacity semantics on the ChargeBay resource (NOT binary
          exclusion): port_count 2 admits two overlapping ACTIVE sessions and
          rejects the third; completing one frees a port for the retry —
          contrast with the single-resource half-open rule on airspace.
        test_recipe:
          setup:
            - "Site A; ChargeBay BAY-2 port_count 2; drones d1/d2/d3 charge 50"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/charge-bays", payload: { site_id: "${site_id}", bay_code: "BAY-2", port_count: 2 }, as: FleetManager, captures: { bay_id: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-J01", model: "LUM-2", charge_pct: 50 }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-J02", model: "LUM-2", charge_pct: 50 }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-J03", model: "LUM-2", charge_pct: 50 }, as: FleetManager, captures: { d3: $.data.id } }
          trigger:
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d1}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { s1: $.data.id } }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d2}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { s2: $.data.id } }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d3}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/charge-sessions/${s1}/complete", payload: { charge_to_pct: 90 }, as: FleetManager }
            - { call: "POST /api/charge-sessions", payload: { drone_id: "${d3}", charge_bay_id: "${bay_id}" }, as: FleetManager, captures: { s3: $.data.id, s3_status: $.data.status } }
          assert:
            - "two ACTIVE sessions fill port_count 2; third rejected: ${err} == ERR_BAY_CAPACITY_EXCEEDED"
            - "after completing s1 (drone d1 charge 50 -> 90, AVAILABLE): ${s3_status} == ACTIVE"

      - name: show_window_turnaround_buffer_semantics
        grounds:
          - calculations.show_window_turnaround
          - errors[ERR_SHOW_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Buffer-gap semantics on the site-show resource (third semantics kind):
          shows must keep a 120-minute turnaround, so a show starting 90 minutes
          after another ends conflicts even though the raw windows do not
          overlap, while exactly 120 minutes is allowed.
        test_recipe:
          setup:
            - "Site A; Show A window 2026-08-10T19:00-19:30Z"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show A", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_a: $.data.id } }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show B", window_start: "2026-08-10T21:00:00Z", window_end: "2026-08-10T21:30:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show C", window_start: "2026-08-10T21:30:00Z", window_end: "2026-08-10T22:00:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { show_c: $.data.id, c_status: $.data.lifecycle_status } }
          assert:
            - "${err} == ERR_SHOW_WINDOW_CONFLICT — 90-minute gap < 120-minute turnaround buffer despite non-overlapping windows"
            - "${c_status} == PLANNING — exactly 120 minutes after Show A's end is allowed (>= boundary)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: drone_pool_partition_invariant_assign_void
        grounds:
          - state_machines.LaunchGridAssignment.ASSIGNED_to_VOIDED
          - state_machines.Drone
          - entities.ShowEvent.fields.assigned_count
        distinguishing_aspect: |
          Conserved quantity = fleet pool size: count(AVAILABLE) +
          count(RESERVED) over {d1,d2,d3} stays 3 across every assign/void pair;
          show.assigned_count returns to its prior value; grounding is the only
          operation that legitimately shrinks the pool (by design).
        test_recipe:
          setup:
            - "Site A; Show S AUTHORIZED (pinned design 300ft/2 drones); drones d1,d2,d3 all AVAILABLE charge 100"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 2 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 2, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-K01", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-K02", model: "LUM-2" }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-K03", model: "LUM-2" }, as: FleetManager, captures: { d3: $.data.id } }
          trigger:
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager, captures: { a1: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager, captures: { a2: $.data.id } }
            - { call: "GET /api/show-events/${show_id}", as: FleetManager, captures: { st_ready: $.data.lifecycle_status, cnt_ready: $.data.assigned_count } }
            - { call: "POST /api/launch-grid-assignments/${a1}/void", payload: {}, as: FleetManager }
            - { call: "GET /api/drones/${d1}", as: FleetManager, captures: { d1_after_void: $.data.status } }
            - { call: "GET /api/show-events/${show_id}", as: FleetManager, captures: { st_after_void: $.data.lifecycle_status, cnt_after_void: $.data.assigned_count } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager, captures: { a1b: $.data.id } }
            - { call: "POST /api/drones/${d2}/ground", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /api/drones/${d2}", as: FleetManager, captures: { d2_grounded: $.data.status } }
            - { call: "GET /api/launch-grid-assignments/${a2}", as: FleetManager, captures: { a2_status: $.data.status } }
            - { call: "GET /api/show-events/${show_id}", as: FleetManager, captures: { cnt_final: $.data.assigned_count, st_final: $.data.lifecycle_status } }
          assert:
            - "after 2 assigns: ${st_ready} == READY, ${cnt_ready} == 2; pool: d1,d2 RESERVED + d3 AVAILABLE -> AVAILABLE+RESERVED == 3"
            - "after void a1: ${d1_after_void} == AVAILABLE, ${st_after_void} == AUTHORIZED, ${cnt_after_void} == 1; pool conserved at 3"
            - "re-assign a1 succeeds (${a1b} created) — VOIDED frees slot and drone"
            - "ground RESERVED d2: ${d2_grounded} == GROUNDED and ${a2_status} == VOIDED and ${cnt_final} == 1 and ${st_final} == AUTHORIZED"
            - "grounding shrinks the pool by exactly 1 (d2 leaves AVAILABLE/RESERVED); no drift in assigned_count vs live ASSIGNED rows"

      - name: refund_settle_void_money_conservation
        grounds:
          - calculations.cancellation_refund
          - state_machines.ShowEvent
          - entities.ShowEvent.fields.refunded_total_cents
        distinguishing_aspect: |
          Conserved quantity = money: paid_total_cents == refunded_total_cents +
          retained_cents at every step; settle posts 468563 (T2), void reverses
          to 0, and paid_total_cents never moves (551250 throughout) — payment
          status round-trips PAID_IN_FULL -> REFUNDED -> PAID_IN_FULL.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones, contract 551250) PAID_IN_FULL; clock 2026-08-02T19:00:00Z (lead 192h -> T2)"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "BALANCE", amount_cents: 385875 }, as: ProductionPlanner, captures: { paid0: $.data.paid_total_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T19:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events/${show_id}/cancel", payload: {}, as: ProductionPlanner, captures: { tier: $.data.cancellation_tier, due: $.data.refund_due_cents, rt1: $.data.refunded_total_cents, pt1: $.data.paid_total_cents, ps1: $.data.payment_status } }
            - { call: "POST /api/show-events/${show_id}/settle-cancellation", payload: {}, as: ProductionPlanner, captures: { rt2: $.data.refunded_total_cents, pt2: $.data.paid_total_cents, ps2: $.data.payment_status, cs2: $.data.cancellation_status } }
            - { call: "POST /api/show-events/${show_id}/void-cancellation", payload: {}, as: ProductionPlanner, captures: { rt3: $.data.refunded_total_cents, pt3: $.data.paid_total_cents, ps3: $.data.payment_status, cs3: $.data.cancellation_status } }
          assert:
            - "${tier} == T2_DEPOSIT_HALF and ${due} == 468563"
            - "after cancel: ${rt1} == 0 and ${pt1} == 551250 and ${ps1} == PAID_IN_FULL (refund not yet posted)"
            - "after settle: ${rt2} == 468563 and ${pt2} == 551250 and ${ps2} == REFUNDED and ${cs2} == SETTLED (468563 refunded + 82687 retained == 551250)"
            - "after void: ${rt3} == 0 and ${pt3} == 551250 and ${ps3} == PAID_IN_FULL and ${cs3} == VOIDED (0 refunded + 551250 retained == 551250)"
