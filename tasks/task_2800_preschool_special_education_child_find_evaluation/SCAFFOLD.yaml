    code: 200
    input: []
    output: Child
    side_effects: []

  - method: GET
    path: "/child-find/community-sites/{id}"
    description: "Fetch one community preschool site with its live reserved_iep_seat_count."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, DistrictAdmin]
