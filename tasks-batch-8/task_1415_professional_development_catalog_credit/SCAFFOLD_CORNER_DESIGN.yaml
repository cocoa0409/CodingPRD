        as: BusinessOfficer
        captures:
          bud1: $.data.id
      - call: POST /pd/budgets/${bud1}/open
        payload: {}
        as: BusinessOfficer
      - call: POST /pd/employees
        payload:
          full_name: T CC
          email: tcc@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: T CD
          email: tcd@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t2: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: I CC
          email: icc@x.com
          employee_kind: SPECIALIST
          primary_building_id: ${b1}
          base_lane: MA
        as: PDCoordinator
        captures:
          ins1: $.data.id
      - call: POST /pd/courses
        payload:
          course_code: CC-1
          title: Cancel Course
          delivery_mode: IN_PERSON
          clock_hours: 5
          fee_cents: 10000
        as: PDCoordinator
        captures:
          c1: $.data.id
      - call: POST /pd/sections
        payload:
          course_id: ${c1}
          term: 2026-FALL
          instructor_id: ${ins1}
          building_id: ${b1}
          room: R1
          seat_capacity: 1
          starts_at: '2026-08-15T09:00:00Z'
          ends_at: '2026-08-20T17:00:00Z'
          registration_opens_at: '2026-08-01T00:00:00Z'
          registration_closes_at: '2026-08-10T00:00:00Z'
        as: PDCoordinator
        captures:
          s1: $.data.id
      - call: POST /pd/sections/${s1}/meetings
        payload:
          starts_at: '2026-08-15T10:00:00Z'
          ends_at: '2026-08-15T12:00:00Z'
          room: R1
        as: PDCoordinator
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t1}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t1}
        captures:
          r1: $.data.id
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t2}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t2}
        captures:
          r2: $.data.id
      trigger:
      - call: POST /pd/sections/${s1}/cancel
