            - "report 2 (total units 100001): royalty_rate_applied == 0.022 and provisional_royalty_cents == 2200"

      - name: coverage_exactly_one_allows_secured
        claim_type: correct_result
        grounds: ["calculations.commitment_coverage", "errors[ERR_COMMITMENT_COVERAGE_INSUFFICIENT]"]
        distinguishing_aspect: "base_coverage uses an inclusive >= 1.00 gate: exactly 1.00 (base_units 12000 == required_units 12000) passes and yields TIER_B with effective_units 12240."
        test_recipe:
          setup: ["program NDA_EXECUTED"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 11000, required_units: 12000, prepayment_cents: 1000000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
          trigger:
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_status: $.data.status, c_tier: $.data.coverage_tier, c_eff: $.data.effective_units } }
          assert:
            - "http 200: credit_units 1000 + committed 11000 == base 12000 -> base_coverage exactly 1.00 passes the inclusive gate"
            - "coverage_tier == TIER_B; effective_units == 12240 (floor(12000 * 1.02)); status == SECURED"

      - name: coverage_below_one_returns_coverage_insufficient
        claim_type: violation_to_error
        grounds: ["calculations.commitment_coverage", "errors[ERR_COMMITMENT_COVERAGE_INSUFFICIENT]"]
        distinguishing_aspect: "base_coverage 0.5 (base_units 6000 vs required 12000) fails the confirm-prepayment gate."
        test_recipe:
