# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2716_store_closing_going_out_of_business_sale
#
# The claim-extraction-guide walked row-by-row against §1.1-§1.7 of SCAFFOLD.yaml.
# `section:` values are exactly the guide's nine sections; `claim_type:` values are
# exactly the guide's per-section table rows. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no test_recipe.
#
# Canonical minimal chain reused by most instances ("MIN chain"), which drives an
# empty DB to one SELLING store in NY holding a single ORIGINAL lot worth 2,000,000
# cents of cost across 1,000 units:
#   clock 2026-09-15 -> POST /jurisdictions -> POST /engagements -> POST .../stores
#   -> POST .../inventory-lots -> submit-for-approval -> approval-decision APPROVE
#   -> POST .../gob-licenses -> POST /gob-licenses/{id}/decision APPROVE (second officer)
# Fixed opaque actor ids: lc-1 (LiquidationConsultant), rc-1 (RetailerController),
# co-1 / co-2 (ComplianceOfficer, distinct for segregation of duties). A StoreManager
# always authenticates as its own store id.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: jurisdiction_create_returns_every_declared_field_with_201
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
          - response_envelope.success
        distinguishing_aspect: "A jurisdiction created with all required fields returns 201 and echoes every declared field, with id/created_at/updated_at/version supplied by the server."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "data.code == NY, data.name == 'New York', data.gob_license_required == true, data.max_sale_days == 60"
            - "data.license_cooling_off_days == 30, data.max_augmentation_ratio == 0.10, data.augmentation_disclosure_required == true, data.advertising_disclosure_required == false, data.surrender_notice_days == 10"
            - "data.id is a non-empty server-generated string, data.version == 1, data.created_at == data.updated_at"

      - name: store_get_returns_exactly_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /stores/{id}]
          - entities.Store
        distinguishing_aspect: "GET /stores/{id} returns the same row the create returned, including the computed rollups original_cost_value_cents 2,000,000 and units_initial_total 1,000."
        test_recipe:
          setup:
            - "MIN chain through the inventory lot only (no licence yet), so the store is still PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9001", address_line: "1 Corner Way" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "APPAREL", source: "ORIGINAL", units_initial: 1000, unit_cost_cents: 2000, unit_retail_cents: 5000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
          trigger:
            - call: "GET /stores/${st}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
          assert:
            - "HTTP 200 with data.id == ${st} and data.engagement_id == ${eng} and data.jurisdiction_id == ${j_ny}"
            - "data.store_code == 'S-9001' and data.address_line == '1 Corner Way'"
            - "data.store_status == PLANNED and data.suspension_reason == NONE and data.selling_start_date == null"
            - "data.original_cost_value_cents == 2000000, data.units_initial_total == 1000, data.units_sold_total == 0"
            - "data.realized_sell_through_pct == 0.0000, data.planned_avg_discount_pct == 0.0000, data.augmentation_units_accounted == 0"

      - name: store_list_paginates_with_limit_offset_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /stores]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three stores in one engagement, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One DRAFT engagement with three stores S-9101, S-9102, S-9103 in NY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9101", address_line: "1 List Rd" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9102", address_line: "2 List Rd" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9103", address_line: "3 List Rd" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
          trigger:
            - call: "GET /stores"
              payload: { engagement_id: "${eng}", limit: 2, offset: 0 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "GET /stores"
              payload: { engagement_id: "${eng}", limit: 2, offset: 2 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
          assert:
            - "the first read returns response_type == array with exactly 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "the second read returns exactly 1 row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the three store_code values across both pages are exactly S-9101, S-9102, S-9103 with no duplicates"

      - name: store_get_unknown_id_returns_store_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=35]
          - errors[ERR_STORE_NOT_FOUND]
          - endpoints[GET /stores/{id}]
        distinguishing_aspect: "A syntactically valid but unknown store id returns ERR_STORE_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /stores/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_STORE_NOT_FOUND"
            - "data.message is a non-empty string and no store row is created"

      - name: engagement_create_missing_expense_responsibility_rejects_request
        claim_type: Required Fields
        grounds:
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /engagements]
          - entities.Engagement.fields.expense_responsibility
        distinguishing_aspect: "expense_responsibility has source input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and creates no engagement."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Engagement row exists afterwards"

      - name: jurisdiction_create_omitting_optional_flags_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Jurisdiction.fields.augmentation_prohibited
          - entities.Jurisdiction.fields.prohibited_claim_codes
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "augmentation_prohibited and prohibited_claim_codes are the only optional inputs on POST /jurisdictions; omitting both yields false and an empty list rather than null."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "OR", name: "Oregon", gob_license_required: false, max_sale_days: 90, license_cooling_off_days: 0, max_augmentation_ratio: 0.25, augmentation_disclosure_required: false, advertising_disclosure_required: false, surrender_notice_days: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_or: $.data.id }
          assert:
            - "HTTP 201 with data.augmentation_prohibited == false (declared default applied, not null)"
            - "data.prohibited_claim_codes == [] (declared default applied, not null)"
            - "data.gob_license_required == false and data.max_augmentation_ratio == 0.25 exactly as submitted"

      - name: inventory_lot_value_fields_are_computed_from_units_and_unit_prices
        claim_type: Computed Fields
        grounds:
          - entities.InventoryLot.fields.cost_value_cents
          - entities.InventoryLot.fields.retail_value_cents
          - entities.InventoryLot.fields.units_on_hand
          - endpoints[POST /stores/{id}/inventory-lots]
        distinguishing_aspect: "cost_value_cents and retail_value_cents are source computed and are never taken from input: 400 units at 3,000/7,000 cents yields exactly 1,200,000 and 2,800,000 with units_on_hand seeded to 400."
        test_recipe:
          setup:
            - "One DRAFT engagement with one PLANNED store in NY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9201", address_line: "4 Lot Ln" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "FOOTWEAR", source: "ORIGINAL", units_initial: 400, unit_cost_cents: 3000, unit_retail_cents: 7000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { lot: $.data.id }
            - call: "GET /stores/${st}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
          assert:
            - "InventoryLot.${lot}.cost_value_cents == 1200000 and retail_value_cents == 2800000"
            - "InventoryLot.${lot}.units_on_hand == 400, units_sold == 0, units_returned == 0, lot_status == ON_FLOOR"
            - "Store.${st}.original_cost_value_cents == 1200000 and units_initial_total == 400 in the same read"
            - "Store.${st}.projected_gross_recovery_cents == 2240000 (floor(400 * 0.80) == 320 FOOTWEAR units at 7,000 cents with planned_avg_discount_pct 0.0000)"

      - name: engagement_create_stamps_system_fields_without_client_input
        claim_type: System Fields
        grounds:
          - entities.Engagement
          - endpoints[POST /engagements]
        distinguishing_aspect: "id, created_at, updated_at and version are not in POST /engagements' input yet all four are present and server-stamped, with version == 1 and engagement_status defaulting to DRAFT."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
          assert:
            - "data.id is present and non-empty although no id was submitted"
            - "data.version == 1 and data.created_at == data.updated_at == 2026-09-15T00:00:00Z (the logical clock instant, not wall-clock time)"
            - "data.engagement_status == DRAFT, data.compliance_strike_count == 0, data.compliance_posture == OPEN"
            - "every money rollup starts at 0: original_cost_value_cents, guaranty_amount_cents, projected_gross_recovery_cents, expense_total_cents, retention_accrual_cents"

      - name: employee_create_with_attendance_rate_above_one_is_refused
        claim_type: Type Constraints
        grounds:
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
          - entities.Employee.fields.attendance_rate
          - endpoints[POST /stores/{id}/employees]
        distinguishing_aspect: "attendance_rate is a percentage constrained to [0, 1] by priority 30, so 1.25 is refused with ERR_INVALID_REQUEST before any retention arithmetic runs."
        test_recipe:
          setup:
            - "MIN chain: one SELLING store in NY under an APPROVED licence"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9301", address_line: "6 Rate Rd" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "APPAREL", source: "ORIGINAL", units_initial: 1000, unit_cost_cents: 2000, unit_retail_cents: 5000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/submit-for-approval"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /stores/${st}/gob-licenses"
              payload: { license_number: "NY-GOB-9301", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic: $.data.id }
            - call: "POST /gob-licenses/${lic}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "POST /stores/${st}/employees"
              payload: { employee_code: "EMP-Z", retention_bonus_cents: 100000, retention_start_date: "2026-09-15", retention_target_date: "2026-11-15", attendance_rate: 1.25 }
              as: StoreManager
              as_user_id: "${st}"
              captures: { err_pct: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /stores/${st}/employees returns an empty array"
            - "Engagement.${eng}.retention_accrual_cents == 0"

      - name: store_create_under_unknown_engagement_returns_engagement_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=35]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - entities.Store.fields.engagement_id
          - endpoints[POST /engagements/{id}/stores]
        distinguishing_aspect: "The path id is checked before payload FKs, so an unknown engagement id returns ERR_ENGAGEMENT_NOT_FOUND even when the jurisdiction_id in the body is also unknown."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock — neither the engagement nor the jurisdiction exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /engagements/00000000-0000-0000-0000-000000000000/stores"
              payload: { jurisdiction_id: "11111111-1111-1111-1111-111111111111", store_code: "S-9401", address_line: "7 Ghost St" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { err_eng_nf: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_ENGAGEMENT_NOT_FOUND"
            - "data.error_id != ERR_JURISDICTION_NOT_FOUND — path ids are resolved before payload FKs per priority 35"
            - "no Store row is created"

      - name: store_create_with_unknown_jurisdiction_returns_jurisdiction_not_found
        claim_type: hybrid
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=35]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - entities.Store.fields.jurisdiction_id
        distinguishing_aspect: "Jurisdiction is the cross-cutting configuration entity of the hybrid topology: a Store create with a valid engagement path id but an unknown jurisdiction_id is refused with ERR_JURISDICTION_NOT_FOUND."
        test_recipe:
          setup:
            - "One DRAFT engagement and one NY jurisdiction; the id used in the trigger belongs to neither"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "22222222-2222-2222-2222-222222222222", store_code: "S-9501", address_line: "8 Nowhere Ave" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { err_j_nf: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_JURISDICTION_NOT_FOUND"
            - "GET /stores with engagement_id == ${eng} returns total_count == 0"
            - "Engagement.${eng}.version is unchanged at 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: child_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines[MarkdownStage].initial_state
          - state_machines[LeaseDisposition].initial_state
          - state_machines[SalesDay].initial_state
          - state_machines[ExpenseItem].initial_state
        distinguishing_aspect: "Four independent child machines are created in one scenario and each lands on its own declared initial state: MarkdownStage ARMED, LeaseDisposition DRAFT, SalesDay PENDING_REVIEW, ExpenseItem SUBMITTED."
        test_recipe:
          setup:
