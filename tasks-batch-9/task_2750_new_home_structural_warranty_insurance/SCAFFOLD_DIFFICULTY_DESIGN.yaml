  - rule_id: transitive_cascade
    instances:
      - name: single_payment_propagates_six_links_to_a_sibling_policy_enrollment_hold
        grounds:
          - endpoints.POST_/warranty/claims/{id}/payments
          - calculations.coverage_limit_conservation
          - state_machines.CoverageTerm.OPEN_to_LIMIT_EXHAUSTED
          - state_machines.Claim.INSURER_ADJUDICATION_to_SUSPENDED_NO_LIMIT
          - calculations.claim_incurred_conservation
          - calculations.builder_loss_ratio
          - entities.WarrantyPolicy.fields.enrollment_hold
        distinguishing_aspect: |
          §0.5 Rule 4 depth 6, and every link is CAUSED BY the previous one rather than fanned out
          from the trigger: (1) the payment moves 5000000 from reserve into paid, (2) BECAUSE paid
          rose, coverage_limit_conservation charges the term to remaining 0, (3) BECAUSE remaining
          hit 0, the CoverageTerm crosses OPEN -> LIMIT_EXHAUSTED, (4) BECAUSE the term exhausted,
          the untouched SIBLING claim is force-moved to SUSPENDED_NO_LIMIT and its 475000 reserve is
          released, (5) BECAUSE that sibling's reserve changed, builder_loss_ratio recomputes to
          111.4057 and the posture crosses to FROZEN, (6) BECAUSE the posture became FROZEN, a
          DIFFERENT policy of the same builder - one the payment never named - has enrollment_hold
          flipped to true, which then makes its activation fail. Links 4 to 6 cross three entities
          the request body never mentions. Cutting the chain at link 3 still leaves a plausible
          implementation, which is what makes the depth falsifiable.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED"
            - "policy PA on a 5000000 home, premium_cents 44881, ACTIVE and PAID, whose STRUCTURAL term carries limit_cents 5000000"
            - "policy PB on a second 5000000 home for the SAME builder, enrolled and PAID while monitoring_posture is still OPEN so it is accepted, then deliberately left in PENDING_ENROLLMENT with enrollment_hold false"
            - "logical clock at 2028-09-01T00:00:00Z so the STRUCTURAL term is the only term in force and both claims route to INSURER"
            - "claim CA on PA, WATER_INTRUSION so no structural assessment is required, claimed_amount_cents 6000000, substantiation_ratio 1.00, routed and then APPROVED by adjuster-001: gross 6000000, deductible 100000, provisional_net 5900000, betterment 472000, and the step-7 cap pulls net_payable down to the remaining limit 5000000"
