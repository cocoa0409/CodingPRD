              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/fail"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
              captures: { err1: $.data.error_id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
