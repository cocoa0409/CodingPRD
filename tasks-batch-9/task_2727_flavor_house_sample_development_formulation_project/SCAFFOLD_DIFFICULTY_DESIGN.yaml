  - rule_id: compensating_invariant
    instances:
      - name: lot_gram_mass_conserved_across_shipment_cancel_and_retention_withdraw
        grounds:
          - calculations.sample_mass_ledger
          - entities.SampleLot.fields.allocated_g
          - entities.SampleLot.fields.available_g
          - state_machines.SampleShipment.DRAFT_to_CANCELLED
          - state_machines.RetentionSample.STORED_to_WITHDRAWN
          - validations[priority=80]
        distinguishing_aspect: |
          Conserved quantity: the GRAM MASS of a SampleLot, where
          batch_size_g == available_g + allocated_g must hold after every request.
          Two different compensating actions unwind two different allocation
          sources — cancelling a 150 g shipment and withdrawing a 120 g retention
          aliquot — and each must return available_g to exactly its pre-action
          value (230 -> 380 -> 500), never to an approximation and never
          double-counting the reversal.
        test_recipe:
          setup:
            - "Brief BRF-0001 ACCEPTED, formula F1 APPROVED, one 500 g lot QC PASSED and RELEASED (available_g 500, allocated_g 0)."
            - "Cabinet CAB-03 with capacity_slots 4; a 120 g retention aliquot stored 2026-08-01 to 2026-11-01."
            - "A 150 g shipment to the US in status DRAFT."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "CITRAL-NAT", name: "Natural Citral", cost_per_kg_cents: 45333, natural_status: "NATURAL", potency_class: "HIGH_IMPACT", max_use_ppm: 50000 }
              as: PurchasingManager
              captures: { m1: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "ETHYL-BUT", name: "Ethyl Butyrate Natural", cost_per_kg_cents: 9876, natural_status: "NATURAL", potency_class: "STANDARD", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m2: $.data.id }
