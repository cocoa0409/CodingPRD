            - "hop 3: Stall.${stall_paint_id}.booked_minutes == 0"
            - "Stall.${stall_body_id}.booked_minutes == 0 (released earlier when the order left REPAIR; the rollback does not re-book it)"
            - "ledger: RepairOrder.${ro_id}.parts_ordered_gross_cents == 10000, parts_committed_cents == 0, parts_return_credit_cents == 10000, parts_restocking_loss_cents == 0"
            - "totals: RepairOrder.${ro_id}.parts_gross_cents == 0, pre_tax_total_cents == 28080, insurer_authorized_cents == 3080, customer_pay_cents == 25000, authorization_posture == OPEN"
            - "RepairOrder.${ro_id}.open_parts_delay_count == 1 (an INCORRECT_PART delay event opened)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_posture_freeze_outranks_customer_exposure_ceiling
        grounds:
          - validations.priority_40
          - validations.priority_90
          - errors.ERR_AUTHORIZATION_POSTURE_BLOCKED
          - errors.ERR_AUTHORIZED_AMOUNT_EXCEEDED
        distinguishing_aspect: |
          Categories state (40) versus business_fiscal (90) on POST /parts-lines/{id}/order. The order
          breaks both rules at once - an open supplement has frozen the posture AND customer_pay_cents
          37080 exceeds deductible 25000 - and the response must be ERR_AUTHORIZATION_POSTURE_BLOCKED
          (409), not ERR_AUTHORIZED_AMOUNT_EXCEEDED (402). Clearing the supplement flips the answer to
          the fiscal error, which is what proves the ranking rather than a coincidence.
        test_recipe:
          setup:
            - "Repair order with initial_authorized_cents 1000 and deductible_cents 25000, locked with a single BODY 4.5 h line: pre-tax 28080, insurer capped at 1000, customer_pay 27080 - already over the deductible but below the 50000 consent threshold, so the posture is OPEN."
            - "One OEM parts line at 10000 qty 1, price-locked: pre-tax 38080, insurer 1000, customer_pay 37080, posture still OPEN."
            - "A supplement for 5000 is then raised, which drives the posture to SUPPLEMENT_PENDING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ken Mori", phone: "555-0177", email: "ken@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
