              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version, quoted_at_create: $.data.quoted_cents, net_at_create: $.data.net_billable_cents }
          trigger:
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "GET /service-sites/${site_id}"
              payload: {}
