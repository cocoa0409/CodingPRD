            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /devices"
            payload: { serial_number: "SN-WD-0001", model: "NEO", firmware_version: "4.0.0" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { dev: "$.data.id" }
          - call: "POST /patients"
