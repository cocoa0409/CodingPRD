# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3378_business_accreditation_complaint_mediation_rating_methodology
# Breadth probe over §1.1-§1.7 claims not exercised by SCAFFOLD_DIFFICULTY_DESIGN.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: bureau_create_applies_defaults_and_returns_envelope
        claim_type: Creation
        grounds:
          - entities.Bureau
          - endpoints.POST_/bureaus
          - response_envelope
        distinguishing_aspect: "A bureau created without local_dues_fee_cents gets 0, dues_collected_cents 0, ops_day_index 0, version 1, and the success envelope carries meta.api_request_id plus response_type object."
        test_recipe:
          setup:
            - "Logical clock unset (startup default 2026-09-01T00:00:00Z). Empty database."
          setup_api_calls: []
          trigger:
            - &k_bureau
              call: "POST /bureaus"
              payload: { name: "Heartland Bureau", territory_state_codes: ["IA", "NE"] }
              as: BureauAdmin
              captures: { bureau_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Bureau.${bureau_id}.local_dues_fee_cents == 0 (default applied)"
            - "Bureau.${bureau_id}.dues_collected_cents == 0 and ops_day_index == 0 and version == 1"
            - "data carries non-null id, created_at == \"2026-09-01T00:00:00Z\" (clock default), updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: business_create_computes_territory_and_size_tier
        claim_type: Computed Fields
        grounds:
          - entities.Business.fields.bureau_id
          - entities.Business.fields.size_tier
          - calculations.territory_assignment
        distinguishing_aspect: "bureau_id and size_tier are server-computed: a 50-employee business in KS lands in the KS/MO bureau as MEDIUM, and the response carries the computed fields on creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One bureau covering KS/MO."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { name: "Prairie Bureau", territory_state_codes: ["KS", "MO"], local_dues_fee_cents: 0 }
              as: BureauAdmin
              captures: { bureau_id: $.data.id }
          trigger:
            - call: "POST /businesses"
              payload: { legal_name: "Kansas Plains LLC", home_state_code: "KS", employee_count: 50, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Business.${biz_id}.bureau_id == ${bureau_id} (territory assignment computed)"
            - "Business.${biz_id}.size_tier == MEDIUM (20-99 employees)"
            - "Business.${biz_id}.accreditation_status == NOT_ACCREDITED and advertising_compliance_status == CLEAR"
            - "all complaint counters == 0 and current_published_score is null"

      - name: business_create_with_uncovered_state_returns_territory_uncovered
        claim_type: Type Constraints
        grounds:
          - calculations.territory_assignment
          - errors.ERR_TERRITORY_UNCOVERED
        distinguishing_aspect: "A business whose home_state_code no bureau covers is rejected 422 ERR_TERRITORY_UNCOVERED and no row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One bureau covering only IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "POST /businesses"
              payload: { legal_name: "Texas Outsider LLC", home_state_code: "TX", employee_count: 5, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_TERRITORY_UNCOVERED"
            - "GET /businesses?home_state_code=TX returns 0 rows"

      - name: bureau_create_with_duplicate_state_returns_state_already_assigned
        claim_type: Type Constraints
        grounds:
          - entities.Bureau.fields.territory_state_codes
          - errors.ERR_STATE_ALREADY_ASSIGNED
        distinguishing_aspect: "A second bureau claiming a state code already assigned fails 409 ERR_STATE_ALREADY_ASSIGNED even when its other state codes are free."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau 1 covers IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "POST /bureaus"
              payload: { name: "Overlapping Bureau", territory_state_codes: ["NE", "SD"] }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_STATE_ALREADY_ASSIGNED (NE already claimed)"
            - "GET /businesses creation in SD remains possible only after a non-overlapping bureau is created"

      - name: consumer_create_rejects_duplicate_email
        claim_type: Required Fields
        grounds:
          - entities.Consumer.fields.email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Consumer email uniqueness is enforced at creation: the second registration with the same address is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One consumer pat@example.com."
          setup_api_calls:
            - *k_clock
            - &k_consumer
              call: "POST /consumers"
              payload: { full_name: "Pat Consumer", email: "pat@example.com", home_state_code: "IA" }
              as: BureauAdmin
              captures: { consumer_id: $.data.id }
          trigger:
            - call: "POST /consumers"
              payload: { full_name: "Patrick Consumer", email: "pat@example.com", home_state_code: "NE" }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: business_create_rejects_zero_employee_count
        claim_type: Required Fields
        grounds:
          - entities.Business.fields.employee_count
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "employee_count 0 violates the >= 1 bound and is a 400 ERR_INVALID_REQUEST before any territory computation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau over IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "POST /businesses"
              payload: { legal_name: "No Employees LLC", home_state_code: "IA", employee_count: 0, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /businesses returns 0 rows"

      - name: business_create_extra_status_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Business.fields.accreditation_status
          - entities.Business
        distinguishing_aspect: "Client-supplied accreditation_status and version in the create body are ignored: the business is created NOT_ACCREDITED with version 1 (system fields are never client-writable)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau over IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "POST /businesses"
              payload: { legal_name: "Eager Beaver LLC", home_state_code: "IA", employee_count: 3, founded_on: "2020-01-01T00:00:00Z", accreditation_status: "ACCREDITED", version: 99 }
              as: BureauAdmin
              captures: { biz_id: $.data.id, biz_status: $.data.accreditation_status, biz_v: $.data.version }
          assert:
            - "the response status is 201"
            - "Business.${biz_id}.accreditation_status == NOT_ACCREDITED (client value ACCREDITED ignored)"
            - "Business.${biz_id}.version == 1 (client value 99 ignored)"

      - name: complaints_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/complaints
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three complaints on one business, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status filter narrows the set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; three complaints filed (all RECEIVED), one of them forwarded."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - &k_biz_large
              call: "POST /businesses"
              payload: { legal_name: "BigBox Services Inc", home_state_code: "IA", employee_count: 250, founded_on: "2018-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id, biz_v: $.data.version }
            - &k_c1_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "SERVICE", description: "p1" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c1_id: $.data.id }
            - &k_c2_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "BILLING", description: "p2" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c2_id: $.data.id }
            - &k_c3_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "DELIVERY", description: "p3" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "GET /complaints"
              payload: { business_id: "${biz_id}", limit: 2, offset: 0 }
              as: BureauAdmin
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /complaints?business_id=${biz_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /complaints?business_id=${biz_id}&status=RECEIVED returns 2 rows; status=FORWARDED returns 1 row"
            - "GET /complaints with no parameters uses limit 10 / offset 0 defaults"
            - "response_type is array and meta carries api_request_id"

      - name: complaint_get_with_unknown_id_returns_404_envelope
        claim_type: Not Found
        grounds:
          - endpoints.GET_/complaints/{id}
          - errors.ERR_COMPLAINT_NOT_FOUND
          - response_envelope
        distinguishing_aspect: "An unallocated complaint id produces the entity-specific 404 ERR_COMPLAINT_NOT_FOUND with the standard error envelope (error_id + message)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_COMPLAINT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complaint_created_in_received_with_empty_responses
        claim_type: Initial State
        grounds:
          - state_machines.Complaint
          - endpoints.POST_/complaints
        distinguishing_aspect: "A new complaint starts RECEIVED with filed_at equal to the logical clock, empty responses, rebuttal_count 0, and all window/outcome fields null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
          trigger:
            - *k_c1_file
          assert:
            - "Complaint.${c1_id}.status == RECEIVED"
            - "Complaint.${c1_id}.filed_at == \"2026-09-01T00:00:00Z\" (logical clock, not wall clock)"
            - "responses == [], rebuttal_count == 0, reopen_count == 0"
            - "forwarded_at, response_deadline_at, last_unresolved_at, resolution_outcome, closed_at are all null"
            - "Business.${biz_id}.complaints_open_count == 1"

      - name: forward_twice_rejected_and_deadline_unchanged
        claim_type: Idempotency
        grounds:
          - state_machines.Complaint.RECEIVED_to_FORWARDED
          - errors.ERR_COMPLAINT_INVALID_STATE
        distinguishing_aspect: "Forwarding an already-FORWARDED complaint is rejected ERR_COMPLAINT_INVALID_STATE and the original response_deadline_at is not moved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; complaint c1 FORWARDED (deadline 2026-09-15T00:00:00Z)."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
              captures: { deadline_1: $.data.response_deadline_at }
          trigger:
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "second forward returns 409 with error_id == ERR_COMPLAINT_INVALID_STATE"
            - "Complaint.${c1_id}.response_deadline_at is still \"2026-09-15T00:00:00Z\" (unchanged)"

      - name: consumer_accept_before_any_business_response_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Complaint.RESPONSE_RECEIVED_to_RESOLVED
          - errors.ERR_COMPLAINT_INVALID_STATE
        distinguishing_aspect: "CONSUMER_ACCEPT is only valid from RESPONSE_RECEIVED; from FORWARDED (business never answered) it is a 409 ERR_COMPLAINT_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; complaint c1 FORWARDED with no responses."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - &k_c1_forward
              call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_ACCEPT", body: "premature" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_COMPLAINT_INVALID_STATE"
            - "Complaint.${c1_id}.status remains FORWARDED and responses == []"

      - name: arbitration_full_path_adverse_decision_closes_complaint
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ArbitrationCase
          - state_machines.Complaint.IN_ARBITRATION_to_ARBITRATED
          - errors.ERR_ARBITRATION_INVALID_STATE
        distinguishing_aspect: "The full mediation-to-arbitration pipeline: render-decision from FILED (no hearing) is rejected ERR_ARBITRATION_INVALID_STATE; after scheduling, an ADVERSE_TO_BUSINESS decision closes the complaint ARBITRATED with outcome ARBITRATION_ADVERSE, and the closed complaint rejects reopen (terminal lockdown)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business."
            - "c1 UNRESOLVED -> mediation OFFERED -> both accept -> SCHEDULED (med-a 2026-09-22 09:00-10:00) -> CONCLUDED_NO_AGREEMENT (complaint MEDIATION_FAILED) -> arbitration a1 FILED (complaint IN_ARBITRATION)."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - &k_c1_respond
              call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "offer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - &k_c1_reject
              call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "no" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - &k_c1_mediate
              call: "POST /complaints/${c1_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { m1_id: $.data.id }
            - &k_m1_biz_accept
              call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "BUSINESS", response: "ACCEPT" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - &k_m1_con_accept
              call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - &k_m1_schedule
              call: "POST /mediation-cases/${m1_id}/schedule"
              payload: { mediator_id: "med-a", session_start_at: "2026-09-22T09:00:00Z", session_end_at: "2026-09-22T10:00:00Z" }
              as: BureauAdmin
            - &k_m1_no_agreement
              call: "POST /mediation-cases/${m1_id}/conclude"
              payload: { outcome: "NO_AGREEMENT" }
              as: BureauAdmin
            - &k_c1_arbitrate
              call: "POST /complaints/${c1_id}/arbitration-cases"
              payload: {}
              as: BureauAdmin
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /arbitration-cases/${a1_id}/render-decision"
              payload: { outcome: "ADVERSE_TO_BUSINESS" }
              as: BureauAdmin
              captures: { premature_err: $.data.error_id }
            - call: "POST /arbitration-cases/${a1_id}/schedule-hearing"
              payload: { hearing_room_id: "room-A", hearing_start_at: "2026-10-05T10:00:00Z", hearing_end_at: "2026-10-05T11:00:00Z" }
              as: BureauAdmin
            - call: "POST /arbitration-cases/${a1_id}/render-decision"
              payload: { outcome: "ADVERSE_TO_BUSINESS" }
              as: BureauAdmin
              captures: { a1_status: $.data.status }
            - call: "POST /complaints/${c1_id}/reopen"
              payload: {}
              as: BureauAdmin
              captures: { reopen_err: $.data.error_id }
          assert:
            - "render-decision from FILED returns 409 ERR_ARBITRATION_INVALID_STATE (hearing not scheduled)"
            - "after schedule-hearing the decision succeeds: ArbitrationCase.${a1_id}.status == DECIDED with outcome ADVERSE_TO_BUSINESS and decided_at == \"2026-09-01T00:00:00Z\""
            - "Complaint.${c1_id}.status == ARBITRATED, resolution_outcome == ARBITRATION_ADVERSE, closed_at non-null"
            - "Business.${biz_id}.complaints_open_count == 0 and complaints_closed_count == 1"
            - "reopen on ARBITRATED returns 409 ERR_COMPLAINT_INVALID_STATE (terminal lockdown)"

      - name: mediation_decline_returns_complaint_to_unresolved_without_window_refresh
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MediationCase.OFFERED_to_DECLINED
          - state_machines.Complaint.MEDIATION_OFFERED_to_UNRESOLVED
        distinguishing_aspect: "A DECLINE by either party flips the case to DECLINED and the complaint back to UNRESOLVED, and last_unresolved_at keeps its original value (the 14-day offer window is not extended by a failed offer)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; c1 UNRESOLVED (last_unresolved_at 2026-09-01T00:00:00Z); mediation m1 OFFERED."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - *k_c1_respond
            - *k_c1_reject
            - *k_c1_mediate
          trigger:
            - call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "BUSINESS", response: "DECLINE" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { m1_status: $.data.status }
          assert:
            - "MediationCase.${m1_id}.status == DECLINED and business_response == DECLINED"
            - "Complaint.${c1_id}.status == UNRESOLVED"
            - "Complaint.${c1_id}.last_unresolved_at == \"2026-09-01T00:00:00Z\" (not refreshed by the decline)"
            - "a fresh POST /complaints/${c1_id}/mediation-cases succeeds (DECLINED is terminal, no active case)"

      - name: mediation_offer_expires_via_daily_close
        claim_type: Valid Transition
        grounds:
          - state_machines.MediationCase.OFFERED_to_DECLINED_EXPIRED
          - endpoints.POST_/bureaus/{id}/run_daily_close
        distinguishing_aspect: "An OFFERED case whose offer_deadline_at (offered_at + 7 days) passes without both accepts flips to DECLINED_EXPIRED at the next sweep, and any later party response is ERR_MEDIATION_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; c1 UNRESOLVED; m1 OFFERED with offer_deadline_at 2026-09-08T00:00:00Z; clock advanced to 2026-09-09."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - *k_c1_respond
            - *k_c1_reject
            - *k_c1_mediate
            - &k_clock_909
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - &k_sweep
              call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
            - call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "after the sweep MediationCase.${m1_id}.status == DECLINED_EXPIRED"
            - "Complaint.${c1_id}.status == UNRESOLVED"
            - "party response on the expired offer returns 409 ERR_MEDIATION_INVALID_STATE"

      - name: invoice_overdue_then_void_expires_application_and_blocks_payment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DuesInvoice
          - state_machines.AccreditationApplication.APPROVED_PENDING_DUES_to_EXPIRED
          - errors.ERR_INVOICE_INVALID_STATE
        distinguishing_aspect: "Cascade through the invoice lifecycle: unpaid invoice goes ISSUED -> OVERDUE at due_date + 1s sweep, then OVERDUE -> VOID at due_date + 15 days sweep, dragging the application to EXPIRED; a payment against the VOID invoice is ERR_INVOICE_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE fee 0; MICRO business (2 employees, founded 2020-01-01)."
            - "Application approved: invoice 40375 (round_half_up(42500 * 0.95)), issued 2026-09-01, due_date 2026-10-01T00:00:00Z. No payment."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Deadbeat Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /businesses/${biz_id}/accreditation-applications"
              payload: { billing_plan: "ANNUAL_PREPAID", license_number: "LIC-D-1" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /accreditation-applications/${app_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
