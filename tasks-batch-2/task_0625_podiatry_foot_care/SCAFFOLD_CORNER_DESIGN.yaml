# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Walks references/claim-extraction-guide.md
# row-by-row. excluded_because stubs cite §1.8 instances by name.
# Flat /podiatry topology; FK references carried in request bodies.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_practice_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Practice, endpoints]
        distinguishing_aspect: "POST /podiatry/practices with name+npi returns 201, applies defaults routine_care_min_interval_days=61 and fee_split_medicare_pct=0.80, and mints id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id, rci: $.data.routine_care_min_interval_days, pct: $.data.fee_split_medicare_pct, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Practice.${prac_id}.routine_care_min_interval_days == 61"
            - "Practice.${prac_id}.fee_split_medicare_pct == 0.80"
            - "Practice.${prac_id}.version == 1"

      - name: create_provider_missing_required_full_name_rejected
        claim_type: Required Fields
        grounds: [entities.Provider.fields.full_name, "validations[priority=5]"]
        distinguishing_aspect: "POST /podiatry/providers without full_name returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_provider_invalid_enum_role_type_rejected
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.role_type, "validations[priority=5]"]
        distinguishing_aspect: "POST /podiatry/providers with role_type=SURGEON (not in {PODIATRIST,NP_PA}) returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr X", role_type: "SURGEON" }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: provider_is_active_default_true
        claim_type: Defaults
        grounds: [entities.Provider.fields.is_active]
        distinguishing_aspect: "Omitting is_active on provider create defaults to true."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Default", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id, act: $.data.is_active }
          assert:
            - "Provider.${prov_id}.is_active == true"

      - name: patient_risk_category_computed_cat2_lops_pad
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.diabetic_foot_risk_category, calculations.diabetic_foot_risk_category]
        distinguishing_aspect: "Patient with LOPS+PAD computes diabetic_foot_risk_category == 2 on create."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat R2", date_of_birth: "1955-01-01", has_diabetes_mellitus: true, has_loss_protective_sensation: true, has_peripheral_arterial_disease: true }
              as: FrontDesk
              captures: { pat_id: $.data.id, cat: $.data.diabetic_foot_risk_category }
          assert:
            - "Patient.${pat_id}.diabetic_foot_risk_category == 2"

      - name: patient_risk_category_cat3_prior_ulcer_overrides
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.diabetic_foot_risk_category, calculations.diabetic_foot_risk_category]
        distinguishing_aspect: "has_prior_ulcer_or_amputation=true forces category 3 even with no LOPS/PAD (highest-wins precedence)."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat R3", date_of_birth: "1950-01-01", has_diabetes_mellitus: true, has_prior_ulcer_or_amputation: true }
              as: FrontDesk
              captures: { pat_id: $.data.id, cat: $.data.diabetic_foot_risk_category }
          assert:
            - "Patient.${pat_id}.diabetic_foot_risk_category == 3"

      - name: patch_risk_factors_recomputes_category
        claim_type: Computed Fields
        grounds: [endpoints, entities.Patient.fields.diabetic_foot_risk_category, calculations.diabetic_foot_risk_category]
        distinguishing_aspect: "PATCH risk-factors adding LOPS to a category-0 patient recomputes category to 1 and bumps version."
        test_recipe:
          setup: ["A category-0 patient (all risk booleans false)"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat R0", date_of_birth: "1960-01-01", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "PATCH /podiatry/patients/${pat_id}/risk-factors"
              payload: { has_loss_protective_sensation: true }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { cat: $.data.diabetic_foot_risk_category, v: $.data.version }
          assert:
            - "Patient.${pat_id}.diabetic_foot_risk_category == 1"
            - "Patient.${pat_id}.version == 2"

      - name: system_fields_input_ignored_on_patient_create
        claim_type: System Fields
        grounds: [entities.Patient]
        distinguishing_aspect: "Client-supplied diabetic_foot_risk_category is ignored; server computes it (0 for non-risk patient) regardless of input."
        test_recipe:
          setup: ["A practice exists"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Sys", date_of_birth: "1970-01-01", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat_id: $.data.id, cat: $.data.diabetic_foot_risk_category }
          assert:
            - "Patient.${pat_id}.diabetic_foot_risk_category == 0"

      - name: get_patient_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /podiatry/patients/{random uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /podiatry/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_encounter_unknown_provider_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Encounter.fields.provider_id, "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /podiatry/encounters with a provider_id that does not exist returns 404 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["A practice and patient exist; no provider with the given id"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat FK", date_of_birth: "1971-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "00000000-0000-4000-8000-000000000001", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: encounter_invalid_interval_end_before_start_rejected
        claim_type: Type Constraints
        grounds: [entities.Encounter.fields.scheduled_end, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "scheduled_end <= scheduled_start on encounter create returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A practice, provider, and patient exist"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Int", date_of_birth: "1972-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T10:30:00Z", scheduled_end: "2026-06-01T10:00:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_exam_from_open_succeeds_initial_state
        claim_type: Valid Transition
        grounds: [state_machines.Encounter.OPEN_to_EXAM_DONE, entities.Encounter.fields.status]
        distinguishing_aspect: "A freshly created encounter starts OPEN and complete-exam by the rendering provider moves it to EXAM_DONE."
        test_recipe:
          setup: ["An OPEN encounter on its provider"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat V", date_of_birth: "1973-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { st1: $.data.status }
          assert:
            - "Encounter.${enc_id}.status == EXAM_DONE"

      - name: code_encounter_from_open_invalid_transition_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Encounter.EXAM_DONE_to_CODED, "errors[ERR_ENCOUNTER_BAD_STATE]"]
        distinguishing_aspect: "Coding an encounter still in OPEN (exam not completed) returns 409 ERR_ENCOUNTER_BAD_STATE; no charges computed."
        test_recipe:
          setup: ["An OPEN encounter (exam not completed)"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Inv", date_of_birth: "1974-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/code"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ENCOUNTER_BAD_STATE"

      - name: adjudicated_encounter_terminal_lockdown_void_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Encounter.OPEN_to_VOIDED, "errors[ERR_ENCOUNTER_BAD_STATE]"]
        distinguishing_aspect: "Voiding an ADJUDICATED (terminal) encounter returns 409 ERR_ENCOUNTER_BAD_STATE."
        test_recipe:
          setup: ["An encounter fully driven to ADJUDICATED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Term", date_of_birth: "1975-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/encounters/${enc_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc_id}/code"
              payload: {}
              as: BillingSpecialist
            - call: "POST /podiatry/encounters/${enc_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /podiatry/encounters/${enc_id}/adjudicate"
              payload: {}
              as: PayerAgent
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/void"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ENCOUNTER_BAD_STATE"

      - name: pa_approve_twice_idempotency_second_rejected
        claim_type: Idempotency
        grounds: [state_machines.PriorAuthorization.REQUESTED_to_APPROVED, "errors[ERR_PA_BAD_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED PA returns 409 ERR_PA_BAD_STATE (not REQUESTED)."
        test_recipe:
          setup: ["A PA approved once"]
          setup_api_calls:
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat PA", date_of_birth: "1976-01-01", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "DME", hcpcs_code: "L4360", authorized_units: 2, valid_from_date: "2026-01-01", valid_through_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
          trigger:
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PA_BAD_STATE"

      - name: pa_expired_draw_auto_expires_and_rejects
        claim_type: guarded transitions
        grounds: [state_machines.PriorAuthorization.APPROVED_to_EXPIRED, "validations[priority=11]", "errors[ERR_PA_EXPIRED]"]
        distinguishing_aspect: "A draw attempted when the clock is past valid_through_date auto-expires the PA and the dispense is rejected 409 ERR_PA_EXPIRED."
        test_recipe:
          setup: ["An APPROVED DME PA valid_through 2026-06-30; clock advanced to 2026-07-01; an OPEN encounter"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Exp", date_of_birth: "1977-01-01", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "DME", hcpcs_code: "L4360", authorized_units: 2, valid_from_date: "2026-01-01", valid_through_date: "2026-06-30" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
              captures: { pa_v: $.data.version }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "PURCHASE", units: 1, purchase_price_cents: 15000, expected_prior_authorization_version: "${pa_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PA_EXPIRED"

      - name: void_cancels_scheduled_child_imaging_order
        claim_type: Side Effect Execution
        grounds: [state_machines.Encounter.CODED_to_VOIDED, state_machines.ImagingOrder.SCHEDULED_to_CANCELLED, entities.ImagingOrder.fields.status]
        distinguishing_aspect: "Voiding an encounter with a SCHEDULED imaging order cascades it to CANCELLED (cross-entity side effect)."
        test_recipe:
          setup: ["An OPEN encounter holding a SCHEDULED imaging order on a modality"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/modalities"
              payload: { practice_id: "${prac_id}", name: "X-Ray 1", modality_type: "XRAY", cleanup_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { mod_id: $.data.id, mod_v0: $.data.version }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Cscd", date_of_birth: "1978-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/imaging-orders"
