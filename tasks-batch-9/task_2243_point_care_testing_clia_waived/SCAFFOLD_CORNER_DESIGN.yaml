      - name: retired_device_rejects_qc_unlock_and_new_results
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Device.terminal_states
          - validations[priority:41]
          - validations[priority:50]
          - errors[ERR_DEVICE_QC_LOCKED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          RETIRED is terminal: a QC unlock whose confirming run is a genuine PASS
          on a VERIFIED lot still fails with ERR_INVALID_STATE (priority 50,
          status is not QC_LOCKED), and a fresh patient result fails earlier at
          priority 41 with ERR_DEVICE_QC_LOCKED because the device is not ACTIVE.
          The two refusals carry DIFFERENT error ids from the same terminal state.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site, trained operator, storage unit, lot with LEVEL_1 80.0/120.0 and LEVEL_2 250.0/350.0."
            - "Device GLUCO-9 with both LEVEL_1 and LEVEL_2 PASS runs on 2026-09-01; the lot is then VERIFIED from those two runs, so the qc-unlock precondition on lot verification (priority 44) is satisfied."
            - "The device is retired with no TestResult in PENDING_REVIEW / HELD / CORRECTION_PENDING, so the retire precondition holds."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243014", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Occupational Health POCT", department_code: "DEPT-1500", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Kim Salas", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-1500", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "user-kim"
              captures: { qc1_id: $.data.id, qc1_result: $.data.result }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "user-kim"
              captures: { qc2_id: $.data.id, qc2_result: $.data.result }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
              captures: { lot_state: $.data.verification_status }
            - call: "POST /poct/devices/${dev_id}/retire"
              payload: { reason: "instrument decommissioned - end of service life" }
