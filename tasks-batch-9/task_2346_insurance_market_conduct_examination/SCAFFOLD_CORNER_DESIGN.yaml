      - name: the_sample_minimum_outranks_the_population_bound
        claim_type: priority_conflict
        grounds:
          - validations[priority 53 ERR_SAMPLE_SIZE_BELOW_MINIMUM]
          - validations[priority 65 ERR_SAMPLE_EXCEEDS_POPULATION]
          - calculations.sample_draw_plan
        distinguishing_aspect: |
          A three-file sample over a two-file population breaks both numeric rules at once, and the
          minimum-sample rule carries the lower priority number so it answers first even though the
          population overflow is the more obvious defect. Raising the sample past the minimum then
          exposes the overflow, and only a sample that clears both is written - which also shows the
          minimum is mode-dependent while the overflow bound is not.
        test_recipe:
          setup:
            - "One examination in SCOPING, ON_SITE mode."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
          trigger:
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 2, sample_size: 3 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_min: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 10, sample_size: 12 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_overflow: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 10, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id", area_samp: "$.data.sample_size", area_tol: "$.data.error_tolerance_pct" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/scope-areas/${clm_area_id}/data-calls"
              payload: { records_requested: 25, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_records: "$.data.error_id" }
          assert:
            - "sample_size 3 over population 2 returns 422 ERR_SAMPLE_SIZE_BELOW_MINIMUM - priority 53 outranks priority 65"
            - "sample_size 12 over population 10 returns 422 ERR_SAMPLE_EXCEEDS_POPULATION once the minimum is met"
            - "sample_size 10 over population 10 is accepted: the bound is sample_size > population_size, so equality is legal"
            - "The accepted area carries error_tolerance_pct == 3.00 from the CLAIMS default"
            - "records_requested 25 over a 10-file population returns 422 ERR_SAMPLE_EXCEEDS_POPULATION on the data-call endpoint too"

      - name: workpaper_completeness_is_required_conditionally_on_examination_mode
        claim_type: conditional_validation
        grounds:
          - validations[priority 52 ERR_FIELDWORK_NOT_DOCUMENTED]
          - entities.FieldworkActivity.fields.activity_type
          - entities.Examination.fields.mode
        distinguishing_aspect: |
          The walkthrough workpaper is mandatory in both modes but the interview workpaper is mandatory
          only ON_SITE, so two otherwise identical examinations with the identical single walkthrough
          answer differently: the on-site one is refused and the desk one issues its criticism. This is
          the only rule in the catalogue whose applicability is keyed on Examination.mode, and it is
          evaluated at criticism issuance rather than at workpaper filing.
