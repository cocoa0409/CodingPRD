            - call: "POST /access-code-batches/${batch_id}/assignments"
              payload: { candidate_id: "${cand_id}", bundle_type: "EXAM_ONLY", expected_batch_version: "${bv1}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { code_id: $.data.id }
            - call: "GET /access-code-batches/${batch_id}"
