              captures: { err: $.data.error_id }
          assert:
            - "tot == 9000 (5,000 + 1,500 same-day freight + 2,500 hazmat handling; exceeds the 1,000 limit)"
            - "err == ERR_HAZMAT_METHOD_RESTRICTED (priority 7 business_safety beats priority 11 business_fiscal)"

  - rule_id: boundary_precision_check
    instances:
      - name: same_day_cutoff_minute_boundary
        grounds:
          - calculations.promise_date
          - entities.StockLocation.fields.same_day_cutoff_minute
        distinguishing_aspect: |
          Minute-of-day metric through the confirm endpoint: the promise boundary is
          <= — a WILL_CALL order confirmed at exactly minute 900 earns the same-day
          promise, one confirmed at minute 901 is promised next day.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 1,000 with 2 on hand"
            - "Branch with same_day_cutoff_minute 900 (15:00 UTC)"
            - "Two WILL_CALL orders A and B of 1 unit each, both SUBMITTED"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CO-1", display_name: "Cutoff Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "CO-1", description: "Coupling", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-11", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 2 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ordA: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ordB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T15:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders/${ordA}/confirm"
              as: DistributionAdmin
              captures: { pA: $.data.promise_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T15:01:00Z" }
              as: DistributionAdmin
            - call: "POST /mro/orders/${ordB}/confirm"
              as: DistributionAdmin
              captures: { pB: $.data.promise_date }
          assert:
            - "pA == 2026-08-01 (minute 900 <= cutoff 900: exact equality keeps the same-day promise)"
            - "pB == 2026-08-02 (minute 901 > cutoff: next-day promise)"

      - name: rebate_tier_threshold_exact_equality
        grounds:
          - calculations.rebate_accrual_and_trueup
          - entities.RebateAgreement.fields.current_tier_index
        distinguishing_aspect: |
          Spend-cents metric through the rebate close endpoint (different metric and
          endpoint than the cutoff instance): accrued spend exactly equal to a tier
          threshold reaches that tier (>=, not >), which the close then prices into
          marginal bands with an empty upper band.
        test_recipe:
          setup:
            - "National-account customer, credit 100,000,000; ACTIVE agreement [2026-07-01, 2026-09-30], tiers [{0,100bps},{10000000,200bps}]"
            - "One WILL_CALL order of a 10,000,000-cent STOCKED item completed -> accrued exactly 10,000,000"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "NAT-3", display_name: "National Three", is_national_account: true, credit_limit_cents: 100000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-07-01", period_end: "2026-09-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }, { threshold_cents: 10000000, rebate_bps: 200 }] }
              as: DistributionAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /mro/rebate-agreements/${agr_id}/activate"
              as: DistributionAdmin
            - call: "POST /mro/items"
              payload: { sku: "TIER-10M", description: "CNC mill", item_class: "STOCKED", list_price_cents: 10000000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-12", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/complete"
              as: DistributionAdmin
            - call: "GET /mro/rebate-agreements/${agr_id}"
              as: DistributionAdmin
              captures: { tier_i: $.data.current_tier_index, prov: $.data.provisional_rebate_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /mro/rebate-agreements/${agr_id}/close"
              as: DistributionAdmin
              captures: { fin: $.data.final_rebate_cents, delta: $.data.true_up_delta_cents }
          assert:
            - "tier_i == 1 (accrued 10,000,000 >= threshold 10,000,000: exact equality reaches the tier)"
            - "prov == 200000 (average rate: 10,000,000 * 200bps)"
            - "fin == 100000 (marginal bands: 10,000,000*100bps + 0*200bps; the upper band is empty at exact equality)"
            - "delta == -100000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_customer_active
        grounds:
          - state_machines.SalesOrder.SUBMITTED_to_CONFIRMED
          - state_machines.CustomerAccount.ACTIVE_to_CREDIT_HOLD
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair SalesOrder -> CustomerAccount: the confirm transition is gated
          on the customer's status; CREDIT_HOLD blocks with ERR_CUSTOMER_NOT_ACTIVE
          and reinstating the customer unblocks the same order.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 1,000, 1 on hand; SUBMITTED WILL_CALL order"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "XS-1", display_name: "CrossState Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /mro/items"
              payload: { sku: "XS-1", description: "Valve", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-13", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "PUT /mro/customers/${cust_id}"
              payload: { status: "CREDIT_HOLD", expected_customer_version: "${cust_v}" }
              as: DistributionAdmin
              captures: { cust_v2: $.data.version }
          trigger:
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
            - call: "PUT /mro/customers/${cust_id}"
              payload: { status: "ACTIVE", expected_customer_version: "${cust_v2}" }
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { st: $.data.status }
          assert:
            - "err == ERR_CUSTOMER_NOT_ACTIVE (confirm blocked while the customer is CREDIT_HOLD)"
            - "st == CONFIRMED (same order confirms once the customer is reinstated)"

      - name: return_requires_order_fulfilled
        grounds:
          - state_machines.ReturnAuthorization.transitions
          - state_machines.SalesOrder.READY_FOR_WILL_CALL_to_FULFILLED
          - errors[ERR_ORDER_NOT_RETURNABLE]
        distinguishing_aspect: |
          Different entity pair ReturnAuthorization -> SalesOrder: a return can only
          be created once the order's fulfillment dimension reaches FULFILLED (or the
          order is COMPLETED); against a merely CONFIRMED order it fails with
          ERR_ORDER_NOT_RETURNABLE.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 1,000, 1 on hand"
            - "WILL_CALL order confirmed (ALLOCATED) but not yet readied/fulfilled"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "XR-1", display_name: "CrossReturn Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "XR-1", description: "Gasket", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-14", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln_id: "$.data[0].id" }
          trigger:
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${ln_id}", qty: 1, condition: "RESALEABLE" }] }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${ln_id}", qty: 1, condition: "RESALEABLE" }] }
              as: DistributionAdmin
              captures: { ret_status: $.data.status }
          assert:
            - "err == ERR_ORDER_NOT_RETURNABLE (order CONFIRMED but fulfillment not FULFILLED)"
            - "ret_status == REQUESTED (after mark-fulfilled the same request succeeds)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: price_rule_half_open_window_adjacency
        grounds:
          - state_machines.PriceMatrixRule.DRAFT_to_ACTIVE
          - errors[ERR_PRICE_RULE_WINDOW_OVERLAP]
          - entities.PriceMatrixRule.fields.effective_from
        distinguishing_aspect: |
          Half-open interval semantics on PriceMatrixRule: rule2 starting exactly at
          rule1's effective_to is allowed (adjacent, [from, to)), while rule3 starting
          one day inside rule1's window is rejected at activation.
        test_recipe:
          setup:
            - "Item exists; GOLD tier item-level FIXED_PRICE rule1 [2026-01-01, 2026-06-01) ACTIVE"
          setup_api_calls:
            - call: "POST /mro/items"
              payload: { sku: "PR-1", description: "Seal kit", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", item_id: "${it_id}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 900, effective_from: "2026-01-01", effective_to: "2026-06-01" }
              as: DistributionAdmin
              captures: { r1: $.data.id }
            - call: "POST /mro/price-rules/${r1}/activate"
              as: DistributionAdmin
              captures: { r1_st: $.data.status }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", item_id: "${it_id}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 880, effective_from: "2026-06-01", effective_to: "2027-01-01" }
              as: DistributionAdmin
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /mro/price-rules/${r2}/activate"
              as: DistributionAdmin
              captures: { r2_st: $.data.status }
            - call: "POST /mro/price-rules"
              payload: { customer_tier: "GOLD", item_id: "${it_id}", rule_type: "FIXED_PRICE", contract_unit_price_cents: 870, effective_from: "2026-05-15", effective_to: "2026-07-01" }
              as: DistributionAdmin
              captures: { r3: $.data.id }
            - call: "POST /mro/price-rules/${r3}/activate"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "r1_st == ACTIVE"
            - "r2_st == ACTIVE (adjacency: from 2026-06-01 == rule1.to 2026-06-01 is allowed under half-open windows)"
            - "err == ERR_PRICE_RULE_WINDOW_OVERLAP (rule3 [2026-05-15, 2026-07-01) intersects rule1 [2026-01-01, 2026-06-01))"

      - name: rebate_agreement_closed_interval_overlap
        grounds:
          - entities.RebateAgreement.fields.period_start
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different resource and different interval semantics than the price-rule
          instance: rebate periods are CLOSED intervals — an agreement starting on the
          day after a period ends is allowed, but one starting on the end date itself
          shares a calendar day and is rejected at creation.
        test_recipe:
          setup:
            - "National-account customer; agreement1 [2026-01-01, 2026-03-31] created (DRAFT)"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "NAT-4", display_name: "National Four", is_national_account: true, credit_limit_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-01-01", period_end: "2026-03-31", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { a1_st: $.data.status }
          trigger:
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-04-01", period_end: "2026-06-30", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { a2_st: $.data.status }
            - call: "POST /mro/customers/${cust_id}/rebate-agreements"
              payload: { period_start: "2026-03-31", period_end: "2026-05-31", tiers: [{ threshold_cents: 0, rebate_bps: 100 }] }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "a1_st == DRAFT"
            - "a2_st == DRAFT (start 2026-04-01 == end 2026-03-31 + 1 day: gap-free but non-overlapping under closed intervals)"
            - "err == ERR_AGREEMENT_WINDOW_OVERLAP (start 2026-03-31 shares that calendar day with agreement1's closed period)"

  - rule_id: compensating_invariant
    instances:
      - name: stock_reserve_release_conservation
        grounds:
          - calculations.available_qty
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - entities.StockBalance.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity is physical units: the reserve (confirm) / release
          (cancel) pair leaves on_hand_qty untouched and returns reserved_qty to its
          pre-confirm value when no eligible backorders exist; the identity
          available_qty == on_hand_qty - reserved_qty holds at every checkpoint.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; STOCKED item list 1,000 with 5 on hand at the branch (no backorders anywhere)"
            - "WILL_CALL order for 2 units, confirmed"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "INV-1", display_name: "Invariant Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "INV-1", description: "Filter", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-15", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 5 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 2 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "GET /mro/locations/${br_id}/stock-balances"
              as: DistributionAdmin
              captures: { h1: "$.data[0].on_hand_qty", r1: "$.data[0].reserved_qty", a1: "$.data[0].available_qty" }
          trigger:
            - call: "POST /mro/orders/${ord_id}/cancel"
              as: DistributionAdmin
              captures: { st: $.data.status }
            - call: "GET /mro/locations/${br_id}/stock-balances"
              as: DistributionAdmin
              captures: { h2: "$.data[0].on_hand_qty", r2: "$.data[0].reserved_qty", a2: "$.data[0].available_qty" }
          assert:
            - "h1 == 5 and r1 == 2 and a1 == 3 (reserve moved only the reservation column)"
            - "st == CANCELLED"
            - "h2 == 5 and r2 == 0 and a2 == 5 (release restores the pre-confirm reservation; on_hand_qty never changed)"
            - "available_qty == on_hand_qty - reserved_qty at both checkpoints (3 == 5 - 2; 5 == 5 - 0)"

      - name: spend_complete_credit_reconciliation
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_COMPLETED
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
          - entities.CustomerAccount.fields.net_spend_cents
          - calculations.return_credit
        distinguishing_aspect: |
          Different conserved quantity — money, not units: net_spend_cents plus the
          sum of credited return credits always equals the sum of completed order
          totals (42 + 164 == 206); the complete/credit pair conserves gross spend,
          with the 42-cent restocking fee retained.
        test_recipe:
          setup:
            - "Customer credit 10,000,000; two SPECIAL_ORDER items list 103 each, 1 on hand each"
            - "WILL_CALL order with both items (total 206) confirmed, readied, fulfilled, completed -> net_spend 206"
            - "Full return of both lines, approved and received"
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RC-1", display_name: "Reconcile Co", credit_limit_cents: 10000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RC-103A", description: "Nozzle A", item_class: "SPECIAL_ORDER", list_price_cents: 103 }
              as: DistributionAdmin
              captures: { itP: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RC-103B", description: "Nozzle B", item_class: "SPECIAL_ORDER", list_price_cents: 103 }
              as: DistributionAdmin
              captures: { itQ: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-16", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itP}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${itQ}", qty: 1 }
              as: DistributionAdmin
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${itP}", qty: 1 }, { item_id: "${itQ}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id, tot: $.data.total_cents }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
            - call: "POST /mro/orders/${ord_id}/complete"
              as: DistributionAdmin
            - call: "GET /mro/customers/${cust_id}"
              as: DistributionAdmin
              captures: { net1: $.data.net_spend_cents }
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { lp: "$.data[0].id", lq: "$.data[1].id" }
            - call: "POST /mro/returns"
              payload: { order_id: "${ord_id}", lines: [{ order_line_id: "${lp}", qty: 1, condition: "RESALEABLE" }, { order_line_id: "${lq}", qty: 1, condition: "RESALEABLE" }] }
              as: DistributionAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /mro/returns/${ret_id}/approve"
              as: DistributionAdmin
            - call: "POST /mro/returns/${ret_id}/receive"
              as: BranchManager
          trigger:
            - call: "POST /mro/returns/${ret_id}/credit"
              as: DistributionAdmin
              captures: { credit: $.data.credit_cents, fee: $.data.restocking_fee_cents }
            - call: "GET /mro/customers/${cust_id}"
              as: DistributionAdmin
              captures: { net2: $.data.net_spend_cents }
          assert:
            - "tot == 206 and net1 == 206 (completion moved gross spend onto the customer)"
            - "credit == 164 and fee == 42"
            - "net2 == 42 (credit decremented spend)"
            - "net2 + credit == net1 == 206 (conserved: completed gross = net spend + credited returns; restocking fee retained)"
