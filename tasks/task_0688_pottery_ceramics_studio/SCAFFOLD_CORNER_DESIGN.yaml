# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Pottery & Ceramics Studio — Expert
# Breadth probe over §1.1–§1.7; excludes corners already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_loyalty_member_minimal
        claim_type: Creation
        grounds: ["entities.LoyaltyMember"]
        distinguishing_aspect: "POST /loyalty-members with email/full_name/phone -> 201; tier=BRONZE, point_balance=0, lifetime_points_earned=0, status=ACTIVE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty-members"
              payload: { email: "new@x.com", full_name: "New Member", phone: "555-1000" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          assert:
            - "HTTP 201; LoyaltyMember.${mem_id}.tier == BRONZE and point_balance == 0 and lifetime_points_earned == 0"
            - "LoyaltyMember.${mem_id}.status == ACTIVE and version == 1"

      - name: get_member_not_found
        claim_type: Not Found
        grounds: ["entities.LoyaltyMember", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /loyalty-members/{id} with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /loyalty-members/00000000-0000-4000-8000-000000000000"
              as: StudioStaff
          assert:
            - "Response error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: create_paint_bar_item_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.PaintBarItem.fields.unit_price_cents", "errors[ERR_INVALID_REQUEST]", "validations[priority=19]"]
        distinguishing_aspect: "POST /paint-bar-items omitting unit_price_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-X", name: "Glaze X", category: "GLAZE", reorder_threshold: 5 }
              as: StudioManager
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: bisque_piece_firing_temp_default_applied
        claim_type: Defaults
        grounds: ["entities.BisquePiece.fields.firing_temp"]
        distinguishing_aspect: "POST /studio-visits/{id}/pieces omitting firing_temp defaults to CONE_06."
        test_recipe:
          setup: ["An OPEN WALK_IN visit."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000 }
              as: StudioStaff
              captures: { piece_id: $.data.id }
          assert:
            - "BisquePiece.${piece_id}.firing_temp == CONE_06 and status == PAINTED"

      - name: studio_fee_computed_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.StudioVisit.fields.studio_fee_cents"]
        distinguishing_aspect: "studio_fee_cents is computed (party_size * 1000); a client-supplied studio_fee_cents in the body is ignored — party_size=3 yields studio_fee_cents=3000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio-visits"
              payload: { party_size: 3, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
          assert:
            - "StudioVisit.${visit_id}.studio_fee_cents == 3000 and provisional_total_cents == 3000"

      - name: ledger_entry_immutable_no_version
        claim_type: Immutability
        grounds: ["entities.LoyaltyLedgerEntry"]
        distinguishing_aspect: "LoyaltyLedgerEntry has common_fields:false — entries are read-only events with id+created_at only and no update/version; surfaced via GET /loyalty-members/{id}/ledger after an enrollment EARN."
        test_recipe:
          setup: ["A member enrolled in a 12000/4 series (one EARN ledger entry)."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "led1@x.com", full_name: "Led One", phone: "555-1001" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "L4", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          trigger:
            - call: "GET /loyalty-members/${mem_id}/ledger"
              as: StudioStaff
          assert:
            - "Exactly one LoyaltyLedgerEntry with entry_type==EARN, points_delta==120, source_ref_type==ENROLLMENT"
            - "Ledger entry response carries id and created_at but no version field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: void_visit_from_settled_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.StudioVisit.OPEN_to_VOIDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a SETTLED visit -> ERR_INVALID_STATE (409); SETTLED is terminal."
        test_recipe:
          setup: ["A SETTLED visit (WALK_IN, party 1, one piece 3000 fired & ready, checked out)."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K1", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/void"
              as: StudioManager
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "StudioVisit.${visit_id}.status == SETTLED (unchanged)"

      - name: pickup_piece_before_ready_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.BisquePiece.READY_to_PICKED_UP", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Picking up a PAINTED piece (not READY) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPEN visit with a PAINTED piece (3000)."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
          trigger:
            - call: "POST /bisque-pieces/${piece_id}/pickup"
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409); piece still PAINTED"

      - name: full_firing_cascade_sets_ready_at
        claim_type: Side Effect Execution
        grounds: ["state_machines.KilnBatch.FIRING_to_COMPLETED", "state_machines.BisquePiece.FIRING_to_READY", "entities.BisquePiece.fields.ready_at"]
        distinguishing_aspect: "complete-firing cascades FIRING pieces -> READY and stamps ready_at = current clock; the notification endpoint then surfaces it."
        test_recipe:
          setup: ["A FIRING batch holding one FIRING piece (3000); clock at default 2026-04-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K2", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
          trigger:
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
          assert:
            - "BisquePiece.${piece_id}.status == READY and ready_at == 2026-04-01T00:00:00.000Z"
            - "KilnBatch.${batch_id}.status == COMPLETED"

      - name: clock_sweep_completes_firing_batch
        claim_type: Side Effect Execution
        grounds: ["state_machines.KilnBatch.FIRING_to_COMPLETED", "entities.KilnBatch.fields.firing_completes_at"]
        distinguishing_aspect: "Advancing the clock to >= firing_completes_at (default 2026-04-01 + 48h = 2026-04-03T00:00:00Z) auto-completes the FIRING batch and readies its pieces via the sweep."
        test_recipe:
          setup: ["A FIRING CONE_06 batch (turnaround 48h) holding one FIRING piece; clock at default."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K3", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: StudioManager
          assert:
            - "KilnBatch.${batch_id}.status == COMPLETED (clock sweep at firing_completes_at)"
            - "BisquePiece.${piece_id}.status == READY"

      - name: enrollment_initial_state_enrolled
        claim_type: Initial State
        grounds: ["state_machines.Enrollment", "entities.Enrollment.fields.status"]
        distinguishing_aspect: "A newly created Enrollment starts in ENROLLED with amount_paid_cents snapshotted from series.price_cents (12000)."
        test_recipe:
          setup: ["An OPEN 12000/4 series and an ACTIVE member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "init1@x.com", full_name: "Init One", phone: "555-1002" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Init4", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.status == ENROLLED and amount_paid_cents == 12000 and points_earned == 120"

      - name: terminal_party_booking_cancel_then_paydeposit_invalid
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.PartyBooking.DEPOSIT_PENDING_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After cancel (terminal CANCELLED), pay-deposit -> ERR_INVALID_STATE (409); no transitions from a terminal booking."
        test_recipe:
          setup: ["A CANCELLED party booking (BASIC, 6 guests, future date, then cancelled)."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "pb1@x.com", full_name: "PB One", phone: "555-1003" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { member_id: "${mem_id}", package_tier: "BASIC", guest_count: 6, scheduled_for: "2026-09-01T18:00:00Z" }
              as: StudioStaff
              captures: { booking_id: $.data.id }
            - call: "POST /party-bookings/${booking_id}/cancel"
              as: StudioManager
          trigger:
            - call: "POST /party-bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 6750 }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "PartyBooking.${booking_id}.status == CANCELLED (unchanged)"

      - name: pieces_not_ready_blocks_checkout
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=8]", "errors[ERR_PIECES_NOT_READY]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pieces_not_ready_before_insufficient_points_on_checkout
          rationale: "The PAINTED-piece-blocks-checkout precondition is asserted as the winning failure path of that §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: party_deposit_deluxe_correct
        claim_type: Correct Result
        grounds: ["calculations.party_deposit", "entities.PartyBooking.fields.deposit_due_cents"]
        distinguishing_aspect: "DELUXE, guest_count=10 -> package_total_cents=80000, deposit_due_cents=round_half_up(80000*0.25)=20000."
        test_recipe:
          setup: ["An ACTIVE member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "dep1@x.com", full_name: "Dep One", phone: "555-1004" }
              as: StudioManager
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /party-bookings"
              payload: { member_id: "${mem_id}", package_tier: "DELUXE", guest_count: 10, scheduled_for: "2026-09-10T18:00:00Z" }
              as: StudioStaff
              captures: { booking_id: $.data.id }
          assert:
            - "PartyBooking.${booking_id}.package_total_cents == 80000 and deposit_due_cents == 20000"

      - name: enrollment_long_series_bonus
        claim_type: Constants Applied
        grounds: ["calculations.enrollment_points_earned", "entities.Enrollment.fields.points_earned"]
        distinguishing_aspect: "session_count=6 (>= LONG_SERIES_THRESHOLD) on a 18000-cent series -> 180 base + 50 flat bonus = 230 points."
        test_recipe:
          setup: ["An OPEN 18000/6 series and an ACTIVE member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "long1@x.com", full_name: "Long One", phone: "555-1005" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Long6", session_count: 6, seat_capacity: 5, price_cents: 18000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.points_earned == 230 and LoyaltyMember.${mem_id}.point_balance == 230"

      - name: anonymous_visit_earns_zero_points
        claim_type: Input Set Filtering
        grounds: ["calculations.visit_points_earned", "entities.StudioVisit.fields.points_earned", "entities.StudioVisit.fields.member_id"]
        distinguishing_aspect: "An anonymous walk-in (member_id null) earns 0 points at checkout even with settled_total_cents=5000."
        test_recipe:
          setup: ["An OPEN anonymous WALK_IN visit, party 1, one piece 4000, fired & ready."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: Anonymous
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 4000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K4", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
          assert:
            - "StudioVisit.${visit_id}.settled_total_cents == 5000 and points_earned == 0"

      - name: checkout_total_floored_at_zero
        claim_type: Precision
        grounds: ["calculations.settle_visit_charge", "entities.StudioVisit.fields.settled_total_cents"]
        distinguishing_aspect: "When redemption (5000 pts -> 5000 cents) exceeds subtotal (2000), settled_total_cents is floored at 0 (max(0, 2000-5000))."
        test_recipe:
          setup: ["A member with point_balance 5000 (one 500000/4 enrollment); an OPEN WALK_IN visit party 1, one piece 1000, fired & ready; redeem 5000."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "floor1@x.com", full_name: "Floor One", phone: "555-1006" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Rich4", session_count: 4, seat_capacity: 5, price_cents: 500000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MINI", name: "Mini", bisque_price_cents: 1000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K5", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 5000 }
              as: StudioStaff
          assert:
            - "StudioVisit.${visit_id}.settled_total_cents == 0 (floored) and discount_cents == 5000"
            - "LoyaltyMember.${mem_id}.point_balance == 0 (5000 redeemed, 0 earned on a 0 total)"

      - name: member_tier_silver_at_500_boundary
        claim_type: Constants Applied
        grounds: ["calculations.member_tier", "entities.LoyaltyMember.fields.tier"]
        distinguishing_aspect: "lifetime_points_earned exactly 500 (>= SILVER_THRESHOLD) -> tier SILVER, via one 50000/4 enrollment (500 base, no long bonus)."
        test_recipe:
          setup: ["A fresh member who enrolls in a 50000/4 series."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "tier1@x.com", full_name: "Tier One", phone: "555-1007" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Tier4", session_count: 4, seat_capacity: 5, price_cents: 50000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          assert:
            - "LoyaltyMember.${mem_id}.lifetime_points_earned == 500 and tier == SILVER"

      - name: supplies_no_bulk_below_threshold
        claim_type: Correct Result
        grounds: ["calculations.supplies_charge", "entities.StudioVisit.fields.supplies_subtotal_cents"]
        distinguishing_aspect: "qty=2 (< BULK_QTY_THRESHOLD 3) @500 -> line_charge 1000 with NO bulk discount."
        test_recipe:
          setup: ["An ACTIVE item @500 on_hand 50; OPEN WALK_IN visit party 1."]
          setup_api_calls:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-D", name: "Glaze D", category: "GLAZE", unit_price_cents: 500, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_id: $.data.id }
            - call: "POST /paint-bar-items/${item_id}/restock"
              payload: { qty: 50 }
              as: StudioManager
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_id}", qty: 2 }
              as: StudioStaff
          assert:
            - "StudioVisit.${visit_id}.supplies_subtotal_cents == 1000 (no bulk discount below qty 3)"
            - "PaintBarItem.${item_id}.on_hand_qty == 48"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: deposit_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_DEPOSIT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "pay-deposit with amount_cents != deposit_due_cents (6750) -> ERR_DEPOSIT_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["A DEPOSIT_PENDING BASIC/6 booking (deposit_due 6750)."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "dm1@x.com", full_name: "DM One", phone: "555-1008" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { member_id: "${mem_id}", package_tier: "BASIC", guest_count: 6, scheduled_for: "2026-09-01T18:00:00Z" }
              as: StudioStaff
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /party-bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_DEPOSIT_AMOUNT_MISMATCH (HTTP 422)"
            - "PartyBooking.${booking_id}.status == DEPOSIT_PENDING (unchanged)"

      - name: booking_date_in_past_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_BOOKING_DATE_PAST]"]
        distinguishing_aspect: "Creating a booking with scheduled_for == default clock 2026-04-01T00:00:00Z (not strictly after) -> ERR_BOOKING_DATE_PAST (422)."
        test_recipe:
          setup: ["Clock at startup default 2026-04-01T00:00:00Z; an ACTIVE member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "past1@x.com", full_name: "Past One", phone: "555-1009" }
              as: StudioManager
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /party-bookings"
              payload: { member_id: "${mem_id}", package_tier: "BASIC", guest_count: 6, scheduled_for: "2026-04-01T00:00:00Z" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_BOOKING_DATE_PAST (HTTP 422)"

      - name: enrollment_closed_after_start_time
        claim_type: Temporal validation
        grounds: ["validations[priority=14]", "errors[ERR_ENROLLMENT_CLOSED]"]
        distinguishing_aspect: "Enrolling after the clock reaches series.starts_at (window closed) -> ERR_ENROLLMENT_CLOSED (409)."
        test_recipe:
          setup: ["An OPEN series starts_at 2026-05-01T18:00:00Z; clock advanced to 2026-05-02T00:00:00Z (series auto-STARTED); an ACTIVE member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "clos1@x.com", full_name: "Clos One", phone: "555-1010" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Closing4", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-05-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          assert:
            - "Response error_id is ERR_ENROLLMENT_CLOSED or ERR_INVALID_STATE (HTTP 409) — series past starts_at"
            - "ClassSeries.${series_id}.enrolled_count == 0"

      - name: insufficient_stock_on_consume
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Consuming qty 10 of an item with on_hand_qty 3 -> ERR_INSUFFICIENT_STOCK (409); inventory unchanged."
        test_recipe:
          setup: ["An ACTIVE item on_hand 3; OPEN WALK_IN visit party 1."]
          setup_api_calls:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-E", name: "Glaze E", category: "GLAZE", unit_price_cents: 500, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_id: $.data.id }
            - call: "POST /paint-bar-items/${item_id}/restock"
              payload: { qty: 3 }
              as: StudioManager
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_id}", qty: 10 }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INSUFFICIENT_STOCK (HTTP 409)"
            - "PaintBarItem.${item_id}.on_hand_qty == 3 (unchanged)"

      - name: firing_temp_mismatch_on_load
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_FIRING_TEMP_MISMATCH]"]
        distinguishing_aspect: "Loading a CONE_6 piece into a CONE_06 batch -> ERR_FIRING_TEMP_MISMATCH (409)."
        test_recipe:
          setup: ["An OPEN visit with a CONE_6 piece; a LOADING CONE_06 batch cap 4."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "HOT-1", name: "Hot Piece", bisque_price_cents: 3000, firing_temp: "CONE_6" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K6", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_FIRING_TEMP_MISMATCH (HTTP 409)"
            - "KilnBatch.${batch_id}.occupied_slots == 0"

      - name: duplicate_enrollment_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A member with an existing ENROLLED row in a series who enrolls again -> ERR_DUPLICATE_ENROLLMENT (409)."
        test_recipe:
          setup: ["A member already ENROLLED in an OPEN 12000/4 series with spare seats."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "dup1@x.com", full_name: "Dup One", phone: "555-1011" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Dup4", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_DUPLICATE_ENROLLMENT (HTTP 409)"
            - "ClassSeries.${series_id}.enrolled_count == 1 (no second enrollment)"

      - name: discontinued_item_cannot_be_consumed
        claim_type: Conditional validation
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STOCK]", "entities.PaintBarItem.fields.status"]
        distinguishing_aspect: "A DISCONTINUED item (even with on_hand_qty>0) cannot be consumed -> ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["An item on_hand 20 then DISCONTINUED; an OPEN WALK_IN visit party 1."]
          setup_api_calls:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-F", name: "Glaze F", category: "GLAZE", unit_price_cents: 500, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_id: $.data.id }
            - call: "POST /paint-bar-items/${item_id}/restock"
              payload: { qty: 20 }
              as: StudioManager
            - call: "POST /paint-bar-items/${item_id}/discontinue"
              as: StudioManager
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_id}", qty: 1 }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INSUFFICIENT_STOCK (HTTP 409); DISCONTINUED items are not consumable"
            - "PaintBarItem.${item_id}.on_hand_qty == 20 (unchanged)"

