      - name: decision_reasons_channel_pilot_mobile
        claim_type: selector_policy
        grounds:
          - calculations.bypass_decision_evaluation
          - entities.BypassEvent.fields.selected_credential_id
          - entities.Station.fields.supported_channel
          - entities.StateProgramConfig.fields.participation_status
        distinguishing_aspect: "Credential selector under channel + PILOT rules: a TRANSPONDER-only station rejects an app-only vehicle (CHANNEL_UNSUPPORTED); a BOTH station in a PILOT state selects the MOBILE_APP credential even when a TRANSPONDER is also ACTIVE (PILOT prefers app); a transponder-only vehicle in a PILOT state pulls in PILOT_APP_ONLY."
        test_recipe:
          setup: ["clock 2026-08-05T12:00:00Z; config CA stays PILOT (screen 0, cap 10000, clearance false); stations CA-S1 (BOTH) and CA-S2 (TRANSPONDER); carrier ACTIVE ELIGIBLE; veh1 with subscription + MOBILE_APP credential ACTIVE (TRANSPONDER added and activated later); veh2 with subscription + TRANSPONDER only ACTIVE"]
