      - name: mounting_a_plate_with_more_colours_than_the_press_supports_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLATE_COLOR_EXCEEDS_PRESS]
          - state_machines.PlateSet.NEW_to_MOUNTED
        distinguishing_aspect: "The press has 8 cylinders but only 6 colour stations, so an 8-colour plate set is refused on colours even though cylinder capacity alone would have accommodated it."
        test_recipe:
          setup:
            - "press PR-1 with max_colors 6 and cylinder_capacity 8"
            - "NEW plate PL-8 with color_count 8"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_press1
            - &a_plate8 { call: "POST /plate-sets", payload: { plate_code: "PL-8", product_id: "${p_fd}", color_count: 8 }, as: PrintOperator, captures: { plate8: "$.data.id" } }
          trigger:
            - { call: "POST /plate-sets/${plate8}/mount", payload: { press_id: "${press1}" }, as: PrintOperator }
          assert:
            - "POST /plate-sets/${plate8}/mount -> 422 ERR_PLATE_COLOR_EXCEEDS_PRESS"
            - "PlateSet.${plate8}.status == NEW and mounted_press_id == null"
      - name: scheduling_a_run_on_a_line_too_narrow_for_the_product_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LINE_CAPABILITY_MISMATCH]
          - validations[priority=13]
        distinguishing_aspect: "L-SM matches on process type, layer count and gauge span and fails only on width: the product needs 400.0 mm layflat and the line tops out at 300.0 mm."
        test_recipe:
          setup:
            - "APPROVED non-food recipe R-NF-0 for P-NF-1 (layflat 400.0 mm)"
            - "line L-SM with max_layflat_mm 300.0"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - &a_line_sm { call: "POST /extrusion-lines", payload: { line_code: "L-SM", process_type: "BLOWN", max_layers: 3, min_gauge_micron: 20.0, max_gauge_micron: 120.0, max_layflat_mm: 300.0, food_contact_certified: false }, as: PlantAdmin, captures: { line_sm: "$.data.id" } }
          trigger:
            - { call: "POST /extrusion-runs", payload: { run_code: "RUN-SM-1", line_id: "${line_sm}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T07:00:00Z", scheduled_end: "2026-08-05T15:00:00Z", target_output_kg: 300.0 }, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs -> 422 ERR_LINE_CAPABILITY_MISMATCH"
            - "GET /extrusion-runs filtered by line_id ${line_sm} returns total_count 0"
            - "BlendRecipe.${r0}.pinned_run_count == 0"
      - name: reversing_a_generation_row_that_would_overdraw_the_pool_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRANSACTION_NOT_REVERSIBLE]
          - endpoints[POST /regrind-transactions/{id}/reverse]
        distinguishing_aspect: "The 100.000 kg IN row is not itself a reversal and has never been reversed, so the only obstacle is arithmetic: 60.000 kg has already been drawn out, and unwinding the inbound row would drive available_kg to -60.000."
        test_recipe:
          setup:
            - "POOL-NF holds a 100.000 kg RUN_SCRAP IN row"
            - "RUN-NF-2 has drawn 60.000 kg back out"
