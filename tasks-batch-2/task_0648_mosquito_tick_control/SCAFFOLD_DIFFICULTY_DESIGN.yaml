scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_recurring_vs_special_event_variant
        grounds:
          - calculations.visit_charge
          - state_machines.Visit.DISPATCHED_to_COMPLETED
          - entities.Visit.fields.visit_kind
        distinguishing_aspect: "Same Property/ServicePlan inputs price a RECURRING visit at 7380 cents but a SPECIAL_EVENT visit at 12880 cents because the variant doubles the area surcharge and adds the 4000-cent one-off fee — divergence on the Visit cost domain."
        test_recipe:
          setup:
            - "ServicePlan BASIC per_visit_price_cents=5000, visit_interval_days=21, seasonal_price_cents=30000, retreat_guarantee_days=7, includes_tick_barrier=false."
            - "Property in region NE01 with two ACTIVE zones: TURF 4000 sqft, PERIMETER 2000 sqft (total_treatable_sqft 6000 -> area tier surcharge 1500)."
            - "ACTIVE PER_VISIT subscription, season 2026-05-01..2026-08-31; one RECURRING visit (2026-05-01) DISPATCHED and completed, plus one SPECIAL_EVENT visit (2026-05-05) DISPATCHED and completed."
            - "Logical clock at 2026-05-01 for the recurring completion, advanced to 2026-05-05 for the special-event completion."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a1@x.com", full_name: "A One" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "T1", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "1 Elm", lot_size_sqft: 8000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Backyard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { zone_turf_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Perimeter", zone_type: "PERIMETER", area_sqft: 2000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { zone_perim_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { rec_visit_id: "$.data[0].id"}
            - call: "POST /subscriptions/${sub_id}/special-event"
              payload: { scheduled_date: "2026-05-05" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { se_visit_id: $.data.id }
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { route1_id: $.data.id, route1_ver: $.data.version }
            - call: "POST /crew-routes/${route1_id}/dispatch-visit"
              payload: { visit_id: "${rec_visit_id}", expected_crewroute_version: "${route1_ver}" }
              as: Dispatcher
            - call: "POST /visits/${rec_visit_id}/application-logs"
              payload: { treatment_zone_id: "${zone_turf_id}", product_code: "BIFEN_IT", gallons_applied: 2.0, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
            - call: "POST /visits/${rec_visit_id}/complete"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
              captures: { rec_invoice_unused: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-05" }
              as: Dispatcher
              captures: { route2_id: $.data.id, route2_ver: $.data.version }
            - call: "POST /crew-routes/${route2_id}/dispatch-visit"
              payload: { visit_id: "${se_visit_id}", expected_crewroute_version: "${route2_ver}" }
              as: Dispatcher
            - call: "POST /visits/${se_visit_id}/application-logs"
              payload: { treatment_zone_id: "${zone_perim_id}", product_code: "TALSTAR", gallons_applied: 1.5, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
            - call: "POST /visits/${se_visit_id}/complete"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
          assert:
            - "The PER_VISIT Invoice for ${rec_visit_id} has amount_cents == 7380"
            - "The PER_VISIT Invoice for ${se_visit_id} has amount_cents == 12880"
            - "Invoice for ${se_visit_id}.amount_cents != Invoice for ${rec_visit_id}.amount_cents"

      - name: seasonal_charge_subscription_vs_visit_charge_visit_domain
        grounds:
          - calculations.seasonal_charge
          - calculations.visit_charge
          - state_machines.Subscription.DRAFT_to_ACTIVE
        distinguishing_aspect: "Cost on the Subscription domain (one flat forward-looking seasonal_charge = 35340 cents for 6 planned visits with 7% volume discount + tick add-on) is computed by a different algorithm than the per-completed-visit cost on the Visit domain — two cost variants over two distinct entity domains."
        test_recipe:
          setup:
            - "ServicePlan PLUS seasonal_price_cents=30000, includes_tick_barrier=true, visit_interval_days=21, per_visit_price_cents=5000, retreat_guarantee_days=7."
            - "Property region SE02 with one ACTIVE zone TURF 4000 sqft."
            - "DRAFT SEASONAL subscription season 2026-05-01..2026-08-31 (activation generates 6 RECURRING visits -> 7% volume discount)."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "PLUS", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: true, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a2@x.com", full_name: "A Two" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "2 Oak", lot_size_sqft: 6000, service_region_code: "SE02" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "SEASONAL", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_id}/invoices"
              payload: {}
              as: BillingAdmin
              captures: { seasonal_invoice_id: "$.data[0].id"}
          assert:
            - "Exactly one Invoice with invoice_type == SEASONAL exists for ${sub_id}"
            - "That SEASONAL Invoice.amount_cents == 35340"
            - "Subscription ${sub_id}.season_balance_cents == 35340"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: visit_charge_tiered_nonlinear_mode_a
        grounds:
          - calculations.visit_charge
          - entities.Property.fields.total_treatable_sqft
          - entities.TreatmentZone.fields.zone_type
        distinguishing_aspect: "Mode (a): visit_charge has >=3 interacting inputs (base price + tier-selected area surcharge keyed on total_treatable_sqft + per-zone-type-weighted component summed over zones), yielding 7590 cents for TURF 4500 + PERIMETER 2750 — non-linear because the area surcharge is a step function of the aggregate sqft, not proportional."
        test_recipe:
          setup:
            - "ServicePlan BASIC per_visit_price_cents=5000, visit_interval_days=21, seasonal_price_cents=30000, retreat_guarantee_days=7, includes_tick_barrier=false."
            - "Property region NE01 with TURF 4500 sqft + PERIMETER 2750 sqft (total 7250 -> tier-2 surcharge 1500)."
            - "ACTIVE PER_VISIT subscription season 2026-05-01..2026-08-31; first RECURRING visit dispatched and completed at 2026-05-01."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a3@x.com", full_name: "A Three" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "T2", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "3 Pine", lot_size_sqft: 9000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Turf", zone_type: "TURF", area_sqft: 4500 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_turf_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Perimeter", zone_type: "PERIMETER", area_sqft: 2750 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_ver: $.data.version }
            - call: "POST /crew-routes/${route_id}/dispatch-visit"
              payload: { visit_id: "${v1_id}", expected_crewroute_version: "${route_ver}" }
              as: Dispatcher
            - call: "POST /visits/${v1_id}/application-logs"
              payload: { treatment_zone_id: "${z_turf_id}", product_code: "BIFEN_IT", gallons_applied: 2.0, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
            - call: "GET /invoices"
              payload: { visit_id: "${v1_id}" }
              as: BillingAdmin
              captures: { inv_id: "$.data[0].id", inv_amt: "$.data[0].amount_cents"}
          assert:
            - "Invoice for ${v1_id}.amount_cents == 7590"

      - name: visit_charge_sum_then_round_mode_b
        grounds:
          - calculations.visit_charge
          - entities.Invoice.fields.amount_cents
        distinguishing_aspect: "Mode (b): visit_charge pins sum-then-round — two WATER_FEATURE zones (1250 + 1750 sqft) produce per-zone components 437.5 + 612.5; summing first then rounding once gives 4050 cents, whereas rounding each zone first would give 4051; the scaffold's pinned order yields 4050."
        test_recipe:
          setup:
            - "ServicePlan BASIC per_visit_price_cents=3000, visit_interval_days=21, seasonal_price_cents=30000, retreat_guarantee_days=7, includes_tick_barrier=false."
            - "Property region NE01 with WATER_FEATURE 1250 sqft + WATER_FEATURE 1750 sqft (total 3000 -> tier-1 surcharge 0)."
            - "ACTIVE PER_VISIT subscription season 2026-05-01..2026-08-31; first RECURRING visit dispatched and completed at 2026-05-01."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 3000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a4@x.com", full_name: "A Four" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "T3", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "4 Birch", lot_size_sqft: 5000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Pond A", zone_type: "WATER_FEATURE", area_sqft: 1250 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_a_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Pond B", zone_type: "WATER_FEATURE", area_sqft: 1750 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_ver: $.data.version }
            - call: "POST /crew-routes/${route_id}/dispatch-visit"
              payload: { visit_id: "${v1_id}", expected_crewroute_version: "${route_ver}" }
              as: Dispatcher
            - call: "POST /visits/${v1_id}/application-logs"
              payload: { treatment_zone_id: "${z_a_id}", product_code: "ESSENTRIA_IC3", gallons_applied: 1.0, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
            - call: "GET /invoices"
              payload: { visit_id: "${v1_id}" }
              as: BillingAdmin
              captures: { inv_id: "$.data[0].id"}
          assert:
            - "Invoice for ${v1_id}.amount_cents == 4050"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_cyclic_weather_hold_reschedule_loop
        grounds:
          - state_machines.Visit.SCHEDULED_to_WEATHER_HOLD
          - state_machines.Visit.WEATHER_HOLD_to_SCHEDULED
          - entities.Visit.fields.reschedule_count
        distinguishing_aspect: "Visit is cyclic: SCHEDULED -> WEATHER_HOLD -> SCHEDULED returns the visit to SCHEDULED with reschedule_count incremented to 1 and scheduled_date moved forward, proving a back-edge exists on the Visit entity."
        test_recipe:
          setup:
            - "ACTIVE PER_VISIT subscription in region NE01, season 2026-05-01..2026-08-31, first RECURRING visit scheduled 2026-05-01."
            - "A RAIN_HEAVY WeatherEvent in NE01 on 2026-05-01."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a5@x.com", full_name: "A Five" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "5 Cedar", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: Dispatcher
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /weather-events"
              payload: { region_code: "NE01", event_date: "2026-05-01", severity: "RAIN_HEAVY" }
              as: PlatformAdmin
              captures: { we_id: $.data.id }
            - call: "POST /visits/${v1_id}/weather-hold"
              payload: { weather_event_id: "${we_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /visits/${v1_id}/reschedule"
              payload: { new_scheduled_date: "2026-05-08" }
              as: Dispatcher
          assert:
            - "Visit ${v1_id}.status == SCHEDULED"
            - "Visit ${v1_id}.reschedule_count == 1"
            - "Visit ${v1_id}.scheduled_date == 2026-05-08"

      - name: subscription_branching_draft_to_active_or_cancelled
        grounds:
          - state_machines.Subscription.DRAFT_to_ACTIVE
          - state_machines.Subscription.DRAFT_to_CANCELLED
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Subscription (a different entity than Visit) branches from DRAFT to either ACTIVE (generates the recurring schedule) or CANCELLED (no schedule), with divergent side-effect sets per branch — fork from a single source state with different consequences."
        test_recipe:
          setup:
            - "Two DRAFT PER_VISIT subscriptions on the same property, identical config; one will be activated, the other cancelled from DRAFT."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "a6@x.com", full_name: "A Six" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "6 Aspen", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_b_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions/${sub_b_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_a_id}/visits"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_b_id}/visits"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Subscription ${sub_a_id}.status == ACTIVE"
            - "GET /subscriptions/${sub_a_id}/visits total_count == 6"
            - "Subscription ${sub_b_id}.status == CANCELLED"
            - "GET /subscriptions/${sub_b_id}/visits total_count == 0"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_subscription_to_visit_to_invoice_depth3
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - calculations.cancellation_proration_refund
          - entities.AccountHolder.fields.wallet_credit_cents
