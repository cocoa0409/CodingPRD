      - name: a_frozen_sailing_accepts_a_booking_only_as_waitlisted
        claim_type: conditional_action
        grounds:
          - validations[priority=18].ERR_POSTURE_FROZEN
          - calculations.sailing_occupancy_posture
          - endpoints[POST /bookings]
        distinguishing_aspect: |
          The same POST /bookings body is refused or accepted purely on the value of a flag in the
          request, and only once the sailing has crossed a computed threshold: at FROZEN the posture
          gate at priority 18 bites BEFORE the capacity gate at priority 19, so the booking is
          refused even though three physical cabins are still free. Passing allow_waitlist turns the
          refusal into a WAITLISTED row that is priced but excluded from every sailing aggregate.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing FRZ-2701 has nights 4, total_lower_berths 4 and embark 2027-01-10T17:00:00Z, so two double-occupancy bookings fill the ship on paper."
            - "The IA allotment holds 5 physical cabins with oversell_allowance 0, so cabins remain free while berths do not, and the 730..0 fare window prices the lower berth at 50000."
            - "Two bookings of two adults each are created while the posture is still OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, lower_berths: 2, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "FRZ-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 4, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_f: $.data.id }
            - call: "POST /sailing-inventories"
