      - name: ticket_requires_final_response
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_RESPONSE_NOT_FINAL]"
        distinguishing_aspect: "A PENDING_REVIEW response (even with a comment) cannot be routed to service recovery: 409 ERR_RESPONSE_NOT_FINAL."
        test_recipe:
