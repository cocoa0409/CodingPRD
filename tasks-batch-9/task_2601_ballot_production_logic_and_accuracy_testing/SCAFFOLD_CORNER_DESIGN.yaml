        distinguishing_aspect: "The printed order is the published composite sort (contest_type rank, then district_code, then title) and NOT creation order: the measure filed first ends up last, and the two candidate contests order by district even though the D-12 one was filed earlier - indices are 1-based and contiguous."
        test_recipe:
          setup:
            - "An election in SETUP with three contests filed in an order deliberately different from the printed order: MEASURE/D-07/Bond Measure A first, CANDIDATE/D-12/County Sheriff second, CANDIDATE/D-07/Board of Supervisors third; all three certified."
