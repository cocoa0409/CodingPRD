          - state_machines.LiftStaffAssignment.ASSIGNED_to_RELEASED
          - entities.Lift.fields.staffed_operator_count
          - state_machines.TerrainArea.OPEN_to_PATROL_HOLD
          - validations[priority=15]
        distinguishing_aspect: |
          One release on a child row walks three entities: the assignment goes terminal, the lift
          recomputes staffed_operator_count and falls OPEN -> STANDBY, and every area it serves falls
          OPEN -> PATROL_HOLD. The second trigger then proves RELEASED is terminal, which matters because
          a replayed release would recompute staffed_operator_count a second time and could double-apply
          the cascade.
