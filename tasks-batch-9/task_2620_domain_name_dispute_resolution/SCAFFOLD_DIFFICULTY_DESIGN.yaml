              payload: { seat: "CO_PANELIST_2", nominated_by: "PROVIDER", expected_case_version: "${cv3}", panelist_id: "${pan_c2_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_c2_id: "$.data.id" }
            - call: "POST /udrp/appointments/${apt_c2_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: false, prior_appointments_with_complainant: 0 }
              as: Panelist
              as_user_id: "${pan_c2_id}"
            - call: "GET /udrp/appointments/${apt_p_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { hon_p_before: "$.data.honoraria_cents" }
          trigger:
            - call: "POST /udrp/appointments/${apt_p_id}/replace"
              payload: { replacement_panelist_id: "${pan_sub_id}", reason: "The chair stepped down." }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_sub_id: "$.data.replaced_by_appointment_id", hon_p_after: "$.data.honoraria_cents" }
            - call: "GET /udrp/appointments/${apt_c1_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { hon_c1_mid: "$.data.honoraria_cents" }
            - call: "POST /udrp/appointments/${apt_sub_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: false, prior_appointments_with_complainant: 0 }
              as: Panelist
              as_user_id: "${pan_sub_id}"
              captures: { sub_status: "$.data.status" }
            - call: "GET /udrp/appointments/${apt_sub_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { hon_sub: "$.data.honoraria_cents", sub_seat: "$.data.seat" }
            - call: "GET /udrp/appointments"
              payload: { case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { total_rows: "$.meta.total_count" }
          assert:
            - "At filing: Case.${case_id}.assessed_fee_cents == 168750 and honoraria_pool_cents == 118125 (one seat, expedited)"
            - "After the three-member election: assessed_fee_cents == 418750, respondent_share_cents == 125000, complainant_share_cents == 293750 and honoraria_pool_cents == 293125"
            - "At constitution the split is PRESIDING 117251, CO_PANELIST_1 87937, CO_PANELIST_2 87937 - the floors are 117250 / 87937 / 87937 and the single remaining cent goes to the chair"
            - "sum(honoraria_cents) == 117251 + 87937 + 87937 == 293125 == Case.${case_id}.honoraria_pool_cents, exactly"
            - "Independent round_half_up per seat would give 117250 + 87938 + 87938 == 293126, one cent over the pool, and is wrong"
            - "After the replace: PanelistAppointment.${apt_p_id}.honoraria_cents == 0 and status == REPLACED, and the stale 117251 is NOT left on the row"
            - "The two surviving seats are untouched by the replace: ${apt_c1_id} and ${apt_c2_id} still read 87937 each while the case sits in PANEL_APPOINTMENT"
            - "Case.${case_id}.honoraria_pool_cents is STILL 293125 - vacating a seat never changes the pool, because the pool is a function of the fee assessment alone"
            - "After the successor screens clean: PanelistAppointment.${apt_sub_id}.status == ACCEPTED with seat PRESIDING and honoraria_cents == 117251, and Case.${case_id}.status == PANEL_CONSTITUTED"
            - "COMPENSATING INVARIANT: sum(honoraria_cents over the three ACCEPTED rows) == 293125 again, and sum over ALL FOUR rows == 293125 too, because the REPLACED row contributes 0"
            - "GET /udrp/appointments?case_id=${case_id} returns meta.total_count == 4"
            - "Panelist.${pan_p_id}.active_case_load == 0 and Panelist.${pan_sub_id}.active_case_load == 1"
