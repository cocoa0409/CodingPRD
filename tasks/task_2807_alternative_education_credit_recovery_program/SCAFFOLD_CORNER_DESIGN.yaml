          - state_machines.Placement.ACTIVE_to_EXITED_UNSUCCESSFUL
        excluded_because:
          difficulty_instance: placement_exit_cascade_to_waitlist_promotion
          rationale: "That instance asserts the IN_PROGRESS enrollment moving to AWARD_DENIED with denial_reason PLACEMENT_EXITED while the seat release and waitlist promotion run."

