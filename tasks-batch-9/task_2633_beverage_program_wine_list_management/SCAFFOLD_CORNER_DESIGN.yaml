  - section: errors
    instances:
      - name: every_path_resource_returns_its_own_not_found_error
        claim_type: Triggerable
        grounds:
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_DISTRIBUTOR_NOT_FOUND]
          - errors[ERR_BIN_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_DEPLETION_ENTRY_NOT_FOUND]
          - errors[ERR_WINE_LIST_NOT_FOUND]
          - errors[ERR_LIST_ENTRY_NOT_FOUND]
          - errors[ERR_SLOT_NOT_FOUND]
          - errors[ERR_WRITE_OFF_NOT_FOUND]
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_INVESTIGATION_NOT_FOUND]
          - validations[priority 10]
        distinguishing_aspect: >-
          Priority 10 is a per-resource ladder, not one generic 404: twelve reads of the same unknown
          UUID against twelve different single-resource paths must each answer with the error_id named
          for that resource, which is the only way an implementation's error catalogue can be shown to
          be resource-specific rather than a shared handler.
        test_recipe:
          setup:
            - "An empty database at the default logical clock 2026-08-01T00:00:00Z."
            - "One unknown UUID reused for every path: 00000000-0000-4000-8000-000000000000."
          setup_api_calls: []
          trigger:
            - call: "GET /beverage-program/venues/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/distributors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/cellar-bins/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/allocation-offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/allocation-claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/depletion-entries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/wine-lists/00000000-0000-4000-8000-000000000000"
