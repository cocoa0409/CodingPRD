# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2786_theme_park_ride_maintenance_daily_inspection
#
# Nine rule_id blocks, two differentiated instances each (18 total). Every
# instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file changes
# no declared behaviour. Every numeric assert below was produced by executing
# the relevant §1.3 formula against its declared constants.
#
# Fixture convention: the logical clock starts at 2026-08-01T00:00:00Z, so an
# instance that never calls POST /_clock/set_current_utc is anchored there.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_loss_settled_per_event_rounding_vs_provisional_single_rounding
        grounds:
          - calculations.downtime_capacity_loss
          - entities.DowntimeEvent.fields.settled_guest_slots_lost
          - entities.DowntimeEvent.fields.peak_minutes
          - state_machines.DowntimeEvent.DIAGNOSED_to_RESOLVED
          - endpoints[GET /park-ops/attractions/{id}/capacity-impact]
        distinguishing_aspect: |
          The two variants read the identical event set yet disagree twice over: SETTLED rounds
          each event's loss to 2 decimals before summing (1886.96 + 1745.13 = 3632.09) while
          PROVISIONAL aggregates raw peak/off-peak minutes and rounds once (3632.08) before
          applying the 15% recovery credit, so the reported divergence is 544.82 and the
          one-cent rounding-order gap survives inside it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T20:00:00Z so the capacity window defaults to service date 2026-08-10"
            - "one attraction with theoretical_hourly_capacity 1150"
            - "downtime event 1: 10:21Z-12:17Z, 116 whole minutes, 77 inside the peak window, 39 outside it, status CLOSED"
            - "downtime event 2: 15:46Z-17:31Z, 105 whole minutes, 74 inside the peak window, 31 outside it, status RESOLVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00.000Z" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/attractions"
              payload: { name: "Comet Racer", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "SLC-689", ride_class: "THRILL", theoretical_hourly_capacity: 1150, min_operators_required: 3, parts_budget_cents: 5000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${attr_id}", started_at: "2026-08-10T10:21:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              captures: { dt1_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${dt1_id}/diagnose"
              payload: { root_cause_code: "BRK-114" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${dt1_id}/resolve"
              payload: { ended_at: "2026-08-10T12:17:00.000Z" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${dt1_id}/close"
              payload: {}
              as: MaintenanceManager
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${attr_id}", started_at: "2026-08-10T15:46:00.000Z", cause_category: "ELECTRICAL" }
              as: MaintenanceTechnician
              captures: { dt2_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${dt2_id}/diagnose"
              payload: { root_cause_code: "ELC-207" }
              as: MaintenanceTechnician
            - call: "POST /park-ops/downtime-events/${dt2_id}/resolve"
              payload: { ended_at: "2026-08-10T17:31:00.000Z" }
              as: MaintenanceTechnician
          trigger:
            - call: "GET /park-ops/attractions/${attr_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
          assert:
            - "response.event_count == 2"
            - "DowntimeEvent.${dt1_id}.duration_minutes == 116 and peak_minutes == 77 and off_peak_minutes == 39"
            - "DowntimeEvent.${dt1_id}.settled_guest_slots_lost == 1886.96"
            - "DowntimeEvent.${dt2_id}.duration_minutes == 105 and peak_minutes == 74 and off_peak_minutes == 31"
            - "DowntimeEvent.${dt2_id}.settled_guest_slots_lost == 1745.13"
            - "response.settled_guest_slots_lost == 3632.09"
            - "response.provisional_guest_slots_lost == 3087.27"
            - "response.divergence_guest_slots == 544.82"
            - "response.settled_guest_slots_lost != 3632.08, the value a single final rounding would produce"
            - "window_start_date == 2026-08-10 and window_end_date == 2026-08-10 with no query parameters supplied"
      - name: bulletin_risk_fleet_aggregate_escalation_vs_per_unit_max
        grounds:
          - calculations.bulletin_fleet_risk_score
          - entities.BulletinAction.fields.status
          - entities.Attraction.fields.ride_class
          - state_machines.BulletinAction.PENDING_to_DEFERRED
          - endpoints[GET /park-ops/bulletins/{id}/risk]
        distinguishing_aspect: |
          FLEET_AGGREGATE averages the three per-action scores and then multiplies by the
          deferral escalation factor 1.05 (41.10 -> 43.16) while PER_UNIT_MAX takes the single
          worst action 55.50 and ignores escalation entirely, so the same DEFERRED row raises one
          variant and is invisible to the other; the divergence is 12.34.
        test_recipe:
          setup:
            - "three attractions sharing manufacturer Intamin and model_code MegaLite-3, created in order THRILL, FAMILY, KIDDIE"
            - "one MANDATORY bulletin with compliance_deadline_date 2026-08-05, acknowledged so the fleet fan-out exists"
            - "fleet action 1 left PENDING, action 2 moved to IN_WORK, action 3 DEFERRED"
            - "logical clock moved to 2026-08-10T00:00:00Z, five whole days past the compliance deadline"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Thunder Spiral", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "MegaLite-3", ride_class: "THRILL", theoretical_hourly_capacity: 900, min_operators_required: 3, parts_budget_cents: 4000000 }
              as: ParkOpsAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Lagoon Skimmer", park_area: "LAGOON", manufacturer: "Intamin", model_code: "MegaLite-3", ride_class: "FAMILY", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 4000000 }
              as: ParkOpsAdmin
              captures: { a2_id: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Cove Hopper", park_area: "KIDS_COVE", manufacturer: "Intamin", model_code: "MegaLite-3", ride_class: "KIDDIE", theoretical_hourly_capacity: 400, min_operators_required: 1, parts_budget_cents: 4000000 }
              as: ParkOpsAdmin
              captures: { a3_id: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "SB-2026-118", manufacturer: "Intamin", model_code: "MegaLite-3", severity: "MANDATORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-08-05" }
              as: ParkOpsAdmin
              captures: { b_id: "$.data.id" }
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_id}" }
              as: MaintenanceManager
              captures: { act1_id: "$.data[0].id", act2_id: "$.data[1].id", act3_id: "$.data[2].id" }
            - call: "POST /park-ops/bulletin-actions/${act2_id}/start"
              payload: {}
              as: MaintenanceTechnician
            - call: "POST /park-ops/bulletin-actions/${act3_id}/defer"
              payload: { deferral_reason: "Retrofit kit backordered", deferred_until_date: "2026-08-04" }
              as: MaintenanceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: ParkOpsAdmin
          trigger:
            - call: "GET /park-ops/bulletins/${b_id}/risk"
              payload: {}
              as: MaintenanceManager
          assert:
            - "response.evaluated_action_count == 3"
            - "response.deferred_action_count == 1"
            - "response.escalation_factor == 1.05"
            - "response.fleet_aggregate_score == 43.16"
            - "response.per_unit_max_score == 55.50"
            - "response.divergence == 12.34"
            - "per-action scores are 55.50 for ${act1_id} (40 * 1.2 * 1.0 + 7.5), 26.70 for ${act2_id} (40 * 0.8 * 0.6 + 7.5) and 41.10 for ${act3_id} (40 * 0.6 * 1.4 + 7.5)"
            - "BulletinAction.${act3_id}.status == DEFERRED and BulletinAction.${act2_id}.status == IN_WORK"

  - rule_id: combinatorial_formula
    instances:
      - name: overhaul_expedite_tier_selected_from_discounted_base_not_base_total
        grounds:
          - calculations.overhaul_cost_estimate
          - entities.OverhaulWorkOrder.fields.discounted_base_cents
          - entities.OverhaulWorkOrder.fields.expedite_pct
          - entities.OverhaulWorkOrder.fields.estimated_total_cents
          - endpoints[POST /park-ops/overhaul-work-orders]
        distinguishing_aspect: |
          Seven chained steps whose order is load-bearing: labor rate, off-season predicate over the
          whole window, a half-up 6% discount, then a tier lookup keyed on the DISCOUNTED base. The
          fixture straddles EXPEDITE_TIER_1_CEILING from above: base_total_cents 5070025 sits in the
          medium tier while discounted_base_cents 4765823 sits in the small tier, so selecting the
          tier before applying the discount yields 5147089 instead of the correct 5337722.
        test_recipe:
          setup:
            - "one attraction with a SAFETY_CRITICAL gearbox installed on it"
            - "one shop bay with concurrent_slot_capacity 1 and no other work orders"
            - "work order window 2026-11-10 to 2026-11-20, entirely inside the off-season span, with expedite_requested true"
            - "parts_subtotal_cents 4500025 and labor_hours 60, chosen so the discount moves the order down one expedite tier"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Cyclone Ridge", park_area: "FRONTIER", manufacturer: "Zierer", model_code: "TF-24", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 9000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr_id}", name: "Main drive gearbox", component_type: "GEARBOX", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 40000, ndt_interval_days: 365 }
              as: ParkOpsAdmin
              captures: { comp_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay 1", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              captures: { bay_id: "$.data.id", bay_v: "$.data.version" }
          trigger:
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${attr_id}", component_id: "${comp_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v}", window_start_date: "2026-11-10", window_end_date: "2026-11-20", parts_subtotal_cents: 4500025, labor_hours: 60, expedite_requested: true }
              as: MaintenanceManager
          assert:
            - "status code 201 and OverhaulWorkOrder.status == SCHEDULED"
            - "response.off_season == true"
            - "response.base_total_cents == 5070025"
            - "response.off_season_discount_cents == 304202"
            - "response.discounted_base_cents == 4765823"
            - "response.expedite_pct == 0.12"
            - "response.expedite_fee_cents == 571899"
            - "response.estimated_total_cents == 5337722"
            - "response.estimated_total_cents != 5147089, the total produced by picking the tier from base_total_cents"
            - "ShopBay.${bay_id}.booked_order_count == 1 and ShopBay.${bay_id}.version == 2"
      - name: dispatch_readiness_nested_min_max_with_capped_penalty
        grounds:
          - calculations.dispatch_readiness_index
          - calculations.certification_status_derivation
          - entities.Attraction.fields.min_operators_required
          - entities.DailyInspection.fields.essential_fail_count
          - endpoints[GET /park-ops/attractions/{id}/dispatch-readiness]
        distinguishing_aspect: |
          One expression nests a capped staffing ratio, a clamped restraint factor, a weighted sum
          and a subtracted penalty, and its input set is itself derived: the TRAINEE row scoring 84
          must not enter the mean. With three CERTIFIED operators against min_operators_required 2
          the ratio must clamp at 1.0, giving 81.50; omitting the clamp yields 126.25, and letting
          the 84 into the mean yields a different restraint factor entirely.
        test_recipe:
          setup:
            - "logical clock left at its default 2026-08-01T00:00:00Z"
            - "one attraction with min_operators_required 2 and no components, so no NDT gate exists"
            - "an ACTIVE template with two ESSENTIAL lines and one ADVISORY line"
            - "four certifications: restraint 92, 87 and 100 all CERTIFIED, plus restraint 84 which derives TRAINEE"
            - "the 2026-08-01 inspection signed off with exactly one ESSENTIAL FAIL, so essential_fail_count is 1 and posture is OPEN"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Skyline Flyer", park_area: "SKYLINE", manufacturer: "Zamperla", model_code: "AF-9", ride_class: "FAMILY", theoretical_hourly_capacity: 600, min_operators_required: 2, parts_budget_cents: 2000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${attr_id}", effective_from_date: "2026-07-01" }
              as: ParkOpsAdmin
              captures: { tpl_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 1, description: "Restraint actuator stroke check", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 2, description: "Air gauge reading within band", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 3, description: "Queue signage legible", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
            - call: "GET /park-ops/attractions/${attr_id}"
              payload: {}
              as: ParkOpsAdmin
              captures: { attr_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/activate"
              payload: { expected_attraction_version: "${attr_v}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-1", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 92, dispatch_procedure_score: 88 }
              as: MaintenanceManager
              captures: { cert1_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-2", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 87, dispatch_procedure_score: 81 }
              as: MaintenanceManager
              captures: { cert2_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-3", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 100, dispatch_procedure_score: 95 }
              as: MaintenanceManager
              captures: { cert3_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-4", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 84, dispatch_procedure_score: 90 }
              as: MaintenanceManager
              captures: { cert4_id: "$.data.id" }
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${attr_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp_id: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { res1_id: "$.data[0].id", res2_id: "$.data[1].id", res3_id: "$.data[2].id" }
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "FAIL", note: "Stroke 2mm short of band, shimmed and re-measured" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-item-results/${res2_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-item-results/${res3_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp_id}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp_id}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-9"
          trigger:
            - call: "GET /park-ops/attractions/${attr_id}/dispatch-readiness"
              payload: {}
              as: MaintenanceManager
          assert:
            - "OperatorCertification.${cert4_id}.status == TRAINEE while ${cert1_id}, ${cert2_id} and ${cert3_id} are CERTIFIED"
            - "response.operational_posture == OPEN"
            - "response.certified_operator_count == 3"
            - "response.mean_restraint_score == 93.0"
            - "response.essential_fail_count == 1"
            - "response.dispatch_readiness_index == 81.50"
            - "response.dispatch_readiness_index != 126.25, the value an unclamped staffing ratio of 1.5 would produce"
            - "DailyInspection.${insp_id}.essential_fail_count == 1 and blocking_item_count == 0 and pending_item_count == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_reject_reopen_cycle_resets_only_fail_rows_and_bumps_rework_round
        grounds:
          - state_machines.DailyInspection.PENDING_SIGN_OFF_to_REJECTED
          - state_machines.DailyInspection.REJECTED_to_IN_PROGRESS
          - state_machines.InspectionItemResult.FAIL_to_PENDING
          - entities.DailyInspection.fields.rework_round
          - entities.DailyInspection.fields.recorded_by_user_ids
          - endpoints[POST /park-ops/daily-inspections/{id}/reopen]
        distinguishing_aspect: |
          The cycle IN_PROGRESS -> PENDING_SIGN_OFF -> REJECTED -> IN_PROGRESS returns the parent to
          a state it already occupied while changing the child population selectively: only the FAIL
          row reverts to PENDING and loses its recorder, the PASS and NA rows are untouched, and two
          counters move in opposite directions (rework_round 0 -> 1, essential_fail_count 1 -> 0).
          recorded_by_user_ids must survive the loop, and IN_PROGRESS has no reopen edge, so the
          second reopen is refused even though the entity is in a state it reached via reopen.
        test_recipe:
          setup:
            - "an ACTIVE three-line template: sequence 1 ESSENTIAL, sequences 2 and 3 ADVISORY"
            - "an inspection for 2026-08-01 with line 1 recorded FAIL plus note, line 2 PASS and line 3 NA, all by user tech-7"
            - "the inspection submitted and then rejected by the qualified inspector"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Lagoon Rapids", park_area: "LAGOON", manufacturer: "Hafema", model_code: "RR-12", ride_class: "WATER", theoretical_hourly_capacity: 950, min_operators_required: 3, parts_budget_cents: 3000000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${attr_id}", effective_from_date: "2026-07-15" }
              as: ParkOpsAdmin
              captures: { tpl_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 1, description: "Water level in trough within band", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 2, description: "Boat bumper condition", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 3, description: "Splash-zone signage", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
            - call: "GET /park-ops/attractions/${attr_id}"
              payload: {}
              as: ParkOpsAdmin
              captures: { attr_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/activate"
              payload: { expected_attraction_version: "${attr_v}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${attr_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-7"
              captures: { insp_id: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-7"
              captures: { res1_id: "$.data[0].id", res2_id: "$.data[1].id", res3_id: "$.data[2].id" }
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "FAIL", note: "Trough 40mm low, topped up" }
              as: MaintenanceTechnician
              as_user_id: "tech-7"
            - call: "POST /park-ops/inspection-item-results/${res2_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-7"
            - call: "POST /park-ops/inspection-item-results/${res3_id}/record"
              payload: { outcome: "NA" }
              as: MaintenanceTechnician
              as_user_id: "tech-7"
            - call: "POST /park-ops/daily-inspections/${insp_id}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-7"
            - call: "POST /park-ops/daily-inspections/${insp_id}/reject"
              payload: { rejection_reason: "Re-measure trough after pump cycle" }
              as: QualifiedInspector
              as_user_id: "insp-3"
          trigger:
            - call: "POST /park-ops/daily-inspections/${insp_id}/reopen"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-7"
            - call: "POST /park-ops/daily-inspections/${insp_id}/reopen"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-7"
          assert:
            - "the first reopen returns 200 with DailyInspection.${insp_id}.status == IN_PROGRESS and rework_round == 1"
            - "InspectionItemResult.${res1_id}.outcome == PENDING with recorded_by_user_id == null and recorded_at == null"
            - "InspectionItemResult.${res2_id}.outcome == PASS and InspectionItemResult.${res3_id}.outcome == NA, both untouched"
            - "DailyInspection.${insp_id}.pending_item_count == 1, blocking_item_count == 0, essential_fail_count == 0"
            - "DailyInspection.${insp_id}.recorded_by_user_ids == [tech-7] and rejection_reason still reads Re-measure trough after pump cycle"
            - "the second reopen returns ERR_INSPECTION_STATE_INVALID with http_status 409 and rework_round stays 1"
      - name: incident_fork_join_branch_asymmetry_on_clearance_reference
        grounds:
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_REGULATOR_NOTIFIED
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_INTERNAL_REVIEW_CLOSED
          - state_machines.IncidentReport.REGULATOR_NOTIFIED_to_CLEARED_TO_OPERATE
          - entities.IncidentReport.fields.notified_late
          - validations[priority=16]
          - endpoints[POST /park-ops/incidents/{id}/clear]
        distinguishing_aspect: |
          UNDER_INVESTIGATION forks into two branches that rejoin on the same clear endpoint with
          different obligations: the incident that took the regulator branch is refused clearance
          without regulator_clearance_ref while the internal-review incident clears on an empty
          payload. The path taken, not the current state name, decides the requirement, and the
          regulator branch additionally stamps notified_late true because notified_at
          2026-08-04T10:00:00Z is past the 24-hour deadline 2026-08-03T09:00:00Z.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-02T12:00:00Z"
            - "incident A on attraction 1 with injury_severity SERIOUS and occurred_at 2026-08-02T09:00:00Z, so it opens directly in RIDE_HELD with a 2026-08-03T09:00:00Z deadline"
            - "incident B on attraction 2 with injury_severity MINOR, so it opens in REPORTED and needs an explicit hold-ride"
            - "clock advanced to 2026-08-04T10:00:00Z, then A investigated and notified, B investigated and closed internally"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00.000Z" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/attractions"
              payload: { name: "Vertigo Drop", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "GD-70", ride_class: "THRILL", theoretical_hourly_capacity: 500, min_operators_required: 2, parts_budget_cents: 1500000 }
              as: ParkOpsAdmin
              captures: { attr1_id: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Cove Carousel", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "CR-36", ride_class: "KIDDIE", theoretical_hourly_capacity: 300, min_operators_required: 1, parts_budget_cents: 800000 }
              as: ParkOpsAdmin
              captures: { attr2_id: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${attr1_id}", occurred_at: "2026-08-02T09:00:00.000Z", injury_severity: "SERIOUS", guest_count_affected: 1, narrative: "Guest reported arm injury on restraint release" }
              as: SafetyOfficer
              captures: { inc_a: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${attr2_id}", occurred_at: "2026-08-02T10:30:00.000Z", injury_severity: "MINOR", guest_count_affected: 1, narrative: "Guest scraped knee boarding" }
              as: SafetyOfficer
              captures: { inc_b: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00.000Z" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/incidents/${inc_a}/investigate"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_a}/notify-regulator"
              payload: { regulator_case_ref: "STATE-2026-4471" }
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_b}/hold-ride"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_b}/investigate"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_b}/close-internal"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /park-ops/incidents/${inc_a}/clear"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_b}/clear"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/incidents/${inc_a}/clear"
              payload: { regulator_clearance_ref: "SC-2026-0091" }
              as: SafetyOfficer
          assert:
            - "IncidentReport.${inc_a}.status was RIDE_HELD immediately after creation, with regulator_notification_due_at == 2026-08-03T09:00:00.000Z"
            - "IncidentReport.${inc_a}.notified_late == true and notified_at == 2026-08-04T10:00:00.000Z"
            - "IncidentReport.${inc_b}.regulator_notification_due_at == null, notified_at == null and notified_late == false"
            - "the first clear call returns ERR_REGULATOR_CLEARANCE_REQUIRED with http_status 422 and ${inc_a} stays REGULATOR_NOTIFIED"
            - "the second clear call returns 200 with IncidentReport.${inc_b}.status == CLEARED_TO_OPERATE and cleared_at == 2026-08-04T10:00:00.000Z"
            - "the third clear call returns 200 with IncidentReport.${inc_a}.status == CLEARED_TO_OPERATE and regulator_clearance_ref == SC-2026-0091"
            - "Attraction.${attr1_id}.regulatory_hold == false and Attraction.${attr2_id}.regulatory_hold == false after both clearances"

  - rule_id: transitive_cascade
    instances:
      - name: safety_critical_fail_cascades_four_hops_and_walk_back_is_partial
        grounds:
          - endpoints[POST /park-ops/inspection-item-results/{id}/record]
          - state_machines.DailyInspection.IN_PROGRESS_to_BLOCKED
          - state_machines.DailyInspection.BLOCKED_to_IN_PROGRESS
          - entities.ComponentAsset.fields.condition_flag
          - entities.DowntimeEvent.fields.auto_opened
          - calculations.operational_posture_derivation
        distinguishing_aspect: |
          One record call propagates four hops through three other entities: component condition_flag
          OK -> SUSPECT, inspection IN_PROGRESS -> BLOCKED, attraction posture -> DOWN, and a
          system-authored DowntimeEvent with cause_category INSPECTION_FAIL and auto_opened true.
          Re-recording the same line as PASS unwinds only hop 2 - the inspection returns to
          IN_PROGRESS while the downtime event stays OPEN, so the posture stays DOWN and the
          component stays SUSPECT, which is exactly what a naive symmetric undo gets wrong.
        test_recipe:
          setup:
            - "one attraction with a SAFETY_CRITICAL brake component"
            - "an ACTIVE two-line template whose line 1 is SAFETY_CRITICAL and bound to that component, line 2 ADVISORY"
            - "an inspection open for 2026-08-01 with both lines still PENDING"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Frontier Runaway", park_area: "FRONTIER", manufacturer: "Gerstlauer", model_code: "EC-450", ride_class: "THRILL", theoretical_hourly_capacity: 720, min_operators_required: 2, parts_budget_cents: 2500000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${attr_id}", name: "Station brake caliper", component_type: "BRAKE", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 60000, ndt_interval_days: 400 }
              as: ParkOpsAdmin
              captures: { comp_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${attr_id}", effective_from_date: "2026-07-01" }
              as: ParkOpsAdmin
              captures: { tpl_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 1, description: "Station brake pad thickness", severity_class: "SAFETY_CRITICAL", component_id: "${comp_id}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 2, description: "Platform gate paint", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
            - call: "GET /park-ops/attractions/${attr_id}"
              payload: {}
              as: ParkOpsAdmin
              captures: { attr_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/activate"
              payload: { expected_attraction_version: "${attr_v}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${attr_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-2"
              captures: { insp_id: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-2"
              captures: { res1_id: "$.data[0].id" }
          trigger:
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "FAIL", note: "Pad at 2mm, below minimum" }
              as: MaintenanceTechnician
              as_user_id: "tech-2"
            - call: "GET /park-ops/downtime-events"
              payload: { attraction_id: "${attr_id}" }
              as: MaintenanceManager
              captures: { auto_dt_id: "$.data[0].id" }
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-2"
          assert:
            - "after the FAIL: InspectionItemResult.${res1_id}.outcome == FAIL and severity_class == SAFETY_CRITICAL"
            - "hop 1: ComponentAsset.${comp_id}.condition_flag == SUSPECT"
            - "hop 2: DailyInspection.${insp_id}.status == BLOCKED with blocking_item_count == 1"
            - "hop 3: Attraction.${attr_id}.operational_posture == DOWN"
            - "hop 4: exactly one DowntimeEvent ${auto_dt_id} exists for the attraction with cause_category == INSPECTION_FAIL, auto_opened == true, status == OPEN and ended_at == null"
            - "after the PASS: DailyInspection.${insp_id}.status == IN_PROGRESS with blocking_item_count == 0"
            - "DowntimeEvent.${auto_dt_id}.status is still OPEN and Attraction.${attr_id}.operational_posture is still DOWN"
            - "ComponentAsset.${comp_id}.condition_flag is still SUSPECT, because only an NDT PASS record or a recommissioning clears it"
      - name: ride_hold_cascade_suspends_only_certified_rows_and_gates_cycle_logging
        grounds:
          - endpoints[POST /park-ops/incidents/{id}/hold-ride]
          - state_machines.OperatorCertification.CERTIFIED_to_SUSPENDED
          - entities.Attraction.fields.regulatory_hold
          - entities.Attraction.fields.certified_operator_count
          - entities.IncidentReport.fields.suspended_certification_count
          - validations[priority=10]
        distinguishing_aspect: |
          A single hold-ride call walks attraction flag -> posture -> every child certification ->
          the recomputed operator count, and the cascade is state-filtered: the two CERTIFIED rows
          become SUSPENDED while the TRAINEE row (restraint score 70) is left alone, so
          suspended_certification_count is 2 rather than 3 and certified_operator_count lands on 0.
          The flag then reaches an endpoint on a different entity entirely - cycle logging is refused
          with ERR_REGULATORY_HOLD_ACTIVE while the hold stands.
        test_recipe:
          setup:
            - "one attraction with two CERTIFIED operator certifications and one TRAINEE row"
            - "one MINOR incident, which opens in REPORTED and runs no cascade at creation"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Timber Twister", park_area: "FRONTIER", manufacturer: "GCI", model_code: "WD-88", ride_class: "THRILL", theoretical_hourly_capacity: 880, min_operators_required: 2, parts_budget_cents: 2200000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-11", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 90, dispatch_procedure_score: 85 }
              as: MaintenanceManager
              captures: { cert1_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-12", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 96, dispatch_procedure_score: 92 }
              as: MaintenanceManager
              captures: { cert2_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${attr_id}", operator_user_id: "op-13", effective_from: "2026-07-01T00:00:00.000Z", expires_at: "2026-12-31T00:00:00.000Z", restraint_verification_score: 70, dispatch_procedure_score: 90 }
              as: MaintenanceManager
              captures: { cert3_id: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${attr_id}", occurred_at: "2026-08-01T09:15:00.000Z", injury_severity: "MINOR", guest_count_affected: 2, narrative: "Two guests reported jolt at brake run" }
              as: SafetyOfficer
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/incidents/${inc_id}/hold-ride"
              payload: {}
              as: SafetyOfficer
            - call: "POST /park-ops/attractions/${attr_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 40 }
              as: MaintenanceTechnician
              as_user_id: "tech-4"
          assert:
            - "Attraction.${attr_id}.certified_operator_count == 2 before the hold"
            - "IncidentReport.${inc_id}.status == RIDE_HELD after the hold call"
            - "hop 1: Attraction.${attr_id}.regulatory_hold == true"
            - "hop 2: Attraction.${attr_id}.operational_posture == HOLD"
            - "hop 3: OperatorCertification.${cert1_id}.status == SUSPENDED and ${cert2_id}.status == SUSPENDED, both with suspension_reason RIDE_HOLD and suspended_at 2026-08-01T00:00:00.000Z"
            - "OperatorCertification.${cert3_id}.status is still TRAINEE with suspended_at == null"
            - "hop 4: Attraction.${attr_id}.certified_operator_count == 0 and IncidentReport.${inc_id}.suspended_certification_count == 2"
            - "the cycles call returns ERR_REGULATORY_HOLD_ACTIVE with http_status 409 and Attraction.${attr_id}.cumulative_cycles stays 0"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: signoff_state_check_priority_7_wins_over_blocking_item_8_and_segregation_11
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.DailyInspection.IN_PROGRESS_to_BLOCKED
          - endpoints[POST /park-ops/daily-inspections/{id}/sign-off]
        distinguishing_aspect: |
          The sign-off attempt violates three rules at once: the inspection is BLOCKED and BLOCKED has
          no sign-off edge (priority 7), blocking_item_count is 1 (priority 8), and the signing
          X-User-ID u-77 is already inside recorded_by_user_ids (priority 11). Only the lowest
          priority number may surface, so the answer is ERR_INSPECTION_STATE_INVALID with 409 -
          an implementation that checks the safety gate or the duty gate first returns
          ERR_SAFETY_CRITICAL_ITEM_FAILED or a 403 instead.
        test_recipe:
          setup:
            - "one attraction with no components, so the NDT gate at priority 9 cannot fire"
            - "an ACTIVE two-line template: line 1 SAFETY_CRITICAL and unbound, line 2 ADVISORY"
            - "user u-77 records line 1 FAIL, which drives the inspection to BLOCKED, then records line 2 PASS so nothing is pending"
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Boardwalk Bullet", park_area: "LAGOON", manufacturer: "Mack", model_code: "BW-31", ride_class: "FAMILY", theoretical_hourly_capacity: 640, min_operators_required: 2, parts_budget_cents: 1200000 }
              as: ParkOpsAdmin
              captures: { attr_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${attr_id}", effective_from_date: "2026-07-01" }
              as: ParkOpsAdmin
              captures: { tpl_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 1, description: "Restraint lock proof load", severity_class: "SAFETY_CRITICAL" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/inspection-templates/${tpl_id}/items"
              payload: { sequence_no: 2, description: "Queue rail fasteners", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
            - call: "GET /park-ops/attractions/${attr_id}"
              payload: {}
              as: ParkOpsAdmin
              captures: { attr_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${tpl_id}/activate"
              payload: { expected_attraction_version: "${attr_v}" }
              as: ParkOpsAdmin
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${attr_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "u-77"
              captures: { insp_id: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp_id}" }
              as: MaintenanceTechnician
              as_user_id: "u-77"
              captures: { res1_id: "$.data[0].id", res2_id: "$.data[1].id" }
            - call: "POST /park-ops/inspection-item-results/${res1_id}/record"
              payload: { outcome: "FAIL", note: "Lock did not hold proof load" }
              as: MaintenanceTechnician
              as_user_id: "u-77"
            - call: "POST /park-ops/inspection-item-results/${res2_id}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "u-77"
          trigger:
            - call: "POST /park-ops/daily-inspections/${insp_id}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "u-77"
          assert:
            - "error_id == ERR_INSPECTION_STATE_INVALID with http_status 409"
            - "error_id is NOT ERR_SAFETY_CRITICAL_ITEM_FAILED and NOT ERR_SEGREGATION_OF_DUTIES"
            - "DailyInspection.${insp_id}.status is still BLOCKED with blocking_item_count == 1 and pending_item_count == 0"
            - "DailyInspection.${insp_id}.recorded_by_user_ids == [u-77] and signed_off_by_user_id == null"
            - "Attraction.${attr_id}.last_signed_off_service_date == null"
      - name: overhaul_component_mismatch_priority_12_wins_over_bay_capacity_24
        grounds:
          - validations[priority=12]
          - validations[priority=24]
          - concurrency_rules[overhaul-create-stale-shop-bay]
          - endpoints[POST /park-ops/overhaul-work-orders]
          - entities.ShopBay.fields.booked_order_count
        distinguishing_aspect: |
          The rejected request breaks referential integrity (component belongs to attraction 2, order
          names attraction 1) AND exhausts the bay: capacity is 1 and the buffered window
          2026-11-14..2026-11-19 collides with the existing 2026-11-10..2026-11-14 order. The
          422 ERR_COMPONENT_ATTRACTION_MISMATCH must win over the 409 ERR_BAY_CAPACITY_CONFLICT, and
          because the OCC token supplied is current, the 412 at priority 6 must not fire either.
        test_recipe:
          setup:
            - "attraction 1 with component C1 and attraction 2 with component C2"
            - "one shop bay with concurrent_slot_capacity 1"
            - "an existing SCHEDULED work order for attraction 1 / C1 occupying 2026-11-10 to 2026-11-14 in that bay"
