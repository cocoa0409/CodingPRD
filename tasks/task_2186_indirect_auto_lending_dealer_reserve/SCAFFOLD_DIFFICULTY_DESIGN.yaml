        grounds:
          - state_machines.RetailContract.FUNDED_to_PAID_OFF
          - state_machines.Dealer.ACTIVE_to_SUSPENDED
          - state_machines.CreditApplication.SUBMITTED_to_ON_HOLD
          - entities.Dealer.fields.early_payoff_rate_bps
          - entities.Dealer.fields.reserve_balance_cents
          - entities.CreditApplication.fields.held_from_status
          - calculations.reserve_chargeback_amount
        distinguishing_aspect: |
          Depth-4 chain from a single POST to the chargeback-events endpoint, each link
          caused by the previous one: (1) the contract moves FUNDED -> PAID_OFF; (2) that
          payoff, being inside the seasoning horizon, raises Dealer.early_payoff_count to 1;
          (3) the resulting early_payoff_rate_bps of 5000 crosses PROBATION_EARLY_PAYOFF_RATE_BPS
          and auto-transitions the dealer ACTIVE -> SUSPENDED; (4) that suspension moves the
          dealer's open application to ON_HOLD with held_from_status SUBMITTED. Removing any
          link breaks the next.
