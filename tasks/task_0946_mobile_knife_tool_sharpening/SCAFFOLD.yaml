scenario: "946. Mobile Knife & Tool Sharpening (route): service request & item type, van route & dispatch, per-item/subscription pricing, restaurant/salon standing route, drop-off & locker option, quality/warranty, inventory (loaner/rotation), billing"
domain_name: "mobile-knife-tool-sharpening"
api_prefix: "/sharpening"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Selector policy"
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    Physical items move through a finite set of custody locations while two
    scarce capacity pools (van route service-minutes and shop bench minutes)
    are competed for by three intake channels (van route, locker drop-off,
    warranty rework). Money is layered on top as a per-item / subscription
    allowance pricing engine. Segregation of duties is enforced on warranty
    adjudication: the Technician who assessed an item may not decide the
    warranty claim raised against that same item.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants — every ALL_CAPS token referenced anywhere in this scaffold
# (calculations, validations, state machines, endpoint descriptions) has its
# value declared here. Nothing is named without being valued.
# ---------------------------------------------------------------------------
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  ROUNDING_MODE: "round_half_up"
  MONEY_PRECISION: "integer cents; every monetary field is an integer number of cents"

  # --- route & dispatch -----------------------------------------------------
  ARRIVAL_WINDOW_MINUTES: 60
  DRIVE_BUFFER_MINUTES_PER_STOP: 14
  RETURN_LEG_BUFFER_MINUTES: 25
  DEFAULT_RUN_SERVICE_MINUTE_BUDGET: 420
  DEFAULT_RUN_STOP_CAP: 8
  DEFAULT_DAY_WINDOW_START: "08:00"
  DEFAULT_DAY_WINDOW_END: "17:00"
  SPILL_MAX_HOPS: 2

  # --- item taxonomy & damage tier fork ------------------------------------
  DAMAGE_PRICE_MULT:
    ROUTINE_HONE: 1.00
    CHIP_REPAIR: 1.60
    RE_TIP: 2.25
    HANDLE_WORK: 3.00
  DAMAGE_MINUTES_ADD:
    ROUTINE_HONE: 0
    CHIP_REPAIR: 6
    RE_TIP: 12
    HANDLE_WORK: 20
  PART_FEE_CENTS:
    ROUTINE_HONE: 0
    CHIP_REPAIR: 0
    RE_TIP: 400
    HANDLE_WORK: 900
  RUSH_SURCHARGE_PCT: 0.20
  RUSH_MIN_SURCHARGE_CENTS: 500
  REASSESS_AUTHORIZATION_ABS_CENTS: 1000
  REASSESS_AUTHORIZATION_PCT_BP: 2500
  MAX_ITEMS_PER_REQUEST: 8

  # --- subscription / standing route ---------------------------------------
  CADENCE_INTERVAL_DAYS:
    WEEKLY: 7
    BIWEEKLY: 14
    MONTHLY: 28
  CADENCE_FEE_MULT:
    WEEKLY: 1.75
    BIWEEKLY: 1.25
    MONTHLY: 1.00
  CADENCE_ALLOWANCE_MULT:
    WEEKLY: 4
    BIWEEKLY: 2
    MONTHLY: 1
  PRORATION_BASIS_DAYS: 30
  SUBSCRIPTION_CYCLE_DAYS: 30
  SKIP_WINDOW_HOURS: 48
  ALLOWANCE_ROLLOVER_ENABLED: false

  # --- bench (shop) capacity ------------------------------------------------
  DEFAULT_BENCH_MINUTE_BUDGET: 480

  # --- locker ---------------------------------------------------------------
  LOCKER_HOLD_HOURS: 72
  LOCKER_ABANDON_GRACE_HOURS: 168
  LOCKER_TURNAROUND_BUFFER_MINUTES: 30
  LOCKER_ACCESS_CODE_LENGTH: 6
  LOCKER_SIZE_RANK:
    SMALL: 1
    MEDIUM: 2
    LARGE: 3
  LOCKER_CAPACITY_ITEMS:
    SMALL: 4
    MEDIUM: 10
    LARGE: 20
  LOCKER_VALUE_AUTHORIZATION_CENTS: 25000

  # --- loaner inventory & rotation -----------------------------------------
  LOANER_DUE_DAYS: 14
  LOANER_GRACE_HOURS: 24
  LOANER_LATE_FEE_PER_DAY_CENTS: 250
  LOANER_LATE_FEE_CAP_CENTS: 2500
  LOANER_DEFAULT_CYCLE_CEILING: 12
  LOANER_GRADE_RANK:
    STANDARD: 1
    PREMIUM: 2

  # --- quality / warranty ---------------------------------------------------
  WARRANTY_WINDOW_DAYS: 30
  WARRANTY_RESUBMIT_CAP: 2
  WARRANTY_CREDIT_INCLUDES_PARTS: false

  # --- billing --------------------------------------------------------------
  SERVICE_TAX_RATE_BP: 725
  DEFAULT_ACCOUNT_CREDIT_LIMIT_CENTS: 50000
  PAYMENT_OVERPAY_TOLERANCE_CENTS: 0

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer or business name."
      - name: account_type
        type: enum
        source: input
        description: "Segment the account belongs to; drives nothing by itself but is reported on the statement."
        constraints: "one of RESIDENTIAL, RESTAURANT, SALON, COMMERCIAL"
      - name: zone_code
        type: enum
        source: input
        description: "Service zone; a RouteStop may only be placed on a RouteRun whose zone_code equals the account's zone_code."
        constraints: "one of ZONE_N, ZONE_S, ZONE_E, ZONE_W"
      - name: billing_mode
        type: enum
        source: input
        description: "PER_VISIT bills one Invoice per completed ServiceRequest; MONTHLY_ROLLUP bills one Invoice per billing_period."
        default: "PER_VISIT"
        constraints: "one of PER_VISIT, MONTHLY_ROLLUP"
      - name: tax_exempt
        type: boolean
        source: input
        description: "When true, Invoice.tax_cents is 0 regardless of taxable subtotal."
        default: false
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Write gate threshold; new-work endpoints are blocked once outstanding_balance_cents exceeds this value."
        default: 50000
        constraints: "integer >= 0; defaults to DEFAULT_ACCOUNT_CREDIT_LIMIT_CENTS"
      - name: contact_email
        type: string
        source: input
        description: "Notification address; stored only."
      - name: status
        type: enum
        source: system
        description: "Account lifecycle; SUSPENDED blocks every account-scoped mutation."
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of amount_due_cents over this account's Invoices whose status is in {ISSUED, PARTIALLY_PAID}; see calculations.account_outstanding_balance."
        default: 0

  - name: PlanTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique tier code, e.g. BLADE_BASIC."
        constraints: "unique across PlanTier"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Base monthly fee before the cadence multiplier CADENCE_FEE_MULT is applied."
        constraints: "integer >= 0"
      - name: included_items_per_cycle
        type: integer
        source: input
        description: "Base included-item allowance per cycle before CADENCE_ALLOWANCE_MULT is applied."
        constraints: "integer >= 0"
      - name: overage_discount_pct
        type: number
        source: input
        description: "Fraction subtracted from list price for items beyond the allowance on an ACTIVE Subscription."
        constraints: "0 <= value < 1"
      - name: allowed_cadences
        type: array
        source: input
        description: "Cadences a Subscription on this tier may take; each element is one of WEEKLY, BIWEEKLY, MONTHLY."
        constraints: "non-empty array of distinct cadence enum members"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the standing-route account this subscription serves."
      - name: plan_tier_id
        type: string
        source: input
        description: "FK -> PlanTier.id; supplies monthly_fee_cents, included_items_per_cycle and overage_discount_pct."
      - name: cadence
        type: enum
        source: input
        description: "Standing-route visit cadence; must be a member of the plan tier's allowed_cadences."
        constraints: "one of WEEKLY, BIWEEKLY, MONTHLY"
      - name: anchor_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the cadence series is anchored on; re-anchored by cadence change and by resume."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle; ACTIVE and PAUSED cycle back and forth, CANCELLED is terminal."
        default: "ACTIVE"
        constraints: "one of ACTIVE, PAUSED, CANCELLED"
      - name: effective_monthly_fee_cents
        type: integer
        source: computed
        description: "round_half_up(PlanTier.monthly_fee_cents * CADENCE_FEE_MULT[cadence]); see calculations.subscription_effective_fee."
      - name: included_items_this_cycle
        type: integer
        source: computed
        description: "PlanTier.included_items_per_cycle * CADENCE_ALLOWANCE_MULT[cadence]; granted at cycle start."
      - name: allowance_remaining
        type: integer
        source: computed
        description: "Included-item allowance still unconsumed in the current cycle; equals GRANTED - CONSUMED - EXPIRED + RESTORED over AllowanceLedgerEntry rows of the current cycle_index."
      - name: cycle_index
        type: integer
        source: system
        description: "1-based counter of the subscription billing cycle; incremented by the advance-cycle operation."
        default: 1
      - name: cycle_start_date
        type: string
        source: system
        description: "ISO date the current cycle opened; set to anchor_date at creation and to the advance date on each advance-cycle."
      - name: cycle_end_date
        type: string
        source: computed
        description: "cycle_start_date + SUBSCRIPTION_CYCLE_DAYS days, exclusive upper bound of the current cycle."
      - name: next_service_date
        type: string
        source: computed
        description: "ISO date of the next standing-route visit; see calculations.next_service_date."
      - name: skip_count_this_cycle
        type: integer
        source: system
        description: "Number of customer-initiated skips accepted in the current cycle."
        default: 0
      - name: paused_at
        type: datetime
        source: system
        description: "Logical timestamp of the most recent pause; null while ACTIVE."

  - name: ItemClassSpec
    parent: null
    common_fields: true
    fields:
      - name: item_class
        type: enum
        source: input
        description: "Edge-geometry class this spec governs; unique across ItemClassSpec."
        constraints: "one of CHEF_KNIFE, SERRATED_BREAD, SALON_SHEAR, CLIPPER_BLADE, DELI_SLICER_BLADE, GARDEN_PRUNER, MANDOLINE_BLADE; unique"
      - name: bevel_angle_degrees
        type: integer
        source: input
        description: "Grind angle recorded on the work ticket; reported only."
        constraints: "integer between 10 and 60 inclusive"
      - name: base_service_minutes
        type: integer
        source: input
        description: "Bench/van minutes for a ROUTINE_HONE of this class before DAMAGE_MINUTES_ADD."
        constraints: "integer >= 1"
      - name: list_price_cents
        type: integer
        source: input
        description: "Non-subscriber list price for a ROUTINE_HONE of this class."
        constraints: "integer >= 0"
      - name: required_certification
        type: enum
        source: input
        description: "Certification the servicing Technician must hold; NONE means no certification is required."
        constraints: "one of NONE, SERRATED, CLIPPER, SHEAR, SLICER"
      - name: price_tier
        type: enum
        source: input
        description: "Reporting band for the class; reported only."
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: min_locker_size
        type: enum
        source: input
        description: "Smallest locker compartment size that can physically hold this class."
        constraints: "one of SMALL, MEDIUM, LARGE"
      - name: loaner_eligible
        type: boolean
        source: input
        description: "Whether a LoanerUnit may be issued for this class."
        default: false

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account the work is performed for."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; null for a non-subscriber request. When set, the subscription's allowance may absorb items on this request."
      - name: origin_warranty_claim_id
        type: string
        source: system
        description: "FK -> WarrantyClaim.id; set only on channel REWORK requests synthesized by a warranty approval, null otherwise."
      - name: channel
        type: enum
        source: input
        description: "Intake channel; VAN_ROUTE is picked up at a RouteStop, LOCKER is deposited by the customer, REWORK is system-created by a granted WarrantyClaim."
        constraints: "one of VAN_ROUTE, LOCKER, REWORK; REWORK may not be supplied by a client"
      - name: priority
        type: enum
        source: input
        description: "STANDARD or RUSH; RUSH adds the rush surcharge described in calculations.item_service_price."
        default: "STANDARD"
        constraints: "one of STANDARD, RUSH"
      - name: requested_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the customer wants service on; must not precede the logical clock date."
      - name: locker_site_code
        type: string
        source: input
        description: "Locker site the customer will drop at; required when channel is LOCKER, ignored otherwise."
      - name: locker_high_value_authorized
        type: boolean
        source: input
        description: "Customer pre-authorization allowing locker-stored value to exceed LOCKER_VALUE_AUTHORIZATION_CENTS."
        default: false
      - name: status
        type: enum
        source: system
        description: "Fulfillment axis; evolves independently of billing_status on the same row."
        default: "DRAFT"
        constraints: "one of DRAFT, SUBMITTED, SCHEDULED, IN_SERVICE, COMPLETED, CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: "Billing axis; evolves independently of status on the same row."
        default: "UNBILLED"
        constraints: "one of UNBILLED, INVOICED, SETTLED, CREDITED"
      - name: item_count
        type: integer
        source: computed
        description: "Count of RequestItem rows whose service_request_id equals this row's id."
        default: 0
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Sum of RequestItem.quoted_gross_cents over this request's items."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Sum of RequestItem.charged_service_cents + RequestItem.part_fee_cents over this request's items whose service_status is not RETURNED_UNSERVICED and not ABANDONED."
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Logical timestamp status became COMPLETED; the field a MONTHLY_ROLLUP invoice filters its billing_period on."

  - name: RequestItem
    parent: ServiceRequest
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request this physical item belongs to."
      - name: item_class_spec_id
        type: string
        source: input
        description: "FK -> ItemClassSpec.id; supplies bevel angle, minutes and list price."
      - name: bench_day_id
        type: string
        source: system
        description: "FK -> BenchDay.id; the shop day whose bench minutes this item consumed; null until bench intake."
      - name: rework_of_request_item_id
        type: string
        source: system
        description: "FK -> RequestItem.id; on a REWORK-channel item, the original item the warranty claim was raised against; null otherwise."
      - name: assessed_by_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; the technician who recorded assessed_damage_tier; null until assessment."
      - name: item_class
        type: enum
        source: input
        description: "Declared edge-geometry class; must equal the item_class of the referenced ItemClassSpec."
        constraints: "one of CHEF_KNIFE, SERRATED_BREAD, SALON_SHEAR, CLIPPER_BLADE, DELI_SLICER_BLADE, GARDEN_PRUNER, MANDOLINE_BLADE"
      - name: declared_damage_tier
        type: enum
        source: input
        description: "Damage tier the customer declared at request time; drives the quoted price and the provisional route minutes."
        constraints: "one of ROUTINE_HONE, CHIP_REPAIR, RE_TIP, HANDLE_WORK"
      - name: assessed_damage_tier
        type: enum
        source: system
        description: "Damage tier recorded at intake by the servicing technician; null until assessment."
        constraints: "one of ROUTINE_HONE, CHIP_REPAIR, RE_TIP, HANDLE_WORK, or null"
      - name: quoted_gross_cents
        type: integer
        source: computed
        description: "QUOTED variant of calculations.item_service_price, evaluated from declared_damage_tier at item creation."
      - name: final_gross_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.item_service_price, evaluated from assessed_damage_tier; equals quoted_gross_cents until assessment."
      - name: charged_service_cents
        type: integer
        source: computed
        description: "Taxable service amount actually charged for this item after allowance, overage discount and rush surcharge."
        default: 0
      - name: part_fee_cents
        type: integer
        source: computed
        description: "Non-taxable parts amount PART_FEE_CENTS[assessed_damage_tier] for this item."
        default: 0
      - name: service_minutes_declared
        type: integer
        source: computed
        description: "ItemClassSpec.base_service_minutes + DAMAGE_MINUTES_ADD[declared_damage_tier]."
      - name: service_minutes_assessed
        type: integer
        source: computed
        description: "ItemClassSpec.base_service_minutes + DAMAGE_MINUTES_ADD[assessed_damage_tier]; null until assessment."
      - name: requires_reauthorization
        type: boolean
        source: computed
        description: "True when the assessed gross exceeds the quoted gross by both thresholds; see calculations.item_reauthorization_required."
        default: false
      - name: authorization_status
        type: enum
        source: system
        description: "Customer authorization axis for a re-priced line."
        default: "NOT_REQUIRED"
        constraints: "one of NOT_REQUIRED, PENDING, AUTHORIZED, DECLINED"
      - name: service_status
        type: enum
        source: system
        description: "Work axis of the item; evolves independently of custody_location on the same row."
        default: "INTAKE_PENDING"
        constraints: "one of INTAKE_PENDING, ASSESSED, IN_WORK, DONE, DELIVERED, REWORK_QUEUED, RETURNED_UNSERVICED, ABANDONED"
      - name: custody_location
        type: enum
        source: system
        description: "Physical custody axis of the item; exactly one location at all times."
        default: "CUSTOMER"
        constraints: "one of CUSTOMER, VAN, BENCH, LOCKER, DELIVERED, ABANDONED"
      - name: allowance_applied
        type: boolean
        source: computed
        description: "True when a subscription included-item allowance unit was consumed for this item at invoicing."
        default: false
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical timestamp custody_location became DELIVERED; anchors the warranty window."

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician display name."
      - name: certifications
        type: array
        source: input
        description: "Certifications held; each element is one of SERRATED, CLIPPER, SHEAR, SLICER."
        constraints: "array of distinct certification enum members; may be empty"

  - name: Van
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Fleet code of the van, e.g. VAN-01."
      - name: default_service_minute_budget
        type: integer
        source: input
        description: "Service-minute budget copied onto a RouteRun when the run omits service_minute_budget."
        default: 420
        constraints: "integer >= 1; defaults to DEFAULT_RUN_SERVICE_MINUTE_BUDGET"
      - name: default_stop_cap
        type: integer
        source: input
        description: "Stop cap copied onto a RouteRun when the run omits stop_cap."
        default: 8
        constraints: "integer >= 1; defaults to DEFAULT_RUN_STOP_CAP"

  - name: RouteRun
    parent: null
    common_fields: true
    fields:
      - name: van_id
        type: string
        source: input
        description: "FK -> Van.id; the vehicle assigned to this run."
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician driving this run."
      - name: run_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the run is executed on."
      - name: zone_code
        type: enum
        source: input
        description: "Service zone the run covers; a stop's account must share this zone_code."
        constraints: "one of ZONE_N, ZONE_S, ZONE_E, ZONE_W"
      - name: service_minute_budget
        type: integer
        source: input
        description: "Total service minutes the run may commit, including drive buffers."
        default: 420
        constraints: "integer >= 1; defaults to the van's default_service_minute_budget"
      - name: stop_cap
        type: integer
        source: input
        description: "Maximum number of stops with status in {SCHEDULED, ARRIVED, SERVICED} on this run."
        default: 8
        constraints: "integer >= 1; defaults to the van's default_stop_cap"
      - name: day_window_start
        type: string
        source: input
        description: "HH:MM local start of the serviceable day; every arrival window must lie inside the day window."
        default: "08:00"
      - name: day_window_end
        type: string
        source: input
        description: "HH:MM local end of the serviceable day."
        default: "17:00"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle."
        default: "PLANNED"
        constraints: "one of PLANNED, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED"
      - name: scheduled_stop_count
        type: integer
        source: computed
        description: "Count of RouteStop rows on this run whose status is in {SCHEDULED, ARRIVED, SERVICED}."
        default: 0
      - name: booked_service_minutes
        type: integer
        source: computed
        description: "Sum of RouteStop.stop_service_minutes over this run's stops whose status is in {SCHEDULED, ARRIVED, SERVICED}."
        default: 0
      - name: committed_minutes_provisional
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.run_committed_minutes; recomputed on every stop add, remove and spill."
        default: 0
      - name: committed_minutes_final
        type: integer
        source: computed
        description: "DISPATCH_FINAL variant of calculations.run_committed_minutes; null until the run is dispatched."

  - name: RouteStop
    parent: RouteRun
    common_fields: true
    fields:
      - name: route_run_id
        type: string
        source: input
        description: "FK -> RouteRun.id; the run this stop currently sits on."
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request serviced at this stop."
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; copied from the service request at stop creation."
      - name: spilled_from_route_run_id
        type: string
        source: system
        description: "FK -> RouteRun.id; the run this stop was spilled off, null when the stop has never spilled."
      - name: sequence
        type: integer
        source: input
        description: "1-based visit order within the run; unique per run among non-terminal stops."
        constraints: "integer >= 1"
      - name: arrival_window_start
        type: string
        source: input
        description: "HH:MM local start of the promised arrival window."
      - name: arrival_window_end
        type: string
        source: computed
        description: "arrival_window_start + ARRIVAL_WINDOW_MINUTES minutes, exclusive upper bound."
      - name: stop_service_minutes
        type: integer
        source: computed
        description: "Sum of the request's item minutes under the variant currently in force; see calculations.run_committed_minutes."
        default: 0
      - name: spill_hop_count
        type: integer
        source: system
        description: "Number of times this stop has been moved to a later run; capped by SPILL_MAX_HOPS."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle; SPILLED re-enters SCHEDULED on the receiving run via reschedule."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ARRIVED, SERVICED, SKIPPED, SPILLED, CANCELLED"

  - name: LockerCompartment
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: "Locker site identifier, e.g. SITE-A."
      - name: size
        type: enum
        source: input
        description: "Graded compartment size; governs both physical fit and item capacity."
        constraints: "one of SMALL, MEDIUM, LARGE"
      - name: current_service_request_id
        type: string
        source: system
        description: "FK -> ServiceRequest.id; the request currently holding this compartment, null when AVAILABLE."
      - name: status
        type: enum
        source: system
        description: "Compartment lifecycle; AVAILABLE -> ASSIGNED -> OCCUPIED -> AVAILABLE is the normal loop."
        default: "AVAILABLE"
        constraints: "one of AVAILABLE, ASSIGNED, OCCUPIED, HOLD_EXPIRED"
      - name: access_code
        type: string
        source: system
        description: "LOCKER_ACCESS_CODE_LENGTH-digit code minted on assignment and cleared on release or abandonment."
      - name: hold_expires_at
        type: datetime
        source: system
        description: "Logical timestamp after which an OCCUPIED compartment may be transitioned to HOLD_EXPIRED."
      - name: last_released_at
        type: datetime
        source: system
        description: "Logical timestamp of the most recent release or abandonment; anchors the turnaround buffer."
      - name: stored_item_count
        type: integer
        source: computed
        description: "Count of RequestItem rows whose custody_location is LOCKER and whose service_request_id equals current_service_request_id."
        default: 0
      - name: stored_value_cents
        type: integer
        source: computed
        description: "Sum of final_gross_cents over the RequestItem rows of current_service_request_id whose custody_location is in {LOCKER, BENCH}."
        default: 0

  - name: BenchDay
    parent: null
    common_fields: true
    fields:
      - name: bench_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of the shop bench day; unique across BenchDay."
        constraints: "unique across BenchDay"
      - name: bench_minute_budget
        type: integer
        source: input
        description: "Total bench minutes available in the shop on this date."
        default: 480
        constraints: "integer >= 1; defaults to DEFAULT_BENCH_MINUTE_BUDGET"
      - name: booked_minutes
        type: integer
        source: computed
        description: "Sum of assessed-or-declared minutes over RequestItem rows whose bench_day_id equals this row's id and whose custody_location is BENCH."
        default: 0

  - name: LoanerUnit
    parent: null
    common_fields: true
    fields:
      - name: item_class_spec_id
        type: string
        source: input
        description: "FK -> ItemClassSpec.id; the class this loaner substitutes for."
      - name: grade
        type: enum
        source: input
        description: "Loaner quality grade; a shortage may substitute a higher grade at no charge."
        constraints: "one of STANDARD, PREMIUM"
      - name: cycle_ceiling
        type: integer
        source: input
        description: "Number of completed loan cycles after which the unit retires."
        default: 12
        constraints: "integer >= 1; defaults to LOANER_DEFAULT_CYCLE_CEILING"
      - name: cycle_count
        type: integer
        source: system
        description: "Completed loan cycles; incremented once per return."
        default: 0
      - name: damage_reported
        type: boolean
        source: system
        description: "Set true when a return records damage; forces retirement regardless of cycle_count."
        default: false
      - name: status
        type: enum
        source: system
        description: "Rotation lifecycle; IN_STOCK -> ISSUED -> INSPECTION -> IN_STOCK is the normal loop, RETIRED is terminal."
        default: "IN_STOCK"
        constraints: "one of IN_STOCK, ISSUED, INSPECTION, RETIRED"

  - name: LoanerIssue
    parent: null
    common_fields: true
    fields:
      - name: loaner_unit_id
        type: string
        source: system
        description: "FK -> LoanerUnit.id; the unit selected by calculations.loaner_unit_selector."
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request the loaner covers."
      - name: requested_grade
        type: enum
        source: input
        description: "Grade the customer asked for; a higher grade may be substituted when the exact grade is out of stock."
        constraints: "one of STANDARD, PREMIUM"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical timestamp the loaner was issued."
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at + LOANER_DUE_DAYS days."
      - name: returned_at
        type: datetime
        source: system
        description: "Logical timestamp of return; null while OPEN."
      - name: delay_attribution
        type: enum
        source: computed
        description: "CUSTOMER when the late return is the customer's; SERVICE when the request carried rework work at return time; null while OPEN."
        constraints: "one of CUSTOMER, SERVICE, or null"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Late fee assessed at return; see calculations.loaner_late_fee."
        default: 0
      - name: substituted
        type: boolean
        source: computed
        description: "True when the issued unit's grade differs from requested_grade."
        default: false
      - name: status
        type: enum
        source: system
        description: "Issue lifecycle."
        default: "OPEN"
        constraints: "one of OPEN, RETURNED"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: request_item_id
        type: string
        source: input
        description: "FK -> RequestItem.id; the delivered item the workmanship claim is raised against."
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; copied from the claimed item's service request."
      - name: rework_service_request_id
        type: string
        source: system
        description: "FK -> ServiceRequest.id; the REWORK request synthesized on approval, null otherwise."
      - name: decided_by_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; the technician who approved or denied the claim, null while SUBMITTED."
      - name: reason
        type: string
        source: input
        description: "Free-text workmanship complaint."
      - name: abuse_finding
        type: boolean
        source: system
        description: "Inspection finding recorded on denial; abuse is the exclusion that justifies a denial."
        default: false
      - name: resubmit_count
        type: integer
        source: system
        description: "Number of times a denied claim has been resubmitted; capped by WARRANTY_RESUBMIT_CAP."
        default: 0
      - name: credit_basis_cents
        type: integer
        source: computed
        description: "Service amount originally charged for the claimed item; see calculations.warranty_credit."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; DENIED loops back to SUBMITTED on resubmission."
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, APPROVED, DENIED"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the billed account."
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; set for PER_VISIT invoices, null for MONTHLY_ROLLUP invoices."
      - name: billing_mode
        type: enum
        source: computed
        description: "Copied from Account.billing_mode at invoice creation and frozen thereafter."
        constraints: "one of PER_VISIT, MONTHLY_ROLLUP"
      - name: billing_period
        type: string
        source: input
        description: "YYYY-MM period for a MONTHLY_ROLLUP invoice; null for PER_VISIT."
      - name: taxable_subtotal_cents
        type: integer
        source: computed
        description: "See calculations.invoice_totals; floored at 0."
        default: 0
      - name: nontaxable_subtotal_cents
        type: integer
        source: computed
        description: "Sum of non-taxable line amounts."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Single rounding over the aggregate taxable subtotal; 0 when the account is tax_exempt."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "taxable_subtotal_cents + nontaxable_subtotal_cents + tax_cents."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents against this invoice."
        default: 0
      - name: amount_due_cents
        type: integer
        source: computed
        description: "total_cents - amount_paid_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Billing lifecycle; PARTIALLY_PAID self-loops on each partial payment."
        default: "DRAFT"
        constraints: "one of DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID"

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice this line belongs to."
      - name: request_item_id
        type: string
        source: system
        description: "FK -> RequestItem.id; set on SERVICE and PART lines, null otherwise."
      - name: source_warranty_claim_id
        type: string
        source: system
        description: "FK -> WarrantyClaim.id; set on WARRANTY_CREDIT lines, null otherwise."
      - name: source
        type: enum
        source: system
        description: "Line kind."
        constraints: "one of SERVICE, PART, SUBSCRIPTION_FEE, LATE_FEE, WARRANTY_CREDIT, PRORATION_CREDIT"
      - name: description
        type: string
        source: system
        description: "Human-readable label of the line."
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount in cents; WARRANTY_CREDIT and PRORATION_CREDIT lines are negative or zero."
      - name: taxable
        type: boolean
        source: computed
        description: "True for SERVICE, SUBSCRIPTION_FEE, WARRANTY_CREDIT and PRORATION_CREDIT lines; false for PART and LATE_FEE lines."
      - name: sequence_index
        type: integer
        source: system
        description: "1-based append order within the invoice; the order warranty credits are capped against the running taxable subtotal."

  - name: Payment
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice being settled."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount applied; must be strictly positive and must not exceed the invoice's amount_due_cents."
        constraints: "integer >= 1"
      - name: method
        type: enum
        source: input
        description: "Settlement instrument."
        constraints: "one of CARD, ACH, CHECK, CASH"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical timestamp the payment was applied."
      - name: resulting_invoice_status
        type: enum
        source: computed
        description: "Invoice.status after this payment was applied."
        constraints: "one of PARTIALLY_PAID, PAID"

  - name: AllowanceLedgerEntry
    parent: Subscription
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: system
        description: "FK -> Subscription.id; the subscription whose allowance moved."
      - name: request_item_id
        type: string
        source: system
        description: "FK -> RequestItem.id; set on CONSUMED and RESTORED entries, null on GRANTED and EXPIRED entries."
      - name: cycle_index
        type: integer
        source: system
        description: "Subscription cycle this entry belongs to."
      - name: kind
        type: enum
        source: system
        description: "Direction of the allowance movement."
        constraints: "one of GRANTED, CONSUMED, EXPIRED, RESTORED"
      - name: quantity
        type: integer
        source: system
        description: "Always a positive count of included-item units; the kind carries the sign."
        constraints: "integer >= 1"
      - name: reason
        type: string
        source: system
        description: "Short label naming the operation that produced this entry."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Account
    axis: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sharpening/accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Account.status == ACTIVE"
        side_effects:
          - "increments Account.version by 1"
        note: "While SUSPENDED every account-scoped mutating endpoint is refused at ladder rung 9."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sharpening/accounts/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Account.status == SUSPENDED"
        side_effects:
          - "increments Account.version by 1"

  - entity: Subscription
    axis: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: "(none)"
        to: ACTIVE
        trigger: "POST /sharpening/subscriptions"
        actor: AccountOwner
        preconditions:
          - "Account.status == ACTIVE"
          - "no other Subscription for this account has status ACTIVE or PAUSED"
          - "cadence is a member of PlanTier.allowed_cadences"
        side_effects:
          - "sets Subscription.effective_monthly_fee_cents per calculations.subscription_effective_fee"
          - "sets Subscription.included_items_this_cycle per calculations.subscription_effective_fee"
          - "sets Subscription.cycle_index = 1 and cycle_start_date = anchor_date"
          - "appends AllowanceLedgerEntry kind=GRANTED quantity=included_items_this_cycle reason=CYCLE_OPEN (skipped when included_items_this_cycle == 0)"
          - "sets Subscription.allowance_remaining = included_items_this_cycle"
          - "sets Subscription.next_service_date per calculations.next_service_date variant ANCHORED"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /sharpening/subscriptions/{id}/pause"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "sets Subscription.paused_at to the logical clock"
          - "appends AllowanceLedgerEntry kind=EXPIRED quantity=allowance_remaining reason=PAUSE (skipped when allowance_remaining == 0)"
          - "sets Subscription.allowance_remaining = 0"
          - "sets Subscription.next_service_date = null"
          - "appends an InvoiceLine source=PRORATION_CREDIT to the account's DRAFT Invoice (creating that DRAFT Invoice when none exists) with amount per calculations.subscription_proration variant PAUSE_PRORATION"
          - "recomputes the DRAFT Invoice totals per calculations.invoice_totals"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /sharpening/subscriptions/{id}/resume"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == PAUSED"
          - "Account.status == ACTIVE"
        side_effects:
          - "sets Subscription.anchor_date to the logical clock date (re-anchor)"
          - "increments Subscription.cycle_index by 1 and sets cycle_start_date to the logical clock date"
          - "appends AllowanceLedgerEntry kind=GRANTED quantity=included_items_this_cycle reason=RESUME (skipped when included_items_this_cycle == 0)"
          - "sets Subscription.allowance_remaining = included_items_this_cycle"
          - "sets Subscription.skip_count_this_cycle = 0"
          - "sets Subscription.next_service_date per calculations.next_service_date variant RE_ANCHORED"
          - "sets Subscription.paused_at = null"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /sharpening/subscriptions/{id}/cadence"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == ACTIVE"
          - "expected_subscription_version equals Subscription.version"
          - "new cadence differs from the current cadence and is a member of PlanTier.allowed_cadences"
          - "logical clock is at least SKIP_WINDOW_HOURS before 00:00 of next_service_date"
        side_effects:
          - "sets Subscription.cadence to the new value"
          - "recomputes Subscription.effective_monthly_fee_cents and included_items_this_cycle"
          - "appends AllowanceLedgerEntry kind=GRANTED (when the new allowance is larger) or kind=EXPIRED (when smaller) for the absolute difference, reason=CADENCE_CHANGE"
          - "sets Subscription.allowance_remaining = max(0, allowance_remaining + new_included - old_included)"
          - "sets Subscription.anchor_date to the logical clock date (re-anchor)"
          - "sets Subscription.next_service_date per calculations.next_service_date variant RE_ANCHORED"
          - "appends an InvoiceLine source=PRORATION_CREDIT to the account's DRAFT Invoice (creating it when none exists) with amount per calculations.subscription_proration variant CADENCE_CHANGE_PRORATION"
          - "recomputes the DRAFT Invoice totals per calculations.invoice_totals"
          - "increments Subscription.version by 1"
        note: "Self-loop on ACTIVE; the observable change is cadence, allowance and anchor, not the state name."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /sharpening/subscriptions/{id}/skip"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscription.next_service_date is not null"
          - "logical clock is at least SKIP_WINDOW_HOURS before 00:00 of next_service_date"
        side_effects:
          - "advances Subscription.next_service_date by CADENCE_INTERVAL_DAYS[cadence] days"
          - "increments Subscription.skip_count_this_cycle by 1"
          - "sets every SCHEDULED RouteStop of this account whose run_date equals the skipped service date to SKIPPED and returns its ServiceRequest to SUBMITTED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /sharpening/subscriptions/{id}/advance-cycle"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == ACTIVE"
          - "logical clock date >= Subscription.cycle_end_date"
        side_effects:
          - "appends AllowanceLedgerEntry kind=EXPIRED quantity=allowance_remaining reason=CYCLE_END (skipped when allowance_remaining == 0) because ALLOWANCE_ROLLOVER_ENABLED is false"
          - "increments Subscription.cycle_index by 1 and sets cycle_start_date = previous cycle_end_date"
          - "recomputes Subscription.next_service_date per calculations.next_service_date variant ANCHORED"
          - "appends AllowanceLedgerEntry kind=GRANTED quantity=included_items_this_cycle reason=CYCLE_OPEN (skipped when included_items_this_cycle == 0)"
          - "sets Subscription.allowance_remaining = included_items_this_cycle"
          - "sets Subscription.skip_count_this_cycle = 0"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sharpening/subscriptions/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "appends AllowanceLedgerEntry kind=EXPIRED quantity=allowance_remaining reason=CANCEL (skipped when allowance_remaining == 0)"
          - "sets Subscription.allowance_remaining = 0 and next_service_date = null"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /sharpening/subscriptions/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "Subscription.status == PAUSED"
        side_effects:
          - "sets Subscription.next_service_date = null"
        note: "Allowance was already expired at pause, so no further EXPIRED entry is written."

  - entity: ServiceRequest
    axis: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sharpening/service-requests/{id}/submit"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.status == DRAFT"
          - "ServiceRequest.item_count >= 1"
          - "Account.status == ACTIVE"
          - "Account.outstanding_balance_cents <= Account.credit_limit_cents"
        side_effects:
          - "freezes ServiceRequest.quoted_total_cents from the current items"
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /sharpening/route-runs/{id}/stops"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == SUBMITTED"
          - "ServiceRequest.channel in {VAN_ROUTE, REWORK}"
        side_effects:
          - "creates the RouteStop and recomputes the run's booked_service_minutes and committed_minutes_provisional"
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "DELETE /sharpening/route-stops/{id}, POST /sharpening/route-stops/{id}/spill, POST /sharpening/route-runs/{id}/cancel, or POST /sharpening/subscriptions/{id}/skip"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == SCHEDULED"
        side_effects:
          - "releases the stop's minutes from the run's booked_service_minutes and committed_minutes_provisional"
      - from: SCHEDULED
        to: IN_SERVICE
        trigger: "POST /sharpening/service-requests/{id}/pickup"
        actor: Technician
        preconditions:
          - "ServiceRequest.status == SCHEDULED"
          - "ServiceRequest.channel in {VAN_ROUTE, REWORK}"
          - "the request's RouteStop.status == ARRIVED"
        side_effects:
          - "moves every RequestItem custody_location CUSTOMER -> VAN"
          - "sets the RouteStop.status ARRIVED -> SERVICED"
      - from: SUBMITTED
        to: IN_SERVICE
        trigger: "POST /sharpening/locker-compartments/{id}/deposit"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.status == SUBMITTED"
          - "ServiceRequest.channel == LOCKER"
          - "LockerCompartment.status == ASSIGNED and current_service_request_id == this request"
        side_effects:
          - "moves every RequestItem custody_location CUSTOMER -> LOCKER"
          - "sets the LockerCompartment.status ASSIGNED -> OCCUPIED"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /sharpening/service-requests/{id}/deliver"
        actor: Technician
        preconditions:
          - "ServiceRequest.status == IN_SERVICE"
          - "every RequestItem of the request has service_status in {DONE, RETURNED_UNSERVICED}"
        side_effects:
          - "cascade link 1: each RequestItem with service_status DONE moves to DELIVERED"
          - "cascade link 2 (channel VAN_ROUTE or REWORK): each such item's custody_location BENCH -> DELIVERED and delivered_at is stamped, which closes the request's OPEN LoanerIssue (OPEN -> RETURNED)"
          - "cascade link 3: closing the LoanerIssue moves its LoanerUnit ISSUED -> INSPECTION and computes late_fee_cents per calculations.loaner_late_fee"
          - "cascade link 4: the INSPECTION unit increments cycle_count by 1 and resolves to RETIRED when cycle_count >= cycle_ceiling or damage_reported is true, otherwise to IN_STOCK"
          - "channel LOCKER instead moves each item's custody_location BENCH -> LOCKER, sets the compartment ASSIGNED -> OCCUPIED and resets hold_expires_at to the logical clock + LOCKER_HOLD_HOURS hours"
          - "releases the items' bench minutes from BenchDay.booked_minutes"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sharpening/service-requests/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.status == DRAFT"
        side_effects:
          - "no capacity is released because none was booked"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /sharpening/service-requests/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.status == SUBMITTED"
        side_effects:
          - "any LockerCompartment whose current_service_request_id is this request returns ASSIGNED -> AVAILABLE, clearing access_code and setting last_released_at"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sharpening/service-requests/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.status == SCHEDULED"
        side_effects:
          - "sets the request's SCHEDULED RouteStop to SKIPPED and recomputes the run's booked_service_minutes, scheduled_stop_count and committed_minutes_provisional"

  - entity: ServiceRequest
    axis: billing_status
    initial_state: UNBILLED
    terminal_states: [CREDITED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /sharpening/invoices"
        actor: BillingClerk
        preconditions:
          - "ServiceRequest.status == COMPLETED"
          - "ServiceRequest.billing_status == UNBILLED"
        side_effects:
          - "emits exactly one SERVICE InvoiceLine per covered RequestItem whose service_status is not RETURNED_UNSERVICED and not ABANDONED (amount_cents equals charged_service_cents and is 0 when the allowance absorbed the item) and one PART InvoiceLine per such item whose part_fee_cents > 0"
          - "consumes subscription allowance per calculations.allowance_consumption_plan and appends AllowanceLedgerEntry kind=CONSUMED rows"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /sharpening/invoices/{id}/payments (payment that brings amount_due_cents to 0)"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.billing_status == INVOICED"
          - "the covering Invoice reaches status PAID"
        side_effects:
          - "decrements Account.outstanding_balance_cents by the settled amount"
      - from: INVOICED
        to: CREDITED
        trigger: "POST /sharpening/warranty-claims/{id}/approve"
        actor: Technician
        preconditions:
          - "ServiceRequest.billing_status == INVOICED"
          - "a WarrantyClaim on one of this request's items reaches APPROVED"
        side_effects:
          - "a WARRANTY_CREDIT InvoiceLine has been appended to the account's DRAFT Invoice"
      - from: SETTLED
        to: CREDITED
        trigger: "POST /sharpening/warranty-claims/{id}/approve"
        actor: Technician
        preconditions:
          - "ServiceRequest.billing_status == SETTLED"
          - "a WarrantyClaim on one of this request's items reaches APPROVED"
        side_effects:
          - "a WARRANTY_CREDIT InvoiceLine has been appended to the account's DRAFT Invoice"
        note: "The fulfillment axis is untouched by every transition on this axis and vice versa; the two axes are read independently off the same row."

  - entity: RequestItem
    axis: service_status
    initial_state: INTAKE_PENDING
    terminal_states: [RETURNED_UNSERVICED, ABANDONED]
    transitions:
      - from: INTAKE_PENDING
        to: ASSESSED
        trigger: "POST /sharpening/request-items/{id}/assess"
        actor: Technician
        preconditions:
          - "RequestItem.custody_location == BENCH"
          - "the parent ServiceRequest.status == IN_SERVICE"
          - "the acting Technician's certifications contain ItemClassSpec.required_certification, or required_certification == NONE"
          - "when the parent request channel is LOCKER, the compartment's stored_value_cents after re-pricing must not exceed LOCKER_VALUE_AUTHORIZATION_CENTS unless ServiceRequest.locker_high_value_authorized is true"
        side_effects:
          - "sets assessed_damage_tier, assessed_by_technician_id and service_minutes_assessed"
          - "recomputes final_gross_cents per calculations.item_service_price variant FINAL and part_fee_cents"
          - "recomputes requires_reauthorization per calculations.item_reauthorization_required and sets authorization_status to PENDING when it is true"
          - "adjusts BenchDay.booked_minutes by (service_minutes_assessed - service_minutes_declared)"
      - from: ASSESSED
        to: IN_WORK
        trigger: "POST /sharpening/request-items/{id}/start-work"
        actor: Technician
        preconditions:
          - "RequestItem.service_status == ASSESSED"
          - "RequestItem.custody_location == BENCH"
          - "RequestItem.authorization_status in {NOT_REQUIRED, AUTHORIZED}"
          - "the acting Technician's certifications contain ItemClassSpec.required_certification, or required_certification == NONE"
        side_effects:
          - "increments RequestItem.version by 1"
      - from: INTAKE_PENDING
        to: ASSESSED
        trigger: "system, cascade link 3 of POST /sharpening/warranty-claims/{id}/approve"
        actor: system
        preconditions:
          - "the item is the rework clone created by a warranty approval"
        side_effects:
          - "sets declared_damage_tier to the original item's assessed_damage_tier and assessed_damage_tier to ROUTINE_HONE"
          - "sets assessed_by_technician_id to the approving technician and service_minutes_assessed to the ROUTINE_HONE minutes"
          - "leaves authorization_status at NOT_REQUIRED because a rework line is never re-priced"
        note: "This is why a REWORK stop can carry assessed minutes before its run is dispatched, which is what makes the DISPATCH_FINAL branch of calculations.run_committed_minutes reachable."
      - from: IN_WORK
        to: DONE
        trigger: "POST /sharpening/request-items/{id}/complete-work"
        actor: Technician
        preconditions:
          - "RequestItem.service_status == IN_WORK"
        side_effects:
          - "increments RequestItem.version by 1"
      - from: DONE
        to: DELIVERED
        trigger: "POST /sharpening/service-requests/{id}/deliver"
        actor: Technician
        preconditions:
          - "RequestItem.service_status == DONE"
        side_effects:
          - "see the ServiceRequest IN_SERVICE -> COMPLETED cascade"
      - from: ASSESSED
        to: RETURNED_UNSERVICED
        trigger: "POST /sharpening/request-items/{id}/decline"
        actor: AccountOwner
        preconditions:
          - "RequestItem.authorization_status == PENDING"
        side_effects:
          - "sets authorization_status = DECLINED"
          - "sets charged_service_cents = 0 and part_fee_cents = 0"
          - "releases the item's minutes from BenchDay.booked_minutes"
          - "when the item had already consumed subscription allowance, appends AllowanceLedgerEntry kind=RESTORED quantity=1 reason=DECLINE and increments Subscription.allowance_remaining by 1"
      - from: DELIVERED
        to: REWORK_QUEUED
        trigger: "POST /sharpening/warranty-claims/{id}/approve"
        actor: Technician
        preconditions:
          - "RequestItem.service_status == DELIVERED"
          - "the WarrantyClaim referencing this item reaches APPROVED"
        side_effects:
          - "cascade link 2 of the warranty cascade; custody_location DELIVERED -> CUSTOMER on the same row"
      - from: REWORK_QUEUED
        to: DELIVERED
        trigger: "POST /sharpening/service-requests/{id}/deliver on the REWORK request"
        actor: Technician
        preconditions:
          - "RequestItem.service_status == REWORK_QUEUED"
          - "the REWORK ServiceRequest whose origin_warranty_claim_id names the claim reaches COMPLETED"
        side_effects:
          - "custody_location CUSTOMER -> DELIVERED and delivered_at is re-stamped, restarting the warranty window"
      - from: INTAKE_PENDING
        to: ABANDONED
        trigger: "POST /sharpening/locker-compartments/{id}/abandon"
        actor: PlatformAdmin
        preconditions:
          - "RequestItem.custody_location == LOCKER"
          - "LockerCompartment.status == HOLD_EXPIRED"
        side_effects:
          - "custody_location LOCKER -> ABANDONED"
      - from: ASSESSED
        to: ABANDONED
        trigger: "POST /sharpening/locker-compartments/{id}/abandon"
        actor: PlatformAdmin
        preconditions:
          - "RequestItem.custody_location == LOCKER"
          - "LockerCompartment.status == HOLD_EXPIRED"
        side_effects:
          - "custody_location LOCKER -> ABANDONED"

  - entity: RequestItem
    axis: custody_location
    initial_state: CUSTOMER
    terminal_states: [ABANDONED]
    transitions:
      - from: CUSTOMER
        to: VAN
        trigger: "POST /sharpening/service-requests/{id}/pickup"
        actor: Technician
        preconditions:
          - "parent ServiceRequest.channel in {VAN_ROUTE, REWORK}"
          - "the request's RouteStop.status == ARRIVED"
        side_effects:
          - "no capacity movement; van custody is not metered"
      - from: CUSTOMER
        to: LOCKER
        trigger: "POST /sharpening/locker-compartments/{id}/deposit"
        actor: AccountOwner
        preconditions:
          - "parent ServiceRequest.channel == LOCKER"
          - "the supplied access_code equals LockerCompartment.access_code"
        side_effects:
          - "recomputes LockerCompartment.stored_item_count and stored_value_cents"
      - from: VAN
        to: BENCH
        trigger: "POST /sharpening/service-requests/{id}/bench-intake"
        actor: Technician
        preconditions:
          - "every item of the request has custody_location == VAN"
          - "BenchDay.bench_date equals the logical clock date"
          - "BenchDay.booked_minutes + sum of the request's declared minutes <= BenchDay.bench_minute_budget"
        side_effects:
          - "sets RequestItem.bench_day_id and adds the item's service_minutes_declared to BenchDay.booked_minutes"
      - from: LOCKER
        to: BENCH
        trigger: "POST /sharpening/service-requests/{id}/bench-intake"
        actor: Technician
        preconditions:
          - "every item of the request has custody_location == LOCKER"
          - "BenchDay.bench_date equals the logical clock date"
          - "BenchDay.booked_minutes + sum of the request's declared minutes <= BenchDay.bench_minute_budget"
        side_effects:
          - "sets RequestItem.bench_day_id and adds the item's service_minutes_declared to BenchDay.booked_minutes"
          - "sets the LockerCompartment.status OCCUPIED -> ASSIGNED (emptied but still reserved for the return leg)"
        note: "Locker intake bypasses the van route entirely yet still consumes the same bench-minute pool."
      - from: BENCH
        to: DELIVERED
        trigger: "POST /sharpening/service-requests/{id}/deliver"
        actor: Technician
        preconditions:
          - "parent ServiceRequest.channel in {VAN_ROUTE, REWORK}"
        side_effects:
          - "stamps delivered_at and releases the item's minutes from BenchDay.booked_minutes"
      - from: BENCH
        to: LOCKER
        trigger: "POST /sharpening/service-requests/{id}/deliver"
        actor: Technician
        preconditions:
          - "parent ServiceRequest.channel == LOCKER"
        side_effects:
          - "sets the LockerCompartment.status ASSIGNED -> OCCUPIED and hold_expires_at = logical clock + LOCKER_HOLD_HOURS hours"
          - "releases the item's minutes from BenchDay.booked_minutes"
      - from: LOCKER
        to: DELIVERED
        trigger: "POST /sharpening/locker-compartments/{id}/release"
        actor: AccountOwner
        preconditions:
          - "LockerCompartment.status == OCCUPIED"
          - "RequestItem.service_status == DELIVERED"
        side_effects:
          - "stamps delivered_at, closes the request's OPEN LoanerIssue and runs the loaner inspection chain"
      - from: LOCKER
        to: ABANDONED
        trigger: "POST /sharpening/locker-compartments/{id}/abandon"
        actor: PlatformAdmin
        preconditions:
          - "LockerCompartment.status == HOLD_EXPIRED"
          - "logical clock >= hold_expires_at + LOCKER_ABANDON_GRACE_HOURS hours"
        side_effects:
          - "sets the item's service_status to ABANDONED"
      - from: DELIVERED
        to: CUSTOMER
        trigger: "POST /sharpening/warranty-claims/{id}/approve"
        actor: Technician
        preconditions:
          - "RequestItem.service_status moves DELIVERED -> REWORK_QUEUED in the same request"
        side_effects:
          - "the item leaves the delivered pool and re-enters the custody cycle for the rework visit"
        note: "This edge is what makes the custody axis cyclic: CUSTOMER -> VAN -> BENCH -> DELIVERED -> CUSTOMER."

  - entity: RouteRun
    axis: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /sharpening/route-runs/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "RouteRun.status == PLANNED"
          - "RouteRun.scheduled_stop_count >= 1"
          - "RouteRun.run_date >= the logical clock date"
        side_effects:
          - "computes committed_minutes_final per calculations.run_committed_minutes variant DISPATCH_FINAL"
          - "while committed_minutes_final > service_minute_budget, moves the SCHEDULED stop with the greatest sequence to SPILLED, returns its ServiceRequest SCHEDULED -> SUBMITTED and recomputes committed_minutes_final"
          - "each such spill increments that stop's spill_hop_count and fails the whole dispatch with ERR_SPILL_LIMIT_REACHED when the resulting spill_hop_count would exceed SPILL_MAX_HOPS"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /sharpening/route-stops/{id}/arrive (first stop of the run)"
        actor: Technician
        preconditions:
          - "RouteRun.status == DISPATCHED"
        side_effects:
          - "increments RouteRun.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sharpening/route-runs/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "RouteRun.status == IN_PROGRESS"
          - "no RouteStop on this run has status SCHEDULED or ARRIVED"
        side_effects:
          - "freezes committed_minutes_final"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sharpening/route-runs/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "RouteRun.status == PLANNED"
        side_effects:
          - "sets every SCHEDULED RouteStop on the run to CANCELLED"
          - "returns each affected ServiceRequest SCHEDULED -> SUBMITTED"
          - "zeroes booked_service_minutes, scheduled_stop_count and committed_minutes_provisional"

  - entity: RouteStop
    axis: status
    initial_state: SCHEDULED
    terminal_states: [SERVICED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /sharpening/route-stops/{id}/arrive"
        actor: Technician
        preconditions:
          - "RouteStop.status == SCHEDULED"
          - "the parent RouteRun.status in {DISPATCHED, IN_PROGRESS}"
        side_effects:
          - "moves the parent RouteRun DISPATCHED -> IN_PROGRESS when it was still DISPATCHED"
      - from: ARRIVED
        to: SERVICED
        trigger: "POST /sharpening/service-requests/{id}/pickup"
        actor: Technician
        preconditions:
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "moves the ServiceRequest SCHEDULED -> IN_SERVICE"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /sharpening/service-requests/{id}/cancel or POST /sharpening/subscriptions/{id}/skip"
        actor: AccountOwner
        preconditions:
          - "RouteStop.status == SCHEDULED"
        side_effects:
          - "releases stop_service_minutes from the run's booked_service_minutes and decrements scheduled_stop_count"
      - from: SCHEDULED
        to: SPILLED
        trigger: "POST /sharpening/route-stops/{id}/spill or the dispatch overflow loop"
        actor: Dispatcher
        preconditions:
          - "RouteStop.status == SCHEDULED"
          - "the parent RouteRun.status in {PLANNED, DISPATCHED}"
          - "RouteStop.spill_hop_count + 1 <= SPILL_MAX_HOPS"
        side_effects:
          - "increments spill_hop_count by 1 and sets spilled_from_route_run_id to the current route_run_id"
          - "releases stop_service_minutes from the run's booked_service_minutes and decrements scheduled_stop_count"
          - "returns the ServiceRequest SCHEDULED -> SUBMITTED"
      - from: SPILLED
        to: SCHEDULED
        trigger: "POST /sharpening/route-stops/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "RouteStop.status == SPILLED"
          - "a receiving run exists per calculations.next_eligible_run_selector"
        side_effects:
          - "re-points route_run_id at the selected receiving run and re-books stop_service_minutes there"
          - "returns the ServiceRequest SUBMITTED -> SCHEDULED"
        note: "SCHEDULED -> SPILLED -> SCHEDULED is a genuine re-entry loop on one row, bounded by SPILL_MAX_HOPS."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sharpening/route-runs/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "RouteStop.status == SCHEDULED"
          - "the parent RouteRun moves PLANNED -> CANCELLED"
        side_effects:
          - "returns the ServiceRequest SCHEDULED -> SUBMITTED"

  - entity: LockerCompartment
    axis: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /sharpening/service-requests/{id}/locker-assign"
        actor: AccountOwner
        preconditions:
          - "ServiceRequest.channel == LOCKER and ServiceRequest.status == SUBMITTED"
          - "the compartment is chosen by calculations.compartment_assignment_selector"
          - "logical clock >= last_released_at + LOCKER_TURNAROUND_BUFFER_MINUTES minutes when last_released_at is not null"
        side_effects:
          - "mints a LOCKER_ACCESS_CODE_LENGTH-digit access_code"
          - "sets current_service_request_id and hold_expires_at = logical clock + LOCKER_HOLD_HOURS hours"
      - from: ASSIGNED
        to: OCCUPIED
        trigger: "POST /sharpening/locker-compartments/{id}/deposit or POST /sharpening/service-requests/{id}/deliver on a LOCKER request"
        actor: AccountOwner
        preconditions:
          - "LockerCompartment.status == ASSIGNED"
          - "on deposit, the supplied access_code equals LockerCompartment.access_code"
        side_effects:
          - "recomputes stored_item_count and stored_value_cents"
          - "on the deliver leg, resets hold_expires_at = logical clock + LOCKER_HOLD_HOURS hours"
      - from: OCCUPIED
        to: ASSIGNED
        trigger: "POST /sharpening/service-requests/{id}/bench-intake"
        actor: Technician
        preconditions:
          - "LockerCompartment.status == OCCUPIED"
          - "every item of current_service_request_id leaves custody LOCKER"
        side_effects:
          - "sets stored_item_count = 0 while keeping the reservation for the return leg"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /sharpening/locker-compartments/{id}/release"
        actor: AccountOwner
        preconditions:
          - "LockerCompartment.status == OCCUPIED"
          - "logical clock < hold_expires_at"
          - "every item of current_service_request_id has service_status == DELIVERED"
        side_effects:
          - "clears access_code and current_service_request_id, sets last_released_at to the logical clock"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /sharpening/service-requests/{id}/cancel"
        actor: AccountOwner
        preconditions:
          - "LockerCompartment.status == ASSIGNED"
          - "the cancelled ServiceRequest is current_service_request_id"
        side_effects:
          - "clears access_code and current_service_request_id, sets last_released_at to the logical clock"
      - from: OCCUPIED
        to: HOLD_EXPIRED
        trigger: "POST /sharpening/locker-compartments/{id}/expire-hold"
        actor: PlatformAdmin
        preconditions:
          - "LockerCompartment.status == OCCUPIED"
          - "logical clock >= hold_expires_at"
        side_effects:
          - "clears access_code so the customer can no longer self-serve"
      - from: HOLD_EXPIRED
        to: AVAILABLE
        trigger: "POST /sharpening/locker-compartments/{id}/abandon"
        actor: PlatformAdmin
        preconditions:
          - "LockerCompartment.status == HOLD_EXPIRED"
          - "logical clock >= hold_expires_at + LOCKER_ABANDON_GRACE_HOURS hours"
        side_effects:
          - "moves every item of current_service_request_id to custody ABANDONED and service_status ABANDONED"
          - "clears current_service_request_id and sets last_released_at to the logical clock"

  - entity: LoanerUnit
    axis: status
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "POST /sharpening/loaner-issues"
        actor: Technician
        preconditions:
          - "LoanerUnit.status == IN_STOCK"
          - "the unit is chosen by calculations.loaner_unit_selector"
          - "the unit's ItemClassSpec.loaner_eligible is true"
        side_effects:
          - "creates the LoanerIssue with issued_at at the logical clock and due_at = issued_at + LOANER_DUE_DAYS days"
      - from: ISSUED
        to: INSPECTION
        trigger: "POST /sharpening/loaner-issues/{id}/return, or the delivery cascade"
        actor: Technician
        preconditions:
          - "LoanerUnit.status == ISSUED"
        side_effects:
          - "records damage_reported from the return payload"
          - "computes LoanerIssue.late_fee_cents per calculations.loaner_late_fee"
      - from: INSPECTION
        to: IN_STOCK
        trigger: "system, immediately after the ISSUED -> INSPECTION transition"
        actor: system
        preconditions:
          - "cycle_count + 1 < cycle_ceiling"
          - "damage_reported == false"
        side_effects:
          - "increments cycle_count by 1"
      - from: INSPECTION
        to: RETIRED
        trigger: "system, immediately after the ISSUED -> INSPECTION transition"
        actor: system
        preconditions:
          - "cycle_count + 1 >= cycle_ceiling, or damage_reported == true"
        side_effects:
          - "increments cycle_count by 1"
          - "removes the unit from the loanable pool, which can push a later issue onto the substitute-grade branch or to ERR_LOANER_STOCK_EXHAUSTED"

  - entity: LoanerIssue
    axis: status
    initial_state: OPEN
    terminal_states: [RETURNED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /sharpening/loaner-issues/{id}/return, or the delivery cascade"
        actor: Technician
        preconditions:
          - "LoanerIssue.status == OPEN"
        side_effects:
          - "sets returned_at to the logical clock and delay_attribution per calculations.loaner_late_fee"
          - "appends a LATE_FEE InvoiceLine to the account's DRAFT Invoice when late_fee_cents > 0, creating that DRAFT Invoice when none exists"
          - "moves the LoanerUnit ISSUED -> INSPECTION"

  - entity: WarrantyClaim
    axis: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sharpening/warranty-claims/{id}/approve"
        actor: Technician
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "the acting Technician id differs from RequestItem.assessed_by_technician_id (segregation of duties)"
          - "the claimed RequestItem.service_status == DELIVERED"
        side_effects:
          - "cascade link 1: sets decided_by_technician_id and credit_basis_cents per calculations.warranty_credit"
          - "cascade link 2: moves the claimed RequestItem service_status DELIVERED -> REWORK_QUEUED and custody_location DELIVERED -> CUSTOMER"
          - "cascade link 3: because the item is now REWORK_QUEUED it must have an open rework order, so a ServiceRequest with channel=REWORK, status=SUBMITTED, priority=STANDARD, subscription_id=null and origin_warranty_claim_id set is created, together with one RequestItem whose rework_of_request_item_id points at the claimed item, whose declared_damage_tier is the claimed item's assessed_damage_tier, whose assessed_damage_tier is ROUTINE_HONE and whose service_status is therefore ASSESSED; rework_service_request_id is stored on the claim"
          - "cascade link 4: opening that rework order emits the workmanship credit, appending an InvoiceLine source=WARRANTY_CREDIT with amount per calculations.warranty_credit to the account's DRAFT Invoice, creating that DRAFT Invoice when none exists"
          - "cascade link 5: appending the line recomputes that Invoice's taxable_subtotal_cents, tax_cents, total_cents and amount_due_cents per calculations.invoice_totals"
          - "cascade link 6: the recomputed credit marks the claimed item's original ServiceRequest billing_status INVOICED -> CREDITED (or SETTLED -> CREDITED)"
        note: "Depth-6 chain; every link is caused by the link before it, not by the approve call directly."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /sharpening/warranty-claims/{id}/deny"
        actor: Technician
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "the acting Technician id differs from RequestItem.assessed_by_technician_id (segregation of duties)"
        side_effects:
          - "sets decided_by_technician_id and abuse_finding from the deny payload"
          - "no rework order and no credit are created"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /sharpening/warranty-claims/{id}/resubmit"
        actor: AccountOwner
        preconditions:
          - "WarrantyClaim.status == DENIED"
          - "WarrantyClaim.resubmit_count < WARRANTY_RESUBMIT_CAP"
          - "logical clock <= RequestItem.delivered_at + WARRANTY_WINDOW_DAYS days"
        side_effects:
          - "increments resubmit_count by 1 and clears decided_by_technician_id and abuse_finding"
        note: "DENIED -> SUBMITTED -> DENIED is a capped retry loop; the third resubmission is refused."

  - entity: Invoice
    axis: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /sharpening/invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
          - "the invoice has at least one InvoiceLine"
        side_effects:
          - "freezes all computed totals and increments Account.outstanding_balance_cents by amount_due_cents"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /sharpening/invoices/{id}/payments"
        actor: AccountOwner
        preconditions:
          - "Invoice.status == ISSUED"
          - "expected_invoice_version equals Invoice.version"
          - "0 < amount_cents < amount_due_cents"
        side_effects:
          - "increases amount_paid_cents, decreases amount_due_cents and Account.outstanding_balance_cents"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /sharpening/invoices/{id}/payments"
        actor: AccountOwner
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "expected_invoice_version equals Invoice.version"
          - "0 < amount_cents < amount_due_cents"
        side_effects:
          - "increases amount_paid_cents, decreases amount_due_cents and Account.outstanding_balance_cents"
          - "increments Invoice.version by 1"
        note: "Self-loop: each further partial payment leaves the status unchanged and only moves the money fields."
      - from: ISSUED
        to: PAID
        trigger: "POST /sharpening/invoices/{id}/payments"
        actor: AccountOwner
        preconditions:
          - "Invoice.status == ISSUED"
          - "expected_invoice_version equals Invoice.version"
          - "amount_cents == amount_due_cents"
        side_effects:
          - "sets amount_due_cents to 0 and decrements Account.outstanding_balance_cents accordingly"
          - "moves every ServiceRequest covered by this invoice INVOICED -> SETTLED"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /sharpening/invoices/{id}/payments"
        actor: AccountOwner
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
          - "expected_invoice_version equals Invoice.version"
          - "amount_cents == amount_due_cents"
        side_effects:
          - "sets amount_due_cents to 0 and decrements Account.outstanding_balance_cents accordingly"
          - "moves every ServiceRequest covered by this invoice INVOICED -> SETTLED"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /sharpening/invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "returns every covered ServiceRequest INVOICED -> UNBILLED and restores consumed allowance with AllowanceLedgerEntry kind=RESTORED rows"
      - from: ISSUED
        to: VOID
        trigger: "POST /sharpening/invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.amount_paid_cents == 0"
        side_effects:
          - "decrements Account.outstanding_balance_cents by amount_due_cents"
          - "returns every covered ServiceRequest INVOICED -> UNBILLED and restores consumed allowance with AllowanceLedgerEntry kind=RESTORED rows"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent entity's version only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: stop-add-stale-run
    parent_entity: RouteRun
    write_endpoint: "POST /sharpening/route-runs/{id}/stops"
    occ_field: "expected_route_run_version"
    description: |
      Adding a stop to a RouteRun whose version has advanced since the
      dispatcher last read the run is rejected. A second stop-add is a
      legitimate operation in its own right — the run happily accepts many
      stops — so the rejection cannot be expressed as a state precondition;
      it exists solely to stop a dispatcher from committing capacity against
      a stale view of booked_service_minutes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-apply-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /sharpening/invoices/{id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Applying a payment against an Invoice whose version has advanced since
      the payer last read it is rejected. Partial payments legitimately stack,
      so a second sequential payment against the same ISSUED or PARTIALLY_PAID
      invoice would otherwise succeed; the version check is what pins the
      payer's view of amount_due_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cadence-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /sharpening/subscriptions/{id}/cadence"
    occ_field: "expected_subscription_version"
    description: |
      Changing the standing-route cadence on a Subscription whose version has
      advanced since it was last read is rejected. A later cadence change
      legitimately supersedes an earlier one, so the operation is not gated by
      any state precondition; the version check pins the allowance and fee the
      caller believed they were re-anchoring from.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# Conservation invariants — named global quantities that a forward action and
# its compensating action MUST leave unchanged. Each is an explicit formula
# over declared entity fields and must hold after every request completes.
# ---------------------------------------------------------------------------
conservation_invariants:
  - name: custody_conservation
    quantity: "physical item custody"
    formula: |
      For every RequestItem, custody_location holds exactly one of
      {CUSTOMER, VAN, BENCH, LOCKER, DELIVERED, ABANDONED}; and for every
      ServiceRequest, item_count == count(RequestItem where
      service_request_id == that request). No operation may leave an item
      without a custody_location or in two of them.
    compensating_pair: "pickup then warranty approval returns custody DELIVERED -> CUSTOMER without changing item_count"
  - name: route_minute_conservation
    quantity: "van service minutes"
    formula: |
      RouteRun.booked_service_minutes == sum(RouteStop.stop_service_minutes
        for stops with route_run_id == run.id and status in
        {SCHEDULED, ARRIVED, SERVICED})
      and RouteRun.scheduled_stop_count == count(those same stops).
    compensating_pair: "POST /sharpening/route-runs/{id}/stops then DELETE /sharpening/route-stops/{id} returns both fields to their pre-add values"
  - name: bench_minute_conservation
    quantity: "shop bench minutes"
    formula: |
      BenchDay.booked_minutes == sum over RequestItem where bench_day_id ==
      benchday.id and custody_location == BENCH of
      (service_minutes_assessed when not null else service_minutes_declared).
    compensating_pair: "bench-intake then deliver (or decline) returns booked_minutes to its pre-intake value"
  - name: loaner_unit_conservation
    quantity: "physical loaner units"
    formula: |
      For every ItemClassSpec and grade, count(LoanerUnit with status IN_STOCK)
      + count(ISSUED) + count(INSPECTION) + count(RETIRED) == count(all
      LoanerUnit rows ever created for that spec and grade); and
      count(LoanerUnit with status ISSUED) == count(LoanerIssue with status OPEN).
    compensating_pair: "POST /sharpening/loaner-issues then POST /sharpening/loaner-issues/{id}/return with damage_reported false and cycle_count + 1 < cycle_ceiling returns the IN_STOCK count to its pre-issue value"
  - name: allowance_ledger_conservation
    quantity: "subscription included-item credits"
    formula: |
      For each Subscription and each cycle_index,
      sum(quantity where kind == GRANTED) - sum(quantity where kind == CONSUMED)
      - sum(quantity where kind == EXPIRED) + sum(quantity where kind == RESTORED)
      == Subscription.allowance_remaining, evaluated over the current cycle_index.
    compensating_pair: "POST /sharpening/invoices then POST /sharpening/invoices/{id}/void writes a RESTORED entry that returns allowance_remaining to its pre-invoice value"
  - name: money_conservation
    quantity: "account receivable cents"
    formula: |
      Invoice.amount_due_cents == Invoice.total_cents - Invoice.amount_paid_cents,
      Invoice.amount_paid_cents == sum(Payment.amount_cents where invoice_id ==
      invoice.id), and Account.outstanding_balance_cents == sum(amount_due_cents
      over that account's Invoices with status in {ISSUED, PARTIALLY_PAID}).
    compensating_pair: "POST /sharpening/invoices/{id}/issue then POST /sharpening/invoices/{id}/void on an unpaid invoice returns outstanding_balance_cents to its pre-issue value"

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# All money is integer cents. round_half_up(x) rounds to the nearest integer
# with ties resolved away from zero, so round_half_up(-2.5) == -3.
# ---------------------------------------------------------------------------
calculations:
  - name: subscription_effective_fee
    trigger: "POST /sharpening/subscriptions, POST /sharpening/subscriptions/{id}/cadence"
    algorithm: threshold
    formula: |
      effective_monthly_fee_cents =
          round_half_up(PlanTier.monthly_fee_cents * CADENCE_FEE_MULT[Subscription.cadence])
      included_items_this_cycle =
          PlanTier.included_items_per_cycle * CADENCE_ALLOWANCE_MULT[Subscription.cadence]
    input_set: "The single PlanTier referenced by Subscription.plan_tier_id and the subscription's own cadence."
    constants:
      CADENCE_FEE_MULT: { WEEKLY: 1.75, BIWEEKLY: 1.25, MONTHLY: 1.00 }
      CADENCE_ALLOWANCE_MULT: { WEEKLY: 4, BIWEEKLY: 2, MONTHLY: 1 }
    precision: "integer cents, round_half_up"

  - name: next_service_date
    trigger: "POST /sharpening/subscriptions, .../resume, .../cadence, .../skip, .../advance-cycle"
    algorithm: chronological
    formula: |
      interval = CADENCE_INTERVAL_DAYS[Subscription.cadence]
      candidate(n) = Subscription.anchor_date + n * interval   # whole days
    input_set: "Subscription.anchor_date, Subscription.cadence and the logical clock date."
    constants:
      CADENCE_INTERVAL_DAYS: { WEEKLY: 7, BIWEEKLY: 14, MONTHLY: 28 }
    precision: "whole days; dates are ISO YYYY-MM-DD in UTC"
    variants:
      - name: ANCHORED
        when: "Subscription creation, customer skip and advance-cycle."
        difference: "next_service_date = candidate(n) for the smallest integer n >= 0 whose value is >= the logical clock date; a skip then adds one further interval on top of the result."
      - name: RE_ANCHORED
        when: "resume from PAUSED and cadence change; anchor_date is first reset to the logical clock date."
        difference: "next_service_date = candidate(n) for the smallest integer n >= 1, so the series always lands a full interval out even when the reset anchor would itself have qualified under ANCHORED."

  - name: subscription_proration
    trigger: "POST /sharpening/subscriptions/{id}/pause, POST /sharpening/subscriptions/{id}/cadence"
    algorithm: tiered_pricing
    formula: |
      unused_days = max(0, whole_days_between(logical_clock_date, Subscription.cycle_end_date))
      # cycle_end_date is the exclusive upper bound of the cycle
    input_set: "The single Subscription being paused or re-cadenced, plus its PlanTier."
    constants:
      PRORATION_BASIS_DAYS: 30
    precision: "integer cents, one single round_half_up applied to the whole product; never a per-day rounding followed by a multiplication"
    variants:
      - name: PAUSE_PRORATION
        when: "ACTIVE -> PAUSED"
        difference: "amount = -round_half_up(Subscription.effective_monthly_fee_cents * unused_days / PRORATION_BASIS_DAYS); always a credit (negative or zero)."
      - name: CADENCE_CHANGE_PRORATION
        when: "ACTIVE -> ACTIVE via the cadence endpoint"
        difference: "amount = +round_half_up((new_effective_monthly_fee_cents - old_effective_monthly_fee_cents) * unused_days / PRORATION_BASIS_DAYS); positive when up-cadencing, negative when down-cadencing, and it prices the fee difference rather than the whole fee."

  - name: item_service_minutes
    trigger: "POST /sharpening/service-requests/{id}/items, POST /sharpening/request-items/{id}/assess"
    algorithm: aggregation
    formula: |
      minutes(tier) = ItemClassSpec.base_service_minutes + DAMAGE_MINUTES_ADD[tier]
    input_set: "The single RequestItem and its ItemClassSpec."
    constants:
      DAMAGE_MINUTES_ADD: { ROUTINE_HONE: 0, CHIP_REPAIR: 6, RE_TIP: 12, HANDLE_WORK: 20 }
    precision: "whole minutes"
    variants:
      - name: DECLARED
        when: "always, from declared_damage_tier; written to service_minutes_declared at item creation and used for route planning and bench booking."
        difference: "uses declared_damage_tier, the customer's own statement."
      - name: ASSESSED
        when: "after an assessment or on a warranty rework item whose tier the shop pre-set; written to service_minutes_assessed."
        difference: "uses assessed_damage_tier, which may be a lower or a higher tier than declared, so the two variants can differ in either direction."

  - name: item_service_price
    trigger: "POST /sharpening/service-requests/{id}/items (QUOTED), POST /sharpening/request-items/{id}/assess (FINAL), POST /sharpening/invoices (charged amounts)"
    algorithm: tiered_pricing
    formula: |
      gross_cents(tier) = round_half_up(ItemClassSpec.list_price_cents * DAMAGE_PRICE_MULT[tier])

      # charged_service_cents is evaluated at invoice creation in this pinned order.
      # A different order changes which item consumes the allowance and therefore
      # changes the invoice total, so the order is part of the contract.
      O0. if ServiceRequest.channel == REWORK:
              charged_service_cents = 0; part_fee_cents = 0; stop.
      O1. rank the invoice's candidate items by final_gross_cents DESC (pre-discount,
          pre-rush), tie-break RequestItem.created_at ASC
      O2. the first K ranked items get allowance_applied = true
          (K comes from calculations.allowance_consumption_plan)
      O3. base = 0                                              if allowance_applied
          base = round_half_up(final_gross_cents * (1 - PlanTier.overage_discount_pct))
                                                                if not allowance_applied
                                                                and ServiceRequest.subscription_id is not null
                                                                and that Subscription.status == ACTIVE
          base = final_gross_cents                              otherwise
      O4. if ServiceRequest.priority == RUSH:
              base = base + max(RUSH_MIN_SURCHARGE_CENTS,
                                round_half_up(base * RUSH_SURCHARGE_PCT))
      O5. charged_service_cents = base
          part_fee_cents = PART_FEE_CENTS[assessed_damage_tier]
    input_set: "The RequestItem, its ItemClassSpec, its ServiceRequest, and (when subscription_id is set) the Subscription and its PlanTier."
    constants:
      DAMAGE_PRICE_MULT: { ROUTINE_HONE: 1.00, CHIP_REPAIR: 1.60, RE_TIP: 2.25, HANDLE_WORK: 3.00 }
      PART_FEE_CENTS: { ROUTINE_HONE: 0, CHIP_REPAIR: 0, RE_TIP: 400, HANDLE_WORK: 900 }
      RUSH_SURCHARGE_PCT: 0.20
      RUSH_MIN_SURCHARGE_CENTS: 500
    precision: "integer cents, round_half_up at each of the two rounding points named above"
    variants:
      - name: QUOTED
        when: "at item creation, before any technician has seen the item"
        difference: "gross uses declared_damage_tier and is stored in quoted_gross_cents; it is what the customer was promised."
      - name: FINAL
        when: "at assessment, and it is the basis of every charged amount"
        difference: "gross uses assessed_damage_tier and is stored in final_gross_cents; when no assessment has happened final_gross_cents equals quoted_gross_cents."

  - name: item_reauthorization_required
    trigger: "POST /sharpening/request-items/{id}/assess"
    algorithm: threshold
    formula: |
      delta = final_gross_cents - quoted_gross_cents
      requires_reauthorization =
          (delta > REASSESS_AUTHORIZATION_ABS_CENTS)
          AND (delta * 10000 > quoted_gross_cents * REASSESS_AUTHORIZATION_PCT_BP)
      # both comparisons are strict; a delta that only ties either threshold does not trip the rule
      authorization_status = PENDING when requires_reauthorization else NOT_REQUIRED
    input_set: "The single RequestItem being assessed."
    constants:
      REASSESS_AUTHORIZATION_ABS_CENTS: 1000
      REASSESS_AUTHORIZATION_PCT_BP: 2500
    precision: "integer cents; the percentage test is done in basis points against integers so no floating comparison is involved"

  - name: run_committed_minutes
    trigger: "POST /sharpening/route-runs/{id}/stops, DELETE /sharpening/route-stops/{id}, POST /sharpening/route-stops/{id}/spill, POST /sharpening/route-stops/{id}/reschedule (PROVISIONAL); POST /sharpening/route-runs/{id}/dispatch (DISPATCH_FINAL)"
    algorithm: aggregation
    formula: |
      active_stops(R) = RouteStop rows with route_run_id == R
                        and status in {SCHEDULED, ARRIVED, SERVICED}
      billable_items(S) = RequestItem rows of the stop's ServiceRequest whose
                          service_status is not in {RETURNED_UNSERVICED, ABANDONED}
      booked_service_minutes = sum over active_stops of stop_service_minutes
    input_set: "Every RouteStop on the run whose status is SCHEDULED, ARRIVED or SERVICED, and the RequestItems of each of those stops' ServiceRequests."
    constants:
      DRIVE_BUFFER_MINUTES_PER_STOP: 14
      RETURN_LEG_BUFFER_MINUTES: 25
    precision: "whole minutes"
    variants:
      - name: PROVISIONAL
        when: "every stop add, delete, spill and reschedule while the run is PLANNED; the feasibility gate at rung 53 uses this variant"
        difference: |
          stop_service_minutes = sum over billable_items of service_minutes_declared
          committed_minutes_provisional = booked_service_minutes
                                          + DRIVE_BUFFER_MINUTES_PER_STOP * count(active_stops)
          No return-leg buffer is charged.
      - name: DISPATCH_FINAL
        when: "POST /sharpening/route-runs/{id}/dispatch"
        difference: |
          stop_service_minutes = sum over billable_items of
              (service_minutes_assessed when it is not null else service_minutes_declared)
          committed_minutes_final = booked_service_minutes
                                    + DRIVE_BUFFER_MINUTES_PER_STOP * count(active_stops)
                                    + RETURN_LEG_BUFFER_MINUTES
          The assessed branch is reachable because a warranty rework item is created
          already carrying assessed_damage_tier = ROUTINE_HONE while its
          declared_damage_tier is copied from the original item's assessed tier.

  - name: next_eligible_run_selector
    trigger: "POST /sharpening/route-stops/{id}/reschedule"
    algorithm: waterfall_allocation
    formula: |
      eligible(stop) = RouteRun rows where
          status == PLANNED
          AND zone_code == Account.zone_code of the stop's account_id
          AND run_date > RouteRun.run_date of stop.spilled_from_route_run_id
          AND scheduled_stop_count + 1 <= stop_cap
          AND committed_minutes_provisional
              + stop_service_minutes(PROVISIONAL for this stop)
              + DRIVE_BUFFER_MINUTES_PER_STOP <= service_minute_budget
      ranking   = run_date ASC
      tie_break = RouteRun.created_at ASC
      empty_pool -> ERR_NO_ELIGIBLE_RUN (409)

      placement on the receiving run:
        sequence = 1 + max(sequence) over that run's stops with status in
                   {SCHEDULED, ARRIVED, SERVICED}, or 1 when there are none
        arrival_window_start = the earliest HH:MM at or after day_window_start on the
                   ARRIVAL_WINDOW_MINUTES grid whose window does not overlap an existing
                   non-terminal stop window and whose end is <= day_window_end;
                   when no such slot exists the reschedule fails with ERR_WINDOW_OUT_OF_DAY
    input_set: "All PLANNED RouteRuns in the account's zone with a run_date strictly after the source run's run_date."
    constants:
      DRIVE_BUFFER_MINUTES_PER_STOP: 14
      ARRIVAL_WINDOW_MINUTES: 60
    precision: "whole minutes; HH:MM local times"

  - name: compartment_assignment_selector
    trigger: "POST /sharpening/service-requests/{id}/locker-assign"
    algorithm: waterfall_allocation
    formula: |
      required_rank = max over the request's items of
                      LOCKER_SIZE_RANK[ItemClassSpec.min_locker_size]
      eligible = LockerCompartment rows where
          status == AVAILABLE
          AND site_code == ServiceRequest.locker_site_code
          AND LOCKER_SIZE_RANK[size] >= required_rank
          AND LOCKER_CAPACITY_ITEMS[size] >= ServiceRequest.item_count
          AND (last_released_at is null
               OR logical_clock >= last_released_at + LOCKER_TURNAROUND_BUFFER_MINUTES minutes)
      ranking   = LOCKER_SIZE_RANK[size] ASC        # smallest compartment that fits
      tie_break = LockerCompartment.created_at ASC

      empty-pool adjudication, evaluated in this exact order:
        1. no LockerCompartment at all has site_code == locker_site_code
           -> ERR_NO_AVAILABLE_COMPARTMENT
        2. every AVAILABLE compartment at the site fails the size or capacity test
           -> ERR_COMPARTMENT_SIZE_UNFIT
        3. at least one AVAILABLE compartment at the site passes size and capacity but
           every such compartment fails the turnaround test
           -> ERR_LOCKER_TURNAROUND_CONFLICT
        4. otherwise -> ERR_NO_AVAILABLE_COMPARTMENT
    input_set: "All LockerCompartment rows at the request's locker_site_code, plus the request's items and their ItemClassSpecs."
    constants:
      LOCKER_SIZE_RANK: { SMALL: 1, MEDIUM: 2, LARGE: 3 }
      LOCKER_CAPACITY_ITEMS: { SMALL: 4, MEDIUM: 10, LARGE: 20 }
      LOCKER_TURNAROUND_BUFFER_MINUTES: 30
    precision: "whole minutes"

  - name: loaner_unit_selector
    trigger: "POST /sharpening/loaner-issues"
    algorithm: waterfall_allocation
    formula: |
      eligible = LoanerUnit rows where
          status == IN_STOCK
          AND item_class_spec_id == the requested spec
          AND LOANER_GRADE_RANK[grade] >= LOANER_GRADE_RANK[requested_grade]
      ranking   = (0 when grade == requested_grade else 1) ASC,
                  then LOANER_GRADE_RANK[grade] ASC,
                  then cycle_count ASC,          # rotation: least-worn unit first
                  then LoanerUnit.created_at ASC
      empty_pool -> ERR_LOANER_STOCK_EXHAUSTED (409)
      substituted = (selected.grade != requested_grade)
    input_set: "All LoanerUnit rows for the requested ItemClassSpec whose status is IN_STOCK."
    constants:
      LOANER_GRADE_RANK: { STANDARD: 1, PREMIUM: 2 }
    precision: "exact integer comparison"

  - name: loaner_late_fee
    trigger: "POST /sharpening/loaner-issues/{id}/return, and the delivery cascade"
    algorithm: decay_function
    formula: |
      grace_end = due_at + LOANER_GRACE_HOURS hours
      delay_attribution =
          SERVICE  when the LoanerIssue's ServiceRequest has origin_warranty_claim_id
                   not null, or any RequestItem of that request has service_status
                   REWORK_QUEUED at the moment of return
          CUSTOMER otherwise
    input_set: "The single LoanerIssue, its ServiceRequest and that request's items."
    constants:
      LOANER_DUE_DAYS: 14
      LOANER_GRACE_HOURS: 24
      LOANER_LATE_FEE_PER_DAY_CENTS: 250
      LOANER_LATE_FEE_CAP_CENTS: 2500
    precision: "integer cents; whole late days via ceiling"
    variants:
      - name: CUSTOMER_LATE
        when: "delay_attribution == CUSTOMER"
        difference: |
          overdue_seconds = max(0, returned_at - grace_end, in seconds)
          late_days = ceil(overdue_seconds / 86400)
          late_fee_cents = min(LOANER_LATE_FEE_CAP_CENTS,
                               late_days * LOANER_LATE_FEE_PER_DAY_CENTS)
      - name: SERVICE_DELAY
        when: "delay_attribution == SERVICE"
        difference: "late_fee_cents = 0 no matter how far past grace_end the return is; the shop owns the delay because the request was carrying rework."

  - name: warranty_credit
    trigger: "POST /sharpening/warranty-claims/{id}/approve"
    algorithm: projection
    formula: |
      credit_basis_cents = amount_cents of the InvoiceLine whose source == SERVICE
                           and request_item_id == WarrantyClaim.request_item_id;
                           0 when no such line exists (for example because the item
                           was covered by the subscription allowance)
      the emitted InvoiceLine has source = WARRANTY_CREDIT,
                                   taxable = true,
                                   amount_cents = -credit_basis_cents
    input_set: "The single SERVICE InvoiceLine for the claimed item across all of the account's non-VOID invoices."
    constants:
      WARRANTY_CREDIT_INCLUDES_PARTS: false
    precision: "integer cents; parts are never credited"

  - name: allowance_consumption_plan
    trigger: "POST /sharpening/invoices"
    algorithm: waterfall_allocation
    formula: |
      candidate_items(scope) = RequestItem rows where
          the item's ServiceRequest is in scope
          AND that ServiceRequest.subscription_id is not null
          AND that Subscription.status == ACTIVE
          AND that ServiceRequest.channel != REWORK
          AND item.service_status not in {RETURNED_UNSERVICED, ABANDONED}
      ranking   = final_gross_cents DESC          # the dearest item absorbs the allowance
      tie_break = RequestItem.created_at ASC
      K = min(count(candidate_items), Subscription.allowance_remaining)
      the first K ranked items get allowance_applied = true and one
      AllowanceLedgerEntry kind=CONSUMED quantity=1 reason=INVOICE each;
      Subscription.allowance_remaining decreases by exactly K
    input_set: "Defined per variant below; only ACTIVE subscriptions contribute allowance."
    constants:
      ALLOWANCE_ROLLOVER_ENABLED: false
    precision: "whole item counts"
    variants:
      - name: VISIT_SCOPED
        when: "Account.billing_mode == PER_VISIT"
        difference: "scope is the single ServiceRequest named by Invoice.service_request_id, so the ranking never sees items from the account's other visits and the allowance is spent visit by visit in invoice order."
      - name: CYCLE_SCOPED
        when: "Account.billing_mode == MONTHLY_ROLLUP"
        difference: "scope is every ServiceRequest of the account with status COMPLETED, billing_status UNBILLED and completed_at inside the invoice's billing_period, so the ranking is global across the cycle and the allowance lands on the dearest items of the whole period regardless of which visit they came from."

  - name: invoice_totals
    trigger: "POST /sharpening/invoices, and every operation that appends an InvoiceLine to a DRAFT Invoice"
    algorithm: aggregation
    formula: |
      # 1. line append order — sequence_index is assigned in exactly this order
      #    (1) SUBSCRIPTION_FEE          (MONTHLY_ROLLUP invoices only)
      #    (2) SERVICE lines             ordered by RequestItem.created_at ASC
      #    (3) PART lines                ordered by RequestItem.created_at ASC
      #    (4) LATE_FEE lines            ordered by LoanerIssue.created_at ASC
      #    (5) PRORATION_CREDIT lines    ordered by InvoiceLine.sequence_index of insertion
      #    (6) WARRANTY_CREDIT lines     ordered by WarrantyClaim.created_at ASC
      # 2. taxability is fixed per source:
      #    taxable   = SERVICE, SUBSCRIPTION_FEE, PRORATION_CREDIT, WARRANTY_CREDIT
      #    nontaxable= PART, LATE_FEE
      taxable_subtotal_cents    = sum of amount_cents over taxable lines      # may be negative
      nontaxable_subtotal_cents = sum of amount_cents over non-taxable lines
      tax_cents = 0 when Account.tax_exempt
                  else round_half_up(max(0, taxable_subtotal_cents) * SERVICE_TAX_RATE_BP / 10000)
      total_cents      = taxable_subtotal_cents + nontaxable_subtotal_cents + tax_cents
      amount_due_cents = total_cents - amount_paid_cents
      # A DRAFT Invoice created as a side effect (warranty credit, proration credit,
      # loaner late fee) is minted with service_request_id null, billing_period null,
      # billing_mode copied from Account.billing_mode, and covers no ServiceRequest;
      # rung 30's scope rule constrains only POST /sharpening/invoices.
      # PINNED: tax is computed ONCE over the aggregate taxable subtotal and rounded once.
      # Rounding the tax of each taxable line and summing those roundings is explicitly
      # NOT the contract and produces different cents on multi-line invoices.
    input_set: "Every InvoiceLine attached to the invoice, plus Account.tax_exempt."
    constants:
      SERVICE_TAX_RATE_BP: 725
    precision: "integer cents; exactly one round_half_up per invoice, applied to the tax"
    variants:
      - name: PER_VISIT
        when: "Account.billing_mode == PER_VISIT at invoice creation"
        difference: "the invoice covers exactly one COMPLETED ServiceRequest (Invoice.service_request_id is required, billing_period must be null) and carries no SUBSCRIPTION_FEE line."
      - name: MONTHLY_ROLLUP
        when: "Account.billing_mode == MONTHLY_ROLLUP at invoice creation"
        difference: "the invoice covers every COMPLETED, UNBILLED ServiceRequest of the account whose completed_at falls inside billing_period (Invoice.billing_period is required, service_request_id must be null) and carries one SUBSCRIPTION_FEE line equal to Subscription.effective_monthly_fee_cents when the account has a Subscription with status ACTIVE or PAUSED."

  - name: bench_minutes_booked
    trigger: "POST /sharpening/service-requests/{id}/bench-intake, POST /sharpening/request-items/{id}/assess, POST /sharpening/request-items/{id}/decline, POST /sharpening/service-requests/{id}/deliver"
    algorithm: aggregation
    formula: |
      BenchDay.booked_minutes = sum over RequestItem rows where
          bench_day_id == BenchDay.id AND custody_location == BENCH
          of (service_minutes_assessed when it is not null else service_minutes_declared)
    input_set: "Every RequestItem currently on the bench for that bench_date; items that have left BENCH custody no longer count."
    constants:
      DEFAULT_BENCH_MINUTE_BUDGET: 480
    precision: "whole minutes"

  - name: account_outstanding_balance
    trigger: "POST /sharpening/invoices/{id}/issue, POST /sharpening/invoices/{id}/payments, POST /sharpening/invoices/{id}/void"
    algorithm: aggregation
    formula: |
      Account.outstanding_balance_cents = sum over Invoice rows where
          account_id == Account.id AND status in {ISSUED, PARTIALLY_PAID}
          of amount_due_cents
      # DRAFT, PAID and VOID invoices never contribute. The sum can go negative
      # when a credit memo is issued, which is a customer credit balance.
    input_set: "The account's Invoices whose status is ISSUED or PARTIALLY_PAID."
    constants:
      DEFAULT_ACCOUNT_CREDIT_LIMIT_CENTS: 50000
    precision: "integer cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------

# Global and ordered write gates, stated with their exact position relative to
# the numbered ladder below. Gates are not a separate pass: each one occupies
# the numbered rung named here, and everything with a higher number is
# unreachable while that gate is failing.
gate_precedence:
  - gate: GATE_AUTHENTICATION
    position: "rung 1 — the first check on every endpoint"
    scope: "all endpoints"
    pre_empts: "rungs 2-57"
  - gate: GATE_AUTHORIZATION_ROLE
    position: "rung 2"
    scope: "all endpoints"
    pre_empts: "rungs 3-57"
  - gate: GATE_PATH_EXISTENCE
    position: "rung 3, resolved left-to-right along the URL"
    scope: "all endpoints with path parameters"
    pre_empts: "rungs 4-57"
  - gate: GATE_REQUEST_SHAPE
    position: "rungs 4-7 in the order required-fields, enum-legality, numeric-range, pagination"
    scope: "all endpoints with a body or query string"
    pre_empts: "rungs 8-57"
  - gate: GATE_OWNERSHIP
    position: "rung 8"
    scope: "every endpoint whose `as:` role is entity_backed (AccountOwner, Technician)"
    pre_empts: "rungs 9-57"
  - gate: GATE_ACCOUNT_STATUS
    position: "rung 9 — after ownership, BEFORE body-reference existence"
    scope: "every mutating endpoint whose target resolves to an Account, except POST /sharpening/accounts/{id}/suspend, POST /sharpening/accounts/{id}/reinstate and PATCH /sharpening/accounts/{id}"
    pre_empts: "rungs 10-57; a suspended account is reported even when the body also carries an unknown foreign key"
  - gate: GATE_BODY_EXISTENCE
    position: "rung 10"
    scope: "every endpoint with foreign keys in the request body"
    pre_empts: "rungs 11-57"
  - gate: GATE_CREDIT_LIMIT
    position: "rung 11"
    scope: "new-work endpoints only: service-request submit, item add, stop add, locker-assign, loaner-issue create"
    pre_empts: "rungs 12-57"
  - gate: GATE_OCC_VERSION
    position: "rung 12 — deliberately BEFORE every state precondition"
    scope: "the three endpoints named in §1.2.1"
    pre_empts: "rungs 13-57; a stale version wins over an illegal from-state on the same request"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    pre_empts: "every later rung"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's `roles:` list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    pre_empts: "rungs 3-57"
  - priority: 3
    category: existence
    check: "Every id in the URL path resolves to a row, checked left-to-right; the leftmost unresolved segment decides the error."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    pre_empts: "rungs 4-57"
  - priority: 4
    category: business_constraint
    check: "Every field marked required in the endpoint's `input:` is present and of the declared JSON type."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
    pre_empts: "rungs 5-57"
  - priority: 5
    category: business_constraint
    check: "Every enum-typed field carries a declared member of that enum."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints with an enum field in `input:`"
    pre_empts: "rungs 6-57"
  - priority: 6
    category: business_constraint
    check: "Numeric fields satisfy their declared ranges (budgets and caps >= 1, amounts >= 1, sequence >= 1, cents >= 0) and date/time fields parse as ISO 8601."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all endpoints with numeric or temporal input"
    pre_empts: "rungs 7-57"
  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
    pre_empts: "rungs 8-57"
  - priority: 8
    category: auth
    check: "For an entity_backed role, X-User-ID owns the resource: AccountOwner's id equals the resolved Account.id of the target, and Technician's id equals the technician assigned to the RouteRun or, for bench operations, any Technician row. Two carve-outs: on POST /sharpening/warranty-claims the acting AccountOwner IS the scope (the body carries no account_id), so the item-belongs-to-this-account test is rung 28 and not this rung; and on POST /sharpening/invoices/{id}/payments a BillingClerk is opaque and skips this rung entirely."
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include AccountOwner or Technician"
    pre_empts: "rungs 9-57"
  - priority: 9
    category: state
    check: "The Account the operation resolves to has status ACTIVE."
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "every mutating endpoint whose target resolves to an Account, EXCEPT the three account-administration endpoints POST /sharpening/accounts/{id}/suspend, POST /sharpening/accounts/{id}/reinstate and PATCH /sharpening/accounts/{id}, which must remain callable on a suspended account"
    pre_empts: "rungs 10-57"
  - priority: 10
    category: existence
    check: "Every foreign key supplied in the request body resolves to a row, checked in the order the fields are listed in the endpoint's `input:`."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys in the body"
    pre_empts: "rungs 11-57"
  - priority: 11
    category: business_fiscal
    check: "Account.outstanding_balance_cents <= Account.credit_limit_cents."
    error_id: ERR_CREDIT_LIMIT_BLOCKED
    http_status: 402
    applies_to: "POST /sharpening/service-requests/{id}/submit, POST /sharpening/service-requests/{id}/items, POST /sharpening/route-runs/{id}/stops, POST /sharpening/service-requests/{id}/locker-assign, POST /sharpening/loaner-issues"
    pre_empts: "rungs 12-57"
  - priority: 12
    category: state
    check: "expected_route_run_version / expected_invoice_version / expected_subscription_version equals the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "the three write endpoints named in §1.2.1"
    pre_empts: "rungs 13-57"
  - priority: 13
    category: state
    check: "The target entity is not already in one of its axis's terminal states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint"
    pre_empts: "rungs 14-57"
  - priority: 14
    category: state
    check: "The target entity's current state is a declared `from:` state of the requested transition, AND every `preconditions:` clause declared on that transition in §1.2 that no more specific rung below already covers holds - for example the clock-versus-hold_expires_at clause on expire-hold, the abandonment-grace clause on abandon, the scheduled_stop_count >= 1 clause on dispatch, the no-stop-still-open clause on run complete, and the every-item-DONE clause on deliver."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"
    pre_empts: "rungs 15-57"
  - priority: 15
    category: state
    check: "The parent RouteRun is in a status that permits the stop operation: PLANNED for add, delete and reschedule; PLANNED or DISPATCHED for spill; DISPATCHED or IN_PROGRESS for arrive."
    error_id: ERR_RUN_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /sharpening/route-runs/{id}/stops, DELETE /sharpening/route-stops/{id}, POST /sharpening/route-stops/{id}/spill, POST /sharpening/route-stops/{id}/reschedule, POST /sharpening/route-stops/{id}/arrive"
    pre_empts: "rungs 16-57"
  - priority: 16
    category: state
    check: "The parent ServiceRequest is in a status that permits the item operation: DRAFT for item add, IN_SERVICE for assess, start-work, complete-work and decline."
    error_id: ERR_REQUEST_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/items and every /sharpening/request-items/{id}/* action"
    pre_empts: "rungs 17-57"
  - priority: 17
    category: state
    check: "When the request body supplies subscription_id, that Subscription's status is not CANCELLED. The skip, cadence and advance-cycle endpoints do not reach this rung because rung 14 already rejects a non-ACTIVE subscription as an illegal from-state."
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sharpening/service-requests"
    pre_empts: "rungs 18-57"
  - priority: 18
    category: state
    check: "Invoice.status is ISSUED or PARTIALLY_PAID and Invoice.amount_due_cents >= 1. The status half is pre-empted by rung 14 (a DRAFT invoice is not a declared from-state of any payment transition), so the reachable trigger is an ISSUED credit memo whose amount_due_cents is zero or negative."
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /sharpening/invoices/{id}/payments"
    pre_empts: "rungs 19-57"
  - priority: 19
    category: state
    check: "Every RequestItem involved is in the custody_location the operation requires (VAN or LOCKER for bench-intake, BENCH for assess and start-work, LOCKER for release and abandon)."
    error_id: ERR_ITEM_NOT_IN_CUSTODY
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/bench-intake, POST /sharpening/request-items/{id}/assess, POST /sharpening/request-items/{id}/start-work, POST /sharpening/locker-compartments/{id}/release, POST /sharpening/locker-compartments/{id}/abandon"
    pre_empts: "rungs 20-57"
  - priority: 20
    category: business_temporal
    check: "The BenchDay referenced by bench_day_id has a bench_date equal to the logical clock date. Deliberately placed here so a wrong-day intake is reported before the bench capacity check at rung 54."
    error_id: ERR_BENCH_DAY_DATE_MISMATCH
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/bench-intake"
    pre_empts: "rungs 21-57"
  - priority: 21
    category: state
    check: "The logical clock is strictly before LockerCompartment.hold_expires_at."
    error_id: ERR_LOCKER_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /sharpening/locker-compartments/{id}/deposit, POST /sharpening/locker-compartments/{id}/release"
    pre_empts: "rungs 22-57"
  - priority: 22
    category: business_safety
    check: "The acting Technician's certifications contain ItemClassSpec.required_certification, unless it is NONE."
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /sharpening/request-items/{id}/assess, POST /sharpening/request-items/{id}/start-work"
    pre_empts: "rungs 23-57"
  - priority: 23
    category: business_safety
    check: "The acting Technician's X-User-ID differs from RequestItem.assessed_by_technician_id of the claimed item."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sharpening/warranty-claims/{id}/approve, POST /sharpening/warranty-claims/{id}/deny"
    pre_empts: "rungs 24-57"
  - priority: 24
    category: business_safety
    check: "RequestItem.authorization_status is NOT_REQUIRED or AUTHORIZED."
    error_id: ERR_AUTHORIZATION_REQUIRED
    http_status: 409
    applies_to: "POST /sharpening/request-items/{id}/start-work"
    pre_empts: "rungs 25-57"
  - priority: 25
    category: business_safety
    check: "For a LOCKER-channel item, the compartment's stored_value_cents after re-pricing is <= LOCKER_VALUE_AUTHORIZATION_CENTS, or ServiceRequest.locker_high_value_authorized is true."
    error_id: ERR_LOCKER_VALUE_AUTHORIZATION_REQUIRED
    http_status: 409
    applies_to: "POST /sharpening/request-items/{id}/assess"
    pre_empts: "rungs 26-57"
  - priority: 26
    category: business_referential
    check: "RequestItem.item_class equals the item_class of the referenced ItemClassSpec."
    error_id: ERR_ITEM_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /sharpening/service-requests/{id}/items"
    pre_empts: "rungs 27-57"
  - priority: 27
    category: business_referential
    check: "The ServiceRequest's Account.zone_code equals the RouteRun.zone_code."
    error_id: ERR_STOP_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /sharpening/route-runs/{id}/stops, POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 28-57"
  - priority: 28
    category: business_referential
    check: "The claimed RequestItem's ServiceRequest.account_id equals the acting AccountOwner's id."
    error_id: ERR_CLAIM_ITEM_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /sharpening/warranty-claims"
    pre_empts: "rungs 29-57"
  - priority: 29
    category: business_referential
    check: "The requested ItemClassSpec.loaner_eligible is true."
    error_id: ERR_LOANER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /sharpening/loaner-units, POST /sharpening/loaner-issues"
    pre_empts: "rungs 30-57"
  - priority: 30
    category: business_referential
    check: "A PER_VISIT invoice supplies service_request_id and omits billing_period; a MONTHLY_ROLLUP invoice supplies billing_period and omits service_request_id."
    error_id: ERR_INVOICE_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /sharpening/invoices"
    pre_empts: "rungs 31-57"
  - priority: 31
    category: business_temporal
    check: "RouteRun.run_date is not earlier than the logical clock date."
    error_id: ERR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /sharpening/route-runs, POST /sharpening/route-runs/{id}/dispatch"
    pre_empts: "rungs 32-57"
  - priority: 32
    category: business_temporal
    check: "ServiceRequest.requested_date is not earlier than the logical clock date."
    error_id: ERR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /sharpening/service-requests"
    pre_empts: "rungs 33-57"
  - priority: 33
    category: business_temporal
    check: "arrival_window_start >= RouteRun.day_window_start and arrival_window_start + ARRIVAL_WINDOW_MINUTES <= RouteRun.day_window_end."
    error_id: ERR_WINDOW_OUT_OF_DAY
    http_status: 422
    applies_to: "POST /sharpening/route-runs/{id}/stops, POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 34-57"
  - priority: 34
    category: business_temporal
    check: "The half-open window [arrival_window_start, arrival_window_end) does not intersect the window of any stop on the same run whose status is SCHEDULED, ARRIVED or SERVICED. Touching endpoints (one window's end equal to another's start) do not intersect and are accepted."
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /sharpening/route-runs/{id}/stops, POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 35-57"
  - priority: 35
    category: business_temporal
    check: "Every size-fitting AVAILABLE compartment at the site satisfies logical_clock >= last_released_at + LOCKER_TURNAROUND_BUFFER_MINUTES minutes; the buffer boundary is inclusive, so a clock exactly at last_released_at + 30 minutes passes."
    error_id: ERR_LOCKER_TURNAROUND_CONFLICT
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/locker-assign"
    pre_empts: "rungs 36-57"
  - priority: 36
    category: business_temporal
    check: "The logical clock is at least SKIP_WINDOW_HOURS before 00:00:00Z of Subscription.next_service_date; exactly SKIP_WINDOW_HOURS before passes."
    error_id: ERR_SKIP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /sharpening/subscriptions/{id}/skip"
    pre_empts: "rungs 37-57"
  - priority: 37
    category: business_temporal
    check: "The logical clock is at least SKIP_WINDOW_HOURS before 00:00:00Z of Subscription.next_service_date."
    error_id: ERR_CADENCE_CHANGE_TOO_LATE
    http_status: 409
    applies_to: "POST /sharpening/subscriptions/{id}/cadence"
    pre_empts: "rungs 38-57"
  - priority: 38
    category: business_temporal
    check: "The logical clock is not later than RequestItem.delivered_at + WARRANTY_WINDOW_DAYS days; exactly on the boundary passes."
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sharpening/warranty-claims, POST /sharpening/warranty-claims/{id}/resubmit"
    pre_empts: "rungs 39-57"
  - priority: 39
    category: business_temporal
    check: "to_iso8601 is not earlier than the current logical clock; the clock may only move forward."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
    pre_empts: "rungs 40-57"
  - priority: 40
    category: business_constraint
    check: "ServiceRequest.item_count + 1 <= MAX_ITEMS_PER_REQUEST."
    error_id: ERR_ITEM_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /sharpening/service-requests/{id}/items"
    pre_empts: "rungs 41-57"
  - priority: 41
    category: business_constraint
    check: "WarrantyClaim.resubmit_count < WARRANTY_RESUBMIT_CAP."
    error_id: ERR_RESUBMIT_CAP_REACHED
    http_status: 409
    applies_to: "POST /sharpening/warranty-claims/{id}/resubmit"
    pre_empts: "rungs 42-57"
  - priority: 42
    category: business_constraint
    check: "RouteStop.spill_hop_count + 1 <= SPILL_MAX_HOPS."
    error_id: ERR_SPILL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /sharpening/route-stops/{id}/spill, POST /sharpening/route-runs/{id}/dispatch"
    pre_empts: "rungs 43-57"
  - priority: 43
    category: business_constraint
    check: "At least one AVAILABLE compartment at the site satisfies both the size-rank and the item-capacity test; see step 2 of calculations.compartment_assignment_selector."
    error_id: ERR_COMPARTMENT_SIZE_UNFIT
    http_status: 422
    applies_to: "POST /sharpening/service-requests/{id}/locker-assign"
    pre_empts: "rungs 44-57"
  - priority: 44
    category: business_constraint
    check: "The account has no other Subscription whose status is ACTIVE or PAUSED."
    error_id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /sharpening/subscriptions"
    pre_empts: "rungs 45-57"
  - priority: 45
    category: business_constraint
    check: "No other ItemClassSpec already declares this item_class."
    error_id: ERR_DUPLICATE_ITEM_CLASS_SPEC
    http_status: 409
    applies_to: "POST /sharpening/item-class-specs"
    pre_empts: "rungs 46-57"
  - priority: 46
    category: business_constraint
    check: "No other BenchDay already declares this bench_date."
    error_id: ERR_DUPLICATE_BENCH_DAY
    http_status: 409
    applies_to: "POST /sharpening/bench-days"
    pre_empts: "rungs 47-57"
  - priority: 47
    category: business_constraint
    check: "The account has no other Invoice with status DRAFT."
    error_id: ERR_DUPLICATE_DRAFT_INVOICE
    http_status: 409
    applies_to: "POST /sharpening/invoices"
    pre_empts: "rungs 48-57"
  - priority: 48
    category: business_constraint
    check: "Every ServiceRequest the invoice would cover has billing_status UNBILLED."
    error_id: ERR_DUPLICATE_INVOICE
    http_status: 409
    applies_to: "POST /sharpening/invoices"
    pre_empts: "rungs 49-57"
  - priority: 49
    category: business_constraint
    check: "The compartment candidate pool of calculations.compartment_assignment_selector is non-empty after steps 1-3."
    error_id: ERR_NO_AVAILABLE_COMPARTMENT
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/locker-assign"
    pre_empts: "rungs 50-57"
  - priority: 50
    category: business_constraint
    check: "The receiving-run candidate pool of calculations.next_eligible_run_selector is non-empty."
    error_id: ERR_NO_ELIGIBLE_RUN
    http_status: 409
    applies_to: "POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 51-57"
  - priority: 51
    category: business_constraint
    check: "The loaner candidate pool of calculations.loaner_unit_selector is non-empty."
    error_id: ERR_LOANER_STOCK_EXHAUSTED
    http_status: 409
    applies_to: "POST /sharpening/loaner-issues"
    pre_empts: "rungs 52-57"
  - priority: 52
    category: business_fiscal
    check: "RouteRun.scheduled_stop_count + 1 <= RouteRun.stop_cap."
    error_id: ERR_STOP_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sharpening/route-runs/{id}/stops, POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 53-57"
  - priority: 53
    category: business_fiscal
    check: "committed_minutes_provisional recomputed with the new stop is <= RouteRun.service_minute_budget; equality passes."
    error_id: ERR_RUN_MINUTES_EXCEEDED
    http_status: 409
    applies_to: "POST /sharpening/route-runs/{id}/stops, POST /sharpening/route-stops/{id}/reschedule"
    pre_empts: "rungs 54-57"
  - priority: 54
    category: business_fiscal
    check: "BenchDay.booked_minutes + the request's incoming declared minutes is <= BenchDay.bench_minute_budget; equality passes."
    error_id: ERR_BENCH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sharpening/service-requests/{id}/bench-intake"
    pre_empts: "rungs 55-57"
  - priority: 55
    category: business_fiscal
    check: "The invoice has at least one InvoiceLine."
    error_id: ERR_EMPTY_INVOICE
    http_status: 409
    applies_to: "POST /sharpening/invoices, POST /sharpening/invoices/{id}/issue"
    pre_empts: "rungs 56-57"
  - priority: 56
    category: business_fiscal
    check: "Payment.amount_cents <= Invoice.amount_due_cents + PAYMENT_OVERPAY_TOLERANCE_CENTS."
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /sharpening/invoices/{id}/payments"
    pre_empts: "rung 57"
  - priority: 57
    category: auth
    check: "The access_code supplied equals LockerCompartment.access_code. Deliberately the LAST rung: on a compartment whose hold has already expired the hold check at rung 21 wins even when the code is also wrong."
    error_id: ERR_ACCESS_CODE_INVALID
    http_status: 403
    applies_to: "POST /sharpening/locker-compartments/{id}/deposit, POST /sharpening/locker-compartments/{id}/release"
    pre_empts: "nothing; last rung"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every path parameter is literally named {id} and refers to the resource named
# by the segment immediately before it.
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock --------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z (DEFAULT_CLOCK_UTC) and never falls back to wall-clock time. The clock may only move forward."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "every subsequent expiry, window and date computation reads the new value"

