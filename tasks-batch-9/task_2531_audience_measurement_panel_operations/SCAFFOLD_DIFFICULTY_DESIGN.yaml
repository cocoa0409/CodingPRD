              payload: { meter_id: "${mtm1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
