              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dn1: $.data.id }
            - call: "POST /r2t4/disbursements/${dn1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${en}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { ln: $.data.id }
            - call: "POST /r2t4/awards/${ln}/accept"
              payload: {}
              as: Student
              as_user_id: "${sn}"
            - call: "POST /r2t4/awards/${ln}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { dn2: $.data.id }
            - call: "POST /r2t4/disbursements/${dn2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${en}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cn: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${cn}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { cn_v: $.data.version, cn_earned: $.data.aid_earned_cents, cn_unearned: $.data.aid_unearned_cents, cn_disb: $.data.aid_disbursable_cents }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cn}/recalculate"
              payload: { expected_withdrawal_case_version: "${cn_v}", notification_date: "2026-10-25" }
              as: FinancialAidOfficer
