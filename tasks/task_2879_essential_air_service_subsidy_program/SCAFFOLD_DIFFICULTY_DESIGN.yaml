            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${rep_sol_id}", carrier_id: "${car2_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1650000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car2_id}"
              captures: { prep_id: $.data.id }
