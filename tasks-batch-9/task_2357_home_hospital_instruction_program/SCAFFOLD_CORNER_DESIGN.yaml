            - "Third report: service_gap_minutes 750 >= 390 so funding_status is \"HELD\" again — the threshold re-arms every completed week rather than latching once."
            - "provisional_apportionment_minutes is 30 on every report after the log (one DELIVERED session at credited 30, well under the 1950 window cap)."

      - name: both_apportionment_variants_are_exercised_on_identical_session_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.case_apportionment_minutes
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / provisional_accrual_vs_final_verified_apportionment_diverge_on_weekly_cap"
          rationale: |
            The §1.8 instance already drives one case's sessions through both PROVISIONAL_ACCRUAL and
            FINAL_VERIFIED and pins the delta produced by the per-ISO-week cap and the verification
            filter, which is exactly the layer claim (both variants produce expected results, delta on
            switch is correct). A §1.9 duplicate would add no new coverage.

      - name: the_allocation_derived_fields_are_recomputed_after_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.assignment_minute_allocation
          - calculations.teacher_committed_minutes
          - complexity_profile.complexity_layers[derived_field_reconciliation]
        excluded_because:
          difficulty_instance: "compensating_invariant / support_assignment_release_returns_every_minute_to_the_primary_row_and_zeroes_the_teacher"
          rationale: |
            The §1.8 instance already checks the derived allocation after the source row is created,
            after it is accepted and after it is released, including the re-summed
            Teacher.committed_weekly_minutes on both teachers — the full create/update/remove triad
            the layer asks for.

  - section: consistency_model
