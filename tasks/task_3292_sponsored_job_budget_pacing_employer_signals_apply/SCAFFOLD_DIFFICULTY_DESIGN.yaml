              as: Employer
              as_user_id: "${emp_pr}"
              captures: { sj_pr: $.data.id }
            - call: "GET /api/campaigns/${camp_pr}"
              payload: {}
              as: Employer
              as_user_id: "${emp_pr}"
              captures: { camp_pr_v: $.data.version }
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_pr}", sponsored_job_id: "${sj_pr}", event_type: "CLICK", device_fingerprint: "fp-pr-1", ip_hash: "ip-pr-1", expected_campaign_version: "${camp_pr_v}" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_pr}"
