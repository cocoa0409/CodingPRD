              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { mcs_a: $.data.cycles_since_service }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { pov_a: $.data.version }
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { d_fu1: "$.data[0].id", d_fu2: "$.data[1].id" }
            - call: "GET /molds/${mold}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { mcs_b: $.data.cycles_since_service }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { pov_b: $.data.version }
          assert:
            - "the demould returns 200 with status 'DEMOLDED' and actual_cooling_end_at '2026-08-01T10:35:00Z'"
            - "GET /finished-units?molding_cycle_id=${cyc} returns total_count 2 — one hull per cavity — and both rows carry build_status 'DEMOLDED', logistics_status 'UNALLOCATED', product_model_id ${pm} and a non-empty hull_serial"
            - "${mcs_a} == 0 and ${mcs_b} == 1: the counter rises by exactly one per demoulded cycle, and Mold.${mold}.status is back to 'AVAILABLE'"
            - "ResinLot.${lot} still reports available_kg 476.000, reserved_kg 0.000 and consumed_kg 24.000: the demould moves no resin because the charge was consumed at oven start"
            - "${pov_b} == ${pov_a} + 1, ProductionOrder.${po}.status == 'IN_PRODUCTION' and completed_qty == 0, because a DEMOLDED hull is not yet SELLABLE"
            - "GET /molding-cycles/${cyc} reports scheduled_cooling_minutes 30 and an actual cooling span of 35 minutes, so ERR_COOLING_TIME_INSUFFICIENT never applies"
            - "FinishedUnit.${d_fu1}.is_zone_anchor is false and warehouse_id is null on both hulls: the demould cascade does not store anything"

      - name: layer_dual_variant_calculation_oven_window_same_arm_versus_different_arm_same_station
        claim_type: dual_variant_calculation
