            - "response error_id == ERR_REFERRAL_LINKED_COMPENSATION with HTTP 422"
            - "the response is not ERR_STARK_EXCEPTION_REQUIRED (422)"
            - "CompensationPlan.${plan_id}.status == DRAFT and returned_count == 0 — a refused submission is not a return"
            - "the plan is storable in DRAFT with both defects, so the rules bite on submission rather than on creation"
            - "a sibling plan with includes_referral_credit false and stark_exception NONE does report ERR_STARK_EXCEPTION_REQUIRED (422) on submission"
            - "Acquisition.${acq_id}.compliance_clearance cannot be moved PENDING -> CLEARED while ${plan_id} exists: that request also returns ERR_REFERRAL_LINKED_COMPENSATION (422)"

