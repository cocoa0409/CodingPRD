            - "pay_status == UNPAID  (reverted)"
            - "outstanding == 0  (VOID invoices leave the balance)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: customer_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset window over 3 customers: page 1 returns 2 rows with total_count 3 and has_more true; page 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["three customers created"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EP1", name: "P1" }
              as: CounterRep
            - call: "POST /customers"
              payload: { account_no: "ACC-EP2", name: "P2" }
              as: CounterRep
            - call: "POST /customers"
              payload: { account_no: "ACC-EP3", name: "P3" }
              as: CounterRep
          trigger:
            - call: "GET /customers"
              payload: { limit: 2, offset: 0 }
              as: CounterRep
            - call: "GET /customers"
              payload: { limit: 2, offset: 2 }
              as: CounterRep
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: orders_filtered_by_customer_returns_only_their_orders
        claim_type: listing
        grounds: [endpoints, entities.Order.fields.customer_id]
        distinguishing_aspect: "Filtered list GET /orders?customer_id=X returns exactly X's orders (FK reverse-reachability), not other customers'."
        test_recipe:
          setup: ["customers A and B; one order each"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EP4", name: "A Co", terms: "CASH" }
              as: CounterRep
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { account_no: "ACC-EP5", name: "B Co", terms: "CASH" }
              as: CounterRep
              captures: { cb: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-EP1", name: "Crate", category: "HARDGOOD", retail_price_cents: 100 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 4 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${ca}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oa: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cb}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
