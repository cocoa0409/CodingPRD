            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "G1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
