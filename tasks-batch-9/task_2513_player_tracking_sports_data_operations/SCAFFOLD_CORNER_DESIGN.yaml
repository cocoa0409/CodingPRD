        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.venue_data_posture
          - calculations.event_tag_quality_index
        distinguishing_aspect: |
          The consistency model is immediate, so no read-after-write lag is tolerated anywhere: the
          calibration-run response already carries its verdict, the certify response already shows CERTIFIED,
          and the accept response's sibling reads show the game census, quality index and certification
          dimension already recomputed in the same request cycle - the follow-up GETs must return byte-equal
          derived values, never a stale snapshot that "settles" later.
