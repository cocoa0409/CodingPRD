  - section: validations
    instances:

      - name: plan_and_metric_band_field_rules_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_50
          - validations.priority_51
          - validations.priority_52
          - errors.ERR_PLAN_WEIGHTS_INVALID
          - errors.ERR_PLAN_PERIOD_INVALID
          - errors.ERR_METRIC_BAND_INVALID
        distinguishing_aspect: |
          Three field-level business rules that survive the 400-level shape check:
          weights that sum to 90.00 (each individually well-formed), a period whose
          end precedes its start, and a metric band with threshold >= target. All
          three are 422s with their own error ids — not ERR_INVALID_REQUEST — and
          none of the three rows is persisted.
        test_recipe:
          setup:
            - "One valid plan exists so that the metric-band attempt has a live parent."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Field Rules Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Bad Weights Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 10.00 }
              as: PlanAdmin
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Bad Period Plan", plan_period_start: "2026-01-01", plan_period_end: "2025-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 1000, target_value: 900, max_value: 1200 }
              as: PlanAdmin
          assert:
            - "Weights attempt: HTTP 422, error_id == ERR_PLAN_WEIGHTS_INVALID (50.00 + 30.00 + 10.00 == 90.00)"
            - "Period attempt: HTTP 422, error_id == ERR_PLAN_PERIOD_INVALID"
            - "Metric attempt: HTTP 422, error_id == ERR_METRIC_BAND_INVALID"
            - "No attempt returns ERR_INVALID_REQUEST"
            - "GET /bonus-plans?plan_year=2026 returns total_count == 1"
            - "GET /bonus-plans/${plan_id}/company-metrics returns total_count == 0"

      - name: eligibility_event_temporal_and_referential_rules_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_85
          - validations.priority_86
          - validations.priority_88
          - validations.priority_103
          - errors.ERR_EVENT_DATE_OUTSIDE_PLAN_PERIOD
          - errors.ERR_EVENT_DATE_BEFORE_HIRE
          - errors.ERR_PARTICIPANT_ALREADY_TERMINATED
          - errors.ERR_SUPERSEDES_EVENT_INVALID
        distinguishing_aspect: |
          Four event rules on one participant, in the order the ladder decides
          them. 2027-01-01 equals plan_period_end and is therefore OUTSIDE the
          half-open window (a closed-interval reading accepts it). 2026-01-15
          precedes the 2026-02-01 hire date. After the accepted 2026-09-30
          TERMINATION, both a later LEAVE and a second non-superseding TERMINATION
          (even one dated EARLIER, 2026-08-31) are refused. The last attempt is
          dated before the termination so priority 88 cannot fire, isolating
          priority 103: supersedes_event_id points at ANOTHER participant's event.
        test_recipe:
          setup:
            - "One unit, one plan 2026-01-01..2027-01-01, participant A hired 2026-02-01, participant B hired 2025-01-01 with one recorded LEAVE."
          setup_api_calls:
