      - name: derived_counters_and_ledger_totals_reconcile_after_a_soft_delete
        claim_type: derived_field_reconciliation
        grounds:
          - entities.LateralQuestionnaire.fields.entry_count
          - entities.ClientBookEntry.fields.verified_record_count
          - entities.PortabilityAssessment.fields.validated_portable_total_usd
          - entities.PortabilityAssessment.fields.declined_portable_total_usd
          - complexity_layers.derived_field_reconciliation
        distinguishing_aspect: |
          Four derived numbers on three aggregates are maintained by increments and
          decrements rather than by re-counting, so they drift silently: entry_count moves in
          both directions on the same collection, verified_record_count must count only
          VERIFIED HISTORICAL rows inside the lookback window, and the assessment's ledger
          must satisfy validated + declined == gross exactly. The probe reads entry_count
          BEFORE and AFTER the withdrawal in the same recipe and then values the book, so a
          decrement that fires twice, or a valuation that still sees the withdrawn row, is
          caught by arithmetic rather than by a status check.
