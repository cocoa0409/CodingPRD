# =============================================================================
# Task 1832 — Pasta & Dry-Goods Manufacturing — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  1832. Pasta & Dry-Goods Manufacturing (pasta manufacturer): recipe & semolina lot quality, extrusion die & shape changeover, drying curve & moisture target, packaging line & case configuration, private-label vs branded runs, gluten-free line segregation & testing, shelf-life & pest control in warehouse, ingredient contract & price index

domain_name: pasta-dry-goods-manufacturing
api_prefix: ""

complexity_profile:
  primary_archetype: "Posture-driven gating"
  # ProductionLine.gluten_posture and WarehouseZone.pest_posture are derived
  # aggregate states that gate all child operations (run starts, put-away,
  # release); cascaded freezes flow zone -> lot -> run.
  secondary_archetype: "Pricing engine"
  # IngredientContract settlement pricing: index-linked dual variants, volume
  # tiers with pinned evaluation order.
  complexity_layers:
    - optimistic_concurrency      # OCC on ProductionLine.version (run create) and ProductionRun.version (reschedule)
    - cascading_side_effects      # pest CRITICAL -> zone -> lots -> runs; lot re-reject -> runs -> jobs -> lots
    - dual_variant_calculation    # semolina grade (certificate vs lab); settlement price (INDEX_LAGGED vs SPOT_BLEND)
    - rate_threshold_triggers     # drying stage fractions, wear tiers, volume tiers, grade thresholds
  entity_topology: flat           # peer entities joined by foreign keys in request bodies; no nested creation paths
  state_machine_shape: parallel   # ProductionRun carries two independent state dimensions (production_status x quality_disposition); line/drying/zone are cyclic; compound gating on children
  relationship_patterns:
    - one_to_many                 # Contract -> IndexReadings/Lots; Recipe -> Ingredients; Run -> DryingSession/PackagingJob
    - many_to_many                # Recipe <-> ingredient types via RecipeIngredient junction rows
    - polymorphic                 # GlutenTest.subject: (LINE_SWAB -> line_id) | (PRODUCT_TEST -> run_id)
    - cross_aggregate             # FinishedGoodsLot references PackagingJob, ProductionRun, WarehouseZone
  role_model: segregation_of_duties  # recorder != verifier on tests/inspections; creator != approver on recipes/lots
  consistency_model: immediate    # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: IngredientContract
    parent: null
    common_fields: true
    fields:
      - { name: contract_code, type: string, source: input, description: "Unique human contract code" }
      - { name: supplier_name, type: string, source: input, description: "Supplier legal name" }
      - { name: ingredient_type, type: enum, source: input, description: "SEMOLINA | DURUM_SEMOLINA | RICE_FLOUR" }
      - { name: base_price_cents_per_kg, type: integer, source: input, description: "Base unit price in cents per kg before index adjustment and tier discount" }
      - { name: reference_index_value, type: number, source: input, description: "Index level the base price is pegged to; must be > 0" }
      - { name: pricing_method, type: enum, source: input, description: "INDEX_LAGGED | SPOT_BLEND — selects settlement price variant" }
      - { name: effective_start, type: string, source: input, description: "First delivery date covered (YYYY-MM-DD), inclusive" }
      - { name: effective_end, type: string, source: input, description: "Last delivery date covered (YYYY-MM-DD), inclusive; must be > effective_start" }
      - { name: cumulative_delivered_kg, type: number, source: system, default: 0, description: "Running delivered kg across accepted receipts; drives volume tier" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED | EXPIRED (EXPIRED is a lazy system transition when current date passes effective_end)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD tracking)" }

  - name: PriceIndexReading
    parent: IngredientContract
    common_fields: false   # append-only event log: id + created_at only; immutable
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> IngredientContract.id; owning contract (path)" }
      - { name: effective_date, type: string, source: input, description: "Date the reading is effective (YYYY-MM-DD); unique per contract" }
      - { name: index_value, type: number, source: input, description: "Published index value; must be > 0" }

  - name: SemolinaLot
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> IngredientContract.id; pricing + quality terms source" }
      - { name: delivery_date, type: string, source: input, description: "Goods receipt date (YYYY-MM-DD); must fall inside contract window" }
      - { name: received_weight_kg, type: number, source: input, description: "Delivered gross weight; must be > 0" }
      - { name: remaining_weight_kg, type: number, source: system, description: "Initialized to received_weight_kg; decremented at run MIXING, refunded on abort from MIXING" }
      - { name: consumed_kg, type: number, source: system, default: 0, description: "Net consumed kg; invariant received == remaining + consumed" }
      - { name: cert_protein_pct, type: number, source: input, description: "Supplier certificate protein %" }
      - { name: cert_moisture_pct, type: number, source: input, description: "Supplier certificate moisture %" }
      - { name: cert_gluten_index, type: number, source: input, description: "Supplier certificate gluten quality index 0-100" }
      - { name: cert_falling_number_s, type: number, source: input, description: "Supplier certificate falling number (seconds)" }
      - { name: lab_protein_pct, type: number, source: input, default: null, description: "Lab-measured protein % (via lab-results)" }
      - { name: lab_moisture_pct, type: number, source: input, default: null, description: "Lab-measured moisture %" }
      - { name: lab_gluten_index, type: number, source: input, default: null, description: "Lab-measured gluten index 0-100" }
      - { name: lab_falling_number_s, type: number, source: input, default: null, description: "Lab-measured falling number" }
      - { name: cert_grade_score, type: number, source: computed, description: "Grade score from certificate values (semolina_grade CERTIFICATE variant)" }
      - { name: cert_grade, type: enum, source: computed, description: "GRADE_A | GRADE_B | GRADE_REJECT from cert_grade_score" }
      - { name: lab_grade_score, type: number, source: computed, default: null, description: "Grade score from lab values (LAB variant); null until lab-results" }
      - { name: lab_grade, type: enum, source: computed, default: null, description: "GRADE_A | GRADE_B | GRADE_REJECT from lab_grade_score" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Settlement unit price computed at receipt (contract_settlement_price)" }
      - { name: total_price_cents, type: integer, source: computed, description: "unit_price_cents * received_weight_kg, rounded half-up to integer cents" }
      - { name: status, type: enum, source: system, description: "QUARANTINED -> ACCEPTED | REJECTED; ACCEPTED -> QUARANTINED (retest loop via lab-results); ACCEPTED -> DEPLETED (auto at zero stock)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of receiving user (SoD tracking)" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: recipe_name, type: string, source: input, description: "Product name" }
      - { name: brand_type, type: enum, source: input, description: "BRANDED | PRIVATE_LABEL" }
      - { name: customer_name, type: string, source: input, default: null, description: "Private-label customer; required iff brand_type == PRIVATE_LABEL, forbidden otherwise" }
      - { name: shape_family, type: enum, source: input, description: "LONG_CUT | SHORT_CUT | SPECIALTY" }
      - { name: gluten_free, type: boolean, source: input, description: "True => run requires GF_VALIDATED line and product testing" }
      - { name: target_moisture_pct, type: number, source: input, description: "Final moisture pass threshold (inclusive)" }
      - { name: drying_curve, type: enum, source: input, description: "STANDARD | HIGH_TEMP | LOW_TEMP; selects stage table" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from production_date to expiry_date; > 0" }
      - { name: min_remaining_shelf_life_pct, type: number, source: input, default: null, description: "Required iff PRIVATE_LABEL: minimum fraction of shelf life remaining at release (0-1, inclusive boundary passes)" }
      - { name: unit_weight_g, type: number, source: input, description: "Weight of one saleable unit in grams; > 0" }
      - { name: units_per_case, type: integer, source: input, description: "Nominal units per case (before weight cap); > 0" }
      - { name: case_weight_limit_kg, type: number, source: input, description: "Gross weight cap per case; > 0" }
      - { name: cases_per_pallet, type: integer, source: input, description: "Cases per pallet; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> RETIRED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD: approver must differ)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver" }

  - name: RecipeIngredient
    parent: Recipe
    common_fields: false   # junction rows created with the recipe; immutable
    fields:
      - { name: recipe_id, type: string, source: system, description: "FK -> Recipe.id; owning recipe (path)" }
      - { name: ingredient_type, type: enum, source: input, description: "SEMOLINA | DURUM_SEMOLINA | RICE_FLOUR" }
      - { name: percentage, type: number, source: input, description: "Formula percentage; recipe approve requires all rows to sum to exactly 100.00" }
      - { name: min_protein_pct, type: number, source: input, default: null, description: "Minimum lab protein % a consuming semolina lot must meet (checked at run MIXING for SEMOLINA rows)" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_name, type: string, source: input, description: "Line identifier" }
      - { name: gluten_posture, type: enum, source: system, description: "GLUTEN_EXPOSED (initial) -> CLEANING_IN_PROGRESS -> AWAITING_SWAB -> GF_VALIDATED -> GLUTEN_EXPOSED (cyclic); swab FAIL loops AWAITING_SWAB -> CLEANING_IN_PROGRESS" }
      - { name: cleaning_completed_at, type: datetime, source: system, default: null, description: "Timestamp of last complete-cleaning; swab recency gate" }

  - name: ExtrusionDie
    parent: null
    common_fields: true
    fields:
      - { name: die_code, type: string, source: input, description: "Die identifier" }
      - { name: shape_family, type: enum, source: input, description: "LONG_CUT | SHORT_CUT | SPECIALTY" }
      - { name: rated_capacity_kg, type: number, source: input, description: "Lifetime extrusion capacity before mandatory refurbishment; > 0" }
      - { name: extruded_kg, type: number, source: system, default: 0, description: "Cumulative extruded kg; reset to 0 by complete-cleaning with refurbish=true" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> MOUNTED -> IN_CLEANING -> AVAILABLE (cyclic); IN_CLEANING -> RETIRED (auto when not refurbished and extruded_kg >= rated_capacity_kg)" }
      - { name: mounted_line_id, type: string, source: system, default: null, description: "FK -> ProductionLine.id; set while MOUNTED" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id" }
      - { name: semolina_lot_id, type: string, source: input, description: "FK -> SemolinaLot.id; single-lot traceability" }
      - { name: pinned_recipe_version, type: integer, source: system, description: "Recipe.version captured at creation; MIXING requires it to still match" }
      - { name: planned_input_kg, type: number, source: input, description: "Semolina kg the run will consume; > 0" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO8601); must be >= current clock and < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO8601); must be > scheduled_start" }
      - { name: changeover_minutes, type: integer, source: computed, description: "Computed at create/reschedule from predecessor run, die wear, allergen transition (changeover_minutes calc)" }
      - { name: gluten_free, type: boolean, source: system, description: "Copied from recipe at creation" }
      - { name: brand_type, type: enum, source: system, description: "Copied from recipe at creation" }
      - { name: actual_yield_kg, type: number, source: system, default: null, description: "Set at DRYING -> PACKAGING advance; <= planned_input_kg" }
      - { name: actual_started_at, type: datetime, source: system, default: null, description: "Clock timestamp when MIXING began" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock timestamp at COMPLETED" }
      - { name: production_status, type: enum, source: system, description: "SCHEDULED -> MIXING -> EXTRUDING -> DRYING -> PACKAGING -> COMPLETED; any non-terminal -> ABORTED" }
      - { name: quality_disposition, type: enum, source: system, description: "Independent dimension: PENDING_QA -> RELEASED | HELD; HELD -> RELEASED | REJECTED; PENDING_QA -> REJECTED. Evolves independently of production_status." }

  - name: DryingSession
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; created by advance into DRYING" }
      - { name: drying_curve, type: enum, source: system, description: "Copied from recipe: STANDARD | HIGH_TEMP | LOW_TEMP" }
      - { name: initial_moisture_pct, type: number, source: input, description: "Moisture at extrusion exit; supplied on the advance hop into DRYING" }
      - { name: target_moisture_pct, type: number, source: system, description: "Copied from recipe" }
      - { name: redry_count, type: integer, source: system, default: 0, description: "Number of FAILED -> IN_PROGRESS redry loops" }
      - { name: required_hours, type: integer, source: computed, description: "curve total hours + REMEDIAL_HOURS * redry_count (REMEDIAL_HOURS = 4)" }
      - { name: drying_started_at, type: datetime, source: system, description: "Clock timestamp when session entered IN_PROGRESS" }
      - { name: latest_inline_moisture_pct, type: number, source: computed, default: null, description: "Projected moisture at last inline reading (drying_moisture_projection)" }
      - { name: latest_lab_moisture_pct, type: number, source: input, default: null, description: "Lab oven-dry moisture from lab-results" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS -> AWAITING_LAB -> CONFIRMED | FAILED; FAILED -> IN_PROGRESS (redry loop)" }

  - name: PackagingJob
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; created by advance into PACKAGING" }
      - { name: status, type: enum, source: system, description: "CREATED -> LABEL_VERIFIED -> COMPLETED; CREATED -> COMPLETED (BRANDED only); CREATED | LABEL_VERIFIED -> BLOCKED | CANCELLED" }
      - { name: actual_yield_kg, type: number, source: system, description: "Copied from run at creation" }
      - { name: total_units, type: integer, source: computed, description: "floor(actual_yield_kg * 1000 / unit_weight_g)" }
      - { name: units_per_case, type: integer, source: computed, description: "min(recipe.units_per_case, floor(case_weight_limit_kg * 1000 / unit_weight_g))" }
      - { name: full_case_count, type: integer, source: computed, description: "floor(total_units / units_per_case)" }
      - { name: partial_case_count, type: integer, source: computed, description: "1 iff BRANDED and remainder >= PARTIAL_CASE_MIN_UNITS (6); else 0" }
      - { name: scrapped_units, type: integer, source: computed, description: "remainder units not cased (PRIVATE_LABEL always scraps remainder)" }
      - { name: case_count, type: integer, source: computed, description: "full_case_count + partial_case_count" }
      - { name: pallet_count, type: integer, source: computed, description: "ceil(case_count / cases_per_pallet)" }
      - { name: labels_verified_by_user_id, type: string, source: system, default: null, description: "QAManager who verified private-label artwork/case labels" }

  - name: FinishedGoodsLot
    parent: null
    common_fields: true
    fields:
      - { name: packaging_job_id, type: string, source: system, description: "FK -> PackagingJob.id; created at job completion" }
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; denormalized for cascade walks" }
      - { name: zone_id, type: string, source: system, default: null, description: "FK -> WarehouseZone.id; set by put-away" }
      - { name: production_date, type: string, source: system, description: "Date (YYYY-MM-DD) the run reached COMPLETED" }
      - { name: expiry_date, type: string, source: computed, description: "production_date + recipe.shelf_life_days" }
      - { name: case_count, type: integer, source: system, description: "Cases in this lot (from job)" }
      - { name: pallet_count, type: integer, source: system, description: "Pallets in this lot (from job)" }
      - { name: unit_count, type: integer, source: system, description: "Cased units = full_case_count*units_per_case + (partial_case_count==1 ? remainder : 0)" }
      - { name: gluten_free, type: boolean, source: system, description: "Copied from run (zone segregation gate)" }
      - { name: brand_type, type: enum, source: system, description: "Copied from run (shelf-life release gate)" }
      - { name: status, type: enum, source: system, description: "CREATED -> STORED -> RELEASED; STORED -> BLOCKED (cascade); BLOCKED -> STORED (conditional release); STORED -> EXPIRED (lazy sweep past expiry_date); STORED | BLOCKED -> REJECTED (run quality reject)" }

  - name: WarehouseZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_name, type: string, source: input, description: "Zone identifier" }
      - { name: zone_type, type: enum, source: input, description: "GLUTEN_FREE | CONVENTIONAL" }
      - { name: capacity_pallets, type: integer, source: input, description: "Max pallets storable; > 0" }
      - { name: pest_posture, type: enum, source: system, description: "CLEAR (initial) -> MONITORING (verified MINOR); MONITORING -> CLEAR (verified NONE); CLEAR | MONITORING -> QUARANTINED (verified CRITICAL); QUARANTINED -> CLEAR (lift-quarantine)" }
      - { name: quarantined_at, type: datetime, source: system, default: null, description: "Timestamp quarantine began; lift requires a verified NONE inspection recorded after this" }
      - { name: occupied_pallets, type: integer, source: computed, default: 0, description: "Sum of pallet_count over STORED lots in this zone" }

  - name: PestInspection
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> WarehouseZone.id" }
      - { name: severity, type: enum, source: input, description: "NONE | MINOR | CRITICAL" }
      - { name: notes, type: string, source: input, default: null, description: "Findings narrative" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording QATechnician" }
      - { name: status, type: enum, source: system, description: "RECORDED -> VERIFIED (verify applies posture effects)" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "QAManager verifier; must differ from recorder (SoD)" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Clock timestamp of verification" }

  - name: GlutenTest
    parent: null
    common_fields: true
    fields:
      - { name: test_type, type: enum, source: input, description: "LINE_SWAB (requires line_id) | PRODUCT_TEST (requires run_id)" }
      - { name: line_id, type: string, source: input, default: null, description: "FK -> ProductionLine.id; required iff LINE_SWAB, forbidden otherwise" }
      - { name: run_id, type: string, source: input, default: null, description: "FK -> ProductionRun.id; required iff PRODUCT_TEST, forbidden otherwise" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording QATechnician" }
      - { name: status, type: enum, source: system, description: "RECORDED -> VERIFIED (verify applies effects: line posture, run disposition)" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "QAManager verifier; must differ from recorder (SoD)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IngredientContract
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ingredient-contracts/{contractId}/activate"
        actor: PlantManager
        preconditions:
          - "Contract is DRAFT (ERR_INVALID_STATE)"
          - "effective_end > effective_start (ERR_INVALID_REQUEST)"
          - "effective_end >= current clock date (ERR_INVALID_REQUEST — cannot activate an already-lapsed window)"
          - "No other ACTIVE contract with same ingredient_type whose [effective_start, effective_end] closed interval intersects this one; both endpoints inclusive, so effective_end == other.effective_start IS a conflict (ERR_CONTRACT_WINDOW_OVERLAP)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ingredient-contracts/{contractId}/close"
        actor: ProcurementManager
        preconditions:
          - "Contract is ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["status -> CLOSED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy sweep: whenever a contract with status ACTIVE and effective_end < current clock date is read or referenced, it is EXPIRED)"
        actor: system
        preconditions: ["current clock date > effective_end"]
        side_effects: ["status -> EXPIRED"]

  - entity: SemolinaLot
    initial_state: QUARANTINED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: QUARANTINED
        to: QUARANTINED
        trigger: "POST /semolina-lots/{lotId}/lab-results (records/refreshes lab values)"
        actor: QATechnician
        preconditions:
          - "Lot is QUARANTINED (ERR_INVALID_STATE)"
        side_effects:
          - "lab_* fields set; lab_grade_score and lab_grade recomputed (semolina_grade LAB variant)"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "POST /semolina-lots/{lotId}/lab-results (retest loop)"
        actor: QATechnician
        preconditions:
          - "Lot is ACCEPTED (retest permitted; ERR_INVALID_STATE otherwise)"
        side_effects:
          - "lab_* fields overwritten; lab_grade_score and lab_grade recomputed"
          - "Lot remains usable-in-name only: runs referencing it are NOT yet affected (cascade fires only on reject)"
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /semolina-lots/{lotId}/accept"
        actor: QAManager
        preconditions:
          - "Lot is QUARANTINED (ERR_INVALID_STATE)"
          - "X-User-ID != lot.created_by_user_id (ERR_SOD_VIOLATION)"
          - "lab_grade is recorded (ERR_INVALID_REQUEST if no lab results)"
          - "lab_moisture_pct <= MOISTURE_SAFETY_CAP (15.0) (ERR_MOISTURE_CAP_EXCEEDED)"
          - "lab_grade != GRADE_REJECT (ERR_LOT_GRADE_BELOW_CONTRACT)"
        side_effects: ["status -> ACCEPTED"]
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /semolina-lots/{lotId}/reject"
        actor: QAManager
        preconditions:
          - "Lot is QUARANTINED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED"
          - "Cascade hop 1: every ProductionRun with semolina_lot_id == lot.id, production_status IN {SCHEDULED, MIXING, EXTRUDING, DRYING, PACKAGING}, quality_disposition == PENDING_QA -> quality_disposition = HELD"
          - "Cascade hop 2: for each run flipped to HELD in hop 1, its PackagingJob in status CREATED or LABEL_VERIFIED -> BLOCKED"
          - "Cascade hop 3: for each run flipped to HELD in hop 1, its FinishedGoodsLots in status CREATED or STORED -> BLOCKED (keyed on the run flip, independent of whether the job was still mutable)"
      - from: ACCEPTED
        to: DEPLETED
        trigger: "system (automatic when remaining_weight_kg reaches exactly 0 after consumption)"
        actor: system
        preconditions: ["remaining_weight_kg == 0"]
        side_effects: ["status -> DEPLETED"]

  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /recipes/{recipeId}/approve"
        actor: QAManager
        preconditions:
          - "Recipe is DRAFT (ERR_INVALID_STATE)"
          - "X-User-ID != recipe.created_by_user_id (ERR_SOD_VIOLATION)"
          - "Recipe has >= 1 RecipeIngredient and percentages sum to exactly 100.00 (ERR_RECIPE_FORMULA_INVALID)"
        side_effects: ["status -> APPROVED", "approved_by_user_id set"]
      - from: APPROVED
        to: APPROVED
        trigger: "POST /recipes/{recipeId}/amend"
        actor: PlantManager
        preconditions:
          - "Recipe is APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "target_moisture_pct replaced; version += 1 (existing runs keep their pinned_recipe_version and will fail MIXING with ERR_RECIPE_REVISION_STALE)"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /recipes/{recipeId}/retire"
        actor: PlantManager
        preconditions:
          - "Recipe is APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> RETIRED"
          - "Existing runs keep pinned_recipe_version; they will fail MIXING with ERR_RECIPE_NOT_APPROVED (status no longer APPROVED)"

  - entity: ProductionLine
    initial_state: GLUTEN_EXPOSED
    terminal_states: []
    transitions:
      - from: GLUTEN_EXPOSED
        to: CLEANING_IN_PROGRESS
        trigger: "POST /production-lines/{lineId}/start-cleaning"
        actor: ProductionOperator
        preconditions:
          - "Posture is GLUTEN_EXPOSED or GF_VALIDATED (ERR_INVALID_STATE)"
          - "No run on this line with production_status IN {MIXING, EXTRUDING, DRYING, PACKAGING} (ERR_INVALID_STATE)"
        side_effects: ["gluten_posture -> CLEANING_IN_PROGRESS", "line.version += 1"]
      - from: GF_VALIDATED
        to: CLEANING_IN_PROGRESS
        trigger: "POST /production-lines/{lineId}/start-cleaning (re-clean)"
        actor: ProductionOperator
        preconditions: ["Same as GLUTEN_EXPOSED -> CLEANING_IN_PROGRESS"]
        side_effects: ["gluten_posture -> CLEANING_IN_PROGRESS", "line.version += 1"]
      - from: CLEANING_IN_PROGRESS
        to: AWAITING_SWAB
        trigger: "POST /production-lines/{lineId}/complete-cleaning"
        actor: ProductionOperator
        preconditions:
          - "Posture is CLEANING_IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects: ["gluten_posture -> AWAITING_SWAB", "cleaning_completed_at = clock now", "line.version += 1"]
      - from: AWAITING_SWAB
        to: GF_VALIDATED
        trigger: "system (on GlutenTest LINE_SWAB verify with result PASS)"
        actor: system
        preconditions:
          - "Swab created_at >= line.cleaning_completed_at (ERR_STALE_SWAB otherwise)"
        side_effects: ["gluten_posture -> GF_VALIDATED", "line.version += 1"]
      - from: AWAITING_SWAB
        to: CLEANING_IN_PROGRESS
        trigger: "system (on GlutenTest LINE_SWAB verify with result FAIL)"
        actor: system
        preconditions:
          - "Swab created_at >= line.cleaning_completed_at (ERR_STALE_SWAB otherwise)"
        side_effects: ["gluten_posture -> CLEANING_IN_PROGRESS", "line.version += 1"]
      - from: GF_VALIDATED
        to: GLUTEN_EXPOSED
        trigger: "system (when a run whose recipe.gluten_free == false advances MIXING -> EXTRUDING on this line)"
        actor: system
        preconditions: []
        side_effects: ["gluten_posture -> GLUTEN_EXPOSED", "line.version += 1"]
        note: "If the posture is already GLUTEN_EXPOSED the flip is a no-op and line.version is NOT incremented."

  - entity: ExtrusionDie
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: MOUNTED
        trigger: "POST /extrusion-dies/{dieId}/mount"
        actor: ProductionOperator
        preconditions:
          - "Die is AVAILABLE (ERR_INVALID_STATE)"
          - "No other die with mounted_line_id == target line and status MOUNTED (ERR_INVALID_STATE)"
          - "No run on target line with production_status IN {MIXING, EXTRUDING, DRYING, PACKAGING} (ERR_INVALID_STATE)"
        side_effects: ["status -> MOUNTED", "mounted_line_id = line_id"]
      - from: MOUNTED
        to: IN_CLEANING
        trigger: "POST /extrusion-dies/{dieId}/unmount"
        actor: ProductionOperator
        preconditions:
          - "Die is MOUNTED (ERR_INVALID_STATE)"
          - "No run on its line with production_status IN {MIXING, EXTRUDING, DRYING, PACKAGING} (ERR_INVALID_STATE)"
        side_effects: ["status -> IN_CLEANING", "mounted_line_id = null"]
      - from: IN_CLEANING
        to: AVAILABLE
        trigger: "POST /extrusion-dies/{dieId}/complete-cleaning"
        actor: ProductionOperator
        preconditions:
          - "Die is IN_CLEANING (ERR_INVALID_STATE)"
          - "Not auto-retired: refurbish == true OR extruded_kg < rated_capacity_kg"
        side_effects: ["status -> AVAILABLE", "if refurbish == true: extruded_kg = 0"]
      - from: IN_CLEANING
        to: RETIRED
        trigger: "system (automatic at complete-cleaning when refurbish == false and extruded_kg >= rated_capacity_kg)"
        actor: system
        preconditions: ["extruded_kg >= rated_capacity_kg", "refurbish == false"]
        side_effects: ["status -> RETIRED"]

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      # --- production_status dimension ---
      - from: SCHEDULED
        to: MIXING
        trigger: "POST /production-runs/{runId}/advance"
        actor: ProductionOperator
        preconditions:
          - "production_status == SCHEDULED (ERR_INVALID_STATE)"
          - "Recipe still APPROVED (ERR_RECIPE_NOT_APPROVED)"
          - "Recipe.version == run.pinned_recipe_version (ERR_RECIPE_REVISION_STALE)"
          - "SemolinaLot.status == ACCEPTED (ERR_LOT_NOT_ACCEPTED)"
          - "For every RecipeIngredient row with min_protein_pct set and ingredient_type SEMOLINA: lot.lab_protein_pct >= min_protein_pct (ERR_LOT_QUALITY_INSUFFICIENT)"
          - "If run.gluten_free: line.gluten_posture == GF_VALIDATED (ERR_GF_SEGREGATION_VIOLATION)"
          - "clock now >= scheduled_start - changeover_minutes (ERR_INVALID_SCHEDULE)"
          - "lot.remaining_weight_kg >= planned_input_kg (ERR_INSUFFICIENT_LOT_WEIGHT)"
        side_effects:
          - "production_status -> MIXING; actual_started_at = now; run.version += 1"
          - "lot.remaining_weight_kg -= planned_input_kg; lot.consumed_kg += planned_input_kg"
          - "If lot.remaining_weight_kg == 0: lot.status -> DEPLETED"
      - from: MIXING
        to: EXTRUDING
        trigger: "POST /production-runs/{runId}/advance"
        actor: ProductionOperator
        preconditions:
          - "production_status == MIXING (ERR_INVALID_STATE)"
          - "A die with mounted_line_id == run.line_id and status MOUNTED exists (ERR_DIE_NOT_MOUNTED)"
          - "That die's shape_family == recipe.shape_family (ERR_DIE_SHAPE_MISMATCH)"
        side_effects:
          - "production_status -> EXTRUDING; run.version += 1"
          - "die.extruded_kg += run.planned_input_kg"
          - "If run.gluten_free == false: line.gluten_posture -> GLUTEN_EXPOSED; line.version += 1"
      - from: EXTRUDING
        to: DRYING
        trigger: "POST /production-runs/{runId}/advance (payload initial_moisture_pct required on this hop)"
        actor: ProductionOperator
        preconditions:
          - "production_status == EXTRUDING (ERR_INVALID_STATE)"
          - "initial_moisture_pct present in payload (ERR_INVALID_REQUEST)"
          - "If recipe.drying_curve == HIGH_TEMP and initial_moisture_pct > CRACK_RISK_MOISTURE (32.0): reject (ERR_CRACK_RISK)"
        side_effects:
          - "production_status -> DRYING; run.version += 1"
          - "Create DryingSession(status=IN_PROGRESS, drying_started_at=now, redry_count=0, required_hours=curve total)"
      - from: DRYING
        to: PACKAGING
        trigger: "POST /production-runs/{runId}/advance (payload actual_yield_kg required on this hop)"
        actor: ProductionOperator
        preconditions:
          - "production_status == DRYING (ERR_INVALID_STATE)"
          - "Run's DryingSession.status == CONFIRMED (ERR_INVALID_STATE)"
          - "actual_yield_kg present, > 0, and <= planned_input_kg (ERR_INVALID_REQUEST)"
        side_effects:
          - "production_status -> PACKAGING; run.actual_yield_kg set; run.version += 1"
          - "Create PackagingJob(status=CREATED) and compute case plan (case_plan calc)"
      - from: PACKAGING
        to: COMPLETED
        trigger: "POST /production-runs/{runId}/advance"
        actor: ProductionOperator
        preconditions:
          - "production_status == PACKAGING (ERR_INVALID_STATE)"
          - "Run's PackagingJob.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "production_status -> COMPLETED; completed_at = now; run.version += 1"
          - "Run's FinishedGoodsLots: production_date = date(now); expiry_date computed (shelf_life calc)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: ProductionOperator
        preconditions: ["production_status non-terminal (ERR_INVALID_STATE from COMPLETED/ABORTED)"]
        side_effects: ["production_status -> ABORTED; run.version += 1", "line.version += 1 (schedule released)"]
      - from: MIXING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: ProductionOperator
        preconditions: ["production_status non-terminal"]
        side_effects:
          - "production_status -> ABORTED; run.version += 1"
          - "Compensation: lot.remaining_weight_kg += planned_input_kg; lot.consumed_kg -= planned_input_kg"
          - "If lot was DEPLETED by this run's consumption: lot.status -> ACCEPTED"
      - from: EXTRUDING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: ProductionOperator
        preconditions: ["production_status non-terminal"]
        side_effects: ["production_status -> ABORTED; run.version += 1", "No lot refund (material already extruded)"]
      - from: DRYING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: ProductionOperator
        preconditions: ["production_status non-terminal"]
        side_effects: ["production_status -> ABORTED; run.version += 1", "DryingSession -> CANCELLED-equivalent: session left in its current state but run linkage dead; session not reusable"]
      - from: PACKAGING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: ProductionOperator
        preconditions:
          - "production_status non-terminal"
          - "PackagingJob.status != COMPLETED (ERR_INVALID_STATE — complete the run instead)"
        side_effects:
          - "production_status -> ABORTED; run.version += 1"
          - "PackagingJob in CREATED | LABEL_VERIFIED | BLOCKED -> CANCELLED"
      # --- quality_disposition dimension (independent) ---
      - from: PENDING_QA
        to: HELD
        trigger: "POST /production-runs/{runId}/quality-hold"
        actor: QAManager
        preconditions: ["quality_disposition == PENDING_QA (ERR_INVALID_STATE)"]
        side_effects: ["quality_disposition -> HELD; run.version += 1"]
      - from: PENDING_QA
        to: RELEASED
        trigger: "POST /production-runs/{runId}/quality-release"
        actor: QAManager
        preconditions:
          - "quality_disposition IN {PENDING_QA, HELD} (ERR_INVALID_STATE)"
          - "production_status == COMPLETED (ERR_INVALID_STATE)"
          - "If run.gluten_free: a VERIFIED GlutenTest PRODUCT_TEST with result PASS exists for this run (ERR_GLUTEN_TEST_REQUIRED)"
        side_effects:
          - "quality_disposition -> RELEASED; run.version += 1"
          - "Conditional cascade: run's FinishedGoodsLots in BLOCKED -> STORED iff their zone.pest_posture != QUARANTINED; else remain BLOCKED"
      - from: HELD
        to: RELEASED
        trigger: "POST /production-runs/{runId}/quality-release"
        actor: QAManager
        preconditions: ["Same as PENDING_QA -> RELEASED"]
        side_effects: ["Same as PENDING_QA -> RELEASED"]
      - from: PENDING_QA
        to: REJECTED
        trigger: "POST /production-runs/{runId}/quality-reject"
        actor: QAManager
        preconditions: ["quality_disposition IN {PENDING_QA, HELD} (ERR_INVALID_STATE)"]
        side_effects:
          - "quality_disposition -> REJECTED; run.version += 1"
          - "Run's FinishedGoodsLots in CREATED | STORED | BLOCKED -> REJECTED (frees zone occupancy)"
      - from: HELD
        to: REJECTED
        trigger: "POST /production-runs/{runId}/quality-reject"
        actor: QAManager
        preconditions: ["quality_disposition IN {PENDING_QA, HELD}"]
        side_effects: ["Same as PENDING_QA -> REJECTED"]

  - entity: DryingSession
    initial_state: IN_PROGRESS
    terminal_states: [CONFIRMED]
    transitions:
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /drying-sessions/{sessionId}/inline-readings"
        actor: ProductionOperator
        preconditions: ["status == IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects: ["latest_inline_moisture_pct = drying_moisture_projection(elapsed hours from drying_started_at to clock now)"]
      - from: IN_PROGRESS
        to: AWAITING_LAB
        trigger: "POST /drying-sessions/{sessionId}/finish"
        actor: ProductionOperator
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "elapsed hours >= required_hours (ERR_DRYING_INCOMPLETE)"
        side_effects: ["status -> AWAITING_LAB"]
      - from: AWAITING_LAB
        to: CONFIRMED
        trigger: "POST /drying-sessions/{sessionId}/lab-results with lab_moisture_pct <= target_moisture_pct (inclusive)"
        actor: QATechnician
        preconditions: ["status == AWAITING_LAB (ERR_INVALID_STATE)"]
        side_effects: ["status -> CONFIRMED", "latest_lab_moisture_pct set"]
      - from: AWAITING_LAB
        to: FAILED
        trigger: "POST /drying-sessions/{sessionId}/lab-results with lab_moisture_pct > target_moisture_pct"
        actor: QATechnician
        preconditions: ["status == AWAITING_LAB (ERR_INVALID_STATE)"]
        side_effects: ["status -> FAILED", "latest_lab_moisture_pct set"]
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /drying-sessions/{sessionId}/redry"
        actor: ProductionOperator
        preconditions: ["status == FAILED (ERR_INVALID_STATE)"]
        side_effects: ["status -> IN_PROGRESS", "redry_count += 1", "required_hours += REMEDIAL_HOURS (4); elapsed keeps accruing from original drying_started_at"]

  - entity: PackagingJob
    initial_state: CREATED
    terminal_states: [COMPLETED, CANCELLED, BLOCKED]
    transitions:
      - from: CREATED
        to: LABEL_VERIFIED
        trigger: "POST /packaging-jobs/{jobId}/verify-labels"
        actor: QAManager
        preconditions:
          - "status == CREATED (ERR_INVALID_STATE)"
          - "Run.brand_type == PRIVATE_LABEL (ERR_INVALID_STATE on BRANDED jobs)"
        side_effects: ["status -> LABEL_VERIFIED", "labels_verified_by_user_id = X-User-ID"]
      - from: CREATED
        to: COMPLETED
        trigger: "POST /packaging-jobs/{jobId}/complete"
        actor: ProductionOperator
        preconditions:
          - "status IN {CREATED, LABEL_VERIFIED} (ERR_INVALID_STATE)"
          - "If run.brand_type == PRIVATE_LABEL: status == LABEL_VERIFIED (ERR_LABEL_VERIFICATION_REQUIRED)"
        side_effects:
          - "status -> COMPLETED"
          - "Create FinishedGoodsLot(status=CREATED, case/pallet/unit counts from job)"
      - from: LABEL_VERIFIED
        to: COMPLETED
        trigger: "POST /packaging-jobs/{jobId}/complete"
        actor: ProductionOperator
        preconditions: ["status IN {CREATED, LABEL_VERIFIED}"]
        side_effects: ["Same as CREATED -> COMPLETED"]
      - from: CREATED
        to: CANCELLED
        trigger: "system (run abort from PACKAGING)"
        actor: system
        preconditions: []
        side_effects: ["status -> CANCELLED"]
      - from: LABEL_VERIFIED
        to: CANCELLED
        trigger: "system (run abort from PACKAGING)"
        actor: system
        preconditions: []
        side_effects: ["status -> CANCELLED"]
      - from: CREATED
        to: BLOCKED
        trigger: "system (semolina lot re-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> BLOCKED"]
      - from: LABEL_VERIFIED
        to: BLOCKED
        trigger: "system (semolina lot re-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> BLOCKED"]

  - entity: FinishedGoodsLot
    initial_state: CREATED
    terminal_states: [RELEASED, EXPIRED, REJECTED]
    transitions:
      - from: CREATED
        to: STORED
        trigger: "POST /finished-goods-lots/{lotId}/put-away"
        actor: WarehouseClerk
        preconditions:
          - "status == CREATED (ERR_INVALID_STATE)"
          - "zone.pest_posture != QUARANTINED (ERR_ZONE_QUARANTINED)"
          - "If lot.gluten_free: zone.zone_type == GLUTEN_FREE (ERR_ZONE_TYPE_MISMATCH)"
          - "zone.occupied_pallets + lot.pallet_count <= zone.capacity_pallets; equality allowed (ERR_ZONE_CAPACITY_EXCEEDED)"
        side_effects: ["status -> STORED", "zone_id set", "zone.occupied_pallets += lot.pallet_count"]
      - from: STORED
        to: RELEASED
        trigger: "POST /finished-goods-lots/{lotId}/release"
        actor: WarehouseClerk
        preconditions:
          - "status == STORED (ERR_INVALID_STATE)"
          - "zone.pest_posture != QUARANTINED (ERR_ZONE_QUARANTINED)"
          - "run.quality_disposition == RELEASED (ERR_RUN_QUALITY_NOT_RELEASED)"
          - "current clock date <= expiry_date (ERR_LOT_EXPIRED; release on the expiry date itself is allowed)"
          - "If lot.brand_type == PRIVATE_LABEL: (expiry_date - current date) / recipe.shelf_life_days >= recipe.min_remaining_shelf_life_pct (inclusive) (ERR_SHELF_LIFE_INSUFFICIENT)"
        side_effects: ["status -> RELEASED", "zone.occupied_pallets -= lot.pallet_count"]
      - from: STORED
        to: BLOCKED
        trigger: "system (pest CRITICAL cascade on its zone, or semolina re-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> BLOCKED"]
      - from: CREATED
        to: BLOCKED
        trigger: "system (semolina re-reject cascade hop 3)"
        actor: system
        preconditions: []
        side_effects: ["status -> BLOCKED"]
      - from: BLOCKED
        to: STORED
        trigger: "system (run quality-release conditional cascade, or zone lift-quarantine conditional cascade)"
        actor: system
        preconditions:
          - "Via lift-quarantine: lot.zone_id == zone AND run.quality_disposition == RELEASED"
          - "Via quality-release: lot.zone.pest_posture != QUARANTINED"
        side_effects: ["status -> STORED", "if lot has zone_id: zone.occupied_pallets += lot.pallet_count"]
      - from: STORED
        to: EXPIRED
        trigger: "system (lazy sweep on GET reads when current clock date > expiry_date)"
        actor: system
        preconditions: ["current clock date > expiry_date", "status == STORED"]
        side_effects: ["status -> EXPIRED", "zone.occupied_pallets -= lot.pallet_count"]
      - from: STORED
        to: REJECTED
        trigger: "system (run quality-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> REJECTED", "zone.occupied_pallets -= lot.pallet_count"]
      - from: BLOCKED
        to: REJECTED
        trigger: "system (run quality-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> REJECTED", "if lot has zone_id and was STORED before blocking: occupancy unchanged (BLOCKED lots keep occupying)"]
      - from: CREATED
        to: REJECTED
        trigger: "system (run quality-reject cascade)"
        actor: system
        preconditions: []
        side_effects: ["status -> REJECTED"]

  - entity: WarehouseZone
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: MONITORING
        trigger: "system (PestInspection verified with severity MINOR)"
        actor: system
        preconditions: []
        side_effects: ["pest_posture -> MONITORING"]
      - from: MONITORING
        to: CLEAR
        trigger: "system (PestInspection verified with severity NONE)"
        actor: system
        preconditions: []
        side_effects: ["pest_posture -> CLEAR"]
      - from: CLEAR
        to: QUARANTINED
        trigger: "system (PestInspection verified with severity CRITICAL)"
        actor: system
        preconditions: []
        side_effects:
          - "pest_posture -> QUARANTINED; quarantined_at = now"
          - "Cascade hop 1: zone lots with status STORED -> BLOCKED (they keep occupying pallets)"
          - "Cascade hop 2: for each lot blocked in hop 1, its run with quality_disposition == PENDING_QA -> HELD"
      - from: MONITORING
        to: QUARANTINED
        trigger: "system (PestInspection verified with severity CRITICAL)"
        actor: system
        preconditions: []
        side_effects: ["Same as CLEAR -> QUARANTINED"]
      - from: QUARANTINED
        to: CLEAR
        trigger: "POST /warehouse-zones/{zoneId}/lift-quarantine"
        actor: QAManager
        preconditions:
          - "pest_posture == QUARANTINED (ERR_INVALID_STATE)"
          - "A VERIFIED PestInspection with severity NONE and verified_at > zone.quarantined_at exists (ERR_QUARANTINE_LIFT_BLOCKED)"
        side_effects:
          - "pest_posture -> CLEAR; quarantined_at = null"
          - "Conditional cascade: zone lots in BLOCKED whose run.quality_disposition == RELEASED -> STORED; others remain BLOCKED"

  - entity: PestInspection
    initial_state: RECORDED
    terminal_states: [VERIFIED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /pest-inspections/{inspectionId}/verify"
        actor: QAManager
        preconditions:
          - "status == RECORDED (ERR_INVALID_STATE)"
          - "X-User-ID != recorded_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "status -> VERIFIED; verified_by_user_id, verified_at set"
          - "Applies zone posture effect per severity (see WarehouseZone transitions)"

  - entity: GlutenTest
    initial_state: RECORDED
    terminal_states: [VERIFIED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /gluten-tests/{testId}/verify"
        actor: QAManager
        preconditions:
          - "status == RECORDED (ERR_INVALID_STATE)"
          - "X-User-ID != recorded_by_user_id (ERR_SOD_VIOLATION)"
          - "If LINE_SWAB: test.created_at >= line.cleaning_completed_at AND line.gluten_posture == AWAITING_SWAB (ERR_STALE_SWAB)"
        side_effects:
          - "status -> VERIFIED; verified_by_user_id set"
          - "LINE_SWAB PASS: line.gluten_posture -> GF_VALIDATED; FAIL: -> CLEANING_IN_PROGRESS"
          - "PRODUCT_TEST FAIL: run.quality_disposition -> REJECTED (auto), cascading run's lots -> REJECTED"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /production-runs"
    occ_field: "expected_line_version"
    description: |
      Creating a ProductionRun against a ProductionLine whose version has
      advanced since the client last observed it is rejected. A prior run
      creation, cleaning action, or posture change on the same line mutates
      line.version, so the client's view of the line's schedule is stale.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
  - rule_id: run-reschedule-stale-version
    parent_entity: ProductionRun
    write_endpoint: "PATCH /production-runs/{runId}"
    occ_field: "expected_run_version"
    description: |
      Rescheduling a ProductionRun whose version has advanced since the client
      last observed it is rejected. Any advance, abort, quality action, or
      prior reschedule mutates run.version, so the client is rescheduling a
      schedule it has not seen.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: semolina_grade
    trigger: "lot receipt (CERTIFICATE variant, from cert_* fields) and lab-results submission (LAB variant, from lab_* fields)"
    algorithm: weighted_scoring
    formula: |
      protein_score  = clamp((protein_pct - 10.0) / 4.0 * 100, 0, 100)
      gluten_score   = clamp(gluten_index, 0, 100)
      falling_score  = clamp((falling_number_s - 200.0) / 200.0 * 100, 0, 100)
      moisture_score = clamp((16.0 - moisture_pct) / 6.0 * 100, 0, 100)
      grade_score = 0.40*protein_score + 0.25*gluten_score + 0.20*falling_score + 0.15*moisture_score
      grade: grade_score >= 70.0 -> GRADE_A; 50.0 <= grade_score < 70.0 -> GRADE_B; < 50.0 -> GRADE_REJECT
    input_set: "The lot's own certificate (cert_*) or laboratory (lab_*) measurements; no cross-lot data"
    constants:
      PROTEIN_FLOOR: 10.0
      PROTEIN_SPAN: 4.0
      FALLING_FLOOR_S: 200.0
      FALLING_SPAN_S: 200.0
      MOISTURE_CEIL: 16.0
      MOISTURE_SPAN: 6.0
      GRADE_A_MIN: 70.0
      GRADE_B_MIN: 50.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CERTIFICATE
        when: "Computed at POST /semolina-lots from cert_* inputs; provisional grade for intake triage"
        difference: "Uses supplier certificate values; stored as cert_grade_score / cert_grade"
      - name: LAB
        when: "Computed at POST /semolina-lots/{id}/lab-results from lab_* inputs; final grade for acceptance"
        difference: "Uses lab-measured values; stored as lab_grade_score / lab_grade; identical certificate and lab payloads converge, realistic drift diverges"

  - name: contract_settlement_price
    trigger: "POST /semolina-lots (goods receipt against an ACTIVE contract)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
      1. ratio: per pricing_method variant below, rounded to 4 decimal places, round_half_up
      2. tier: from contract.cumulative_delivered_kg BEFORE this delivery:
         cumulative < TIER2_MIN_KG -> tier 1 (discount 0.00)
         TIER2_MIN_KG <= cumulative < TIER3_MIN_KG -> tier 2 (discount 0.02)
         cumulative >= TIER3_MIN_KG -> tier 3 (discount 0.05)
         (boundary is inclusive: cumulative exactly == TIER2_MIN_KG yields tier 2)
      3. unit_price_cents = round_half_up(base_price_cents_per_kg * ratio * (1 - discount)) to integer cents
      4. total_price_cents = round_half_up(unit_price_cents * received_weight_kg) to integer cents
      5. contract.cumulative_delivered_kg += received_weight_kg (AFTER pricing)
    input_set: "The contract's PriceIndexReadings (all rows, any contract status)"
    constants:
      TIER2_MIN_KG: 20000
      TIER3_MIN_KG: 50000
      TIER2_DISCOUNT: 0.02
      TIER3_DISCOUNT: 0.05
      SPOT_BLEND_WINDOW_DAYS: 30
    precision: "ratio 4 dp round_half_up; money integer cents round_half_up"
    variants:
      - name: INDEX_LAGGED
        when: "contract.pricing_method == INDEX_LAGGED"
        difference: "ratio = index_value of the reading with the greatest effective_date <= first day of the delivery month / reference_index_value; if no such reading, ratio = 1.0000"
      - name: SPOT_BLEND
        when: "contract.pricing_method == SPOT_BLEND"
        difference: "ratio = mean(index_value) over readings with effective_date IN [delivery_date - 30 days, delivery_date] (both inclusive) / reference_index_value; if window empty, fall back to the reading with greatest effective_date before the window; if none, ratio = 1.0000"

  - name: changeover_minutes
    trigger: "POST /production-runs and PATCH /production-runs/{id} (schedule computation + overlap check)"
    algorithm: threshold
    formula: |
      predecessor = among ProductionRuns on the same line with production_status != ABORTED
                    and scheduled_end <= new.scheduled_start: the one with greatest scheduled_end;
                    tie-break: latest created_at. If none, predecessor = NONE.
      base = CHANGEOVER_BASE[predecessor.shape_family or NONE][new recipe.shape_family]:
             NONE->any: 45 | same family: 30 | LONG_CUT<->SHORT_CUT: 60 | any->SPECIALTY: 90 | SPECIALTY->any(except SPECIALTY): 75
      wear_adder on the die currently MOUNTED on the line (ratio = extruded_kg / rated_capacity_kg):
             ratio < 0.50 -> +0 | 0.50 <= ratio < 0.80 -> +15 | ratio >= 0.80 -> +40
             if no die mounted: +0
      allergen_adder: predecessor exists AND predecessor.gluten_free == true AND new run.gluten_free == false -> +20; else +0
      changeover_minutes = base + wear_adder + allergen_adder
      Overlap check (half-open buffered intervals): new occupancy [scheduled_start - changeover_minutes, scheduled_end)
      must not intersect any other non-ABORTED run R's occupancy [R.scheduled_start - R.changeover_minutes, R.scheduled_end)
      on the same line. Intersection test: new.start - new.changeover < R.end AND R.start - R.changeover < new.end.
      Adjacency is permitted (half-open: touching endpoints do not intersect).
    input_set: "Non-ABORTED ProductionRuns on the same line; mounted die; recipe shape families"
    constants:
      WEAR_TIER2: 0.50
      WEAR_TIER3: 0.80
      WEAR_ADDER_T2: 15
      WEAR_ADDER_T3: 40
      ALLERGEN_ADDER: 20
    precision: "integer minutes"
    variants: []

  - name: drying_moisture_projection
    trigger: "POST /drying-sessions/{id}/inline-readings"
    algorithm: decay_function
    formula: |
      Stage tables per drying_curve (duration_hours, moisture-removal fraction of (initial - target)):
        STANDARD:  [(6, 0.30), (8, 0.50), (4, 0.20)]   total 18
        HIGH_TEMP: [(3, 0.50), (4, 0.35), (2, 0.15)]   total 9
        LOW_TEMP:  [(9, 0.25), (18, 0.45), (9, 0.30)]  total 36
      Stage 3 duration is extended by REMEDIAL_HOURS (4) * redry_count.
      elapsed = hours from drying_started_at to clock now (fractional, 2dp).
      Walk stages in order: cumulative duration D_k, cumulative fraction F_k.
      If elapsed falls inside stage k (D_{k-1} <= elapsed < D_k):
        projected = initial - (initial - target) * (F_{k-1} + f_k * (elapsed - D_{k-1}) / d_k)
      Boundary: elapsed exactly == D_k counts as stage k COMPLETE (use F_k).
      If elapsed >= total required_hours: projected = target (floor).
      projected = max(projected, target).
    input_set: "The session's own initial_moisture_pct, target_moisture_pct, drying_curve, redry_count, drying_started_at"
    constants:
      REMEDIAL_HOURS: 4
      CRACK_RISK_MOISTURE: 32.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: INLINE_PROJECTED
        when: "Computed from the logical clock at each inline reading; provisional estimate"
        difference: "Piecewise-linear interpolation; may read above target even when the lab will pass"
      - name: LAB_FINAL
        when: "POST /drying-sessions/{id}/lab-results; authoritative"
        difference: "Pass iff lab_moisture_pct <= target_moisture_pct (inclusive boundary)"

  - name: case_plan
    trigger: "POST /production-runs/{id}/advance from DRYING to PACKAGING (PackagingJob creation)"
    algorithm: waterfall_allocation
    formula: |
      Rounding order is PINNED (per-level floor/ceil before aggregation):
      1. total_units = floor(actual_yield_kg * 1000 / unit_weight_g)
      2. units_per_case = min(recipe.units_per_case, floor(case_weight_limit_kg * 1000 / unit_weight_g))
         (weight cap applied FIRST — aggregating weight across the nominal case count instead
          would under-count cases and pallets)
      3. full_case_count = floor(total_units / units_per_case)
      4. remainder_units = total_units - full_case_count * units_per_case
      5. partial_case_count = 1 iff brand_type == BRANDED and remainder_units >= PARTIAL_CASE_MIN_UNITS; else 0
      6. scrapped_units = remainder_units if partial_case_count == 0 else 0
         (PRIVATE_LABEL always scraps the remainder — retailers require full cases only;
          remainder_units == 0 always yields partial_case_count == 0 and scrapped_units == 0)
      7. case_count = full_case_count + partial_case_count
      8. pallet_count = ceil(case_count / cases_per_pallet)
      Invariant: total_units == full_case_count * units_per_case
                 + (partial_case_count == 1 ? remainder_units : 0) + scrapped_units
    input_set: "Run actual_yield_kg and the recipe's packaging configuration"
    constants:
      PARTIAL_CASE_MIN_UNITS: 6
    precision: "integer units/cases/pallets; floor and ceil as specified per step"
    variants: []

  - name: shelf_life_window
    trigger: "FinishedGoodsLot creation (expiry_date), lot release validation, lazy expiry sweep"
    algorithm: threshold
    formula: |
      expiry_date = production_date + recipe.shelf_life_days (calendar days)
      remaining_days = expiry_date - current clock date (integer days)
      Expired: current date > expiry_date (release ON the expiry date is permitted)
      PRIVATE_LABEL release gate: remaining_days / shelf_life_days >= recipe.min_remaining_shelf_life_pct
      (inclusive boundary passes). BRANDED: no fractional minimum beyond not-expired.
      Lazy sweep: any STORED lot with current date > expiry_date flips to EXPIRED, evaluated
      ONLY on read endpoints (GET /finished-goods-lots[/id]). Write endpoints do not sweep:
      a release attempted on a STORED lot past expiry fails with ERR_LOT_EXPIRED (temporal),
      while a release attempted after a read has swept the lot fails with ERR_INVALID_STATE.
    input_set: "Lot production_date, recipe shelf_life_days and min_remaining_shelf_life_pct, logical clock"
    constants: {}
    precision: "whole calendar days"
    variants: []

  - name: zone_occupancy
    trigger: "FinishedGoodsLot put-away, release, EXPIRED/REJECTED transitions, BLOCKED -> STORED restores"
    algorithm: aggregation
    formula: |
      zone.occupied_pallets = SUM(pallet_count) over FinishedGoodsLots
      with zone_id == zone.id AND status == STORED
      (CREATED lots occupy nothing — no zone yet; BLOCKED lots that were STORED keep occupying;
       RELEASED / EXPIRED / REJECTED stop occupying)
      Put-away gate: occupied_pallets + incoming pallet_count <= capacity_pallets (equality allowed)
    input_set: "FinishedGoodsLots with zone_id == zone.id and status == STORED"
    constants: {}
    precision: "integer pallets"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties: verifier != recorder (gluten-tests/verify, pest-inspections/verify); approver != creator (recipes/approve, semolina-lots/accept)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /gluten-tests/{id}/verify, POST /pest-inspections/{id}/verify, POST /recipes/{id}/approve, POST /semolina-lots/{id}/accept"
  - priority: 4
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right (path first, then body FKs in declared input order)"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_DIE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_DRYING_SESSION_NOT_FOUND | ERR_PACKAGING_JOB_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_GOODS_LOT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_GLUTEN_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: business_constraint
    check: "Payload shape: required fields present, types valid, enum members valid, conditional fields honored (customer_name / min_remaining_shelf_life_pct iff PRIVATE_LABEL; line_id xor run_id per test_type; initial_moisture_pct / actual_yield_kg on the matching advance hops); recipe percentages numeric"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the action's transition exists (incl. terminal lockout; run advance hop matching; die/line/session/job/lot/inspection/test status gates)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_line_version (run create) and expected_run_version (run reschedule) equal the parent's current version"
    error_id: "ERR_STALE_LINE_VERSION | ERR_STALE_RUN_VERSION"
    http_status: 412
    applies_to: "POST /production-runs, PATCH /production-runs/{id}"
  - priority: 8
    category: business_safety
    check: "Gluten-free segregation and food-safety hard caps: GF run mixing requires GF_VALIDATED line; lot accept requires lab_moisture_pct <= 15.0; HIGH_TEMP curve rejected when initial_moisture_pct > 32.0"
    error_id: "ERR_GF_SEGREGATION_VIOLATION | ERR_MOISTURE_CAP_EXCEEDED | ERR_CRACK_RISK | ERR_LOT_GRADE_BELOW_CONTRACT"
    http_status: 409
    applies_to: "run advance, lot accept"
  - priority: 9
    category: business_temporal
    check: "Time-window rules: run schedule end > start and start not in the past; mixing not earlier than scheduled_start - changeover; line buffered-occupancy overlap; contract delivery inside [effective_start, effective_end]; contract activation window overlap (closed intervals); drying elapsed >= required_hours; lot expiry and private-label remaining-shelf-life; swab recency; quarantine-lift inspection recency"
    error_id: "ERR_INVALID_SCHEDULE | ERR_LINE_WINDOW_OVERLAP | ERR_CONTRACT_WINDOW_INVALID | ERR_CONTRACT_WINDOW_OVERLAP | ERR_DRYING_INCOMPLETE | ERR_LOT_EXPIRED | ERR_SHELF_LIFE_INSUFFICIENT | ERR_STALE_SWAB | ERR_QUARANTINE_LIFT_BLOCKED"
    http_status: 409
    applies_to: "run create/patch/advance, contract activate, lot receipt, drying finish, lot release, gluten-test verify, zone lift-quarantine"
  - priority: 10
    category: business_referential
    check: "Referenced-entity state: contract ACTIVE at receipt; recipe APPROVED and pinned revision current at mixing; lot ACCEPTED at mixing; die mounted with matching shape at extrusion; run quality RELEASED at lot release; verified PASS product test for GF run release; label verification for private-label job completion"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_RECIPE_NOT_APPROVED | ERR_RECIPE_REVISION_STALE | ERR_LOT_NOT_ACCEPTED | ERR_DIE_NOT_MOUNTED | ERR_DIE_SHAPE_MISMATCH | ERR_RUN_QUALITY_NOT_RELEASED | ERR_GLUTEN_TEST_REQUIRED | ERR_LABEL_VERIFICATION_REQUIRED"
    http_status: 409
    applies_to: "lot receipt, run advance, packaging complete, lot release, quality release"
  - priority: 11
    category: business_constraint
    check: "Aggregate/uniqueness constraints: recipe formula sums to 100.00 at approve; index reading unique per (contract, effective_date); zone gates on put-away evaluated in the fixed order quarantine -> type segregation -> pallet capacity (equality allowed); single mounted die per line"
    error_id: "ERR_RECIPE_FORMULA_INVALID | ERR_DUPLICATE_INDEX_READING | ERR_ZONE_TYPE_MISMATCH | ERR_ZONE_CAPACITY_EXCEEDED | ERR_ZONE_QUARANTINED"
    http_status: 409
    applies_to: "recipe approve, index-readings create, lot put-away, die mount"
  - priority: 12
    category: business_fiscal
    check: "Fiscal checks last: lot remaining_weight_kg >= planned_input_kg at mixing"
    error_id: ERR_INSUFFICIENT_LOT_WEIGHT
    http_status: 402
    applies_to: "run advance SCHEDULED -> MIXING"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy sweeps re-evaluate (contract EXPIRED, lot EXPIRED)"]

  # --- IngredientContract ---
  - method: POST
    path: "/ingredient-contracts"
    description: "Create an ingredient supply contract (DRAFT)"
    roles: [ProcurementManager]
    code: 201
    input: [contract_code, supplier_name, ingredient_type, base_price_cents_per_kg, reference_index_value, pricing_method, effective_start, effective_end]
    output: IngredientContract
    side_effects: ["status=DRAFT, cumulative_delivered_kg=0, created_by_user_id from header"]
  - method: GET
    path: "/ingredient-contracts/{contractId}"
    description: "Get a contract (lazy EXPIRED sweep applies)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: IngredientContract
    side_effects: []
  - method: POST
    path: "/ingredient-contracts/{contractId}/activate"
    description: "Activate a DRAFT contract; enforces closed-interval window exclusivity per ingredient_type"
    roles: [PlantManager]
    code: 200
    input: []
    output: IngredientContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/ingredient-contracts/{contractId}/close"
    description: "Close an ACTIVE contract (terminal)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: IngredientContract
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/ingredient-contracts/{contractId}/index-readings"
    description: "Append a price index reading (unique per effective_date)"
    roles: [ProcurementManager]
    code: 201
    input: [effective_date, index_value]
    output: PriceIndexReading
    side_effects: []
  - method: GET
    path: "/ingredient-contracts/{id}/index-readings"
    description: "List a contract's index readings"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PriceIndexReading[]"
    side_effects: []

  # --- SemolinaLot ---
  - method: POST
    path: "/semolina-lots"
    description: "Receive a semolina lot against a contract; computes certificate grade and settlement price"
    roles: [ProcurementManager]
    code: 201
    input: [contract_id, delivery_date, received_weight_kg, cert_protein_pct, cert_moisture_pct, cert_gluten_index, cert_falling_number_s]
    output: SemolinaLot
    side_effects:
      - "cert_grade_score/cert_grade computed (semolina_grade CERTIFICATE)"
      - "unit_price_cents/total_price_cents computed (contract_settlement_price); contract.cumulative_delivered_kg += received_weight_kg"
      - "status=QUARANTINED; remaining_weight_kg=received_weight_kg; consumed_kg=0"
  - method: GET
    path: "/semolina-lots"
    description: "List semolina lots (FK reverse-reachability for contract)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "SemolinaLot[]"
    side_effects: []
  - method: GET
    path: "/semolina-lots/{lotId}"
    description: "Get a semolina lot"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: SemolinaLot
    side_effects: []
  - method: POST
    path: "/semolina-lots/{lotId}/lab-results"
    description: "Record/refresh lab values; recomputes LAB grade; from ACCEPTED loops back to QUARANTINED (retest)"
    roles: [QATechnician]
    code: 200
    input: [lab_protein_pct, lab_moisture_pct, lab_gluten_index, lab_falling_number_s]
    output: SemolinaLot
    side_effects: ["lab_grade_score/lab_grade recomputed", "ACCEPTED -> QUARANTINED when retesting"]
  - method: POST
    path: "/semolina-lots/{lotId}/accept"
    description: "Accept a quarantined lot (SoD: acceptor != receiver)"
    roles: [QAManager]
    code: 200
    input: []
    output: SemolinaLot
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/semolina-lots/{lotId}/reject"
    description: "Reject a quarantined lot; fires the 3-hop hold cascade onto referencing runs/jobs/goods-lots"
    roles: [QAManager]
    code: 200
    input: []
    output: SemolinaLot
    side_effects: ["status -> REJECTED", "cascade: runs PENDING_QA -> HELD; their jobs CREATED|LABEL_VERIFIED -> BLOCKED; their goods lots CREATED|STORED -> BLOCKED"]

  # --- Recipe ---
  - method: POST
    path: "/recipes"
    description: "Create a recipe (DRAFT) with embedded ingredient rows"
    roles: [PlantManager]
    code: 201
    input: [recipe_name, brand_type, "customer_name?", shape_family, gluten_free, target_moisture_pct, drying_curve, shelf_life_days, "min_remaining_shelf_life_pct?", unit_weight_g, units_per_case, case_weight_limit_kg, cases_per_pallet, ingredients]
    output: Recipe
    side_effects: ["RecipeIngredient rows created from ingredients array (each: ingredient_type, percentage, min_protein_pct?)"]
  - method: GET
    path: "/recipes"
    description: "List recipes"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["brand_type?", "status?", "limit?", "offset?"]
    output: "Recipe[]"
    side_effects: []
  - method: GET
    path: "/recipes/{recipeId}"
    description: "Get a recipe"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: Recipe
    side_effects: []
  - method: GET
    path: "/recipes/{id}/ingredients"
    description: "List a recipe's ingredient rows"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecipeIngredient[]"
    side_effects: []
  - method: POST
    path: "/recipes/{recipeId}/approve"
    description: "Approve a DRAFT recipe (SoD: approver != creator; formula must sum to 100.00)"
    roles: [QAManager]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status -> APPROVED", "approved_by_user_id set"]
  - method: POST
    path: "/recipes/{recipeId}/amend"
    description: "Amend an APPROVED recipe's moisture target; bumps version and invalidates pinned runs"
    roles: [PlantManager]
    code: 200
    input: [target_moisture_pct]
    output: Recipe
    side_effects: ["target_moisture_pct updated", "version += 1"]
  - method: POST
    path: "/recipes/{recipeId}/retire"
    description: "Retire an APPROVED recipe"
    roles: [PlantManager]
    code: 200
    input: []
    output: Recipe
    side_effects: ["status -> RETIRED"]

  # --- ProductionLine ---
  - method: POST
    path: "/production-lines"
    description: "Create a production line (initial posture GLUTEN_EXPOSED)"
    roles: [PlantManager]
    code: 201
    input: [line_name]
    output: ProductionLine
    side_effects: []
  - method: GET
    path: "/production-lines/{lineId}"
    description: "Get a production line"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: "/production-lines/{lineId}/start-cleaning"
    description: "Begin cleaning (GLUTEN_EXPOSED or GF_VALIDATED -> CLEANING_IN_PROGRESS)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["gluten_posture -> CLEANING_IN_PROGRESS; line.version += 1"]
  - method: POST
    path: "/production-lines/{lineId}/complete-cleaning"
    description: "Finish cleaning (-> AWAITING_SWAB; stamps cleaning_completed_at)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["gluten_posture -> AWAITING_SWAB; cleaning_completed_at = now; line.version += 1"]

  # --- ExtrusionDie ---
  - method: POST
    path: "/extrusion-dies"
    description: "Register an extrusion die (AVAILABLE)"
    roles: [PlantManager]
    code: 201
    input: [die_code, shape_family, rated_capacity_kg]
    output: ExtrusionDie
    side_effects: []
  - method: GET
    path: "/extrusion-dies"
    description: "List dies (FK reverse-reachability for mounted line)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["mounted_line_id?", "status?", "limit?", "offset?"]
    output: "ExtrusionDie[]"
    side_effects: []
  - method: GET
    path: "/extrusion-dies/{dieId}"
    description: "Get a die"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: ExtrusionDie
    side_effects: []
  - method: POST
    path: "/extrusion-dies/{dieId}/mount"
    description: "Mount an AVAILABLE die on a line (one mounted die per line)"
    roles: [ProductionOperator]
    code: 200
    input: [line_id]
    output: ExtrusionDie
    side_effects: ["status -> MOUNTED; mounted_line_id set"]
  - method: POST
    path: "/extrusion-dies/{dieId}/unmount"
    description: "Unmount a die (-> IN_CLEANING; blocked while its line has an in-flight run)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ExtrusionDie
    side_effects: ["status -> IN_CLEANING; mounted_line_id = null"]
  - method: POST
    path: "/extrusion-dies/{dieId}/complete-cleaning"
    description: "Finish die cleaning; refurbish=true resets extruded_kg to 0; without refurbish a fully worn die auto-retires"
    roles: [ProductionOperator]
    code: 200
    input: ["refurbish?"]
    output: ExtrusionDie
    side_effects: ["status -> AVAILABLE or RETIRED; extruded_kg reset when refurbished"]

  # --- ProductionRun ---
  - method: POST
    path: "/production-runs"
    description: "Schedule a production run; computes changeover, checks buffered overlap, OCC on line version"
    roles: [ProductionOperator]
    code: 201
    input: [recipe_id, line_id, semolina_lot_id, planned_input_kg, scheduled_start, scheduled_end, expected_line_version]
    output: ProductionRun
    side_effects:
      - "changeover_minutes computed (changeover_minutes calc); pinned_recipe_version = recipe.version"
      - "gluten_free / brand_type copied from recipe; production_status=SCHEDULED; quality_disposition=PENDING_QA"
      - "increments ProductionLine.version by 1"
  - method: GET
    path: "/production-runs"
    description: "List runs (FK reverse-reachability for recipe, line, semolina lot)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["recipe_id?", "line_id?", "semolina_lot_id?", "production_status?", "quality_disposition?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/production-runs/{runId}"
    description: "Get a run"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: PATCH
    path: "/production-runs/{runId}"
    description: "Reschedule a SCHEDULED run; recomputes changeover and overlap; OCC on run version"
    roles: [ProductionOperator]
    code: 200
    input: ["scheduled_start?", "scheduled_end?", expected_run_version]
    output: ProductionRun
    side_effects: ["changeover_minutes recomputed", "increments ProductionRun.version by 1"]
  - method: POST
    path: "/production-runs/{runId}/advance"
    description: "Advance production_status one hop (SCHEDULED->MIXING->EXTRUDING->DRYING->PACKAGING->COMPLETED); hop-specific preconditions and payloads"
    roles: [ProductionOperator]
    code: 200
    input: ["initial_moisture_pct?", "actual_yield_kg?"]
    output: ProductionRun
    side_effects: ["per-hop effects: lot consumption, die wear, posture flip, DryingSession/PackagingJob creation"]
  - method: POST
    path: "/production-runs/{runId}/abort"
    description: "Abort a non-terminal run; MIXING abort refunds the semolina lot"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["production_status -> ABORTED; compensation per from-state"]
  - method: POST
    path: "/production-runs/{runId}/quality-hold"
    description: "Quality-hold a PENDING_QA run"
    roles: [QAManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_disposition -> HELD; run.version += 1"]
  - method: POST
    path: "/production-runs/{runId}/quality-release"
    description: "Release quality (PENDING_QA|HELD -> RELEASED); requires COMPLETED and, for GF runs, a verified PASS product test"
    roles: [QAManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_disposition -> RELEASED; conditional unblock of run's goods lots"]
  - method: POST
    path: "/production-runs/{runId}/quality-reject"
    description: "Reject quality (PENDING_QA|HELD -> REJECTED); writes off run's goods lots"
    roles: [QAManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_disposition -> REJECTED; goods lots -> REJECTED"]

  # --- DryingSession ---
  - method: GET
    path: "/drying-sessions"
    description: "List drying sessions (FK reverse-reachability for run)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["run_id?", "status?", "limit?", "offset?"]
    output: "DryingSession[]"
    side_effects: []
  - method: GET
    path: "/drying-sessions/{sessionId}"
    description: "Get a drying session"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: DryingSession
    side_effects: []
  - method: POST
    path: "/drying-sessions/{sessionId}/inline-readings"
    description: "Record an inline NIR reading; recomputes projected moisture from elapsed time"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: DryingSession
    side_effects: ["latest_inline_moisture_pct = drying_moisture_projection(now)"]
  - method: POST
    path: "/drying-sessions/{sessionId}/finish"
    description: "End drying once elapsed >= required_hours (-> AWAITING_LAB)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: DryingSession
    side_effects: ["status -> AWAITING_LAB"]
  - method: POST
    path: "/drying-sessions/{sessionId}/lab-results"
    description: "Submit lab oven-dry moisture; <= target (inclusive) CONFIRMED, else FAILED"
    roles: [QATechnician]
    code: 200
    input: [lab_moisture_pct]
    output: DryingSession
    side_effects: ["status -> CONFIRMED | FAILED; latest_lab_moisture_pct set"]
  - method: POST
    path: "/drying-sessions/{sessionId}/redry"
    description: "Redry a FAILED session (-> IN_PROGRESS; redry_count += 1; required_hours += 4)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: DryingSession
    side_effects: ["status -> IN_PROGRESS; required_hours extended"]

  # --- PackagingJob ---
  - method: GET
    path: "/packaging-jobs"
    description: "List packaging jobs (FK reverse-reachability for run)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["run_id?", "status?", "limit?", "offset?"]
    output: "PackagingJob[]"
    side_effects: []
  - method: GET
    path: "/packaging-jobs/{jobId}"
    description: "Get a packaging job"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: PackagingJob
    side_effects: []
  - method: POST
    path: "/packaging-jobs/{jobId}/verify-labels"
    description: "Verify private-label artwork/case labels (CREATED -> LABEL_VERIFIED)"
    roles: [QAManager]
    code: 200
    input: []
    output: PackagingJob
    side_effects: ["status -> LABEL_VERIFIED; labels_verified_by_user_id set"]
  - method: POST
    path: "/packaging-jobs/{jobId}/complete"
    description: "Complete a packaging job; creates the FinishedGoodsLot"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: PackagingJob
    side_effects: ["status -> COMPLETED; FinishedGoodsLot created"]

  # --- WarehouseZone ---
  - method: POST
    path: "/warehouse-zones"
    description: "Create a warehouse zone (pest_posture CLEAR)"
    roles: [PlantManager]
    code: 201
    input: [zone_name, zone_type, capacity_pallets]
    output: WarehouseZone
    side_effects: []
  - method: GET
    path: "/warehouse-zones/{zoneId}"
    description: "Get a warehouse zone"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: WarehouseZone
    side_effects: []
  - method: POST
    path: "/warehouse-zones/{zoneId}/lift-quarantine"
    description: "Lift quarantine after a verified NONE inspection recorded after quarantined_at"
    roles: [QAManager]
    code: 200
    input: []
    output: WarehouseZone
    side_effects: ["pest_posture -> CLEAR; conditional unblock of RELEASED runs' lots"]

  # --- FinishedGoodsLot ---
  - method: GET
    path: "/finished-goods-lots"
    description: "List finished goods lots (FK reverse-reachability for packaging job, run, zone; lazy EXPIRED sweep applies)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["packaging_job_id?", "run_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: "FinishedGoodsLot[]"
    side_effects: ["lazy EXPIRED sweep on listed lots"]
  - method: GET
    path: "/finished-goods-lots/{lotId}"
    description: "Get a finished goods lot (lazy EXPIRED sweep applies)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: FinishedGoodsLot
    side_effects: ["lazy EXPIRED sweep"]
  - method: POST
    path: "/finished-goods-lots/{lotId}/put-away"
    description: "Put a CREATED lot into a zone (segregation, quarantine, capacity gates)"
    roles: [WarehouseClerk]
    code: 200
    input: [zone_id]
    output: FinishedGoodsLot
    side_effects: ["status -> STORED; zone.occupied_pallets += pallet_count"]
  - method: POST
    path: "/finished-goods-lots/{lotId}/release"
    description: "Release (ship) a STORED lot (zone posture, run quality, shelf-life gates)"
    roles: [WarehouseClerk]
    code: 200
    input: []
    output: FinishedGoodsLot
    side_effects: ["status -> RELEASED; zone.occupied_pallets -= pallet_count"]

  # --- PestInspection ---
  - method: POST
    path: "/pest-inspections"
    description: "Record a pest inspection for a zone"
    roles: [QATechnician]
    code: 201
    input: [zone_id, severity, "notes?"]
    output: PestInspection
    side_effects: ["status=RECORDED; recorded_by_user_id from header"]
  - method: GET
    path: "/pest-inspections"
    description: "List pest inspections (FK reverse-reachability for zone)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: "PestInspection[]"
    side_effects: []
  - method: GET
    path: "/pest-inspections/{inspectionId}"
    description: "Get a pest inspection"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: PestInspection
    side_effects: []
  - method: POST
    path: "/pest-inspections/{inspectionId}/verify"
    description: "Verify an inspection (SoD: verifier != recorder); applies zone posture effects + cascades"
    roles: [QAManager]
    code: 200
    input: []
    output: PestInspection
    side_effects: ["status -> VERIFIED; zone posture effect; CRITICAL fires 2-hop cascade onto lots and runs"]

  # --- GlutenTest ---
  - method: POST
    path: "/gluten-tests"
    description: "Record a gluten test (LINE_SWAB xor PRODUCT_TEST)"
    roles: [QATechnician]
    code: 201
    input: [test_type, "line_id?", "run_id?", result]
    output: GlutenTest
    side_effects: ["status=RECORDED; recorded_by_user_id from header"]
  - method: GET
    path: "/gluten-tests"
    description: "List gluten tests (FK reverse-reachability for line and run)"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: ["line_id?", "run_id?", "test_type?", "status?", "limit?", "offset?"]
    output: "GlutenTest[]"
    side_effects: []
  - method: GET
    path: "/gluten-tests/{testId}"
    description: "Get a gluten test"
    roles: [ProcurementManager, PlantManager, QAManager, QATechnician, ProductionOperator, WarehouseClerk]
    code: 200
    input: []
    output: GlutenTest
    side_effects: []
  - method: POST
    path: "/gluten-tests/{testId}/verify"
    description: "Verify a gluten test (SoD); LINE_SWAB drives line posture cycle, PRODUCT_TEST FAIL auto-rejects the run"
    roles: [QAManager]
    code: 200
    input: []
    output: GlutenTest
    side_effects: ["status -> VERIFIED; line posture or run disposition effects"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing, or role not one of the six declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breach: verifier == recorder, or approver == creator" }
  # --- request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type/enum violation, or conditional-field rule broken (customer_name / min_remaining_shelf_life_pct iff PRIVATE_LABEL; line_id xor run_id per test_type; hop payloads; positive numeric constraints)" }
  # --- existence (404) ---
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contractId path segment or contract_id body FK does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lotId path segment or semolina_lot_id body FK does not exist" }
  - { id: ERR_RECIPE_NOT_FOUND, http: 404, condition: "recipeId path segment or recipe_id body FK does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "lineId path segment or line_id body FK does not exist" }
  - { id: ERR_DIE_NOT_FOUND, http: 404, condition: "dieId path segment does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "runId path segment or run_id body FK does not exist" }
  - { id: ERR_DRYING_SESSION_NOT_FOUND, http: 404, condition: "sessionId path segment does not exist" }
  - { id: ERR_PACKAGING_JOB_NOT_FOUND, http: 404, condition: "jobId path segment does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "zoneId path segment or zone_id body FK does not exist" }
  - { id: ERR_GOODS_LOT_NOT_FOUND, http: 404, condition: "FinishedGoodsLot lotId path segment does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspectionId path segment does not exist" }
  - { id: ERR_GLUTEN_TEST_NOT_FOUND, http: 404, condition: "testId path segment does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists (incl. terminal lockout, wrong advance hop, in-flight-run guards on line/die actions)" }
  # --- business_safety ---
  - { id: ERR_GF_SEGREGATION_VIOLATION, http: 409, condition: "Gluten-free run cannot advance to MIXING: line gluten_posture != GF_VALIDATED" }
  - { id: ERR_MOISTURE_CAP_EXCEEDED, http: 422, condition: "Lot acceptance blocked: lab_moisture_pct > 15.0 safety cap regardless of grade score" }
  - { id: ERR_CRACK_RISK, http: 422, condition: "HIGH_TEMP drying curve rejected: initial_moisture_pct > 32.0 risks cracking" }
  - { id: ERR_LOT_GRADE_BELOW_CONTRACT, http: 422, condition: "Lot acceptance blocked: lab_grade == GRADE_REJECT (score < 50.0)" }
  # --- business_temporal ---
  - { id: ERR_INVALID_SCHEDULE, http: 422, condition: "scheduled_end <= scheduled_start, scheduled_start in the past, or advance to MIXING earlier than scheduled_start - changeover_minutes" }
  - { id: ERR_LINE_WINDOW_OVERLAP, http: 409, condition: "Buffered occupancy [start - changeover, end) intersects another non-ABORTED run on the line (half-open; adjacency allowed)" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 409, condition: "Lot delivery_date outside contract [effective_start, effective_end] (inclusive both ends)" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Activation would overlap another ACTIVE contract of the same ingredient_type (closed intervals; shared endpoint date IS a conflict)" }
  - { id: ERR_DRYING_INCOMPLETE, http: 409, condition: "finish called with elapsed hours < required_hours" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "Release attempted with current date > expiry_date (release on expiry date itself allowed)" }
  - { id: ERR_SHELF_LIFE_INSUFFICIENT, http: 409, condition: "Private-label release: remaining shelf-life fraction below recipe minimum (inclusive boundary passes)" }
  - { id: ERR_STALE_SWAB, http: 409, condition: "LINE_SWAB verify: swab recorded before line.cleaning_completed_at, or line not AWAITING_SWAB" }
  - { id: ERR_QUARANTINE_LIFT_BLOCKED, http: 409, condition: "lift-quarantine without a VERIFIED severity-NONE inspection whose verified_at > quarantined_at" }
  # --- business_referential ---
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Lot receipt or index-reading against a contract not in ACTIVE status (readings also allowed in DRAFT); EXPIRED/CLOSED reject receipt" }
  - { id: ERR_RECIPE_NOT_APPROVED, http: 409, condition: "Run creation or mixing with a recipe not in APPROVED status" }
  - { id: ERR_RECIPE_REVISION_STALE, http: 409, condition: "Mixing blocked: recipe.version advanced beyond run.pinned_recipe_version" }
  - { id: ERR_LOT_NOT_ACCEPTED, http: 409, condition: "Mixing blocked: semolina lot not ACCEPTED" }
  - { id: ERR_LOT_QUALITY_INSUFFICIENT, http: 422, condition: "Mixing blocked: lot lab protein below a recipe ingredient's min_protein_pct" }
  - { id: ERR_DIE_NOT_MOUNTED, http: 409, condition: "Extrusion advance blocked: no MOUNTED die on the run's line" }
  - { id: ERR_DIE_SHAPE_MISMATCH, http: 409, condition: "Extrusion advance blocked: mounted die shape_family != recipe shape_family" }
  - { id: ERR_RUN_QUALITY_NOT_RELEASED, http: 409, condition: "Lot release blocked: run quality_disposition != RELEASED" }
  - { id: ERR_GLUTEN_TEST_REQUIRED, http: 409, condition: "GF run quality-release blocked: no VERIFIED PASS PRODUCT_TEST for the run" }
  - { id: ERR_LABEL_VERIFICATION_REQUIRED, http: 409, condition: "Private-label packaging job cannot complete before LABEL_VERIFIED" }
  # --- business_constraint ---
  - { id: ERR_RECIPE_FORMULA_INVALID, http: 422, condition: "Recipe approve blocked: no ingredient rows or percentages do not sum to exactly 100.00" }
  - { id: ERR_DUPLICATE_INDEX_READING, http: 409, condition: "A reading already exists for (contract_id, effective_date)" }
  - { id: ERR_ZONE_TYPE_MISMATCH, http: 409, condition: "Gluten-free lot put away into a CONVENTIONAL zone" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "Put-away would push zone occupied_pallets above capacity_pallets (equality allowed)" }
  - { id: ERR_ZONE_QUARANTINED, http: 409, condition: "Put-away or release while zone pest_posture == QUARANTINED" }
  # --- business_fiscal ---
  - { id: ERR_INSUFFICIENT_LOT_WEIGHT, http: 402, condition: "Mixing blocked: lot.remaining_weight_kg < planned_input_kg" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_line_version != line.version at run creation" }
  - { id: ERR_STALE_RUN_VERSION, http: 412, condition: "expected_run_version != run.version at reschedule" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: structural master data and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ingredient-contracts/{id}/activate"
      - "POST /recipes, POST /recipes/{id}/retire, POST /recipes/{id}/amend"
      - "POST /production-lines, POST /extrusion-dies, POST /warehouse-zones"
    shared_operations: ["All GET endpoints"]
  - name: ProcurementManager
    description: "Owns ingredient contracts, index readings, and goods receipt"
    identity: opaque
    exclusive_operations:
      - "POST /ingredient-contracts, POST /ingredient-contracts/{id}/close"
      - "POST /ingredient-contracts/{id}/index-readings"
      - "POST /semolina-lots"
    shared_operations: ["All GET endpoints"]
  - name: QATechnician
    description: "Records laboratory and inspection evidence; never verifies own records"
    identity: opaque
    exclusive_operations:
      - "POST /semolina-lots/{id}/lab-results"
      - "POST /drying-sessions/{id}/lab-results"
      - "POST /pest-inspections"
      - "POST /gluten-tests"
    shared_operations: ["All GET endpoints"]
  - name: QAManager
    description: "Quality disposition authority: accepts lots, approves recipes, verifies records, releases product"
    identity: opaque
    exclusive_operations:
      - "POST /semolina-lots/{id}/accept, POST /semolina-lots/{id}/reject"
      - "POST /recipes/{id}/approve"
      - "POST /production-runs/{id}/quality-hold, /quality-release, /quality-reject"
      - "POST /packaging-jobs/{id}/verify-labels"
      - "POST /pest-inspections/{id}/verify, POST /gluten-tests/{id}/verify"
      - "POST /warehouse-zones/{id}/lift-quarantine"
    shared_operations: ["All GET endpoints"]
  - name: ProductionOperator
    description: "Runs the floor: cleaning, dies, runs, drying, packaging"
    identity: opaque
    exclusive_operations:
      - "POST /production-lines/{id}/start-cleaning, /complete-cleaning"
      - "POST /extrusion-dies/{id}/mount, /unmount, /complete-cleaning"
      - "POST /production-runs, PATCH /production-runs/{id}, POST /production-runs/{id}/advance, /abort"
      - "POST /drying-sessions/{id}/inline-readings, /finish, /redry"
      - "POST /packaging-jobs/{id}/complete"
    shared_operations: ["All GET endpoints"]
  - name: WarehouseClerk
    description: "Warehouse custody: put-away and release of finished goods"
    identity: opaque
    exclusive_operations:
      - "POST /finished-goods-lots/{id}/put-away"
      - "POST /finished-goods-lots/{id}/release"
    shared_operations: ["All GET endpoints"]
