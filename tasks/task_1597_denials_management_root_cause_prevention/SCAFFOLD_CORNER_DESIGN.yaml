        excluded_because:
          difficulty_instance: transitive_cascade / clock_sweep_expiry_cascade
          rationale: "The 3-hop expiry cascade (denial -> auto write-off -> scorecard counters) is asserted hop-by-hop by the named §1.8 instance."

  # ------------------------------------------------------ consistency model ---
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_writeoff_approve
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.WriteOffRequest.PENDING_MANAGER_to_APPROVED]
        distinguishing_aspect: "Immediate consistency: the approve response already shows APPROVED with decided fields set, and an immediate follow-up GET of the denial shows written_off_cents == 100000 — no read lag."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2701 (denied 100000) QUEUED; write-off 100000 created by spec-1"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2701", patient_account_number: "PA-2701", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 100000, reason_code: "SMALL_BALANCE" }
              as: DenialsSpecialist
              as_user_id: "spec-1"
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /rcm/write-off-requests/${w1}/approve"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
              captures: { w_status: $.data.status, w_decided_by: $.data.decided_by_user_id }
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { d_wo: $.data.written_off_cents, d_status: $.data.status }
          assert:
            - "approve response: status == APPROVED, decided_by_user_id == mgr-1"
            - "immediate GET: denial written_off_cents == 100000 and status == RESOLVED_WRITTEN_OFF (fully written off)"
