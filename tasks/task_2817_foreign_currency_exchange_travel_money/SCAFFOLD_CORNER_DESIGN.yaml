        grounds:
          - validations[priority 11, ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT]
          - state_machines.NoteAssessment
          - calculations.damaged_note_recovery
        distinguishing_aspect: "The permitted outcome depends on defect_type and the mapping is not symmetric: CONFISCATED requires SUSPECTED_COUNTERFEIT, RETURNED accepts DAMAGED or OBSOLETE_SERIES but never SUSPECTED_COUNTERFEIT, and EXCHANGED_AT_DISCOUNT is restricted to DAMAGED alone - so an OBSOLETE_SERIES note can be returned but never discounted."
        test_recipe:
          setup:
            - "Canonical BR-LHR / EUR base (default damaged_note_recovery_bps 6500) with a PUBLISHED 550/450 card (buy 970600) and a 20 x 10000 position."
            - "One SETTLED BUY of 3 x 10000 (gross 30909, commission 1082, payout 29827) takes the position to 23 notes."
            - "Three SUBMITTED assessments of 1 x 10000 each: A_dmg (DAMAGED), A_cft (SUSPECTED_COUNTERFEIT) and A_obs (OBSOLETE_SERIES), leaving 20 available and 3 quarantined."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
