      - name: expired_licence_blocks_a_new_allocation_request
        claim_type: Violation → Error
        grounds: ["errors[ERR_LICENSE_EXPIRED]", "validations[priority=14]", "entities.Carrier.fields.eligibility_status"]
        distinguishing_aspect: "Expiry is deliberately kept out of eligibility_status, so a carrier whose licence lapsed at the clock instant still reads ELIGIBLE and is stopped one rung lower by priority 14 - the request never reaches the filing gate at priority 29 even though no filing exists."
        test_recipe:
          setup: ["Carrier A was granted a licence expiring 2026-09-01T00:00:00Z and is facilities VERIFIED. NPA 614 / rate center COLUMBUS exists with no blocks. The clock is then advanced to exactly 2026-09-01T00:00:00Z, so license_expires_on is no longer strictly after the clock. Carrier A holds no utilization filing at all."]
