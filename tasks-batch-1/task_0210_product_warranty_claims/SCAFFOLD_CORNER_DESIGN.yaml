              payload: { model_number: "PRD-X3", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 24, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "X Owner3", email: "x3@x.com" }
              as: WarrantyAdmin
              captures: { o_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-X3", owner_user_id: "${o_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2024-02-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE", resolution_type: "REPAIR", repair_cost_cents: 5000 }
              as: WarrantyAdmin
          trigger:
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: Owner
              as_user_id: "${o_id}"
              captures: { remaining: $.data.remaining_coverage_cents }
          assert:
            - "Registration.${reg_id}.remaining_coverage_cents == 35000"

      - name: dual_variant_calculation_layer_refund
        claim_type: dual_variant_calculation
        grounds:
          - calculations.refund_proration
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_proration_straight_line_vs_declining_balance
          rationale: "The dual-variant-calculation layer is exercised by the named §1.8 dual_variant_calc instances."

      - name: cascading_side_effects_layer_fulfill_refund
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Claim.ADJUDICATED_to_FULFILLED
        excluded_because:
          difficulty_instance: transitive_cascade / fulfill_refund_cascades_claim_then_registration_then_extension
          rationale: "The cascading-side-effects layer N-level chain is exercised by the named §1.8 transitive_cascade instance."

