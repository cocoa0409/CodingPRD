          assert:
            - "Claim created at exactly 72h: claim_status == FILED and claim_filed == 2026-08-08T10:00:00.000Z (inclusive <= boundary)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_by_site_suspension
        grounds:
          - state_machines.WashOrder.DRAFT_to_SCHEDULED
          - state_machines.Site.ACTIVE_to_SUSPENDED
          - validations[priority=26]
        distinguishing_aspect: |
          Entity pair WashOrder x Site: the order's DRAFT -> SCHEDULED transition is
          legal only while the linked Site is ACTIVE; suspending the site after
          creation flips CONFIRM to ERR_SITE_SUSPENDED.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; order in DRAFT"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail G", email: "rg@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "G1", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "G01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/sites/${site_id}/events", payload: { event_type: "SUSPEND" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SITE_SUSPENDED; WashOrder.${order_id}.status remains DRAFT"

      - name: claim_approve_gated_by_submitted_inspection
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.InspectionReport.DRAFT_to_SUBMITTED
          - validations[priority=22]
        distinguishing_aspect: |
          Entity pair DamageClaim x InspectionReport (different pair than WashOrder x
          Site): APPROVE is legal while the report is DRAFT, but the same area's
          pre_existing_damage flag becomes blocking once the report is SUBMITTED —
          the claim's valid transitions depend on the report's state.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; order COMPLETED (requires_inspection false)"
            - "InspectionReport filed while order IN_PROGRESS with area EXTERIOR_BODY pre_existing_damage=true, still DRAFT"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail I", email: "ri@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "I1", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "I01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-I", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech I" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/inspection-reports", payload: { wash_order_id: "${order_id}", areas: [{ area: "EXTERIOR_BODY", pre_existing_damage: true, notes: "door ding present" }] }, as: Technician, as_user_id: "${tech_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}"] }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/damage-claims", payload: { wash_order_id: "${order_id}", area: "EXTERIOR_BODY", claimed_amount_cents: 30000, description: "door dent" }, as: Customer, as_user_id: "${cust_id}", captures: { dc1_id: $.data.id } }
            - { call: "POST /fleet-wash/damage-claims/${dc1_id}/events", payload: { event_type: "START_REVIEW" }, as: QualityAuditor }
          trigger:
            - { call: "POST /fleet-wash/damage-claims/${dc1_id}/events", payload: { event_type: "APPROVE" }, as: QualityAuditor, as_user_id: "auditor-1", captures: { dc1_status: $.data.status, dc1_amt: $.data.approved_amount_cents } }
            - { call: "POST /fleet-wash/inspection-reports/${rep_id}/events", payload: { event_type: "SUBMIT" }, as: Technician, as_user_id: "${tech_id}", captures: { rep_status: $.data.status } }
            - { call: "POST /fleet-wash/damage-claims", payload: { wash_order_id: "${order_id}", area: "EXTERIOR_BODY", claimed_amount_cents: 20000, description: "same door dent re-claimed" }, as: Customer, as_user_id: "${cust_id}", captures: { dc2_id: $.data.id } }
            - { call: "POST /fleet-wash/damage-claims/${dc2_id}/events", payload: { event_type: "START_REVIEW" }, as: QualityAuditor }
            - { call: "POST /fleet-wash/damage-claims/${dc2_id}/events", payload: { event_type: "APPROVE" }, as: QualityAuditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
          assert:
            - "While report DRAFT: dc1_status == APPROVED and dc1_amt == 25000 (cap applies; DRAFT report does not block)"
            - "rep_status == SUBMITTED after SUBMIT"
            - "Once SUBMITTED: err == ERR_PRE_EXISTING_CONDITION_DOCUMENTED on the same area; DamageClaim.${dc2_id}.status remains UNDER_REVIEW"

      - name: confirm_blocked_by_paused_subscription
        grounds:
          - state_machines.WashOrder.DRAFT_to_SCHEDULED
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - validations[priority=27]
        distinguishing_aspect: |
          Entity pair WashOrder x Subscription (third distinct pair): CONFIRM of a
          subscription-billed order is legal only while the linked Subscription is
          ACTIVE; PAUSED flips CONFIRM to ERR_SUBSCRIPTION_NOT_ACTIVE and RESUME
          restores it.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; ACTIVE subscription on the vehicle; subscription-billed order in DRAFT"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail U", email: "ru@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "U1", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "U01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${v1}", cadence: "WEEKLY", next_service_date: "2026-08-10" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-10T13:00:00Z", scheduled_window_end: "2026-08-10T14:00:00Z", subscription_id: "${sub_id}" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 7 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { ok_status: $.data.status } }
          assert:
            - "While PAUSED: err == ERR_SUBSCRIPTION_NOT_ACTIVE; order remains DRAFT"
            - "After RESUME: ok_status == SCHEDULED (dependency cleared)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: site_window_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_SITE_WINDOW_CONFLICT]
          - "endpoints: POST /fleet-wash/wash-orders/{id}/events"
        distinguishing_aspect: |
          Interval semantics = half-open on resource Site: order A 13:00-14:00 and order
          B 14:00-15:00 touch but do NOT conflict (end == start is free), while order C
          13:30-14:30 overlaps and is rejected at CONFIRM.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; orders A (13:00-14:00) CONFIRMED, B (14:00-15:00) created, C (13:30-14:30) created"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail O", email: "ro@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "OVR", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "O01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${oa_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T14:00:00Z", scheduled_window_end: "2026-08-06T15:00:00Z" }, as: PlatformAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:30:00Z", scheduled_window_end: "2026-08-06T14:30:00Z" }, as: PlatformAdmin, captures: { oc_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${ob_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { ob_status: $.data.status } }
            - { call: "POST /fleet-wash/wash-orders/${oc_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { oc_err: $.data.error_id } }
          assert:
            - "ob_status == SCHEDULED (adjacent half-open windows allowed: A.end == B.start)"
            - "oc_err == ERR_SITE_WINDOW_CONFLICT (13:30-14:30 overlaps A); WashOrder.${oc_id}.status remains DRAFT"

      - name: technician_buffer_exactly_30_minutes
        grounds:
          - validations[priority=11]
          - calculations.stop_planning
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
          - "endpoints: POST /fleet-wash/routes/{id}/stops"
        distinguishing_aspect: |
          Interval semantics = buffered gap on resource Technician (different resource
          and different geometry than the site half-open rule): with T1's existing stop
          ending 09:15 on route R0, a route shifted to 09:45 admits its first stop
          (gap exactly 30, >= 30) while a route shifted to 09:30 is rejected (gap 15);
          adjacency is NOT free here.
