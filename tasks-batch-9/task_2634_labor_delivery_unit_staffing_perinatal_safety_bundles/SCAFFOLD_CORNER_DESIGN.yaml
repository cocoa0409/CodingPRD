      - name: labor_phase_and_staffing_state_are_independent_axes_of_the_same_encounter
        claim_type: Valid Transition
        grounds:
          - state_machines.LaborEncounter.labor_phase
          - state_machines.LaborEncounter.staffing_state
          - entities.LaborEncounter.fields.labor_phase
          - entities.LaborEncounter.fields.staffing_state
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / encounter_staffing_axis_breaches_twice_while_phase_axis_advances_to_active_first_stage
          rationale: |
            The `parallel` shape claim — independent dimensions change independently and the combined
            state is correct — is exactly what that §1.8 instance drives: it breaches and re-covers the
            staffing_state axis twice while walking the labor_phase axis forward to
            ACTIVE_FIRST_STAGE, asserting the cross product at every step. A §1.9 probe could only
            assert a weaker single-crossing version of the same claim.
        # NO test_recipe.

      - name: induction_booking_hold_confirm_bump_requeue_cycle_is_bounded_by_the_bump_limit
        claim_type: Valid Transition
        grounds:
          - state_machines.InductionBooking.BUMPED_to_REQUESTED
          - entities.InductionBooking.fields.bump_count
          - entities.InductionBooking.fields.priority_class
          - calculations.induction_priority_class
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / induction_booking_two_laps_of_hold_confirm_bump_requeue_cycle_promotes_to_medically_indicated
          rationale: |
            The `cyclic` shape claim — the entity loops back and the loop's termination condition is
            respected — is fully covered there: two complete laps of hold -> confirm -> bump ->
            requeue drive bump_count to the BUMP_ESCALATION_LIMIT of 2 and flip priority_class to
            MEDICALLY_INDICATED, which is also what makes the booking ineligible for a third bump.
        # NO test_recipe.

      - name: drill_invalidation_cascades_outward_from_the_drill_to_staff_currency_and_beds
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CesareanReadinessDrill.VALIDATED_to_INVALIDATED
          - entities.StaffMember.fields.drill_currency_state
          - entities.ObstetricUnit.fields.cesarean_readiness_state
          - entities.Bed.fields.status
          - endpoints[POST /cesarean-readiness-drills/{drillId}/invalidate]
          - calculations.cesarean_readiness_derivation
        excluded_because:
          difficulty_instance: transitive_cascade / drill_invalidation_cascades_currency_to_readiness_to_elective_bump_to_bed_release
          rationale: |
            This is the scaffold's deepest "cascade down / cross-entity" chain and the cited §1.8
            instance walks all four hops end to end — currency lapses, unit readiness degrades to
            NOT_READY, the elective CAPACITY_HELD booking is bumped, and its held bed is released —
            asserting each intermediate entity. A §1.9 Side Effect Execution probe on the same edge
            would duplicate the setup without adding a distinct claim.
        # NO test_recipe.

      - name: recording_a_cesarean_delivery_cascades_into_delivery_fields_snapshots_and_the_or_bed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EmergencyCesareanEvent.INCISION_RECORDED_to_DELIVERED
          - entities.LaborEncounter.fields.delivery_mode
          - entities.LaborEncounter.fields.delivery_recorded_at
          - entities.QualityMeasureSnapshot.fields.ntsv_cesarean_numerator
          - entities.Bed.fields.status
          - endpoints[POST /emergency-cesareans/{eventId}/record-delivery]
        excluded_because:
          difficulty_instance: transitive_cascade / record_delivery_cascades_event_status_to_delivery_mode_to_draft_snapshot_rates_to_or_bed_turnover
          rationale: |
            The cited §1.8 instance already asserts every hop of this cascade — event status,
            encounter delivery_mode and delivery_recorded_at, recomputation of the covering DRAFT
            snapshot's rates, and the OR bed's move into TURNOVER — which subsumes any §1.9-level
            side-effect assertion on the same transition.
        # NO test_recipe.

      - name: second_stage_advance_is_guarded_by_a_state_that_lives_on_a_different_entity
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LaborEncounter.ACTIVE_FIRST_STAGE_to_SECOND_STAGE
          - entities.ObstetricUnit.fields.cesarean_readiness_state
          - endpoints[POST /labor-encounters/{encounterId}/advance-phase]
          - errors[ERR_CESAREAN_READINESS_NOT_MET]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / second_stage_advance_blocked_by_unit_not_ready_then_unblocked_by_validating_a_drill_nothing_on_the_encounter_changing
          rationale: |
            The "guarded transitions" row (A -> B only if entity C is in state X) is covered in its
            strongest form there: the same advance-phase call is refused and then accepted with the
            ONLY change being a drill validation on the unit, nothing on the encounter itself. A §1.9
            probe could assert the refusal but not that contrast.
        # NO test_recipe.

  - section: calculations
    instances:

      - name: bedside_slot_with_basic_certification_binds_the_cert_cap_at_3_0_not_the_base_at_4_0
        claim_type: Constants Applied
        grounds:
          - calculations.staff_capacity_units
          - entities.StaffMember.fields.fetal_monitoring_cert_level
          - entities.ShiftAssignment.fields.role_slot
          - entities.ShiftAssignment.fields.capacity_units_effective
          - endpoints[POST /shift-assignments/{shiftId}/activate]
        distinguishing_aspect: |
          staff_capacity_units opens with min(BASE_CAPACITY_UNITS[role_slot], CERT_CAP_UNITS[cert]),
          and the two constant tables disagree for a BEDSIDE nurse: BASE is 4.0 while CERT_CAP[BASIC]
          is 3.0. Two nurses are activated into the SAME BEDSIDE slot differing only in certification,
          so the cert-capped one must freeze at 3.0 and the ADVANCED one at 4.0. That contrast is what
          makes the min() falsifiable — an implementation reading only BASE returns 4.0 for both, one
          reading only CERT_CAP returns 3.0 and 4.0 by accident on the second row but 3.0 on the
          first, and one applying the CHARGE_ADMIN_OFFSET to every slot returns 2.0 and 3.0. Neither
          nurse is CHARGE and neither holds any assignment, so both the admin offset and the TIER_IV
          focus penalty are 0.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit, no beds needed. Two RN_LABOR_DELIVERY members
            with unexpired credentials, one BASIC and one ADVANCED, each on their own BEDSIDE shift
            05:00-15:00 (600 minutes; per-staff windows so the 13.2 overlap rule does not apply).
            Both shifts are activated while clock_now sits inside the window, which is what freezes
            capacity_units_effective.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Aspenglade Perinatal LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Brigid Nolan RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { basic_staff_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Corinne Adeyemi RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { advanced_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${basic_staff_id}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "${basic_staff_id}"
              captures: { basic_shift_id: $.data.id, basic_cap_before: $.data.capacity_units_effective }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${advanced_staff_id}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "${basic_staff_id}"
              captures: { advanced_shift_id: $.data.id }
          trigger:
            - call: POST /shift-assignments/${basic_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${basic_staff_id}"
              captures: { basic_cap: $.data.capacity_units_effective, basic_status: $.data.status }
            - call: POST /shift-assignments/${advanced_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${basic_staff_id}"
              captures: { advanced_cap: $.data.capacity_units_effective }
          assert:
            - "HTTP 200 on both activate calls"
            - "basic_cap_before == null"
            - "basic_cap == 3.0"
            - "advanced_cap == 4.0"
            - "ShiftAssignment.${basic_shift_id}.capacity_units_effective == 3.0"
            - "ShiftAssignment.${basic_shift_id}.status == \"ACTIVE\""
            - "ShiftAssignment.${basic_shift_id}.assigned_acuity_load_units == 0.0"
            - "ShiftAssignment.${advanced_shift_id}.capacity_units_effective == 4.0"
            - "ShiftAssignment.${advanced_shift_id}.assigned_acuity_load_units == 0.0"

      - name: elective_induction_boundary_flips_patient_request_at_38_weeks_to_elective_at_39
        claim_type: Constants Applied
        grounds:
          - calculations.induction_priority_class
          - entities.InductionBooking.fields.priority_class
          - entities.InductionBooking.fields.indication_code
          - entities.InductionBooking.fields.gestational_age_weeks
          - endpoints[POST /induction-bookings]
        distinguishing_aspect: |
          induction_priority_class is a three-branch ladder whose only numeric constant,
          ELECTIVE_GA_WEEKS 39, is INCLUSIVE. Three bookings differing only in the two inputs that
          feed the ladder pin all three outcomes at once: GDM_CONTROLLED at 38 weeks is one week short
          and lands on PATIENT_REQUEST, the same indication at exactly 39 weeks lands on
          ELECTIVE_39_WEEK, and PREECLAMPSIA at 30 weeks short-circuits to MEDICALLY_INDICATED on the
          first branch regardless of gestational age. An implementation using a strict > 39 returns
          PATIENT_REQUEST for the second booking; one that lets gestational age override the medical
          indication returns PATIENT_REQUEST for the third.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z, one unit with one AVAILABLE LDR bed, no bookings. All three
            requested_start_utc values are a day ahead so the 14.2 future-dated rule passes, and each
            booking carries a distinct patient_record_code.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rosemont Induction Suite LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-GA38-1414", gestational_age_weeks: 38, indication_code: "GDM_CONTROLLED", requested_start_utc: "2026-08-02T08:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_38: $.data.id, class_38: $.data.priority_class }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-GA39-1515", gestational_age_weeks: 39, indication_code: "GDM_CONTROLLED", requested_start_utc: "2026-08-02T12:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_39: $.data.id, class_39: $.data.priority_class }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-PRE30-1616", gestational_age_weeks: 30, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-02T16:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_pre: $.data.id, class_pre: $.data.priority_class }
          assert:
            - "HTTP 201 on all three calls"
            - "class_38 == \"PATIENT_REQUEST\""
            - "class_39 == \"ELECTIVE_39_WEEK\""
            - "class_pre == \"MEDICALLY_INDICATED\""
            - "InductionBooking.${booking_38}.priority_class == \"PATIENT_REQUEST\""
            - "InductionBooking.${booking_39}.priority_class == \"ELECTIVE_39_WEEK\""
            - "InductionBooking.${booking_pre}.priority_class == \"MEDICALLY_INDICATED\""
            - "InductionBooking.${booking_38}.bump_count == 0"
            - "InductionBooking.${booking_39}.expected_labor_minutes == 720"

      - name: staff_capacity_nested_min_max_with_charge_offset_and_tier_iv_focus_penalty
        claim_type: Correct Result
        grounds:
          - calculations.staff_capacity_units
          - calculations.staff_capacity_units.constants.CHARGE_ADMIN_OFFSET_UNITS
          - calculations.staff_capacity_units.constants.TIER_IV_FOCUS_PENALTY_UNITS
          - entities.ShiftAssignment.fields.capacity_units_effective
        excluded_because:
          difficulty_instance: combinatorial_formula / charge_slot_nested_min_max_with_tier_iv_focus_penalty_yields_1_0
          rationale: |
            The full four-input interaction of staff_capacity_units — the inner min() between BASE and
            CERT_CAP, the CHARGE admin offset and the TIER_IV focus penalty stacking on top of it, and
            the max(0.0, ...) floor — is exactly the §1.8 combinatorial_formula probe, which drives a
            CHARGE slot down to 1.0 by escalating the covered encounter to TIER_IV. A §1.9 instance
            asserting the same composed result would be a strictly weaker copy of it, so this section
            keeps only the single-constant slice (BEDSIDE + BASIC binding the cert cap at 3.0) that the
            depth instance does not exercise.

      - name: latent_advance_reprices_the_ratio_shared_debit_in_place_from_0_5_to_1_0
        claim_type: Correct Result
        grounds:
          - calculations.care_assignment_unit_debit
          - calculations.care_assignment_unit_debit.constants.PHASE_MULTIPLIER
          - calculations.encounter_required_coverage_units
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.LaborEncounter.fields.required_coverage_units
          - endpoints[POST /labor-encounters/{encounterId}/advance-phase]
        distinguishing_aspect: |
          care_assignment_unit_debit is ACUITY_UNITS[tier] * PHASE_MULTIPLIER[phase], and the phase
          multiplier doubles from 0.5 at ANTEPARTUM to 1.0 at LATENT while the tier stays TIER_I. The
          claim is that advancing the phase re-prices the EXISTING ACTIVE row in place — credit the old
          0.5, debit the new 1.0 — rather than leaving the stale debit or stacking a second charge. Three
          numbers move together and must agree afterwards: the assignment's acuity_units_consumed, the
          shift's assigned_acuity_load_units and the encounter's required_coverage_units, all at 1.0,
          with the unit's coverage_deficit_units still 0.0. An implementation that re-prices required
          coverage but not the debit leaves the shift at 0.5 and the unit reporting a 0.5 deficit; one
          that adds instead of replacing leaves the shift at 1.5.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with TWO LDR beds, one ADVANCED RN on an ACTIVE
            CHARGE shift 05:00-15:00 whose capacity_units_effective is 2.0 (min(3.0, 4.0) minus the 1.0
            admin offset). One term singleton vertex encounter without prior cesarean, so acuity_tier is
            TIER_I; it occupies LDR-01, leaving LDR-02 AVAILABLE so the posture can never be DIVERT and
            the 8.02 gate cannot block the advance. It is covered RATIO_SHARED, which debits
            ACUITY_UNITS[TIER_I] 1.0 * PHASE_MULTIPLIER[ANTEPARTUM] 0.5 = 0.5 against the 2.0 capacity
            and puts the staffing_state axis at RATIO_COVERED, satisfying the 8.03 coverage floor for
            the LATENT step.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Fernhollow Birth Center LDR", licensed_ldr_beds: 6, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Delphine Okonkwo RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { charge_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${charge_staff_id}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { charge_shift_id: $.data.id }
            - call: POST /shift-assignments/${charge_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { charge_capacity: $.data.capacity_units_effective }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-LATENT-2020", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_bed_id: $.data.bed_id }
            - call: GET /labor-encounters/${enc_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_v: $.data.version, required_before: $.data.required_coverage_units }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_id}", shift_assignment_id: "${charge_shift_id}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { assignment_id: $.data.id, debit_before: $.data.acuity_units_consumed }
          trigger:
            - call: POST /labor-encounters/${enc_id}/advance-phase
              payload: { target_phase: "LATENT" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { phase_after: $.data.labor_phase, required_after: $.data.required_coverage_units, assigned_after: $.data.assigned_coverage_units, state_after: $.data.staffing_state }
          assert:
            - "HTTP 200"
            - "charge_capacity == 2.0"
            - "required_before == 0.5"
            - "debit_before == 0.5"
            - "phase_after == \"LATENT\""
            - "required_after == 1.0"
            - "assigned_after == 1.0"
            - "state_after == \"RATIO_COVERED\""
            - "LaborEncounter.${enc_id}.acuity_tier == \"TIER_I\""
            - "CareAssignment.${assignment_id}.acuity_units_consumed == 1.0"
            - "CareAssignment.${assignment_id}.status == \"ACTIVE\""
            - "ShiftAssignment.${charge_shift_id}.assigned_acuity_load_units == 1.0"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"
            - "exactly one CareAssignment row exists on encounter ${enc_id} — the debit was re-priced in place, not duplicated"

      - name: escalation_window_admits_the_exact_twenty_minute_instant_and_refuses_it_one_minute_later
        claim_type: Constants Applied
        grounds:
          - calculations.escalation_deadline_derivation
          - calculations.escalation_deadline_derivation.constants.ESCALATION_DUE_MINUTES
          - calculations.escalation_deadline_derivation.constants.TIER_ADVANCE_MINUTES
          - entities.FetalMonitoringAssessment.fields.escalation_due_at
          - entities.FetalMonitoringAssessment.fields.next_tier_due_at
          - validations[14.2]
          - endpoints[POST /fetal-monitoring-assessments/{assessmentId}/escalate]
        distinguishing_aspect: |
          ESCALATION_DUE_MINUTES[CATEGORY_II] is 20 and the escalate test is INCLUSIVE, so the tier-1
          call is still in time at exactly assessed_at + 20 minutes and out of time one minute later.
          Two sibling assessments recorded at the same instant, escalated one minute apart, put the
          boundary on both sides with nothing else different: the 06:20 call succeeds and derives
          next_tier_due_at from a SECOND constant (TIER_ADVANCE_MINUTES[CATEGORY_II] 15, measured from
          the notification instant, not from assessed_at, so 06:35), while the 06:21 call is refused
          with ERR_ESCALATION_WINDOW_EXPIRED. No capacity sweep runs, so this also pins that the
          deadline is enforced at call time rather than only materialised later as TIMED_OUT_BREACH —
          the refused assessment is still ESCALATION_DUE afterwards.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed (left unoccupied so the
            posture is never DIVERT and encounter creation is not blocked by 8.02). One ADVANCED RN on
            an ACTIVE CHARGE shift 05:00-15:00 — she is both a legal interpreter (cert IN {BASIC,
            ADVANCED}, on the case via the CHARGE shift, priority 12) and the only legal tier-1
            notification target (CHARGE slot, ACTIVE shift, priority 11.2). Two encounters each carry
            one CATEGORY_II assessment assessed at 06:00, so both sit in ESCALATION_DUE with
            escalation_due_at 2026-08-01T06:20:00Z.
