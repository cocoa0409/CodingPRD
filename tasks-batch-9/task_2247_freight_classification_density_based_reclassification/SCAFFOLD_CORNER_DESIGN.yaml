  # =========================================================================
  # Section 2 — State Machines (§1.2)
  # =========================================================================
  - section: state_machines
    instances:
      - name: tariff_version_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.tariff_version_lifecycle
          - endpoints[POST /ltl/tariff-versions]
        distinguishing_aspect: "A newly created standard is DRAFT with published_at null and superseded_by_tariff_version_id null; it is not auto-published even though its effective_at is already in the past relative to the clock."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
          assert:
            - "TariffVersion.${tv1}.status == DRAFT"
            - "TariffVersion.${tv1}.published_at == null"
            - "TariffVersion.${tv1}.superseded_by_tariff_version_id == null"
            - "TariffVersion.${tv1}.effective_at == 2026-01-01T00:00:00Z"
            - "TariffVersion.${tv1}.version == 1"

      - name: publishing_later_standard_supersedes_earlier_published_one
        claim_type: Valid Transition
        grounds:
          - state_machines.tariff_version_lifecycle.transitions[PUBLISHED->SUPERSEDED]
          - endpoints[POST /ltl/tariff-versions/{id}/publish]
        distinguishing_aspect: "Publishing NMFC-2026B (effective 2026-02-01) drives the currently PUBLISHED NMFC-2026A to SUPERSEDED and back-links it, while the new row is PUBLISHED with published_at stamped from the clock — supersession is a side effect of publish, not a separate call."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; NMFC-2026A created and published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/tariff-versions"
