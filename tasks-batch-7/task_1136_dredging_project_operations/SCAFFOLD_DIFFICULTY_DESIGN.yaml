# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1136, dredging)
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: final_certificate_in_place_vs_scow_divergence
        grounds:
          - calculations.scow_derived_quantity
          - calculations.survey_derived_quantity
          - entities.Project.fields.measurement_basis
          - entities.PaymentCertificate.fields.quantity_cy
        distinguishing_aspect: |
          Same physical dredging is measured two ways on the PaymentCertificate domain: measurement_basis=IN_PLACE
          pays the survey-derived 2000.00 cy while the scow-derived leg computes 2011.26 cy for the identical material;
          both numbers are exposed on the certificate and MUST differ.
        test_recipe:
          setup:
            - "ACTIVE project (basis IN_PLACE, base rate 1500c/cy, standby 5000c/h, LD 100000c/day), permit window [2026-05-01, 2026-08-31], limit 50 / ceiling 100 NTU / 24h average / 6h standdown"
            - "One reach (design 40000, required depth 25.0), plant 4000 cy/day, APPROVED plan, reach in DREDGING, accepted PRE_DREDGE survey of 40000 cy"
            - "One COMPLETED event; one CONFIRMED ticket witnessed 1609 cy at bulking 1.60; one ACCEPTED POST_DREDGE survey of 38000 cy at depth 25.0 (reach ACCEPTED, removed 2000.00)"
            - "Logical clock at 2026-05-20T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-DUAL", measurement_basis: "IN_PLACE", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "CUTTER_SUCTION", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - { call: "POST /projects/${proj_id}/activate", payload: {}, as: OwnerEngineer }
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "PRE_DREDGE", measured_volume_cy: 40000, min_sounding_depth_ft: 18.5 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_pre_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v1: $.data.version }
            - call: "POST /surveys/${survey_pre_id}/accept"
              payload: { expected_reach_version: "${reach_v1}" }
              as: OwnerEngineer
              as_user_id: eng-1
            - { call: "POST /reaches/${reach_id}/begin-dredging", payload: {}, as: ContractorOps }
            - call: "POST /dredge-events"
              payload: { reach_id: "${reach_id}", plant_id: "${plant_id}", started_utc: "2026-05-10T00:00:00Z" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { event_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: OwnerEngineer }
            - { call: "POST /dredge-events/${event_id}/complete", payload: {}, as: ContractorOps, as_user_id: ops-1 }
            - call: "POST /disposal-sites"
              payload: { name: "SITE-A", site_type: "OPEN_WATER", capacity_cy: 50000, bulking_factor: 1.6 }
              as: OwnerEngineer
              captures: { site_id: $.data.id }
            - call: "POST /placement-tickets"
              payload: { dredge_event_id: "${event_id}", disposal_site_id: "${site_id}", placed_utc: "2026-05-12T12:00:00Z", declared_volume_cy: 1609 }
              as: ContractorOps
              as_user_id: ops-1
              captures: { ticket_id: $.data.id }
            - call: "POST /placement-tickets/${ticket_id}/confirm"
              payload: { witnessed_volume_cy: 1609 }
              as: SiteOperator
              as_user_id: site-1
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "POST_DREDGE", measured_volume_cy: 38000, min_sounding_depth_ft: 25.0 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_post_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v2: $.data.version }
            - call: "POST /surveys/${survey_post_id}/accept"
              payload: { expected_reach_version: "${reach_v2}" }
              as: OwnerEngineer
              as_user_id: eng-1
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: OwnerEngineer }
          trigger:
            - call: "POST /payment-certificates"
              payload: { project_id: "${proj_id}", certificate_type: "FINAL", period_start_utc: "2026-05-01T00:00:00Z", period_end_utc: "2026-05-20T00:00:00Z", reach_ids: ["${reach_id}"] }
              as: ContractorOps
              as_user_id: ops-1
              captures: { cert_id: $.data.id }
            - call: "POST /payment-certificates/${cert_id}/submit"
              payload: {}
              as: ContractorOps
              as_user_id: ops-1
              captures: { qty: $.data.quantity_cy, scow_total: $.data.scow_derived_total_cy, survey_total: $.data.survey_derived_total_cy, cert_status: $.data.status }
          assert:
            - "PaymentCertificate.${cert_id}.quantity_cy == 2000.00 (IN_PLACE basis pays survey-derived)"
            - "PaymentCertificate.${cert_id}.survey_derived_total_cy == 2000.00"
            - "PaymentCertificate.${cert_id}.scow_derived_total_cy == 1005.63"
            - "quantity_cy (2000.00) != scow_derived_total_cy (1005.63) for identical material"
            - "PaymentCertificate.${cert_id}.status == SUBMITTED (reconciliation delta 0.563 pct <= 15)"

      - name: production_estimate_nominal_vs_risk_adjusted
        grounds:
          - calculations.production_estimate
          - entities.DredgePlan.fields.nominal_daily_production_cy
          - entities.DredgePlan.fields.risk_adjusted_daily_production_cy
        distinguishing_aspect: |
          On the DredgePlan scheduling domain (distinct from the payment domain of the sibling instance), the NOMINAL
          variant computes 4000.00 cy/day and 10 days while RISK_ADJUSTED computes 3200.00 cy/day and 13 days for
          identical inputs (plant 4000 cy/day, SAND, max depth 25.0 ft, design 40000 cy).
        test_recipe:
          setup:
            - "Project with one reach design 40000 cy, required depth 25.0 ft; plant rated 4000 cy/day; clock 2026-05-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-EST", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "CUTTER_SUCTION", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id, nom_daily: $.data.nominal_daily_production_cy, risk_daily: $.data.risk_adjusted_daily_production_cy, nom_days: $.data.nominal_duration_days, risk_days: $.data.risk_adjusted_duration_days }
          assert:
            - "DredgePlan.${plan_id}.nominal_daily_production_cy == 4000.00 (4000 x 1.00 x 1.00)"
            - "DredgePlan.${plan_id}.risk_adjusted_daily_production_cy == 3200.00 (4000.00 x 0.80)"
            - "DredgePlan.${plan_id}.nominal_duration_days == 10"
            - "DredgePlan.${plan_id}.risk_adjusted_duration_days == 13 (ceil(40000/3200))"
            - "NOMINAL and RISK_ADJUSTED diverge on identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: standby_pay_reason_branching_and_deductible
        grounds:
          - calculations.standby_payable_amount
          - entities.StandbyClaim.fields.payable_amount_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — a 10.0h claim at 5000 c/h pays 30000c for WEATHER
          (deductible 4h, multiplier 1.0), 15000c for SPECIES_SHUTDOWN (multiplier 0.5), and 0c for
          EQUIPMENT_BREAKDOWN (multiplier 0) — the reason branch flips the result for identical hours.
        test_recipe:
          setup:
            - "ACTIVE project, reach DREDGING, one event that was SHUTDOWN (SPECIES) for exactly 10.0h then resumed; clock 2026-05-10T16:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-SB", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - { call: "POST /projects/${proj_id}/activate", payload: {}, as: OwnerEngineer }
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "PRE_DREDGE", measured_volume_cy: 40000, min_sounding_depth_ft: 18.5 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_pre_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v1: $.data.version }
            - call: "POST /surveys/${survey_pre_id}/accept"
              payload: { expected_reach_version: "${reach_v1}" }
              as: OwnerEngineer
              as_user_id: eng-1
            - { call: "POST /reaches/${reach_id}/begin-dredging", payload: {}, as: ContractorOps }
            - call: "POST /dredge-events"
              payload: { reach_id: "${reach_id}", plant_id: "${plant_id}", started_utc: "2026-05-10T00:00:00Z" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { event_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T06:00:00Z" }, as: OwnerEngineer }
            - call: "POST /species-sightings"
              payload: { project_id: "${proj_id}", species_class: "FISH", observed_utc: "2026-05-10T06:00:00Z" }
              as: EnvironmentalMonitor
              captures: { sight_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T16:00:00Z" }, as: OwnerEngineer }
            - { call: "POST /species-sightings/${sight_id}/clear", payload: {}, as: EnvironmentalMonitor }
            - { call: "POST /dredge-events/${event_id}/resume", payload: {}, as: ContractorOps, as_user_id: ops-1 }
          trigger:
            - call: "POST /standby-claims"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", period_start_utc: "2026-05-10T06:00:00Z", period_end_utc: "2026-05-10T16:00:00Z", claimed_hours: 10.0, reason: "WEATHER" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { claim_w: $.data.id, amt_w: $.data.payable_amount_cents }
            - call: "POST /standby-claims"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", period_start_utc: "2026-05-10T06:00:00Z", period_end_utc: "2026-05-10T16:00:00Z", claimed_hours: 10.0, reason: "SPECIES_SHUTDOWN" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { claim_s: $.data.id, amt_s: $.data.payable_amount_cents }
            - call: "POST /standby-claims"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", period_start_utc: "2026-05-10T06:00:00Z", period_end_utc: "2026-05-10T16:00:00Z", claimed_hours: 10.0, reason: "EQUIPMENT_BREAKDOWN" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { claim_e: $.data.id, amt_e: $.data.payable_amount_cents }
          assert:
            - "StandbyClaim.${claim_w}.payable_hours == 6.0 and payable_amount_cents == 30000 (6.0 x 5000 x 1.0)"
            - "StandbyClaim.${claim_s}.payable_hours == 6.0 and payable_amount_cents == 15000 (6.0 x 5000 x 0.5)"
            - "StandbyClaim.${claim_e}.payable_hours == 0 and payable_amount_cents == 0"
            - "Identical hours/rate produce three different amounts via the reason branch"

      - name: scow_per_ticket_rounding_beats_sum_then_divide
        grounds:
          - calculations.scow_derived_quantity
          - entities.PlacementTicket.fields.in_situ_volume_cy
          - entities.PaymentCertificate.fields.quantity_cy
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-ticket-first — two tickets of witnessed 1609 cy at bulking
          1.60 yield 1005.63 + 1005.63 = 2011.26 cy on the INTERIM certificate, whereas the forbidden
          sum-then-divide order would yield round(3218/1.6) = 2011.25; the certificate MUST read 2011.26.
        test_recipe:
          setup:
            - "ACTIVE project (basis SCOW), reach DREDGING, two COMPLETED events, site bulking 1.60, two CONFIRMED tickets of witnessed 1609 cy each placed 2026-05-12; clock 2026-05-20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-RND", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - { call: "POST /projects/${proj_id}/activate", payload: {}, as: OwnerEngineer }
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "PRE_DREDGE", measured_volume_cy: 40000, min_sounding_depth_ft: 18.5 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_pre_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v1: $.data.version }
            - call: "POST /surveys/${survey_pre_id}/accept"
              payload: { expected_reach_version: "${reach_v1}" }
              as: OwnerEngineer
              as_user_id: eng-1
            - { call: "POST /reaches/${reach_id}/begin-dredging", payload: {}, as: ContractorOps }
            - call: "POST /dredge-events"
              payload: { reach_id: "${reach_id}", plant_id: "${plant_id}", started_utc: "2026-05-10T00:00:00Z" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { ev1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: OwnerEngineer }
            - { call: "POST /dredge-events/${ev1}/complete", payload: {}, as: ContractorOps, as_user_id: ops-1 }
            - call: "POST /dredge-events"
              payload: { reach_id: "${reach_id}", plant_id: "${plant_id}", started_utc: "2026-05-12T00:00:00Z" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { ev2: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T00:00:00Z" }, as: OwnerEngineer }
            - { call: "POST /dredge-events/${ev2}/complete", payload: {}, as: ContractorOps, as_user_id: ops-1 }
            - call: "POST /disposal-sites"
              payload: { name: "SITE-B", site_type: "UPLAND_CONFINED", capacity_cy: 50000, bulking_factor: 1.6 }
              as: OwnerEngineer
              captures: { site_id: $.data.id }
            - call: "POST /placement-tickets"
              payload: { dredge_event_id: "${ev1}", disposal_site_id: "${site_id}", placed_utc: "2026-05-12T12:00:00Z", declared_volume_cy: 1609 }
              as: ContractorOps
              as_user_id: ops-1
              captures: { tk1: $.data.id }
            - call: "POST /placement-tickets/${tk1}/confirm"
              payload: { witnessed_volume_cy: 1609 }
              as: SiteOperator
              as_user_id: site-1
              captures: { insitu1: $.data.in_situ_volume_cy }
            - call: "POST /placement-tickets"
              payload: { dredge_event_id: "${ev2}", disposal_site_id: "${site_id}", placed_utc: "2026-05-12T13:00:00Z", declared_volume_cy: 1609 }
              as: ContractorOps
              as_user_id: ops-1
              captures: { tk2: $.data.id }
            - call: "POST /placement-tickets/${tk2}/confirm"
              payload: { witnessed_volume_cy: 1609 }
              as: SiteOperator
              as_user_id: site-1
              captures: { insitu2: $.data.in_situ_volume_cy }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: OwnerEngineer }
          trigger:
            - call: "POST /payment-certificates"
              payload: { project_id: "${proj_id}", certificate_type: "INTERIM", period_start_utc: "2026-05-01T00:00:00Z", period_end_utc: "2026-05-31T00:00:00Z", reach_ids: ["${reach_id}"] }
              as: ContractorOps
              as_user_id: ops-1
              captures: { cert_id: $.data.id }
            - call: "POST /payment-certificates/${cert_id}/submit"
              payload: {}
              as: ContractorOps
              as_user_id: ops-1
              captures: { cert_qty: $.data.quantity_cy }
          assert:
            - "PlacementTicket.${tk1}.in_situ_volume_cy == 1005.63 (round_half_up(1609/1.6, 2) per ticket)"
            - "PlacementTicket.${tk2}.in_situ_volume_cy == 1005.63"
            - "PaymentCertificate.${cert_id}.quantity_cy == 2011.26 (per-ticket round then sum; sum-then-divide 2011.25 is a violation)"

      - name: final_settlement_frozen_snapshot_order
        grounds:
          - calculations.final_settlement_total
          - entities.Project.fields.allowed_days_frozen
          - entities.PaymentCertificate.fields.liquidated_damages_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order — allowed days are frozen at
          activation (13, from the SAND plan); a later CLAY plan (risk-adjusted 18 days) is APPROVED and supersedes it,
          yet the FINAL certificate's LD MUST still use the frozen 13: LD = 100000 x max(0, 19 - 13) = 600000, not 100000.
        test_recipe:
          setup:
