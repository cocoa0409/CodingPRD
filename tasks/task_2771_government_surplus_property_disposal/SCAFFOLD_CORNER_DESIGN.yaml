              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
          trigger:
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a1}", opens_at: "2026-08-04T00:00:00Z", tier_window_days: 3 }
              as: DisposalOfficer
              as_user_id: "officer-01"
