      - name: validation_dispute_state_rules_reject_every_out_of_turn_step
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - validations[priority=22]
          - validations[priority=23]
          - validations[priority=24]
          - validations[priority=41]
          - endpoints[POST /disputes/{id}/review]
          - endpoints[POST /disputes/{id}/resolve]
          - endpoints[POST /disputes/{id}/respond]
        distinguishing_aspect: "Each of the three dispute actions guards a different single status, so out-of-turn calls must return three distinct errors rather than one generic conflict: resolve on SUBMITTED is ERR_DISPUTE_NOT_RESOLVABLE, respond on SUBMITTED and again on UNDER_REVIEW is ERR_DISPUTE_NOT_RESPONDABLE, a second review on UNDER_REVIEW is ERR_DISPUTE_NOT_REVIEWABLE, and a second filing against the same evaluation is ERR_DISPUTE_ALREADY_OPEN (priority 18 deliberately lets the DISPUTED feedback status through to priority 41). The author's own review attempt is ERR_SEGREGATION_OF_DUTIES even though the status is perfectly reviewable."
        test_recipe:
          setup:
            - "form F1 active; agent A-1001; evaluators Eve (author) and Ravi (independent reviewer); evaluation ${e1} submitted at 82.00, delivered, and disputed by the agent"
