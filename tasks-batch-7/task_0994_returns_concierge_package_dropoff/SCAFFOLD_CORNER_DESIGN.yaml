            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/seal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/carrier-routes/${route_id}/dispatch", payload: {}, as: CarrierDispatcher }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/dispatch", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ROUTE_WEIGHT_EXCEEDED"]

      - name: oversize_reject_approve_reroutes_order_to_home_pickup
        claim_type: side_effect_execution
        grounds: [state_machines.ReturnOrder.EXCEPTION_PENDING_to_INITIATED]
        distinguishing_aspect: "OVERSIZE_REJECT resolved APPROVED voids the label, releases the reservation, flips method to HOME_PICKUP and returns the order to INITIATED (cyclic reroute)."
        test_recipe:
          setup: ["LOCKER_QR order consumed at a locker (DROPPED_OFF); OVERSIZE_REJECT exception open; investigating"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-OR", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sor@x.com", full_name: "S OR", postal_code: "30030" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-OR", kind: LOCKER, postal_code: "30031" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "OR", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 140, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res_id: $.data.id } }
            - { call: "POST /v1/slot-reservations/${res_id}/consume", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/exception-cases", payload: { return_order_id: "${ro_id}", kind: OVERSIZE_REJECT, note: "does not fit locker" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { ex_id: $.data.id } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v: $.data.version } }
          trigger:
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, expected_exception_case_version: "${ex_v}" }, as: SupportAgent, as_user_id: "agent-b" }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: PlatformAdmin, captures: { ro_st: $.data.status, ro_method: $.data.method } }
            - { call: "GET /v1/slot-reservations/${res_id}", payload: {}, as: PlatformAdmin, captures: { res_st: $.data.status } }
          assert:
            - "ro_st == INITIATED and ro_method == HOME_PICKUP (reroute)"
            - "res_st == CONSUMED (it was consumed before the exception; no rewind of the physical deposit)"

      - name: order_create_without_open_cycle_rejected
        claim_type: precondition_enforcement
        grounds: [calculations.overage_guard, "errors[ERR_BILLING_CYCLE_NOT_OPEN]"]
        distinguishing_aspect: "Merchant with no cycle covering the clock cannot accept returns: ERR_BILLING_CYCLE_NOT_OPEN."
        test_recipe:
          setup: ["Merchant with NO billing cycle"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-NC", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/shoppers", payload: { email: "snc@x.com", full_name: "S NC", postal_code: "30032" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "NC", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_BILLING_CYCLE_NOT_OPEN"]

  # ===================================================== 3. Calculations
  - section: calculations
    instances:
      - name: refund_estimate_pessimistic_variant_covered
        claim_type: variant_divergence
        grounds: [calculations.refund_settlement]
        excluded_because:
          difficulty_instance: refund_provisional_vs_final_free_returns_divergence
          rationale: "Provisional-vs-final divergence on ReturnOrder asserted there with literals 9000 vs 10000."

      - name: billing_surcharges_use_actuals_in_both_variants
        claim_type: correct_result
        grounds: [calculations.billing_cycle_charge, entities.BillingCycle.fields.surcharge_cents]
        distinguishing_aspect: "Surcharges always use ACTUAL fulfilled orders in both variants: one fulfilled HOME_PICKUP order with an oversize item yields surcharge_cents 2200 (1500 oversize + 700 pickup) in preview and close alike."
        test_recipe:
          setup:
            - "Plan: monthly 1000, included 10, overage 10, pickup true, oversize true, oversize_surcharge 1500, pickup_fee 700; merchant; OPEN cycle; shopper; zone"
            - "One HOME_PICKUP order with an oversize item (dim 200) fulfilled to REFUND_POSTED"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 10, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 1500, pickup_fee_cents: 700 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Sur", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_id: $.data.id } }
            - { call: "POST /v1/shoppers", payload: { email: "ssu@x.com", full_name: "S Sur", postal_code: "30033" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZSU", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "SU", quantity: 1, unit_price_cents: 9000, declared_condition: NEW, longest_side_cm: 200, weight_grams: 9000 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/billing-cycles/${bc_id}/charge-preview", payload: {}, as: PlatformAdmin, captures: { p_sur: $.data.surcharge_cents, p_gross: $.data.gross_cents, p_tot: $.data.total_cents } }
            - { call: "POST /v1/billing-cycles/${bc_id}/close", payload: {}, as: PlatformAdmin, captures: { c_sur: $.data.surcharge_cents, c_tot: $.data.total_cents } }
          assert:
            - "p_sur == 2200 and p_gross == 3200 and p_tot == 3200"
            - "c_sur == 2200 and c_tot == 3200 (surcharges identical across variants)"

      - name: overage_guard_projected_equals_cap_allowed
        claim_type: constants_applied
        grounds: [calculations.overage_guard, "errors[ERR_OVERAGE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "With included_returns 1 the hard cap is 2: the second create (projected 2 == 2) succeeds; the third (projected 3 > 2) fails with ERR_OVERAGE_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["Plan included 1; merchant; OPEN cycle; shopper; one order already INITIATED (in-flight 1)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 1, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-OG", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sog@x.com", full_name: "S OG", postal_code: "30034" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O3", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "ro2 created (projected 2 == cap 2 allowed)"
            - "err == ERR_OVERAGE_LIMIT_EXCEEDED (projected 3 > 2)"

      - name: label_ttl_expires_at_exactly_ten_days
        claim_type: boundary_precision
        grounds: [calculations.label_expiry, entities.Label.fields.expires_at]
        distinguishing_aspect: "At expires_at - 1s the sweep leaves the label ISSUED; at exactly expires_at (issued + 10 days) the sweep flips it EXPIRED."
        test_recipe:
          setup: ["COUNTER_DROP order with label issued at 2026-05-01T00:00:00Z (expires 2026-05-11T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-TTL", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "stt@x.com", full_name: "S TTL", postal_code: "30035" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "TT", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { lb_id: $.data.id, lb_exp: $.data.expires_at } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T23:59:59Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_maintenance/run_sweep", payload: {}, as: PlatformAdmin, captures: { n1: $.data.expired_label_count } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_maintenance/run_sweep", payload: {}, as: PlatformAdmin, captures: { n2: $.data.expired_label_count } }
            - { call: "GET /v1/labels/${lb_id}", payload: {}, as: PlatformAdmin, captures: { lb_st: $.data.status } }
          assert:
            - "lb_exp == \"2026-05-11T00:00:00Z\""
            - "n1 == 0 (not yet expired at -1s)"
            - "n2 == 1 and lb_st == EXPIRED at exactly expires_at"

      - name: demand_load_excludes_exhausted_failed
        claim_type: input_set_filtering
        grounds: [calculations.zone_window_load, entities.CourierZone.fields.demand_load]
        distinguishing_aspect: "A FAILED appointment with attempt_count == 3 is excluded from demand_load (retry exhausted): confirmed 1, demand 1 — unlike §1.8's retryable case."
        test_recipe:
          setup: ["Zone ZE capacity 5; order X with overlapping SCHEDULED appointment; order Y's appointment FAILED three times (attempt_count 3); clock inside both windows"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-DE", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
