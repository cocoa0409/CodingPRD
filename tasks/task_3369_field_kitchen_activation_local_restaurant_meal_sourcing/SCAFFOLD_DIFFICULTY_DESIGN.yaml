  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_funding_ceiling_on_meal_order_creation
        grounds:
          - validations[priority=11]
          - validations[priority=29]
          - errors[ERR_PARTNER_KITCHEN_NOT_CONTRACTED]
          - errors[ERR_FUNDING_CEILING_EXCEEDED]
        distinguishing_aspect: |
          The same POST /field-ops/meal-orders payload breaks both a state rule (partner kitchen
          SUSPENDED) and a business_fiscal rule (order cost above the remaining funding ceiling) and
          returns ERR_PARTNER_KITCHEN_NOT_CONTRACTED, then returns ERR_FUNDING_CEILING_EXCEEDED once the
          kitchen is reinstated and the state violation is gone.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE with funding_ceiling_cents 100000 and spent_cents 0"
            - "PartnerKitchen ${pk_id} is CONTRACTED / PRODUCING with per_meal_price_cents 1500"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 100000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
