          trigger:
            - call: "POST /auction-lots/${lot1}/bids"
              payload: { bidder_id: "${bd1}", amount_cents: 1000 }
              as: Bidder
              as_user_id: "${bd1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /auction-lots/${lot1}/open"
              payload: {}
