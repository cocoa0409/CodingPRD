              captures: { xa2_status: $.data.status }
            - call: "POST /society/schools"
              payload: { name: "Y School", display_name: "Y Schoolhouse", uses_method_name: false, contact_email: "y@x.org" }
              as: SocietyAdmin
              captures: { y_id: $.data.id }
            - call: "POST /society/schools/${y_id}/dues-payments"
