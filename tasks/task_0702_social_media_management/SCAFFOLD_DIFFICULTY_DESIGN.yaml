              captures: { err: $.data.error_id }
          assert:
            - "Second spend 30000 into the SAME day 0 bucket (aggregate 30000+30000=60000 > 50000 daily cap) returns HTTP 409 error_id == ERR_DAILY_CAP_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: boost_reserve_then_cancel_conserves_client_budget
        grounds:
          - state_machines.BoostCampaign.DRAFT_to_RESERVED
          - state_machines.BoostCampaign.RESERVED_to_CANCELLED
          - calculations.client_budget_conservation
          - entities.Client.fields.boost_available_cents
        distinguishing_aspect: |
          Conserved quantity = Client.boost_available_cents. Reserve (-100000) then cancel
          (+100000) leaves boost_available_cents back at 1000000 exactly, and the BOOST_RESERVE
          / BOOST_RELEASE ledger amounts sum to 0.
        test_recipe:
          setup:
            - "ACTIVE client boost_budget_limit_cents=1000000, boost_available_cents=1000000, with one DRAFT BoostCampaign requested_budget_cents=100000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "InvCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "SCALE", monthly_retainer_fee_cents: 400000, monthly_boost_budget_cents: 1000000, monthly_post_quota: 10, included_channels: 2 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "X", handle: "@invco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "IB", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /boost-campaigns"
              payload: { client_id: "${cid}", content_item_id: "${ci}", requested_budget_cents: 100000, daily_cap_cents: 50000, duration_days: 2 }
              as: FinanceController
              captures: { bc: $.data.id }
          trigger:
            - call: "GET /clients/${cid}"
              payload: {}
              as: FinanceController
              captures: { cver: $.data.version }
            - call: "POST /boost-campaigns/${bc}/reserve"
              payload: { expected_client_version: "${cver}" }
              as: FinanceController
            - call: "POST /boost-campaigns/${bc}/cancel"
              payload: {}
              as: FinanceController
            - call: "GET /clients/${cid}"
              payload: {}
              as: FinanceController
              captures: { avail: $.data.boost_available_cents, reserved: $.data.boost_reserved_cents }
          assert:
            - "Client.${cid}.boost_available_cents after reserve+cancel == 1000000 (unchanged from before reserve)"
            - "Client.${cid}.boost_reserved_cents == 0"
            - "Sum of LedgerEntry.amount_cents for boost ${bc} (BOOST_RESERVE +100000 and BOOST_RELEASE -100000) == 0"

      - name: schedule_then_unschedule_conserves_channel_slot_occupancy
        grounds:
          - state_machines.ContentItem.APPROVED_to_SCHEDULED
          - state_machines.ContentItem.SCHEDULED_to_APPROVED
          - state_machines.ScheduleSlot.RESERVED_to_RELEASED
          - entities.ScheduleSlot.fields.status
        distinguishing_aspect: |
          Different conserved quantity = count of RESERVED ScheduleSlots on the channel
          (timeline occupancy). Schedule reserves one slot then unschedule releases it, so
          the channel's RESERVED-slot count returns to 0 and a fresh slot reusing the
          identical start timestamp is accepted again — occupancy is conserved.
        test_recipe:
          setup:
            - "ACTIVE client, LIVE channel min_publish_gap_minutes=30, with an APPROVED ContentItem (one ContentTarget) and zero RESERVED slots on the channel."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "OccCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "LINKEDIN", handle: "@occco", min_publish_gap_minutes: 30 }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "OB", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
          trigger:
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-12T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
              captures: { slot: $.data.scheduled_slot_id }
            - call: "POST /content-items/${ci}/unschedule"
              payload: {}
              as: AccountManager
              captures: { st: $.data.status, sslot: $.data.scheduled_slot_id }
            - call: "GET /schedule-slots/${slot}"
              payload: {}
              as: AccountManager
              captures: { slot_st: $.data.status }
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-12T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
              captures: { st2: $.data.status }
          assert:
            - "After unschedule, ScheduleSlot.${slot}.status == RELEASED and ContentItem.${ci}.scheduled_slot_id == null"
            - "Re-scheduling at the same 09:00 time succeeds (RESERVED-slot occupancy was conserved back to 0); ContentItem.${ci}.status == SCHEDULED"
