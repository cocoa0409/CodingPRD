              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8B-A", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_a: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8B-B", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_b: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8B-C", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_c: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-X8B", arm_count: 4, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-X8B", concurrent_slot_capacity: 2, airflow_mode: "AMBIENT" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X8B-OPR", full_name: "Osmo Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-X8B", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-X8B", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-X8B", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 3 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v1: $.data.version }
          trigger:
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_p: $.data.id, p_cool_start: $.data.cooling_window_start_at, p_cool_end: $.data.cooling_window_end_at }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_q: $.data.id, q_cool_start: $.data.cooling_window_start_at, q_cool_end: $.data.cooling_window_end_at, q_mold: $.data.mold_id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v3: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 3, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v3}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { err_bay: $.data.error_id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v4: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 3, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:01Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v4}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_t: $.data.id, t_cool_start: $.data.cooling_window_start_at, t_mold: $.data.mold_id }
          assert:
            - "${p_cool_start} == 2026-08-01T10:00:00Z and ${p_cool_end} == 2026-08-01T10:30:00Z"
            - "${q_cool_start} == 2026-08-01T10:30:00Z and ${q_cool_end} == 2026-08-01T11:00:00Z"
            - "cyc_q is ACCEPTED with HTTP 201 even though its cooling window starts at the exact instant cyc_p's ends: the CLOSED comparison makes them intersect at 10:30:00, so the intersecting count is 1, and 1 < concurrent_slot_capacity 2"
            - "${q_mold} == ${mold_b}   (MLD-X8B-A's half-open occupancy span [09:00:00, 10:30:00) overlaps cyc_q's [09:30:00, 11:00:00), so A is excluded and mold_code ASC picks B)"
            - "the arm-3 cycle at 09:30:00 returns HTTP 409 with error_id ERR_COOLING_BAY_CAPACITY_EXCEEDED: its closed cooling window [10:30:00, 11:00:00] intersects cyc_p (at the single instant 10:30:00) AND cyc_q (entirely), so the count is 2 >= 2"
            - "that refusal is NOT ERR_OVEN_WINDOW_CONFLICT (arm 3 is empty) and NOT ERR_NO_ELIGIBLE_MOLD (MLD-X8B-C is still free), so the cooling-bay rule is the sole cause"
            - "${po_v4} == ${po_v3}   (the refused cycle wrote nothing)"
            - "${t_cool_start} == 2026-08-01T10:30:01Z and the retry at 09:30:01 returns HTTP 201: [10:30:01, 11:00:01] no longer touches cyc_p's window, so the count falls to 1 < 2"
            - "${t_mold} == ${mold_c}"
            - "DIVERGENCE PINNED: a start instant equal to an existing end instant is FREE for the oven arm (half-open) but CONSUMES A SLOT for the cooling bay (closed), and the bay counts occupants against a capacity instead of demanding exclusivity"
            - "exactly three cycles exist for PO-X8B and ProductionOrder.${po}.status == IN_PRODUCTION"

      - name: mold_half_open_oven_plus_cooling_span_occupancy_vs_capability
        grounds:
          - calculations.mold_selection
          - calculations.cycle_window_projection
          - validations[priority=70]
          - errors.ERR_MOLD_WINDOW_CONFLICT
          - errors.ERR_NO_ELIGIBLE_MOLD
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
        distinguishing_aspect: |
          The mould is an EXCLUSIVE resource whose occupancy span covers oven AND cooling,
          [oven_start_at, cooling_window_end_at), with NO buffer whatsoever — a third geometry
          distinct from both the buffered arm and the counted bay — and it is the only one of the
          three that distinguishes an OCCUPANCY failure (ERR_MOLD_WINDOW_CONFLICT, raised when
          every AVAILABLE mould is excluded by overlap) from a CAPABILITY failure
          (ERR_NO_ELIGIBLE_MOLD, raised once the pool holds no AVAILABLE mould at all).
        test_recipe:
          setup:
            - "ProductModel PM-X8C-KM: KAYAK/MID, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30."
            - "EXACTLY ONE Mold MLD-X8C-1 for that model: single-cavity, nominal_charge_kg 24.000, service_interval_cycles 10, cycles_since_service 0, status AVAILABLE — a pool of one is what lets the empty-pool fallback be observed unambiguously."
            - "OvenStation OV-X8C: arm_count 4, changeover_buffer_min 15 — each cycle takes its own arm, so priority 62 never fires."
            - "CoolingBay CB-X8C: concurrent_slot_capacity 4, airflow_mode AMBIENT — capacity is generous, so priority 71 never fires."
            - "One ACTIVE MOLDING_OPERATOR T-X8C-OPR; Warehouse WH-X8C 20.0000 (NORMAL); qualified ResinLot LOT-X8C received_kg 500.000."
