          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /supply-rooms/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /contracts/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ContractAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /contract-lines/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ContractAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ContractAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /lots/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ContractAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /formulary-items/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ContractAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /order-lines/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ContractAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /substitution-requests/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ContractAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /recall-notices/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ContractAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /delivery-routes/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ContractAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /chargeback-claims/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ContractAdmin
              captures: { e11: $.data.error_id }
          assert:
            - "${e1} == ERR_SUPPLY_ROOM_NOT_FOUND, ${e2} == ERR_CONTRACT_NOT_FOUND, ${e3} == ERR_CONTRACT_LINE_NOT_FOUND, ${e4} == ERR_ORDER_NOT_FOUND, ${e5} == ERR_LOT_NOT_FOUND"
            - "${e6} == ERR_FORMULARY_ITEM_NOT_FOUND, ${e7} == ERR_ORDER_LINE_NOT_FOUND, ${e8} == ERR_SUBSTITUTION_REQUEST_NOT_FOUND"
            - "${e9} == ERR_RECALL_NOTICE_NOT_FOUND, ${e10} == ERR_ROUTE_NOT_FOUND, ${e11} == ERR_CHARGEBACK_CLAIM_NOT_FOUND"
            - "every response is HTTP 404 with response_type == error"

      - name: duplicate_sku_contract_code_contract_line_and_route_code_each_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_SKU]
          - errors[ERR_DUPLICATE_CONTRACT_CODE]
          - errors[ERR_DUPLICATE_CONTRACT_LINE]
          - errors[ERR_DUPLICATE_ROUTE_CODE]
          - validations[priority=9]
        distinguishing_aspect: "Four distinct uniqueness constraints each raise their own 409 error id: repeated sku, repeated contract_code, a second line for the same (contract, item) pair, and a repeated route_code."
        test_recipe:
          setup:
            - "One item, one contract with one line for that item, and one route already exist."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-UNQ-CS", description: "Uniqueness probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 4000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
