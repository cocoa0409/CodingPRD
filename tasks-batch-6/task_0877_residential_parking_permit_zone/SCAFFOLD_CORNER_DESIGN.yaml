# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: create_zone_success_returns_201
        claim_type: creation
        grounds: [entities.Zone, endpoints]
        distinguishing_aspect: "POST /zones with all required fields returns 201 with status ACTIVE, version 1, and zeroed counters/ledgers."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
          trigger:
            - { call: "POST /zones", payload: { name: "New RPZ", zone_code: "RPZ-E1", permit_capacity: 3, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
          assert:
            - "response.status == 201"
            - "Zone.${zid}.status == ACTIVE"
            - "Zone.${zid}.version == 1"
            - "Zone.${zid}.active_permit_count == 0"
            - "Zone.${zid}.fees_collected_cents == 0"

      - name: zone_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Zone, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /zones/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "X", zone_code: "RPZ-E2", permit_capacity: 1, max_permits_per_household: 1, guest_pass_daily_limit: 1, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor }
          trigger:
            - { call: "GET /zones/00000000-0000-0000-0000-000000000000", payload: {}, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: household_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Household, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /households without contact_email returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A zone exists."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "Y", zone_code: "RPZ-E3", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "1 A", resident_name: "N" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 400"

      - name: version_system_field_starts_at_one
        claim_type: system_fields
        grounds: [entities.Household.fields.version]
        distinguishing_aspect: "A freshly created Household has system version == 1 and proof_status UNVERIFIED regardless of any client input."
        test_recipe:
          setup: ["A zone exists."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "Z", zone_code: "RPZ-E4", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "2 A", resident_name: "M", contact_email: "m@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
          assert:
            - "Household.${hid}.version == 1"
            - "Household.${hid}.proof_status == UNVERIFIED"
            - "Household.${hid}.active_permit_count == 0"

      - name: proof_submission_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ProofSubmission.fields.document_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /households/{id}/proof-submissions with a document_type outside {LEASE,UTILITY_BILL,DEED,ID_CARD} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A zone and household exist."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "E5", zone_code: "RPZ-E5", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "3 A", resident_name: "P", contact_email: "p@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
          trigger:
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "PASSPORT" }, as: Resident, as_user_id: "${hid}", captures: { err: $.data.error_id } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 400"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: pay_already_paid_citation_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Citation.ISSUED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a citation already in terminal PAID returns ERR_INVALID_STATE (409); no double-payment."
        test_recipe:
          setup: ["An ISSUED citation is paid once (PAID)."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "SM1", zone_code: "RPZ-S1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "4 A", resident_name: "Q", contact_email: "q@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zid}", license_plate: "PAY1", violation_type: "ZONE_VIOLATION" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { cid: $.data.id } }
            - { call: "POST /citations/${cid}/pay", payload: {}, as: Resident, as_user_id: "${hid}" }
          trigger:
            - { call: "POST /citations/${cid}/pay", payload: {}, as: Resident, as_user_id: "${hid}", captures: { err: $.data.error_id } }
          assert:
            - "Citation.${cid}.status == PAID"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: approve_denied_application_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PermitApplication.UNDER_REVIEW_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application in terminal DENIED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An application reviewed then DENIED."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "SM2", zone_code: "RPZ-S2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "5 A", resident_name: "R", contact_email: "r@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "S2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/deny", payload: { denial_reason: "ineligible" }, as: PermitSupervisor }
          trigger:
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "PermitApplication.${aid}.status == DENIED"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: suspend_already_suspended_zone_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Zone.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a zone already SUSPENDED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUSPENDED zone."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "SM3", zone_code: "RPZ-S3", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /zones/${zid}/suspend", payload: {}, as: PermitSupervisor }
          trigger:
            - { call: "POST /zones/${zid}/suspend", payload: {}, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "Zone.${zid}.status == SUSPENDED"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: resolve_already_resolved_complaint_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Complaint.OPEN_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a complaint already in terminal RESOLVED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A RESOLVED complaint."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "SM4", zone_code: "RPZ-S4", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /complaints", payload: { zone_id: "${zid}", complaint_type: "SIGNAGE", description: "faded sign" }, as: Resident, as_user_id: "resident-x", captures: { kid: $.data.id } }
            - { call: "POST /complaints/${kid}/resolve", payload: { outcome: "RESOLVED", resolution_note: "repainted" }, as: EnforcementOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /complaints/${kid}/resolve", payload: { outcome: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "Complaint.${kid}.status == RESOLVED"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

  # ------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: temporary_pass_charges_flat_fee
        claim_type: correct_result
        grounds: [calculations.guest_pass_daily_usage, entities.VisitorPass.fields.fee_charged_cents]
        distinguishing_aspect: "A TEMPORARY visitor pass sets fee_charged_cents == Zone.visitor_pass_fee_cents (500)."
        test_recipe:
          setup: ["Household with an ACTIVE permit; visitor_pass_fee_cents=500."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "CA1", zone_code: "RPZ-CA1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 5, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "6 A", resident_name: "S", contact_email: "s@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "CA1-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /visitor-passes", payload: { household_id: "${hid}", permit_id: "${pid}", pass_type: "TEMPORARY", guest_plate: "GT1", valid_from: "2026-05-03T08:00:00.000Z", valid_until: "2026-05-04T08:00:00.000Z" }, as: Resident, as_user_id: "${hid}", captures: { vp: $.data.id } }
          assert:
            - "VisitorPass.${vp}.fee_charged_cents == 500"
            - "VisitorPass.${vp}.status == ACTIVE"

      - name: guest_daily_pass_is_free
        claim_type: correct_result
        grounds: [entities.VisitorPass.fields.fee_charged_cents]
        distinguishing_aspect: "A GUEST_DAILY visitor pass sets fee_charged_cents == 0."
        test_recipe:
          setup: ["Household with an ACTIVE permit."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "CA2", zone_code: "RPZ-CA2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 5, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "7 A", resident_name: "T", contact_email: "t@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "CA2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /visitor-passes", payload: { household_id: "${hid}", permit_id: "${pid}", pass_type: "GUEST_DAILY", guest_plate: "GD1", valid_from: "2026-05-03T08:00:00.000Z", valid_until: "2026-05-03T20:00:00.000Z" }, as: Resident, as_user_id: "${hid}", captures: { vp: $.data.id } }
          assert:
            - "VisitorPass.${vp}.fee_charged_cents == 0"

      - name: waitlist_positions_ordered_by_created_at
        claim_type: correct_result
        grounds: [calculations.waitlist_position, state_machines.PermitApplication.UNDER_REVIEW_to_WAITLISTED]
        distinguishing_aspect: "Two applications waitlisted in a full zone get position 1 and 2 by created_at ASC (never by id)."
        test_recipe:
          setup: ["Capacity-1 zone full (one ACTIVE permit). Two later applications are waitlisted in order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "CA3", zone_code: "RPZ-CA3", permit_capacity: 1, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "1 W", resident_name: "W1", contact_email: "w1@x.com" }, as: Anonymous, captures: { h0: $.data.id } }
            - { call: "POST /households/${h0}/vehicles", payload: { license_plate: "W0-A", make: "A", model: "B" }, as: Resident, as_user_id: "${h0}", captures: { v0: $.data.id } }
            - { call: "POST /households/${h0}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h0}", captures: { pf0: $.data.id } }
            - { call: "POST /proof-submissions/${pf0}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${h0}", vehicle_id: "${v0}" }, as: Resident, as_user_id: "${h0}", captures: { a0: $.data.id } }
            - { call: "POST /permit-applications/${a0}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a0}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "2 W", resident_name: "W2", contact_email: "w2@x.com" }, as: Anonymous, captures: { h1: $.data.id } }
            - { call: "POST /households/${h1}/vehicles", payload: { license_plate: "W1-A", make: "A", model: "B" }, as: Resident, as_user_id: "${h1}", captures: { v1: $.data.id } }
            - { call: "POST /households/${h1}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h1}", captures: { pf1: $.data.id } }
            - { call: "POST /proof-submissions/${pf1}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${h1}", vehicle_id: "${v1}" }, as: Resident, as_user_id: "${h1}", captures: { a1: $.data.id } }
            - { call: "POST /permit-applications/${a1}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a1}/waitlist", payload: {}, as: ParkingClerk, captures: { w1: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "3 W", resident_name: "W3", contact_email: "w3@x.com" }, as: Anonymous, captures: { h2: $.data.id } }
            - { call: "POST /households/${h2}/vehicles", payload: { license_plate: "W2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${h2}", captures: { v2: $.data.id } }
            - { call: "POST /households/${h2}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h2}", captures: { pf2: $.data.id } }
            - { call: "POST /proof-submissions/${pf2}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${h2}", vehicle_id: "${v2}" }, as: Resident, as_user_id: "${h2}", captures: { a2: $.data.id } }
            - { call: "POST /permit-applications/${a2}/review", payload: {}, as: ParkingClerk }
          trigger:
            - { call: "POST /permit-applications/${a2}/waitlist", payload: {}, as: ParkingClerk, captures: { w2: $.data.id } }
          assert:
            - "WaitlistEntry.${w1}.position == 1"
            - "WaitlistEntry.${w2}.position == 2"
            - "Zone.${zid}.waitlist_count == 2"

  # -------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A zone exists."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "V1", zone_code: "RPZ-V1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
          trigger:
            - { call: "GET /zones/${zid}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status == 401"

      - name: duplicate_application_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_APPLICATION]"]
        distinguishing_aspect: "A second open application for the same household+vehicle returns ERR_DUPLICATE_APPLICATION (409)."
        test_recipe:
          setup: ["Household with a SUBMITTED application for vehicle V."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "V2", zone_code: "RPZ-V2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "8 A", resident_name: "U", contact_email: "u@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "V2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { err: $.data.error_id } }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_APPLICATION"
            - "response.status == 409"

      - name: application_with_foreign_vehicle_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]", "errors[ERR_VEHICLE_HOUSEHOLD_MISMATCH]"]
        distinguishing_aspect: "An application whose vehicle_id belongs to another household returns ERR_VEHICLE_HOUSEHOLD_MISMATCH (409)."
        test_recipe:
          setup: ["Household H1 owns vehicle V1; household H2 exists."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "V3", zone_code: "RPZ-V3", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
