  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: acreage_report_deadline_half_open_window
        grounds:
          - validations[priority=6]
          - errors[ERR_ACREAGE_DEADLINE_PASSED]
        distinguishing_aspect: |
          Deadline semantics on AcreageReport: filing at exactly the deadline
          (2026-07-15T23:59:59Z) is FILED (<=), one second after enters the
          30-day late window (LATE_FILED), and past deadline+30d is rejected —
          a point-boundary, half-open interval on the clock resource.
        test_recipe:
          setup:
            - "Farm F with report DRAFT; clock set to deadline + 31 days (past the late window)"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T23:59:59Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F1500", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_id}" }
          trigger:
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Clock 2026-08-15 > deadline 2026-07-15 + 30d late window -> rejected"
            - "err == ERR_ACREAGE_DEADLINE_PASSED"

      - name: election_window_closed_boundary
        grounds:
          - validations[priority=7]
          - errors[ERR_ELECTION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Election window uses a hard cutoff (2026-03-16T23:59:59Z) with no late
          window — a closed-interval semantic distinct from the acreage report's
          deadline+grace-window; filing an election after the cutoff is rejected
          outright, testing a different interval treatment on a different resource.
        test_recipe:
          setup:
            - "Farm F, Producer P member; clock set past election deadline"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F1600", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Clock 2026-04-01 > election deadline 2026-03-16 -> rejected"
            - "err == ERR_ELECTION_WINDOW_CLOSED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reconstitution_conserves_total_base_acres
        grounds:
          - state_machines.Farm.ACTIVE_to_RECONSTITUTION_PENDING
          - validations[priority=15]
          - entities.Farm.fields.total_base_acres
        distinguishing_aspect: |
          Conserved quantity = total base acres. A DIVIDE that splits a 100.00-acre
          tract into 60.00 + 40.00 MUST leave Farm.total_base_acres unchanged at
          100.00; a divide into 60.00 + 30.00 (90.00) violates the invariant and is
          rejected with ERR_BASE_ACRE_IMBALANCE.
        test_recipe:
          setup:
            - "Farm F ACTIVE, one tract base 100.00"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F1700", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/reconstitutions", payload: { method: "DIVIDE", source_tract_ids: ["${tract_id}"], product_specs: [{tract_number: "T1A", base_acres: 60.00, cropland_acres: 60.00}, {tract_number: "T1B", base_acres: 30.00, cropland_acres: 30.00}], expected_farm_version: "${farm_v0}" }, as: CountySpecialist, captures: { err: "$.data.error_id" } }
            - { call: "GET /fsa/farms/${farm_id}", payload: {}, as: CountySpecialist, captures: { total_base: "$.data.total_base_acres" } }
          assert:
            - "60.00 + 30.00 = 90.00 != 100.00 -> invariant violated"
            - "err == ERR_BASE_ACRE_IMBALANCE"
            - "total_base == 100.00 (unchanged — the failed divide conserved the quantity)"

      - name: appeal_reverse_conserves_gross_minus_sequestration
        grounds:
          - state_machines.Appeal.COMMITTEE_HEARING_to_REVERSED
          - calculations.sequestration_withholding
          - entities.Enrollment.fields.computed_payment_cents
        distinguishing_aspect: |
          Conserved quantity = gross_payment = net + sequestration. A REVERSED
          appeal that recomputes payment MUST keep computed_payment_cents +
          sequestration_cents equal to the post-limitation gross (no drift in the
          split); a different conserved quantity (monetary identity) from the
          acreage invariant.
        test_recipe:
          setup:
            - "Enrollment PAYMENT_COMPUTED at a known gross; appeal filed, referred, then REVERSED with a corrected payment"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F1800", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Appellant", tax_id_last4: "1111", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Reviewer", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
