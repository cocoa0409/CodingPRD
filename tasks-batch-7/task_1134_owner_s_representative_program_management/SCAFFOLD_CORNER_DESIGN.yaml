  - section: complexity_layers
    instances:
      - name: charter_approve_stale_program_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[charter-approve-stale-program]"
          - "errors[ERR_STALE_PROGRAM_VERSION]"
        distinguishing_aspect: "OCC on Program.version: after charter C1 is approved (advancing the program version), deciding C2 with the pre-approval version is rejected 412; re-reading the version and retrying succeeds and supersedes C1."
        test_recipe:
          setup: ["Program CHARTERING with charters C1 and C2 both SUBMITTED; client holds program version observed before C1's approval"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-OCC1", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "c1", scope_statement: "c1" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { c1: $.data.id } }
            - { call: "POST /charters/${c1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "c2", scope_statement: "c2" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { c2: $.data.id } }
            - { call: "POST /charters/${c2}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
