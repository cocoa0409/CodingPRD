          Creating an AssessmentSchedule reads a number off a different entity and is therefore gated on
          that entity's state, not on its contents: the study already carries adequacy_verdict ADEQUATE and
          recommended_annual_contribution_cents 700000 after RECOMPUTE, yet while it is still DRAFT the
