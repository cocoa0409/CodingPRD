              - "the read is a pure projection: the second GET returns ${net2} == ${net}, ${expo2} == ${expo} and ${ver2} == ${ver} - reading a territory never bumps its version and never re-runs a calculation"
              - "the same row is legible to both permitted roles and identical in both responses; a Designer calling GET /blinds/territories/${t1} is refused with ERR_ROLE_NOT_PERMITTED because the endpoint lists only Franchisor and Franchisee"

      - name: setting_the_clock_moves_time_without_advancing_any_row
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - calculations.sample_late_fee
        distinguishing_aspect: "The test-driving endpoint is itself a contract: Franchisor-only, 200 with no resource body, and - the load-bearing part - it re-evaluates NOTHING. A checkout whose due instant has passed is still OPEN with a zero fee and no ledger row until a business request touches it, and the fee it then computes proves the clock really did move."
        test_recipe:
          setup:
