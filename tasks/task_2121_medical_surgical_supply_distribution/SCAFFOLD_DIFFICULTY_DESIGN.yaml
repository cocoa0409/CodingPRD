      - name: recall_cascade_lot_to_line_to_order_to_route_four_hops
        grounds:
          - state_machines.RecallNotice.ISSUED_to_CASCADED
          - state_machines.Lot.AVAILABLE_to_QUARANTINED
          - state_machines.OrderLine.ALLOCATED_to_BACKORDERED
          - state_machines.ReplenishmentOrder.ALLOCATED_to_HELD
          - state_machines.DeliveryRoute.PLANNED_to_CANCELLED
          - entities.RecallNotice.fields.quarantined_lot_count
          - entities.RecallNotice.fields.backordered_line_count
        distinguishing_aspect: |
          Depth-4 transitive cascade triggered by RecallNotice ISSUED -> CASCADED.
          Each hop is caused by the previous one: the lot is quarantined, and BECAUSE
          it is quarantined the line backorders, and BECAUSE the line backordered the
          order is held, and BECAUSE the order was held the route loses its last stop
          and cancels itself.
