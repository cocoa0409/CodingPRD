            - *d_add_m2
            - *d_add_q1
            - *d_add_q2
            - *d_add_q3
            - *d_add_q4
            - *d_tr3
            - *d_tr3c
            - *d_tr4
            - *d_tr4c
            - *d_app2
            - *d_app2s
            - *d_app2_v1
            - *d_app2_v2
            - *d_app2_v3
            - *d_app2_v4
            - *d_app2_disb
            - *d_loan2
            - *d_clock_16d
            - *d_mt2
            - *d_mt2o
          trigger:
            - call: "POST /center-meetings/${mt2}/collections"
              payload: { member_id: "${m2}", loan_id: "${loan2}", amount_cents: 9400 }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { cure_txn: $.data.id }
          assert:
            - "before the trigger, Loan.${loan2}.status == DELINQUENT and Member.${m2}.status == DELINQUENT"
            - "RepaymentTransaction.${cure_txn}.installment_applied_cents == 9200 (arrears 4600 + current 4600) and savings_applied_cents == 200"
            - "after the trigger, Loan.${loan2}.status == ACTIVE (cure) and Member.${m2}.status == ACTIVE_BORROWER with cured_delinquency_count == 1"
            - "PeerGroup.${g2_id}.delinquent_loan_count == 0 and status == ACTIVE"

      - name: center_meeting_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.CenterMeeting
          - entities.CenterMeeting.fields.status
          - entities.CenterMeeting.fields.settlement_status
        distinguishing_aspect: |
          CenterMeeting carries two independent state dimensions on one row:
          status (SCHEDULED -> OPEN -> CLOSED) advances via open/close while
          settlement_status (PENDING -> POSTED -> RECONCILED) advances only at
          close and reconcile — the same meeting reads CLOSED + POSTED after
          close, and CLOSED + RECONCILED after reconciliation, proving the
          dimensions are parallel rather than one linear chain.
        test_recipe:
          setup:
            - "Standard group with applicant A disbursed; meeting mt OPEN with all five members PRESENT and one 4801c collection posted."
          setup_api_calls:
