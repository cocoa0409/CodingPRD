  - name: room_block_occupancy_is_per_night_over_half_open_stay_intervals
    grounds:
    - §1.3 room_night_ledger (per-night occupancy gate over the half-open interval [arrival_date, departure_date))
    - §1.4 priority 27 ERR_ROOM_BLOCK_EXHAUSTED
    - §1.2 Registration ACCEPTED -> CONFIRMED precondition on per-night occupancy
    - §1.1 SupplierContract.room_block_count, room_nights_confirmed, room_nights_available
    distinguishing_aspect: |-
      The room block is a per-night resource over half-open stay intervals, so on a 2-room block already fully occupied on the nights of 08, 09 and 10 November a 1-room stay spanning the night of the 10th is rejected with ERR_ROOM_BLOCK_EXHAUSTED, while a 2-room stay arriving on the 11th is accepted because the incumbent's departure date of 11 November never occupies that night.
