              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-HRS", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { c_cut: $.data.id }
          trigger:
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-09T08:00:00Z", end_at: "2026-06-09T11:30:00Z" }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "GET /mill/cells/${c_cut}"
              as: ProductionPlanner
              captures: { committed_mid: $.data.committed_hours }
            - call: "POST /mill/cell-bookings/${b1}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /mill/cells/${c_cut}"
              as: ProductionPlanner
              captures: { committed_end: $.data.committed_hours }
          assert:
            - "Cell.${c_cut}.committed_hours == 0.0 before booking"
            - "committed_mid == 3.5 after booking [08:00, 11:30) (duration 3.5 hours)"
            - "committed_end == 0.0 after release — the book/release pair conserves cell hours"

      - name: lot_yardage_allocate_release_conserved
        grounds:
          - calculations.shortfall_evaluation
          - entities.MaterialLot.fields.available_yards
          - state_machines.MaterialAllocation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = fabric yards (distinct from cell hours). For any lot,
          allocated_yards + available_yards == usable_yards at every step: allocating 4.5
          yards moves the lot to (4.5, 15.5), and the compensating release returns it to
          (0.0, 20.0) with usable 20.0 unchanged.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-NP (no match, rule (A, ESPRESSO, allowed, 0))"
            - "PLANT spec FAB-A; order ORD-YRD with PLANT line qty 4 (requirement 14.331) confirmed with NO lots → line MATERIAL_SHORTFALL, order MATERIAL_HOLD"
            - "Lot received 20.0 and inspected PASS (usable 20.0, measured 54) → AVAILABLE, available_yards 20.0"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
