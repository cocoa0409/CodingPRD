              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u1}", tenant_id: "${ten1}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { l1: $.data.id }
