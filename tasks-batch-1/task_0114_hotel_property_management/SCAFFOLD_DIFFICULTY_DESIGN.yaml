          trigger:
            - call: "POST /pms/night-audit-runs/${nar_id}/complete"
              payload: { expected_hotel_version: "${hotel_v2}" }
              as: NightAuditor
          assert:
            - "Reservation.${res_id}.status == NO_SHOW"
            - "Folio.${folio_id}.room_charges_cents == 13500"
            - "GroupBlock.${block_id}.picked_up_rooms == 0"

  # ===========================================================================
