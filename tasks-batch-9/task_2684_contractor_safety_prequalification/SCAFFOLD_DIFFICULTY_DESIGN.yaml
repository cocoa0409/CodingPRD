            - "after second revoke: Site.${site_id}.granted_worker_count == 0 - exactly the pre-state value, zero drift"
            - "redundant third revoke: HTTP 409 ERR_TRANSITION_NOT_ALLOWED and Site.${site_id}.granted_worker_count is still 0, never -1"
            - "reconciliation: GET /site-access-grants?site_id=${site_id}&status=GRANTED returns 0 rows, matching the materialized counter, while GET /site-access-grants?site_id=${site_id} returns 2 REVOKED rows"
            - "Site.${site_id}.access_gate_status == OPEN throughout (no incident was ever filed)"

      - name: contractor_open_deficiency_count_returns_to_its_pre_grading_value_after_an_accepted_improvement_plan
        grounds:
          - calculations.contractor_open_deficiency_count
          - state_machines.Prequalification.UNDER_REVIEW_to_CONDITIONAL
          - state_machines.Prequalification.CONDITIONAL_to_UNDER_REVIEW
          - state_machines.ImprovementPlan.SUBMITTED_to_ACCEPTED
          - concurrency_rules.improvement-plan-create-stale-prequal
        distinguishing_aspect: |
          Conserved quantity Q2 is raised by a CONDITIONAL grading that also writes grade, score,
          effective_thresholds and conditional_expires_at, and the compensating action is an
          ACCEPTED ImprovementPlan three requests later on a DIFFERENT entity. The invariant
          therefore has to survive a multi-entity round trip, and the recipe pins the full set of
          fields that must be rolled back with the counter (deficiency_codes, grade,
          final_composite_score, effective_thresholds, conditional_expires_at) so an implementation
          that merely zeroes the counter while leaving grade B in place is caught.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults (max_emr 1.0, conditional_band_pct 20)."
            - "Tier-1 contractor Acme fully insured; both required written programs ACCEPTED."
            - "SafetyStatistic VERIFIED with hours_worked 500000, recordable_incidents 2, dart_cases 1, one other-than-serious citation and emr 1.01 - one hundredth ABOVE the effective EMR threshold of 1.0000 but well inside the soft band ceiling 1.2000, so grading yields CONDITIONAL with exactly one deficiency code."
            - "Contractor.open_deficiency_count is 0 before grading."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "WC", carrier_name: "Ironclad Mutual", each_occurrence_limit: 500000, aggregate_limit: 1000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2027-07-01T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_wc_id: $.data.id }
            - call: "POST /insurance-certificates/${cert_wc_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 1.01, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
            - call: "POST /safety-statistics/${stat_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-stat-1"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "DISCIPLINE_POLICY", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-DISC-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_disc_id: $.data.id }
            - call: "POST /written-programs/${wp_disc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /prequalifications/${pq_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /prequalifications/${pq_id}/grade"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { pq_v: $.data.version }
            - call: "POST /prequalifications/${pq_id}/improvement-plans"
              payload: { due_date: "2026-10-01T00:00:00Z", milestone_count: 3, expected_prequalification_version: "${pq_v}" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /improvement-plans/${plan_id}/submit"
              payload: { evidence_ref: "EMR-REMEDIATION-PACKET-1" }
