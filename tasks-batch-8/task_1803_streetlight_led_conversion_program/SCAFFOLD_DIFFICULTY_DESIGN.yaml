scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: billing_proration_vs_whole_month_deferral
    grounds:
    - calculations.monthly_unmetered_charge
    - entities.Pole.fields.ownership_type
    - entities.BillingLine.fields.charge_cents
    distinguishing_aspect: 'Identical wattage data (250W -> 90W, in-service 2026-08-16, period 2026-08) yields

      charge_cents 1087 on the MUNICIPAL pole (daily proration variant) but 1800 on the

      UTILITY_OWNED pole (whole-month deferral variant) — two valid tariff interpretations

      on the BillingLine domain diverging by 713 cents, driven purely by ownership_class.

      '
    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district, one crew
      - Pole M (MUNICIPAL, 250W, audit-accepted) and Pole U (UTILITY_OWNED, 250W, nameplate-attested), both AUDIT_CLEARED
      - MUNICIPAL schedule {T1 700, T2 1100, T3 1500, T4 2000, T5 2600} and UTILITY_OWNED schedule {T1 900, T2 1300, T3 1800, T4 2400, T5 3000}, both EFFECTIVE from 2026-01-01
      - Accounts AC-M (MUNICIPAL) and AC-U (UTILITY_OWNED), current_period 2026-08 under the default clock 2026-08-01T00:00:00Z
      - Route 2026-08-16..2026-08-16 with stop1=M, stop2=U, RELEASED; both work orders dispatched and completed on 2026-08-16 with 90W/2700K/FULL_CUTOFF
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-26
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: M-001
          ownership_type: MUNICIPAL
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole_m: $.data.id
          pole_m_v: $.data.version
      - call: POST /streetlights/poles/${pole_m}/audits
        payload:
          audited_wattage: 250
          expected_pole_version: ${pole_m_v}
        as: FieldSupervisor
        as_user_id: ${crew}
        captures:
          aud_m: $.data.id
      - call: POST /streetlights/audits/${aud_m}/accept
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: U-001
          ownership_type: UTILITY_OWNED
          fixture_class: COBRA_HEAD
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole_u: $.data.id
      - call: POST /streetlights/poles/${pole_u}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: MUNICIPAL
          effective_from: '2026-01-01'
          tier_rates:
            T1: 700
            T2: 1100
            T3: 1500
            T4: 2000
            T5: 2600
        as: BillingAnalyst
        captures:
          rs_m: $.data.id
      - call: POST /streetlights/rate-schedules/${rs_m}/file
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules/${rs_m}/activate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules
        payload:
          program_id: ${pgm}
          ownership_class: UTILITY_OWNED
          effective_from: '2026-01-01'
          tier_rates:
            T1: 900
            T2: 1300
            T3: 1800
            T4: 2400
            T5: 3000
        as: BillingAnalyst
        captures:
          rs_u: $.data.id
      - call: POST /streetlights/rate-schedules/${rs_u}/file
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/rate-schedules/${rs_u}/activate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts
        payload:
          district_id: ${dist}
          account_number: AC-M
          ownership_class: MUNICIPAL
        as: BillingAnalyst
        captures:
          acct_m: $.data.id
      - call: POST /streetlights/tariff-accounts
        payload:
          district_id: ${dist}
          account_number: AC-U
          ownership_class: UTILITY_OWNED
        as: BillingAnalyst
        captures:
          acct_u: $.data.id
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-16'
          window_end_date: '2026-08-16'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole_m}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole_u}
          sequence_number: 2
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo_m: $.data.0.id
          wo_u: $.data.1.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-16T09:00:00Z'
        as: ProgramManager
      - call: POST /streetlights/work-orders/${wo_m}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo_m}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo_u}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo_u}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      trigger:
      - call: POST /streetlights/tariff-accounts/${acct_m}/generate-lines
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct_u}/generate-lines
        payload: {}
        as: BillingAnalyst
      - call: GET /streetlights/billing-lines
        payload:
          account_id: ${acct_m}
          period: 2026-08
        as: BillingAnalyst
        captures:
          line_m: $.data.0.id
      - call: GET /streetlights/billing-lines
        payload:
          account_id: ${acct_u}
          period: 2026-08
        as: BillingAnalyst
        captures:
          line_u: $.data.0.id
      - call: POST /streetlights/tariff-accounts/${acct_m}/close-period
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct_u}/close-period
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct_m}/generate-lines
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/tariff-accounts/${acct_u}/generate-lines
        payload: {}
        as: BillingAnalyst
      - call: GET /streetlights/billing-lines
        payload:
          account_id: ${acct_m}
          period: 2026-09
        as: BillingAnalyst
        captures:
          line_m_sep: $.data.0.id
      - call: GET /streetlights/billing-lines
        payload:
          account_id: ${acct_u}
          period: 2026-09
        as: BillingAnalyst
        captures:
          line_u_sep: $.data.0.id
      assert:
      - 'BillingLine.${line_m}.charge_cents == 1087   # rhu(1500*15/31)=726 + rhu(700*16/31)=361'
      - 'BillingLine.${line_u}.charge_cents == 1800   # whole conversion month at OLD utility T3 rate'
      - 'BillingLine.${line_m}.charge_cents != BillingLine.${line_u}.charge_cents  # delta == 713'
      - BillingLine.${line_m}.tier == T1 AND BillingLine.${line_m}.billing_wattage == 90
      - BillingLine.${line_u}.tier == T3 AND BillingLine.${line_u}.billing_wattage == 250
      - 'BillingLine.${line_m_sep}.charge_cents == 700   # municipal: full month at new T1 rate'
      - 'BillingLine.${line_u_sep}.charge_cents == 900   # utility: deferral ends, new T1 rate from next period'
  - name: savings_estimate_vs_metered_actual
    grounds:
    - calculations.savings_verification_kwh
    - entities.SavingsReport.fields.method
    - entities.SavingsReport.fields.savings_kwh
    distinguishing_aspect: 'One pole converted mid-period (250W -> 90W, in-service 2026-08-16, Aug burn hours 310):

      the ENGINEERING_ESTIMATE variant credits a full month (savings_kwh 49.600) while

      METERED_ACTUAL prorates to in-service days (savings_kwh 25.600) — same poles, same

      period, two valid algorithms on the SavingsReport domain diverging by 24.000 kWh.

      '
    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district, crew, one MUNICIPAL pole 250W audit-accepted
      - Route 2026-08-01..2026-08-31 with the pole, RELEASED; work order completed at clock 2026-08-16T09:00:00Z (led_in_service_date 2026-08-16)
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-SV
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: D1
          zone: RESIDENTIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-1
          base_stops_per_shift: 6
          hourly_rate_cents: 6000
        as: ProgramManager
        captures:
          crew: $.data.id
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: M-101
          ownership_type: MUNICIPAL
          fixture_class: POST_TOP
          nameplate_wattage: 250
        as: ProgramManager
        captures:
          pole: $.data.id
          pole_v: $.data.version
      - call: POST /streetlights/poles/${pole}/audits
        payload:
          audited_wattage: 250
          expected_pole_version: ${pole_v}
        as: FieldSupervisor
        as_user_id: ${crew}
        captures:
          aud: $.data.id
      - call: POST /streetlights/audits/${aud}/accept
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/conversion-routes
        payload:
          district_id: ${dist}
          crew_id: ${crew}
          window_start_date: '2026-08-01'
          window_end_date: '2026-08-31'
          traffic_control_required: false
        as: ProgramManager
        captures:
          route: $.data.id
      - call: POST /streetlights/conversion-routes/${route}/stops
        payload:
          pole_id: ${pole}
          sequence_number: 1
          difficulty_class: STANDARD
        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo: $.data.0.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-16T09:00:00Z'
        as: ProgramManager
      - call: POST /streetlights/work-orders/${wo}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 2700
          shielding: FULL_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo}/complete
        payload: {}
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: GET /streetlights/programs/${pgm}
        payload: {}
        as: ProgramManager
        captures:
          pgm_v1: $.data.version
      - call: POST /streetlights/savings-reports
        payload:
          program_id: ${pgm}
          period: 2026-08
          method: ENGINEERING_ESTIMATE
          fiscal_year_label: FY2026
          expected_program_version: ${pgm_v1}
        as: ProgramManager
        as_user_id: pm-user-1
        captures:
          rep_est: $.data.id
      - call: GET /streetlights/programs/${pgm}
        payload: {}
        as: ProgramManager
        captures:
          pgm_v2: $.data.version
      trigger:
      - call: POST /streetlights/savings-reports
        payload:
          program_id: ${pgm}
          period: 2026-08
          method: METERED_ACTUAL
          fiscal_year_label: FY2026
          expected_program_version: ${pgm_v2}
        as: ProgramManager
        as_user_id: pm-user-1
        captures:
          rep_act: $.data.id
      assert:
      - SavingsReport.${rep_est}.savings_kwh == 49.600 AND baseline_kwh == 77.500 AND actual_kwh == 27.900
      - SavingsReport.${rep_act}.savings_kwh == 25.600 AND baseline_kwh == 77.500 AND actual_kwh == 51.900
      - 'SavingsReport.${rep_est}.status == SUPERSEDED   # second create for same (program, period) supersedes the DRAFT'
      - SavingsReport.${rep_est}.savings_kwh - SavingsReport.${rep_act}.savings_kwh == 24.000
- rule_id: combinatorial_formula
  instances:
  - name: route_capacity_mobilization_shifts_failure_point
    grounds:
    - calculations.route_capacity_check
    - validations[priority=21]
    - entities.ConversionRoute.fields.required_shifts
    distinguishing_aspect: 'Mode (a): the failure point of the SAME 120-minute COMPLEX stops over the SAME 3-day

      window moves with the conditional mobilization input — a traffic-control route (M=60,

      420 workable min/shift) rejects the 11th stop (required_shifts 4 > 3 window days),

      while an identical non-traffic route (M=30, 450 min/shift) accepts the 11th

      (shifts ceil(1320/450)=3 <= 3, stop-rate ceil(11/3)=4 <= 6) and rejects the 12th.

      '
    test_recipe:
      setup:
      - ACTIVE program, one ARTERIAL district, crewA and crewB (base_stops_per_shift 6)
      - 'Route A: crewA, window 2026-08-03..2026-08-05, traffic_control_required true'
      - 'Route B: crewB, window 2026-08-03..2026-08-05, traffic_control_required false (different crew => no window conflict)'
      - '23 UTILITY_OWNED poles (250W, attested AUDIT_CLEARED): P01..P11 for route A, P12..P23 for route B'
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-CAP
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
        as: ProgramManager
        captures:
          pgm: $.data.id
      - call: POST /streetlights/programs/${pgm}/activate
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/districts
        payload:
          program_id: ${pgm}
          district_name: DA
          zone: ARTERIAL
        as: ProgramManager
        captures:
          dist: $.data.id
      - call: POST /streetlights/crews
        payload:
          program_id: ${pgm}
          crew_name: Crew-A
          base_stops_per_shift: 6
