            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "item A", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { ia: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "item B", estimated_cost_cents: 6000 }
              as: TurnCoordinator
              captures: { ib: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v1: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "OtherCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v2: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${ia}", vendor_id: "${v1}", start_date: "2026-08-05", end_date: "2026-08-08" }
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${ib}", vendor_id: "${v2}", start_date: "2026-08-06", end_date: "2026-08-07" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIT_WINDOW_OVERLAP (http 422) — different vendors, so the vendor calendar passes and the unit window fires"
            - "ScopeItem.${ib}.status remains PLANNED"

      - name: sequence_violation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEQUENCE_VIOLATION]", "validations[priority=9]"]
        distinguishing_aspect: "Category order enforcement in isolation: scheduling the PAINT item while the lower-rank REPAIR item is still PLANNED → 422 ERR_SEQUENCE_VIOLATION (vendor free, no windows collide, cure not applicable to paint)."
        test_recipe:
          setup: ["Turn SCOPED with REPAIR item and PAINT item, both PLANNED; PAINT-trade vendor free"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
