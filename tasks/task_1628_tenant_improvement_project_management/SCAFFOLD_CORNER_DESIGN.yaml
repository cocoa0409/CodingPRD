  # =====================================================================
  # Section: endpoints — response envelope, pagination, computed reads
  # =====================================================================
  - section: endpoints
    instances:
      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET list endpoints return the fixed envelope with pagination fields total_count and has_more and default limit 10."
        test_recipe:
          setup: ["Property with 2 lease spaces exists"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "2", floor: 1, rentable_sqft: 1200 }
              as: LandlordPM
          trigger:
            - call: "GET /api/properties/${prop_id}/lease-spaces"
              as: LandlordPM
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "pagination fields present: limit == 10 (default), offset == 0, total_count == 2, has_more == false"
      - name: error_envelope_shape_on_404
        claim_type: response_envelope
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type == error and data.error_id/data.message keys."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error; data.error_id == ERR_NOT_FOUND; data.message is non-empty"
      - name: project_read_exposes_computed_monetary_fields
        claim_type: computed_read
        grounds: ["entities.TIProject.fields.total_cost_cents", "entities.TIProject.fields.overage_cents"]
        distinguishing_aspect: "GET /api/ti-projects/{id} exposes every computed field; after work-letter execution total_cost == base_contract and overage == 0 with posture OPEN."
        test_recipe:
          setup: ["Project with EXECUTED work letter (allowance 50000000), base_contract 40000000, no COs, no draws"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
          trigger:
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { tc: $.data.total_cost_cents, ov: $.data.overage_cents, ar: $.data.allowance_remaining_cents, post: $.data.posture }
          assert:
            - "TIProject.${proj_id}.total_cost_cents == 40000000"
            - "TIProject.${proj_id}.allowance_total_cents == 50000000"
            - "TIProject.${proj_id}.allowance_remaining_cents == 50000000"
            - "TIProject.${proj_id}.overage_cents == 0"
            - "TIProject.${proj_id}.posture == OPEN"
            - "TIProject.${proj_id}.status == WORK_LETTER_NEGOTIATION"

