          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case open; VEHICLE asset; valuation raw 400000 EXCELLENT submitted but NOT adjudicated (legal VALUATION_PENDING); 60000 posted COST (burden 135000 >= 120000, so the fiscal gate passes once the state gate opens)."
