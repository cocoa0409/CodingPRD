      - name: anonymous_cannot_open_an_order
        claim_type: exclusive_operation
        grounds:
          - roles[Anonymous].exclusive_operations
          - endpoints.POST_/v1/orders
          - validations[priority=2]
        distinguishing_aspect: "Anonymous is restricted to account creation, so POST /v1/orders is refused 403 while POST /v1/buyers succeeds for the same unauthenticated caller."
        test_recipe:
