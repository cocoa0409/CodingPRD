      - name: resolve_already_resolved_error_rejected
        claim_type: Catalog entry triggerable
        grounds:
          - errors.ERR_ERROR_ALREADY_RESOLVED
          - validations.priority_18
          - state_machines.TransmittalError
        distinguishing_aspect: |
          Resolution is terminal per error row: a WARNING row accepted as filed
          cannot be resolved twice, and because the second call is refused the
          transmittal's open_error_count cannot be driven negative — this is the
          resolution_status clause of the code rather than its
          ACCEPT_AS_FILED-on-FATAL clause.
