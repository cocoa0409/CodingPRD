            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wheat Flour, Sugar", contains_text: "Contains: Wheat.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv1: $.data.id } }
            - { call: "POST /api/label-versions/${lv1}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv1}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv1}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver3: $.data.version } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wheat Flour, Sugar", contains_text: "Contains: Wheat.", expected_product_version: "${pver3}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv2: $.data.id } }
            - { call: "POST /api/label-versions/${lv2}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv2}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver4: $.data.version } }
            - { call: "POST /api/label-versions/${lv2}/release", payload: { expected_product_version: "${pver4}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "GET /api/label-versions/${lv1}", as: PlatformAdmin, captures: { lv1_rel_mid: $.data.release_status, lv1_sup_mid: $.data.superseded_by_id } }
            - { call: "POST /api/label-versions/${lv2}/withdraw", payload: { reason: "recall hold" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "GET /api/label-versions/${lv1}", as: PlatformAdmin, captures: { lv1_rel_end: $.data.release_status } }
            - { call: "GET /api/label-versions/${lv2}", as: PlatformAdmin, captures: { lv2_rel_end: $.data.release_status } }
          assert:
            - "lv1_rel_mid == SUPERSEDED and lv1_sup_mid == lv2 (forward action displaced LV1)"
            - "after LV2 release: exactly one LabelVersion of product+market has release_status == RELEASED (LV2)"
            - "lv2_rel_end == WITHDRAWN (compensating action)"
            - "lv1_rel_end == RELEASED (restored via superseded_by_id linkage)"
            - "after withdraw: released set == {LV1} again — identical membership to the pre-release state"

      - name: invariant_submit_reject_conserves_content
        grounds:
          - state_machines.LabelVersion.review_status=DRAFT_to_review_status=IN_REVIEW
          - state_machines.LabelVersion.review_status=IN_REVIEW_to_review_status=DRAFT
          - entities.LabelVersion.fields.panel_snapshot_id
        distinguishing_aspect: |
          Conserved quantity = the label's document content tuple (ingredient_statement_text,
          contains_text, declared_format, declared_type_size_in) plus the pinned
          panel_snapshot_id: submit-review paired with its compensating reject leaves every
          tuple field byte-identical; only review_round drifts (+1). Different conserved
          quantity type (document content, not a released-set count) from
          invariant_release_withdraw_conserves_released_set.
        test_recipe:
          setup:
            - "Client, product Cookie, LOCKED recipe, CURRENT DATABASE panel, US_FDA RACC, label LV in DRAFT"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Sugar", allergen_tags: [], kcal_per_100g: 387, fat_g_per_100g: 0, satfat_g_per_100g: 0, chol_mg_per_100g: 0, sodium_mg_per_100g: 0, carb_g_per_100g: 100, fiber_g_per_100g: 0, sugar_g_per_100g: 100, protein_g_per_100g: 0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_sugar: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_flour}", quantity_g: 120 }, { ingredient_id: "${i_sugar}", quantity_g: 40 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wheat Flour, Sugar", contains_text: "Contains: Wheat.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id, stmt0: $.data.ingredient_statement_text, cont0: $.data.contains_text, fmt0: $.data.declared_format, tsz0: $.data.declared_type_size_in } }
          trigger:
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1", captures: { snap1: $.data.panel_snapshot_id, rr1: $.data.review_round } }
            - { call: "POST /api/label-versions/${lv}/reject", payload: { reason: "needs rework" }, as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/label-versions/${lv}", as: PlatformAdmin, captures: { stmt1: $.data.ingredient_statement_text, cont1: $.data.contains_text, fmt1: $.data.declared_format, tsz1: $.data.declared_type_size_in, snap2: $.data.panel_snapshot_id, rr2: $.data.review_round, appr: $.data.approved_by } }
          assert:
            - "stmt1 == stmt0 and cont1 == cont0 and fmt1 == fmt0 and tsz1 == tsz0 (content tuple conserved)"
            - "snap2 == snap1 (pinned snapshot survives the cycle unchanged)"
            - "rr1 == 1 and rr2 == 1 (review_round increments on submit only — the sole permitted drift)"
            - "appr == null (approved_by cleared by reject)"
            - "LabelVersion.${lv}.review_status == DRAFT"
