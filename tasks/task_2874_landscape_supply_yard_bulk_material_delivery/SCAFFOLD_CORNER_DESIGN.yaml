        distinguishing_aspect: "Each order is individually inside the 40000 limit (20000 and 25000), but the aggregate is not: the second confirm is refused on credit_available (20000) rather than on the limit itself, and no CREDIT_HOLD is entered because the rejected order never joined the exposure."
        test_recipe:
          setup:
            - "An account limited to 40000 cents with a CONFIRMED 10.0 cubic-yard WILL_CALL order (20000) and a DRAFT 12.5 cubic-yard WILL_CALL order (would quote 25000)."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-V13", name: "Aggregate Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Aggregate Landscapes", credit_limit_cents: 40000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_1: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_1}", material_id: "${mat_id}", form: "BULK", quantity: 10.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_1}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_2: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_2}", material_id: "${mat_id}", form: "BULK", quantity: 12.5 }
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /material-orders/${ord_2}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "HTTP 402 with data.error_id == \"ERR_CREDIT_LIMIT_EXCEEDED\" (25000 requested against credit_available_cents 20000)"
            - "MaterialOrder.${ord_2}.fulfillment_status stays DRAFT with quoted_total_cents == null"
            - "ContractorAccount.${acct_id}.credit_used_cents == 20000, credit_available_cents == 20000, account_status == ACTIVE"

      - name: confirm_accepted_when_credit_available_equals_the_quote_exactly
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=34]
          - calculations.account_credit_position
        distinguishing_aspect: "The confirm gate is inclusive and the CREDIT_HOLD entry is strict, so an order that consumes the entire line exactly is accepted and leaves the account ACTIVE with zero available credit."
        test_recipe:
          setup:
            - "An account limited to 30000 cents with a DRAFT 15.0 cubic-yard WILL_CALL order at 2000 cents/cy."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-V14", name: "Exact Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Exact Landscapes", credit_limit_cents: 30000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 15.0 }
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "HTTP 200 with MaterialOrder.${ord_id}.fulfillment_status == CONFIRMED and quoted_total_cents == 30000"
            - "ContractorAccount.${acct_id}.credit_used_cents == 30000 and credit_available_cents == 0"
            - "ContractorAccount.${acct_id}.account_status == ACTIVE (entry into CREDIT_HOLD requires strictly greater than the limit)"

      - name: higher_priority_error_wins_when_two_rules_are_violated
        claim_type: priority_ordering
        grounds:
          - validations[priority=18]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: account_credit_hold_state_outranks_credit_limit_check_at_confirm
          rationale: "The §1.8 priority_pair_validation_conflict instance violates both rules at once and asserts the priority-18 error, covering the Priority Ordering claim."

      - name: priority_conflict_between_adjacent_gate_categories
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: axle_weight_safety_gate_outranks_volume_capacity_gate
          rationale: "The §1.8 instance violates the weight gate and the volume gate in one request and asserts the safety error, covering the Priority conflict pattern."

      - name: cross_entity_validation_reads_the_other_entity_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=18]
        excluded_because:
          difficulty_instance: confirm_blocked_by_suspended_material_then_allowed_after_reactivation
          rationale: "The §1.8 cross_entity_state_dependency instance tests the same confirm-time cross-entity check in both the invalid and the valid direction."

      - name: temporal_conflict_detected_against_existing_windows
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
        excluded_because:
          difficulty_instance: truck_window_symmetric_forty_five_minute_buffer_boundary
          rationale: "The §1.8 resource_temporal_overlap instance covers the future-conflict detection at the exact buffer boundary in both directions."

      - name: cascading_validation_runs_the_dependent_check_second
        claim_type: cascading_validation
        grounds:
          - validations[priority=18]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: account_credit_hold_state_outranks_credit_limit_check_at_confirm
          rationale: "The credit gate can only be evaluated after the account posture check has produced its result; the §1.8 instance asserts exactly that ordering, so a separate cascading-validation test would duplicate it."

  - section: endpoints
    instances:
      - name: truck_create_read_list_and_status_patch_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /delivery-trucks]
          - endpoints[GET /delivery-trucks]
          - endpoints[GET /delivery-trucks/{deliveryTruckId}]
          - endpoints[PATCH /delivery-trucks/{deliveryTruckId}]
        distinguishing_aspect: "DeliveryTruck is the one entity with a full create/read/list/update surface, so the round trip proves the PATCH writes through and that the list filter reflects the new status immediately (immediate consistency)."
        test_recipe:
          setup:
            - "Two trucks: one TANDEM restricted to CLASS_B driveways and one TRI_AXLE restricted to CLASS_A."
          setup_api_calls:
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TND-E1", axle_class: "TANDEM", max_payload_lb: 40000, bed_capacity_cubic_yards: 12.0, min_driveway_access_class: "CLASS_B" }
              as: DispatchPlanner
              captures: { truck_a: $.data.id }
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TRI-E1", axle_class: "TRI_AXLE", max_payload_lb: 60000, bed_capacity_cubic_yards: 20.0, min_driveway_access_class: "CLASS_A" }
              as: DispatchPlanner
              captures: { truck_b: $.data.id }
          trigger:
            - call: "GET /delivery-trucks/${truck_a}"
              payload: {}
              as: DispatchPlanner
            - call: "GET /delivery-trucks"
              payload: { axle_class: "TANDEM", status: "AVAILABLE", limit: 10, offset: 0 }
              as: YardAdmin
            - call: "PATCH /delivery-trucks/${truck_a}"
              payload: { status: "OUT_OF_SERVICE" }
              as: DispatchPlanner
            - call: "GET /delivery-trucks"
              payload: { axle_class: "TANDEM", status: "AVAILABLE", limit: 10, offset: 0 }
              as: YardAdmin
            - call: "GET /delivery-trucks"
              payload: { status: "OUT_OF_SERVICE", limit: 10, offset: 0 }
              as: YardLoader
          assert:
            - "trigger 1: HTTP 200 with truck_code == \"TND-E1\", axle_class == TANDEM, max_payload_lb == 40000, bed_capacity_cubic_yards == 12.00, min_driveway_access_class == CLASS_B, status == AVAILABLE"
            - "trigger 2: HTTP 200 with response_type \"array\", total_count == 1, has_more == false and only ${truck_a} present (the TRI_AXLE row is filtered out)"
            - "trigger 3: HTTP 200 with status == OUT_OF_SERVICE, version incremented by 1 and updated_at advanced"
            - "trigger 4: HTTP 200 with total_count == 0 — the PATCH is visible to the very next read"
            - "trigger 5: HTTP 200 with total_count == 1 containing ${truck_a}; ${truck_b} still lists as AVAILABLE"

      - name: purchase_order_close_action_transitions_then_guards_itself
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /job-purchase-orders/{jobPurchaseOrderId}/close]
          - state_machines.JobPurchaseOrder
          - validations[priority=17]
        distinguishing_aspect: "The close action takes no body at all, so the entire outcome is decided by the current status: the first call moves OPEN -> CLOSED and the second is refused by the same precondition that let the first through."
        test_recipe:
          setup:
            - "One account with a single purchase order that has no committed orders against it, so it sits at OPEN with committed_cents 0."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Action Landscapes", credit_limit_cents: 500000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /job-purchase-orders"
              payload: { contractor_account_id: "${acct_id}", po_number: "PO-E2-3001", job_code: "JOB-E2", po_limit_cents: 100000 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /job-purchase-orders/${po_id}/close"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /job-purchase-orders/${po_id}/close"
              payload: {}
              as: YardAdmin
          assert:
            - "before the triggers: JobPurchaseOrder.${po_id}.status == OPEN with committed_cents == 0"
            - "trigger 1: HTTP 200 with status == CLOSED and version incremented by 1"
            - "trigger 2: HTTP 409 with data.error_id == \"ERR_PO_NOT_OPEN\", status still CLOSED and version unchanged"

      - name: credit_position_and_available_net_are_computed_reads
        claim_type: computed_read
        grounds:
          - calculations.account_credit_position
          - entities.Material.fields.available_net_cubic_yards
          - entities.InventoryLot.fields.reserved_cubic_yards
        distinguishing_aspect: "Three different reads must agree after a single confirm: the account's credit position, the material's cross-entity roll-up and the lot's own reservation figure, none of which is ever supplied by a client."
        test_recipe:
          setup:
            - "One material at 2000 cents/cy with a 100 cubic-yard intake lot at reference moisture (net 90.00) and an account limited to 100000 cents holding a CONFIRMED 10.0 cubic-yard WILL_CALL order (20000)."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E3", name: "Computed Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Computed Landscapes", credit_limit_cents: 100000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 10.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
            - call: "GET /materials/${mat_id}"
              payload: {}
              as: DispatchPlanner
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: YardAdmin
          assert:
            - "trigger 1: credit_used_cents == 20000 (the CONFIRMED order's quoted_total_cents), credit_available_cents == 80000, pallet_deposit_balance_cents == 0 and account_status == ACTIVE"
            - "trigger 2: available_net_cubic_yards == 80.00 (90.00 net sellable minus 10.00 reserved) and effective_density_lb_per_cubic_yard == 1000.00 at reference moisture"
            - "trigger 3: basis == INTAKE, net_sellable_cubic_yards == 90.00, reserved_cubic_yards == 10.00, withdrawn_gross_cubic_yards == 0.00 and status == AVAILABLE"

      - name: claim_case_links_order_and_load_and_both_must_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /claim-cases]
          - endpoints[GET /claim-cases]
          - validations[priority=7]
        distinguishing_aspect: "A claim is the only row that carries two independent foreign keys into the fulfilment side, so the association must be queryable from the load as well as from the order, and a bogus load id is refused before any claim row is minted."
        test_recipe:
          setup:
            - "A FULFILLED 6.0 cubic-yard CLASS_A delivery order 2 miles out whose single load was delivered with driveway_protection_used false."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E4", name: "Link Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Link Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "4 Link Way", driveway_access_class: "CLASS_A", delivery_distance_miles: 2.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 6.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TRI-E4", axle_class: "TRI_AXLE", max_payload_lb: 60000, bed_capacity_cubic_yards: 20.0, min_driveway_access_class: "CLASS_A" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 6.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T09:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
            - call: "POST /delivery-loads/${load_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-e4"
            - call: "POST /delivery-loads/${load_id}/deliver"
              payload: { actual_net_cubic_yards: 6.0, driveway_protection_used: false, spillage_cubic_yards: 0.0 }
              as: DispatchPlanner
              as_user_id: "planner-e4"
          trigger:
            - call: "POST /claim-cases"
              payload: { material_order_id: "${ord_id}", claim_type: "DRIVEWAY_DAMAGE", claimed_amount_cents: 50000, description: "Apron cracked at the curb cut.", delivery_load_id: "${load_id}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /claim-cases"
              payload: { delivery_load_id: "${load_id}", limit: 10, offset: 0 }
              as: ClaimsAdjuster
            - call: "POST /claim-cases"
              payload: { material_order_id: "${ord_id}", claim_type: "SPILLAGE", claimed_amount_cents: 1000, description: "Bogus load reference.", delivery_load_id: "00000000-0000-0000-0000-0000000000ff" }
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "trigger 1: HTTP 201 with material_order_id == ${ord_id}, delivery_load_id == ${load_id}, will_call_ticket_id == null, status == SUBMITTED, review_round == 0 and approved_amount_cents == null"
            - "trigger 2: HTTP 200 with total_count == 1 containing ${claim_id} — the claim is reachable from the load side, not only from the order"
            - "trigger 3: HTTP 404 with data.error_id == \"ERR_LOAD_NOT_FOUND\" and GET /claim-cases?material_order_id=${ord_id} still returns total_count 1"

      - name: purchase_order_ceiling_applies_only_to_the_tagged_order
