  - method: POST
    path: "/tire-assets/{tire_asset_id}/mount"
    description: "Mounts an inventory asset at a wheel position on a unit, pinning the odometer and tread-depth baselines used by cost-per-mile."
    roles: [TireTechnician]
    code: 200
    input: [vehicle_id, position, mounted_at, odometer_at_mount, tread_depth_at_mount_32nds]
    output: TireAsset
    side_effects:
      - "TireAsset IN_INVENTORY -> MOUNTED with vehicle_id, position, mounted_at, odometer_at_mount, tread_depth_at_mount_32nds"
      - "cascades Casing RETREADED -> ON_WHEEL, recomputes the holding location's casings_in_holding_count and clears Casing.collected_at_location_id"
      - "increments TireAsset.version by 1"

  - method: POST
    path: "/tire-assets/{tire_asset_id}/pull"
    description: "Pulls a mounted or pull-flagged asset off the wheel; vehicle_id and position are retained so the asset still groups correctly in cost-per-mile."
    roles: [TireTechnician]
    code: 200
    input: [pull_reason]
    output: TireAsset
    side_effects: ["TireAsset MOUNTED|PULL_FLAGGED -> PULLED", "increments TireAsset.version by 1"]

  - method: POST
    path: "/tire-assets/{tire_asset_id}/surveys"
    description: "Records a tire pressure and tread depth survey against a mounted asset and evaluates calculations.survey_finding."
    roles: [TireTechnician]
    code: 201
    input: [surveyed_at, pressure_psi, tread_depth_32nds, odometer_miles]
    output: TireSurvey
    side_effects:
      - "computes pressure_deviation_pct, finding_code (first match wins) and pull_recommended"
      - "when pull_recommended is true, cascades TireAsset MOUNTED -> PULL_FLAGGED"
      - "when finding_code == COMPLIANT, cascades TireAsset PULL_FLAGGED -> MOUNTED (a PRESSURE_DEVIATION survey does not clear the flag)"
      - "recomputes TireAsset.current_tread_depth_32nds and accumulated_miles"

  - method: GET
    path: "/tire-assets/{tire_asset_id}"
    description: "Reads one tire asset including current_tread_depth_32nds and accumulated_miles."
    roles: [DealerAdmin, FleetManager, TireTechnician, PlantScheduler]
