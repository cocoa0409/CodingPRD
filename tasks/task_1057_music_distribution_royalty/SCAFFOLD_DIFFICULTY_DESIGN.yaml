      - name: artist_statement_period_halfopen_pairwise_overlap
        grounds:
          - calculations.statement_period_overlap
          - validations[priority=20]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
          - entities.RoyaltyStatement.fields.period_start
          - entities.RoyaltyStatement.fields.period_end
        distinguishing_aspect: |
          Different interval semantics and a different resource entity: PAIRWISE HALF-OPEN overlap on
          resource entity Artist with no buffer and no capacity counting — a period starting exactly
          where the previous one ends is accepted, while any period sharing a single interior instant
          with even ONE existing statement is rejected regardless of how many statements exist.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Artist PYXIS exists with an ACTIVE PRO subscription."
            - "One RoyaltyStatement over [2026-01-01, 2026-02-01) already open for that artist."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Pyxis", legal_name: "Pyxis LLC", country_code: "US", email: "pyxis@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-pyxis-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { s2_id: $.data.id }
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "The adjacent [2026-02-01, 2026-03-01) create returns HTTP 201 and RoyaltyStatement.${s2_id}.status == OPEN"
            - "The straddling [2026-01-15, 2026-02-15) create returns HTTP 409 with data.error_id == ERR_STATEMENT_PERIOD_OVERLAP"
            - "GET /api/royalty-statements?artist_id=${artist_id} returns exactly 2 rows"

  # =====================================================================
  # Rule 9 — compensating-action invariants over different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pay_then_reverse_conserves_collaborator_settled_total_cents
        grounds:
          - calculations.collaborator_balance_invariant
          - state_machines.Payout.APPROVED_to_PAID
          - state_machines.Payout.PAID_to_REVERSED
          - entities.Collaborator.fields.pending_payout_cents
          - entities.Collaborator.fields.lifetime_paid_cents
          - entities.Collaborator.fields.reversed_payout_cents
        distinguishing_aspect: |
          Conserved quantity of type MONEY: collaborator_settled_total_cents =
          pending_payout_cents + lifetime_paid_cents + reversed_payout_cents equals exactly 2000
          before pay, after pay and after the compensating reverse — zero cent drift across the pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Plan FLAT with commission_bps 0."
            - "Artist DORADO on an ACTIVE FLAT subscription with one track whose LOCKED sheet gives US VERIFIED collaborator GOLD 10000 bps."
            - "A statement over [2026-05-01, 2026-06-01) CLOSED on a 2050-cent line, producing one auto-APPROVED payout of 2000 net cents; Collaborator GOLD then has pending 2000, lifetime 0, reversed 0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "FLAT", name: "Flat", annual_fee_cents: 3000, included_release_slots: 3, commission_bps: 0, allows_content_id: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Dorado", legal_name: "Dorado LLC", country_code: "US", email: "dorado@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-dorado-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
