              payload: { new_address_line1: "250 Oak Ave", new_city: "Chicago", new_state_code: "IL", new_zip5: "60602", new_dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}", target_in_home_date: "2026-06-15" }
              as: CampaignManager
              captures: { job_id: $.data.id }
            - call: "POST /mail/proofs"
              payload: { mail_job_id: "${job_id}", template_id: "${tpl_id}" }
              as: CampaignManager
              captures: { proof_id: $.data.id }
            - call: "POST /mail/proofs/${proof_id}/submit"
              payload: {}
              as: CampaignManager
              as_user_id: "cm-1"
            - call: "POST /mail/proofs/${proof_id}/approve"
              payload: { expected_template_version: "${tpl_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /mail/mail-jobs/${job_id}/schedule"
              payload: { target_in_home_date: "2026-06-15" }
              as: CampaignManager
            - call: "POST /mail/mail-jobs/${job_id}/commit"
              payload: {}
              as: CampaignManager
              captures: { job_v: $.data.version }
            - call: "POST /mail/mail-jobs/${job_id}/production-runs"
              payload: { machine_id: "${mach_id}", ink_lot_id: "${lot_id}", run_date: "2026-06-05", piece_count: 1, capacity_variant: "SINGLE_PASS", expected_mail_job_version: "${job_v}" }
              as: ProductionOperator
              captures: { run_id: $.data.id }
            - call: "POST /mail/production-runs/${run_id}/start"
              payload: {}
              as: ProductionOperator
            - call: "POST /mail/production-runs/${run_id}/complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /mail/mail-jobs/${job_id}/mail"
              payload: {}
              as: ProductionOperator
            - call: "POST /mail/list-records/${rec_bob_id}/returns"
              payload: { return_reason: "MOVED_NO_FORWARD" }
              as: ListOperator
              captures: { ret_id: $.data.id }
            - call: "GET /mail/list-records/${rec_bob_id}"
              payload: {}
              as: ListOperator
              captures: { rec_v: $.data.version }
          trigger:
            - call: "POST /mail/reprint-requests"
              payload: { list_record_id: "${rec_bob_id}", return_event_id: "${ret_id}", campaign_id: "${camp_id}", expected_list_record_version: "${rec_v} - 1" }
              as: ListOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_VERSION"
            - "ListRecord.${rec_bob_id}.reprint_count == 0"
            - "ListRecord.${rec_bob_id}.mail_status == RETURNED"
            - "ReturnEvent.${ret_id}.entitlement == REPRINT"

      - name: occ_stale_drip_schedule_version_rejects_second_step
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[drip-step-create-stale-schedule]', 'validations[priority=11]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "The first step bumps DripSchedule.version, so a second step still carrying the schedule's creation-time version returns 412 ERR_STALE_VERSION and step_count stays at 1."
        test_recipe:
          setup: ["One ANCHOR_IN_HOME schedule that already holds one step at sequence_no 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-262" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}" }
              as: CampaignManager
              captures: { job_id: $.data.id }
            - call: "POST /mail/drip-schedules"
              payload: { campaign_id: "${camp_id}", name: "Spring Drip", anchor_variant: "ANCHOR_IN_HOME" }
              as: CampaignManager
              captures: { sched_id: $.data.id, sv0: $.data.version }
            - call: "POST /mail/drip-schedules/${sched_id}/steps"
              payload: { mail_job_id: "${job_id}", sequence_no: 1, anchor_date: "2026-06-15", expected_drip_schedule_version: "${sv0}" }
              as: CampaignManager
              captures: { step1_id: $.data.id }
          trigger:
            - call: "POST /mail/drip-schedules/${sched_id}/steps"
              payload: { mail_job_id: "${job_id}", sequence_no: 2, anchor_date: "2026-06-19", expected_drip_schedule_version: "${sv0}" }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_VERSION"
            - "DripSchedule.${sched_id}.step_count == 1"
            - "DripSchedule.${sched_id}.status == ACTIVE"
            - "DripStep.${step1_id}.computed_mail_date == 2026-06-05"

      - name: occ_stale_mail_job_version_rejects_production_run
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[run-create-stale-job]']
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_preempts_machine_capacity
          rationale: "That instance already drives POST /mail/mail-jobs/{mail_job_id}/production-runs with a deliberately stale expected_mail_job_version and asserts the 412 ERR_STALE_VERSION."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: commit_response_exposes_every_derived_money_field_immediately
        claim_type: immediate
        grounds: [calculations.commit_settlement, 'endpoints["POST /mail/mail-jobs/{mail_job_id}/commit"]', entities.Account.fields.permit_balance_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / commit_settlement_pinned_evaluation_order
          rationale: "That instance already asserts final_postage_cents, handling_fee_cents, volume_credit_cents, total_due_cents and the account balance straight off the commit response, which is exactly the immediate-consistency claim."

      - name: template_patch_response_reflects_the_whole_cascade_in_one_request
        claim_type: immediate
        grounds: ['endpoints["PATCH /mail/templates/{template_id}"]']
        excluded_because:
          difficulty_instance: transitive_cascade / template_edit_cascade_depth_five
          rationale: "That instance asserts every hop of CASCADE A — proof, job, run, ink lot and permit balance — as observable immediately after the single PATCH, with no deferred reconciliation."
