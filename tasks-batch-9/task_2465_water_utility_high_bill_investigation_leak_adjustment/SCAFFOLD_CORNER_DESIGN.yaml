      # ---- codes whose triggers are already carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml ----

      - name: corner_error_stale_investigation_version_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STALE_INVESTIGATION_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_concurrency_p7_beats_state_p8_stale_investigation_version
          rationale: |
            That instance already drafts a leak adjustment with a superseded
            expected_investigation_version and asserts the 412 ERR_STALE_INVESTIGATION_VERSION, then
            replays the same call with the refreshed token. A separate corner instance would repeat the
            identical fixture and trigger.

      - name: corner_error_segregation_of_duties_and_locked_period_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_BILLING_PERIOD_LOCKED]
        excluded_because:
          difficulty_instance: priority_pair_business_safety_p9_beats_business_temporal_p10_on_approve
          rationale: |
            Both codes are triggered there on POST /leak-adjustments/{id}/approve — the determiner
            approving their own adjustment, and an approval against a LOCKED period — and the instance
            additionally pins which of the two wins when both conditions hold at once.

      - name: corner_error_shutoff_hold_active_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SHUTOFF_HOLD_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_execute_shutoff_blocked_while_investigation_hold_outstanding
          rationale: |
            That instance holds an open investigation on the account, shows execute-shutoff refused with
            ERR_SHUTOFF_HOLD_ACTIVE even after the notice period has elapsed, and shows the same call
            succeeding once the hold clears.

      - name: corner_error_meter_test_window_conflict_and_quarantine_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_METER_TEST_WINDOW_CONFLICT]
          - errors[ERR_METER_TEST_QUARANTINE]
        excluded_because:
          difficulty_instance: resource_overlap_meter_test_window_half_open_touching_allowed_plus_quarantine_buffer
          rationale: |
            That instance reserves overlapping and merely touching field-test windows on the same meter
            and schedules inside and outside the METER_TEST_QUARANTINE_HOURS buffer, triggering both
            codes and pinning the half-open boundary that separates them from the accepted cases.

      - name: corner_error_billing_period_overlap_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BILLING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_overlap_billing_calendar_closed_closed_shared_endpoint_date_conflicts
          rationale: |
            That instance builds the billing calendar through the shared POST /billing-periods endpoint
            and triggers ERR_BILLING_PERIOD_OVERLAP on a period whose closed-closed date range shares an
            endpoint with an existing period, while the abutting non-overlapping period is accepted.

      - name: corner_error_evidence_round_limit_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVIDENCE_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_cyclic_investigation_evidence_loop_then_remand_exhausts_rounds
          rationale: |
            That instance walks the evidence loop until evidence_round_count reaches MAX_EVIDENCE_ROUNDS
            and triggers ERR_EVIDENCE_ROUND_LIMIT on the next request-evidence call, which is the only
            state from which the code is observable.

      - name: corner_error_bill_create_meter_guards_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_METER_NOT_BILLABLE]
          - errors[ERR_BILL_METER_ACCOUNT_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_business_constraint_p11_beats_business_referential_p12_on_bill_create
          rationale: |
            That instance triggers both codes on POST /bills — an irrigation submeter offered as the
            billed meter, and a meter belonging to another account — and pins the priority-11 before
            priority-12 ordering when a single body violates both.

      - name: corner_error_arrangement_amount_mismatch_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ARRANGEMENT_AMOUNT_MISMATCH]
        excluded_because:
          difficulty_instance: cross_entity_arrangement_amount_tracks_posted_adjustment_on_the_bill
          rationale: |
            That instance triggers ERR_ARRANGEMENT_AMOUNT_MISMATCH by proposing a plan for the bill's
            pre-adjustment total after a credit has posted, which is the substantive version of the
            check; the flat wrong-total probe in this file's arrangement-guards instance is the
            degenerate case.

  # ===========================================================================
  # Guide section 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_rbac_exclusive_operation_only_a_billing_supervisor_may_issue_a_bill
        claim_type: exclusive_operations
        grounds:
          - endpoints[POST /bills/{id}/issue]
          - roles
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Issuing is the single most consequential write in the domain — it books the receivable — and it
          is exclusive to BillingSupervisor even though SystemAdmin is allowed to create the DRAFT bill in
          the first place. That asymmetry is the trap: a broad "admin can do anything" implementation
          passes every other check and fails here. The unauthenticated probe also pins the ladder, since
          a request with no headers must be a 401 before the role is ever consulted.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z; RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist."
            - "ServiceAccount ACC-5011 has meter MTR-5L-1 with reads 100000 / 104000 and a DRAFT 4000-gallon bill created by SystemAdmin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5011", customer_name: "Rosa Iglesias", service_address: "31 Magnolia Way", rate_schedule_id: "${rs_id}" }
              as: SystemAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5L-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: SystemAdmin
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /bills/${bill_id}/issue"
              as: UNAUTHENTICATED
              captures: { err_noauth: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: SystemAdmin
              captures: { err_admin: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: CustomerServiceRep
              captures: { err_csr: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: MeterTechnician
              captures: { err_tech: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: UtilityBoardClerk
              captures: { err_clerk: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: Customer
              as_user_id: "${acct_id}"
              captures: { err_customer: $.data.error_id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
          assert:
            - "NO HEADERS: the request carrying neither X-User-ID nor X-User-Role returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "SystemAdmin: HTTP 403 with error_id ERR_FORBIDDEN_ROLE — the role that created the DRAFT bill still cannot issue it"
            - "CustomerServiceRep: HTTP 403 ERR_FORBIDDEN_ROLE"
            - "MeterTechnician: HTTP 403 ERR_FORBIDDEN_ROLE"
            - "UtilityBoardClerk: HTTP 403 ERR_FORBIDDEN_ROLE"
            - "Customer owning the account: HTTP 403 ERR_FORBIDDEN_ROLE, not ERR_ACCOUNT_OWNERSHIP_MISMATCH — priority 2 precedes priority 6, and the ownership scope would in fact have been satisfied"
            - "After all six refusals Bill.${bill_id}.billing_status is still DRAFT, due_date is null and GET /service-accounts/${acct_id}/ledger-entries returns total_count 0"
            - "BillingSupervisor: HTTP 200 with billing_status ISSUED, due_date 2025-07-21 (period end 2025-06-30 plus BILL_DUE_DAYS 21) and one BILL_CHARGE ledger entry of +5210, so balance_cents == 5210 and credit_status == PAST_DUE"

      - name: corner_rbac_shared_operation_admin_and_rep_both_open_accounts_but_a_technician_cannot
        claim_type: shared_operations
        grounds:
          - endpoints[POST /service-accounts]
          - endpoints[GET /service-accounts]
          - endpoints[GET /service-accounts/{id}]
          - roles
        distinguishing_aspect: |
          Account creation is genuinely shared: SystemAdmin and CustomerServiceRep produce identical
          results, with no field differing by creator, while MeterTechnician is refused. The read surface
          is deliberately shaped differently from the write surface — BillingSupervisor may read the
          collection but not create, and a Customer may read their own account by id yet is refused the
          collection listing — so per-endpoint role sets cannot be collapsed into per-entity permissions.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z and RS-STD-2026 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5012", customer_name: "Devi Nair", service_address: "14 Hawthorn Lane", rate_schedule_id: "${rs_id}" }
              as: SystemAdmin
              captures: { acct_admin_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5013", customer_name: "Piotr Zielinski", service_address: "16 Hawthorn Lane", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_rep_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5014", customer_name: "Hana Suzuki", service_address: "18 Hawthorn Lane", rate_schedule_id: "${rs_id}" }
              as: MeterTechnician
              captures: { err_tech: $.data.error_id }
            - call: "GET /service-accounts"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_admin_id}"
              as: Customer
              as_user_id: "${acct_admin_id}"
            - call: "GET /service-accounts"
              as: Customer
              as_user_id: "${acct_admin_id}"
              captures: { err_customer_list: $.data.error_id }
          assert:
            - "ADMIN CREATE: HTTP 200 with service_status ACTIVE, credit_status CURRENT, balance_cents 0, open_investigation_hold_count 0, open_rebill_count 0, shutoff_scheduled_for null and version 1"
            - "REP CREATE: HTTP 200 with exactly the same field set and the same defaults — nothing in the row records which role created it"
            - "TECHNICIAN CREATE: HTTP 403 with error_id ERR_FORBIDDEN_ROLE, and GET /service-accounts?account_number=ACC-5014 returns total_count 0"
            - "SUPERVISOR LIST: HTTP 200 with total_count 2 — BillingSupervisor may read the collection although it may not create"
            - "CUSTOMER SINGLE READ: HTTP 200 for their own account id, because Customer is a declared role on GET /service-accounts/{id} and the ownership scope is satisfied"
            - "CUSTOMER COLLECTION READ: HTTP 403 with error_id ERR_FORBIDDEN_ROLE — Customer is not a declared role on GET /service-accounts at all, so the refusal is the priority-2 role check rather than the priority-6 ownership check"

      - name: corner_rbac_segregation_of_duties_is_enforced_on_adjustment_approval
        claim_type: segregation_of_duties
        grounds:
          - roles
          - validations[priority 9 ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_business_safety_p9_beats_business_temporal_p10_on_approve
          rationale: |
            The role_model is segregation_of_duties and its only bar is that the X-User-ID approving,
            denying or reversing a LeakAdjustment must differ from investigation.determination_by_user_id.
            That instance already has one user record the determination and then attempt the approval,
            asserts the 403 ERR_SEGREGATION_OF_DUTIES, and shows a second supervisor completing the same
            approval — including the case where the period is also LOCKED, which pins the priority order.
            The board-hearing officer bar, which is the same pattern on a different endpoint, is
            triggered separately in this file's board-hearing errors instance.

  - section: cross_cutting_layers
    instances:
      - name: corner_cross_cutting_optimistic_concurrency_stale_account_token_blocks_arrangement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[arrangement-create-stale-account]
          - endpoints[POST /payment-arrangements]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - entities.ServiceAccount.version
        distinguishing_aspect: |
          The §1.2.1 rule arrangement-create-stale-account is exercised on its own declared
          write_endpoint (POST /payment-arrangements) and its own occ_field
          (expected_account_version) by three strictly sequential creates that carry only two
          distinct version tokens. The first create succeeds with the token read from the account
          and, by its declared side effect, advances ServiceAccount.version by one. The second
          create replays that same now-stale token and is refused 412 ERR_STALE_ACCOUNT_VERSION.
          The third create carries the re-read token and succeeds, and only then does the earlier
          PROPOSED plan move to CANCELLED. Falsifiable in three independent ways: an
          implementation that ignores expected_account_version lets the second create through and
          ends with three arrangement rows instead of two; one that fails to bump the version on a
          successful create lets the replay succeed with the original token; one that cancels the
          existing plan before the OCC check leaves the first arrangement CANCELLED even though
          the refused create returned 412 and must have written nothing.
        test_recipe:
          setup: |
            One rate schedule, one SUMMER billing period that has already ended, one account with
            one master meter, two ACTUAL reads bounding the period, and one bill issued for
            4000 gallons (total_charge_cents 5210) so the account sits at balance_cents 5210 with
            credit_status PAST_DUE and a financeable adjusted_total_cents of 5210.
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5015", customer_name: "Rosa Guerrero", service_address: "21 Juniper Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id, acct_v_create: $.data.version }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5M-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: SystemAdmin
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
          trigger:
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
              captures: { acct_v_stale: $.data.version }
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_id}", bill_id: "${bill_id}", total_amount_cents: 5210, down_payment_cents: 1042, installment_count: 4, expected_account_version: "${acct_v_stale}" }
              as: CustomerServiceRep
              captures: { arr_a: $.data.id }
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_id}", bill_id: "${bill_id}", total_amount_cents: 5210, down_payment_cents: 2000, installment_count: 6, expected_account_version: "${acct_v_stale}" }
              as: CustomerServiceRep
              captures: { err_stale: $.data.error_id }
            - call: "GET /payment-arrangements/${arr_a}"
              as: CustomerServiceRep
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
              captures: { acct_v_fresh: $.data.version }
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_id}", bill_id: "${bill_id}", total_amount_cents: 5210, down_payment_cents: 2000, installment_count: 6, expected_account_version: "${acct_v_fresh}" }
              as: CustomerServiceRep
              captures: { arr_b: $.data.id }
            - call: "GET /payment-arrangements/${arr_a}"
              as: CustomerServiceRep
            - call: "GET /payment-arrangements?account_id=${acct_id}"
              as: CustomerServiceRep
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
          assert:
            - "FIRST READ: HTTP 200; version is the token the client will replay. On this fixture the account was created at version 1 and the bill issue mutated balance_cents and credit_status, so the captured value is 2"
            - "FIRST CREATE: HTTP 200 with status PROPOSED, total_amount_cents 5210, down_payment_cents 1042, installment_cents 1042 and final_installment_cents 1042 (5210 - 1042 = 4168, 4168 / 4 = 1042 exactly, so the final instalment absorbs a zero remainder)"
            - "REPLAY CREATE: HTTP 412 with error_id ERR_STALE_ACCOUNT_VERSION — the token is one behind because the first create declared 'Increments ServiceAccount.version by 1'"
            - "FIRST PLAN AFTER THE REFUSAL: HTTP 200 with status still PROPOSED and installment_cents still 1042 — the refused create cancelled nothing, so the OCC check ran before the cancel side effect"
            - "SECOND READ: HTTP 200 with version exactly one greater than the first read's captured value (3 on this fixture) — one successful write, one increment"
            - "REFRESHED CREATE: HTTP 200 with status PROPOSED, down_payment_cents 2000, installment_cents 535 and final_installment_cents 535 (5210 - 2000 = 3210, 3210 / 6 = 535 exactly)"
            - "FIRST PLAN AFTER THE REFRESHED CREATE: HTTP 200 with status CANCELLED — the supersede side effect fires only on the create that passed the version check"
            - "LIST: HTTP 200 with total_count 2 and no third row — the 412 attempt left no PaymentArrangement behind"
            - "THIRD READ: HTTP 200 with version exactly two greater than the first read's captured value (4 on this fixture), balance_cents still 5210 and credit_status still PAST_DUE — a PROPOSED plan is not an ACTIVE one, so nothing pinned the account to IN_ARRANGEMENT"

      - name: corner_cross_cutting_derived_field_reconciliation_rebill_counter_tracks_its_source_rows
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ServiceAccount.open_rebill_count
          - entities.ServiceAccount.open_investigation_hold_count
          - state_machines.ServiceAccount
          - endpoints[POST /meter-readings]
          - endpoints[POST /bills/{id}/rebill]
        distinguishing_aspect: |
          ServiceAccount.open_rebill_count is declared as a count of Bill rows with
          billing_status == REBILL_PENDING, so it must be reconciled against the bill table at
          three separate moments rather than incremented once and forgotten: it reads 0 right
          after the bill is created and issued, 1 once a CORRECTED read pushes that bill into
          REBILL_PENDING, and 0 again after the rebill retires the source row. Because the
          shutoff-hold branch of the ServiceAccount machine keys off
          open_investigation_hold_count + open_rebill_count, each reconciliation is observable in
          service_status as well: SHUTOFF_SCHEDULED -> SHUTOFF_HELD when the sum leaves zero and
          back to SHUTOFF_SCHEDULED when it returns to zero, with shutoff_scheduled_for preserved
          across both moves. Falsifiable against an implementation that increments a stored
          counter without recomputing (it would leave 1 after the rebill), one that recomputes
          the counter but not the derived service_status, and one that reissues a fresh 10-day
          notice on the way out of the hold instead of restoring the original anchor.
        test_recipe:
          setup: |
            Logical clock at 2026-08-01T00:00:00Z. One rate schedule, one SUMMER period that ended
            2025-06-30 with a rebilling deadline of 2026-12-31, one account, one master meter, an
            opening read of 100000 and a period-end read of 104000, and a bill issued for 4000
            gallons at 5210 cents. The account is therefore PAST_DUE, and a supervisor schedules a
            shutoff, which sets shutoff_scheduled_for to 2026-08-11T00:00:00Z.
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5016", customer_name: "Tomas Blanco", service_address: "23 Juniper Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5N-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: SystemAdmin
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
              captures: { read_open: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
              captures: { read_end: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "POST /service-accounts/${acct_id}/schedule-shutoff"
              as: BillingSupervisor
          trigger:
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 103900, corrects_reading_id: "${read_end}" }
              as: MeterTechnician
              captures: { read_fix: $.data.id }
            - call: "GET /bills/${bill_id}"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
            - call: "GET /meter-readings?meter_id=${meter_id}&live_only=true"
              as: BillingSupervisor
            - call: "POST /bills/${bill_id}/rebill"
              as: BillingSupervisor
              captures: { bill_new: $.data.id }
            - call: "GET /bills/${bill_id}"
              as: BillingSupervisor
            - call: "GET /bills?account_id=${acct_id}&billing_status=REBILL_PENDING"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
            - call: "GET /service-accounts/${acct_id}/ledger-entries"
              as: CustomerServiceRep
          assert:
            - "BASELINE READ: HTTP 200 with open_rebill_count 0, open_investigation_hold_count 0, balance_cents 5210, credit_status PAST_DUE, service_status SHUTOFF_SCHEDULED and shutoff_scheduled_for 2026-08-11T00:00:00Z"
            - "CORRECTED READ: HTTP 200 with read_type CORRECTED, corrects_reading_id equal to the 104000 read's id and consumption_since_prior_gallons 3900"
            - "BILL AFTER THE CORRECTION: HTTP 200 with billing_status REBILL_PENDING, consumption_gallons 3900, water_charge_cents 2718 (1200 + 3000 * 350 / 1000 + 900 * 520 / 1000, no tier-3 gallons so no summer surcharge), sewer_charge_cents 2379 and total_charge_cents 5097"
            - "ACCOUNT AFTER THE CORRECTION: HTTP 200 with open_rebill_count 1 — reconciled up from the one REBILL_PENDING bill row — open_investigation_hold_count still 0, service_status SHUTOFF_HELD and shutoff_scheduled_for still 2026-08-11T00:00:00Z"
            - "LIVE READS: HTTP 200 with total_count 2 (100000 and 103900); the same query without live_only returns total_count 3, and the superseded 104000 row carries superseded_by_reading_id equal to the CORRECTED read's id — the counter tracks live source rows, not the raw insert count"
            - "REBILL: HTTP 200 with billing_status ISSUED, rebill_of_bill_id equal to the original bill id, consumption_gallons 3900 and total_charge_cents 5097"
            - "ORIGINAL BILL AFTER THE REBILL: HTTP 200 with billing_status REBILLED"
            - "REBILL_PENDING FILTER: HTTP 200 with total_count 0 — no source row remains for the counter to count"
            - "ACCOUNT AFTER THE REBILL: HTTP 200 with open_rebill_count back to 0, balance_cents 5097, credit_status still PAST_DUE (5097 > 5000), service_status back to SHUTOFF_SCHEDULED and shutoff_scheduled_for still exactly 2026-08-11T00:00:00Z — leaving the hold restores the original notice anchor rather than granting a fresh 10 days"
            - "LEDGER: HTTP 200 with total_count 3 — BILL_CHARGE +5210, REBILL_REVERSAL -5210 and REBILL_CHARGE +5097 — summing to the 5097 balance"

      - name: corner_cross_cutting_cascading_side_effects_are_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /leak-adjustments/{id}/approve]
          - state_machines.ServiceAccount
        excluded_because:
          difficulty_instance: transitive_cascade_approve_adjustment_ledger_to_balance_to_credit_to_service
          rationale: |
            Approving a LeakAdjustment is the deepest cascade the scaffold declares: adjustment ->
            ledger entries -> balance_cents -> credit_status -> service_status, with the bill and
            the investigation moving alongside. That instance already walks the whole chain in one
            request, asserts every intermediate value, pins the ordering by showing that a
            credit_status computed before the ledger insert would leave the account PAST_DUE, and
            covers the partial-failure case where the cap refusal aborts the entire cascade with
            no ledger row written. A second end-to-end walk of the same chain here would only
            restate it.
      - name: corner_cross_cutting_dual_variant_calculation_both_branches_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - calculations.leak_adjustment_credit
          - entities.LeakAdjustment.variant_applied
        excluded_because:
          difficulty_instance: dual_variant_leak_credit_excess_reprice_vs_baseline_rebill
          rationale: |
            leak_adjustment_credit is the scaffold's headline dual-variant calculation, and that
            instance runs both branches over the identical 41000-gallon bill against the identical
            4000-gallon baseline: SERVICE_LINE selects BASELINE_REBILL for a net credit of 26963
            cents, TOILET selects EXCESS_REPRICE for 21899, and the 5064-cent delta on the switch
            is asserted as a literal. The bench-accuracy calculation's AWWA-weighted versus
            simple-mean pair is covered by its own §1.8 instance. Repeating either pair here would
            add no discrimination.
      - name: corner_cross_cutting_rate_threshold_triggers_fire_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.anomaly_detection
          - workflow_constants.ANOMALY_RATIO_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_anomaly_ratio_inclusive_at_two_point_zero_three_decimals
          rationale: |
            The scaffold's threshold triggers are the anomaly ratio against the seasonal baseline
            and the bench-test accuracy bands. That instance pins the anomaly trigger at exactly
            ANOMALY_RATIO_THRESHOLD with three-decimal rounding on both sides of 2.000, and the
            bench-band instance pins the strict-greater-than 101.50 FAST edge; the cumulative
            rolling-window trigger that caps a second credit inside twelve months has its own
            errors instance in this file. The reset behaviour is covered there too, because the
            baseline recomputes from the next three qualifying bills.

  - section: consistency_model
    instances:
      - name: corner_consistency_immediate_every_write_response_already_carries_its_own_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /bills]
          - endpoints[POST /service-accounts/{id}/payments]
          - entities.ServiceAccount.balance_cents
        distinguishing_aspect: |
          The declared consistency model is immediate, so no derived value in this scaffold is
          ever allowed to lag a request: the creating call's own response body must already carry
          every computed field, and any cascade a write triggers must be visible to the very next
          read with no polling, no retry and no reconciliation step in between. Four writes are
          checked in one sequence — POST /bills returns its tiered water charge, sewer charge and
          baseline verdict in the create response itself rather than a DRAFT skeleton; issue
          returns the derived due_date; schedule-shutoff returns the account with
          shutoff_scheduled_for already populated; and a full payment returns a ledger entry whose
          effect on balance_cents, credit_status and service_status is already visible on the
          immediately following read, including the release of the scheduled shutoff. The last
          assertion is the falsifier in the other direction: the bill is deliberately still ISSUED
          with adjusted_total_cents 5210 after the payment, because immediate visibility means the
          declared cascade lands at once, not that unrelated rows drift.
        test_recipe:
          setup: |
            Logical clock at 2026-08-01T00:00:00Z. One rate schedule, one SUMMER period ending
            2025-06-30, one account, one master meter and two ACTUAL reads bounding the period at
            100000 and 104000. No bill exists yet, so the account is CURRENT with balance_cents 0
            and service_status ACTIVE.
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5017", customer_name: "Nadia Osei", service_address: "25 Juniper Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-5P-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: SystemAdmin
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
            - call: "POST /service-accounts/${acct_id}/schedule-shutoff"
              as: BillingSupervisor
            - call: "POST /service-accounts/${acct_id}/payments"
              payload: { amount_cents: 5210, memo: "paid in full at the counter" }
              as: CustomerServiceRep
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
            - call: "GET /service-accounts?credit_status=CURRENT"
              as: BillingSupervisor
            - call: "GET /bills/${bill_id}"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}/ledger-entries"
              as: CustomerServiceRep
          assert:
            - "CREATE BILL: HTTP 200 and the create response itself already carries consumption_gallons 4000, water_charge_cents 2770, sewer_billable_gallons 4000, sewer_charge_cents 2440, total_charge_cents 5210, adjusted_total_cents 5210, estimated_flag false, submeter_credit_gallons 0, seasonal_baseline_gallons null, baseline_sample_count 0, anomaly_ratio null, anomaly_flag false and billing_status DRAFT — no field is left null pending a later pass"
            - "ISSUE: HTTP 200 with billing_status ISSUED and due_date 2025-07-21 (period end 2025-06-30 plus BILL_DUE_DAYS 21) in that same response"
            - "ACCOUNT READ RIGHT AFTER ISSUE: HTTP 200 with balance_cents 5210 and credit_status PAST_DUE on the very next call, read by a different role than the one that issued"
            - "SCHEDULE SHUTOFF: HTTP 200 and the action's own response body already shows service_status SHUTOFF_SCHEDULED with shutoff_scheduled_for 2026-08-11T00:00:00Z (clock_now plus SHUTOFF_NOTICE_DAYS 10)"
            - "PAYMENT: HTTP 200 with entry_type PAYMENT, source_kind CUSTOMER_PAYMENT, amount_cents -5210, bill_id null, source_id null and effective_at 2026-08-01T00:00:00Z"
            - "ACCOUNT READ RIGHT AFTER THE PAYMENT: HTTP 200 with balance_cents 0, credit_status CURRENT, service_status ACTIVE and shutoff_scheduled_for null — the balance recompute, the credit recompute and the shutoff release are all already done, with no second call, no delay and no retry between the payment and this read"
            - "FILTERED LIST: HTTP 200 with total_count 1 — the collection index reflects the new credit_status in the same sequence, not on a later sweep"
            - "BILL AFTER THE PAYMENT: HTTP 200 with billing_status still ISSUED and adjusted_total_cents still 5210 — paying an account is not declared to retire its bill, so immediate visibility does not invent a transition"
            - "LEDGER: HTTP 200 with total_count 2 in effective_at ASC order — BILL_CHARGE +5210 then CUSTOMER_PAYMENT -5210 — summing to the balance_cents 0 reported above"
