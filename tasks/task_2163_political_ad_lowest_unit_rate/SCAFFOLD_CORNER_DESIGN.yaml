        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[luc-determination-create-stale-election]
          - errors[ERR_STALE_ELECTION_VERSION]
          - validations[priority=20]
        distinguishing_aspect: "After one determination advanced Election.version from 1 to 2, a second create still carrying the version observed before that write is refused with ERR_STALE_ELECTION_VERSION and HTTP 412, and no second LucDetermination row exists."
        test_recipe:
          setup: ["One station with a PRIMARY election on 2026-09-15 and one MORNING rate class; one PROVISIONAL determination has already been created, so the election's version has advanced by one."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
