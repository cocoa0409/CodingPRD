# =============================================================================
# Task 1018 — Spice, Tea & Bulk-Herb Shop
# Bulk SKU & tare/weight, blend/custom & batch, gift & tin, allergen/labeling,
# freshness/rotation, wholesale account, inventory allocation.
# Difficulty band: Expert
# =============================================================================

scenario: |
  1018. Spice, Tea & Bulk-Herb Shop: bulk SKU & tare/weight, blend/custom &
  batch, subscription & sampler, gift & tin, allergen/labeling,
  freshness/rotation, wholesale account, inventory

domain_name: spice-tea-bulk-herb
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"          # finite lot inventory reserved/released
  secondary_archetype: "Temporal windowing"        # production-line & labeling-station windows
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph          # Product ->(BlendComponent)-> Product self-referential + cross-aggregate FKs
  state_machine_shape: cyclic     # InventoryLot AVAILABLE<->DEPLETED and WholesaleAccount ACTIVE<->SUSPENDED
  relationship_patterns:
    - many_to_many        # BlendComponent junction Product<->Product
    - self_referential    # a BLEND Product references SIMPLE Products as components
    - cross_aggregate     # OrderLine -> InventoryLot allocation across aggregates
    - one_to_many         # Product -> InventoryLot, CustomerOrder -> OrderLine
  role_model: peer_roles          # CatalogManager / ProductionOperator / SalesAgent own disjoint surfaces; PlatformAdmin overrides
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true              # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Catalog display name" }
      - { name: category, type: enum, source: input, description: "SPICE | TEA | HERB", constraints: "one of SPICE, TEA, HERB" }
      - { name: kind, type: enum, source: input, description: "SIMPLE | BLEND. BLEND products draw their contents from BlendComponents", constraints: "one of SIMPLE, BLEND" }
      - { name: unit_price_cents_per_gram, type: number, source: input, description: "Retail/wholesale rate in cents per gram; may be fractional (e.g. 3.5)", constraints: "> 0" }
      - { name: tare_default_grams, type: integer, source: input, description: "Default container/tare weight used for provisional pricing before a physical weigh", constraints: ">= 0" }
      - { name: allergen_tags, type: array, source: input, description: "For SIMPLE products: declared allergen strings (e.g. TREE_NUTS, SESAME). For BLEND products this input is ignored; effective allergens are computed from components." }
      - { name: shelf_life_days, type: integer, source: input, description: "Nominal shelf life in days (informational)", default: 365 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: "ACTIVE", constraints: "one of ACTIVE, DISCONTINUED" }
      - { name: stock_state, type: enum, source: computed, description: "IN_STOCK | OUT_OF_STOCK — OUT_OF_STOCK when the product has no AVAILABLE, non-expired lot with grams_on_hand > 0", constraints: "one of IN_STOCK, OUT_OF_STOCK" }

  - name: BlendComponent
    parent: null
    common_fields: false             # id, created_at only (immutable junction row)
    fields:
      - { name: blend_product_id, type: string, source: input, description: "FK -> Product.id; the BLEND product this component belongs to" }
      - { name: component_product_id, type: string, source: input, description: "FK -> Product.id; the SIMPLE ingredient product" }
      - { name: weight_ratio_bps, type: integer, source: input, description: "Weight share in basis points (1/10000). All components of one blend MUST sum to exactly 10000", constraints: "1..10000" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product this lot stocks" }
      - { name: source_batch_id, type: string, source: system, description: "FK -> Batch.id; set only on lots minted by a blend production run, else null", default: null }
      - { name: lot_code, type: string, source: input, description: "Human lot code" }
      - { name: grams_received, type: integer, source: input, description: "Grams booked in when the lot was received", constraints: "> 0" }
      - { name: grams_on_hand, type: integer, source: computed, description: "Remaining grams; starts equal to grams_received; decremented on allocation/draw, restored on release; never negative", constraints: ">= 0" }
      - { name: received_at, type: datetime, source: input, description: "ISO 8601 UTC receipt timestamp" }
      - { name: best_by, type: datetime, source: input, description: "ISO 8601 UTC best-by instant; lot is EXPIRED once logical clock >= best_by" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | DEPLETED | EXPIRED. EXPIRED when clock >= best_by (takes precedence); DEPLETED when grams_on_hand == 0 and not expired; else AVAILABLE", constraints: "one of AVAILABLE, DEPLETED, EXPIRED" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Line label; a Batch occupies a [scheduled_start, scheduled_end) window on exactly one line" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: blend_product_id, type: string, source: input, description: "FK -> Product.id; the BLEND product produced by this run" }
      - { name: production_line_id, type: string, source: input, description: "FK -> ProductionLine.id; the line whose time window this batch occupies" }
      - { name: target_output_grams, type: integer, source: input, description: "Grams of finished blend to yield", constraints: "> 0" }
      - { name: produced_grams, type: integer, source: computed, description: "Actual grams minted; 0 until PRODUCED, then equals target_output_grams", default: 0 }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | PRODUCED", default: "PLANNED", constraints: "one of PLANNED, PRODUCED" }

  - name: LabelingStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station label; TinRuns occupy [scheduled_start, scheduled_end) windows on one station and require a cleaning buffer between runs" }

  - name: TinRun
    parent: null
    common_fields: true
    fields:
      - { name: labeling_station_id, type: string, source: input, description: "FK -> LabelingStation.id; the station this gift-tin packing run occupies" }
      - { name: product_ids, type: array, source: input, description: "Product ids packed into the gift tins during this run (used to derive allergen_set for cross-contamination labeling)" }
      - { name: allergen_set, type: array, source: computed, description: "Union of effective allergens across product_ids; drives the cleaning-buffer requirement on the station" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC window end (exclusive)" }

  - name: WholesaleAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Wholesale customer legal name" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD", default: "BRONZE", constraints: "one of BRONZE, SILVER, GOLD" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding exposure in cents", constraints: ">= 0" }
      - { name: committed_exposure_cents, type: integer, source: computed, description: "Sum of held_exposure_cents over this account's orders in CONFIRMED, PACKED or SHIPPED" }
      - { name: projected_exposure_cents, type: integer, source: computed, description: "committed_exposure_cents plus the provisional_total_cents of this account's PRICED (not yet confirmed) orders" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_limit_cents - committed_exposure_cents (uses the committed variant, never projected)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "one of ACTIVE, SUSPENDED" }

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - { name: wholesale_account_id, type: string, source: input, description: "FK -> WholesaleAccount.id; the account billed for this order" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | PRICED | CONFIRMED | PACKED | SHIPPED | CANCELLED", default: "DRAFT", constraints: "one of DRAFT, PRICED, CONFIRMED, PACKED, SHIPPED, CANCELLED" }
      - { name: allergen_ack, type: boolean, source: input, description: "Buyer acknowledgement that the order may contain declared allergens; required to PACK any order whose lines carry a non-empty effective allergen set", default: false }
      - { name: total_net_grams, type: integer, source: computed, description: "Sum of line net grams (requested at PRICE, measured at PACK); drives discount tier selection" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Estimate stamped at PRICE using requested_grams and catalog tare (subtotal after per-line rounding, minus tier discount)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final stamped at PACK using measured net grams (subtotal after per-line rounding, minus tier discount)" }
      - { name: held_exposure_cents, type: integer, source: computed, description: "Credit currently held against the account: provisional_total_cents at CONFIRM, re-set to final_total_cents at PACK, 0 after CANCEL", default: 0 }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomerOrder.id; the parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product being purchased in bulk" }
      - { name: requested_grams, type: integer, source: input, description: "Net grams the buyer asked for (used for provisional pricing and discount tier at PRICE)", constraints: "> 0" }
      - { name: gross_grams, type: integer, source: computed, description: "Measured gross weight (product + container) captured at PACK", default: null }
      - { name: tare_grams, type: integer, source: computed, description: "Measured container/tare weight captured at PACK", default: null }
      - { name: net_grams, type: integer, source: computed, description: "gross_grams - tare_grams at PACK; equals requested_grams before PACK for provisional math", default: null }
      - { name: allocated_lot_id, type: string, source: computed, description: "FK -> InventoryLot.id; the single lot the FEFO allocator drew this line's net grams from at PACK; null before PACK", default: null }
      - { name: provisional_line_cents, type: integer, source: computed, description: "round_half_up(requested_grams * product.unit_price_cents_per_gram); stamped at PRICE" }
      - { name: final_line_cents, type: integer, source: computed, description: "round_half_up(net_grams * product.unit_price_cents_per_gram); stamped at PACK" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{id}/discontinue"
        actor: CatalogManager
        preconditions: []
        side_effects:
          - "Product can no longer be added to a DRAFT order line; existing lines are unaffected"

  - entity: InventoryLot
    field: status
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    note: "Cyclic: AVAILABLE -> DEPLETED (draw/allocate) -> AVAILABLE (release on order cancel). EXPIRED is time-derived and dominates."
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "POST /orders/{id}/pack (allocation draw) or POST /batches/{id}/produce (component draw)"
        actor: system
        preconditions:
          - "grams_on_hand reaches 0 as a result of the draw"
        side_effects:
          - "If this was the product's last lot with grams_on_hand > 0, set Product.stock_state = OUT_OF_STOCK"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "POST /orders/{id}/pack rollback via POST /orders/{id}/cancel (release restores grams_on_hand)"
        actor: system
        preconditions:
          - "grams_on_hand becomes > 0 after a release"
        side_effects:
          - "If the product now has a lot with grams_on_hand > 0, set Product.stock_state = IN_STOCK"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (logical clock advances to >= best_by)"
        actor: system
        preconditions:
          - "current logical clock >= best_by"
        side_effects:
          - "Lot is excluded from FEFO allocation candidate sets"

  - entity: Batch
    field: status
    initial_state: PLANNED
    terminal_states: [PRODUCED]
    transitions:
      - from: PLANNED
        to: PRODUCED
        trigger: "POST /batches/{id}/produce"
        actor: ProductionOperator
        preconditions:
          - "blend_product_id resolves to a Product with kind == BLEND (else ERR_PRODUCT_NOT_BLEND)"
          - "Every component product has enough AVAILABLE, non-expired grams to satisfy its share (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "batch_component_draw: for each BlendComponent, draw ceil(target_output_grams * weight_ratio_bps / 10000) grams from that component's lots in FEFO order (best_by ASC, then received_at ASC, then created_at ASC)"
          - "Each drawn lot's grams_on_hand is decremented; a lot reaching 0 transitions AVAILABLE -> DEPLETED"
          - "A DEPLETED component lot that was the product's last positive lot cascades Product.stock_state -> OUT_OF_STOCK"
          - "Mint a new InventoryLot for blend_product_id with grams_received = grams_on_hand = target_output_grams, source_batch_id = this batch, best_by = clock + blend_product.shelf_life_days"
          - "produced_grams = target_output_grams; status -> PRODUCED"

  - entity: WholesaleAccount
    field: status
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: ACTIVE <-> SUSPENDED."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wholesale-accounts/{id}/suspend"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "New order CONFIRM against this account is blocked while SUSPENDED (ERR_ACCOUNT_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wholesale-accounts/{id}/reinstate"
        actor: SalesAgent
        preconditions: []
        side_effects: []

  - entity: CustomerOrder
    field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /orders/{id}/price"
        actor: SalesAgent
        preconditions:
          - "Order has >= 1 OrderLine"
          - "Every line's product.status == ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
        side_effects:
          - "Stamp provisional_line_cents on each line (line_pricing.provisional)"
          - "Stamp total_net_grams, provisional_total_cents (order_subtotal_rounding + order_discount_tier)"
      - from: PRICED
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesAgent
        preconditions:
          - "expected_wholesale_account_version matches the account's current version (else ERR_STALE_VERSION)"
          - "Account.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
          - "provisional_total_cents <= account.available_credit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "held_exposure_cents = provisional_total_cents"
          - "account.committed_exposure_cents increases by held_exposure_cents"
          - "increments WholesaleAccount.version by 1"
      - from: CONFIRMED
        to: PACKED
        trigger: "POST /orders/{id}/pack"
        actor: ProductionOperator
        preconditions:
          - "allergen_ack == true whenever any line's effective allergen set is non-empty (else ERR_ALLERGEN_LABEL_REQUIRED)"
          - "For each line, the FEFO-selected lot is not EXPIRED (else ERR_LOT_EXPIRED)"
          - "For each line, a single AVAILABLE lot holds >= net_grams (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Stamp measured gross_grams, tare_grams, net_grams per line from line_measurements"
          - "Stamp final_line_cents per line and final_total_cents (line_pricing.final + order rounding/discount)"
          - "Allocate: decrement each selected lot's grams_on_hand by net_grams; set allocated_lot_id"
          - "A lot reaching 0 grams transitions AVAILABLE -> DEPLETED, cascading Product.stock_state"
          - "held_exposure_cents = final_total_cents; account.committed_exposure_cents adjusts by (final - provisional)"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "Allocations become permanent; grams stay decremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: PRICED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "Release credit hold: account.committed_exposure_cents decreases by held_exposure_cents; held_exposure_cents = 0"
      - from: PACKED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "Release allocations: for each line, restore net_grams to allocated_lot_id.grams_on_hand"
          - "A restored lot that was DEPLETED transitions DEPLETED -> AVAILABLE, cascading Product.stock_state -> IN_STOCK"
          - "Release credit hold: account.committed_exposure_cents decreases by held_exposure_cents; held_exposure_cents = 0"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-account
    parent_entity: WholesaleAccount
    write_endpoint: "POST /orders/{id}/confirm"
    occ_field: "expected_wholesale_account_version"
    description: |
      Confirming an order against a WholesaleAccount whose version has advanced
      since the client last observed it is rejected. Confirming another of the
      account's PRICED orders legitimately commits a credit hold and advances the
      account version; a confirm still carrying the earlier version is therefore
      operating on a stale view of available credit and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "POST /orders/{id}/price (provisional) and POST /orders/{id}/pack (final)"
    algorithm: threshold
    formula: |
      provisional_line_cents = round_half_up(requested_grams * product.unit_price_cents_per_gram)
      final_line_cents       = round_half_up(net_grams       * product.unit_price_cents_per_gram)
      where net_grams = gross_grams - tare_grams (measured at PACK)
    input_set: "One OrderLine; product.unit_price_cents_per_gram from the referenced Product"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at PRICE, before a physical weigh"
        difference: "uses requested_grams as net; ignores measured tare"
      - name: final
        when: "at PACK, after weighing"
        difference: "uses measured net_grams = gross_grams - tare_grams; diverges from provisional whenever measured net != requested_grams"

  - name: order_subtotal_rounding
    trigger: "POST /orders/{id}/price and POST /orders/{id}/pack"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each line to whole cents FIRST, then sum.
      subtotal_cents = sum( round_half_up(line_grams * line.product.unit_price_cents_per_gram)
                            for line in order.lines )
      # (The alternative "sum the unrounded products, then round once" is NOT used
      #  and generally yields a different subtotal by 1 cent.)
    input_set: "All OrderLines of the order; line_grams = requested_grams at PRICE, net_grams at PACK"
    precision: "integer cents, round_half_up per line, then integer sum"

  - name: order_discount_tier
    trigger: "POST /orders/{id}/price and POST /orders/{id}/pack"
    algorithm: tiered_pricing
    formula: |
      total_net_grams = sum(line_grams for line in order.lines)
      if   total_net_grams < 500:      rate = 0.00
      elif total_net_grams < 2000:     rate = 0.05        # [500, 2000)
      else:                            rate = 0.12        # [2000, +inf)
      discount_cents = round_half_up(subtotal_cents * rate)
    input_set: "Order subtotal_cents (from order_subtotal_rounding) and total_net_grams"
    constants:
      TIER1_GRAMS: 500
      TIER2_GRAMS: 2000
      TIER1_RATE: 0.05
      TIER2_RATE: 0.12
    precision: "boundaries are half-open [lo, hi); discount rounded half_up to integer cents"

  - name: order_total
    trigger: "POST /orders/{id}/price (-> provisional_total_cents) and POST /orders/{id}/pack (-> final_total_cents)"
    algorithm: aggregation
    formula: |
      total_cents = subtotal_cents - discount_cents
    input_set: "order_subtotal_rounding then order_discount_tier, evaluated in that pinned order"
    precision: "integer cents"

  - name: account_exposure
    trigger: "read of WholesaleAccount; recomputed on every order confirm/pack/cancel"
    algorithm: aggregation
    formula: |
      committed_exposure_cents = sum(o.held_exposure_cents
                                     for o in account.orders
                                     if o.fulfillment_status in {CONFIRMED, PACKED, SHIPPED})
      projected_exposure_cents = committed_exposure_cents
                               + sum(o.provisional_total_cents
                                     for o in account.orders
                                     if o.fulfillment_status == PRICED)
      available_credit_cents   = credit_limit_cents - committed_exposure_cents
    input_set: "All CustomerOrders whose wholesale_account_id == account.id, filtered by fulfillment_status as shown"
    precision: "integer cents"
    variants:
      - name: committed
        when: "credit gating at CONFIRM and the available_credit_cents field"
        difference: "counts only CONFIRMED/PACKED/SHIPPED holds"
      - name: projected
        when: "the projected_exposure_cents what-if field"
        difference: "additionally counts PRICED orders at their provisional_total_cents; exceeds committed whenever a PRICED order exists"

  - name: fefo_allocation
    trigger: "POST /orders/{id}/pack — pick the lot each line draws from"
    algorithm: waterfall_allocation
    formula: |
      candidates = [ lot for lot in InventoryLot
                     if lot.product_id == line.product_id
                     and lot.status == AVAILABLE            # excludes EXPIRED and DEPLETED
                     and lot.grams_on_hand >= line.net_grams ]
      # Rank: best_by ASC (first-expiry-first-out), then received_at ASC, then created_at ASC.
      # created_at is the final deterministic tie-break; the random id is NEVER used.
      selected = min(candidates, key=(best_by, received_at, created_at))
      if not candidates: raise ERR_INSUFFICIENT_STOCK
    input_set: "AVAILABLE, non-expired lots of the line's product with grams_on_hand >= net_grams"
    precision: "n/a"

  - name: batch_component_draw
    trigger: "POST /batches/{id}/produce"
    algorithm: waterfall_allocation
    formula: |
      for component in blend.components:
        need = ceil(batch.target_output_grams * component.weight_ratio_bps / 10000)
        lots = [lot for lot in InventoryLot
                if lot.product_id == component.component_product_id
                and lot.status == AVAILABLE]
        # Draw across lots in FEFO order (best_by ASC, received_at ASC, created_at ASC)
        # until `need` grams are drawn; each fully-drained lot -> DEPLETED.
        if sum(lot.grams_on_hand for lot in lots) < need: raise ERR_INSUFFICIENT_STOCK
    input_set: "AVAILABLE, non-expired lots of each component product"
    constants:
      BPS_TOTAL: 10000
    precision: "ceil grams per component; FEFO order over lots"

  - name: effective_allergens
    trigger: "PACK allergen gate, TinRun.allergen_set computation"
    algorithm: aggregation
    formula: |
      effective_allergens(product):
        if product.kind == SIMPLE: return set(product.allergen_tags)
        else:                      return union(effective_allergens(c.component_product)
                                                for c in product.components)
    input_set: "A product and, for blends, its BlendComponents' products"
    precision: "set union"

  - name: freshness_status
    trigger: "read of InventoryLot; PACK/produce candidate filtering"
    algorithm: threshold
    formula: |
      if clock_now >= best_by:        status = EXPIRED      # boundary is inclusive (>=)
      elif grams_on_hand == 0:        status = DEPLETED
      else:                           status = AVAILABLE
    input_set: "One lot plus the current logical clock"
    constants:
      DEFAULT_CLOCK: "2026-07-01T00:00:00Z"
    precision: "instant comparison; equality at best_by counts as EXPIRED"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix (and, for entity_backed Wholesaler, owns the target account)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body id resolves, left-to-right (product, lot, batch, line, order, account, station, production line)"
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_LINE_RESOURCE_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_TIN_RUN_NOT_FOUND | ERR_COMPONENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with ids

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: state
    check: "OCC: expected_wholesale_account_version equals the account's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/confirm"

  - priority: 6
    category: business_safety
    check: "allergen_ack == true when any packed line carries a non-empty effective allergen set"
    error_id: ERR_ALLERGEN_LABEL_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{id}/pack"

  - priority: 7
    category: business_temporal
    check: "Selected lot not EXPIRED; batch/tin-run windows respect overlap and buffer rules; window start < end"
    error_id: "ERR_LOT_EXPIRED | ERR_LINE_WINDOW_CONFLICT | ERR_STATION_BUFFER_CONFLICT | ERR_WINDOW_INVALID"
    http_status: 409
    applies_to: "pack, POST /batches, POST /tin-runs"

  - priority: 8
    category: business_referential
    check: "Product references are consistent: product ACTIVE for order pricing; blend product is kind==BLEND for production; account ACTIVE for confirm"
    error_id: "ERR_PRODUCT_DISCONTINUED | ERR_PRODUCT_NOT_BLEND | ERR_ACCOUNT_SUSPENDED"
    http_status: 409
    applies_to: "price, confirm, produce"

  - priority: 9
    category: business_constraint
    check: "Sufficient stock for allocation/draw; blend component ratios sum to 10000; no duplicate component; requested_grams > 0"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_INVALID_RATIO | ERR_DUPLICATE_COMPONENT | ERR_VALIDATION"
    http_status: 409
    applies_to: "pack, produce, blend-components, lines"

  - priority: 10
    category: business_fiscal
    check: "provisional_total_cents <= account.available_credit_cents at CONFIRM"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{id}/confirm"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Product ---
  - method: POST
    path: "/products"
    description: "Create a catalog product (SIMPLE or BLEND)"
    roles: [CatalogManager, PlatformAdmin]
    code: 201
    input: [name, category, kind, unit_price_cents_per_gram, tare_default_grams, "allergen_tags?", "shelf_life_days?"]
    output: Product
    side_effects: ["status=ACTIVE, stock_state=OUT_OF_STOCK (no lots yet)"]

  - method: GET
    path: "/products/{id}"
    description: "Fetch one product"
    roles: [CatalogManager, ProductionOperator, SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products with optional filters"
    roles: [CatalogManager, ProductionOperator, SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: ["status?", "category?", "kind?"]
    output: Product[]
    side_effects: []

  - method: POST
    path: "/products/{id}/discontinue"
    description: "Discontinue a product (ACTIVE -> DISCONTINUED)"
    roles: [CatalogManager, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: ["status -> DISCONTINUED"]

  # --- BlendComponent ---
  - method: POST
    path: "/blend-components"
    description: "Attach a SIMPLE component to a BLEND product with a weight ratio"
    roles: [CatalogManager, PlatformAdmin]
    code: 201
    input: [blend_product_id, component_product_id, weight_ratio_bps]
    output: BlendComponent
    side_effects: ["Rejected if component already attached (ERR_DUPLICATE_COMPONENT)"]

  - method: GET
    path: "/blend-components/{id}"
    description: "Fetch one blend component"
    roles: [CatalogManager, ProductionOperator, SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: BlendComponent
    side_effects: []

  - method: GET
    path: "/blend-components"
    description: "List blend components by blend or by component product"
    roles: [CatalogManager, ProductionOperator, SalesAgent, PlatformAdmin]
    code: 200
    input: ["blend_product_id?", "component_product_id?"]
    output: BlendComponent[]
    side_effects: []

  # --- InventoryLot ---
  - method: POST
    path: "/inventory-lots"
    description: "Receive a lot of a product into inventory"
    roles: [CatalogManager, PlatformAdmin]
    code: 201
    input: [product_id, lot_code, grams_received, received_at, best_by]
    output: InventoryLot
    side_effects: ["grams_on_hand = grams_received; status = AVAILABLE (or EXPIRED if best_by <= clock); Product.stock_state recomputed"]

  - method: GET
    path: "/inventory-lots/{id}"
    description: "Fetch one lot (status reflects current clock)"
    roles: [CatalogManager, ProductionOperator, SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
    description: "List lots by product, by producing batch, or by status"
    roles: [CatalogManager, ProductionOperator, SalesAgent, PlatformAdmin]
    code: 200
    input: ["product_id?", "source_batch_id?", "status?"]
    output: InventoryLot[]
    side_effects: []

  # --- ProductionLine ---
  - method: POST
    path: "/production-lines"
    description: "Create a production line resource"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [name]
    output: ProductionLine
    side_effects: []

  - method: GET
    path: "/production-lines/{id}"
    description: "Fetch one production line"
    roles: [ProductionOperator, CatalogManager, SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  # --- Batch ---
  - method: POST
    path: "/batches"
    description: "Schedule a blend production batch on a line window (checks window validity and line overlap)"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [blend_product_id, production_line_id, target_output_grams, scheduled_start, scheduled_end]
    output: Batch
    side_effects: ["status=PLANNED; rejected on ERR_WINDOW_INVALID or ERR_LINE_WINDOW_CONFLICT"]

  - method: GET
    path: "/batches/{id}"
    description: "Fetch one batch"
    roles: [ProductionOperator, CatalogManager, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List batches by blend product, production line, or status"
    roles: [ProductionOperator, CatalogManager, PlatformAdmin]
    code: 200
    input: ["blend_product_id?", "production_line_id?", "status?"]
    output: Batch[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/produce"
    description: "Produce the batch: draw component grams FEFO and mint the blend output lot"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "batch_component_draw across component lots (FEFO)"
      - "component lots decremented; depletions cascade lot status and Product.stock_state"
      - "mint output InventoryLot for the blend; produced_grams set; status -> PRODUCED"

  # --- LabelingStation ---
  - method: POST
    path: "/labeling-stations"
    description: "Create a gift-tin labeling/packing station"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [name]
    output: LabelingStation
    side_effects: []

  - method: GET
    path: "/labeling-stations/{id}"
    description: "Fetch one labeling station"
    roles: [ProductionOperator, CatalogManager, PlatformAdmin]
    code: 200
    input: []
    output: LabelingStation
    side_effects: []

  # --- TinRun ---
  - method: POST
    path: "/tin-runs"
    description: "Schedule a gift-tin packing run on a station window (enforces cleaning-buffer gap between runs)"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [labeling_station_id, product_ids, scheduled_start, scheduled_end]
    output: TinRun
    side_effects: ["allergen_set computed; rejected on ERR_WINDOW_INVALID or ERR_STATION_BUFFER_CONFLICT"]

  - method: GET
    path: "/tin-runs/{id}"
    description: "Fetch one tin run"
    roles: [ProductionOperator, CatalogManager, PlatformAdmin]
    code: 200
    input: []
    output: TinRun
    side_effects: []

  - method: GET
    path: "/tin-runs"
    description: "List tin runs by station"
    roles: [ProductionOperator, CatalogManager, PlatformAdmin]
    code: 200
    input: ["labeling_station_id?"]
    output: TinRun[]
    side_effects: []

  # --- WholesaleAccount ---
  - method: POST
    path: "/wholesale-accounts"
    description: "Open a wholesale account"
    roles: [SalesAgent, PlatformAdmin]
    code: 201
    input: [business_name, credit_limit_cents, "tier?"]
    output: WholesaleAccount
    side_effects: ["status=ACTIVE; exposures 0; available_credit_cents = credit_limit_cents"]

  - method: GET
    path: "/wholesale-accounts/{id}"
    description: "Fetch one account with live exposure/credit fields"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: []

  - method: GET
    path: "/wholesale-accounts"
    description: "List accounts by status or tier"
    roles: [SalesAgent, PlatformAdmin]
    code: 200
    input: ["status?", "tier?"]
    output: WholesaleAccount[]
    side_effects: []

  - method: POST
    path: "/wholesale-accounts/{id}/suspend"
    description: "Suspend an account (ACTIVE -> SUSPENDED)"
    roles: [SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/wholesale-accounts/{id}/reinstate"
    description: "Reinstate an account (SUSPENDED -> ACTIVE)"
    roles: [SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["status -> ACTIVE"]

  # --- CustomerOrder ---
  - method: POST
    path: "/orders"
    description: "Open a DRAFT order for a wholesale account"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 201
    input: [wholesale_account_id, "allergen_ack?"]
    output: CustomerOrder
    side_effects: ["fulfillment_status=DRAFT; held_exposure_cents=0"]

  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order"
    roles: [SalesAgent, Wholesaler, ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders by account or fulfillment status"
    roles: [SalesAgent, Wholesaler, ProductionOperator, PlatformAdmin]
    code: 200
    input: ["wholesale_account_id?", "fulfillment_status?"]
    output: CustomerOrder[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a bulk line to a DRAFT order"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 201
    input: [product_id, requested_grams]
    output: OrderLine
    side_effects: ["Order must be DRAFT; product must exist"]

  - method: POST
    path: "/orders/{id}/price"
    description: "Price a DRAFT order (DRAFT -> PRICED); stamps provisional line and order totals"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["provisional_line_cents, total_net_grams, provisional_total_cents stamped"]

  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm a PRICED order (PRICED -> CONFIRMED) with OCC on the account and credit gate"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: [expected_wholesale_account_version]
    output: CustomerOrder
    side_effects:
      - "held_exposure_cents = provisional_total_cents"
      - "account.committed_exposure_cents += held_exposure_cents"
      - "increments WholesaleAccount.version by 1"

  - method: POST
    path: "/orders/{id}/pack"
    description: "Pack a CONFIRMED order (CONFIRMED -> PACKED): weigh lines, FEFO-allocate, stamp final totals"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: [line_measurements]
    output: CustomerOrder
    side_effects:
      - "per-line gross/tare/net + final_line_cents stamped; final_total_cents stamped"
      - "FEFO allocation decrements lots; depletions cascade lot status and Product.stock_state"
      - "held_exposure_cents = final_total_cents; committed_exposure adjusts by (final - provisional)"

  - method: POST
    path: "/orders/{id}/ship"
    description: "Ship a PACKED order (PACKED -> SHIPPED)"
    roles: [SalesAgent, PlatformAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["allocations become permanent"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order (from DRAFT/PRICED/CONFIRMED/PACKED); compensates credit hold and allocations"
    roles: [SalesAgent, Wholesaler, PlatformAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "if was PACKED: restore net_grams to each allocated lot; DEPLETED lots -> AVAILABLE; Product.stock_state -> IN_STOCK"
      - "if was CONFIRMED/PACKED: release credit hold (committed_exposure -= held_exposure_cents; held=0)"

  # --- OrderLine reads ---
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch one order line"
    roles: [SalesAgent, Wholesaler, ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines by order, product, or allocated lot"
    roles: [SalesAgent, Wholesaler, ProductionOperator, PlatformAdmin]
    code: 200
    input: ["order_id?", "product_id?", "allocated_lot_id?"]
    output: OrderLine[]
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; lot freshness_status recomputed on subsequent reads"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or Wholesaler acting on an account it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, non-positive grams, bad enum" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "inventory lot id does not resolve" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "batch id does not resolve" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "order line id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not resolve" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "wholesale account id does not resolve" }
  - { id: ERR_LINE_RESOURCE_NOT_FOUND, http: 404, condition: "production line id does not resolve" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "labeling station id does not resolve" }
  - { id: ERR_TIN_RUN_NOT_FOUND, http: 404, condition: "tin run id does not resolve" }
  - { id: ERR_COMPONENT_NOT_FOUND, http: 404, condition: "blend component id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_wholesale_account_version does not match account.version at confirm" }
  - { id: ERR_ALLERGEN_LABEL_REQUIRED, http: 409, condition: "Packing an order whose lines carry allergens without allergen_ack == true" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "FEFO-selected lot is EXPIRED (clock >= best_by) at pack" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Batch window overlaps another batch on the same production line (half-open; adjacency allowed)" }
  - { id: ERR_STATION_BUFFER_CONFLICT, http: 409, condition: "Tin run scheduled within the cleaning buffer (30 min) of another run on the same station" }
  - { id: ERR_WINDOW_INVALID, http: 409, condition: "scheduled_start >= scheduled_end" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Pricing an order that references a DISCONTINUED product" }
  - { id: ERR_PRODUCT_NOT_BLEND, http: 422, condition: "Producing a batch whose blend_product_id is not kind == BLEND" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Confirming an order against a SUSPENDED account" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "No single AVAILABLE lot (pack) or insufficient aggregate component grams (produce) to satisfy the requirement" }
  - { id: ERR_INVALID_RATIO, http: 422, condition: "A blend's component ratios do not sum to 10000 bps at produce time" }
  - { id: ERR_DUPLICATE_COMPONENT, http: 409, condition: "component_product_id already attached to this blend" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "provisional_total_cents exceeds account.available_credit_cents at confirm" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superset; owns the logical clock and can perform any operation (hierarchical override)."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every business endpoint (override of the peer roles below)"

  - name: CatalogManager
    description: "Owns the catalog: products, blend composition, and inventory receipts."
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/discontinue"
      - "POST /blend-components"
      - "POST /inventory-lots"
    shared_operations:
      - "GET reads on catalog, lots, batches, lines, tin runs"

  - name: ProductionOperator
    description: "Owns production and packing: batches, production lines, labeling stations, tin runs, and order packing."
    identity: opaque
    exclusive_operations:
      - "POST /production-lines"
      - "POST /batches"
      - "POST /batches/{id}/produce"
      - "POST /labeling-stations"
      - "POST /tin-runs"
      - "POST /orders/{id}/pack"
    shared_operations:
      - "GET reads on products, lots, batches, orders, lines"

  - name: SalesAgent
    description: "Owns wholesale accounts and the order lifecycle (except packing)."
    identity: opaque
    exclusive_operations:
      - "POST /wholesale-accounts"
      - "POST /wholesale-accounts/{id}/suspend"
      - "POST /wholesale-accounts/{id}/reinstate"
      - "POST /orders/{id}/ship"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, price, confirm, cancel (shared with Wholesaler)"

  - name: Wholesaler
    description: "The wholesale customer acting as its own account; may open/price/confirm/cancel its own orders and read its own data."
    identity: "entity_backed:WholesaleAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, price, confirm, cancel — restricted to orders whose wholesale_account_id == X-User-ID"
      - "GET reads on own account, orders, lines, products"
