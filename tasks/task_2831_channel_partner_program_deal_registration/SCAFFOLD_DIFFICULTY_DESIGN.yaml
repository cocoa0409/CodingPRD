              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pc_id}", account_id: "${acc_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 800000, expected_close_date: "2026-09-30T00:00:00.000Z" }
              as: Partner
              as_user_id: "${pc_id}"
              captures: { regc_id: $.data.id }
            - call: "POST /deal-registrations/${regc_id}/submit"
              payload: {}
              as: Partner
