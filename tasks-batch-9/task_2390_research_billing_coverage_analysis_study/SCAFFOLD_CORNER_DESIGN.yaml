              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
            - call: "POST /research-billing/audit-findings"
              payload: { study_id: "${study_id}", finding_type: "MISSING_REGISTRY_NUMBER", claimed_amount_cents: 0 }
              as: AuditLiaison
              as_user_id: "auditor_1"
