            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 19000000, purpose: "SEED" }, as: LoanOfficer, captures: { drw_eq: $.data.id } }
            - { call: "POST /draw-requests/${drw_eq}/approve", as: LoanOfficer, captures: { st: $.data.status } }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { pend: $.data.pending_draw_cents } }
          assert:
            - "19,000,001 approve: error_id == ERR_DRAW_EXCEEDS_AVAILABILITY; draw stays REQUESTED"
            - "19,000,000 approve: status == APPROVED (${st})"
            - "pending_draw_cents == 19000000 (${pend}) — the failed approval reserved nothing"

      - name: covenant_ratio_exact_threshold_compliant_one_cent_liabilities_breach
        grounds:
          - calculations.working_capital_covenant
          - entities.CovenantEvaluation.fields.outcome
        distinguishing_aspect: |
          Ratio boundary on the covenant-record endpoint: at commitment
          50,000,000 (tier 1250 milli) assets 125,000 vs liabilities 100,000
          cross-multiplies to equality -> COMPLIANT, while liabilities 100,001
          (one cent more) flips to BREACH — exact integer comparison, no ratio
          rounding.
        test_recipe:
          setup:
            - "ACTIVE loan commitment 50,000,000 (required_ratio_milli 1250)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
          trigger:
            - { call: "POST /covenant-evaluations", payload: { loan_account_id: "${loan}", as_of_date: "2026-03-15T00:00:00Z", current_assets_cents: 125000, current_liabilities_cents: 100000 }, as: LoanOfficer, as_user_id: "officer-1", captures: { ev1: $.data.id, out1: $.data.outcome, rat1: $.data.current_ratio_milli } }
            - { call: "POST /covenant-evaluations", payload: { loan_account_id: "${loan}", as_of_date: "2026-03-16T00:00:00Z", current_assets_cents: 125000, current_liabilities_cents: 100001 }, as: LoanOfficer, as_user_id: "officer-1", captures: { ev2: $.data.id, out2: $.data.outcome, rat2: $.data.current_ratio_milli } }
            - { call: "GET /borrowers/${bor}", as: LoanOfficer, captures: { cnt: $.data.active_covenant_breach_count } }
          assert:
            - "eval1: outcome == COMPLIANT (${out1}), current_ratio_milli == 1250 (${rat1}), working_capital_cents == 25000"
            - "eval2: outcome == BREACH (${out2}) — 125,000 x 1000 = 125,000,000 < 1250 x 100,001 = 125,001,250; display ratio floors to 1249 (${rat2})"
            - "borrower active_covenant_breach_count == 1 (${cnt}) after exactly one RECORDED breach"

      - name: coverage_exactly_ten_percent_current_one_cent_less_watch
        grounds:
          - calculations.coverage_band_posture
          - entities.LoanAccount.fields.payment_posture
        distinguishing_aspect: |
          Coverage-ratio boundary observed via the disburse endpoint: coverage
          exactly one tenth of the 50,000,000 commitment (5,000,000) keeps
          CURRENT (>= semantics); one cent more drawn (coverage 4,999,999)
          flips to WATCH.
        test_recipe:
          setup:
            - "ACTIVE loan commitment 50,000,000, borrowing base 50,000,000 (capped)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
