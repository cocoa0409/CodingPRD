            - call: "POST /loyalty/elite-benefit-deliveries/${dC_up}/deny"
              payload: { denial_reason: "Still no suites." }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_capped: $.data.error_id }
            - call: "POST /loyalty/elite-benefit-deliveries/${dC_up}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dC_up_status: $.data.status, dC_up_recovery: $.data.cost_recovery_cents }
          assert:
            - "${s_long_nights} == 50 and ${m_tier_after} == BASE - the qualifying stay is read at its own check-in, and only afterwards is the member PLATINUM"
            - "${d1_status} == ${d2_status} == ${d3_status} == DENIED and ${h_denials} == 3"
            - "${e_capped} == ERR_BENEFIT_DENIAL_LIMIT_EXCEEDED with http 409 - the counter is per property and already at its 3-denial ceiling"
            - "${dC_up_status} == DELIVERED and ${dC_up_recovery} == 4500 - min(round_half_up(30000 * 0.15), 9000); the cap on denials never blocks delivery"
            - "GET /loyalty/hotels/${h_id} still reports benefit_denial_count == 3 after the delivery, and GET /loyalty/elite-benefit-deliveries?status=OBLIGATED returns total_count == 2 (${dC_bf} and stay C's late checkout)"

      - name: adjudication_is_refused_once_the_stay_void_waived_the_escalated_denial
        claim_type: cascading_validation
        grounds:
          - validations.priority_53_ERR_DELIVERY_NOT_ESCALATED
          - state_machines.EliteBenefitDelivery
          - state_machines.MemberComplaint
        distinguishing_aspect: |
          The precondition for adjudication lives two entities away: the complaint itself is
          legitimately ESCALATED, but the delivery it argues about was dragged to WAIVED by hop 5 of
          its own stay's void cascade, so the adjudication has no live obligation left to rule on.
          The complaint stays ESCALATED rather than closing, which is what makes the refusal visible.
        test_recipe:
          setup:
            - "One ACTIVE property; one member lifted to SILVER by a 10-night stay, then a second posted stay whose UPGRADE obligation is denied, complained about, upheld and escalated."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Waiverline Inn", brand_code: "WVI", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 80, trailing_12m_occupancy_pct: 0.72, trailing_12m_adr_cents: 16000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "wv1@example.com", full_name: "Rosalind Kerr", enrollment_date: "2026-01-04" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-01", checkout_date: "2026-05-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { sA_id: $.data.id }
            - call: "POST /loyalty/stays/${sA_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-03", room_revenue_cents: 30000 }
              as: ProgramAdministrator
              captures: { sB_id: $.data.id }
            - call: "POST /loyalty/stays/${sB_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}" }
              as: ProgramAdministrator
              captures: { d_id: "$.data[0].id", d_type: "$.data[0].benefit_type" }
            - call: "POST /loyalty/elite-benefit-deliveries/${d_id}/deny"
              payload: { denial_reason: "Hotel sold out of upgrade rooms." }
              as: HotelOwner
              as_user_id: "${h_id}"
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "BENEFIT_DENIAL", description: "My SILVER upgrade was refused on arrival.", related_delivery_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /loyalty/member-complaints/${c_id}/review"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-wv-01"
            - call: "POST /loyalty/member-complaints/${c_id}/resolve"
              payload: { resolution: "Denial upheld: the property was sold out." }
              as: MemberCareAgent
              as_user_id: "care-wv-01"
              captures: { c_resolved: $.data.status }
            - call: "POST /loyalty/member-complaints/${c_id}/escalate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { c_escalated: $.data.status }
            - call: "GET /loyalty/elite-benefit-deliveries/${d_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { d_escalated: $.data.status }
          trigger:
            - call: "POST /loyalty/stays/${sB_id}/void"
              payload: { void_reason: "Folio rebilled to a corporate master account." }
              as: ProgramAdministrator
              captures: { sB_status: $.data.status }
            - call: "GET /loyalty/elite-benefit-deliveries/${d_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { d_after_void: $.data.status }
            - call: "POST /loyalty/member-complaints/${c_id}/adjudicate"
              payload: { adjudication_outcome: "DELIVERY_ORDERED" }
              as: ProgramAdministrator
              captures: { e_not_escalated: $.data.error_id }
          assert:
            - "${d_type} == UPGRADE - a SILVER stay obligates the upgrade only, per the entitlement matrix"
            - "${c_resolved} == RESOLVED_UPHELD and ${c_escalated} == ESCALATED and ${d_escalated} == ESCALATED before the void"
            - "${sB_status} == VOID and ${d_after_void} == WAIVED - hop 5 of the void cascade takes ESCALATED rows too, not just OBLIGATED ones"
            - "${e_not_escalated} == ERR_DELIVERY_NOT_ESCALATED with http 409"
            - "MemberComplaint.${c_id}.status is still ESCALATED - the refused adjudication did not close the complaint"
            - "Member.${m_id}.elite_tier is still SILVER and qualifying_nights_ytd == 10 - the void removed stay B's 2 nights only"
            - "Hotel.${h_id}.benefit_denial_count == 0 - the void reversed the denial along with the obligation"

      - name: activation_is_refused_until_the_property_has_a_rate_plan
        claim_type: violation_to_error
        grounds:
          - validations.priority_48_ERR_HOTEL_ONBOARDING_INCOMPLETE
          - validations.priority_40_ERR_HOTEL_NOT_ACTIVE
          - state_machines.Hotel
        distinguishing_aspect: |
          A brand-new property is syntactically complete but commercially empty, so activation is
          refused at priority 48; filing a single rate plan makes exactly the same call succeed, and
          repeating it then answers with the state rule at priority 40 instead - the same endpoint
          walks through two different refusals on either side of one success.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Onboard House", brand_code: "OBH", market_tier: "SELECT", program_fee_pct: 0.04, rooms_count: 40, trailing_12m_occupancy_pct: 0.55, trailing_12m_adr_cents: 11000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_status0: $.data.status, h_v0: $.data.version }
          trigger:
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { e_incomplete: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { h_status1: $.data.status, h_v1: $.data.version }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { e_again: $.data.error_id }
          assert:
            - "${h_status0} == ONBOARDING and ${h_v0} == 1"
            - "${e_incomplete} == ERR_HOTEL_ONBOARDING_INCOMPLETE with http 409, and the hotel is still ONBOARDING at version 1 - a refused activation bumps nothing"
            - "${h_status1} == ACTIVE and ${h_v1} == 2 - filing one rate plan of any category is enough"
            - "${e_again} == ERR_HOTEL_NOT_ACTIVE with http 409 - activation requires ONBOARDING exactly, and priority 40 is reached before 48"
            - "GET /loyalty/hotels/${h_id} reports version 2 - the second refusal left the row alone"

      - name: honoured_delivery_blocks_escalation
        excluded_because:
          difficulty_instance: complaint_escalation_blocked_because_the_related_delivery_was_honoured_meanwhile
          rationale: |
            ERR_DELIVERY_NOT_DENIED at priority 52 is the interleaving that §1.8 already builds in
            full: the complaint is filed while the delivery is DENIED, the property honours it while
            the complaint sits UNDER_REVIEW, and the escalation then finds a DELIVERED row. A corner
            instance would repeat the same call sequence with the same expected error, so the claim
            is left where the depth design already proves it.

  # ===========================================================================
  - section: endpoints
    instances:
      - name: member_resource_supports_create_read_and_filtered_list_and_nothing_else
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/loyalty/members
          - endpoints.GET_/loyalty/members/{memberId}
          - endpoints.GET_/loyalty/members
        distinguishing_aspect: |
          The member surface is deliberately create-read-list: there is no update and no delete verb
          anywhere in §1.5, so every field except email, full_name and enrollment_date can only move
          through a cascade. The list endpoint filters on elite_tier and email and both filters
          narrow the same collection independently.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty/members"
              payload: { email: "crud1@example.com", full_name: "Anya Petrov", enrollment_date: "2026-03-09" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id, m1_email: $.data.email, m1_tier: $.data.elite_tier }
            - call: "POST /loyalty/members"
              payload: { email: "crud2@example.com", full_name: "Tomas Halle" }
              as: MemberCareAgent
              as_user_id: "care-cr-01"
              captures: { m2_id: $.data.id, m2_enrolled: $.data.enrollment_date }
            - call: "GET /loyalty/members/${m1_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { r_id: $.data.id, r_email: $.data.email, r_name: $.data.full_name, r_balance: $.data.point_balance }
            - call: "GET /loyalty/members"
              payload: { email: "crud2@example.com" }
              as: ProgramAuditor
              as_user_id: "aud-cr-01"
              captures: { f1_page: $.data, f1_id: "$.data[0].id" }
            - call: "GET /loyalty/members"
              payload: { elite_tier: "BASE" }
              as: ProgramAuditor
              as_user_id: "aud-cr-01"
              captures: { f2_page: $.data }
            - call: "GET /loyalty/members"
              payload: { elite_tier: "PLATINUM" }
              as: ProgramAuditor
              as_user_id: "aud-cr-01"
              captures: { f3_page: $.data }
          assert:
            - "${m1_email} == crud1@example.com and ${m1_tier} == BASE - the create response is the full row, computed fields included"
            - "${m2_enrolled} == 2026-08-01 - the omitted enrollment_date falls back to the logical clock's date"
            - "${r_id} == ${m1_id} and ${r_email} == crud1@example.com and ${r_name} == Anya Petrov and ${r_balance} == 0 - the read returns what the create stored"
            - "${f1_page}.total_count == 1 and ${f1_id} == ${m2_id} - the email filter is an exact match, not a search"
            - "${f2_page}.total_count == 2 and ${f3_page}.total_count == 0 - both members are BASE, and the unmatched filter yields an empty page rather than a 404"
            - "§1.5 declares no PUT, PATCH or DELETE on /loyalty/members or /loyalty/members/{memberId}"

      - name: action_endpoints_answer_with_their_subject_row_and_hide_their_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/loyalty/stays/{stayId}/post
          - endpoints.POST_/loyalty/point-adjustments
          - endpoints.GET_/loyalty/point-ledger-entries
        distinguishing_aspect: |
          Two action endpoints answer with two different shapes: the stay-posting action returns the
          Stay it acted on even though its visible work is two ledger rows and a fee accrual, while
          the point-adjustment action returns the PointLedgerEntry it created even though the row the
          caller cares about is the Member. In both cases the collateral effects are only reachable
          through a separate read.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan; one member with a settled 20000-point purchase so the fund is not IMPAIRED."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Actionpoint Hotel", brand_code: "APH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 150, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "ap1@example.com", full_name: "Nils Sandvik", enrollment_date: "2026-02-02" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id, s_status0: $.data.status }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
              captures: { s_status1: $.data.status, s_base: $.data.base_points_awarded, s_bonus: $.data.bonus_points_awarded, s_fee: $.data.program_fee_assessed_cents }
            - call: "GET /loyalty/point-ledger-entries"
              payload: { source_stay_id: "${s_id}" }
              as: ProgramAuditor
              as_user_id: "aud-ap-01"
              captures: { led_page: $.data, led_first_type: "$.data[0].entry_type" }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 500, adjustment_reason: "Service recovery for a late room.", expected_member_version: "${m_v}" }
              as: ProgramAdministrator
              captures: { adj_id: $.data.id, adj_type: $.data.entry_type, adj_points: $.data.points, adj_cost: $.data.liability_unit_cost_cents_per_1000 }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_balance: $.data.point_balance, m_v2: $.data.version }
          assert:
            - "${s_status0} == PENDING_POSTING and ${s_status1} == POSTED_QUALIFYING - the action returns the Stay row, not the rows it created"
            - "${s_base} == 10000 and ${s_bonus} == 0 and ${s_fee} == 5000 - floor(100000 * 10 / 100) base points, a BASE multiplier of 0.0 and 5% of qualifying revenue"
            - "${led_page}.total_count == 1 and ${led_first_type} == EARN_BASE - a zero bonus writes no EARN_BONUS row, and the posting response never carried the ledger"
            - "${adj_type} == GOODWILL and ${adj_points} == 500 and ${adj_cost} == 600 - the adjustment endpoint answers with the PointLedgerEntry it minted"
            - "${m_balance} == 30500 (20000 purchased + 10000 earned + 500 goodwill) and ${m_v2} > ${m_v} - the member is what actually moved, and only the follow-up read shows it"

      - name: program_fund_read_is_computed_and_repeating_it_changes_nothing
        claim_type: computed_read
        grounds:
          - endpoints.GET_/loyalty/program-fund
          - endpoints.POST_/loyalty/program-fund/revalue
          - endpoints.POST_/loyalty/program-fund/breakage-rate
          - calculations.point_liability_valuation
        distinguishing_aspect: |
          The singleton fund read is pure: it exists before any write, two consecutive reads agree,
          and its figures move only because the underlying purchases and ledger moved - not because
          anyone asked. The revalue action is the only thing that stamps last_revalued_at, and
          restating breakage is the only thing that changes the assumption behind the liability.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default; one member exists."
          setup_api_calls:
