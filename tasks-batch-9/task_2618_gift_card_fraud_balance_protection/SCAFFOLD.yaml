  # ---- LiabilityPeriod -----------------------------------------------------
  - method: POST
    path: /liability-periods
    purpose: Open a balance-liability accounting period over a half-open date range.
    roles: [LiabilityAccountant]
    input:
      - label
      - period_start
      - period_end
    output: LiabilityPeriod
    side_effects:
      - "rejected with ERR_PERIOD_OVERLAP (p70) when the half-open span collides with any existing period, in any state"
      - "creates the LiabilityPeriod in state OPEN with unauthorized_writeoff_cents 0, restatement_count 0 and every reserve field null"

  - method: GET
    path: /liability-periods
    purpose: List accounting periods.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - state?
      - limit?
      - offset?
    output: LiabilityPeriod[]
    side_effects: []
    notes: "Ordered period_start ASC, created_at ASC."

  - method: GET
    path: /liability-periods/{id}
    purpose: Read one period with both reserve numbers side by side.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: LiabilityPeriod
    side_effects: []

  - method: POST
    path: /liability-periods/{id}/close
    purpose: Close a period, booking the PROVISIONAL unauthorized-redemption reserve on the prudent alert basis.
    roles: [LiabilityAccountant]
    input:
      - close_note?
    output: LiabilityPeriod
    side_effects:
      - "state OPEN -> CLOSED; sets closed_at to the logical now and records close_note"
      - "writes gross_exposure_cents, reserve_basis_alert_count and provisional_reserve_cents per §1.3 unauthorized_redemption_reserve variant provisional (alert states OPEN, TRIAGED and CONFIRMED at the provisional rate)"
      - "writes outstanding_liability_cents as the sum of current_balance_cents over cards whose activation_state is ACTIVE or DEPLETED"
      - "increments LiabilityPeriod.version by 1"

  - method: POST
    path: /liability-periods/{id}/restate
    purpose: Restate a closed period, booking the FINAL reserve on the settled confirmed-only basis, under the OCC rule of §1.2.1 period-restate-stale-period.
    roles: [LiabilityAccountant]
    input:
      - restatement_note
      - expected_liability_period_version
    output: LiabilityPeriod
    side_effects:
      - "rejects with ERR_STALE_PERIOD_VERSION (412) when expected_liability_period_version != LiabilityPeriod.version"
      - "state CLOSED -> RESTATED, or RESTATED -> RESTATED on the self-loop; sets restated_at and increments restatement_count by 1"
      - "OVERWRITES gross_exposure_cents, reserve_basis_alert_count and outstanding_liability_cents and writes final_reserve_cents per §1.3 unauthorized_redemption_reserve variant final (CONFIRMED alerts only, at the final rate)"
      - "NEVER overwrites provisional_reserve_cents, so both bases stay readable"
      - "increments LiabilityPeriod.version by 1"

  - method: GET
    path: /liability-periods/{id}/exposure-summary
    purpose: Computed read exposing the conserved net funded liability of §1.3 net_funded_liability_invariant alongside the period's stored reserve numbers.
    roles: [RiskManager, LiabilityAccountant, PlatformAdmin]
    input: []
    output:
      net_funded_liability_cents: integer
      funded_card_count: integer
      unauthorized_writeoff_cents: integer
      outstanding_liability_cents: integer
      gross_exposure_cents: integer
      provisional_reserve_cents: integer
      final_reserve_cents: integer
      in_period_alert_count: integer
      confirmed_alert_count: integer
    side_effects: []
    notes: |
      Pure read — computes net_funded_liability_cents live from the current card
      population and this period's unauthorized_writeoff_cents. It stores
      nothing and bumps no version.

