scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: paycheck_fed_withholding_provisional_vs_reconciled
        grounds:
          - calculations.federal_withholding_provisional
          - state_machines.PaycheckRun.APPROVED_to_PAID
          - endpoints.POST_/paycheck-runs/{id}/pay
          - entities.Paycheck.fields.fed_withheld_cents
        distinguishing_aspect: |
          On a FRESH employee (ytd_wages_cents == 0) with a single REGULAR paycheck of gross 200000c
          and W-4 filed SINGLE with no extras, the provisional variant (per-paycheck percentage-method
          annualization) produces Paycheck.fed_withheld_cents == 16357 while the reconciled variant
          (full-year true-up against actual YTD) produces Paycheck.fed_withheld_cents == 0 — the same
          inputs land on a 16357c difference depending solely on the is_year_end_run flag, and the
          calculation operates on the Paycheck entity domain.
        test_recipe:
          setup:
            - "Federal tax-rate table for 2025 SINGLE seeded (10/12/22 bracket schedule, supplemental 2200 bp)"
            - "CA state-tax table for 2025 seeded (1%/2% brackets)"
            - "Employee (CA work + residence) ACTIVE, ytd_wages=0, ytd_fed_withheld=0, ytd_ss=0, ytd_medicare=0"
            - "W4Form FILED for tax_year=2025, SINGLE, no extras"
            - "PaycheckRun DRAFT (Dec 15-31, 2025) prepared by user U_PREP"
            - "One Paycheck PENDING attached: REGULAR, 40 regular hours @ $50/hr = gross 200000c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Alice DV1", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-12-15T00:00:00.000Z", pay_period_end: "2025-12-31T23:59:59.999Z", pay_date: "2025-12-31T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          trigger:
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: { is_year_end_run: true }
              as: PayrollApprover
              as_user_id: "U_APPR"
          assert:
            - "Paycheck.${pay_id}.fed_withheld_cents == 0"
            - "Paycheck.${pay_id}.gross_wages_cents == 200000"
            - "Paycheck.${pay_id}.status == PAID"
            - "PaycheckRun.${run_id}.status == PAID"

      - name: remittance_accrual_provisional_vs_reconciled
        grounds:
          - calculations.remittance_accrual
          - state_machines.Remittance.ACCRUING_to_RECONCILED
          - endpoints.POST_/remittances/{id}/close-period
          - entities.Remittance.fields.accrued_cents
          - entities.Remittance.fields.reconciled_cents
        distinguishing_aspect: |
          On a Remittance row for (period_month=2025-12, jurisdiction=FEDERAL, tax_type=FED_INCOME)
          created by paying a PaycheckRun with a single $2000 REGULAR paycheck (provisional fed=16357c,
          NOT year-end), the provisional incremental accumulator yields accrued_cents == 16357 immediately
          after PAID, and the reconciled full-rescan at close-period yields reconciled_cents == 16357,
          while accrued_cents remains 16357 — the two variants execute different algorithms (incremental
          delta vs full rescan over PAID Paychecks) on the Remittance entity domain (distinct from the
          Paycheck domain used in instance 1).
        test_recipe:
          setup:
            - "Same tax-rate tables and Employee setup as instance 1 (federal + CA seeded)"
            - "One PAID PaycheckRun in 2025-12 with one Paycheck (REGULAR $2000, NOT year-end)"
            - "Remittance row exists for (2025-12, FEDERAL, FED_INCOME) with accrued_cents=16357 (provisional value)"
            - "Remittance.status == ACCRUING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Bob DV2", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-12-15T00:00:00.000Z", pay_period_end: "2025-12-31T23:59:59.999Z", pay_date: "2025-12-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "GET /remittances"
              payload: { period_month: "2025-12", jurisdiction: "FEDERAL", tax_type: "FED_INCOME" }
              as: ComplianceOfficer
              captures: { rem_id: "$.data[0].id" }
          trigger:
            - call: "POST /remittances/${rem_id}/close-period"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Remittance.${rem_id}.status == RECONCILED"
            - "Remittance.${rem_id}.accrued_cents == 16357"
            - "Remittance.${rem_id}.reconciled_cents == 16357"

  # =====================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes from a/b/c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: federal_overtime_supplemental_branch_mode_a
        grounds:
          - calculations.federal_withholding_provisional
          - entities.Paycheck.fields.pay_type
          - entities.W4Form.fields.extra_withholding_cents
          - endpoints.POST_/paychecks
        distinguishing_aspect: |
          Mode (a): the federal_withholding_provisional formula has ≥3 inputs
          (gross_wages_cents, pay_type, W4.extra_withholding_cents, W4.filing_status, supplemental_flat_basis_points)
          with a non-linear conditional branch on pay_type — when pay_type IN {OVERTIME, DOUBLE, RETRO},
          the percentage-method branch (steps 2–6) is SKIPPED in favor of the flat supplemental
          path (step 8), so the same gross can yield different fed_withheld depending on pay_type.
          Concretely: OVERTIME gross 150000c with W4.extra_withholding_cents=500 yields
          fed_withheld_cents == 33500 (= 150000 * 2200//10000 + 500), distinct from what a REGULAR
          200000c paycheck yields under the percentage-method branch (16357).
        test_recipe:
          setup:
            - "Federal tax-rate table 2025 SINGLE seeded (10/12/22 brackets, supplemental_flat_basis_points=2200)"
            - "CA state-tax table seeded (supplemental_flat_basis_points=1100)"
            - "Employee CA ACTIVE, ytd zeroed"
            - "W4Form FILED, SINGLE, extra_withholding_cents=500"
            - "PaycheckRun DRAFT (Nov 1-15, 2025)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Carol OT", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE", extra_withholding_cents: 500 }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "OVERTIME", overtime_hours_e2: 4000, hourly_rate_cents: 2500 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
          assert:
            - "Paycheck.${pay_id}.gross_wages_cents == 150000"
            - "Paycheck.${pay_id}.fed_withheld_cents == 33500"
            - "Paycheck.${pay_id}.state_withheld_cents == 1650"
            - "Paycheck.${pay_id}.status == PENDING"

      - name: garnishment_waterfall_eval_order_mode_c
        grounds:
          - calculations.garnishment_waterfall
          - entities.GarnishmentOrder.fields.priority_rank
          - entities.GarnishmentOrder.fields.served_on
          - entities.GarnishmentDeduction
          - endpoints.POST_/paychecks
        distinguishing_aspect: |
          Mode (c): the garnishment_waterfall formula has a circular-looking dependency
          chain that requires explicit evaluation order — (1) compute fed/state/local/ss/medicare/addl
          withholdings, (2) compute disposable_earnings = gross - sum(withholdings),
          (3) compute paycheck_cap = disposable * CCPA_basis_points / 10000 (CCPA basis depends on
          whether any CHILD_SUPPORT order is ACTIVE, an entity-state-conditional input), (4) iterate
          orders by (priority_rank ASC, served_on ASC, created_at ASC), (5) per-order = min(weekly_cap,
          balance_remaining, remaining_cap). Reordering steps yields different deductions. Concretely:
          two CHILD_SUPPORT orders for the same employee — A served 2025-06-01 weekly_cap 30000c
          balance 100000c, B served 2025-07-01 weekly_cap 50000c balance 100000c — and a $2000
          REGULAR paycheck yield deduction_A == 30000c and deduction_B == 50000c (NOT the other
          way around) because tie-break within priority_rank=1 is served_on ASC.
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "Two ACTIVE CHILD_SUPPORT GarnishmentOrders: A served 2025-06-01, B served 2025-07-01"
            - "PaycheckRun DRAFT (Nov 1-15, 2025)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Dan GW", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 30000, original_balance_cents: 100000, served_on: "2025-06-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_a: $.data.id }
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 50000, original_balance_cents: 100000, served_on: "2025-07-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_b: $.data.id }
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
          assert:
            - "Paycheck.${pay_id}.gross_wages_cents == 200000"
            - "Paycheck.${pay_id}.fed_withheld_cents == 16357"
            - "Paycheck.${pay_id}.state_withheld_cents == 2000"
            - "Paycheck.${pay_id}.ss_withheld_cents == 12400"
            - "Paycheck.${pay_id}.medicare_withheld_cents == 2900"
            - "Paycheck.${pay_id}.garnishment_total_cents == 80000"
            - "Paycheck.${pay_id}.net_pay_cents == 86343"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (≥ 2, different entities, non-linear shape)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: paycheckrun_branching_revert_approved_to_draft
        grounds:
          - state_machines.PaycheckRun.APPROVED_to_DRAFT
          - state_machines.PaycheckRun.APPROVED_to_PAID
          - endpoints.POST_/paycheck-runs/{id}/reject
          - endpoints.POST_/paycheck-runs/{id}/approve
        distinguishing_aspect: |
          PaycheckRun exhibits branching-with-revert non-linearity: from APPROVED it can either
          advance to PAID (terminal flow) or revert to DRAFT via /reject. The reject transition
          clears approved_by_user_id back to null and allows another preparer iteration. This is
          the non-linear shape — multiple outbound transitions from a non-initial, non-terminal
          state with divergent side-effect sets (PAID cascades vs DRAFT reset).
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "PaycheckRun APPROVED with 1 Paycheck PENDING; approved_by_user_id == U_APPR"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Eve PR", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          trigger:
            - call: "POST /paycheck-runs/${run_id}/reject"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          assert:
            - "PaycheckRun.${run_id}.status == DRAFT"
            - "PaycheckRun.${run_id}.approved_by_user_id == null"
            - "Paycheck.${pay_id}.status == PENDING"

      - name: garnishment_order_cyclic_active_suspended_active
        grounds:
          - state_machines.GarnishmentOrder.ACTIVE_to_SUSPENDED
          - state_machines.GarnishmentOrder.SUSPENDED_to_ACTIVE
          - endpoints.POST_/garnishment-orders/{id}/suspend
          - endpoints.POST_/garnishment-orders/{id}/reactivate
        distinguishing_aspect: |
          GarnishmentOrder exhibits cyclic non-linearity: ACTIVE -> SUSPENDED -> ACTIVE is a
          deliberate revisit cycle, plus the system-driven ACTIVE -> SATISFIED -> ACTIVE cycle
          on void-reversal. The entity is GarnishmentOrder (distinct from PaycheckRun in instance 1),
          and the cycle has visible state-flip side effects (skipped in garnishment_waterfall while
          SUSPENDED, included again after reactivate).
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "One ACTIVE CHILD_SUPPORT GarnishmentOrder for the employee"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Frank GC", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 30000, original_balance_cents: 100000, served_on: "2025-06-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_id: $.data.id }
            - call: "POST /garnishment-orders/${g_id}/suspend"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /garnishment-orders/${g_id}/reactivate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "GarnishmentOrder.${g_id}.status == ACTIVE"

  # =====================================================================
  # Rule 4 — transitive_cascade (≥ 2, one depth ≥3, one depth ≥2, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: paycheck_run_pay_cascade_depth_4
        grounds:
          - state_machines.PaycheckRun.APPROVED_to_PAID
          - state_machines.Paycheck.PENDING_to_PAID
          - state_machines.GarnishmentOrder.ACTIVE_to_SATISFIED
          - state_machines.Remittance.ACCRUING_to_RECONCILED
          - entities.Employee.fields.ytd_wages_cents
          - entities.Remittance.fields.accrued_cents
        distinguishing_aspect: |
          A single POST /paycheck-runs/{id}/pay (trigger A1) triggers a chain of depth 4:
          (hop 1) PaycheckRun.status: APPROVED -> PAID -> (hop 2) Paycheck.status: PENDING -> PAID
          (caused by hop 1) -> (hop 3) GarnishmentOrder.balance_remaining_cents decremented; reaches
          0 -> status ACTIVE -> SATISFIED (caused by hop 2 on Paycheck) -> (hop 4) Remittance row
          is created (or updated) with accrued_cents += tax-bucket value (caused by hop 2 on Paycheck).
          Each link is caused by the previous one, not by the original /pay call directly.
          Trigger: POST /paycheck-runs/{id}/pay.
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "One ACTIVE CHILD_SUPPORT GarnishmentOrder with original_balance_cents == 30000 (will be fully satisfied by one $300 deduction)"
            - "PaycheckRun APPROVED with one $2000 REGULAR Paycheck PENDING"
            - "No Remittance rows yet for 2025-11"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Gina TC", work_state_code: "CA", residence_state_code: "CA", locality_code: "NONE" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 30000, original_balance_cents: 30000, served_on: "2025-06-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_id: $.data.id }
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          trigger:
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          assert:
            - "PaycheckRun.${run_id}.status == PAID"
            - "Paycheck.${pay_id}.status == PAID"
            - "GarnishmentOrder.${g_id}.balance_remaining_cents == 0"
            - "GarnishmentOrder.${g_id}.status == SATISFIED"
            - "Employee.${emp_id}.ytd_wages_cents == 200000"
            - "Employee.${emp_id}.ytd_fed_withheld_cents == 16357"

      - name: w4_file_supersede_cascade_depth_2
        grounds:
          - state_machines.W4Form.DRAFT_to_FILED
          - state_machines.W4Form.FILED_to_SUPERSEDED
          - endpoints.POST_/w4-forms/{id}/file
        distinguishing_aspect: |
          A POST /w4-forms/{id}/file (trigger B1, distinct from trigger A1 in the depth-4 cascade)
          drives a depth-2 cascade: (hop 1) the new W4Form.status: DRAFT -> FILED -> (hop 2) the
          prior W4Form (named by supersedes_w4_id) transitions FILED -> SUPERSEDED, caused by
          the hop 1 transition (system trigger from the §1.2 W4Form FILED_to_SUPERSEDED row).
          Two cascades, different originating triggers, depths 4 and 2 respectively.
        test_recipe:
          setup:
            - "Employee ACTIVE"
            - "Prior W4Form FILED for tax_year=2025, SINGLE"
            - "Second W4Form DRAFT for tax_year=2025, MARRIED_JOINT, supersedes_w4_id pointing to prior"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00.000Z" }
