        claim_type: peer_roles
        grounds:
          - roles.LivestockKeeper
          - roles.StoreClerk
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "run-shipment is exclusive to StoreClerk; a LivestockKeeper attempt → 403 ERR_INSUFFICIENT_PERMISSIONS (checked before OCC/state)."
        test_recipe:
