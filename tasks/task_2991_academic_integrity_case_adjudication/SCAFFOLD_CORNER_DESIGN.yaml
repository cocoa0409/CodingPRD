      - name: action_endpoints_return_the_entity_they_create_not_the_entity_in_their_path
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /integrity/cases/{id}/notifications]
          - endpoints[POST /integrity/cases/{id}/informal-resolution]
          - endpoints[POST /integrity/cases/{id}/informal-response]
          - endpoints[POST /integrity/faculty-members/{id}/training-completions]
