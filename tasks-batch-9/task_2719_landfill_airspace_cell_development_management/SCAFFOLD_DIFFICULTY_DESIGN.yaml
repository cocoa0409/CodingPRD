          Two 409 rules fire on the same POST /waste-loads: the referenced
          SpecialWasteApproval belongs to a different landfill (priority 7) and the day's cell
          is only READY_FOR_WASTE rather than ACTIVE (priority 10). Because both share HTTP
          409, an implementation that checks gating states before referential integrity is
          indistinguishable except by error_id. Two controls separate the rules: same-site
