scaffold_corner_design:
  - section: state_machines
    instances:
      - name: design_approve_from_uploaded_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Design.UPLOADED_to_APPROVED"
        distinguishing_aspect: "Design in UPLOADED (no mockup yet) rejects approve with ERR_INVALID_STATE (state machine only permits MOCKUP_READY -> APPROVED)."
        test_recipe:
          setup:
            - "One Creator with a Design uploaded, not yet mockup-generated (status=UPLOADED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/creators/register"
              payload: { email: "cd1@example.com", display_name: "CD1", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_cd1_uploaded" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { design_id: $.data.id }
          trigger:
            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: order_capture_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Order.DRAFT_to_AUTHORIZED"
          - "state_machines.Order.AUTHORIZED_to_CAPTURED"
        distinguishing_aspect: "Order in DRAFT payment_status rejects capture with ERR_INVALID_STATE (capture requires AUTHORIZED)."
        test_recipe:
          setup:
            - "One PUBLISHED Listing with an Order in DRAFT payment_status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/fulfillment-partners"
              payload: { name: "US Print A", country_code: "US", cost_multiplier_bps: 10000, max_backlog_hours: 168 }
              as: PlatformAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /pod/products"
              payload: { sku: "T-CD2", category: "APPAREL", base_cost_cents: 2000, dimensions_json: { width_px: 3000, height_px: 3600, dpi: 300 } }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /pod/products/${prod_id}/variants"
              payload: { color: "BLACK", size: "M" }
              as: PlatformAdmin
              captures: { var_id: $.data.id }
            - call: "POST /pod/creators/register"
              payload: { email: "cd2@example.com", display_name: "CD2", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "cd2-sf", integration_channel: "NATIVE", markup_bps: 5000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_cd2_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { design_id: $.data.id }
            - call: "POST /pod/designs/${design_id}/mockup"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design_id}", variant_id: "${var_id}", title: "T CD2" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /pod/listings/${listing_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/orders"
              payload: { storefront_id: "${sf_id}", listing_id: "${listing_id}", buyer_email: "b@x.com", ship_country_code: "US", item_count: 1, is_sample: false }
              as: Anonymous
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /pod/orders/${order_id}/capture"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: storefront_link_channel_already_linked_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Storefront.NONE_to_LINKED"
          - "errors[ERR_STOREFRONT_CHANNEL_ALREADY_LINKED]"
        distinguishing_aspect: "A Storefront whose integration_status is LINKED rejects a second link-channel with ERR_STOREFRONT_CHANNEL_ALREADY_LINKED (409)."
        test_recipe:
          setup:
            - "One VERIFIED Creator and Storefront with integration_channel=ETSY, integration_status already LINKED via a prior successful link-channel call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/creators/register"
              payload: { email: "cd3@example.com", display_name: "CD3", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "cd3-sf", integration_channel: "ETSY", markup_bps: 5000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id, sf_v0: $.data.version }
            - call: "POST /pod/storefronts/${sf_id}/link-channel"
              payload: { expected_storefront_version: "${sf_v0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_v1: $.data.version }
          trigger:
            - call: "POST /pod/storefronts/${sf_id}/link-channel"
              payload: { expected_storefront_version: "${sf_v1}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STOREFRONT_CHANNEL_ALREADY_LINKED"

      - name: reprint_approve_when_order_not_shipped_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.FulfillmentJob.REPRINT_REQUESTED_to_QUEUED"
          - "errors[ERR_REPRINT_ORDER_NOT_SHIPPED]"
        distinguishing_aspect: "Approving a reprint whose linked Order.fulfillment_status is not SHIPPED (e.g., DELIVERED) rejects with ERR_REPRINT_ORDER_NOT_SHIPPED."
        excluded_because:
          difficulty_instance: non_linear_state_machine / fulfillment_job_cyclic_shipped_failed_reprint_queued
          rationale: "The positive path is asserted by that difficulty instance; the negative variant is a symmetric derivative not covered as a distinct §1.8 instance."

  - section: entities
    instances:
      - name: creator_register_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Creator.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /pod/creators/register without email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "No prior state."
          setup_api_calls: []
          trigger:
            - call: "POST /pod/creators/register"
              payload: { display_name: "NoEmail", payout_country_code: "US" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: design_upload_duplicate_hash_for_same_creator_returns_conflict
        claim_type: uniqueness
        grounds:
          - "entities.Design.fields.file_hash"
          - "validations[priority=13]"
          - "errors[ERR_DESIGN_DUPLICATE_HASH]"
        distinguishing_aspect: "Second POST /pod/creators/{id}/designs with the same file_hash under the same creator returns ERR_DESIGN_DUPLICATE_HASH (409)."
        test_recipe:
          setup:
            - "One VERIFIED Creator with one existing Design (file_hash=hash_dupe_1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/creators/register"
              payload: { email: "cd4@example.com", display_name: "CD4", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_dupe_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { first_design_id: $.data.id }
          trigger:
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_dupe_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DESIGN_DUPLICATE_HASH"

      - name: storefront_markup_out_of_range_upper_boundary
        claim_type: type_constraints
        grounds:
          - "entities.Storefront.fields.markup_bps"
          - "validations[priority=12]"
          - "errors[ERR_MARKUP_OUT_OF_RANGE]"
        distinguishing_aspect: "markup_bps=10001 rejected with ERR_MARKUP_OUT_OF_RANGE (upper bound is 10000 inclusive)."
        test_recipe:
          setup:
            - "One VERIFIED Creator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/creators/register"
              payload: { email: "cd5@example.com", display_name: "CD5", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "cd5-sf", integration_channel: "NATIVE", markup_bps: 10001 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_MARKUP_OUT_OF_RANGE"

  - section: validations
