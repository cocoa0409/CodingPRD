              payload: { version_label: "M-DRAFT", weight_financial_health: 0.25, weight_accountability: 0.25, weight_transparency: 0.25, weight_impact: 0.25 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { mdraft: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
