        grounds: ["validations[priority=4]", "errors[ERR_RECOUNT_IN_PROGRESS]", state_machines.Election.POLLS_CLOSED_to_CERTIFIED]
        distinguishing_aspect: "Certifying a POLLS_CLOSED election while a REQUESTED RecountCase exists -> ERR_RECOUNT_IN_PROGRESS (409)."
