              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-10T00:00:00Z", flight_end: "2026-09-20T00:00:00Z", budget_cents: 5000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
          trigger:
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
          assert:
            - "err == ERR_CAMPAIGN_OUTSIDE_FLIGHT with http 409 (now before flight_start)"
            - "At flight_start exactly: start succeeds and AdCampaign.${k}.status == ACTIVE (window is start-inclusive)"

      - name: withdrawn_update_cannot_be_applied
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UPDATE_NOT_APPLICABLE
          - state_machines.OsUpdate
        distinguishing_aspect: "Applying a WITHDRAWN update fails with 409 ERR_UPDATE_NOT_APPLICABLE and the unit's os_version_tag is unchanged."
