            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-VC08", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, captures: { dev_v8: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "vc8@x.test", full_name: "Vc Eight", age_years: 70 }, as: CareOpsAgent, captures: { pat_v8: "$.data.id" } }
            - { call: "POST /patients/${pat_v8}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_v8}", captures: { scr_v8: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_v8}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_v8}" }
            - { call: "POST /screening-sessions/${scr_v8}/submit", payload: {}, as: Patient, as_user_id: "${pat_v8}" }
            - { call: "POST /patients/${pat_v8}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_v8}", captures: { ord_v8: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_v8}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "POST /device-orders/${ord_v8}/confirm-fit", payload: {}, as: CareOpsAgent }
            - { call: "POST /device-orders/${ord_v8}/ship", payload: {}, as: CareOpsAgent }
            - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_v8}", event: "DELIVERED" }, as: PlatformAdmin }
            - { call: "POST /repair-orders", payload: { device_id: "${dev_v8}", fault_code: "MOISTURE" }, as: CareOpsAgent, captures: { rep_v8: "$.data.id" } }
            - { call: "POST /reimbursement-claims", payload: { patient_id: "${pat_v8}", subject_kind: "REPAIR_ORDER", repair_order_id: "${rep_v8}", claimed_amount_cents: 90000, document_codes: ["INVOICE", "PROOF_OF_PAYMENT"], insurance_benefit_cap_cents: 0, insurance_benefit_used_cents: 0, fsa_balance_cents: 0 }, as: Patient, as_user_id: "${pat_v8}", captures: { rc_v8: "$.data.id" } }
            - { call: "POST /reimbursement-claims/${rc_v8}/submit", payload: {}, as: ReimbursementSpecialist, as_user_id: "spec-1" }
            - { call: "POST /reimbursement-claims/${rc_v8}/start-review", payload: {}, as: ReimbursementSpecialist, as_user_id: "spec-2" }
          trigger:
            - { call: "POST /reimbursement-claims/${rc_v8}/decide", payload: { decision: "APPROVE" }, as: ReimbursementSpecialist, as_user_id: "spec-1" }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "GET /reimbursement-claims/${rc_v8} returns data.status == \"UNDER_REVIEW\" and data.approved_by_user_id == null"
            - "the same decide by spec-2 instead returns 422 ERR_CLAIM_AMOUNT_EXCEEDS_ELIGIBLE (90000 > 50000)"

