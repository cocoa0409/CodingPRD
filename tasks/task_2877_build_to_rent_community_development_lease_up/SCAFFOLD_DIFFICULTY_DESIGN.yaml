            - call: "POST /communities"
              payload: { name: "Ivyhurst", market_code: "TX-DFW", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 5000000, facility_commitment_cents: 80000000, maintenance_tech_headcount: 2 }
