  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_occ_stale_applicant_version_rejects_prepared_form
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prepared-form-create-stale-applicant]
          - validations[priority=11]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Re-sending the applicant version observed before a successful preparation responds 412 ERR_STALE_VERSION, because the successful preparation bumped Applicant.version and would otherwise silently VOID a preparation the client never saw."
        test_recipe:
          setup:
            - "DS-160 revision 1 ACTIVE and one applicant with a first PreparedForm already created."
          setup_api_calls:
            - call: "POST /expediting/agency-forms"
              payload: { form_code: "DS-160", revision: 1, required_field_count: 12 }
              as: PlatformAdmin
              captures: { form_v1_id: $.data.id }
            - call: "POST /expediting/agency-forms/${form_v1_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "PASSPORT_RENEWAL", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Occ One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "GET /expediting/applicants/${ap_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_v0: $.data.version }
            - call: "POST /expediting/applicants/${ap_id}/prepared-forms"
              payload: { agency_form_id: "${form_v1_id}", filled_field_count: 12, expected_applicant_version: "${ap_v0}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { pf1_id: $.data.id }
          trigger:
            - call: "POST /expediting/applicants/${ap_id}/prepared-forms"
              payload: { agency_form_id: "${form_v1_id}", filled_field_count: 12, expected_applicant_version: "${ap_v0}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { occ_err: $.data.error_id }
          assert:
            - "the trigger responds 412 with error_id ERR_STALE_VERSION"
            - "PreparedForm.${pf1_id}.prep_status == PREPARED"
            - "GET /expediting/applicants/${ap_id}/prepared-forms returns exactly 1 row"

      - name: corner_prepared_form_create_supersedes_prior_to_void
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PreparedForm.PREPARED_to_VOID
          - concurrency_rules[prepared-form-create-stale-applicant]
          - endpoints[POST /expediting/applicants/{id}/prepared-forms]
        distinguishing_aspect: "A second preparation for the same form_code, sent with the CURRENT applicant version, succeeds and drives the prior PreparedForm to VOID while the new one is PREPARED."
        test_recipe:
          setup:
            - "DS-160 revision 1 ACTIVE and one applicant with a first PreparedForm already created."
          setup_api_calls:
            - call: "POST /expediting/agency-forms"
              payload: { form_code: "DS-160", revision: 1, required_field_count: 12 }
              as: PlatformAdmin
              captures: { form_v1_id: $.data.id }
            - call: "POST /expediting/agency-forms/${form_v1_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "PASSPORT_RENEWAL", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Void Chain", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "GET /expediting/applicants/${ap_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_v0: $.data.version }
            - call: "POST /expediting/applicants/${ap_id}/prepared-forms"
              payload: { agency_form_id: "${form_v1_id}", filled_field_count: 12, expected_applicant_version: "${ap_v0}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { pf1_id: $.data.id }
            - call: "GET /expediting/applicants/${ap_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_v1: $.data.version }
          trigger:
            - call: "POST /expediting/applicants/${ap_id}/prepared-forms"
              payload: { agency_form_id: "${form_v1_id}", filled_field_count: 14, expected_applicant_version: "${ap_v1}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { pf2_id: $.data.id }
          assert:
            - "PreparedForm.${pf1_id}.prep_status == VOID"
            - "PreparedForm.${pf2_id}.prep_status == PREPARED"
            - "PreparedForm.${pf2_id}.filled_field_count == 14"
            - "Applicant.${ap_id}.readiness_status == COMPLETE"
            - "GET /expediting/applicants/${ap_id}/prepared-forms returns exactly 2 rows"

  # =====================================================================
  - section: consistency_model
    instances:

      - name: corner_quote_side_effects_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - calculations.service_fee_total
          - calculations.feasibility_evaluation
          - endpoints[POST /expediting/orders/{id}/quote]
        distinguishing_aspect: "The quote response itself already carries the recomputed money fields, the derived feasibility_status and the recorded quoted_by_user_id — no second read is needed to observe any of them."
        test_recipe:
          setup:
            - "One STANDARD single-applicant order in DRAFT at logical clock 2026-06-01T09:00:00Z with travel_date 2026-09-01."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Immediate One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { q_total: $.data.total_quoted_cents, q_feas: $.data.feasibility_status, q_by: $.data.quoted_by_user_id, q_pcd: $.data.projected_completion_date }
          assert:
            - "${q_total} == 26500"
            - "${q_feas} == FEASIBLE"
            - "${q_by} == cm-quote"
            - "${q_pcd} == 2026-06-26"
            - "Order.${ord_id}.workflow_status == QUOTED"
            - "Order.${ord_id}.furthest_stage_reached == QUOTED"

  # =====================================================================
  - section: errors
    instances:

      - name: corner_error_agency_custody_lock_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGENCY_CUSTODY_LOCK]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / custody_lock_preempts_document_resubmission_cap
          rationale: "Asserted as the winning error of that named difficulty instance's dual-failure request."

      - name: corner_error_segregation_of_duties_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_preempts_outstanding_balance
          rationale: "Asserted as the winning error of that named difficulty instance's dual-failure submit."

      - name: corner_error_document_validity_insufficient_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOCUMENT_VALIDITY_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / document_validity_anchor_return_date_versus_travel_date
          rationale: "Asserted as the failure half of that instance's two-variant comparison."

      - name: corner_error_photo_retake_cap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PHOTO_RETAKE_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / photo_capped_retake_cycle_on_photo_asset
          rationale: "Asserted as the terminating refusal of that instance's capped retake loop."

      - name: corner_error_slot_capacity_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / appointment_slot_aggregate_capacity_at_one_instant
          rationale: "Asserted as the collision outcome of that instance's aggregate-capacity overlap."

      - name: corner_error_custody_mismatch_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTODY_MISMATCH]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / custody_interval_single_occupancy_rejects_out_of_position_dispatch
          rationale: "Asserted as the single-occupancy refusal in that instance."

      - name: corner_error_form_revision_stale_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORM_REVISION_STALE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prepared_form_creation_depends_on_agency_form_publication_state
          rationale: "Asserted as the DRAFT-revision refusal in that instance."

      - name: corner_error_resource_not_found_on_document_read
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /expediting/documents/{id} for a UUID that names no ApplicantDocument responds 404 ERR_RESOURCE_NOT_FOUND, distinct from the Order-specific 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /expediting/documents/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
              captures: { rnf_err: $.data.error_id }
          assert:
            - "the trigger responds 404 with error_id ERR_RESOURCE_NOT_FOUND"

      - name: corner_error_leg_sequence_violation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LEG_SEQUENCE_VIOLATION]
          - validations[priority=15]
          - entities.CourierLeg.fields.leg_index
        distinguishing_aspect: "With two CREATED legs both leaving APPLICANT, dispatching leg_index 2 while leg_index 1 is still CREATED responds 409 ERR_LEG_SEQUENCE_VIOLATION even though the custody rung is satisfied."
        test_recipe:
          setup: ["One order in DRAFT with two CREATED courier legs, both from_holder APPLICANT."]
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 1, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-01" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg1_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 2, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-02" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg2_id: $.data.id }
          trigger:
            - call: "POST /expediting/courier-legs/${leg2_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
              captures: { seq_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_LEG_SEQUENCE_VIOLATION"
            - "CourierLeg.${leg2_id}.leg_status == CREATED"
            - "CourierLeg.${leg1_id}.leg_status == CREATED"
            - "Order.${ord_id}.custody_holder == APPLICANT"

      - name: corner_error_embassy_closed_blocks_dispatch
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMBASSY_CLOSED]
          - validations[priority=16]
          - entities.Consulate.fields.closure_dates
        distinguishing_aspect: "A leg scheduled on 2026-06-02 cannot be dispatched once 2026-06-02 is added to the order consulate's closure_dates, responding 409 ERR_EMBASSY_CLOSED with attempt_count still 0."
        test_recipe:
          setup: ["A consulate with 2026-06-02 in closure_dates and one order whose leg 1 is scheduled on that date."]
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/consulates"
              payload:
                name: "IN Consulate West"
                destination_country: "IN"
                jurisdiction_region_codes: ["CA", "NV"]
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /expediting/consulates/${cons_id}/closures"
              payload: { closure_date: "2026-06-02" }
              as: PlatformAdmin
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", consulate_id: "${cons_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/courier-legs"
              payload: { leg_index: 1, from_holder: "APPLICANT", to_holder: "SERVICE", scheduled_date: "2026-06-02" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg1_id: $.data.id }
          trigger:
            - call: "POST /expediting/courier-legs/${leg1_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
              captures: { closed_err: $.data.error_id }
          assert:
            - "the trigger responds 409 with error_id ERR_EMBASSY_CLOSED"
            - "CourierLeg.${leg1_id}.leg_status == CREATED"
            - "CourierLeg.${leg1_id}.attempt_count == 0"
            - "Order.${ord_id}.custody_holder == APPLICANT"

      - name: corner_error_out_of_jurisdiction_booking
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUT_OF_JURISDICTION]
          - validations[priority=17]
          - entities.Consulate.fields.jurisdiction_region_codes
        distinguishing_aspect: "An applicant resident in TX cannot book at a consulate whose jurisdiction_region_codes are CA and NV: 422 ERR_OUT_OF_JURISDICTION with booked_count unchanged at 0."
        test_recipe:
          setup: ["A consulate covering CA and NV with one OPEN slot far enough ahead, and an applicant resident in TX."]
