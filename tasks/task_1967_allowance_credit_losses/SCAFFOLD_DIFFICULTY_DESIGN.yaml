# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# CECL Allowance for Credit Losses
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: scenario_weighted_vs_baseline_only_rate
        grounds:
          - calculations.quantitative_reserve
          - calculations.scenario_loss_multiplier
        distinguishing_aspect: |
          Same portfolio, same model, same quarter universe — only the scenario-weighting
          variant differs: single_scenario (one BASELINE weight) yields lifetime rate 50 bps
          and reserve 50000, while weighted_scenarios (60/40 BASELINE/ADVERSE) yields 55 bps
          and 55000. This instance exercises the dual variant on the SEGMENT-reserve domain.
        test_recipe:
          setup:
            - "ACTIVE LOSS_RATE model (F=2, IMMEDIATE, R=0); PRIME segment with one PASS loan of 10000000 cents"
            - "BASELINE scenario (u=500, g=200) and ADVERSE scenario (u=900, g=0), both covering 2026-Q1..2026-Q4"
            - "Run A (2026-Q1) weighted 100% BASELINE; Run B (2026-Q2) weighted 60/40 BASELINE/ADVERSE"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards 2024", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-1", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Adverse", scenario_type: ADVERSE, unemployment_rate_bps: 900, gdp_growth_bps: 0, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_adv: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_a: $.data.id }
            - call: "POST /cecl/model-runs/${run_a}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q2", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 6000 }, { scenario_id: "${sc_adv}", weight_bps: 4000 } ] }
              as: CreditAnalyst
              captures: { run_b: $.data.id }
            - call: "POST /cecl/model-runs/${run_b}/execute"
              payload: {}
              as: CreditAnalyst
          trigger:
            - call: "GET /cecl/model-runs/${run_a}/allowance-summary"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/model-runs/${run_b}/allowance-summary"
              payload: {}
              as: CreditAnalyst
          assert:
            - "ModelRun.${run_a}.quantitative_reserve_cents == 50000 (rate 50 bps: single_scenario variant, M = 1.0)"
            - "ModelRun.${run_a}.segments_breakdown[0].lifetime_loss_rate_bps == 50"
            - "ModelRun.${run_b}.quantitative_reserve_cents == 55000 (weighted M = 1.4, E = (2*1.4 + 6*1.0)/8 = 1.1, rate = round_half_up(50*1.1) = 55)"
            - "ModelRun.${run_b}.segments_breakdown[0].lifetime_loss_rate_bps == 55"
            - "ModelRun.${run_a}.quantitative_reserve_cents != ModelRun.${run_b}.quantitative_reserve_cents"

      - name: collateral_vs_dcf_specific_reserve
        grounds:
          - calculations.individual_specific_reserve
        distinguishing_aspect: |
          Two identical SUBSTANDARD loans (500000 cents amortized, 460000 collateral):
          the COLLATERAL_FAIR_VALUE variant reserves 86000 while the DISCOUNTED_CASH_FLOW
          variant reserves 16777 on the same loan data. This instance exercises the dual
          variant on the INDIVIDUAL-EVALUATION domain (different entity domain from
          scenario_weighted_vs_baseline_only_rate).
        test_recipe:
          setup:
            - "ACTIVE model; SUBPRIME segment with two SUBSTANDARD loans of 500000 cents each (collateral 460000)"
            - "Run 2026-Q1 executed; two IndividualEvaluations created in DRAFT (default COLLATERAL_FAIR_VALUE)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-A", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
              captures: { loan_a: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-B", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
              captures: { loan_b: $.data.id }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}", loan_id: "${loan_b}" }
              as: CreditAnalyst
              captures: { ie_b: "$.data[0].id", ie_b_v: "$.data[0].version" }
          trigger:
            - call: "PATCH /cecl/individual-evaluations/${ie_b}"
              payload: { expected_evaluation_version: "${ie_b_v}", method: DISCOUNTED_CASH_FLOW, expected_quarterly_cash_flows_cents: [130000, 130000, 130000, 130000], discount_rate_bps: 300 }
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations/${ie_b}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "IndividualEvaluation for loan ${loan_a}.specific_reserve_cents == 86000 (COLLATERAL_FAIR_VALUE: 500000 - (460000 - 46000))"
            - "IndividualEvaluation.${ie_b}.specific_reserve_cents == 16777 (DCF: PV of 4 x 130000 at 3%/qtr = 483223; 500000 - 483223)"
            - "IndividualEvaluation.${ie_b}.method == DISCOUNTED_CASH_FLOW"
            - "The two reserves differ on identical loan data: 86000 != 16777"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: reversion_straight_line_vs_immediate
        grounds:
          - calculations.quantitative_reserve
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with a conditional branch on entity state:
          identical NEAR_PRIME portfolio and a single ADVERSE scenario (M = 2.0), but
          reversion_method STRAIGHT_LINE (F=2, R=2) gives E = 11/8 = 1.375 -> rate 206 bps
          -> reserve 2060, while IMMEDIATE (F=2, R=0) gives E = 1.25 -> rate 188 bps ->
          reserve 1880. The reversion_method enum branch changes the result.
        test_recipe:
          setup:
            - "NEAR_PRIME segment (base 150 bps) with one PASS loan of 100000 cents"
            - "Single ADVERSE scenario (u=900, g=0 -> mult 20000 bps) covering all of 2026"
            - "Model SL (STRAIGHT_LINE F=2 R=2) executed for 2026-Q1, then auto-retired by activating Model IM (IMMEDIATE F=2 R=0) executed for 2026-Q2"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-SL", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: STRAIGHT_LINE, reversion_period_quarters: 2, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_sl: $.data.id }
            - call: "POST /cecl/loss-models/${m_sl}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2024", name: "Auto NearPrime", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-SL", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Adverse", scenario_type: ADVERSE, unemployment_rate_bps: 900, gdp_growth_bps: 0, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_adv: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_sl}", scenario_weights: [ { scenario_id: "${sc_adv}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_sl: $.data.id }
            - call: "POST /cecl/model-runs/${run_sl}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-IM", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_im: $.data.id }
            - call: "POST /cecl/loss-models/${m_im}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q2", loss_model_id: "${m_im}", scenario_weights: [ { scenario_id: "${sc_adv}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_im: $.data.id }
            - call: "POST /cecl/model-runs/${run_im}/execute"
              payload: {}
              as: CreditAnalyst
          trigger:
            - call: "GET /cecl/model-runs/${run_sl}/allowance-summary"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/model-runs/${run_im}/allowance-summary"
              payload: {}
              as: CreditAnalyst
          assert:
            - "ModelRun.${run_sl}.segments_breakdown[0].lifetime_loss_rate_bps == 206 (round_half_up(150 * 1.375))"
            - "ModelRun.${run_sl}.quantitative_reserve_cents == 2060"
            - "ModelRun.${run_im}.segments_breakdown[0].lifetime_loss_rate_bps == 188 (round_half_up(150 * 1.25) = round_half_up(187.5))"
            - "ModelRun.${run_im}.quantitative_reserve_cents == 1880"
            - "LossModel.${m_sl}.status == RETIRED (auto-retired when ${m_im} activated)"

      - name: per_segment_round_then_sum_order
        grounds:
          - calculations.run_totals
          - calculations.quantitative_reserve
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two NEAR_PRIME segments with
          10100 cents exposure each at 150 bps. PINNED order (round per segment, then
          sum) yields 152 + 152 = 304; the forbidden order (sum raw, then round) yields
          round(303.00) = 303. The run total MUST be 304.
        test_recipe:
          setup:
            - "ACTIVE model (F=2, IMMEDIATE); BASELINE scenario at neutral macro values (mult = 1.0)"
            - "Two NEAR_PRIME segments, each holding one PASS loan of 10100 cents"
            - "Run 2026-Q1 executed at 100% BASELINE"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-NP-A", name: "NearPrime A", product_type: CREDIT_CARD, risk_rating_band: NEAR_PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_a: $.data.id }
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-NP-B", name: "NearPrime B", product_type: CREDIT_CARD, risk_rating_band: NEAR_PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_b: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_a}", loan_number: "LN-R1", amortized_cost_cents: 10100, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_b}", loan_number: "LN-R2", amortized_cost_cents: 10100, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
          trigger:
            - call: "GET /cecl/model-runs/${run_id}/allowance-summary"
              payload: {}
              as: CreditAnalyst
          assert:
            - "ModelRun.${run_id}.quantitative_reserve_cents == 304 (per-segment 151.5 -> 152, summed: 152 + 152)"
            - "ModelRun.${run_id}.segments_breakdown[*].quantitative_reserve_cents == [152, 152]"
            - "ModelRun.${run_id}.quantitative_reserve_cents != 303 (the sum-then-round value is forbidden)"
            - "ModelRun.${run_id}.total_exposure_cents == 20200"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: model_run_rework_cycle
        grounds:
          - state_machines.ModelRun.UNDER_REVIEW_to_EXECUTED
          - state_machines.ModelRun.EXECUTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ModelRun has a rework cycle: UNDER_REVIEW -> EXECUTED -> UNDER_REVIEW is
          reachable and repeatable; the entity is ModelRun (the other non-linear
          instance is on IndividualEvaluation).
        test_recipe:
          setup:
            - "ACTIVE model; segment with one small PASS loan; BASELINE scenario; run 2026-Q1 executed and submitted (zero evaluations -> vacuously reviewable)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "MTG-PRIME-2024", name: "Prime Mortgage", product_type: MORTGAGE, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-W1", amortized_cost_cents: 50000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/request_rework"
              payload: { rework_notes: "Revisit qualitative overlay for energy exposure" }
              as: ChiefCreditOfficer
              captures: { st1: $.data.status }
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
              captures: { st2: $.data.status }
          assert:
            - "ModelRun.${run_id} status after request_rework == EXECUTED (${st1})"
            - "ModelRun.${run_id} status after second submit_for_review == UNDER_REVIEW (${st2})"
            - "ModelRun.${run_id}.rework_notes == 'Revisit qualitative overlay for energy exposure'"

      - name: evaluation_reopen_cycle
        grounds:
          - state_machines.IndividualEvaluation.REVIEWED_to_SUBMITTED
          - state_machines.IndividualEvaluation.SUBMITTED_to_REVIEWED
        distinguishing_aspect: |
          IndividualEvaluation has a reopen cycle: SUBMITTED -> REVIEWED -> SUBMITTED ->
          REVIEWED; the entity is IndividualEvaluation (different from ModelRun's rework
          cycle). The parent's reviewed_evaluation_count oscillates 0 -> 1 -> 0 -> 1.
        test_recipe:
          setup:
            - "Run 2026-Q1 EXECUTED with one IndividualEvaluation (SUBSTANDARD loan 500000, collateral 460000)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-IE", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}" }
              as: CreditAnalyst
              captures: { ie_id: "$.data[0].id", ie_v: "$.data[0].version" }
            - call: "PATCH /cecl/individual-evaluations/${ie_id}"
              payload: { expected_evaluation_version: "${ie_v}", analysis_notes: "Borrower downgraded after covenant breach; collateral-based reserve appropriate." }
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/submit"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/review"
              payload: {}
              as: ChiefCreditOfficer
          trigger:
            - call: "POST /cecl/individual-evaluations/${ie_id}/reopen"
              payload: { reopen_reason: "Re-verify collateral appraisal date" }
              as: ChiefCreditOfficer
              captures: { st1: $.data.status }
            - call: "GET /cecl/model-runs/${run_id}"
              payload: {}
              as: CreditAnalyst
              captures: { rc_mid: $.data.reviewed_evaluation_count }
            - call: "POST /cecl/individual-evaluations/${ie_id}/review"
              payload: {}
              as: ChiefCreditOfficer
              captures: { st2: $.data.status }
          assert:
            - "IndividualEvaluation.${ie_id} status after reopen == SUBMITTED (${st1})"
            - "ModelRun.${run_id}.reviewed_evaluation_count after reopen == 0 (${rc_mid})"
            - "IndividualEvaluation.${ie_id} status after second review == REVIEWED (${st2})"
            - "ModelRun.${run_id}.reviewed_evaluation_count ends at 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: charge_off_watch_run_flag_chain
        grounds:
          - state_machines.Loan.ACTIVE_to_CHARGED_OFF
          - state_machines.PortfolioSegment.OPEN_to_WATCH
          - calculations.segment_charge_off_rate
        distinguishing_aspect: |
          Depth-3 cascade from POST /loans/{id}/charge_off: (hop 1) the charge-off
          increments PortfolioSegment.ytd_gross_charge_offs_cents; (hop 2) that counter
          mutation recomputes charge_off_rate_bps to 5000 > 200 and flips the segment
          OPEN -> WATCH; (hop 3) the WATCH entry sets needs_segmentation_review = true on
          the unrelated DRAFT ModelRun. Each hop is caused by the previous hop, not by
          the original request.
        test_recipe:
          setup:
            - "Segment with two PASS loans of 100000 cents each (origination_total 200000)"
            - "A DRAFT ModelRun (2026-Q1) existing before the charge-off"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP 2023", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-C1", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_1: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-C2", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
