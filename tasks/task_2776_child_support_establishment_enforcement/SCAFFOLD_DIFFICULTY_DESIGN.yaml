            - "${a_arr} == 0  # bucket 3 iterates an empty OPEN-charge set"
            - "${a_int} == 0  # bucket 4 snapshot receivable is 0"
            - "${a_gen} == 0  # bucket 5 is skipped, genetic_cost_liable_party is NONE"
            - "${a_unapplied} == 60000  # bucket 6 absorbs the whole payment"
            - "${a_disb} == 0  # distributable is 0, so nothing reaches the CP"
            - "${a_ret} == 0"
            - "${a_disb} + ${a_ret} + ${a_unapplied} == 60000  # the distribution invariant holds at the empty boundary"
