      - name: core_return_cycle_increments_inspection_round
        claim_type: Cyclic
        grounds:
          - state_machines.CoreReturn.DISPUTED_to_INSPECTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / core_return_dispute_cycle_reenters_inspected
          rationale: "The DISPUTED -> INSPECTED re-entry and the inspection_round increment are the asserted outcome of that §1.8 instance."

      - name: delivery_bubbles_account_into_credit_hold
        claim_type: Bubble up
        grounds:
          - state_machines.Order.CLEARED_to_HELD
        excluded_because:
          difficulty_instance: transitive_cascade / delivery_cascade_five_hops_to_sibling_order_credit_hold
          rationale: "Every hop from shipment delivery to the sibling order's HELD credit_status is asserted there."

      - name: scrap_onto_submitted_manifest_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.InventoryLot.SHELF_EXPIRED_to_SCRAPPED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_scrap_requires_target_manifest_in_draft
          rationale: "Asserted as the failure path of that §1.8 instance."

      - name: manifest_reject_detaches_everything
        claim_type: Compensation
        grounds:
          - state_machines.DisposalManifest.SUBMITTED_to_DRAFT
        excluded_because:
          difficulty_instance: compensating_invariant / manifest_reject_conserves_global_recovered_lead_mass
          rationale: "The detach cascade and the zeroed lead totals are asserted there."

