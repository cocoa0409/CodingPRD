      - name: record_production_rejects_a_foreign_listing_then_recovery_rejects_an_unlinked_record
        claim_type: cascading_validation
        grounds:
          - validations[priority=50]
          - validations[priority=51]
          - errors[ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH]
          - errors[ERR_RECORD_NOT_IN_WITHDRAWAL]
        distinguishing_aspect: |
          Two relational gates fire in sequence over the same withdrawal. First a record belonging to a
          SIBLING listing is refused at records-production (ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH,
          422). Then, after a legitimate record is produced, a recovery entry naming a record from the
          CORRECT listing that was simply never produced is refused with ERR_RECORD_NOT_IN_WITHDRAWAL —
          same-parent membership is not enough; the record must be linked to this withdrawal.
        test_recipe:
          setup:
            - "one REGISTERED facility, two listings; listing A has records REC-A1 and REC-A2, listing B has record REC-B1; a recall on listing A is accepted and a withdrawal opened"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example", designation_cap: 5 }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_a: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Cleansing Gel", category_code: "07A", product_form: "RINSE_OFF", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_b: $.data.id }
            - call: "POST /cosmetics/listings/${lst_a}/distribution-records"
              payload: { lot_code: "LOT-A1", consignee_name: "Gulf Coast Retail Group", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_a1: $.data.id }
            - call: "POST /cosmetics/listings/${lst_a}/distribution-records"
              payload: { lot_code: "LOT-A2", consignee_name: "Northway Wholesale", consignee_class: "WHOLESALE", ship_date: "2026-08-06T00:00:00Z", delivery_date: "2026-08-09T00:00:00Z", units_shipped: 250 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_a2: $.data.id }
            - call: "POST /cosmetics/listings/${lst_b}/distribution-records"
              payload: { lot_code: "LOT-B1", consignee_name: "Harbor Drug Mart", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-07T00:00:00Z", units_shipped: 100 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_b1: $.data.id }
            - call: "POST /cosmetics/listings/${lst_a}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_I" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Retail-level retrieval of lot LOT-A1", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${ra_v}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${rec_a1}", "${rec_b1}"] }
