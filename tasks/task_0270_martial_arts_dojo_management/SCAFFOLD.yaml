scenario: "Martial Arts / Dojo Management: program/belt-rank progression, class schedule & attendance, testing/promotion eligibility, recurring tuition & contract, private lessons, tournament registration, pro-shop gear, family discount"
domain_name: "martial-arts-dojo-management"
api_prefix: "/dojo"

complexity_profile:
  primary_archetype: posture-driven-gating
  secondary_archetype: temporal-windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # Members, Programs, Instructors, ClassSessions are peer entities linked by FKs;
  # Enrollment is a many-to-many junction (Member x Program); Family groups Members.
  # No strict nesting — everything reached via FK filters / sub-resource GETs.

  state_machine_shape: parallel
  # Member carries two independent dimensions (account_status x belt progression via
  # Enrollment.rank); Contract has its own cyclic billing loop; PromotionTest branches
  # fork-join (SCHEDULED -> {PASSED, FAILED} -> applied/closed) with divergent effects.

  relationship_patterns:
    - one_to_many        # Family -> Members; Program -> Enrollments; Member -> Attendances
    - many_to_many       # Member <-> Program via Enrollment
    - self_referential   # BeltRank.next_rank_code chains within a Program
    - cross_aggregate    # PromotionTest references Enrollment which references Member+Program

  role_model: peer_roles
  # Member acts on own resources; Instructor runs classes/tests/private lessons;
  # FrontDesk handles billing/contracts/pro-shop; ChiefInstructor (override) signs promotions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the martial-arts program (e.g. 'Adult Brazilian Jiu-Jitsu')."
        constraints: "1..120 chars, non-empty after trim"
      - name: discipline
        type: enum
        source: input
        description: "Martial art discipline."
        constraints: "one of {KARATE, BJJ, TAEKWONDO, JUDO, MUAY_THAI}"
      - name: base_monthly_tuition_cents
        type: integer
        source: input
        description: "Base recurring tuition charged per month before any discounts, in integer cents."
        constraints: ">= 0"
      - name: test_fee_cents
        type: integer
        source: input
        description: "Flat fee charged when a member sits a promotion test in this program, in integer cents."
        constraints: ">= 0"
      - name: min_attendance_for_test
        type: integer
        source: input
        description: "Minimum number of qualifying attendances accumulated in the current rank required before a promotion test may be scheduled."
        constraints: ">= 0"
      - name: min_days_in_rank
        type: integer
        source: input
        description: "Minimum whole days a member must hold the current rank before a promotion test may be scheduled."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the program."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, ARCHIVED}; ARCHIVED set by archive endpoint"

  - name: BeltRank
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this rank belongs to."
      - name: code
        type: string
        source: input
        description: "Short rank code unique within the program (e.g. 'WHITE', 'BLUE')."
        constraints: "1..40 chars; unique per program_id"
      - name: rank_order
        type: integer
        source: input
        description: "Ordinal position of this rank within the program, ascending from the entry rank."
        constraints: ">= 0; unique per program_id"
      - name: next_rank_code
        type: string
        source: input
        description: "FK -> BeltRank.code (within same program) of the immediate successor rank; null on the terminal rank."
        default: null
        constraints: "null on highest rank_order; otherwise references an existing BeltRank.code in same program"
      - name: is_entry_rank
        type: boolean
        source: input
        description: "True for the single rank a fresh enrollment starts at (rank_order == 0)."
        default: false
      - name: requires_chief_signoff
        type: boolean
        source: input
        description: "When true, a promotion INTO this rank requires a ChiefInstructor signature, not just an Instructor pass."
        default: false

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: surname
        type: string
        source: input
        description: "Household surname used for billing grouping."
        constraints: "1..80 chars"
      - name: billing_email
        type: string
        source: input
        description: "Email address the family's consolidated invoices are addressed to."
        constraints: "contains '@'"
      - name: active_member_count
        type: integer
        source: computed
        description: "Count of Members in this family whose account_status IN {ACTIVE, FROZEN}. Drives the family-discount tier. Recomputed on every member add/remove/status change."
        default: 0

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the household this member belongs to; null for an unaffiliated solo member."
        default: null
      - name: full_name
        type: string
        source: input
        description: "Member's full legal name."
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Member login / contact email, globally unique."
        constraints: "contains '@'; unique across all Members"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Member's date of birth (ISO 8601 date); used for minor/adult tournament eligibility."
      - name: account_status
        type: enum
        source: system
        description: "Account lifecycle dimension, independent of belt progression."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, FROZEN, SUSPENDED, WITHDRAWN}"
      - name: waiver_signed
        type: boolean
        source: input
        description: "Whether the liability waiver is on file; required ACTIVE-gate for attendance, testing and tournaments."
        default: false
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of unpaid (status==DUE or status==OVERDUE) Invoice.amount_due_cents for this member. Recomputed on invoice generation, payment, and waive. Drives SUSPENDED auto-transition."
        default: 0

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Instructor's name."
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Instructor contact email, globally unique among instructors."
        constraints: "contains '@'; unique across all Instructors"
      - name: rank_level
        type: enum
        source: input
        description: "Teaching authority level."
        default: "INSTRUCTOR"
        constraints: "one of {INSTRUCTOR, CHIEF_INSTRUCTOR}"
      - name: is_available
        type: boolean
        source: system
        description: "Whether the instructor is currently accepting class assignments and private lessons."
        default: true

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the enrolled member."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program enrolled into."
      - name: current_rank_code
        type: string
        source: system
        description: "FK -> BeltRank.code (within program_id) of the member's current belt in this program; initialized to the program's entry rank."
      - name: rank_attendance_count
        type: integer
        source: computed
        description: "Count of CONFIRMED Attendance rows for this enrollment recorded at or after rank_acquired_at. Reset to 0 on promotion. Gates testing eligibility."
        default: 0
      - name: rank_acquired_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the member entered current_rank_code; set at enrollment and reset on each promotion."
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, ON_HOLD, COMPLETED, DROPPED}"

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this class teaches."
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the assigned lead instructor."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC class start time."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC class end time; must be strictly after starts_at."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of CONFIRMED attendances allowed on the mat for this session."
        constraints: ">= 1"
      - name: confirmed_count
        type: integer
        source: computed
        description: "Count of CONFIRMED Attendance rows for this session. Maintained on check-in and cancellation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Class lifecycle."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, CANCELLED, COMPLETED}"

  - name: Attendance
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment under which the member attends."
      - name: class_session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the class being attended."
      - name: status
        type: enum
        source: system
        description: "Attendance lifecycle."
        default: "CONFIRMED"
        constraints: "one of {CONFIRMED, CANCELLED}"
      - name: counts_toward_rank
        type: boolean
        source: system
        description: "Whether this attendance was credited to the enrollment's rank_attendance_count at check-in time (true only if member ACTIVE and waiver_signed at check-in)."
        default: true

  - name: PromotionTest
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being tested."
      - name: examiner_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the instructor administering the test."
      - name: target_rank_code
        type: string
        source: system
        description: "FK -> BeltRank.code (within the enrollment's program) of the rank being tested for; computed as the current rank's next_rank_code at scheduling time."
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO 8601 UTC date/time of the test sitting."
      - name: status
        type: enum
        source: system
        description: "Test lifecycle (branching fork-join)."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, PASSED_PENDING_SIGNOFF, PASSED, FAILED, CANCELLED}"
      - name: score
        type: integer
        source: input
        description: "Examiner's score 0..100 recorded at grading; null until graded."
        default: null
        constraints: "0..100 when present"
      - name: chief_signoff_instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the ChiefInstructor who signed off a rank that requires_chief_signoff; null otherwise."
        default: null

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member this recurring-tuition contract bills."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program the tuition is for."
      - name: term_months
        type: integer
        source: input
        description: "Committed contract length in months; early termination before fulfilment incurs a buyout fee."
        constraints: "one of {3, 6, 12, 24}"
      - name: billing_anchor_day
        type: integer
        source: input
        description: "Day-of-month (1..28) the recurring invoice is generated."
        constraints: "1..28"
      - name: months_billed
        type: integer
        source: computed
        description: "Count of invoices generated against this contract so far; used against term_months for buyout calculation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle (cyclic billing loop)."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAST_DUE, FULFILLED, TERMINATED}"
      - name: locked_family_discount_pct
        type: number
        source: system
        description: "Family-discount percentage pinned onto the contract at signing time (version-pinned); applied to every recurring invoice regardless of later family-size changes."
        default: 0

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member responsible for this invoice."
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract that generated a recurring tuition invoice; null for ad-hoc invoices (test fee, pro-shop, buyout)."
        default: null
      - name: kind
        type: enum
        source: input
        description: "What this invoice bills for."
        constraints: "one of {TUITION, TEST_FEE, PRO_SHOP, BUYOUT, PRIVATE_LESSON}"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Computed charge in integer cents per the relevant calculation; immutable after generation."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "DUE"
        constraints: "one of {DUE, PAID, OVERDUE, WAIVED, VOID}"
      - name: due_at
        type: datetime
        source: input
        description: "ISO 8601 UTC date the invoice becomes overdue if unpaid."

  - name: PrivateLesson
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member booking the 1:1 lesson."
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the instructor giving the lesson."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC lesson start time."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC lesson end time; strictly after starts_at."
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Agreed per-hour rate for this lesson in integer cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Private-lesson lifecycle."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, CONFIRMED, COMPLETED, CANCELLED}"

  - name: TournamentRegistration
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the competitor registering."
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the program enrollment under which the member competes (determines competing rank/division)."
      - name: tournament_name
        type: string
        source: input
        description: "Name of the tournament event."
        constraints: "1..120 chars"
      - name: event_date
        type: datetime
        source: input
        description: "ISO 8601 UTC date of the tournament."
      - name: division
        type: enum
        source: computed
        description: "Age division computed from Member.date_of_birth relative to event_date at registration time."
        constraints: "one of {YOUTH, TEEN, ADULT, MASTERS}"
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle."
        default: "REGISTERED"
        constraints: "one of {REGISTERED, WITHDRAWN}"

  - name: ProShopOrder
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the purchasing member."
      - name: line_items
        type: array
        source: input
        description: "Array of {sku, unit_price_cents, qty} objects for gear purchased."
        constraints: "non-empty; each qty >= 1; each unit_price_cents >= 0"
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum over line items of unit_price_cents * qty before member discount."
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents after applying the member's pro-shop discount per the pro-shop pricing calculation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order lifecycle."
        default: "PLACED"
        constraints: "one of {PLACED, FULFILLED, CANCELLED}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /dojo/members/{id}/freeze"
        actor: FrontDesk
        preconditions:
          - "member.account_status == ACTIVE"
          - "request body carries expected_member_version equal to member.version"
        side_effects:
          - "set member.account_status = FROZEN"
          - "for each Enrollment of this member with status==ACTIVE: set Enrollment.status = ON_HOLD (cascade down)"
          - "recompute the member's Family.active_member_count (FROZEN still counts as active for family-size; derived-field reconciliation, value unchanged)"
          - "increments Member.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /dojo/members/{id}/unfreeze"
        actor: FrontDesk
        preconditions:
          - "member.account_status == FROZEN"
          - "request body carries expected_member_version equal to member.version"
        side_effects:
          - "set member.account_status = ACTIVE"
          - "for each Enrollment of this member with status==ON_HOLD: set Enrollment.status = ACTIVE (cascade down)"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: invoice generation or overdue-sweep raises outstanding_balance_cents past SUSPEND_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "member.account_status == ACTIVE"
          - "member.outstanding_balance_cents > SUSPEND_THRESHOLD_CENTS (strict)"
        side_effects:
          - "set member.account_status = SUSPENDED"
          - "for each ACTIVE Contract of this member: set Contract.status = PAST_DUE (cascade; that change itself voids the member's REGISTERED future TournamentRegistrations — see Contract.ACTIVE_to_PAST_DUE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: a payment brings outstanding_balance_cents to <= SUSPEND_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "member.account_status == SUSPENDED"
          - "member.outstanding_balance_cents <= SUSPEND_THRESHOLD_CENTS"
        side_effects:
          - "set member.account_status = ACTIVE"
          - "for each PAST_DUE Contract of this member whose member balance is now clear: set Contract.status = ACTIVE"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /dojo/members/{id}/withdraw"
        actor: FrontDesk
        preconditions:
          - "member.account_status IN {ACTIVE, FROZEN, SUSPENDED}"
          - "request body carries expected_member_version equal to member.version"
        side_effects:
          - "set member.account_status = WITHDRAWN"
          - "for each non-terminal Enrollment: set Enrollment.status = DROPPED (cascade down, conditional on non-terminal)"
          - "for each ACTIVE/PAST_DUE Contract: set Contract.status = TERMINATED and generate one BUYOUT Invoice if months_billed < term_months (this Invoice raises outstanding_balance_cents — derived-field reconciliation)"
          - "recompute the member's Family.active_member_count (member no longer counts; cascade may lower the family discount tier for future invoices)"
          - "increments Member.version by 1"
      - from: FROZEN
        to: WITHDRAWN
        trigger: "POST /dojo/members/{id}/withdraw"
        actor: FrontDesk
        preconditions:
          - "member.account_status == FROZEN"
          - "request body carries expected_member_version equal to member.version"
        side_effects:
          - "same as ACTIVE_to_WITHDRAWN"
          - "increments Member.version by 1"

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DROPPED]
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "system: owning Member frozen (cascade from Member.ACTIVE_to_FROZEN)"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects:
          - "set enrollment.status = ON_HOLD"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "system: owning Member unfrozen"
        actor: system
        preconditions:
          - "enrollment.status == ON_HOLD"
        side_effects:
          - "set enrollment.status = ACTIVE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: PromotionTest applied (cascade from PromotionTest.*_to_PASSED)"
        actor: system
        note: "Self-loop: promotion advances the belt but the enrollment stays ACTIVE."
        preconditions:
          - "enrollment.status == ACTIVE"
          - "target_rank_code == current BeltRank.next_rank_code"
        side_effects:
          - "set enrollment.current_rank_code = target_rank_code"
          - "set enrollment.rank_acquired_at = now"
          - "reset enrollment.rank_attendance_count = 0 (compensating reset of the conserved attendance pool)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: PromotionTest PASSED into a terminal BeltRank (next_rank_code == null)"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE"
          - "the newly-acquired BeltRank.next_rank_code == null"
        side_effects:
          - "set enrollment.current_rank_code = target_rank_code"
          - "set enrollment.status = COMPLETED"
      - from: ACTIVE
        to: DROPPED
        trigger: "system: owning Member withdrawn (cascade)"
        actor: system
        preconditions:
          - "enrollment.status IN {ACTIVE, ON_HOLD}"
        side_effects:
          - "set enrollment.status = DROPPED"

  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dojo/class-sessions/{id}/complete"
        actor: Instructor
        preconditions:
          - "session.status == SCHEDULED"
          - "request body carries expected_class_session_version equal to session.version"
        side_effects:
          - "set session.status = COMPLETED"
          - "increments ClassSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dojo/class-sessions/{id}/cancel"
        actor: Instructor
        preconditions:
          - "session.status == SCHEDULED"
          - "request body carries expected_class_session_version equal to session.version"
        side_effects:
          - "set session.status = CANCELLED"
          - "for each CONFIRMED Attendance of this session: set Attendance.status = CANCELLED, and if it had counts_toward_rank==true, decrement the enrollment.rank_attendance_count by 1 (compensation: the attendance pool returns to its pre-check-in value)"
          - "set session.confirmed_count = 0"
          - "increments ClassSession.version by 1"

  - entity: Attendance
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dojo/attendances/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "attendance.status == CONFIRMED"
          - "the owning ClassSession.status == SCHEDULED"
        side_effects:
          - "set attendance.status = CANCELLED"
          - "decrement owning ClassSession.confirmed_count by 1"
          - "if counts_toward_rank == true, decrement the owning Enrollment.rank_attendance_count by 1 (compensation: forward check-in incremented it, cancel restores it)"

  - entity: PromotionTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /dojo/promotion-tests/{id}/grade with score >= PASS_SCORE and target rank not requiring chief signoff"
        actor: Instructor
        preconditions:
          - "test.status == SCHEDULED"
          - "score >= PASS_SCORE (strict-or-equal boundary)"
          - "target BeltRank.requires_chief_signoff == false"
        side_effects:
          - "set test.status = PASSED, test.score = score"
          - "apply promotion: advance the enrollment per Enrollment.ACTIVE_to_ACTIVE or ACTIVE_to_COMPLETED (cascade: test pass -> enrollment rank advance -> rank_attendance_count reset)"
      - from: SCHEDULED
        to: PASSED_PENDING_SIGNOFF
        trigger: "POST /dojo/promotion-tests/{id}/grade with score >= PASS_SCORE and target rank requiring chief signoff"
        actor: Instructor
        preconditions:
          - "test.status == SCHEDULED"
          - "score >= PASS_SCORE"
          - "target BeltRank.requires_chief_signoff == true"
        side_effects:
          - "set test.status = PASSED_PENDING_SIGNOFF, test.score = score"
          - "no rank change yet (promotion deferred until chief signoff)"
      - from: PASSED_PENDING_SIGNOFF
        to: PASSED
        trigger: "POST /dojo/promotion-tests/{id}/signoff"
        actor: ChiefInstructor
        preconditions:
          - "test.status == PASSED_PENDING_SIGNOFF"
          - "the acting instructor.rank_level == CHIEF_INSTRUCTOR"
        side_effects:
          - "set test.status = PASSED, test.chief_signoff_instructor_id = acting instructor id"
          - "apply promotion (cascade: signoff -> enrollment rank advance -> rank_attendance_count reset)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /dojo/promotion-tests/{id}/grade with score < PASS_SCORE"
        actor: Instructor
        preconditions:
          - "test.status == SCHEDULED"
          - "score < PASS_SCORE"
        side_effects:
          - "set test.status = FAILED, test.score = score"
          - "no rank change; enrollment.rank_attendance_count unchanged (no compensation needed)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dojo/promotion-tests/{id}/cancel"
        actor: Instructor
        preconditions:
          - "test.status == SCHEDULED"
        side_effects:
          - "set test.status = CANCELLED"
          - "void the TEST_FEE Invoice generated at scheduling (set Invoice.status=VOID) and recompute member.outstanding_balance_cents (compensation: scheduling debited the fee, cancel credits it back — invoice ledger returns to pre-schedule total)"

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [FULFILLED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /dojo/contracts/{id}/run-billing"
        actor: FrontDesk
        note: "Cyclic billing loop: each run generates one TUITION invoice and increments months_billed; stays ACTIVE until term met."
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.months_billed < contract.term_months"
          - "the owning Member.account_status != WITHDRAWN"
        side_effects:
          - "generate one TUITION Invoice (amount per recurring_tuition_charge calc, using contract.locked_family_discount_pct)"
          - "increment contract.months_billed by 1"
          - "recompute Member.outstanding_balance_cents; if it crosses SUSPEND_THRESHOLD_CENTS the Member auto-SUSPENDs (cascade: billing -> invoice -> balance -> member suspend -> contract past_due)"
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /dojo/contracts/{id}/run-billing (final term month)"
        actor: FrontDesk
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.months_billed + 1 == contract.term_months"
        side_effects:
          - "generate the final TUITION Invoice; increment months_billed to term_months"
          - "set contract.status = FULFILLED"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system: owning Member auto-SUSPENDED (cascade from Member.ACTIVE_to_SUSPENDED)"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "set contract.status = PAST_DUE"
          - "for each REGISTERED future TournamentRegistration of this member (event_date > now): set TournamentRegistration.status = WITHDRAWN (cross-entity cascade: contract past_due strips tournament eligibility)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system: member balance cleared and member back to ACTIVE"
        actor: system
        preconditions:
          - "contract.status == PAST_DUE"
          - "owning Member.account_status == ACTIVE"
        side_effects:
          - "set contract.status = ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dojo/contracts/{id}/terminate"
        actor: FrontDesk
        preconditions:
          - "contract.status IN {ACTIVE, PAST_DUE}"
          - "request body carries expected_contract_version equal to contract.version"
        side_effects:
          - "set contract.status = TERMINATED"
          - "if months_billed < term_months: generate one BUYOUT Invoice (amount per early_termination_buyout calc) and recompute Member.outstanding_balance_cents"
          - "increments Contract.version by 1"
      - from: PAST_DUE
        to: TERMINATED
        trigger: "POST /dojo/contracts/{id}/terminate"
        actor: FrontDesk
        preconditions:
          - "contract.status == PAST_DUE"
          - "request body carries expected_contract_version equal to contract.version"
        side_effects:
          - "same as ACTIVE_to_TERMINATED"
          - "increments Contract.version by 1"

  - entity: Invoice
    initial_state: DUE
    terminal_states: [PAID, WAIVED, VOID]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /dojo/invoices/{id}/pay"
        actor: FrontDesk
        preconditions:
          - "invoice.status IN {DUE, OVERDUE}"
        side_effects:
          - "set invoice.status = PAID"
          - "recompute Member.outstanding_balance_cents; if it falls to <= SUSPEND_THRESHOLD_CENTS the Member auto-unSUSPENDs (cascade: payment -> balance -> member active -> contract active)"
      - from: OVERDUE
        to: PAID
        trigger: "POST /dojo/invoices/{id}/pay"
        actor: FrontDesk
        preconditions:
          - "invoice.status == OVERDUE"
        side_effects:
          - "same as DUE_to_PAID"
      - from: DUE
        to: OVERDUE
        trigger: "POST /dojo/_clock/advance then system overdue sweep, or POST /dojo/invoices/{id}/mark-overdue"
        actor: system
        preconditions:
          - "invoice.status == DUE"
          - "current clock time > invoice.due_at"
        side_effects:
          - "set invoice.status = OVERDUE (does not by itself change amount_due_cents)"
      - from: DUE
        to: WAIVED
        trigger: "POST /dojo/invoices/{id}/waive"
        actor: FrontDesk
        preconditions:
          - "invoice.status IN {DUE, OVERDUE}"
        side_effects:
          - "set invoice.status = WAIVED"
          - "recompute Member.outstanding_balance_cents (waiving removes this invoice from the unpaid sum)"

  - entity: PrivateLesson
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /dojo/private-lessons/{id}/confirm"
        actor: Instructor
        preconditions:
          - "lesson.status == REQUESTED"
          - "the assigned Instructor.is_available == true"
          - "no overlap with another CONFIRMED PrivateLesson or SCHEDULED ClassSession of the same instructor (half-open [starts_at, ends_at) interval check)"
        side_effects:
          - "set lesson.status = CONFIRMED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /dojo/private-lessons/{id}/complete"
        actor: Instructor
        preconditions:
          - "lesson.status == CONFIRMED"
        side_effects:
          - "set lesson.status = COMPLETED"
          - "generate one PRIVATE_LESSON Invoice (amount per private_lesson_charge calc) and recompute Member.outstanding_balance_cents"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /dojo/private-lessons/{id}/cancel"
        actor: Member
        preconditions:
          - "lesson.status == REQUESTED"
        side_effects:
          - "set lesson.status = CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dojo/private-lessons/{id}/cancel"
        actor: Member
        preconditions:
          - "lesson.status == CONFIRMED"
        side_effects:
          - "set lesson.status = CANCELLED (frees the instructor's interval)"

  - entity: TournamentRegistration
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /dojo/tournament-registrations/{id}/withdraw OR system cascade from Contract.ACTIVE_to_PAST_DUE"
        actor: Member
        preconditions:
          - "registration.status == REGISTERED"
        side_effects:
          - "set registration.status = WITHDRAWN"

  - entity: ProShopOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: FULFILLED
        trigger: "POST /dojo/pro-shop-orders/{id}/fulfill"
        actor: FrontDesk
        preconditions:
          - "order.status == PLACED"
        side_effects:
          - "set order.status = FULFILLED"
          - "generate one PRO_SHOP Invoice for net_cents and recompute Member.outstanding_balance_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /dojo/pro-shop-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "order.status == PLACED"
        side_effects:
          - "set order.status = CANCELLED"

concurrency_rules:
  - rule_id: contract-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /dojo/contracts"
    occ_field: "expected_member_version"
    description: |
      Signing a Contract pins locked_family_discount_pct from the member's
      family size at signing time. Creating a Contract against a Member whose
      version has advanced since the client last observed it is rejected,
      capturing the case where the member was just frozen/withdrawn (which
      changed family active_member_count and the discount the new contract
      would legitimately lock) and the writer's view of the member is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enroll-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /dojo/enrollments"
    occ_field: "expected_member_version"
    description: |
      Creating an Enrollment against a Member whose version has advanced since
      the client last read it is rejected. This captures the case where the
      member was just withdrawn (which DROPs enrollments) and the current
      writer's view of the member is stale, so the new enrollment would
      otherwise attach to an account that no longer accepts enrollments.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: family_discount_tier
    trigger: "computed on Contract signing (POST /dojo/contracts) to pin locked_family_discount_pct, and recomputed for Family.active_member_count on member add/status-change"
    algorithm: threshold
    formula: |
      n = count of Members in the family whose account_status IN {ACTIVE, FROZEN}
          (SUSPENDED and WITHDRAWN excluded)
      if n <= 1:      discount_pct = 0.00
      elif n == 2:    discount_pct = 0.10
      elif n == 3:    discount_pct = 0.15
      else (n >= 4):  discount_pct = 0.20   # caps at 20%, never higher
      # boundary: exactly 2 members -> 0.10 (>= test, not >); a solo member (n==1) -> 0.00
    input_set: "Members in the same Family with account_status IN {ACTIVE, FROZEN}"
    constants:
      TIER_2_PCT: 0.10
      TIER_3_PCT: 0.15
      TIER_4_PLUS_PCT: 0.20
    precision: "discount_pct is exact 2-decimal fraction; applied later in cents"
    variants:
      - name: live_tier
        when: "reading Family.active_member_count / recomputing on roster change"
        difference: "reflects the family's CURRENT roster — changes as members join/freeze/withdraw"
      - name: pinned_tier
        when: "stored as Contract.locked_family_discount_pct at signing"
        difference: "frozen at signing; later roster changes do NOT alter an existing contract's discount (version-pinned)"

  - name: recurring_tuition_charge
    trigger: "on Contract.ACTIVE_to_ACTIVE / ACTIVE_to_FULFILLED (POST /dojo/contracts/{id}/run-billing) generating a TUITION Invoice.amount_due_cents"
    algorithm: tiered_pricing
    formula: |
      base = Program.base_monthly_tuition_cents
      pct  = Contract.locked_family_discount_pct        # pinned, NOT live
      # ROUNDING ORDER PINNED: compute the discount on the single base amount,
      # round_half_up to whole cents, then subtract. (Per-line rounding, not
      # sum-then-round — there is exactly one line here, but the order is pinned
      # to match pro_shop_pricing's discipline.)
      discount_cents = round_half_up(base * pct)
      amount_due_cents = base - discount_cents
      # amount_due_cents floored at 0
    input_set: "the single Program tied to the Contract"
    constants:
      ROUNDING: "round_half_up"
    precision: "integer cents, round_half_up on the discount term"

  - name: pro_shop_pricing
    trigger: "on ProShopOrder creation (POST /dojo/pro-shop-orders) to set gross_cents and net_cents"
    algorithm: tiered_pricing
    formula: |
      gross_cents = sum over line_items of (unit_price_cents * qty)
      # member pro-shop discount: depends on the member's HIGHEST current belt
      # rank_order across their ACTIVE enrollments (loyalty reward), tiered:
      max_rank_order = max(Enrollment.current BeltRank.rank_order
                           over Enrollments with status==ACTIVE for this member)
                       or 0 if the member has no ACTIVE enrollment
      if   max_rank_order >= 5: member_pct = 0.15
      elif max_rank_order >= 2: member_pct = 0.10
      else:                     member_pct = 0.00
      # ROUNDING ORDER PINNED: per-line-item discount, round_half_up each line,
      # then sum. (round-per-line-then-sum, NOT sum-then-round.)
      net_cents = sum over line_items of
                    ( unit_price_cents*qty
                      - round_half_up(unit_price_cents*qty * member_pct) )
    input_set: "the order's line_items; the member's ACTIVE enrollments for belt-rank tier"
    constants:
      BELT_TIER_HIGH_PCT: 0.15
      BELT_TIER_MID_PCT: 0.10
      HIGH_RANK_ORDER: 5
      MID_RANK_ORDER: 2
      ROUNDING: "round_half_up, per-line-item then sum"
    precision: "integer cents; round_half_up applied per line item BEFORE summing"

  - name: early_termination_buyout
    trigger: "on Contract terminate (POST /dojo/contracts/{id}/terminate) or member withdraw, when months_billed < term_months, generating a BUYOUT Invoice"
    algorithm: tiered_pricing
    formula: |
      remaining = Contract.term_months - Contract.months_billed   # whole months left
      monthly = recurring_tuition_charge for this contract (uses locked_family_discount_pct)
      # buyout = BUYOUT_RATE of the remaining monthly value, but capped:
      raw = round_half_up(remaining * monthly * BUYOUT_RATE)
      buyout_cents = min(raw, BUYOUT_CAP_CENTS)
      # EVALUATION ORDER PINNED: compute monthly (which itself needs the discount),
      # THEN multiply by remaining and BUYOUT_RATE, THEN apply the cap.
    input_set: "the terminating Contract and its Program/locked discount"
    constants:
      BUYOUT_RATE: 0.50
      BUYOUT_CAP_CENTS: 50000
      ROUNDING: "round_half_up after the rate multiply, before the cap"
    precision: "integer cents"
    variants:
      - name: provisional_buyout
        when: "GET /dojo/contracts/{id}/buyout-quote (what-if, contract still ACTIVE)"
        difference: "uses LIVE family discount tier (current roster) to project monthly, so the quote can differ from the actual charge"
      - name: final_buyout
        when: "the BUYOUT Invoice actually generated at terminate/withdraw time"
        difference: "uses the contract's PINNED locked_family_discount_pct; final number is authoritative and may differ from an earlier provisional quote"

  - name: testing_eligibility_score
    trigger: "GET /dojo/enrollments/{id}/test-eligibility and as a precondition on POST /dojo/promotion-tests"
    algorithm: weighted_scoring
    formula: |
      # Multi-factor gate (>=3 inputs, non-linear: all gates AND-combined, plus a
      # derived readiness score for ordering candidates). Eligible iff ALL hold:
      g1 = enrollment.rank_attendance_count >= Program.min_attendance_for_test
      g2 = whole_days_between(enrollment.rank_acquired_at, now) >= Program.min_days_in_rank
      g3 = owning Member.account_status == ACTIVE
      g4 = owning Member.waiver_signed == true
      g5 = owning Member.outstanding_balance_cents <= TEST_BALANCE_CEILING_CENTS
      g6 = current BeltRank.next_rank_code != null  (not already at terminal rank)
      eligible = g1 AND g2 AND g3 AND g4 AND g5 AND g6
      # readiness_score (for reporting / ranking eligible candidates):
      readiness = min(100,
                      round_half_up(40 * (rank_attendance_count / max(1, min_attendance_for_test))
                                    + 60 * (days_in_rank / max(1, min_days_in_rank))))
      # readiness caps at 100; both ratios clamp at 1.0 before weighting
    input_set: "the enrollment, its program thresholds, the owning member's status/balance/waiver"
    constants:
      TEST_BALANCE_CEILING_CENTS: 10000
      ATTENDANCE_WEIGHT: 40
      DAYS_WEIGHT: 60
      ROUNDING: "round_half_up on readiness"
    precision: "readiness integer 0..100"

  - name: tournament_division
    trigger: "on TournamentRegistration creation (POST /dojo/tournament-registrations) to set division"
    algorithm: threshold
    formula: |
      age_years = whole completed years between Member.date_of_birth and event_date
      if   age_years < 13: division = YOUTH
      elif age_years < 18: division = TEEN     # 13..17 inclusive
      elif age_years < 40: division = ADULT    # 18..39 inclusive
      else:                division = MASTERS  # 40+
      # boundary: a competitor turning exactly 18 ON event_date is ADULT (>=18),
      # not TEEN; turning exactly 13 is TEEN, not YOUTH.
    input_set: "Member.date_of_birth, TournamentRegistration.event_date"
    constants:
      TEEN_MIN_AGE: 13
      ADULT_MIN_AGE: 18
      MASTERS_MIN_AGE: 40
    precision: "integer years, floor of completed years"

  - name: private_lesson_charge
    trigger: "on PrivateLesson.CONFIRMED_to_COMPLETED (POST /dojo/private-lessons/{id}/complete) generating a PRIVATE_LESSON Invoice"
    algorithm: tiered_pricing
    formula: |
      duration_minutes = minutes between starts_at and ends_at (ends_at exclusive)
      # EVALUATION ORDER PINNED: compute raw fractional-hour charge first, round
      # ONCE at the end (sum-then-round, the OPPOSITE order to pro_shop_pricing).
      raw = hourly_rate_cents * (duration_minutes / 60)
      amount_due_cents = round_half_up(raw)
    input_set: "the single PrivateLesson"
    constants:
      ROUNDING: "round_half_up, applied ONCE after the multiply (sum-then-round)"
    precision: "integer cents, single rounding at the end"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every foreign-key id in the request body references an existing resource"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints with FK fields"
  - priority: 5
    category: business_constraint
    check: "request body has all required fields with valid types/enums/ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 6
    category: business_constraint
    check: "Member.email and Instructor.email are globally unique within their type; BeltRank.code and rank_order unique within program"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /dojo/members, POST /dojo/instructors, POST /dojo/programs/{id}/belt-ranks"
  - priority: 7
    category: state
    check: "OCC: when expected_<parent>_version is supplied, it must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dojo/contracts, POST /dojo/enrollments, and all version-guarded transition endpoints"
  - priority: 8
    category: state
    check: "the target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: business_safety
    check: "the acting/owning Member has waiver_signed == true (safety gate) before attendance check-in, promotion-test scheduling, and tournament registration"
    error_id: ERR_WAIVER_NOT_SIGNED
    http_status: 422
    applies_to: "POST /dojo/attendances, POST /dojo/promotion-tests, POST /dojo/tournament-registrations"
  - priority: 10
    category: business_safety
    check: "the acting/owning Member.account_status must be ACTIVE for attendance check-in, promotion-test scheduling, private-lesson booking, and tournament registration (FROZEN/SUSPENDED/WITHDRAWN are blocked)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /dojo/attendances, POST /dojo/promotion-tests, POST /dojo/private-lessons, POST /dojo/tournament-registrations"
  - priority: 11
    category: business_referential
    check: "a promotion test's enrollment must be ACTIVE and its current BeltRank must have a non-null next_rank_code (not already terminal)"
    error_id: ERR_RANK_TERMINAL
    http_status: 422
    applies_to: "POST /dojo/promotion-tests"
  - priority: 12
    category: business_fiscal
    check: "promotion-test scheduling: member.outstanding_balance_cents must be <= TEST_BALANCE_CEILING_CENTS (10000)"
    error_id: ERR_TEST_BALANCE_TOO_HIGH
    http_status: 422
    applies_to: "POST /dojo/promotion-tests"
  - priority: 13
    category: business_constraint
    check: "promotion-test eligibility: rank_attendance_count >= Program.min_attendance_for_test AND days-in-rank >= Program.min_days_in_rank"
    error_id: ERR_NOT_ELIGIBLE_FOR_TEST
    http_status: 422
    applies_to: "POST /dojo/promotion-tests"
  - priority: 14
    category: business_constraint
    check: "interval well-formedness: ends_at strictly after starts_at; pro-shop line_items non-empty with positive qty; term_months in {3,6,12,24}; billing_anchor_day 1..28; score 0..100"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /dojo/class-sessions, POST /dojo/private-lessons, POST /dojo/pro-shop-orders, POST /dojo/contracts, POST /dojo/promotion-tests/{id}/grade"
  - priority: 15
    category: business_temporal
    check: "a ClassSession/PrivateLesson interval [starts_at, ends_at) must not overlap another booking on the SAME instructor (half-open adjacency allowed: ends_at == next starts_at is OK)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dojo/class-sessions, POST /dojo/private-lessons/{id}/confirm"
  - priority: 16
    category: business_constraint
    check: "class check-in: the member's Enrollment.program_id must equal the ClassSession.program_id"
    error_id: ERR_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /dojo/attendances"
  - priority: 17
    category: business_temporal
    check: "class capacity: a check-in is rejected when ClassSession.confirmed_count would exceed capacity (confirmed_count + 1 > capacity); aggregate capacity semantics"
    error_id: ERR_CLASS_FULL
    http_status: 409
    applies_to: "POST /dojo/attendances"
  - priority: 18
    category: business_constraint
    check: "a member may hold at most one CONFIRMED Attendance per ClassSession (no duplicate check-in)"
    error_id: ERR_ALREADY_CHECKED_IN
    http_status: 409
    applies_to: "POST /dojo/attendances"
  - priority: 19
    category: business_temporal
    check: "tournament registration requires event_date strictly in the future relative to the current clock"
    error_id: ERR_EVENT_IN_PAST
    http_status: 422
    applies_to: "POST /dojo/tournament-registrations"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:

  # ----- Programs & belt ranks -----
  - method: POST
    path: "/dojo/programs"
    description: "Create a martial-arts program."
    roles: [FrontDesk]
    code: 201
    input: [name, discipline, base_monthly_tuition_cents, test_fee_cents, min_attendance_for_test, min_days_in_rank]
    output: Program
    side_effects: ["program created in ACTIVE status"]
  - method: GET
    path: "/dojo/programs/{id}"
    description: "Fetch a program."
    roles: [FrontDesk, Instructor, ChiefInstructor, Member]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/dojo/programs"
    description: "List programs (paginated)."
    roles: [FrontDesk, Instructor, ChiefInstructor, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/dojo/programs/{id}/archive"
    description: "Archive a program (no new enrollments)."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Program
    side_effects: ["program.status = ARCHIVED"]
  - method: POST
