              captures: { claim2_v: $.data.version }
            - call: "POST /brand-protection/evidence-packages"
              payload: { claim_id: "${claim2_id}", package_ref: "PKG-2", expected_claim_version: "${claim2_v}" }
              as: EnforcementAnalyst
              captures: { pkg2_id: $.data.id }
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/items"
              payload: { item_type: "LISTING_SCREENSHOT", item_ref: "SS-2" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/items"
              payload: { item_type: "REGISTRATION_CERTIFICATE", item_ref: "CERT-2" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/items"
              payload: { item_type: "MARK_COMPARISON", item_ref: "CMP-2" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/items"
              payload: { item_type: "CUSTOMER_COMPLAINT", item_ref: "CC-2" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/items"
              payload: { item_type: "SHIPPING_LABEL_PHOTO", item_ref: "SHIP-2" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg2_id}/seal"
              as: EnforcementAnalyst
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "${enr_id}", claim_id: "${claim2_id}", evidence_package_id: "${pkg2_id}" }
              as: EnforcementAnalyst
              captures: { td2_id: $.data.id }
            - call: "POST /brand-protection/takedowns/${td2_id}/submit"
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
            - call: "POST /brand-protection/takedowns/${td2_id}/marketplace-decision"
              payload: { decision: "REMOVED", marketplace_case_ref: "MP-2" }
              as: MarketplaceLiaison
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T09:00:00Z" }
              as: MarketplaceLiaison
            - call: "POST /brand-protection/counter-notices"
              payload: { takedown_id: "${td2_id}", seller_id: "${seller_id}", sworn_statement_ref: "CN-SWORN-1" }
              as: MarketplaceLiaison
              captures: { cn_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/counter-notices/${cn_id}/resolve"
              payload: { resolution: "REBUTTED", rebuttal_ref: "REB-1" }
              as: MarketplaceLiaison
            - call: "POST /brand-protection/counter-notices"
              payload: { takedown_id: "${td2_id}", seller_id: "${seller_id}", sworn_statement_ref: "CN-SWORN-2" }
              as: MarketplaceLiaison
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/ops/run-enforcement-sweep"
              as: BrandAdministrator
          assert:
            - "CounterNotice.${cn_id}.status == REBUTTED with resolved_at == 2026-08-19T09:00:00Z and rebuttal_ref == REB-1"
            - "TakedownSubmission.${td2_id}.status == APPROVED_REMOVED"
            - "TakedownSubmission.${td2_id}.counter_notice_deadline_at == 2026-08-31T09:00:00Z (the deadline is not extended by the round trip)"
            - "MonitoredListing.${listing2_id}.enforcement_status == REMOVED and InfringementClaim.${claim2_id}.status == ENFORCED"
            - "Seller.${seller_id}.standalone_strike_points == 25.10 and cluster_strike_points == 25.10 (never 37.65)"
            - "Seller.${seller_id}.status == UNDER_INVESTIGATION"
            - "the second counter notice returns HTTP 409 with error_id ERR_DUPLICATE_COUNTER_NOTICE"
            - "the sweep response returns expired_counter_notice_count 0 and cd_ignored_case_count 0, and Seller.${seller_id}.cluster_strike_points is still 25.10 afterwards"
            - "GET /brand-protection/brands/${brand_id}/enforcement-metrics returns listing_removal_rate 1.0000, decided_takedown_count 2, removed_takedown_count 2, repeat_infringer_count 1, open_case_count 1"
