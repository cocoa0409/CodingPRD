      - name: intake_at_window_end_inclusive
        grounds:
          - validations[priority=9]
          - errors[ERR_OUTSIDE_COLLECTION_WINDOW]
          - endpoints["POST /intake-events"]
          - entities.IntakeEvent.fields.recorded_at
        distinguishing_aspect: |
          TIME boundary on the collection-window metric via POST /intake-events (a
          different metric and endpoint than route_capacity_exact_fit): an intake
          recorded at exactly window_end (2027-01-16T23:59:59Z, closed interval) is
