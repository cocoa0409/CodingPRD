roles:
  - name: SystemAdmin
    description: Platform operator role for the logical clock (test-driving surface).
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
  - name: RulemakingOfficer
    description: Rule-development staff; drafts and shepherds rule proposals through comment and submission.
    identity: opaque
    exclusive_operations: ["POST /msrb/rule-proposals", "PATCH /msrb/rule-proposals/{id}", "POST /msrb/rule-proposals/{id}/open-comment-period", "POST /msrb/rule-proposals/{id}/submit-for-approval"]
    shared_operations: ["GET /msrb/rule-proposals", "GET /msrb/rule-proposals/{id}", "GET /msrb/rule-proposals/{id}/comment-letters"]
  - name: Regulator
    description: Approving authority; decides submitted rule proposals. Segregated from the submitting officer.
    identity: opaque
    exclusive_operations: ["POST /msrb/rule-proposals/{id}/decide"]
    shared_operations: ["GET /msrb/rule-proposals", "GET /msrb/rule-proposals/{id}", "GET /msrb/rule-proposals/{id}/comment-letters", "GET /msrb/enforcement-referrals", "GET /msrb/enforcement-referrals/{id}"]
  - name: PortalOperator
    description: Disclosure-portal operations staff; registers organizations, moderates comment letters, reviews disclosure submissions.
    identity: opaque
    exclusive_operations: ["POST /msrb/organizations", "POST /msrb/comment-letters/{id}/moderate", "POST /msrb/disclosure-submissions/{id}/review-outcome"]
    shared_operations: ["GET /msrb/organizations/{id}", "GET /msrb/rule-proposals", "GET /msrb/rule-proposals/{id}", "GET /msrb/rule-proposals/{id}/comment-letters", "GET /msrb/disclosure-submissions", "GET /msrb/disclosure-submissions/{id}", "GET /msrb/trade-reports", "GET /msrb/trade-reports/{id}", "GET /msrb/organizations/{id}/solicitation-records"]
  - name: ComplianceOfficer
    description: Enforcement staff; suspends organizations, manages professional standing, opens and advances enforcement referrals (closing requires a different officer than the creator).
    identity: opaque
    exclusive_operations: ["POST /msrb/organizations/{id}/suspend", "POST /msrb/professionals/{id}/standing", "POST /msrb/enforcement-referrals", "POST /msrb/enforcement-referrals/{id}/advance"]
    shared_operations: ["GET /msrb/organizations/{id}", "GET /msrb/rule-proposals", "GET /msrb/rule-proposals/{id}", "GET /msrb/rule-proposals/{id}/comment-letters", "GET /msrb/disclosure-submissions", "GET /msrb/disclosure-submissions/{id}", "GET /msrb/professionals", "GET /msrb/professionals/{id}", "GET /msrb/professionals/{id}/exam-attempts", "GET /msrb/trade-reports", "GET /msrb/trade-reports/{id}", "GET /msrb/data-subscriptions", "GET /msrb/data-subscriptions/{id}", "GET /msrb/enforcement-referrals", "GET /msrb/enforcement-referrals/{id}", "GET /msrb/organizations/{id}/solicitation-records"]
  - name: ExamAdmin
    description: Qualification administrator; registers professionals, records exam attempts and CE credits.
    identity: opaque
    exclusive_operations: ["POST /msrb/professionals", "POST /msrb/exam-attempts", "POST /msrb/professionals/{id}/ce-credits"]
    shared_operations: ["GET /msrb/organizations/{id}", "GET /msrb/professionals", "GET /msrb/professionals/{id}", "GET /msrb/professionals/{id}/exam-attempts"]
  - name: LicensingOfficer
    description: Market-data licensing staff; creates and advances data subscriptions.
    identity: opaque
    exclusive_operations: ["POST /msrb/data-subscriptions", "POST /msrb/data-subscriptions/{id}/transition"]
    shared_operations: ["GET /msrb/organizations/{id}", "GET /msrb/data-subscriptions", "GET /msrb/data-subscriptions/{id}"]
  - name: IssuerRep
    description: Filing representative of an issuer or obligated-person organization; X-User-ID equals the Organization.id of the filing organization.
    identity: "entity_backed:Organization"
    exclusive_operations: ["POST /msrb/disclosure-submissions"]
    shared_operations: ["GET /msrb/disclosure-submissions (own org only)", "GET /msrb/disclosure-submissions/{id} (own org only)"]
  - name: DealerRep
    description: Operations representative of a broker-dealer or municipal-advisor organization; X-User-ID equals the Organization.id of the firm.
    identity: "entity_backed:Organization"
    exclusive_operations: ["POST /msrb/trade-reports", "POST /msrb/trade-reports/{id}/cancel", "POST /msrb/solicitation-records"]
    shared_operations: ["GET /msrb/trade-reports (own org only)", "GET /msrb/trade-reports/{id} (own org only)", "GET /msrb/organizations/{id}/solicitation-records (own org only)"]
  - name: MarketDataSubscriber
    description: Licensed data subscriber principal; X-User-ID equals an ACTIVE DataSubscription's subscriber_principal for the requested product.
    identity: opaque
    exclusive_operations: ["GET /msrb/data-feeds/{product_code}"]
    shared_operations: []
  - name: PublicReader
    description: Unauthenticated-equivalent public access role (free public dissemination); submits comment letters and reads published disclosures / disseminated trades.
    identity: opaque
    exclusive_operations: ["POST /msrb/rule-proposals/{id}/comment-letters"]
    shared_operations: ["GET /msrb/disclosure-submissions (PUBLISHED only)", "GET /msrb/disclosure-submissions/{id} (PUBLISHED only)", "GET /msrb/trade-reports (DISSEMINATED only)", "GET /msrb/trade-reports/{id} (DISSEMINATED only)"]
