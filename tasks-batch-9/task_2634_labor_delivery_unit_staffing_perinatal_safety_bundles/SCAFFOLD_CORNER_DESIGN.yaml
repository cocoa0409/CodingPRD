      - name: decision_to_incision_precision_at_the_thirty_minute_pass_edge
        claim_type: Precision
        grounds:
          - calculations.decision_to_incision_measurement
          - entities.CesareanReadinessDrill.fields.measured_d2i_minutes
          - validations[11.4]
        excluded_because:
          difficulty_instance: boundary_precision_check / drill_pass_threshold_admits_thirty_minutes_fifty_nine_seconds_and_refuses_thirty_one_minutes_flat
          rationale: |
            The rounding mode and the inclusive <= 30 pass gate of decision_to_incision_measurement are
            the entire subject of the §1.8 boundary_precision_check instance, which drives two drills to
            30 minutes 59 seconds and to 31 minutes flat and shows that the first validates while the
            second is refused with ERR_DRILL_PERFORMANCE_FAILED. Any §1.9 Precision instance on this
            calculation would restate a strictly weaker version of that pair.

      - name: quality_measure_rate_variants_diverge_on_the_same_september_cohort
        claim_type: Variant Divergence
        grounds:
          - calculations.quality_measure_rates
          - entities.QualityMeasureSnapshot.fields.ntsv_cesarean_rate_pct
          - entities.QualityMeasureSnapshot.fields.shadow_ntsv_rate_pct
          - entities.QualityMeasureSnapshot.fields.attribution_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / september_snapshot_delivery_cohort_33_3333_vs_admission_shadow_0_0000
          rationale: |
            quality_measure_rates carries the two attribution variants — delivery-date cohort versus
            admission-date shadow — and the §1.8 dual_variant_calc instance already builds the cohort
            that makes them disagree maximally on one window, 33.3333 against 0.0000, with the four-decimal
            precision on both. A §1.9 Variant Divergence instance on this calculation would only
            re-derive the same two numbers from a smaller cohort.

      - name: bundle_timeliness_diverges_between_the_activation_and_sequence_anchors
        claim_type: Variant Divergence
        grounds:
          - calculations.bundle_intervention_timeliness
          - entities.SafetyBundleActivation.fields.timeliness_score
          - entities.SafetyBundleActivation.fields.sequence_adjusted_score
          - entities.BundleChecklistItem.fields.due_at_sequence_anchored
        excluded_because:
          difficulty_instance: dual_variant_calc / hypertension_bundle_activation_anchored_100_vs_sequence_anchored_87_50
          rationale: |
            The pair of scores that bundle_intervention_timeliness produces from the two due-date anchors
            is exactly the §1.8 dual_variant_calc probe: a SEVERE_HYPERTENSION bundle whose steps are all
            on time against the cumulative activation anchor yet late against the predecessor-chained
            anchor, yielding 100 beside 87.50. This section's contribution on the checklist template is
            the minting and anchoring arithmetic itself, not the scoring divergence.

      - name: induction_day_budget_boundary_is_inclusive_at_the_declared_maximum
        claim_type: Constants Applied
        grounds:
          - calculations.induction_capacity_projection
          - entities.ObstetricUnit.fields.max_daily_induction_bed_minutes
          - entities.ObstetricUnit.fields.held_bed_minutes_by_day
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - validations[15]
        excluded_because:
          difficulty_instance: boundary_precision_check / day_bed_minute_budget_rejects_1290_against_1289_and_admits_1290_against_1290
          rationale: |
            The inclusive day_load + projected_occupancy_minutes <= max_daily_induction_bed_minutes test
            is the §1.8 boundary_precision_check instance, which pins the same 1290-minute hold against a
            1289-minute budget (refused) and a 1290-minute budget (admitted). The §1.9 coverage of this
            constant is therefore limited to the 2880 default itself, asserted in the entities section.

      - name: acuity_load_conservation_holds_across_a_bundle_rescind
        claim_type: Correct Result
        grounds:
          - calculations.acuity_load_conservation
          - calculations.care_assignment_unit_debit
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.SafetyBundleActivation.fields.status
        excluded_because:
          difficulty_instance: compensating_invariant / bundle_rescind_returns_the_shared_shift_load_to_1_3_not_to_zero_and_not_to_2_8
          rationale: |
            acuity_load_conservation is a conserved-quantity invariant, and the §1.8 compensating_invariant
            instance already exercises its hardest direction: a rescind that must credit back exactly the
            escalated debit and land the shared shift at 1.3, distinguishing that from the two plausible
            wrong answers of 0.0 and 2.8. The re-pricing arithmetic that feeds the invariant is covered
            here by the in-place LATENT re-price instance instead.

      - name: induction_bed_minute_conservation_across_bump_and_cancel
        claim_type: Correct Result
        grounds:
          - calculations.induction_bed_minute_conservation
          - calculations.induction_capacity_projection
          - entities.ObstetricUnit.fields.held_bed_minutes_by_day
          - entities.ObstetricUnit.fields.committed_bed_minutes_by_day
          - entities.InductionBooking.fields.projected_occupancy_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / bump_and_cancel_credit_back_the_hold_time_frozen_645_and_375_while_the_untouched_165_stays_committed
          rationale: |
            The claim that a bump and a cancel each credit back exactly the FROZEN
            projected_occupancy_minutes — not a recomputed figure — while an untouched booking's committed
            minutes stay put is the §1.8 compensating_invariant instance with its 645 / 375 / 165
            arithmetic. Reproducing it in §1.9 would require the same posture-dependent hold chain and
            would assert a subset of the same ledger equalities.

  - section: validations
    instances:
      - name: unknown_x_user_role_is_rejected_at_priority_1_before_the_permission_check_at_priority_2
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - endpoints[POST /obstetric-units]
        distinguishing_aspect: |
          The ladder's first two rungs are both "who are you" checks and an implementation that
          resolves the role string inside the RBAC check would collapse them: an unparseable
          X-User-Role would look like "a role that is not in the allow-list" and answer 403
          ERR_INSUFFICIENT_PERMISSIONS. Priority 1 demands 400
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER for a header value that is not one of the six
          §1.7 roles, even on an endpoint whose allow-list would have rejected the caller anyway.
          The follow-up list proves the rejection was total — no ObstetricUnit row was written.
        test_recipe:
          setup: |
            Empty database; only the logical clock is pinned. No unit exists, so the follow-up list
            call distinguishes "rejected before the write" from "written then hidden".
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: UnitDirector
              as_user_id: "unit-director-01"
              captures: { err: $.data.error_id }
            - call: GET /obstetric-units
              payload: { limit: 10, offset: 0 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          assert:
            - "HTTP 400 on the POST /obstetric-units call"
            - "error_id == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\""
            - "error_id != \"ERR_INSUFFICIENT_PERMISSIONS\""
            - "the GET /obstetric-units response body contains exactly 0 ObstetricUnit rows"

      - name: insufficient_permissions_at_priority_2_outranks_a_nonexistent_bed_id_at_priority_3
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - errors[ERR_BED_NOT_FOUND]
          - endpoints[DELETE /beds/{bedId}]
          - roles[PerinatalSafetyOfficer]
        distinguishing_aspect: |
          DELETE /beds/{bedId} is a PerinatalSafetyOfficer-exclusive operation. A natural
          implementation loads the path resource first (so it can 404 early) and only then consults
          the role allow-list, which would leak the existence — or non-existence — of a bed to a
          caller with no rights to the endpoint at all. Priority 2 sits strictly above priority 3,
          so a ChargeNurse naming a bed id that was never minted must receive 403
          ERR_INSUFFICIENT_PERMISSIONS, not 404 ERR_BED_NOT_FOUND. The same call by the officer
          against the same id is the control that proves the id really is unknown.
        test_recipe:
          setup: |
            Empty database beyond the pinned clock. No Bed row exists at all, so the 404 branch is
            genuinely available and only the priority order suppresses it.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: DELETE /beds/bed-never-minted-0001
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { rbac_err: $.data.error_id }
            - call: DELETE /beds/bed-never-minted-0001
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { notfound_err: $.data.error_id }
          assert:
            - "HTTP 403 on the ChargeNurse DELETE call"
            - "the ChargeNurse call returns error_id == \"ERR_INSUFFICIENT_PERMISSIONS\""
            - "HTTP 404 on the PerinatalSafetyOfficer DELETE call"
            - "the PerinatalSafetyOfficer call returns error_id == \"ERR_BED_NOT_FOUND\""

      - name: nonexistent_path_encounter_at_priority_3_outranks_the_nonexistent_body_bed_id_at_priority_4
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_ENCOUNTER_NOT_FOUND]
          - errors[ERR_BED_NOT_FOUND]
          - endpoints[POST /labor-encounters/{encounterId}/assign-bed]
        distinguishing_aspect: |
          assign-bed carries one id in the path and one in the body, and §1.4 splits them across two
          rungs: path ids at priority 3, body ids at priority 4. An implementation that validates the
          request body first (the usual framework order — deserialize, resolve references, then load
          the route resource) would answer ERR_BED_NOT_FOUND when BOTH ids are bogus. The control
          call — a real encounter with the same bogus bed id — proves ERR_BED_NOT_FOUND is reachable
          and that only the priority order suppressed it in the first call.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed and one ANTEPARTUM encounter that has no bed
            attached yet, so the control call reaches priority 4 with every earlier rung satisfied.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-LADDER-3004", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
          trigger:
            - call: POST /labor-encounters/enc-never-admitted-0001/assign-bed
              payload: { bed_id: "bed-never-minted-0002" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { path_err: $.data.error_id }
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "bed-never-minted-0002" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { body_err: $.data.error_id }
          assert:
            - "HTTP 404 on both calls"
            - "the first call returns error_id == \"ERR_ENCOUNTER_NOT_FOUND\""
            - "the first call does NOT return error_id \"ERR_BED_NOT_FOUND\""
            - "the second call returns error_id == \"ERR_BED_NOT_FOUND\""
            - "Bed.${bed_ldr_1}.status == \"AVAILABLE\""
            - "LaborEncounter.${enc_id}.bed_id == null"

      - name: stale_encounter_version_at_priority_6_outranks_the_cross_unit_shift_reference_at_priority_7
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - concurrency_rules[care-assignment-stale-encounter]
          - errors[ERR_STALE_ENCOUNTER_VERSION]
          - errors[ERR_CROSS_UNIT_REFERENCE]
          - endpoints[POST /care-assignments]
        distinguishing_aspect: |
          Both rungs reject the same call, and the cross-aggregate scoping check is the cheaper one
          to run (a single join on shift.unit_id) so an implementation naturally puts it first. §1.4
          puts the OCC guard at 6 and cross-unit scoping at 7, which means a client holding a stale
          read must be told its read is stale — 412 — even though the request it built was also
          referentially wrong. The second half of the trigger re-reads the encounter and repeats the
          identical cross-unit call with a fresh version, so the 422 is proved reachable and the
          412 is proved to be an ordering effect rather than a masking bug.
        test_recipe:
          setup: |
            Two units. Unit A has one AVAILABLE LDR bed and one encounter whose version is captured
            at creation (1) and then bumped to 2 by attaching the bed — so the captured value is
            stale by exactly one. Unit B has an ACTIVE CHARGE shift covering the clock, held by a
            staff member with a valid credential, so priorities 8.08 and 11.1 cannot fire.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_a: $.data.id }
            - call: POST /obstetric-units/${unit_a}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_a_1: $.data.id }
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center Annex", licensed_ldr_beds: 2, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_b: $.data.id }
            - call: POST /obstetric-units/${unit_b}/staff-members
              payload: { full_name: "Dana Alvarez RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_b: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_b}", staff_id: "${staff_b}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_b: $.data.id }
            - call: POST /shift-assignments/${shift_b}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_a}", patient_record_code: "PRC-LADDER-6007", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_a: $.data.id, enc_v_stale: $.data.version }
            - call: POST /labor-encounters/${enc_a}/assign-bed
              payload: { bed_id: "${bed_a_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
          trigger:
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_a}", shift_assignment_id: "${shift_b}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_v_stale}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { occ_err: $.data.error_id }
            - call: GET /labor-encounters/${enc_a}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_v_fresh: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_a}", shift_assignment_id: "${shift_b}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_v_fresh}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { scope_err: $.data.error_id }
          assert:
            - "HTTP 412 on the first POST /care-assignments call"
            - "the first call returns error_id == \"ERR_STALE_ENCOUNTER_VERSION\""
            - "enc_v_stale == 1 and enc_v_fresh == 2"
