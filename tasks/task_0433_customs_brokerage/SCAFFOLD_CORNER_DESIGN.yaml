            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "2106909998", customs_value_cents: 200000, quantity: 1, pga_flag: "FDA" }
              as: LicensedBroker
          trigger:
            - call: "POST /pga-reviews"
              payload: { entry_id: "${entry_id}", agency: "FDA" }
              as: LicensedBroker
              captures: { pga_id: $.data.id, dec: $.data.decision }
            - call: "GET /pga-reviews?entry_id=${entry_id}"
              payload: {}
              as: LicensedBroker
              captures: { total: $.meta.total_count }
          assert:
            - "PGAReview.${pga_id}.decision == PENDING"
            - "GET /pga-reviews?entry_id=${entry_id} returns an array containing ${pga_id}"

      - name: bonds_reverse_reachable_by_importer_filter
        claim_type: Computed read
        grounds:
          - endpoints.GET_/bonds
          - entities.Bond.fields.importer_id
        distinguishing_aspect: "GET /bonds?importer_id=X returns the array of bonds for that importer (FK reverse-reachability for Bond.importer_id)."
        test_recipe:
          setup:
            - "An importer with one bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-EP02", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
