# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Reservation: branching (HELD/CONFIRMED) + terminal fan-out ----
  - entity: Reservation
    field: status
    initial_state: HELD
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW]
    note: "Branching: HELD->CONFIRMED (desk confirm), CONFIRMED->CHECKED_IN requires assigned+inspected room; terminal fan-out to CHECKED_OUT / CANCELLED / NO_SHOW."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /pms/reservations/{id}/confirm"
        actor: FrontDeskAgent
        preconditions:
          - "Reservation.status == HELD"
          - "Hotel.posture == OPEN"
          - "RatePlan.status == ACTIVE (else ERR_RATE_PLAN_MISMATCH)"
          - "If corporate: CorporateAccount.status == ACTIVE (else ERR_CORPORATE_SUSPENDED)"
          - "If corporate: outstanding_balance_cents + projected_charges_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Folio.projected_charges_cents pinned via room_charge_forward (forward-looking variant)"
          - "If group_block_id set: GroupBlock.picked_up_rooms recomputed via block_pickup"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /pms/reservations/{id}/check-in"
        actor: FrontDeskAgent
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "Hotel.posture == OPEN"
          - "Reservation.assigned_room_id is not null (else ERR_NO_ROOM_ASSIGNED)"
          - "assigned Room.housekeeping_status == INSPECTED (else ERR_ROOM_NOT_INSPECTED)"
          - "Hotel.current_business_date >= arrival_date (else ERR_ARRIVAL_NOT_REACHED)"
        side_effects:
          - "assigned Room.housekeeping_status INSPECTED -> OCCUPIED (cross-entity cascade); Room.version +1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /pms/reservations/{id}/check-out"
        actor: FrontDeskAgent
        preconditions:
          - "Reservation.status == CHECKED_IN"
          - "Hotel.posture == OPEN"
          - "Folio.status != DISPUTED (else ERR_FOLIO_DISPUTED_CHECKOUT)"
        side_effects:
          - "Folio.status OPEN -> CLOSED; final folio_balance frozen"
          - "assigned Room.housekeeping_status OCCUPIED -> DIRTY; Room.assigned_reservation_id -> null (cross-entity cascade); Room.version +1"
          - "If Folio.bill_to == CORPORATE: CorporateAccount.outstanding_balance_cents += Folio.balance_cents (ledger sync); CorporateAccount.version +1"
      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /pms/reservations/{id}/cancel"
        actor: "FrontDeskAgent or Guest"
        preconditions:
          - "Reservation.status IN {HELD, CONFIRMED}"
          - "Hotel.posture == OPEN"
        side_effects:
          - "If assigned_room_id set: Room.assigned_reservation_id -> null (cross-entity cascade); Room.version +1; housekeeping_status unchanged"
          - "AvailabilityCell.sold_count recomputed for each covered stay_date (releases inventory) via availability_sellable"
          - "If group_block_id set: GroupBlock.picked_up_rooms recomputed via block_pickup"
          - "Folio.status OPEN -> CLOSED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: night-audit complete, CONFIRMED with arrival_date == business_date and not CHECKED_IN"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "Reservation.arrival_date == NightAuditRun.business_date"
        side_effects:
          - "Post no-show charge per RatePlan.no_show_policy via no_show_charge (cascade onto Folio)"
          - "AvailabilityCell.sold_count recomputed for covered stay_dates (releases inventory)"
          - "If group_block_id set: GroupBlock.picked_up_rooms recomputed via block_pickup"
          - "Folio.status OPEN -> CLOSED"

  # ---- Room housekeeping: cyclic ----
  - entity: Room
    field: housekeeping_status
    initial_state: CLEAN
    terminal_states: []
    note: "Cyclic: DIRTY->CLEAN->INSPECTED->OCCUPIED->DIRTY; OUT_OF_ORDER is a side branch reachable from any non-OCCUPIED, non-OUT_OF_ORDER state."
    transitions:
      - from: DIRTY
        to: CLEAN
        trigger: "POST /pms/rooms/{id}/housekeeping target=CLEAN"
        actor: FrontDeskAgent
        preconditions: ["Room.housekeeping_status == DIRTY"]
        side_effects: ["Room.version +1"]
      - from: CLEAN
        to: INSPECTED
        trigger: "POST /pms/rooms/{id}/housekeeping target=INSPECTED"
        actor: FrontDeskAgent
        preconditions: ["Room.housekeeping_status == CLEAN"]
        side_effects: ["Room.version +1"]
      - from: INSPECTED
        to: OCCUPIED
        trigger: "system: reservation check-in"
        actor: system
        preconditions: ["Room.housekeeping_status == INSPECTED"]
        side_effects: ["Room.version +1"]
      - from: OCCUPIED
        to: DIRTY
        trigger: "system: reservation check-out"
        actor: system
        preconditions: ["Room.housekeeping_status == OCCUPIED"]
        side_effects: ["Room.version +1"]
      - from: [DIRTY, CLEAN, INSPECTED]
        to: OUT_OF_ORDER
        trigger: "POST /pms/rooms/{id}/housekeeping target=OUT_OF_ORDER"
        actor: RevenueManager
        preconditions:
          - "Room.housekeeping_status IN {DIRTY, CLEAN, INSPECTED}"
          - "Room.assigned_reservation_id is null (else ERR_ROOM_NOT_ASSIGNABLE)"
        side_effects:
          - "AvailabilityCell.sellable_count recomputed for this room's type (removes one sellable room) via availability_sellable"
          - "Room.version +1"
      - from: OUT_OF_ORDER
        to: CLEAN
        trigger: "POST /pms/rooms/{id}/housekeeping target=CLEAN"
        actor: RevenueManager
        preconditions: ["Room.housekeeping_status == OUT_OF_ORDER"]
        side_effects:
          - "AvailabilityCell.sellable_count recomputed for this room's type (restores one sellable room) via availability_sellable"
          - "Room.version +1"

  # ---- GroupBlock: branching with wash ----
  - entity: GroupBlock
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "OPEN accepts pickups; cutoff wash releases remainder to WASHED; CLOSED locks the block."
    transitions:
      - from: OPEN
        to: WASHED
        trigger: "system: night-audit complete, new current_business_date > GroupBlock.cutoff_date"
        actor: system
        preconditions:
          - "GroupBlock.status == OPEN"
          - "new current_business_date > cutoff_date"
        side_effects:
          - "washed_rooms = max(blocked_rooms - picked_up_rooms, 0) via block_wash"
          - "AvailabilityCell.sold_count for the block's room_type recomputed across covered dates (washed rooms return to general sale)"
      - from: [OPEN, WASHED]
        to: CLOSED
        trigger: "POST /pms/group-blocks/{id}/close"
        actor: RevenueManager
        preconditions:
          - "GroupBlock.status IN {OPEN, WASHED}"
          - "No reservation attached to this block is HELD (else ERR_BLOCK_HAS_PENDING_PICKUPS)"
        side_effects:
          - "Block no longer accepts pickups"

  # ---- Folio: parallel to Reservation; DISPUTED revert ----
  - entity: Folio
    field: status
    initial_state: OPEN
    terminal_states: []
    note: "Runs parallel to the Reservation lifecycle; DISPUTED is a revert/hold branch off OPEN; CLOSED set by terminal reservation transitions."
    transitions:
      - from: OPEN
        to: DISPUTED
        trigger: "POST /pms/folios/{id}/dispute"
        actor: FrontDeskAgent
        preconditions:
          - "Folio.status == OPEN"
          - "Hotel.posture == OPEN"
        side_effects:
          - "Folio frozen: no new Incidental postings accepted (ERR_FOLIO_NOT_OPEN)"
          - "Reservation check-out blocked while DISPUTED (ERR_FOLIO_DISPUTED_CHECKOUT)"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /pms/folios/{id}/resolve"
        actor: FrontDeskAgent
        preconditions:
          - "Folio.status == DISPUTED"
          - "Hotel.posture == OPEN"
        side_effects:
          - "Folio re-opened for postings and checkout"
      - from: OPEN
        to: CLOSED
        trigger: "system: reservation check-out / no-show / cancel"
        actor: system
        preconditions:
          - "Folio.status == OPEN"
        side_effects:
          - "Final balance frozen; no further postings"

  # ---- NightAuditRun: epoch with abort branch ----
  - entity: NightAuditRun
    field: status
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, ABORTED]
    note: "Audit epoch; IN_PROGRESS locks hotel posture to AUDIT_LOCK."
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pms/night-audit-runs/{id}/complete"
        actor: NightAuditor
        preconditions:
          - "NightAuditRun.status == IN_PROGRESS"
          - "No CHECKED_IN reservation departing today (departure_date == business_date) has an OPEN or DISPUTED folio (else ERR_AUDIT_BLOCKED_OPEN_BALANCE)"
        side_effects:
          - "No-show sweep: CONFIRMED arrivals today not CHECKED_IN -> NO_SHOW (+ no_show_charge)"
          - "Room-charge posting: each CHECKED_IN reservation gets a nightly NIGHT_AUDIT charge Incidental (room_charge_chronological)"
          - "Hotel.current_business_date += 1 day; Hotel.audit_epoch += 1; Hotel.version +1"
          - "GroupBlock wash: blocks with cutoff_date < new current_business_date -> WASHED (block_wash)"
          - "Hotel.posture AUDIT_LOCK -> OPEN"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /pms/night-audit-runs/{id}/abort"
        actor: NightAuditor
        preconditions:
          - "NightAuditRun.status == IN_PROGRESS"
        side_effects:
          - "No date advance; no postings; Hotel.posture AUDIT_LOCK -> OPEN; Hotel.version +1"

  # ---- CorporateAccount: gating ----
  - entity: CorporateAccount
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pms/corporate-accounts/{id}/suspend"
        actor: RevenueManager
        preconditions: ["CorporateAccount.status == ACTIVE"]
        side_effects:
          - "Blocks confirm of new corporate reservations on this account (ERR_CORPORATE_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pms/corporate-accounts/{id}/reinstate"
        actor: RevenueManager
        preconditions: ["CorporateAccount.status == SUSPENDED"]
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-assign-stale-room
    parent_entity: Room
    write_endpoint: "POST /pms/reservations/{id}/assign-room"
    occ_field: "expected_room_version"
    description: |
      Assigning a Room to a Reservation when the Room's version has advanced
      since the client last observed it is rejected. This captures the case
      where another agent has just bound that physical room to a different
      reservation (legitimately succeeding under the assignment rules), so the
      current caller's view of the room is stale.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: groupblock-pickup-stale-block
    parent_entity: GroupBlock
    write_endpoint: "POST /pms/reservations"
    occ_field: "expected_group_block_version"
    description: |
      Creating a Reservation that picks up from a GroupBlock whose version has
      advanced since the client last observed it is rejected. This captures the
      case where the block's allotment was just changed by another pickup or a
      cutoff wash that legitimately altered the block, so the current caller's
      view of the block is stale.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- nightly_rate helper (combinatorial mode (b): per-night rounding order pinned) ---
  - name: nightly_rate
    trigger: "room_charge_forward, room_charge_chronological, no_show_charge"
    algorithm: tiered_pricing
    formula: |
      base = room_type.base_rate_cents
      if rate_plan.adjustment_mode == PCT:
        # PCT rounding is round_half_up to whole cents PER NIGHT, BEFORE any
        # multiplication by nights. Rounding order is pinned: round-per-night,
        # then multiply; never sum-then-round.
        nightly = round_half_up(base * (1 + adjustment_value/100))
      else:  # FLAT
        nightly = base + adjustment_value
      nightly = max(nightly, RATE_FLOOR_CENTS)   # floor at 0
      return nightly
      # PACKAGE per-stay fee is NOT folded here; room_charge_forward adds it once.
    input_set: "Single room type + single rate plan"
    constants: { RATE_FLOOR_CENTS: 0 }
    precision: "round_half_up to whole cents on the PER-NIGHT PCT result, THEN multiply by nights (round-then-multiply, pinned)"
    variants: []

  # --- DUAL-VARIANT pair #1 (room charge: forward vs chronological, same Reservation domain) ---
  - name: room_charge_forward
    trigger: "Reservation HELD->CONFIRMED (confirm); paid upgrade"
    algorithm: forward_looking
    formula: |
      nightly = nightly_rate(rate_plan, effective_room_type_at_confirm)
      projected_charges_cents = nightly * nights
        + (package_fee_cents if rate_plan.kind == PACKAGE else 0)
      # nights = (departure_date - arrival_date) days; one rate snapshot for the whole stay.
    input_set: "All nights in [arrival_date, departure_date); single confirmation-time rate snapshot"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_projection
        when: "at confirmation / paid upgrade"
        difference: "Projects the whole stay with one rate snapshot; ignores later per-night divergence."

  - name: room_charge_chronological
    trigger: "NightAuditRun complete (per CHECKED_IN reservation, one night)"
    algorithm: chronological
    formula: |
      nightly = nightly_rate(rate_plan, effective_room_type)   # re-read effective type AT post time
      Post Incidental(kind=CHARGE, posted_by_kind=NIGHT_AUDIT, amount_cents = nightly)
      room_charges_cents = sum(amount_cents of POSTED NIGHT_AUDIT CHARGE incidentals)
      # One posting per audited night; a mid-stay upgrade changes later nights
      # but not already-posted nights, so the chronological accrual diverges
      # from the forward projection.
    input_set: "One posting per audited night the reservation is CHECKED_IN; effective_room_type re-read each night"
    constants: {}
    precision: "integer cents"
    variants:
      - name: chronological_accrual
        when: "per night audit"
        difference: "Accrues night-by-night at the rate in effect that night; mid-stay upgrade makes later nights diverge from the forward projection."

  # --- no-show charge (combinatorial mode (c): evaluation order pinned) ---
  - name: no_show_charge
    trigger: "Reservation CONFIRMED->NO_SHOW (night audit)"
    algorithm: threshold
    formula: |
      # Evaluation order pinned: nightly_rate resolved FIRST, then the policy
      # multiplier (keyed off RatePlan.no_show_policy) is applied.
      nightly = nightly_rate(rate_plan, room_type_id)
      if no_show_policy == FIRST_NIGHT: charge = nightly * 1
      elif no_show_policy == FULL_STAY: charge = nightly * nights
      else: charge = 0   # NONE
      if charge > 0:
        Post Incidental(kind=CHARGE, posted_by_kind=NIGHT_AUDIT, amount_cents = charge, description="No-show")
    input_set: "The no-showed reservation's plan + booked room type + nights"
    constants: {}
    precision: "integer cents"
    variants:
      - name: first_night
        when: "no_show_policy == FIRST_NIGHT"
        difference: "Charges exactly one nightly rate."
      - name: full_stay
        when: "no_show_policy == FULL_STAY"
        difference: "Charges nightly * nights."

  # --- DUAL-VARIANT pair #2 (folio balance: provisional OPEN vs final CLOSED — Folio money domain) ---
  - name: folio_balance
    trigger: "Incidental post/void, room-charge posting, no_show_charge, check-out"
    algorithm: aggregation
    formula: |
      room_charges_cents = sum(amount_cents of POSTED NIGHT_AUDIT CHARGE incidentals)
      incidentals_cents  = sum(amount_cents of POSTED AGENT incidentals)   # PAYMENT lines stored negative
      payments_cents     = sum(amount_cents of POSTED PAYMENT incidentals) # negative
      balance_cents      = room_charges_cents + incidentals_cents
      # VOIDED lines are excluded from every sum.
    input_set: "All POSTED Incidentals on the folio; VOIDED excluded"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_open
        when: "Folio.status == OPEN before check-out"
        difference: "Reflects only nights posted so far; balance still mutable."
      - name: final_closed
        when: "Folio.status == CLOSED at/after check-out"
        difference: "Balance frozen at the close instant = all posted room charges + incidentals; no later posting alters it."

  # --- block wash ---
  - name: block_wash
    trigger: "GroupBlock OPEN->WASHED (night audit cutoff)"
    algorithm: aggregation
    formula: |
      picked_up_rooms = count(Reservation where group_block_id == block.id AND status NOT IN {CANCELLED, NO_SHOW})
      washed_rooms    = max(blocked_rooms - picked_up_rooms, 0)
    input_set: "Reservations attached to the block, excluding CANCELLED/NO_SHOW"
    constants: {}
    precision: "integer counts"
    variants: []

  # --- block pickup counter ---
  - name: block_pickup
    trigger: "reservation create/confirm/cancel/no-show with group_block_id set"
    algorithm: aggregation
    formula: |
      picked_up_rooms = count(Reservation where group_block_id == block.id AND status NOT IN {CANCELLED, NO_SHOW})
    input_set: "Reservations attached to the block, excluding CANCELLED/NO_SHOW"
    constants: {}
    precision: "integer counts"
    variants: []

  # --- availability / overbooking (threshold + boundary precision) ---
  - name: availability_sellable
    trigger: "reservation create/cancel/no-show; room OUT_OF_ORDER toggle; block wash"
    algorithm: threshold
    formula: |
      ooo = count(Room where room_type_id == T AND housekeeping_status == OUT_OF_ORDER)
      sellable_count = floor(physical_inventory * (1 + hotel.overbooking_allowance_pct)) - ooo
      sold_count = count(Reservation where (effective_room_type_id else room_type_id) == T
                        AND status NOT IN {CANCELLED, NO_SHOW}
                        AND arrival_date <= stay_date < departure_date)
      # A new reservation for night D is REJECTED iff sold_count + 1 > sellable_count.
      # Selling the sellable_count-th room is allowed; the (sellable_count+1)-th is ERR_NO_AVAILABILITY.
    input_set: "Per (room_type, stay_date) night across the requested interval"
    constants: {}
    precision: "floor for sellable; rejection is strict: sold_count + 1 > sellable_count"
    variants: []

  # --- corporate outstanding balance (cross-entity aggregation) ---
  - name: corporate_outstanding
    trigger: "Reservation CHECKED_IN->CHECKED_OUT for a CORPORATE folio; corporate confirm projection check"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(Folio.balance_cents
        for folios where bill_to == CORPORATE
        AND reservation.corporate_account_id == acct.id
        AND Reservation.status == CHECKED_OUT)
      # Confirm-time gate uses a forward projection:
      #   would_be = outstanding_balance_cents + Folio.projected_charges_cents
      #   confirm REJECTED iff would_be > credit_limit_cents (strict >).
    input_set: "CHECKED_OUT corporate folios for the account; plus the confirming reservation's projection at confirm time"
    constants: {}
    precision: "integer cents; rejection strict: would_be > credit_limit_cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per §1.7 (incl. Guest acting only on own guest_id resources)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resource ({id}) exists in hotel scope, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"

  - priority: 4
    category: existence
    check: "Body FK fields reference existing resources (hotel_id, guest_id, rate_plan_id, room_type_id, group_block_id, room_id, folio_id, corporate_account_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints, assign-room"

  - priority: 5
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, departure_date > arrival_date, dates ISO YYYY-MM-DD, pagination bounds (else ERR_PAGINATION_INVALID)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Hotel posture is OPEN (not AUDIT_LOCK) for reservation/room/folio mutations"
    error_id: ERR_HOTEL_AUDIT_LOCKED
    http_status: 409
    applies_to: "reservation create/confirm/check-in/check-out/cancel/assign-room/upgrade; folio dispute/resolve; incidental post/void; room housekeeping"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (terminal/idempotent re-trigger rejected)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "RatePlan.status == ACTIVE when backing a new reservation/confirm; a group pickup's rate_plan_id must equal the block's rate_plan_id"
    error_id: ERR_RATE_PLAN_MISMATCH
    http_status: 409
    applies_to: "reservation create, reservation confirm"

  - priority: 9
    category: business_temporal
    check: "Group pickup allowed only while block.status == OPEN and current_business_date <= cutoff_date"
    error_id: ERR_BLOCK_CUTOFF_PASSED
    http_status: 409
    applies_to: "reservation create with group_block_id"

  - priority: 10
    category: business_safety
    check: "Room assignment/upgrade target: Room not OUT_OF_ORDER, not bound to another reservation, and its type tier_rank >= reservation effective tier"
    error_id: ERR_ROOM_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "assign-room, upgrade"

  - priority: 11
    category: business_constraint
    check: "Availability: for every night in [arrival,departure), sold_count + 1 <= sellable_count for the room type"
    error_id: ERR_NO_AVAILABILITY
    http_status: 409
    applies_to: "reservation create"

  - priority: 12
    category: business_fiscal
    check: "Corporate credit: outstanding_balance_cents + projected_charges_cents <= credit_limit_cents (strict over = reject)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "reservation confirm (corporate)"

  - priority: 13
    category: state
    check: "OCC: expected_room_version matches Room.version (assign-room); expected_group_block_version matches GroupBlock.version (block pickup)"
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
    applies_to: "assign-room, reservation create from block"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Hotel ----
  - method: POST
    path: "/pms/hotels"
    description: "Create a hotel (property)"
    roles: [RevenueManager]
    code: 201
    input: [name, current_business_date, "timezone?", "overbooking_allowance_pct?"]
    output: Hotel
    side_effects: ["posture=OPEN, audit_epoch=0, version=1; current_business_date set from input"]

  - method: GET
    path: "/pms/hotels/{id}"
    description: "Get hotel"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: Hotel
    side_effects: []

  # ---- RoomType ----
  - method: POST
    path: "/pms/room-types"
    description: "Create a room type"
    roles: [RevenueManager]
    code: 201
    input: [hotel_id, code, tier_rank, physical_inventory, base_rate_cents]
    output: RoomType
    side_effects: ["version=1"]

  - method: GET
    path: "/pms/room-types/{id}"
    description: "Get room type"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  - method: GET
    path: "/pms/room-types"
    description: "List room types; filter by hotel_id (reverse-reachability for RoomType.hotel_id)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: ["hotel_id?", "code?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  # ---- Room ----
  - method: POST
    path: "/pms/rooms"
    description: "Create a physical room"
    roles: [RevenueManager]
    code: 201
    input: [hotel_id, room_type_id, room_number]
    output: Room
    side_effects: ["housekeeping_status=CLEAN, version=1"]

  - method: GET
    path: "/pms/rooms/{id}"
    description: "Get room"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/pms/rooms"
    description: "List rooms; filter by hotel_id / room_type_id / assigned_reservation_id (reverse-reachability for Room FKs)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: ["hotel_id?", "room_type_id?", "assigned_reservation_id?", "housekeeping_status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: POST
    path: "/pms/rooms/{id}/housekeeping"
    description: "Transition a room's housekeeping status"
    roles: [FrontDeskAgent, RevenueManager]
    code: 200
    input: [target, expected_room_version]
    output: Room
    side_effects:
      - "housekeeping_status -> target per Room state machine"
      - "OUT_OF_ORDER / restore recompute AvailabilityCell.sellable_count"
      - "increments Room.version by 1"

  # ---- RatePlan ----
  - method: POST
    path: "/pms/rate-plans"
    description: "Create a rate plan (BAR/CORPORATE/PACKAGE)"
    roles: [RevenueManager]
    code: 201
    input: [hotel_id, code, kind, adjustment_mode, adjustment_value, no_show_policy, "corporate_account_id?", "package_fee_cents?"]
    output: RatePlan
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/pms/rate-plans/{id}"
    description: "Get rate plan"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  - method: GET
    path: "/pms/rate-plans"
    description: "List rate plans; filter by hotel_id / corporate_account_id (reverse-reachability for RatePlan FKs)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: ["hotel_id?", "corporate_account_id?", "kind?", "status?", "limit?", "offset?"]
    output: RatePlan[]
    side_effects: []

  - method: POST
    path: "/pms/rate-plans/{id}/close"
    description: "Close a rate plan so it can no longer back new reservations"
    roles: [RevenueManager]
    code: 200
    input: [expected_rate_plan_version]
    output: RatePlan
    side_effects: ["status -> CLOSED", "increments RatePlan.version by 1"]

  # ---- CorporateAccount ----
  - method: POST
    path: "/pms/corporate-accounts"
    description: "Create a corporate account"
    roles: [RevenueManager]
    code: 201
    input: [hotel_id, name, credit_limit_cents]
    output: CorporateAccount
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0, version=1"]

  - method: GET
    path: "/pms/corporate-accounts/{id}"
    description: "Get corporate account (includes computed outstanding_balance_cents)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: []

  - method: GET
    path: "/pms/corporate-accounts"
    description: "List corporate accounts; filter by hotel_id (reverse-reachability for CorporateAccount.hotel_id)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: ["hotel_id?", "status?", "limit?", "offset?"]
    output: CorporateAccount[]
    side_effects: []

  - method: POST
    path: "/pms/corporate-accounts/{id}/suspend"
    description: "Suspend a corporate account"
    roles: [RevenueManager]
    code: 200
    input: [expected_corporate_account_version]
    output: CorporateAccount
    side_effects: ["status -> SUSPENDED", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/pms/corporate-accounts/{id}/reinstate"
    description: "Reinstate a suspended corporate account"
    roles: [RevenueManager]
    code: 200
    input: [expected_corporate_account_version]
    output: CorporateAccount
    side_effects: ["status -> ACTIVE", "increments CorporateAccount.version by 1"]

  # ---- Guest ----
  - method: POST
    path: "/pms/guests"
    description: "Register a guest"
    roles: [FrontDeskAgent, RevenueManager]
    code: 201
    input: [hotel_id, full_name, email, "loyalty_tier?"]
    output: Guest
    side_effects: ["version=1"]

  - method: GET
    path: "/pms/guests/{id}"
    description: "Get guest"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/pms/guests"
    description: "List guests; filter by hotel_id (reverse-reachability for Guest.hotel_id)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: ["hotel_id?", "email?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  # ---- GroupBlock ----
  - method: POST
    path: "/pms/group-blocks"
    description: "Create a group block holding rooms of a type for a date range"
    roles: [RevenueManager]
    code: 201
    input: [hotel_id, room_type_id, rate_plan_id, block_name, arrival_date, departure_date, cutoff_date, blocked_rooms]
    output: GroupBlock
    side_effects: ["status=OPEN, picked_up_rooms=0, washed_rooms=0, version=1"]

  - method: GET
    path: "/pms/group-blocks/{id}"
    description: "Get group block"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: []
    output: GroupBlock
    side_effects: []

  - method: GET
    path: "/pms/group-blocks"
    description: "List group blocks; filter by hotel_id / room_type_id / rate_plan_id (reverse-reachability for GroupBlock FKs)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor]
    code: 200
    input: ["hotel_id?", "room_type_id?", "rate_plan_id?", "status?", "limit?", "offset?"]
    output: GroupBlock[]
    side_effects: []

  - method: POST
    path: "/pms/group-blocks/{id}/close"
    description: "Close a group block"
    roles: [RevenueManager]
    code: 200
    input: [expected_group_block_version]
    output: GroupBlock
    side_effects: ["status -> CLOSED", "increments GroupBlock.version by 1"]

  # ---- Reservation ----
  - method: POST
    path: "/pms/reservations"
    description: "Create a reservation (HELD) for a date interval; availability + block-cutoff checks"
    roles: [FrontDeskAgent, Guest]
    code: 201
    input: [hotel_id, guest_id, room_type_id, rate_plan_id, arrival_date, departure_date, "group_block_id?", "expected_group_block_version?"]
    output: Reservation
    side_effects:
      - "status=HELD; nights computed; corporate_account_id copied from the rate plan when CORPORATE; effective_room_type_id = room_type_id"
      - "creates a Folio (status=OPEN, bill_to derived) for the reservation"
      - "AvailabilityCell.sold_count recomputed for covered dates (availability_sellable)"
      - "If group_block_id: GroupBlock.picked_up_rooms recomputed (block_pickup); increments GroupBlock.version by 1"

  - method: GET
    path: "/pms/reservations/{id}"
    description: "Get reservation"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/pms/reservations"
    description: "List reservations; filter by hotel_id / guest_id / room_type_id / rate_plan_id / group_block_id / corporate_account_id / assigned_room_id / effective_room_type_id (reverse-reachability for all Reservation FKs)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: ["hotel_id?", "guest_id?", "room_type_id?", "rate_plan_id?", "group_block_id?", "corporate_account_id?", "assigned_room_id?", "effective_room_type_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/pms/reservations/{id}/confirm"
    description: "Confirm a HELD reservation; pins forward projection; corporate credit check"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status HELD -> CONFIRMED"
      - "Folio.projected_charges_cents pinned via room_charge_forward"
      - "If group_block_id: GroupBlock.picked_up_rooms recomputed (block_pickup)"

  - method: POST
    path: "/pms/reservations/{id}/assign-room"
    description: "Assign a specific physical room to a reservation (OCC on room)"
    roles: [FrontDeskAgent]
    code: 200
    input: [room_id, expected_room_version]
    output: Reservation
    side_effects:
      - "Reservation.assigned_room_id = room_id"
      - "Room.assigned_reservation_id = reservation_id"
      - "increments Room.version by 1"

  - method: POST
    path: "/pms/reservations/{id}/upgrade"
    description: "Upgrade a reservation to a higher-tier room type (comp if loyalty-eligible, else paid)"
    roles: [FrontDeskAgent]
    code: 200
    input: [target_room_type_id, comp]
    output: Reservation
    side_effects:
      - "effective_room_type_id -> target type; is_upgraded=true; upgrade_is_comp set from comp"
      - "If not comp: Folio.projected_charges_cents recomputed at the higher rate (room_charge_forward)"
      - "AvailabilityCell.sold_count recomputed for source and target type across covered dates"

  - method: POST
    path: "/pms/reservations/{id}/check-in"
    description: "Check in a CONFIRMED reservation with an assigned, inspected room"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status CONFIRMED -> CHECKED_IN"
      - "assigned Room.housekeeping_status INSPECTED -> OCCUPIED; increments Room.version by 1"

  - method: POST
    path: "/pms/reservations/{id}/check-out"
    description: "Check out a CHECKED_IN reservation; closes folio; corporate ledger sync"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status CHECKED_IN -> CHECKED_OUT"
      - "Folio.status -> CLOSED; final folio_balance frozen"
      - "assigned Room.housekeeping_status OCCUPIED -> DIRTY; Room.assigned_reservation_id -> null; increments Room.version by 1"
      - "If bill_to==CORPORATE: CorporateAccount.outstanding_balance_cents += Folio.balance_cents; increments CorporateAccount.version by 1"

  - method: POST
    path: "/pms/reservations/{id}/cancel"
    description: "Cancel a HELD/CONFIRMED reservation; releases inventory and room"
    roles: [FrontDeskAgent, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status -> CANCELLED"
      - "If assigned_room_id: Room.assigned_reservation_id -> null; increments Room.version by 1"
      - "AvailabilityCell.sold_count recomputed; Folio.status -> CLOSED"
      - "If group_block_id: GroupBlock.picked_up_rooms recomputed (block_pickup)"

  # ---- Folio + Incidentals ----
  - method: GET
    path: "/pms/folios/{id}"
    description: "Get folio by id"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: Folio
    side_effects: []

  - method: GET
    path: "/pms/folios"
    description: "List folios; filter by hotel_id / reservation_id (reverse-reachability for Folio FKs; 1:1 via reservation_id)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: ["hotel_id?", "reservation_id?", "status?", "limit?", "offset?"]
    output: Folio[]
    side_effects: []

  - method: POST
    path: "/pms/folios/{id}/dispute"
    description: "Freeze a folio pending review"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Folio
    side_effects: ["Folio.status OPEN -> DISPUTED"]

  - method: POST
    path: "/pms/folios/{id}/resolve"
    description: "Re-open a disputed folio"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Folio
    side_effects: ["Folio.status DISPUTED -> OPEN"]

  - method: POST
    path: "/pms/incidentals"
    description: "Post an incidental line (charge/payment/adjustment) to a folio"
    roles: [FrontDeskAgent]
    code: 201
    input: [hotel_id, folio_id, kind, description, amount_cents]
    output: Incidental
    side_effects:
      - "Incidental created status=POSTED, posted_by_kind=AGENT"
      - "Folio totals recomputed via folio_balance"

  - method: GET
    path: "/pms/incidentals/{id}"
    description: "Get incidental line by id"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: []
    output: Incidental
    side_effects: []

  - method: GET
    path: "/pms/incidentals"
    description: "List incidentals; filter by hotel_id / folio_id (reverse-reachability for Incidental FKs)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: ["hotel_id?", "folio_id?", "kind?", "status?", "limit?", "offset?"]
    output: Incidental[]
    side_effects: []

  - method: POST
    path: "/pms/incidentals/{id}/void"
    description: "Void a posted incidental line (drops out of folio sums)"
    roles: [FrontDeskAgent]
    code: 200
    input: [expected_folio_version]
    output: Incidental
    side_effects:
      - "Incidental.status -> VOIDED"
      - "Folio totals recomputed via folio_balance; increments Folio.version by 1"

  # ---- Night audit ----
  - method: POST
    path: "/pms/night-audit-runs"
    description: "Open a night audit run; sets hotel posture AUDIT_LOCK"
    roles: [NightAuditor]
    code: 201
    input: [hotel_id, expected_hotel_version]
    output: NightAuditRun
    side_effects: ["status=IN_PROGRESS; Hotel.posture -> AUDIT_LOCK; increments Hotel.version by 1"]

  - method: GET
    path: "/pms/night-audit-runs/{id}"
    description: "Get a night audit run"
    roles: [RevenueManager, NightAuditor]
    code: 200
    input: []
    output: NightAuditRun
    side_effects: []

  - method: GET
    path: "/pms/night-audit-runs"
    description: "List night audit runs; filter by hotel_id (reverse-reachability for NightAuditRun.hotel_id)"
    roles: [RevenueManager, NightAuditor]
    code: 200
    input: ["hotel_id?", "status?", "limit?", "offset?"]
    output: NightAuditRun[]
    side_effects: []

  - method: POST
    path: "/pms/night-audit-runs/{id}/complete"
    description: "Complete the audit: no-show sweep, room-charge postings, date advance, block wash"
    roles: [NightAuditor]
    code: 200
    input: [expected_hotel_version]
    output: NightAuditRun
    side_effects:
      - "CONFIRMED arrivals today not CHECKED_IN -> NO_SHOW + no_show_charge"
      - "Each CHECKED_IN reservation gets a NIGHT_AUDIT room charge Incidental (room_charge_chronological)"
      - "Hotel.current_business_date += 1 day; Hotel.audit_epoch += 1; Hotel.posture -> OPEN; increments Hotel.version by 1"
      - "GroupBlocks with cutoff_date < new current_business_date -> WASHED (block_wash)"

  - method: POST
    path: "/pms/night-audit-runs/{id}/abort"
    description: "Abort an in-progress audit without advancing the date"
    roles: [NightAuditor]
    code: 200
    input: [expected_hotel_version]
    output: NightAuditRun
    side_effects: ["status -> ABORTED; Hotel.posture -> OPEN; increments Hotel.version by 1"]

  # ---- Availability read ----
  - method: GET
    path: "/pms/availability"
    description: "Read per-night availability for a room type across a date range (computed AvailabilityCell rows)"
    roles: [RevenueManager, FrontDeskAgent, NightAuditor, Guest]
    code: 200
    input: [room_type_id, start_date, end_date, "hotel_id?"]
    output: AvailabilityCell[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation (incl. Guest acting on another guest's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist in hotel scope" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A FK field in the body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, departure_date <= arrival_date, bad date format" }
  - { id: ERR_HOTEL_AUDIT_LOCKED, http: 409, condition: "Hotel posture is AUDIT_LOCK; reservation/room/folio mutations blocked while a night audit is IN_PROGRESS" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition (incl. terminal-state and idempotent re-trigger)" }
  - { id: ERR_RATE_PLAN_MISMATCH, http: 409, condition: "Rate plan is CLOSED for a new reservation/confirm, or a group reservation's rate_plan_id != block.rate_plan_id" }
  - { id: ERR_ROOM_NOT_ASSIGNABLE, http: 409, condition: "Target room is OUT_OF_ORDER, bound to another reservation, or its type tier_rank is below the reservation's effective tier" }
  - { id: ERR_BLOCK_CUTOFF_PASSED, http: 409, condition: "Group block pickup attempted after cutoff (block WASHED/CLOSED or current_business_date > cutoff_date)" }
  - { id: ERR_BLOCK_HAS_PENDING_PICKUPS, http: 409, condition: "Closing a group block while a HELD reservation is still attached" }
  - { id: ERR_NO_AVAILABILITY, http: 409, condition: "For some night in the stay, sold_count + 1 > sellable_count for the room type" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Corporate confirm would push outstanding_balance_cents + projected_charges_cents above credit_limit_cents" }
  - { id: ERR_CORPORATE_SUSPENDED, http: 409, condition: "Corporate account is SUSPENDED; new corporate reservation confirm blocked" }
  - { id: ERR_ROOM_NOT_INSPECTED, http: 409, condition: "Check-in attempted while the assigned room is not INSPECTED" }
  - { id: ERR_NO_ROOM_ASSIGNED, http: 409, condition: "Check-in attempted with no assigned_room_id" }
  - { id: ERR_FOLIO_NOT_OPEN, http: 409, condition: "Incidental post/void, dispute, or resolve attempted against a folio not in the required status" }
  - { id: ERR_FOLIO_DISPUTED_CHECKOUT, http: 409, condition: "Check-out attempted while folio is DISPUTED" }
  - { id: ERR_AUDIT_BLOCKED_OPEN_BALANCE, http: 409, condition: "Night audit complete blocked by a departing CHECKED_IN reservation whose folio is still OPEN/DISPUTED" }
  - { id: ERR_AUDIT_ALREADY_RUNNING, http: 409, condition: "Opening a night audit while one is already IN_PROGRESS for the hotel" }
  - { id: ERR_ARRIVAL_NOT_REACHED, http: 409, condition: "Check-in attempted before current_business_date reaches arrival_date" }
  - { id: ERR_STALE_ROOM_VERSION, http: 412, condition: "assign-room expected_room_version != Room.version" }
  - { id: ERR_STALE_BLOCK_VERSION, http: 412, condition: "reservation-from-block expected_group_block_version != GroupBlock.version" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "Generic OCC mismatch on a guarded write (rate-plan close, corporate suspend/reinstate, folio void, audit open/complete/abort) expected_*_version != current version" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique constraint violated (RoomType.code, Room.room_number, RatePlan.code, Guest.email per hotel)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of bounds (limit<1, limit>100, offset<0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueManager
    description: "Owns property configuration: hotels, room types, rooms, rate plans, corporate accounts, group blocks; runs inventory controls (OUT_OF_ORDER, block close, account suspend)."
    identity: opaque
    exclusive_operations:
      - "POST /pms/hotels — create property"
      - "POST /pms/room-types — create room type"
      - "POST /pms/rooms — create room"
      - "POST /pms/rate-plans — create rate plan"
      - "POST /pms/rate-plans/{id}/close — close rate plan"
      - "POST /pms/corporate-accounts — create corporate account"
      - "POST /pms/corporate-accounts/{id}/suspend — suspend account"
      - "POST /pms/corporate-accounts/{id}/reinstate — reinstate account"
      - "POST /pms/group-blocks — create group block"
      - "POST /pms/group-blocks/{id}/close — close group block"
    shared_operations:
      - "POST /pms/rooms/{id}/housekeeping — housekeeping incl. OUT_OF_ORDER toggle (shared with FrontDeskAgent for non-OOO transitions)"
      - "POST /pms/guests — register guest (shared with FrontDeskAgent)"
      - "GET endpoints — read property, inventory, reservations, folios, audits"

  - name: FrontDeskAgent
    description: "Runs the front desk: guests, reservations, room assignment/upgrade, check-in/out, folios and incidentals, housekeeping non-OOO transitions."
    identity: opaque
    exclusive_operations:
      - "POST /pms/reservations/{id}/confirm — confirm"
      - "POST /pms/reservations/{id}/assign-room — assign room"
      - "POST /pms/reservations/{id}/upgrade — upgrade"
      - "POST /pms/reservations/{id}/check-in — check in"
      - "POST /pms/reservations/{id}/check-out — check out"
      - "POST /pms/folios/{id}/dispute — dispute folio"
      - "POST /pms/folios/{id}/resolve — resolve folio"
      - "POST /pms/incidentals — post incidental"
      - "POST /pms/incidentals/{id}/void — void incidental"
    shared_operations:
      - "POST /pms/reservations — create reservation (shared with Guest)"
      - "POST /pms/reservations/{id}/cancel — cancel (shared with Guest)"
      - "POST /pms/rooms/{id}/housekeeping — DIRTY/CLEAN/INSPECTED transitions (shared with RevenueManager)"
      - "POST /pms/guests — register guest (shared with RevenueManager)"
      - "GET endpoints — read"

  - name: NightAuditor
    description: "Runs the nightly audit epoch: opens/completes/aborts the audit, triggering no-show sweep, room-charge postings, date advance, and block wash."
    identity: opaque
    exclusive_operations:
      - "POST /pms/night-audit-runs — open audit"
      - "POST /pms/night-audit-runs/{id}/complete — complete audit"
      - "POST /pms/night-audit-runs/{id}/abort — abort audit"
    shared_operations:
      - "GET endpoints — read property, reservations, audits"

  - name: Guest
    description: "Self-service guest: books and cancels own reservations, reads own reservation/folio. X-User-ID equals the acting Guest.id."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /pms/reservations — create own reservation (guest_id must equal X-User-ID) (shared with FrontDeskAgent)"
      - "POST /pms/reservations/{id}/cancel — cancel own reservation (shared with FrontDeskAgent)"
      - "GET endpoints — read own reservation, folio, availability, rate plans"
