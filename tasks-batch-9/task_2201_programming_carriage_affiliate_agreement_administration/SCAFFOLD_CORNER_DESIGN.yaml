          assert:
            - "the PLACE_HOLD in setup returned 200 with data.status == \"CREDIT_HOLD\" and data.credit_hold_reason == \"MANUAL_REVIEW\""
            - "response status code == 200"
            - "response body data.status == \"ACTIVE\" and data.credit_hold_reason == \"NONE\""
            - "GET /carriage/agreements/${ag_id} still returns lifecycle_status == \"SUSPENDED\" and suspension_reason == \"DISTRIBUTOR_CREDIT_HOLD\""
            - "GET /carriage/rights-windows/${w_id} still returns status == \"BLOCKED\" and block_reason == \"AGREEMENT_SUSPENDED\""
            - "GET /carriage/content-titles/${tt_id} returns cleared_window_count == 0 and distribution_coverage_status == \"UNDISTRIBUTED\""
            - "GET /carriage/distributors/${dm_id} returns receivable_balance_cents == 0 and audit_recovery_balance_cents == 0, the two RELEASE_HOLD preconditions"

      - name: expiring_title_rights_blocks_its_cleared_windows
        claim_type: action_endpoint
