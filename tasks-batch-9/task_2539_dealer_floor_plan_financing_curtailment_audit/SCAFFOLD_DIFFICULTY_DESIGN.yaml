            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d15}", credit_line_id: "${cl15}", vin: "1GATEUNIT00000010", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", odometer_miles: 7, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${d15}"
