    segregation_of_duties:
      - "SOD-2 first step: a drill this StaffMember.id documents (documented_by_staff_id) can never be validated by it; validation is a PerinatalSafetyOfficer act."
    note: "exclusive_operations is deliberately empty: every AnesthesiaLead write is co-held with ChargeNurse (shift creation, drill creation, drill documentation). Its separation from ChargeNurse is resource scope, not endpoint exclusivity."

  - name: PerinatalSafetyOfficer
    description: "Quality and safety authority. Stands up and reconfigures units and beds, and performs every retrospective sign-off: bundle debrief closure, drill validation and invalidation, emergency-cesarean case closure, newborn-review rework and closure, and quality-measure snapshot creation and certification. Never documents primary care."
    identity: "entity_backed:StaffMember"
    exclusive_operations:            # 11 endpoints only this role may call
      - "POST /obstetric-units"
      - "PATCH /obstetric-units/{unitId}"
      - "DELETE /beds/{bedId}"
      - "POST /bundle-activations/{activationId}/close-debrief"
      - "POST /emergency-cesareans/{eventId}/close"
      - "POST /cesarean-readiness-drills/{drillId}/validate"
      - "POST /cesarean-readiness-drills/{drillId}/invalidate"
      - "POST /newborn-complication-reviews/{reviewId}/request-rework"
      - "POST /newborn-complication-reviews/{reviewId}/close"
      - "POST /obstetric-units/{unitId}/quality-measure-snapshots"
      - "POST /quality-measure-snapshots/{snapshotId}/certify"
    shared_operations:               # 48 endpoints co-held with other roles
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /obstetric-units"
      - "GET /obstetric-units/{unitId}"
      - "GET /obstetric-units/{unitId}/capacity-summary"
      - "GET /obstetric-units/{unitId}/coverage-report"
      - "GET /obstetric-units/{unitId}/readiness-report"
      - "POST /obstetric-units/{unitId}/capacity-sweep"
      - "POST /obstetric-units/{unitId}/staff-members"
      - "GET /obstetric-units/{unitId}/staff-members"
      - "GET /staff-members/{staffId}"
      - "PATCH /staff-members/{staffId}"
      - "GET /shift-assignments"
      - "GET /shift-assignments/{shiftId}"
      - "POST /obstetric-units/{unitId}/beds"
      - "GET /obstetric-units/{unitId}/beds"
      - "GET /beds"
      - "GET /beds/{bedId}"
      - "GET /labor-encounters"
      - "GET /labor-encounters/{encounterId}"
      - "GET /labor-encounters/{encounterId}/coverage-summary"
      - "GET /care-assignments"
      - "GET /care-assignments/{assignmentId}"
      - "GET /induction-bookings"
      - "GET /induction-bookings/{bookingId}"
      - "GET /bundle-activations"
      - "GET /bundle-activations/{activationId}"
      - "GET /bundle-activations/{activationId}/checklist-items"
      - "GET /bundle-activations/{activationId}/checklist-items/{itemId}"
      - "GET /bundle-activations/{activationId}/timeliness-report"
      - "GET /fetal-monitoring-assessments"
      - "GET /fetal-monitoring-assessments/{assessmentId}"
      - "GET /emergency-cesareans"
      - "GET /emergency-cesareans/{eventId}"
      - "GET /obstetric-units/{unitId}/cesarean-readiness-drills"
      - "GET /cesarean-readiness-drills/{drillId}"
      - "POST /newborn-complication-reviews"
      - "GET /newborn-complication-reviews"
      - "GET /newborn-complication-reviews/{reviewId}"
      - "GET /support-person-passes"
      - "GET /support-person-passes/{passId}"
      - "GET /obstetric-units/{unitId}/quality-measure-snapshots"
      - "GET /quality-measure-snapshots/{snapshotId}"
      - "GET /staff-members"
      - "GET /bundle-checklist-items"
      - "GET /bundle-checklist-items/{itemId}"
      - "GET /cesarean-readiness-drills"
      - "GET /quality-measure-snapshots"
    segregation_of_duties:
      - "SOD-1 second step: close-debrief is refused when X-User-ID equals any performed_by_staff_id on that activation's checklist items."
      - "SOD-2 second step: drill validate is refused when X-User-ID == documented_by_staff_id."
      - "SOD-4 second step: review close is refused when X-User-ID is the facilitator_staff_id or held any CareAssignment on the encounter; request-rework is refused for the facilitator."
      - "SOD-5 second step: emergency-cesarean close is refused when X-User-ID appears in mobilized_staff_ids."
      - "SOD-6 second step: snapshot certify is refused when X-User-ID facilitated any NewbornComplicationReview whose encounter delivered inside the snapshot's reporting window."
    note: "Being entity_backed:StaffMember is what makes all five sign-off checks falsifiable: a clinician acting as PerinatalSafetyOfficer is still the same StaffMember.id and is still refused."

  - name: PatientAccessCoordinator
    description: "Non-clinical access and scheduling role. Requests induction bookings, holds and releases LDR bed capacity, re-queues bumped bookings, cancels bookings, and admits/checks support persons in and out at the door. Holds no clinical write and never appears in any SoD pair."
    identity: "opaque"
    exclusive_operations:            # 5 endpoints only this role may call
      - "POST /induction-bookings/{bookingId}/hold-capacity"
      - "POST /induction-bookings/{bookingId}/requeue"
      - "POST /induction-bookings/{bookingId}/cancel"
      - "POST /support-person-passes/{passId}/check-in"
      - "POST /support-person-passes/{passId}/check-out"
    shared_operations:               # 20 endpoints co-held with other roles
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /obstetric-units"
      - "GET /obstetric-units/{unitId}"
      - "GET /obstetric-units/{unitId}/capacity-summary"
      - "POST /obstetric-units/{unitId}/capacity-sweep"
      - "GET /obstetric-units/{unitId}/beds"
      - "GET /beds"
      - "GET /beds/{bedId}"
      - "POST /labor-encounters"
      - "GET /labor-encounters"
      - "GET /labor-encounters/{encounterId}"
      - "GET /labor-encounters/{encounterId}/coverage-summary"
      - "POST /induction-bookings"
      - "GET /induction-bookings"
      - "GET /induction-bookings/{bookingId}"
