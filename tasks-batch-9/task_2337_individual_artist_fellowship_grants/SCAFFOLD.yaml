# =============================================================================
# PRD Benchmark Scaffold — task_2337_individual_artist_fellowship_grants
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2337. Individual Artist Fellowship Grants (state arts council fellowship program): eligibility criteria including residency duration, discipline categories and prior award restrictions, application with work samples, artist statement and career narrative under anonymous review protocols, panel recruitment with discipline expertise, geographic diversity and conflict management, scoring, panel deliberation and funding recommendation to the council board, award notification with acceptance agreement, payment schedule and tax reporting to recipients, public value and reporting requirements with final narrative reports, appeal process limited to procedural grounds, program evaluation on applicant pool diversity and geographic distribution

domain_name: artist-fellowship-grants
api_prefix: /grants

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation      # panel quorum, deliberation rounds, board ratification, appeals
  secondary_archetype: compliance_audit           # anonymous-review protocol, segregation of duties, procedural-only appeals, tax reporting
  complexity_layers:
    - optimistic_concurrency        # OCC on FellowshipCycle.version and Panel.version
    - cascading_side_effects        # conflict / breach / appeal cascades spanning 4-5 entities
    - dual_variant_calculation      # provisional vs final composite score; cash vs accrual tax basis
    - derived_field_reconciliation  # committed_cents, assessment, posture, valid_review_count, standing

  entity_topology: flat
  # Every entity is a top-level collection under /grants; parenthood is expressed
  # only through `FK -> <Parent>.id` fields, never through nested URL paths.
  # Self-referential edge: PaymentInstallment.replaces_installment_id.

  state_machine_shape: parallel
  # Application carries two independent dimensions (status x anonymity_status);
  # Award carries three (status x payment_status x reporting_status);
  # Panel is cyclic (DELIBERATING -> SCORING for a second round);
  # FinalReport is cyclic (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED);
  # Appeal is branching (SCREENED -> {UPHELD, DENIED}) with per-remedy divergent
  # side-effect sets; FellowshipCycle carries a derived posture that gates children.

  relationship_patterns:
    - one_to_many          # Cycle -> DisciplineCategory -> Application; Award -> PaymentInstallment
    - many_to_many         # Review and ConflictDeclaration are Panelist x Application junctions
    - self_referential     # PaymentInstallment.replaces_installment_id
    - cross_aggregate      # RecommendationSlot spans Panel and Application; Award spans Cycle, Artist, Application

  role_model: segregation_of_duties
  # The AppealsOfficer who decides an appeal MUST NOT be the ProgramOfficer user
  # who determined that application's eligibility; the FiscalOfficer who releases
  # an installment MUST NOT be the CouncilBoardMember user who approved the slot.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: FellowshipCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the fellowship cycle" }
      - { name: fiscal_year, type: integer, source: input, description: "State fiscal year the cycle funds; basis of the prior-award blackout arithmetic" }
      - { name: application_open_at, type: datetime, source: input, description: "Inclusive instant submissions open" }
      - { name: application_deadline_at, type: datetime, source: input, description: "Inclusive instant submissions close; also the residency-duration measurement date" }
      - { name: grant_period_start, type: datetime, source: input, description: "Fellowship period start copied onto every Award of this cycle" }
      - { name: grant_period_end, type: datetime, source: input, description: "Fellowship period end copied onto every Award of this cycle" }
      - { name: total_budget_cents, type: integer, source: input, description: "Whole appropriation for the cycle in cents", constraints: ">= 1" }
      - { name: base_award_cents, type: integer, source: input, description: "Full fellowship stipend in cents", constraints: ">= 1" }
      - { name: min_prorated_award_cents, type: integer, source: input, description: "Floor below which a discipline remainder may not be awarded", constraints: ">= 1 and <= base_award_cents" }
      - { name: proration_policy, type: enum, source: input, default: PRORATE, description: "PRORATE | SKIP_TO_ALTERNATE — what happens when a discipline remainder is under base_award_cents" }
      - { name: residency_min_months, type: integer, source: input, description: "Whole months of continuous state residency required at application_deadline_at" }
      - { name: award_blackout_years, type: integer, source: input, description: "Minimum fiscal-year gap between a prior fellowship and this cycle" }
      - { name: max_review_rounds, type: integer, source: input, default: 2, description: "Hard ceiling on Panel.round_number" }
      - { name: acceptance_window_days, type: integer, source: input, default: 14, description: "Days an offered Award stays acceptable" }
      - { name: appeal_window_days, type: integer, source: input, default: 30, description: "Days after Application.notified_at during which an appeal may be filed" }
      - { name: final_report_due_offset_days, type: integer, source: input, default: 60, description: "Days after grant_period_end that a final narrative report is due" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Cycle lifecycle", constraints: "DRAFT | OPEN | CLOSED | PANEL_REVIEW | BOARD_REVIEW | AWARDED | CLOSED_OUT | CANCELLED" }
      - { name: funded_total_cents, type: integer, source: computed, default: 0, description: "Sum of Award.gross_amount_cents for Awards of this cycle with status IN {OFFERED, ACCEPTED, ACTIVE, COMPLETED}" }
      - { name: admin_assessment_rate, type: number, source: computed, default: 0, description: "Tier rate selected from funded_total_cents by calculations.cycle_admin_assessment" }
      - { name: admin_assessment_cents, type: integer, source: computed, default: 0, description: "Program administration charge held against the appropriation" }
      - { name: reserve_cents, type: integer, source: computed, default: 0, description: "Contingency reserve; RESERVE_RATE of total_budget_cents while status IN {DRAFT, OPEN, CLOSED, PANEL_REVIEW, BOARD_REVIEW}, else 0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "= funded_total_cents + admin_assessment_cents" }
      - { name: available_cents, type: integer, source: computed, description: "= total_budget_cents - committed_cents - reserve_cents" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "Derived gate over child operations", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: unresolved_breach_count, type: integer, source: computed, default: 0, description: "Count of Applications of this cycle with anonymity_status == BREACHED" }
      - { name: blocking_conflict_count, type: integer, source: computed, default: 0, description: "Count of ConflictDeclarations with status == BLOCKING whose Panelist sits on a Panel of this cycle" }

  - name: DisciplineCategory
    parent: FellowshipCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> FellowshipCycle.id" }
      - { name: code, type: enum, source: input, description: "Discipline", constraints: "LITERARY_ARTS | VISUAL_ARTS | MEDIA_ARTS | PERFORMING_ARTS | TRADITIONAL_ARTS; unique per cycle_id" }
      - { name: alias_prefix, type: string, source: input, description: "Prefix used when minting Application.sealed_alias (e.g. LIT)" }
      - { name: allocation_cents, type: integer, source: input, description: "Sub-budget reserved to this discipline", constraints: ">= 1" }
      - { name: required_work_sample_count, type: integer, source: input, description: "Work samples an application must carry to be submittable", constraints: ">= 1" }
      - { name: allowed_media, type: array, source: input, description: "Permitted WorkSample.medium values", constraints: "non-empty subset of {MANUSCRIPT_PAGES, AUDIO, VIDEO, IMAGE_SET}" }
      - { name: max_total_duration_seconds, type: integer, source: input, default: 600, description: "Inclusive ceiling on the summed duration_seconds of an application's time-based work samples" }
      - { name: required_panel_seats, type: integer, source: input, description: "Seats a panel for this discipline must fill", constraints: ">= 3" }
      - { name: required_regions, type: array, source: input, description: "Regions that must be represented among SEATED panelists", constraints: "non-empty subset of {NORTH, CENTRAL, SOUTH, COASTAL, TRIBAL}" }
      - { name: max_concurrent_panels, type: integer, source: input, default: 1, description: "How many panels of this discipline may hold overlapping deliberation windows" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of Award.gross_amount_cents for Awards whose Application.discipline_category_id is this row and status IN {OFFERED, ACCEPTED, ACTIVE, COMPLETED}" }
      - { name: eligible_application_count, type: integer, source: computed, default: 0, description: "Count of Applications of this discipline with status IN {ELIGIBLE, UNDER_REVIEW, SCORED, RECOMMENDED, NOT_RECOMMENDED, AWARDED, NOT_AWARDED}" }
      - { name: funded_application_count, type: integer, source: computed, default: 0, description: "Count of Applications of this discipline that carry an Award with status IN {OFFERED, ACCEPTED, ACTIVE, COMPLETED}" }
      - { name: submitted_sequence_counter, type: integer, source: system, default: 0, description: "Monotonic counter incremented on each submit; feeds sealed_alias minting" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email", constraints: "unique across Artists" }
      - { name: residency_start_date, type: datetime, source: input, description: "Instant continuous state residency began" }
      - { name: residency_county, type: string, source: input, description: "County of record" }
      - { name: region, type: enum, source: input, description: "Council service region", constraints: "NORTH | CENTRAL | SOUTH | COASTAL | TRIBAL" }
      - { name: is_enrolled_student, type: boolean, source: input, default: false, description: "Degree-seeking enrollment makes the artist ineligible" }
      - { name: tin_status, type: enum, source: input, default: MISSING, description: "Taxpayer identification status driving backup withholding", constraints: "ON_FILE | MISSING | INVALID" }
      - { name: standing, type: enum, source: computed, default: GOOD_STANDING, description: "Gate on submitting and accepting", constraints: "GOOD_STANDING | REPORT_DELINQUENT | DEBARRED" }
      - { name: last_award_fiscal_year, type: integer, source: computed, default: null, description: "Highest fiscal_year among recorded prior fellowships; null when none" }
      - { name: last_award_period_end, type: datetime, source: computed, default: null, description: "Latest grant-period end among recorded prior fellowships; null when none" }
      - { name: prior_award_count, type: integer, source: computed, default: 0, description: "Recorded prior fellowships, historical plus system-issued" }
      - { name: active_award_count, type: integer, source: computed, default: 0, description: "Awards of this artist with status IN {OFFERED, ACCEPTED, ACTIVE}" }
      - { name: delinquent_award_count, type: integer, source: computed, default: 0, description: "Awards of this artist with reporting_status == DELINQUENT" }
      - { name: debar_reason_code, type: enum, source: system, default: null, description: "Set when standing becomes DEBARRED", constraints: "FRAUD | REPORT_ABANDONED | FUNDS_MISUSE" }

  - name: Application
    parent: FellowshipCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> FellowshipCycle.id" }
      - { name: discipline_category_id, type: string, source: input, description: "FK -> DisciplineCategory.id; must belong to cycle_id" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: assigned_panel_id, type: string, source: computed, default: null, description: "FK -> Panel.id; set when a panel is chartered, cleared by an upheld appeal remedy" }
      - { name: artist_statement, type: string, source: input, description: "Anonymous artist statement" }
      - { name: career_narrative, type: string, source: input, description: "Anonymous career narrative" }
      - { name: sealed_alias, type: string, source: computed, default: null, description: "Minted at submit as <alias_prefix>-<fiscal_year>-<4-digit submitted_sequence_counter>; the only applicant handle a Panelist sees" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Review lifecycle dimension", constraints: "DRAFT | SUBMITTED | ELIGIBLE | INELIGIBLE | UNDER_REVIEW | SCORED | RECOMMENDED | NOT_RECOMMENDED | AWARDED | NOT_AWARDED | WITHDRAWN" }
      - { name: anonymity_status, type: enum, source: system, default: SEALED, description: "Anonymous-review dimension, independent of status", constraints: "SEALED | BREACHED | REDACTED | UNSEALED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submit" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical-clock instant the applicant was notified; starts the appeal window" }
      - { name: eligibility_determined_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the ProgramOfficer who recorded the determination; barred from deciding this application's appeal" }
      - { name: ineligibility_reason_code, type: enum, source: system, default: null, description: "Recorded when status becomes INELIGIBLE", constraints: "RESIDENCY_DURATION | PRIOR_AWARD_BLACKOUT | ENROLLED_STUDENT" }
      - { name: residency_months_at_deadline, type: integer, source: computed, default: null, description: "Frozen at submit by calculations.residency_months_at_deadline" }
      - { name: blackout_gap_years, type: integer, source: computed, default: null, description: "Frozen at submit: cycle.fiscal_year - artist.last_award_fiscal_year, or null when the artist has no prior award" }
      - { name: applicant_legal_name, type: string, source: computed, default: null, description: "Denormalized from Artist.legal_name at submit; served as null to the Panelist role while anonymity_status != UNSEALED" }
      - { name: applicant_region, type: enum, source: computed, default: null, description: "Denormalized from Artist.region at submit; served as null to the Panelist role while anonymity_status != UNSEALED; basis of the geographic-distribution evaluation" }
      - { name: work_sample_count, type: integer, source: computed, default: 0, description: "Count of WorkSamples of this application with status IN {PENDING_SCREEN, CLEARED, REDACTED}" }
      - { name: valid_review_count, type: integer, source: computed, default: 0, description: "Count of Reviews of this application with status == SUBMITTED and round_number == assigned panel's round_number" }
      - { name: provisional_composite_score, type: number, source: computed, default: null, description: "Untrimmed mean; recomputed on every review submit / invalidation" }
      - { name: final_composite_score, type: number, source: computed, default: null, description: "Trimmed weighted mean written at panel round close" }
      - { name: score_spread, type: number, source: computed, default: null, description: "max(Review.weighted_score) - min(Review.weighted_score) over the counted set" }
      - { name: review_round_number, type: integer, source: computed, default: 0, description: "Round that produced final_composite_score" }

  - name: WorkSample
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: medium, type: enum, source: input, description: "Sample medium", constraints: "MANUSCRIPT_PAGES | AUDIO | VIDEO | IMAGE_SET" }
      - { name: ordinal, type: integer, source: input, description: "Presentation order within the application", constraints: ">= 1; unique per application_id" }
      - { name: page_count, type: integer, source: input, default: null, description: "Pages for MANUSCRIPT_PAGES samples" }
      - { name: duration_seconds, type: integer, source: input, default: 0, description: "Running time for AUDIO and VIDEO samples" }
      - { name: contains_identifying_metadata, type: boolean, source: input, default: false, description: "Declared by the applicant; screening confirms or refutes it" }
      - { name: status, type: enum, source: system, default: PENDING_SCREEN, description: "Anonymity screening lifecycle", constraints: "PENDING_SCREEN | CLEARED | FLAGGED | REDACTED | REJECTED" }
      - { name: screened_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the screening ProgramOfficer" }

  - name: Panel
    parent: FellowshipCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> FellowshipCycle.id" }
      - { name: discipline_category_id, type: string, source: input, description: "FK -> DisciplineCategory.id" }
      - { name: required_seats, type: integer, source: input, description: "Seats this panel must fill", constraints: ">= 3" }
      - { name: required_regions, type: array, source: input, description: "Regions that must appear among SEATED panelists", constraints: "non-empty subset of {NORTH, CENTRAL, SOUTH, COASTAL, TRIBAL}" }
      - { name: deliberation_window_start, type: datetime, source: input, description: "Inclusive start of the panel's occupation of its panelists" }
      - { name: deliberation_window_end, type: datetime, source: input, description: "Exclusive end of that occupation", constraints: "> deliberation_window_start" }
      - { name: status, type: enum, source: system, default: FORMING, description: "Panel lifecycle; DELIBERATING may return to SCORING for another round", constraints: "FORMING | CHARTERED | SCORING | DELIBERATING | SLATE_SUBMITTED | DISSOLVED" }
      - { name: round_number, type: integer, source: computed, default: 0, description: "Scoring rounds opened so far" }
      - { name: seated_count, type: integer, source: computed, default: 0, description: "Count of Panelists of this panel with status == SEATED" }
      - { name: region_coverage_count, type: integer, source: computed, default: 0, description: "Size of (distinct regions of SEATED panelists) intersected with required_regions" }
      - { name: quorum_min_reviews, type: integer, source: computed, description: "= max(3, ceil(required_seats * QUORUM_SEAT_RATIO))" }
      - { name: quorum_met, type: boolean, source: computed, default: false, description: "= seated_count >= quorum_min_reviews" }
      - { name: blocking_conflict_count, type: integer, source: computed, default: 0, description: "Count of ConflictDeclarations with status == BLOCKING whose panelist_id belongs to this panel" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "0-100 charter gate from calculations.panel_readiness_score" }
      - { name: reopen_required, type: boolean, source: computed, default: false, description: "Set at round close when any assigned application's score_spread exceeds the threshold and another round remains" }
      - { name: assigned_application_count, type: integer, source: computed, default: 0, description: "Count of Applications whose assigned_panel_id is this panel" }
      - { name: chartered_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the chartering ProgramOfficer" }
      - { name: slate_submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant the chair submitted the ranked slate" }

  - name: Panelist
    parent: Panel
    common_fields: true
    fields:
      - { name: panel_id, type: string, source: input, description: "FK -> Panel.id" }
      - { name: person_email, type: string, source: input, description: "Stable identifier of the human across panels; basis of double-booking detection", constraints: "unique per panel_id" }
      - { name: full_name, type: string, source: input, description: "Panelist name" }
      - { name: region, type: enum, source: input, description: "Region the panelist represents", constraints: "NORTH | CENTRAL | SOUTH | COASTAL | TRIBAL" }
      - { name: expertise_codes, type: array, source: input, description: "Discipline codes the panelist is credentialed in", constraints: "non-empty subset of the DisciplineCategory.code enum" }
      - { name: is_chair, type: boolean, source: input, default: false, description: "Chairs are the only panelists who may submit the slate", constraints: "at most one is_chair == true panelist per panel_id" }
      - { name: status, type: enum, source: system, default: NOMINATED, description: "Seat lifecycle", constraints: "NOMINATED | SEATED | RECUSED | RESIGNED" }
      - { name: recused_application_ids, type: array, source: computed, default: [], description: "Application ids this panelist is blocked from, one per BLOCKING ConflictDeclaration" }
      - { name: review_submitted_count, type: integer, source: computed, default: 0, description: "Count of Reviews by this panelist with status == SUBMITTED" }
      - { name: seated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of seating" }

  - name: ConflictDeclaration
    parent: Panelist
    common_fields: true
    fields:
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id", constraints: "unique per (panelist_id, application_id)" }
      - { name: relationship_type, type: enum, source: input, description: "Nature of the relationship", constraints: "TEACHER_STUDENT | IMMEDIATE_FAMILY | CO_AUTHOR | SAME_INSTITUTION | FINANCIAL_INTEREST | PRIOR_MENTOR" }
      - { name: disclosure_note, type: string, source: input, description: "Panelist's written disclosure" }
      - { name: severity, type: enum, source: computed, description: "MANDATORY_BLOCK for relationship_type IN {TEACHER_STUDENT, IMMEDIATE_FAMILY, FINANCIAL_INTEREST}, else DISCRETIONARY", constraints: "MANDATORY_BLOCK | DISCRETIONARY" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "Screening lifecycle; BLOCKING may be reversed only for DISCRETIONARY severity", constraints: "DECLARED | WAIVED | BLOCKING" }
      - { name: screened_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the screening ProgramOfficer" }
      - { name: override_justification, type: string, source: system, default: null, description: "Written justification recorded when a BLOCKING conflict is later waived" }

  - name: Review
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: round_number, type: integer, source: computed, description: "Panel.round_number at creation" }
      - { name: artistic_excellence, type: integer, source: input, description: "Criterion score", constraints: "integer 0..10" }
      - { name: work_sample_quality, type: integer, source: input, description: "Criterion score", constraints: "integer 0..10" }
      - { name: career_impact, type: integer, source: input, description: "Criterion score", constraints: "integer 0..10" }
      - { name: public_value, type: integer, source: input, description: "Criterion score", constraints: "integer 0..10" }
      - { name: comments, type: string, source: input, description: "Panelist commentary shown to the applicant after unsealing" }
      - { name: weighted_score, type: number, source: computed, default: null, description: "Written at submit by calculations.review_weighted_score" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Review lifecycle", constraints: "DRAFT | SUBMITTED | INVALIDATED | SUPERSEDED" }
      - { name: invalidation_reason, type: enum, source: system, default: null, description: "Why a SUBMITTED review stopped counting", constraints: "BLOCKING_CONFLICT | ANONYMITY_BREACH | APPEAL_REMEDY" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submit; tie-break for trimming" }

  - name: RecommendationSlot
    parent: Panel
    common_fields: true
    fields:
      - { name: panel_id, type: string, source: input, description: "FK -> Panel.id" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: cycle_id, type: string, source: computed, description: "FK -> FellowshipCycle.id; denormalized from panel at slate time" }
      - { name: rank, type: integer, source: computed, description: "1-based position in the chair's ranked slate", constraints: "unique per panel_id among status != VOIDED" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Board disposition", constraints: "PROPOSED | BOARD_APPROVED | BOARD_STRUCK | VOIDED" }
      - { name: board_action_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the acting CouncilBoardMember" }
      - { name: struck_reason_code, type: enum, source: system, default: null, description: "Recorded when the board strikes a slot", constraints: "BUDGET | PROCEDURAL_DEFECT | APPLICANT_INELIGIBLE" }
      - { name: awarded_amount_cents, type: integer, source: computed, default: null, description: "Amount the waterfall assigned when the board approved this slot" }

  - name: Award
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: computed, description: "FK -> Application.id" }
      - { name: artist_id, type: string, source: computed, description: "FK -> Artist.id" }
      - { name: cycle_id, type: string, source: computed, description: "FK -> FellowshipCycle.id" }
      - { name: recommendation_slot_id, type: string, source: computed, description: "FK -> RecommendationSlot.id" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Stipend from calculations.award_waterfall_allocation" }
      - { name: is_prorated, type: boolean, source: computed, default: false, description: "True when gross_amount_cents < cycle.base_award_cents" }
      - { name: acceptance_deadline_at, type: datetime, source: computed, description: "= offer instant + cycle.acceptance_window_days days" }
      - { name: grant_period_start, type: datetime, source: computed, description: "Copied from the cycle at offer" }
      - { name: grant_period_end, type: datetime, source: computed, description: "Copied from the cycle at offer" }
      - { name: accept_agreement_version, type: string, source: system, default: null, description: "Version string of the acceptance agreement the artist signed" }
      - { name: tax_certification_signed, type: boolean, source: system, default: false, description: "Whether the artist certified taxpayer information at acceptance" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "Award lifecycle dimension", constraints: "OFFERED | ACCEPTED | ACTIVE | COMPLETED | DECLINED | RESCINDED | FORFEITED" }
      - { name: payment_status, type: enum, source: computed, default: UNPAID, description: "Disbursement dimension, independent of status", constraints: "UNPAID | PARTIALLY_PAID | FULLY_PAID" }
      - { name: reporting_status, type: enum, source: computed, default: NOT_DUE, description: "Public-value reporting dimension, independent of status", constraints: "NOT_DUE | DUE | RECEIVED | ACCEPTED | DELINQUENT" }
      - { name: final_report_due_at, type: datetime, source: computed, default: null, description: "= grant_period_end + cycle.final_report_due_offset_days days, set at acceptance" }
      - { name: scheduled_withholding_cents, type: integer, source: computed, default: 0, description: "Provisional withholding total stamped when installments were generated" }
      - { name: total_withholding_cents, type: integer, source: computed, default: 0, description: "Sum of PaymentInstallment.withholding_cents over installments with status IN {SCHEDULED, HELD, RELEASED, PAID}" }
      - { name: disbursed_gross_cents, type: integer, source: computed, default: 0, description: "Sum of gross_cents over installments with status == PAID" }
      - { name: disbursed_net_cents, type: integer, source: computed, default: 0, description: "Sum of net_cents over installments with status == PAID" }
      - { name: undisbursed_gross_cents, type: integer, source: computed, description: "Sum of gross_cents over installments with status IN {SCHEDULED, HELD, RELEASED}" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the CouncilBoardMember who approved the slot; barred from releasing this award's installments" }
      - { name: rescind_reason_code, type: enum, source: system, default: null, description: "Recorded on rescission", constraints: "APPEAL_REMEDY | INELIGIBILITY_DISCOVERED | APPLICANT_REQUEST" }

  - name: PaymentInstallment
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: computed, description: "FK -> Award.id" }
      - { name: replaces_installment_id, type: string, source: computed, default: null, description: "FK -> PaymentInstallment.id; set on the replacement generated when an installment is reversed" }
      - { name: installment_number, type: integer, source: computed, description: "1-based position in the payment schedule" }
      - { name: scheduled_date, type: datetime, source: computed, description: "= award.grant_period_start + the schedule offset in days" }
      - { name: gross_cents, type: integer, source: computed, description: "Split of award.gross_amount_cents per calculations.installment_payment_schedule" }
      - { name: withholding_rate, type: number, source: computed, description: "Rate applied to this installment; 0 when the artist's tin_status was ON_FILE at the pinning moment" }
      - { name: withholding_cents, type: integer, source: computed, description: "Rounded per-installment withholding" }
      - { name: net_cents, type: integer, source: computed, description: "= gross_cents - withholding_cents" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Disbursement lifecycle", constraints: "SCHEDULED | HELD | RELEASED | PAID | VOIDED | REVERSED" }
      - { name: released_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the releasing FiscalOfficer" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant of release" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock instant of payment; the cash-basis tax-year key" }
      - { name: reversal_reason_code, type: enum, source: system, default: null, description: "Recorded on reversal", constraints: "BANK_RETURN | OVERPAYMENT | FRAUD_HOLD" }
      - { name: hold_reason_code, type: enum, source: system, default: null, description: "Recorded when an installment is held", constraints: "REPORT_DELINQUENT | ARTIST_DEBARRED" }

  - name: FinalReport
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id", constraints: "at most one FinalReport per award_id" }
      - { name: narrative, type: string, source: input, description: "Final narrative report" }
      - { name: public_value_statement, type: string, source: input, description: "Public-value account required of every recipient" }
      - { name: audience_reached_count, type: integer, source: input, description: "Audience reached during the grant period", constraints: ">= 0" }
      - { name: expenditure_summary, type: string, source: input, description: "How the stipend was expended" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Report lifecycle; revisions loop back to SUBMITTED", constraints: "SUBMITTED | REVISION_REQUESTED | ACCEPTED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Revision requests issued so far" }
      - { name: reviewed_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the reviewing ProgramOfficer" }
      - { name: revision_note, type: string, source: system, default: null, description: "Most recent revision instruction" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the latest submission" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of acceptance" }

  - name: Appeal
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id", constraints: "at most one non-DENIED Appeal per application_id" }
      - { name: filed_by_artist_id, type: string, source: computed, description: "FK -> Artist.id; copied from the application at filing" }
      - { name: grounds_code, type: enum, source: input, description: "Grounds cited by the applicant; only the five procedural codes may be screened, SUBSTANTIVE_SCORE_DISAGREEMENT is filed but never screened", constraints: "CONFLICT_NOT_MANAGED | ANONYMITY_BREACH | PANEL_COMPOSITION_DEFECT | SCORING_PROCEDURE_DEFECT | ELIGIBILITY_DETERMINATION_ERROR | SUBSTANTIVE_SCORE_DISAGREEMENT" }
      - { name: statement, type: string, source: input, description: "Appellant's written statement" }
      - { name: status, type: enum, source: system, default: FILED, description: "Appeal lifecycle", constraints: "FILED | SCREENED | UPHELD | DENIED" }
      - { name: remedy_code, type: enum, source: system, default: null, description: "Remedy ordered when the appeal is upheld", constraints: "REINSTATE_ELIGIBILITY | RESCORE_BY_NEW_PANEL | REISSUE_SLATE" }
      - { name: screened_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the screening AppealsOfficer" }
      - { name: decided_by, type: string, source: system, default: null, description: "Opaque X-User-ID of the deciding AppealsOfficer" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of filing" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: FellowshipCycle
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=OPEN"
        actor: ProgramOfficer
        preconditions:
          - "At least one DisciplineCategory exists for this cycle (ERR_CYCLE_HAS_NO_DISCIPLINES)"
          - "sum(DisciplineCategory.allocation_cents for this cycle) <= total_budget_cents - reserve_cents (ERR_ALLOCATION_EXCEEDS_BUDGET)"
        side_effects:
          - "reserve_cents recomputed by calculations.cycle_budget_posture (RESERVE_RATE band)"
          - "available_cents and posture recomputed"

      - from: OPEN
        to: CLOSED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=CLOSED"
        actor: ProgramOfficer
        preconditions:
          - "logical clock >= application_deadline_at (ERR_DEADLINE_NOT_REACHED)"
        side_effects:
          - "Applications of this cycle with status == DRAFT are left untouched but can no longer be submitted (submit window closed)"

      - from: CLOSED
        to: PANEL_REVIEW
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=PANEL_REVIEW"
        actor: ProgramOfficer
        preconditions:
          - "No Application of this cycle has status == SUBMITTED, i.e. every submitted application carries an eligibility determination (ERR_APPLICATION_STATE_INVALID)"
        side_effects: ["posture recomputed"]

      - from: PANEL_REVIEW
        to: BOARD_REVIEW
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=BOARD_REVIEW"
        actor: ProgramOfficer
        preconditions:
          - "Every Panel of this cycle has status IN {DELIBERATING, SLATE_SUBMITTED, DISSOLVED} (ERR_PANEL_STATE_INVALID)"
          - "No Panel of this cycle has reopen_required == true (ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND)"
        side_effects: ["posture recomputed"]

      - from: BOARD_REVIEW
        to: AWARDED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=AWARDED"
        actor: ProgramOfficer
        preconditions:
          - "No RecommendationSlot of this cycle has status == PROPOSED (ERR_SLOTS_PENDING_BOARD_ACTION)"
        side_effects:
          - "Every Application of this cycle with anonymity_status IN {SEALED, REDACTED} becomes UNSEALED (cascade down, ordered by Application.created_at ASC)"
          - "reserve_cents becomes 0 (reserve released), available_cents and posture recomputed"
          - "Applications with status == SCORED and no RecommendationSlot with status == BOARD_APPROVED become NOT_RECOMMENDED, and notified_at is stamped with the logical clock"

      - from: AWARDED
        to: CLOSED_OUT
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=CLOSED_OUT"
        actor: ProgramOfficer
        preconditions:
          - "Every Award of this cycle has status IN {COMPLETED, DECLINED, RESCINDED, FORFEITED} (ERR_CYCLE_HAS_OPEN_AWARDS)"
          - "Every Appeal on Applications of this cycle has status IN {UPHELD, DENIED} (ERR_APPEAL_STATE_INVALID)"
        side_effects: ["Panels of this cycle with status != DISSOLVED become DISSOLVED"]

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=CANCELLED"
        actor: ProgramOfficer
        preconditions: []
        side_effects: ["posture becomes FROZEN"]

      - from: OPEN
        to: CANCELLED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=CANCELLED"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "Every Application of this cycle with status IN {DRAFT, SUBMITTED} becomes WITHDRAWN (cascade down, ordered by Application.created_at ASC)"
          - "posture becomes FROZEN"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, NOT_AWARDED]
    note: "Dimension 1 of 2 — the review lifecycle. anonymity_status (dimension 2) evolves independently and is listed as its own machine below."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grants/applications/{application_id}/submit"
        actor: Artist
        preconditions:
          - "cycle.status == OPEN (ERR_CYCLE_STATE_INVALID)"
          - "application_open_at <= logical clock (ERR_APPLICATION_WINDOW_NOT_OPEN)"
          - "logical clock <= cycle.application_deadline_at (ERR_APPLICATION_DEADLINE_PASSED)"
          - "artist.standing == GOOD_STANDING (ERR_ARTIST_NOT_IN_GOOD_STANDING)"
          - "The artist has no other Application in this cycle with status NOT IN {DRAFT, WITHDRAWN} (ERR_DUPLICATE_APPLICATION)"
          - "work_sample_count >= discipline.required_work_sample_count, every WorkSample.medium is in discipline.allowed_media, and the summed duration_seconds of AUDIO plus VIDEO samples <= discipline.max_total_duration_seconds (ERR_WORK_SAMPLE_REQUIREMENTS_NOT_MET)"
        side_effects:
          - "submitted_at stamped from the logical clock"
          - "discipline.submitted_sequence_counter incremented by 1, then sealed_alias minted as <discipline.alias_prefix>-<cycle.fiscal_year>-<counter zero-padded to 4>"
          - "residency_months_at_deadline frozen by calculations.residency_months_at_deadline"
          - "blackout_gap_years frozen as cycle.fiscal_year - artist.last_award_fiscal_year, or null when artist.last_award_fiscal_year is null"
          - "applicant_legal_name and applicant_region denormalized from the Artist row as of this instant"
          - "discipline.eligible_application_count is NOT changed (it counts post-determination applications only)"

      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /grants/applications/{application_id}/eligibility with determination=ELIGIBLE"
        actor: ProgramOfficer
        preconditions:
          - "cycle.status IN {CLOSED, PANEL_REVIEW} (ERR_CYCLE_STATE_INVALID)"
          - "residency_months_at_deadline >= cycle.residency_min_months (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
          - "blackout_gap_years is null OR blackout_gap_years >= cycle.award_blackout_years (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
          - "artist.is_enrolled_student == false (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
        side_effects:
          - "eligibility_determined_by stamped with the acting officer's X-User-ID"
          - "discipline.eligible_application_count incremented by 1"

      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /grants/applications/{application_id}/eligibility with determination=INELIGIBLE"
        actor: ProgramOfficer
        preconditions:
          - "cycle.status IN {CLOSED, PANEL_REVIEW} (ERR_CYCLE_STATE_INVALID)"
          - "ineligibility_reason_code is present (ERR_INVALID_REQUEST)"
          - "The submitted reason_code matches a failing computed criterion: RESIDENCY_DURATION requires residency_months_at_deadline < cycle.residency_min_months; PRIOR_AWARD_BLACKOUT requires blackout_gap_years is not null and < cycle.award_blackout_years; ENROLLED_STUDENT requires artist.is_enrolled_student == true (ERR_INELIGIBILITY_REASON_UNSUPPORTED)"
        side_effects:
          - "ineligibility_reason_code recorded; eligibility_determined_by stamped with the acting officer's X-User-ID"
          - "notified_at stamped from the logical clock, opening the appeal window"

      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=REINSTATE_ELIGIBILITY (system cascade)"
        actor: system
        preconditions:
          - "The appeal's application_id is this application and the appeal status == SCREENED"
        side_effects:
          - "ineligibility_reason_code cleared; discipline.eligible_application_count incremented by 1"
          - "assigned_panel_id cleared so the next charter can pick the application up"

      - from: ELIGIBLE
        to: UNDER_REVIEW
        trigger: "POST /grants/panels/{panel_id}/charter (system cascade over unassigned eligible applications)"
        actor: system
        preconditions:
          - "assigned_panel_id is null and the application's discipline_category_id equals the chartering panel's discipline_category_id"
          - "anonymity_status IN {SEALED, REDACTED} (ERR_ANONYMITY_BREACH_UNRESOLVED)"
        side_effects:
          - "assigned_panel_id set to the chartering panel; panel.assigned_application_count incremented"

      - from: UNDER_REVIEW
        to: SCORED
        trigger: "POST /grants/panels/{panel_id}/close-round (system cascade)"
        actor: system
        preconditions:
          - "valid_review_count >= panel.quorum_min_reviews (ERR_INSUFFICIENT_REVIEWS)"
          - "panel.reopen_required evaluates to false for this round"
        side_effects:
          - "final_composite_score written by calculations.application_composite_score variant FINAL; review_round_number set to panel.round_number"
          - "score_spread written; provisional_composite_score left at its last value"

      - from: SCORED
        to: RECOMMENDED
        trigger: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action with action=APPROVE (system cascade)"
        actor: system
        preconditions: ["The slot's application_id is this application"]
        side_effects:
          - "notified_at stamped from the logical clock"
          - "An Award is created in OFFERED with gross_amount_cents from calculations.award_waterfall_allocation"

      - from: SCORED
        to: NOT_RECOMMENDED
        trigger: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action with action=STRIKE (system cascade)"
        actor: system
        preconditions: ["The slot's application_id is this application"]
        side_effects: ["notified_at stamped from the logical clock, opening the appeal window"]

      - from: RECOMMENDED
        to: AWARDED
        trigger: "POST /grants/awards/{award_id}/accept"
        actor: Artist
        preconditions: ["The award's application_id is this application"]
        side_effects: ["artist.active_award_count already incremented at offer stays unchanged"]

      - from: RECOMMENDED
        to: NOT_AWARDED
        trigger: "POST /grants/awards/{award_id}/decline, POST /grants/awards/{award_id}/rescind, or forfeiture at the acceptance deadline (system cascade)"
        actor: Artist | ProgramOfficer | system
        preconditions: ["The award's application_id is this application"]
        side_effects: ["notified_at re-stamped from the logical clock"]

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /grants/applications/{application_id}/withdraw"
        actor: Artist
        preconditions: []
        side_effects: ["WorkSamples of this application with status IN {PENDING_SCREEN, FLAGGED} become REJECTED"]

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /grants/applications/{application_id}/withdraw"
        actor: Artist
        preconditions: ["cycle.status IN {OPEN, CLOSED} (ERR_CYCLE_STATE_INVALID)"]
        side_effects:
          - "WorkSamples of this application with status IN {PENDING_SCREEN, FLAGGED} become REJECTED"
          - "cycle.unresolved_breach_count and posture recomputed"

      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /grants/applications/{application_id}/withdraw"
        actor: Artist
        preconditions: ["assigned_panel_id is null (ERR_APPLICATION_STATE_INVALID)"]
        side_effects: ["discipline.eligible_application_count decremented by 1"]

      - from: SCORED
        to: ELIGIBLE
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=RESCORE_BY_NEW_PANEL (system cascade)"
        actor: system
        preconditions: ["The appeal's application_id is this application and the appeal status == SCREENED"]
        side_effects:
          - "Every Review of this application with status == SUBMITTED becomes INVALIDATED with invalidation_reason APPEAL_REMEDY"
          - "valid_review_count, provisional_composite_score, final_composite_score and score_spread recomputed (all null when no counted review remains)"
          - "assigned_panel_id cleared; the former panel's assigned_application_count decremented"

      - from: AWARDED
        to: NOT_AWARDED
        trigger: "POST /grants/awards/{award_id}/rescind (system cascade)"
        actor: system
        preconditions: ["The award's application_id is this application and the award status == ACCEPTED or ACTIVE"]
        side_effects:
          - "notified_at re-stamped from the logical clock"
          - "The RecommendationSlot of this application becomes VOIDED; artist.active_award_count decremented"

      - from: NOT_RECOMMENDED
        to: SCORED
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=REISSUE_SLATE (system cascade)"
        actor: system
        preconditions: ["The appeal's application_id is this application and the appeal status == SCREENED"]
        side_effects: ["The application's VOIDED or BOARD_STRUCK RecommendationSlot returns to PROPOSED"]

  - entity: Application.anonymity_status
    initial_state: SEALED
    terminal_states: [UNSEALED]
    note: "Dimension 2 of 2 on the same Application row — evolves independently of Application.status."
    transitions:
      - from: SEALED
        to: BREACHED
        trigger: "POST /grants/work-samples/{work_sample_id}/screen with disposition=FLAGGED_IDENTIFYING (system cascade)"
        actor: system
        preconditions: ["The work sample belongs to this application"]
        side_effects:
          - "Every Review of this application with status == SUBMITTED becomes INVALIDATED with invalidation_reason ANONYMITY_BREACH"
          - "valid_review_count, provisional_composite_score and score_spread recomputed"
          - "cycle.unresolved_breach_count incremented, then cycle.posture recomputed (FROZEN while any breach is unresolved)"

      - from: BREACHED
        to: REDACTED
        trigger: "POST /grants/work-samples/{work_sample_id}/redact (system cascade)"
        actor: system
        preconditions: ["No WorkSample of this application remains in status FLAGGED"]
        side_effects:
          - "cycle.unresolved_breach_count decremented, then cycle.posture recomputed"

      - from: REDACTED
        to: BREACHED
        trigger: "POST /grants/work-samples/{work_sample_id}/screen with disposition=FLAGGED_IDENTIFYING on a later sample (system cascade)"
        actor: system
        preconditions: ["The work sample belongs to this application"]
        side_effects:
          - "Every Review of this application with status == SUBMITTED becomes INVALIDATED with invalidation_reason ANONYMITY_BREACH"
          - "cycle.unresolved_breach_count incremented, then cycle.posture recomputed"

      - from: SEALED
        to: UNSEALED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=AWARDED (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["applicant_legal_name and applicant_region become visible to the Panelist role"]

      - from: REDACTED
        to: UNSEALED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=AWARDED (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["applicant_legal_name and applicant_region become visible to the Panelist role"]

  - entity: WorkSample
    initial_state: PENDING_SCREEN
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: PENDING_SCREEN
        to: CLEARED
        trigger: "POST /grants/work-samples/{work_sample_id}/screen with disposition=CLEARED"
        actor: ProgramOfficer
        preconditions: ["application.status NOT IN {WITHDRAWN} (ERR_APPLICATION_STATE_INVALID)"]
        side_effects: ["screened_by stamped with the acting officer's X-User-ID"]

      - from: PENDING_SCREEN
        to: FLAGGED
        trigger: "POST /grants/work-samples/{work_sample_id}/screen with disposition=FLAGGED_IDENTIFYING"
        actor: ProgramOfficer
        preconditions: ["application.status NOT IN {WITHDRAWN} (ERR_APPLICATION_STATE_INVALID)"]
        side_effects:
          - "screened_by stamped; application.anonymity_status becomes BREACHED (see the Application.anonymity_status machine, which itself invalidates reviews and freezes the cycle)"

      - from: PENDING_SCREEN
        to: REJECTED
        trigger: "POST /grants/work-samples/{work_sample_id}/screen with disposition=REJECTED"
        actor: ProgramOfficer
        preconditions: ["application.status NOT IN {WITHDRAWN} (ERR_APPLICATION_STATE_INVALID)"]
        side_effects: ["application.work_sample_count decremented by 1"]

      - from: FLAGGED
        to: REDACTED
        trigger: "POST /grants/work-samples/{work_sample_id}/redact"
        actor: ProgramOfficer
        preconditions: ["status == FLAGGED (ERR_WORK_SAMPLE_STATE_INVALID)"]
        side_effects:
          - "contains_identifying_metadata set to false"
          - "When no FLAGGED sample remains on the application, application.anonymity_status becomes REDACTED (bubble up)"

  - entity: Panel
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: CHARTERED
        trigger: "POST /grants/panels/{panel_id}/charter"
        actor: ProgramOfficer
        preconditions:
          - "cycle.status == PANEL_REVIEW (ERR_CYCLE_STATE_INVALID)"
          - "cycle.posture != FROZEN (ERR_CYCLE_POSTURE_FROZEN)"
          - "readiness_score >= CHARTER_READINESS_MIN (ERR_PANEL_NOT_READY)"
          - "At least one SEATED panelist carries the panel's discipline code in expertise_codes (ERR_PANEL_NOT_READY)"
          - "Panels of the same discipline_category_id with status IN {CHARTERED, SCORING, DELIBERATING, SLATE_SUBMITTED} whose [deliberation_window_start, deliberation_window_end) intersects this panel's window number fewer than discipline.max_concurrent_panels (ERR_DISCIPLINE_PANEL_CAPACITY)"
        side_effects:
          - "chartered_by stamped with the acting officer's X-User-ID"
          - "Every Application of this cycle with the panel's discipline_category_id, status == ELIGIBLE, assigned_panel_id null and anonymity_status IN {SEALED, REDACTED} becomes UNDER_REVIEW with assigned_panel_id set to this panel, processed in Application.created_at ASC order"
          - "assigned_application_count set to the number of applications just assigned"

      - from: CHARTERED
        to: SCORING
        trigger: "POST /grants/panels/{panel_id}/open-round"
        actor: ProgramOfficer
        preconditions:
          - "assigned_application_count >= 1 (ERR_PANEL_STATE_INVALID)"
          - "round_number < cycle.max_review_rounds (ERR_PANEL_STATE_INVALID)"
        side_effects: ["round_number incremented by 1"]

      - from: SCORING
        to: DELIBERATING
        trigger: "POST /grants/panels/{panel_id}/close-round"
        actor: ProgramOfficer
        preconditions:
          - "cycle.status == PANEL_REVIEW (ERR_CYCLE_STATE_INVALID)"
          - "Every Application with assigned_panel_id == this panel and status == UNDER_REVIEW has valid_review_count >= quorum_min_reviews (ERR_INSUFFICIENT_REVIEWS)"
        side_effects:
          - "For every assigned UNDER_REVIEW application: score_spread and final_composite_score computed by calculations.application_composite_score variant FINAL"
          - "reopen_required set to true when any assigned application's score_spread > SPREAD_REOPEN_THRESHOLD and round_number < cycle.max_review_rounds, else false"
          - "When reopen_required == false, every assigned UNDER_REVIEW application becomes SCORED"

      - from: DELIBERATING
        to: SCORING
        trigger: "POST /grants/panels/{panel_id}/open-round"
        actor: ProgramOfficer
        preconditions:
          - "reopen_required == true (ERR_PANEL_STATE_INVALID)"
          - "round_number < cycle.max_review_rounds (ERR_PANEL_STATE_INVALID)"
        side_effects:
          - "round_number incremented by 1"
          - "Every Review on this panel's assigned applications with status == SUBMITTED and round_number < the new round becomes SUPERSEDED"
          - "valid_review_count, provisional_composite_score and score_spread recomputed for each assigned application (null when no counted review remains)"
          - "reopen_required reset to false"

      - from: DELIBERATING
        to: SLATE_SUBMITTED
        trigger: "POST /grants/panels/{panel_id}/slate"
        actor: Panelist
        preconditions:
          - "cycle.status == BOARD_REVIEW (ERR_CYCLE_STATE_INVALID)"
          - "The acting panelist is SEATED on this panel with is_chair == true (ERR_NOT_PANEL_CHAIR)"
          - "expected_panel_version equals the panel's current version (ERR_STALE_PANEL_VERSION)"
          - "reopen_required == false (ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND)"
          - "Every Application with assigned_panel_id == this panel and status == SCORED appears exactly once in ranked_application_ids (ERR_INCOMPLETE_SLATE); extraneous ids are judged by the membership precondition below, not by this one"
          - "Every listed application has assigned_panel_id == this panel (ERR_APPLICATION_NOT_ON_PANEL)"
        side_effects:
          - "One RecommendationSlot created per listed application with rank equal to its 1-based position, status PROPOSED, cycle_id copied from the panel"
          - "slate_submitted_at stamped from the logical clock"

      - from: SLATE_SUBMITTED
        to: DISSOLVED
        trigger: "POST /grants/cycles/{cycle_id}/status with to_status=CLOSED_OUT (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["Panelists of this panel with status == SEATED are left as SEATED; no further review may be created"]

      - from: DELIBERATING
        to: SCORING
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=RESCORE_BY_NEW_PANEL (system cascade)"
        actor: system
        preconditions: ["round_number < cycle.max_review_rounds (ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND)"]
        side_effects:
          - "round_number incremented by 1; reopen_required reset to false"
        note: "Reached from the appeal cascade rather than from an operator open-round; the appellant application has already been detached from the panel."

  - entity: Panelist
    initial_state: NOMINATED
    terminal_states: [RESIGNED]
    transitions:
      - from: NOMINATED
        to: SEATED
        trigger: "POST /grants/panelists/{panelist_id}/seat"
        actor: ProgramOfficer
        preconditions:
          - "panel.status == FORMING (ERR_PANEL_STATE_INVALID)"
          - "The panelist carries at least one expertise code (ERR_INVALID_REQUEST)"
          - "No other Panelist with the same person_email is SEATED on another Panel of the same cycle whose [deliberation_window_start, deliberation_window_end) intersects this panel's window (ERR_PANELIST_WINDOW_CONFLICT)"
        side_effects:
          - "seated_at stamped from the logical clock"
          - "panel.seated_count incremented by 1; panel.region_coverage_count recomputed as the number of distinct panel.required_regions covered by SEATED panelists"
          - "panel.quorum_min_reviews, panel.quorum_met and panel.readiness_score recomputed"

      - from: SEATED
        to: RECUSED
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/screen with disposition=BLOCKING (system cascade)"
        actor: system
        preconditions: ["The conflict's panelist_id is this panelist"]
        side_effects:
          - "recused_application_ids gains the conflict's application_id"
          - "panel.blocking_conflict_count incremented; panel.readiness_score recomputed; cycle.blocking_conflict_count and posture recomputed"

      - from: RECUSED
        to: SEATED
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/waive-override (system cascade)"
        actor: system
        preconditions: ["No other ConflictDeclaration for this panelist remains in status BLOCKING"]
        side_effects:
          - "recused_application_ids loses the conflict's application_id"
          - "panel.blocking_conflict_count decremented; panel.readiness_score recomputed; cycle.blocking_conflict_count and posture recomputed"

      - from: NOMINATED
        to: RESIGNED
        trigger: "POST /grants/panelists/{panelist_id}/resign"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []

      - from: SEATED
        to: RESIGNED
        trigger: "POST /grants/panelists/{panelist_id}/resign"
        actor: ProgramOfficer
        preconditions:
          - "panel.status IN {FORMING, CHARTERED, SCORING, DELIBERATING} (ERR_PANEL_STATE_INVALID)"
        side_effects:
          - "panel.seated_count decremented by 1; region_coverage_count, quorum_min_reviews, quorum_met and readiness_score recomputed"
          - "Every Review authored by this panelist with status == SUBMITTED becomes INVALIDATED with invalidation_reason BLOCKING_CONFLICT, and each affected Application's valid_review_count and provisional_composite_score are recomputed"

      - from: RECUSED
        to: RESIGNED
        trigger: "POST /grants/panelists/{panelist_id}/resign"
        actor: ProgramOfficer
        preconditions: ["panel.status IN {FORMING, CHARTERED, SCORING, DELIBERATING} (ERR_PANEL_STATE_INVALID)"]
        side_effects:
          - "panel.blocking_conflict_count decremented by the number of this panelist's BLOCKING conflicts; cycle.blocking_conflict_count and posture recomputed"
          - "panel.seated_count decremented by 1 — recusal kept the seat (it is penalised through the conflict multiplier instead), so resignation is the only event that releases it; region_coverage_count, quorum_min_reviews, quorum_met and readiness_score recomputed"

  - entity: ConflictDeclaration
    initial_state: DECLARED
    terminal_states: []
    transitions:
      - from: DECLARED
        to: BLOCKING
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/screen with disposition=BLOCKING"
        actor: ProgramOfficer
        preconditions:
          - "panel.status IN {FORMING, CHARTERED, SCORING, DELIBERATING, SLATE_SUBMITTED} (ERR_PANEL_STATE_INVALID)"
        side_effects:
          - "screened_by stamped with the acting officer's X-User-ID"
          - "The panelist becomes RECUSED for this application"
          - "Every Review by this panelist on this application with status == SUBMITTED becomes INVALIDATED with invalidation_reason BLOCKING_CONFLICT"
          - "The application's valid_review_count, provisional_composite_score and score_spread are recomputed"
          - "panel.blocking_conflict_count, panel.quorum_met, panel.readiness_score, cycle.blocking_conflict_count and cycle.posture are recomputed"
          - "Every RecommendationSlot for the application with status == PROPOSED becomes VOIDED"

      - from: DECLARED
        to: WAIVED
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/screen with disposition=WAIVED"
        actor: ProgramOfficer
        preconditions:
          - "severity == DISCRETIONARY (ERR_MANDATORY_CONFLICT_NOT_WAIVABLE)"
          - "override_justification is present with length >= 20 (ERR_INVALID_REQUEST)"
        side_effects: ["screened_by stamped with the acting officer's X-User-ID"]

      - from: BLOCKING
        to: WAIVED
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/waive-override"
        actor: ProgramOfficer
        preconditions:
          - "severity == DISCRETIONARY (ERR_MANDATORY_CONFLICT_NOT_WAIVABLE)"
          - "override_justification is present with length >= 20 (ERR_INVALID_REQUEST)"
          - "panel.status IN {CHARTERED, SCORING, DELIBERATING, SLATE_SUBMITTED} (ERR_PANEL_STATE_INVALID)"
        side_effects:
          - "Every Review by this panelist on this application with status == INVALIDATED and invalidation_reason == BLOCKING_CONFLICT returns to SUBMITTED (compensation)"
          - "The application's valid_review_count, provisional_composite_score and score_spread are recomputed back to their pre-block values"
          - "panel.blocking_conflict_count decremented; the panelist returns to SEATED when no other BLOCKING conflict remains; panel.readiness_score, cycle.blocking_conflict_count and cycle.posture recomputed"

  - entity: Review
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grants/reviews/{review_id}/submit"
        actor: Panelist
        preconditions:
          - "panel.status == SCORING (ERR_PANEL_STATE_INVALID)"
          - "The acting panelist authored this review (ERR_NOT_RESOURCE_OWNER)"
          - "application.anonymity_status != BREACHED (ERR_ANONYMITY_BREACH_UNRESOLVED)"
          - "No ConflictDeclaration for this panelist and application has status == BLOCKING (ERR_CONFLICT_BLOCKS_REVIEW)"
          - "round_number == panel.round_number (ERR_REVIEW_STATE_INVALID)"
        side_effects:
          - "submitted_at stamped from the logical clock"
          - "weighted_score computed by calculations.review_weighted_score"
          - "panelist.review_submitted_count incremented by 1"
          - "application.valid_review_count and provisional_composite_score recomputed (calculations.application_composite_score variant PROVISIONAL)"

      - from: SUBMITTED
        to: INVALIDATED
        trigger: "Conflict screened BLOCKING, anonymity breach, panelist resignation, or an upheld appeal (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "invalidation_reason set to BLOCKING_CONFLICT, ANONYMITY_BREACH or APPEAL_REMEDY"
          - "application.valid_review_count and provisional_composite_score recomputed"

      - from: INVALIDATED
        to: SUBMITTED
        trigger: "POST /grants/conflicts/{conflict_declaration_id}/waive-override (system cascade)"
        actor: system
        preconditions: ["invalidation_reason == BLOCKING_CONFLICT"]
        side_effects:
          - "invalidation_reason cleared; application.valid_review_count and provisional_composite_score recomputed"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /grants/panels/{panel_id}/open-round for a later round (system cascade)"
        actor: system
        preconditions: ["round_number < the panel's new round_number"]
        side_effects: ["application.valid_review_count, provisional_composite_score and score_spread recomputed"]

      - from: INVALIDATED
        to: SUPERSEDED
        trigger: "POST /grants/panels/{panel_id}/open-round for a later round (system cascade)"
        actor: system
        preconditions: ["round_number < the panel's new round_number"]
        side_effects: []

  - entity: RecommendationSlot
    initial_state: PROPOSED
    terminal_states: [BOARD_APPROVED, BOARD_STRUCK]
    transitions:
      - from: PROPOSED
        to: BOARD_APPROVED
        trigger: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action with action=APPROVE"
        actor: CouncilBoardMember
        preconditions:
          - "cycle.status == BOARD_REVIEW (ERR_CYCLE_STATE_INVALID)"
          - "expected_cycle_version equals the cycle's current version (ERR_STALE_CYCLE_VERSION)"
          - "cycle.posture == OPEN (ERR_CYCLE_POSTURE_FROZEN when FROZEN, ERR_CYCLE_POSTURE_RESTRICTED when RESTRICTED)"
          - "Every RecommendationSlot of the same panel with a lower rank has status IN {BOARD_APPROVED, BOARD_STRUCK} (ERR_SLOT_RANK_ORDER_VIOLATION)"
          - "application.status == SCORED (ERR_APPLICATION_STATE_INVALID)"
          - "calculations.award_waterfall_allocation yields an amount > 0 (ERR_DISCIPLINE_ALLOCATION_EXHAUSTED)"
          - "The artist's last_award_period_end is null OR the cycle's grant_period_start is at least AWARD_COOLING_DAYS after it (ERR_AWARD_PERIOD_COOLING_VIOLATION)"
        side_effects:
          - "board_action_by stamped with the acting board member's X-User-ID; awarded_amount_cents recorded"
          - "application becomes RECOMMENDED; an Award is created in OFFERED / UNPAID / NOT_DUE"
          - "artist.active_award_count incremented by 1"
          - "cycle.funded_total_cents, admin_assessment_rate, admin_assessment_cents, committed_cents, available_cents and posture recomputed; discipline.committed_cents and funded_application_count updated"

      - from: PROPOSED
        to: BOARD_STRUCK
        trigger: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action with action=STRIKE"
        actor: CouncilBoardMember
        preconditions:
          - "cycle.status == BOARD_REVIEW (ERR_CYCLE_STATE_INVALID)"
          - "expected_cycle_version equals the cycle's current version (ERR_STALE_CYCLE_VERSION)"
          - "struck_reason_code is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "board_action_by stamped; application becomes NOT_RECOMMENDED and notified_at is stamped"

      - from: PROPOSED
        to: VOIDED
        trigger: "Conflict screened BLOCKING on the slot's application (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["panel.reopen_required set to true when the panel may still run another round"]

      - from: BOARD_APPROVED
        to: VOIDED
        trigger: "POST /grants/awards/{award_id}/rescind (system cascade)"
        actor: system
        preconditions: ["The award's recommendation_slot_id is this slot"]
        side_effects:
          - "awarded_amount_cents reset to 0; cycle.funded_total_cents, admin_assessment_cents, committed_cents, available_cents and posture recomputed; discipline.committed_cents and funded_application_count decremented"

      - from: VOIDED
        to: PROPOSED
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=REISSUE_SLATE (system cascade)"
        actor: system
        preconditions: ["cycle.status == BOARD_REVIEW (ERR_CYCLE_STATE_INVALID)"]
        side_effects: ["struck_reason_code and board_action_by cleared"]

      - from: BOARD_STRUCK
        to: PROPOSED
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD and remedy_code=REISSUE_SLATE (system cascade)"
        actor: system
        preconditions: ["cycle.status == BOARD_REVIEW (ERR_CYCLE_STATE_INVALID)"]
        side_effects: ["struck_reason_code and board_action_by cleared; the application returns to SCORED"]

  - entity: Award
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, RESCINDED, FORFEITED]
    note: "Dimension 1 of 3 — the agreement lifecycle. payment_status and reporting_status are independent dimensions on the same row, listed below."
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /grants/awards/{award_id}/accept"
        actor: Artist
        preconditions:
          - "The acting artist is the award's artist (ERR_NOT_RESOURCE_OWNER)"
          - "logical clock <= acceptance_deadline_at (ERR_ACCEPTANCE_DEADLINE_PASSED)"
          - "tax_certification_signed == true in the request body (ERR_TAX_CERTIFICATION_REQUIRED)"
          - "accept_agreement_version equals the constant current agreement version string \"FELLOWSHIP-AGREEMENT-2027.1\" (ERR_INVALID_REQUEST)"
        side_effects:
          - "Three PaymentInstallments created in SCHEDULED by calculations.installment_payment_schedule"
          - "scheduled_withholding_cents set to the sum of the installments' withholding_cents; undisbursed_gross_cents set to gross_amount_cents"
          - "final_report_due_at set to grant_period_end plus cycle.final_report_due_offset_days days"
          - "application becomes AWARDED"

      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /grants/payment-installments/{payment_installment_id}/pay for the first installment (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["payment_status becomes PARTIALLY_PAID or FULLY_PAID (see the payment_status dimension)"]

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /grants/final-reports/{final_report_id}/review with decision=ACCEPT (system cascade)"
        actor: system
        preconditions:
          - "payment_status == FULLY_PAID (ERR_AWARD_STATE_INVALID)"
        side_effects:
          - "reporting_status becomes ACCEPTED; artist.active_award_count decremented and prior_award_count incremented"
          - "artist.last_award_fiscal_year set to cycle.fiscal_year and last_award_period_end set to grant_period_end"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /grants/awards/{award_id}/decline"
        actor: Artist
        preconditions:
          - "The acting artist is the award's artist (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "application becomes NOT_AWARDED; the slot is VOIDED; artist.active_award_count decremented"
          - "cycle.funded_total_cents, admin_assessment_cents, committed_cents, available_cents and posture recomputed; discipline.committed_cents and funded_application_count decremented"

      - from: OFFERED
        to: FORFEITED
        trigger: "POST /_clock/set_current_utc past acceptance_deadline_at (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "application becomes NOT_AWARDED; the slot is VOIDED; artist.active_award_count decremented"
          - "cycle fiscal fields and posture recomputed exactly as for a decline (compensating invariant)"

      - from: OFFERED
        to: RESCINDED
        trigger: "POST /grants/awards/{award_id}/rescind"
        actor: ProgramOfficer
        preconditions:
          - "rescind_reason_code is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "application becomes NOT_AWARDED; the slot is VOIDED; artist.active_award_count decremented"
          - "cycle and discipline fiscal fields and posture recomputed"

      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /grants/awards/{award_id}/rescind"
        actor: ProgramOfficer
        preconditions:
          - "No PaymentInstallment of this award has status IN {RELEASED, PAID} (ERR_AWARD_HAS_DISBURSEMENTS)"
        side_effects:
          - "Every PaymentInstallment with status IN {SCHEDULED, HELD} becomes VOIDED"
          - "scheduled_withholding_cents and undisbursed_gross_cents reset to 0"
          - "application becomes NOT_AWARDED; the slot is VOIDED; cycle and discipline fiscal fields and posture recomputed"

  - entity: Award.payment_status
    initial_state: UNPAID
    terminal_states: []
    note: "Dimension 2 of 3 — derived from the installment ledger and re-derived on every installment write."
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /grants/payment-installments/{payment_installment_id}/pay (system cascade)"
        actor: system
        preconditions: ["At least one but not all non-VOIDED installments of the award are PAID"]
        side_effects:
          - "disbursed_gross_cents, disbursed_net_cents, total_withholding_cents and undisbursed_gross_cents re-derived from the installment ledger"

      - from: PARTIALLY_PAID
        to: FULLY_PAID
        trigger: "POST /grants/payment-installments/{payment_installment_id}/pay (system cascade)"
        actor: system
        preconditions: ["Every non-VOIDED installment of the award is PAID"]
        side_effects: ["undisbursed_gross_cents becomes 0"]

      - from: FULLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /grants/payment-installments/{payment_installment_id}/reverse (system cascade)"
        actor: system
        preconditions: ["At least one non-VOIDED installment of the award is no longer PAID"]
        side_effects:
          - "A replacement installment is created in SCHEDULED referencing the reversed one via replaces_installment_id, restoring the gross conservation identity"

      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "POST /grants/payment-installments/{payment_installment_id}/reverse (system cascade)"
        actor: system
        preconditions: ["No installment of the award remains PAID"]
        side_effects: ["disbursed_gross_cents, disbursed_net_cents and total_withholding_cents return to 0"]

  - entity: Award.reporting_status
    initial_state: NOT_DUE
    terminal_states: [ACCEPTED]
    note: "Dimension 3 of 3 — driven by the logical clock and the FinalReport machine, independent of payment_status."
    transitions:
      - from: NOT_DUE
        to: DUE
        trigger: "POST /_clock/set_current_utc reaching grant_period_end (system cascade)"
        actor: system
        preconditions: ["status IN {ACCEPTED, ACTIVE}"]
        side_effects: []

      - from: DUE
        to: RECEIVED
        trigger: "POST /grants/final-reports (system cascade)"
        actor: system
        preconditions: ["No FinalReport already exists for this award (ERR_DUPLICATE_FINAL_REPORT)"]
        side_effects: []

      - from: DUE
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc past final_report_due_at with no FinalReport on file (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "artist.standing becomes REPORT_DELINQUENT and artist.delinquent_award_count is incremented"
          - "Every PaymentInstallment of this award with status == SCHEDULED becomes HELD with hold_reason_code REPORT_DELINQUENT"

      - from: DELINQUENT
        to: RECEIVED
        trigger: "POST /grants/final-reports (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "artist.delinquent_award_count decremented; artist.standing returns to GOOD_STANDING when delinquent_award_count reaches 0 and the artist is not DEBARRED"
          - "Every HELD installment of this award with hold_reason_code REPORT_DELINQUENT returns to SCHEDULED"

      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /grants/final-reports/{final_report_id}/review with decision=ACCEPT (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["Award.status becomes COMPLETED when payment_status == FULLY_PAID"]

  - entity: PaymentInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, VOIDED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /grants/payment-installments/{payment_installment_id}/release"
        actor: FiscalOfficer
        preconditions:
          - "cycle.status == AWARDED (ERR_CYCLE_STATE_INVALID)"
          - "cycle.posture != FROZEN (ERR_CYCLE_POSTURE_FROZEN)"
          - "award.status IN {ACCEPTED, ACTIVE} (ERR_AWARD_STATE_INVALID)"
          - "The acting fiscal officer's X-User-ID differs from award.approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "logical clock >= scheduled_date (ERR_INSTALLMENT_NOT_DUE)"
          - "Every installment of the award with a lower installment_number has status IN {PAID, RELEASED, VOIDED, REVERSED} (ERR_INSTALLMENT_NOT_DUE)"
        side_effects: ["released_by and released_at stamped"]

      - from: RELEASED
        to: PAID
        trigger: "POST /grants/payment-installments/{payment_installment_id}/pay"
        actor: FiscalOfficer
        preconditions:
          - "cycle.posture != FROZEN (ERR_CYCLE_POSTURE_FROZEN)"
        side_effects:
          - "paid_at stamped from the logical clock"
          - "award.disbursed_gross_cents, disbursed_net_cents, total_withholding_cents, undisbursed_gross_cents and payment_status re-derived; award.status becomes ACTIVE on the first payment"

      - from: SCHEDULED
        to: HELD
        trigger: "Report delinquency or artist debarment (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["hold_reason_code set to REPORT_DELINQUENT or ARTIST_DEBARRED"]

      - from: HELD
        to: SCHEDULED
        trigger: "POST /grants/final-reports (system cascade) when the hold reason is cleared"
        actor: system
        preconditions: ["No other unresolved hold reason applies to the award's artist"]
        side_effects: ["hold_reason_code cleared"]

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /grants/awards/{award_id}/rescind (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["award.scheduled_withholding_cents and undisbursed_gross_cents re-derived"]

      - from: HELD
        to: VOIDED
        trigger: "POST /grants/awards/{award_id}/rescind (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["award.scheduled_withholding_cents and undisbursed_gross_cents re-derived"]

      - from: PAID
        to: REVERSED
        trigger: "POST /grants/payment-installments/{payment_installment_id}/reverse"
        actor: FiscalOfficer
        preconditions:
          - "reversal_reason_code is present (ERR_INVALID_REQUEST)"
          - "award.status IN {ACCEPTED, ACTIVE} (ERR_AWARD_STATE_INVALID)"
        side_effects:
          - "A replacement PaymentInstallment is created in SCHEDULED with the same installment_number, gross_cents, withholding_rate, withholding_cents and net_cents, replaces_installment_id pointing at this row, and scheduled_date equal to the logical clock date"
          - "award.disbursed_gross_cents, disbursed_net_cents, total_withholding_cents, undisbursed_gross_cents and payment_status re-derived so that gross_amount_cents still equals the sum of gross_cents over installments in {SCHEDULED, HELD, RELEASED, PAID}"

  - entity: FinalReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grants/final-reports/{final_report_id}/review with decision=ACCEPT"
        actor: ProgramOfficer
        preconditions:
          - "award.reporting_status IN {RECEIVED} (ERR_AWARD_STATE_INVALID)"
        side_effects:
          - "reviewed_by stamped; accepted_at stamped from the logical clock"
          - "award.reporting_status becomes ACCEPTED; award.status becomes COMPLETED when payment_status == FULLY_PAID"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /grants/final-reports/{final_report_id}/review with decision=REQUEST_REVISION"
        actor: ProgramOfficer
        preconditions:
          - "revision_count < MAX_REPORT_REVISIONS (ERR_MAX_REVISIONS_REACHED)"
          - "revision_note is present with length >= 20 (ERR_INVALID_REQUEST)"
        side_effects: ["revision_count incremented by 1; reviewed_by and revision_note stamped"]

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /grants/final-reports/{final_report_id}/resubmit"
        actor: Artist
        preconditions:
          - "The acting artist is the award's artist (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["narrative, public_value_statement, audience_reached_count and expenditure_summary replaced; submitted_at re-stamped"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: FILED
        to: SCREENED
        trigger: "POST /grants/appeals/{appeal_id}/screen"
        actor: AppealsOfficer
        preconditions:
          - "grounds_code is one of the five procedural grounds CONFLICT_NOT_MANAGED, ANONYMITY_BREACH, PANEL_COMPOSITION_DEFECT, SCORING_PROCEDURE_DEFECT or ELIGIBILITY_DETERMINATION_ERROR; SUBSTANTIVE_SCORE_DISAGREEMENT is refused here (ERR_NON_PROCEDURAL_APPEAL_GROUNDS)"
        side_effects: ["screened_by stamped with the acting appeals officer's X-User-ID"]

      - from: SCREENED
        to: UPHELD
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=UPHOLD"
        actor: AppealsOfficer
        preconditions:
          - "remedy_code is present and permitted for grounds_code (ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS)"
          - "The acting officer's X-User-ID differs from application.eligibility_determined_by (ERR_SEGREGATION_OF_DUTIES)"
          - "cycle.status IN {PANEL_REVIEW, BOARD_REVIEW} (ERR_CYCLE_STATE_INVALID)"
        side_effects:
          - "decided_by stamped"
          - "REINSTATE_ELIGIBILITY: the INELIGIBLE application becomes ELIGIBLE and discipline.eligible_application_count is incremented"
          - "RESCORE_BY_NEW_PANEL: the application's SUBMITTED reviews become INVALIDATED with reason APPEAL_REMEDY, the application returns to ELIGIBLE with assigned_panel_id cleared, and the former panel returns to SCORING with round_number incremented"
          - "REISSUE_SLATE: the application's VOIDED or BOARD_STRUCK RecommendationSlot returns to PROPOSED and the application returns to SCORED"

      - from: SCREENED
        to: DENIED
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=DENY"
        actor: AppealsOfficer
        preconditions:
          - "The acting officer's X-User-ID differs from application.eligibility_determined_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by stamped; no change to the application"]

      - from: FILED
        to: DENIED
        trigger: "POST /grants/appeals/{appeal_id}/decide with decision=DENY"
        actor: AppealsOfficer
        preconditions:
          - "grounds_code == SUBSTANTIVE_SCORE_DISAGREEMENT (ERR_APPEAL_STATE_INVALID when an appeal on any of the five procedural grounds is decided before it has been screened)"
          - "The acting officer's X-User-ID differs from application.eligibility_determined_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by stamped; screened_by stays null and the application is unchanged"
        note: "A substantive disagreement with panel judgement is closed without a procedural screening; this is the only decision path that skips SCREENED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: slot-approve-stale-cycle
    parent_entity: FellowshipCycle
    occ_field: version
    write_endpoint: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"
    guarantee: |
      A board action carries expected_cycle_version. The server compares it against the cycle's
      current version before any fiscal evaluation. A caller that read the cycle before another
      board action, an award rescission or a posture change has a stale value, and its write is
      rejected with ERR_STALE_CYCLE_VERSION (412) leaving the cycle, the slot and the budget
      untouched. Every accepted board action increments FellowshipCycle.version by 1, so a
      re-read is required before the next action.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    serialization: "Board actions are ordered by RecommendationSlot.rank ASC, then by RecommendationSlot.created_at ASC; entity id is never used to order business decisions."

  - rule_id: slate-submit-stale-panel
    parent_entity: Panel
    occ_field: version
    write_endpoint: "POST /grants/panels/{panel_id}/slate"
    guarantee: |
      Slate submission carries expected_panel_version. The server compares it against the panel's
      current version before validating the ranked application list. A chair who read the panel
      before a round was reopened, a panelist resigned or a conflict was screened BLOCKING holds a
      stale value and is rejected with ERR_STALE_PANEL_VERSION (412) with no RecommendationSlot
      created. An accepted slate submission increments Panel.version by 1.
    error_id: ERR_STALE_PANEL_VERSION
    http_status: 412
    serialization: "Slots are created in the order the chair listed the applications; ties never arise because each application appears exactly once."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: residency_months_at_deadline
    description: "Whole calendar months of continuous state residency an applicant holds as of the cycle application deadline, frozen onto the Application at submit time so a later profile edit cannot change an eligibility determination."
    trigger: "POST /grants/applications/{application_id}/submit (frozen into Application.residency_months_at_deadline)"
    inputs:
      - "Artist.residency_start_date (date)"
      - "FellowshipCycle.application_deadline_at (datetime, UTC)"
    algorithm: chronological
    formula: |
      d0 = artist.residency_start_date                       # date
      d1 = date(cycle.application_deadline_at)               # UTC calendar date of the deadline
      months = (d1.year - d0.year) * 12 + (d1.month - d0.month)
      # A month only counts once its day-of-month anniversary has been reached.
      anniversary_day = min(d0.day, days_in_month(d1.year, d1.month))
      if d1.day < anniversary_day:
          months = months - 1
      residency_months_at_deadline = max(0, months)
    constants: {}
    precision: "integer months; no rounding — the day-of-month comparison is exact"
    notes: |
      Eligibility compares with >= : residency_months_at_deadline >= cycle.residency_min_months passes.
      With application_deadline_at = 2026-10-15T23:59:59Z and residency_min_months = 24, a
      residency_start_date of 2024-10-15 yields exactly 24 (eligible) and 2024-10-16 yields 23
      (ineligible with reason RESIDENCY_DURATION).

  - name: review_weighted_score
    description: "Per-review weighted criterion score, computed and stored on the Review at submit time so that later weight-free aggregation never re-derives it."
    trigger: "POST /grants/reviews/{review_id}/submit (writes Review.weighted_score)"
    inputs:
      - "Review.artistic_excellence, work_sample_quality, career_impact, public_value (integers 0..10)"
    algorithm: weighted_scoring
    formula: |
      raw = 0.40 * artistic_excellence
          + 0.30 * work_sample_quality
          + 0.20 * career_impact
          + 0.10 * public_value
      weighted_score = round_half_up(raw, 2)
    constants:
      W_ARTISTIC_EXCELLENCE: 0.40
      W_WORK_SAMPLE_QUALITY: 0.30
      W_CAREER_IMPACT: 0.20
      W_PUBLIC_VALUE: 0.10
    precision: "2 decimal places, round_half_up; the weights sum to exactly 1.00 so the score stays within 0.00..10.00"
    notes: |
      Worked values used throughout the design: (9,8,7,6) -> 8.00, (7,7,6,5) -> 6.60,
      (8,6,8,7) -> 7.30, (5,5,4,9) -> 5.20, (10,9,9,8) -> 9.30, (6,5,5,6) -> 5.50.

  - name: application_composite_score
    description: "Composite panel score for an application. Two variants over the same review set: PROVISIONAL is a plain mean of every counted review, FINAL trims one highest and one lowest review before averaging when the panel is large enough. Both are stored on the Application in different fields, so the divergence is observable in one response."
    trigger: "PROVISIONAL on every Review submit/invalidate/restore/supersede; FINAL on POST /grants/panels/{panel_id}/close-round"
    inputs:
      - "Review.weighted_score for reviews of the application with status == SUBMITTED and round_number == panel.round_number (the counted set)"
      - "Review.created_at (tie-break for trimming)"
      - "Panel.seated_count, Panel.quorum_min_reviews"
    algorithm: weighted_scoring
    formula: |
      counted = [r for r in reviews(application)
                 if r.status == 'SUBMITTED' and r.round_number == panel.round_number]
      counted = sort(counted, key = created_at ASC)     # only sanctioned tie-break
      n = len(counted)
      application.valid_review_count = n
      if n == 0:
          provisional_composite_score = null; final_composite_score = null; score_spread = null
      else:
          # ---- variant PROVISIONAL ----
          provisional_composite_score = round_half_up(sum(r.weighted_score for r in counted) / n, 2)
          # ---- variant FINAL ----
          if panel.seated_count >= TRIM_MIN_SEATS and n >= 3:
              hi = the first review in counted whose weighted_score is maximal   # created_at ASC tie-break
              lo = the first review in counted (excluding hi) whose weighted_score is minimal
              kept = counted without hi and without lo
          else:
              kept = counted
          final_composite_score = round_half_up(sum(r.weighted_score for r in kept) / len(kept), 2)
          # ---- spread is always measured over the counted set, never the trimmed set ----
          score_spread = round_half_up(max(r.weighted_score for r in counted)
                                     - min(r.weighted_score for r in counted), 2)
    constants:
      TRIM_MIN_SEATS: 5
      SPREAD_REOPEN_THRESHOLD: 2.50
    precision: "each review's weighted_score is rounded to 2dp first, then the mean of those rounded values is rounded to 2dp — never average the unrounded criterion sums"
    variants:
      - name: PROVISIONAL
        when: "Recomputed on every review lifecycle event while the panel is SCORING; exposed as Application.provisional_composite_score"
        difference: "Plain mean of every counted review, including outliers. Never trims."
      - name: FINAL
        when: "Written once per round by POST /grants/panels/{panel_id}/close-round; exposed as Application.final_composite_score and used for slate ranking"
        difference: "Drops one highest and one lowest counted review before averaging, but only when panel.seated_count >= 5 and at least 3 reviews are counted; otherwise identical to PROVISIONAL."
    notes: |
      Divergence fixture (5 seats, 5 counted reviews with weighted scores 8.00, 6.60, 7.30, 5.20,
      9.30): PROVISIONAL = 36.40 / 5 = 7.28; FINAL trims 9.30 and 5.20 leaving 8.00 + 6.60 + 7.30
      = 21.90 / 3 = 7.30; score_spread = 9.30 - 5.20 = 4.10 which exceeds SPREAD_REOPEN_THRESHOLD.
      Non-divergence fixture (4 seats, 3 counted reviews 8.00, 6.60, 5.50): no trim because
      seated_count < 5, so PROVISIONAL == FINAL == 20.10 / 3 = 6.70 and score_spread = 2.50 exactly,
      which is NOT greater than the threshold and therefore does not reopen the round.

  - name: panel_readiness_score
    description: "Composite gate that decides whether a panel may be chartered. Multiplies a seat-fill ratio, a geographic-coverage ratio and a conflict penalty, then applies a traditional-arts specialist bonus, all capped at 100."
    trigger: "Recomputed on every panelist seat/resign/recusal and on conflict screening; gates POST /grants/panels/{panel_id}/charter"
    inputs:
      - "Panel.seated_count, Panel.required_seats"
      - "Panel.region_coverage_count (distinct required_regions covered by SEATED panelists), len(Panel.required_regions)"
      - "Panel.blocking_conflict_count"
      - "Panelist.expertise_codes of SEATED panelists"
    algorithm: threshold
    formula: |
      seat_ratio    = min(1.0, seated_count / required_seats)
      region_ratio  = min(1.0, region_coverage_count / len(required_regions))
      conflict_mult = 1 - min(CONFLICT_PENALTY_CAP, CONFLICT_PENALTY_PER * blocking_conflict_count)
      bonus         = TRADITIONAL_SPECIALIST_BONUS if any SEATED panelist has 'TRADITIONAL_ARTS'
                      in expertise_codes else 1.00
      readiness_score = round_half_up(min(100.0,
                          100 * seat_ratio * region_ratio * conflict_mult * bonus), 2)
      charter_allowed = readiness_score >= CHARTER_READINESS_MIN
    constants:
      CONFLICT_PENALTY_PER: 0.08
      CONFLICT_PENALTY_CAP: 0.40
      TRADITIONAL_SPECIALIST_BONUS: 1.10
      CHARTER_READINESS_MIN: 75.00
    precision: "2 decimal places, round_half_up; ratios are capped at 1.0 before multiplication so extra seats never inflate the score"
    notes: |
      Worked values: 5 of 5 seats with full region coverage and no conflict -> 100.00 (capped).
      3 of 5 seats with full coverage -> 60.00, which fails the charter gate even though quorum is met.
      4 of 5 seats with full coverage -> 80.00 (passes). Same 4 of 5 with one blocking conflict ->
      100 * 0.8 * 1.0 * 0.92 = 73.60 (fails). Adding a TRADITIONAL_ARTS specialist to that panel ->
      73.60 * 1.10 = 80.96 (passes).

  - name: cycle_budget_posture
    description: "Reserve, availability and operational posture of a cycle. The reserve is withheld only while the cycle is still deciding, and posture is decided by an ordered first-match cascade so that a safety condition always outranks a fiscal one."
    trigger: "Derived on POST /grants/cycles (so a freshly created DRAFT cycle already reports reserve_cents, available_cents and posture) and recomputed after every cycle status change, board action, award accept/decline/rescind/forfeit, conflict screening and anonymity breach or redaction"
    inputs:
      - "FellowshipCycle.total_budget_cents, status, base_award_cents"
      - "FellowshipCycle.funded_total_cents, admin_assessment_cents, unresolved_breach_count, blocking_conflict_count"
    algorithm: threshold
    formula: |
      if status in {DRAFT, OPEN, CLOSED, PANEL_REVIEW, BOARD_REVIEW}:
          reserve_cents = round_half_up(total_budget_cents * RESERVE_RATE)
      else:                                  # AWARDED, CLOSED_OUT, CANCELLED — reserve released
          reserve_cents = 0
      committed_cents = funded_total_cents + admin_assessment_cents
      available_cents = total_budget_cents - reserve_cents - committed_cents
      # ordered first-match cascade — evaluation order is normative
      if status == 'CANCELLED':                     posture = 'FROZEN'
      elif unresolved_breach_count > 0:             posture = 'FROZEN'
      elif available_cents < base_award_cents:      posture = 'RESTRICTED'
      elif blocking_conflict_count > 0:             posture = 'RESTRICTED'
      else:                                         posture = 'OPEN'
    constants:
      RESERVE_RATE: 0.05
    precision: "integer cents; round_half_up on the reserve product"
    notes: |
      Fixture CycleMain: total_budget_cents 6000000 -> reserve 300000 while deciding.
      After one full award of 1500000: funded 1500000, assessment 127500, committed 1627500,
      available 6000000 - 300000 - 1627500 = 4072500 -> OPEN.
      Fixture CycleSmall: total_budget_cents 2000000 -> reserve 100000; one prorated award of
      1200000 gives assessment 102000, committed 1302000, available 598000 which is below
      base_award_cents 1500000 -> RESTRICTED.

  - name: cycle_admin_assessment
    description: "Administrative assessment the council retains on funded fellowships. The rate is chosen from a tier table keyed on the pre-assessment funded total; the tier is deliberately NOT re-selected after the assessment pushes the committed total across the next boundary."
    trigger: "Recomputed whenever FellowshipCycle.funded_total_cents changes (board approval, award decline, rescission, forfeiture)"
    inputs:
      - "FellowshipCycle.funded_total_cents (pre-assessment sum of gross_amount_cents over Awards with status NOT IN {DECLINED, RESCINDED, FORFEITED})"
    algorithm: tiered_pricing
    formula: |
      base = funded_total_cents                       # pre-assessment basis, evaluated ONCE
      if   base == 0:                admin_assessment_rate = 0.0   # nothing funded yet
      elif base <= TIER1_MAX_CENTS:  admin_assessment_rate = TIER1_RATE
      elif base <= TIER2_MAX_CENTS:  admin_assessment_rate = TIER2_RATE
      else:                          admin_assessment_rate = TIER3_RATE
      admin_assessment_cents = round_half_up(base * admin_assessment_rate)
      committed_cents = base + admin_assessment_cents
      # NOTE: the rate is not re-selected against committed_cents. Selecting on the
      # post-assessment total is the forbidden reading.
    constants:
      TIER1_MAX_CENTS: 2000000
      TIER1_RATE: 0.085
      TIER2_MAX_CENTS: 8000000
      TIER2_RATE: 0.070
      TIER3_RATE: 0.055
    precision: "integer cents, round_half_up; a single flat rate applies to the whole basis (average rate, not marginal)"
    notes: |
      Boundary fixture: funded_total_cents exactly 2000000 sits in tier 1, so the rate is 0.085,
      the assessment is 170000 and committed_cents is 2170000. Re-selecting the tier against
      committed_cents 2170000 would wrongly yield 0.070 -> 140000 -> 2140000.
      One award of 1500000 alone: tier 1, 0.085 -> 127500 -> committed 1627500.

  - name: award_waterfall_allocation
    description: "Amount offered for an approved recommendation slot. Discipline allocation fills rank by rank; a slot that cannot be paid in full is either prorated down to the cycle floor or skipped entirely, depending on the cycle proration policy."
    trigger: "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action with action=APPROVE (writes RecommendationSlot.awarded_amount_cents and Award.gross_amount_cents)"
    inputs:
      - "FellowshipCycle.base_award_cents, min_prorated_award_cents, proration_policy"
      - "DisciplineCategory.allocation_cents, DisciplineCategory.committed_cents"
    algorithm: waterfall_allocation
    formula: |
      remaining = discipline.allocation_cents - discipline.committed_cents
      if remaining >= cycle.base_award_cents:
          gross_amount_cents = cycle.base_award_cents; is_prorated = false
      elif remaining >= cycle.min_prorated_award_cents and cycle.proration_policy == 'PRORATE':
          gross_amount_cents = remaining;              is_prorated = true
      else:
          reject with ERR_DISCIPLINE_ALLOCATION_EXHAUSTED
      # discipline.committed_cents accumulates gross only; the cycle-level administrative
      # assessment is held against the cycle budget, not against a discipline allocation.
    constants: {}
    precision: "integer cents; no rounding — every branch returns an exact stored amount"
    notes: |
      Fixture CycleMain / LITERARY_ARTS allocation 2000000, base_award 1500000,
      min_prorated_award 500000, policy PRORATE:
        rank 1 -> remaining 2000000 >= 1500000 -> 1500000 full, committed 1500000
        rank 2 -> remaining 500000, below base but exactly at the prorated floor -> 500000 prorated
        rank 3 -> remaining 0 -> ERR_DISCIPLINE_ALLOCATION_EXHAUSTED
      With proration_policy SKIP_TO_ALTERNATE the rank 2 slot is rejected with the same error
      instead of being prorated.

  - name: installment_payment_schedule
    description: "Three-installment disbursement schedule generated when an award is accepted, with tax withholding applied per installment. Rounding is applied to each installment and the last installment absorbs the remainder, so both the gross and the withholding are conserved exactly."
    trigger: "POST /grants/awards/{award_id}/accept (creates three PaymentInstallment rows)"
    inputs:
      - "Award.gross_amount_cents, Award.grant_period_start"
      - "Artist.tin_status"
    algorithm: aggregation
    formula: |
      rate = WITHHOLDING_RATE_NO_TIN if artist.tin_status != 'ON_FILE' else 0.0
      g1 = round_half_up(gross_amount_cents * SPLIT_1)
      g2 = round_half_up(gross_amount_cents * SPLIT_2)
      g3 = gross_amount_cents - g1 - g2                  # remainder absorbs the rounding drift
      for i, gi in [(1, g1), (2, g2), (3, g3)]:
          withholding_cents_i = round_half_up(gi * rate)       # rounded PER INSTALLMENT
          net_cents_i         = gi - withholding_cents_i
          scheduled_date_i    = date(award.grant_period_start) + OFFSET_DAYS[i] days
      award.scheduled_withholding_cents = withholding_cents_1 + withholding_cents_2 + withholding_cents_3
      # NOTE: the award-level withholding is the SUM OF THE ROUNDED per-installment amounts.
      # Rounding the product gross_amount_cents * rate once is the forbidden reading.
    constants:
      SPLIT_1: 0.40
      SPLIT_2: 0.35
      SPLIT_3: "remainder"
      OFFSET_DAYS: [0, 120, 240]
      WITHHOLDING_RATE_NO_TIN: 0.2707
    precision: "integer cents; round_half_up per installment; the third installment is a subtraction so sum(gross_cents) == Award.gross_amount_cents exactly"
    notes: |
      Fixture: gross_amount_cents 1500000, tin_status MISSING (rate 0.2707),
      grant_period_start 2027-01-01.
        installment 1: gross 600000, withholding 162420, net 437580, scheduled 2027-01-01
        installment 2: gross 525000, withholding 142118, net 382882, scheduled 2027-05-01
        installment 3: gross 375000, withholding 101513, net 273487, scheduled 2027-08-29
      Sum of rounded withholding = 406051. Rounding once over the whole gross would give
      round_half_up(1500000 * 0.2707) = 406050 — a one-cent divergence that the per-installment
      order must produce. Nets sum to 1093949 = 1500000 - 406051.

  - name: award_tax_reportable_amount
    description: "Tax reporting figures for one award and one tax year. Two variants over the same installment ledger: ACCRUAL reports what was scheduled in the year, CASH reports only what was actually paid in the year."
    trigger: "GET /grants/awards/{award_id}/tax-report"
    inputs:
      - "PaymentInstallment.gross_cents, withholding_cents, net_cents, status, scheduled_date, paid_at for the award"
      - "query parameters tax_year and basis"
    algorithm: aggregation
    formula: |
      if basis == 'ACCRUAL':
          rows = [i for i in installments(award)
                  if i.status != 'VOIDED' and year(i.scheduled_date) == tax_year]
      else:  # CASH
          rows = [i for i in installments(award)
                  if i.status == 'PAID' and i.paid_at is not null and year(i.paid_at) == tax_year]
      reportable_gross_cents  = sum(i.gross_cents for i in rows)
      reportable_withholding_cents = sum(i.withholding_cents for i in rows)
      reportable_net_cents    = reportable_gross_cents - reportable_withholding_cents
      installment_count       = len(rows)
      # A REVERSED installment keeps its original paid_at, so it leaves the CASH basis for the
      # year only once its replacement is paid in a different year; ACCRUAL follows scheduled_date.
    constants: {}
    precision: "integer cents; sums of already-rounded per-installment amounts — never re-derive withholding from the rate here"
    variants:
      - name: ACCRUAL
        when: "basis=ACCRUAL (the default) — the council's obligation view"
        difference: "Counts every non-VOIDED installment whose scheduled_date falls in the tax year, paid or not."
      - name: CASH
        when: "basis=CASH — the recipient's constructive-receipt view"
        difference: "Counts only PAID installments whose paid_at falls in the tax year; a scheduled-but-unpaid installment contributes nothing."
    notes: |
      Fixture (the 1500000 award above, all three installments scheduled in 2027, installments 1
      and 2 paid during 2027 and installment 3 paid on 2028-01-10):
        tax_year 2027 basis ACCRUAL -> gross 1500000, withholding 406051, net 1093949, count 3
        tax_year 2027 basis CASH    -> gross 1125000, withholding 304538, net 820462,  count 2
        tax_year 2028 basis CASH    -> gross 375000,  withholding 101513, net 273487,  count 1
        tax_year 2028 basis ACCRUAL -> gross 0, withholding 0, net 0, count 0

  - name: cycle_diversity_evaluation
    description: "Program evaluation over the eligible applicant pool of a cycle: regional concentration measured as a Herfindahl-Hirschman index, a derived geographic distribution score, and per-discipline funding rates."
    trigger: "GET /grants/cycles/{cycle_id}/evaluation"
    inputs:
      - "Applications of the cycle with status NOT IN {DRAFT, WITHDRAWN, INELIGIBLE} (the eligible pool)"
      - "Application.applicant_region, Application.discipline_category_id"
      - "Awards of the cycle with status NOT IN {DECLINED, RESCINDED, FORFEITED}"
    algorithm: aggregation
    formula: |
      pool = [a for a in applications(cycle)
              if a.status not in {'DRAFT','WITHDRAWN','INELIGIBLE'}]
      total = len(pool)
      if total == 0:
          return { eligible_pool_size: 0, region_hhi: null,
                   geographic_distribution_score: null, funded_rate: null,
                   region_breakdown: [], discipline_breakdown: [] }
      for each region r present in pool:
          share_r = count_r / total
      region_hhi = round_half_up(sum(share_r ** 2 for r in regions), 4)
      # the score is derived from the ROUNDED hhi — evaluation order is normative
      geographic_distribution_score = round_half_up(HHI_SCORE_FACTOR * (1 - region_hhi), 2)
      funded_rate = round_half_up(len(awards) / total, 4)
      region_breakdown     = regions sorted by region code ASC with applicant_count and share
      discipline_breakdown = disciplines sorted by code ASC with eligible_application_count,
                             funded_application_count and committed_cents
    constants:
      HHI_SCORE_FACTOR: 125
    precision: "region_hhi and funded_rate at 4 decimal places, geographic_distribution_score at 2 decimal places, both round_half_up; the score consumes the rounded hhi"
    notes: |
      Fixture: pool of 3 with regions NORTH, NORTH, SOUTH.
        shares 2/3 and 1/3 -> raw hhi 0.5555555... -> region_hhi 0.5556
        geographic_distribution_score = round_half_up(125 * (1 - 0.5556)) = round_half_up(55.55) = 55.55
      Deriving the score from the unrounded hhi would give 125 * 0.4444444 = 55.5556 -> 55.56.
      An empty pool returns nulls rather than dividing by zero.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first violation wins)
# =============================================================================
# Priority ladder (normative evaluation order for every endpoint):
#   P10 authentication -> P20 role -> P30 request shape -> P40 path existence ->
#   P45 body foreign-key existence -> P50 ownership -> P55 segregation of duties ->
#   P60 optimistic concurrency -> P65 target-entity state -> P70 cross-entity state and
#   cycle posture -> P75 business safety (anonymity, conflicts) -> P80 business temporal
#   (deadlines, windows, overlaps) -> P85 business constraint (uniqueness, eligibility,
#   quorum, grounds) -> P90 business referential -> P95 business fiscal
validations:

  - priority: 10
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Every endpoint except POST /_clock/set_current_utc requires an X-User-ID header identifying the caller."

  - priority: 10
    category: auth
    check: "X-User-Role header present and one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "A missing or unrecognized X-User-Role is an authentication failure, not an authorization failure, because the caller has not established an identity."

  - priority: 20
    category: authz
    check: "The caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role gate evaluated before any body parsing, so an unauthorized caller cannot learn whether a resource exists or whether a body is well-formed."

  - priority: 20
    category: authz
    check: "For Artist-role callers, X-User-ID resolves to an existing Artist row"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["POST /grants/applications", "POST /grants/applications/{application_id}/submit", "POST /grants/applications/{application_id}/withdraw", "POST /grants/work-samples", "POST /grants/awards/{award_id}/accept", "POST /grants/awards/{award_id}/decline", "POST /grants/final-reports", "POST /grants/final-reports/{final_report_id}/resubmit", "POST /grants/appeals"]
    description: "The Artist role is entity_backed: an X-User-ID that matches no Artist row cannot act."

  - priority: 20
    category: authz
    check: "For Panelist-role callers, X-User-ID resolves to an existing Panelist row"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["POST /grants/reviews", "POST /grants/reviews/{review_id}/submit", "POST /grants/conflicts", "POST /grants/panels/{panel_id}/slate"]
    description: "The Panelist role is entity_backed: an X-User-ID that matches no Panelist row cannot act."

  - priority: 30
    category: request_shape
    check: "All required body fields present, correct JSON types, enum values within the declared set, integers within their declared ranges, non-empty strings where a minimum length is declared, and datetimes in ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Shape validation covers criterion scores outside 0..10, unknown enum members, negative cents, rank lists containing duplicates, grant_period_end not after grant_period_start, deliberation_window_end not after deliberation_window_start, and application_deadline_at not after application_open_at."

  - priority: 30
    category: request_shape
    check: "Pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["all list endpoints"]
    description: "limit defaults to 10 and offset to 0; out-of-band values are rejected rather than clamped."

  - priority: 40
    category: existence
    check: "Every {id} path parameter resolves to an existing row of the matching entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all
    description: "Path existence precedes body FK existence, ownership and state, so a stale path id always yields the entity-specific 404 (for example ERR_APPLICATION_NOT_FOUND, ERR_PANEL_NOT_FOUND, ERR_AWARD_NOT_FOUND)."

  - priority: 45
    category: existence
    check: "Every foreign-key field in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /grants/discipline-categories", "POST /grants/applications", "POST /grants/work-samples", "POST /grants/panels", "POST /grants/panelists", "POST /grants/conflicts", "POST /grants/reviews", "POST /grants/final-reports", "POST /grants/appeals", "POST /grants/panels/{panel_id}/slate"]
    description: "Body FK checks run in the order the fields are declared in §1.5, so a request with two bad references reports the first declared one."

  - priority: 50
    category: ownership
    check: "An Artist caller may only act on their own Application, WorkSample, Award, FinalReport or Appeal; a Panelist caller may only act on their own Review"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /grants/applications", "POST /grants/applications/{application_id}/submit", "POST /grants/applications/{application_id}/withdraw", "POST /grants/work-samples", "POST /grants/awards/{award_id}/accept", "POST /grants/awards/{award_id}/decline", "POST /grants/final-reports", "POST /grants/final-reports/{final_report_id}/resubmit", "POST /grants/appeals", "POST /grants/reviews", "POST /grants/reviews/{review_id}/submit"]
    description: "Ownership is checked after existence so a caller cannot probe another artist's ids and get a different status code than for a nonexistent id."

  - priority: 55
    category: segregation_of_duties
    check: "The releasing fiscal officer's X-User-ID differs from Award.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /grants/payment-installments/{payment_installment_id}/release"]
    description: "The person who approved the award on the board may not also release its money."

  - priority: 55
    category: segregation_of_duties
    check: "The deciding appeals officer's X-User-ID differs from Application.eligibility_determined_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /grants/appeals/{appeal_id}/decide"]
    description: "The officer who made the eligibility determination under appeal may not decide the appeal against their own determination."

  - priority: 55
    category: authz
    check: "The acting panelist is SEATED on the panel with is_chair == true"
    error_id: ERR_NOT_PANEL_CHAIR
    http_status: 403
    applies_to: ["POST /grants/panels/{panel_id}/slate"]
    description: "Only the panel chair may transmit the funding recommendation, and only while seated."

  - priority: 60
    category: concurrency
    check: "expected_cycle_version equals FellowshipCycle.version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: ["POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"]
    description: "See §1.2.1 slot-approve-stale-cycle. Checked before any state, posture or fiscal evaluation so a stale caller never learns the budget outcome."

  - priority: 60
    category: concurrency
    check: "expected_panel_version equals Panel.version"
    error_id: ERR_STALE_PANEL_VERSION
    http_status: 412
    applies_to: ["POST /grants/panels/{panel_id}/slate"]
    description: "See §1.2.1 slate-submit-stale-panel. Checked before the slate completeness check."

  - priority: 64
    category: business_temporal
    check: "The logical clock is at or before Award.acceptance_deadline_at"
    error_id: ERR_ACCEPTANCE_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /grants/awards/{award_id}/accept"]
    description: "An award not accepted within cycle.acceptance_window_days is forfeited by the clock-advance checkpoint, which leaves it in FORFEITED. This temporal check therefore deliberately outranks the generic P65 state check so the response names the proximate cause (the lapsed deadline) rather than the consequence (ERR_AWARD_STATE_INVALID); accepting an award twice inside the window still reports the P65 state error."

  - priority: 65
    category: state
    check: "The target entity is in a state that permits the requested transition"
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    http_status: 409
    applies_to: ["all action endpoints"]
    description: "Per-entity codes ERR_CYCLE_STATE_INVALID, ERR_APPLICATION_STATE_INVALID, ERR_WORK_SAMPLE_STATE_INVALID, ERR_PANEL_STATE_INVALID, ERR_PANELIST_STATE_INVALID, ERR_CONFLICT_STATE_INVALID, ERR_REVIEW_STATE_INVALID, ERR_SLOT_STATE_INVALID, ERR_AWARD_STATE_INVALID, ERR_INSTALLMENT_STATE_INVALID, ERR_FINAL_REPORT_STATE_INVALID, ERR_APPEAL_STATE_INVALID. Terminal states reject every trigger, and a repeated trigger is rejected the second time rather than being idempotent."

  - priority: 70
    category: cross_entity_state
    check: "The owning FellowshipCycle is in the state the operation requires"
    error_id: ERR_CYCLE_STATE_INVALID
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit", "POST /grants/applications/{application_id}/eligibility", "POST /grants/panels/{panel_id}/charter", "POST /grants/panels/{panel_id}/close-round", "POST /grants/panels/{panel_id}/slate", "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action", "POST /grants/payment-installments/{payment_installment_id}/release", "POST /grants/appeals/{appeal_id}/decide"]
    description: "Cross-entity state is checked on the parent cycle before posture, safety, temporal, uniqueness and fiscal rules."

  - priority: 70
    category: cross_entity_state
    check: "The owning Panel is in state SCORING before a review may be submitted"
    error_id: ERR_PANEL_STATE_INVALID
    http_status: 409
    applies_to: ["POST /grants/reviews/{review_id}/submit"]
    description: "A review that is legal in isolation is rejected when its panel has not opened a scoring round or has already closed one."

  - priority: 70
    category: cross_entity_state
    check: "The owning Award is in state ACCEPTED or ACTIVE before an installment may be released or paid"
    error_id: ERR_AWARD_STATE_INVALID
    http_status: 409
    applies_to: ["POST /grants/payment-installments/{payment_installment_id}/release", "POST /grants/payment-installments/{payment_installment_id}/pay", "POST /grants/payment-installments/{payment_installment_id}/reverse"]
    description: "Money never moves on an award that was declined, rescinded or forfeited, even when the installment row itself is still SCHEDULED."

  - priority: 70
    category: cross_entity_state
    check: "FellowshipCycle.posture is not FROZEN"
    error_id: ERR_CYCLE_POSTURE_FROZEN
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/charter", "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action", "POST /grants/payment-installments/{payment_installment_id}/release", "POST /grants/payment-installments/{payment_installment_id}/pay"]
    description: "An unresolved anonymity breach or a cancelled cycle freezes chartering, board action and disbursement."

  - priority: 70
    category: cross_entity_state
    check: "FellowshipCycle.posture is not RESTRICTED for board approval"
    error_id: ERR_CYCLE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: ["POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"]
    description: "A cycle whose available budget has fallen below one base award, or which carries an unmanaged blocking conflict, cannot approve further slots. This outranks the fiscal allocation check at P95, so an approval that violates both reports the posture error."

  - priority: 70
    category: cross_entity_state
    check: "The applying Artist has standing GOOD_STANDING"
    error_id: ERR_ARTIST_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit"]
    description: "A report-delinquent or debarred artist cannot submit a new application even though the application row itself is a valid DRAFT."

  - priority: 75
    category: business_safety
    check: "No ConflictDeclaration in status BLOCKING exists for the acting panelist and the reviewed application"
    error_id: ERR_CONFLICT_BLOCKS_REVIEW
    http_status: 409
    applies_to: ["POST /grants/reviews", "POST /grants/reviews/{review_id}/submit"]
    description: "Conflict management is a safety rule and outranks the referential check that the panelist is seated on the reviewed application's panel (P90), so a recused panelist reviewing an application on another panel reports the conflict error."

  - priority: 75
    category: business_safety
    check: "The reviewed Application has anonymity_status other than BREACHED"
    error_id: ERR_ANONYMITY_BREACH_UNRESOLVED
    http_status: 409
    applies_to: ["POST /grants/reviews/{review_id}/submit", "POST /grants/panels/{panel_id}/charter"]
    description: "Anonymous review protocol: no score may be recorded on an application whose identifying material has been exposed and not yet redacted."

  - priority: 75
    category: business_safety
    check: "A conflict with severity MANDATORY_BLOCK is never waivable"
    error_id: ERR_MANDATORY_CONFLICT_NOT_WAIVABLE
    http_status: 409
    applies_to: ["POST /grants/conflicts/{conflict_declaration_id}/screen", "POST /grants/conflicts/{conflict_declaration_id}/waive-override"]
    description: "TEACHER_STUDENT, IMMEDIATE_FAMILY and FINANCIAL_INTEREST relationships are mandatory blocks; only DISCRETIONARY conflicts may be waived or overridden."

  - priority: 80
    category: business_temporal
    check: "The logical clock is at or after FellowshipCycle.application_open_at"
    error_id: ERR_APPLICATION_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit"]
    description: "Submission before the advertised opening instant is rejected."

  - priority: 80
    category: business_temporal
    check: "The logical clock is at or before FellowshipCycle.application_deadline_at"
    error_id: ERR_APPLICATION_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit"]
    description: "Deadline enforcement outranks the duplicate-application uniqueness check at P85, so a second submission after the deadline reports the deadline error."

  - priority: 80
    category: business_temporal
    check: "The logical clock is at or after FellowshipCycle.application_deadline_at before the cycle may close"
    error_id: ERR_DEADLINE_NOT_REACHED
    http_status: 409
    applies_to: ["POST /grants/cycles/{cycle_id}/status"]
    description: "A cycle cannot be closed early while the published deadline is still in the future."

  - priority: 80
    category: business_temporal
    check: "No other Panelist with the same person_email is SEATED on another Panel of the cycle whose half-open deliberation window intersects this panel's window"
    error_id: ERR_PANELIST_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /grants/panelists/{panelist_id}/seat"]
    description: "Overlap is measured on half-open intervals [deliberation_window_start, deliberation_window_end), so a panel that starts exactly when another ends is not a conflict."

  - priority: 80
    category: business_temporal
    check: "The logical clock is at or after PaymentInstallment.scheduled_date and every lower-numbered installment has already left SCHEDULED or HELD"
    error_id: ERR_INSTALLMENT_NOT_DUE
    http_status: 409
    applies_to: ["POST /grants/payment-installments/{payment_installment_id}/release"]
    description: "Installments are released in order and never early."

  - priority: 80
    category: business_temporal
    check: "The appeal is filed within cycle.appeal_window_days of Application.notified_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /grants/appeals"]
    description: "notified_at must be set (the applicant must have been notified) and the logical clock must be within the window; the window boundary itself is inclusive."

  - priority: 80
    category: business_temporal
    check: "The Award grant period starts at least AWARD_COOLING_DAYS after the artist's last_award_period_end"
    error_id: ERR_AWARD_PERIOD_COOLING_VIOLATION
    http_status: 409
    applies_to: ["POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"]
    description: "Closed-interval cooling buffer of 365 days between consecutive grant periods for the same artist; a gap of exactly 365 days is permitted."

  - priority: 80
    category: business_temporal
    check: "Award.reporting_status is DUE, RECEIVED or DELINQUENT before a final report may be filed"
    error_id: ERR_FINAL_REPORT_NOT_DUE
    http_status: 409
    applies_to: ["POST /grants/final-reports"]
    description: "A final narrative report cannot be filed before the grant period ends."

  - priority: 85
    category: business_constraint
    check: "The artist has no other Application in the cycle with status outside {DRAFT, WITHDRAWN}"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit"]
    description: "One live application per artist per cycle, enforced at submit rather than at draft creation so that a withdrawn attempt can be replaced."

  - priority: 85
    category: business_constraint
    check: "Work sample count, media and total duration satisfy the discipline requirements"
    error_id: ERR_WORK_SAMPLE_REQUIREMENTS_NOT_MET
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/submit"]
    description: "At least required_work_sample_count CLEARED-or-PENDING samples, every medium within allowed_media, and the summed duration of AUDIO plus VIDEO samples at or below max_total_duration_seconds."

  - priority: 85
    category: business_constraint
    check: "The requested eligibility determination matches the server-computed verdict"
    error_id: ERR_ELIGIBILITY_CRITERIA_NOT_MET
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/eligibility"]
    description: "An ELIGIBLE determination is rejected when residency months fall short, the prior-award blackout gap is too small, or the applicant is an enrolled student."

  - priority: 85
    category: business_constraint
    check: "The submitted ineligibility_reason_code corresponds to a criterion that actually fails"
    error_id: ERR_INELIGIBILITY_REASON_UNSUPPORTED
    http_status: 409
    applies_to: ["POST /grants/applications/{application_id}/eligibility"]
    description: "An officer may not record RESIDENCY_DURATION for an applicant whose residency is sufficient, and so on for PRIOR_AWARD_BLACKOUT and ENROLLED_STUDENT."

  - priority: 85
    category: business_constraint
    check: "Every application assigned to the panel has at least quorum_min_reviews counted reviews"
    error_id: ERR_INSUFFICIENT_REVIEWS
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/close-round"]
    description: "quorum_min_reviews = max(3, ceil(required_seats * 0.60)); invalidated, superseded and draft reviews do not count."

  - priority: 85
    category: business_constraint
    check: "Panel.readiness_score is at least CHARTER_READINESS_MIN and a discipline-matching expert is seated"
    error_id: ERR_PANEL_NOT_READY
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/charter"]
    description: "Seat fill, geographic coverage, conflict load and discipline expertise are all folded into the readiness gate of 75.00."

  - priority: 85
    category: business_constraint
    check: "Panel.reopen_required is false"
    error_id: ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/slate", "POST /grants/cycles/{cycle_id}/status"]
    description: "A panel whose score spread exceeded the reopen threshold must run its second round before a slate may be transmitted or the cycle may advance to board review."

  - priority: 85
    category: business_constraint
    check: "Every SCORED application of the panel appears exactly once in ranked_application_ids"
    error_id: ERR_INCOMPLETE_SLATE
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/slate"]
    description: "A slate may neither omit nor duplicate a scored application. Extraneous ids are NOT judged here — they fall to the P90 membership check, so listing an application that belongs to no panel reports ERR_APPLICATION_NOT_ON_PANEL."

  - priority: 85
    category: business_constraint
    check: "No RecommendationSlot of the cycle is still PROPOSED before the cycle may advance to AWARDED"
    error_id: ERR_SLOTS_PENDING_BOARD_ACTION
    http_status: 409
    applies_to: ["POST /grants/cycles/{cycle_id}/status"]
    description: "The board must dispose of every proposed slot before awards are finalized."

  - priority: 85
    category: business_constraint
    check: "Every Award of the cycle has reached a terminal state before the cycle may close out"
    error_id: ERR_CYCLE_HAS_OPEN_AWARDS
    http_status: 409
    applies_to: ["POST /grants/cycles/{cycle_id}/status"]
    description: "Close-out requires every award COMPLETED, DECLINED, RESCINDED or FORFEITED."

  - priority: 85
    category: business_constraint
    check: "No RELEASED or PAID installment exists on an award being rescinded"
    error_id: ERR_AWARD_HAS_DISBURSEMENTS
    http_status: 409
    applies_to: ["POST /grants/awards/{award_id}/rescind"]
    description: "Once money has left the council the award must be closed through reversal and reporting, not rescission."

  - priority: 85
    category: business_constraint
    check: "tax_certification_signed is true in the acceptance body"
    error_id: ERR_TAX_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: ["POST /grants/awards/{award_id}/accept"]
    description: "The acceptance agreement is incomplete without the tax certification, so no installment schedule is generated."

  - priority: 85
    category: business_constraint
    check: "Appeal.grounds_code is one of the five procedural grounds"
    error_id: ERR_NON_PROCEDURAL_APPEAL_GROUNDS
    http_status: 409
    applies_to: ["POST /grants/appeals/{appeal_id}/screen"]
    description: "Appeals are limited to procedural grounds; a substantive disagreement with panel judgement is not appealable."

  - priority: 85
    category: business_constraint
    check: "The requested remedy_code is permitted for the appeal's grounds_code"
    error_id: ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS
    http_status: 409
    applies_to: ["POST /grants/appeals/{appeal_id}/decide"]
    description: "ELIGIBILITY_DETERMINATION_ERROR permits only REINSTATE_ELIGIBILITY; CONFLICT_NOT_MANAGED, ANONYMITY_BREACH and SCORING_PROCEDURE_DEFECT permit only RESCORE_BY_NEW_PANEL; PANEL_COMPOSITION_DEFECT permits RESCORE_BY_NEW_PANEL or REISSUE_SLATE."

  - priority: 85
    category: business_constraint
    check: "The application has no other Appeal outside status DENIED"
    error_id: ERR_DUPLICATE_APPEAL
    http_status: 409
    applies_to: ["POST /grants/appeals"]
    description: "One live appeal per application."

  - priority: 85
    category: business_constraint
    check: "The award has no existing FinalReport"
    error_id: ERR_DUPLICATE_FINAL_REPORT
    http_status: 409
    applies_to: ["POST /grants/final-reports"]
    description: "Corrections go through the revision cycle, not through a second report row."

  - priority: 85
    category: business_constraint
    check: "FinalReport.revision_count is below MAX_REPORT_REVISIONS"
    error_id: ERR_MAX_REVISIONS_REACHED
    http_status: 409
    applies_to: ["POST /grants/final-reports/{final_report_id}/review"]
    description: "MAX_REPORT_REVISIONS is 2; a third revision request is refused and the report must be accepted or the award pursued as delinquent."

  - priority: 85
    category: business_constraint
    check: "The panelist has no existing ConflictDeclaration for the same application"
    error_id: ERR_DUPLICATE_CONFLICT
    http_status: 409
    applies_to: ["POST /grants/conflicts"]
    description: "The (panelist_id, application_id) pair is unique."

  - priority: 85
    category: business_constraint
    check: "The panelist has no existing Review for the same application and round"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: ["POST /grants/reviews"]
    description: "The (application_id, panelist_id, round_number) triple is unique across non-SUPERSEDED reviews."

  - priority: 85
    category: business_constraint
    check: "At least one DisciplineCategory exists before a cycle may open"
    error_id: ERR_CYCLE_HAS_NO_DISCIPLINES
    http_status: 409
    applies_to: ["POST /grants/cycles/{cycle_id}/status"]
    description: "A cycle with no discipline categories has nothing to allocate."

  - priority: 90
    category: business_referential
    check: "The acting panelist is SEATED on the panel to which the reviewed application is assigned"
    error_id: ERR_PANELIST_NOT_ON_PANEL
    http_status: 409
    applies_to: ["POST /grants/reviews"]
    description: "Referential membership check; it sits below the P75 conflict safety check so an off-panel recused panelist reports the conflict error instead."

  - priority: 90
    category: business_referential
    check: "Every application named in a slate is assigned to the slating panel"
    error_id: ERR_APPLICATION_NOT_ON_PANEL
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/slate"]
    description: "A chair cannot rank an application belonging to another panel."

  - priority: 90
    category: business_referential
    check: "Every lower-rank RecommendationSlot of the same panel has already received a board action"
    error_id: ERR_SLOT_RANK_ORDER_VIOLATION
    http_status: 409
    applies_to: ["POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"]
    description: "The board works the slate in rank order so that the funding waterfall is deterministic."

  - priority: 90
    category: business_referential
    check: "The discipline's concurrent-panel capacity is not exceeded for the requested deliberation window"
    error_id: ERR_DISCIPLINE_PANEL_CAPACITY
    http_status: 409
    applies_to: ["POST /grants/panels/{panel_id}/charter"]
    description: "Aggregate capacity check: each individual panel is legal but the discipline may run at most max_concurrent_panels active panels over any instant."

  - priority: 95
    category: business_fiscal
    check: "The discipline allocation can still fund the slot at the base award or at the prorated floor"
    error_id: ERR_DISCIPLINE_ALLOCATION_EXHAUSTED
    http_status: 409
    applies_to: ["POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"]
    description: "Lowest-priority fiscal rule: an approval that also violates cycle posture reports the posture error at P70 instead."

  - priority: 95
    category: business_fiscal
    check: "The sum of DisciplineCategory.allocation_cents does not exceed total_budget_cents minus the reserve"
    error_id: ERR_ALLOCATION_EXCEEDS_BUDGET
    http_status: 409
    applies_to: ["POST /grants/cycles/{cycle_id}/status", "POST /grants/discipline-categories"]
    description: "Checked both when a category is added to an OPEN cycle and when a DRAFT cycle is opened."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving endpoint (outside the business surface, inside the contract) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant so deadline, acceptance-window, appeal-window, installment-due and reporting-due rules are deterministic. Before any call the logical clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock runs the operations checkpoint, processing Awards in Award.created_at ASC order."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, forfeited_award_ids: string[], delinquent_award_ids: string[], held_installment_ids: string[] }"
    side_effects:
      - "Every Award with status == OFFERED whose acceptance_deadline_at is now in the past becomes FORFEITED, its Application becomes NOT_AWARDED, its RecommendationSlot becomes VOIDED, artist.active_award_count is decremented and the cycle's funded_total_cents, admin_assessment_rate, admin_assessment_cents, committed_cents, available_cents and posture are recomputed"
      - "Every Award with status IN {ACCEPTED, ACTIVE} whose grant_period_end is now in the past moves reporting_status NOT_DUE -> DUE"
      - "Every Award with reporting_status == DUE whose final_report_due_at is now in the past moves to DELINQUENT, sets artist.standing to REPORT_DELINQUENT, increments artist.delinquent_award_count and moves that award's SCHEDULED installments to HELD with hold_reason_code REPORT_DELINQUENT"

  # --- FellowshipCycle ---
  - method: POST
    path: "/grants/cycles"
    description: "Creates a fellowship cycle in DRAFT."
    roles: [ProgramOfficer]
    code: 201
    input: ["name", "fiscal_year", "application_open_at", "application_deadline_at", "grant_period_start", "grant_period_end", "total_budget_cents", "base_award_cents", "min_prorated_award_cents", "residency_min_months", "award_blackout_years", "proration_policy?", "max_review_rounds?", "acceptance_window_days?", "appeal_window_days?", "final_report_due_offset_days?"]
    output: FellowshipCycle
    side_effects:
      - "status set to DRAFT; funded_total_cents, admin_assessment_cents and committed_cents set to 0"
      - "reserve_cents, available_cents and posture computed by calculations.cycle_budget_posture (posture OPEN when available_cents >= base_award_cents)"

  - method: GET
    path: "/grants/cycles/{cycle_id}"
    description: "Reads one fellowship cycle with its derived fiscal fields and posture."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: FellowshipCycle
    side_effects: []

  - method: GET
    path: "/grants/cycles"
    description: "Lists fellowship cycles, newest first by created_at DESC."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["status?", "fiscal_year?", "posture?", "limit?", "offset?"]
    output: FellowshipCycle[]
    side_effects: []

  - method: POST
    path: "/grants/cycles/{cycle_id}/status"
    description: "Advances or cancels a cycle. Every transition, its preconditions and its cascades are declared in §1.2."
    roles: [ProgramOfficer]
    code: 200
    input: [to_status]
    output: FellowshipCycle
    side_effects:
      - "Applies the §1.2 FellowshipCycle transition for to_status, including the unsealing cascade at AWARDED, the withdrawal cascade at CANCELLED and the panel dissolution cascade at CLOSED_OUT"
      - "reserve_cents, available_cents and posture recomputed by calculations.cycle_budget_posture"

  - method: GET
    path: "/grants/cycles/{cycle_id}/evaluation"
    description: "Computed read: program evaluation over the cycle's eligible applicant pool — regional concentration, geographic distribution score, funded rate and per-discipline breakdown, per calculations.cycle_diversity_evaluation."
    roles: [ProgramOfficer, CouncilBoardMember, AppealsOfficer]
    code: 200
    input: []
    output: "{ cycle_id: string, eligible_pool_size: integer, region_hhi: number, geographic_distribution_score: number, funded_rate: number, region_breakdown: array, discipline_breakdown: array }"
    side_effects: []

  # --- DisciplineCategory ---
  - method: POST
    path: "/grants/discipline-categories"
    description: "Adds a discipline category with its sub-allocation to a cycle."
    roles: [ProgramOfficer]
    code: 201
    input: ["cycle_id", "code", "alias_prefix", "allocation_cents", "required_work_sample_count", "allowed_media", "required_panel_seats", "required_regions", "max_total_duration_seconds?", "max_concurrent_panels?"]
    output: DisciplineCategory
    side_effects:
      - "committed_cents, eligible_application_count and funded_application_count set to 0; submitted_sequence_counter set to 0"
      - "Rejected with ERR_ALLOCATION_EXCEEDS_BUDGET when the cycle's allocations would exceed total_budget_cents minus reserve_cents"

  - method: GET
    path: "/grants/discipline-categories/{discipline_category_id}"
    description: "Reads one discipline category with its committed and counted aggregates."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: DisciplineCategory
    side_effects: []

  - method: GET
    path: "/grants/discipline-categories"
    description: "Lists discipline categories, filterable by owning cycle."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["cycle_id?", "code?", "limit?", "offset?"]
    output: DisciplineCategory[]
    side_effects: []

  # --- Artist ---
  - method: POST
    path: "/grants/artists"
    description: "Registers an artist profile. The artist's opaque X-User-ID for later calls is the returned id."
    roles: [ProgramOfficer]
    code: 201
    input: ["legal_name", "email", "residency_start_date", "residency_county", "region", "is_enrolled_student?", "tin_status?"]
    output: Artist
    side_effects:
      - "standing set to GOOD_STANDING; prior_award_count, active_award_count and delinquent_award_count set to 0; last_award_fiscal_year and last_award_period_end set to null"

  - method: GET
    path: "/grants/artists/{artist_id}"
    description: "Reads one artist profile with standing and award history counters."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/grants/artists"
    description: "Lists artist profiles. Not available to the Panelist role, which must never resolve an applicant identity."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["region?", "standing?", "tin_status?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  - method: PATCH
    path: "/grants/artists/{artist_id}"
    description: "Updates a mutable artist profile field, for example a taxpayer identification status that arrives after registration."
    roles: [ProgramOfficer]
    code: 200
    input: ["legal_name?", "email?", "residency_start_date?", "residency_county?", "region?", "is_enrolled_student?", "tin_status?"]
    output: Artist
    side_effects:
      - "Does not retroactively change any Application.residency_months_at_deadline, applicant_legal_name or applicant_region already frozen at submit"

  - method: POST
    path: "/grants/artists/{artist_id}/award-history"
    description: "Records a prior fellowship the artist held outside this system, feeding the prior-award blackout and the grant-period cooling buffer."
    roles: [ProgramOfficer]
    code: 200
    input: [fiscal_year, grant_period_end]
    output: Artist
    side_effects:
      - "prior_award_count incremented by 1"
      - "last_award_fiscal_year set to the greater of its current value and fiscal_year; last_award_period_end set to the later of its current value and grant_period_end"

  - method: POST
    path: "/grants/artists/{artist_id}/debar"
    description: "Debars an artist from the program."
    roles: [ProgramOfficer]
    code: 200
    input: [debar_reason_code]
    output: Artist
    side_effects:
      - "standing set to DEBARRED"
      - "Every PaymentInstallment with status == SCHEDULED on this artist's Awards becomes HELD with hold_reason_code ARTIST_DEBARRED, processed in Award.created_at ASC then installment_number ASC order"

  # --- Application ---
  - method: POST
    path: "/grants/applications"
    description: "Creates a DRAFT application. An Artist caller may only create for their own artist_id (ERR_NOT_RESOURCE_OWNER); a ProgramOfficer may create on an applicant's behalf. The discipline_category_id must belong to cycle_id."
    roles: [Artist, ProgramOfficer]
    code: 201
    input: [cycle_id, discipline_category_id, artist_id, artist_statement, career_narrative]
    output: Application
    side_effects:
      - "status set to DRAFT and anonymity_status set to SEALED; work_sample_count set to 0; valid_review_count set to 0"
      - "sealed_alias, submitted_at, residency_months_at_deadline, blackout_gap_years, applicant_legal_name and applicant_region left null until submit"

  - method: GET
    path: "/grants/applications/{application_id}"
    description: "Reads one application. While anonymity_status is not UNSEALED, a Panelist caller receives applicant_legal_name and applicant_region as null; every other role sees the stored values."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/grants/applications"
    description: "Lists applications with every foreign-key filter, sorted by created_at ASC. Redaction for the Panelist role applies to each element exactly as on the single read."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["cycle_id?", "discipline_category_id?", "artist_id?", "assigned_panel_id?", "status?", "anonymity_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/grants/applications/{application_id}/submit"
    description: "Submits a DRAFT application for review, minting its sealed alias and freezing the eligibility inputs."
    roles: [Artist]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at stamped from the logical clock"
      - "discipline.submitted_sequence_counter incremented, then sealed_alias minted as <alias_prefix>-<fiscal_year>-<counter padded to 4 digits>"
      - "residency_months_at_deadline computed by calculations.residency_months_at_deadline; blackout_gap_years, applicant_legal_name and applicant_region frozen"

  - method: POST
    path: "/grants/applications/{application_id}/eligibility"
    description: "Records the program officer's eligibility determination against the frozen criteria. The determination must agree with the server-computed verdict, and an INELIGIBLE determination must cite a reason code that actually fails."
    roles: [ProgramOfficer]
    code: 200
    input: ["determination", "ineligibility_reason_code?"]
    output: Application
    side_effects:
      - "status SUBMITTED -> ELIGIBLE or SUBMITTED -> INELIGIBLE; eligibility_determined_by stamped with the caller's X-User-ID"
      - "ELIGIBLE increments discipline.eligible_application_count; INELIGIBLE stamps notified_at from the logical clock, opening the appeal window"

  - method: POST
    path: "/grants/applications/{application_id}/withdraw"
    description: "Withdraws an application before it is attached to a panel."
    roles: [Artist]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status -> WITHDRAWN; PENDING_SCREEN and FLAGGED WorkSamples become REJECTED"
      - "discipline.eligible_application_count decremented when the application was ELIGIBLE; cycle.unresolved_breach_count and posture recomputed"

  # --- WorkSample ---
  - method: POST
    path: "/grants/work-samples"
    description: "Attaches a work sample to a DRAFT application. medium must be within the discipline's allowed_media."
    roles: [Artist, ProgramOfficer]
    code: 201
    input: ["application_id", "medium", "ordinal", "page_count?", "duration_seconds?", "contains_identifying_metadata?"]
    output: WorkSample
    side_effects:
      - "status set to PENDING_SCREEN; application.work_sample_count incremented by 1"

  - method: GET
    path: "/grants/work-samples/{work_sample_id}"
    description: "Reads one work sample and its screening disposition."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: WorkSample
    side_effects: []

  - method: GET
    path: "/grants/work-samples"
    description: "Lists work samples, filterable by owning application, sorted by ordinal ASC."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["application_id?", "status?", "medium?", "limit?", "offset?"]
    output: WorkSample[]
    side_effects: []

  - method: POST
    path: "/grants/work-samples/{work_sample_id}/screen"
    description: "Records the anonymity screening disposition of a work sample. FLAGGED_IDENTIFYING breaches the application's anonymity and freezes the cycle."
    roles: [ProgramOfficer]
    code: 200
    input: [disposition]
    output: WorkSample
    side_effects:
      - "status PENDING_SCREEN -> CLEARED, FLAGGED or REJECTED; screened_by stamped"
      - "FLAGGED_IDENTIFYING sets application.anonymity_status to BREACHED, invalidates that application's SUBMITTED reviews with reason ANONYMITY_BREACH, recomputes valid_review_count, provisional_composite_score and score_spread, increments cycle.unresolved_breach_count and recomputes cycle.posture to FROZEN"
      - "REJECTED decrements application.work_sample_count"

  - method: POST
    path: "/grants/work-samples/{work_sample_id}/redact"
    description: "Redacts the identifying material from a FLAGGED work sample, clearing the breach once no flagged sample remains on the application."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: WorkSample
    side_effects:
      - "status FLAGGED -> REDACTED; contains_identifying_metadata set to false"
      - "When the application has no remaining FLAGGED sample, anonymity_status BREACHED -> REDACTED, cycle.unresolved_breach_count decremented and cycle.posture recomputed"

  # --- Panel ---
  - method: POST
    path: "/grants/panels"
    description: "Creates a FORMING panel for one discipline of a cycle, with the deliberation window that occupies its panelists. The window is half-open: [deliberation_window_start, deliberation_window_end)."
    roles: [ProgramOfficer]
    code: 201
    input: [cycle_id, discipline_category_id, required_seats, required_regions, deliberation_window_start, deliberation_window_end]
    output: Panel
    side_effects:
      - "status set to FORMING; round_number, seated_count, region_coverage_count, blocking_conflict_count and assigned_application_count set to 0; reopen_required set to false"
      - "quorum_min_reviews set to max(3, ceil(required_seats * 0.60)); quorum_met and readiness_score computed"

  - method: GET
    path: "/grants/panels/{panel_id}"
    description: "Reads one panel with its readiness, quorum and round bookkeeping. Used to observe Panel.version before a slate submission."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Panel
    side_effects: []

  - method: GET
    path: "/grants/panels"
    description: "Lists panels, filterable by cycle and discipline."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["cycle_id?", "discipline_category_id?", "status?", "limit?", "offset?"]
    output: Panel[]
    side_effects: []

  - method: POST
    path: "/grants/panels/{panel_id}/charter"
    description: "Charters a ready panel and assigns it every unassigned eligible application of its discipline."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Panel
    side_effects:
      - "status FORMING -> CHARTERED; chartered_by stamped"
      - "Eligible unassigned applications of the discipline become UNDER_REVIEW with assigned_panel_id set, in Application.created_at ASC order; assigned_application_count updated"

  - method: POST
    path: "/grants/panels/{panel_id}/open-round"
    description: "Opens a scoring round. From CHARTERED this is the first round; from DELIBERATING it is the reopened round required by an excessive score spread, and it supersedes the previous round's reviews."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Panel
    side_effects:
      - "round_number incremented by 1; status becomes SCORING; reopen_required reset to false"
      - "From DELIBERATING, every SUBMITTED or INVALIDATED review of an earlier round becomes SUPERSEDED and each assigned application's valid_review_count, provisional_composite_score and score_spread are recomputed"

  - method: POST
    path: "/grants/panels/{panel_id}/close-round"
    description: "Closes the scoring round, writing each assigned application's final composite score and score spread and deciding whether another round is required."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Panel
    side_effects:
      - "status SCORING -> DELIBERATING"
      - "Each assigned UNDER_REVIEW application gets final_composite_score and score_spread from calculations.application_composite_score variant FINAL and review_round_number set to the closing round"
      - "reopen_required set to true when any assigned application's score_spread exceeds 2.50 and another round is still permitted; otherwise every assigned UNDER_REVIEW application becomes SCORED"

  - method: POST
    path: "/grants/panels/{panel_id}/slate"
    description: "The panel chair transmits the ranked funding recommendation to the council board. Carries expected_panel_version for optimistic concurrency control on the Panel (see §1.2.1 slate-submit-stale-panel)."
    roles: [Panelist]
    code: 201
    input: [ranked_application_ids, expected_panel_version]
    output: Panel
    side_effects:
      - "increments Panel.version by 1"
      - "status DELIBERATING -> SLATE_SUBMITTED; slate_submitted_at stamped"
      - "One RecommendationSlot created per listed application in PROPOSED with rank equal to its 1-based position and cycle_id copied from the panel; the new slots are discoverable through GET /grants/recommendation-slots"

  # --- Panelist ---
  - method: POST
    path: "/grants/panelists"
    description: "Nominates a panelist to a FORMING panel. The returned id is the panelist's opaque X-User-ID for later review and slate calls."
    roles: [ProgramOfficer]
    code: 201
    input: ["panel_id", "person_email", "full_name", "region", "expertise_codes", "is_chair?"]
    output: Panelist
    side_effects:
      - "status set to NOMINATED; review_submitted_count set to 0; recused_application_ids set to the empty list"

  - method: GET
    path: "/grants/panelists/{panelist_id}"
    description: "Reads one panelist with expertise, region and recusal list."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: GET
    path: "/grants/panelists"
    description: "Lists panelists, filterable by owning panel."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["panel_id?", "status?", "region?", "person_email?", "limit?", "offset?"]
    output: Panelist[]
    side_effects: []

  - method: POST
    path: "/grants/panelists/{panelist_id}/seat"
    description: "Seats a nominated panelist, subject to the cross-panel double-booking check on the half-open deliberation window."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Panelist
    side_effects:
      - "status NOMINATED -> SEATED; seated_at stamped"
      - "panel.seated_count, region_coverage_count, quorum_met and readiness_score recomputed by calculations.panel_readiness_score"

  - method: POST
    path: "/grants/panelists/{panelist_id}/resign"
    description: "Removes a panelist from a panel, invalidating their submitted reviews."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Panelist
    side_effects:
      - "status -> RESIGNED; panel.seated_count, region_coverage_count, quorum_met, blocking_conflict_count and readiness_score recomputed"
      - "This panelist's SUBMITTED reviews become INVALIDATED with reason BLOCKING_CONFLICT and each affected application's valid_review_count and provisional_composite_score are recomputed"

  # --- ConflictDeclaration ---
  - method: POST
    path: "/grants/conflicts"
    description: "A panelist discloses a relationship with one application. severity is derived from relationship_type: TEACHER_STUDENT, IMMEDIATE_FAMILY and FINANCIAL_INTEREST are MANDATORY_BLOCK, the rest DISCRETIONARY."
    roles: [Panelist, ProgramOfficer]
    code: 201
    input: [panelist_id, application_id, relationship_type, disclosure_note]
    output: ConflictDeclaration
    side_effects:
      - "status set to DECLARED; severity derived from relationship_type"

  - method: GET
    path: "/grants/conflicts/{conflict_declaration_id}"
    description: "Reads one conflict declaration with its derived severity and screening disposition."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []

  - method: GET
    path: "/grants/conflicts"
    description: "Lists conflict declarations, filterable by declaring panelist and by application."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["panelist_id?", "application_id?", "status?", "severity?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []

  - method: POST
    path: "/grants/conflicts/{conflict_declaration_id}/screen"
    description: "Screens a declared conflict. BLOCKING recuses the panelist and unwinds their scoring; WAIVED is only available for DISCRETIONARY severity and requires a written justification of at least 20 characters."
    roles: [ProgramOfficer]
    code: 200
    input: ["disposition", "override_justification?"]
    output: ConflictDeclaration
    side_effects:
      - "status DECLARED -> BLOCKING or DECLARED -> WAIVED; screened_by stamped"
      - "BLOCKING recuses the panelist for the application, invalidates their SUBMITTED review with reason BLOCKING_CONFLICT, recomputes the application's valid_review_count, provisional_composite_score and score_spread, voids the application's PROPOSED RecommendationSlot, and recomputes panel.blocking_conflict_count, panel.quorum_met, panel.readiness_score, cycle.blocking_conflict_count and cycle.posture"

  - method: POST
    path: "/grants/conflicts/{conflict_declaration_id}/waive-override"
    description: "Reverses a BLOCKING disposition on a DISCRETIONARY conflict and restores every side effect the block caused."
    roles: [ProgramOfficer]
    code: 200
    input: [override_justification]
    output: ConflictDeclaration
    side_effects:
      - "status BLOCKING -> WAIVED; override_justification recorded"
      - "The panelist's reviews invalidated with reason BLOCKING_CONFLICT return to SUBMITTED and the application's valid_review_count and provisional_composite_score return to their pre-block values"
      - "The panelist returns to SEATED when no other BLOCKING conflict remains; panel.blocking_conflict_count, panel.readiness_score, cycle.blocking_conflict_count and cycle.posture recomputed"

  # --- Review ---
  - method: POST
    path: "/grants/reviews"
    description: "A seated panelist drafts a criterion-scored review of an assigned application. round_number is stamped from the panel's current round."
    roles: [Panelist]
    code: 201
    input: ["application_id", "panelist_id", "artistic_excellence", "work_sample_quality", "career_impact", "public_value", "comments?"]
    output: Review
    side_effects:
      - "status set to DRAFT; round_number stamped from panel.round_number; weighted_score left null until submit"

  - method: GET
    path: "/grants/reviews/{review_id}"
    description: "Reads one review with its weighted score and lifecycle state."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: GET
    path: "/grants/reviews"
    description: "Lists reviews, filterable by reviewed application and by authoring panelist, sorted by created_at ASC — the order the trimming tie-break uses."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["application_id?", "panelist_id?", "status?", "round_number?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: POST
    path: "/grants/reviews/{review_id}/submit"
    description: "Submits a drafted review, scoring it and folding it into the application's provisional composite."
    roles: [Panelist]
    code: 200
    input: []
    output: Review
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at stamped; weighted_score written by calculations.review_weighted_score"
      - "panelist.review_submitted_count incremented; application.valid_review_count, provisional_composite_score and score_spread recomputed"

  # --- RecommendationSlot (cascade-created by the slate; no create endpoint) ---
  - method: GET
    path: "/grants/recommendation-slots/{recommendation_slot_id}"
    description: "Reads one recommendation slot with its rank, board disposition and awarded amount."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: RecommendationSlot
    side_effects: []

  - method: GET
    path: "/grants/recommendation-slots"
    description: "Lists recommendation slots, filterable by panel, application and cycle, sorted by rank ASC then created_at ASC. This is the only discovery channel for slots the slate cascade created."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["panel_id?", "application_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: RecommendationSlot[]
    side_effects: []

  - method: POST
    path: "/grants/recommendation-slots/{recommendation_slot_id}/board-action"
    description: "The council board approves or strikes a proposed slot in rank order. Carries expected_cycle_version for optimistic concurrency control on the FellowshipCycle (see §1.2.1 slot-approve-stale-cycle). Approval runs the discipline funding waterfall and creates the Award."
    roles: [CouncilBoardMember]
    code: 200
    input: ["action", "expected_cycle_version", "struck_reason_code?"]
    output: RecommendationSlot
    side_effects:
      - "increments FellowshipCycle.version by 1"
      - "APPROVE: awarded_amount_cents set by calculations.award_waterfall_allocation; status -> BOARD_APPROVED; board_action_by stamped; the application becomes RECOMMENDED with notified_at stamped; an Award is created in OFFERED / UNPAID / NOT_DUE with approved_by_user_id set to the caller's X-User-ID and acceptance_deadline_at set to the logical clock plus cycle.acceptance_window_days days; the Award is discoverable through GET /grants/awards"
      - "APPROVE: artist.active_award_count incremented; discipline.committed_cents and funded_application_count updated; cycle.funded_total_cents, admin_assessment_rate, admin_assessment_cents, committed_cents, available_cents and posture recomputed"
      - "STRIKE: status -> BOARD_STRUCK; struck_reason_code recorded; the application becomes NOT_RECOMMENDED with notified_at stamped, opening the appeal window"

  # --- Award (cascade-created by board approval; no create endpoint) ---
  - method: GET
    path: "/grants/awards/{award_id}"
    description: "Reads one award with all three of its state dimensions and its disbursement ledger totals."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: GET
    path: "/grants/awards"
    description: "Lists awards, filterable by application, artist, cycle and originating recommendation slot, sorted by created_at ASC — the order the clock checkpoint processes them in. This is the only discovery channel for awards the board-approval cascade created."
    roles: [ProgramOfficer, Artist, Panelist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["application_id?", "artist_id?", "cycle_id?", "recommendation_slot_id?", "status?", "payment_status?", "reporting_status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []

  - method: POST
    path: "/grants/awards/{award_id}/accept"
    description: "The recipient signs the acceptance agreement and certifies taxpayer information, which generates the payment schedule."
    roles: [Artist]
    code: 200
    input: [accept_agreement_version, tax_certification_signed]
    output: Award
    side_effects:
      - "status OFFERED -> ACCEPTED; accept_agreement_version and tax_certification_signed recorded; final_report_due_at set to grant_period_end plus cycle.final_report_due_offset_days days"
      - "Three PaymentInstallments created in SCHEDULED by calculations.installment_payment_schedule, discoverable through GET /grants/payment-installments"
      - "scheduled_withholding_cents set to the sum of the rounded per-installment withholding; undisbursed_gross_cents set to gross_amount_cents; the application becomes AWARDED"

  - method: POST
    path: "/grants/awards/{award_id}/decline"
    description: "The recipient declines an offered award, releasing the discipline allocation and the cycle commitment."
    roles: [Artist]
    code: 200
    input: []
    output: Award
    side_effects:
      - "status OFFERED -> DECLINED; the application becomes NOT_AWARDED; the slot becomes VOIDED; artist.active_award_count decremented"
      - "cycle.funded_total_cents, admin_assessment_rate, admin_assessment_cents, committed_cents, available_cents and posture recomputed; discipline.committed_cents and funded_application_count decremented"

  - method: POST
    path: "/grants/awards/{award_id}/rescind"
    description: "The program officer rescinds an award that has not yet disbursed, voiding its scheduled installments and restoring the cycle's fiscal identity exactly."
    roles: [ProgramOfficer]
    code: 200
    input: [rescind_reason_code]
    output: Award
    side_effects:
      - "status OFFERED or ACCEPTED -> RESCINDED; SCHEDULED and HELD installments become VOIDED; scheduled_withholding_cents and undisbursed_gross_cents reset to 0"
      - "The application becomes NOT_AWARDED; the slot becomes VOIDED; artist.active_award_count decremented"
      - "cycle.funded_total_cents, admin_assessment_rate, admin_assessment_cents, committed_cents, available_cents and posture recomputed; discipline.committed_cents and funded_application_count decremented"

  - method: GET
    path: "/grants/awards/{award_id}/tax-report"
    description: "Computed read: the reportable gross, withholding and net for one award and one tax year, on either the cash or the accrual basis, per calculations.award_tax_reportable_amount. tax_year defaults to the calendar year of the logical clock and basis defaults to ACCRUAL."
    roles: [ProgramOfficer, Artist, FiscalOfficer]
    code: 200
    input: ["tax_year?", "basis?"]
    output: "{ award_id: string, tax_year: integer, basis: string, reportable_gross_cents: integer, reportable_withholding_cents: integer, reportable_net_cents: integer, installment_count: integer }"
    side_effects: []

  # --- PaymentInstallment (cascade-created by acceptance and by reversal; no create endpoint) ---
  - method: GET
    path: "/grants/payment-installments/{payment_installment_id}"
    description: "Reads one installment with its gross, withholding, net and disbursement state."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects: []

  - method: GET
    path: "/grants/payment-installments"
    description: "Lists installments, filterable by owning award and by the installment a replacement supersedes, sorted by installment_number ASC then created_at ASC. This is the only discovery channel for installments the acceptance and reversal cascades created."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["award_id?", "replaces_installment_id?", "status?", "limit?", "offset?"]
    output: PaymentInstallment[]
    side_effects: []

  - method: POST
    path: "/grants/payment-installments/{payment_installment_id}/release"
    description: "A fiscal officer releases a due installment for payment. The releasing officer may not be the board member who approved the award."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects:
      - "status SCHEDULED -> RELEASED; released_by and released_at stamped"

  - method: POST
    path: "/grants/payment-installments/{payment_installment_id}/pay"
    description: "Records payment of a released installment and re-derives the award's disbursement ledger."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects:
      - "status RELEASED -> PAID; paid_at stamped from the logical clock"
      - "award.disbursed_gross_cents, disbursed_net_cents, total_withholding_cents, undisbursed_gross_cents and payment_status re-derived; award.status becomes ACTIVE on the first payment"

  - method: POST
    path: "/grants/payment-installments/{payment_installment_id}/reverse"
    description: "Reverses a paid installment (bank return, overpayment or fraud hold) and issues a replacement so the award's gross conservation identity is preserved."
    roles: [FiscalOfficer]
    code: 200
    input: [reversal_reason_code]
    output: PaymentInstallment
    side_effects:
      - "status PAID -> REVERSED; reversal_reason_code recorded; paid_at retained so the cash-basis tax year is unchanged"
      - "A replacement PaymentInstallment is created in SCHEDULED with the same installment_number, gross_cents, withholding_rate, withholding_cents and net_cents, replaces_installment_id pointing at the reversed row and scheduled_date set to the logical-clock date"
      - "award.disbursed_gross_cents, disbursed_net_cents, total_withholding_cents, undisbursed_gross_cents and payment_status re-derived"

  # --- FinalReport ---
  - method: POST
    path: "/grants/final-reports"
    description: "The recipient files the final narrative report with its public-value account, clearing any report-delinquency hold."
    roles: [Artist]
    code: 201
    input: [award_id, narrative, public_value_statement, audience_reached_count, expenditure_summary]
    output: FinalReport
    side_effects:
      - "status set to SUBMITTED; revision_count set to 0; submitted_at stamped"
      - "award.reporting_status DUE or DELINQUENT -> RECEIVED; when the award was DELINQUENT, artist.delinquent_award_count is decremented, artist.standing returns to GOOD_STANDING once no delinquency remains and the artist is not DEBARRED, and the award's HELD installments with hold_reason_code REPORT_DELINQUENT return to SCHEDULED"

  - method: GET
    path: "/grants/final-reports/{final_report_id}"
    description: "Reads one final report with its revision bookkeeping."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: FinalReport
    side_effects: []

  - method: GET
    path: "/grants/final-reports"
    description: "Lists final reports, filterable by owning award."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: FinalReport[]
    side_effects: []

  - method: POST
    path: "/grants/final-reports/{final_report_id}/review"
    description: "The program officer accepts a final report or requests a revision. At most two revisions may be requested."
    roles: [ProgramOfficer]
    code: 200
    input: ["decision", "revision_note?"]
    output: FinalReport
    side_effects:
      - "ACCEPT: status -> ACCEPTED; accepted_at stamped; award.reporting_status -> ACCEPTED; award.status -> COMPLETED when payment_status == FULLY_PAID, and on completion artist.active_award_count is decremented, prior_award_count incremented, last_award_fiscal_year set to cycle.fiscal_year and last_award_period_end set to grant_period_end"
      - "REQUEST_REVISION: status -> REVISION_REQUESTED; revision_count incremented; reviewed_by and revision_note stamped"

  - method: POST
    path: "/grants/final-reports/{final_report_id}/resubmit"
    description: "The recipient resubmits a revised final report."
    roles: [Artist]
    code: 200
    input: [narrative, public_value_statement, audience_reached_count, expenditure_summary]
    output: FinalReport
    side_effects:
      - "status REVISION_REQUESTED -> SUBMITTED; the narrative fields are replaced and submitted_at is re-stamped"

  # --- Appeal ---
  - method: POST
    path: "/grants/appeals"
    description: "The applicant files an appeal on procedural grounds within cycle.appeal_window_days of Application.notified_at. filed_by_artist_id is copied from the application."
    roles: [Artist]
    code: 201
    input: [application_id, grounds_code, statement]
    output: Appeal
    side_effects:
      - "status set to FILED; filed_at stamped from the logical clock; filed_by_artist_id copied from application.artist_id"

  - method: GET
    path: "/grants/appeals/{appeal_id}"
    description: "Reads one appeal with its grounds, screening and decision."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/grants/appeals"
    description: "Lists appeals, filterable by appealed application and by filing artist."
    roles: [ProgramOfficer, Artist, CouncilBoardMember, AppealsOfficer, FiscalOfficer]
    code: 200
    input: ["application_id?", "filed_by_artist_id?", "status?", "grounds_code?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/grants/appeals/{appeal_id}/screen"
    description: "The appeals officer screens the appeal for procedural jurisdiction. Only the five procedural grounds pass."
    roles: [AppealsOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects:
      - "status FILED -> SCREENED; screened_by stamped"

  - method: POST
    path: "/grants/appeals/{appeal_id}/decide"
    description: "The appeals officer upholds or denies a screened appeal. The remedy must be permitted for the grounds, and the deciding officer may not be the officer who made the eligibility determination under appeal."
    roles: [AppealsOfficer]
    code: 200
    input: ["decision", "remedy_code?"]
    output: Appeal
    side_effects:
      - "status SCREENED -> UPHELD or SCREENED -> DENIED; decided_by stamped; remedy_code recorded on an upheld appeal"
      - "REINSTATE_ELIGIBILITY: the INELIGIBLE application becomes ELIGIBLE with ineligibility_reason_code and assigned_panel_id cleared; discipline.eligible_application_count incremented"
      - "RESCORE_BY_NEW_PANEL: the application's SUBMITTED reviews become INVALIDATED with reason APPEAL_REMEDY, valid_review_count, provisional_composite_score, final_composite_score and score_spread are recomputed, the application returns to ELIGIBLE with assigned_panel_id cleared, and the former panel returns to SCORING with round_number incremented and assigned_application_count decremented"
      - "REISSUE_SLATE: the application's VOIDED or BOARD_STRUCK RecommendationSlot returns to PROPOSED with board_action_by and struck_reason_code cleared, and the application returns to SCORED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, empty, or naming a role outside the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not listed in the endpoint's roles, or an entity-backed role's X-User-ID resolves to no Artist or Panelist row" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An Artist acts on another artist's application, work sample, award, final report or appeal, or a Panelist submits another panelist's review" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The releasing fiscal officer equals Award.approved_by_user_id, or the deciding appeals officer equals Application.eligibility_determined_by" }
  - { id: ERR_NOT_PANEL_CHAIR, http: 403, condition: "A slate is submitted by a panelist who is not SEATED with is_chair == true on that panel" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong JSON type, enum value outside the declared set, criterion score outside 0..10, negative cents, duplicate entries in ranked_application_ids, grant_period_end not after grant_period_start, deliberation_window_end not after deliberation_window_start, application_deadline_at not after application_open_at, pagination limit outside 1..100 or offset below 0, missing ineligibility_reason_code on an INELIGIBLE determination, missing struck_reason_code on a STRIKE, missing rescind_reason_code, missing reversal_reason_code, override_justification or revision_note shorter than 20 characters, or accept_agreement_version other than FELLOWSHIP-AGREEMENT-2027.1" }

  # --- existence (path parameters and body foreign keys) ---
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "cycle_id in the path or body matches no FellowshipCycle" }
  - { id: ERR_DISCIPLINE_CATEGORY_NOT_FOUND, http: 404, condition: "discipline_category_id in the path or body matches no DisciplineCategory" }
  - { id: ERR_ARTIST_NOT_FOUND, http: 404, condition: "artist_id in the path or body matches no Artist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application_id in the path or body matches no Application" }
  - { id: ERR_WORK_SAMPLE_NOT_FOUND, http: 404, condition: "work_sample_id in the path matches no WorkSample" }
  - { id: ERR_PANEL_NOT_FOUND, http: 404, condition: "panel_id in the path or body matches no Panel" }
  - { id: ERR_PANELIST_NOT_FOUND, http: 404, condition: "panelist_id in the path or body matches no Panelist" }
  - { id: ERR_CONFLICT_NOT_FOUND, http: 404, condition: "conflict_declaration_id in the path matches no ConflictDeclaration" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "review_id in the path matches no Review" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "recommendation_slot_id in the path matches no RecommendationSlot" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "award_id in the path or body matches no Award" }
  - { id: ERR_INSTALLMENT_NOT_FOUND, http: 404, condition: "payment_installment_id in the path matches no PaymentInstallment" }
  - { id: ERR_FINAL_REPORT_NOT_FOUND, http: 404, condition: "final_report_id in the path matches no FinalReport" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal_id in the path matches no Appeal" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version on a board action differs from the cycle's current version (§1.2.1 slot-approve-stale-cycle)" }
  - { id: ERR_STALE_PANEL_VERSION, http: 412, condition: "expected_panel_version on a slate submission differs from the panel's current version (§1.2.1 slate-submit-stale-panel)" }

  # --- target-entity state ---
  - { id: ERR_CYCLE_STATE_INVALID, http: 409, condition: "The requested cycle transition is not declared from the cycle's current status, or a child operation requires a cycle status the cycle is not in" }
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "The requested application transition is not declared from its current status, an already-submitted application is submitted again, or an application attached to a panel is withdrawn" }
  - { id: ERR_WORK_SAMPLE_STATE_INVALID, http: 409, condition: "A work sample is screened twice, or redaction is attempted on a sample that is not FLAGGED" }
  - { id: ERR_PANEL_STATE_INVALID, http: 409, condition: "The requested panel transition is not declared from its current status, a round is opened past cycle.max_review_rounds, a round is reopened without reopen_required, or a panelist is seated on a panel that is no longer FORMING" }
  - { id: ERR_PANELIST_STATE_INVALID, http: 409, condition: "A panelist is seated twice, or a RESIGNED panelist is acted on" }
  - { id: ERR_CONFLICT_STATE_INVALID, http: 409, condition: "A conflict is screened twice, or a waive-override is attempted on a conflict that is not BLOCKING" }
  - { id: ERR_REVIEW_STATE_INVALID, http: 409, condition: "A review is submitted twice, or its round_number no longer matches the panel's current round" }
  - { id: ERR_SLOT_STATE_INVALID, http: 409, condition: "A board action is taken on a slot that is not PROPOSED" }
  - { id: ERR_AWARD_STATE_INVALID, http: 409, condition: "The requested award transition is not declared from its current status, or an installment operation is attempted on an award that is not ACCEPTED or ACTIVE" }
  - { id: ERR_INSTALLMENT_STATE_INVALID, http: 409, condition: "Release is attempted on an installment that is not SCHEDULED, payment on one that is not RELEASED, or reversal on one that is not PAID" }
  - { id: ERR_FINAL_REPORT_STATE_INVALID, http: 409, condition: "A report is reviewed when not SUBMITTED, or resubmitted when not REVISION_REQUESTED" }
  - { id: ERR_APPEAL_STATE_INVALID, http: 409, condition: "An appeal is screened when not FILED, decided when not SCREENED, or a cycle close-out is attempted while an appeal is undecided" }

  # --- cross-entity state and cycle posture ---
  - { id: ERR_CYCLE_POSTURE_FROZEN, http: 409, condition: "Chartering, board action or disbursement is attempted while cycle.posture is FROZEN — an unresolved anonymity breach or a cancelled cycle" }
  - { id: ERR_CYCLE_POSTURE_RESTRICTED, http: 409, condition: "A board approval is attempted while cycle.posture is RESTRICTED — available_cents has fallen below base_award_cents, or an unmanaged blocking conflict remains" }
  - { id: ERR_ARTIST_NOT_IN_GOOD_STANDING, http: 409, condition: "An application is submitted by an artist whose standing is REPORT_DELINQUENT or DEBARRED" }

  # --- business safety (anonymous review, conflict management) ---
  - { id: ERR_ANONYMITY_BREACH_UNRESOLVED, http: 409, condition: "A review is submitted on, or a panel is chartered over, an application whose anonymity_status is BREACHED" }
  - { id: ERR_CONFLICT_BLOCKS_REVIEW, http: 409, condition: "A review is created or submitted by a panelist with a BLOCKING ConflictDeclaration on that application" }
  - { id: ERR_MANDATORY_CONFLICT_NOT_WAIVABLE, http: 409, condition: "A conflict whose severity is MANDATORY_BLOCK is waived at screening or overridden afterwards" }

  # --- business temporal ---
  - { id: ERR_APPLICATION_WINDOW_NOT_OPEN, http: 409, condition: "Submission is attempted before cycle.application_open_at" }
  - { id: ERR_APPLICATION_DEADLINE_PASSED, http: 409, condition: "Submission is attempted after cycle.application_deadline_at" }
  - { id: ERR_DEADLINE_NOT_REACHED, http: 409, condition: "A cycle is closed while the logical clock is still before application_deadline_at" }
  - { id: ERR_PANELIST_WINDOW_CONFLICT, http: 409, condition: "Seating would place the same person_email on two panels of the cycle whose half-open deliberation windows intersect" }
  - { id: ERR_ACCEPTANCE_DEADLINE_PASSED, http: 409, condition: "Acceptance is attempted after Award.acceptance_deadline_at, including on an award the clock checkpoint has already moved to FORFEITED" }
  - { id: ERR_INSTALLMENT_NOT_DUE, http: 409, condition: "An installment is released before its scheduled_date, or before every lower-numbered installment has left SCHEDULED and HELD" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "An appeal is filed before the applicant was notified, or more than cycle.appeal_window_days after Application.notified_at" }
  - { id: ERR_AWARD_PERIOD_COOLING_VIOLATION, http: 409, condition: "The cycle's grant_period_start is fewer than 365 days after the artist's last_award_period_end" }
  - { id: ERR_FINAL_REPORT_NOT_DUE, http: 409, condition: "A final report is filed while award.reporting_status is still NOT_DUE" }

  # --- business constraint ---
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "The artist already has an application in this cycle whose status is outside {DRAFT, WITHDRAWN}" }
  - { id: ERR_WORK_SAMPLE_REQUIREMENTS_NOT_MET, http: 409, condition: "Too few work samples, a medium outside the discipline's allowed_media, or an AUDIO plus VIDEO duration total above max_total_duration_seconds" }
  - { id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http: 409, condition: "An ELIGIBLE determination is recorded although residency months fall short, the prior-award blackout gap is too small, or the applicant is an enrolled student" }
  - { id: ERR_INELIGIBILITY_REASON_UNSUPPORTED, http: 409, condition: "The submitted ineligibility_reason_code names a criterion the applicant actually satisfies" }
  - { id: ERR_INSUFFICIENT_REVIEWS, http: 409, condition: "A round is closed while an assigned application has fewer counted reviews than panel.quorum_min_reviews" }
  - { id: ERR_PANEL_NOT_READY, http: 409, condition: "Chartering is attempted with readiness_score below 75.00 or with no seated panelist holding the panel's discipline expertise" }
  - { id: ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND, http: 409, condition: "A slate is submitted, or the cycle advances to BOARD_REVIEW, while a panel has reopen_required == true" }
  - { id: ERR_INCOMPLETE_SLATE, http: 409, condition: "ranked_application_ids omits a SCORED application of the panel or lists one more than once (extraneous ids are reported as ERR_APPLICATION_NOT_ON_PANEL instead)" }
  - { id: ERR_SLOTS_PENDING_BOARD_ACTION, http: 409, condition: "The cycle advances to AWARDED while a RecommendationSlot is still PROPOSED" }
  - { id: ERR_CYCLE_HAS_OPEN_AWARDS, http: 409, condition: "Close-out is attempted while an Award of the cycle is not COMPLETED, DECLINED, RESCINDED or FORFEITED" }
  - { id: ERR_AWARD_HAS_DISBURSEMENTS, http: 409, condition: "Rescission is attempted on an award with a RELEASED or PAID installment" }
  - { id: ERR_TAX_CERTIFICATION_REQUIRED, http: 409, condition: "Acceptance is attempted with tax_certification_signed false" }
  - { id: ERR_NON_PROCEDURAL_APPEAL_GROUNDS, http: 409, condition: "An appeal whose grounds_code is SUBSTANTIVE_SCORE_DISAGREEMENT is screened; such an appeal may only be denied outright" }
  - { id: ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS, http: 409, condition: "The requested remedy_code is not in the permitted set for the appeal's grounds_code" }
  - { id: ERR_DUPLICATE_APPEAL, http: 409, condition: "The application already has an appeal whose status is outside {DENIED}" }
  - { id: ERR_DUPLICATE_FINAL_REPORT, http: 409, condition: "The award already has a FinalReport" }
  - { id: ERR_MAX_REVISIONS_REACHED, http: 409, condition: "A third revision is requested on a final report whose revision_count is already 2" }
  - { id: ERR_DUPLICATE_CONFLICT, http: 409, condition: "The (panelist_id, application_id) pair already has a ConflictDeclaration" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "The (application_id, panelist_id, round_number) triple already has a non-SUPERSEDED Review" }
  - { id: ERR_CYCLE_HAS_NO_DISCIPLINES, http: 409, condition: "A cycle with no DisciplineCategory is opened" }

  # --- business referential ---
  - { id: ERR_PANELIST_NOT_ON_PANEL, http: 409, condition: "A review is created by a panelist who is not SEATED on the panel the application is assigned to" }
  - { id: ERR_APPLICATION_NOT_ON_PANEL, http: 409, condition: "A slate names an application whose assigned_panel_id is a different panel" }
  - { id: ERR_SLOT_RANK_ORDER_VIOLATION, http: 409, condition: "A board action is taken on a slot while a lower-rank slot of the same panel is still PROPOSED" }
  - { id: ERR_DISCIPLINE_PANEL_CAPACITY, http: 409, condition: "Chartering would exceed discipline.max_concurrent_panels over an instant covered by the panel's deliberation window" }

  # --- business fiscal ---
  - { id: ERR_DISCIPLINE_ALLOCATION_EXHAUSTED, http: 409, condition: "The discipline remainder is below base_award_cents and either below min_prorated_award_cents or the cycle's proration_policy is SKIP_TO_ALTERNATE" }
  - { id: ERR_ALLOCATION_EXCEEDS_BUDGET, http: 409, condition: "The sum of DisciplineCategory.allocation_cents would exceed total_budget_cents minus reserve_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProgramOfficer
    description: "Council staff who run the cycle: budget and discipline setup, anonymity screening, eligibility determinations, panel recruitment and chartering, round management, conflict screening, award rescission and final-report review."
    identity: opaque
    exclusive_operations:
      - "POST /grants/cycles"
      - "POST /grants/cycles/{cycle_id}/status"
      - "POST /grants/discipline-categories"
      - "POST /grants/artists"
      - "PATCH /grants/artists/{artist_id}"
      - "POST /grants/artists/{artist_id}/award-history"
      - "POST /grants/artists/{artist_id}/debar"
      - "POST /grants/applications/{application_id}/eligibility"
      - "POST /grants/work-samples/{work_sample_id}/screen"
      - "POST /grants/work-samples/{work_sample_id}/redact"
      - "POST /grants/panels"
      - "POST /grants/panels/{panel_id}/charter"
      - "POST /grants/panels/{panel_id}/open-round"
      - "POST /grants/panels/{panel_id}/close-round"
      - "POST /grants/panelists"
      - "POST /grants/panelists/{panelist_id}/seat"
      - "POST /grants/panelists/{panelist_id}/resign"
      - "POST /grants/conflicts/{conflict_declaration_id}/screen"
      - "POST /grants/conflicts/{conflict_declaration_id}/waive-override"
      - "POST /grants/awards/{award_id}/rescind"
      - "POST /grants/final-reports/{final_report_id}/review"
    shared_operations:
      - "POST /grants/applications (also Artist; a ProgramOfficer may create on an applicant's behalf)"
      - "POST /grants/work-samples (also Artist)"
      - "POST /grants/conflicts (also Panelist)"
      - "GET /grants/cycles/{cycle_id}/evaluation (also CouncilBoardMember, AppealsOfficer)"
      - "GET /grants/awards/{award_id}/tax-report (also Artist, FiscalOfficer)"
      - "all single-resource and filtered-list GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: Artist
    description: "The applicant and, once funded, the recipient. Acts only on their own applications, work samples, awards, final reports and appeals."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /grants/applications/{application_id}/submit"
      - "POST /grants/applications/{application_id}/withdraw"
      - "POST /grants/awards/{award_id}/accept"
      - "POST /grants/awards/{award_id}/decline"
      - "POST /grants/final-reports"
      - "POST /grants/final-reports/{final_report_id}/resubmit"
      - "POST /grants/appeals"
    shared_operations:
      - "POST /grants/applications (also ProgramOfficer)"
      - "POST /grants/work-samples (also ProgramOfficer)"
      - "GET /grants/awards/{award_id}/tax-report (also ProgramOfficer, FiscalOfficer)"
      - "all single-resource and filtered-list GET endpoints except GET /grants/cycles/{cycle_id}/evaluation"
      - "POST /_clock/set_current_utc"

  - name: Panelist
    description: "A recruited reviewer with discipline expertise and a home region. Scores assigned applications under the anonymous protocol, discloses conflicts, and — as chair — transmits the panel's ranked slate."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /grants/reviews"
      - "POST /grants/reviews/{review_id}/submit"
      - "POST /grants/panels/{panel_id}/slate"
    shared_operations:
      - "POST /grants/conflicts (also ProgramOfficer)"
      - "single-resource and filtered-list GET endpoints other than the Artist collection, the payment, report and appeal collections, and the cycle evaluation"
      - "POST /_clock/set_current_utc"
    restrictions:
      - "Cannot read GET /grants/artists or GET /grants/artists/{artist_id}"
      - "Receives Application.applicant_legal_name and applicant_region as null while anonymity_status is not UNSEALED"

  - name: CouncilBoardMember
    description: "Member of the council board that disposes of each panel slate in rank order and thereby commits the appropriation."
    identity: opaque
    exclusive_operations:
      - "POST /grants/recommendation-slots/{recommendation_slot_id}/board-action"
    shared_operations:
      - "GET /grants/cycles/{cycle_id}/evaluation (also ProgramOfficer, AppealsOfficer)"
      - "single-resource and filtered-list GET endpoints"
      - "POST /_clock/set_current_utc"
    restrictions:
      - "The board member who approves an award is barred from releasing its installments (ERR_SEGREGATION_OF_DUTIES)"

  - name: AppealsOfficer
    description: "Independent officer who screens appeals for procedural jurisdiction and decides them, ordering the permitted remedy."
    identity: opaque
    exclusive_operations:
      - "POST /grants/appeals/{appeal_id}/screen"
      - "POST /grants/appeals/{appeal_id}/decide"
    shared_operations:
      - "GET /grants/cycles/{cycle_id}/evaluation (also ProgramOfficer, CouncilBoardMember)"
      - "single-resource and filtered-list GET endpoints"
      - "POST /_clock/set_current_utc"
    restrictions:
      - "Cannot decide an appeal against an eligibility determination they themselves recorded (ERR_SEGREGATION_OF_DUTIES)"

  - name: FiscalOfficer
    description: "Council finance staff who release, pay and reverse installments and pull tax reporting."
    identity: opaque
    exclusive_operations:
      - "POST /grants/payment-installments/{payment_installment_id}/release"
      - "POST /grants/payment-installments/{payment_installment_id}/pay"
      - "POST /grants/payment-installments/{payment_installment_id}/reverse"
    shared_operations:
      - "GET /grants/awards/{award_id}/tax-report (also ProgramOfficer, Artist)"
      - "single-resource and filtered-list GET endpoints other than the cycle evaluation"
      - "POST /_clock/set_current_utc"
    restrictions:
      - "Cannot release an installment of an award they approved as a board member (ERR_SEGREGATION_OF_DUTIES)"
