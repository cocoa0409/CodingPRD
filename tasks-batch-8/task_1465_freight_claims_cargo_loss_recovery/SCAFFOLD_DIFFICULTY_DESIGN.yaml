  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_submit
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_CLAIM_INVALID_STATE]
          - errors[ERR_FILING_DEADLINE_PASSED]
        distinguishing_aspect: |
          Pair: state (priority 4) vs business_temporal (priority 7). A claim
          already in SUBMITTED state has a stale filing_deadline_passed signal
          only when clock has advanced; the higher-priority state error must
          win even when both would technically trigger.
        test_recipe:
          setup:
            - "Claim CL9 already SUBMITTED; clock then advanced past filing_deadline_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "PRIO", legal_name: "Priority Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 100000, carmack_acknowledgment_days: 30, carmack_filing_days: 30 }
              as: ClaimsManager
              captures: { c9: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "555", destination_zip3: "666", baseline_claim_ratio_bp: 900 }
              as: ClaimsManager
              captures: { l9: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c9}", lane_id: "${l9}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-PRI", carrier_id: "${c9}", lane_id: "${l9}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s9: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s9}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl9: $.data.id }
            - call: "POST /freight-claims/claims/${cl9}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl9}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl9}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /freight-claims/claims/${cl9}/submit"
              payload: {}
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_INVALID_STATE (priority 4 wins over priority 7 ERR_FILING_DEADLINE_PASSED even though both conditions hold)"

      - name: business_safety_vs_business_fiscal_on_settlement_accept
        grounds:
          - validations[priority=6]
          - validations[priority=11]
