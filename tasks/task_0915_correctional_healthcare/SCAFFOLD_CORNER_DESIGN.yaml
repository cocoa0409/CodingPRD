            - "SickCallRequest.${sc}.copay_charge_id == ${chg}"
            - "SickCallRequest.${sc}.seen_at == 2026-05-01T00:00:00.000Z"

  - section: rbac
    instances:

      - name: nurse_cannot_write_medication_order_forbidden
        claim_type: Role denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - roles.Provider
        distinguishing_aspect: "POST /medication-orders is a Provider-exclusive operation; a Nurse calling it returns 403 ERR_FORBIDDEN_ROLE and no order is created."
        test_recipe:
          setup:
            - "One inmate at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2350", full_name: "Bo Esposito", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
          trigger:
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 403 with error_id ERR_FORBIDDEN_ROLE"
            - "GET /medication-orders with inmate_id ${inm} returns 0 rows"
            - "Inmate.${inm}.version == 1"

      - name: inmate_cannot_file_grievance_for_another_inmate
        claim_type: Ownership denial
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - roles.Inmate
        distinguishing_aspect: "The Inmate role is entity_backed, so X-User-ID must equal the addressed inmate's id; filing on another inmate's behalf returns 403 ERR_NOT_RESOURCE_OWNER rather than 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Two inmates booked at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2360", full_name: "Cal Fontaine", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm_a: $.data.id }
            - call: "POST /inmates"
              payload: { booking_number: "C-2361", full_name: "Dot Grigg", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm_b: $.data.id }
          trigger:
            - call: "POST /inmates/${inm_b}/grievances"
              payload: { grievance_text: "filed by the wrong person", grieved_event_at: "2026-05-01T00:00:00Z" }
              as: Inmate
              as_user_id: "${inm_a}"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 403 with error_id ERR_NOT_RESOURCE_OWNER"
            - "GET /grievances with inmate_id ${inm_b} returns 0 rows"

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: Role denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "The test omits the X-User-Role header entirely on POST /inmates, which returns 401 ERR_UNAUTHENTICATED before any role or payload check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates"
              payload: { booking_number: "C-2370", full_name: "Eve Halim", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The request is dispatched with NO X-User-Role and NO X-User-ID header, overriding the `as:` value shown above"
            - "The call returns 401 with error_id ERR_UNAUTHENTICATED"

  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_inmate_version_rejected_on_medication_order
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[med-order-create-stale-inmate]"
          - "errors[ERR_STALE_INMATE_VERSION]"
          - "validations[priority=9]"
        distinguishing_aspect: "The first order advances Inmate.version from 1 to 2; a second order still carrying expected_inmate_version 1 is rejected with 412 ERR_STALE_INMATE_VERSION, and re-reading the version lets the same request succeed."
        test_recipe:
          setup:
            - "One inmate at version 1 with one ACTIVE PSYCHOTROPIC order created using expected_inmate_version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2380", full_name: "Fin Iqbal", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord1: $.data.id }
          trigger:
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { err: $.data.error_id }
            - call: "GET /inmates/${inm}"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { inm_v2: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v2}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord2: $.data.id }
          assert:
            - "The first trigger call returns 412 with error_id ERR_STALE_INMATE_VERSION"
            - "The third trigger call returns 201"
            - "Inmate.${inm}.version == 3"
            - "MedicationOrder.${ord1}.status == ACTIVE and MedicationOrder.${ord2}.status == ACTIVE"

      - name: occ_stale_referral_version_rejected_on_transport_order
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transport-order-create-stale-referral]"
          - "errors[ERR_STALE_REFERRAL_VERSION]"
        distinguishing_aspect: "Creating the first trip advances SpecialtyReferral.version; a second trip still carrying the pre-trip version is rejected with 412 ERR_STALE_REFERRAL_VERSION before the slot-overlap rule is ever consulted."
        test_recipe:
          setup:
            - "A MEDIUM-custody inmate with an AUTHORIZED ROUTINE referral and one DRAFT trip for 2026-05-05T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
