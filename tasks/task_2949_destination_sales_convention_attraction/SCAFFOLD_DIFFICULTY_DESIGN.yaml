          - endpoints[POST /space-holds]
          - endpoints[POST /space-holds/{id}/release]
          - entities.SpaceHold.fields.expires_at
        distinguishing_aspect: |
          Opportunity.hold_posture walks NONE -> TENTATIVE -> RELEASED -> TENTATIVE, re-entering a state it
          already left, while the SpaceHold dimension does NOT cycle: the original hold stays terminally
          RELEASED and a brand-new hold row carries the second TENTATIVE. The replacement hold is stamped
          clock + FIRST_HOLD_DAYS (90) from the LATER clock (2027-06-08T00:00:00Z), not the original expiry,
          so an implementation that resurrects the old hold row or reuses its expiry is caught.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; planner and Grand Hall A (turnaround_hours 48) exist"
            - "opportunity CDA Annual 2028 QUALIFIED, no holds yet, so hold_posture is NONE"
