scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_payer_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Payer, endpoints]
        distinguishing_aspect: "POST /payers with name+payer_type returns 201 and a Payer whose defaults (timely_filing_days=90, appeal_window_days=30, active=true) are applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL" }
              as: Registrar
              captures: { pid: $.data.id, tfd: $.data.timely_filing_days, awd: $.data.appeal_window_days, act: $.data.active }
          assert:
            - "HTTP status == 201"
            - "Payer.${pid}.timely_filing_days == 90"
            - "Payer.${pid}.appeal_window_days == 30"
            - "Payer.${pid}.active == true"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Patient, "validations[priority=3]"]
        distinguishing_aspect: "GET /patients/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_insurance_policy_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.InsurancePolicy, "validations[priority=5]"]
        distinguishing_aspect: "POST /insurance-policies omitting deductible_cents (required input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Patient and Payer exist"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-100", plan_year: 2026, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_insurance_policy_invalid_enum_payer_type_is_on_payer_not_policy
        claim_type: Type Constraints
        grounds: [entities.Payer, "validations[priority=5]"]
        distinguishing_aspect: "POST /payers with payer_type='BOGUS' (not in {COMMERCIAL,MEDICARE,MEDICAID,SELF_PAY}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "BOGUS" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: oop_max_below_deductible_returns_422
        claim_type: Type Constraints
        grounds: [entities.InsurancePolicy.fields.oop_max_cents, "errors[ERR_VALIDATION_OUT_OF_RANGE]"]
        distinguishing_aspect: "POST /insurance-policies with oop_max_cents < deductible_cents violates the field constraint and returns ERR_VALIDATION_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["Patient and Payer exist"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-101", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 50000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_OUT_OF_RANGE"
            - "HTTP status == 422"

      - name: charge_amount_is_computed_units_times_price_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Charge.fields.amount_cents, calculations.encounter_total_charges]
        distinguishing_aspect: "POST /encounters/{id}/charges with units=3, unit_price_cents=5000 yields Charge.amount_cents == 15000 regardless of any client value."
        test_recipe:
          setup: ["REGISTERED encounter with an ACTIVE policy"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-102", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
          trigger:
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "70450", units: 3, unit_price_cents: 5000 }
              as: Registrar
              captures: { ch_amount: $.data.amount_cents }
          assert:
            - "Charge ch_amount == 15000"
            - "Encounter.${encounter_id}.total_charges_cents == 15000"

      - name: encounter_patient_fk_not_found_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Encounter.fields.patient_id, "validations[priority=4]"]
        distinguishing_aspect: "POST /encounters with a non-existent patient_id returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "00000000-0000-4000-8000-000000000000", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_encounters_paginated_envelope
        claim_type: Listing
        grounds: [entities.Encounter, response_envelope]
        distinguishing_aspect: "GET /encounters returns response_type array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["at least one encounter exists"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /encounters"
              payload: { limit: 10, offset: 0 }
              as: Registrar
          assert:
            - "response_type == array"
            - "response envelope includes total_count and has_more"

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false, so it exposes id and created_at but no version field and no update endpoint exists."
        test_recipe:
          setup: ["a Payment has been posted against a statement"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-103", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}/patient-statements"
              payload: {}
              as: BillingSpecialist
              captures: { stmt_id: "$.data[0].id" }
          trigger:
            - call: "POST /patient-statements/${stmt_id}/payments"
              payload: { amount_cents: 50000, method: "CARD" }
              as: BillingSpecialist
              captures: { pay_id: $.data.id }
          assert:
            - "Payment response includes id and created_at"
            - "Payment response does NOT include a version field"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_eligibility_from_already_verified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Encounter.REGISTERED_to_ELIGIBILITY_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /encounters/{id}/eligibility-checks on an already ELIGIBILITY_VERIFIED encounter is rejected with ERR_INVALID_STATE (409); no second EligibilityCheck is created."
        test_recipe:
          setup: ["encounter already ELIGIBILITY_VERIFIED"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-104", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminal_paid_claim_rejects_further_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PAID (terminal) claim rejects POST /claims/{id}/deny with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["claim in terminal PAID state (oop already met so PR==0)"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-105", plan_year: 2026, deductible_cents: 0, coinsurance_pct: 0.0, oop_max_cents: 0 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/deny"
              payload: { denial_reason: "NOT_COVERED" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${claim_id}.status == PAID"
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: initial_state_encounter_registered
        claim_type: initial_state
        grounds: [state_machines.Encounter, entities.Encounter.fields.status]
        distinguishing_aspect: "A newly created Encounter starts in status REGISTERED with total_charges_cents=0 and account_balance_cents=0."
        test_recipe:
          setup: ["a Patient exists"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id, st: $.data.status }
          assert:
            - "Encounter.${encounter_id}.status == REGISTERED"
            - "Encounter.${encounter_id}.total_charges_cents == 0"

      - name: policy_terminate_blocked_while_open_encounter
        claim_type: precondition_enforcement
        grounds: [state_machines.InsurancePolicy.ACTIVE_to_TERMINATED, "errors[ERR_POLICY_IN_USE]"]
        distinguishing_aspect: "POST /insurance-policies/{id}/terminate is rejected with ERR_POLICY_IN_USE (409) while a non-CLOSED encounter references the policy."
        test_recipe:
          setup: ["ACTIVE policy with an open REGISTERED encounter referencing it"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-106", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /insurance-policies/${policy_id}/terminate"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_POLICY_IN_USE"
            - "HTTP status == 409"

      - name: charge_blocked_after_discharge_charges_closed
        claim_type: precondition_enforcement
        grounds: ["validations[priority=14]", "errors[ERR_CHARGES_CLOSED]"]
        distinguishing_aspect: "POST /encounters/{id}/charges on a CHARGES_CAPTURED (discharged) encounter is rejected with ERR_CHARGES_CLOSED (409)."
        test_recipe:
          setup: ["encounter CHARGES_CAPTURED (discharged with one POSTED charge)"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-107", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "70450", units: 1, unit_price_cents: 5000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHARGES_CLOSED"
            - "HTTP status == 409"

      - name: claim_void_from_duplicate_denial
        claim_type: valid_transition
        grounds: [state_machines.Claim.SUBMITTED_to_VOID, entities.Claim.fields.status]
        distinguishing_aspect: "A DENIED claim with denial_reason DUPLICATE transitions to VOID via POST /claims/{id}/void."
        test_recipe:
          setup: ["claim DENIED with denial_reason DUPLICATE"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-108", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
