          trigger:
            - call: "POST /piano-dealer/service-visits"
              payload: { plan_id: "${p_id}", technician_id: "${t_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }
              as: ServiceCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /piano-dealer/service-visits/${v_id}/cancel"
              as: ServiceCoordinator
          assert:
            - "After book: visits_used == 0 and visits_booked == 1 and visits_available == 3 (sum == 4)"
            - "After cancel: visits_used == 0 and visits_booked == 0 and visits_available == 4 (sum == 4, no drift)"
            - "ServiceVisit.${v_id}.status == CANCELLED and ServicePlan.${p_id}.status == ACTIVE"
