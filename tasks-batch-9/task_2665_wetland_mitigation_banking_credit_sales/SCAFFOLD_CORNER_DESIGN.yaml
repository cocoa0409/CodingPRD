            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Permittee
              as_user_id: "${permittee_id}"
              captures: { v_quote: $.data.version }
          trigger:
            - call: "POST /mitigation/credit-sales"
              payload: { bank_id: "${bank_id}", permittee_id: "${permittee_id}", credits_requested: 6.00, impact_huc8_code: "03130003", expected_bank_version: "${v_quote}" }
              as: Permittee
              as_user_id: "${permittee_id}"
              captures: { sale_id: $.data.id, price_in_create: $.data.quoted_price_cents, tier_in_create: $.data.service_area_tier, idx_in_create: $.data.quoted_demand_index }
            - call: "GET /mitigation/credit-sales/${sale_id}"
              payload: {}
              as: Permittee
              as_user_id: "${permittee_id}"
              captures: { price_in_read: $.data.quoted_price_cents, status_in_read: $.data.status }
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { quotes_now: $.data.open_quote_count }
          assert:
            - "${tier_in_create} == SECONDARY (03130003 is not the site watershed but is inside the service area) and ${idx_in_create} == 0.0000"
            - "${price_in_create} == 26001500: tiers round(5.00*3800000*1.000)=19000000 + round(1.00*3800000*0.950)=3610000 -> subtotal 22610000; premium round(22610000*0.20)=4522000; demand 0; gross 27132000; cap round(22610000*1.15)=26001500 -> capped price 26001500"
            - "the cap binds because secondary 0.12 plus stewardship 0.08 exceeds the 15% ceiling, so quoted_price_cents == 26001500"
            - "${price_in_read} == ${price_in_create} and ${status_in_read} == QUOTED"
            - "${quotes_now} == 1 and MitigationBank.${bank_id}.credits_on_hold == 0.00"
            - "CreditSale.${sale_id}.executed_price_cents == null, hold_start_at == null, hold_expires_at == null"
