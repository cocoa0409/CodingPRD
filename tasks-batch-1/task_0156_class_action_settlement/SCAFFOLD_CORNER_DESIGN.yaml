scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_settlement_returns_201_with_computed_net
        claim_type: Creation
        grounds: [entities.Settlement.fields.net_distributable_cents, endpoints]
        distinguishing_aspect: "POST /settlements with all required fields -> 201; net_distributable_cents == gross-fee-admin computed server-side, status DRAFT, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
          trigger:
            - call: "POST /settlements"
              payload: { case_caption: "In re Create", gross_fund_cents: 1000000, attorney_fee_cents: 250000, admin_cost_cents: 50000, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
          assert:
            - "response status == 201"
            - "Settlement.${s_id}.net_distributable_cents == 700000"
            - "Settlement.${s_id}.status == DRAFT"
            - "Settlement.${s_id}.version == 1"

      - name: get_settlement_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_SETTLEMENT_NOT_FOUND]"
        distinguishing_aspect: "GET /settlements/{random-uuid} for a non-existent id -> ERR_SETTLEMENT_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /settlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SettlementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "$.data.error_id == ERR_SETTLEMENT_NOT_FOUND"

      - name: create_settlement_missing_gross_fund_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Settlement.fields.gross_fund_cents"
          - "errors[ERR_MISSING_REQUIRED_FIELD]"
        distinguishing_aspect: "POST /settlements omitting gross_fund_cents -> ERR_MISSING_REQUIRED_FIELD 422; no settlement created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /settlements"
              payload: { case_caption: "In re Missing", attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "$.data.error_id == ERR_MISSING_REQUIRED_FIELD"

      - name: create_settlement_invalid_distribution_method_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Settlement.fields.distribution_method"
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "POST /settlements with distribution_method=BOGUS -> ERR_INVALID_ENUM 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /settlements"
              payload: { case_caption: "In re Enum", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "BOGUS", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "$.data.error_id == ERR_INVALID_ENUM"

      - name: member_claimant_tier_default_applied
        claim_type: Defaults
        grounds: [entities.ClassMember.fields.claimant_tier]
        distinguishing_aspect: "POST /settlements/{id}/class-members omitting claimant_tier -> stored claimant_tier defaults to TIER_B."
        test_recipe:
          setup: ["A DRAFT settlement exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Default", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com" }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
          assert:
            - "response status == 201"
            - "ClassMember.${m_id}.claimant_tier == TIER_B"
            - "ClassMember.${m_id}.status == NOTIFIED"

      - name: member_id_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.ClassMember.fields.status, entities.ClassMember.fields.notice_count]
        distinguishing_aspect: "ClassMember id/created_at/status/notice_count are system-set; status starts NOTIFIED and notice_count starts 0 regardless of input."
        test_recipe:
          setup: ["A DRAFT settlement exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Sys", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
          assert:
            - "ClassMember.${m_id}.status == NOTIFIED"
            - "ClassMember.${m_id}.notice_count == 0"
            - "ClassMember.${m_id}.version == 1"

      - name: list_settlements_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /settlements returns a paginated array envelope with total_count and has_more fields per §1.0."
        test_recipe:
          setup: ["Two settlements exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "S1", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "S2", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
          trigger:
            - call: "GET /settlements"
              payload: { limit: 1, offset: 0 }
              as: SettlementAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "data length == 1 and has_more == true"

      - name: notice_record_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.NoticeRecord, entities.LedgerEntry]
        distinguishing_aspect: "NoticeRecord and LedgerEntry are common_fields:false append-only records: created via their producing endpoints, carry id+created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["A NOTIFIED member exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Immutable", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /class-members/${m_id}/notices"
              payload: { channel: "EMAIL", delivery_status: "DELIVERED" }
              as: ClaimsAdministrator
              captures: { n_id: $.data.id }
          assert:
            - "response status == 201"
            - "NoticeRecord.${n_id} response carries id and created_at and no version field"
            - "ClassMember.${m_id}.notice_count == 1 (incremented by the notice)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: validate_claim_from_validated_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Claim.SUBMITTED_to_VALIDATED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Validating an already-VALIDATED claim -> ERR_INVALID_STATE 409; no side effects, recognized_loss_cents unchanged."
        test_recipe:
          setup: ["CLAIMS_OPEN settlement, one VALIDATED claim recognized 5000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re ReVal", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 5000 }
              as: ClaimsReviewer
          trigger:
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 4000 }
              as: ClaimsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Claim.${c_id}.recognized_loss_cents == 5000 (unchanged)"

      - name: validate_claim_with_open_deficiency_returns_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Claim.SUBMITTED_to_VALIDATED"
          - "errors[ERR_VALIDATION_BLOCKED_BY_DEFICIENCY]"
          - "entities.Claim.fields.open_deficiency_count"
        distinguishing_aspect: "Validating a DEFICIENT claim (open_deficiency_count > 0) -> ERR_VALIDATION_BLOCKED_BY_DEFICIENCY 409; precondition open_deficiency_count==0 enforced."
        test_recipe:
          setup: ["CLAIMS_OPEN settlement, one DEFICIENT claim with one OPEN deficiency."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Blocked", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/deficiencies"
              payload: { reason_code: "MISSING_PROOF", cure_deadline: "2026-02-15T00:00:00Z" }
              as: ClaimsReviewer
          trigger:
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 5000 }
              as: ClaimsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_VALIDATION_BLOCKED_BY_DEFICIENCY"
            - "Claim.${c_id}.status == DEFICIENT (unchanged)"

      - name: file_claim_initial_state_submitted
        claim_type: Initial State
        grounds: [state_machines.Claim, entities.Claim.fields.status]
        distinguishing_aspect: "A newly filed Claim starts in SUBMITTED with recognized_loss_cents 0 and open_deficiency_count 0."
        test_recipe:
          setup: ["CLAIMS_OPEN settlement, one member."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Init", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
          trigger:
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "Claim.${c_id}.status == SUBMITTED"
            - "Claim.${c_id}.recognized_loss_cents == 0"
            - "Claim.${c_id}.open_deficiency_count == 0"

      - name: reopen_closed_settlement_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Settlement"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From a CLOSED settlement, open-claims (or any lifecycle transition) -> ERR_INVALID_STATE 409; terminal CLOSED admits no transitions."
        test_recipe:
          setup: ["A settlement driven all the way to CLOSED (zero-claim path: notice -> claims -> close -> begin not possible with no validated claim; instead reach RECONCILED via cy_pres_floor=0 zero residual then close)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Closed", gross_fund_cents: 50000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 50000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 50000 }
              as: ClaimsReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver1: $.data.version }
            - call: "POST /distribution-batches/${batch_id}/post"
              payload: { expected_settlement_version: "${s_ver1}" }
              as: FundController
              as_user_id: "controller-1"
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver2: $.data.version }
            - call: "POST /settlements/${s_id}/reconcile"
              payload: { expected_settlement_version: "${s_ver2}" }
              as: FundController
            - call: "POST /settlements/${s_id}/close"
              payload: {}
              as: SettlementAdmin
          trigger:
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Settlement.${s_id}.status == CLOSED (unchanged)"

      - name: optout_finalize_excludes_member_cross_entity
        claim_type: Cross-entity
        grounds: [state_machines.OptOutRequest.REQUESTED_to_EFFECTIVE, state_machines.ClassMember.NOTIFIED_to_EXCLUDED]
        distinguishing_aspect: "Finalizing an opt-out for a claim-free member sets OptOutRequest EFFECTIVE and cross-entity sets the ClassMember to EXCLUDED."
        test_recipe:
          setup: ["NOTICE_OPEN settlement, one NOTIFIED member with no claim, one REQUESTED opt-out."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Exclude", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /opt-outs"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}" }
              as: ClaimsAdministrator
              captures: { oo_id: $.data.id }
          trigger:
            - call: "POST /opt-outs/${oo_id}/finalize"
              payload: {}
              as: ClaimsAdministrator
          assert:
            - "OptOutRequest.${oo_id}.status == EFFECTIVE"
            - "ClassMember.${m_id}.status == EXCLUDED"

      - name: optout_revoke_restores_member_compensation
        claim_type: Compensation
        grounds: [state_machines.OptOutRequest.EFFECTIVE_to_REVOKED, state_machines.ClassMember.NOTIFIED_to_EXCLUDED]
        distinguishing_aspect: "Revoking an EFFECTIVE opt-out reverses its exclusion side effect: OptOutRequest -> REVOKED and ClassMember -> NOTIFIED with no drift."
        test_recipe:
          setup: ["NOTICE_OPEN settlement, member EXCLUDED via an EFFECTIVE opt-out."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Revoke", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /opt-outs"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}" }
              as: ClaimsAdministrator
              captures: { oo_id: $.data.id }
            - call: "POST /opt-outs/${oo_id}/finalize"
              payload: {}
              as: ClaimsAdministrator
          trigger:
            - call: "POST /opt-outs/${oo_id}/revoke"
              payload: {}
              as: ClaimsAdministrator
          assert:
            - "OptOutRequest.${oo_id}.status == REVOKED"
            - "ClassMember.${m_id}.status == NOTIFIED"

      - name: objection_sustained_by_court_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Objection.FILED_to_SUSTAINED]
        distinguishing_aspect: "Court rules a FILED objection SUSTAINED via POST /objections/{id}/rule with ruling=SUSTAINED -> status SUSTAINED."
        test_recipe:
          setup: ["NOTICE_OPEN settlement, one member, one FILED objection."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Object", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /objections"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", grounds: "fees too high" }
              as: ClaimsAdministrator
              captures: { obj_id: $.data.id }
          trigger:
            - call: "POST /objections/${obj_id}/rule"
              payload: { ruling: "SUSTAINED" }
              as: Court
