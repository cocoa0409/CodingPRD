  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: side_lot_price_tier_boundary_at_free_area
        grounds:
          - calculations.disposition_price_quote
          - endpoints["GET /land-bank/properties/{id}/price-quote"]
        distinguishing_aspect: |
          The SIDE_LOT tier boundary is exercised one square foot apart: at exactly
          SIDE_LOT_FREE_AREA_SQFT (5000) the marginal area is 0 and the quote is the bare 10000-cent
          base, while at 5001 sqft one marginal foot is billed at 2 cents for 10002. The
          25%-of-assessed cap (50000) is far above both, so the boundary under test is the free-area
          edge and not the cap.
        test_recipe:
          setup:
            - "Parcel A: exactly 5000 sqft, assessed 200000 cents, vacant (structure_present false), grade C."
            - "Parcel B: exactly 5001 sqft, otherwise byte-identical to A."
            - "Both parcels are read through the computed price-quote endpoint under program SIDE_LOT; neither needs to be in inventory."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100130", address: "130 Kestrel Ave", situs_ward: 9, lot_area_sqft: 5000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 6 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_a_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100131", address: "131 Kestrel Ave", situs_ward: 9, lot_area_sqft: 5001, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 6 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_b_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties/${p_a_id}/price-quote"
              payload: { program: "SIDE_LOT" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { quote_a: $.data.quoted_price_cents, marginal_a: $.data.marginal_area_sqft, cap_a: $.data.assessed_cap_cents, disc_a: $.data.discount_applied }
            - call: "GET /land-bank/properties/${p_b_id}/price-quote"
              payload: { program: "SIDE_LOT" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { quote_b: $.data.quoted_price_cents, marginal_b: $.data.marginal_area_sqft }
          assert:
            - "${quote_a} == 10000 and ${marginal_a} == 0  # max(0, 5000 - 5000) == 0, so only the base is charged"
            - "${quote_b} == 10002 and ${marginal_b} == 1  # one square foot past the boundary at 2 cents"
            - "${quote_b} - ${quote_a} == 2"
            - "${cap_a} == 50000  # round_half_up(0.25 * 200000): the cap does not bind at this boundary"
            - "${disc_a} == false  # structure_present false, so the 15% grade discount cannot apply"

      - name: applicant_delinquency_zero_versus_one_cent_at_submit
        grounds:
          - validations[priority=72]
          - calculations.buyer_eligibility_evaluation
          - entities.Applicant.fields.delinquent_tax_total_cents
          - endpoints["POST /land-bank/properties/{id}/tax-roll-posting"]
        distinguishing_aspect: |
          A precision boundary on a different quantity and a different rule: the statutory
          delinquent-taxpayer bar is strictly greater than zero, so an applicant whose owned
          parcels carry exactly 0 cents of delinquency submits successfully while an otherwise
          identical applicant carrying exactly 1 cent is rejected with 422
          ERR_APPLICANT_TAX_DELINQUENT. One cent, not one dollar, is the whole difference.
        test_recipe:
          setup:
            - "Target parcel T: 8500 sqft, assessed 1000000 cents, grade C, structure present, acquired, quiet-titled CLEAR and LISTED; the DEVELOPER_RFP quote is 900000."
            - "Parcel X stays PROSPECT and is owned of record by applicant A, with a tax-roll posting of exactly 0 cents."
            - "Parcel Y stays PROSPECT and is owned of record by applicant B, with a tax-roll posting of exactly 1 cent."
            - "Both applicants are DEVELOPERs with DRAFT DEVELOPER_RFP applications on T offering the full 900000."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Acquisition Revolving Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
