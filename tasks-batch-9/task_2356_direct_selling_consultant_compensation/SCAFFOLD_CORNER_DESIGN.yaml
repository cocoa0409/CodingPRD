            payload: { applicant_email: "cara@ex.test", applicant_full_name: "Cara Wait", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", sponsor_consultant_id: "${cons_a_id}" }
            as: PlatformAdmin
            captures: { app_c_id: "$.data.id" }
          trigger:
          - call: "GET /direct-selling/compensation-plans"
            as: PlatformAdmin
            captures: { e_noauth: "$.data.error_id" }
          - call: "POST /direct-selling/compensation-plans"
            payload: { plan_code: "PLAN-X", name: "Sneaky Plan" }
            as: Consultant
            as_user_id: "${cons_a_id}"
            captures: { e_role1: "$.data.error_id" }
          - call: "POST /direct-selling/commission-runs"
            payload: { qualification_period_id: "${p8_id}", expected_qualification_period_version: "${p8_ver}" }
            as: LegalReviewer
            as_user_id: "LEGAL-1"
            captures: { e_role2: "$.data.error_id" }
          - call: "GET /direct-selling/consultants"
            as: Applicant
            as_user_id: "${app_c_id}"
            captures: { e_role3: "$.data.error_id" }
          - call: "GET /direct-selling/product-orders/${ob_id}"
            as: Consultant
            as_user_id: "${cons_a_id}"
            captures: { e_res1: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_c_id}/accept-agreement"
            payload: { agreement_version: "AGR-2026-01" }
            as: Applicant
            as_user_id: "${app_a_id}"
            captures: { e_res2: "$.data.error_id" }
          - call: "GET /direct-selling/consultants"
            payload: { limit: 0 }
            as: PlatformAdmin
            captures: { e_shape: "$.data.error_id" }
          - call: "GET /direct-selling/product-orders/${ob_id}"
            as: Consultant
            as_user_id: "${cons_b_id}"
            captures: { ok_owner: "$.data.consultant_id" }
          assert:
            - "e_noauth == ERR_UNAUTHENTICATED with HTTP 401 on an endpoint that is otherwise open to all seven roles, proving priority 1 runs before anything else"
            - "e_role1 == ERR_UNAUTHORIZED with HTTP 403: a Consultant cannot create a plan"
            - "e_role2 == ERR_UNAUTHORIZED: a LegalReviewer cannot open a commission run even with a syntactically perfect body"
            - "e_role3 == ERR_UNAUTHORIZED: Applicant is deliberately absent from the roles of GET /direct-selling/consultants"
            - "e_res1 == ERR_FORBIDDEN_RESOURCE with HTTP 403: consultant A is a legitimate Consultant but the order belongs to B, and this fires even though A is B's sponsor"
            - "e_res2 == ERR_FORBIDDEN_RESOURCE: the acting applicant does not own the addressed application, and priority 3 beats the agreement-version check at priority 19"
            - "e_shape == ERR_VALIDATION with HTTP 422 for limit 0, since the declared range is 1..100"
            - "ok_owner == ${cons_b_id}: the same request from the owning consultant succeeds, so the ownership rule is not a blanket deny"

