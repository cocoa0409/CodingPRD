              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_NOT_RESOURCE_OWNER"
            - "Order.${ord_id}.fulfillment_status == DRAFT"

      - name: missing_auth_headers_returns_401
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /floral/florists with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["a zone exists"]
          setup_api_calls:
