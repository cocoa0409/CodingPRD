  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: block_minute_conservation_on_cancel
        conserved_quantity: "BlockTime minutes: committed_minutes + released_minutes + open_minutes == block_duration_minutes"
        grounds:
          - calculations.block_utilization
          - state_machines[SurgicalCase.scheduling_status] CONFIRMED -> CANCELLED
          - endpoints["POST /surgical-cases/{caseId}/cancel"]
        forward_operation: "hold-block then confirm, which moves 60 minutes out of open_minutes into committed_minutes"
        compensating_operation: "POST /surgical-cases/{caseId}/cancel, which must return those 60 minutes to open_minutes - NOT to released_minutes"
        drift_trap: |
          The obvious wrong compensation is to treat every departure from the committed roster the
          same way and add the freed minutes to released_minutes (which is what
          POST /block-times/{blockId}/release does). That still satisfies the three-way sum, so a
          naive conservation check passes, yet open_minutes stays 180 and utilization_pct stays
          25.00 forever: the block can never be resold. The second trap is recomputing
          utilization_pct from a stale committed_minutes, and the third is double-decrementing when
          the case is cancelled from CONFIRMED rather than BLOCK_HELD (the confirm transition bumped
          BlockTime.version without moving any minutes).
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z -> 2026-09-14T12:00:00Z"
            - "practice with NO permit at all (privilege UNPERMITTED), which is legal for a LOCAL_ONLY case"
            - "one 240-minute block OR-1 2026-09-14T13:00Z-17:00Z"
            - "one LOCAL_ONLY 60-minute case, held, evaluated, cleared and CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Riverbend OMS", state_code: "OH", recovery_bay_count: 2, turnover_buffer_minutes: 15 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
