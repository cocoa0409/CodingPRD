  - name: active_episode_occupancy_blocks_second_intake_same_family
    grounds:
    - validations[priority=9]
    - state_machines.Episode
    distinguishing_aspect: 'Resource: Episode occupancy per (patient, procedure_family).

      Interval semantics: occupancy is a lifecycle interval, not a

      date-range intersection — a patient ''occupies'' the family from

      intake until the episode reaches a terminal state (CLOSED /

      AVOIDED / CANCELLED); a second intake while occupied is rejected,

      and occupancy ends exactly at the terminal transition (a new intake

      is allowed immediately after AVOIDED). Aggregate-capacity-free,

      point-in-time semantics — different from the sibling''s half-open

      date-window arithmetic.

      '
    test_recipe:
      setup:
      - Clock 2026-09-01. One ACTIVE contract. Patient has episode E1 in SOR_PENDING (occupied). A second intake for the same patient+family is attempted, then E1 is driven to AVOIDED via SURGERY_UNNECESSARY,
