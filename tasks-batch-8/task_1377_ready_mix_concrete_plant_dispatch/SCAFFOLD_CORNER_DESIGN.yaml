            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
          trigger:
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher, captures: { o_v2: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v2}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
          assert:
            - "Second schedule with stale ${o_v1}: error_id == ERR_STALE_VERSION, http 412; no load created for it"
            - "After GET, schedule with fresh version succeeds: Load.${l2_id}.status == SCHEDULED"
            - "Order.${o_id}.version == ${o_v2} + 1 after the successful schedule"

      - name: credit_hold_at_exact_limit_threshold
        claim_type: rate_threshold_triggers
        grounds: ["calculations.credit_exposure", "entities.Customer.fields.credit_limit_cents"]
        distinguishing_aspect: "The HOLD threshold is >= : a customer whose exposure equals the limit exactly (145200 == 145200) flips to HOLD; at exposure 145199 it would stay GOOD."
        test_recipe:
          setup: ["standard catalog; customer credit_limit_cents 145200; order qty 8.0 pour 2026-08-15 (Saturday) confirmed at July clock with indices 06=100, 07=110 -> provisional exactly 145200"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-07", index_points: 110.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 145200 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /v1/customers/${c_id}/credit-review", payload: {}, as: PlantManager }
          assert:
            - "Order.${o_id}.provisional_total_cents == 145200 (8 x 16500 = 132000 + 13200 Saturday)"
            - "Customer.${c_id}.credit_exposure_cents == 145200 == credit_limit_cents"
            - "Customer.${c_id}.credit_status == HOLD (>= boundary: equality trips the threshold)"

      - name: derived_fields_reconcile_through_delivery_and_payment
        claim_type: derived_field_reconciliation
        grounds: ["calculations.order_fulfillment", "calculations.credit_exposure"]
        distinguishing_aspect: "Derived fields track their sources across the lifecycle: delivered_qty 6.0 then 12.0 (DELIVERED at equality), invoice 207000 = 2 x 103500, exposure 207000 -> 0 and credit HOLD -> GOOD after exact payment."
        test_recipe:
          setup: ["standard catalog (2026-08 index 115.0); customer limit 200000; order qty 12.0 pour 2026-08-17 (Monday); two 6.0 yd3 loads on T1/T2, each on-site 30 min"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 200000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T2", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t2_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 12.0, pour_date: "2026-08-17", pour_window_start: "07:00", pour_window_end: "12:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 6.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher, captures: { o_v2: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 6.0, expected_order_version: "${o_v2}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l1_id}/batch", payload: { batch_time: "2026-08-17T09:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-17T09:30:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l1_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l2_id}/depart", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T09:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/complete", payload: { discharged_qty_yd3: 6.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l2_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l2_id}/complete", payload: { discharged_qty_yd3: 6.0 }, as: Driver, as_user_id: "drv-2" }
          trigger:
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher }
            - { call: "GET /v1/invoices", payload: { order_id: "${o_id}" }, as: Dispatcher, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /v1/invoices/${inv_id}/issue", payload: {}, as: PlantManager }
            - { call: "POST /v1/customers/${c_id}/credit-review", payload: {}, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/pay", payload: { amount_cents: 207000 }, as: Customer, as_user_id: "${c_id}" }
          assert:
            - "After L1 complete only: delivered_qty_yd3 == 6.0 and delivery_status == IN_PROGRESS (6.0 < 12.0)"
            - "After L2: delivered_qty_yd3 == 12.0 and delivery_status == DELIVERED (equality completes)"
            - "Invoice total_cents == 207000 (2 loads x 103500); exposure after review == 207000 -> HOLD (>= 200000)"
            - "After pay: exposure == 0 and credit_status == GOOD (paid invoice drops out of the input set)"

      - name: cascade_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["state_machines.Load.POURING_to_COMPLETED"]
        excluded_because: { difficulty_instance: complete_triggers_order_invoice_credit_chain, rationale: "Depth-3 cascade asserted end-to-end in the named §1.8 instance." }
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: ["calculations.load_final_charge"]
        excluded_because: { difficulty_instance: provisional_vs_final_load_pricing, rationale: "Both variants with the reconciliation delta asserted in the named §1.8 instance." }

  # =================================================================
  # Section: consistency_model
  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_response_is_final
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.Load.fields.final_charge_cents"]
        distinguishing_aspect: "Immediate consistency: the complete response body itself carries the recomputed charge fields, on_site_minutes, and a bumped version — no re-read or eventual reconciliation needed."
        test_recipe:
          setup: ["standard catalog (2026-08 index 115.0); one load POURING since 10:30, completing at 12:00"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id", l_v0: "$.data.version" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1", captures: { fc: "$.data.final_charge_cents", osm: "$.data.on_site_minutes", lv: "$.data.version" } }
          assert:
            - "Complete response itself: final_charge_cents == 159300, on_site_minutes == 90, status == COMPLETED"
            - "Load version in the complete response == ${l_v0} + 5 (batch, depart, arrive, start-pour, complete each incremented once)"
