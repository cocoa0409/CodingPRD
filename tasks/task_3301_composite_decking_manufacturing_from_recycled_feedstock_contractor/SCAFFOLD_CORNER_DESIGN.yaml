  # ===========================================================================
  - section: consistency
    instances:
      - name: invoice_visible_immediately_on_ship_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/decking/shipment-orders/{id}/ship
        distinguishing_aspect: "The ship response itself carries the computed invoiced_cents and bumped versions — no re-read or lag."
        test_recipe:
          setup:
            - "CONFIRMED 100-lf order inside its ship week; fg_store stocked."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/price-books"
              payload: { name: "PB26", effective_from: "2026-01-01", base_prices: { "${line_id}": 500 }, tier_discounts_bp: { STANDARD: 0, PREFERRED: 1000 } }
              as: ChannelManager
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 100000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "VIRGIN_PE", weight_lbs: 500, received_date: "2026-02-20", moisture_pct: 1.0, contamination_ppm: 10, melt_flow_index: 0.7, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_pe: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 500, received_date: "2026-02-20", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-2" }
              as: QualityEngineer
              captures: { lot_wf: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_pe}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/feedstock-lots/${lot_wf}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 200, production_date: "2026-03-01", run_kind: "SELLABLE", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/start"
              payload: {}
              as: OpsManager
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/complete"
              payload: { actual_lf: 200 }
              as: OpsManager
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 100, ship_week_start: "2026-03-02" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /decking/shipment-orders/${order_id}/confirm"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /decking/shipment-orders/${order_id}/ship"
              payload: {}
              as: DealerSalesRep
              captures: { invoiced: $.data.invoiced_cents, status_after: $.data.status }
          assert:
            - "the ship response body itself carries invoiced_cents == 50000 and status == SHIPPED (immediate consistency)"
            - "Dealer.${dealer_id}.outstanding_cents == 50000 on a follow-up GET"
