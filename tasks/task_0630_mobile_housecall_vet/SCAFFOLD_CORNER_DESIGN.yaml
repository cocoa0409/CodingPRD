      - name: missing_auth_header_rejected
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH]
        distinguishing_aspect: "POST /patients with no X-User-Role header -> 401 ERR_MISSING_AUTH (auth precedes everything)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { owner_name: "Owner U3", species: "DOG", weight_kg: 10, home_zip: "11201" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MISSING_AUTH"

