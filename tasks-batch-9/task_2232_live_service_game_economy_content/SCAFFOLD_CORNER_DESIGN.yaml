            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 2, title: "E2 Early Tide", planned_release_at: "2026-08-10T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep2_id: $.data.id }
