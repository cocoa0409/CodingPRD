            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/ta-engagements"
              payload: { borrower_id: "${b1_id}", topic: "CREDIT_BUILDING", scheduled_start_at: "2026-09-02T14:00:00Z", scheduled_end_at: "2026-09-02T15:00:00Z", planned_hours: 1.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/ta-engagements"
              payload: { borrower_id: "${b1_id}", topic: "FINANCIAL_COACHING", scheduled_start_at: "2026-09-02T15:30:00Z", scheduled_end_at: "2026-09-02T16:30:00Z", planned_hours: 1.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { buffer_edge_status: $.status, buffer_edge_code: $.data.error_id }
            - call: "POST /cdfi/institutions/${inst_id}/ta-engagements"
              payload: { borrower_id: "${b1_id}", topic: "FINANCIAL_COACHING", scheduled_start_at: "2026-09-02T15:31:00Z", scheduled_end_at: "2026-09-02T16:31:00Z", planned_hours: 1.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { one_minute_later_status: $.status, e2_id: $.data.id }
            - call: "POST /cdfi/ta-engagements/${e1_id}/close"
              payload: { outcome: "NO_SHOW" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/institutions/${inst_id}/ta-engagements"
              payload: { borrower_id: "${b1_id}", topic: "CREDIT_BUILDING", scheduled_start_at: "2026-09-02T14:00:00Z", scheduled_end_at: "2026-09-02T15:00:00Z", planned_hours: 1.00 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { rebook_status: $.status, e3_id: $.data.id }
          assert:
            - "${buffer_edge_status} == 409"
            - "${buffer_edge_code} == ERR_TA_SLOT_CONFLICT"
            - "${one_minute_later_status} == 201"
            - "${rebook_status} == 201"
            - "TAEngagement.${e1_id}.state == NO_SHOW"
            - "TAEngagement.${e1_id}.actual_hours == 0.00"
            - "TAEngagement.${e1_id}.competency_verified == false"
            - "TAEngagement.${e1_id}.closed_at == 2026-09-01T00:00:00Z"
            - "TAEngagement.${e2_id}.state == SCHEDULED"
            - "TAEngagement.${e2_id}.scheduled_start_at == 2026-09-02T15:31:00Z"
            - "TAEngagement.${e3_id}.state == SCHEDULED"
            - "TAEngagement.${e3_id}.scheduled_start_at == 2026-09-02T14:00:00Z"
            - "Borrower.${b1_id}.ta_hours_total == 0.00"
            - "count(GET /cdfi/ta-engagements?borrower_id=${b1_id}&state=SCHEDULED) == 2"
  - rule_id: compensating_invariant
    instances:
      - name: impact_dispute_reverses_one_report_without_disturbing_the_other
        grounds:
          - calculations.institution_impact_aggregation
          - state_machines.ImpactReport.VERIFIED_to_DISPUTED
          - entities.Institution.fields.jobs_created_total
          - entities.Institution.fields.jobs_retained_total
          - entities.Institution.fields.housing_units_total
          - entities.Institution.fields.businesses_financed_total
          - concurrency_rules[impact-report-supersede-stale-loan]
        distinguishing_aspect: |
          The compensation here reverses FOUR integer counters at once and must be selective:
          two verified reports were rolled into the ledger, and disputing only the first must
          leave the ledger exactly equal to the second report's figures, not zero and not the
          pre-dispute sum. It also reverses a non-counter field - verified_at must go back to
          null - which a naive "subtract the numbers" implementation forgets. The other
          instance in this rule compensates a MONEY ledger whose shortfall was clamped at zero.
        test_recipe:
          setup:
            - "One institution with two disbursed loans to the same GEOCODED borrower: LA for 1,000,000 cents and LB for 1,200,000 cents."
            - "Report R1 on LA with jobs_created 12, jobs_retained 5, housing_units 3 and businesses_financed 2, VERIFIED."
            - "Report R2 on LB with jobs_created 7, jobs_retained 4, housing_units 1 and businesses_financed 1, VERIFIED."
            - "After both verifications the institution ledger reads 19 / 9 / 4 / 3."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000017", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { la_id: $.data.id }
            - call: "POST /cdfi/loans/${la_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${la_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /cdfi/loans/${la_id}/disbursements"
              payload: { amount_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1200000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /cdfi/loans/${lb_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${lb_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1200000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /cdfi/loans/${lb_id}/disbursements"
              payload: { amount_cents: 1200000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "GET /cdfi/loans/${la_id}"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { la_v: $.data.version }
            - call: "POST /cdfi/loans/${la_id}/impact-reports"
              payload: { expected_loan_version: "${la_v}", reporting_period_end: "2026-08-31T00:00:00Z", jobs_created: 12, jobs_retained: 5, housing_units: 3, businesses_financed: 2 }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /cdfi/impact-reports/${r1_id}/verify"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "GET /cdfi/loans/${lb_id}"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { lb_v: $.data.version }
            - call: "POST /cdfi/loans/${lb_id}/impact-reports"
              payload: { expected_loan_version: "${lb_v}", reporting_period_end: "2026-08-31T00:00:00Z", jobs_created: 7, jobs_retained: 4, housing_units: 1, businesses_financed: 1 }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /cdfi/impact-reports/${r2_id}/verify"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { mid_jobs: $.data.jobs_created_total, mid_retained: $.data.jobs_retained_total, mid_units: $.data.housing_units_total, mid_biz: $.data.businesses_financed_total }
          trigger:
            - call: "POST /cdfi/impact-reports/${r1_id}/dispute"
              payload: { dispute_reason: "PAYROLL_EVIDENCE_MISSING" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
          assert:
            - "${mid_jobs} == 19"
            - "${mid_retained} == 9"
            - "${mid_units} == 4"
            - "${mid_biz} == 3"
            - "ImpactReport.${r1_id}.state == DISPUTED"
            - "ImpactReport.${r1_id}.dispute_reason == PAYROLL_EVIDENCE_MISSING"
            - "ImpactReport.${r1_id}.verified_at == null"
            - "ImpactReport.${r1_id}.jobs_created == 12"
            - "ImpactReport.${r1_id}.revision_count == 0"
            - "ImpactReport.${r2_id}.state == VERIFIED"
            - "ImpactReport.${r2_id}.verified_at == 2026-09-01T00:00:00Z"
            - "Institution.${inst_id}.jobs_created_total == 7"
            - "Institution.${inst_id}.jobs_retained_total == 4"
            - "Institution.${inst_id}.housing_units_total == 1"
            - "Institution.${inst_id}.businesses_financed_total == 1"
      - name: match_ledger_withdrawal_re_exposes_a_shortfall_clamped_at_zero
        grounds:
          - calculations.award_eligible_match_total
          - state_machines.MatchingFundCommitment.VERIFIED_to_WITHDRAWN
          - entities.AwardApplication.fields.match_eligible_cents
          - entities.AwardApplication.fields.match_shortfall_cents
          - entities.MatchingFundCommitment.fields.eligible_cents
        distinguishing_aspect: |
          The compensated quantity here is a haircut-adjusted MONEY ledger whose derived
          shortfall is clamped by max(0, ...), so the reversal has to make a figure that was
          sitting at 0 re-emerge as a positive 400,000 - an implementation that decrements the
          stored shortfall instead of recomputing it from the surviving VERIFIED rows stays at
          0. The withdrawn commitment must also zero its OWN eligible_cents while the untouched
          sibling keeps its 600,000. The other instance in this rule reverses integer impact
          counters and a timestamp on a different aggregate.
        test_recipe:
          setup:
            - "One institution and one DRAFT AwardApplication for 4,000,000 cents at match_ratio_pct 25.00, so required_match_cents is 1,000,000."
            - "Commitment C1 CASH_PRIVATE 600,000 cents at factor 1.00 and commitment C2 IN_KIND 900,000 cents at factor 0.50, both VERIFIED."
            - "After both verifications match_eligible_cents is 600,000 + 450,000 = 1,050,000, which over-covers the requirement, so match_shortfall_cents is clamped to 0."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000018", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/award-applications"
              payload: { program: "CDFI_PROGRAM_FA", requested_amount_cents: 4000000, match_ratio_pct: 25.00, performance_goal_jobs: 40, performance_goal_housing_units: 10, period_start: "2026-10-01T00:00:00Z", period_end: "2027-10-01T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { award_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Kellerman Family Foundation", source_type: "CASH_PRIVATE", amount_cents: 600000, committed_on: "2026-08-15T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Bronx Legal Aid In-Kind Services", source_type: "IN_KIND", amount_cents: 900000, committed_on: "2026-08-20T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c2_id: $.data.id }
            - call: "POST /cdfi/matching-fund-commitments/${c1_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
            - call: "POST /cdfi/matching-fund-commitments/${c2_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
            - call: "GET /cdfi/award-applications/${award_id}"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { mid_eligible: $.data.match_eligible_cents, mid_shortfall: $.data.match_shortfall_cents }
          trigger:
            - call: "POST /cdfi/matching-fund-commitments/${c2_id}/withdraw"
              payload: { withdraw_reason: "IN_KIND_VALUATION_REJECTED" }
              as: AwardAdministrator
              as_user_id: "adm-1"
          assert:
            - "${mid_eligible} == 1050000"
            - "${mid_shortfall} == 0"
            - "MatchingFundCommitment.${c1_id}.status == VERIFIED"
            - "MatchingFundCommitment.${c1_id}.eligible_cents == 600000"
            - "MatchingFundCommitment.${c2_id}.status == WITHDRAWN"
            - "MatchingFundCommitment.${c2_id}.eligible_cents == 0"
            - "MatchingFundCommitment.${c2_id}.withdraw_reason == IN_KIND_VALUATION_REJECTED"
            - "AwardApplication.${award_id}.required_match_cents == 1000000"
            - "AwardApplication.${award_id}.match_eligible_cents == 600000"
            - "AwardApplication.${award_id}.match_shortfall_cents == 400000"
            - "AwardApplication.${award_id}.state == DRAFT"
