  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_club_patch_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[club-config-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /clubs/{id} with a version captured before a successful PATCH is rejected with 412 ERR_STALE_VERSION; the second (fresh) writer's change already advanced Club.version."
        test_recipe:
          setup: ["Club created; version captured; one successful PATCH advances the version"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club OCC1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, club_v: $.data.version }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", lp_unscanned_threshold: 3 }
              as: ClubManager
          trigger:
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", scan_go_enabled: false }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "Club.${club_id}.scan_go_enabled == true (stale write rejected)"

      - name: occ_stale_version_on_curbside_reschedule_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[curbside-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reschedule carrying the version observed before an associate's stage call (which bumped the version) is rejected with 412; re-reading and rescheduling with the fresh version succeeds."
        test_recipe:
          setup: ["Club, member, curbside order; version captured at creation; stage advances the version"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club OCC2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 2 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /curbside-orders/${order_id}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T14:00:00Z", window_end_iso: "2026-09-01T15:00:00Z" }
              as: Associate
              captures: { order_v2: $.data.version }
          trigger:
            - call: "POST /curbside-orders/${order_id}/reschedule"
              payload: { staging_slot_label: "S2", window_start_iso: "2026-09-01T16:00:00Z", window_end_iso: "2026-09-01T17:00:00Z", expected_curbside_order_version: "${order_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /curbside-orders/${order_id}/reschedule"
              payload: { staging_slot_label: "S2", window_start_iso: "2026-09-01T16:00:00Z", window_end_iso: "2026-09-01T17:00:00Z", expected_curbside_order_version: "${order_v2}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION"
            - "ok_status == STAGING and CurbsideOrder.${order_id}.staging_slot_label == S2"

