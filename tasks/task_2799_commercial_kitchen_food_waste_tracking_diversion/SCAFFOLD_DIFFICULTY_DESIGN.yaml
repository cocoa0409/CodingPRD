          assert:
            - "Ticket GLC-1 settles at net_weight_grams 1000, billable_tonnes 0.0010, base_haul_fee_cents 1852 (52 + 1800), fuel_surcharge_pct 0.00 (1852 < SURCHARGE_TIER_1_CENTS 5000), settlement_subtotal_cents 1852, variance_pct 0.00, variance_credit_cents 0, settlement_total_cents 1852."
            - "Ticket GLC-2 settles at net_weight_grams 1200, billable_tonnes 0.0012, base_haul_fee_cents 1862 (round(0.0012 * 52000) = 62, plus 1800), fuel_surcharge_pct 0.00, settlement_subtotal_cents 1862, variance_pct 20.00 (200 g over the staged 1000 g) which IS strictly greater than VARIANCE_TOLERANCE_PCT 5.00, so variance_credit_cents == 186 and settlement_total_cents == 1676."
            - "Reading the consignment after each setup write walks settlement_status UNBILLED -> TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED while logistics_status remains DISPATCHED for every one of those four observations."
            - "After the trigger, GET /diversion-consignments/${consignment_id} returns settlement_status SETTLED AND logistics_status COMPLETED — both dimensions moved in the SAME request, and this is the only write in the recipe that touches the logistics dimension after dispatch."
