  - section: complexity_layers
    instances:

      - name: occ_stale_bom_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pack-create-stale-bom]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a pack with expected_bom_version = captured-1 returns ERR_STALE_VERSION (412) after another pack has consumed the BOM (bumping its version)."
        test_recipe:
          setup: ["program; lot accepted; BOM at version V (captured); one pack already built (BOM now at V+1)"]
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-CC1", storage_capacity_wh: 5000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-CC1", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-CC1", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v_initial: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v_initial}" }
              as: AssemblyLead
              as_user_id: "al-1"
          trigger:
            # BOM.version is now bom_v_initial+1; using the captured initial → stale
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v_initial}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"

