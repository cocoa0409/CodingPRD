              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == \"ERR_FEE_UNPAID\""

      - name: document_verify_requires_parent_application_in_verification
        grounds:
          - state_machines.SupportingDocument.PENDING_to_ACCEPTED
          - state_machines.Application.SUBMITTED_to_IN_VERIFICATION
          - entities.Application.fields.status
        distinguishing_aspect: |
          Different entity pair SupportingDocument <- Application: a document PENDING->ACCEPTED requires the
          parent Application.status == IN_VERIFICATION; verifying while the application is still SUBMITTED
          (begin-verification not yet called) is rejected with ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Adult NEW BOOK application SUBMITTED and PAID but begin-verification NOT yet called; an IDENTITY doc is PENDING; an agent exists."
          setup_api_calls:
