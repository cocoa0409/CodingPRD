  - rule_id: boundary_precision_check
    instances:
      - name: volume_tier_boundary_qty25_vs_qty24
        grounds:
          - calculations.line_subtotal
          - entities.Order.subtotal_cents
        distinguishing_aspect: |
          The 0.12 volume tier engages at quantity >= 25 exactly: qty 25 yields subtotal 22000 while qty 24 yields
          22800 (0.05 tier). Numeric threshold boundary reached through POST /projects/{id}/quote.
        test_recipe:
          setup:
            - "A DRAFT project on a template with base_unit_price 1000, MATTE finish (quote requires no approval)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 100 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 25, finish: "MATTE", ship_method: "STANDARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { s25: $.data.subtotal_cents }
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 24, finish: "MATTE", ship_method: "STANDARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { s24: $.data.subtotal_cents }
          assert:
            - "quote(qty=25).subtotal_cents == 22000 (0.12 tier engages at >=25)"
            - "quote(qty=24).subtotal_cents == 22800 (0.05 tier, one unit below the boundary)"

      - name: autolayout_min_photos_boundary
        grounds:
          - validations[priority=10]
          - state_machines.Project.DRAFT_to_LAID_OUT
          - entities.Project.photo_count
