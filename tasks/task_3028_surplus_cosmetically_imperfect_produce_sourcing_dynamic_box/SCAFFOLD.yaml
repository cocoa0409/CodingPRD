    side_effects:
      - "SupplyLot.status -> AWARDED or READY via the SourcingBid fork-join"
      - "expiry_date recomputed from the award shelf-life matrix; shelf_life_days recomputed"
      - "up to bidder_quota bids -> SHORTLISTED; one joins to SELECTED; the rest -> NOT_SELECTED"
      - "when shelf_life_days < SUBSCRIPTION_MIN_SHELF_LIFE_DAYS every ACTIVE subscription of the lane -> AUTO_SKIPPED"
      - "increments SupplyLot.version by 1"

  - method: POST
    path: "/produce/supply-lots/{id}/make-ready"
    description: "Move a lot through make-ready quality inspection"
    roles: [PlatformAdmin]
    code: 200
    input: [quality_outcome, "arrived_at?", expected_supply_lot_version]
    output: SupplyLot
    side_effects:
      - "SupplyLot.quality_status -> PASS or REJECTED"
      - "SupplyLot.status -> READY on PASS"
      - "arrived_at stamped; recomputes Supplier.reliability_score_bp and Supplier.relationship_status"
      - "increments SupplyLot.version by 1"

  # --- Conventional quotes ---------------------------------------------------------------
  - method: POST
    path: "/produce/conventional-quotes"
    description: "Record a conventional retail reference price against a lot"
    roles: [PlatformAdmin]
    code: 201
    input: [supply_lot_id, retailer_label, source_url, captured_at, conventional_unit_price_cents, barcode_gtin, "grade_equivalent?"]
    output: ConventionalQuote
    side_effects:
      - "is_primary stamped on the deterministic primary source of the lot"
      - "substantiation_status derived from the source count and grade equivalence"

  - method: GET
    path: "/produce/conventional-quotes/{id}"
    description: "Read a conventional quote"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ConventionalQuote
    side_effects: []

  - method: GET
    path: "/produce/conventional-quotes"
    description: "List conventional quotes, optionally filtered by lot"
    roles: [PlatformAdmin]
    code: 200
    input: ["supply_lot_id?", "substantiation_status?", "limit?", "offset?"]
    output: ConventionalQuote[]
    side_effects: []

  - method: POST
    path: "/produce/conventional-quotes/{id}/substantiate"
    description: "Evaluate a lot's substantiation evidence"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { supply_lot_id: string, source_count: integer, grade_equivalent_source_count: integer, is_substantiated: boolean }
    side_effects:
      - "recomputes source_count and substantiation_status for the lot"
      - "rejects with ERR_SUBSTANTIATION_REQUIRED when a quote exists but no source is of the lot's own grade, or when more than three sources exist"

  # --- Box orders -------------------------------------------------------------------------
  - method: POST
    path: "/produce/box-orders"
    description: "Open a box order for a customer's service cycle"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [customer_id, subscription_id, serving_cycle_index, cuisine_preference]
    output: BoxOrder
    side_effects:
      - "fulfillment_center_id and routing_region copied from the customer's home center"
      - "status=DRAFT; pricing_status=UNPRICED; ready_deadline and build_deadline computed by order_window_plan"
      - "rejects with ERR_SUBSCRIPTION_INELIGIBLE when a box already exists for the same subscription and serving_cycle_index"

  - method: GET
    path: "/produce/box-orders"
    description: "List box orders, optionally filtered"
    roles: [Customer, PlatformAdmin, FulfillmentOperator]
    code: 200
    input: ["customer_id?", "subscription_id?", "fulfillment_center_id?", "status?", "limit?", "offset?"]
    output: BoxOrder[]
    side_effects: []

  - method: GET
    path: "/produce/box-orders/{id}"
    description: "Read a box order, including its pricing and conventional-retail comparison"
    roles: [Customer, PlatformAdmin, FulfillmentOperator]
    code: 200
    input: []
    output: BoxOrder
    side_effects: []

  - method: POST
    path: "/produce/box-orders/{id}/finalize"
    description: "Finalise an order: check the cutoff and advance the price plan"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: [expected_box_order_version]
    output: BoxOrder
    side_effects:
      - "status -> AWAITING_WINDOW; increments the owning center's serving_cycle_index"
      - "increments Subscription.serving_cycle_index by one full cadence period"
      - "runs advance_box_order_pricing in both the provisional and final reading"
      - "increments BoxOrder.version by 1"

  - method: POST
    path: "/produce/box-orders/{id}/build"
    description: "Build the box from what was actually procured"
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: [expected_box_order_version, "line_plan?"]
    output: BoxOrder
    side_effects:
      - "status -> BUILDING; up to six BoxBuildItems created by allocate_box_lines"
      - "every included line decrements SupplyLot.quantity_available"
      - "recomputes lines_total_cents, weight_total_grams, subtotal_cents, tax_cents, shipped_total_cents"
      - "pricing_status -> PRICED or REVISED"
      - "increments BoxOrder.version by 1"

  - method: POST
    path: "/produce/box-orders/{id}/reroute-back"
    description: "Return a rerouted order to the draft pool"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_box_order_version]
    output: BoxOrder
    side_effects: ["status -> DRAFT; build_blocked -> false; increments BoxOrder.version by 1"]

  - method: POST
    path: "/produce/box-orders/{id}/crash-out"
    description: "Declare a cold-chain failure on an in-flight build"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_box_order_version]
    output: BoxOrder
    side_effects:
      - "status -> CRASHED; build_blocked -> true; build lines are retained"
      - "increments BoxOrder.version by 1"

  - method: GET
    path: "/produce/box-orders/{id}/items"
    description: "List the build items of a box"
    roles: [Customer, PlatformAdmin, FulfillmentOperator]
    code: 200
    input: ["status?"]
    output: BoxBuildItem[]
    side_effects: []

  - method: POST
    path: "/produce/box-orders/{id}/pack"
    description: "Pack the box, selecting insulation and coolant by lane and season"
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: [expected_box_order_version]
    output: BoxOrder
    side_effects:
      - "status -> PACKED; exactly one ColdChainPack created"
      - "cold_chain_selected -> true"
      - "decrements the owning center's serving_cycle_index"
      - "decrements Subscription.serving_cycle_index by one full cadence period"
      - "increments BoxOrder.version by 1"

  - method: GET
    path: "/produce/box-orders/{id}/cold-chain-packs"
    description: "List the cold-chain packs of an order"
    roles: [Customer, PlatformAdmin, FulfillmentOperator]
    code: 200
    input: []
    output: ColdChainPack[]
    side_effects: []

  # --- Quality claims ----------------------------------------------------------------------
  - method: POST
    path: "/produce/box-orders/{id}/quality-claims"
    description: "File a spoiled-arrival credit claim against a build item"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [box_build_item_id, reason_code, photo_url, requested_credit_cents]
    output: QualityClaim
    side_effects:
      - "status=IN_REVIEW; supply_lot_id derived from the build item"
      - "cited_lot_quality_status snapshotted from the cited lot"
      - "rejects with ERR_CLAIM_EVIDENCE_REQUIRED when photo_url lacks an image extension"

  - method: GET
    path: "/produce/box-orders/{id}/quality-claims"
    description: "List the claims filed against an order"
    roles: [Customer, PlatformAdmin, FulfillmentOperator]
    code: 200
    input: ["status?"]
    output: QualityClaim[]
    side_effects: []

  - method: GET
    path: "/produce/quality-claims"
    description: "List quality claims across orders"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "outcome?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []

  - method: POST
    path: "/produce/quality-claims/{id}/review"
    description: "Review a claim and issue or refuse a credit"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, expected_claim_version]
    output: QualityClaim
    side_effects:
      - "status -> UPHELD, CLOSED, UNDER_REVIEW or REJECTED"
      - "credited_cents computed by cap_quality_credit on UPHELD"
      - "on UPHELD: increments Supplier.claims_upheld_total and recomputes Supplier.reliability_score_bp"
      - "on UNDER_REVIEW: SupplyLot.quality_status -> INVESTIGATION and center open_claim_count recomputed"
      - "increments QualityClaim.version by 1"

  - method: POST
    path: "/produce/quality-claims/{id}/reopen"
    description: "Reopen a rejected claim for a fresh review"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status -> IN_REVIEW"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, unknown, or an entity-backed id that does not resolve to a persisted instance" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role may not perform this operation, or an entity-backed role is acting on a resource it does not own" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, malformed enum member, or a barcode_gtin that is not exactly 14 digits" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "A request's expected_*_version does not equal the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state that admits the requested transition or operation" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "No Customer exists with the given id" }
  - { id: ERR_BOX_ORDER_NOT_FOUND, http: 404, condition: "No BoxOrder exists with the given id" }
  - { id: ERR_BUILD_ITEM_NOT_FOUND, http: 404, condition: "No BoxBuildItem exists with the given id" }
  - { id: ERR_SUPPLY_LOT_NOT_FOUND, http: 404, condition: "No SupplyLot exists with the given id" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "No Supplier exists with the given id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No QualityClaim exists with the given id" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "No Subscription exists with the given id" }
  - { id: ERR_FULFILLMENT_CENTER_NOT_FOUND, http: 404, condition: "No FulfillmentCenter exists with the given id" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "No SourcingBid exists with the given id" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "A candidate lot shares an allergen code with the customer's dietary_allergy_codes" }
  - { id: ERR_CLAIM_NOT_CREDIBLE, http: 422, condition: "requested_credit_cents is zero, which cannot describe a credible spoilage claim" }
  - { id: ERR_ORDER_CUTOFF_MISSED, http: 422, condition: "The order was created at or after its ready_deadline" }
  - { id: ERR_CENTER_FORWARD_LOCKED, http: 409, condition: "The owning center's forward_posture is not OPEN for an order creation, finalisation or build start" }
  - { id: ERR_SUBSTANTIATION_REQUIRED, http: 422, condition: "A quote exists but no source is of the lot's own grade, or more than three sources exist" }
  - { id: ERR_LOT_QUALITY_HOLD, http: 409, condition: "The cited supply lot's quality_status is not PASS" }
  - { id: ERR_SUBSCRIPTION_INELIGIBLE, http: 409, condition: "The subscription is PAUSED or CANCELLED, or a box already exists for the same subscription and serving_cycle_index" }
  - { id: ERR_ALREADY_ALLOCATED, http: 409, condition: "The order has already been packed for this serving cycle" }
  - { id: ERR_CLAIM_EVIDENCE_REQUIRED, http: 422, condition: "photo_url is missing or its extension is not one of .jpg .jpeg .png .webp .heic" }
  - { id: ERR_NO_CENTER_AVAILABLE, http: 422, condition: "The customer's service region has no active fulfillment center" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A subscribing household that owns its box orders and subscriptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /box-orders/{id}/finalize — finalise own order"
      - "POST /box-orders/{id}/quality-claims — file a claim on own order"
      - "POST /subscriptions/{id}/skip — skip own subscription"
      - "POST /subscriptions/{id}/pause — pause own subscription"
      - "POST /subscriptions/{id}/resume — resume own subscription"
      - "POST /subscriptions/{id}/cancel — cancel own subscription"
    shared_operations:
      - "GET /customers/{id} — read own record"
      - "GET /subscriptions/{id}, GET /subscriptions, GET /customers/{id}/subscriptions — read own subscriptions"
      - "POST /box-orders — open an order for own subscription"
      - "GET /box-orders, GET /box-orders/{id}, GET /box-orders/{id}/items — read own orders"
      - "GET /box-orders/{id}/cold-chain-packs, GET /box-orders/{id}/quality-claims — read own fulfilment detail"

  - name: Supplier
    description: "A farm, packer or broker that offers irregular surplus lots"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /sourcing-bids — bid on a lot"
      - "POST /sourcing-bids/{id}/withdraw — withdraw own bid"
    shared_operations:
      - "POST /suppliers/{supplier_id}/lots — list a new lot (own supplier scope)"
      - "GET /suppliers/{id} — read own supplier record"
      - "GET /suppliers/{supplier_id}/lots, GET /supply-lots/{id}/sourcing-bids — read own lots and bids"
      - "GET /supply-lots/{id} — read a lot"

  - name: FulfillmentOperator
    description: "A warehouse operator at a fulfillment center who builds and packs boxes"
    identity: "entity_backed:FulfillmentCenter"
    exclusive_operations:
      - "POST /box-orders/{id}/build — build a box"
      - "POST /box-orders/{id}/pack — pack a box"
    shared_operations:
      - "GET /fulfillment-centers/{id}/lots, GET /fulfillment-centers/{id}/cold-chain-packs — read own center's lane"
      - "GET /box-orders, GET /box-orders/{id}, GET /box-orders/{id}/items, GET /box-orders/{id}/cold-chain-packs — read own center's orders"
      - "GET /supply-lots, GET /supply-lots/{id}/build-items — read lots"

  - name: PlatformAdmin
    description: "Internal operations: sourcing, substantiation, center configuration and claim adjudication"
    identity: "opaque"
    exclusive_operations:
      - "POST /suppliers, GET /suppliers — manage suppliers"
      - "POST /fulfillment-centers, PUT /fulfillment-centers/{id}, GET /fulfillment-centers — configure centers"
      - "POST /supply-lots/{id}/award — run the sourcing allocation"
      - "POST /supply-lots/{id}/make-ready — inspect lot quality"
      - "POST /conventional-quotes, POST /conventional-quotes/{id}/substantiate — manage substantiation evidence"
      - "POST /quality-claims/{id}/review, POST /quality-claims/{id}/reopen, GET /quality-claims — adjudicate claims"
      - "POST /box-orders/{id}/crash-out — declare a cold-chain failure"
      - "POST /fulfillment-centers/{id}/advance-cycle — close a center build cycle"
      - "POST /subscriptions — open a subscription"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "POST /customers/register — register a subscriber"
      - "POST /sourcing-bids — record a bid on a supplier's behalf"
      - "POST /box-orders and its read endpoints — operate any order"