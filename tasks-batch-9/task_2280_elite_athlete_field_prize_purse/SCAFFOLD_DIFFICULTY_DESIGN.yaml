          A DIFFERENT metric (age in whole years) on a DIFFERENT endpoint (POST
          /race-editions/{id}/certify-results rather than POST /invitations/{id}/offer): an athlete born
          exactly on race_date minus masters_min_age years turns 40 ON race day and therefore IS a
          masters athlete, while an athlete born one day later is 39. Falsifiable in one sentence: an
          implementation using a strict > on age, or floor-dividing day counts by 365.25, reports
          is_masters == false for the 1986-11-01 athlete.
