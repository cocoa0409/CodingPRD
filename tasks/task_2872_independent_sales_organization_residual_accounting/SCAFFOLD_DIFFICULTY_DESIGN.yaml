  - rule_id: non_linear_state_machine
    instances:

      - name: batch_recall_cycle_then_renormalize_with_appended_line
        grounds:
          - state_machines.ResidualBatch.NORMALIZED_to_RECEIVED
          - state_machines.ResidualBatch.RECEIVED_to_NORMALIZED
          - entities.ResidualBatch.fields.recall_count
          - calculations.batch_totals
        distinguishing_aspect: |
          The cyclic NORMALIZED -> RECEIVED -> NORMALIZED loop is traversed with a
          mutation inside the loop: the recall must zero normalized_net_revenue_cents
          and normalization_mode_applied on the existing line and reset the batch total
          to 0 while KEEPING line_count and gross_volume_cents, then accept a brand-new
          line and re-derive the totals over both lines (41009). recall_count reaches 1
          and stays 1 — re-normalizing is not a second recall.
        test_recipe:
          setup:
            - "Program P1 (NET_REVENUE_SPLIT, 45 bps / 6 cents) with two ACTIVE merchants M1 and M2."
            - "A RECEIVED batch for 2026-07 holding only M1's line."
