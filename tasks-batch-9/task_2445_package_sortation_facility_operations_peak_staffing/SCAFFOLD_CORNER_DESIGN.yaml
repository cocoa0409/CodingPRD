            - call: "POST /sortation/sort-centers/${budget_center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 40000, planned_core_headcount: 6, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { budget_plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${budget_plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${budget_center_id}"
              payload: {}
