            - call: "GET /sba/applications/${app_id}"
              payload: {}
              as: SbaOfficer
              captures: { disb: $.data.disbursed_amount_cents, out: $.data.outstanding_principal_cents }
          assert:
            - "Application.${app_id}.disbursed_amount_cents == 0 (returned to pre-post value)"
            - "Application.${app_id}.outstanding_principal_cents == 0 (compensated; no drift)"

      - name: guaranty_sale_repurchase_conserves_lender_pool
        grounds:
          - state_machines.Application.RETAINED_to_SOLD
          - state_machines.Application.SOLD_to_REPURCHASED
          - entities.Lender.fields.sold_guaranty_balance_cents
          - entities.Application.fields.sold_guaranteed_principal_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Lender.sold_guaranty_balance_cents (a pool balance,
          not a per-loan disbursed amount): settling a 37500000 sale raises the pool to 37500000,
          and repurchasing returns it to 0, pinned as pool_after_repurchase == pool_before_settle == 0.
        test_recipe:
          setup:
            - "AUTHORIZED 7A loan gp 0.75, guaranteed_amount_cents 37500000, RETAINED, lender pool 0."
            - "A GuarantySale of 37500000 at 350bps is SETTLED (pool -> 37500000), then REPURCHASED."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Inv2 CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Inv2 LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.35, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm_id: $.data.id }
            - call: "POST /sba/credit-memos/${cm_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/applications/${app_id}/authorize"
              payload: {}
              as: SbaOfficer
              captures: { app_v: $.data.version }
            - call: "POST /sba/guaranty-sales"
              payload: { application_id: "${app_id}", investor_user_id: "inv-9", sold_principal_cents: 37500000, premium_bps: 350 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sba/guaranty-sales/${sale_id}/settle"
              payload: { expected_application_version: "${app_v}" }
              as: InvestorServicer
          trigger:
            - call: "POST /sba/guaranty-sales/${sale_id}/repurchase"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "GET /sba/lenders/${lender_id}"
              payload: {}
              as: SbaOfficer
              captures: { pool: $.data.sold_guaranty_balance_cents }
          assert:
            - "Lender.${lender_id}.sold_guaranty_balance_cents == 0 (returned to pre-settle value)"
            - "Application.${app_id}.sold_guaranteed_principal_cents == 0; GuarantySale.${sale_id}.status == REPURCHASED"
