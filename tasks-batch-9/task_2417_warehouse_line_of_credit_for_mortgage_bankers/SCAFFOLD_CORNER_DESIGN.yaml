          - validations[priority=15]
          - errors.ERR_COMMITMENT_NOT_ACTIVE
          - endpoints["POST /commitments/{id}/withdraw"]
        distinguishing_aspect: |
          Conditional cascade: the withdraw side effect is scoped to advances with
          funding_status in {FUNDED, SHIPPED}, so a commitment whose only advance is still
          REQUESTED is withdrawn with ZERO margin calls and the facility stays ACTIVE —
          yet that same REQUESTED advance immediately becomes unfundable with
          ERR_COMMITMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; commitment A OPEN with 5,000,000,000 capacity; one DRY CONFORMING advance of 2,000,000,000 pointing at it, still REQUESTED, with a CLEAR receipt and a VERIFIED wire."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
          trigger:
            - call: "POST /commitments/${comm_a_id}/withdraw"
              payload: { reason: "Investor exited the CONFORMING program" }
              as: Investor
              as_user_id: "${inv_a_id}"
              captures: { comm_status_after: "$.data.status" }
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "comm_status_after == WITHDRAWN with allocated_amount_cents == 0 and remaining_amount_cents == 5000000000"
            - "the margin-call list returns total_count == 0 — no advance was in {FUNDED, SHIPPED}, so the cascade had nothing to re-value"
            - "WarehouseFacility.${fac_id}.status is still ACTIVE and open_margin_call_count == 0"
            - "Advance.${a1_id}.required_paydown_cents == 0 and effective_advance_rate is unchanged — a REQUESTED advance is never valued"
            - "the fund attempt returns HTTP 409 with data.error_id == ERR_COMMITMENT_NOT_ACTIVE"
            - "Advance.${a1_id}.funding_status is still REQUESTED and the ledger is still empty"
            - "TakeoutInvestor.${inv_a_id}.status is still APPROVED — withdrawing a commitment does not suspend its investor"

      - name: corner_sm_demand_escalation_and_repurchase_round_trip
        claim_type: side_effect_execution
        grounds:
          - state_machines.RepurchaseDemand.status.OPEN_to_ESCALATED
          - state_machines.RepurchaseDemand.status.ESCALATED_to_SATISFIED
          - state_machines.Advance.funding_status.FUNDED_to_REPURCHASED
          - validations[priority=17]
          - errors.ERR_REPURCHASE_DEMAND_NOT_OPEN
        distinguishing_aspect: |
          The escalation gate is temporal, not just state-based: the identical escalate call
          is a 409 ERR_REPURCHASE_DEMAND_NOT_OPEN at 2026-08-10 and a 200 at 2026-08-11
          because deadline_at is clock + AGING_RUN_DEMAND_DAYS, and the subsequent
          repurchase reverses escalated_demand_count so the facility returns to ACTIVE.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; DRY CONFORMING advance funded to 1,960,000,000 at 2026-08-01; one manual RepurchaseDemand raised the same instant, so deadline_at is 2026-08-11T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /advances/${a1_id}/repurchase-demands"
              payload: { reason: "INELIGIBLE_PRODUCT" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { rd2_id: "$.data.id", rd2_amount: "$.data.demand_amount_cents", rd2_deadline: "$.data.deadline_at" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /repurchase-demands/${rd2_id}/escalate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /repurchase-demands/${rd2_id}/escalate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1960000000 }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /repurchase-demands/${rd2_id}/escalate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "rd2_amount == 1960000000 and rd2_deadline == 2026-08-11T00:00:00Z and status == OPEN"
            - "the escalate at 2026-08-10 returns HTTP 409 with data.error_id == ERR_REPURCHASE_DEMAND_NOT_OPEN and leaves status OPEN"
            - "the escalate at 2026-08-11 returns HTTP 200 with status == ESCALATED — the deadline comparison is >=, not >"
            - "after the successful escalate: WarehouseFacility.${fac_id}.status == RESTRICTED and escalated_demand_count == 1"
            - "the repurchase returns HTTP 200 with Advance.${a1_id}.funding_status == REPURCHASED and outstanding_balance_cents == 0"
            - "RepurchaseDemand.${rd2_id}.status == SATISFIED after the repurchase"
            - "WarehouseFacility.${fac_id}.escalated_demand_count == 0 and status == ACTIVE — the compensating decrement re-opens the line"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0 and availability_cents == 20000000000"
            - "the ledger holds 2 entries — ADVANCE_FUNDED DEBIT 1960000000 and REPURCHASE CREDIT 1960000000"
            - "the third escalate returns HTTP 409 with data.error_id == ERR_REPURCHASE_DEMAND_NOT_OPEN — SATISFIED is terminal"

      - name: corner_sm_facility_cycle_reentry_already_covered
        claim_type: valid_transition
        grounds:
          - state_machines.WarehouseFacility.status.ACTIVE_to_RESTRICTED
          - state_machines.WarehouseFacility.status.RESTRICTED_to_ACTIVE
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_facility_status_cycle_reentry
          rationale: |
            The cyclic-shape claim — the same facility row traversing
            ACTIVE -> RESTRICTED -> ACTIVE -> RESTRICTED and arriving at a state it has
            already occupied, with the re-entry gated on the aggregate open-call count
            rather than on any single call — is the whole subject of that §1.8 instance.
            Re-testing it here would only duplicate its transition ledger.

      - name: corner_sm_wire_branch_divergence_already_covered
        claim_type: valid_transition
        grounds:
          - state_machines.WireInstruction.status.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.WireInstruction.status.PENDING_VERIFICATION_to_BLOCKED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_wire_verification_branch_divergence
          rationale: |
            The branching-shape claim — one trigger, two outcomes whose side-effect sets
            are not mirror images (VERIFY leaves the advance fundable while BLOCK
            terminates it into REJECTED) — is exactly that §1.8 instance's fork test, which
            already asserts both arms from identical pre-state.

      - name: corner_sm_advance_parallel_axes_already_covered
        claim_type: valid_transition
        grounds:
          - state_machines.Advance.funding_status
          - state_machines.Advance.custody_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_advance_parallel_funding_and_custody_axes
          rationale: |
            The parallel-shape claim — two dimensions on one row advancing independently,
            with the legal combined states enumerated and the illegal ones rejected — is
            that §1.8 instance's entire premise. This file's initial_state instance already
            asserts the one narrow fact the depth instance does not: that both axes are
            seeded simultaneously at creation.

  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_calc_cure_waterfall_fees_first_then_prorata_remainder
        claim_type: correct_result
        grounds:
          - calculations.cure_payment_waterfall
          - endpoints["POST /margin-calls/{id}/cure-payments"]
          - endpoints["POST /margin-calls"]
        distinguishing_aspect: |
          Both pinned orderings in one payment: the fee bucket must fill completely before
          a single cent reaches principal, and the principal split must be per-advance
          floor-first with the one leftover cent going to the EARLIER created_at. The
          discriminating literals are 67 / 33 — sum-then-round or leftover-to-largest both
          produce 66 / 34 or 67 / 34.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility. Advance A1 (DRY CONFORMING, loan 2,000,000,000, note_rate 0.0650) created and funded at 2026-08-01T00:00:00Z to 1,960,000,000."
            - "Advance A2 (DRY CONFORMING, loan 1,000,000,000, note_rate 0.0625) created and funded at 2026-08-01T06:00:00Z to 980,000,000 — strictly later created_at, which fixes the leftover-cent recipient."
            - "One aging-run at 2026-08-11T00:00:00Z accrues 8,262,500 cents of fees."
            - "One manual facility-level MarginCall (advance_id null) sized at 294,000,000."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: CreditOfficer
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v_a2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0625
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_a2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /advances/${a2_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${a2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w2_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${w2_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-902" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /advances/${a2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { wf_fee: "$.data.fee_accrual_cents" }
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mcf_id: "$.data.id", mcf_amount: "$.data.call_amount_cents", mcf_ver: "$.data.version" }
          trigger:
            - call: "POST /margin-calls/${mcf_id}/cure-payments"
              payload: { amount_cents: 8262600, expected_margin_call_version: "${mcf_ver}" }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { cpw_id: "$.data.id", cpw_fees: "$.data.applied_to_fees_cents", cpw_prin: "$.data.applied_to_principal_cents" }
          assert:
            - "wf_fee == 8262500 = 4763889 (A1) + 2313889 (A2) + 1184722 (unused line) — per-advance round_half_up then sum"
            - "mcf_amount == 294000000 = floor(2940000000 * 0.10) and MarginCall.${mcf_id}.advance_id is null"
            - "cpw_fees == 8262500 — bucket 1 absorbs the whole fee balance before principal is touched"
            - "cpw_prin == 100 = 8262600 - 8262500"
            - "CurePayment.${cpw_id}.principal_allocation has exactly 2 elements ordered created_at ASC: {${a1_id}: 67} then {${a2_id}: 33}"
            - "the split is NOT 66/34 — floor(100 * 1960000000 / 2940000000) == 66 and floor(100 * 980000000 / 2940000000) == 33, and the single leftover cent goes to the earlier-created A1"
            - "Advance.${a1_id}.outstanding_balance_cents == 1959999933 and Advance.${a2_id}.outstanding_balance_cents == 979999967"
            - "MarginCall.${mcf_id}.cured_amount_cents == 100 and status == PARTIALLY_CURED"
            - "WarehouseFacility.${fac_id}.accrued_fee_balance_cents == 0 after the payment"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 2939999900"
            - "the facility ledger gained exactly 3 entries: FEE_PAYMENT CREDIT 8262500 (advance_id null), CURE_PRINCIPAL CREDIT 67 (${a1_id}), CURE_PRINCIPAL CREDIT 33 (${a2_id})"
            - "WarehouseFacility.${fac_id}.status is still RESTRICTED — a partial cure does not lift the restriction"

      - name: corner_calc_waterfall_covered_set_excludes_noncarrying_advances
        claim_type: input_set_filtering
        grounds:
