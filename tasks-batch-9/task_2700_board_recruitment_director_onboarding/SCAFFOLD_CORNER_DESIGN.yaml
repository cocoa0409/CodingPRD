      - name: a_contested_slate_with_one_nominee_fails_the_universal_proxy_minimum
        claim_type: violation_to_error
        grounds:
          - validations.priority_65.ERR_UNIVERSAL_PROXY_MINIMUM
          - calculations.slate_independence_pct
          - entities.NominationSlate.fields.contested
        distinguishing_aspect: |
          A single UNIVERSAL_PROXY_NOMINATION nominee makes the slate contested, which raises the floor to
          authorized_seats minus one - 8 nominees against the default authorized_seats 9 - so submit-for-review
          returns 422 ERR_UNIVERSAL_PROXY_MINIMUM. The independence floor is simultaneously satisfied at
          100.00 percent, so the failure is attributable to the universal-proxy rule alone.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with min_completed_interviews 1 and the default authorized_seats 9."
            - "One SEATED chair director and one SEATED interviewer director."
            - "One UNIVERSAL_PROXY_NOMINATION candidate driven to SLATE_ELIGIBLE with a clean screen, one COMPLETED interview scored 5, a clean reference check and conflict clearance (readiness 85.00)."
            - "A DRAFT slate for cycle 2026 with seat_count 9 carrying that candidate as its only nominee."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", min_completed_interviews: 1 }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dana Chair", email: "dana.chair@issuer.example", birth_date: "1962-03-15", appointed_on: "2019-05-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ivan Interviewer", email: "ivan@issuer.example", birth_date: "1966-07-07", appointed_on: "2020-05-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { intv_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Uma Universal", email: "uma@cand.example", birth_date: "1974-01-01", source_channel: "UNIVERSAL_PROXY_NOMINATION", shareholder_proponent_name: "Activist Partners LP" }
              as: GovernanceStaff
