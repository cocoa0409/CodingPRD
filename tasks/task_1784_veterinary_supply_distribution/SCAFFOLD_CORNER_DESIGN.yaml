      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 58 Ship Dr
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 2
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s_id: $.data.id
      trigger:
      - call: POST /vet/shipments/${s_id}/dispatch
        as: SupplyChainPlanner
        captures:
          s_st: $.data.status
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          l_on: $.data.qty_on_hand
          l_al: $.data.qty_allocated
          l_av: $.data.qty_available
      - call: GET /vet/orders/${o_id}
        as: AccountManager
        captures:
          o_st: $.data.status
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          l_st: $.data[0].status
      assert:
      - Shipment IN_TRANSIT; Order SHIPPED; OrderLine SHIPPED
      - "Lot: qty_on_hand == 8, qty_allocated == 0, qty_available == 8 (10 == 0 + 8 \u2014 conservation at dispatch)"
  - name: response_envelope_shape_on_success_and_error
    claim_type: envelope_shape
    grounds:
    - response_envelope
    distinguishing_aspect: Every response carries meta.api_request_id + api_request_timestamp; success wraps data with response_type object|array; errors carry data.error_id + message.
    test_recipe:
      setup:
