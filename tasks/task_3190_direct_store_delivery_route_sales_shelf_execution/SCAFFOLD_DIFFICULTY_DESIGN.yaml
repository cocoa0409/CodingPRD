  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promo_window_half_open_overlap_and_adjacency
        grounds:
          - calculations.promo_window_lifecycle
          - errors.ERR_PROMO_WINDOW_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on PromoAgreement (resource:
          store+product pair): [09-01, 09-10) followed by [09-10, 09-20) is
          ADJACENT and allowed (end == start touches but does not overlap);
          [09-05, 09-12) genuinely overlaps and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store ACTIVE. Product P promo-eligible. Agreement A1 [2026-09-01, 2026-09-10) already created."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/promo-agreements"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", window_start: "2026-09-01", window_end: "2026-09-10", display_type: "ENDCAP", rebate_cents: 5000 }
              as: RouteSupervisor
              captures: { agr1_id: $.data.id }
          trigger:
            - call: "POST /dsd/promo-agreements"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", window_start: "2026-09-10", window_end: "2026-09-20", display_type: "AISLE", rebate_cents: 3000 }
              as: RouteSupervisor
              captures: { agr2_id: $.data.id }
            - call: "POST /dsd/promo-agreements"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", window_start: "2026-09-05", window_end: "2026-09-12", display_type: "DUMP_BIN", rebate_cents: 1000 }
              as: RouteSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent agreement is created (201) with status SCHEDULED (adjacency is not overlap under half-open semantics)"
            - "the third request returns 409 and err == ERR_PROMO_WINDOW_OVERLAP"
            - "GET /dsd/promo-agreements?store_id=${store_id} returns exactly 2 rows"

      - name: store_assignment_weekday_set_intersection_conflict
        grounds:
          - errors.ERR_ASSIGNMENT_DAY_CONFLICT
          - entities.RouteStoreAssignment.fields.service_weekdays
        distinguishing_aspect: |
          Different interval semantics on a different resource (Store weekly
          coverage): conflict is defined by NON-EMPTY INTERSECTION of weekday
          sets, not by continuous date ranges — [TUE,WED] vs [WED,FRI] conflict
          on the single shared day WED while [TUE] vs [WED] are disjoint and
          allowed even though the dates are adjacent in the week.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Two reps, two routes R1 and R2, one store."
            - "R1 assignment for the store with service_weekdays [TUE, WED]."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep1_id: $.data.id }
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep Two", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep2_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep1_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route1_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-2", rsr_id: "${rep2_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route2_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route1_id}", store_id: "${store_id}", service_weekdays: ["TUE", "WED"], stop_sequence: 1 }
              as: RouteSupervisor
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route2_id}", store_id: "${store_id}", service_weekdays: ["WED", "FRI"], stop_sequence: 1 }
              as: RouteSupervisor
              captures: { err: $.data.error_id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route2_id}", store_id: "${store_id}", service_weekdays: ["FRI"], stop_sequence: 1 }
              as: RouteSupervisor
              captures: { asg2_id: $.data.id }
          assert:
            - "the [WED, FRI] request returns 409 and err == ERR_ASSIGNMENT_DAY_CONFLICT (intersection {WED} is non-empty)"
            - "the [FRI] request succeeds (201) because its weekday set is disjoint from [TUE, WED]"
            - "GET /dsd/route-assignments?store_id=${store_id} returns exactly 2 ACTIVE rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: truck_case_conservation_through_settle_and_cancel
        grounds:
          - calculations.fefo_lot_consumption
          - state_machines.RouteDay.LOADED_to_CANCELLED
          - state_machines.RouteSettlement.BALANCED_to_POSTED
          - entities.TruckInventoryLot.fields.remaining_cases
        distinguishing_aspect: |
          Conserved quantity = physical CASES per lot: at every observable
          instant loaded_cases == delivered_cases + stale_pulled_cases +
          returned_cases + remaining_cases. The settle path returns unsold
          cases (45); the cancel path compensates a full load by returning all
          60 cases — two different forward/compensating pairs, zero drift.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL cap 100000 assigned TUE and WED. Product P at 500 cents."
            - "Day D1 (2026-09-01): lot 100 cases exp 2026-09-20 plus lot 10 cases exp 2026-09-06; started; 50 cases delivered; 5-case stale credit approved."
            - "Day D2 (2026-09-02): loaded with 60 cases exp 2026-09-20, never started."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
