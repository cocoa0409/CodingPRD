      - name: exam_symmetric_thirty_day_buffer_on_debtor
        grounds:
          - validations[priority=24]
          - errors[ERR_EXAM_COOLING_PERIOD]
          - entities.DebtorExamination.fields.scheduled_at
          - endpoints[POST /debtor-examinations]
        distinguishing_aspect: |
          Interval semantics 2 of 2, and on a different resource entity (Debtor rather than AssetFinding):
          a SYMMETRIC +/-30-day buffer around instants with an INCLUSIVE bound. Against an examination whose status is SCHEDULED at
          2026-09-01T15:00:00Z, both 2026-09-30T15:00:00Z (29 days after) and 2026-08-03T15:00:00Z (29 days
          before) are rejected, while exactly 2026-10-01T15:00:00Z (30.0 days) is accepted.
