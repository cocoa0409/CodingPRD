              payload: { case_id: "${case_b}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_b}"
            - call: "POST /schedules"
              payload: { case_id: "${case_b}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_b}"
            - call: "POST /cases/${case_b}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_b}"
          trigger:
            - call: "POST /meetings"
              payload: { case_id: "${case_b}", trustee_id: "${tr_id}", room_code: "ROOM-B", scheduled_start: "2026-08-01T09:30:00Z", scheduled_end: "2026-08-01T10:30:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /meetings .status == 409"
            - "POST /meetings .data.error_id == ERR_TRUSTEE_DOUBLE_BOOKED"

      - name: room_buffer_conflict_padded_interval
        grounds:
          - calculations.meeting_slot_conflict_detection
          - validations[priority=10]
          - entities.Meeting341.fields.room_code
        distinguishing_aspect: |
          PADDED-interval semantics on the ROOM resource (different from the trustee's half-open rule):
          a meeting only 15 minutes after the prior one ends in the same room violates the 30-minute
          ROOM_BUFFER_MINUTES gap and is rejected ERR_ROOM_BUFFER_CONFLICT, even though the raw intervals
          do not overlap and the two meetings use different trustees.
        test_recipe:
          setup:
            - "Trustee T1 chairs a SCHEDULED meeting in ROOM-X [09:00,10:00) for case A; a different trustee T2 tries to schedule ROOM-X at [10:15,11:15) for filed case B — only 15 minutes after, inside the 30-minute buffer."
          setup_api_calls:
            - call: "POST /trustees"
              payload: { name: "T1-room" }
              as: Trustee
              captures: { tr1_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T2-room" }
              as: Trustee
              captures: { tr2_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "RB A", email: "rb_a@x.com" }
              as: Debtor
              captures: { dbtr_a: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_a}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_a}"
              captures: { case_a: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_a}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_a}"
            - call: "POST /schedules"
              payload: { case_id: "${case_a}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_a}"
            - call: "POST /schedules"
              payload: { case_id: "${case_a}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_a}"
            - call: "POST /cases/${case_a}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_a}"
            - call: "POST /meetings"
              payload: { case_id: "${case_a}", trustee_id: "${tr1_id}", room_code: "ROOM-X", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr1_id}"
              captures: { mtg_a: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "RB B", email: "rb_b@x.com" }
              as: Debtor
              captures: { dbtr_b: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_b}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_b}"
              captures: { case_b: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_b}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_b}"
            - call: "POST /schedules"
              payload: { case_id: "${case_b}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_b}"
            - call: "POST /schedules"
              payload: { case_id: "${case_b}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_b}"
            - call: "POST /cases/${case_b}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_b}"
          trigger:
            - call: "POST /meetings"
              payload: { case_id: "${case_b}", trustee_id: "${tr2_id}", room_code: "ROOM-X", scheduled_start: "2026-08-02T10:15:00Z", scheduled_end: "2026-08-02T11:15:00Z" }
              as: Trustee
              as_user_id: "${tr2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /meetings .status == 409"
            - "POST /meetings .data.error_id == ERR_ROOM_BUFFER_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: discharge_estate_value_conservation_exempt_plus_nonexempt
        grounds:
          - calculations.discharge_exemption_settlement
          - entities.Case.fields.total_exempt_value_cents
          - entities.Case.fields.nonexempt_estate_cents
        distinguishing_aspect: |
          Conserved quantity = GROSS ESTATE VALUE: when claimed exemptions do not exceed gross assets,
          total_exempt_value_cents + nonexempt_estate_cents == gross_asset_cents exactly after discharge.
          With gross 1000000 (A 700000 + B 300000) and exempt 400000: 400000 + 600000 == 1000000.
        test_recipe:
          setup:
            - "A Chapter 7 case at MEETING_HELD with Schedule A 700000, Schedule B 300000, Schedule C exemption 400000; discharge runs the settlement."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Inv9a Debtor", email: "inv9a@x.com", prior_discharge_within_8y: false }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-9a" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "FL", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "A", description: "house", asset_value_cents: 700000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "B", description: "car", asset_value_cents: 300000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "C", description: "homestead", claimed_exempt_value_cents: 400000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-9a", scheduled_start: "2026-07-06T09:00:00Z", scheduled_end: "2026-07-06T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /cases/${case_id}/discharge"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          assert:
            - "Case.${case_id}.total_exempt_value_cents == 400000"
            - "Case.${case_id}.nonexempt_estate_cents == 600000"
            - "Case.${case_id}.status == DISCHARGED"

      - name: plan_payment_fund_conservation_distribution_plus_surplus
        grounds:
          - calculations.chapter13_waterfall_distribution
          - entities.Plan.fields.paid_to_date_cents
          - entities.PlanPayment.fields.amount_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = TRUSTEE PAYMENT FUND: every cent recorded as a PlanPayment is
          conserved across the waterfall — sum(distribution[*]) + surplus_cents == paid_to_date_cents.
          With paid_to_date 600000 and total allowed debt 450000 (PRIORITY 200000 + SECURED 250000),
          distribution sums to 450000 and surplus is 150000; 450000 + 150000 == 600000.
        test_recipe:
          setup:
            - "A confirmed Chapter 13 plan with paid_to_date 600000; case debts PRIORITY 200000 and SECURED 250000 (total 450000 < fund), so 150000 surplus remains."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Inv9b Debtor", email: "inv9b@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-9b" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr 9b" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "PRIORITY", scheduled_amount_cents: 200000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { p_debt_id: $.data.id }
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "SECURED", scheduled_amount_cents: 250000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { s_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 200000, plan_duration_months: 36, expected_case_version: "${case_v}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/file-plan"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-9b", scheduled_start: "2026-07-07T09:00:00Z", scheduled_end: "2026-07-07T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plans/${plan_id}/confirm-plan"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /plan-payments"
              payload: { plan_id: "${plan_id}", amount_cents: 600000 }
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "GET /plans/${plan_id}/distribution"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { surplus: $.data.surplus_cents }
          assert:
            - "distribution.${p_debt_id} == 200000"
            - "distribution.${s_debt_id} == 250000"
            - "GET /plans/${plan_id}/distribution .data.surplus_cents == 150000"
            - "Plan.${plan_id}.paid_to_date_cents == 600000"
