            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Lapse Payee", category: "HOUSING", amount_cents: 10000, scheduled_release_date: "2026-07-02" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: FiduciaryAdmin }
          trigger:
            - { call: "GET /surety-bonds/${b_id}", payload: {}, as: FiduciaryAdmin, captures: { b_st: $.data.status } }
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { err: $.data.error_id } }
          assert:
            - "b_st == LAPSED (clock date 2026-07-01 >= coverage_end_date 2026-07-01)"
            - "err == ERR_NO_ACTIVE_BOND"

      - name: derived_fields_reconcile_on_release_and_return
        claim_type: derived_field_reconciliation
        grounds: [entities.Client.fields.total_funds_cents, entities.Client.fields.countable_resources_cents, entities.SuretyBond.fields.funds_under_management_cents]

        distinguishing_aspect: "Every derived money field recomputes on each cash mutation: release drops client totals and bond FUM by 20000; the compensating return restores all three to 50000 exactly."
        test_recipe:
          setup: ["ACTIVE client, funded account (50000), ACTIVE bond, APPROVED budget; disbursement 20000 APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Derived Dee", date_of_birth: "1980-09-09", ssn_last4: "3839", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-DR-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 50000, received_date: "2026-06-05" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Derived Payee", category: "HOUSING", amount_cents: 20000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { tot_mid: $.data.total_funds_cents, cnt_mid: $.data.countable_resources_cents } }
            - { call: "GET /surety-bonds/${b_id}", payload: {}, as: FiduciaryAdmin, captures: { fum_mid: $.data.funds_under_management_cents } }
            - { call: "POST /disbursements/${w_id}/return", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { tot_end: $.data.total_funds_cents, cnt_end: $.data.countable_resources_cents } }
            - { call: "GET /surety-bonds/${b_id}", payload: {}, as: FiduciaryAdmin, captures: { fum_end: $.data.funds_under_management_cents } }
          assert:
            - "tot_mid == 30000 and cnt_mid == 30000 and fum_mid == 30000 (release recomputed all three)"
            - "tot_end == 50000 and cnt_end == 50000 and fum_end == 50000 (return recomputed all three back)"

      - name: cascading_side_effects_stub
        claim_type: cascade_chain
        grounds: [complexity_profile.complexity_layers]

        excluded_because:
          difficulty_instance: transitive_cascade / deposit_post_triggers_resource_cascade
          rationale: "N-level cascades verified end-to-end by both Rule-4 instances (deposit-post and audit-misuse triggers)."

      - name: dual_variant_layer_stub
        claim_type: variant_divergence
        grounds: [complexity_profile.complexity_layers]

        excluded_because:
          difficulty_instance: dual_variant_calc / spend_down_provisional_vs_final_divergence
          rationale: "Both variants executed and the delta asserted in the two Rule-1 instances."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_in_mutation_response
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, entities.Disbursement.fields.fee_cents]

        distinguishing_aspect: "Immediate consistency: the release RESPONSE itself carries status RELEASED, released_at, and the computed fee_cents (1000 for 20000 at v=0) — no re-read needed, and a subsequent GET agrees."
        test_recipe:
          setup: ["ACTIVE client, funded account (50000), ACTIVE bond, APPROVED budget; disbursement 20000 APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Imm Iris", date_of_birth: "1987-10-10", ssn_last4: "4041", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-IM-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 50000, received_date: "2026-06-05" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer, captures: { dep_st: $.data.status } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Imm Payee", category: "HOUSING", amount_cents: 20000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { w_st: $.data.status, w_fee: $.data.fee_cents, w_rel: $.data.released_at } }
            - { call: "GET /disbursements/${w_id}", payload: {}, as: FinancialOfficer, captures: { g_st: $.data.status, g_fee: $.data.fee_cents } }
          assert:
            - "dep_st == POSTED (post response already carried the new state)"
            - "w_st == RELEASED and w_fee == 1000 and w_rel is non-null (all visible in the release response)"
