  # ---------------------------------------------------------------
  - section: validations
    instances:
      - name: technician_create_missing_auth_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A write without X-User-ID / X-User-Role headers is rejected 401 before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/technicians", payload: { full_name: "No Header", capability: "TECHNICIAN", base_hourly_rate_cents: 5000, on_call_differential_bp: 1000 }, as: Anonymous }
          assert: ["401 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers omitted entirely)"]

      - name: missing_auth_on_unknown_ticket_returns_401
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "Auth (priority 1) beats existence (priority 3): an unauthenticated GET against a nonexistent ticket returns 401, never 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/call-tickets/00000000-0000-4000-8000-0000000000ff", as: Anonymous }
          assert: ["401 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not ERR_CALL_TICKET_NOT_FOUND)"]

      - name: unit_number_duplicate_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_UNIT_NUMBER_EXISTS]"]
        distinguishing_aspect: "unit_number uniqueness is property-wide; the second create with the same number is rejected."
        test_recipe:
          setup: ["unit DUP-1 exists"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "DUP-1", building_code: "BD" }, as: PropertyAdmin }
          trigger:
            - { call: "POST /v1/units", payload: { unit_number: "DUP-1", building_code: "BE" }, as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNIT_NUMBER_EXISTS (409)"]

      - name: va_work_order_ticket_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REFERENTIAL_MISMATCH]"]
        distinguishing_aspect: "A vendor authorization must reference a work order that belongs to the SAME call ticket; cross-ticket grafting is a 422."
        test_recipe:
          setup: ["two units with one RECEIVED ticket each; work order WO_B created on ticket B; vendor and requester technician exist"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "M-1", building_code: "BM" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "M-2", building_code: "BM" }, as: PropertyAdmin, captures: { u2: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "Vend", trade: "GENERAL", per_incident_limit_cents: 100000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "A", caller_phone: "555", category: "LEAK_MINOR", description: "ticket A" }, as: Dispatcher, captures: { tka: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u2}", caller_name: "B", caller_phone: "555", category: "LEAK_MINOR", description: "ticket B" }, as: Dispatcher, captures: { tkb: $.data.id } }
            - { call: "POST /v1/work-orders", payload: { call_ticket_id: "${tkb}", title: "B work", description: "belongs to ticket B" }, as: Dispatcher, captures: { wob: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets/${tka}/vendor-authorizations", payload: { work_order_id: "${wob}", vendor_id: "${v1}", amount_cents: 1000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_REFERENTIAL_MISMATCH (422); no authorization row created"]

      - name: relocation_requires_uninhabitable_declaration
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_UNIT_NOT_UNINHABITABLE]"]
        distinguishing_aspect: "A relocation case can only originate from a ticket mitigated with unit_uninhabitable=true."
        test_recipe:
          setup: ["ticket mitigated with unit_uninhabitable=false"]
