              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c34_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c34_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c34_award_id: $.data.id }
            - call: "POST /single-audits"
              payload: { award_id: "${c34_award_id}", fiscal_year: 2026, federal_expenditures_cents: 80000000 }
              as: Auditor
              captures: { c34_sa_id: $.data.id }
            - call: "POST /single-audits/${c34_sa_id}/findings"
              payload: { severity: "DEFICIENCY", questioned_cost_cents: 10000 }
              as: Auditor
            - call: "POST /single-audits/${c34_sa_id}/findings"
              payload: { severity: "SIGNIFICANT_DEFICIENCY", questioned_cost_cents: 20000 }
              as: Auditor
          trigger:
            - call: "GET /single-audits/${c34_sa_id}/findings"
              payload: {}
              as: Auditor
          assert:
            - "GET /single-audits/${c34_sa_id}/findings returns exactly 2 AuditFinding rows"
            - "every returned AuditFinding has single_audit_id == ${c34_sa_id}"

  # ===========================================================================
  # SECTION 6 — Errors (each catalog code triggerable; non-§1.8 codes here,
  # §1.8-covered codes stubbed)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A protected write with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)
          before any business processing.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C35", applicant_org_name: "Corner Org 35", requested_amount_cents: 30000000, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: error_award_not_active_on_disburse_suspended_award
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
          - errors[ERR_AWARD_NOT_ACTIVE]
        distinguishing_aspect: |
          ERR_AWARD_NOT_ACTIVE (409) is triggerable via disburse (a different endpoint than the §1.8
          subaward-approve instance for the same error): disbursing a REQUESTED drawdown whose parent Award
          is SUSPENDED returns ERR_AWARD_NOT_ACTIVE; drawdown stays REQUESTED.
        test_recipe:
          setup:
            - "An award with a REQUESTED drawdown, then SUSPENDED."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C36", applicant_org_name: "Corner Org 36", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c36_app_id: $.data.id }
            - call: "POST /applications/${c36_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c36_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c36_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c36_award_id: $.data.id, c36_v0: $.data.version }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c36_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c36_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c36_award_id}", amount_cents: 3000000, allocation_plan: [ { restricted_fund_id: "${c36_rf_id}", amount_cents: 3000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c36"
              captures: { c36_dd_id: $.data.id }
            - call: "POST /awards/${c36_award_id}/suspend"
              payload: { expected_award_version: "${c36_v0}" }
              as: AgencyOfficer
          trigger:
            - call: "POST /drawdowns/${c36_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c36"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_AWARD_NOT_ACTIVE"
            - "Drawdown.${c36_dd_id}.status == REQUESTED"
            - "Award.${c36_award_id}.federal_drawn_cents == 0"

      - name: error_invalid_state_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_fiscal_ceiling_on_disburse
          rationale: "ERR_INVALID_STATE is the winning error of the §1.8 state-vs-fiscal disburse conflict."

      - name: error_stale_version_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[rate-supersede-stale-award]
        distinguishing_aspect: |
          ERR_STALE_VERSION (412) is triggerable: a suspend carrying an award version one behind the current
          (the create version minus 1 is impossible, so use a deliberately stale value captured before a
          mutation) is rejected. Here a rate-create bumps the award version, then a suspend still carrying
          the pre-create version is rejected with ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "An ACTIVE Award; a rate-create advances award.version; a suspend still carrying the pre-rate version."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C37", applicant_org_name: "Corner Org 37", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c37_app_id: $.data.id }
            - call: "POST /applications/${c37_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c37_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c37_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c37_award_id: $.data.id, c37_v0: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c37_award_id}", rate_type: "DE_MINIMIS", base_type: "MTDC", expected_award_version: "${c37_v0}" }
              as: FinanceOfficer
          trigger:
            - call: "POST /awards/${c37_award_id}/suspend"
              payload: { expected_award_version: "${c37_v0}" }
              as: AgencyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_VERSION"
            - "Award.${c37_award_id}.status == ACTIVE"

      - name: error_segregation_of_duties_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_segregation_before_referential_award_active_on_certify
          rationale: "ERR_SEGREGATION_OF_DUTIES is asserted as the certify outcome of the named §1.8 instance."

      - name: error_audit_unresolved_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_AUDIT_UNRESOLVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / award_close_requires_single_audit_resolved
          rationale: "ERR_AUDIT_UNRESOLVED is the failure path of the named §1.8 closeout instance."

      - name: error_ceiling_exceeded_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CEILING_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / award_federal_ceiling_lifetime_capacity_overlap
          rationale: "ERR_CEILING_EXCEEDED is asserted by the named §1.8 ceiling-overlap instance."

      - name: error_budget_would_exceed_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BUDGET_WOULD_EXCEED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / restricted_fund_budget_capacity_overlap_aggregate
          rationale: "ERR_BUDGET_WOULD_EXCEED is asserted by the named §1.8 per-fund-overlap instance."

  # ===========================================================================
  # SECTION 7 — RBAC (exclusive-op denial, shared-op access, segregation model)
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_grantwriter_cannot_disburse_drawdown_forbidden
        claim_type: peer_roles
        grounds:
          - roles.GrantWriter
          - roles.FinanceOfficer
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Segregation-of-duties role model (peer roles): GrantWriter calling POST /drawdowns/{id}/disburse
          (a FinanceOfficer exclusive op) returns ERR_FORBIDDEN (403); the drawdown stays REQUESTED.
        test_recipe:
          setup:
            - "An ACTIVE Award with a REQUESTED drawdown."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C38", applicant_org_name: "Corner Org 38", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c38_app_id: $.data.id }
            - call: "POST /applications/${c38_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c38_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c38_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c38_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c38_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c38_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c38_award_id}", amount_cents: 3000000, allocation_plan: [ { restricted_fund_id: "${c38_rf_id}", amount_cents: 3000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c38"
              captures: { c38_dd_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${c38_dd_id}/disburse"
              payload: {}
              as: GrantWriter
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response error_id == ERR_FORBIDDEN"
            - "Drawdown.${c38_dd_id}.status == REQUESTED"

      - name: rbac_auditor_cannot_award_application_forbidden
        claim_type: peer_roles
        grounds:
          - roles.Auditor
          - roles.AgencyOfficer
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          A different peer-role denial: Auditor calling POST /applications/{id}/award (an AgencyOfficer
          exclusive op) returns ERR_FORBIDDEN (403); the application stays UNDER_REVIEW with no Award created.
        test_recipe:
          setup:
            - "An application in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C39", applicant_org_name: "Corner Org 39", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c39_app_id: $.data.id }
            - call: "POST /applications/${c39_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c39_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
          trigger:
            - call: "POST /applications/${c39_app_id}/award"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response error_id == ERR_FORBIDDEN"
            - "NofoApplication.${c39_app_id}.status == UNDER_REVIEW"

      - name: rbac_shared_get_awards_allowed_for_auditor
        claim_type: peer_roles
        grounds:
          - roles.Auditor
          - endpoints.GET_/awards/{id}
        distinguishing_aspect: |
          Shared read access: Auditor (who cannot mutate awards) CAN call the shared GET /awards/{id} and
          receives the award (200), confirming shared_operations are open to the role.
        test_recipe:
          setup:
            - "An ACTIVE Award."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C40", applicant_org_name: "Corner Org 40", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c40_app_id: $.data.id }
            - call: "POST /applications/${c40_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c40_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c40_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c40_award_id: $.data.id }
          trigger:
            - call: "GET /awards/${c40_award_id}"
              payload: {}
              as: Auditor
              captures: { c40_status: $.data.status }
          assert:
            - "response status == 200"
            - "Award.${c40_award_id}.status == ACTIVE"

      - name: rbac_segregation_certifier_differs_from_initiator_succeeds
        claim_type: Segregation of duties
        grounds:
          - state_machines.FinancialReport.DRAFT_to_SUBMITTED
          - validations[priority=7]
          - entities.Drawdown.fields.initiated_by_user_id
          - entities.FinancialReport.fields.certified_by_user_id
        distinguishing_aspect: |
          The segregation rule's satisfaction (pass) path: when the certifying FinanceOfficer X-User-ID
          (officer_cert) DIFFERS from every Drawdown.initiated_by_user_id (officer_draw) on the award, certify
          succeeds — report goes SUBMITTED and certified_by_user_id == officer_cert. (The §1.8 instance covers
          the violation path; this covers the pass path with distinct user ids.)
        test_recipe:
          setup:
            - "An ACTIVE Award; a drawdown DISBURSED by officer_draw; a DRAFT report; certify by officer_cert (different user)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C41", applicant_org_name: "Corner Org 41", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c41_app_id: $.data.id }
            - call: "POST /applications/${c41_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c41_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c41_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c41_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c41_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c41_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c41_award_id}", amount_cents: 3000000, allocation_plan: [ { restricted_fund_id: "${c41_rf_id}", amount_cents: 3000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c41"
              captures: { c41_dd_id: $.data.id }
            - call: "POST /drawdowns/${c41_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c41"
            - call: "POST /financial-reports"
              payload: { award_id: "${c41_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 1000000 } ] }
              as: FinanceOfficer
              captures: { c41_fr_id: $.data.id }
          trigger:
            - call: "POST /financial-reports/${c41_fr_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_cert_c41"
          assert:
            - "FinancialReport.${c41_fr_id}.status == SUBMITTED"
            - "FinancialReport.${c41_fr_id}.certified_by_user_id == officer_cert_c41"

  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  # (optimistic_concurrency / cascading_side_effects / dual_variant_calculation /
  #  rate_threshold_triggers / derived_field_reconciliation)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_suspend_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.Award.ACTIVE_to_SUSPENDED
          - entities.Award.fields.version
          - validations[priority=5]
        distinguishing_aspect: |
          OCC happy path: a suspend carrying the current award version succeeds, status -> SUSPENDED, and
          version increments by exactly 1 (from the captured value to captured+1).
        test_recipe:
          setup:
            - "An ACTIVE Award freshly created (version captured from award response)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C42", applicant_org_name: "Corner Org 42", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c42_app_id: $.data.id }
            - call: "POST /applications/${c42_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c42_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c42_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c42_award_id: $.data.id, c42_v0: $.data.version }
          trigger:
            - call: "POST /awards/${c42_award_id}/suspend"
              payload: { expected_award_version: "${c42_v0}" }
              as: AgencyOfficer
              captures: { c42_v1: $.data.version }
          assert:
            - "Award.${c42_award_id}.status == SUSPENDED"
            - "Award.${c42_award_id}.version == ${c42_v0} + 1"

      - name: occ_stale_version_on_rate_create_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-supersede-stale-award]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          The §1.2.1 rate-supersede-stale-award rule: a second POST /indirect-cost-rates carrying the
          award version observed BEFORE the first rate-create (which already bumped the version) is rejected
          with ERR_STALE_VERSION (412). Maps the concurrency_rules entry to its declared write_endpoint and occ_field.
        test_recipe:
          setup:
            - "An ACTIVE Award; one rate already created (award.version advanced); a second rate-create still carrying the pre-create version."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C43", applicant_org_name: "Corner Org 43", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c43_app_id: $.data.id }
            - call: "POST /applications/${c43_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c43_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c43_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c43_award_id: $.data.id, c43_v0: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c43_award_id}", rate_type: "NEGOTIATED", negotiated_rate: 0.30, base_type: "MTDC", expected_award_version: "${c43_v0}" }
              as: FinanceOfficer
          trigger:
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c43_award_id}", rate_type: "DE_MINIMIS", base_type: "MTDC", expected_award_version: "${c43_v0}" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: derived_field_federal_drawn_reconciles_after_two_disbursements
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Award.fields.federal_drawn_cents
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
        distinguishing_aspect: |
          Derived-field reconciliation across multiple sources: federal_drawn_cents accumulates the sum of
          DISBURSED drawdowns. Two disbursements of 2000000 and 3000000 against one fund leave
          federal_drawn_cents == 5000000.
        test_recipe:
          setup:
            - "ACTIVE Award (ceiling 40000000); one fund budget 10000000; two REQUESTED drawdowns 2000000 and 3000000."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C44", applicant_org_name: "Corner Org 44", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c44_app_id: $.data.id }
            - call: "POST /applications/${c44_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c44_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c44_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c44_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c44_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c44_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c44_award_id}", amount_cents: 2000000, allocation_plan: [ { restricted_fund_id: "${c44_rf_id}", amount_cents: 2000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c44"
              captures: { c44_dd1_id: $.data.id }
            - call: "POST /drawdowns/${c44_dd1_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c44"
            - call: "POST /drawdowns"
              payload: { award_id: "${c44_award_id}", amount_cents: 3000000, allocation_plan: [ { restricted_fund_id: "${c44_rf_id}", amount_cents: 3000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c44"
              captures: { c44_dd2_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${c44_dd2_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c44"
          assert:
            - "Award.${c44_award_id}.federal_drawn_cents == 5000000"
            - "RestrictedFund.${c44_rf_id}.allocated_cents == 5000000"

      - name: cascade_disburse_three_entity_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
        excluded_because:
          difficulty_instance: transitive_cascade / disburse_cascade_allocation_then_fund_balance_then_award_ledger
          rationale: "The depth-3 disburse cascade (allocation -> fund balance -> award ledger) is the §1.8 cascade instance."

      - name: dual_variant_reimbursement_provisional_vs_final
        claim_type: dual_variant_calculation
        grounds:
          - calculations.reimbursement_reconciliation
        excluded_because:
          difficulty_instance: dual_variant_calc / reimbursement_provisional_vs_final_on_award_ledger
          rationale: "INTERIM-vs-FINAL reimbursement divergence is the §1.8 depth instance for the dual-variant layer."

      - name: rate_threshold_single_audit_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.single_audit_threshold
        excluded_because:
          difficulty_instance: boundary_precision_check / single_audit_threshold_inclusive_at_750k
          rationale: "The inclusive >= boundary on the single-audit expenditure threshold is the §1.8 boundary instance."

  # ===========================================================================
  # SECTION 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_disburse_reflects_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Drawdown.REQUESTED_to_DISBURSED
          - entities.Drawdown.fields.status
          - entities.Award.fields.federal_drawn_cents
        distinguishing_aspect: |
          consistency_model immediate: the disburse response itself shows status == DISBURSED, and an
          immediately-following GET /awards/{id} (no delay) already reflects federal_drawn_cents == 4000000.
          All effects are visible in the same request cycle, no eventual lag.
        test_recipe:
          setup:
            - "ACTIVE Award; one fund budget 10000000; a REQUESTED drawdown 4000000."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C45", applicant_org_name: "Corner Org 45", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c45_app_id: $.data.id }
            - call: "POST /applications/${c45_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c45_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c45_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c45_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c45_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c45_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c45_award_id}", amount_cents: 4000000, allocation_plan: [ { restricted_fund_id: "${c45_rf_id}", amount_cents: 4000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c45"
              captures: { c45_dd_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${c45_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c45"
              captures: { c45_dd_status: $.data.status }
            - call: "GET /awards/${c45_award_id}"
              payload: {}
              as: FinanceOfficer
              captures: { c45_drawn: $.data.federal_drawn_cents }
          assert:
            - "Drawdown.${c45_dd_id}.status == DISBURSED"
            - "Award.${c45_award_id}.federal_drawn_cents == 4000000"
