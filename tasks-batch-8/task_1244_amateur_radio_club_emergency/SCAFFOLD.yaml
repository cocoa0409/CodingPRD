  - { method: GET, path: "/served-agency-agreements", description: "List served-agency agreements", roles: [ClubAdmin, EmergencyCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "ServedAgencyAgreement[]", side_effects: [] }
