  - name: omitting_license_status_defaults_the_facility_to_active
    claim_type: Defaults
    grounds:
    - entities.Facility.fields.license_status
    - endpoints[POST /facilities]
    distinguishing_aspect: license_status is the only optional input on POST /facilities; omitting it yields ACTIVE, while the posture still starts RESTRICTED because no template is published and signage is PENDING.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      trigger:
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_default_id: $.data.id
      assert:
      - Facility.${fac_default_id}.license_status == ACTIVE
      - Facility.${fac_default_id}.signage_attestation_status == PENDING and signage_attested_at == null and signage_expires_at == null
      - Facility.${fac_default_id}.compliance_posture == RESTRICTED and restricted_service_codes == [MRI, THROMBOLYTIC]
  - name: payer_contract_idr_eligible_is_computed_from_network_status_and_regime
    claim_type: Computed Fields
    grounds:
    - entities.PayerContract.fields.idr_eligible
    - entities.PayerContract.fields.status
    distinguishing_aspect: 'idr_eligible is computed as (network_status == OUT_OF_NETWORK and state_protection_regime != STATE_EXEMPT_FSED): true for an out-of-network FEDERAL_NSA_ONLY contract, false for an out-of-network STATE_EXEMPT_FSED contract and false for an in-network contract.'
    test_recipe:
      setup:
      - Facility with compliance_posture OPEN
      - Three payer contracts differing only in network status and state regime
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /facilities/${fac_id}/disclosure-templates
        payload:
          version_label: V1
          facility_fee_cents: 145000
          observation_hourly_cents: 42000
          network_status_statement: OUT_OF_NETWORK_ALL_PLANS
          required_signage_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          tpl_v1_id: $.data.id
      - call: POST /disclosure-templates/${tpl_v1_id}/publish
        payload:
          expected_facility_version: ${fac_v1}
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities/${fac_id}/signage-attestations
        payload:
          attested_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /facilities/${fac_id}/payer-contracts
        payload:
          payer_name: Lone Star Health
          network_status: OUT_OF_NETWORK
          qualifying_payment_amount_cents: 190000
          in_network_coinsurance_rate: 0.2
          in_network_deductible_remaining_cents: 50000
          state_protection_regime: FEDERAL_NSA_ONLY
          effective_start_date: '2026-07-01'
          effective_end_date: '2026-12-31'
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          pc_eligible_id: $.data.id
      - call: POST /facilities/${fac_id}/payer-contracts
        payload:
          payer_name: Pecos Exempt Plan
          network_status: OUT_OF_NETWORK
          qualifying_payment_amount_cents: 190000
          in_network_coinsurance_rate: 0.2
          in_network_deductible_remaining_cents: 50000
          state_protection_regime: STATE_EXEMPT_FSED
          effective_start_date: '2026-07-01'
          effective_end_date: '2026-12-31'
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          pc_exempt_id: $.data.id
      - call: POST /facilities/${fac_id}/payer-contracts
        payload:
          payer_name: Hill Country HMO
          network_status: IN_NETWORK
          qualifying_payment_amount_cents: 190000
          in_network_coinsurance_rate: 0.2
          in_network_deductible_remaining_cents: 50000
          state_protection_regime: STATE_PROTECTED_FSED
          effective_start_date: '2026-07-01'
          effective_end_date: '2026-12-31'
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          pc_innetwork_id: $.data.id
      assert:
      - PayerContract.${pc_eligible_id}.idr_eligible == true and status == ACTIVE
      - PayerContract.${pc_exempt_id}.idr_eligible == false
      - PayerContract.${pc_innetwork_id}.idr_eligible == false
      - none of the three contracts accepted an idr_eligible or status value from the request body
  - name: encounter_system_fields_are_stamped_by_the_server_and_input_is_ignored
    claim_type: System Fields
    grounds:
    - entities.Encounter.fields.arrival_at
    - entities.Encounter.fields.registered_by_user_id
    - entities.Encounter.fields.disclosed_estimate_cents
    - calculations.disclosed_estimate
    distinguishing_aspect: Registration stamps arrival_at from the logical clock, registered_by_user_id from X-User-ID, mse_start_deadline_at at arrival + 30 minutes and disclosed_estimate_cents from the pinned template (145000 + 35000 = 180000 base, tier B 5% surcharge 9000 -> 189000); none of these are inputs.
    test_recipe:
      setup:
      - Facility with compliance_posture OPEN and template facility_fee_cents 145000
      - Logical clock at 2026-08-01T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /facilities/${fac_id}/disclosure-templates
        payload:
          version_label: V1
          facility_fee_cents: 145000
          observation_hourly_cents: 42000
          network_status_statement: OUT_OF_NETWORK_ALL_PLANS
          required_signage_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          tpl_v1_id: $.data.id
      - call: POST /disclosure-templates/${tpl_v1_id}/publish
        payload:
          expected_facility_version: ${fac_v1}
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities/${fac_id}/signage-attestations
        payload:
          attested_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /facilities/${fac_id}/encounters
        payload:
          patient_reference: PT-0201
          acuity_level: 2
          presenting_service_line: GENERAL_MEDICAL
        as: RegistrationClerk
        as_user_id: clerk-1
        captures:
          e_sys: $.data.id
      assert:
      - Encounter.${e_sys}.arrival_at == 2026-08-01T08:00:00Z and registered_by_user_id == clerk-1
      - Encounter.${e_sys}.mse_start_deadline_at == 2026-08-01T08:30:00Z and mse_timeliness == PENDING
      - Encounter.${e_sys}.pinned_disclosure_template_id == ${tpl_v1_id}
      - Encounter.${e_sys}.disclosed_estimate_cents == 189000
      - Encounter.${e_sys}.clinical_state == ARRIVED and disclosure_state == DISCLOSURE_PRESENTED and observation_bed_held == false and declined_transfer_count == 0
  - name: out_of_range_and_invalid_enum_inputs_are_rejected_with_invalid_request
    claim_type: Type Constraints
    grounds:
    - entities.Encounter.fields.acuity_level
    - entities.PhysicianShift.fields.end_utc
    - entities.VolumeForecast.fields.period_days
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'Four separate constraint violations each return ERR_INVALID_REQUEST (400): acuity_level 6 above the 1..5 range, an unknown license_category enum member, a shift whose end_utc equals its start_utc, and period_days 0 below the 1..90 range.'
    test_recipe:
      setup:
      - Facility with compliance_posture OPEN
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
