        excluded_because:
          difficulty_instance: dual_variant_calc / baseline_ten_of_ten_vs_weather_regression
          rationale: "Baseline TEN_OF_TEN vs WEATHER_REGRESSION divergence is fully asserted by the named §1.8 instance."
      - name: settlement_method_variant_covered
        claim_type: Variant Divergence
        grounds: [calculations.settlement_net_payment]
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_pay_for_performance_vs_capacity
          rationale: "PAY_FOR_PERFORMANCE vs CAPACITY_PAYMENT divergence is asserted by the named §1.8 instance."
      - name: tiered_payout_bonus_covered
        claim_type: Constants Applied
        grounds: [calculations.dispatch_line_payout]
        excluded_because:
          difficulty_instance: combinatorial_formula / tiered_line_payout_overperform_bonus
          rationale: "Overperform bonus tier is asserted by the named §1.8 instance."
      - name: rounding_order_covered
