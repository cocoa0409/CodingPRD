            - { call: "POST /api/work-orders/${wo_id}/schedule", payload: { route_sheet_id: "${sheet1_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-10", window_start_hour: 7, window_end_hour: 10, drive_minutes_est: 15, vehicles_to_move: 1 }, as: Dispatcher, captures: { wo_v_pre: "$.data.version" } }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 44, max_temp_f: 60, precip_probability_pct: 90, precipitation_mm: 5, source: "FORECAST" }, as: Dispatcher }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/reschedule", payload: { route_sheet_id: "${sheet2_id}", scheduled_date: "2026-08-14", window_start_hour: 8, window_end_hour: 11, drive_minutes_est: 20, expected_work_order_version: "${wo_v_pre}" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/work-orders/${wo_id}", payload: {}, as: Dispatcher, captures: { wo_v_fresh: "$.data.version" } }
            - { call: "POST /api/work-orders/${wo_id}/reschedule", payload: { route_sheet_id: "${sheet2_id}", scheduled_date: "2026-08-14", window_start_hour: 8, window_end_hour: 11, drive_minutes_est: 20, expected_work_order_version: "${wo_v_fresh}" }, as: Dispatcher, captures: { st: "$.data.execution_status", v_after: "$.data.version" } }
          assert:
            - "Stale reschedule (version from before the hold cascade): http 412 ERR_STALE_VERSION"
            - "Fresh reschedule succeeds: execution_status == SCHEDULED on 2026-08-14 and version incremented once more"
            - "Old sheet's booked_sqft released to 0; new sheet booked_sqft == 900"

      - name: pagination_limit_offset_interaction
        claim_type: pagination_interaction
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset/has_more/total_count behave per the fixed envelope: 3 customers, limit 2 -> page1 has_more true, page2 (offset 2) returns 1 item has_more false; default limit is 10."
        test_recipe:
          setup: ["Three customers"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "C1", customer_type: "RESIDENTIAL", email: "c1@example.com", phone: "1" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "C2", customer_type: "COMMERCIAL", email: "c2@example.com", phone: "2" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "C3", customer_type: "RESIDENTIAL", email: "c3@example.com", phone: "3" }, as: OfficeAdmin }
          trigger:
            - { call: "GET /api/customers", payload: { limit: 2, offset: 0 }, as: OfficeAdmin }
            - { call: "GET /api/customers", payload: { limit: 2, offset: 2 }, as: OfficeAdmin }
            - { call: "GET /api/customers", payload: {}, as: OfficeAdmin }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: 1 item, has_more == false"
            - "No params: default limit 10 applies, all 3 items returned, has_more == false"

