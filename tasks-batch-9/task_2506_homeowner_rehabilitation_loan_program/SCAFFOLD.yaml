scenario: |
  Generate task harder than expert level!

  2506. Homeowner Rehabilitation Loan Program (community development block grant housing rehabilitation program): applicant income eligibility, ownership verification and property standards inspection, work write-up preparation with cost estimate and priority repair identification, contractor bid solicitation from an approved list with bid tabulation and award, lead-based paint and historic review requirements triggering additional protocols, loan structuring as deferred, forgivable or amortizing with lien recording, draw inspection, change order approval and contractor payment, program income and recapture on sale or transfer, complaint and warranty period enforcement against contractors

domain_name: homeowner-rehab-loan-program
api_prefix: /rehab

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection under /rehab with explicit FK fields; no
  # entity is expressed only as a nested URL segment of another.

  state_machine_shape: cyclic
  # RehabApplication.workflow_state loops WRITEUP_APPROVED -> INSPECTED (new
  # write-up revision) and BID_OPEN -> BID_FAILED -> BID_OPEN (rebid);
  # WorkWriteUp.state loops SUBMITTED -> REVISION_REQUESTED -> SUBMITTED;
  # RehabApplication.compliance_posture is a second, independent state axis on
  # the same row (parallel dimension) that loops CLEARED_WITH_PROTOCOL -> LEAD_HOLD.

  relationship_patterns:
    - one_to_many
    - self_referential      # ChangeOrder.supersedes_change_order_id -> ChangeOrder.id
    - cross_aggregate       # PropertyInspection.draw_request_id, BidSolicitation.award_bid_id
    - polymorphic: false

  role_model: segregation_of_duties
  # The RehabSpecialist operator who prepared a WorkWriteUp may not be the
  # operator who approves it; the Inspector operator who performed a draw
  # inspection may not be the operator who approves that draw for payment.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProgramYear
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: CDBG program year label
        constraints: 2020..2035, unique across ProgramYear rows
      - name: ami_median_income_cents
        type: integer
        source: input
        description: HUD area median family income for a 4-person household, in cents
        constraints: "> 0"
      - name: max_loan_amount_cents
        type: integer
        source: input
        description: hard per-household rehabilitation assistance cap for this program year
        constraints: "> 0"
      - name: allocation_budget_cents
        type: integer
        source: input
        description: CDBG entitlement allocation available to the rehabilitation activity
        constraints: "> 0"
      - name: committed_amount_cents
        type: integer
        source: computed
        description: sum of principal_cents of RehabLoan rows in status IN {LIEN_RECORDED, DISBURSING, FULLY_DISBURSED} minus amounts already paid out for those loans
        default: 0
      - name: disbursed_amount_cents
        type: integer
        source: computed
        description: cumulative cash paid out across all loans of this program year (lien recording fees plus DrawRequest.net_payment_cents)
        default: 0
      - name: program_income_balance_cents
        type: integer
        source: computed
        description: cumulative RehabLoan.program_income_posted_cents recaptured back into this program year
        default: 0
      - name: uncommitted_amount_cents
        type: integer
        source: computed
        description: "allocation_budget_cents + program_income_balance_cents - committed_amount_cents - disbursed_amount_cents"
        default: 0

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: program_year_id
        type: string
        source: input
        description: "FK -> ProgramYear.id; the program year whose income limits and allocation govern this household"
      - name: full_name
        type: string
        source: input
        description: head-of-household legal name
      - name: email
        type: string
        source: input
        description: contact email, unique across Applicant rows
      - name: household_size
        type: integer
        source: input
        description: number of persons in the household
        constraints: 1..8
      - name: dependents_count
        type: integer
        source: input
        description: number of IRS dependents claimed, used only by the IRS_1040_ADJUSTED method
        default: 0
      - name: elderly_household
        type: boolean
        source: input
        description: true when head of household is 62 or older
        default: false
      - name: wage_income_cents
        type: integer
        source: input
        description: annual gross wage and self-employment income in cents
      - name: benefit_income_cents
        type: integer
        source: input
        description: annual social security, pension and public assistance income in cents
        default: 0
      - name: actual_asset_income_cents
        type: integer
        source: input
        description: annual actual income received from household assets in cents
        default: 0
      - name: household_assets_cents
        type: integer
        source: input
        description: total cash value of household assets in cents
        default: 0
      - name: income_calc_method
        type: enum
        source: input
        description: which of the two program-approved annual income determinations is applied
        constraints: PART_5_ANNUAL | IRS_1040_ADJUSTED
      - name: annual_income_cents
        type: integer
        source: computed
        description: annual income produced by calculations.applicant_annual_income_and_category for the selected method
        default: 0
      - name: income_limit_cents
        type: integer
        source: computed
        description: household-size-adjusted income limit for the applicant's program year
        default: 0
      - name: ami_percent
        type: number
        source: computed
        description: annual_income_cents as a percent of income_limit_cents, one decimal place
        default: 0
      - name: income_category
        type: enum
        source: computed
        description: HUD income band derived from ami_percent
        constraints: EXTREMELY_LOW | VERY_LOW | LOW | OVER_INCOME
      - name: eligibility_status
        type: enum
        source: system
        description: income-eligibility lifecycle state
        default: APPLIED
        constraints: APPLIED | INCOME_VERIFIED | INELIGIBLE
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the IntakeSpecialist who ran income verification; null before verification

  - name: RehabApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the income-verified household applying"
      - name: program_year_id
        type: string
        source: system
        description: "FK -> ProgramYear.id; copied verbatim from Applicant.program_year_id at creation and never editable"
      - name: awarded_contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; set when a BidSolicitation for this application is awarded; null before award"
      - name: address_line1
        type: string
        source: input
        description: street address of the dwelling to be rehabilitated
      - name: city
        type: string
        source: input
        description: city of the dwelling
      - name: state_code
        type: string
        source: input
        description: two-letter state code
      - name: year_built
        type: integer
        source: input
        description: year the dwelling was constructed
        constraints: 1850..2026
      - name: assessed_value_cents
        type: integer
        source: input
        description: county assessed value of the dwelling in cents
      - name: senior_lien_balance_cents
        type: integer
        source: input
        description: outstanding balance of mortgages senior to the program lien, in cents
        default: 0
      - name: historic_district
        type: boolean
        source: input
        description: true when the dwelling sits in a locally or nationally designated historic district
        default: false
      - name: occupancy_type
        type: enum
        source: input
        description: owner occupancy form
        constraints: OWNER_OCCUPIED_SINGLE | OWNER_OCCUPIED_DUPLEX
      - name: ownership_doc_type
        type: enum
        source: input
        description: instrument offered as proof of ownership
        constraints: WARRANTY_DEED | QUITCLAIM_DEED | LIFE_ESTATE | CONTRACT_FOR_DEED
      - name: deed_recorded_date
        type: datetime
        source: system
        description: recording date supplied at ownership verification; null before verification
      - name: ownership_verification_status
        type: enum
        source: system
        description: outcome of the ownership and title review
        default: PENDING
        constraints: PENDING | VERIFIED | REJECTED
      - name: lead_review_required
        type: boolean
        source: computed
        description: true when year_built < 1978 (pre-1978 target housing)
        default: false
      - name: historic_review_required
        type: boolean
        source: computed
        description: true when historic_district is true
        default: false
      - name: workflow_state
        type: enum
        source: system
        description: primary case lifecycle axis
        default: INTAKE
        constraints: INTAKE | OWNERSHIP_VERIFIED | INSPECTED | WRITEUP_APPROVED | BID_OPEN | BID_FAILED | AWARDED | UNDER_CONSTRUCTION | CONSTRUCTION_COMPLETE | CLOSED | DENIED
      - name: compliance_posture
        type: enum
        source: computed
        description: second, independent state axis on the same row gating lien recording and draw approval
        constraints: CLEAR | LEAD_HOLD | HISTORIC_HOLD | DUAL_HOLD | CLEARED_WITH_PROTOCOL | ADVERSE_EFFECT_BLOCKED
      - name: lead_hazard_detected
        type: boolean
        source: system
        description: true once an INITIAL_STANDARDS inspection recorded xrf_reading_mg_cm2 >= 1.00
        default: false
      - name: lead_hazard_control_method
        type: enum
        source: system
        description: hazard control approach recorded at lead clearance; NONE before clearance
        default: NONE
        constraints: NONE | INTERIM_CONTROLS | ABATEMENT
      - name: shpo_review_outcome
        type: enum
        source: system
        description: State Historic Preservation Office finding recorded at historic clearance; null before clearance
        constraints: NO_ADVERSE_EFFECT | CONDITIONS | ADVERSE_EFFECT
      - name: initial_deficiency_count
        type: integer
        source: system
        description: deficiency count recorded by the INITIAL_STANDARDS inspection
        default: 0
      - name: warranty_expires_at
        type: datetime
        source: system
        description: end of the contractor warranty period, stamped at loan close-out; null before close-out

  - name: PropertyInspection
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> RehabApplication.id; the dwelling being inspected"
      - name: draw_request_id
        type: string
        source: input
        description: "FK -> DrawRequest.id; required for inspection_type DRAW, must be null otherwise"
      - name: inspection_type
        type: enum
        source: input
        description: purpose of the site visit
        constraints: INITIAL_STANDARDS | DRAW | FINAL
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the reserved inspection window
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the reserved inspection window
        constraints: must be strictly after scheduled_start_at
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Inspector who created the inspection and records its result
      - name: status
        type: enum
        source: system
        description: inspection lifecycle
        default: SCHEDULED
        constraints: SCHEDULED | COMPLETED
      - name: result
        type: enum
        source: system
        description: recorded finding; null while SCHEDULED
        constraints: PASS | FAIL
      - name: deficiency_count
        type: integer
        source: system
        description: number of property-standards deficiencies recorded
        default: 0
      - name: xrf_reading_mg_cm2
        type: number
        source: system
        description: highest XRF lead reading in mg/cm2 recorded at this visit; null when no reading was taken
      - name: lead_hazard_present
        type: boolean
        source: computed
        description: true when xrf_reading_mg_cm2 >= 1.00
        default: false

  - name: WorkWriteUp
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> RehabApplication.id; the case this write-up scopes"
      - name: revision_number
        type: integer
        source: system
        description: 1 for the first write-up of an application, incremented for each later revision
        default: 1
      - name: revision_reason
        type: string
        source: input
        description: why this revision was opened; null on revision_number 1
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the RehabSpecialist who created the write-up
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramManager who approved the write-up; null before approval
      - name: state
        type: enum
        source: system
        description: write-up review lifecycle
        default: DRAFT
        constraints: DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED
      - name: work_item_count
        type: integer
        source: computed
        description: number of WorkItem rows whose write_up_id is this write-up
        default: 0
      - name: base_estimate_cents
        type: integer
        source: computed
        description: sum of WorkItem.line_total_cents over all work items of this write-up
        default: 0
      - name: contingency_cents
        type: integer
        source: computed
        description: round_half_up(base_estimate_cents * CONTINGENCY_PCT)
        default: 0
      - name: total_estimate_cents
        type: integer
        source: computed
        description: base_estimate_cents + contingency_cents
        default: 0
      - name: priority_repair_total_cents
        type: integer
        source: computed
        description: sum of WorkItem.line_total_cents over work items whose priority_class IN {HEALTH_SAFETY, CODE}
        default: 0

  - name: WorkItem
    parent: null
    common_fields: false
    fields:
      - name: write_up_id
        type: string
        source: input
        description: "FK -> WorkWriteUp.id; the write-up revision this line belongs to"
      - name: description
        type: string
        source: input
        description: scope of the individual repair line
      - name: category
        type: enum
        source: input
        description: construction trade category
        constraints: ROOF | ELECTRICAL | PLUMBING | HVAC | LEAD_HAZARD_CONTROL | ACCESSIBILITY | WINDOWS | STRUCTURAL
      - name: priority_class
        type: enum
        source: input
        description: program priority classification driving priority_repair_total_cents
        constraints: HEALTH_SAFETY | CODE | INCIPIENT | GENERAL_PROPERTY_IMPROVEMENT
      - name: estimated_cost_cents
        type: integer
        source: input
        description: unloaded trade estimate for this line in cents
        constraints: "> 0"
      - name: is_lead_hazard_reduction
        type: boolean
        source: input
        description: true when the line performs lead hazard reduction or disturbs painted surfaces
        default: false
      - name: is_historic_sensitive
        type: boolean
        source: input
        description: true when the line touches character-defining historic features
        default: false
      - name: protocol_multiplier
        type: number
        source: computed
        description: 1 plus applicable lead-safe and historic work practice uplifts, additive
        default: 1
      - name: line_total_cents
        type: integer
        source: computed
        description: round_half_up(estimated_cost_cents * protocol_multiplier)
        default: 0

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: contractor legal business name
      - name: license_number
        type: string
        source: input
        description: state contractor license number, unique across Contractor rows
      - name: insurance_expires_on
        type: datetime
        source: input
        description: general liability insurance expiration instant
      - name: lead_safe_certified
        type: boolean
        source: input
        description: true when the firm holds an EPA RRP lead-safe certification
        default: false
      - name: historic_qualified
        type: boolean
        source: input
        description: true when the firm is qualified for historic rehabilitation work
        default: false
      - name: approved_list_status
        type: enum
        source: system
        description: standing on the program approved contractor list
        default: APPROVED
        constraints: APPROVED | PROBATION | SUSPENDED | REMOVED
      - name: open_complaint_count
        type: integer
        source: computed
        description: number of ComplaintCase rows for this contractor whose status IN {FILED, CONTRACTOR_NOTIFIED, ESCALATED}
        default: 0
      - name: sanction_count
        type: integer
        source: computed
        description: number of ComplaintCase rows for this contractor whose status == SANCTIONED
        default: 0
      - name: on_time_completion_count
        type: integer
        source: computed
        description: number of RehabLoan rows awarded to this contractor that reached close-out
        default: 0
      - name: performance_score
        type: integer
        source: computed
        description: weighted standing score from calculations.contractor_performance_score
        default: 100
      - name: active_award_count
        type: integer
        source: computed
        description: number of BidSolicitation rows in status AWARDED whose award_bid_id belongs to this contractor and whose application has workflow_state IN {AWARDED, UNDER_CONSTRUCTION}
        default: 0

  - name: BidSolicitation
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> RehabApplication.id; the case being bid"
      - name: write_up_id
        type: string
        source: input
        description: "FK -> WorkWriteUp.id; the APPROVED write-up whose total is the independent cost estimate"
      - name: award_bid_id
        type: string
        source: system
        description: "FK -> Bid.id; the winning bid; null until award"
      - name: bid_due_at
        type: datetime
        source: input
        description: exclusive cutoff instant for bid submission
      - name: min_bids_required
        type: integer
        source: input
        description: minimum number of bids that must be on file before tabulation may run
        default: 2
        constraints: 1..5
      - name: independent_cost_estimate_cents
        type: integer
        source: system
        description: snapshot of write_up.total_estimate_cents taken at solicitation creation
      - name: responsive_ceiling_cents
        type: integer
        source: computed
        description: round_half_up(independent_cost_estimate_cents * (1 + BID_CEILING_PCT))
      - name: responsive_floor_cents
        type: integer
        source: computed
        description: round_half_up(independent_cost_estimate_cents * (1 - BID_FLOOR_PCT))
      - name: status
        type: enum
        source: system
        description: solicitation lifecycle
        default: OPEN
        constraints: OPEN | TABULATED | AWARDED | FAILED
      - name: bid_count
        type: integer
        source: computed
        description: number of Bid rows whose solicitation_id is this solicitation and whose status != WITHDRAWN_BY_PROGRAM
        default: 0
      - name: responsive_bid_count
        type: integer
        source: computed
        description: number of Bid rows of this solicitation whose status IN {RESPONSIVE, AWARDED}
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: number of times this solicitation went FAILED -> OPEN
        default: 0
      - name: awarded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramManager who awarded; null before award

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> BidSolicitation.id; the solicitation being responded to"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the bidding firm, which must equal X-User-ID for role Contractor"
      - name: amount_cents
        type: integer
        source: input
        description: lump sum bid amount in cents
        constraints: "> 0"
      - name: proposed_start_date
        type: datetime
        source: input
        description: proposed construction start, inclusive
      - name: proposed_end_date
        type: datetime
        source: input
        description: proposed substantial completion, inclusive
        constraints: must be strictly after proposed_start_date
      - name: submitted_at
        type: datetime
        source: system
        description: logical clock instant at which the bid was accepted
      - name: status
        type: enum
        source: system
        description: bid lifecycle
        default: SUBMITTED
        constraints: SUBMITTED | RESPONSIVE | NON_RESPONSIVE | AWARDED | REJECTED | WITHDRAWN_BY_PROGRAM
      - name: non_responsive_reason
        type: enum
        source: system
        description: why tabulation rejected this bid; null unless status == NON_RESPONSIVE
        constraints: OVER_CEILING | UNDER_FLOOR | CONTRACTOR_NOT_APPROVED | NOT_LEAD_CERTIFIED
      - name: rank
        type: integer
        source: computed
        description: 1-based tabulation rank among responsive bids; null for non-responsive bids

  - name: RehabLoan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> RehabApplication.id; the awarded case being financed"
      - name: structure_type
        type: enum
        source: input
        description: how the assistance is structured
        constraints: DEFERRED | FORGIVABLE | AMORTIZING
      - name: awarded_bid_amount_cents
        type: integer
        source: system
        description: amount_cents of the awarded Bid, snapshot at loan creation
      - name: approved_project_cost_cents
        type: integer
        source: computed
        description: awarded_bid_amount_cents plus the sum of amount_delta_cents over ChangeOrder rows of this loan in status APPROVED
      - name: lien_recording_fee_cents
        type: integer
        source: computed
        description: tiered recording fee locked at loan creation from calculations.loan_principal_and_fee and never recomputed afterwards
      - name: principal_cents
        type: integer
        source: computed
        description: financed principal after the program-year cap; reduced to disbursed_cents at close-out
      - name: interest_rate_bps
        type: integer
        source: input
        description: annual nominal rate in basis points; must be 0 for DEFERRED and FORGIVABLE
        default: 0
      - name: term_months
        type: integer
        source: input
        description: amortization term in months; must be > 0 for AMORTIZING and 0 otherwise
        default: 0
      - name: forgiveness_term_months
        type: integer
        source: input
        description: forgiveness period in months; must be > 0 for DEFERRED and FORGIVABLE and 0 for AMORTIZING
        default: 0
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: level monthly payment for AMORTIZING loans, 0 otherwise
        default: 0
      - name: lien_position
        type: integer
        source: system
        description: recorded lien position; null before recording
      - name: lien_recorded_at
        type: datetime
        source: system
        description: logical clock instant at which the lien was recorded; null before recording
      - name: forgiveness_start_date
        type: datetime
        source: system
        description: completion_date supplied at close-out; the zero point of the forgiveness clock
      - name: status
        type: enum
        source: system
        description: loan lifecycle
        default: STRUCTURED
        constraints: STRUCTURED | LIEN_RECORDED | DISBURSING | FULLY_DISBURSED | SERVICING | RECAPTURED | FORGIVEN
      - name: contract_earned_cents
        type: integer
        source: computed
        description: sum of approved_amount_cents over DrawRequest rows of this loan in status IN {APPROVED, PAID}
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: lien_recording_fee_cents once recorded plus the sum of net_payment_cents over DrawRequest rows in status PAID
        default: 0
      - name: retainage_held_cents
        type: integer
        source: computed
        description: cumulative retainage withheld and not yet released
        default: 0
      - name: forgiven_cents
        type: integer
        source: computed
        description: forgiveness accrued as of the evaluation instant per calculations.loan_forgiveness_accrual
        default: 0
      - name: principal_repaid_cents
        type: integer
        source: computed
        description: principal repaid by scheduled payments; always 0 for DEFERRED and FORGIVABLE in this scaffold
        default: 0
      - name: unforgiven_balance_cents
        type: integer
        source: computed
        description: "principal_cents - forgiven_cents - principal_repaid_cents"
        default: 0
      - name: recapture_event_type
        type: enum
        source: system
        description: the triggering event recorded at recapture; null before recapture
        constraints: SALE | TRANSFER | REFINANCE | RENTAL_CONVERSION
      - name: recapture_event_date
        type: datetime
        source: system
        description: event date supplied at recapture; null before recapture
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: net proceeds computed for a SALE recapture; null for other event types
      - name: recapture_amount_cents
        type: integer
        source: computed
        description: amount recaptured to the program per calculations.recapture_amount; null before recapture
      - name: shortfall_forgiven_cents
        type: integer
        source: computed
        description: unforgiven balance written off because net proceeds were insufficient; null before recapture
      - name: program_income_posted_cents
        type: integer
        source: computed
        description: amount posted to ProgramYear.program_income_balance_cents at recapture; null before recapture

  - name: DrawRequest
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> RehabLoan.id; the loan being drawn against"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; must equal the awarded contractor of the loan's application and equal X-User-ID for role Contractor"
      - name: requested_amount_cents
        type: integer
        source: input
        description: value of work certified in this draw, in cents
        constraints: "> 0"
      - name: is_final_draw
        type: boolean
        source: input
        description: true when this draw closes the construction contract and releases retainage
        default: false
      - name: approved_amount_cents
        type: integer
        source: computed
        description: amount certified at approval; equals requested_amount_cents; null before approval
      - name: retainage_cents
        type: integer
        source: computed
        description: retainage withheld from this draw; null before approval
      - name: net_payment_cents
        type: integer
        source: computed
        description: cash paid to the contractor for this draw; null before approval
      - name: status
        type: enum
        source: system
        description: draw lifecycle
        default: SUBMITTED
        constraints: SUBMITTED | INSPECTION_PASSED | INSPECTION_FAILED | APPROVED | PAID
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoanOfficer who approved the draw; null before approval
      - name: paid_at
        type: datetime
        source: system
        description: logical clock instant at which payment was released; null before payment

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> RehabLoan.id; the loan whose approved project cost would move"
      - name: supersedes_change_order_id
        type: string
        source: input
        description: "FK -> ChangeOrder.id; the earlier change order this one replaces; null when this is an original request"
      - name: amount_delta_cents
        type: integer
        source: input
        description: signed change to the construction contract amount in cents
        constraints: "!= 0"
      - name: justification
        type: string
        source: input
        description: written justification required by the program file
      - name: affects_lead_hazard_work
        type: boolean
        source: input
        description: true when the change disturbs painted surfaces or alters lead hazard control scope
        default: false
      - name: cumulative_delta_pct
        type: number
        source: computed
        description: absolute cumulative approved delta as a fraction of awarded_bid_amount_cents after this change order would be approved, four decimal places
        default: 0
      - name: status
        type: enum
        source: system
        description: change order lifecycle
        default: SUBMITTED
        constraints: SUBMITTED | APPROVED | DENIED | SUPERSEDED
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RehabSpecialist who submitted the change order

  - name: ComplaintCase
    parent: null
    common_fields: true
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the firm complained about"
      - name: application_id
        type: string
        source: input
        description: "FK -> RehabApplication.id; the closed case whose warranty period is invoked"
      - name: defect_category
        type: enum
        source: input
        description: nature of the warranty defect
        constraints: WORKMANSHIP | INCOMPLETE_WORK | MATERIAL_DEFECT | WARRANTY_REFUSAL
      - name: description
        type: string
        source: input
        description: homeowner narrative of the defect
      - name: filed_at
        type: datetime
        source: system
        description: logical clock instant at which the complaint was filed
      - name: warranty_expires_at
        type: datetime
        source: system
        description: snapshot of RehabApplication.warranty_expires_at at filing
      - name: remedy_deadline_at
        type: datetime
        source: system
        description: filed-notice instant plus REMEDY_WINDOW_DAYS; null before the contractor is notified
      - name: status
        type: enum
        source: system
        description: complaint lifecycle
        default: FILED
        constraints: FILED | CONTRACTOR_NOTIFIED | REMEDIED | DISMISSED | ESCALATED | SANCTIONED
      - name: sanction_level
        type: enum
        source: system
        description: sanction imposed on the contractor; null unless status == SANCTIONED
        constraints: PROBATION | SUSPENSION | REMOVAL
      - name: resolved_at
        type: datetime
        source: system
        description: logical clock instant at which the complaint reached REMEDIED, DISMISSED or SANCTIONED; null otherwise

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Applicant
    state_field: eligibility_status
    initial_state: APPLIED
    terminal_states: [INELIGIBLE]
    transitions:
      - from: APPLIED
        to: INCOME_VERIFIED
        trigger: "POST /rehab/applicants/{id}/verify-income"
        actor: IntakeSpecialist
        preconditions:
          - "applicant.eligibility_status == APPLIED"
          - "calculations.applicant_annual_income_and_category yields income_category IN {EXTREMELY_LOW, VERY_LOW, LOW}"
        side_effects:
          - "recompute annual_income_cents, income_limit_cents, ami_percent, income_category via calculations.applicant_annual_income_and_category"
          - "set verified_by_user_id = X-User-ID"
          - "increment Applicant.version by 1"
      - from: APPLIED
        to: INELIGIBLE
        trigger: "POST /rehab/applicants/{id}/verify-income"
        actor: IntakeSpecialist
        preconditions:
          - "applicant.eligibility_status == APPLIED"
          - "calculations.applicant_annual_income_and_category yields income_category == OVER_INCOME"
        side_effects:
          - "recompute annual_income_cents, income_limit_cents, ami_percent, income_category via calculations.applicant_annual_income_and_category"
          - "set verified_by_user_id = X-User-ID"
          - "increment Applicant.version by 1"
        note: "Verification always succeeds with 200; over-income households are recorded as INELIGIBLE and blocked later at application creation."

  - entity: RehabApplication
    state_field: workflow_state
    initial_state: INTAKE
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: INTAKE
        to: OWNERSHIP_VERIFIED
        trigger: "POST /rehab/applications/{id}/verify-ownership"
        actor: IntakeSpecialist
        preconditions:
          - "application.workflow_state == INTAKE"
          - "request title_report_clear == true"
          - "application.ownership_doc_type IN {WARRANTY_DEED, LIFE_ESTATE}"
        side_effects:
          - "set ownership_verification_status = VERIFIED and deed_recorded_date = request deed_recorded_date"
          - "increment RehabApplication.version by 1"
      - from: INTAKE
        to: DENIED
        trigger: "POST /rehab/applications/{id}/verify-ownership"
        actor: IntakeSpecialist
        preconditions:
          - "application.workflow_state == INTAKE"
          - "request title_report_clear == false OR application.ownership_doc_type IN {QUITCLAIM_DEED, CONTRACT_FOR_DEED}"
        side_effects:
          - "set ownership_verification_status = REJECTED"
          - "increment RehabApplication.version by 1"
      - from: OWNERSHIP_VERIFIED
        to: INSPECTED
        trigger: "POST /rehab/inspections/{id}/record-result with inspection_type == INITIAL_STANDARDS"
        actor: Inspector
        preconditions:
          - "application.workflow_state == OWNERSHIP_VERIFIED"
          - "request deficiency_count >= 1"
        side_effects:
          - "set initial_deficiency_count = request deficiency_count"
          - "when request xrf_reading_mg_cm2 >= 1.00 set lead_hazard_detected = true"
          - "increment RehabApplication.version by 1"
      - from: OWNERSHIP_VERIFIED
        to: DENIED
        trigger: "POST /rehab/inspections/{id}/record-result with inspection_type == INITIAL_STANDARDS"
        actor: Inspector
        preconditions:
          - "application.workflow_state == OWNERSHIP_VERIFIED"
          - "request deficiency_count == 0"
        side_effects:
          - "set initial_deficiency_count = 0"
          - "increment RehabApplication.version by 1"
        note: "Zero deficiencies means the dwelling already meets property standards, so no rehabilitation need exists."
      - from: INSPECTED
        to: WRITEUP_APPROVED
        trigger: "POST /rehab/write-ups/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "write_up.state == SUBMITTED"
          - "write_up.work_item_count >= 1"
          - "X-User-ID != write_up.prepared_by_user_id"
        side_effects:
          - "set write_up.state = APPROVED and write_up.approved_by_user_id = X-User-ID"
          - "increment RehabApplication.version by 1"
      - from: WRITEUP_APPROVED
        to: INSPECTED
        trigger: "POST /rehab/write-ups (new revision for the same application)"
        actor: RehabSpecialist
        preconditions:
          - "application.workflow_state == WRITEUP_APPROVED"
          - "request expected_application_version == application.version"
        side_effects:
          - "prior APPROVED WorkWriteUp of this application transitions APPROVED -> SUPERSEDED"
          - "new WorkWriteUp created in DRAFT with revision_number = prior revision_number + 1"
          - "increment RehabApplication.version by 1"
        note: "Revision cycle: the case regresses one step so the new scope must be approved again before bidding."
      - from: WRITEUP_APPROVED
        to: BID_OPEN
        trigger: "POST /rehab/bid-solicitations"
        actor: RehabSpecialist
        preconditions:
          - "application.workflow_state == WRITEUP_APPROVED"
          - "write_up.state == APPROVED and write_up.application_id == application.id"
          - "write_up.priority_repair_total_cents > 0"
        side_effects:
          - "snapshot independent_cost_estimate_cents = write_up.total_estimate_cents"
          - "increment RehabApplication.version by 1"
      - from: BID_OPEN
        to: BID_FAILED
        trigger: "POST /rehab/bid-solicitations/{id}/tabulate yielding responsive_bid_count == 0, or cascade hop 3 of contractor suspension"
        actor: system
        preconditions:
          - "application.workflow_state == BID_OPEN"
          - "solicitation.responsive_bid_count == 0 after tabulation, or solicitation.responsive_bid_count < solicitation.min_bids_required after a program withdrawal"
        side_effects:
          - "set solicitation.status = FAILED"
          - "increment RehabApplication.version by 1"
      - from: BID_FAILED
        to: BID_OPEN
        trigger: "POST /rehab/bid-solicitations/{id}/reopen"
        actor: ProgramManager
        preconditions:
          - "solicitation.status == FAILED"
          - "request new_bid_due_at is strictly after the logical clock"
        side_effects:
          - "set solicitation.status = OPEN, bid_due_at = request new_bid_due_at, reopen_count += 1"
          - "all Bid rows of this solicitation in status IN {RESPONSIVE, NON_RESPONSIVE} transition to REJECTED"
          - "increment RehabApplication.version by 1"
        note: "Rebid cycle on the same solicitation row."
      - from: BID_OPEN
        to: AWARDED
        trigger: "POST /rehab/bid-solicitations/{id}/award"
        actor: ProgramManager
        preconditions:
          - "solicitation.status == TABULATED"
          - "the selected Bid has status == RESPONSIVE"
          - "the selected bid's contractor.approved_list_status == APPROVED"
          - "when application.lead_review_required, the selected bid's contractor.lead_safe_certified == true"
          - "no contractor construction-window conflict per validations priority 16"
        side_effects:
          - "set solicitation.status = AWARDED, award_bid_id, awarded_by_user_id = X-User-ID"
          - "selected Bid -> AWARDED; all other RESPONSIVE and NON_RESPONSIVE bids of this solicitation -> REJECTED"
          - "set application.awarded_contractor_id = winning contractor id"
          - "recompute Contractor.active_award_count for the winning contractor"
          - "increment RehabApplication.version by 1"
      - from: AWARDED
        to: UNDER_CONSTRUCTION
        trigger: "POST /rehab/loans/{id}/record-lien"
        actor: LoanOfficer
        preconditions:
          - "loan.status == STRUCTURED"
          - "application.compliance_posture IN {CLEAR, CLEARED_WITH_PROTOCOL}"
          - "program_year.uncommitted_amount_cents >= loan.principal_cents"
        side_effects:
          - "loan STRUCTURED -> LIEN_RECORDED"
          - "program_year.committed_amount_cents += loan.principal_cents"
          - "recording fee disbursement: loan.disbursed_cents += loan.lien_recording_fee_cents, program_year.committed_amount_cents -= lien_recording_fee_cents, program_year.disbursed_amount_cents += lien_recording_fee_cents"
          - "increment RehabApplication.version by 1"
      - from: UNDER_CONSTRUCTION
        to: CONSTRUCTION_COMPLETE
        trigger: "system, cascade hop 3 of POST /rehab/draw-requests/{id}/pay"
        actor: system
        preconditions:
          - "loan.disbursed_cents == loan.principal_cents after the payment posted"
        side_effects:
          - "loan DISBURSING -> FULLY_DISBURSED"
          - "increment RehabApplication.version by 1"
      - from: CONSTRUCTION_COMPLETE
        to: CLOSED
        trigger: "POST /rehab/loans/{id}/close-out"
        actor: LoanOfficer
        preconditions:
          - "loan.status IN {DISBURSING, FULLY_DISBURSED}"
          - "loan.retainage_held_cents == 0"
        side_effects:
          - "set warranty_expires_at = request completion_date + WARRANTY_MONTHS (12 calendar months)"
          - "increment RehabApplication.version by 1"
      - from: UNDER_CONSTRUCTION
        to: CLOSED
        trigger: "POST /rehab/loans/{id}/close-out"
        actor: LoanOfficer
        preconditions:
          - "loan.status == DISBURSING"
          - "loan.retainage_held_cents == 0"
        side_effects:
          - "set warranty_expires_at = request completion_date + WARRANTY_MONTHS (12 calendar months)"
          - "increment RehabApplication.version by 1"
        note: "Close-out from a partially disbursed loan releases the unspent commitment; see RehabLoan machine."

  - entity: RehabApplication.compliance_posture
    state_field: compliance_posture
    initial_state: "computed at creation: DUAL_HOLD when lead_review_required and historic_review_required; LEAD_HOLD when only lead_review_required; HISTORIC_HOLD when only historic_review_required; CLEAR otherwise"
    terminal_states: [ADVERSE_EFFECT_BLOCKED]
    transitions:
      - from: DUAL_HOLD
        to: HISTORIC_HOLD
        trigger: "POST /rehab/applications/{id}/lead-clearance"
        actor: Inspector
        preconditions:
          - "application.compliance_posture == DUAL_HOLD"
          - "request risk_assessment_completed == true"
          - "application.workflow_state IN {INSPECTED, WRITEUP_APPROVED, BID_OPEN, BID_FAILED, AWARDED}"
        side_effects:
          - "set lead_hazard_control_method = request hazard_control_method"
          - "increment RehabApplication.version by 1"
      - from: DUAL_HOLD
        to: LEAD_HOLD
        trigger: "POST /rehab/applications/{id}/historic-clearance"
        actor: ProgramManager
        preconditions:
          - "application.compliance_posture == DUAL_HOLD"
          - "request shpo_review_outcome IN {NO_ADVERSE_EFFECT, CONDITIONS}"
        side_effects:
          - "set shpo_review_outcome = request shpo_review_outcome"
          - "increment RehabApplication.version by 1"
      - from: LEAD_HOLD
        to: CLEARED_WITH_PROTOCOL
        trigger: "POST /rehab/applications/{id}/lead-clearance"
        actor: Inspector
        preconditions:
          - "application.compliance_posture == LEAD_HOLD"
          - "request risk_assessment_completed == true"
        side_effects:
          - "set lead_hazard_control_method = request hazard_control_method"
          - "increment RehabApplication.version by 1"
      - from: HISTORIC_HOLD
        to: CLEARED_WITH_PROTOCOL
        trigger: "POST /rehab/applications/{id}/historic-clearance"
        actor: ProgramManager
        preconditions:
          - "application.compliance_posture == HISTORIC_HOLD"
          - "application.lead_review_required == true"
          - "request shpo_review_outcome IN {NO_ADVERSE_EFFECT, CONDITIONS}"
        side_effects:
          - "set shpo_review_outcome = request shpo_review_outcome"
          - "increment RehabApplication.version by 1"
      - from: HISTORIC_HOLD
        to: CLEAR
        trigger: "POST /rehab/applications/{id}/historic-clearance"
        actor: ProgramManager
        preconditions:
          - "application.compliance_posture == HISTORIC_HOLD"
          - "application.lead_review_required == false"
          - "request shpo_review_outcome IN {NO_ADVERSE_EFFECT, CONDITIONS}"
        side_effects:
          - "set shpo_review_outcome = request shpo_review_outcome"
          - "increment RehabApplication.version by 1"
      - from: HISTORIC_HOLD
        to: ADVERSE_EFFECT_BLOCKED
        trigger: "POST /rehab/applications/{id}/historic-clearance"
        actor: ProgramManager
        preconditions:
          - "application.compliance_posture IN {HISTORIC_HOLD, DUAL_HOLD}"
          - "request shpo_review_outcome == ADVERSE_EFFECT"
        side_effects:
          - "set shpo_review_outcome = ADVERSE_EFFECT"
          - "increment RehabApplication.version by 1"
        note: "Terminal on this axis: lien recording can never proceed from ADVERSE_EFFECT_BLOCKED."
      - from: CLEARED_WITH_PROTOCOL
        to: LEAD_HOLD
        trigger: "POST /rehab/change-orders/{id}/approve with affects_lead_hazard_work == true"
        actor: ProgramManager
        preconditions:
          - "application.lead_review_required == true"
          - "change_order.affects_lead_hazard_work == true"
        side_effects:
          - "set lead_hazard_control_method = NONE"
          - "increment RehabApplication.version by 1"
        note: "Posture cycle: expanded lead-disturbing scope re-triggers the lead protocol and blocks further draw approvals until a new lead clearance is recorded."
      - from: CLEAR
        to: LEAD_HOLD
        trigger: "POST /rehab/change-orders/{id}/approve with affects_lead_hazard_work == true"
        actor: ProgramManager
        preconditions:
          - "application.lead_review_required == true"
          - "change_order.affects_lead_hazard_work == true"
        side_effects:
          - "set lead_hazard_control_method = NONE"
          - "increment RehabApplication.version by 1"

  - entity: PropertyInspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rehab/inspections/{id}/record-result"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "X-User-ID == inspection.performed_by_user_id"
        side_effects:
          - "set result, deficiency_count, xrf_reading_mg_cm2 and lead_hazard_present = (xrf_reading_mg_cm2 >= 1.00)"
          - "for inspection_type INITIAL_STANDARDS drive the RehabApplication.workflow_state transition out of OWNERSHIP_VERIFIED"
          - "for inspection_type DRAW drive the DrawRequest transition SUBMITTED -> INSPECTION_PASSED or SUBMITTED -> INSPECTION_FAILED"
          - "increment PropertyInspection.version by 1"

  - entity: WorkWriteUp
    state_field: state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rehab/write-ups/{id}/submit"
        actor: RehabSpecialist
        preconditions:
          - "write_up.state == DRAFT"
          - "write_up.work_item_count >= 1"
          - "write_up.priority_repair_total_cents > 0"
        side_effects:
          - "recompute base_estimate_cents, contingency_cents, total_estimate_cents, priority_repair_total_cents"
          - "increment WorkWriteUp.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /rehab/write-ups/{id}/request-revision"
        actor: ProgramManager
        preconditions:
          - "write_up.state == SUBMITTED"
        side_effects:
          - "record request revision_note on the write-up audit trail"
          - "increment WorkWriteUp.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /rehab/write-ups/{id}/submit"
        actor: RehabSpecialist
        preconditions:
          - "write_up.state == REVISION_REQUESTED"
          - "write_up.work_item_count >= 1"
          - "write_up.priority_repair_total_cents > 0"
        side_effects:
          - "recompute base_estimate_cents, contingency_cents, total_estimate_cents, priority_repair_total_cents"
          - "increment WorkWriteUp.version by 1"
        note: "Revision cycle on the same row: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED may repeat without bound."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rehab/write-ups/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "write_up.state == SUBMITTED"
          - "X-User-ID != write_up.prepared_by_user_id"
          - "application.workflow_state == INSPECTED"
        side_effects:
          - "set approved_by_user_id = X-User-ID"
          - "drive RehabApplication INSPECTED -> WRITEUP_APPROVED"
          - "increment WorkWriteUp.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /rehab/write-ups (new revision for the same application)"
        actor: RehabSpecialist
        preconditions:
          - "an APPROVED WorkWriteUp exists for the application"
          - "application.workflow_state == WRITEUP_APPROVED"
        side_effects:
          - "drive RehabApplication WRITEUP_APPROVED -> INSPECTED"
          - "increment WorkWriteUp.version by 1"

  - entity: Contractor
    state_field: approved_list_status
    initial_state: APPROVED
    terminal_states: [REMOVED]
    transitions:
      - from: APPROVED
        to: PROBATION
        trigger: "POST /rehab/contractors/{id}/status, or system recomputation of performance_score after POST /rehab/complaints"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status == APPROVED"
          - "for the system path, performance_score < PROBATION_SCORE_THRESHOLD after recomputation"
        side_effects:
          - "recompute performance_score"
          - "increment Contractor.version by 1"
      - from: PROBATION
        to: APPROVED
        trigger: "POST /rehab/contractors/{id}/status"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status == PROBATION"
          - "contractor.performance_score >= PROBATION_SCORE_THRESHOLD"
        side_effects:
          - "increment Contractor.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /rehab/contractors/{id}/status, or cascade hop 1 of POST /rehab/complaints/{id}/sanction with sanction_level SUSPENSION"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status IN {APPROVED, PROBATION}"
        side_effects:
          - "cascade hop 2: every Bid of this contractor whose status IN {SUBMITTED, RESPONSIVE} transitions to WITHDRAWN_BY_PROGRAM"
          - "cascade hop 3: each affected BidSolicitation recomputes bid_count and responsive_bid_count; when a solicitation in status IN {OPEN, TABULATED} now has responsive_bid_count < min_bids_required it transitions to FAILED"
          - "cascade hop 4: each solicitation that transitioned to FAILED drives its RehabApplication BID_OPEN -> BID_FAILED"
          - "recompute performance_score"
          - "increment Contractor.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /rehab/contractors/{id}/status, or cascade hop 1 of POST /rehab/complaints/{id}/sanction with sanction_level SUSPENSION"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status == PROBATION"
        side_effects:
          - "same cascade hops 2 to 4 as APPROVED -> SUSPENDED"
          - "increment Contractor.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /rehab/contractors/{id}/status"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status == SUSPENDED"
        side_effects:
          - "compensating restoration: every Bid of this contractor in status WITHDRAWN_BY_PROGRAM whose solicitation.status IN {OPEN, TABULATED, FAILED} returns to its pre-withdrawal status (SUBMITTED before tabulation, RESPONSIVE after tabulation)"
          - "each affected BidSolicitation recomputes bid_count and responsive_bid_count; a solicitation in FAILED whose responsive_bid_count >= min_bids_required returns to TABULATED and drives its RehabApplication BID_FAILED -> BID_OPEN"
          - "increment Contractor.version by 1"
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /rehab/contractors/{id}/status, or cascade hop 1 of POST /rehab/complaints/{id}/sanction with sanction_level REMOVAL"
        actor: ProgramManager
        preconditions:
          - "contractor.approved_list_status == SUSPENDED"
        side_effects:
          - "increment Contractor.version by 1"

  - entity: BidSolicitation
    state_field: status
    initial_state: OPEN
    terminal_states: [AWARDED]
    transitions:
      - from: OPEN
        to: TABULATED
        trigger: "POST /rehab/bid-solicitations/{id}/tabulate"
        actor: RehabSpecialist
        preconditions:
          - "solicitation.status == OPEN"
          - "solicitation.bid_count >= solicitation.min_bids_required"
          - "responsive_bid_count computed by calculations.bid_tabulation_and_ranking >= 1"
        side_effects:
          - "each Bid of this solicitation is classified RESPONSIVE or NON_RESPONSIVE with non_responsive_reason"
          - "rank assigned to responsive bids per calculations.bid_tabulation_and_ranking"
          - "recompute bid_count and responsive_bid_count"
          - "increment BidSolicitation.version by 1"
      - from: OPEN
        to: FAILED
        trigger: "POST /rehab/bid-solicitations/{id}/tabulate"
        actor: RehabSpecialist
        preconditions:
          - "solicitation.status == OPEN"
          - "solicitation.bid_count >= solicitation.min_bids_required"
          - "responsive_bid_count computed by calculations.bid_tabulation_and_ranking == 0"
        side_effects:
          - "every bid is classified NON_RESPONSIVE with non_responsive_reason"
          - "drive RehabApplication BID_OPEN -> BID_FAILED"
          - "increment BidSolicitation.version by 1"
      - from: TABULATED
        to: FAILED
        trigger: "system, cascade hop 3 of a contractor suspension"
        actor: system
        preconditions:
          - "solicitation.responsive_bid_count < solicitation.min_bids_required after program withdrawal of one or more bids"
        side_effects:
          - "drive RehabApplication BID_OPEN -> BID_FAILED"
          - "increment BidSolicitation.version by 1"
      - from: FAILED
        to: TABULATED
        trigger: "system, compensating restoration on contractor reinstatement"
        actor: system
        preconditions:
          - "solicitation.responsive_bid_count >= solicitation.min_bids_required after bids were restored"
        side_effects:
          - "drive RehabApplication BID_FAILED -> BID_OPEN"
          - "increment BidSolicitation.version by 1"
      - from: FAILED
        to: OPEN
        trigger: "POST /rehab/bid-solicitations/{id}/reopen"
        actor: ProgramManager
        preconditions:
          - "solicitation.status == FAILED"
        side_effects:
          - "reset bid classifications to REJECTED, reopen_count += 1, bid_due_at = request new_bid_due_at"
          - "drive RehabApplication BID_FAILED -> BID_OPEN"
          - "increment BidSolicitation.version by 1"
      - from: TABULATED
        to: AWARDED
        trigger: "POST /rehab/bid-solicitations/{id}/award"
        actor: ProgramManager
        preconditions:
          - "solicitation.status == TABULATED"
          - "the selected bid is RESPONSIVE and its contractor is APPROVED"
        side_effects:
          - "see RehabApplication BID_OPEN -> AWARDED side effects"
          - "increment BidSolicitation.version by 1"

  - entity: Bid
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: RESPONSIVE
        trigger: "POST /rehab/bid-solicitations/{id}/tabulate"
        actor: RehabSpecialist
        preconditions:
          - "responsive_floor_cents <= bid.amount_cents <= responsive_ceiling_cents"
          - "bid.contractor.approved_list_status == APPROVED"
          - "when application.lead_review_required, bid.contractor.lead_safe_certified == true"
        side_effects:
          - "assign rank per calculations.bid_tabulation_and_ranking"
          - "increment Bid.version by 1"
      - from: SUBMITTED
        to: NON_RESPONSIVE
        trigger: "POST /rehab/bid-solicitations/{id}/tabulate"
        actor: RehabSpecialist
        preconditions:
          - "any responsiveness condition above fails"
        side_effects:
          - "set non_responsive_reason to the first failing condition in the order OVER_CEILING, UNDER_FLOOR, CONTRACTOR_NOT_APPROVED, NOT_LEAD_CERTIFIED"
          - "increment Bid.version by 1"
      - from: RESPONSIVE
        to: AWARDED
        trigger: "POST /rehab/bid-solicitations/{id}/award"
        actor: ProgramManager
        preconditions:
          - "bid.status == RESPONSIVE and bid.solicitation.status == TABULATED"
        side_effects:
          - "increment Bid.version by 1"
      - from: RESPONSIVE
        to: REJECTED
        trigger: "POST /rehab/bid-solicitations/{id}/award (non-winning bids) or POST /rehab/bid-solicitations/{id}/reopen"
        actor: ProgramManager
        preconditions:
          - "bid.status == RESPONSIVE and another bid of the same solicitation was awarded, or the solicitation was reopened"
        side_effects:
          - "increment Bid.version by 1"
      - from: NON_RESPONSIVE
        to: REJECTED
        trigger: "POST /rehab/bid-solicitations/{id}/award or POST /rehab/bid-solicitations/{id}/reopen"
        actor: ProgramManager
        preconditions:
          - "bid.status == NON_RESPONSIVE"
        side_effects:
          - "increment Bid.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN_BY_PROGRAM
        trigger: "system, cascade hop 2 of a contractor suspension"
        actor: system
        preconditions:
          - "bid.contractor transitioned to SUSPENDED"
          - "bid.solicitation.status IN {OPEN, TABULATED}"
        side_effects:
          - "cascade hop 3 on the parent solicitation"
          - "increment Bid.version by 1"
      - from: RESPONSIVE
        to: WITHDRAWN_BY_PROGRAM
        trigger: "system, cascade hop 2 of a contractor suspension"
        actor: system
        preconditions:
          - "bid.contractor transitioned to SUSPENDED"
          - "bid.solicitation.status IN {OPEN, TABULATED}"
        side_effects:
          - "cascade hop 3 on the parent solicitation"
          - "increment Bid.version by 1"
      - from: WITHDRAWN_BY_PROGRAM
        to: RESPONSIVE
        trigger: "system, compensating restoration on contractor reinstatement (SUSPENDED -> APPROVED)"
        actor: system
        preconditions:
          - "the bid was withdrawn from a solicitation whose status was TABULATED"
        side_effects:
          - "parent solicitation recomputes responsive_bid_count"
          - "increment Bid.version by 1"
      - from: WITHDRAWN_BY_PROGRAM
        to: SUBMITTED
        trigger: "system, compensating restoration on contractor reinstatement (SUSPENDED -> APPROVED)"
        actor: system
        preconditions:
          - "the bid was withdrawn from a solicitation whose status was OPEN"
        side_effects:
          - "parent solicitation recomputes bid_count"
          - "increment Bid.version by 1"

  - entity: RehabLoan
    state_field: status
    initial_state: STRUCTURED
    terminal_states: [RECAPTURED, FORGIVEN]
    transitions:
      - from: STRUCTURED
        to: LIEN_RECORDED
        trigger: "POST /rehab/loans/{id}/record-lien"
        actor: LoanOfficer
        preconditions:
          - "loan.status == STRUCTURED"
          - "application.compliance_posture IN {CLEAR, CLEARED_WITH_PROTOCOL}"
          - "program_year.uncommitted_amount_cents >= loan.principal_cents"
        side_effects:
          - "set lien_position, lien_recorded_at"
          - "program_year.committed_amount_cents += principal_cents, then the recording fee is disbursed as described in the RehabApplication AWARDED -> UNDER_CONSTRUCTION transition"
          - "drive RehabApplication AWARDED -> UNDER_CONSTRUCTION"
          - "increment RehabLoan.version by 1"
      - from: LIEN_RECORDED
        to: DISBURSING
        trigger: "POST /rehab/draw-requests/{id}/pay (first payment on this loan)"
        actor: LoanOfficer
        preconditions:
          - "loan.status == LIEN_RECORDED"
        side_effects:
          - "cascade hop 1: draw APPROVED -> PAID, loan.contract_earned_cents += approved_amount_cents, loan.retainage_held_cents += retainage_cents, loan.disbursed_cents += net_payment_cents"
          - "cascade hop 2: program_year.committed_amount_cents -= net_payment_cents and program_year.disbursed_amount_cents += net_payment_cents"
          - "increment RehabLoan.version by 1"
      - from: DISBURSING
        to: FULLY_DISBURSED
        trigger: "system, cascade hop 3 of POST /rehab/draw-requests/{id}/pay"
        actor: system
        preconditions:
          - "loan.disbursed_cents == loan.principal_cents after the payment posted"
        side_effects:
          - "cascade hop 4: drive RehabApplication UNDER_CONSTRUCTION -> CONSTRUCTION_COMPLETE"
          - "increment RehabLoan.version by 1"
      - from: DISBURSING
        to: SERVICING
        trigger: "POST /rehab/loans/{id}/close-out"
        actor: LoanOfficer
        preconditions:
          - "loan.status IN {DISBURSING, FULLY_DISBURSED}"
          - "loan.retainage_held_cents == 0"
          - "request completion_date is not before loan.lien_recorded_at"
        side_effects:
          - "unspent commitment released: released = principal_cents - disbursed_cents; program_year.committed_amount_cents -= released"
          - "principal_cents reduced to disbursed_cents and unforgiven_balance_cents recomputed"
          - "monthly_payment_cents recomputed for AMORTIZING loans on the reduced principal"
          - "forgiveness_start_date = request completion_date"
          - "awarded contractor's on_time_completion_count += 1 and performance_score recomputed"
          - "drive RehabApplication to CLOSED and stamp warranty_expires_at"
          - "increment RehabLoan.version by 1"
      - from: FULLY_DISBURSED
        to: SERVICING
        trigger: "POST /rehab/loans/{id}/close-out"
        actor: LoanOfficer
        preconditions:
          - "loan.status == FULLY_DISBURSED"
          - "loan.retainage_held_cents == 0"
        side_effects:
          - "same side effects as DISBURSING -> SERVICING; released is 0 in this path"
          - "increment RehabLoan.version by 1"
      - from: SERVICING
        to: RECAPTURED
        trigger: "POST /rehab/loans/{id}/recapture"
        actor: ProgramManager
        preconditions:
          - "loan.status == SERVICING"
          - "recapture_amount_cents computed by calculations.recapture_amount > 0"
        side_effects:
          - "set recapture_event_type, recapture_event_date, net_proceeds_cents, recapture_amount_cents, shortfall_forgiven_cents, program_income_posted_cents"
          - "program_year.program_income_balance_cents += program_income_posted_cents"
          - "increment RehabLoan.version by 1"
      - from: SERVICING
        to: FORGIVEN
        trigger: "POST /rehab/loans/{id}/recapture"
        actor: ProgramManager
        preconditions:
          - "loan.status == SERVICING"
          - "recapture_amount_cents computed by calculations.recapture_amount == 0"
        side_effects:
          - "set recapture fields with recapture_amount_cents = 0 and shortfall_forgiven_cents = unforgiven_balance_cents"
          - "program_year.program_income_balance_cents unchanged"
          - "increment RehabLoan.version by 1"

  - entity: DrawRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: INSPECTION_PASSED
        trigger: "POST /rehab/inspections/{id}/record-result with inspection_type DRAW and result PASS"
        actor: Inspector
        preconditions:
          - "draw.status IN {SUBMITTED, INSPECTION_FAILED}"
          - "inspection.draw_request_id == draw.id"
        side_effects:
          - "increment DrawRequest.version by 1"
      - from: SUBMITTED
        to: INSPECTION_FAILED
        trigger: "POST /rehab/inspections/{id}/record-result with inspection_type DRAW and result FAIL"
        actor: Inspector
        preconditions:
          - "draw.status == SUBMITTED"
          - "inspection.draw_request_id == draw.id"
        side_effects:
          - "increment DrawRequest.version by 1"
      - from: INSPECTION_FAILED
        to: INSPECTION_PASSED
        trigger: "POST /rehab/inspections/{id}/record-result on a later DRAW inspection with result PASS"
        actor: Inspector
        preconditions:
          - "draw.status == INSPECTION_FAILED"
          - "the later inspection's draw_request_id == draw.id"
        side_effects:
          - "increment DrawRequest.version by 1"
        note: "Re-inspection cycle: a failed draw is re-inspected on the same DrawRequest row rather than resubmitted."
      - from: INSPECTION_PASSED
        to: APPROVED
        note: "Approving a draw that is still SUBMITTED, or that is INSPECTION_FAILED, returns ERR_DRAW_INSPECTION_NOT_PASSED (validations priority 13) — not the generic ERR_INVALID_STATE."
        trigger: "POST /rehab/draw-requests/{id}/approve"
        actor: LoanOfficer
        preconditions:
          - "draw.status == INSPECTION_PASSED"
          - "application.compliance_posture IN {CLEAR, CLEARED_WITH_PROTOCOL}"
          - "X-User-ID != the performed_by_user_id of the DRAW inspection that passed this draw"
          - "requested_amount_cents <= loan.approved_project_cost_cents - loan.contract_earned_cents"
        side_effects:
          - "set approved_amount_cents = requested_amount_cents, retainage_cents and net_payment_cents per calculations.draw_payment_and_retainage"
          - "set approved_by_user_id = X-User-ID"
          - "increment DrawRequest.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /rehab/draw-requests/{id}/pay"
        actor: LoanOfficer
        preconditions:
          - "draw.status == APPROVED"
          - "loan.status IN {LIEN_RECORDED, DISBURSING}"
        side_effects:
          - "cascade hops 1 to 4 as described in the RehabLoan LIEN_RECORDED -> DISBURSING and DISBURSING -> FULLY_DISBURSED transitions"
          - "when is_final_draw, loan.retainage_held_cents is released to 0 and included in net_payment_cents"
          - "set paid_at"
          - "increment DrawRequest.version by 1"

  - entity: ChangeOrder
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rehab/change-orders/{id}/approve"
        actor: ProgramManager
        preconditions:
          - "change_order.status == SUBMITTED"
          - "loan.status IN {LIEN_RECORDED, DISBURSING}"
          - "cumulative_delta_pct <= CHANGE_ORDER_CUMULATIVE_LIMIT_PCT"
          - "for a positive delta, program_year.uncommitted_amount_cents >= the resulting increase in principal_cents"
        side_effects:
          - "loan.approved_project_cost_cents += amount_delta_cents and principal_cents recomputed with the locked lien_recording_fee_cents"
          - "program_year.committed_amount_cents adjusted by the principal delta"
          - "when affects_lead_hazard_work and application.lead_review_required, drive the compliance_posture transition to LEAD_HOLD"
          - "increment ChangeOrder.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rehab/change-orders/{id}/deny"
        actor: ProgramManager
        preconditions:
          - "change_order.status == SUBMITTED"
        side_effects:
          - "increment ChangeOrder.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /rehab/change-orders/{id}/approve on a later change order whose supersedes_change_order_id is this row"
        actor: ProgramManager
        preconditions:
          - "the later change order references this row via supersedes_change_order_id"
          - "this row's status == APPROVED"
        side_effects:
          - "this row's amount_delta_cents is removed from loan.approved_project_cost_cents before the later delta is applied"
          - "increment ChangeOrder.version by 1"

  - entity: ComplaintCase
    state_field: status
    initial_state: FILED
    terminal_states: [REMEDIED, DISMISSED, SANCTIONED]
    transitions:
      - from: FILED
        to: CONTRACTOR_NOTIFIED
        trigger: "POST /rehab/complaints/{id}/notify"
        actor: ProgramManager
        preconditions:
          - "complaint.status == FILED"
        side_effects:
          - "set remedy_deadline_at = logical clock + REMEDY_WINDOW_DAYS (30 days)"
          - "increment ComplaintCase.version by 1"
      - from: CONTRACTOR_NOTIFIED
        to: REMEDIED
        trigger: "POST /rehab/complaints/{id}/resolve with resolution REMEDIED"
        actor: ProgramManager
        preconditions:
          - "complaint.status == CONTRACTOR_NOTIFIED"
        side_effects:
          - "set resolved_at; contractor.open_complaint_count and performance_score recomputed"
          - "increment ComplaintCase.version by 1"
      - from: CONTRACTOR_NOTIFIED
        to: DISMISSED
        trigger: "POST /rehab/complaints/{id}/resolve with resolution DISMISSED"
        actor: ProgramManager
        preconditions:
          - "complaint.status == CONTRACTOR_NOTIFIED"
        side_effects:
          - "set resolved_at; contractor.open_complaint_count and performance_score recomputed"
          - "increment ComplaintCase.version by 1"
      - from: CONTRACTOR_NOTIFIED
        to: ESCALATED
        trigger: "POST /rehab/complaints/{id}/resolve with resolution ESCALATED"
        actor: ProgramManager
        preconditions:
          - "complaint.status == CONTRACTOR_NOTIFIED"
          - "logical clock is at or after complaint.remedy_deadline_at"
        side_effects:
          - "increment ComplaintCase.version by 1"
      - from: ESCALATED
        to: SANCTIONED
        trigger: "POST /rehab/complaints/{id}/sanction"
        actor: ProgramManager
        preconditions:
          - "complaint.status == ESCALATED"
        side_effects:
          - "set sanction_level and resolved_at"
          - "cascade hop 1: contractor.sanction_count += 1, performance_score recomputed, and approved_list_status driven to PROBATION, SUSPENDED or REMOVED per sanction_level"
          - "cascade hops 2 to 4 of the contractor suspension chain when sanction_level IN {SUSPENSION, REMOVAL}"
          - "increment ComplaintCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version, per §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: write-up-revision-stale-application
    parent_entity: RehabApplication
    write_endpoint: "POST /rehab/write-ups"
    occ_field: "expected_application_version"
    description: |
      Creating a WorkWriteUp against a RehabApplication whose version has
      advanced since the client last observed it is rejected with a stale
      version error. A new write-up legitimately supersedes the application's
      prior APPROVED write-up and regresses workflow_state to INSPECTED, so a
      second create carrying an older observed version would otherwise silently
      discard scope the writer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-order-stale-loan
    parent_entity: RehabLoan
    write_endpoint: "POST /rehab/change-orders"
    occ_field: "expected_loan_version"
    description: |
      Creating a ChangeOrder against a RehabLoan whose version has advanced
      since the client last observed it is rejected with a stale version error.
      A change order may legitimately supersede an earlier approved change
      order and moves approved_project_cost_cents, so a create built on a stale
      view of the loan would compute cumulative_delta_pct from an outdated
      contract amount.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: applicant_annual_income_and_category
    description: |
      Annual household income, the household-adjusted income limit, the AMI
      percentage and the resulting income category for an applicant. Two
      certification methodologies are supported and produce different annual
      income figures from the same household record.
    trigger: "POST /rehab/applicants/{id}/verify-income"
    inputs:
      - "Applicant.wage_income_cents"
      - "Applicant.benefit_income_cents"
      - "Applicant.actual_asset_income_cents"
      - "Applicant.household_assets_cents"
      - "Applicant.household_size"
      - "Applicant.dependents_count"
      - "Applicant.elderly_household"
      - "Applicant.income_calc_method"
      - "ProgramYear.ami_median_income_cents"
    algorithm: threshold
    formula: |
      income_limit_cents = round_half_up(
          program_year.ami_median_income_cents
          * HOUSEHOLD_ADJUSTMENT[min(household_size, 8)])

      if income_calc_method == "PART_5_ANNUAL":
          # HUD Part 5 annual income: gross income from all sources plus
          # imputed asset income; asset income is the GREATER of actual asset
          # income and the passbook imputation, and imputation applies only
          # when household assets exceed the floor.
          if household_assets_cents > ASSET_IMPUTATION_FLOOR_CENTS:
              imputed_cents = round_half_up(household_assets_cents * PASSBOOK_RATE)
              asset_income_cents = max(actual_asset_income_cents, imputed_cents)
          else:
              asset_income_cents = actual_asset_income_cents
          annual_income_cents = (wage_income_cents
                                 + benefit_income_cents
                                 + asset_income_cents)
      else:  # income_calc_method == "IRS_1040_ADJUSTED"
          # IRS 1040 adjusted gross income: benefits are excluded, actual
          # asset income only (never imputed), and dependent / elderly
          # deductions are subtracted, floored at zero.
          deductions_cents = (dependents_count * DEPENDENT_DEDUCTION_CENTS
                              + (ELDERLY_DEDUCTION_CENTS if elderly_household else 0))
          annual_income_cents = max(0,
              wage_income_cents + actual_asset_income_cents - deductions_cents)

      ami_percent = round_half_up_1dp(100 * annual_income_cents / income_limit_cents)

      if   ami_percent <= 30.0: income_category = "EXTREMELY_LOW"
      elif ami_percent <= 50.0: income_category = "VERY_LOW"
      elif ami_percent <= 80.0: income_category = "LOW"
      else:                     income_category = "OVER_INCOME"
    constants:
      HOUSEHOLD_ADJUSTMENT: { 1: 0.70, 2: 0.80, 3: 0.90, 4: 1.00, 5: 1.08, 6: 1.16, 7: 1.24, 8: 1.32 }
      PASSBOOK_RATE: 0.004
      ASSET_IMPUTATION_FLOOR_CENTS: 500000
      DEPENDENT_DEDUCTION_CENTS: 48000
      ELDERLY_DEDUCTION_CENTS: 40000
      EXTREMELY_LOW_AMI_PCT: 30.0
      VERY_LOW_AMI_PCT: 50.0
      LOW_AMI_PCT: 80.0
    precision: "integer cents, round_half_up; ami_percent to 1 decimal place, round_half_up"
    variants:
      - name: PART_5_ANNUAL
        when: "Applicant.income_calc_method == PART_5_ANNUAL"
        difference: "includes benefit_income_cents and imputes asset income at PASSBOOK_RATE when household_assets_cents > ASSET_IMPUTATION_FLOOR_CENTS, taking the greater of actual and imputed; applies no deductions"
      - name: IRS_1040_ADJUSTED
        when: "Applicant.income_calc_method == IRS_1040_ADJUSTED"
        difference: "excludes benefit_income_cents entirely, never imputes asset income, and subtracts DEPENDENT_DEDUCTION_CENTS per dependent plus ELDERLY_DEDUCTION_CENTS for an elderly household, floored at zero"

  - name: work_write_up_estimate
    description: |
      Cost estimate for a work write-up. Each work item's line total is the
      estimated cost inflated by a protocol multiplier that depends on which
      compliance protocols the item triggers; the write-up total then adds a
      flat contingency on the summed base. Priority repair total covers only
      HEALTH_SAFETY and CODE items.
    trigger: "POST /rehab/write-ups/{write_up_id}/submit, and recomputed on POST /rehab/work-items and DELETE /rehab/work-items/{work_item_id}"
    inputs:
      - "WorkItem.estimated_cost_cents"
      - "WorkItem.is_lead_hazard_reduction"
      - "WorkItem.is_historic_sensitive"
      - "WorkItem.priority_class"
    algorithm: aggregation
    formula: |
      # Per item, the protocol multiplier is ADDITIVE across triggered
      # protocols (an item that is both lead-reduction and historic-sensitive
      # carries both surcharges, not their product).
      for each work_item:
          protocol_multiplier = 1.0
          if is_lead_hazard_reduction: protocol_multiplier += LEAD_SAFE_PRACTICE_PCT
          if is_historic_sensitive:    protocol_multiplier += HISTORIC_PRACTICE_PCT
          line_total_cents = round_half_up(estimated_cost_cents * protocol_multiplier)

      # ROUNDING ORDER IS NORMATIVE: round each line first, then sum the
      # rounded lines, then round the contingency on that sum. Summing raw
      # products before rounding is NOT equivalent.
      base_estimate_cents  = sum(line_total_cents for all work items)
      contingency_cents    = round_half_up(base_estimate_cents * CONTINGENCY_PCT)
      total_estimate_cents = base_estimate_cents + contingency_cents

      priority_repair_total_cents = sum(
          line_total_cents for items where priority_class IN {HEALTH_SAFETY, CODE})

      work_item_count = count(work items)
    constants:
      LEAD_SAFE_PRACTICE_PCT: 0.15
      HISTORIC_PRACTICE_PCT: 0.12
      CONTINGENCY_PCT: 0.10
    precision: "integer cents, round_half_up, applied per line then to the contingency"

  - name: bid_tabulation_and_ranking
    description: |
      Responsiveness window around the independent cost estimate, plus the
      ordering of responsive bids used to identify the apparent low bidder.
    trigger: "POST /rehab/bid-solicitations/{id}/tabulate"
    inputs:
      - "BidSolicitation.independent_cost_estimate_cents"
      - "Bid.amount_cents"
      - "Bid.status"
      - "Contractor.approved_list_status"
      - "Contractor.lead_safe_certified"
      - "Contractor.performance_score"
      - "Bid.created_at"
      - "RehabApplication.lead_review_required"
    algorithm: threshold
    formula: |
      ice = solicitation.independent_cost_estimate_cents
      responsive_ceiling_cents = round_half_up(ice * (1 + BID_CEILING_PCT))
      responsive_floor_cents   = round_half_up(ice * (1 - BID_FLOOR_PCT))

      # Input set: only bids of this solicitation with status == SUBMITTED are
      # classified. Bids in WITHDRAWN_BY_PROGRAM or REJECTED are excluded.
      for each bid in SUBMITTED:
          if bid.amount_cents > responsive_ceiling_cents:
              status = NON_RESPONSIVE; reason = OVER_CEILING
          elif bid.amount_cents < responsive_floor_cents:
              status = NON_RESPONSIVE; reason = UNDER_FLOOR
          elif bid.contractor.approved_list_status != "APPROVED":
              status = NON_RESPONSIVE; reason = CONTRACTOR_NOT_APPROVED
          elif application.lead_review_required and not bid.contractor.lead_safe_certified:
              status = NON_RESPONSIVE; reason = NOT_LEAD_CERTIFIED
          else:
              status = RESPONSIVE

      # Boundary semantics: a bid exactly AT the ceiling or exactly AT the
      # floor is RESPONSIVE (inclusive window).

      # Ranking of responsive bids, rank starting at 1:
      #   1. amount_cents ascending
      #   2. tie -> contractor.performance_score descending
      #   3. tie -> bid.created_at ascending
      responsive_bid_count = count(responsive bids)
      bid_count = count(bids of this solicitation with status IN {SUBMITTED, RESPONSIVE, NON_RESPONSIVE})
    constants:
      BID_CEILING_PCT: 0.10
      BID_FLOOR_PCT: 0.25
    precision: "integer cents, round_half_up; ranks are 1-based integers"

  - name: loan_structuring
    description: |
      Loan principal, lien recording fee and monthly payment. The recording
      fee is itself tiered on the project cost and is financed into the
      principal, and the principal is then capped by the program-year maximum.
    trigger: "POST /rehab/loans"
    inputs:
      - "Bid.amount_cents (awarded bid)"
      - "RehabLoan.structure_type"
      - "RehabLoan.interest_rate_bps"
      - "RehabLoan.term_months"
      - "ProgramYear.max_loan_amount_cents"
    algorithm: tiered_pricing
    formula: |
      approved_project_cost_cents = awarded_bid.amount_cents

      # Tiered recording fee on the PRE-FEE project cost. The tier is chosen
      # once from approved_project_cost_cents and is NOT recomputed after the
      # fee is added to the principal, and NOT recomputed if the cap binds.
      cost = approved_project_cost_cents
      if   cost <= FEE_TIER_1_CEILING_CENTS: lien_recording_fee_cents = FEE_TIER_1_CENTS
      elif cost <= FEE_TIER_2_CEILING_CENTS: lien_recording_fee_cents = FEE_TIER_2_CENTS
      else:                                  lien_recording_fee_cents = FEE_TIER_3_CENTS

      principal_cents = min(approved_project_cost_cents + lien_recording_fee_cents,
                            program_year.max_loan_amount_cents)

      if structure_type == "AMORTIZING":
          if interest_rate_bps == 0:
              monthly_payment_cents = round_half_up(principal_cents / term_months)
          else:
              i = interest_rate_bps / 120000        # monthly rate as a decimal
              f = (1 + i) ** term_months
              monthly_payment_cents = round_half_up(principal_cents * i * f / (f - 1))
          forgiveness_term_months = 0
      elif structure_type == "DEFERRED":
          monthly_payment_cents = 0
          forgiveness_term_months = 0
      else:  # FORGIVABLE
          monthly_payment_cents = 0
          forgiveness_term_months = request forgiveness_term_months
    constants:
      FEE_TIER_1_CEILING_CENTS: 2000000
      FEE_TIER_1_CENTS: 15000
      FEE_TIER_2_CEILING_CENTS: 5000000
      FEE_TIER_2_CENTS: 25000
      FEE_TIER_3_CENTS: 40000
    precision: "integer cents, round_half_up; the annuity is evaluated in full precision and rounded once"

  - name: change_order_cumulative_delta
    description: |
      Cumulative change-order exposure on a loan as a percentage of the
      originally approved project cost, used to gate change-order approval.
    trigger: "POST /rehab/change-orders/{id}/approve"
    inputs:
      - "ChangeOrder.amount_delta_cents"
      - "ChangeOrder.status"
      - "ChangeOrder.supersedes_change_order_id"
      - "RehabLoan.awarded_bid_amount_cents"
    algorithm: aggregation
    formula: |
      # Input set: this change order plus every APPROVED change order on the
      # same loan, EXCLUDING any change order that this one supersedes
      # (transitively, following supersedes_change_order_id) because a
      # superseded delta is backed out before the new delta is applied.
      superseded = transitive closure of supersedes_change_order_id from this order
      prior_delta_cents = sum(amount_delta_cents
                              for approved orders on this loan not in superseded)
      cumulative_delta_cents = prior_delta_cents + this.amount_delta_cents
      cumulative_delta_pct = round_half_up_2dp(
          100 * cumulative_delta_cents / loan.awarded_bid_amount_cents)

      # Gate: cumulative_delta_pct > CHANGE_ORDER_CUMULATIVE_LIMIT_PCT is
      # rejected with ERR_CHANGE_ORDER_EXCEEDS_LIMIT. Exactly AT the limit is
      # allowed.
    constants:
      CHANGE_ORDER_CUMULATIVE_LIMIT_PCT: 20.00
    precision: "integer cents; cumulative_delta_pct to 2 decimal places, round_half_up"

  - name: draw_payment_and_retainage
    description: |
      Retainage withheld from a construction draw and the net payment to the
      contractor, including release of accumulated retainage on the final draw.
    trigger: "POST /rehab/draw-requests/{id}/approve"
    inputs:
      - "DrawRequest.requested_amount_cents"
      - "DrawRequest.is_final_draw"
      - "RehabLoan.retainage_held_cents"
      - "RehabLoan.contract_earned_cents"
      - "RehabLoan.approved_project_cost_cents"
    algorithm: aggregation
    formula: |
      approved_amount_cents = requested_amount_cents

      if is_final_draw:
          # No new retainage is withheld and all previously held retainage is
          # released with this payment.
          retainage_cents   = 0
          net_payment_cents = approved_amount_cents + loan.retainage_held_cents
      else:
          retainage_cents   = round_half_up(approved_amount_cents * RETAINAGE_PCT)
          net_payment_cents = approved_amount_cents - retainage_cents

      # Ledger effects at payment time (POST /rehab/draw-requests/{id}/pay):
      #   loan.contract_earned_cents += approved_amount_cents
      #   loan.retainage_held_cents  += retainage_cents, or set to 0 on final
      #   loan.disbursed_cents       += net_payment_cents
      # Conserved: contract_earned_cents + lien_recording_fee_cents
      #            == disbursed_cents + retainage_held_cents
    constants:
      RETAINAGE_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: recapture_amount
    description: |
      Forgiveness earned to date on a forgivable loan, and the amount
      recaptured when the property is sold or otherwise transferred. Sale and
      transfer apply different recapture bases.
    trigger: "POST /rehab/loans/{id}/recapture"
    inputs:
      - "RehabLoan.principal_cents"
      - "RehabLoan.forgiveness_term_months"
      - "RehabLoan.forgiveness_start_date"
      - "RehabLoan.principal_repaid_cents"
      - "RehabApplication.senior_lien_balance_cents"
      - "request recapture_event_type"
      - "request recapture_event_date"
      - "request sale_price_cents"
      - "request closing_costs_cents"
      - "request homeowner_investment_cents"
    algorithm: threshold
    formula: |
      elapsed_months = whole calendar months from forgiveness_start_date
                       to recapture_event_date (truncated, never negative)
      if forgiveness_term_months == 0:
          forgiven_cents = 0
      elif elapsed_months >= forgiveness_term_months:
          forgiven_cents = principal_cents
      else:
          forgiven_cents = round_half_up(
              principal_cents * elapsed_months / forgiveness_term_months)

      unforgiven_balance_cents = max(0,
          principal_cents - forgiven_cents - principal_repaid_cents)

      if recapture_event_type == "SALE":
          # Shared-net-proceeds recapture: the program collects only from net
          # proceeds available at closing.
          net_proceeds_cents = max(0, sale_price_cents
                                      - application.senior_lien_balance_cents
                                      - closing_costs_cents
                                      - homeowner_investment_cents)
          recapture_amount_cents = min(unforgiven_balance_cents, net_proceeds_cents)
      else:  # TRANSFER, REFINANCE or RENTAL_CONVERSION (no sale proceeds exist)
          # Full unforgiven balance is due; there are no proceeds to share.
          net_proceeds_cents = 0
          recapture_amount_cents = unforgiven_balance_cents

      shortfall_forgiven_cents = unforgiven_balance_cents - recapture_amount_cents
      program_income_posted_cents = recapture_amount_cents
      # Conserved: forgiven_cents + principal_repaid_cents
      #            + recapture_amount_cents + shortfall_forgiven_cents
      #            == principal_cents
    precision: "integer cents, round_half_up"
    variants:
      - name: SALE
        when: "request recapture_event_type == SALE"
        difference: "recapture is capped at net proceeds computed from sale price less senior liens, closing costs and homeowner investment; any remainder becomes shortfall_forgiven_cents"
      - name: TRANSFER
        when: "request recapture_event_type IN {TRANSFER, REFINANCE, RENTAL_CONVERSION}"
        difference: "net_proceeds_cents is 0 and the entire unforgiven_balance_cents is recaptured regardless of proceeds; shortfall_forgiven_cents is always 0"

  - name: contractor_performance_score
    description: |
      Approved-list performance score for a contractor, recomputed whenever a
      complaint, sanction or completion is recorded. Drives automatic demotion
      from the approved list.
    trigger: "POST /rehab/complaints, POST /rehab/complaints/{id}/resolve, POST /rehab/complaints/{id}/sanction, POST /rehab/loans/{id}/close-out"
    inputs:
      - "ComplaintCase.status (per contractor)"
      - "Contractor.sanction_count"
      - "Contractor.on_time_completion_count"
    algorithm: weighted_scoring
    formula: |
      # Input set: complaints of this contractor whose status IN
      # {FILED, CONTRACTOR_NOTIFIED, ESCALATED} count as open.
      open_complaint_count = count(open complaints for this contractor)

      raw = (BASE_SCORE
             - OPEN_COMPLAINT_WEIGHT * open_complaint_count
             - SANCTION_WEIGHT * sanction_count
             + COMPLETION_WEIGHT * min(on_time_completion_count, COMPLETION_CAP))
      performance_score = clamp(raw, 0, 100)

      # Automatic demotion: when performance_score < PROBATION_SCORE_THRESHOLD
      # and approved_list_status == APPROVED, the contractor is moved to
      # PROBATION in the same request. Automatic promotion never happens; only
      # POST /rehab/contractors/{id}/status can restore APPROVED.
    constants:
      BASE_SCORE: 100
      OPEN_COMPLAINT_WEIGHT: 20
      SANCTION_WEIGHT: 15
      COMPLETION_WEIGHT: 5
      COMPLETION_CAP: 4
      PROBATION_SCORE_THRESHOLD: 50
    precision: "integer score in the closed range 0 to 100"

  - name: program_year_budget_rollup
    description: |
      Program-year ledger. Allocation plus program income is conserved across
      the uncommitted, committed and disbursed buckets at every point in time.
    trigger: "recomputed on POST /rehab/loans/{id}/record-lien, POST /rehab/draw-requests/{id}/pay, POST /rehab/change-orders/{id}/approve, POST /rehab/loans/{id}/close-out, POST /rehab/loans/{id}/recapture"
    inputs:
      - "ProgramYear.allocation_budget_cents"
      - "ProgramYear.program_income_balance_cents"
      - "RehabLoan.principal_cents"
      - "RehabLoan.disbursed_cents"
    algorithm: aggregation
    formula: |
      committed_amount_cents = sum over loans with status IN
          {LIEN_RECORDED, DISBURSING, FULLY_DISBURSED} of
          (principal_cents - disbursed_cents)
      disbursed_amount_cents = sum over all loans of disbursed_cents
      uncommitted_amount_cents = (allocation_budget_cents
                                  + program_income_balance_cents
                                  - committed_amount_cents
                                  - disbursed_amount_cents)

      # INVARIANT (must hold after every write):
      #   allocation_budget_cents + program_income_balance_cents
      #     == uncommitted_amount_cents + committed_amount_cents
      #        + disbursed_amount_cents
      #
      # Recording a lien moves principal_cents from uncommitted to committed.
      # Paying a draw moves net_payment_cents from committed to disbursed.
      # Approving a change order shifts the principal delta between
      # uncommitted and committed. Closing out a partially disbursed loan
      # releases (principal_cents - disbursed_cents) back to uncommitted.
      # Recapture raises program_income_balance_cents and therefore
      # uncommitted_amount_cents by the same amount.
    precision: "integer cents; no rounding occurs, only addition and subtraction"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order; the
# first violated rule determines the response and short-circuits the rest)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role defined in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "A missing, empty or unrecognised X-User-Role header is rejected before any other processing."
  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role authorization is decided from the endpoint table alone, before any row is loaded, so a forbidden role cannot probe for existence."
  - priority: 3
    category: auth
    check: "when the caller's role is Applicant, X-User-ID equals the Applicant row that owns the addressed RehabApplication, WorkWriteUp, RehabLoan or ComplaintCase; when the caller's role is Contractor, X-User-ID equals the Contractor row referenced by the addressed Bid, DrawRequest or ComplaintCase"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to:
      - "GET /rehab/applications/{application_id}"
      - "GET /rehab/loans/{loan_id}"
      - "POST /rehab/bids"
      - "POST /rehab/draw-requests"
      - "GET /rehab/complaints/{complaint_id}"
    description: "Entity-backed roles are scoped to their own rows; an applicant or contractor addressing another party's record is refused without revealing whether it exists."
  - priority: 4
    category: existence
    check: "every id in the request path resolves to an existing row"
    error_id: "ERR_PROGRAM_YEAR_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_WRITE_UP_NOT_FOUND | ERR_WORK_ITEM_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_DRAW_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "The error id is selected by the entity the missing path segment addresses. Path ids are resolved left to right, so a bad parent id is reported before a bad child id."
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_PROGRAM_YEAR_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_WRITE_UP_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_DRAW_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys in the request body"
    description: "Body foreign keys are resolved in the order they appear in the endpoint's input list."
  - priority: 6
    category: validation
    check: "required fields are present, types and enum members are valid, integers are non-negative where the field is a money or count field, and date ranges satisfy start <= end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Schema-level validation. Includes scheduled_start_at < scheduled_end_at on inspections, proposed_start_date <= proposed_end_date on bids, term_months >= 1 for AMORTIZING loans, and household_size >= 1."
  - priority: 7
    category: concurrency
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to:
      - "POST /rehab/write-ups"
      - "POST /rehab/change-orders"
    description: "Optimistic concurrency control per §1.2.1. The parent row is read, its version compared, and the write refused when the client's observed version is behind."
  - priority: 8
    category: state
    check: "the addressed entity is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    description: "Covers repeat triggers on terminal rows, out-of-order workflow steps such as creating a loan before the solicitation is AWARDED or a second loan for the same application, paying a draw whose loan is not LIEN_RECORDED or DISBURSING, and closing out a loan while retainage_held_cents > 0. Draw APPROVAL is carved out of this generic rule: its state gate is the more specific cross-entity rule at priority 13, which is what a draw in SUBMITTED or INSPECTION_FAILED returns."
  - priority: 9
    category: state
    check: "the referenced Applicant has eligibility_status == INCOME_VERIFIED"
    error_id: ERR_INCOME_NOT_VERIFIED
    http_status: 409
    applies_to:
      - "POST /rehab/applications"
    description: "An application cannot be intaken for an applicant whose income has not yet been certified."
  - priority: 10
    category: state
    check: "the RehabApplication has ownership_verification_status == VERIFIED"
    error_id: ERR_OWNERSHIP_NOT_VERIFIED
    http_status: 409
    applies_to:
      - "POST /rehab/inspections"
      - "POST /rehab/write-ups"
    description: "Property standards inspection and work write-up preparation both require verified ownership of record."
  - priority: 11
    category: state
    check: "when the RehabApplication requires the lead protocol, its compliance_posture is not LEAD_HOLD or DUAL_HOLD"
    error_id: ERR_LEAD_CLEARANCE_REQUIRED
    http_status: 409
    applies_to:
      - "POST /rehab/loans/{loan_id}/record-lien"
      - "POST /rehab/draw-requests/{draw_request_id}/approve"
    description: "Lead-based paint clearance gates both lien recording and every subsequent draw approval, including draws after an approved change order re-opened the lead hold."
  - priority: 12
    category: state
    check: "when the RehabApplication requires historic review, its compliance_posture is not HISTORIC_HOLD, DUAL_HOLD or ADVERSE_EFFECT_BLOCKED"
    error_id: ERR_HISTORIC_CLEARANCE_REQUIRED
    http_status: 409
    applies_to:
      - "POST /rehab/loans/{loan_id}/record-lien"
    description: "A SHPO determination of ADVERSE_EFFECT permanently blocks lien recording; an unfinished review blocks it until the determination is recorded."
  - priority: 13
    category: state
    check: "the addressed draw is in INSPECTION_PASSED, which the system reaches only from a PropertyInspection with inspection_type == DRAW, draw_request_id == the addressed draw and result == PASS"
    error_id: ERR_DRAW_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to:
      - "POST /rehab/draw-requests/{draw_request_id}/approve"
    description: "Cross-entity state dependency: approving a draw in SUBMITTED (never inspected) or INSPECTION_FAILED (inspection recorded FAIL) returns this error rather than the generic ERR_INVALID_STATE, because the gate is the state of the sibling PropertyInspection row, not the draw itself."
  - priority: 14
    category: state
    check: "the RehabLoan has lien_recorded_at set and status IN {LIEN_RECORDED, DISBURSING}"
    error_id: ERR_LIEN_NOT_RECORDED
    http_status: 409
    applies_to:
      - "POST /rehab/draw-requests"
      - "POST /rehab/change-orders"
    description: "No construction money moves and no scope changes are accepted before the lien secures the loan."
  - priority: 15
    category: business_safety
    check: "the approving user is different from the user who performed the preceding step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /rehab/write-ups/{write_up_id}/approve"
      - "POST /rehab/draw-requests/{draw_request_id}/approve"
    description: "Segregation of duties. On write-up approval X-User-ID must differ from write_up.prepared_by_user_id; on draw approval X-User-ID must differ from the performed_by_user_id of the DRAW inspection that passed the draw."
  - priority: 16
    category: business_temporal
    check: "the requested inspection window does not overlap another SCHEDULED or COMPLETED inspection on the same RehabApplication"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to:
      - "POST /rehab/inspections"
    description: "Half-open interval semantics [scheduled_start_at, scheduled_end_at): a new window that starts exactly when an existing window ends is accepted; any interior overlap is refused."
  - priority: 17
    category: business_temporal
    check: "the logical clock is strictly before solicitation.bid_due_at"
    error_id: ERR_BID_WINDOW_CLOSED
    http_status: 409
    applies_to:
      - "POST /rehab/bids"
    description: "Bids received at or after the due instant are refused. A bid submitted exactly at bid_due_at is late."
  - priority: 18
    category: business_temporal
    check: "the awarded bid's construction window, inflated by CREW_TURNOVER_BUFFER_DAYS on both ends, leaves the contractor with no more than MAX_CONCURRENT_AWARDS overlapping awards"
    error_id: ERR_CONTRACTOR_CAPACITY_CONFLICT
    http_status: 409
    applies_to:
      - "POST /rehab/bid-solicitations/{solicitation_id}/award"
    description: "Closed interval semantics on inclusive dates, inflated by a crew turnover buffer of CREW_TURNOVER_BUFFER_DAYS = 3 days at each end; touching windows conflict. Compared against AWARDED bids of the same contractor whose application is not CLOSED. MAX_CONCURRENT_AWARDS = 1."
  - priority: 19
    category: business_temporal
    check: "the logical clock is at or before application.warranty_expires_at"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to:
      - "POST /rehab/complaints"
    description: "Warranty enforcement window: a defect complaint filed exactly at warranty_expires_at is still accepted; one instant later is refused."
  - priority: 20
    category: business_fiscal
    check: "the awarded bid amount does not exceed program_year.max_loan_amount_cents"
    error_id: ERR_LOAN_LIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /rehab/loans"
    description: "The program-year maximum absorbs the financed recording fee, so a project cost at or below the maximum is structured with a capped principal, but a project cost above the maximum cannot be financed at all."
  - priority: 21
    category: business_fiscal
    check: "program_year.uncommitted_amount_cents is at least the amount about to be committed"
    error_id: ERR_ALLOCATION_INSUFFICIENT
    http_status: 409
    applies_to:
      - "POST /rehab/loans/{loan_id}/record-lien"
      - "POST /rehab/change-orders/{change_order_id}/approve"
    description: "Commitments may never exceed the allocation plus posted program income. Recording a lien commits principal_cents; approving a positive change order commits the principal delta."
  - priority: 22
    category: business_fiscal
    check: "requested_amount_cents <= loan.approved_project_cost_cents - loan.contract_earned_cents"
    error_id: ERR_DRAW_EXCEEDS_CONTRACT_BALANCE
    http_status: 422
    applies_to:
      - "POST /rehab/draw-requests/{draw_request_id}/approve"
    description: "Cumulative draws may not exceed the approved construction contract. A draw for exactly the remaining balance is allowed."
  - priority: 23
    category: business_fiscal
    check: "cumulative_delta_pct <= CHANGE_ORDER_CUMULATIVE_LIMIT_PCT"
    error_id: ERR_CHANGE_ORDER_EXCEEDS_LIMIT
    http_status: 422
    applies_to:
      - "POST /rehab/change-orders/{change_order_id}/approve"
    description: "Aggregate validation: each change order may be individually modest while the running total exceeds 20.00 percent of the awarded contract. A cumulative total exactly at the limit is approved."
  - priority: 24
    category: business_constraint
    check: "the contractor has no existing Bid on this solicitation in status IN {SUBMITTED, RESPONSIVE, NON_RESPONSIVE, AWARDED}"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to:
      - "POST /rehab/bids"
    description: "One live bid per contractor per solicitation. Bids that were REJECTED by a reopen or WITHDRAWN_BY_PROGRAM do not block a fresh bid."
  - priority: 25
    category: business_constraint
    check: "solicitation.bid_count >= solicitation.min_bids_required"
    error_id: ERR_INSUFFICIENT_BIDS
    http_status: 409
    applies_to:
      - "POST /rehab/bid-solicitations/{solicitation_id}/tabulate"
    description: "Tabulation requires the minimum number of bids to have been received. The solicitation stays OPEN so more bids can arrive; this is distinct from a tabulation that finds every received bid non-responsive."
  - priority: 26
    category: business_constraint
    check: "the bid selected for award has status == RESPONSIVE"
    error_id: ERR_BID_NOT_RESPONSIVE
    http_status: 422
    applies_to:
      - "POST /rehab/bid-solicitations/{solicitation_id}/award"
    description: "A NON_RESPONSIVE, REJECTED or WITHDRAWN_BY_PROGRAM bid can never be awarded, and the bid must belong to the addressed solicitation."
  - priority: 27
    category: business_constraint
    check: "the winning bid's contractor has approved_list_status == APPROVED"
    error_id: ERR_CONTRACTOR_NOT_APPROVED
    http_status: 422
    applies_to:
      - "POST /rehab/bid-solicitations/{solicitation_id}/award"
    description: "Cross-entity state dependency: awards may only go to a contractor currently on the approved list, so a contractor demoted to PROBATION, SUSPENDED or REMOVED after bidding cannot be awarded."
  - priority: 28
    category: business_constraint
    check: "when application.lead_review_required, the winning bid's contractor has lead_safe_certified == true"
    error_id: ERR_CONTRACTOR_NOT_LEAD_CERTIFIED
    http_status: 422
    applies_to:
      - "POST /rehab/bid-solicitations/{solicitation_id}/award"
    description: "Conditional validation: the certification requirement exists only for pre-1978 dwellings that triggered the lead protocol."
  - priority: 29
    category: business_constraint
    check: "the write-up has work_item_count >= 1"
    error_id: ERR_WRITE_UP_EMPTY
    http_status: 422
    applies_to:
      - "POST /rehab/write-ups/{write_up_id}/submit"
    description: "An empty scope of work cannot be submitted for approval."
  - priority: 30
    category: business_constraint
    check: "the approved write-up has priority_repair_total_cents > 0"
    error_id: ERR_PRIORITY_REPAIRS_NOT_ADDRESSED
    http_status: 422
    applies_to:
      - "POST /rehab/write-ups/{write_up_id}/submit"
      - "POST /rehab/bid-solicitations"
    description: "Program rules require the scope to address at least one HEALTH_SAFETY or CODE repair before it can be submitted or bid."
  - priority: 31
    category: business_constraint
    check: "the referenced Applicant has income_category IN {EXTREMELY_LOW, VERY_LOW, LOW}"
    error_id: ERR_APPLICANT_OVER_INCOME
    http_status: 422
    applies_to:
      - "POST /rehab/applications"
    description: "Households certified above 80.0 percent of the household-adjusted area median income are not eligible for assistance."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock -----------------------------------------------------
  - method: POST
    path: "/rehab/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock to an explicit UTC instant. Before any
      call to this endpoint the logical clock reads exactly
      2026-08-01T00:00:00Z, which is the mandatory startup default; the server
      never falls back to real wall-clock time. Every deadline, warranty
      window, bid due instant and forgiveness elapsed-month computation is
      evaluated against this logical clock.
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: [now]
    output: { now: datetime }
    side_effects: []

  # --- ProgramYear ------------------------------------------------------------
  - method: POST
    path: "/rehab/program-years"
    description: "Opens a CDBG program year with its area median income figure, per-unit maximum and annual allocation."
    roles: [ProgramManager]
    code: 201
    input: [fiscal_year, ami_median_income_cents, max_loan_amount_cents, allocation_budget_cents]
    output: ProgramYear
    side_effects:
      - "initialises committed_amount_cents, disbursed_amount_cents and program_income_balance_cents to 0"
      - "sets uncommitted_amount_cents = allocation_budget_cents per calculations.program_year_budget_rollup"
  - method: GET
    path: "/rehab/program-years/{program_year_id}"
    description: "Reads one program year including its live budget ledger."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: []
    output: ProgramYear
    side_effects: []
  - method: GET
    path: "/rehab/program-years"
    description: "Lists program years."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: ProgramYear[]
    side_effects: []

  # --- Applicant --------------------------------------------------------------
  - method: POST
    path: "/rehab/applicants"
    description: "Registers a household applying to the program, capturing the income sources and the certification methodology to be used."
    roles: [IntakeSpecialist]
    code: 201
    input: [program_year_id, full_name, email, household_size, income_calc_method, wage_income_cents, "benefit_income_cents?", "actual_asset_income_cents?", "household_assets_cents?", "dependents_count?", "elderly_household?"]
    output: Applicant
    side_effects:
      - "sets eligibility_status = APPLIED"
      - "leaves annual_income_cents, income_limit_cents, ami_percent and income_category null until income verification runs"
  - method: PATCH
    path: "/rehab/applicants/{applicant_id}"
    description: "Corrects a household's declared income figures or switches the certification methodology before income is verified."
    roles: [IntakeSpecialist]
    code: 200
    input: ["income_calc_method?", "wage_income_cents?", "benefit_income_cents?", "actual_asset_income_cents?", "household_assets_cents?", "household_size?", "dependents_count?", "elderly_household?"]
    output: Applicant
    side_effects:
      - "rejected with ERR_INVALID_STATE unless eligibility_status == APPLIED"
      - "increments Applicant.version by 1"
  - method: POST
    path: "/rehab/applicants/{applicant_id}/verify-income"
    description: "Certifies household income using the applicant's declared methodology and records the resulting category."
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: Applicant
    side_effects:
      - "runs calculations.applicant_annual_income_and_category and stores annual_income_cents, income_limit_cents, ami_percent, income_category"
      - "sets eligibility_status = INCOME_VERIFIED, or INELIGIBLE when income_category == OVER_INCOME"
      - "sets verified_by_user_id = X-User-ID"
  - method: GET
    path: "/rehab/applicants/{applicant_id}"
    description: "Reads one applicant with its certified income figures."
    roles: [IntakeSpecialist, RehabSpecialist, LoanOfficer, ProgramManager]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/rehab/applicants"
    description: "Lists applicants, optionally filtered by program year, eligibility status or income category."
    roles: [IntakeSpecialist, RehabSpecialist, LoanOfficer, ProgramManager]
    code: 200
    input: ["program_year_id?", "eligibility_status?", "income_category?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  # --- RehabApplication -------------------------------------------------------
  - method: POST
    path: "/rehab/applications"
    description: "Intakes a rehabilitation application for a verified-income household at a specific dwelling."
    roles: [IntakeSpecialist]
    code: 201
    input: [applicant_id, address_line1, city, state_code, year_built, assessed_value_cents, senior_lien_balance_cents, historic_district, occupancy_type, ownership_doc_type]
    output: RehabApplication
    side_effects:
      - "copies program_year_id from the applicant"
      - "computes lead_review_required = (year_built < 1978) and historic_review_required = historic_district"
      - "computes compliance_posture as DUAL_HOLD, LEAD_HOLD, HISTORIC_HOLD or CLEAR from those two flags"
      - "sets workflow_state = INTAKE and ownership_verification_status = PENDING"
  - method: POST
    path: "/rehab/applications/{application_id}/verify-ownership"
    description: "Records the title examination result and the recorded deed date, deciding whether the household holds an eligible ownership interest."
    roles: [IntakeSpecialist]
    code: 200
    input: [deed_recorded_date, title_report_clear]
    output: RehabApplication
    side_effects:
      - "sets ownership_verification_status = VERIFIED and workflow_state = OWNERSHIP_VERIFIED on a clear title with an eligible deed type"
      - "sets ownership_verification_status = REJECTED and workflow_state = DENIED otherwise"
      - "increments RehabApplication.version by 1"
  - method: POST
    path: "/rehab/applications/{application_id}/lead-clearance"
    description: "Records completion of the lead-based paint risk assessment and the hazard control method chosen, clearing the lead axis of the compliance posture."
    roles: [Inspector]
    code: 200
    input: [risk_assessment_completed, hazard_control_method]
    output: RehabApplication
    side_effects:
      - "sets lead_hazard_control_method"
      - "advances compliance_posture DUAL_HOLD -> HISTORIC_HOLD or LEAD_HOLD -> CLEARED_WITH_PROTOCOL"
      - "increments RehabApplication.version by 1"
  - method: POST
    path: "/rehab/applications/{application_id}/historic-clearance"
    description: "Records the State Historic Preservation Office determination, clearing or permanently blocking the historic axis of the compliance posture."
    roles: [ProgramManager]
    code: 200
    input: [shpo_review_outcome]
    output: RehabApplication
    side_effects:
      - "sets shpo_review_outcome"
      - "advances compliance_posture DUAL_HOLD -> LEAD_HOLD, HISTORIC_HOLD -> CLEARED_WITH_PROTOCOL or HISTORIC_HOLD -> CLEAR"
      - "sets compliance_posture = ADVERSE_EFFECT_BLOCKED when the outcome is ADVERSE_EFFECT"
      - "increments RehabApplication.version by 1"
  - method: GET
    path: "/rehab/applications/{application_id}"
    description: "Reads one rehabilitation application including both state axes."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Applicant]
    code: 200
    input: []
    output: RehabApplication
    side_effects: []
  - method: GET
    path: "/rehab/applications"
    description: "Lists rehabilitation applications, optionally filtered by household, program year, awarded contractor, workflow state or compliance posture."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["applicant_id?", "program_year_id?", "awarded_contractor_id?", "workflow_state?", "compliance_posture?", "limit?", "offset?"]
    output: RehabApplication[]
    side_effects: []

  # --- PropertyInspection -----------------------------------------------------
  - method: POST
    path: "/rehab/inspections"
    description: "Reserves an inspection window on a dwelling for an initial property standards visit, a construction draw inspection or the final inspection."
    roles: [Inspector]
    code: 201
    input: [application_id, inspection_type, scheduled_start_at, scheduled_end_at, "draw_request_id?"]
    output: PropertyInspection
    side_effects:
      - "sets performed_by_user_id = X-User-ID and status = SCHEDULED"
      - "rejects windows that overlap another inspection on the same application per validations priority 16"
  - method: POST
    path: "/rehab/inspections/{inspection_id}/record-result"
    description: "Records the finding of a completed site visit, including deficiency count and any XRF lead reading."
    roles: [Inspector]
    code: 200
    input: [result, deficiency_count, "xrf_reading_mg_cm2?"]
    output: PropertyInspection
    side_effects:
      - "sets status = COMPLETED, result, deficiency_count, xrf_reading_mg_cm2 and lead_hazard_present = (xrf_reading_mg_cm2 >= 1.00)"
      - "for INITIAL_STANDARDS drives RehabApplication OWNERSHIP_VERIFIED -> INSPECTED, or -> DENIED when deficiency_count == 0, and sets lead_hazard_detected when the XRF reading is at or above the action level"
      - "for DRAW drives the linked DrawRequest to INSPECTION_PASSED or INSPECTION_FAILED"
      - "increments PropertyInspection.version by 1"
  - method: GET
    path: "/rehab/inspections/{inspection_id}"
    description: "Reads one inspection record."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: []
    output: PropertyInspection
    side_effects: []
  - method: GET
    path: "/rehab/inspections"
    description: "Lists inspections, optionally filtered by application, draw request, type or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["application_id?", "draw_request_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: PropertyInspection[]
    side_effects: []

  # --- WorkWriteUp ------------------------------------------------------------
  - method: POST
    path: "/rehab/write-ups"
    description: "Opens a new work write-up revision for an application. A second revision supersedes the approved one and returns the application to INSPECTED, so the caller must present the application version it last observed."
    roles: [RehabSpecialist]
    code: 201
    input: [application_id, expected_application_version, "revision_reason?"]
    output: WorkWriteUp
    side_effects:
      - "sets state = DRAFT, prepared_by_user_id = X-User-ID and revision_number = prior revision_number + 1"
      - "transitions any APPROVED write-up of the same application to SUPERSEDED and drives RehabApplication WRITEUP_APPROVED -> INSPECTED"
      - "increments RehabApplication.version by 1"
  - method: POST
    path: "/rehab/write-ups/{write_up_id}/submit"
    description: "Submits a drafted or revised scope of work for program review, freezing its cost estimate."
    roles: [RehabSpecialist]
    code: 200
    input: []
    output: WorkWriteUp
    side_effects:
      - "runs calculations.work_write_up_estimate and stores base_estimate_cents, contingency_cents, total_estimate_cents, priority_repair_total_cents, work_item_count"
      - "sets state = SUBMITTED"
      - "increments WorkWriteUp.version by 1"
  - method: POST
    path: "/rehab/write-ups/{write_up_id}/request-revision"
    description: "Returns a submitted scope of work to the rehabilitation specialist for correction."
    roles: [ProgramManager]
    code: 200
    input: [revision_note]
    output: WorkWriteUp
    side_effects:
      - "sets state = REVISION_REQUESTED"
      - "increments WorkWriteUp.version by 1"
  - method: POST
    path: "/rehab/write-ups/{write_up_id}/approve"
    description: "Approves a submitted scope of work. The approver may not be the preparer."
    roles: [ProgramManager]
    code: 200
    input: []
    output: WorkWriteUp
    side_effects:
      - "sets state = APPROVED and approved_by_user_id = X-User-ID"
      - "drives RehabApplication INSPECTED -> WRITEUP_APPROVED"
      - "increments WorkWriteUp.version by 1"
  - method: GET
    path: "/rehab/write-ups/{write_up_id}"
    description: "Reads one work write-up revision with its estimate roll-up."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Applicant]
    code: 200
    input: []
    output: WorkWriteUp
    side_effects: []
  - method: GET
    path: "/rehab/write-ups"
    description: "Lists work write-up revisions, optionally filtered by application or state."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["application_id?", "state?", "limit?", "offset?"]
    output: WorkWriteUp[]
    side_effects: []

  # --- WorkItem ---------------------------------------------------------------
  - method: POST
    path: "/rehab/work-items"
    description: "Adds one repair line to a write-up that is still DRAFT or REVISION_REQUESTED, loading it with any applicable compliance work-practice uplift."
    roles: [RehabSpecialist]
    code: 201
    input: [write_up_id, description, category, priority_class, estimated_cost_cents, "is_lead_hazard_reduction?", "is_historic_sensitive?"]
    output: WorkItem
    side_effects:
      - "computes protocol_multiplier and line_total_cents per calculations.work_write_up_estimate"
      - "recomputes the parent write-up's work_item_count, base_estimate_cents, contingency_cents, total_estimate_cents and priority_repair_total_cents"
      - "increments WorkWriteUp.version by 1"
  - method: DELETE
    path: "/rehab/work-items/{work_item_id}"
    description: "Removes a repair line from a write-up that is still DRAFT or REVISION_REQUESTED."
    roles: [RehabSpecialist]
    code: 204
    input: []
    output: null
    side_effects:
      - "recomputes the parent write-up's work_item_count and all estimate fields"
      - "increments WorkWriteUp.version by 1"
  - method: GET
    path: "/rehab/work-items/{work_item_id}"
    description: "Reads one repair line with its computed protocol multiplier and line total."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: []
    output: WorkItem
    side_effects: []
  - method: GET
    path: "/rehab/work-items"
    description: "Lists repair lines, optionally filtered by write-up revision or priority class."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: ["write_up_id?", "priority_class?", "limit?", "offset?"]
    output: WorkItem[]
    side_effects: []

  # --- Contractor -------------------------------------------------------------
  - method: POST
    path: "/rehab/contractors"
    description: "Adds a contractor to the program's approved list with its licence, insurance and certification profile."
    roles: [ProgramManager]
    code: 201
    input: [legal_name, license_number, insurance_expires_on, "lead_safe_certified?", "historic_qualified?"]
    output: Contractor
    side_effects:
      - "sets approved_list_status = APPROVED and performance_score = 100"
      - "initialises open_complaint_count, sanction_count, on_time_completion_count and active_award_count to 0"
  - method: POST
    path: "/rehab/contractors/{contractor_id}/status"
    description: "Moves a contractor between approved-list statuses. Suspension withdraws the contractor's live bids and can fail solicitations; reinstatement restores them."
    roles: [ProgramManager]
    code: 200
    input: [approved_list_status, "reason?"]
    output: Contractor
    side_effects:
      - "on SUSPENDED or REMOVED: every Bid of this contractor in SUBMITTED or RESPONSIVE whose solicitation is OPEN or TABULATED becomes WITHDRAWN_BY_PROGRAM"
      - "each affected BidSolicitation recomputes bid_count and responsive_bid_count and fails when responsive_bid_count < min_bids_required, driving its application BID_OPEN -> BID_FAILED"
      - "on reinstatement to APPROVED: WITHDRAWN_BY_PROGRAM bids return to their pre-withdrawal status, counts are recomputed, and a solicitation that now meets min_bids_required returns FAILED -> TABULATED, driving its application BID_FAILED -> BID_OPEN"
      - "increments Contractor.version by 1"
  - method: GET
    path: "/rehab/contractors/{contractor_id}"
    description: "Reads one contractor with its live performance score and approved-list status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/rehab/contractors"
    description: "Lists contractors, optionally filtered by approved-list status or lead-safe certification."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["approved_list_status?", "lead_safe_certified?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  # --- BidSolicitation --------------------------------------------------------
  - method: POST
    path: "/rehab/bid-solicitations"
    description: "Solicits bids from the approved list against an approved scope of work, snapshotting the independent cost estimate."
    roles: [RehabSpecialist]
    code: 201
    input: [application_id, write_up_id, bid_due_at, min_bids_required]
    output: BidSolicitation
    side_effects:
      - "snapshots independent_cost_estimate_cents from the approved write-up's total_estimate_cents"
      - "computes responsive_ceiling_cents and responsive_floor_cents per calculations.bid_tabulation_and_ranking"
      - "sets status = OPEN and drives RehabApplication WRITEUP_APPROVED -> BID_OPEN"
      - "increments RehabApplication.version by 1"
  - method: POST
    path: "/rehab/bid-solicitations/{solicitation_id}/tabulate"
    description: "Tabulates received bids, classifying each as responsive or non-responsive and ranking the responsive ones."
    roles: [RehabSpecialist]
    code: 200
    input: []
    output: BidSolicitation
    side_effects:
      - "classifies every SUBMITTED bid and assigns rank per calculations.bid_tabulation_and_ranking"
      - "recomputes bid_count and responsive_bid_count"
      - "sets status = TABULATED, or status = FAILED with the application driven BID_OPEN -> BID_FAILED when no bid is responsive"
      - "increments BidSolicitation.version by 1"
  - method: POST
    path: "/rehab/bid-solicitations/{solicitation_id}/award"
    description: "Awards the contract to a responsive bid, subject to the contractor's approved-list status, lead certification and crew capacity."
    roles: [ProgramManager]
    code: 200
    input: [bid_id]
    output: BidSolicitation
    side_effects:
      - "sets status = AWARDED, award_bid_id and awarded_by_user_id = X-User-ID"
      - "the selected bid becomes AWARDED; all other RESPONSIVE and NON_RESPONSIVE bids of this solicitation become REJECTED"
      - "sets RehabApplication.awarded_contractor_id and drives BID_OPEN -> AWARDED"
      - "recomputes the winning Contractor.active_award_count"
      - "increments BidSolicitation.version by 1"
  - method: POST
    path: "/rehab/bid-solicitations/{solicitation_id}/reopen"
    description: "Reopens a failed solicitation with a new due instant so additional bids can be solicited."
    roles: [ProgramManager]
    code: 200
    input: [new_bid_due_at]
    output: BidSolicitation
    side_effects:
      - "sets status = OPEN, bid_due_at = new_bid_due_at and increments reopen_count"
      - "all RESPONSIVE and NON_RESPONSIVE bids of this solicitation become REJECTED and both counts reset to 0"
      - "drives RehabApplication BID_FAILED -> BID_OPEN"
      - "increments BidSolicitation.version by 1"
  - method: GET
    path: "/rehab/bid-solicitations/{solicitation_id}"
    description: "Reads one solicitation with its responsiveness window and bid counts."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: []
    output: BidSolicitation
    side_effects: []
  - method: GET
    path: "/rehab/bid-solicitations"
    description: "Lists solicitations, optionally filtered by application, write-up revision, awarded bid or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: ["application_id?", "write_up_id?", "award_bid_id?", "status?", "limit?", "offset?"]
    output: BidSolicitation[]
    side_effects: []

  # --- Bid --------------------------------------------------------------------
  - method: POST
    path: "/rehab/bids"
    description: "Submits a contractor's sealed bid with its proposed construction window before the due instant."
    roles: [Contractor]
    code: 201
    input: [solicitation_id, contractor_id, amount_cents, proposed_start_date, proposed_end_date]
    output: Bid
    side_effects:
      - "sets submitted_at from the logical clock and status = SUBMITTED"
      - "increments the parent solicitation's bid_count"
      - "increments BidSolicitation.version by 1"
  - method: GET
    path: "/rehab/bids/{bid_id}"
    description: "Reads one bid with its responsiveness classification and rank."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/rehab/bids"
    description: "Lists bids, optionally filtered by solicitation, contractor or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: ["solicitation_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # --- RehabLoan --------------------------------------------------------------
  - method: POST
    path: "/rehab/loans"
    description: "Structures the rehabilitation loan on the awarded bid as a deferred, forgivable or amortizing note, financing the tiered lien recording fee."
    roles: [LoanOfficer]
    code: 201
    input: [application_id, structure_type, "interest_rate_bps?", "term_months?", "forgiveness_term_months?"]
    output: RehabLoan
    side_effects:
      - "snapshots awarded_bid_amount_cents and approved_project_cost_cents from the awarded bid"
      - "runs calculations.loan_structuring to set lien_recording_fee_cents, principal_cents and monthly_payment_cents"
      - "sets status = STRUCTURED; commits nothing to the program year yet"
  - method: POST
    path: "/rehab/loans/{loan_id}/record-lien"
    description: "Records the mortgage lien securing the loan, which commits the principal against the program year allocation and releases the property to construction."
    roles: [LoanOfficer]
    code: 200
    input: [lien_position, recorded_instrument_number]
    output: RehabLoan
    side_effects:
      - "sets lien_position, lien_recorded_at and status = LIEN_RECORDED"
      - "program_year.committed_amount_cents += principal_cents"
      - "immediately disburses lien_recording_fee_cents: loan.disbursed_cents += fee, program_year.committed_amount_cents -= fee, program_year.disbursed_amount_cents += fee"
      - "drives RehabApplication AWARDED -> UNDER_CONSTRUCTION"
      - "increments RehabLoan.version by 1"
  - method: POST
    path: "/rehab/loans/{loan_id}/close-out"
    description: "Closes out construction, releasing any unspent commitment, resetting the note to the amount actually disbursed and starting the warranty and forgiveness clocks."
    roles: [LoanOfficer]
    code: 200
    input: [completion_date]
    output: RehabLoan
    side_effects:
      - "releases principal_cents - disbursed_cents back to program_year.uncommitted_amount_cents"
      - "reduces principal_cents to disbursed_cents, recomputes monthly_payment_cents for AMORTIZING notes and recomputes unforgiven_balance_cents"
      - "sets forgiveness_start_date = completion_date and status = SERVICING"
      - "increments the awarded contractor's on_time_completion_count and recomputes performance_score"
      - "drives RehabApplication to CLOSED and sets warranty_expires_at = completion_date + 12 months"
      - "increments RehabLoan.version by 1"
  - method: POST
    path: "/rehab/loans/{loan_id}/payments"
    description: "Posts a homeowner principal payment against a servicing loan."
    roles: [LoanOfficer]
    code: 200
    input: [amount_cents, payment_date]
    output: RehabLoan
    side_effects:
      - "principal_repaid_cents += amount_cents and unforgiven_balance_cents recomputed"
      - "program_year.program_income_balance_cents += amount_cents"
      - "increments RehabLoan.version by 1"
  - method: POST
    path: "/rehab/loans/{loan_id}/recapture"
    description: "Records a sale or other transfer of the assisted property and computes the amount recaptured as program income."
    roles: [ProgramManager]
    code: 200
    input: [recapture_event_type, recapture_event_date, "sale_price_cents?", "closing_costs_cents?", "homeowner_investment_cents?"]
    output: RehabLoan
    side_effects:
      - "runs calculations.recapture_amount and stores forgiven_cents, unforgiven_balance_cents, net_proceeds_cents, recapture_amount_cents, shortfall_forgiven_cents and program_income_posted_cents"
      - "program_year.program_income_balance_cents += program_income_posted_cents"
      - "sets status = RECAPTURED, or FORGIVEN when nothing is recoverable"
      - "increments RehabLoan.version by 1"
  - method: GET
    path: "/rehab/loans/{loan_id}"
    description: "Reads one loan with its full disbursement, forgiveness and recapture ledger."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Applicant]
    code: 200
    input: []
    output: RehabLoan
    side_effects: []
  - method: GET
    path: "/rehab/loans"
    description: "Lists loans, optionally filtered by application, status or structure type."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["application_id?", "status?", "structure_type?", "limit?", "offset?"]
    output: RehabLoan[]
    side_effects: []

  # --- DrawRequest ------------------------------------------------------------
  - method: POST
    path: "/rehab/draw-requests"
    description: "Requests payment for completed construction work against a secured loan."
    roles: [Contractor]
    code: 201
    input: [loan_id, contractor_id, requested_amount_cents, "is_final_draw?"]
    output: DrawRequest
    side_effects:
      - "sets status = SUBMITTED"
      - "rejected with ERR_LIEN_NOT_RECORDED when the loan has no recorded lien"
  - method: POST
    path: "/rehab/draw-requests/{draw_request_id}/approve"
    description: "Approves a draw whose construction inspection passed, withholding retainage. The approver may not be the inspector who passed the draw."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects:
      - "runs calculations.draw_payment_and_retainage to set approved_amount_cents, retainage_cents and net_payment_cents"
      - "sets approved_by_user_id = X-User-ID and status = APPROVED"
      - "increments DrawRequest.version by 1"
  - method: POST
    path: "/rehab/draw-requests/{draw_request_id}/pay"
    description: "Pays an approved draw to the contractor and posts the money movement through the loan and program-year ledgers."
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects:
      - "sets status = PAID and paid_at from the logical clock"
      - "loan.contract_earned_cents += approved_amount_cents, loan.retainage_held_cents += retainage_cents (or is released to 0 on the final draw), loan.disbursed_cents += net_payment_cents"
      - "program_year.committed_amount_cents -= net_payment_cents and program_year.disbursed_amount_cents += net_payment_cents"
      - "loan LIEN_RECORDED -> DISBURSING, and DISBURSING -> FULLY_DISBURSED when disbursed_cents == principal_cents, which drives RehabApplication UNDER_CONSTRUCTION -> CONSTRUCTION_COMPLETE"
      - "increments DrawRequest.version by 1"
  - method: GET
    path: "/rehab/draw-requests/{draw_request_id}"
    description: "Reads one draw request with its retainage and net payment figures."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []
  - method: GET
    path: "/rehab/draw-requests"
    description: "Lists draw requests, optionally filtered by loan, contractor or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: ["loan_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []

  # --- ChangeOrder ------------------------------------------------------------
  - method: POST
    path: "/rehab/change-orders"
    description: "Submits a construction change order against a secured loan. A change order may supersede an earlier approved one, so the caller must present the loan version it last observed."
    roles: [RehabSpecialist]
    code: 201
    input: [loan_id, expected_loan_version, amount_delta_cents, justification, "affects_lead_hazard_work?", "supersedes_change_order_id?"]
    output: ChangeOrder
    side_effects:
      - "sets status = SUBMITTED and submitted_by_user_id = X-User-ID"
      - "increments RehabLoan.version by 1"
  - method: POST
    path: "/rehab/change-orders/{change_order_id}/approve"
    description: "Approves a change order, adjusting the construction contract, the committed principal and, when lead-disturbing work is added, the compliance posture."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "runs calculations.change_order_cumulative_delta and stores cumulative_delta_pct"
      - "any change order this one supersedes becomes SUPERSEDED and its delta is backed out first"
      - "loan.approved_project_cost_cents and principal_cents adjusted, with program_year.committed_amount_cents moved by the same delta"
      - "when affects_lead_hazard_work and the application requires the lead protocol, compliance_posture returns to LEAD_HOLD and lead_hazard_control_method resets to NONE"
      - "increments ChangeOrder.version by 1"
  - method: POST
    path: "/rehab/change-orders/{change_order_id}/deny"
    description: "Denies a submitted change order."
    roles: [ProgramManager]
    code: 200
    input: [reason]
    output: ChangeOrder
    side_effects:
      - "sets status = DENIED with no ledger effect"
      - "increments ChangeOrder.version by 1"
  - method: GET
    path: "/rehab/change-orders/{change_order_id}"
    description: "Reads one change order with its cumulative exposure percentage."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/rehab/change-orders"
    description: "Lists change orders, optionally filtered by loan, superseded change order or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Contractor]
    code: 200
    input: ["loan_id?", "supersedes_change_order_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  # --- ComplaintCase ----------------------------------------------------------
  - method: POST
    path: "/rehab/complaints"
    description: "Files a workmanship or warranty complaint against the contractor that performed the rehabilitation, within the warranty period."
    roles: [Applicant, RehabSpecialist]
    code: 201
    input: [contractor_id, application_id, defect_category, description]
    output: ComplaintCase
    side_effects:
      - "sets filed_at from the logical clock, status = FILED and snapshots warranty_expires_at from the application"
      - "recomputes the contractor's open_complaint_count and performance_score, demoting APPROVED -> PROBATION when the score falls below 50"
  - method: POST
    path: "/rehab/complaints/{complaint_id}/notify"
    description: "Notifies the contractor of the complaint and starts the remedy window."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ComplaintCase
    side_effects:
      - "sets status = CONTRACTOR_NOTIFIED and remedy_deadline_at = logical clock + 30 days"
      - "increments ComplaintCase.version by 1"
  - method: POST
    path: "/rehab/complaints/{complaint_id}/resolve"
    description: "Closes a notified complaint as remedied or dismissed, or escalates it once the remedy window has expired."
    roles: [ProgramManager]
    code: 200
    input: [resolution, "resolution_note?"]
    output: ComplaintCase
    side_effects:
      - "sets status = REMEDIED, DISMISSED or ESCALATED and, for the closing outcomes, resolved_at"
      - "recomputes the contractor's open_complaint_count and performance_score"
      - "increments ComplaintCase.version by 1"
  - method: POST
    path: "/rehab/complaints/{complaint_id}/sanction"
    description: "Sanctions the contractor for an escalated complaint, applying the chosen approved-list consequence."
    roles: [ProgramManager]
    code: 200
    input: [sanction_level, "sanction_note?"]
    output: ComplaintCase
    side_effects:
      - "sets status = SANCTIONED, sanction_level and resolved_at"
      - "contractor.sanction_count += 1, performance_score recomputed, and approved_list_status set to PROBATION, SUSPENDED or REMOVED per sanction_level"
      - "for SUSPENSION and REMOVAL, runs the full bid-withdrawal cascade described on POST /rehab/contractors/{contractor_id}/status"
      - "increments ComplaintCase.version by 1"
  - method: GET
    path: "/rehab/complaints/{complaint_id}"
    description: "Reads one complaint case."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager, Applicant, Contractor]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: []
  - method: GET
    path: "/rehab/complaints"
    description: "Lists complaint cases, optionally filtered by contractor, application or status."
    roles: [IntakeSpecialist, RehabSpecialist, Inspector, LoanOfficer, ProgramManager]
    code: 200
    input: ["contractor_id?", "application_id?", "status?", "limit?", "offset?"]
    output: ComplaintCase[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing, empty, or not one of the seven roles declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the addressed endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an Applicant or Contractor addresses a record belonging to a different applicant household or contractor firm"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving user is the same user who prepared the write-up, or the same user who performed the draw inspection being approved against"

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, negative money or count value, scheduled_end_at not after scheduled_start_at, proposed_end_date before proposed_start_date, household_size outside 1..8, or term_months below 1 on an AMORTIZING loan"

  # --- concurrency ------------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_application_version on POST /rehab/write-ups, or expected_loan_version on POST /rehab/change-orders, does not equal the parent's current version"

  # --- existence --------------------------------------------------------------
  - id: ERR_PROGRAM_YEAR_NOT_FOUND
    http: 404
    condition: "the addressed or referenced ProgramYear does not exist"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Applicant does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "the addressed or referenced RehabApplication does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "the addressed PropertyInspection does not exist"
  - id: ERR_WRITE_UP_NOT_FOUND
    http: 404
    condition: "the addressed or referenced WorkWriteUp does not exist"
  - id: ERR_WORK_ITEM_NOT_FOUND
    http: 404
    condition: "the addressed WorkItem does not exist"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Contractor does not exist"
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "the addressed or referenced BidSolicitation does not exist"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "the addressed Bid does not exist, or the bid_id supplied for award does not exist"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "the addressed or referenced RehabLoan does not exist"
  - id: ERR_DRAW_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DrawRequest does not exist"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "the addressed ChangeOrder does not exist, or supersedes_change_order_id names a change order that does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "the addressed ComplaintCase does not exist"

  # --- state ------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed entity is not in a state from which the requested §1.2 transition is defined, including repeat triggers, editing an applicant after income verification, adding or deleting work items on a write-up that is not DRAFT or REVISION_REQUESTED, structuring a second loan for one application, closing out while retainage is still held, and resolving a complaint as ESCALATED before the remedy deadline"
  - id: ERR_INCOME_NOT_VERIFIED
    http: 409
    condition: "an application is intaken for an applicant whose eligibility_status is still APPLIED"
  - id: ERR_OWNERSHIP_NOT_VERIFIED
    http: 409
    condition: "an inspection is scheduled or a write-up opened while ownership_verification_status is not VERIFIED"
  - id: ERR_LEAD_CLEARANCE_REQUIRED
    http: 409
    condition: "lien recording or draw approval is attempted while compliance_posture is LEAD_HOLD or DUAL_HOLD"
  - id: ERR_HISTORIC_CLEARANCE_REQUIRED
    http: 409
    condition: "lien recording is attempted while compliance_posture is HISTORIC_HOLD, DUAL_HOLD or ADVERSE_EFFECT_BLOCKED"
  - id: ERR_DRAW_INSPECTION_NOT_PASSED
    http: 409
    condition: "draw approval is attempted with no passed DRAW inspection linked to that draw request"
  - id: ERR_LIEN_NOT_RECORDED
    http: 409
    condition: "a draw request or change order is created before the loan's lien is recorded"

  # --- temporal ---------------------------------------------------------------
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "the requested inspection window overlaps an existing inspection window on the same application under half-open [start, end) semantics"
  - id: ERR_BID_WINDOW_CLOSED
    http: 409
    condition: "a bid is submitted at or after the solicitation's bid_due_at"
  - id: ERR_CONTRACTOR_CAPACITY_CONFLICT
    http: 409
    condition: "awarding would leave the contractor with more than MAX_CONCURRENT_AWARDS overlapping construction windows once each window is inflated by the three-day crew turnover buffer"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "a complaint is filed after the application's warranty_expires_at, or against an application that has not been closed out and therefore has no warranty period"

  # --- fiscal -----------------------------------------------------------------
  - id: ERR_LOAN_LIMIT_EXCEEDED
    http: 422
    condition: "the awarded bid amount exceeds the program year's max_loan_amount_cents"
  - id: ERR_ALLOCATION_INSUFFICIENT
    http: 409
    condition: "recording a lien or approving a positive change order would commit more than program_year.uncommitted_amount_cents"
  - id: ERR_DRAW_EXCEEDS_CONTRACT_BALANCE
    http: 422
    condition: "the requested draw exceeds approved_project_cost_cents minus contract_earned_cents"
  - id: ERR_CHANGE_ORDER_EXCEEDS_LIMIT
    http: 422
    condition: "cumulative_delta_pct across all live change orders on the loan would exceed 20.00 percent of the awarded contract amount"

  # --- business constraints ---------------------------------------------------
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "the contractor already has a live bid on the addressed solicitation"
  - id: ERR_INSUFFICIENT_BIDS
    http: 409
    condition: "tabulation is attempted with fewer bids received than min_bids_required"
  - id: ERR_BID_NOT_RESPONSIVE
    http: 422
    condition: "the bid selected for award is not RESPONSIVE, or does not belong to the addressed solicitation"
  - id: ERR_CONTRACTOR_NOT_APPROVED
    http: 422
    condition: "the winning bid's contractor is not currently APPROVED on the program's approved list"
  - id: ERR_CONTRACTOR_NOT_LEAD_CERTIFIED
    http: 422
    condition: "the winning bid's contractor lacks lead_safe_certified on an application that triggered the lead protocol"
  - id: ERR_WRITE_UP_EMPTY
    http: 422
    condition: "a write-up with no work items is submitted for approval"
  - id: ERR_PRIORITY_REPAIRS_NOT_ADDRESSED
    http: 422
    condition: "a write-up whose priority_repair_total_cents is 0 is submitted or used to open a solicitation"
  - id: ERR_APPLICANT_OVER_INCOME
    http: 422
    condition: "an application is intaken for an applicant certified OVER_INCOME"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "The assisted homeowner. Reads the progress of their own application, write-up and loan, and files warranty complaints against the contractor that did the work."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "GET /rehab/applications/{application_id} (own application only)"
      - "GET /rehab/write-ups/{write_up_id} (own application only)"
      - "GET /rehab/loans/{loan_id} (own loan only)"
      - "GET /rehab/complaints/{complaint_id} (own complaints only)"
      - "POST /rehab/complaints"
  - name: Contractor
    description: "A firm on the program's approved list. Bids on solicitations and requests payment for completed construction."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /rehab/bids"
      - "POST /rehab/draw-requests"
    shared_operations:
      - "GET /rehab/bid-solicitations and GET /rehab/bid-solicitations/{solicitation_id}"
      - "GET /rehab/bids and GET /rehab/bids/{bid_id}"
      - "GET /rehab/work-items"
      - "GET /rehab/draw-requests and GET /rehab/draw-requests/{draw_request_id}"
      - "GET /rehab/change-orders and GET /rehab/change-orders/{change_order_id}"
      - "GET /rehab/contractors/{contractor_id}"
      - "GET /rehab/complaints/{complaint_id}"
      - "POST /rehab/_clock/set_current_utc is NOT available to this role"
  - name: IntakeSpecialist
    description: "Program intake staff. Registers households, certifies income and verifies ownership of record."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/applicants"
      - "PATCH /rehab/applicants/{applicant_id}"
      - "POST /rehab/applicants/{applicant_id}/verify-income"
      - "POST /rehab/applications"
      - "POST /rehab/applications/{application_id}/verify-ownership"
    shared_operations:
      - "all read endpoints except GET /rehab/complaints scoping restrictions"
      - "POST /rehab/_clock/set_current_utc"
  - name: RehabSpecialist
    description: "Rehabilitation construction specialist. Prepares the work write-up and its line items, solicits and tabulates bids, opens change orders and files complaints on the household's behalf."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/write-ups"
      - "POST /rehab/write-ups/{write_up_id}/submit"
      - "POST /rehab/work-items"
      - "DELETE /rehab/work-items/{work_item_id}"
      - "POST /rehab/bid-solicitations"
      - "POST /rehab/bid-solicitations/{solicitation_id}/tabulate"
      - "POST /rehab/change-orders"
    shared_operations:
      - "POST /rehab/complaints"
      - "all read endpoints"
      - "POST /rehab/_clock/set_current_utc"
  - name: Inspector
    description: "Housing rehabilitation inspector. Reserves and performs property standards, draw and final inspections and records lead risk assessment clearance."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/inspections"
      - "POST /rehab/inspections/{inspection_id}/record-result"
      - "POST /rehab/applications/{application_id}/lead-clearance"
    shared_operations:
      - "all read endpoints except applicant income reads"
      - "POST /rehab/_clock/set_current_utc"
  - name: LoanOfficer
    description: "Program loan officer. Structures and secures the loan, approves and pays draws, posts homeowner payments and closes out construction."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/loans"
      - "POST /rehab/loans/{loan_id}/record-lien"
      - "POST /rehab/loans/{loan_id}/close-out"
      - "POST /rehab/loans/{loan_id}/payments"
      - "POST /rehab/draw-requests/{draw_request_id}/approve"
      - "POST /rehab/draw-requests/{draw_request_id}/pay"
    shared_operations:
      - "all read endpoints"
      - "POST /rehab/_clock/set_current_utc"
  - name: ProgramManager
    description: "Program administrator. Owns the program year, the approved contractor list, write-up approval, awards, change-order approval, recapture and contractor discipline. Cannot prepare the work it approves and cannot inspect the draws it pays for."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/program-years"
      - "POST /rehab/contractors"
      - "POST /rehab/contractors/{contractor_id}/status"
      - "POST /rehab/write-ups/{write_up_id}/request-revision"
      - "POST /rehab/write-ups/{write_up_id}/approve"
      - "POST /rehab/bid-solicitations/{solicitation_id}/award"
      - "POST /rehab/bid-solicitations/{solicitation_id}/reopen"
      - "POST /rehab/applications/{application_id}/historic-clearance"
      - "POST /rehab/change-orders/{change_order_id}/approve"
      - "POST /rehab/change-orders/{change_order_id}/deny"
      - "POST /rehab/loans/{loan_id}/recapture"
      - "POST /rehab/complaints/{complaint_id}/notify"
      - "POST /rehab/complaints/{complaint_id}/resolve"
      - "POST /rehab/complaints/{complaint_id}/sanction"
    shared_operations:
      - "all read endpoints"
      - "POST /rehab/_clock/set_current_utc"
