      - name: reversal_endpoint_mints_a_compensating_row
        claim_type: action_endpoint
        grounds:
          - calculations.service_reserve_conservation
          - entities.ConsumableDraw.fields.reverses_draw_id
        excluded_because:
          difficulty_instance: compensating_invariant / draw_reversal_restores_reserve_money_exactly
          rationale: 'Every side effect of POST /consumable-draws/{draw_id}/reversal - the negated REVERSAL row, the untouched original, the restored availability and the SUSPENDED to ACTIVE return - is asserted by the named §1.8 instance.'
      - name: cancel_endpoint_hands_back_the_bay_ledger
        claim_type: action_endpoint
        grounds:
          - calculations.bay_footprint_minute_ledger
          - state_machines.FatRun.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / fat_cancellation_restores_bay_footprint_minutes_exactly
          rationale: 'The cancel endpoint''s ledger restoration to the exact pre-booking value is asserted by the named §1.8 instance.'
      - name: milestone_endpoint_touches_one_dimension_only
        claim_type: action_endpoint
        grounds:
          - state_machines.Skid.PANEL_BUILD_to_IO_CHECKED
          - calculations.skid_fat_readiness
        excluded_because:
          difficulty_instance: non_linear_state_machine / skid_controls_dimension_advances_without_mechanical
          rationale: 'Independent advance of the controls dimension while the mechanical dimension stands still, and the readiness fold over both, are asserted by the named §1.8 instance.'
      - name: package_read_returns_both_cost_variants
        claim_type: computed_read
        grounds:
          - entities.EquipmentPackage.fields.firm_cost_cents
          - calculations.equipment_package_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / package_cost_budgetary_versus_firm_on_same_package
          rationale: 'The single read exposing both budgetary_cost_cents and firm_cost_cents side by side with cost_variance_pct is asserted by the named §1.8 instance.'
  - section: errors
    instances:
      - name: qa_decision_on_an_unknown_influent_profile_is_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_INFLUENT_PROFILE_NOT_FOUND]
        distinguishing_aspect: |
          Path-segment existence is checked at priority 4, ahead of the ALREADY_DECIDED state guard
          at priority 25, so an unknown {profile_id} yields ERR_INFLUENT_PROFILE_NOT_FOUND (404) and
          never a 409.
        test_recipe:
          setup:
            - 'the logical clock pinned to 2026-08-01T00:00:00.000Z and no rows of the addressed type in the store'
          setup_api_calls:
            - call: "POST /water-treatment/_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-treatment/influent-profiles/00000000-0000-0000-0000-0000000000ff/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QualityEngineer
              as_user_id: "qa-1"
              captures: { profile_404_id: "$.data.error_id" }
          assert:
            - 'HTTP status == 404'
            - '${profile_404_id} == ERR_INFLUENT_PROFILE_NOT_FOUND'
      - name: package_creation_under_an_unknown_stage_is_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors[ERR_TREATMENT_STAGE_NOT_FOUND]
        distinguishing_aspect: |
          The path parent is resolved at priority 5, before the body foreign keys at priority 15, so
          a real material_spec_id under an unknown {stage_id} returns
          ERR_TREATMENT_STAGE_NOT_FOUND (404) rather than ERR_CATALOG_REF_NOT_FOUND.
        test_recipe:
          setup:
            - 'MAT-316L seeded in the catalog'
            - 'no TreatmentStage rows exist'
          setup_api_calls:
            - call: "POST /water-treatment/_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /water-treatment/material-specs"
              payload: { code: "MAT-316L", max_chloride_ppm: 200.0, max_temp_c: 80.0, max_pressure_psig: 300, ph_min: 4.0, ph_max: 11.0, asme_u_capable: true, nsf61_certified: true, awwa_compliant: true, cost_index: 1.10, service_classes_allowed: ["NEUTRAL", "CHLORINATED", "CAUSTIC"] }
              as: PlatformAdmin
              captures: { mat_316l_id: "$.data.id" }
          trigger:
            - call: "POST /water-treatment/treatment-stages/00000000-0000-0000-0000-0000000000ff/equipment-packages"
              payload: { material_spec_id: "${mat_316l_id}", tag_number: "F-100", design_pressure_psig: 150, design_temp_c: 30.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { stage_404_id: "$.data.error_id" }
          assert:
            - 'HTTP status == 404'
            - '${stage_404_id} == ERR_TREATMENT_STAGE_NOT_FOUND'
      - name: submit_for_review_on_an_unknown_package_is_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_EQUIPMENT_PACKAGE_NOT_FOUND]
        distinguishing_aspect: |
          Priority 6 covers every /equipment-packages/{package_id} route, so the action endpoints
          answer 404 with ERR_EQUIPMENT_PACKAGE_NOT_FOUND before any package state check at priority
          26 can run.
        test_recipe:
          setup:
            - 'the logical clock pinned to 2026-08-01T00:00:00.000Z and no rows of the addressed type in the store'
          setup_api_calls:
