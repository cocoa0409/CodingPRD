scenario: "generate task hard than expert level! 1244. Amateur Radio Club & Emergency Communications (ARRL-affiliated radio club): membership & license class tracking, repeater maintenance & coordination with frequency council, net schedule & check-in logging, emergency activation roster & served-agency agreement, drill participation & message handling practice, field day event logistics & scoring, license exam session administration, equipment loan & antenna site agreements"
domain_name: amateur-radio-club-emergency
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: callsign, type: string, source: input, description: "FCC amateur callsign; unique club-wide, case-insensitive", constraints: "unique among all Members" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: license_class, type: enum, source: input, description: "Highest current license class; ordinal TECHNICIAN < GENERAL < EXTRA", constraints: "one of [TECHNICIAN, GENERAL, EXTRA]" }
      - { name: license_expires_at, type: datetime, source: input, description: "FCC license expiry instant (UTC)" }
      - { name: membership_status, type: enum, source: system, description: "Lifecycle: PENDING at creation; ACTIVE after dues; LAPSED when clock passes dues_paid_through; SUSPENDED by admin", default: PENDING, constraints: "one of [PENDING, ACTIVE, LAPSED, SUSPENDED]" }
      - { name: dues_paid_through, type: datetime, source: system, description: "Membership paid-through instant; extended by POST /members/{id}/renew" }
      - { name: equipment_privilege, type: enum, source: system, description: "GOOD_STANDING until a DAMAGED return or LOST loan flips it to SUSPENDED", default: GOOD_STANDING, constraints: "one of [GOOD_STANDING, SUSPENDED]" }
      - { name: readiness_score, type: integer, source: computed, description: "Verified readiness per calculations.member_readiness (verified variant); floor 0" }
      - { name: readiness_score_optimistic, type: integer, source: computed, description: "Optimistic readiness per calculations.member_readiness (optimistic variant); counts nets in {OPEN, CLOSED} and drills in {IN_PROGRESS, COMPLETED}" }
      - { name: readiness_tier, type: enum, source: computed, description: "ELIGIBLE if readiness_score >= 70; PROVISIONAL if 40 <= score < 70; INELIGIBLE if score < 40", constraints: "one of [ELIGIBLE, PROVISIONAL, INELIGIBLE]" }
      - { name: check_ins_12m_count, type: integer, source: computed, description: "Count of CheckIn by this member on NetSessions with status CLOSED whose checked_in_at is within trailing 365 days of the logical clock" }
      - { name: drills_12m_count, type: integer, source: computed, description: "Count of Drills with status COMPLETED, scheduled_start within trailing 365 days, where the member has >= 1 DrillMessage in {RELAYED, DELIVERED}" }
      - { name: no_shows_12m_count, type: integer, source: computed, description: "Count of RosterEntry for this member with status NO_SHOW whose updated_at is within trailing 365 days" }

  - name: AntennaSiteAgreement
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Site identifier; interval-uniqueness scope for the closed-interval overlap rule" }
      - { name: owner_name, type: string, source: input, description: "Site owner / landlord name" }
      - { name: lease_start, type: datetime, source: input, description: "Lease window start (inclusive)" }
      - { name: lease_end, type: datetime, source: input, description: "Lease window end (inclusive); closed-interval semantics: end == other.start counts as overlap" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION at creation; ACTIVE via set-status; EXPIRED automatically when clock passes lease_end; TERMINATED by admin", default: NEGOTIATION, constraints: "one of [NEGOTIATION, ACTIVE, EXPIRED, TERMINATED]" }
      - { name: renewal_count, type: integer, source: system, description: "Number of EXPIRED -> NEGOTIATION renewals applied", default: 0 }

  - name: Repeater
    parent: null
    common_fields: true
    fields:
      - { name: callsign, type: string, source: input, description: "Repeater callsign; unique club-wide", constraints: "unique among all Repeaters" }
      - { name: output_frequency_mhz, type: number, source: input, description: "Repeater output frequency in MHz" }
      - { name: site_agreement_id, type: string, source: input, description: "FK -> AntennaSiteAgreement.id; the site agreement authorizing this repeater's antenna location" }
      - { name: status, type: enum, source: system, description: "MAINTENANCE at creation; OPERATIONAL only with a GRANTED coordination and ACTIVE site agreement; forced OFFLINE when the site agreement leaves ACTIVE", default: MAINTENANCE, constraints: "one of [OPERATIONAL, DEGRADED, MAINTENANCE, OFFLINE]" }

  - name: CoordinationRequest
    parent: null
    common_fields: true
    fields:
      - { name: repeater_id, type: string, source: input, description: "FK -> Repeater.id; repeater being coordinated" }
      - { name: requested_frequency_mhz, type: number, source: input, description: "Proposed output frequency; must lie inside [144.0, 148.0] or [420.0, 450.0] MHz" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> {GRANTED, RETURNED}; RETURNED -> DRAFT revision loop; WITHDRAWN by supersede or admin", default: DRAFT, constraints: "one of [DRAFT, SUBMITTED, GRANTED, RETURNED, WITHDRAWN]" }
      - { name: council_reference, type: string, source: system, description: "Frequency council decision reference recorded on GRANTED/RETURNED" }
      - { name: revision_number, type: integer, source: system, description: "Increments by 1 on each RETURNED -> DRAFT revise", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the most recent DRAFT -> SUBMITTED transition" }
      - { name: decision_at, type: datetime, source: system, description: "Logical-clock instant of the most recent council decision" }

  - name: NetSession
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Net name, e.g. 'Tuesday ARES Net'" }
      - { name: repeater_id, type: string, source: input, description: "FK -> Repeater.id; repeater the net runs on" }
      - { name: net_control_member_id, type: string, source: system, description: "FK -> Member.id; the NetControl operator. Set to X-User-ID when a NetControl creates the net; set from input when ClubAdmin creates it" }
      - { name: scheduled_start, type: datetime, source: input, description: "Net window start; half-open interval [scheduled_start, scheduled_end): back-to-back nets on one repeater are allowed" }
      - { name: scheduled_end, type: datetime, source: input, description: "Net window end (exclusive)" }
      - { name: min_license_class, type: enum, source: input, description: "Minimum license class required of the net control and of check-ins", default: TECHNICIAN, constraints: "one of [TECHNICIAN, GENERAL, EXTRA]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> OPEN -> CLOSED; CANCELLED manually or by repeater cascade", default: SCHEDULED, constraints: "one of [SCHEDULED, OPEN, CLOSED, CANCELLED]" }
      - { name: checkin_count, type: integer, source: computed, description: "Count of CheckIn rows with net_session_id == this net" }

  - name: CheckIn
    parent: null
    common_fields: false
    fields:
      - { name: net_session_id, type: string, source: input, description: "FK -> NetSession.id; the net being joined" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; always the caller's member id (X-User-ID)" }
      - { name: has_traffic, type: boolean, source: input, description: "Whether the station brings formal traffic", default: false }
      - { name: traffic_count, type: integer, source: input, description: "Number of message pieces; must be 0 when has_traffic is false and >= 1 when true", default: 0 }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock instant of check-in creation" }

  - name: ServedAgencyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Served agency name, e.g. county OEM" }
      - { name: max_operators, type: integer, source: input, description: "Maximum operators the agency will accept per activation; > 0" }
      - { name: effective_start, type: datetime, source: input, description: "Agreement window start" }
      - { name: effective_end, type: datetime, source: input, description: "Agreement window end; EXPIRED when clock passes it" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> {EXPIRED (system), TERMINATED (admin)}", default: DRAFT, constraints: "one of [DRAFT, ACTIVE, EXPIRED, TERMINATED]" }

  - name: EmergencyActivation
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ServedAgencyAgreement.id; the served-agency agreement authorizing this activation" }
      - { name: title, type: string, source: input, description: "Activation name, e.g. 'River flood comms support'" }
      - { name: required_operators, type: integer, source: input, description: "Operators needed; > 0 and <= agreement.max_operators" }
      - { name: status, type: enum, source: system, description: "STANDBY -> ACTIVATED -> DEMOBILIZED; STANDBY -> CANCELLED manually or by supersede/agreement cascade", default: STANDBY, constraints: "one of [STANDBY, ACTIVATED, DEMOBILIZED, CANCELLED]" }
      - { name: activated_by_member_id, type: string, source: system, description: "FK -> Member.id; EmergencyCoordinator member who ran STANDBY -> ACTIVATED; a different member must demobilize (segregation of duties)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of ACTIVATED" }
      - { name: demobilized_at, type: datetime, source: system, description: "Logical-clock instant of DEMOBILIZED" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of RosterEntry with activation_id == this activation and status CONFIRMED" }
      - { name: staffing_posture, type: enum, source: computed, description: "ADEQUATE when confirmed_count >= required_operators, else UNDERSTAFFED", constraints: "one of [UNDERSTAFFED, ADEQUATE]" }

  - name: RosterEntry
    parent: null
    common_fields: true
    fields:
      - { name: activation_id, type: string, source: input, description: "FK -> EmergencyActivation.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; volunteering member (X-User-ID at creation)", constraints: "unique per (activation_id, member_id)" }
      - { name: status, type: enum, source: system, description: "VOLUNTEERED -> CONFIRMED -> {RELEASED, NO_SHOW, VOLUNTEERED revert}; VOLUNTEERED -> WITHDRAWN; cascaded on demobilize/cancel or on member tier flip to INELIGIBLE", default: VOLUNTEERED, constraints: "one of [VOLUNTEERED, CONFIRMED, RELEASED, WITHDRAWN, NO_SHOW]" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock instant of the most recent CONFIRMED transition" }

  - name: Drill
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Drill name, e.g. 'SET 2026'" }
      - { name: scheduled_start, type: datetime, source: input, description: "Drill window start; drill may be started only when clock >= scheduled_start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Drill window end" }
      - { name: passing_score, type: integer, source: input, description: "Club passing score reference for drill evaluation, 0-100", default: 70 }
      - { name: status, type: enum, source: system, description: "PLANNED -> IN_PROGRESS -> COMPLETED; CANCELLED from PLANNED or IN_PROGRESS", default: PLANNED, constraints: "one of [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]" }

  - name: DrillMessage
    parent: null
    common_fields: true
    fields:
      - { name: drill_id, type: string, source: input, description: "FK -> Drill.id; drill during which the message is handled" }
      - { name: originator_member_id, type: string, source: system, description: "FK -> Member.id; member who originated the message (X-User-ID at creation)" }
      - { name: precedence, type: enum, source: input, description: "Radiogram precedence", constraints: "one of [ROUTINE, PRIORITY, EMERGENCY]" }
      - { name: relay_count, type: integer, source: system, description: "Number of relay hops; +1 on every transition into RELAYED (including the RELAYED -> RELAYED self-loop)", default: 0 }
      - { name: status, type: enum, source: system, description: "ORIGINATED -> RELAYED -> RELAYED (self-loop) -> DELIVERED; CANCELLED from ORIGINATED or RELAYED", default: ORIGINATED, constraints: "one of [ORIGINATED, RELAYED, DELIVERED, CANCELLED]" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant of DELIVERED; null until delivered" }
      - { name: handling_seconds, type: integer, source: computed, description: "On DELIVERED: (delivered_at - created_at) in whole seconds; null until delivered" }

  - name: FieldDayEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name, e.g. 'Field Day 2026'; unique", constraints: "unique among all FieldDayEvents" }
      - { name: start_at, type: datetime, source: input, description: "Operating period start; event may be opened only when clock is within [start_at, end_at]" }
      - { name: end_at, type: datetime, source: input, description: "Operating period end; SCORING requires clock > end_at" }
      - { name: status, type: enum, source: system, description: "PLANNING -> OPEN -> SCORING -> FINALIZED", default: PLANNING, constraints: "one of [PLANNING, OPEN, SCORING, FINALIZED]" }
      - { name: contact_count, type: integer, source: computed, description: "Count of FieldDayContact rows with event_id == this event (duplicates included)" }
      - { name: provisional_score, type: integer, source: computed, description: "Optimistic score per calculations.field_day_scores provisional variant: all contacts count, duplicates included" }
      - { name: final_score, type: integer, source: computed, description: "Strict score per calculations.field_day_scores final variant: contacts with is_duplicate == false only; locked at FINALIZED" }

  - name: FieldDayContact
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> FieldDayEvent.id" }
      - { name: operator_member_id, type: string, source: system, description: "FK -> Member.id; logging operator (X-User-ID at creation)" }
      - { name: worked_callsign, type: string, source: input, description: "Callsign of the station worked" }
      - { name: band, type: enum, source: input, description: "Band of the contact", constraints: "one of [B160M, B80M, B40M, B20M, B15M, B10M, B6M, B2M]" }
      - { name: mode, type: enum, source: input, description: "Emission mode", constraints: "one of [CW, PHONE, DIGITAL]" }
      - { name: power_category, type: enum, source: input, description: "Transmitter power category", constraints: "one of [QRP, LOW, HIGH]" }
      - { name: is_duplicate, type: boolean, source: system, description: "Duplicate flag toggled by POST /field-day-contacts/{id}/set-duplicate", default: false }
      - { name: points, type: integer, source: computed, description: "Per-contact points per calculations.contact_points, computed at creation and immutable afterwards" }

  - name: ExamSession
    parent: null
    common_fields: true
    fields:
      - { name: location, type: string, source: input, description: "Exam venue" }
      - { name: scheduled_at, type: datetime, source: input, description: "Session start; IN_PROGRESS requires clock >= scheduled_at" }
      - { name: max_candidates, type: integer, source: input, description: "Candidate capacity; > 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> CLOSED; CANCELLED from SCHEDULED or IN_PROGRESS", default: SCHEDULED, constraints: "one of [SCHEDULED, IN_PROGRESS, CLOSED, CANCELLED]" }
      - { name: registered_count, type: integer, source: computed, description: "Count of ExamCandidate with session_id == this session and status in {REGISTERED, CHECKED_IN}" }

  - name: ExamCandidate
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ExamSession.id" }
      - { name: candidate_name, type: string, source: input, description: "Candidate legal name (need not be a club member)" }
      - { name: frn, type: string, source: input, description: "FCC Registration Number; unique within the session", constraints: "unique per session_id" }
      - { name: element, type: enum, source: input, description: "Exam element attempted", constraints: "one of [TECHNICIAN, GENERAL, EXTRA]" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; optional link to a club member so a pass upgrades license_class; null allowed" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> CHECKED_IN -> {PASSED, FAILED}; REGISTERED -> NO_SHOW; non-terminal -> CANCELLED on session cancel", default: REGISTERED, constraints: "one of [REGISTERED, CHECKED_IN, PASSED, FAILED, NO_SHOW, CANCELLED]" }
      - { name: checked_in_by_member_id, type: string, source: system, description: "FK -> Member.id; ExamLiaison member who checked the candidate in; result recording must be done by a different member (segregation of duties)" }
      - { name: score_percent, type: integer, source: input, description: "Recorded score 0-100; >= 74 yields PASSED, else FAILED" }

  - name: EquipmentLoan
    parent: null
    common_fields: true
    fields:
      - { name: item_tag, type: string, source: input, description: "Club equipment identifier; at most one outstanding (ACTIVE/OVERDUE) loan per item_tag" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; borrower. X-User-ID when a Member creates the loan; from input when ClubAdmin creates it" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Declared replacement value in cents; caps late fees and prices LOST loans; > 0" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock instant of loan creation" }
      - { name: due_at, type: datetime, source: input, description: "Return deadline; must be > clock now and <= now + 90 days" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock instant of return; null until RETURNED" }
      - { name: return_condition, type: enum, source: input, description: "Condition reported at return", constraints: "one of [GOOD, DAMAGED]; null until returned" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> {RETURNED, LOST}; ACTIVE -> OVERDUE automatically when clock passes due_at; OVERDUE -> {RETURNED, LOST}", default: ACTIVE, constraints: "one of [ACTIVE, OVERDUE, RETURNED, LOST]" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Per calculations.equipment_late_fee at return or mark-lost; 0 while outstanding" }

state_machines:
  - entity: Member
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{id}/renew"
        actor: ClubAdmin
        preconditions: ["periods >= 1"]
        side_effects: ["dues_paid_through = max(clock_now, dues_paid_through or epoch) + periods * 365 days", "Member.version += 1", "recompute readiness fields"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /members/{id}/renew"
        actor: ClubAdmin
        preconditions: ["periods >= 1"]
        side_effects: ["dues_paid_through = max(clock_now, dues_paid_through) + periods * 365 days", "Member.version += 1", "recompute readiness fields"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /members/{id}/renew (renewal while active)"
        actor: ClubAdmin
        preconditions: ["periods >= 1"]
        side_effects: ["dues_paid_through = max(clock_now, dues_paid_through) + periods * 365 days", "Member.version += 1"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system: logical clock advanced past dues_paid_through (evaluated by POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["clock_now > dues_paid_through"]
        side_effects: ["Member.version += 1", "recompute readiness fields"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/set-status {to: SUSPENDED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["Member.version += 1", "recompute readiness fields"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/set-status {to: ACTIVE}"
        actor: ClubAdmin
        preconditions: ["dues_paid_through > clock_now (else ERR_DUES_LAPSED)"]
        side_effects: ["Member.version += 1", "recompute readiness fields"]

  - entity: AntennaSiteAgreement
    initial_state: NEGOTIATION
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /antenna-site-agreements/{id}/set-status {to: ACTIVE}"
        actor: ClubAdmin
        preconditions: ["lease_end > clock_now (else ERR_INVALID_STATE)", "closed-interval overlap check against other agreements on same site_name in {NEGOTIATION, ACTIVE} (else ERR_SITE_WINDOW_CONFLICT)"]
        side_effects: ["AntennaSiteAgreement.version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock advanced past lease_end (POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["clock_now > lease_end"]
        side_effects:
          - "AntennaSiteAgreement.version += 1"
          - "cascade hop 1: every Repeater with site_agreement_id == this agreement and status != OFFLINE transitions to OFFLINE"
          - "cascade hop 2 (from each Repeater -> OFFLINE): every NetSession with repeater_id == that repeater and status in {SCHEDULED, OPEN} transitions to CANCELLED"
          - "cascade hop 3 (from each NetSession -> CANCELLED): recompute readiness fields of every Member with a CheckIn on that net (its check-ins no longer count: only CLOSED nets feed check_ins_12m_count; CANCELLED nets feed neither variant)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /antenna-site-agreements/{id}/set-status {to: TERMINATED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["AntennaSiteAgreement.version += 1", "same three-hop repeater/net/readiness cascade as ACTIVE -> EXPIRED"]
      - from: NEGOTIATION
        to: TERMINATED
        trigger: "POST /antenna-site-agreements/{id}/set-status {to: TERMINATED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["AntennaSiteAgreement.version += 1"]
      - from: EXPIRED
        to: NEGOTIATION
        trigger: "POST /antenna-site-agreements/{id}/set-status {to: NEGOTIATION, lease_start, lease_end} (renewal)"
        actor: ClubAdmin
        preconditions: ["lease_start and lease_end supplied", "lease_end > clock_now", "closed-interval overlap check (else ERR_SITE_WINDOW_CONFLICT)"]
        side_effects: ["AntennaSiteAgreement.version += 1", "renewal_count += 1", "lease_start/lease_end replaced with supplied values"]

  - entity: Repeater
    initial_state: MAINTENANCE
    terminal_states: []
    transitions:
      - from: MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /repeaters/{id}/set-status {to: OPERATIONAL}"
        actor: ClubAdmin
        preconditions:
          - "site agreement (Repeater.site_agreement_id) has status ACTIVE (else ERR_SITE_AGREEMENT_INACTIVE)"
          - "at least one CoordinationRequest with repeater_id == this repeater has status GRANTED (else ERR_NO_COORDINATION_GRANT)"
        side_effects: ["Repeater.version += 1"]
      - from: DEGRADED
        to: OPERATIONAL
        trigger: "POST /repeaters/{id}/set-status {to: OPERATIONAL}"
        actor: ClubAdmin
        preconditions: ["site agreement ACTIVE (ERR_SITE_AGREEMENT_INACTIVE)", "a GRANTED CoordinationRequest exists (ERR_NO_COORDINATION_GRANT)"]
        side_effects: ["Repeater.version += 1"]
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "POST /repeaters/{id}/set-status {to: DEGRADED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["Repeater.version += 1"]
      - from: OPERATIONAL
        to: MAINTENANCE
        trigger: "POST /repeaters/{id}/set-status {to: MAINTENANCE}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["Repeater.version += 1"]
      - from: OPERATIONAL
        to: OFFLINE
        trigger: "POST /repeaters/{id}/set-status {to: OFFLINE} or cascade from site agreement leaving ACTIVE"
        actor: ClubAdmin | system
        preconditions: []
        side_effects:
          - "Repeater.version += 1"
          - "cascade: every NetSession with repeater_id == this repeater and status in {SCHEDULED, OPEN} transitions to CANCELLED"
          - "cascade hop 2: each such net cancellation recomputes readiness fields of every Member with a CheckIn on that net"
      - from: MAINTENANCE
        to: OFFLINE
        trigger: "POST /repeaters/{id}/set-status {to: OFFLINE} or site-agreement cascade"
        actor: ClubAdmin | system
        preconditions: []
        side_effects: ["Repeater.version += 1", "same net-cancellation cascade as OPERATIONAL -> OFFLINE"]
      - from: OFFLINE
        to: MAINTENANCE
        trigger: "POST /repeaters/{id}/set-status {to: MAINTENANCE}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["Repeater.version += 1"]
      - from: DEGRADED
        to: MAINTENANCE
        trigger: "POST /repeaters/{id}/set-status {to: MAINTENANCE}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["Repeater.version += 1"]
      - from: DEGRADED
        to: OFFLINE
        trigger: "POST /repeaters/{id}/set-status {to: OFFLINE} or site-agreement cascade"
        actor: ClubAdmin | system
        preconditions: []
        side_effects: ["Repeater.version += 1", "same net-cancellation cascade as OPERATIONAL -> OFFLINE"]

  - entity: CoordinationRequest
    initial_state: DRAFT
    terminal_states: [GRANTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /coordination-requests/{id}/submit"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["submitted_at = clock_now", "CoordinationRequest.version += 1"]
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /coordination-requests/{id}/record-decision {outcome: GRANTED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["council_reference = input", "decision_at = clock_now", "CoordinationRequest.version += 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /coordination-requests/{id}/record-decision {outcome: RETURNED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["council_reference = input", "decision_at = clock_now", "CoordinationRequest.version += 1"]
      - from: RETURNED
        to: DRAFT
        trigger: "POST /coordination-requests/{id}/revise (revision loop)"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["revision_number += 1", "requested_frequency_mhz replaced when supplied", "CoordinationRequest.version += 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /coordination-requests/{id}/withdraw or supersede cascade from a new POST /coordination-requests for the same repeater"
        actor: ClubAdmin | system
        preconditions: []
        side_effects: ["CoordinationRequest.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /coordination-requests/{id}/withdraw or supersede cascade from a new POST /coordination-requests for the same repeater"
        actor: ClubAdmin | system
        preconditions: []
        side_effects: ["CoordinationRequest.version += 1"]

  - entity: NetSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /net-sessions/{id}/set-status {to: OPEN}"
        actor: NetControl | ClubAdmin
        preconditions:
          - "caller is the net's net_control_member_id or ClubAdmin (else ERR_FORBIDDEN)"
          - "clock_now >= scheduled_start and clock_now < scheduled_end (else ERR_NET_WINDOW_NOT_STARTED)"
          - "Repeater (NetSession.repeater_id) status == OPERATIONAL (else ERR_REPEATER_NOT_OPERATIONAL)"
        side_effects: ["NetSession.version += 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /net-sessions/{id}/set-status {to: CLOSED}"
        actor: NetControl | ClubAdmin
        preconditions: ["caller is the net's net_control_member_id or ClubAdmin (else ERR_FORBIDDEN)"]
        side_effects: ["NetSession.version += 1", "recompute checkin_count", "recompute readiness fields of every checked-in Member (check-ins now count toward the verified variant)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /net-sessions/{id}/set-status {to: CANCELLED} or repeater -> OFFLINE cascade"
        actor: NetControl | ClubAdmin | system
        preconditions: ["manual cancel: caller is net_control_member_id or ClubAdmin (else ERR_FORBIDDEN)"]
        side_effects: ["NetSession.version += 1", "recompute readiness fields of every Member with a CheckIn on this net"]
      - from: OPEN
        to: CANCELLED
        trigger: "repeater -> OFFLINE cascade"
        actor: system
        preconditions: []
        side_effects: ["NetSession.version += 1", "recompute readiness fields of every Member with a CheckIn on this net (check-ins stop counting in both variants)"]

  - entity: ServedAgencyAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /served-agency-agreements/{id}/set-status {to: ACTIVE}"
        actor: ClubAdmin
        preconditions: ["effective_end > clock_now (else ERR_INVALID_STATE)"]
        side_effects: ["ServedAgencyAgreement.version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock advanced past effective_end (POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["clock_now > effective_end"]
        side_effects: ["ServedAgencyAgreement.version += 1", "cascade: every EmergencyActivation with agreement_id == this agreement and status STANDBY transitions to CANCELLED (roster cascade applies)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /served-agency-agreements/{id}/set-status {to: TERMINATED}"
        actor: ClubAdmin
        preconditions: ["no EmergencyActivation with agreement_id == this agreement has status ACTIVATED (else ERR_ACTIVATION_IN_PROGRESS)"]
        side_effects: ["ServedAgencyAgreement.version += 1", "cascade: STANDBY activations for this agreement -> CANCELLED (roster cascade applies)"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /served-agency-agreements/{id}/set-status {to: TERMINATED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["ServedAgencyAgreement.version += 1"]

  - entity: EmergencyActivation
    initial_state: STANDBY
    terminal_states: [DEMOBILIZED, CANCELLED]
    transitions:
      - from: STANDBY
        to: ACTIVATED
        trigger: "POST /emergency-activations/{id}/set-status {to: ACTIVATED}"
        actor: EmergencyCoordinator
        preconditions: ["ServedAgencyAgreement (EmergencyActivation.agreement_id) status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"]
        side_effects: ["activated_by_member_id = caller member id", "activated_at = clock_now", "EmergencyActivation.version += 1"]
      - from: ACTIVATED
        to: DEMOBILIZED
        trigger: "POST /emergency-activations/{id}/set-status {to: DEMOBILIZED}"
        actor: EmergencyCoordinator
        preconditions: ["caller member id != activated_by_member_id (segregation of duties; else ERR_SOD_DEMOBILIZE)"]
        side_effects:
          - "demobilized_at = clock_now"
          - "EmergencyActivation.version += 1"
          - "cascade hop 1: every RosterEntry with activation_id == this activation and status CONFIRMED transitions to RELEASED"
          - "cascade hop 1b: every RosterEntry with status VOLUNTEERED transitions to WITHDRAWN"
          - "cascade hop 2: recompute confirmed_count and staffing_posture on this activation"
      - from: STANDBY
        to: CANCELLED
        trigger: "POST /emergency-activations/{id}/set-status {to: CANCELLED}; agreement termination/expiry cascade; or supersede cascade from a new POST /emergency-activations for the same agreement"
        actor: EmergencyCoordinator | system
        preconditions: []
        side_effects:
          - "EmergencyActivation.version += 1"
          - "cascade: RosterEntry status CONFIRMED -> RELEASED, VOLUNTEERED -> WITHDRAWN"
          - "cascade hop 2: recompute confirmed_count and staffing_posture"

  - entity: RosterEntry
    initial_state: VOLUNTEERED
    terminal_states: [RELEASED, WITHDRAWN, NO_SHOW]
    transitions:
      - from: VOLUNTEERED
        to: CONFIRMED
        trigger: "POST /roster-entries/{id}/set-status {to: CONFIRMED}"
        actor: EmergencyCoordinator
        preconditions:
          - "EmergencyActivation status in {STANDBY, ACTIVATED} (else ERR_INVALID_STATE)"
          - "Member membership_status == ACTIVE (else ERR_MEMBERSHIP_NOT_ACTIVE)"
          - "Member readiness_tier != INELIGIBLE (else ERR_ROSTER_ENTRY_INELIGIBLE)"
          - "activation.confirmed_count < activation.required_operators (else ERR_ROSTER_FULL)"
        side_effects: ["confirmed_at = clock_now", "RosterEntry.version += 1", "recompute activation.confirmed_count and staffing_posture"]
      - from: CONFIRMED
        to: VOLUNTEERED
        trigger: "POST /roster-entries/{id}/set-status {to: VOLUNTEERED} (un-confirm revert)"
        actor: EmergencyCoordinator
        preconditions: ["EmergencyActivation status in {STANDBY, ACTIVATED} (else ERR_INVALID_STATE)"]
        side_effects: ["confirmed_at = null", "RosterEntry.version += 1", "recompute activation.confirmed_count and staffing_posture"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /roster-entries/{id}/set-status {to: RELEASED} or activation DEMOBILIZED/CANCELLED cascade"
        actor: EmergencyCoordinator | system
        preconditions: ["manual release: activation status in {STANDBY, ACTIVATED} (else ERR_INVALID_STATE)"]
        side_effects: ["RosterEntry.version += 1", "recompute activation.confirmed_count and staffing_posture"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /roster-entries/{id}/set-status {to: NO_SHOW}"
        actor: EmergencyCoordinator
        preconditions: ["EmergencyActivation status == ACTIVATED (else ERR_INVALID_STATE)"]
        side_effects: ["RosterEntry.version += 1", "recompute activation.confirmed_count and staffing_posture", "recompute Member readiness fields (no_shows_12m_count += 1 effect)"]
      - from: VOLUNTEERED
        to: WITHDRAWN
        trigger: "POST /roster-entries/{id}/set-status {to: WITHDRAWN} by the owning Member; activation CANCELLED cascade; or Member readiness_tier flip to INELIGIBLE cascade"
        actor: Member | system
        preconditions: ["manual withdrawal: caller is the entry's member_id (else ERR_FORBIDDEN)"]
        side_effects: ["RosterEntry.version += 1"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "Member readiness_tier flip to INELIGIBLE cascade (equipment-privilege suspension path)"
        actor: system
        preconditions: ["member readiness_tier became INELIGIBLE", "activation status in {STANDBY, ACTIVATED}"]
        side_effects: ["RosterEntry.version += 1", "recompute activation.confirmed_count and staffing_posture"]

  - entity: Drill
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /drills/{id}/set-status {to: IN_PROGRESS}"
        actor: EmergencyCoordinator
        preconditions: ["clock_now >= scheduled_start (else ERR_INVALID_STATE)"]
        side_effects: ["Drill.version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /drills/{id}/set-status {to: COMPLETED}"
        actor: EmergencyCoordinator
        preconditions: []
        side_effects: ["Drill.version += 1", "recompute drills_12m_count and readiness fields for every Member with >= 1 DrillMessage on this drill in {RELAYED, DELIVERED}"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /drills/{id}/set-status {to: CANCELLED}"
        actor: EmergencyCoordinator
        preconditions: []
        side_effects: ["Drill.version += 1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /drills/{id}/set-status {to: CANCELLED}"
        actor: EmergencyCoordinator
        preconditions: []
        side_effects: ["Drill.version += 1"]

  - entity: DrillMessage
    initial_state: ORIGINATED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: ORIGINATED
        to: RELAYED
        trigger: "POST /drill-messages/{id}/set-status {to: RELAYED}"
        actor: Member
        preconditions: ["Drill (DrillMessage.drill_id) status == IN_PROGRESS (else ERR_DRILL_NOT_IN_PROGRESS)", "caller membership_status == ACTIVE (else ERR_MEMBERSHIP_NOT_ACTIVE)"]
        side_effects: ["relay_count += 1", "DrillMessage.version += 1"]
      - from: RELAYED
        to: RELAYED
        trigger: "POST /drill-messages/{id}/set-status {to: RELAYED} (relay self-loop)"
        actor: Member
        preconditions: ["Drill status == IN_PROGRESS (else ERR_DRILL_NOT_IN_PROGRESS)", "caller membership_status == ACTIVE"]
        side_effects: ["relay_count += 1", "DrillMessage.version += 1"]
      - from: RELAYED
        to: DELIVERED
        trigger: "POST /drill-messages/{id}/set-status {to: DELIVERED}"
        actor: Member
        preconditions: ["Drill status == IN_PROGRESS (else ERR_DRILL_NOT_IN_PROGRESS)", "status == RELAYED, i.e. relay_count >= 1 — a message that was never relayed cannot be delivered (else ERR_MESSAGE_NOT_RELAYED)"]
        side_effects: ["delivered_at = clock_now", "handling_seconds = delivered_at - created_at in whole seconds", "DrillMessage.version += 1"]
      - from: ORIGINATED
        to: CANCELLED
        trigger: "POST /drill-messages/{id}/set-status {to: CANCELLED}"
        actor: Member
        preconditions: ["caller is originator_member_id or drill status still IN_PROGRESS (else ERR_FORBIDDEN / ERR_INVALID_STATE)"]
        side_effects: ["DrillMessage.version += 1"]
      - from: RELAYED
        to: CANCELLED
        trigger: "POST /drill-messages/{id}/set-status {to: CANCELLED}"
        actor: Member
        preconditions: ["caller is originator_member_id or drill status still IN_PROGRESS"]
        side_effects: ["DrillMessage.version += 1"]

  - entity: FieldDayEvent
    initial_state: PLANNING
    terminal_states: [FINALIZED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /field-day-events/{id}/set-status {to: OPEN}"
        actor: ClubAdmin
        preconditions: ["clock_now >= start_at and clock_now <= end_at (else ERR_INVALID_STATE)"]
        side_effects: ["FieldDayEvent.version += 1"]
      - from: OPEN
        to: SCORING
        trigger: "POST /field-day-events/{id}/set-status {to: SCORING}"
        actor: ClubAdmin
        preconditions: ["clock_now > end_at (else ERR_INVALID_STATE)"]
        side_effects: ["FieldDayEvent.version += 1"]
      - from: SCORING
        to: FINALIZED
        trigger: "POST /field-day-events/{id}/set-status {to: FINALIZED}"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["final_score locked (no longer recomputed)", "FieldDayEvent.version += 1"]

  - entity: ExamSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /exam-sessions/{id}/set-status {to: IN_PROGRESS}"
        actor: ExamLiaison
        preconditions: ["clock_now >= scheduled_at (else ERR_INVALID_STATE)"]
        side_effects: ["ExamSession.version += 1"]
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /exam-sessions/{id}/set-status {to: CLOSED}"
        actor: ExamLiaison
        preconditions: ["every ExamCandidate with session_id == this session is in a terminal state {PASSED, FAILED, NO_SHOW, CANCELLED} (else ERR_CANDIDATES_PENDING)"]
        side_effects: ["ExamSession.version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exam-sessions/{id}/set-status {to: CANCELLED}"
        actor: ExamLiaison
        preconditions: []
        side_effects: ["ExamSession.version += 1", "cascade: candidates in {REGISTERED, CHECKED_IN} -> CANCELLED"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /exam-sessions/{id}/set-status {to: CANCELLED}"
        actor: ExamLiaison
        preconditions: []
        side_effects: ["ExamSession.version += 1", "cascade: candidates in {REGISTERED, CHECKED_IN} -> CANCELLED"]

  - entity: ExamCandidate
    initial_state: REGISTERED
    terminal_states: [PASSED, FAILED, NO_SHOW, CANCELLED]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /exam-candidates/{id}/check-in"
        actor: ExamLiaison
        preconditions: ["ExamSession (ExamCandidate.session_id) status == IN_PROGRESS (else ERR_INVALID_STATE)"]
        side_effects: ["checked_in_by_member_id = caller member id", "ExamCandidate.version += 1"]
      - from: CHECKED_IN
        to: PASSED
        trigger: "POST /exam-candidates/{id}/record-result {score_percent >= 74}"
        actor: ExamLiaison
        preconditions:
          - "ExamSession status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "candidate status == CHECKED_IN (else ERR_CANDIDATE_NOT_CHECKED_IN)"
          - "caller member id != checked_in_by_member_id (segregation of duties; else ERR_SOD_EXAM_GRADING)"
          - "score_percent >= 74 routes here (constants.EXAM_PASS_PERCENT)"
        side_effects:
          - "ExamCandidate.version += 1"
          - "if member_id is set: Member.license_class = element when element is strictly higher than current license_class; Member.license_expires_at = clock_now + 3650 days; Member.version += 1"
      - from: CHECKED_IN
        to: FAILED
        trigger: "POST /exam-candidates/{id}/record-result {score_percent < 74}"
        actor: ExamLiaison
        preconditions: ["ExamSession status == IN_PROGRESS", "candidate status == CHECKED_IN (else ERR_CANDIDATE_NOT_CHECKED_IN)", "caller != checked_in_by_member_id (else ERR_SOD_EXAM_GRADING)"]
        side_effects: ["ExamCandidate.version += 1"]
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /exam-candidates/{id}/mark-no-show"
        actor: ExamLiaison
        preconditions: ["ExamSession status == IN_PROGRESS (else ERR_INVALID_STATE)"]
        side_effects: ["ExamCandidate.version += 1"]
      - from: REGISTERED
        to: CANCELLED
        trigger: "ExamSession CANCELLED cascade"
        actor: system
        preconditions: []
        side_effects: ["ExamCandidate.version += 1"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "ExamSession CANCELLED cascade"
        actor: system
        preconditions: []
        side_effects: ["ExamCandidate.version += 1"]

  - entity: EquipmentLoan
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /equipment-loans/{id}/return {return_condition}"
        actor: Member | ClubAdmin
        preconditions: ["caller is the loan's member_id or ClubAdmin (else ERR_FORBIDDEN)"]
        side_effects:
          - "returned_at = clock_now; late_fee_cents computed per calculations.equipment_late_fee; EquipmentLoan.version += 1"
          - "cascade hop 1 (when return_condition == DAMAGED): Member.equipment_privilege = SUSPENDED, Member.version += 1"
          - "cascade hop 2 (from privilege -> SUSPENDED): recompute Member readiness fields with the -50 privilege penalty"
          - "cascade hop 3 (when readiness_tier flips to INELIGIBLE): every RosterEntry for this member with status in {VOLUNTEERED, CONFIRMED} on an activation in {STANDBY, ACTIVATED} transitions to WITHDRAWN; each CONFIRMED withdrawal recomputes its activation's confirmed_count and staffing_posture"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /equipment-loans/{id}/return {return_condition}"
        actor: Member | ClubAdmin
        preconditions: ["caller is the loan's member_id or ClubAdmin"]
        side_effects: ["same as ACTIVE -> RETURNED, including the three-hop DAMAGED cascade"]
      - from: ACTIVE
        to: OVERDUE
        trigger: "system: logical clock advanced past due_at (POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["clock_now > due_at"]
        side_effects: ["EquipmentLoan.version += 1"]
      - from: ACTIVE
        to: LOST
        trigger: "POST /equipment-loans/{id}/mark-lost"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["late_fee_cents = estimated_value_cents", "EquipmentLoan.version += 1", "Member.equipment_privilege = SUSPENDED with the same hop-2/hop-3 cascade as a DAMAGED return"]
      - from: OVERDUE
        to: LOST
        trigger: "POST /equipment-loans/{id}/mark-lost"
        actor: ClubAdmin
        preconditions: []
        side_effects: ["late_fee_cents = estimated_value_cents", "EquipmentLoan.version += 1", "Member.equipment_privilege = SUSPENDED with the same hop-2/hop-3 cascade as a DAMAGED return"]

concurrency_rules:
  - rule_id: coordination-create-stale-repeater
    parent_entity: Repeater
    write_endpoint: "POST /coordination-requests"
    occ_field: "expected_repeater_version"
    description: |
      Creating a CoordinationRequest against a Repeater whose version has advanced
      since the client last observed it is rejected. A new request legitimately
      supersedes any existing DRAFT/SUBMITTED request for the same repeater (they
      transition to WITHDRAWN), so a second create issued with a repeater version
      observed before an intervening create carries a stale view of the repeater
      and must be refused rather than silently superseding again.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: activation-create-stale-agreement
    parent_entity: ServedAgencyAgreement
    write_endpoint: "POST /emergency-activations"
    occ_field: "expected_served_agency_agreement_version"
    description: |
      Creating an EmergencyActivation against a ServedAgencyAgreement whose version
      has advanced since the client last observed it is rejected. A new STANDBY
      activation legitimately supersedes the prior STANDBY activation for the same
      agreement (it transitions to CANCELLED), so a create carrying a stale
      agreement version is refused instead of cascading on an out-of-date view.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: contact_points
    trigger: "computed at POST /field-day-contacts creation time and stored on FieldDayContact.points; immutable afterwards"
    algorithm: tiered_pricing
    formula: |
      base = { CW: 2, DIGITAL: 2, PHONE: 1 }[mode]
      power_mult = { QRP: 5, LOW: 2, HIGH: 1 }[power_category]
      band_bonus = 2 if band in { B6M, B2M } else 0
      points = min(PER_CONTACT_CAP, base * power_mult + band_bonus)
    input_set: "the single FieldDayContact being created (mode, band, power_category)"
    constants:
      PER_CONTACT_CAP: 10
    precision: "integer; no rounding needed"
    variants: []

  - name: field_day_scores
    trigger: "recomputed live on every FieldDayContact create and on every set-duplicate toggle, while the event is not FINALIZED; final_score is locked by the SCORING -> FINALIZED transition"
    algorithm: aggregation
    formula: |
      provisional_score = sum(points over all FieldDayContact with event_id == event)
                          + (BONUS_POINTS if count(all contacts) >= BONUS_THRESHOLD else 0)
      final_score       = sum(points over FieldDayContact with event_id == event AND is_duplicate == false)
                          + (BONUS_POINTS if count(is_duplicate == false contacts) >= BONUS_THRESHOLD else 0)
    input_set: "provisional: ALL FieldDayContact of the event, duplicates included (optimistic: assumes flags will be cleared). final: only contacts with is_duplicate == false. Contact input order is irrelevant (pure sum); ties impossible."
    constants:
      BONUS_THRESHOLD: 100
      BONUS_POINTS: 100
    precision: "integer"
    variants:
      - name: provisional
        when: "always recomputed; the score displayed while the event is OPEN or SCORING"
        difference: "includes is_duplicate == true contacts in both the sum and the bonus threshold count"
      - name: final
        when: "recomputed live until SCORING -> FINALIZED, then locked and never recomputed"
        difference: "excludes is_duplicate == true contacts from both the sum and the bonus threshold count"

  - name: member_readiness
    trigger: "recomputed on: CheckIn creation; NetSession -> CLOSED or -> CANCELLED (for every checked-in member); Drill -> COMPLETED (for participants); RosterEntry -> NO_SHOW; Member renew / suspend / reinstate / lapse; EquipmentLoan DAMAGED return or mark-lost (privilege change)"
    algorithm: weighted_scoring
    formula: |
      ci = min(check_ins_count / CHECKIN_TARGET, 1.0)
      dr = min(drills_count / DRILL_TARGET, 1.0)
      bonus = BONUS_NO_SHOW_FREE if no_shows_12m_count == 0 else 0
      penalty = PRIVILEGE_PENALTY if equipment_privilege == SUSPENDED else 0
      score = max(0, round_half_up(W_CHECKIN * ci + W_DRILL * dr + bonus - penalty))
      readiness_tier = ELIGIBLE if score >= TIER_ELIGIBLE_MIN
                       else PROVISIONAL if score >= TIER_PROVISIONAL_MIN
                       else INELIGIBLE
    input_set: |
      verified variant (readiness_score): check_ins_count = CheckIn rows by this member on NetSessions with status == CLOSED and checked_in_at within trailing 365 days of the logical clock; drills_count = Drills with status == COMPLETED, scheduled_start within trailing 365 days, where the member has >= 1 DrillMessage in {RELAYED, DELIVERED}.
      optimistic variant (readiness_score_optimistic): identical except nets with status in {OPEN, CLOSED} count and drills with status in {IN_PROGRESS, COMPLETED} count. no_shows_12m_count counts RosterEntry with status NO_SHOW and updated_at within trailing 365 days in both variants.
    constants:
      W_CHECKIN: 50
      CHECKIN_TARGET: 6
      W_DRILL: 30
      DRILL_TARGET: 2
      BONUS_NO_SHOW_FREE: 20
      PRIVILEGE_PENALTY: 50
      TIER_ELIGIBLE_MIN: 70
      TIER_PROVISIONAL_MIN: 40
    precision: "score rounded half-up to integer AFTER summing all weighted components (single final rounding; components are not pre-rounded)"
    variants:
      - name: verified
        when: "stored on Member.readiness_score; gates roster confirmation and volunteering"
        difference: "counts only CLOSED nets and COMPLETED drills"
      - name: optimistic
        when: "stored on Member.readiness_score_optimistic; informational only, never gates"
        difference: "also counts OPEN nets and IN_PROGRESS drills"

  - name: equipment_late_fee
    trigger: "computed at POST /equipment-loans/{id}/return and at POST /equipment-loans/{id}/mark-lost; stored on EquipmentLoan.late_fee_cents"
    algorithm: aggregation
    formula: |
      if transition is mark-lost: late_fee_cents = estimated_value_cents; stop.
      if returned_at <= due_at: late_fee_cents = 0; stop.
      days_overdue = ceil((returned_at - due_at) / 86400 seconds)
      base_fee_cents = round_half_up(days_overdue * DAILY_RATE_CENTS)
      damage_fee_cents = round_half_up(estimated_value_cents * DAMAGE_RATE) if return_condition == DAMAGED else 0
      late_fee_cents = min(estimated_value_cents, base_fee_cents + damage_fee_cents)
    input_set: "the single EquipmentLoan being closed"
    constants:
      DAILY_RATE_CENTS: 150
      DAMAGE_RATE: 0.10
    precision: |
      2-component nested rounding, order PINNED: each fee component is rounded half-up to whole cents FIRST,
      the rounded components are then summed, and the cap min(estimated_value_cents, ...) is applied LAST.
      (Summing unrounded components and rounding once is a different, non-conformant algorithm.)
    variants: []

  - name: membership_renewal
    trigger: "POST /members/{id}/renew"
    algorithm: chronological
    formula: |
      base_instant = max(clock_now, dues_paid_through or 1970-01-01T00:00:00Z)
      dues_paid_through = base_instant + periods * 365 days
      renewal_amount_cents = periods * ANNUAL_DUES_CENTS
    input_set: "the single Member being renewed"
    constants:
      ANNUAL_DUES_CENTS: 3600
    precision: "datetime arithmetic in whole days; amount in integer cents"
    variants: []

  - name: activation_staffing
    trigger: "recomputed on every RosterEntry transition into or out of CONFIRMED (confirm, un-confirm, release, no-show, tier-flip withdrawal)"
    algorithm: threshold
    formula: |
      confirmed_count = count(RosterEntry with activation_id == activation AND status == CONFIRMED)
      staffing_posture = ADEQUATE if confirmed_count >= required_operators else UNDERSTAFFED
    input_set: "RosterEntry rows of the activation with status == CONFIRMED only"
    constants: {}
    precision: "integer counts; boundary is >= (confirmed_count exactly == required_operators is ADEQUATE and blocks further confirms with ERR_ROSTER_FULL)"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles; for entity_backed roles X-User-ID references an existing Member"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "caller's role is listed in the endpoint's roles; ownership sub-checks (net control owns the net, member owns the roster entry/loan/contact/message) where declared"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path ids and body foreign keys reference existing resources, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "the primary resource the endpoint acts on is in a valid from-state for the requested transition; invalid-from (including terminal-state) requests rejected. Covers ERR_INVALID_STATE and domain state errors ERR_NET_NOT_OPEN (check-in target net), ERR_NET_WINDOW_NOT_STARTED, ERR_DRILL_NOT_IN_PROGRESS (message target drill), ERR_MESSAGE_NOT_RELAYED, ERR_EVENT_NOT_OPEN (contact target event), ERR_EVENT_FINALIZED, ERR_CANDIDATE_NOT_CHECKED_IN, ERR_ACTIVATION_NOT_OPEN (roster target activation), ERR_LOAN_NOT_OUTSTANDING, ERR_CANDIDATES_PENDING"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "segregation of duties: demobilizer != activator (ERR_SOD_DEMOBILIZE); exam result recorder != checked_in_by (ERR_SOD_EXAM_GRADING)"
    error_id: ERR_SOD_DEMOBILIZE
    http_status: 403
    applies_to: "POST /emergency-activations/{id}/set-status, POST /exam-candidates/{id}/record-result"
  - priority: 6
    category: business_constraint
    check: "field-domain and structural rules: callsign/repeater-callsign/event-name uniqueness (ERR_CALLSIGN_TAKEN / ERR_REPEATER_CALLSIGN_TAKEN / ERR_EVENT_NAME_TAKEN); license class ordinal >= required (ERR_LICENSE_CLASS_INSUFFICIENT); license not expired at clock now (ERR_LICENSE_EXPIRED); coordination frequency inside [144.0,148.0] or [420.0,450.0] MHz (ERR_FREQUENCY_OUT_OF_BAND); check-in traffic consistency has_traffic == (traffic_count >= 1) (ERR_INVALID_TRAFFIC_COUNT); one check-in per (net, member) (ERR_ALREADY_CHECKED_IN); one roster entry per (activation, member) (ERR_ALREADY_ON_ROSTER); FRN unique per session (ERR_DUPLICATE_CANDIDATE_FRN); at most one outstanding loan per item_tag (ERR_ITEM_ON_LOAN); loan due_at > now and <= now + 90 days (ERR_LOAN_WINDOW_INVALID); required_operators <= agreement.max_operators (ERR_REQUIRED_OPERATORS_EXCEED_AGREEMENT)"
    error_id: ERR_LICENSE_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "create/action endpoints as listed per rule"
  - priority: 7
    category: business_temporal
    check: "interval rules: NetSession half-open [scheduled_start, scheduled_end) overlap on the same repeater among nets in {SCHEDULED, OPEN} — adjacent nets (end == start) are allowed (ERR_NET_TIME_CONFLICT); AntennaSiteAgreement closed-interval [lease_start, lease_end] overlap on the same site_name among agreements in {NEGOTIATION, ACTIVE} — touching endpoints count as overlap (ERR_SITE_WINDOW_CONFLICT)"
    error_id: ERR_NET_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /net-sessions, POST /antenna-site-agreements, POST /antenna-site-agreements/{id}/set-status"
  - priority: 8
    category: business_referential
    check: "referenced-entity state: member membership_status == ACTIVE for check-in / volunteer / drill message / field day contact / equipment loan (ERR_MEMBERSHIP_NOT_ACTIVE); member equipment_privilege == GOOD_STANDING for new loans (ERR_EQUIPMENT_PRIVILEGE_SUSPENDED); readiness_tier != INELIGIBLE for roster volunteer/confirm (ERR_ROSTER_ENTRY_INELIGIBLE); served-agency agreement must be in {DRAFT, ACTIVE} at activation create and ACTIVE at STANDBY -> ACTIVATED (ERR_AGREEMENT_NOT_ACTIVE); repeater site agreement ACTIVE (ERR_SITE_AGREEMENT_INACTIVE) and a GRANTED coordination exists (ERR_NO_COORDINATION_GRANT) before a repeater goes OPERATIONAL; reinstatement requires dues_paid_through > now (ERR_DUES_LAPSED)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "member-facing create/action endpoints as listed per rule"
  - priority: 9
    category: business_fiscal
    check: "capacity/quota: activation.confirmed_count < required_operators before confirm (ERR_ROSTER_FULL); session registered_count < max_candidates before registration (ERR_SESSION_FULL)"
    error_id: ERR_ROSTER_FULL
    http_status: 409
    applies_to: "POST /roster-entries/{id}/set-status, POST /exam-candidates"

