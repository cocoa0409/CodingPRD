      - name: mission_family_and_unrelated_branches_apply_the_declared_point_constants
        claim_type: constants_applied
        grounds:
          - calculations.mission_program_alignment_score
          - entities.AlignmentAssessment.fields.mission_alignment_points
        distinguishing_aspect: |
          The mission component is a three-way branch keyed on the mission_code STRING,
          and family() is defined as the two characters BEFORE the first hyphen.
          YM-YOUTH_MENTORING against YM-PEER_SUPPORT is a family match worth exactly
          MISSION_FAMILY_POINTS 28.00, while YM-YOUTH_MENTORING against FS-FOOD_BANK is
          unrelated and worth exactly MISSION_UNRELATED_POINTS 12.00. Running both deals
          from the SAME initiator with identical financials isolates the 16-point
          difference to the family test, and it drops the composite across a rating
          band: 48.00 WEAK versus 32.00 NOT_VIABLE.
        test_recipe:
          setup:
            - "Three CA organizations with annual_expense_cents 100000002 each: A with mission_code YM-YOUTH_MENTORING and unrestricted_net_assets_cents 59916670, B with YM-PEER_SUPPORT and 40000000, C with FS-FOOD_BANK and 40000000"
            - "No Programs anywhere, so the overlap denominator is 0 and the overlap component is pinned at 0.00 in both deals"
            - "Two Restructurings, A-B and A-C, both initiated by A"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
