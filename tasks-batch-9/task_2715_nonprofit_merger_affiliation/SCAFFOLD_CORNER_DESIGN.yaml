              as_user_id: "${org_a}"
              captures: { unr: $.data.id }
          assert:
            - "both calls return HTTP status 201"
            - "AlignmentAssessment.${fam}.mission_alignment_points == 28.00"
            - "AlignmentAssessment.${fam}.included_program_count == 0"
            - "AlignmentAssessment.${fam}.program_overlap_index == 0.0000"
            - "AlignmentAssessment.${fam}.program_overlap_points == 0.00"
            - "AlignmentAssessment.${fam}.reserve_months == 5.99"
            - "AlignmentAssessment.${fam}.sustainability_points == 20.00"
            - "AlignmentAssessment.${fam}.composite_score == 48.00"
            - "AlignmentAssessment.${fam}.composite_rating == WEAK"
            - "AlignmentAssessment.${unr}.mission_alignment_points == 12.00"
            - "AlignmentAssessment.${unr}.composite_score == 32.00"
            - "AlignmentAssessment.${unr}.composite_rating == NOT_VIABLE"
            - "AlignmentAssessment.${fam}.sequence_no == 1 and AlignmentAssessment.${unr}.sequence_no == 1, because sequence_no is per Restructuring"

