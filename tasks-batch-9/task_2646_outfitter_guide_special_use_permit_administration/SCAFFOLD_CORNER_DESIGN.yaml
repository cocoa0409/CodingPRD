            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MAJOR", action_type: "WARNING", cited_provision: "36 CFR 251.60(a)", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MAJOR", action_type: "SUSPENSION", cited_provision: "36 CFR 251.60(a)", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "CITATION", cited_provision: "36 CFR 251.56(a)", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/noncompliance-actions"
              payload: {}
              as: PermitSpecialist
          assert:
            - "MINOR + SUSPENSION returns HTTP 422 ERR_ACTION_TYPE_NOT_ALLOWED — MINOR admits WARNING only"
            - "MINOR + WARNING returns 201 and the permit's open_noncompliance_points becomes 2"
            - "MODERATE + REVOCATION returns HTTP 422 ERR_ACTION_TYPE_NOT_ALLOWED — MODERATE admits WARNING or SUSPENSION"
            - "MODERATE + SUSPENSION returns 201 and points becomes 7 (2 + 5)"
            - "MAJOR + WARNING returns HTTP 422 ERR_ACTION_TYPE_NOT_ALLOWED — MAJOR admits SUSPENSION or REVOCATION, and WARNING being legal for two other severities does not make it legal here"
            - "MAJOR + SUSPENSION returns 201 and points becomes 17 (2 + 5 + 10)"
            - "MINOR + action_type CITATION returns HTTP 400 ERR_INVALID_REQUEST, not the 422 matrix error: an undeclared enum member is rejected at priority 3, long before the priority-11 conditional table"
            - "the permit ends at open_noncompliance_points 17 and compliance_status NONCOMPLIANT while administrative_status stays ISSUED, and the action listing has exactly 3 rows — the four rejected requests wrote nothing"

      - name: payment_boundary_passes_at_exactly_the_balance_and_fails_one_cent_over
