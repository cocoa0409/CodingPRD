          Different resource (Courier) and different interval geometry: closed-interval + buffer. With
          buffer 30min, an existing slot [09:00,10:00] blocks any slot within 30 min — [10:15,11:00]
          is rejected (would be allowed under half-open vehicle geometry), while [10:31,11:30] passes.
        test_recipe:
