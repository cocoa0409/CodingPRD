      - name: cost_rollup_with_a_child_fresh_under_a_different_basis_is_rejected
        claim_type: variant_selection
        grounds:
          - calculations.recipe_cost_rollup
          - validations[priority 26] ERR_COST_STALE
          - constants.WEIGHTED_AVG_WINDOW_DAYS
        distinguishing_aspect: "The child is FRESH and, because it has a single price window covering the whole 90-day lookback, WEIGHTED_AVG_90D and LATEST_PUBLISHED produce the IDENTICAL batch_cost_micros of 1268499. The parent roll-up under LATEST_PUBLISHED must still fail with ERR_COST_STALE: the gate compares the child's cost_basis label, not its number, so an implementation that only checks cost_state == FRESH or that compares figures passes this by accident. Re-rolling the child under the requested basis then lets the parent through with the same arithmetic."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-31T00:00:00.000Z. PEANUT-OIL (pack_base_units 946) PUBLISHED in MW at 12000000 micros with effective_from 2026-07-01 and effective_to null."
            - "SUB-SAUCE (SUB_RECIPE, MILLILITER, batch_yield 2000, portions 20) with PEANUT-OIL at ep 100, rolled up under WEIGHTED_AVG_90D and ACTIVE. PLATE-OILY (PLATED, EACH, batch_yield 5, portions 5) holds one SUB_RECIPE component on SUB-SAUCE at ep 500 and is DRAFT with cost_state STALE."
          setup_api_calls:
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Oil", base_uom: "MILLILITER", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-SAUCE", name: "Peanut Sauce", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 2000, portions_per_batch: 20 }
              as: RecipeDeveloper
              captures: { sauce_id: $.data.id, sauce_v0: $.data.version }
            - call: "POST /culinary/recipes/${sauce_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${oil_id}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sauce_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sauce_id}/cost-rollup"
              payload: { basis: "WEIGHTED_AVG_90D" }
              as: CostAnalyst
              captures: { w_batch: $.data.batch_cost_micros, w_state: $.data.cost_state, w_basis: $.data.cost_basis }
            - call: "POST /culinary/recipes/${sauce_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sauce_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-OILY", name: "Oily Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 5, portions_per_batch: 5 }
              as: RecipeDeveloper
              captures: { plate_id: $.data.id, plate_v0: $.data.version }
            - call: "POST /culinary/recipes/${plate_id}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sauce_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${plate_v0}" }
              as: RecipeDeveloper
          trigger:
            - call: "POST /culinary/recipes/${plate_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /culinary/recipes/${plate_id}"
              as: CostAnalyst
              captures: { p_state: $.data.cost_state, p_batch: $.data.batch_cost_micros, p_basis: $.data.cost_basis }
            - call: "POST /culinary/recipes/${sauce_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { l_batch: $.data.batch_cost_micros, l_basis: $.data.cost_basis }
            - call: "POST /culinary/recipes/${plate_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { ok_batch: $.data.batch_cost_micros, ok_portion: $.data.portion_cost_micros, ok_state: $.data.cost_state, ok_basis: $.data.cost_basis }
          assert:
            - "${w_batch} == 1268499 with ${w_state} == FRESH and ${w_basis} == WEIGHTED_AVG_90D: the single candidate window [2026-07-01, null) intersects [2026-05-02, 2026-07-31) for 30 whole days, per_base_unit_micros == round_half_up(12000000*1000000/946) == 12684989429 against a pack_base_units_snapshot of 1000000, so extended == round_half_up(100*12684989429/1000000) == 1268499"
            - "${err} == ERR_COST_STALE (409) even though the child is FRESH and its figure equals the LATEST_PUBLISHED figure exactly — the basis label mismatch alone is disqualifying"
            - "${p_state} == STALE, ${p_batch} == 0 and ${p_basis} == null — the failed roll-up wrote nothing on the parent"
            - "${l_batch} == 1268499 == ${w_batch} and ${l_basis} == LATEST_PUBLISHED — only the label changed"
            - "${ok_batch} == 317125 == round_half_up(500*1268499/2000), ${ok_portion} == 63425, ${ok_state} == FRESH and ${ok_basis} == LATEST_PUBLISHED"

      - name: lto_costing_with_a_promo_price_below_the_plate_cost_still_succeeds
