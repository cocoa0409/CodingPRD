  - method: GET
    path: "/siting/nonconformances/{nonconformanceId}"
    description: "Read one nonconformance with its frozen deduction_points"
    roles: *all_roles
    code: 200
    input: []
    output: Nonconformance
    side_effects: []

  - method: GET
    path: "/siting/planning-studies"
    description: "List planning studies across projects (filtered-list FK reverse lookup for PlanningStudy.project_id)"
    roles: *all_roles
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: PlanningStudy[]
    side_effects: []

  - method: GET
    path: "/siting/alternatives"
    description: "List alternatives across studies (filtered-list FK reverse lookup for Alternative.study_id)"
    roles: *all_roles
    code: 200
    input: ["study_id?", "kind?", "screening_status?", "limit?", "offset?"]
    output: Alternative[]
