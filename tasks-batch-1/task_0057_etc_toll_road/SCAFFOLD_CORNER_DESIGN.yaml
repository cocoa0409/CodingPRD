  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_vehicle_version_on_binding
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[binding-create-stale-vehicle]", "validations[priority=17]"]
        distinguishing_aspect: "Creating a second binding with expected_vehicle_version one behind the current version returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["A vehicle whose first binding (now ended) already bumped its version; client holds the pre-bind version."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Oc1", home_state_code: "NY" }
              as: TollOperator
              captures: { oc1: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${oc1}", plate_number: "OC1V", plate_state_code: "NY" }
              as: TollOperator
              captures: { oc1v: $.data.id, oc1v_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${oc1}", serial: "TP-OC1A" }
              as: TollOperator
              captures: { oc1tpa: $.data.id }
            - call: "POST /etc/transponders"
              payload: { account_id: "${oc1}", serial: "TP-OC1B" }
              as: TollOperator
              captures: { oc1tpb: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${oc1tpa}", vehicle_id: "${oc1v}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-02-01T00:00:00Z", expected_vehicle_version: "${oc1v_ver}" }
              as: AccountHolder
              as_user_id: "${oc1}"
              captures: { bind_a: $.data.id }
            - call: "POST /etc/transponder-bindings/${bind_a}/end"
              payload: {}
              as: AccountHolder
              as_user_id: "${oc1}"
          trigger:
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${oc1tpb}", vehicle_id: "${oc1v}", effective_from: "2026-03-01T00:00:00Z", expected_vehicle_version: "${oc1v_ver}" }
              as: AccountHolder
              as_user_id: "${oc1}"
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response http_status == 412"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reprice-stale-transaction]"]
        excluded_because:
          difficulty_instance: compensating_invariant / reprice_balance_conservation
          rationale: "The successful reprice with the current captured transaction version (and the resulting version bump) is exercised by that invariant instance."

      - name: rate_threshold_no_reload_above_threshold
        claim_type: rate_threshold_triggers
        grounds: [calculations.auto_reload_amount]
        distinguishing_aspect: "A toll leaving balance at 1001 (threshold+1) does NOT trigger auto-reload, the exclusive side of the <= boundary."
        test_recipe:
          setup: ["Account FIXED reload 4000, threshold 1000, balance 1401; transponder bound; off-peak base 400 leaves 1001."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Nr", home_state_code: "NY", auto_reload_enabled: true, reload_policy: "FIXED", reload_amount_cents: 4000, low_balance_threshold_cents: 1000 }
              as: TollOperator
              captures: { nr: $.data.id }
            - call: "POST /etc/accounts/${nr}/credit"
              payload: { amount_cents: 1401 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${nr}", plate_number: "NR1", plate_state_code: "NY" }
              as: TollOperator
              captures: { nrv: $.data.id, nrvv: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${nr}", serial: "TP-NR" }
              as: TollOperator
              captures: { nrtp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${nrtp}", vehicle_id: "${nrv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${nrvv}" }
              as: AccountHolder
              as_user_id: "${nr}"
            - call: "POST /etc/plazas"
              payload: { name: "Pnr", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pnr: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pnr}", read_method: "TRANSPONDER", read_at: "2026-03-14T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${nrtp}" }
              as: TollOperator
              captures: { nrtxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${nrtxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "Account.${nr}.balance_cents == 1001"

      - name: derived_outstanding_fines_recomputed_on_issue
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.outstanding_fines_cents, calculations.account_outstanding_fines]
        distinguishing_aspect: "After opening a violation (fine_total 3250) on an account, outstanding_fines_cents reads 3250 (derived field reconciled on create)."
        test_recipe:
          setup: ["An account with a plate read priced; a violation about to be opened."]
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Df", home_state_code: "NY" }
              as: TollOperator
              captures: { df: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${df}", plate_number: "DF1", plate_state_code: "NY" }
              as: TollOperator
            - call: "POST /etc/plazas"
              payload: { name: "Pdf", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { pdf: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pdf}", read_method: "PLATE", read_at: "2026-03-15T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "DF1", plate_state_code: "NY" }
              as: TollOperator
              captures: { dftxn: $.data.id }
            - call: "POST /etc/toll-transactions/${dftxn}/price"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${dftxn}" }
              as: TollOperator
              captures: { dfviol: $.data.id }
          assert:
            - "Account.${df}.outstanding_fines_cents == 3250"
            - "Account.${df}.status == DELINQUENT"

      - name: cascade_ordering_price_then_reload_ledger_sequence
        claim_type: cascading_side_effects
        grounds: [state_machines.TollTransaction.PENDING_to_PRICED, calculations.auto_reload_amount]
        excluded_because:
          difficulty_instance: transitive_cascade / price_debit_lowbalance_autoreload_depth3
          rationale: "The price -> debit -> auto-reload cascade ordering and ledger entries are asserted in that depth-3 cascade instance."

