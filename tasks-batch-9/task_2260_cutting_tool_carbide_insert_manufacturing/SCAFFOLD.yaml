# =============================================================================
# PRD Benchmark Scaffold — Cutting Tool & Carbide Insert Manufacturing
# Difficulty band: Expert+ (13 entities / 73 endpoints / 66 errors / 13 calcs /
#                  12 state machines / 43 ordered validations / 7 roles /
#                  2 OCC rules)
# =============================================================================

scenario: "2260. Cutting Tool & Carbide Insert Manufacturing (metal cutting tool manufacturer): carbide powder blending, pressing and sintering with grade development for material-specific applications, geometry design with chip breaker development and application testing on target workpiece materials, coating deposition processes with layer composition and adhesion testing, grinding operations for solid carbide tools with wheel management and tolerance control, product qualification through machining trials with tool life and surface finish measurement, catalog versus special tool orders with engineering lead time and minimum quantities, application engineering support with speeds and feeds recommendations, regrinding and reconditioning services with tool life extension programs"

domain_name: cutting-tool-carbide-manufacturing
api_prefix: /tooling

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency

  entity_topology: graph
  # ToolProduct is a join node over CarbideGrade x InsertGeometry x CoatingRecipe,
  # is self-referential (special tool -> base catalog product), and
  # ReconditionJob is self-referential (regrind pass chain). No nesting in URL
  # paths: every collection sits directly under /tooling and links by FK.

  state_machine_shape: parallel
  # ToolProduct carries two independent dimensions (release_status x supply_status)
  # and PowderBlendBatch carries two more (stage x qc_status). Cycles exist on
  # CarbideGrade (QUALIFIED->DRAFT), InsertGeometry (RELEASED->DRAFT),
  # GrindingWheel (AVAILABLE->DRESSING->AVAILABLE) and ToolOrder
  # (CONFIRMED->ENGINEERING_REVIEW->CONFIRMED, ON_HOLD->SUBMITTED).
  # QualificationDossier and ToolOrder are branching (fork on decision / order_class).

  relationship_patterns:
    - one_to_many
    - many_to_many        # ToolProduct joins grade x geometry x coating recipe
    - self_referential    # ToolProduct.base_catalog_product_id, ReconditionJob.predecessor_job_id
    - cross_aggregate     # MachiningTrial spans QualificationDossier and PowderBlendBatch

  role_model: segregation_of_duties
  # QualityApprover may not decide a dossier they submitted, nor one containing a
  # trial they operated. Engineering roles own disjoint resource families.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: CarbideGrade
    parent: null
    common_fields: true
    fields:
      - { name: grade_code, type: string, source: input, description: "Human grade designation, e.g. GC4325", constraints: "unique across CarbideGrade; 3..24 chars" }
      - { name: target_workpiece_group, type: enum, source: input, description: "ISO material group the grade is developed for", constraints: "one of P, M, K, N, S, H" }
      - { name: co_binder_pct, type: number, source: input, description: "Cobalt binder mass percent of the blend", constraints: "3.0 <= v <= 15.0, 1 decimal" }
      - { name: wc_grain_um, type: number, source: input, description: "Tungsten-carbide mean grain size in micrometres", constraints: "0.2 <= v <= 6.0, 1 decimal" }
      - { name: hardness_hv, type: integer, source: input, description: "Target Vickers hardness of the sintered body", constraints: "1200 <= v <= 2000" }
      - { name: trs_mpa, type: integer, source: input, description: "Target transverse rupture strength in MPa", constraints: "1000 <= v <= 4500" }
      - { name: status, type: enum, source: system, description: "Grade development lifecycle state", default: DRAFT, constraints: "DRAFT, PILOT, QUALIFIED, RETIRED" }
      - { name: revision, type: integer, source: system, description: "Blend/sinter recipe revision, incremented on every revise", default: 1 }
      - { name: qualified_product_count, type: integer, source: computed, description: "Count of ToolProduct rows with release_status IN {RELEASED, RESTRICTED} whose grade_id is this grade", default: 0 }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the MetallurgyEngineer that created the grade" }

  - name: PowderBlendBatch
    parent: CarbideGrade
    common_fields: true
    fields:
      - { name: grade_id, type: string, source: input, description: "FK -> CarbideGrade.id; grade whose blend recipe this batch realizes" }
      - { name: batch_code, type: string, source: input, description: "Shop-floor batch identifier", constraints: "unique across PowderBlendBatch" }
      - { name: planned_mass_kg, type: number, source: input, description: "Planned blended powder mass in kilograms", constraints: "v > 0, 2 decimals" }
      - { name: pinned_grade_revision, type: integer, source: system, description: "CarbideGrade.revision captured when the batch was blended" }
      - { name: stage, type: enum, source: system, description: "Physical process dimension, independent of qc_status", default: BLENDED, constraints: "BLENDED, PRESSED, SINTERED, CONSUMED" }
      - { name: qc_status, type: enum, source: system, description: "Metallurgical acceptance dimension, independent of stage", default: PENDING, constraints: "PENDING, PASSED, FAILED, QUARANTINED" }
      - { name: pressed_units, type: integer, source: system, description: "Green compacts produced by the pressing step", default: 0 }
      - { name: sintered_units, type: integer, source: system, description: "Good units after sintering", default: 0 }
      - { name: scrap_units, type: integer, source: system, description: "Units lost during sintering", default: 0 }
      - { name: remaining_units, type: integer, source: computed, description: "sintered_units minus units consumed by MachiningTrial rows with status IN {RUNNING, COMPLETED}", default: 0 }
      - { name: measured_density_gcc, type: number, source: system, description: "Measured sintered density in g/cm3, set by the sinter step", constraints: "nullable, 2 decimals" }
      - { name: measured_hardness_hv, type: integer, source: system, description: "Measured Vickers hardness, set by the sinter step", constraints: "nullable" }
      - { name: yield_pct, type: number, source: computed, description: "100 * sintered_units / pressed_units, 2 decimals, null before sintering", constraints: "nullable" }

  - name: InsertGeometry
    parent: null
    common_fields: true
    fields:
      - { name: geometry_code, type: string, source: input, description: "Geometry designation, e.g. WM-MM4", constraints: "unique across InsertGeometry" }
      - { name: iso_designation, type: string, source: input, description: "ISO insert/tool designation string" }
      - { name: application_class, type: enum, source: input, description: "Intended cut severity class; drives life and Ra acceptance limits", constraints: "ROUGHING, MEDIUM, FINISHING" }
      - { name: chipbreaker_code, type: string, source: input, description: "Chip breaker development code" }
      - { name: rake_angle_deg, type: number, source: input, description: "Effective rake angle in degrees", constraints: "-10.0 <= v <= 25.0" }
      - { name: nose_radius_mm, type: number, source: input, description: "Nose radius in millimetres", constraints: "0.05 <= v <= 3.2" }
      - { name: max_depth_of_cut_mm, type: number, source: input, description: "Maximum depth of cut the geometry supports", constraints: "v > 0" }
      - { name: edge_prep, type: enum, source: input, description: "Cutting-edge preparation", constraints: "SHARP, HONED, CHAMFERED, T_LAND" }
      - { name: status, type: enum, source: system, description: "Geometry release state", default: DRAFT, constraints: "DRAFT, RELEASED" }
      - { name: revision, type: integer, source: system, description: "Geometry/chip-breaker revision, incremented on every revise", default: 1 }

  - name: CoatingRecipe
    parent: null
    common_fields: true
    fields:
      - { name: recipe_code, type: string, source: input, description: "Coating recipe code", constraints: "unique across CoatingRecipe" }
      - { name: deposition_type, type: enum, source: input, description: "Deposition process family", constraints: "PVD, CVD" }
      - { name: layers, type: array, source: input, description: "Ordered layer stack, each { material, thickness_um }", constraints: "1..6 entries; material one of TiN, TiAlN, AlCrN, Al2O3, TiCN; 0.10 <= thickness_um <= 8.00" }
      - { name: total_thickness_um, type: number, source: computed, description: "Sum of layers[*].thickness_um, 2 decimals" }
      - { name: revision, type: integer, source: system, description: "Recipe revision, incremented on every revise", default: 1 }
      - { name: adhesion_class, type: integer, source: computed, description: "Lowest (best) adhesion_hf_class over CoatingRun rows with status COMPLETED and pinned_recipe_revision == this revision; null when none", constraints: "nullable, 1..6" }
      - { name: is_validated, type: boolean, source: computed, description: "True iff at least one CoatingRun with status COMPLETED, pinned_recipe_revision == revision, adhesion_hf_class <= 2 and abs(measured_thickness_um - total_thickness_um) <= 0.15 * total_thickness_um", default: false }

  - name: CoatingRun
    parent: CoatingRecipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> CoatingRecipe.id; recipe deposited in this chamber load" }
      - { name: chamber_id, type: enum, source: input, description: "Deposition chamber occupied by this run", constraints: "CH1, CH2, CH3" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the chamber occupation window (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the chamber occupation window (ISO 8601 UTC)" }
      - { name: loaded_area_cm2, type: number, source: input, description: "Total substrate surface area loaded into the chamber", constraints: "v > 0, 2 decimals" }
      - { name: pinned_recipe_revision, type: integer, source: system, description: "CoatingRecipe.revision captured at scheduling time" }
      - { name: adhesion_hf_class, type: integer, source: system, description: "Rockwell-C indentation adhesion class measured at completion (1 best .. 6 worst)", constraints: "nullable, 1..6" }
      - { name: measured_thickness_um, type: number, source: system, description: "Measured total coating thickness at completion", constraints: "nullable, 2 decimals" }
      - { name: status, type: enum, source: system, description: "Chamber run state", default: SCHEDULED, constraints: "SCHEDULED, COMPLETED" }

  - name: GrindingWheel
    parent: null
    common_fields: true
    fields:
      - { name: wheel_code, type: string, source: input, description: "Wheel asset code", constraints: "unique across GrindingWheel" }
      - { name: spec_code, type: string, source: input, description: "Abrasive specification, e.g. D46-C75-B" }
      - { name: initial_life_units, type: integer, source: input, description: "Abrasive life units available between dressings", constraints: "100 <= v <= 100000" }
      - { name: consumed_life_units, type: integer, source: computed, description: "Sum of consumed_life_units over GrindingRun rows with status COMPLETED on this wheel since the last dress, plus reconditioning consumption", default: 0 }
      - { name: remaining_life_units, type: integer, source: computed, description: "initial_life_units - consumed_life_units", default: 0 }
      - { name: dress_count, type: integer, source: system, description: "Number of completed dressing operations", default: 0 }
      - { name: status, type: enum, source: system, description: "Wheel availability state", default: AVAILABLE, constraints: "AVAILABLE, DRESSING, EXPIRED" }

  - name: GrindingRun
    parent: null
    common_fields: true
    fields:
      - { name: wheel_id, type: string, source: input, description: "FK -> GrindingWheel.id; wheel mounted for this run" }
      - { name: product_id, type: string, source: input, description: "FK -> ToolProduct.id; solid-carbide product being ground" }
      - { name: cell_id, type: enum, source: input, description: "Grinding cell exclusively occupied by this run", constraints: "CELL_A, CELL_B" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the cell occupation window (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the cell occupation window (ISO 8601 UTC)" }
      - { name: planned_units, type: integer, source: input, description: "Tools planned for this run", constraints: "v >= 1" }
      - { name: produced_units, type: integer, source: system, description: "Good tools produced, set at completion", default: 0 }
      - { name: scrap_units, type: integer, source: system, description: "Tools scrapped in this run, set at completion", default: 0 }
      - { name: measured_diameter_dev_um, type: number, source: system, description: "Measured mean diameter deviation from nominal in micrometres", constraints: "nullable, 1 decimal" }
      - { name: tolerance_class, type: enum, source: computed, description: "Tolerance grade achieved, derived from measured_diameter_dev_um", constraints: "nullable, one of IT6, IT7, IT8, OUT_OF_TOLERANCE" }
      - { name: consumed_life_units, type: integer, source: computed, description: "Wheel life units charged by this run, retained so a void reverses exactly", default: 0 }
      - { name: status, type: enum, source: system, description: "Run state", default: SCHEDULED, constraints: "SCHEDULED, COMPLETED, VOIDED" }

  - name: ToolProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Sales SKU", constraints: "unique across ToolProduct" }
      - { name: order_class, type: enum, source: input, description: "Catalog item or engineered special", constraints: "CATALOG, SPECIAL" }
      - { name: base_catalog_product_id, type: string, source: input, description: "FK -> ToolProduct.id; catalog parent a SPECIAL is derived from; null for CATALOG", constraints: "nullable; required when order_class == SPECIAL" }
      - { name: grade_id, type: string, source: input, description: "FK -> CarbideGrade.id; substrate grade" }
      - { name: geometry_id, type: string, source: input, description: "FK -> InsertGeometry.id; geometry and chip breaker" }
      - { name: coating_recipe_id, type: string, source: input, description: "FK -> CoatingRecipe.id; coating stack, null for uncoated products", constraints: "nullable" }
      - { name: tool_type, type: enum, source: input, description: "Product family", constraints: "INSERT, SOLID_CARBIDE_ENDMILL, SOLID_CARBIDE_DRILL" }
      - { name: list_price_cents, type: integer, source: input, description: "Per-unit list price in cents before surcharges and discounts", constraints: "v >= 1" }
      - { name: min_order_qty, type: integer, source: input, description: "Minimum order quantity enforced at order creation", constraints: "v >= 1" }
      - { name: nominal_length_mm, type: number, source: input, description: "Nominal usable flute/edge length when new", constraints: "v > 0, 1 decimal" }
      - { name: min_regrind_length_mm, type: number, source: input, description: "Shortest usable length below which the tool must be scrapped", constraints: "0 < v < nominal_length_mm" }
      - { name: regrind_step_mm, type: number, source: input, description: "Length removed by one regrind pass", constraints: "v > 0, 1 decimal" }
      - { name: grind_units_per_tool, type: integer, source: input, description: "Wheel life units consumed per tool ground", constraints: "v >= 1" }
      - { name: release_status, type: enum, source: system, description: "Commercial release dimension, independent of supply_status", default: DEVELOPMENT, constraints: "DEVELOPMENT, QUALIFICATION, RELEASED, RESTRICTED, WITHDRAWN" }
      - { name: supply_status, type: enum, source: system, description: "Fulfilment dimension, independent of release_status", default: UNAVAILABLE, constraints: "UNAVAILABLE, MAKE_TO_ORDER, STOCKED" }
      - { name: pinned_grade_revision, type: integer, source: system, description: "CarbideGrade.revision pinned when qualification was entered", constraints: "nullable" }
      - { name: pinned_geometry_revision, type: integer, source: system, description: "InsertGeometry.revision pinned when qualification was entered", constraints: "nullable" }
      - { name: pinned_coating_revision, type: integer, source: system, description: "CoatingRecipe.revision pinned when qualification was entered; null for uncoated", constraints: "nullable" }
      - { name: engineering_lead_time_days, type: integer, source: computed, description: "Output of calculations.engineering_lead_time_days" }
      - { name: expedite_eligible, type: boolean, source: computed, description: "Set by calculations.engineering_lead_time_days from the pre-shave raw lead time", default: false }
      - { name: tool_life_index, type: number, source: computed, description: "Output of calculations.product_tool_life_index; null before any approved dossier", constraints: "nullable, 1 decimal" }
      - { name: qualified_workpiece_groups, type: array, source: computed, description: "Ascending distinct workpiece_group values of PASS trials in APPROVED dossiers of this product", default: [] }
      - { name: open_order_units, type: integer, source: computed, description: "Sum of quantity over ToolOrder rows on this product with status IN {SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}", default: 0 }

  - name: QualificationDossier
    parent: ToolProduct
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> ToolProduct.id; product being qualified" }
      - { name: dossier_code, type: string, source: input, description: "Dossier identifier", constraints: "unique across QualificationDossier" }
      - { name: required_trial_count, type: integer, source: input, description: "PASS trials required before the dossier may be approved", default: 2, constraints: "2 <= v <= 8" }
      - { name: status, type: enum, source: system, description: "Dossier decision state", default: OPEN, constraints: "OPEN, SUBMITTED, APPROVED, REJECTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the dossier", constraints: "nullable" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID that approved or rejected the dossier", constraints: "nullable" }
      - { name: decision_note, type: string, source: input, description: "Free-text note recorded with the approve/reject decision", constraints: "nullable, <= 400 chars" }
      - { name: completed_trial_count, type: integer, source: computed, description: "Count of MachiningTrial rows on this dossier with status COMPLETED", default: 0 }
      - { name: passed_trial_count, type: integer, source: computed, description: "Count of MachiningTrial rows on this dossier with status COMPLETED and verdict PASS", default: 0 }
      - { name: composite_score, type: number, source: computed, description: "Output of calculations.dossier_composite_score; null when completed_trial_count == 0", constraints: "nullable, 2 decimals" }

  - name: MachiningTrial
    parent: QualificationDossier
    common_fields: true
    fields:
      - { name: dossier_id, type: string, source: input, description: "FK -> QualificationDossier.id; dossier the trial belongs to" }
      - { name: batch_id, type: string, source: input, description: "FK -> PowderBlendBatch.id; batch the test tools were taken from" }
      - { name: trial_code, type: string, source: input, description: "Trial identifier", constraints: "unique across MachiningTrial" }
      - { name: workpiece_material_code, type: string, source: input, description: "Target workpiece material, e.g. 42CrMo4" }
      - { name: workpiece_group, type: enum, source: input, description: "ISO group of the workpiece material", constraints: "P, M, K, N, S, H" }
      - { name: units_consumed, type: integer, source: input, description: "Test tools drawn from the batch", constraints: "1 <= v <= 50" }
      - { name: cutting_speed_vc, type: number, source: input, description: "Cutting speed used in the trial, m/min", constraints: "v > 0" }
      - { name: feed_fz, type: number, source: input, description: "Feed per tooth/revolution used, mm", constraints: "v > 0" }
      - { name: depth_ap, type: number, source: input, description: "Depth of cut used, mm", constraints: "v > 0" }
      - { name: coolant, type: enum, source: input, description: "Coolant strategy used", constraints: "FLOOD, THROUGH_TOOL, DRY" }
      - { name: operator_user_id, type: string, source: system, description: "X-User-ID of the ApplicationEngineer that started the trial" }
      - { name: wear_measurements, type: array, source: system, description: "Flank-wear curve set at completion, each { minutes, vb_um }", constraints: "nullable; >= 2 entries; minutes strictly increasing; vb_um non-decreasing" }
      - { name: measured_surface_ra_um, type: number, source: system, description: "Measured workpiece surface roughness Ra at completion", constraints: "nullable, 2 decimals" }
      - { name: rated_life_min, type: number, source: computed, description: "MEASURED_INTERPOLATED variant of calculations.trial_tool_life_rating", constraints: "nullable, 1 decimal" }
      - { name: projected_life_min, type: number, source: computed, description: "PROJECTED_TAYLOR variant of calculations.trial_tool_life_rating", constraints: "nullable, 1 decimal" }
      - { name: censored, type: boolean, source: computed, description: "True when the wear curve never reaches VB_LIMIT_UM so rated_life_min is right-censored", default: false }
      - { name: verdict, type: enum, source: computed, description: "PASS/FAIL from rated_life_min and measured_surface_ra_um against the geometry application_class limits", constraints: "nullable, PASS or FAIL" }
      - { name: status, type: enum, source: system, description: "Trial state", default: RUNNING, constraints: "RUNNING, COMPLETED, INVALIDATED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Customer account code", constraints: "unique across Customer" }
      - { name: name, type: string, source: input, description: "Account name" }
      - { name: tier, type: enum, source: input, description: "Commercial tier", default: STANDARD, constraints: "STANDARD, PREFERRED, STRATEGIC" }
      - { name: account_status, type: enum, source: system, description: "Ordering eligibility state", default: ACTIVE, constraints: "ACTIVE, CREDIT_HOLD, CLOSED" }
      - { name: regrind_credit_cents, type: integer, source: input, description: "Unreserved prepaid reconditioning credit balance in cents; may go negative only through credit adjustments", default: 0 }
      - { name: reserved_credit_cents, type: integer, source: computed, description: "Sum of reserved_credit_cents over ReconditionJob rows of this customer with status IN {RECEIVED, INSPECTED, REFURBISHED}", default: 0 }

  - name: ToolOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering account" }
      - { name: product_id, type: string, source: input, description: "FK -> ToolProduct.id; ordered product" }
      - { name: order_code, type: string, source: input, description: "Order identifier", constraints: "unique across ToolOrder" }
      - { name: order_class, type: enum, source: system, description: "Copied from the product at creation; never supplied by the caller", constraints: "CATALOG, SPECIAL" }
      - { name: quantity, type: integer, source: input, description: "Ordered units", constraints: "v >= 1" }
      - { name: expedite_requested, type: boolean, source: input, description: "Customer asked for the expedited lead time", default: false }
      - { name: status, type: enum, source: system, description: "Order state", default: DRAFT, constraints: "DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, SHIPPED, ON_HOLD, CANCELLED" }
      - { name: per_unit_net_cents, type: integer, source: computed, description: "Per-unit price after surcharges and volume discount, rounded to whole cents", constraints: "nullable" }
      - { name: total_price_cents, type: integer, source: computed, description: "per_unit_net_cents * quantity", constraints: "nullable" }
      - { name: promised_lead_time_days, type: integer, source: computed, description: "Lead time promised at submission time", constraints: "nullable" }
      - { name: requires_reconfirmation, type: boolean, source: system, description: "Set when a supply change pushed a CONFIRMED order back to ENGINEERING_REVIEW", default: false }
      - { name: hold_reason, type: enum, source: system, description: "Why the order is ON_HOLD", constraints: "nullable, only value CREDIT_HOLD" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock instant of shipment", constraints: "nullable" }

  - name: ReconditionJob
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; account the tools belong to" }
      - { name: product_id, type: string, source: input, description: "FK -> ToolProduct.id; product being reconditioned" }
      - { name: predecessor_job_id, type: string, source: input, description: "FK -> ReconditionJob.id; prior regrind pass on the same tools; null for the first pass", constraints: "nullable" }
      - { name: job_code, type: string, source: input, description: "Job identifier", constraints: "unique across ReconditionJob" }
      - { name: units_received, type: integer, source: input, description: "Tools received for reconditioning", constraints: "1 <= v <= 500" }
      - { name: reserved_credit_cents, type: integer, source: system, description: "Prepaid credit reserved at intake; released in full on scrap and consumed on return", default: 0 }
      - { name: regrind_pass_no, type: integer, source: computed, description: "Length of the predecessor_job_id chain plus one", default: 1 }
      - { name: wheel_id, type: string, source: input, description: "FK -> GrindingWheel.id; wheel used by the refurbish step", constraints: "nullable until refurbish" }
      - { name: units_inspected, type: integer, source: system, description: "Tools measured during inspection", constraints: "nullable" }
      - { name: measured_length_mm, type: number, source: system, description: "Mean remaining usable length measured at inspection", constraints: "nullable, 1 decimal" }
      - { name: measured_corner_wear_um, type: number, source: system, description: "Mean corner wear measured at inspection", constraints: "nullable, 1 decimal" }
      - { name: remaining_regrinds, type: integer, source: computed, description: "RESIDUAL_GEOMETRY regrind headroom from calculations.recondition_life_extension", constraints: "nullable" }
      - { name: life_extension_pct, type: number, source: computed, description: "RESIDUAL_GEOMETRY variant of calculations.recondition_life_extension; drives the rebate", constraints: "nullable, 1 decimal" }
      - { name: warranted_life_extension_pct, type: number, source: computed, description: "CUMULATIVE_PASS_HISTORY variant of calculations.recondition_life_extension; contractual figure", constraints: "nullable, 1 decimal" }
      - { name: scrap_recommended, type: boolean, source: computed, description: "True when measured_length_mm < product.min_regrind_length_mm", default: false }
      - { name: recoat_applied, type: boolean, source: system, description: "Whether the refurbish step re-applied the product coating", default: false }
      - { name: units_returned, type: integer, source: system, description: "Tools returned to the customer", constraints: "nullable" }
      - { name: rebate_cents, type: integer, source: computed, description: "Life-extension rebate credited to the customer on return", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Job state", default: RECEIVED, constraints: "RECEIVED, INSPECTED, REFURBISHED, RETURNED, SCRAPPED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: CarbideGrade
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PILOT
        trigger: "POST /tooling/carbide-grades/{gradeId}/start-pilot"
        actor: MetallurgyEngineer
        preconditions:
          - "status == DRAFT"
          - "at least one PowderBlendBatch with grade_id == this grade has stage == SINTERED, qc_status == PASSED and pinned_grade_revision == this grade.revision"
        side_effects:
          - "increments CarbideGrade.version by 1"
        note: "A grade cannot go to pilot until the current recipe revision has produced a QC-passed sinter batch."
      - from: PILOT
        to: QUALIFIED
        trigger: "system: POST /tooling/qualification-dossiers/{dossierId}/approve on a dossier whose product.grade_id == this grade"
        actor: system
        preconditions:
          - "status == PILOT"
        side_effects:
          - "recomputes CarbideGrade.qualified_product_count"
          - "increments CarbideGrade.version by 1"
      - from: QUALIFIED
        to: DRAFT
        trigger: "POST /tooling/carbide-grades/{gradeId}/revise"
        actor: MetallurgyEngineer
        preconditions:
          - "status IN {PILOT, QUALIFIED}"
        side_effects:
          - "increments CarbideGrade.revision by 1"
          - "CASCADE HOP 1->2: every ToolProduct with grade_id == this grade and release_status == RELEASED whose pinned_grade_revision < the new revision moves RELEASED -> RESTRICTED"
          - "CASCADE HOP 2->3: because those products became RESTRICTED, each such product with supply_status == STOCKED moves STOCKED -> MAKE_TO_ORDER (conditional cascade; products already MAKE_TO_ORDER or UNAVAILABLE are untouched)"
          - "CASCADE HOP 3->4: because that supply_status became MAKE_TO_ORDER, every ToolOrder on that product with status == CONFIRMED moves CONFIRMED -> ENGINEERING_REVIEW and sets requires_reconfirmation = true"
          - "recomputes ToolProduct.engineering_lead_time_days and ToolProduct.expedite_eligible for every product on this grade"
          - "increments CarbideGrade.version by 1 and ToolProduct.version by 1 for each mutated product"
      - from: PILOT
        to: DRAFT
        trigger: "POST /tooling/carbide-grades/{gradeId}/revise"
        actor: MetallurgyEngineer
        preconditions:
          - "status IN {PILOT, QUALIFIED}"
        side_effects:
          - "increments CarbideGrade.revision by 1"
          - "recomputes ToolProduct.engineering_lead_time_days for every product on this grade"
          - "increments CarbideGrade.version by 1"
        note: "From PILOT there is no RELEASED product yet, so the product/supply/order cascade has no targets."
      - from: QUALIFIED
        to: RETIRED
        trigger: "POST /tooling/carbide-grades/{gradeId}/retire"
        actor: MetallurgyEngineer
        preconditions:
          - "status == QUALIFIED"
          - "no ToolOrder with status IN {SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD} exists on any ToolProduct with grade_id == this grade"
        side_effects:
          - "every ToolProduct with grade_id == this grade and release_status IN {QUALIFICATION, RELEASED, RESTRICTED} moves to WITHDRAWN"
          - "because those products became WITHDRAWN, their supply_status moves to UNAVAILABLE"
          - "increments CarbideGrade.version by 1 and ToolProduct.version by 1 for each mutated product"

  - entity: PowderBlendBatch
    initial_state: BLENDED
    terminal_states: []
    transitions:
      - from: BLENDED
        to: PRESSED
        trigger: "POST /tooling/powder-blend-batches/{batchId}/press"
        actor: MetallurgyEngineer
        preconditions:
          - "stage == BLENDED"
          - "qc_status == PENDING"
          - "pressed_units >= 1"
        side_effects:
          - "sets pressed_units from the request"
          - "increments PowderBlendBatch.version by 1"
        note: "stage dimension only; qc_status stays PENDING."
      - from: PRESSED
        to: SINTERED
        trigger: "POST /tooling/powder-blend-batches/{batchId}/sinter"
        actor: MetallurgyEngineer
        preconditions:
          - "stage == PRESSED"
          - "sintered_units + scrap_units == pressed_units"
        side_effects:
          - "sets sintered_units, scrap_units, measured_density_gcc, measured_hardness_hv"
          - "runs calculations.sinter_qc_evaluation, which writes yield_pct and moves the qc_status dimension PENDING -> PASSED or PENDING -> FAILED in the same request"
          - "sets remaining_units = sintered_units"
          - "increments PowderBlendBatch.version by 1"
      - from: SINTERED
        to: CONSUMED
        trigger: "system: POST /tooling/machining-trials draws the last remaining unit (remaining_units reaches 0)"
        actor: system
        preconditions:
          - "stage == SINTERED"
          - "remaining_units == 0 after the draw"
        side_effects:
          - "increments PowderBlendBatch.version by 1"
      - from: PENDING
        to: PASSED
        trigger: "system: calculations.sinter_qc_evaluation during POST /tooling/powder-blend-batches/{batchId}/sinter"
        actor: system
        preconditions:
          - "qc_status == PENDING"
          - "measured_density_gcc >= MIN_SINTER_DENSITY_GCC AND abs(measured_hardness_hv - grade.hardness_hv) <= HARDNESS_TOLERANCE_HV AND yield_pct >= MIN_YIELD_PCT"
        side_effects:
          - "batch becomes eligible as a trial tool source"
        note: "qc_status dimension, independent of stage."
      - from: PENDING
        to: FAILED
        trigger: "system: calculations.sinter_qc_evaluation during POST /tooling/powder-blend-batches/{batchId}/sinter"
        actor: system
        preconditions:
          - "qc_status == PENDING"
          - "at least one of the three PASSED conditions is not met"
        side_effects:
          - "batch is permanently ineligible as a trial tool source"
      - from: PASSED
        to: QUARANTINED
        trigger: "POST /tooling/powder-blend-batches/{batchId}/quarantine"
        actor: QualityApprover
        preconditions:
          - "qc_status == PASSED"
        side_effects:
          - "stage dimension is NOT changed by this transition (a SINTERED batch stays SINTERED while qc_status becomes QUARANTINED); remaining_units is set to 0"
          - "CASCADE HOP 1->2: every MachiningTrial on this batch with status IN {RUNNING, COMPLETED} moves to INVALIDATED"
          - "CASCADE HOP 2->3: because those trials left the RUNNING/COMPLETED population, each affected QualificationDossier recomputes completed_trial_count, passed_trial_count and composite_score"
          - "CASCADE HOP 3->4: because the recomputed passed_trial_count fell below required_trial_count, any affected dossier with status == SUBMITTED moves SUBMITTED -> OPEN and submitted_by_user_id is set to null"
          - "increments PowderBlendBatch.version by 1, MachiningTrial.version by 1 per invalidated trial, QualificationDossier.version by 1 per affected dossier"

  - entity: InsertGeometry
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /tooling/insert-geometries/{geometryId}/release"
        actor: GeometryEngineer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "recomputes ToolProduct.engineering_lead_time_days and ToolProduct.expedite_eligible for every ToolProduct with geometry_id == this geometry (geometry_days drops to 0)"
          - "increments InsertGeometry.version by 1 and ToolProduct.version by 1 for each recomputed product"
      - from: RELEASED
        to: DRAFT
        trigger: "POST /tooling/insert-geometries/{geometryId}/revise"
        actor: GeometryEngineer
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "increments InsertGeometry.revision by 1"
          - "runs the same three-hop product/supply/order cascade declared on CarbideGrade QUALIFIED -> DRAFT, keyed on ToolProduct.pinned_geometry_revision < the new revision"
          - "recomputes ToolProduct.engineering_lead_time_days and ToolProduct.expedite_eligible for every product on this geometry"
          - "increments InsertGeometry.version by 1"

  - entity: CoatingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tooling/coating-runs/{runId}/complete"
        actor: CoatingEngineer
        preconditions:
          - "status == SCHEDULED"
          - "logical clock now >= window_end"
        side_effects:
          - "sets adhesion_hf_class and measured_thickness_um from the request"
          - "recomputes CoatingRecipe.adhesion_class and CoatingRecipe.is_validated for recipe_id"
          - "increments CoatingRun.version by 1 and CoatingRecipe.version by 1"

  - entity: GrindingWheel
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    transitions:
      - from: AVAILABLE
        to: DRESSING
        trigger: "system: a GrindingRun completion or a ReconditionJob refurbish drives remaining_life_units below DRESS_THRESHOLD_UNITS"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "remaining_life_units < DRESS_THRESHOLD_UNITS after the charge"
        side_effects:
          - "increments GrindingWheel.version by 1"
      - from: DRESSING
        to: AVAILABLE
        trigger: "POST /tooling/grinding-wheels/{wheelId}/dress"
        actor: ProductionPlanner
        preconditions:
          - "status == DRESSING"
          - "dress_count + 1 <= MAX_DRESS_COUNT"
        side_effects:
          - "sets consumed_life_units = 0 so remaining_life_units returns to initial_life_units"
          - "increments dress_count by 1"
          - "increments GrindingWheel.version by 1"
        note: "Cycle: AVAILABLE -> DRESSING -> AVAILABLE, bounded by MAX_DRESS_COUNT."
      - from: DRESSING
        to: EXPIRED
        trigger: "POST /tooling/grinding-wheels/{wheelId}/dress"
        actor: ProductionPlanner
        preconditions:
          - "status == DRESSING"
          - "dress_count + 1 > MAX_DRESS_COUNT"
        side_effects:
          - "increments dress_count by 1"
          - "consumed_life_units is NOT reset (divergent side-effect set from the DRESSING -> AVAILABLE branch of the same trigger)"
          - "increments GrindingWheel.version by 1"
      - from: DRESSING
        to: AVAILABLE
        trigger: "system: POST /tooling/grinding-runs/{runId}/void reverses a completed run's charge and remaining_life_units returns to DRESS_THRESHOLD_UNITS or above"
        actor: system
        preconditions:
          - "status == DRESSING"
          - "remaining_life_units >= DRESS_THRESHOLD_UNITS after the reversal"
        side_effects:
          - "dress_count is NOT changed"
          - "increments GrindingWheel.version by 1"

  - entity: GrindingRun
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tooling/grinding-runs/{runId}/complete"
        actor: ProductionPlanner
        preconditions:
          - "status == SCHEDULED"
          - "logical clock now >= window_end"
          - "produced_units + scrap_units == planned_units"
        side_effects:
          - "sets produced_units, scrap_units, measured_diameter_dev_um and derives tolerance_class"
          - "CASCADE HOP 1->2: sets GrindingRun.consumed_life_units = (produced_units + scrap_units) * product.grind_units_per_tool and adds it to GrindingWheel.consumed_life_units"
          - "CASCADE HOP 2->3: because the wheel's remaining_life_units fell below DRESS_THRESHOLD_UNITS, the wheel moves AVAILABLE -> DRESSING"
          - "increments GrindingRun.version by 1 and GrindingWheel.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /tooling/grinding-runs/{runId}/void"
        actor: ProductionPlanner
        preconditions:
          - "status == COMPLETED"
        side_effects:
          - "subtracts GrindingRun.consumed_life_units from GrindingWheel.consumed_life_units, then sets GrindingRun.consumed_life_units = 0"
          - "sets produced_units = 0, scrap_units = 0, measured_diameter_dev_um = null, tolerance_class = null"
          - "if the wheel is DRESSING and remaining_life_units >= DRESS_THRESHOLD_UNITS after the reversal, the wheel moves DRESSING -> AVAILABLE"
          - "increments GrindingRun.version by 1 and GrindingWheel.version by 1"
        note: "Compensating action for COMPLETED: leaves initial_life_units - consumed_life_units exactly as it was before the completion."
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /tooling/grinding-runs/{runId}/void"
        actor: ProductionPlanner
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "frees the cell occupation window for later scheduling; no wheel life is reversed because none was charged (divergent side-effect set from the COMPLETED -> VOIDED branch)"
          - "increments GrindingRun.version by 1"

  - entity: ToolProduct
    initial_state: DEVELOPMENT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DEVELOPMENT
        to: QUALIFICATION
        trigger: "POST /tooling/tool-products/{productId}/enter-qualification"
        actor: ApplicationEngineer
        preconditions:
          - "release_status == DEVELOPMENT"
          - "grade.status IN {PILOT, QUALIFIED}"
          - "geometry.status == RELEASED"
          - "coating_recipe_id is null OR recipe.is_validated == true"
        side_effects:
          - "pins pinned_grade_revision, pinned_geometry_revision and pinned_coating_revision to the referenced entities' current revision values"
          - "recomputes engineering_lead_time_days and expedite_eligible"
          - "increments ToolProduct.version by 1"
      - from: QUALIFICATION
        to: RELEASED
        trigger: "POST /tooling/tool-products/{productId}/release"
        actor: QualityApprover
        preconditions:
          - "release_status == QUALIFICATION"
          - "at least one QualificationDossier on this product has status == APPROVED"
          - "tool_life_index is not null"
          - "pinned_grade_revision == grade.revision AND pinned_geometry_revision == geometry.revision AND (coating_recipe_id is null OR pinned_coating_revision == recipe.revision)"
        side_effects:
          - "supply_status dimension moves UNAVAILABLE -> STOCKED for a CATALOG product and UNAVAILABLE -> MAKE_TO_ORDER for a SPECIAL product, in the same request"
          - "recomputes engineering_lead_time_days and expedite_eligible"
          - "increments CarbideGrade.qualified_product_count by 1"
          - "increments ToolProduct.version by 1 and CarbideGrade.version by 1"
      - from: QUALIFICATION
        to: DEVELOPMENT
        trigger: "system: POST /tooling/qualification-dossiers/{dossierId}/reject"
        actor: system
        preconditions:
          - "release_status == QUALIFICATION"
        side_effects:
          - "sets pinned_grade_revision, pinned_geometry_revision and pinned_coating_revision to null"
          - "increments ToolProduct.version by 1"
      - from: RELEASED
        to: RESTRICTED
        trigger: "system: POST /tooling/carbide-grades/{gradeId}/revise, POST /tooling/insert-geometries/{geometryId}/revise or POST /tooling/coating-recipes/{recipeId}/revise advances a revision this product pinned"
        actor: system
        preconditions:
          - "release_status == RELEASED"
          - "pinned_grade_revision < grade.revision OR pinned_geometry_revision < geometry.revision OR pinned_coating_revision < recipe.revision"
        side_effects:
          - "if supply_status == STOCKED it moves STOCKED -> MAKE_TO_ORDER"
          - "increments ToolProduct.version by 1"
      - from: RESTRICTED
        to: QUALIFICATION
        trigger: "POST /tooling/tool-products/{productId}/repin"
        actor: ApplicationEngineer
        preconditions:
          - "release_status == RESTRICTED"
          - "grade.status IN {PILOT, QUALIFIED}"
          - "geometry.status == RELEASED"
          - "coating_recipe_id is null OR recipe.is_validated == true"
        side_effects:
          - "re-pins all three pinned revisions to the referenced entities' current revision values"
          - "recomputes engineering_lead_time_days and expedite_eligible"
          - "tool_life_index and qualified_workpiece_groups are left unchanged"
          - "increments ToolProduct.version by 1"
      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /tooling/tool-products/{productId}/withdraw"
        actor: QualityApprover
        preconditions:
          - "release_status IN {DEVELOPMENT, QUALIFICATION, RELEASED, RESTRICTED}"
          - "no ToolOrder on this product has status IN {SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "supply_status moves to UNAVAILABLE"
          - "every ToolOrder on this product with status == DRAFT moves DRAFT -> CANCELLED"
          - "increments ToolProduct.version by 1"
      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /tooling/tool-products/{productId}/withdraw or system: POST /tooling/carbide-grades/{gradeId}/retire"
        actor: QualityApprover
        preconditions:
          - "release_status IN {DEVELOPMENT, QUALIFICATION, RELEASED, RESTRICTED}"
          - "no ToolOrder on this product has status IN {SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "supply_status moves to UNAVAILABLE"
          - "increments ToolProduct.version by 1"
      - from: UNAVAILABLE
        to: MAKE_TO_ORDER
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = MAKE_TO_ORDER, or system on QUALIFICATION -> RELEASED of a SPECIAL product"
        actor: ProductionPlanner
        preconditions:
          - "supply_status == UNAVAILABLE"
          - "release_status IN {RELEASED, RESTRICTED}"
        side_effects:
          - "increments ToolProduct.version by 1"
        note: "supply_status dimension, independent of release_status."
      - from: UNAVAILABLE
        to: STOCKED
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = STOCKED, or system on QUALIFICATION -> RELEASED of a CATALOG product"
        actor: ProductionPlanner
        preconditions:
          - "supply_status == UNAVAILABLE"
          - "release_status == RELEASED"
          - "order_class == CATALOG"
        side_effects:
          - "increments ToolProduct.version by 1"
        note: "The release of a CATALOG product skips MAKE_TO_ORDER entirely; a SPECIAL product stops at MAKE_TO_ORDER."
      - from: MAKE_TO_ORDER
        to: STOCKED
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = STOCKED"
        actor: ProductionPlanner
        preconditions:
          - "supply_status == MAKE_TO_ORDER"
          - "release_status == RELEASED"
        side_effects:
          - "increments ToolProduct.version by 1"
      - from: STOCKED
        to: MAKE_TO_ORDER
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = MAKE_TO_ORDER, or system on RELEASED -> RESTRICTED"
        actor: ProductionPlanner
        preconditions:
          - "supply_status == STOCKED"
        side_effects:
          - "every ToolOrder on this product with status == CONFIRMED moves CONFIRMED -> ENGINEERING_REVIEW with requires_reconfirmation = true"
          - "increments ToolProduct.version by 1"
      - from: STOCKED
        to: UNAVAILABLE
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = UNAVAILABLE, or system on withdraw"
        actor: ProductionPlanner
        preconditions:
          - "supply_status IN {MAKE_TO_ORDER, STOCKED}"
        side_effects:
          - "increments ToolProduct.version by 1"
      - from: MAKE_TO_ORDER
        to: UNAVAILABLE
        trigger: "POST /tooling/tool-products/{productId}/set-supply-status with supply_status = UNAVAILABLE, or system on withdraw"
        actor: ProductionPlanner
        preconditions:
          - "supply_status IN {MAKE_TO_ORDER, STOCKED}"
        side_effects:
          - "increments ToolProduct.version by 1"

  - entity: QualificationDossier
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /tooling/qualification-dossiers/{dossierId}/submit"
        actor: ApplicationEngineer
        preconditions:
          - "status == OPEN"
          - "product.release_status == QUALIFICATION"
          - "completed_trial_count >= required_trial_count"
        side_effects:
          - "sets submitted_by_user_id to the calling X-User-ID"
          - "increments QualificationDossier.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tooling/qualification-dossiers/{dossierId}/approve"
        actor: QualityApprover
        preconditions:
          - "status == SUBMITTED"
          - "calling X-User-ID != submitted_by_user_id"
          - "calling X-User-ID != operator_user_id of every MachiningTrial on this dossier"
          - "composite_score is not null AND composite_score >= MIN_COMPOSITE_SCORE"
          - "count of distinct workpiece_group over COMPLETED trials with verdict PASS >= MIN_QUALIFIED_GROUPS"
        side_effects:
          - "sets decided_by_user_id and decision_note"
          - "runs calculations.product_tool_life_index, writing the product's tool_life_index and qualified_workpiece_groups (the product stays in QUALIFICATION and still needs an explicit release)"
          - "if grade.status == PILOT the grade moves PILOT -> QUALIFIED"
          - "increments QualificationDossier.version by 1, ToolProduct.version by 1 and CarbideGrade.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tooling/qualification-dossiers/{dossierId}/reject"
        actor: QualityApprover
        preconditions:
          - "status == SUBMITTED"
          - "calling X-User-ID != submitted_by_user_id"
          - "calling X-User-ID != operator_user_id of every MachiningTrial on this dossier"
        side_effects:
          - "sets decided_by_user_id and decision_note"
          - "product moves QUALIFICATION -> DEVELOPMENT and its three pinned revisions are set to null (divergent side-effect set from the APPROVED branch: no release, no grade qualification, no index recompute)"
          - "increments QualificationDossier.version by 1 and ToolProduct.version by 1"
      - from: SUBMITTED
        to: OPEN
        trigger: "system: POST /tooling/powder-blend-batches/{batchId}/quarantine invalidates trials so passed_trial_count < required_trial_count"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "passed_trial_count < required_trial_count after the recompute"
        side_effects:
          - "sets submitted_by_user_id to null"
          - "increments QualificationDossier.version by 1"

  - entity: MachiningTrial
    initial_state: RUNNING
    terminal_states: [COMPLETED, INVALIDATED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /tooling/machining-trials/{trialId}/complete"
        actor: ApplicationEngineer
        preconditions:
          - "status == RUNNING"
          - "batch.qc_status == PASSED"
          - "wear_measurements has >= 2 entries with strictly increasing minutes and non-decreasing vb_um"
        side_effects:
          - "runs calculations.trial_tool_life_rating and writes rated_life_min, projected_life_min and censored"
          - "runs calculations.trial_verdict and writes verdict"
          - "recomputes QualificationDossier.completed_trial_count, passed_trial_count and composite_score on dossier_id"
          - "increments MachiningTrial.version by 1 and QualificationDossier.version by 1"
      - from: RUNNING
        to: INVALIDATED
        trigger: "system: POST /tooling/powder-blend-batches/{batchId}/quarantine"
        actor: system
        preconditions:
          - "status == RUNNING"
          - "batch.qc_status moves PASSED -> QUARANTINED"
        side_effects:
          - "returns units_consumed to PowderBlendBatch.remaining_units"
          - "recomputes the dossier counters and composite_score"
          - "increments MachiningTrial.version by 1"

  - entity: ToolOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tooling/tool-orders/{orderId}/submit when order_class == CATALOG"
        actor: Customer
        preconditions:
          - "status == DRAFT"
          - "order_class == CATALOG"
          - "customer.account_status == ACTIVE"
          - "product.release_status == RELEASED"
        side_effects:
          - "sets promised_lead_time_days = product.engineering_lead_time_days"
          - "runs calculations.order_price and writes per_unit_net_cents and total_price_cents"
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: DRAFT
        to: ENGINEERING_REVIEW
        trigger: "POST /tooling/tool-orders/{orderId}/submit when order_class == SPECIAL"
        actor: Customer
        preconditions:
          - "status == DRAFT"
          - "order_class == SPECIAL"
          - "customer.account_status == ACTIVE"
          - "product.release_status IN {QUALIFICATION, RELEASED}"
        side_effects:
          - "sets promised_lead_time_days = product.engineering_lead_time_days + SPECIAL_REVIEW_DAYS (divergent side-effect set from the CATALOG branch, which adds no review days and requires release_status == RELEASED)"
          - "runs calculations.order_price and writes per_unit_net_cents and total_price_cents"
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /tooling/tool-orders/{orderId}/confirm"
        actor: ProductionPlanner
        preconditions:
          - "status == SUBMITTED"
          - "customer.account_status == ACTIVE"
          - "product.release_status == RELEASED"
          - "grade.status == QUALIFIED"
        side_effects:
          - "sets requires_reconfirmation = false"
          - "increments ToolOrder.version by 1"
      - from: ENGINEERING_REVIEW
        to: CONFIRMED
        trigger: "POST /tooling/tool-orders/{orderId}/confirm"
        actor: ApplicationEngineer
        preconditions:
          - "status == ENGINEERING_REVIEW"
          - "customer.account_status == ACTIVE"
          - "product.release_status == RELEASED"
          - "grade.status == QUALIFIED"
        side_effects:
          - "sets requires_reconfirmation = false"
          - "increments ToolOrder.version by 1"
        note: "Join point of the branch: both the CATALOG and the SPECIAL path converge on CONFIRMED, but through different roles."
      - from: CONFIRMED
        to: ENGINEERING_REVIEW
        trigger: "system: ToolProduct.supply_status moves STOCKED -> MAKE_TO_ORDER (hop 4 of the grade/geometry/coating revise cascade)"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "sets requires_reconfirmation = true"
          - "increments ToolOrder.version by 1"
        note: "Cycle: CONFIRMED -> ENGINEERING_REVIEW -> CONFIRMED."
      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system: customer.account_status moves ACTIVE -> CREDIT_HOLD"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, ENGINEERING_REVIEW}"
        side_effects:
          - "sets hold_reason = CREDIT_HOLD"
          - "increments ToolOrder.version by 1"
      - from: ENGINEERING_REVIEW
        to: ON_HOLD
        trigger: "system: customer.account_status moves ACTIVE -> CREDIT_HOLD"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, ENGINEERING_REVIEW}"
        side_effects:
          - "sets hold_reason = CREDIT_HOLD"
          - "increments ToolOrder.version by 1"
      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system: customer.account_status moves CREDIT_HOLD -> ACTIVE"
        actor: system
        preconditions:
          - "status == ON_HOLD"
        side_effects:
          - "sets hold_reason = null"
          - "increments ToolOrder.version by 1"
        note: "Cycle: SUBMITTED -> ON_HOLD -> SUBMITTED. Orders that were ENGINEERING_REVIEW before the hold also resume as SUBMITTED."
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /tooling/tool-orders/{orderId}/ship"
        actor: ProductionPlanner
        preconditions:
          - "status == CONFIRMED"
          - "requires_reconfirmation == false"
          - "product.supply_status IN {MAKE_TO_ORDER, STOCKED}"
        side_effects:
          - "sets shipped_at to the logical clock instant"
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /tooling/tool-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /tooling/tool-orders/{orderId}/cancel or system: ToolProduct withdraw"
        actor: Customer
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /tooling/tool-orders/{orderId}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /tooling/tool-orders/{orderId}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"
      - from: ENGINEERING_REVIEW
        to: CANCELLED
        trigger: "POST /tooling/tool-orders/{orderId}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
        side_effects:
          - "recomputes ToolProduct.open_order_units"
          - "increments ToolOrder.version by 1 and ToolProduct.version by 1"

  - entity: ReconditionJob
    initial_state: RECEIVED
    terminal_states: [RETURNED, SCRAPPED]
    transitions:
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /tooling/recondition-jobs/{jobId}/inspect"
        actor: ApplicationEngineer
        preconditions:
          - "status == RECEIVED"
          - "units_inspected == units_received"
        side_effects:
          - "sets units_inspected, measured_length_mm and measured_corner_wear_um"
          - "runs calculations.recondition_life_extension and writes remaining_regrinds, life_extension_pct, warranted_life_extension_pct and scrap_recommended"
          - "increments ReconditionJob.version by 1"
      - from: INSPECTED
        to: REFURBISHED
        trigger: "POST /tooling/recondition-jobs/{jobId}/refurbish"
        actor: ProductionPlanner
        preconditions:
          - "status == INSPECTED"
          - "scrap_recommended == false"
          - "remaining_regrinds >= 1"
          - "wheel.status == AVAILABLE"
          - "wheel.remaining_life_units >= units_inspected * product.grind_units_per_tool"
          - "if recoat_applied == true then product.coating_recipe_id is not null and recipe.is_validated == true"
        side_effects:
          - "sets wheel_id and recoat_applied"
          - "adds units_inspected * product.grind_units_per_tool to GrindingWheel.consumed_life_units"
          - "if the wheel's remaining_life_units falls below DRESS_THRESHOLD_UNITS the wheel moves AVAILABLE -> DRESSING"
          - "increments ReconditionJob.version by 1 and GrindingWheel.version by 1"
      - from: REFURBISHED
        to: RETURNED
        trigger: "POST /tooling/recondition-jobs/{jobId}/return"
        actor: ProductionPlanner
        preconditions:
          - "status == REFURBISHED"
        side_effects:
          - "sets units_returned = units_inspected"
          - "runs calculations.recondition_rebate and writes rebate_cents"
          - "adds rebate_cents to Customer.regrind_credit_cents and consumes the reservation by setting ReconditionJob.reserved_credit_cents = 0"
          - "if customer.account_status == CREDIT_HOLD and regrind_credit_cents >= 0 after the rebate, the customer moves CREDIT_HOLD -> ACTIVE and their ON_HOLD orders resume as SUBMITTED"
          - "increments ReconditionJob.version by 1 and Customer.version by 1"
      - from: RECEIVED
        to: SCRAPPED
        trigger: "POST /tooling/recondition-jobs/{jobId}/scrap"
        actor: ProductionPlanner
        preconditions:
          - "status IN {RECEIVED, INSPECTED}"
        side_effects:
          - "adds ReconditionJob.reserved_credit_cents back to Customer.regrind_credit_cents, then sets reserved_credit_cents = 0"
          - "sets units_returned = 0 and rebate_cents = 0 (divergent side-effect set from the RETURNED branch, which pays a rebate instead of releasing the reservation)"
          - "increments ReconditionJob.version by 1 and Customer.version by 1"
      - from: INSPECTED
        to: SCRAPPED
        trigger: "POST /tooling/recondition-jobs/{jobId}/scrap"
        actor: ProductionPlanner
        preconditions:
          - "status IN {RECEIVED, INSPECTED}"
        side_effects:
          - "adds ReconditionJob.reserved_credit_cents back to Customer.regrind_credit_cents, then sets reserved_credit_cents = 0"
          - "sets units_returned = 0 and rebate_cents = 0"
          - "increments ReconditionJob.version by 1 and Customer.version by 1"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system: POST /tooling/customers/{customerId}/credit-adjustments drives regrind_credit_cents below 0"
        actor: system
        preconditions:
          - "account_status == ACTIVE"
          - "regrind_credit_cents < 0 after the adjustment"
        side_effects:
          - "CASCADE HOP 1->2: the adjustment writes regrind_credit_cents"
          - "CASCADE HOP 2->3: because regrind_credit_cents went below 0, account_status moves ACTIVE -> CREDIT_HOLD"
          - "CASCADE HOP 3->4: because account_status became CREDIT_HOLD, every ToolOrder of this customer with status IN {SUBMITTED, ENGINEERING_REVIEW} moves to ON_HOLD with hold_reason = CREDIT_HOLD"
          - "increments Customer.version by 1 and ToolOrder.version by 1 per held order"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system: POST /tooling/customers/{customerId}/credit-adjustments or POST /tooling/recondition-jobs/{jobId}/return restores regrind_credit_cents to 0 or above"
        actor: system
        preconditions:
          - "account_status == CREDIT_HOLD"
          - "regrind_credit_cents >= 0 after the credit movement"
        side_effects:
          - "every ToolOrder of this customer with status == ON_HOLD moves ON_HOLD -> SUBMITTED and hold_reason is set to null"
          - "increments Customer.version by 1 and ToolOrder.version by 1 per resumed order"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /tooling/customers/{customerId}/close"
        actor: ProductionPlanner
        preconditions:
          - "account_status IN {ACTIVE, CREDIT_HOLD}"
          - "no ToolOrder of this customer has status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
          - "no ReconditionJob of this customer has status IN {RECEIVED, INSPECTED, REFURBISHED}"
        side_effects:
          - "increments Customer.version by 1"
      - from: CREDIT_HOLD
        to: CLOSED
        trigger: "POST /tooling/customers/{customerId}/close"
        actor: ProductionPlanner
        preconditions:
          - "account_status IN {ACTIVE, CREDIT_HOLD}"
          - "no ToolOrder of this customer has status IN {DRAFT, SUBMITTED, ENGINEERING_REVIEW, CONFIRMED, ON_HOLD}"
          - "no ReconditionJob of this customer has status IN {RECEIVED, INSPECTED, REFURBISHED}"
        side_effects:
          - "increments Customer.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =============================================================================

concurrency_rules:
  - rule_id: order-create-stale-product
    parent_entity: ToolProduct
    write_endpoint: "POST /tooling/tool-orders"
    occ_field: "expected_product_version"
    description: |
      Creating a ToolOrder against a ToolProduct whose version has advanced since
      the client last read it is rejected. The quoted lead time, price basis and
      open-order load all derive from the product row the client observed, so a
      stale expected_product_version means the quote was built on a superseded
      product revision. Creating another order on the same product is legitimate
      in its own right, which is why this is resolved by a stale-version check
      rather than by a state precondition.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: job-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /tooling/recondition-jobs"
    occ_field: "expected_customer_version"
    description: |
      Creating a ReconditionJob against a Customer whose version has advanced
      since the client last read it is rejected. Intake reserves prepaid credit
      out of the balance the client observed; if that balance has already moved
      the reservation would be computed against a superseded ledger. A second
      intake for the same customer is legitimate on its own, so the conflict is
      resolved by a stale-version check on Customer.version.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: trial_tool_life_rating
    trigger: "POST /tooling/machining-trials/{trialId}/complete (MachiningTrial RUNNING -> COMPLETED)"
    algorithm: dual_variant_wear_extrapolation
    formula: |
      # Input: wear_measurements = [ {minutes, vb_um}, ... ] ascending in `minutes`
      # (validated: >= 2 entries, minutes strictly increasing, vb_um non-decreasing)
      #
      # VARIANT 1 — MEASURED_INTERPOLATED  -> writes MachiningTrial.rated_life_min
      #   Walk consecutive pairs in ascending `minutes` order. Take the FIRST pair
      #   (m_i, vb_i), (m_j, vb_j) with vb_i < VB_LIMIT_UM <= vb_j:
      #     rated_life_min = round_half_up(
      #         m_i + (VB_LIMIT_UM - vb_i) * (m_j - m_i) / (vb_j - vb_i), 1)
      #     censored = false
      #   If no pair brackets VB_LIMIT_UM (the curve never reaches 300 um):
      #     rated_life_min = round_half_up(minutes of the LAST entry, 1)
      #     censored = true
      #
      # VARIANT 2 — PROJECTED_TAYLOR       -> writes MachiningTrial.projected_life_min
      #   Uses ONLY the last two entries, regardless of where the curve crosses:
      #     rate_um_per_min = (vb_last - vb_prev) / (m_last - m_prev)
      #     projected_life_min = round_half_up(
      #         m_last + (VB_LIMIT_UM - vb_last) / rate_um_per_min, 1)
      #   When vb_last > VB_LIMIT_UM the term is negative, i.e. the projection
      #   walks back from the last point. rate_um_per_min is > 0 by construction
      #   because the validator rejects a curve whose last two vb_um are equal.
      #
      # The two variants are computed from the SAME wear_measurements array and
      # are BOTH persisted; they diverge whenever the crossing pair is not the
      # last pair (decelerating or accelerating wear after the crossing).
    input_set: "The single wear_measurements array supplied with the completion request; no other trial contributes"
    constants:
      VB_LIMIT_UM: 300
    precision: "1 decimal place, round_half_up, on both variants"
    variants:
      - name: MEASURED_INTERPOLATED
        when: "Always; the qualification-of-record figure. Feeds trial_verdict, dossier_composite_score and product_tool_life_index."
        difference: "Linear interpolation inside the bracketing measurement pair; ignores every point after the crossing; right-censors to the last observed minute when the curve never reaches 300 um."
      - name: PROJECTED_TAYLOR
        when: "Always; the published catalog projection quoted by application engineering."
        difference: "Extrapolates the wear rate of the LAST two points to the 300 um criterion, so points before the last pair are ignored and an uncensored value is produced even when the curve stopped below 300 um."

  - name: trial_verdict
    trigger: "POST /tooling/machining-trials/{trialId}/complete, immediately after trial_tool_life_rating"
    algorithm: threshold
    formula: |
      cls = geometry.application_class of the trial's dossier product
      verdict = PASS iff (censored == false
                          AND rated_life_min >= REQUIRED_LIFE_MIN[cls]
                          AND measured_surface_ra_um <= MAX_RA_UM[cls])
                else FAIL
      # Both comparisons are inclusive at the boundary; a censored curve is always FAIL.
    input_set: "This trial only; rated_life_min from the MEASURED_INTERPOLATED variant, never projected_life_min"
    constants:
      REQUIRED_LIFE_MIN: { ROUGHING: 12.0, MEDIUM: 18.0, FINISHING: 25.0 }
      MAX_RA_UM: { ROUGHING: 3.2, MEDIUM: 1.6, FINISHING: 0.8 }
    precision: "Comparison only; no rounding beyond the 1-decimal rated_life_min and 2-decimal measured_surface_ra_um"

  - name: dossier_composite_score
    trigger: "POST /tooling/machining-trials/{trialId}/complete and system trial invalidation during POST /tooling/powder-blend-batches/{batchId}/quarantine"
    algorithm: weighted_scoring
    formula: |
      cls = geometry.application_class of the dossier's product
      considered = MachiningTrial rows with dossier_id == this dossier
                   AND status == COMPLETED            # INVALIDATED and RUNNING excluded
      if considered is empty: composite_score = null; return
      for each trial t in `considered`, ordered by t.created_at ASC:
          life_ratio_t   = min(2.0, t.rated_life_min / REQUIRED_LIFE_MIN[cls])
          finish_ratio_t = min(2.0, MAX_RA_UM[cls] / t.measured_surface_ra_um)
          subscore_t     = round_half_up(0.6 * life_ratio_t + 0.4 * finish_ratio_t, 2)   # ROUND FIRST
      composite_score = round_half_up(sum(subscore_t) / count(considered), 2)            # THEN AVERAGE
      # PINNED ORDER: round every per-trial subscore to 2 decimals BEFORE averaging.
      # Averaging the unrounded subscores and rounding once at the end is WRONG.
    input_set: "COMPLETED trials of this dossier only; FAIL verdicts are included in the average, INVALIDATED trials are excluded"
    constants:
      REQUIRED_LIFE_MIN: { ROUGHING: 12.0, MEDIUM: 18.0, FINISHING: 25.0 }
      MAX_RA_UM: { ROUGHING: 3.2, MEDIUM: 1.6, FINISHING: 0.8 }
      LIFE_WEIGHT: 0.6
      FINISH_WEIGHT: 0.4
      SUBSCORE_CAP: 2.0
    precision: "2 decimal places round_half_up per subscore, then 2 decimal places round_half_up on the mean"

  - name: product_tool_life_index
    trigger: "POST /tooling/qualification-dossiers/{dossierId}/approve, and any recompute of a dossier that is already APPROVED"
    algorithm: aggregation
    formula: |
      source = MachiningTrial rows whose dossier_id belongs to a QualificationDossier
               with product_id == this product AND dossier.status == APPROVED
               AND trial.status == COMPLETED AND trial.verdict == PASS
      if source is empty: tool_life_index = null; qualified_workpiece_groups = []
      else:
        tool_life_index = round_half_up(sum(trial.rated_life_min) / count(source), 1)
        qualified_workpiece_groups = distinct trial.workpiece_group sorted ASCENDING
                                     by the enum's alphabetical spelling
    input_set: "PASS trials inside APPROVED dossiers of this product; SUBMITTED, OPEN and REJECTED dossiers contribute nothing"
    constants: {}
    precision: "1 decimal place, round_half_up; the mean is unweighted (trial count, not units_consumed)"

  - name: sinter_qc_evaluation
    trigger: "POST /tooling/powder-blend-batches/{batchId}/sinter (stage PRESSED -> SINTERED)"
    algorithm: threshold
    formula: |
      yield_pct = round_half_up(100 * sintered_units / pressed_units, 2)
      qc_status = PASSED iff (measured_density_gcc >= MIN_SINTER_DENSITY_GCC
                              AND abs(measured_hardness_hv - grade.hardness_hv) <= HARDNESS_TOLERANCE_HV
                              AND yield_pct >= MIN_YIELD_PCT)
                  else FAILED
      remaining_units = sintered_units
      # All three comparisons are inclusive: density exactly 14.35, hardness
      # deviation exactly 75 and yield exactly 85.00 all PASS.
    input_set: "This batch only; grade.hardness_hv is read from the batch's CarbideGrade at the revision the batch pinned"
    constants:
      MIN_SINTER_DENSITY_GCC: 14.35
      HARDNESS_TOLERANCE_HV: 75
      MIN_YIELD_PCT: 85.00
    precision: "yield_pct 2 decimals round_half_up; density compared at 2 decimals as supplied"

  - name: engineering_lead_time_days
    trigger: "POST /tooling/tool-products, POST /tooling/tool-products/{productId}/enter-qualification, POST /tooling/tool-products/{productId}/repin, and any grade/geometry/coating revision or status change that touches this product"
    algorithm: constraint_propagation
    formula: |
      base_days     = 5  if order_class == CATALOG else 15
      geometry_days = 0  if geometry.status == RELEASED else 8
      coating_days  = 0  if coating_recipe_id is null
                      else (4 if recipe.deposition_type == PVD else 7)
      grade_days    = 0  if grade.status == QUALIFIED else 6
      raw_lead_days = base_days + geometry_days + coating_days + grade_days
      # PINNED EVALUATION ORDER (the circular-looking part):
      #   expedite eligibility is decided on raw_lead_days, i.e. BEFORE the shave.
      #   The shave never re-opens eligibility, so a raw_lead_days of 22 stays 22
      #   even though 22 - 3 = 19 would have been eligible.
      expedite_eligible = (raw_lead_days <= EXPEDITE_ELIGIBLE_MAX_DAYS)
      shaved            = raw_lead_days - EXPEDITE_SHAVE_DAYS if expedite_eligible else raw_lead_days
      engineering_lead_time_days = max(shaved, MIN_LEAD_DAYS)
    input_set: "The product's own order_class plus the CURRENT status/deposition_type of its referenced grade, geometry and coating recipe (not the pinned revisions)"
    constants:
      CATALOG_BASE_DAYS: 5
      SPECIAL_BASE_DAYS: 15
      UNRELEASED_GEOMETRY_DAYS: 8
      PVD_COATING_DAYS: 4
      CVD_COATING_DAYS: 7
      UNQUALIFIED_GRADE_DAYS: 6
      EXPEDITE_ELIGIBLE_MAX_DAYS: 21
      EXPEDITE_SHAVE_DAYS: 3
      MIN_LEAD_DAYS: 2
    precision: "Whole days, integer arithmetic only"

  - name: order_price
    trigger: "POST /tooling/tool-orders/{orderId}/submit (DRAFT -> SUBMITTED and DRAFT -> ENGINEERING_REVIEW)"
    algorithm: tiered_pricing
    formula: |
      grade_surcharge_pct   = 0.00 if grade.target_workpiece_group IN {P, M, K} else 0.08
      coating_surcharge_pct = 0.00 if product.coating_recipe_id is null
                              else (0.06 if recipe.deposition_type == PVD else 0.10)
      special_surcharge_pct = 0.00 if order_class == CATALOG else 0.18
      volume_discount_pct   = 0.12 if quantity >= 500
                              else 0.07 if quantity >= 100
                              else 0.03 if quantity >= 25
                              else 0.00
      per_unit_gross = product.list_price_cents
                       * (1 + grade_surcharge_pct + coating_surcharge_pct + special_surcharge_pct)
      # PINNED ROUNDING ORDER: round to whole cents PER UNIT, then multiply.
      per_unit_net_cents = round_half_up(per_unit_gross * (1 - volume_discount_pct), 0)
      total_price_cents  = per_unit_net_cents * quantity
      # Multiplying first and rounding the total once (round(per_unit_gross *
      # (1 - discount) * quantity)) is WRONG and differs by tens of cents.
    input_set: "The order's quantity and order_class, the product's list_price_cents and coating_recipe_id, and the grade's target_workpiece_group; no other order contributes"
    constants:
      EXOTIC_GRADE_SURCHARGE_PCT: 0.08
      PVD_SURCHARGE_PCT: 0.06
      CVD_SURCHARGE_PCT: 0.10
      SPECIAL_SURCHARGE_PCT: 0.18
      VOLUME_TIERS: "[{min_qty: 500, pct: 0.12}, {min_qty: 100, pct: 0.07}, {min_qty: 25, pct: 0.03}]"
    precision: "Whole cents, round_half_up, applied once per unit before multiplication"

  - name: speeds_feeds_envelope
    trigger: "GET /tooling/tool-products/{productId}/speeds-feeds"
    algorithm: cutting_envelope
    formula: |
      cls = geometry.application_class
      grade_factor   = clamp(1.00 + 0.02 * (10.0 - grade.co_binder_pct), 0.85, 1.20)
      coating_factor = 1.00 if product.coating_recipe_id is null
                       else min(1.35, 1.10 + 0.02 * recipe.total_thickness_um)
      rigidity_factor = { RIGID: 1.00, MEDIUM: 0.85, WEAK: 0.70 }[machine_rigidity]
      if coolant == DRY:
          coolant_factor = 0.60 if product.coating_recipe_id is null else 0.75
      else:
          coolant_factor = { FLOOD: 1.00, THROUGH_TOOL: 1.10 }[coolant]
      recommended_vc = round_half_up(
          min(BASE_VC_M_MIN[workpiece_group] * grade_factor * coating_factor
                * rigidity_factor * coolant_factor,
              MAX_VC_BY_CLASS[cls]), 0)
      recommended_fz = round_half_up(min(geometry.nose_radius_mm * FZ_NOSE_FRACTION,
                                         MAX_FZ_BY_CLASS[cls]), 3)
      recommended_ap = round_half_up(min(geometry.max_depth_of_cut_mm,
                                         AP_BY_CLASS[cls]), 2)
      confidence_class = HIGH   if workpiece_group IN product.qualified_workpiece_groups
                         else MEDIUM if product.release_status == RELEASED
                         else LOW
    input_set: "Query inputs (workpiece_group, machine_rigidity, coolant) combined with the product's CURRENT grade, geometry and coating recipe rows and its qualified_workpiece_groups"
    constants:
      BASE_VC_M_MIN: { P: 220, M: 170, K: 150, N: 400, S: 60, H: 45 }
      MAX_VC_BY_CLASS: { ROUGHING: 260, MEDIUM: 340, FINISHING: 420 }
      MAX_FZ_BY_CLASS: { ROUGHING: 0.55, MEDIUM: 0.30, FINISHING: 0.14 }
      AP_BY_CLASS: { ROUGHING: 6.0, MEDIUM: 3.0, FINISHING: 1.0 }
      FZ_NOSE_FRACTION: 0.35
      GRADE_FACTOR_FLOOR: 0.85
      GRADE_FACTOR_CEILING: 1.20
      COATING_FACTOR_CEILING: 1.35
    precision: "recommended_vc whole m/min; recommended_fz 3 decimals; recommended_ap 2 decimals; all round_half_up"

  - name: recondition_life_extension
    trigger: "POST /tooling/recondition-jobs/{jobId}/inspect (RECEIVED -> INSPECTED)"
    algorithm: dual_variant_service_rating
    formula: |
      # VARIANT 1 — RESIDUAL_GEOMETRY  -> remaining_regrinds, life_extension_pct
      remaining_regrinds = floor((measured_length_mm - product.min_regrind_length_mm)
                                / product.regrind_step_mm)
      if remaining_regrinds < 0: remaining_regrinds = 0
      life_extension_pct = round_half_up(
          100 * remaining_regrinds * product.regrind_step_mm / product.nominal_length_mm, 1)
      scrap_recommended = (measured_length_mm < product.min_regrind_length_mm)
      #
      # VARIANT 2 — CUMULATIVE_PASS_HISTORY -> warranted_life_extension_pct
      warranted_life_extension_pct = round_half_up(
          PASS_EXTENSION_PCT * (PASS_DECAY ** (regrind_pass_no - 1)), 1)
      # regrind_pass_no is the predecessor_job_id chain length + 1 and ignores
      # every measurement, so the two variants disagree on identical inputs.
    input_set: "This job's measured_length_mm and its predecessor chain, plus the product's nominal_length_mm, min_regrind_length_mm and regrind_step_mm"
    constants:
      PASS_EXTENSION_PCT: 35.0
      PASS_DECAY: 0.7
    precision: "1 decimal place, round_half_up, on both percentages"
    variants:
      - name: RESIDUAL_GEOMETRY
        when: "Always; drives scrap_recommended, the refurbish precondition and the rebate paid on return."
        difference: "Derived purely from the measured remaining length against the product's regrind step; blind to how many passes the tool already had."
      - name: CUMULATIVE_PASS_HISTORY
        when: "Always; the contractual figure quoted in the tool-life-extension programme."
        difference: "Derived purely from the regrind pass number with geometric decay; blind to the measured length, so a lightly worn pass-3 tool is warranted differently from what its geometry supports."

  - name: recondition_rebate
    trigger: "POST /tooling/recondition-jobs/{jobId}/return (REFURBISHED -> RETURNED)"
    algorithm: aggregation
    formula: |
      rebate_cents = round_half_up(
          life_extension_pct / 100 * units_returned * REBATE_BASIS_CENTS, 0)
      # Uses the RESIDUAL_GEOMETRY variant only; warranted_life_extension_pct
      # never enters the money path.
      customer.regrind_credit_cents += rebate_cents
      job.reserved_credit_cents = 0        # the intake reservation is consumed, not refunded
    input_set: "This job's life_extension_pct and units_returned"
    constants:
      REBATE_BASIS_CENTS: 900
      RECONDITION_COST_CENTS_PER_TOOL: 1850
    precision: "Whole cents, round_half_up"

  - name: wheel_life_consumption
    trigger: "POST /tooling/grinding-runs/{runId}/complete, POST /tooling/grinding-runs/{runId}/void, POST /tooling/recondition-jobs/{jobId}/refurbish, POST /tooling/grinding-wheels/{wheelId}/dress"
    algorithm: aggregation
    formula: |
      # charge on grinding-run completion
      run.consumed_life_units   = (produced_units + scrap_units) * product.grind_units_per_tool
      wheel.consumed_life_units = wheel.consumed_life_units + run.consumed_life_units
      # charge on reconditioning refurbish
      wheel.consumed_life_units = wheel.consumed_life_units
                                  + units_inspected * product.grind_units_per_tool
      # reversal on grinding-run void (exact, uses the stored per-run charge)
      wheel.consumed_life_units = wheel.consumed_life_units - run.consumed_life_units
      run.consumed_life_units   = 0
      # reset on dressing (only on the DRESSING -> AVAILABLE branch)
      wheel.consumed_life_units = 0
      # derived and threshold
      wheel.remaining_life_units = wheel.initial_life_units - wheel.consumed_life_units
      if wheel.remaining_life_units < DRESS_THRESHOLD_UNITS and wheel.status == AVAILABLE:
          wheel.status = DRESSING
      if wheel.remaining_life_units >= DRESS_THRESHOLD_UNITS and wheel.status == DRESSING
         and the movement came from a void reversal:
          wheel.status = AVAILABLE
    input_set: "COMPLETED GrindingRun rows and REFURBISHED/RETURNED ReconditionJob rows charged to this wheel since its last dress; VOIDED runs contribute 0"
    constants:
      DRESS_THRESHOLD_UNITS: 150
      MAX_DRESS_COUNT: 3
    precision: "Integer life units; no rounding"

  - name: coating_adhesion_evaluation
    trigger: "POST /tooling/coating-runs/{runId}/complete"
    algorithm: aggregation
    formula: |
      pool = CoatingRun rows with recipe_id == this recipe AND status == COMPLETED
             AND pinned_recipe_revision == recipe.revision
      adhesion_class = min(run.adhesion_hf_class over pool)      # null when pool is empty
      is_validated   = true iff at least one run in pool satisfies
                       run.adhesion_hf_class <= MAX_VALIDATED_HF_CLASS
                       AND abs(run.measured_thickness_um - recipe.total_thickness_um)
                           <= THICKNESS_TOLERANCE_FRACTION * recipe.total_thickness_um
      # Revising the recipe advances recipe.revision, which empties the pool, so
      # adhesion_class returns to null and is_validated returns to false.
    input_set: "COMPLETED coating runs pinned to the recipe's CURRENT revision only"
    constants:
      MAX_VALIDATED_HF_CLASS: 2
      THICKNESS_TOLERANCE_FRACTION: 0.15
    precision: "adhesion_hf_class integer 1..6; thickness compared at 2 decimals"

  - name: grinding_tolerance_class
    trigger: "POST /tooling/grinding-runs/{runId}/complete"
    algorithm: threshold
    formula: |
      d = abs(measured_diameter_dev_um)
      tolerance_class = IT6              if d <= IT6_MAX_UM
                        else IT7         if d <= IT7_MAX_UM
                        else IT8         if d <= IT8_MAX_UM
                        else OUT_OF_TOLERANCE
      # All bands are inclusive at the upper bound: exactly 5.0 um is IT6.
    input_set: "This run's measured_diameter_dev_um only"
    constants:
      IT6_MAX_UM: 5.0
      IT7_MAX_UM: 12.0
      IT8_MAX_UM: 25.0
    precision: "Deviation compared at 1 decimal as supplied"

# =============================================================================
# 1.4 Validation Rules Table  (evaluated in ascending priority; first violation wins)
# =============================================================================

validations:

  - priority: 1
    rule: authenticated_caller
    condition: "X-User-ID header absent or empty on any endpoint other than POST /tooling/_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    applies_to: "every endpoint"
    category: auth

  - priority: 2
    rule: role_permitted_for_operation
    condition: "The caller's role is not listed in the endpoint's allowed roles (see §1.7)"
    error_id: ERR_ROLE_NOT_PERMITTED
    applies_to: "every endpoint"
    category: authz

  - priority: 3
    rule: request_body_schema
    condition: "A required input field is missing, has the wrong JSON type, or an unknown field is supplied"
    error_id: ERR_INVALID_REQUEST
    applies_to: "every endpoint with a request body"
    category: schema

  - priority: 4
    rule: enum_and_numeric_domain
    condition: "An enum field carries a value outside its declared set, or a numeric field violates its declared domain (co_binder_pct in (0,30], wc_grain_um > 0, quantity >= 1, planned_mass_kg > 0, layer thickness_um > 0, adhesion_hf_class in 1..6, units_* >= 0, *_length_mm > 0, regrind_step_mm > 0)"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /tooling/carbide-grades, POST /tooling/insert-geometries, POST /tooling/coating-recipes, POST /tooling/tool-products, POST /tooling/tool-orders, POST /tooling/powder-blend-batches, POST /tooling/coating-runs/{runId}/complete, POST /tooling/recondition-jobs"
    category: schema

  - priority: 5
    rule: wear_curve_wellformed
    condition: "wear_measurements has fewer than 2 entries, minutes are not strictly increasing, vb_um is not non-decreasing, any minutes <= 0 for a non-first entry, or the last two entries share the same vb_um (which would make the PROJECTED_TAYLOR slope zero)"
    error_id: ERR_INVALID_WEAR_CURVE
    applies_to: "POST /tooling/machining-trials/{trialId}/complete"
    category: schema

  - priority: 6
    rule: layer_stack_wellformed
    condition: "layers is empty, has more than 5 entries, or repeats the same material in two adjacent positions"
    error_id: ERR_INVALID_LAYER_STACK
    applies_to: "POST /tooling/coating-recipes, POST /tooling/coating-recipes/{recipeId}/revise"
    category: schema

  - priority: 7
    rule: path_entity_exists
    condition: "The id in the URL path matches no row of that entity"
    error_id: "ERR_GRADE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_GEOMETRY_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_COATING_RUN_NOT_FOUND | ERR_WHEEL_NOT_FOUND | ERR_GRINDING_RUN_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_DOSSIER_NOT_FOUND | ERR_TRIAL_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_JOB_NOT_FOUND"
    applies_to: "every endpoint with a path parameter"
    category: existence

  - priority: 8
    rule: body_reference_exists
    condition: "An FK supplied in the request body matches no row of the referenced entity"
    error_id: "ERR_GRADE_NOT_FOUND | ERR_GEOMETRY_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_WHEEL_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_JOB_NOT_FOUND"
    applies_to: "POST /tooling/powder-blend-batches, POST /tooling/coating-runs, POST /tooling/grinding-runs, POST /tooling/tool-products, POST /tooling/machining-trials, POST /tooling/tool-orders, POST /tooling/recondition-jobs, POST /tooling/recondition-jobs/{jobId}/refurbish"
    category: existence

  - priority: 9
    rule: customer_scope_ownership
    condition: "A Customer-role caller addresses a ToolOrder or ReconditionJob whose customer_id is not the caller's own customer row, or supplies a customer_id other than their own"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    applies_to: "POST /tooling/tool-orders, POST /tooling/tool-orders/{orderId}/submit, POST /tooling/tool-orders/{orderId}/cancel, GET /tooling/tool-orders/{orderId}, POST /tooling/recondition-jobs, GET /tooling/recondition-jobs/{jobId}"
    category: ownership

  - priority: 10
    rule: parent_version_current
    condition: "expected_product_version != ToolProduct.version, or expected_customer_version != Customer.version (see §1.2.1)"
    error_id: "ERR_STALE_PRODUCT_VERSION | ERR_STALE_CUSTOMER_VERSION"
    applies_to: "POST /tooling/tool-orders, POST /tooling/recondition-jobs"
    category: concurrency

  - priority: 11
    rule: business_code_unique
    condition: "grade_code, batch_code, geometry_code, recipe_code, wheel_code, sku, dossier_code, trial_code, customer_code, order_code or job_code duplicates an existing row's value"
    error_id: ERR_DUPLICATE_CODE
    applies_to: "every entity-creating POST"
    category: uniqueness

  - priority: 12
    rule: subject_state_allows_transition
    condition: "The entity is not in a state from which the requested trigger is declared in §1.2"
    error_id: "ERR_INVALID_GRADE_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_GEOMETRY_STATE | ERR_INVALID_COATING_RUN_STATE | ERR_INVALID_WHEEL_STATE | ERR_INVALID_GRINDING_RUN_STATE | ERR_INVALID_PRODUCT_STATE | ERR_INVALID_DOSSIER_STATE | ERR_INVALID_TRIAL_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_JOB_STATE | ERR_INVALID_CUSTOMER_STATE"
    applies_to: "every action endpoint"
    category: state

  - priority: 13
    rule: dependent_creation_requires_open_parent
    condition: "A child is created under a parent that has already left the state in which children may be added (trial under a dossier that is not OPEN, batch under a RETIRED grade, coating run under a recipe whose deposition chamber support was withdrawn, order line against a WITHDRAWN product)"
    error_id: "ERR_INVALID_DOSSIER_STATE | ERR_INVALID_GRADE_STATE | ERR_INVALID_PRODUCT_STATE"
    applies_to: "POST /tooling/machining-trials, POST /tooling/powder-blend-batches, POST /tooling/coating-runs, POST /tooling/tool-orders"
    category: state

  - priority: 14
    rule: wheel_not_expired
    condition: "The GrindingWheel referenced by a grinding run or a refurbish request has status EXPIRED"
    error_id: ERR_WHEEL_EXPIRED
    applies_to: "POST /tooling/grinding-runs, POST /tooling/recondition-jobs/{jobId}/refurbish"
    category: business_safety

  - priority: 15
    rule: wheel_not_awaiting_dress
    condition: "The GrindingWheel referenced by a grinding run or a refurbish request has status DRESSING (remaining_life_units fell below DRESS_THRESHOLD_UNITS and it has not been dressed yet)"
    error_id: ERR_WHEEL_REQUIRES_DRESSING
    applies_to: "POST /tooling/grinding-runs, POST /tooling/recondition-jobs/{jobId}/refurbish"
    category: business_safety

  - priority: 16
    rule: trial_material_qc_passed
    condition: "The PowderBlendBatch supplying the trial tools has qc_status other than PASSED, or stage other than SINTERED/CONSUMED"
    error_id: ERR_BATCH_QC_NOT_PASSED
    applies_to: "POST /tooling/machining-trials"
    category: business_safety

  - priority: 17
    rule: restricted_product_not_orderable
    condition: "A ToolOrder is created or submitted against a ToolProduct whose release_status is RESTRICTED or WITHDRAWN, or whose supply_status is UNAVAILABLE"
    error_id: ERR_PRODUCT_NOT_ORDERABLE
    applies_to: "POST /tooling/tool-orders, POST /tooling/tool-orders/{orderId}/submit"
    category: business_safety

  - priority: 18
    rule: order_confirm_requires_qualified_grade
    condition: "At order confirmation the product's CarbideGrade status is not QUALIFIED"
    error_id: ERR_GRADE_NOT_QUALIFIED
    applies_to: "POST /tooling/tool-orders/{orderId}/confirm"
    category: business_referential

  - priority: 19
    rule: order_confirm_requires_released_geometry
    condition: "At order confirmation the product's InsertGeometry status is not RELEASED"
    error_id: ERR_GEOMETRY_NOT_RELEASED
    applies_to: "POST /tooling/tool-orders/{orderId}/confirm"
    category: business_referential

  - priority: 20
    rule: order_confirm_requires_validated_coating
    condition: "At order confirmation the product references a CoatingRecipe whose is_validated is false"
    error_id: ERR_COATING_NOT_VALIDATED
    applies_to: "POST /tooling/tool-orders/{orderId}/confirm"
    category: business_referential

  - priority: 21
    rule: pinned_revisions_current
    condition: "At order confirmation or product release any of pinned_grade_revision / pinned_geometry_revision / pinned_coating_revision differs from the referenced entity's current revision (the product must be repinned first)"
    error_id: ERR_PINNED_REVISION_STALE
    applies_to: "POST /tooling/tool-orders/{orderId}/confirm, POST /tooling/tool-products/{productId}/release"
    category: business_referential

  - priority: 22
    rule: special_product_derives_from_catalog
    condition: "A SPECIAL ToolProduct omits base_catalog_product_id, points it at itself, or points it at a product whose order_class is SPECIAL (only one derivation hop from a CATALOG parent is allowed); or a CATALOG product supplies base_catalog_product_id at all"
    error_id: ERR_INVALID_PRODUCT_DERIVATION
    applies_to: "POST /tooling/tool-products"
    category: business_referential

  - priority: 23
    rule: product_regrindable
    condition: "A ReconditionJob is created for a ToolProduct whose tool_type is INSERT, or whose min_regrind_length_mm >= nominal_length_mm"
    error_id: ERR_PRODUCT_NOT_REGRINDABLE
    applies_to: "POST /tooling/recondition-jobs"
    category: business_referential

  - priority: 24
    rule: predecessor_job_chain_valid
    condition: "predecessor_job_id is supplied but that job is not status RETURNED, or belongs to a different customer_id or product_id, or is already referenced as the predecessor of another job"
    error_id: ERR_INVALID_PREDECESSOR_CHAIN
    applies_to: "POST /tooling/recondition-jobs"
    category: business_referential

  - priority: 25
    rule: window_bounds_ordered
    condition: "window_start >= window_end"
    error_id: ERR_INVALID_WINDOW
    applies_to: "POST /tooling/coating-runs, POST /tooling/grinding-runs"
    category: business_temporal

  - priority: 26
    rule: window_not_in_past
    condition: "window_start is strictly earlier than the current logical UTC time"
    error_id: ERR_WINDOW_IN_PAST
    applies_to: "POST /tooling/coating-runs, POST /tooling/grinding-runs"
    category: business_temporal

  - priority: 27
    rule: chamber_area_capacity
    condition: "For the requested chamber, at any instant covered by the HALF-OPEN interval [window_start, window_end), the sum of loaded_area_cm2 over SCHEDULED and COMPLETED runs whose half-open windows include that instant, plus the requested loaded_area_cm2, exceeds CHAMBER_AREA_CAPACITY_CM2 (4000.00). Touching windows (previous end == new start) do not overlap and may both be full."
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    applies_to: "POST /tooling/coating-runs"
    category: business_temporal

  - priority: 28
    rule: cell_exclusive_occupancy
    condition: "For the requested cell_id, the CLOSED interval [window_start, window_end] intersects the closed window of any SCHEDULED or COMPLETED GrindingRun in that cell (a single run occupies the whole cell, so touching endpoints DO collide)"
    error_id: ERR_CELL_DOUBLE_BOOKED
    applies_to: "POST /tooling/grinding-runs"
    category: business_temporal

  - priority: 29
    rule: cell_setup_buffer
    condition: "For the requested cell_id, the gap to the nearest non-overlapping neighbouring run in that cell is smaller than CELL_SETUP_BUFFER_MIN (45) minutes on either side; a gap of exactly 45 minutes is accepted"
    error_id: ERR_CELL_BUFFER_CONFLICT
    applies_to: "POST /tooling/grinding-runs"
    category: business_temporal

  - priority: 30
    rule: run_window_elapsed_before_completion
    condition: "A coating run or grinding run is completed while the current logical UTC time is strictly earlier than its window_end"
    error_id: ERR_WINDOW_NOT_ELAPSED
    applies_to: "POST /tooling/coating-runs/{runId}/complete, POST /tooling/grinding-runs/{runId}/complete"
    category: business_temporal

  - priority: 31
    rule: order_meets_minimum_quantity
    condition: "quantity is strictly less than the product's min_order_qty (a quantity exactly equal to min_order_qty is accepted)"
    error_id: ERR_BELOW_MIN_ORDER_QTY
    applies_to: "POST /tooling/tool-orders"
    category: business_constraint

  - priority: 32
    rule: expedite_requires_eligible_product
    condition: "expedite_requested is true while the product's expedite_eligible is false"
    error_id: ERR_EXPEDITE_NOT_ELIGIBLE
    applies_to: "POST /tooling/tool-orders"
    category: business_constraint

  - priority: 33
    rule: sinter_unit_conservation
    condition: "sintered_units + scrap_units != pressed_units on sintering, or produced_units + scrap_units != planned_units on grinding-run completion, or units_returned > units_inspected, or units_inspected > units_received"
    error_id: ERR_UNIT_COUNT_MISMATCH
    applies_to: "POST /tooling/powder-blend-batches/{batchId}/sinter, POST /tooling/grinding-runs/{runId}/complete, POST /tooling/recondition-jobs/{jobId}/inspect, POST /tooling/recondition-jobs/{jobId}/return"
    category: business_constraint

  - priority: 34
    rule: batch_units_available
    condition: "units_consumed exceeds the batch's remaining_units"
    error_id: ERR_INSUFFICIENT_BATCH_UNITS
    applies_to: "POST /tooling/machining-trials"
    category: business_constraint

  - priority: 35
    rule: dossier_trial_count_met
    condition: "completed_trial_count (COMPLETED trials, any verdict) is less than required_trial_count at submission"
    error_id: ERR_INSUFFICIENT_TRIALS
    applies_to: "POST /tooling/qualification-dossiers/{dossierId}/submit"
    category: business_constraint

  - priority: 36
    rule: dossier_composite_score_met
    condition: "composite_score is null or strictly less than MIN_COMPOSITE_SCORE (1.00) at approval"
    error_id: ERR_COMPOSITE_SCORE_BELOW_MINIMUM
    applies_to: "POST /tooling/qualification-dossiers/{dossierId}/approve"
    category: business_constraint

  - priority: 37
    rule: workpiece_coverage_met
    condition: "the distinct workpiece_group count over the dossier's PASS trials is fewer than MIN_QUALIFIED_GROUPS (2) at approval"
    error_id: ERR_INSUFFICIENT_WORKPIECE_COVERAGE
    applies_to: "POST /tooling/qualification-dossiers/{dossierId}/approve"
    category: business_constraint

  - priority: 38
    rule: approval_segregation_of_duties
    condition: "The approving X-User-ID equals the dossier's submitted_by_user_id, or equals the operator_user_id of any trial in the dossier"
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /tooling/qualification-dossiers/{dossierId}/approve, POST /tooling/qualification-dossiers/{dossierId}/reject"
    category: business_constraint

  - priority: 39
    rule: product_release_requires_approved_dossier
    condition: "The product has no QualificationDossier in status APPROVED, or its tool_life_index is null"
    error_id: ERR_NO_APPROVED_DOSSIER
    applies_to: "POST /tooling/tool-products/{productId}/release"
    category: business_constraint

  - priority: 40
    rule: refurbish_requires_remaining_regrinds
    condition: "remaining_regrinds is 0, or scrap_recommended is true (the tool is below min_regrind_length_mm and must be scrapped instead)"
    error_id: ERR_NO_REGRINDS_REMAINING
    applies_to: "POST /tooling/recondition-jobs/{jobId}/refurbish"
    category: business_constraint

  - priority: 41
    rule: grade_retire_requires_no_open_demand
    condition: "The grade is retired while any ToolOrder in status SUBMITTED, ENGINEERING_REVIEW or CONFIRMED references a product built on it"
    error_id: ERR_OPEN_DEMAND_EXISTS
    applies_to: "POST /tooling/carbide-grades/{gradeId}/retire"
    category: business_constraint

  - priority: 42
    rule: customer_account_orderable
    condition: "The Customer's account_status is CREDIT_HOLD (402) or CLOSED (409) when an order is submitted or a recondition job is created"
    error_id: "ERR_CUSTOMER_CREDIT_HOLD | ERR_CUSTOMER_CLOSED"
    applies_to: "POST /tooling/tool-orders/{orderId}/submit, POST /tooling/recondition-jobs"
    category: business_fiscal

  - priority: 43
    rule: regrind_credit_sufficient
    condition: "units_received * RECONDITION_COST_CENTS_PER_TOOL (1850) exceeds the customer's regrind_credit_cents at intake"
    error_id: ERR_INSUFFICIENT_REGRIND_CREDIT
    applies_to: "POST /tooling/recondition-jobs"
    category: business_fiscal

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================

endpoints:

  # ---------------------------------------------------------------- logical clock
  - method: POST
    path: "/tooling/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC time used by every temporal rule (window_not_in_past, run_window_elapsed_before_completion). The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [ProductionPlanner, MetallurgyEngineer, GeometryEngineer, CoatingEngineer, ApplicationEngineer, QualityApprover]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Logical clock repositioned; no entity is mutated and no scheduled work fires retroactively"]

  # ---------------------------------------------------------------- CarbideGrade
