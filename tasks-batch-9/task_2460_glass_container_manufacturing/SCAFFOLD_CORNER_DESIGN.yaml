  - section: calculations
    instances:
      - name: changeover_minutes_constants_applied_on_foreign_family_swap
        claim_type: constants_applied
        grounds:
          - calculations.changeover_minutes
          - entities.ProductionJob.fields.changeover_minutes
          - entities.FormingMachine.fields.mounted_cavities
        distinguishing_aspect: |
          A BLOW_BLOW mold set on an NNPB machine with cavity_delta 4 and condition_score 80 yields
          60 x 1.5 + max(35, 10) = 125 minutes: the FOREIGN_FAMILY_FACTOR is applied to the swap base only,
          and the cavity tier wins the max against the condition penalty rather than being added to it.
        test_recipe:
          setup:
            - "Furnace FUR-C1 (design_pull_tpd 300.00, life 100000.00, FLINT) with ACTIVE Campaign CMP-C1 (300.00 tpd, 2026-08-01 to 2026-08-11)"
            - "Approved FLINT BatchRecipe BR-C1 (cullet 40.00)"
            - "FormingMachine IS-C1 with primary_mold_family NNPB, max_cavities 40, changeover_buffer_minutes 45"
            - "APPROVED design BD-C1 with cavity_count 8"
            - "MoldSet MS-C1 on BD-C1 with cavity_count 12, mold_family BLOW_BLOW, condition_score 80"
            - "ProductionJob PJ-C1 SCHEDULED over 2026-08-01T00:00:00Z..2026-08-03T00:00:00Z at 300.00 tpd"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-C1", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-C1", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
