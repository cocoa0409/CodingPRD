          - validations[priority=26]
          - errors.ERR_PLAN_YEAR_NOT_LOCKED
        distinguishing_aspect: "The annual true-up is allowed only while PlanYear.status == LOCKED: invoked on an OPEN plan year it returns 409 ERR_PLAN_YEAR_NOT_LOCKED and leaves true_up_completed false."
