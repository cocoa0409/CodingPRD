              as_user_id: "csh-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_SALE_NOT_OPEN"

      # ---- existence (priority 3) vs business_temporal INVALID_WINDOW (priority 7) ----
      - name: product_not_found_beats_invalid_window_on_priceplan
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: |
          A price-plan create with a non-existent product_id AND effective_end <= effective_start fails
          with ERR_PRODUCT_NOT_FOUND (priority 3 existence) NOT ERR_INVALID_WINDOW (priority 7
          business_temporal) — a different error-category pair than the state-vs-business conflict above.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. A real product exists (to source a version literal), but the price-plan create targets a DIFFERENT, non-existent product_id."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
