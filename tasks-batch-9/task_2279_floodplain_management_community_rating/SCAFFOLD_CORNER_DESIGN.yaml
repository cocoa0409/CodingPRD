          - errors.ERR_ORDER_DEADLINE_NOT_PASSED
          - calculations.sanction_risk_and_posture
        distinguishing_aspect: |
          A default may only be recorded strictly after deadline_at, so at 2026-08-01 against
          a 2026-09-01 deadline the call returns 422 ERR_ORDER_DEADLINE_NOT_PASSED; the order
          stays ISSUED, the violation stays ORDER_ISSUED and sanction_risk_points stays at the
          6 points of the MAJOR violation without the 5-point default penalty.
