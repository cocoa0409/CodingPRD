              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "V4-A", title: "Pkg A", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_a: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "V4-B", title: "Pkg B", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { err: $.data.error_id }
            - call: "GET /projects/${proj_id}/trade-packages"
              as: BuyoutLead
              captures: { first_code: "$.data[0].trade_code" }
