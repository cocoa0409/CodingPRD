            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "o@oc.com", user_full_name: "O"}, as: FirmAdmin, as_user_id: "${a_id}"}
          trigger:
            - {call: "PATCH /legal-research/subscriptions/${s_id}/change-plan", payload: {new_plan_id: "${p2}", expected_subscription_version: "${v0}"}, as: LicensingManager, captures: {err: $.data.error_id}}
