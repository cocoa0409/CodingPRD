              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Rainey Studio", zone_code: "ZONE_A", size_tier: "STUDIO", owner_contact_email: "owner2@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1 }
