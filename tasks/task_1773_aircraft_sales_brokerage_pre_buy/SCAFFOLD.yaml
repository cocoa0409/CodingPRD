# =============================================================================
# PRD Benchmark Seed Tables — task_1773_aircraft_sales_brokerage_pre_buy
# =============================================================================

scenario: |
  Aircraft Sales Brokerage & Pre-Buy Management (business aircraft broker): listing & market comparables valuation, buyer qualification & letter of intent, deposit escrow & inspection facility scheduling, discrepancy list & airworthiness item negotiation, delivery conditions & logbook completeness, import/export & registration change, commission structure & dual-agency disclosure, closing & tax planning coordination

domain_name: aircraft-brokerage-prebuy
api_prefix: /api

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
  entity_topology: flat            # peer entities joined by foreign keys; no URL nesting
  state_machine_shape: cyclic      # LOI negotiation loop + Listing contract loop; parallel disclosure axis on LOI
  relationship_patterns:
    - one_to_many                  # Listing 1—N LOI/Transaction/ComparableSale; Transaction 1—N Booking/Discrepancy
    - cross_aggregate              # Booking references Transaction AND InspectionFacility; Discrepancy references Transaction AND Booking
  role_model: peer_roles           # ListingAgent / BuyerAgent / EscrowOfficer / FacilityScheduler / BrokerPrincipal own disjoint operations
  consistency_model: immediate     # every mutation + cascade visible in the same request's response

# =============================================================================
# Table 1: Entity-Relationship Table (9 entities)
# =============================================================================
entities:
  - name: InspectionFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name (MRO / service center)" }
      - { name: airport_code, type: string, source: input, description: "ICAO/IATA code of the facility" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Required gap between consecutive bookings at this facility", default: 120, constraints: ">= 0" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Aircraft registration / tail number" }
      - { name: make, type: string, source: input, description: "Manufacturer name; exact string match keys comparables" }
      - { name: model, type: string, source: input, description: "Model designation; exact string match keys comparables" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: total_time_hours, type: integer, source: input, description: "Airframe total time in whole hours", constraints: ">= 0" }
      - { name: asking_price_usd, type: number, source: input, description: "Advertised asking price", constraints: "> 0, 2dp" }
      - { name: seller_name, type: string, source: input, description: "Seller display name (seller is not a system user)" }
      - { name: market_value_estimate_usd, type: number, source: computed, description: "Last computed valuation result; null until first valuation", default: null }
      - { name: valuation_status, type: enum, source: computed, description: "NONE | PROVISIONAL | FINAL — variant of the most recent valuation run", default: NONE }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_CONTRACT | SOLD", default: DRAFT }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer full legal name" }
      - { name: email, type: string, source: input, description: "Buyer contact email" }
      - { name: qualification_status, type: enum, source: system, description: "UNQUALIFIED | QUALIFIED", default: UNQUALIFIED }
      - { name: qualified_budget_usd, type: number, source: system, description: "Budget ceiling recorded at qualification; null until qualified", default: null }
      - { name: proof_of_funds_ref, type: string, source: system, description: "Bank reference recorded at qualification; null until qualified", default: null }

  - name: ComparableSale
    parent: null
    common_fields: true
    fields:
      - { name: make, type: string, source: input, description: "Manufacturer; exact string match against Listing.make" }
      - { name: model, type: string, source: input, description: "Model; exact string match against Listing.model" }
      - { name: year, type: integer, source: input, description: "Sold airframe model year" }
      - { name: sale_price_usd, type: number, source: input, description: "Recorded sale price", constraints: "> 0, 2dp" }
      - { name: sale_date, type: string, source: input, description: "ISO 8601 date of the recorded sale (stored, not window-filtered)" }
      - { name: total_time_hours, type: integer, source: input, description: "Airframe total time at sale", constraints: ">= 0" }
      - { name: comp_status, type: enum, source: input, description: "VERIFIED | UNVERIFIED; only VERIFIED enters valuation input set", default: UNVERIFIED }
      - { name: source_listing_id, type: string, source: system, description: "FK -> Listing.id; null for manually entered comps, set when auto-created at closing", default: null }

  - name: LOI
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; listing under negotiation" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; offering buyer" }
      - { name: offer_price_usd, type: number, source: input, description: "Initial offered price", constraints: "> 0, 2dp" }
      - { name: current_price_usd, type: number, source: system, description: "Price in force; equals offer_price_usd at creation, replaced by every counter", default: null }
      - { name: deposit_amount_usd, type: number, source: input, description: "Earnest deposit pledged; >= 5% of offer_price_usd (see deposit_requirement)", constraints: "> 0, 2dp" }
      - { name: dual_agency, type: boolean, source: input, description: "True when the same brokerage represents buyer and seller", default: false }
      - { name: disclosure_status, type: enum, source: computed, description: "NOT_REQUIRED | PENDING | PARTIAL | FULLY_ACKED — parallel disclosure axis", default: NOT_REQUIRED }
      - { name: buyer_acked, type: boolean, source: system, description: "Buyer side dual-agency acknowledgment recorded", default: false }
      - { name: seller_acked, type: boolean, source: system, description: "Seller side dual-agency acknowledgment recorded", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN", default: SUBMITTED }

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - { name: loi_id, type: string, source: system, description: "FK -> LOI.id; accepted LOI that opened this deal" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; aircraft under contract" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; purchasing buyer" }
      - { name: agreed_price_usd, type: number, source: system, description: "LOI.current_price_usd at acceptance" }
      - { name: dual_agency, type: boolean, source: system, description: "Copied from LOI at acceptance; selects commission variant" }
      - { name: status, type: enum, source: system, description: "OPENED | ESCROW_FUNDED | INSPECTION_SCHEDULED | INSPECTION_COMPLETE | DISCREPANCY_NEGOTIATION | DELIVERY_PENDING | CLOSED | TERMINATED", default: OPENED }
      - { name: logbook_complete, type: boolean, source: input, description: "Delivery condition: complete logbooks verified", default: false }
      - { name: registration_docs_complete, type: boolean, source: input, description: "Delivery condition: import/export and registration-change documents complete", default: false }
      - { name: tax_planning_notes, type: string, source: input, description: "Delivery condition: closing/tax planning coordination notes", default: null }
      - { name: credits_total_usd, type: number, source: computed, description: "Sum of credit_amount_usd over this transaction's RESOLVED/CREDIT discrepancy items", default: 0 }
      - { name: commission_amount_usd, type: number, source: computed, description: "Commission computed at closing; null until CLOSED", default: null }
      - { name: settlement_buyer_due_usd, type: number, source: computed, description: "agreed - credits - deposit, computed at closing; null until CLOSED", default: null }
      - { name: settlement_seller_net_usd, type: number, source: computed, description: "agreed - commission, computed at closing; null until CLOSED", default: null }
      - { name: termination_reason, type: string, source: input, description: "Reason recorded on termination; null otherwise", default: null }

  - name: EscrowDeposit
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> Transaction.id; deal this deposit secures (1:1)" }
      - { name: escrow_ref, type: string, source: system, description: "Server-generated escrow account reference" }
      - { name: deposit_amount_usd, type: number, source: system, description: "Copied from LOI.deposit_amount_usd at acceptance" }
      - { name: status, type: enum, source: system, description: "AWAITING_FUNDS | FUNDED | RELEASED | REFUNDED | FORFEITED", default: AWAITING_FUNDS }
      - { name: funding_reference, type: string, source: input, description: "Wire reference recorded at funding; null until FUNDED", default: null }
      - { name: released_usd, type: number, source: computed, description: "Amount disbursed to seller at closing; 0 unless RELEASED", default: 0 }
      - { name: refunded_usd, type: number, source: computed, description: "Amount returned to buyer on early termination; 0 unless REFUNDED", default: 0 }
      - { name: forfeited_usd, type: number, source: computed, description: "Amount forfeited to seller on late termination; 0 unless FORFEITED", default: 0 }

  - name: InspectionBooking
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; deal the inspection serves" }
      - { name: facility_id, type: string, source: input, description: "FK -> InspectionFacility.id; where the inspection happens" }
      - { name: start_at, type: datetime, source: input, description: "Slot start, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Slot end, ISO 8601 UTC; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED", default: REQUESTED }

  - name: DiscrepancyItem
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> Transaction.id; deal under negotiation (from path)" }
      - { name: inspection_booking_id, type: string, source: input, description: "FK -> InspectionBooking.id; booking whose inspection produced this finding" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: severity, type: enum, source: input, description: "AIRWORTHINESS | NON_AIRWORTHINESS; AIRWORTHINESS items may not be waived" }
      - { name: estimated_cost_usd, type: number, source: input, description: "Facility estimate to rectify", constraints: ">= 0, 2dp" }
      - { name: proposed_credit_usd, type: number, source: input, description: "Seller's counter-proposed price credit; null unless countered with a credit", default: null }
      - { name: credit_amount_usd, type: number, source: computed, description: "Agreed credit; set from proposed_credit_usd on CREDIT resolution, else null", default: null }
      - { name: resolution, type: enum, source: computed, description: "REPAIR | CREDIT | WAIVED; null until RESOLVED", default: null }
      - { name: status, type: enum, source: system, description: "RAISED | COUNTERED | RESOLVED", default: RAISED }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Buyer
    initial_state: UNQUALIFIED
    terminal_states: []
    transitions:
      - from: UNQUALIFIED
        to: QUALIFIED
        trigger: "POST /api/buyers/{id}/qualify"
        actor: BuyerAgent
        preconditions: []
        side_effects: ["qualification_status := QUALIFIED", "sets qualified_budget_usd and proof_of_funds_ref"]

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [SOLD]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/listings/{id}/activate"
        actor: ListingAgent
        preconditions: ["valuation_status == FINAL (a FINAL-variant valuation must exist)"]
        side_effects: ["status := ACTIVE"]
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "system cascade — an LOI on this listing is ACCEPTED"
        actor: system
        preconditions: []
        side_effects:
          - "status := UNDER_CONTRACT"
          - "every other LOI on this listing with status IN {SUBMITTED, COUNTERED} transitions to REJECTED (auto-reject sweep)"
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "system cascade — the open Transaction on this listing is TERMINATED"
        actor: system
        preconditions: []
        side_effects: ["status := ACTIVE; listing re-marketable"]
      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "system cascade — the open Transaction on this listing is CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "status := SOLD"
          - "auto-create ComparableSale: make/model/year/total_time_hours copied from this listing, sale_price_usd := Transaction.agreed_price_usd, sale_date := closing request date, comp_status := VERIFIED, source_listing_id := this listing id"

  - entity: LOI
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    note: "Two parallel state axes on one entity: negotiation status (SUBMITTED/COUNTERED/terminals) and disclosure axis (NOT_REQUIRED | PENDING | PARTIAL | FULLY_ACKED), which evolves independently via disclosure acks."
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /api/lois/{id}/counter"
        actor: ListingAgent | BuyerAgent
        preconditions: ["expected_loi_version == LOI.version (OCC)"]
        side_effects: ["current_price_usd := new_price_usd", "version += 1"]
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /api/lois/{id}/counter"
        actor: ListingAgent | BuyerAgent
        preconditions: ["expected_loi_version == LOI.version (OCC)"]
        side_effects: ["current_price_usd := new_price_usd", "version += 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept"
        actor: ListingAgent
        preconditions:
          - "Listing.status == ACTIVE (ERR_LISTING_NOT_ACTIVE otherwise)"
          - "if dual_agency == true then disclosure_status == FULLY_ACKED (ERR_DUAL_AGENCY_DISCLOSURE_PENDING otherwise)"
        side_effects:
          - "create Transaction: loi_id/listing_id/buyer_id copied, agreed_price_usd := current_price_usd, dual_agency copied, status OPENED"
          - "create EscrowDeposit for the new Transaction: deposit_amount_usd := deposit_amount_usd, status AWAITING_FUNDS"
          - "Listing ACTIVE -> UNDER_CONTRACT (which itself auto-rejects all sibling LOIs in {SUBMITTED, COUNTERED})"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept"
        actor: ListingAgent
        preconditions:
          - "Listing.status == ACTIVE (ERR_LISTING_NOT_ACTIVE otherwise)"
          - "if dual_agency == true then disclosure_status == FULLY_ACKED (ERR_DUAL_AGENCY_DISCLOSURE_PENDING otherwise)"
        side_effects:
          - "create Transaction: agreed_price_usd := current_price_usd, status OPENED"
          - "create EscrowDeposit: status AWAITING_FUNDS"
          - "Listing ACTIVE -> UNDER_CONTRACT (auto-rejects sibling LOIs in {SUBMITTED, COUNTERED})"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw"
        actor: BuyerAgent
        preconditions: []
        side_effects: ["status := WITHDRAWN"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw"
        actor: BuyerAgent
        preconditions: []
        side_effects: ["status := WITHDRAWN"]
      - from: PENDING
        to: PARTIAL
        trigger: "POST /api/lois/{id}/disclosure/ack (first party acknowledged)"
        actor: BrokerPrincipal
        preconditions: ["dual_agency == true", "requested party not yet acknowledged (ERR_ALREADY_ACKNOWLEDGED otherwise)"]
        side_effects: ["buyer_acked or seller_acked := true per party input", "disclosure_status := PARTIAL"]
      - from: PARTIAL
        to: FULLY_ACKED
        trigger: "POST /api/lois/{id}/disclosure/ack (remaining party acknowledged)"
        actor: BrokerPrincipal
        preconditions: ["dual_agency == true", "requested party not yet acknowledged (ERR_ALREADY_ACKNOWLEDGED otherwise)"]
        side_effects: ["remaining ack flag := true", "disclosure_status := FULLY_ACKED"]

  - entity: Transaction
    initial_state: OPENED
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: OPENED
        to: ESCROW_FUNDED
        trigger: "system bubble-up — EscrowDeposit transitions AWAITING_FUNDS -> FUNDED"
        actor: system
        preconditions: []
        side_effects: ["status := ESCROW_FUNDED"]
      - from: ESCROW_FUNDED
        to: INSPECTION_SCHEDULED
        trigger: "system bubble-up — an InspectionBooking for this transaction is CONFIRMED"
        actor: system
        preconditions: []
        side_effects: ["status := INSPECTION_SCHEDULED"]
      - from: INSPECTION_SCHEDULED
        to: ESCROW_FUNDED
        trigger: "system revert — an InspectionBooking is CANCELLED and no other booking of this transaction remains in {REQUESTED, CONFIRMED}"
        actor: system
        preconditions: []
        side_effects: ["status := ESCROW_FUNDED"]
      - from: INSPECTION_SCHEDULED
        to: INSPECTION_COMPLETE
        trigger: "system bubble-up — an InspectionBooking is COMPLETED and no other booking of this transaction remains in {REQUESTED, CONFIRMED}"
        actor: system
        preconditions: []
        side_effects: ["status := INSPECTION_COMPLETE"]
      - from: INSPECTION_COMPLETE
        to: DISCREPANCY_NEGOTIATION
        trigger: "system — first DiscrepancyItem created for this transaction"
        actor: system
        preconditions: []
        side_effects: ["status := DISCREPANCY_NEGOTIATION"]
      - from: DISCREPANCY_NEGOTIATION
        to: DELIVERY_PENDING
        trigger: "system bubble-up — a DiscrepancyItem resolves and ALL items of this transaction are now RESOLVED"
        actor: system
        preconditions: []
        side_effects: ["status := DELIVERY_PENDING", "credits_total_usd recomputed"]
      - from: INSPECTION_COMPLETE
        to: DELIVERY_PENDING
        trigger: "POST /api/transactions/{id}/accept-as-is"
        actor: BuyerAgent
        preconditions: ["zero DiscrepancyItems exist for this transaction (ERR_OPEN_DISCREPANCIES otherwise)"]
        side_effects: ["status := DELIVERY_PENDING"]
      - from: DELIVERY_PENDING
        to: CLOSED
        trigger: "POST /api/transactions/{id}/close"
        actor: BrokerPrincipal
        preconditions:
          - "logbook_complete == true AND registration_docs_complete == true (ERR_DELIVERY_CONDITIONS_INCOMPLETE otherwise)"
        side_effects:
          - "run commission_settlement + closing_settlement; set commission_amount_usd, settlement_buyer_due_usd, settlement_seller_net_usd"
          - "EscrowDeposit FUNDED -> RELEASED, released_usd := deposit_amount_usd"
          - "Listing UNDER_CONTRACT -> SOLD (which itself auto-creates a VERIFIED ComparableSale)"
      - from: OPENED
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects:
          - "termination_reason := reason"
          - "EscrowDeposit FUNDED -> REFUNDED, refunded_usd := deposit_amount_usd (escrow may be AWAITING_FUNDS: then no escrow transition)"
          - "Listing UNDER_CONTRACT -> ACTIVE"
      - from: ESCROW_FUNDED
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects: ["termination_reason := reason", "EscrowDeposit FUNDED -> REFUNDED, refunded_usd := deposit_amount_usd", "Listing UNDER_CONTRACT -> ACTIVE"]
      - from: INSPECTION_SCHEDULED
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects: ["termination_reason := reason", "EscrowDeposit FUNDED -> REFUNDED, refunded_usd := deposit_amount_usd", "Listing UNDER_CONTRACT -> ACTIVE"]
      - from: INSPECTION_COMPLETE
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects: ["termination_reason := reason", "EscrowDeposit FUNDED -> REFUNDED, refunded_usd := deposit_amount_usd", "Listing UNDER_CONTRACT -> ACTIVE"]
      - from: DISCREPANCY_NEGOTIATION
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects: ["termination_reason := reason", "EscrowDeposit FUNDED -> REFUNDED, refunded_usd := deposit_amount_usd", "Listing UNDER_CONTRACT -> ACTIVE"]
      - from: DELIVERY_PENDING
        to: TERMINATED
        trigger: "POST /api/transactions/{id}/terminate"
        actor: BrokerPrincipal | ListingAgent
        preconditions: []
        side_effects: ["termination_reason := reason", "EscrowDeposit FUNDED -> FORFEITED, forfeited_usd := deposit_amount_usd (deposit released to seller)", "Listing UNDER_CONTRACT -> ACTIVE"]

  - entity: EscrowDeposit
    initial_state: AWAITING_FUNDS
    terminal_states: [RELEASED, REFUNDED, FORFEITED]
    transitions:
      - from: AWAITING_FUNDS
        to: FUNDED
        trigger: "POST /api/escrow-deposits/{id}/fund"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["funding_reference := input", "Transaction OPENED -> ESCROW_FUNDED (bubble-up)"]
      - from: FUNDED
        to: RELEASED
        trigger: "system cascade — Transaction CLOSED"
        actor: system
        preconditions: []
        side_effects: ["released_usd := deposit_amount_usd"]
      - from: FUNDED
        to: REFUNDED
        trigger: "system cascade — Transaction TERMINATED from a pre-DELIVERY_PENDING state"
        actor: system
        preconditions: []
        side_effects: ["refunded_usd := deposit_amount_usd"]
      - from: FUNDED
        to: FORFEITED
        trigger: "system cascade — Transaction TERMINATED from DELIVERY_PENDING"
        actor: system
        preconditions: []
        side_effects: ["forfeited_usd := deposit_amount_usd"]

  - entity: InspectionBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/inspection-bookings/{id}/confirm"
        actor: FacilityScheduler
        preconditions: ["Transaction.status IN {ESCROW_FUNDED, INSPECTION_SCHEDULED}"]
        side_effects: ["if Transaction.status == ESCROW_FUNDED: Transaction -> INSPECTION_SCHEDULED (bubble-up)"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/inspection-bookings/{id}/complete"
        actor: FacilityScheduler
        preconditions: ["Transaction.status == INSPECTION_SCHEDULED"]
        side_effects: ["if no other booking of this transaction remains in {REQUESTED, CONFIRMED}: Transaction -> INSPECTION_COMPLETE (bubble-up)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/inspection-bookings/{id}/cancel"
        actor: FacilityScheduler
        preconditions: []
        side_effects: ["if Transaction.status == INSPECTION_SCHEDULED and no other booking of this transaction remains in {REQUESTED, CONFIRMED}: Transaction -> ESCROW_FUNDED (revert)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/inspection-bookings/{id}/cancel"
        actor: FacilityScheduler
        preconditions: []
        side_effects: ["if Transaction.status == INSPECTION_SCHEDULED and no other booking of this transaction remains in {REQUESTED, CONFIRMED}: Transaction -> ESCROW_FUNDED (revert)"]

  - entity: DiscrepancyItem
    initial_state: RAISED
    terminal_states: [RESOLVED]
    transitions:
      - from: RAISED
        to: COUNTERED
        trigger: "POST /api/discrepancy-items/{id}/counter"
        actor: ListingAgent
        preconditions: []
        side_effects: ["if proposed_credit_usd provided: proposed_credit_usd := input"]
      - from: RAISED
        to: RESOLVED
        trigger: "POST /api/discrepancy-items/{id}/commit-repair"
        actor: ListingAgent
        preconditions: []
        side_effects: ["resolution := REPAIR", "Transaction.credits_total_usd recomputed", "if all items of the transaction RESOLVED: Transaction DISCREPANCY_NEGOTIATION -> DELIVERY_PENDING (bubble-up)"]
      - from: COUNTERED
        to: RESOLVED
        trigger: "POST /api/discrepancy-items/{id}/commit-repair"
        actor: ListingAgent
        preconditions: []
        side_effects: ["resolution := REPAIR", "Transaction.credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]
      - from: COUNTERED
        to: RESOLVED
        trigger: "POST /api/discrepancy-items/{id}/agree-credit"
        actor: BuyerAgent
        preconditions: ["proposed_credit_usd IS NOT NULL (ERR_CREDIT_NOT_PROPOSED otherwise)"]
        side_effects: ["resolution := CREDIT", "credit_amount_usd := proposed_credit_usd", "Transaction.credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]
      - from: RAISED
        to: RESOLVED
        trigger: "POST /api/discrepancy-items/{id}/waive"
        actor: BuyerAgent
        preconditions: ["severity == NON_AIRWORTHINESS (ERR_AIRWORTHINESS_NOT_WAIVABLE otherwise)"]
        side_effects: ["resolution := WAIVED", "Transaction.credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]
      - from: COUNTERED
        to: RESOLVED
        trigger: "POST /api/discrepancy-items/{id}/waive"
        actor: BuyerAgent
        preconditions: ["severity == NON_AIRWORTHINESS (ERR_AIRWORTHINESS_NOT_WAIVABLE otherwise)"]
        side_effects: ["resolution := WAIVED", "Transaction.credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: loi-counter-stale-version
    parent_entity: LOI
    write_endpoint: "POST /api/lois/{id}/counter"
    occ_field: expected_loi_version
    description: |
      Countering an LOI whose version has advanced since the client last
      observed it is rejected. A counter is legitimate from either SUBMITTED
      or COUNTERED (negotiation continues), so a client holding a stale view
      after another counter landed would otherwise silently overwrite the
      newest price; the stale expected_loi_version makes the rejection
      deterministic.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transaction-conditions-stale-version
    parent_entity: Transaction
    write_endpoint: "PATCH /api/transactions/{id}/delivery-conditions"
    occ_field: expected_transaction_version
    description: |
      Updating delivery conditions against a Transaction whose version has
      advanced since the client last observed it is rejected. Condition
      updates are legitimate in every non-terminal state, so a stale
      expected_transaction_version is the only deterministic signal that the
      client's view (e.g. of credits_total_usd or status) is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: market_comparables_valuation
    trigger: "POST /api/listings/{id}/valuation"
    algorithm: aggregation
    formula: |
      input_set := ComparableSale where make == Listing.make AND model == Listing.model
                   AND comp_status == VERIFIED   (exact string equality on make/model)
      require count(input_set) >= MIN_COMPARABLES else ERR_INSUFFICIENT_COMPARABLES
      PROVISIONAL variant:
        value := round_half_up( sum(sale_price_usd over input_set) / count , 2 )
      FINAL variant (nested rounding; order is pinned):
        for each comp i:
          factor_i := 1 - TIME_ADJ_PCT_PER_HOUR * (comp_i.total_time_hours - Listing.total_time_hours)
          adjusted_i := round_half_up( comp_i.sale_price_usd * factor_i , 2 )   # round per comp FIRST
        value := round_half_up( sum(adjusted_i) / count , 2 )                   # then aggregate
      Persist: Listing.market_value_estimate_usd := value; Listing.valuation_status := requested variant.
    input_set: "VERIFIED ComparableSale rows exactly matching the listing's make AND model"
    constants:
      MIN_COMPARABLES: 3
      TIME_ADJ_PCT_PER_HOUR: 0.00004
    precision: "2 decimal places, round_half_up; FINAL rounds each adjusted comp to cents BEFORE averaging"
    variants:
      - name: PROVISIONAL
        when: "broker wants a quick draft estimate while listing is DRAFT (or any time)"
        difference: "plain mean of raw sale_price_usd; no per-hour time adjustment"
      - name: FINAL
        when: "required before listing activation"
        difference: "per-comp time adjustment with per-line rounding before averaging; provably diverges from PROVISIONAL on the same comp set"

  - name: commission_settlement
    trigger: "POST /api/transactions/{id}/close"
    algorithm: tiered_pricing
    formula: |
      base := Transaction.agreed_price_usd - Transaction.credits_total_usd
      sole := round_half_up( min(base, TIER1_LIMIT_USD) * TIER1_RATE
                             + max(base - TIER1_LIMIT_USD, 0) * TIER2_RATE , 2 )
      SOLE_AGENCY variant:  commission := sole
      DUAL_AGENCY variant:  commission := round_half_up( sole + base * DUAL_BUYER_SIDE_RATE , 2 )
      Persist: Transaction.commission_amount_usd := commission.
    input_set: "the closing Transaction (agreed_price_usd, credits_total_usd snapshot, dual_agency flag)"
    constants:
      TIER1_LIMIT_USD: 5000000
      TIER1_RATE: 0.06
      TIER2_RATE: 0.04
      DUAL_BUYER_SIDE_RATE: 0.02
    precision: "2 decimal places, round_half_up; tier1/tier2 computed at full precision and rounded once at the variant total"
    variants:
      - name: SOLE_AGENCY
        when: "Transaction.dual_agency == false"
        difference: "marginal tiered commission only"
      - name: DUAL_AGENCY
        when: "Transaction.dual_agency == true (both sides represented by this brokerage)"
        difference: "adds buyer-side fee of 2% of base on top of the tiered amount; diverges from SOLE on identical price/credits"

  - name: deposit_requirement
    trigger: "POST /api/lois"
    algorithm: threshold
    formula: |
      minimum := round_half_up( offer_price_usd * MIN_DEPOSIT_PCT , 2 )
      require deposit_amount_usd >= minimum   # boundary: exact equality PASSES
      else ERR_DEPOSIT_BELOW_MINIMUM
    input_set: "the LOI being created"
    constants:
      MIN_DEPOSIT_PCT: 0.05
    precision: "2 decimal places, round_half_up on the minimum before comparison"

  - name: escrow_disposition_reconciliation
    trigger: "every EscrowDeposit transition (fund / release / refund / forfeit) and every read"
    algorithm: aggregation
    formula: |
      invariant: released_usd + refunded_usd + forfeited_usd
                 == (status IN {RELEASED, REFUNDED, FORFEITED} ? deposit_amount_usd : 0)
      i.e. a terminal escrow disposes of EXACTLY the deposited amount through exactly one channel;
      a non-terminal escrow has disposed of nothing. Forward action (fund) + compensating action
      (refund) leave net buyer funds unchanged.
    input_set: "single EscrowDeposit row"
    precision: "exact 2dp equality; no rounding"
    constants: {}

  - name: closing_settlement
    trigger: "POST /api/transactions/{id}/close"
    algorithm: aggregation
    formula: |
      settlement_buyer_due_usd  := agreed_price_usd - credits_total_usd - EscrowDeposit.deposit_amount_usd
      settlement_seller_net_usd := agreed_price_usd - commission_amount_usd
      (commission_amount_usd from commission_settlement runs first, then settlement — evaluation order pinned)
    input_set: "the closing Transaction and its EscrowDeposit"
    precision: "2 decimal places, round_half_up (inputs already 2dp; results exact)"
    constants: {}

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the path exists, validated left-to-right; body-referenced ids (listing_id, buyer_id, transaction_id, facility_id, inspection_booking_id) exist"
    error_id: "ERR_LISTING_NOT_FOUND | ERR_BUYER_NOT_FOUND | ERR_COMPARABLE_SALE_NOT_FOUND | ERR_LOI_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_ESCROW_DEPOSIT_NOT_FOUND | ERR_INSPECTION_FACILITY_NOT_FOUND | ERR_INSPECTION_BOOKING_NOT_FOUND | ERR_DISCREPANCY_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "request body schema: required fields present, types valid, enum values in range; booking end_at strictly after start_at (ERR_BOOKING_WINDOW_INVALID)"
    error_id: "ERR_VALIDATION | ERR_BOOKING_WINDOW_INVALID"
    http_status: 400
    applies_to: all endpoints with a body
    note: "ERR_BOOKING_WINDOW_INVALID uses http 422; ERR_VALIDATION uses 400"
  - priority: 5
    category: state
    check: "state preconditions in order: (a) target resource transition validity (ERR_INVALID_STATE); (b) domain state gates — listing ACTIVE for LOI create/accept (ERR_LISTING_NOT_ACTIVE), FINAL valuation for activate (ERR_VALUATION_REQUIRED), transaction ESCROW_FUNDED for booking create (ERR_TRANSACTION_NOT_FUNDED), zero items for accept-as-is (ERR_OPEN_DISCREPANCIES), party not yet acked (ERR_ALREADY_ACKNOWLEDGED), proposed_credit present for agree-credit (ERR_CREDIT_NOT_PROPOSED), logbook+registration complete for close (ERR_DELIVERY_CONDITIONS_INCOMPLETE); (c) OCC expected_*_version match (ERR_STALE_VERSION)"
    error_id: "ERR_INVALID_STATE | ERR_LISTING_NOT_ACTIVE | ERR_VALUATION_REQUIRED | ERR_TRANSACTION_NOT_FUNDED | ERR_OPEN_DISCREPANCIES | ERR_ALREADY_ACKNOWLEDGED | ERR_CREDIT_NOT_PROPOSED | ERR_DELIVERY_CONDITIONS_INCOMPLETE | ERR_STALE_VERSION"
    http_status: 409
    applies_to: action endpoints
    note: "ERR_STALE_VERSION uses http 412; all others 409"
  - priority: 6
    category: business_safety
    check: "AIRWORTHINESS discrepancy items may not be waived"
    error_id: ERR_AIRWORTHINESS_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /api/discrepancy-items/{id}/waive"
  - priority: 7
    category: business_temporal
    check: "booking window conflicts — facility rule first, then aircraft rule: (a) facility buffer rule: no other REQUESTED/CONFIRMED booking at the same facility whose window, expanded by the facility turnaround_buffer_minutes, intersects [start_at, end_at); (b) aircraft rule: no other REQUESTED/CONFIRMED booking for the same transaction's listing whose half-open window strictly overlaps"
    error_id: "ERR_FACILITY_SLOT_CONFLICT | ERR_AIRCRAFT_SLOT_CONFLICT"
    http_status: 409
    applies_to: "POST /api/inspection-bookings"
  - priority: 8
    category: business_referential
    check: "cross-references coherent: discrepancy's inspection_booking_id belongs to the path transaction (ERR_BOOKING_NOT_FOR_TRANSACTION); dual-agency LOI fully acknowledged before accept (ERR_DUAL_AGENCY_DISCLOSURE_PENDING)"
    error_id: "ERR_BOOKING_NOT_FOR_TRANSACTION | ERR_DUAL_AGENCY_DISCLOSURE_PENDING"
    http_status: 422
    applies_to: "POST /api/transactions/{id}/discrepancy-items, POST /api/lois/{id}/accept"
    note: "ERR_DUAL_AGENCY_DISCLOSURE_PENDING uses http 409"
  - priority: 9
    category: business_constraint
    check: "aggregate sufficiency: at least MIN_COMPARABLES verified matching comps for valuation"
    error_id: ERR_INSUFFICIENT_COMPARABLES
    http_status: 422
    applies_to: "POST /api/listings/{id}/valuation"
  - priority: 10
    category: business_fiscal
    check: "fiscal gates in order: buyer QUALIFIED (ERR_BUYER_NOT_QUALIFIED), offer_price_usd <= buyer.qualified_budget_usd (ERR_BUDGET_EXCEEDED), deposit >= 5% of offer (ERR_DEPOSIT_BELOW_MINIMUM)"
    error_id: "ERR_BUYER_NOT_QUALIFIED | ERR_BUDGET_EXCEEDED | ERR_DEPOSIT_BELOW_MINIMUM"
    http_status: 422
    applies_to: "POST /api/lois"

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  # --- Inspection facilities ---
  - method: POST
    path: "/api/inspection-facilities"
    description: "Register an inspection facility (MRO)"
    roles: [BrokerPrincipal]
    code: 201
    input: [name, airport_code, "turnaround_buffer_minutes?"]
    output: InspectionFacility
    side_effects: ["turnaround_buffer_minutes defaults to 120"]

  # --- Listings ---
  - method: POST
    path: "/api/listings"
    description: "Create an aircraft listing (starts DRAFT)"
    roles: [ListingAgent]
    code: 201
    input: [tail_number, make, model, year, total_time_hours, asking_price_usd, seller_name]
    output: Listing
    side_effects: ["status=DRAFT, valuation_status=NONE"]
  - method: GET
    path: "/api/listings/{id}"
    description: "Get listing details"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: POST
    path: "/api/listings/{id}/valuation"
    description: "Run market-comparables valuation with the requested variant"
    roles: [ListingAgent]
    code: 200
    input: [variant]
    output: Listing
    side_effects: ["runs market_comparables_valuation(variant)", "sets market_value_estimate_usd and valuation_status := variant", "increments Listing.version by 1"]
  - method: POST
    path: "/api/listings/{id}/activate"
    description: "Activate a DRAFT listing (requires FINAL valuation)"
    roles: [ListingAgent]
    code: 200
    input: []
    output: Listing
    side_effects: ["status DRAFT -> ACTIVE", "increments Listing.version by 1"]

  # --- Buyers ---
  - method: POST
    path: "/api/buyers"
    description: "Register a buyer (starts UNQUALIFIED)"
    roles: [BuyerAgent]
    code: 201
    input: [full_name, email]
    output: Buyer
    side_effects: ["qualification_status=UNQUALIFIED"]
  - method: POST
    path: "/api/buyers/{id}/qualify"
    description: "Qualify a buyer with budget ceiling and proof-of-funds reference"
    roles: [BuyerAgent]
    code: 200
    input: [qualified_budget_usd, proof_of_funds_ref]
    output: Buyer
    side_effects: ["qualification_status UNQUALIFIED -> QUALIFIED", "sets qualified_budget_usd, proof_of_funds_ref", "increments Buyer.version by 1"]

  # --- Comparable sales ---
  - method: POST
    path: "/api/comparable-sales"
    description: "Record a market comparable sale"
    roles: [ListingAgent]
    code: 201
    input: [make, model, year, sale_price_usd, sale_date, total_time_hours, "comp_status?"]
    output: ComparableSale
    side_effects: ["comp_status defaults to UNVERIFIED; source_listing_id null"]
  - method: GET
    path: "/api/comparable-sales"
    description: "List comparable sales, optionally filtered (supports limit/offset pagination)"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["make?", "model?", "source_listing_id?", "limit?", "offset?"]
    output: ComparableSale[]
    side_effects: []
  - method: GET
    path: "/api/comparable-sales/{id}"
    description: "Get one comparable sale"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: ComparableSale
    side_effects: []

  # --- Letters of intent ---
  - method: POST
    path: "/api/lois"
    description: "Submit a letter of intent for an ACTIVE listing on behalf of a QUALIFIED buyer"
    roles: [BuyerAgent]
    code: 201
    input: [listing_id, buyer_id, offer_price_usd, deposit_amount_usd, "dual_agency?"]
    output: LOI
    side_effects: ["status=SUBMITTED", "current_price_usd := offer_price_usd", "disclosure_status := PENDING if dual_agency else NOT_REQUIRED"]
  - method: GET
    path: "/api/lois"
    description: "List LOIs with filters (supports limit/offset pagination)"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["listing_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: LOI[]
    side_effects: []
  - method: GET
    path: "/api/lois/{id}"
    description: "Get one LOI"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: LOI
    side_effects: []
  - method: POST
    path: "/api/lois/{id}/counter"
    description: "Counter the in-force price; alternates SUBMITTED <-> COUNTERED; OCC-guarded"
    roles: [ListingAgent, BuyerAgent]
    code: 200
    input: [new_price_usd, expected_loi_version]
    output: LOI
    side_effects: ["current_price_usd := new_price_usd", "status flips SUBMITTED->COUNTERED or COUNTERED->SUBMITTED", "increments LOI.version by 1"]
  - method: POST
    path: "/api/lois/{id}/accept"
    description: "Accept an LOI; opens Transaction + EscrowDeposit and locks the listing"
    roles: [ListingAgent]
    code: 200
    input: []
    output: LOI
    side_effects: ["status -> ACCEPTED", "create Transaction OPENED (agreed_price_usd := current_price_usd)", "create EscrowDeposit AWAITING_FUNDS", "Listing ACTIVE -> UNDER_CONTRACT", "sibling LOIs in {SUBMITTED, COUNTERED} -> REJECTED"]
  - method: POST
    path: "/api/lois/{id}/withdraw"
    description: "Buyer withdraws a pending LOI"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: LOI
    side_effects: ["status -> WITHDRAWN"]
  - method: POST
    path: "/api/lois/{id}/disclosure/ack"
    description: "Record one party's dual-agency disclosure acknowledgment"
    roles: [BrokerPrincipal]
    code: 200
    input: [party]
    output: LOI
    side_effects: ["sets buyer_acked/seller_acked per party input", "disclosure_status PENDING -> PARTIAL -> FULLY_ACKED", "increments LOI.version by 1"]

  # --- Transactions ---
  - method: GET
    path: "/api/transactions"
    description: "List transactions with filters (supports limit/offset pagination)"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["loi_id?", "listing_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []
  - method: GET
    path: "/api/transactions/{id}"
    description: "Get one transaction"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: Transaction
    side_effects: []
  - method: PATCH
    path: "/api/transactions/{id}/delivery-conditions"
    description: "Update delivery-condition checklist (logbooks, registration docs, tax notes); OCC-guarded; any non-terminal state"
    roles: [BrokerPrincipal]
    code: 200
    input: ["logbook_complete?", "registration_docs_complete?", "tax_planning_notes?", expected_transaction_version]
    output: Transaction
    side_effects: ["sets provided condition fields", "increments Transaction.version by 1"]
  - method: POST
    path: "/api/transactions/{id}/accept-as-is"
    description: "Buyer accepts the aircraft with zero findings (INSPECTION_COMPLETE -> DELIVERY_PENDING)"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Transaction
    side_effects: ["status INSPECTION_COMPLETE -> DELIVERY_PENDING", "increments Transaction.version by 1"]
  - method: POST
    path: "/api/transactions/{id}/terminate"
    description: "Terminate an open deal; escrow refunded before DELIVERY_PENDING, forfeited at DELIVERY_PENDING"
    roles: [BrokerPrincipal, ListingAgent]
    code: 200
    input: [reason]
    output: Transaction
    side_effects: ["status -> TERMINATED", "EscrowDeposit FUNDED -> REFUNDED (pre-DELIVERY_PENDING) or FORFEITED (DELIVERY_PENDING)", "Listing UNDER_CONTRACT -> ACTIVE", "increments Transaction.version by 1"]
  - method: POST
    path: "/api/transactions/{id}/close"
    description: "Close the deal: computes commission + settlement, releases escrow, sells listing, records comparable"
    roles: [BrokerPrincipal]
    code: 200
    input: []
    output: Transaction
    side_effects: ["runs commission_settlement then closing_settlement", "status DELIVERY_PENDING -> CLOSED", "EscrowDeposit FUNDED -> RELEASED", "Listing UNDER_CONTRACT -> SOLD", "auto-create VERIFIED ComparableSale from closing", "increments Transaction.version by 1"]

  # --- Escrow deposits ---
  - method: GET
    path: "/api/escrow-deposits"
    description: "List escrow deposits with filters"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["transaction_id?", "limit?", "offset?"]
    output: EscrowDeposit[]
    side_effects: []
  - method: GET
    path: "/api/escrow-deposits/{id}"
    description: "Get one escrow deposit"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: EscrowDeposit
    side_effects: []
  - method: POST
    path: "/api/escrow-deposits/{id}/fund"
    description: "Record receipt of the deposit wire"
    roles: [EscrowOfficer]
    code: 200
    input: [funding_reference]
    output: EscrowDeposit
    side_effects: ["status AWAITING_FUNDS -> FUNDED", "Transaction OPENED -> ESCROW_FUNDED", "increments EscrowDeposit.version by 1"]

  # --- Inspection bookings ---
  - method: POST
    path: "/api/inspection-bookings"
    description: "Book an inspection slot for a funded transaction at a facility"
    roles: [FacilityScheduler]
    code: 201
    input: [transaction_id, facility_id, start_at, end_at]
    output: InspectionBooking
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/api/inspection-bookings"
    description: "List inspection bookings with filters"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["transaction_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: InspectionBooking[]
    side_effects: []
  - method: GET
    path: "/api/inspection-bookings/{id}"
    description: "Get one inspection booking"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: InspectionBooking
    side_effects: []
  - method: POST
    path: "/api/inspection-bookings/{id}/confirm"
    description: "Facility confirms a requested slot"
    roles: [FacilityScheduler]
    code: 200
    input: []
    output: InspectionBooking
    side_effects: ["status REQUESTED -> CONFIRMED", "Transaction ESCROW_FUNDED -> INSPECTION_SCHEDULED when applicable"]
  - method: POST
    path: "/api/inspection-bookings/{id}/complete"
    description: "Facility marks the inspection done"
    roles: [FacilityScheduler]
    code: 200
    input: []
    output: InspectionBooking
    side_effects: ["status CONFIRMED -> COMPLETED", "Transaction INSPECTION_SCHEDULED -> INSPECTION_COMPLETE when no other active bookings remain"]
  - method: POST
    path: "/api/inspection-bookings/{id}/cancel"
    description: "Cancel a requested/confirmed slot"
    roles: [FacilityScheduler]
    code: 200
    input: []
    output: InspectionBooking
    side_effects: ["status -> CANCELLED", "Transaction INSPECTION_SCHEDULED -> ESCROW_FUNDED revert when no other active bookings remain"]

  # --- Discrepancy items ---
  - method: POST
    path: "/api/transactions/{id}/discrepancy-items"
    description: "Raise a pre-buy inspection finding on a transaction"
    roles: [FacilityScheduler]
    code: 201
    input: [inspection_booking_id, description, severity, estimated_cost_usd]
    output: DiscrepancyItem
    side_effects: ["status=RAISED", "first item moves Transaction INSPECTION_COMPLETE -> DISCREPANCY_NEGOTIATION"]
  - method: GET
    path: "/api/discrepancy-items"
    description: "List discrepancy items with filters"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: ["transaction_id?", "inspection_booking_id?", "status?", "limit?", "offset?"]
    output: DiscrepancyItem[]
    side_effects: []
  - method: GET
    path: "/api/discrepancy-items/{id}"
    description: "Get one discrepancy item"
    roles: [BrokerPrincipal, ListingAgent, BuyerAgent, EscrowOfficer, FacilityScheduler]
    code: 200
    input: []
    output: DiscrepancyItem
    side_effects: []
  - method: POST
    path: "/api/discrepancy-items/{id}/counter"
    description: "Seller counters a raised finding, optionally proposing a price credit"
    roles: [ListingAgent]
    code: 200
    input: ["proposed_credit_usd?", "repair_offer_note?"]
    output: DiscrepancyItem
    side_effects: ["status RAISED -> COUNTERED", "proposed_credit_usd set when provided"]
  - method: POST
    path: "/api/discrepancy-items/{id}/commit-repair"
    description: "Seller commits to repair the finding before delivery"
    roles: [ListingAgent]
    code: 200
    input: []
    output: DiscrepancyItem
    side_effects: ["status -> RESOLVED, resolution=REPAIR", "credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]
  - method: POST
    path: "/api/discrepancy-items/{id}/agree-credit"
    description: "Buyer accepts the seller's proposed price credit"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: DiscrepancyItem
    side_effects: ["status -> RESOLVED, resolution=CREDIT, credit_amount_usd := proposed_credit_usd", "credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]
  - method: POST
    path: "/api/discrepancy-items/{id}/waive"
    description: "Buyer waives a non-airworthiness finding"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: DiscrepancyItem
    side_effects: ["status -> RESOLVED, resolution=WAIVED", "credits_total_usd recomputed", "bubble-up to DELIVERY_PENDING when all items RESOLVED"]

# =============================================================================
# Table 6: Error Code Catalog (30 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "authenticated role not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "required body field missing, wrong type, or enum value out of range" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listing id does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyer id does not exist" }
  - { id: ERR_COMPARABLE_SALE_NOT_FOUND, http: 404, condition: "comparable sale id does not exist" }
  - { id: ERR_LOI_NOT_FOUND, http: 404, condition: "LOI id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "transaction id does not exist" }
  - { id: ERR_ESCROW_DEPOSIT_NOT_FOUND, http: 404, condition: "escrow deposit id does not exist" }
  - { id: ERR_INSPECTION_FACILITY_NOT_FOUND, http: 404, condition: "inspection facility id does not exist" }
  - { id: ERR_INSPECTION_BOOKING_NOT_FOUND, http: 404, condition: "inspection booking id does not exist" }
  - { id: ERR_DISCREPANCY_ITEM_NOT_FOUND, http: 404, condition: "discrepancy item id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a state that permits the requested transition" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "LOI create/accept while listing is not ACTIVE" }
  - { id: ERR_VALUATION_REQUIRED, http: 409, condition: "listing activation attempted without a FINAL-variant valuation" }
  - { id: ERR_TRANSACTION_NOT_FUNDED, http: 409, condition: "inspection booking attempted while transaction is not ESCROW_FUNDED" }
  - { id: ERR_OPEN_DISCREPANCIES, http: 409, condition: "accept-as-is attempted while discrepancy items exist for the transaction" }
  - { id: ERR_ALREADY_ACKNOWLEDGED, http: 409, condition: "same party acknowledged a dual-agency disclosure twice (or disclosure not required)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_AIRWORTHINESS_NOT_WAIVABLE, http: 422, condition: "waive attempted on an AIRWORTHINESS-severity discrepancy item" }
  - { id: ERR_FACILITY_SLOT_CONFLICT, http: 409, condition: "booking window, expanded by the facility turnaround buffer, intersects another REQUESTED/CONFIRMED booking at the same facility" }
  - { id: ERR_AIRCRAFT_SLOT_CONFLICT, http: 409, condition: "booking window strictly overlaps another REQUESTED/CONFIRMED booking for the same aircraft (half-open semantics, adjacency allowed)" }
  - { id: ERR_BOOKING_WINDOW_INVALID, http: 422, condition: "booking end_at is not strictly after start_at" }
  - { id: ERR_BOOKING_NOT_FOR_TRANSACTION, http: 422, condition: "discrepancy's inspection_booking_id references a booking of a different transaction" }
  - { id: ERR_DUAL_AGENCY_DISCLOSURE_PENDING, http: 409, condition: "accept attempted on a dual-agency LOI whose disclosure is not FULLY_ACKED" }
  - { id: ERR_INSUFFICIENT_COMPARABLES, http: 422, condition: "fewer than 3 VERIFIED comparable sales exactly match the listing make and model" }
  - { id: ERR_CREDIT_NOT_PROPOSED, http: 409, condition: "agree-credit attempted on a COUNTERED item with no proposed_credit_usd" }
  - { id: ERR_BUYER_NOT_QUALIFIED, http: 422, condition: "LOI submitted for a buyer whose qualification_status is UNQUALIFIED" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "offer_price_usd exceeds the buyer's qualified_budget_usd" }
  - { id: ERR_DEPOSIT_BELOW_MINIMUM, http: 422, condition: "deposit_amount_usd below 5% of offer_price_usd" }
  - { id: ERR_DELIVERY_CONDITIONS_INCOMPLETE, http: 409, condition: "close attempted while logbook_complete or registration_docs_complete is false" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: BrokerPrincipal
    description: "Brokerage office principal; owns facilities, dual-agency disclosure acknowledgments, delivery-condition checklist, and closing"
    identity: opaque
    exclusive_operations:
      - "POST /api/inspection-facilities"
      - "POST /api/lois/{id}/disclosure/ack"
      - "PATCH /api/transactions/{id}/delivery-conditions"
      - "POST /api/transactions/{id}/close"
    shared_operations: ["all GET endpoints", "POST /api/transactions/{id}/terminate"]
  - name: ListingAgent
    description: "Broker's sell-side agent; owns listings, valuations, comparables, LOI acceptance, seller-side discrepancy responses"
    identity: opaque
    exclusive_operations:
      - "POST /api/listings"
      - "POST /api/listings/{id}/valuation"
      - "POST /api/listings/{id}/activate"
      - "POST /api/comparable-sales"
      - "POST /api/lois/{id}/accept"
      - "POST /api/discrepancy-items/{id}/counter"
      - "POST /api/discrepancy-items/{id}/commit-repair"
    shared_operations: ["all GET endpoints", "POST /api/lois/{id}/counter", "POST /api/transactions/{id}/terminate"]
  - name: BuyerAgent
    description: "Broker's buy-side agent; owns buyer registration/qualification, LOI submission/withdrawal, buyer-side discrepancy resolutions, as-is acceptance"
    identity: opaque
    exclusive_operations:
      - "POST /api/buyers"
      - "POST /api/buyers/{id}/qualify"
      - "POST /api/lois"
      - "POST /api/lois/{id}/withdraw"
      - "POST /api/transactions/{id}/accept-as-is"
      - "POST /api/discrepancy-items/{id}/agree-credit"
      - "POST /api/discrepancy-items/{id}/waive"
    shared_operations: ["all GET endpoints", "POST /api/lois/{id}/counter"]
  - name: EscrowOfficer
    description: "Escrow company officer; records deposit funding"
    identity: opaque
    exclusive_operations:
      - "POST /api/escrow-deposits/{id}/fund"
    shared_operations: ["all GET endpoints"]
  - name: FacilityScheduler
    description: "Inspection facility scheduler; owns booking lifecycle and raising inspection findings"
    identity: opaque
    exclusive_operations:
      - "POST /api/inspection-bookings"
      - "POST /api/inspection-bookings/{id}/confirm"
      - "POST /api/inspection-bookings/{id}/complete"
      - "POST /api/inspection-bookings/{id}/cancel"
      - "POST /api/transactions/{id}/discrepancy-items"
    shared_operations: ["all GET endpoints"]
