            - "${e_stale} == ERR_STALE_MENU_ITEM_VERSION (412), and it is 412 rather than a 409 state error: the item is ACTIVE and perfectly eligible for a promotion"
            - "${mi_lto_after_fail} == 0 == ${mi_lto0} and ${mi_v_after_fail} == ${mi_v2} — the rejected create incremented no counter"
            - "the same request with ${mi_v2} succeeds: ${lto_a_status} == PLANNED and ${lto_a_region} == MW copied from the item, with ${mi_lto1} == 1 and ${mi_v3} == ${mi_v2} + 1"
            - "${e_stale2} == ERR_STALE_MENU_ITEM_VERSION (412) — a second campaign on a DISJOINT window is legitimate business behaviour, so only the version rejects it; the first campaign's own counter bump is what invalidated the client's read"
            - "${lto_b} is minted with ${mi_lto2} == 2 once ${mi_v3} is supplied — two campaigns coexist, confirming the 412 was never a duplicate-campaign rule in disguise"

      - name: the_open_spec_change_counter_reconciles_across_create_reject_and_approve
