      - name: scrap_pickup_twice_returns_ticket_not_open
        claim_type: terminal_lockdown
        grounds: [state_machines.ScrapTicket.OPEN_to_PICKED_UP, "errors[ERR_TICKET_NOT_OPEN]"]
        distinguishing_aspect: "A second pick-up on an already PICKED_UP ticket fails ERR_TICKET_NOT_OPEN; the payout is not double-counted in the monthly statement."
        test_recipe:
          setup: ["scrapped bike with PICKED_UP ticket (2.0kg STEEL -> 30 cents)"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D PT", donor_type: "INDIVIDUAL", email: "dpt@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-PT", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
