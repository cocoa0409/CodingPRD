# =============================================================================
# Task 2193 — Chargemaster Maintenance & Pricing Governance
# Hospital revenue integrity: item creation with code/revenue-code mapping,
# annual CPT/HCPCS code update implementation, price methodology & markup rules,
# department request & approval workflow, duplicate/inactive cleanup, charge
# capture reconciliation & missing-charge detection, payer contract impact
# analysis of price change, transparency file generation.
# Sections §1.0–§1.7 only. §1.8 / §1.9 live in sibling files.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2193. Chargemaster Maintenance & Pricing Governance (hospital revenue integrity):
  item creation with code/revenue-code mapping, annual code update (CPT/HCPCS)
  implementation, price setting methodology & markup rules, department request &
  approval workflow, duplicate/inactive item cleanup, charge capture reconciliation
  & missing-charge detection, payer contract impact analysis of price change,
  transparency file generation

domain_name: chargemaster-governance
api_prefix: /chargemaster

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency          # OCC on Facility.version and ChargeItem.version
    - cascading_side_effects          # code-cycle activation and rule supersession cascades
    - dual_variant_calculation        # payer impact (2 variants) + duplicate detection (2 variants)
    - version_pinning_on_approval     # ChangeRequest pins ChargeItem.version at APPROVE

  entity_topology: hybrid
  # Facility is the governance root (posture gate + OCC parent); ChargeItem is a
  # flat hub referenced by peers (ChangeRequest, CodeUpdateEntry, CapturedCharge)
  # and self-referential via duplicate_of_item_id.

  state_machine_shape: parallel
  # ChargeItem carries two independent state dimensions (lifecycle_status ×
  # price_status); ChangeRequest is cyclic (revision rounds); CodeUpdateCycle is
  # branching with a compensating rollback; Facility.chargemaster_posture is a
  # derived aggregate that gates child operations.

  relationship_patterns:
    - one_to_many          # Facility -> Department / ChargeItem / PayerContract / TransparencyFile
    - self_referential     # ChargeItem.duplicate_of_item_id, ChargeItem.companion_required_item_id
    - cross_aggregate      # CodeUpdateEntry -> ChargeItem, CapturedCharge -> ChargeItem
    - polymorphic          # ChangeRequest.request_type drives which target fields are read

  role_model: segregation_of_duties
  # Submitter (DepartmentManager) != reviewer (RevenueIntegrityAnalyst) !=
  # approver (PricingCommitteeApprover); ComplianceOfficer owns publication and
  # rollback; ContractManager owns payer terms; SystemAdmin owns configuration.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Hospital facility name" }
      - { name: cms_certification_number, type: string, source: input, description: "CMS CCN, unique across facilities" }
      - { name: rounding_mode, type: enum, source: input, default: NEAREST_DOLLAR, description: "NEAREST_CENT | NEAREST_DOLLAR | PSYCHOLOGICAL_99 — final rounding step of gross_charge_from_price_rule" }
      - { name: aggregate_markup_limit_bp, type: integer, source: input, default: 40000, description: "Facility-wide cap on aggregate_markup_ratio_bp used by markup_compliance_ratio (40000 = 4.00x)" }
      - { name: volume_growth_bp, type: integer, source: input, default: 10500, description: "Projected annual volume growth factor in basis points used only by payer_impact_delta variant FORWARD_PROJECTED (10500 = 1.05x)" }
      - { name: impact_lookback_days, type: integer, source: input, default: 90, description: "Lookback window length in days used only by payer_impact_delta variant HISTORICAL_REPLAY" }
      - { name: duplicate_detection_mode, type: enum, source: input, default: STRICT_CODE, description: "STRICT_CODE | FUZZY_DESCRIPTION — selects the duplicate_similarity_score variant applied by POST /charge-items/{id}/lifecycle action MARK_DUPLICATE" }
      - { name: chargemaster_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived gate over all child write operations; see state_machines[Facility].derivation" }
      - { name: active_item_count, type: integer, source: computed, description: "Count of ChargeItem for this facility with lifecycle_status == ACTIVE" }
      - { name: aggregate_gross_charge_cents, type: integer, source: computed, description: "Sum of gross_charge_cents over ChargeItem for this facility with lifecycle_status == ACTIVE" }
      - { name: aggregate_cost_basis_cents, type: integer, source: computed, description: "Sum of cost_basis_cents over ChargeItem for this facility with lifecycle_status == ACTIVE" }
      - { name: aggregate_markup_ratio_bp, type: integer, source: computed, description: "round_half_up(aggregate_gross_charge_cents * 10000 / aggregate_cost_basis_cents); 0 when aggregate_cost_basis_cents == 0" }
      - { name: stale_price_item_count, type: integer, source: computed, description: "Count of ChargeItem for this facility with lifecycle_status == ACTIVE AND price_status == PRICE_STALE" }
      - { name: published_transparency_file_id, type: string, source: computed, description: "Id of the single TransparencyFile for this facility with status == PUBLISHED, or null" }
      - { name: transparency_status, type: enum, source: computed, default: NEEDS_REFRESH, description: "CURRENT | NEEDS_REFRESH — CURRENT only while published_transparency_file_id is non-null and no ACTIVE ChargeItem has been mutated since that file was published" }

  - name: Department
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: name, type: string, source: input, description: "Department name (e.g. Cardiac Cath Lab)" }
      - { name: cost_center_code, type: string, source: input, description: "Cost center code, unique within facility_id" }
      - { name: allowed_revenue_code_values, type: array, source: input, description: "Array of 4-digit UB-04 revenue code strings this department may map items to; empty array means unrestricted" }
      - { name: manager_user_id, type: string, source: input, description: "Opaque user id of the DepartmentManager entitled to act for this department (compared against X-User-ID)" }
      - { name: capture_hold, type: boolean, source: computed, default: false, description: "true once unresolved_finding_amount_cents >= 500000; blocks POST /charge-capture-batches for this department" }
      - { name: unresolved_finding_amount_cents, type: integer, source: computed, description: "Sum of estimated_lost_charge_cents over MissingChargeFinding for this department with status == CONFIRMED" }
      - { name: recovered_charge_cents, type: integer, source: computed, description: "Sum of estimated_lost_charge_cents over MissingChargeFinding for this department with status == RESOLVED" }
      - { name: open_request_count, type: integer, source: computed, description: "Count of ChangeRequest for this department with status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED}" }

  - name: RevenueCode
    parent: null
    common_fields: false         # id, created_at only — national reference data
    fields:
      - { name: code, type: string, source: input, description: "4-digit UB-04 revenue code, globally unique (e.g. '0300')" }
      - { name: description, type: string, source: input, description: "Revenue code description" }
      - { name: requires_hcpcs, type: boolean, source: input, description: "When true, a ChargeItem mapped to this revenue code MUST carry code_type IN {CPT, HCPCS} and a non-null code_value" }
      - { name: allowed_code_types, type: array, source: input, description: "Subset of {CPT, HCPCS, REV_ONLY, CDM_INTERNAL} permitted for items mapped to this revenue code" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED revenue codes cannot receive newly ACTIVE items" }
      - { name: pricing_class, type: enum, source: input, description: "SUPPLY | PHARMACY | PROCEDURE | ROOM_AND_BOARD — scope key component for PriceRule selection" }

  - name: ChargeItem
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department" }
      - { name: revenue_code_id, type: string, source: input, description: "FK -> RevenueCode.id; UB-04 revenue code mapping" }
      - { name: duplicate_of_item_id, type: string, source: system, description: "FK -> ChargeItem.id; set when this item is retired as a duplicate of the surviving item (self-referential); null otherwise" }
      - { name: companion_required_item_id, type: string, source: input, description: "FK -> ChargeItem.id; companion item that MUST also be captured within companion_window_hours; null when no pairing applies" }
      - { name: companion_window_hours, type: integer, source: input, default: 24, description: "Inclusive hour window for companion capture; a companion captured exactly companion_window_hours after the trigger line counts as present" }
      - { name: cdm_number, type: string, source: input, description: "Internal chargemaster number, unique within facility_id" }
      - { name: description, type: string, source: input, description: "Item description (also tokenized by duplicate_similarity_score)" }
      - { name: code_type, type: enum, source: input, description: "CPT | HCPCS | REV_ONLY | CDM_INTERNAL" }
      - { name: code_value, type: string, source: input, description: "CPT/HCPCS code string; null only when code_type IN {REV_ONLY, CDM_INTERNAL}" }
      - { name: cost_basis_cents, type: integer, source: input, description: "Acquisition/fully-loaded cost in cents; tier selector input of gross_charge_from_price_rule" }
      - { name: medicare_rate_cents, type: integer, source: input, description: "Medicare allowable in cents; floor input of gross_charge_from_price_rule" }
      - { name: market_p75_cents, type: integer, source: input, description: "75th-percentile market charge in cents; cap input of gross_charge_from_price_rule" }
      - { name: gross_charge_cents, type: integer, source: computed, default: 0, description: "Published gross charge; output of gross_charge_from_price_rule, 0 while lifecycle_status == DRAFT and never repriced" }
      - { name: prior_gross_charge_cents, type: integer, source: computed, default: 0, description: "gross_charge_cents value immediately before the most recent reprice or code-cycle carry; input of payer_impact_delta" }
      - { name: applied_price_rule_id, type: string, source: computed, description: "FK -> PriceRule.id; rule selected by the last successful reprice; null before first reprice" }
      - { name: price_conflict, type: boolean, source: computed, default: false, description: "true when the Medicare floor exceeded the market cap during the last reprice (cap won)" }
      - { name: lifecycle_status, type: enum, source: system, default: DRAFT, description: "Dimension 1 — DRAFT | PENDING_REVIEW | APPROVED | ACTIVE | INACTIVE | ARCHIVED" }
      - { name: price_status, type: enum, source: system, default: PRICE_STALE, description: "Dimension 2 (independent of lifecycle_status) — PRICED_CURRENT | PRICE_STALE | REPRICE_PENDING | PRICE_FROZEN" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC date-time from which the item may be billed; MUST be >= logical now at creation, and ACTIVATE requires effective_from <= logical now" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque user id that performed the ACTIVATE approval; null while never approved" }
      - { name: last_code_cycle_id, type: string, source: system, description: "FK -> CodeUpdateCycle.id; cycle whose activation last rewrote code_value; null when never touched by a cycle" }

  - name: PriceRule
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: revenue_code_id, type: string, source: input, description: "FK -> RevenueCode.id; scope key component — rule applies only to items mapped to this revenue code" }
      - { name: pricing_method, type: enum, source: input, description: "COST_PLUS_MARKUP | MEDICARE_MULTIPLE | FLAT_FEE" }
      - { name: markup_tiers, type: array, source: input, description: "Ordered array of objects { min_cost_basis_cents, markup_bp }; sorted ascending by min_cost_basis_cents; first tier MUST have min_cost_basis_cents == 0" }
      - { name: min_medicare_multiple_bp, type: integer, source: input, default: 12000, description: "Medicare floor multiple in basis points (12000 = 1.20x medicare_rate_cents)" }
      - { name: market_cap_multiple_bp, type: integer, source: input, default: 11000, description: "Market cap multiple in basis points applied to market_p75_cents" }
      - { name: flat_fee_cents, type: integer, source: input, description: "Charge used verbatim when pricing_method == FLAT_FEE; null otherwise" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC; inclusive start of the half-open effective interval" }
      - { name: effective_to, type: datetime, source: input, description: "ISO 8601 UTC; EXCLUSIVE end of the half-open effective interval; null means open-ended" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | RETIRED" }
      - { name: superseded_by_rule_id, type: string, source: system, description: "FK -> PriceRule.id; rule that superseded this one (self-referential); null while ACTIVE or RETIRED" }
      - { name: applied_item_count, type: integer, source: computed, description: "Count of ChargeItem whose applied_price_rule_id == this rule id" }

  - name: ChangeRequest
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; requesting department" }
      - { name: charge_item_id, type: string, source: input, description: "FK -> ChargeItem.id; target item (always an existing item; NEW_ITEM requests target the DRAFT item just created)" }
      - { name: request_type, type: enum, source: input, description: "NEW_ITEM | PRICE_CHANGE | REVENUE_CODE_REMAP | DEACTIVATION — determines which proposed_* fields are read on implement" }
      - { name: proposed_cost_basis_cents, type: integer, source: input, description: "New cost_basis_cents; read only when request_type IN {NEW_ITEM, PRICE_CHANGE}" }
      - { name: proposed_revenue_code_id, type: string, source: input, description: "FK -> RevenueCode.id; read only when request_type == REVENUE_CODE_REMAP" }
      - { name: proposed_description, type: string, source: input, description: "New description; read only when request_type IN {NEW_ITEM, PRICE_CHANGE}; null leaves description unchanged" }
      - { name: justification, type: string, source: input, description: "Free-text business justification, min length 10" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | IMPLEMENTED | REJECTED | WITHDRAWN | VOIDED_STALE" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments by 1 on every CHANGES_REQUESTED -> SUBMITTED resubmit; resubmit is rejected once revision_round >= 3" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the DepartmentManager that created the request" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the RevenueIntegrityAnalyst that moved it to UNDER_REVIEW; null before review" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the PricingCommitteeApprover that approved it; MUST differ from submitted_by_user_id and reviewed_by_user_id" }
      - { name: pinned_charge_item_version, type: integer, source: system, description: "ChargeItem.version observed at APPROVE; implement requires the live item version to still equal this value" }
      - { name: projected_gross_charge_cents, type: integer, source: computed, description: "Dry-run output of gross_charge_from_price_rule over the proposed_* inputs, refreshed on create and on every resubmit" }
      - { name: projected_markup_ratio_bp, type: integer, source: computed, description: "Output of markup_compliance_ratio for this request; compared against Facility.aggregate_markup_limit_bp at APPROVE" }
      - { name: decision_note, type: string, source: input, description: "Reviewer/approver note recorded on the latest decision; null before the first decision" }

  - name: CodeUpdateCycle
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: cycle_year, type: integer, source: input, description: "Effective year of the annual code update; unique per (facility_id, code_set)" }
      - { name: code_set, type: enum, source: input, description: "CPT | HCPCS" }
      - { name: cost_inflator_bp, type: integer, source: input, default: 10300, description: "Cost inflator in basis points applied by code_update_crosswalk_price_carry when the revenue code changes (10300 = 1.03x)" }
      - { name: status, type: enum, source: system, default: LOADED, description: "LOADED | MAPPING | CROSSWALK_APPROVED | ACTIVATED | ROLLED_BACK | CANCELLED" }
      - { name: entry_count, type: integer, source: computed, description: "Count of CodeUpdateEntry with this cycle_id" }
      - { name: unmapped_entry_count, type: integer, source: computed, description: "Count of CodeUpdateEntry with this cycle_id and status == PENDING" }
      - { name: applied_entry_count, type: integer, source: computed, description: "Count of CodeUpdateEntry with this cycle_id and status == APPLIED" }
      - { name: pre_activation_active_item_count, type: integer, source: system, description: "Snapshot of Facility.active_item_count taken immediately before ACTIVATE mutates anything; null until ACTIVATE" }
      - { name: pre_activation_aggregate_gross_charge_cents, type: integer, source: system, description: "Snapshot of Facility.aggregate_gross_charge_cents taken immediately before ACTIVATE mutates anything; null until ACTIVATE" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock value when ACTIVATE succeeded; null otherwise" }
      - { name: rolled_back_at, type: datetime, source: system, description: "Logical clock value when ROLL_BACK succeeded; null otherwise" }

  - name: CodeUpdateEntry
    parent: CodeUpdateCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> CodeUpdateCycle.id; owning cycle" }
      - { name: action, type: enum, source: input, description: "ADD | DELETE | REVISE | CROSSWALK" }
      - { name: old_code_value, type: string, source: input, description: "Retiring code string; null when action == ADD" }
      - { name: new_code_value, type: string, source: input, description: "Replacement code string; null when action == DELETE" }
      - { name: target_charge_item_id, type: string, source: system, description: "FK -> ChargeItem.id; item resolved at MAP time by matching old_code_value; null for ADD and for DEFERRED entries" }
      - { name: new_revenue_code_id, type: string, source: input, description: "FK -> RevenueCode.id; remapped revenue code; null when the revenue code is unchanged" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | MAPPED | DEFERRED | APPLIED | REVERTED" }
      - { name: carried_gross_charge_cents, type: integer, source: computed, description: "Output of code_update_crosswalk_price_carry, computed at MAP; null while PENDING or DEFERRED" }
      - { name: prior_code_value, type: string, source: system, description: "ChargeItem.code_value snapshot captured at APPLY, used verbatim by ROLL_BACK; null until APPLIED" }
      - { name: prior_gross_charge_cents, type: integer, source: system, description: "ChargeItem.gross_charge_cents snapshot captured at APPLY, used verbatim by ROLL_BACK; null until APPLIED" }
      - { name: prior_revenue_code_id, type: string, source: system, description: "FK -> RevenueCode.id; ChargeItem.revenue_code_id snapshot captured at APPLY, restored by ROLL_BACK; null until APPLIED" }
      - { name: prior_lifecycle_status, type: enum, source: system, description: "ChargeItem.lifecycle_status snapshot captured at APPLY, restored by ROLL_BACK; null until APPLIED" }
      - { name: defer_reason, type: string, source: input, description: "Reason recorded when the entry is deferred; null unless status == DEFERRED" }
      - { name: mapped_by_user_id, type: string, source: system, description: "X-User-ID of the RevenueIntegrityAnalyst that mapped or deferred the entry; null while PENDING" }

  - name: PayerContract
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: payer_code, type: string, source: input, description: "Payer identifier (e.g. 'BCBS_STATE'); scope key component" }
      - { name: product_line, type: enum, source: input, description: "COMMERCIAL | MEDICARE_ADVANTAGE | MEDICAID_MCO — scope key component" }
      - { name: reimbursement_method, type: enum, source: input, description: "PERCENT_OF_CHARGE | LESSER_OF_FEE_SCHEDULE | CASE_RATE" }
      - { name: percent_of_charge_bp, type: integer, source: input, description: "Percent of gross charge in basis points; required unless reimbursement_method == CASE_RATE" }
      - { name: fee_schedule_cents, type: integer, source: input, description: "Per-unit fee schedule amount; required when reimbursement_method == LESSER_OF_FEE_SCHEDULE, else null" }
      - { name: case_rate_cents, type: integer, source: input, description: "Charge-independent per-unit case rate; required when reimbursement_method == CASE_RATE, else null" }
      - { name: term_start_date, type: datetime, source: input, description: "ISO 8601 UTC; INCLUSIVE start of the closed term interval" }
      - { name: term_end_date, type: datetime, source: input, description: "ISO 8601 UTC; INCLUSIVE end of the closed term interval; never null" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | TERMINATED" }
      - { name: trailing_units, type: integer, source: input, default: 0, description: "Trailing-period utilization units for this payer, used only by payer_impact_delta variant FORWARD_PROJECTED" }
      - { name: renegotiation_notice_days, type: integer, source: input, default: 30, description: "Required clear gap in days between this term's end and the next term's start for the same scope key" }

  - name: ChargeCaptureBatch
    parent: Department
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; submitting department" }
      - { name: window_start_date, type: datetime, source: input, description: "ISO 8601 UTC; INCLUSIVE first service date covered by the batch" }
      - { name: window_end_date, type: datetime, source: input, description: "ISO 8601 UTC; INCLUSIVE last service date covered by the batch" }
      - { name: status, type: enum, source: system, default: INGESTED, description: "INGESTED | RECONCILING | RECONCILED | DISPUTED | CLOSED" }
      - { name: line_count, type: integer, source: computed, description: "Count of CapturedCharge with this batch_id" }
      - { name: matched_line_count, type: integer, source: computed, description: "Count of CapturedCharge with this batch_id and match_status == MATCHED" }
      - { name: exception_line_count, type: integer, source: computed, description: "Count of CapturedCharge with this batch_id and match_status IN {PRICE_VARIANCE, UNKNOWN_CODE, INACTIVE_ITEM, DUPLICATE_LINE}" }
      - { name: mean_line_variance_bp, type: integer, source: computed, description: "Output of charge_capture_variance_summary; round-per-line-then-average, null until first reconcile" }
      - { name: total_expected_charge_cents, type: integer, source: computed, description: "Sum over CapturedCharge of expected_charge_cents for lines with match_status != UNKNOWN_CODE" }
      - { name: total_posted_charge_cents, type: integer, source: computed, description: "Sum over CapturedCharge of posted_charge_cents for all lines in the batch" }
      - { name: open_finding_count, type: integer, source: computed, description: "Count of MissingChargeFinding with this batch_id and status == OPEN" }
      - { name: reconcile_pass_count, type: integer, source: system, default: 0, description: "Increments by 1 on every INGESTED->RECONCILING and DISPUTED->RECONCILING transition" }

  - name: CapturedCharge
    parent: ChargeCaptureBatch
    common_fields: false         # id, created_at only — append-only capture line
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ChargeCaptureBatch.id; owning batch" }
      - { name: charge_item_id, type: string, source: system, description: "FK -> ChargeItem.id; resolved from submitted_cdm_number within the batch facility; null when unresolvable" }
      - { name: submitted_cdm_number, type: string, source: input, description: "CDM number as posted by the ancillary system" }
      - { name: encounter_id, type: string, source: input, description: "Patient encounter identifier; companion pairing is evaluated within one encounter_id" }
      - { name: payer_code, type: string, source: input, description: "Payer on the encounter; joined to PayerContract.payer_code by payer_impact_delta variant HISTORICAL_REPLAY" }
      - { name: service_datetime, type: datetime, source: input, description: "ISO 8601 UTC service date-time; MUST fall inside the batch closed window" }
      - { name: quantity, type: integer, source: input, description: "Units posted; MUST be >= 1" }
      - { name: posted_charge_cents, type: integer, source: input, description: "Charge actually posted by the source system" }
      - { name: expected_charge_cents, type: integer, source: computed, description: "charge_item.gross_charge_cents * quantity; null when charge_item_id is null" }
      - { name: match_status, type: enum, source: computed, default: UNRECONCILED, description: "UNRECONCILED | MATCHED | PRICE_VARIANCE | UNKNOWN_CODE | INACTIVE_ITEM | DUPLICATE_LINE" }
      - { name: line_variance_bp, type: integer, source: computed, description: "round_half_up((posted - expected) * 10000 / expected) per line; null when expected_charge_cents is null or 0" }

  - name: MissingChargeFinding
    parent: ChargeCaptureBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ChargeCaptureBatch.id; batch whose reconcile pass produced the finding" }
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; copied from the batch at creation" }
      - { name: trigger_captured_charge_id, type: string, source: system, description: "FK -> CapturedCharge.id; the captured line whose companion is missing" }
      - { name: expected_charge_item_id, type: string, source: system, description: "FK -> ChargeItem.id; the companion item that should have been captured" }
      - { name: estimated_lost_charge_cents, type: integer, source: computed, description: "expected_charge_item.gross_charge_cents * trigger line quantity, evaluated at finding creation and frozen thereafter" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CONFIRMED | DISMISSED | RESOLVED" }
      - { name: disposition_note, type: string, source: input, description: "Note recorded on confirm/dismiss/resolve; null while OPEN" }
      - { name: recovery_captured_charge_id, type: string, source: input, description: "FK -> CapturedCharge.id; the late-posted companion line supplied at RESOLVE; null otherwise" }

  - name: PriceChangeImpactAnalysis
    parent: ChangeRequest
    common_fields: true
    fields:
      - { name: change_request_id, type: string, source: input, description: "FK -> ChangeRequest.id; the price change being analysed" }
      - { name: variant, type: enum, source: input, description: "FORWARD_PROJECTED | HISTORICAL_REPLAY — selects the payer_impact_delta algorithm" }
      - { name: analysed_charge_item_version, type: integer, source: system, description: "ChargeItem.version observed when the analysis was computed" }
      - { name: old_gross_charge_cents, type: integer, source: system, description: "ChargeItem.gross_charge_cents at computation time" }
      - { name: new_gross_charge_cents, type: integer, source: system, description: "ChangeRequest.projected_gross_charge_cents at computation time" }
      - { name: payer_lines, type: array, source: computed, description: "Array of objects { payer_code, product_line, units, old_reimbursement_cents, new_reimbursement_cents, delta_cents } ordered by payer_code ASC then product_line ASC" }
      - { name: total_reimbursement_delta_cents, type: integer, source: computed, description: "Sum of payer_lines[].delta_cents (per-line rounded, then summed)" }
      - { name: status, type: enum, source: system, default: COMPUTED, description: "COMPUTED | SIGNED_OFF | STALE" }
      - { name: signed_off_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer that signed off; null unless SIGNED_OFF" }

  - name: TransparencyFile
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: file_format, type: enum, source: input, description: "CSV | JSON — machine-readable transparency file format" }
      - { name: as_of_datetime, type: datetime, source: system, description: "Logical clock value at build time; inclusion set is evaluated at this instant" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | VALIDATED | PUBLISHED | FAILED | SUPERSEDED" }
      - { name: included_item_count, type: integer, source: computed, description: "Count of items in the inclusion set of transparency_file_build" }
      - { name: total_gross_charge_cents, type: integer, source: computed, description: "Sum of gross_charge_cents over the inclusion set" }
      - { name: payer_column_count, type: integer, source: computed, description: "Count of distinct (payer_code, product_line) pairs among PayerContract rows with status == ACTIVE whose closed term interval contains as_of_datetime" }
      - { name: content_hash, type: string, source: computed, description: "Deterministic digest over the ordered inclusion set; recomputed on every build" }
      - { name: validation_errors, type: array, source: computed, description: "Array of strings; non-empty forces BUILDING -> FAILED at VALIDATE" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock value when PUBLISH succeeded; null otherwise" }
      - { name: superseded_by_file_id, type: string, source: system, description: "FK -> TransparencyFile.id; file whose publication or whose upstream item mutation superseded this one (self-referential); null when the supersession was caused by an upstream ChargeItem mutation rather than by a newer published file" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Facility.chargemaster_posture — derived aggregate gate (recomputed at the end
  # of every mutation that touches a child of the facility).
  # ---------------------------------------------------------------------------
  - entity: Facility
    field: chargemaster_posture
    derivation: |
      Evaluate in this exact precedence order and stop at the first match:
        1) FROZEN     when at least one TransparencyFile with facility_id == this facility
                      has status IN {BUILDING, VALIDATED}.
        2) RESTRICTED when at least one CodeUpdateCycle with facility_id == this facility
                      has status IN {MAPPING, CROSSWALK_APPROVED}.
        3) RESTRICTED when stale_price_item_count >= 5 (>= , not >).
        4) OPEN       otherwise.
      Gate semantics:
        - FROZEN rejects POST /chargemaster/charge-items,
          POST /chargemaster/charge-items/{id}/lifecycle,
          POST /chargemaster/charge-items/{id}/reprice,
          POST /chargemaster/price-rules and
          POST /chargemaster/change-requests/{id}/implement with ERR_FACILITY_FROZEN.
        - RESTRICTED rejects POST /chargemaster/charge-items when code_type IN {CPT, HCPCS},
          and rejects decision APPROVE on a ChangeRequest whose request_type ==
          REVENUE_CODE_REMAP, with ERR_FACILITY_RESTRICTED.
        - OPEN imposes no posture gate.
      Recomputed after every TransparencyFile transition, every CodeUpdateCycle
      transition, every ChargeItem price_status change and every PriceRule
      supersession. Facility.version increments by 1 whenever the recomputation
      changes any Facility field.

  # ---------------------------------------------------------------------------
  # ChargeItem — two INDEPENDENT state dimensions on the same row.
  # Dimension 1: lifecycle_status. Dimension 2: price_status.
  # ---------------------------------------------------------------------------
  - entity: ChargeItem
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=SUBMIT_FOR_REVIEW"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "revenue_code mapping is legal: code_type IN RevenueCode.allowed_code_types AND (RevenueCode.requires_hcpcs == false OR code_type IN {CPT, HCPCS} with non-null code_value) (ERR_REVENUE_CODE_MAPPING_INVALID)"
          - "Department.allowed_revenue_code_values is empty OR contains RevenueCode.code (ERR_DEPARTMENT_REVENUE_CODE_NOT_ALLOWED)"
        side_effects:
          - "lifecycle_status = PENDING_REVIEW; version += 1"
          - "price_status is NOT touched by this transition (dimensions are independent)"

      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=RETURN_TO_DRAFT"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
        side_effects:
          - "lifecycle_status = DRAFT; version += 1"
        note: "Revision loop — an item may cycle DRAFT -> PENDING_REVIEW -> DRAFT any number of times."

      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=APPROVE"
        actor: PricingCommitteeApprover
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "price_status == PRICED_CURRENT — the pricing dimension must have been settled by a reprice first (ERR_ITEM_PRICE_NOT_CURRENT)"
          - "markup_compliance_ratio projected facility ratio <= Facility.aggregate_markup_limit_bp (ERR_AGGREGATE_MARKUP_LIMIT)"
        side_effects:
          - "lifecycle_status = APPROVED; approved_by_user_id = X-User-ID; version += 1"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=ACTIVATE"
        actor: PricingCommitteeApprover
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "RevenueCode(revenue_code_id).status == ACTIVE — cross-entity dependency on reference data (ERR_REVENUE_CODE_RETIRED)"
          - "effective_from <= logical now (ERR_ITEM_NOT_YET_EFFECTIVE)"
          - "No CodeUpdateEntry with target_charge_item_id == this item and status == MAPPED belonging to a cycle in status CROSSWALK_APPROVED (ERR_ITEM_PENDING_CODE_UPDATE)"
        side_effects:
          - "lifecycle_status = ACTIVE; version += 1"
          - "Facility.active_item_count += 1; Facility.aggregate_gross_charge_cents += gross_charge_cents; Facility.aggregate_cost_basis_cents += cost_basis_cents; Facility.aggregate_markup_ratio_bp recomputed; Facility.version += 1"
          - "Facility.transparency_status = NEEDS_REFRESH"
          - "Facility.chargemaster_posture recomputed"

      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=DEACTIVATE or action=MARK_DUPLICATE"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "No CapturedCharge referencing this item exists in a ChargeCaptureBatch with status IN {INGESTED, RECONCILING} (ERR_ITEM_IN_OPEN_BATCH)"
          - "For action=MARK_DUPLICATE only: duplicate_of_item_id target exists, is a different item in the same facility with lifecycle_status == ACTIVE (ERR_DUPLICATE_TARGET_INVALID), and duplicate_similarity_score >= threshold for Facility.duplicate_detection_mode (ERR_DUPLICATE_SIMILARITY_TOO_LOW)"
        side_effects:
          - "lifecycle_status = INACTIVE; version += 1"
          - "For action=MARK_DUPLICATE: duplicate_of_item_id = surviving item id"
          - "Facility.active_item_count -= 1; Facility.aggregate_gross_charge_cents -= gross_charge_cents; Facility.aggregate_cost_basis_cents -= cost_basis_cents; Facility.aggregate_markup_ratio_bp recomputed; Facility.version += 1"
          - "Any TransparencyFile for the facility with status == PUBLISHED transitions to SUPERSEDED (cascade link 2)"
          - "Facility.published_transparency_file_id = null and Facility.transparency_status = NEEDS_REFRESH (cascade link 3)"
          - "Facility.chargemaster_posture recomputed"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=REACTIVATE"
        actor: PricingCommitteeApprover
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "duplicate_of_item_id IS null — an item retired as a duplicate cannot be reactivated (ERR_ITEM_RETIRED_AS_DUPLICATE)"
          - "RevenueCode(revenue_code_id).status == ACTIVE (ERR_REVENUE_CODE_RETIRED)"
          - "price_status == PRICED_CURRENT (ERR_ITEM_PRICE_NOT_CURRENT)"
        side_effects:
          - "lifecycle_status = ACTIVE; version += 1"
          - "Facility aggregates and chargemaster_posture recomputed; Facility.transparency_status = NEEDS_REFRESH; Facility.version += 1"
        note: "INACTIVE -> ACTIVE closes the cleanup cycle ACTIVE -> INACTIVE -> ACTIVE."

      - from: INACTIVE
        to: ARCHIVED
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=ARCHIVE"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "No ChangeRequest referencing this item has status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED} (ERR_ITEM_HAS_OPEN_REQUEST)"
          - "No CapturedCharge referencing this item exists in a ChargeCaptureBatch with status != CLOSED (ERR_ITEM_IN_OPEN_BATCH)"
        side_effects:
          - "lifecycle_status = ARCHIVED; version += 1"
          - "Every CodeUpdateEntry with target_charge_item_id == this item and status IN {PENDING, MAPPED} transitions to DEFERRED with defer_reason = 'TARGET_ARCHIVED'"

  - entity: ChargeItem
    dimension: price_status
    initial_state: PRICE_STALE
    terminal_states: []
    transitions:
      - from: PRICE_STALE
        to: PRICED_CURRENT
        trigger: "POST /chargemaster/charge-items/{charge_item_id}/reprice"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "lifecycle_status != ARCHIVED (ERR_INVALID_ITEM_LIFECYCLE_STATE)"
          - "Exactly one PriceRule is selected by the price-rule selector (ERR_NO_APPLICABLE_PRICE_RULE when the candidate set is empty)"
        side_effects:
          - "prior_gross_charge_cents = gross_charge_cents (before overwrite)"
          - "gross_charge_cents = gross_charge_from_price_rule output; applied_price_rule_id = selected rule id; price_conflict set per calculation"
          - "price_status = PRICED_CURRENT; version += 1"
          - "When lifecycle_status == ACTIVE: Facility.aggregate_gross_charge_cents and aggregate_markup_ratio_bp recomputed, Facility.stale_price_item_count recomputed, Facility.transparency_status = NEEDS_REFRESH, Facility.chargemaster_posture recomputed, Facility.version += 1"
          - "Every PriceChangeImpactAnalysis with status == COMPUTED whose ChangeRequest targets this item transitions to STALE"

      - from: PRICED_CURRENT
        to: PRICE_STALE
        trigger: "system — the PriceRule referenced by applied_price_rule_id transitions ACTIVE -> SUPERSEDED"
        actor: system
        preconditions:
          - "applied_price_rule_id == the superseded rule id"
        side_effects:
          - "price_status = PRICE_STALE; version += 1"
          - "Facility.stale_price_item_count recomputed; when the count reaches >= 5 Facility.chargemaster_posture becomes RESTRICTED; Facility.version += 1"

      - from: PRICED_CURRENT
        to: REPRICE_PENDING
        trigger: "POST /chargemaster/change-requests/{change_request_id}/approve with request_type IN {PRICE_CHANGE, NEW_ITEM}"
        actor: PricingCommitteeApprover
        preconditions:
          - "The approving ChangeRequest targets this item and passes all APPROVE preconditions"
        side_effects:
          - "price_status = REPRICE_PENDING; version += 1 (this bump is what a second stale APPROVE observes via OCC)"

      - from: PRICE_STALE
        to: REPRICE_PENDING
        trigger: "POST /chargemaster/change-requests/{change_request_id}/approve with request_type IN {PRICE_CHANGE, NEW_ITEM}"
        actor: PricingCommitteeApprover
        preconditions:
          - "The approving ChangeRequest targets this item and passes all APPROVE preconditions"
        side_effects:
          - "price_status = REPRICE_PENDING; version += 1"

      - from: REPRICE_PENDING
        to: PRICED_CURRENT
        trigger: "POST /chargemaster/change-requests/{change_request_id}/implement"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChangeRequest.pinned_charge_item_version == ChargeItem.version (ERR_PINNED_VERSION_STALE)"
        side_effects:
          - "cost_basis_cents / description / revenue_code_id updated per request_type; prior_gross_charge_cents = gross_charge_cents; gross_charge_cents recomputed via gross_charge_from_price_rule"
          - "price_status = PRICED_CURRENT; version += 1"

      - from: PRICED_CURRENT
        to: PRICE_FROZEN
        trigger: "system — TransparencyFile BUILDING -> VALIDATED for the facility"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE (only the publishable inclusion set is frozen)"
        side_effects:
          - "price_status = PRICE_FROZEN; version += 1"
          - "While PRICE_FROZEN, POST /chargemaster/charge-items/{id}/reprice is rejected with ERR_ITEM_PRICE_FROZEN"

      - from: PRICE_FROZEN
        to: PRICED_CURRENT
        trigger: "system — TransparencyFile VALIDATED -> PUBLISHED or VALIDATED -> FAILED for the facility"
        actor: system
        preconditions:
          - "The facility has no other TransparencyFile in status IN {BUILDING, VALIDATED}"
        side_effects:
          - "price_status = PRICED_CURRENT; version += 1"

  # ---------------------------------------------------------------------------
  # ChangeRequest — cyclic (revision rounds) + branching decision fan-out whose
  # side-effect set differs per request_type branch.
  # ---------------------------------------------------------------------------
  - entity: ChangeRequest
    initial_state: SUBMITTED
    terminal_states: [IMPLEMENTED, REJECTED, WITHDRAWN, VOIDED_STALE]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /chargemaster/change-requests/{change_request_id}/decisions decision=REVIEW"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "ChargeItem(charge_item_id).lifecycle_status != ARCHIVED (ERR_INVALID_ITEM_LIFECYCLE_STATE)"
        side_effects:
          - "status = UNDER_REVIEW; reviewed_by_user_id = X-User-ID; decision_note = payload decision_note; version += 1"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /chargemaster/change-requests/{change_request_id}/decisions decision=REQUEST_CHANGES"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "X-User-ID == reviewed_by_user_id — only the reviewer of record may bounce the request back (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = CHANGES_REQUESTED; decision_note = payload decision_note; version += 1"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /chargemaster/change-requests/{change_request_id}/resubmit"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == Department.manager_user_id of department_id (ERR_DEPARTMENT_SCOPE_VIOLATION)"
          - "revision_round < 3 — the fourth resubmit is rejected (ERR_REVISION_LIMIT_EXCEEDED); revision_round == 3 fails, revision_round == 2 succeeds"
        side_effects:
          - "revision_round += 1; proposed_* fields overwritten with the payload values; justification overwritten"
          - "projected_gross_charge_cents recomputed via gross_charge_from_price_rule; projected_markup_ratio_bp recomputed via markup_compliance_ratio"
          - "reviewed_by_user_id cleared to null (a fresh REVIEW decision is required); status = SUBMITTED; version += 1"
        note: "Revision cycle UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /chargemaster/change-requests/{change_request_id}/approve"
        actor: PricingCommitteeApprover
        preconditions:
          - "expected_charge_item_version == ChargeItem.version (ERR_STALE_ITEM_VERSION, 412) — checked after state preconditions and before all business rules"
          - "X-User-ID != submitted_by_user_id AND X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reviewed_by_user_id IS NOT null (ERR_REQUEST_NOT_REVIEWED)"
          - "When request_type == REVENUE_CODE_REMAP: Facility.chargemaster_posture != RESTRICTED (ERR_FACILITY_RESTRICTED)"
          - "When request_type == REVENUE_CODE_REMAP: proposed_revenue_code_id resolves to a RevenueCode with status == ACTIVE whose allowed_code_types contains the item's code_type (ERR_REVENUE_CODE_MAPPING_INVALID)"
          - "projected_markup_ratio_bp <= Facility.aggregate_markup_limit_bp (ERR_AGGREGATE_MARKUP_LIMIT)"
        side_effects:
          - "status = APPROVED; approved_by_user_id = X-User-ID; pinned_charge_item_version = ChargeItem.version observed BEFORE this transition's item mutation; version += 1"
          - "When request_type IN {PRICE_CHANGE, NEW_ITEM}: ChargeItem.price_status -> REPRICE_PENDING and ChargeItem.version += 1; pinned_charge_item_version is then set to the POST-bump version so that implement can match it"
          - "When request_type IN {DEACTIVATION, REVENUE_CODE_REMAP}: ChargeItem is not mutated and pinned_charge_item_version equals the observed version"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /chargemaster/change-requests/{change_request_id}/decisions decision=REJECT"
        actor: PricingCommitteeApprover
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = REJECTED; approved_by_user_id remains null; decision_note = payload decision_note; version += 1"
          - "When ChargeItem.price_status == REPRICE_PENDING and no other APPROVED ChangeRequest targets the item: ChargeItem.price_status reverts to PRICE_STALE and ChargeItem.version += 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /chargemaster/change-requests/{change_request_id}/decisions decision=WITHDRAW"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == submitted_by_user_id (ERR_DEPARTMENT_SCOPE_VIOLATION)"
        side_effects:
          - "status = WITHDRAWN; version += 1; Department.open_request_count recomputed"

      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /chargemaster/change-requests/{change_request_id}/decisions decision=WITHDRAW"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == submitted_by_user_id (ERR_DEPARTMENT_SCOPE_VIOLATION)"
        side_effects:
          - "status = WITHDRAWN; version += 1; Department.open_request_count recomputed"

      - from: APPROVED
        to: IMPLEMENTED
        trigger: "POST /chargemaster/change-requests/{change_request_id}/implement"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "pinned_charge_item_version == ChargeItem.version (ERR_PINNED_VERSION_STALE) — the pin is NOT refreshed and the request stays APPROVED when it fails"
          - "When request_type == DEACTIVATION: the item satisfies the ACTIVE -> INACTIVE preconditions (ERR_ITEM_IN_OPEN_BATCH)"
        side_effects:
          - "status = IMPLEMENTED; version += 1"
          - "Branch PRICE_CHANGE / NEW_ITEM: ChargeItem.cost_basis_cents = proposed_cost_basis_cents, description = proposed_description when non-null, prior_gross_charge_cents = gross_charge_cents, gross_charge_cents recomputed, price_status -> PRICED_CURRENT, ChargeItem.version += 1"
          - "Branch REVENUE_CODE_REMAP: ChargeItem.revenue_code_id = proposed_revenue_code_id, price_status -> PRICE_STALE, ChargeItem.version += 1 (no reprice — the item must be repriced explicitly)"
          - "Branch DEACTIVATION: ChargeItem.lifecycle_status ACTIVE -> INACTIVE with that transition's full cascade"
          - "Cascade link 1: ChargeItem mutated (version advanced)"
          - "Cascade link 2: every TransparencyFile for the facility with status == PUBLISHED transitions to SUPERSEDED"
          - "Cascade link 3: Facility.published_transparency_file_id = null, Facility.transparency_status = NEEDS_REFRESH, Facility aggregates and chargemaster_posture recomputed, Facility.version += 1"
          - "Cascade link 4: every OTHER ChangeRequest with status == APPROVED targeting the same charge_item_id whose pinned_charge_item_version != the item's new version transitions APPROVED -> VOIDED_STALE"
          - "Every PriceChangeImpactAnalysis with status == COMPUTED for this request transitions to STALE"

      - from: APPROVED
        to: VOIDED_STALE
        trigger: "system — another ChangeRequest targeting the same ChargeItem was implemented and advanced the item version past this request's pin"
        actor: system
        preconditions:
          - "pinned_charge_item_version != ChargeItem.version after the sibling implement"
        side_effects:
          - "status = VOIDED_STALE; version += 1; Department.open_request_count recomputed"

  # ---------------------------------------------------------------------------
  # CodeUpdateCycle — branching with a compensating rollback branch; compound
  # gate on child entry states.
  # ---------------------------------------------------------------------------
  - entity: CodeUpdateCycle
    initial_state: LOADED
    terminal_states: [ROLLED_BACK, CANCELLED]
    transitions:
      - from: LOADED
        to: MAPPING
        trigger: "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle action=START_MAPPING"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "entry_count >= 1 — a cycle with zero entries cannot start mapping (ERR_CYCLE_HAS_NO_ENTRIES)"
        side_effects:
          - "status = MAPPING; version += 1"
          - "Facility.chargemaster_posture recomputed -> RESTRICTED (rule 2) unless a TransparencyFile keeps it FROZEN; Facility.version += 1"

      - from: MAPPING
        to: CROSSWALK_APPROVED
        trigger: "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle action=APPROVE_CROSSWALK"
        actor: PricingCommitteeApprover
        preconditions:
          - "unmapped_entry_count == 0 — every entry is MAPPED or DEFERRED (ERR_UNMAPPED_CODE_ENTRIES)"
          - "At least one entry has status == MAPPED (ERR_CYCLE_HAS_NO_MAPPED_ENTRIES)"
          - "X-User-ID differs from every entry's mapped_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = CROSSWALK_APPROVED; version += 1"
          - "Facility.chargemaster_posture stays RESTRICTED (derivation rule 2 covers CROSSWALK_APPROVED)"

      - from: CROSSWALK_APPROVED
        to: ACTIVATED
        trigger: "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle action=ACTIVATE"
        actor: ComplianceOfficer
        preconditions:
          - "Facility.chargemaster_posture != FROZEN — no TransparencyFile may be in BUILDING or VALIDATED (ERR_FACILITY_FROZEN)"
          - "No ChangeRequest with status == APPROVED targets any item referenced by a MAPPED entry of this cycle (ERR_ITEM_HAS_OPEN_REQUEST)"
        side_effects:
          - "pre_activation_active_item_count and pre_activation_aggregate_gross_charge_cents snapshotted from Facility BEFORE any child mutation"
          - "status = ACTIVATED; activated_at = logical now; version += 1"
          - "Cascade link 1: every entry with status == MAPPED, processed in order created_at ASC, transitions MAPPED -> APPLIED and snapshots prior_code_value / prior_revenue_code_id / prior_gross_charge_cents / prior_lifecycle_status from its target item"
          - "Cascade link 2: each APPLIED entry mutates its target ChargeItem — action IN {CROSSWALK, REVISE} sets code_value = new_code_value, revenue_code_id = new_revenue_code_id when non-null, gross_charge_cents = carried_gross_charge_cents, price_status -> PRICE_STALE; action == DELETE sets lifecycle_status -> INACTIVE; ChargeItem.version += 1 and last_code_cycle_id = cycle id"
          - "Cascade link 3: the ChargeItem mutations of link 2 force every TransparencyFile for the facility with status == PUBLISHED to transition PUBLISHED -> SUPERSEDED"
          - "Cascade link 4: the supersession of link 3 sets Facility.published_transparency_file_id = null, Facility.transparency_status = NEEDS_REFRESH, recomputes active_item_count / aggregate_gross_charge_cents / aggregate_cost_basis_cents / aggregate_markup_ratio_bp / stale_price_item_count / chargemaster_posture, and increments Facility.version by 1"

      - from: ACTIVATED
        to: ROLLED_BACK
        trigger: "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle action=ROLL_BACK"
        actor: ComplianceOfficer
        preconditions:
          - "Facility.chargemaster_posture != FROZEN (ERR_FACILITY_FROZEN)"
          - "No ChargeCaptureBatch for the facility with status IN {RECONCILING} references an item touched by this cycle (ERR_ITEM_IN_OPEN_BATCH)"
        side_effects:
          - "Every entry with status == APPLIED is reverted in order created_at DESC (exact reverse of the apply order): target ChargeItem.code_value = prior_code_value, revenue_code_id = prior_revenue_code_id, gross_charge_cents = prior_gross_charge_cents, lifecycle_status = prior_lifecycle_status, price_status -> PRICE_STALE, last_code_cycle_id = null, ChargeItem.version += 1; entry status APPLIED -> REVERTED"
          - "status = ROLLED_BACK; rolled_back_at = logical now; version += 1"
          - "Facility aggregates recomputed; INVARIANT: Facility.active_item_count == pre_activation_active_item_count AND Facility.aggregate_gross_charge_cents == pre_activation_aggregate_gross_charge_cents"
          - "Facility.chargemaster_posture recomputed; Facility.version += 1"
        note: "Compensating action for ACTIVATE — conserves the facility's active-item count and aggregate gross charge."

      - from: MAPPING
        to: CANCELLED
        trigger: "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle action=CANCEL"
        actor: ComplianceOfficer
        preconditions:
          - "applied_entry_count == 0 (ERR_INVALID_CYCLE_STATE)"
        side_effects:
          - "status = CANCELLED; version += 1"
          - "Every entry with status IN {PENDING, MAPPED} transitions to DEFERRED with defer_reason = 'CYCLE_CANCELLED'"
          - "Facility.chargemaster_posture recomputed (RESTRICTED rule 2 no longer holds for this cycle); Facility.version += 1"

  - entity: CodeUpdateEntry
    initial_state: PENDING
    terminal_states: [REVERTED, DEFERRED]
    transitions:
      - from: PENDING
        to: MAPPED
        trigger: "POST /chargemaster/code-update-entries/{entry_id}/disposition action=MAP"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "CodeUpdateCycle.status == MAPPING (ERR_INVALID_CYCLE_STATE)"
          - "action != ADD requires exactly one ChargeItem in the cycle's facility with code_value == old_code_value and lifecycle_status IN {ACTIVE, INACTIVE, APPROVED} (ERR_CROSSWALK_TARGET_NOT_FOUND when zero; ERR_CROSSWALK_TARGET_AMBIGUOUS when more than one)"
          - "When new_revenue_code_id is non-null it resolves to a RevenueCode with status == ACTIVE whose allowed_code_types contains the target item's code_type (ERR_REVENUE_CODE_MAPPING_INVALID)"
        side_effects:
          - "target_charge_item_id = resolved item id; mapped_by_user_id = X-User-ID"
          - "carried_gross_charge_cents = code_update_crosswalk_price_carry output"
          - "status = MAPPED; version += 1; CodeUpdateCycle.unmapped_entry_count recomputed and CodeUpdateCycle.version += 1"

      - from: PENDING
        to: DEFERRED
        trigger: "POST /chargemaster/code-update-entries/{entry_id}/disposition action=DEFER"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "CodeUpdateCycle.status == MAPPING (ERR_INVALID_CYCLE_STATE)"
          - "defer_reason is a non-empty string (ERR_VALIDATION)"
        side_effects:
          - "status = DEFERRED; mapped_by_user_id = X-User-ID; version += 1; CodeUpdateCycle.unmapped_entry_count recomputed and CodeUpdateCycle.version += 1"

      - from: MAPPED
        to: APPLIED
        trigger: "system — CodeUpdateCycle CROSSWALK_APPROVED -> ACTIVATED"
        actor: system
        preconditions:
          - "target_charge_item_id resolves to a ChargeItem with lifecycle_status != ARCHIVED"
        side_effects:
          - "prior_* snapshots captured; status = APPLIED; version += 1; target ChargeItem mutated per the cycle ACTIVATE cascade"

      - from: MAPPED
        to: DEFERRED
        trigger: "system — the target ChargeItem transitions INACTIVE -> ARCHIVED, or CodeUpdateCycle MAPPING -> CANCELLED"
        actor: system
        preconditions:
          - "CodeUpdateCycle.status IN {MAPPING, CROSSWALK_APPROVED, CANCELLED}"
        side_effects:
          - "status = DEFERRED; defer_reason = 'TARGET_ARCHIVED' or 'CYCLE_CANCELLED'; target_charge_item_id = null; version += 1; CodeUpdateCycle.unmapped_entry_count recomputed"

      - from: APPLIED
        to: REVERTED
        trigger: "system — CodeUpdateCycle ACTIVATED -> ROLLED_BACK"
        actor: system
        preconditions:
          - "prior_code_value IS NOT null"
        side_effects:
          - "target ChargeItem restored from the prior_* snapshots; status = REVERTED; version += 1"

  # ---------------------------------------------------------------------------
  # ChargeCaptureBatch — reconciliation loop with a dispute cycle.
  # ---------------------------------------------------------------------------
  - entity: ChargeCaptureBatch
    initial_state: INGESTED
    terminal_states: [CLOSED]
    transitions:
      - from: INGESTED
        to: RECONCILING
        trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/reconcile"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "line_count >= 1 — an empty batch cannot be reconciled (ERR_BATCH_HAS_NO_LINES)"
        side_effects:
          - "status = RECONCILING; reconcile_pass_count += 1; version += 1"
          - "Every CapturedCharge in the batch is re-evaluated: charge_item_id resolved from submitted_cdm_number within facility_id; match_status assigned per charge_capture_variance_summary step 1; expected_charge_cents and line_variance_bp computed"
          - "mean_line_variance_bp, matched_line_count, exception_line_count, total_expected_charge_cents, total_posted_charge_cents recomputed"
          - "Cascade link 1: missing_charge_detection creates one MissingChargeFinding per unpaired trigger line (status OPEN, estimated_lost_charge_cents frozen at creation); findings created by a previous pass whose companion is now present transition OPEN -> DISMISSED with disposition_note = 'COMPANION_PRESENT_ON_REPASS'"

      - from: DISPUTED
        to: RECONCILING
        trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/reconcile"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "line_count >= 1 (ERR_BATCH_HAS_NO_LINES)"
        side_effects:
          - "status = RECONCILING; reconcile_pass_count += 1; version += 1; all line-level and finding-level side effects of the INGESTED -> RECONCILING transition are re-executed"
        note: "Dispute cycle RECONCILED -> DISPUTED -> RECONCILING -> RECONCILED."

      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle action=FINALIZE"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "No CapturedCharge in the batch has match_status == UNRECONCILED (ERR_BATCH_LINES_UNRECONCILED)"
        side_effects:
          - "status = RECONCILED; version += 1"

      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle action=DISPUTE"
        actor: DepartmentManager
        preconditions:
          - "X-User-ID == Department.manager_user_id of department_id (ERR_DEPARTMENT_SCOPE_VIOLATION)"
          - "exception_line_count >= 1 (ERR_NOTHING_TO_DISPUTE)"
        side_effects:
          - "status = DISPUTED; version += 1"

      - from: RECONCILED
        to: CLOSED
        trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle action=CLOSE"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "open_finding_count == 0 — every MissingChargeFinding of this batch is CONFIRMED, DISMISSED or RESOLVED (ERR_FINDINGS_OPEN)"
          - "Department.capture_hold == false (ERR_DEPARTMENT_CAPTURE_HOLD)"
        side_effects:
          - "status = CLOSED; version += 1"
          - "Department.open_request_count is not affected; Department aggregates recomputed"

  - entity: MissingChargeFinding
    initial_state: OPEN
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /chargemaster/missing-charge-findings/{finding_id}/disposition action=CONFIRM"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCaptureBatch.status IN {RECONCILING, RECONCILED, DISPUTED} (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "status = CONFIRMED; disposition_note = payload disposition_note; version += 1"
          - "Cascade link 1: Department.unresolved_finding_amount_cents += estimated_lost_charge_cents; Department.version += 1"
          - "Cascade link 2: when Department.unresolved_finding_amount_cents >= 500000 then Department.capture_hold = true, which blocks POST /chargemaster/charge-capture-batches for that department"
          - "ChargeCaptureBatch.open_finding_count recomputed; ChargeCaptureBatch.version += 1"

      - from: OPEN
        to: DISMISSED
        trigger: "POST /chargemaster/missing-charge-findings/{finding_id}/disposition action=DISMISS"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "ChargeCaptureBatch.status IN {RECONCILING, RECONCILED, DISPUTED} (ERR_INVALID_BATCH_STATE)"
          - "disposition_note is a non-empty string (ERR_VALIDATION)"
        side_effects:
          - "status = DISMISSED; version += 1; ChargeCaptureBatch.open_finding_count recomputed"

      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /chargemaster/missing-charge-findings/{finding_id}/disposition action=RESOLVE"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "recovery_captured_charge_id resolves to a CapturedCharge in the SAME batch whose charge_item_id == expected_charge_item_id (ERR_RECOVERY_LINE_INVALID)"
          - "ChargeCaptureBatch.status != CLOSED (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "status = RESOLVED; recovery_captured_charge_id stored; version += 1"
          - "Department.unresolved_finding_amount_cents -= estimated_lost_charge_cents and Department.recovered_charge_cents += estimated_lost_charge_cents (same literal amount — the leakage total is conserved); Department.capture_hold recomputed; Department.version += 1"
        note: "Compensating action for CONFIRM — conserves Department leakage: unresolved_finding_amount_cents + recovered_charge_cents == sum(estimated_lost_charge_cents) over findings with status IN {CONFIRMED, RESOLVED}."

  - entity: TransparencyFile
    initial_state: BUILDING
    terminal_states: [FAILED, SUPERSEDED]
    transitions:
      - from: BUILDING
        to: VALIDATED
        trigger: "POST /chargemaster/transparency-files/{file_id}/lifecycle action=VALIDATE"
        actor: ComplianceOfficer
        preconditions:
          - "validation_errors computed by transparency_file_build is an empty array (otherwise the transition goes to FAILED instead)"
        side_effects:
          - "status = VALIDATED; version += 1"
          - "Every ChargeItem for the facility with lifecycle_status == ACTIVE and price_status == PRICED_CURRENT transitions price_status -> PRICE_FROZEN; each such ChargeItem.version += 1"
          - "Facility.chargemaster_posture recomputed -> FROZEN; Facility.version += 1"

      - from: BUILDING
        to: FAILED
        trigger: "POST /chargemaster/transparency-files/{file_id}/lifecycle action=VALIDATE"
        actor: ComplianceOfficer
        preconditions:
          - "validation_errors is non-empty (at least one ACTIVE item has price_status == PRICE_STALE, or payer_column_count == 0)"
        side_effects:
          - "status = FAILED; version += 1"
          - "Facility.chargemaster_posture recomputed (no longer FROZEN by this file); Facility.version += 1"

      - from: VALIDATED
        to: PUBLISHED
        trigger: "POST /chargemaster/transparency-files/{file_id}/lifecycle action=PUBLISH"
        actor: ComplianceOfficer
        preconditions:
          - "No CodeUpdateCycle for the facility has status IN {MAPPING, CROSSWALK_APPROVED} (ERR_TRANSPARENCY_BLACKOUT)"
          - "included_item_count >= 1 (ERR_NO_PUBLISHABLE_ITEMS)"
        side_effects:
          - "status = PUBLISHED; published_at = logical now; version += 1"
          - "Any other TransparencyFile for the facility with status == PUBLISHED transitions to SUPERSEDED with superseded_by_file_id = this file id"
          - "Every ChargeItem with price_status == PRICE_FROZEN for the facility transitions back to PRICED_CURRENT; each ChargeItem.version += 1"
          - "Facility.published_transparency_file_id = this file id; Facility.transparency_status = CURRENT; Facility.chargemaster_posture recomputed; Facility.version += 1"

      - from: VALIDATED
        to: FAILED
        trigger: "POST /chargemaster/transparency-files/{file_id}/lifecycle action=FAIL"
        actor: ComplianceOfficer
        preconditions:
          - "status == VALIDATED"
        side_effects:
          - "status = FAILED; version += 1"
          - "Every ChargeItem with price_status == PRICE_FROZEN for the facility transitions back to PRICED_CURRENT; each ChargeItem.version += 1"
          - "Facility.chargemaster_posture recomputed; Facility.version += 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — any ACTIVE ChargeItem of the facility is mutated (reprice, change-request implement, code-cycle activation or rollback, lifecycle change), or a newer TransparencyFile is published"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "status = SUPERSEDED; superseded_by_file_id = the newer file id when the trigger was a publication, otherwise null; version += 1"
          - "Facility.published_transparency_file_id = null; Facility.transparency_status = NEEDS_REFRESH; Facility.version += 1"

  - entity: PriceChangeImpactAnalysis
    initial_state: COMPUTED
    terminal_states: [SIGNED_OFF]
    transitions:
      - from: COMPUTED
        to: SIGNED_OFF
        trigger: "POST /chargemaster/price-change-analyses/{analysis_id}/sign-off"
        actor: ComplianceOfficer
        preconditions:
          - "status == COMPUTED (ERR_ANALYSIS_SIGNOFF_STALE when status == STALE)"
          - "analysed_charge_item_version == ChargeItem.version of the request's target item (ERR_ANALYSIS_SIGNOFF_STALE)"
        side_effects:
          - "status = SIGNED_OFF; signed_off_by_user_id = X-User-ID; version += 1"

      - from: COMPUTED
        to: STALE
        trigger: "system — the target ChargeItem is mutated, or a PayerContract for the facility is created/terminated"
        actor: system
        preconditions:
          - "status == COMPUTED"
        side_effects:
          - "status = STALE; version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict resolution in this scaffold)
# =============================================================================
concurrency_rules:
  - rule_id: change-request-approve-stale-item
    parent_entity: ChargeItem
    write_endpoint: "POST /chargemaster/change-requests/{change_request_id}/approve"
    occ_field: "expected_charge_item_version"
    description: |
      Two ChangeRequests may legitimately target the same ChargeItem and both may
      reach UNDER_REVIEW; approving one is a valid supersede of the other's view of
      the item because APPROVE bumps ChargeItem.version (price_status ->
      REPRICE_PENDING). An APPROVE decision carrying an expected_charge_item_version
      that no longer matches the live ChargeItem.version is therefore rejected as a
      stale-version write.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

  - rule_id: transparency-build-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /chargemaster/transparency-files"
    occ_field: "expected_facility_version"
    description: |
      A new transparency build legitimately supersedes an earlier published file for
      the same facility, so a second build request is not blocked by state alone. A
      build carrying an expected_facility_version that no longer matches the live
      Facility.version is rejected as a stale-version write, because the facility's
      inclusion set has moved since the client last observed it.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. round_half_up(x) means: round the exact rational
# value x to the nearest integer, .5 always away from zero.
# =============================================================================
calculations:

  - name: price_rule_selector
    trigger: "Start of gross_charge_from_price_rule (POST /chargemaster/charge-items/{id}/reprice, ChangeRequest create/resubmit dry-run, ChangeRequest implement, code_update_crosswalk_price_carry)"
    algorithm: selector_policy
    formula: |
      candidates = PriceRule WHERE facility_id == item.facility_id
                          AND revenue_code_id == item.revenue_code_id
                          AND status == ACTIVE
                          AND effective_from <= now
                          AND (effective_to IS NULL OR now < effective_to)   # half-open
      IF candidates is empty: raise ERR_NO_APPLICABLE_PRICE_RULE (422)
      rank by effective_from DESC, then created_at ASC (never by id)
      selected = first ranked candidate
    input_set: "PriceRule rows with status == ACTIVE only; SUPERSEDED and RETIRED rules are never selected. `now` is the logical clock."
    constants: {}
    precision: "n/a — selection only"
    variants: []

  - name: gross_charge_from_price_rule
    trigger: "POST /chargemaster/charge-items/{charge_item_id}/reprice; ChangeRequest implement branch PRICE_CHANGE/NEW_ITEM; ChangeRequest create and resubmit (dry run into projected_gross_charge_cents)"
    algorithm: tiered_pricing
    formula: |
      rule = price_rule_selector(item)

      # -- Step 1: method dispatch -------------------------------------------
      IF rule.pricing_method == FLAT_FEE:
          base_cents = rule.flat_fee_cents
      ELIF rule.pricing_method == MEDICARE_MULTIPLE:
          base_cents = round_half_up(item.medicare_rate_cents * rule.min_medicare_multiple_bp / 10000)
      ELSE:  # COST_PLUS_MARKUP
          # tier selection: last tier whose min_cost_basis_cents <= cost_basis_cents
          # (tiers sorted ascending). Boundary is INCLUSIVE: cost_basis_cents equal
          # to a tier's min_cost_basis_cents selects THAT tier, not the one below.
          tier = last t in rule.markup_tiers where t.min_cost_basis_cents <= item.cost_basis_cents
          base_cents = round_half_up(item.cost_basis_cents * tier.markup_bp / 10000)

      # -- Step 2: Medicare floor, THEN market cap (order is pinned) ---------
      floor_cents = round_half_up(item.medicare_rate_cents * rule.min_medicare_multiple_bp / 10000)
      cap_cents   = round_half_up(item.market_p75_cents  * rule.market_cap_multiple_bp  / 10000)
      floored_cents = max(base_cents, floor_cents)
      constrained_cents = min(floored_cents, cap_cents)
      price_conflict = (floor_cents > cap_cents)      # cap wins, flag is raised

      # -- Step 3: facility rounding mode (applied LAST, once) ---------------
      IF facility.rounding_mode == NEAREST_CENT:      gross = constrained_cents
      ELIF facility.rounding_mode == NEAREST_DOLLAR:  gross = round_half_up(constrained_cents / 100) * 100
      ELIF facility.rounding_mode == PSYCHOLOGICAL_99: gross = ceil(constrained_cents / 100) * 100 - 1
      RETURN gross
    input_set: "Single ChargeItem plus the one PriceRule chosen by price_rule_selector plus the owning Facility's rounding_mode. No other items participate."
    constants:
      DEFAULT_MARKUP_TIERS: "[{min_cost_basis_cents: 0, markup_bp: 32000}, {min_cost_basis_cents: 50000, markup_bp: 24000}, {min_cost_basis_cents: 250000, markup_bp: 18000}]"
      BP_DENOMINATOR: 10000
    precision: "Integer cents at every step; round_half_up after each multiplication, never at the end only. Rounding mode is applied exactly once, after floor and cap."
    variants:
      - name: floor_then_cap
        when: "always — this is the pinned order"
        difference: "max(base, floor) is evaluated BEFORE min(..., cap); when floor_cents > cap_cents the cap wins and price_conflict = true. Applying the cap first and the floor second would return floor_cents instead and is WRONG."

  - name: markup_compliance_ratio
    trigger: "ChangeRequest create / resubmit (projected_markup_ratio_bp); ChangeRequest decision APPROVE; ChargeItem lifecycle action APPROVE"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, evaluation order PINNED:
      #   the facility ratio depends on the item's gross charge, and the item's
      #   admissibility depends on the facility ratio. Resolve as follows.
      # (1) EXCLUDE the item under evaluation from the facility snapshot:
      snap_gross = facility.aggregate_gross_charge_cents
                 - (item.gross_charge_cents IF item.lifecycle_status == ACTIVE ELSE 0)
      snap_cost  = facility.aggregate_cost_basis_cents
                 - (item.cost_basis_cents  IF item.lifecycle_status == ACTIVE ELSE 0)
      # (2) ADD the proposed post-change values of the item under evaluation:
      proposed_gross = projected_gross_charge_cents   # from gross_charge_from_price_rule
      proposed_cost  = proposed_cost_basis_cents IF request_type IN {NEW_ITEM, PRICE_CHANGE}
                       ELSE item.cost_basis_cents
      num = snap_gross + proposed_gross
      den = snap_cost  + proposed_cost
      # (3) The ratio is computed BEFORE any field is written; the write happens
      #     only if the check passes, and the stored facility aggregates are then
      #     recomputed from the persisted items (never from this projection).
      projected_markup_ratio_bp = 0 IF den == 0 ELSE round_half_up(num * 10000 / den)
      PASS when projected_markup_ratio_bp <= facility.aggregate_markup_limit_bp   (<=, not <)
      else ERR_AGGREGATE_MARKUP_LIMIT (422)
    input_set: "ACTIVE ChargeItems of the facility (via the Facility aggregate fields) minus the item under evaluation, plus that item's proposed values. DRAFT/PENDING_REVIEW/APPROVED/INACTIVE/ARCHIVED items never contribute."
    constants:
      DEFAULT_LIMIT_BP: 40000
    precision: "Integer basis points, round_half_up on the final division only."
    variants:
      - name: exclusive_snapshot
        when: "always — pinned"
        difference: "The item under evaluation is removed from the denominator/numerator before its proposed values are added, so a repriced ACTIVE item is never counted twice. Counting it twice (naive add of proposed values onto the live aggregate) inflates the ratio and wrongly triggers ERR_AGGREGATE_MARKUP_LIMIT."

  - name: code_update_crosswalk_price_carry
    trigger: "POST /chargemaster/code-update-entries/{entry_id}/disposition action=MAP (writes carried_gross_charge_cents)"
    algorithm: threshold
    formula: |
      target = ChargeItem(target_charge_item_id)
      IF entry.action == DELETE:
          RETURN target.gross_charge_cents            # unchanged; item is deactivated at apply
      IF entry.new_revenue_code_id IS NULL OR entry.new_revenue_code_id == target.revenue_code_id:
          RETURN target.gross_charge_cents            # pure code substitution carries the price
      # Revenue code changes -> the price must be rebuilt on the inflated cost basis.
      # Pinned order: inflate cost FIRST, round, THEN run gross_charge_from_price_rule
      # against the NEW revenue code's rule. Inflating the resulting charge instead of
      # the cost basis produces a different number and is WRONG.
      inflated_cost_cents = round_half_up(target.cost_basis_cents * cycle.cost_inflator_bp / 10000)
      RETURN gross_charge_from_price_rule(item = target with cost_basis_cents := inflated_cost_cents,
                                         revenue_code_id := entry.new_revenue_code_id)
    input_set: "One CodeUpdateEntry, its target ChargeItem, the owning CodeUpdateCycle's cost_inflator_bp, and the PriceRule selected for the NEW revenue code at MAP time (not at ACTIVATE time)."
    constants:
      DEFAULT_COST_INFLATOR_BP: 10300
    precision: "Integer cents; inflation rounded before tier selection, so the inflated cost can cross a markup tier boundary."
    variants:
      - name: inflate_cost_then_price
        when: "entry.new_revenue_code_id changes the revenue code"
        difference: "Cost is inflated before tier selection and rounding; the tier is chosen on the INFLATED cost. Choosing the tier on the pre-inflation cost yields a different markup_bp whenever inflation crosses a tier boundary."

  - name: payer_impact_delta
    trigger: "POST /chargemaster/price-change-analyses (computes payer_lines and total_reimbursement_delta_cents for a ChangeRequest)"
    algorithm: dual_variant
    formula: |
      item        = ChargeItem(change_request.charge_item_id)
      old_gross   = item.gross_charge_cents
      new_gross   = change_request.projected_gross_charge_cents

      def reimburse(contract, charge_cents, units):
          IF contract.reimbursement_method == PERCENT_OF_CHARGE:
              per_unit = round_half_up(charge_cents * contract.percent_of_charge_bp / 10000)
          ELIF contract.reimbursement_method == LESSER_OF_FEE_SCHEDULE:
              pct_amount = round_half_up(charge_cents * contract.percent_of_charge_bp / 10000)
              per_unit = min(pct_amount, contract.fee_schedule_cents)      # lesser-of
          ELSE:  # CASE_RATE — charge-independent, so its delta is always 0
              per_unit = contract.case_rate_cents
          RETURN per_unit * units          # per-unit rounded FIRST, then multiplied

      # ---------------- variant FORWARD_PROJECTED ---------------------------
      # contracts = PayerContract WHERE facility_id == item.facility_id
      #             AND status == ACTIVE
      #             AND term_start_date <= now <= term_end_date   (closed interval)
      # ordered by payer_code ASC, then product_line ASC (never by id)
      FOR each contract:
          units = round_half_up(contract.trailing_units * facility.volume_growth_bp / 10000)
          old_r = reimburse(contract, old_gross, units)
          new_r = reimburse(contract, new_gross, units)
          emit line { payer_code, product_line, units, old_r, new_r, delta = new_r - old_r }

      # ---------------- variant HISTORICAL_REPLAY --------------------------
      # lines = CapturedCharge WHERE charge_item_id == item.id
      #         AND batch.status IN {RECONCILED, CLOSED}
      #         AND match_status IN {MATCHED, PRICE_VARIANCE}
      #         AND (now - facility.impact_lookback_days) <= service_datetime <= now
      #             (BOTH ends inclusive)
      # replayed in order service_datetime ASC, then created_at ASC (never by id)
      FOR each captured line:
          contract = the PayerContract WHERE facility_id == item.facility_id
                     AND payer_code == line.payer_code
                     AND term_start_date <= line.service_datetime <= line.term_end_date
                     AND status IN {ACTIVE, EXPIRED}      # the term in force on the SERVICE date
          IF no such contract: skip the line and append 'NO_CONTRACT_FOR_SERVICE_DATE:<payer_code>' to nothing (the line contributes 0)
          accumulate into the bucket keyed by (payer_code, product_line):
              units += line.quantity
              old_r += reimburse(contract, old_gross, line.quantity)
              new_r += reimburse(contract, new_gross, line.quantity)
      # emit one line per bucket, ordered by payer_code ASC then product_line ASC

      total_reimbursement_delta_cents = sum of the per-line delta values
                                        (each delta already rounded — round per line, then sum)
    input_set: "FORWARD_PROJECTED reads only PayerContract rows in force at the logical now and their trailing_units; HISTORICAL_REPLAY reads actual CapturedCharge rows of settled batches inside the lookback window and resolves the contract in force on each service date, so a payer whose term expired mid-window contributes different numbers under the two variants."
    constants:
      DEFAULT_VOLUME_GROWTH_BP: 10500
      DEFAULT_LOOKBACK_DAYS: 90
    precision: "Integer cents; per-unit reimbursement rounded before multiplying by units; per-line delta rounded before summation."
    variants:
      - name: FORWARD_PROJECTED
        when: "POST /chargemaster/price-change-analyses with variant == FORWARD_PROJECTED"
        difference: "Units come from PayerContract.trailing_units scaled by facility.volume_growth_bp; the contract in force at `now` is applied to every unit. Payers with zero trailing_units still emit a line with units = 0."
      - name: HISTORICAL_REPLAY
        when: "POST /chargemaster/price-change-analyses with variant == HISTORICAL_REPLAY"
        difference: "Units come from actual CapturedCharge quantities inside the lookback window and each line is priced under the contract in force on ITS service date, so an expired term still contributes. Payers with no captured lines emit no line at all. For identical data the two variants return different total_reimbursement_delta_cents."

  - name: duplicate_similarity_score
    trigger: "POST /chargemaster/charge-items/{charge_item_id}/lifecycle action=MARK_DUPLICATE (gate on the transition); GET /chargemaster/charge-items/{charge_item_id}/duplicate-candidates (read-only report)"
    algorithm: weighted_scoring
    formula: |
      # candidate set: ChargeItem WHERE facility_id == subject.facility_id
      #                AND id != subject.id
      #                AND lifecycle_status == ACTIVE
      #                AND duplicate_of_item_id IS NULL
      # ranked by score DESC, then created_at ASC (never by id)

      def tokens(text):
          upper -> split on any non-alphanumeric -> drop tokens with length < 3
          -> deduplicate -> set

      code_match = 1 IF (a.code_type == b.code_type AND a.code_value == b.code_value
                         AND a.code_value IS NOT NULL) ELSE 0
      rev_match  = 1 IF a.revenue_code_id == b.revenue_code_id ELSE 0
      jaccard    = 0 IF |tokens(a.description) UNION tokens(b.description)| == 0
                   ELSE round_half_up_4dp(|A INTERSECT B| / |A UNION B|)

      # ---------------- variant STRICT_CODE --------------------------------
      score = 1.0000 IF (code_match == 1 AND rev_match == 1
                         AND a.department_id == b.department_id) ELSE 0.0000
      # ---------------- variant FUZZY_DESCRIPTION --------------------------
      score = round_half_up_4dp(0.5 * code_match + 0.3 * jaccard + 0.2 * rev_match)

      PASS when score >= 0.8000 (>= , not >) else ERR_DUPLICATE_SIMILARITY_TOO_LOW (422)
    input_set: "ACTIVE, non-duplicate ChargeItems of the same facility. INACTIVE, ARCHIVED, DRAFT items and items already flagged duplicate_of_item_id are excluded from the candidate set."
    constants:
      SIMILARITY_THRESHOLD: 0.8000
      W_CODE: 0.5
      W_DESCRIPTION: 0.3
      W_REVENUE_CODE: 0.2
      MIN_TOKEN_LENGTH: 3
    precision: "Scores rounded half-up to 4 decimal places; the Jaccard component is rounded to 4dp BEFORE it is multiplied by its weight."
    variants:
      - name: STRICT_CODE
        when: "Facility.duplicate_detection_mode == STRICT_CODE"
        difference: "Binary: identical code_type + code_value + revenue_code + department scores 1.0000, everything else 0.0000. Two items with identical descriptions but different code_values can never be marked duplicates."
      - name: FUZZY_DESCRIPTION
        when: "Facility.duplicate_detection_mode == FUZZY_DESCRIPTION"
        difference: "Weighted: an item pair with different code_values but a description Jaccard of 1.0000 and the same revenue code scores 0.5000 (fails), while identical codes with disjoint descriptions score 0.7000 (fails) — and identical codes + same revenue code score 0.7000 + 0.3*jaccard, crossing 0.8000 only once jaccard >= 0.3334. The same pair therefore yields different duplicate verdicts under the two variants."

  - name: charge_capture_variance_summary
    trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/reconcile (every pass, INGESTED->RECONCILING and DISPUTED->RECONCILING)"
    algorithm: aggregation
    formula: |
      # ---- Step 1: per-line match_status, FIRST match wins (precedence order) ----
      FOR each CapturedCharge L in the batch, processed in order
          service_datetime ASC, then created_at ASC (never by id):
        1) charge_item_id could not be resolved (no ChargeItem in the batch's
           facility with cdm_number == L.submitted_cdm_number)  -> UNKNOWN_CODE
        2) resolved item.lifecycle_status IN {INACTIVE, ARCHIVED}  -> INACTIVE_ITEM
        3) another line of the SAME batch with the same (encounter_id,
           charge_item_id, service_datetime) has an earlier created_at -> DUPLICATE_LINE
        4) expected_charge_cents = item.gross_charge_cents * L.quantity
           line_variance_bp = round_half_up((L.posted_charge_cents - expected) * 10000 / expected)
           abs(line_variance_bp) > 100  -> PRICE_VARIANCE
        5) otherwise                    -> MATCHED
        # boundary: abs(line_variance_bp) == 100 exactly is MATCHED, 101 is PRICE_VARIANCE
        # expected == 0 (item never repriced) -> line_variance_bp = null and the line
        # is PRICE_VARIANCE whenever posted_charge_cents > 0, else MATCHED

      # ---- Step 2: batch roll-up — ROUND PER LINE, THEN AVERAGE (pinned) -------
      scored = lines with match_status IN {MATCHED, PRICE_VARIANCE} and line_variance_bp != null
      IF scored is empty: mean_line_variance_bp = 0
      ELSE mean_line_variance_bp = round_half_up( sum(L.line_variance_bp for L in scored)
                                                  / count(scored) )
      # The aggregate-first alternative
      #   round_half_up((total_posted - total_expected) * 10000 / total_expected)
      # is a DIFFERENT number whenever line quantities/charges differ; it is WRONG.
      total_expected_charge_cents = sum(expected_charge_cents for lines with match_status != UNKNOWN_CODE)
      total_posted_charge_cents   = sum(posted_charge_cents for ALL lines in the batch)
    input_set: "All CapturedCharge rows of the one batch, including DUPLICATE_LINE and UNKNOWN_CODE lines for the posted total but excluding them from the variance mean."
    constants:
      VARIANCE_TOLERANCE_BP: 100
    precision: "Integer basis points; each line's variance is rounded to whole bp BEFORE the mean is taken, and the mean is rounded half-up to whole bp."
    variants:
      - name: round_per_line_then_average
        when: "always — pinned"
        difference: "Per-line variance is rounded to whole basis points first and those rounded values are averaged. Summing raw amounts and dividing once (aggregate-then-round) produces a different mean_line_variance_bp for the same lines."

  - name: missing_charge_detection
    trigger: "POST /chargemaster/charge-capture-batches/{batch_id}/reconcile, immediately after charge_capture_variance_summary step 1"
    algorithm: interval_merge
    formula: |
      FOR each trigger line T of the batch, in order service_datetime ASC then created_at ASC:
        SKIP unless T.match_status IN {MATCHED, PRICE_VARIANCE}
        item = ChargeItem(T.charge_item_id)
        SKIP when item.companion_required_item_id IS NULL
        companion_item = ChargeItem(item.companion_required_item_id)
        SKIP when companion_item.lifecycle_status IN {INACTIVE, ARCHIVED}   # nothing capturable
        present = EXISTS a line C in the SAME batch such that
              C.charge_item_id == companion_item.id
          AND C.encounter_id  == T.encounter_id
          AND C.match_status  != DUPLICATE_LINE
          AND C.quantity      >= T.quantity
          AND 0 <= (C.service_datetime - T.service_datetime) in hours <= item.companion_window_hours
              # BOTH bounds inclusive: a companion posted exactly companion_window_hours
              # after the trigger counts as present; a companion posted BEFORE the
              # trigger does not count at all
        IF present: when an OPEN MissingChargeFinding already exists for T, it
                    transitions OPEN -> DISMISSED with disposition_note
                    'COMPANION_PRESENT_ON_REPASS'
        IF NOT present AND no MissingChargeFinding with trigger_captured_charge_id == T.id
           and status IN {OPEN, CONFIRMED, RESOLVED} exists:
             CREATE MissingChargeFinding {
               batch_id, department_id (copied from batch), trigger_captured_charge_id = T.id,
               expected_charge_item_id = companion_item.id, status = OPEN,
               estimated_lost_charge_cents = companion_item.gross_charge_cents * T.quantity }
    input_set: "Lines of the single batch under reconciliation, matched pairwise within one encounter_id. Lines from other batches and other encounters never satisfy the pairing."
    constants:
      DEFAULT_COMPANION_WINDOW_HOURS: 24
    precision: "Whole hours compared inclusively on both ends; estimated_lost_charge_cents is frozen at creation and never recomputed even if the companion item is later repriced."
    variants: []

  - name: transparency_file_build
    trigger: "POST /chargemaster/transparency-files (build) and every POST /chargemaster/transparency-files/{file_id}/lifecycle action=VALIDATE"
    algorithm: aggregation
    formula: |
      as_of = logical now at build time (stored on the file)
      inclusion_set = ChargeItem WHERE facility_id == file.facility_id
                        AND lifecycle_status == ACTIVE
                        AND price_status IN {PRICED_CURRENT, PRICE_FROZEN}
                        AND duplicate_of_item_id IS NULL
      ordered by RevenueCode.code ASC, then code_value ASC (null code_value sorts
                 after any non-null value), then cdm_number ASC (never by id)

      included_item_count      = count(inclusion_set)
      total_gross_charge_cents = sum(gross_charge_cents over inclusion_set)

      payer_columns = distinct (payer_code, product_line) over PayerContract WHERE
                        facility_id == file.facility_id AND status == ACTIVE
                        AND term_start_date <= as_of <= term_end_date   (closed)
      payer_column_count = count(payer_columns)
      # each payer column's negotiated charge for a row is
      #   reimburse(contract, item.gross_charge_cents, 1) using payer_impact_delta's helper

      content_hash = SHA256 over the ordered rows serialized as
                     "<cdm_number>|<revenue_code>|<code_value or ''>|<gross_charge_cents>"
                     joined by "\n" (deterministic for a given inclusion set and order)

      validation_errors = []
      IF included_item_count == 0:                 append 'NO_PUBLISHABLE_ITEMS'
      IF payer_column_count == 0:                  append 'NO_ACTIVE_PAYER_COLUMNS'
      IF any ChargeItem of the facility with lifecycle_status == ACTIVE has
         price_status == PRICE_STALE:               append 'STALE_PRICED_ITEMS'
      # VALIDATE routes BUILDING -> VALIDATED when validation_errors is empty,
      # BUILDING -> FAILED otherwise.
    input_set: "ACTIVE, non-duplicate, currently-priced items of one facility at the build instant; PRICE_STALE ACTIVE items are excluded from the file but block validation; INACTIVE/ARCHIVED/DRAFT items are ignored entirely."
    constants: {}
    precision: "Integer cents; no rounding — the file republishes stored gross_charge_cents verbatim."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing rule determines the returned error_id)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2,  category: auth, check: "X-User-Role appears in the endpoint's roles list in §1.5", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: all }
  - { priority: 3,  category: auth, check: "When X-User-Role == DepartmentManager, X-User-ID equals Department.manager_user_id of the department owning the target resource (department_id on the request, the ChangeRequest, or the ChargeCaptureBatch)", error_id: ERR_DEPARTMENT_SCOPE_VIOLATION, http_status: 403, applies_to: "POST /change-requests, POST /change-requests/{id}/resubmit, POST /change-requests/{id}/decisions (decision=WITHDRAW), POST /charge-capture-batches, POST /charge-capture-batches/{id}/lines, POST /charge-capture-batches/{id}/lifecycle (action=DISPUTE)" }

  - { priority: 4,  category: existence, check: "facility_id in the path or body resolves to a Facility", error_id: ERR_FACILITY_NOT_FOUND, http_status: 404, applies_to: "all endpoints carrying facility_id" }
  - { priority: 5,  category: existence, check: "charge_item_id in the path resolves to a ChargeItem", error_id: ERR_CHARGE_ITEM_NOT_FOUND, http_status: 404, applies_to: "/charge-items/{charge_item_id}/**" }
  - { priority: 6,  category: existence, check: "change_request_id in the path resolves to a ChangeRequest", error_id: ERR_CHANGE_REQUEST_NOT_FOUND, http_status: 404, applies_to: "/change-requests/{change_request_id}/**" }
  - { priority: 7,  category: existence, check: "cycle_id resolves to a CodeUpdateCycle and entry_id resolves to a CodeUpdateEntry", error_id: ERR_CODE_UPDATE_NOT_FOUND, http_status: 404, applies_to: "/code-update-cycles/**, /code-update-entries/**" }
  - { priority: 8,  category: existence, check: "batch_id resolves to a ChargeCaptureBatch and finding_id resolves to a MissingChargeFinding", error_id: ERR_CAPTURE_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "/charge-capture-batches/**, /missing-charge-findings/**" }
  - { priority: 9,  category: existence, check: "file_id resolves to a TransparencyFile, analysis_id resolves to a PriceChangeImpactAnalysis, price_rule_id resolves to a PriceRule, payer_contract_id resolves to a PayerContract, department_id resolves to a Department", error_id: ERR_GOVERNANCE_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "/transparency-files/**, /price-change-analyses/**, /price-rules/**, /payer-contracts/**, /departments/**" }
  - { priority: 10, category: existence, check: "Body foreign keys resolve, validated left-to-right in declaration order: department_id, revenue_code_id / proposed_revenue_code_id, charge_item_id, companion_required_item_id, duplicate_of_item_id, recovery_captured_charge_id", error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all POST endpoints with FK body fields" }

  - { priority: 11, category: state, check: "Payload conforms to the endpoint input schema: required fields present, enum members legal, integers >= 0, quantity >= 1, justification length >= 10, ISO 8601 UTC datetimes, markup_tiers sorted ascending with first min_cost_basis_cents == 0, effective_to IS NULL OR effective_to > effective_from, term_end_date >= term_start_date, window_end_date >= window_start_date", error_id: ERR_VALIDATION, http_status: 422, applies_to: all }
  - { priority: 12, category: state, check: "Pagination: 1 <= limit <= 100 and offset >= 0", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all GET list endpoints" }

  # Priority 13 is one logical rank split by target entity — the applies_to sets are disjoint,
  # so exactly one of these rows can fire for any given request.
  - { priority: 13, category: state, check: "ChargeItem.lifecycle_status admits the requested action per §1.2 dimension 1", error_id: ERR_INVALID_ITEM_LIFECYCLE_STATE, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle, POST /charge-items/{id}/reprice" }
  - { priority: 13, category: state, check: "ChargeItem.price_status admits the requested pricing action per §1.2 dimension 2", error_id: ERR_INVALID_ITEM_PRICE_STATE, http_status: 409, applies_to: "POST /change-requests/{id}/implement" }
  - { priority: 13, category: state, check: "ChangeRequest.status admits the requested decision / resubmit / implement per §1.2", error_id: ERR_INVALID_REQUEST_STATE, http_status: 409, applies_to: "POST /change-requests/{id}/decisions, POST /change-requests/{id}/resubmit" }
  - { priority: 13, category: state, check: "CodeUpdateCycle.status admits the requested lifecycle action per §1.2", error_id: ERR_INVALID_CYCLE_STATE, http_status: 409, applies_to: "POST /code-update-cycles/{id}/lifecycle, POST /code-update-cycles/{id}/entries" }
  - { priority: 13, category: state, check: "CodeUpdateEntry.status == PENDING when dispositioned", error_id: ERR_INVALID_ENTRY_STATE, http_status: 409, applies_to: "POST /code-update-entries/{id}/disposition" }
  - { priority: 13, category: state, check: "ChargeCaptureBatch.status admits reconcile / finalize / dispute / close per §1.2 (and lines may only be added while status == INGESTED)", error_id: ERR_INVALID_BATCH_STATE, http_status: 409, applies_to: "POST /charge-capture-batches/{id}/reconcile, POST /charge-capture-batches/{id}/lifecycle, POST /charge-capture-batches/{id}/lines" }
  - { priority: 13, category: state, check: "MissingChargeFinding.status admits the requested disposition per §1.2", error_id: ERR_INVALID_FINDING_STATE, http_status: 409, applies_to: "POST /missing-charge-findings/{id}/disposition" }
  - { priority: 13, category: state, check: "TransparencyFile.status admits the requested lifecycle action per §1.2", error_id: ERR_INVALID_FILE_STATE, http_status: 409, applies_to: "POST /transparency-files/{id}/lifecycle" }
  - { priority: 13, category: state, check: "PriceChangeImpactAnalysis.status == COMPUTED when signing off", error_id: ERR_INVALID_ANALYSIS_STATE, http_status: 409, applies_to: "POST /price-change-analyses/{id}/sign-off" }
  - { priority: 14, category: state, check: "Facility.chargemaster_posture != FROZEN for posture-gated writes", error_id: ERR_FACILITY_FROZEN, http_status: 409, applies_to: "POST /charge-items, POST /charge-items/{id}/lifecycle, POST /charge-items/{id}/reprice, POST /price-rules, POST /change-requests/{id}/implement, POST /code-update-cycles/{id}/lifecycle (action IN {ACTIVATE, ROLL_BACK})" }
  - { priority: 15, category: state, check: "Facility.chargemaster_posture != RESTRICTED for restricted writes: creating a ChargeItem with code_type IN {CPT, HCPCS}, and approving a ChangeRequest with request_type == REVENUE_CODE_REMAP", error_id: ERR_FACILITY_RESTRICTED, http_status: 409, applies_to: "POST /charge-items, POST /change-requests/{id}/approve" }
  - { priority: 16, category: state, check: "OCC — expected_charge_item_version equals the live ChargeItem.version", error_id: ERR_STALE_ITEM_VERSION, http_status: 412, applies_to: "POST /change-requests/{id}/approve" }
  - { priority: 17, category: state, check: "OCC — expected_facility_version equals the live Facility.version", error_id: ERR_STALE_FACILITY_VERSION, http_status: 412, applies_to: "POST /transparency-files" }

  - { priority: 18, category: business_safety, check: "Segregation of duties: reviewer != submitter; approver != submitter AND approver != reviewer; crosswalk approver != every entry mapper; resubmitter == submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /change-requests/{id}/decisions, POST /change-requests/{id}/approve, POST /change-requests/{id}/resubmit, POST /code-update-cycles/{id}/lifecycle (action=APPROVE_CROSSWALK)" }
  - { priority: 19, category: business_safety, check: "ChangeRequest.reviewed_by_user_id IS NOT null before an APPROVE decision", error_id: ERR_REQUEST_NOT_REVIEWED, http_status: 409, applies_to: "POST /change-requests/{id}/approve" }
  - { priority: 20, category: business_safety, check: "No CodeUpdateCycle of the facility is in status IN {MAPPING, CROSSWALK_APPROVED} when publishing a transparency file", error_id: ERR_TRANSPARENCY_BLACKOUT, http_status: 409, applies_to: "POST /transparency-files/{id}/lifecycle (action=PUBLISH)" }
  - { priority: 21, category: business_safety, check: "CodeUpdateCycle.unmapped_entry_count == 0 before APPROVE_CROSSWALK", error_id: ERR_UNMAPPED_CODE_ENTRIES, http_status: 409, applies_to: "POST /code-update-cycles/{id}/lifecycle (action=APPROVE_CROSSWALK)" }
  - { priority: 22, category: business_safety, check: "Analysis is signable: status == COMPUTED and analysed_charge_item_version == the target ChargeItem.version", error_id: ERR_ANALYSIS_SIGNOFF_STALE, http_status: 409, applies_to: "POST /price-change-analyses/{id}/sign-off" }

  - { priority: 23, category: business_referential, check: "code_type IN RevenueCode.allowed_code_types AND (RevenueCode.requires_hcpcs == false OR (code_type IN {CPT, HCPCS} AND code_value IS NOT NULL))", error_id: ERR_REVENUE_CODE_MAPPING_INVALID, http_status: 422, applies_to: "POST /charge-items, POST /charge-items/{id}/lifecycle (action=SUBMIT_FOR_REVIEW), POST /change-requests/{id}/approve (request_type=REVENUE_CODE_REMAP), POST /code-update-entries/{id}/disposition (action=MAP)" }
  - { priority: 24, category: business_referential, check: "Department.allowed_revenue_code_values is empty OR contains RevenueCode.code", error_id: ERR_DEPARTMENT_REVENUE_CODE_NOT_ALLOWED, http_status: 422, applies_to: "POST /charge-items, POST /charge-items/{id}/lifecycle (action=SUBMIT_FOR_REVIEW)" }
  - { priority: 25, category: business_referential, check: "RevenueCode.status == ACTIVE when an item is activated or reactivated", error_id: ERR_REVENUE_CODE_RETIRED, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action IN {ACTIVATE, REACTIVATE})" }
  - { priority: 26, category: business_referential, check: "companion_required_item_id references a different ChargeItem in the same facility whose lifecycle_status != ARCHIVED", error_id: ERR_COMPANION_ITEM_INVALID, http_status: 422, applies_to: "POST /charge-items" }
  - { priority: 27, category: business_referential, check: "duplicate_of_item_id references a different ChargeItem in the same facility with lifecycle_status == ACTIVE and duplicate_of_item_id IS NULL", error_id: ERR_DUPLICATE_TARGET_INVALID, http_status: 422, applies_to: "POST /charge-items/{id}/lifecycle (action=MARK_DUPLICATE)" }
  - { priority: 28, category: business_referential, check: "Exactly one ChargeItem in the cycle's facility has code_value == old_code_value with lifecycle_status IN {ACTIVE, INACTIVE, APPROVED}", error_id: ERR_CROSSWALK_TARGET_NOT_FOUND, http_status: 404, applies_to: "POST /code-update-entries/{id}/disposition (action=MAP, action != ADD)" }
  - { priority: 29, category: business_referential, check: "The old_code_value match is unique", error_id: ERR_CROSSWALK_TARGET_AMBIGUOUS, http_status: 409, applies_to: "POST /code-update-entries/{id}/disposition (action=MAP)" }
  - { priority: 30, category: business_referential, check: "ChangeRequest.pinned_charge_item_version == the live ChargeItem.version at implement time", error_id: ERR_PINNED_VERSION_STALE, http_status: 409, applies_to: "POST /change-requests/{id}/implement" }
  - { priority: 31, category: business_referential, check: "recovery_captured_charge_id references a CapturedCharge in the finding's batch whose charge_item_id == expected_charge_item_id", error_id: ERR_RECOVERY_LINE_INVALID, http_status: 422, applies_to: "POST /missing-charge-findings/{id}/disposition (action=RESOLVE)" }

  - { priority: 32, category: business_temporal, check: "effective_from >= logical now at item creation", error_id: ERR_EFFECTIVE_DATE_IN_PAST, http_status: 422, applies_to: "POST /charge-items" }
  - { priority: 33, category: business_temporal, check: "effective_from <= logical now at activation", error_id: ERR_ITEM_NOT_YET_EFFECTIVE, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action=ACTIVATE)" }
  - { priority: 34, category: business_temporal, check: "HALF-OPEN interval semantics — no other PriceRule with status == ACTIVE and the same (facility_id, revenue_code_id) scope key has an interval [effective_from, effective_to) intersecting the new one; abutting intervals (existing.effective_to == new.effective_from) are LEGAL", error_id: ERR_PRICE_RULE_OVERLAP, http_status: 409, applies_to: "POST /price-rules" }
  - { priority: 35, category: business_temporal, check: "CLOSED interval semantics — no other PayerContract with status IN {ACTIVE, EXPIRED} and the same (facility_id, payer_code, product_line) scope key has an interval [term_start_date, term_end_date] intersecting the new one; abutting terms (existing.term_end_date == new.term_start_date) ARE an overlap", error_id: ERR_CONTRACT_TERM_OVERLAP, http_status: 409, applies_to: "POST /payer-contracts" }
  - { priority: 36, category: business_temporal, check: "NOTICE-BUFFER semantics — for the same (facility_id, payer_code, product_line) scope key, new.term_start_date - prior.term_end_date must be STRICTLY GREATER than prior.renegotiation_notice_days days; a gap of exactly renegotiation_notice_days days fails", error_id: ERR_CONTRACT_TERM_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /payer-contracts" }
  - { priority: 37, category: business_temporal, check: "AGGREGATE-CAPACITY interval semantics — for the batch's department, no calendar day inside the new closed [window_start_date, window_end_date] range may end up covered by more than 2 ChargeCaptureBatch rows with status != CLOSED (the third overlapping batch on any single day is rejected)", error_id: ERR_BATCH_WINDOW_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /charge-capture-batches" }
  - { priority: 38, category: business_temporal, check: "window_start_date <= service_datetime <= window_end_date (both ends inclusive)", error_id: ERR_SERVICE_DATE_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST /charge-capture-batches/{id}/lines" }

  - { priority: 39, category: business_constraint, check: "ChargeItem.cdm_number is unique within facility_id", error_id: ERR_DUPLICATE_CDM_NUMBER, http_status: 409, applies_to: "POST /charge-items" }
  - { priority: 39, category: business_constraint, check: "Uniqueness of the remaining natural keys: Facility.cms_certification_number globally; Department.cost_center_code within facility_id; RevenueCode.code globally; CodeUpdateCycle (facility_id, code_set, cycle_year)", error_id: ERR_DUPLICATE_KEY, http_status: 409, applies_to: "POST /facilities, POST /departments, POST /revenue-codes, POST /code-update-cycles" }
  - { priority: 40, category: business_constraint, check: "ChangeRequest.revision_round < 3 on resubmit (round 3 is the last accepted resubmit; a request already at revision_round == 3 is rejected)", error_id: ERR_REVISION_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /change-requests/{id}/resubmit" }
  # Priority 41 is one logical rank split by the empty collection involved; applies_to sets are disjoint.
  - { priority: 41, category: business_constraint, check: "ChargeCaptureBatch.line_count >= 1 before a reconcile pass (zero-line batch)", error_id: ERR_BATCH_HAS_NO_LINES, http_status: 422, applies_to: "POST /charge-capture-batches/{id}/reconcile" }
  - { priority: 41, category: business_constraint, check: "CodeUpdateCycle.entry_count >= 1 before START_MAPPING (zero-entry cycle)", error_id: ERR_CYCLE_HAS_NO_ENTRIES, http_status: 422, applies_to: "POST /code-update-cycles/{id}/lifecycle (action=START_MAPPING)" }
  - { priority: 41, category: business_constraint, check: "At least one CodeUpdateEntry has status == MAPPED before APPROVE_CROSSWALK (all-deferred cycle)", error_id: ERR_CYCLE_HAS_NO_MAPPED_ENTRIES, http_status: 422, applies_to: "POST /code-update-cycles/{id}/lifecycle (action=APPROVE_CROSSWALK)" }
  - { priority: 41, category: business_constraint, check: "ChargeCaptureBatch.exception_line_count >= 1 before DISPUTE", error_id: ERR_NOTHING_TO_DISPUTE, http_status: 422, applies_to: "POST /charge-capture-batches/{id}/lifecycle (action=DISPUTE)" }
  - { priority: 42, category: business_constraint, check: "included_item_count >= 1 when publishing a transparency file (empty inclusion set)", error_id: ERR_NO_PUBLISHABLE_ITEMS, http_status: 422, applies_to: "POST /transparency-files/{id}/lifecycle (action=PUBLISH)" }
  - { priority: 43, category: business_constraint, check: "ChargeCaptureBatch.open_finding_count == 0 before CLOSE", error_id: ERR_FINDINGS_OPEN, http_status: 409, applies_to: "POST /charge-capture-batches/{id}/lifecycle (action=CLOSE)" }
  - { priority: 44, category: business_constraint, check: "Department.capture_hold == false", error_id: ERR_DEPARTMENT_CAPTURE_HOLD, http_status: 409, applies_to: "POST /charge-capture-batches, POST /charge-capture-batches/{id}/lifecycle (action=CLOSE)" }
  - { priority: 45, category: business_constraint, check: "No CapturedCharge of the item sits in a ChargeCaptureBatch with status IN {INGESTED, RECONCILING} (deactivate) or status != CLOSED (archive)", error_id: ERR_ITEM_IN_OPEN_BATCH, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action IN {DEACTIVATE, MARK_DUPLICATE, ARCHIVE}), POST /change-requests/{id}/implement (request_type=DEACTIVATION)" }
  - { priority: 46, category: business_constraint, check: "No ChangeRequest with status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED} targets the item", error_id: ERR_ITEM_HAS_OPEN_REQUEST, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action=ARCHIVE), POST /code-update-cycles/{id}/lifecycle (action=ACTIVATE)" }
  - { priority: 47, category: business_constraint, check: "No MAPPED CodeUpdateEntry of a CROSSWALK_APPROVED cycle targets the item", error_id: ERR_ITEM_PENDING_CODE_UPDATE, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action=ACTIVATE)" }
  - { priority: 48, category: business_constraint, check: "duplicate_similarity_score >= 0.8000 under the facility's duplicate_detection_mode variant", error_id: ERR_DUPLICATE_SIMILARITY_TOO_LOW, http_status: 422, applies_to: "POST /charge-items/{id}/lifecycle (action=MARK_DUPLICATE)" }
  - { priority: 49, category: business_constraint, check: "ChargeItem.price_status == PRICED_CURRENT when approving or reactivating an item", error_id: ERR_ITEM_PRICE_NOT_CURRENT, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action IN {APPROVE, REACTIVATE})" }
  - { priority: 50, category: business_constraint, check: "ChargeItem.price_status != PRICE_FROZEN when repricing", error_id: ERR_ITEM_PRICE_FROZEN, http_status: 409, applies_to: "POST /charge-items/{id}/reprice" }
  - { priority: 51, category: business_constraint, check: "duplicate_of_item_id IS NULL when reactivating", error_id: ERR_ITEM_RETIRED_AS_DUPLICATE, http_status: 409, applies_to: "POST /charge-items/{id}/lifecycle (action=REACTIVATE)" }
  - { priority: 52, category: business_constraint, check: "The batch is in status IN {RECONCILING, RECONCILED, DISPUTED} when dispositioning a finding, and != CLOSED when resolving one", error_id: ERR_INVALID_BATCH_STATE, http_status: 409, applies_to: "POST /missing-charge-findings/{id}/disposition" }

  - { priority: 53, category: business_fiscal, check: "price_rule_selector returns a non-empty candidate set", error_id: ERR_NO_APPLICABLE_PRICE_RULE, http_status: 422, applies_to: "POST /charge-items/{id}/reprice, POST /change-requests, POST /change-requests/{id}/resubmit, POST /change-requests/{id}/implement, POST /code-update-entries/{id}/disposition (action=MAP)" }
  - { priority: 54, category: business_fiscal, check: "markup_compliance_ratio projected_markup_ratio_bp <= Facility.aggregate_markup_limit_bp", error_id: ERR_AGGREGATE_MARKUP_LIMIT, http_status: 422, applies_to: "POST /change-requests/{id}/approve, POST /charge-items/{id}/lifecycle (action=APPROVE)" }

# =============================================================================
# §1.5 API Endpoint Table  (every path is prefixed with /chargemaster except the
# test-driving clock endpoint)
# =============================================================================
endpoints:

  # ---- configuration: facility, revenue codes, departments -------------------
  - method: POST
    path: "/chargemaster/facilities"
    description: "Create a facility (governance root). chargemaster_posture starts OPEN and transparency_status starts NEEDS_REFRESH."
    roles: [SystemAdmin]
    code: 201
    input: [name, cms_certification_number, "rounding_mode?", "aggregate_markup_limit_bp?", "volume_growth_bp?", "impact_lookback_days?", "duplicate_detection_mode?"]
    output: Facility
    side_effects: ["Facility created with version = 1, all aggregates 0, chargemaster_posture = OPEN"]

  - method: GET
    path: "/chargemaster/facilities/{facility_id}"
    description: "Read a facility including its derived posture, aggregates and version (the value clients pass back as expected_facility_version)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: PATCH
    path: "/chargemaster/facilities/{facility_id}"
    description: "Update facility pricing-governance configuration."
    roles: [SystemAdmin]
    code: 200
    input: [expected_facility_version, "rounding_mode?", "aggregate_markup_limit_bp?", "volume_growth_bp?", "impact_lookback_days?", "duplicate_detection_mode?"]
    output: Facility
    side_effects: ["increments Facility.version by 1", "Facility.chargemaster_posture recomputed"]

  - method: POST
    path: "/chargemaster/revenue-codes"
    description: "Create a UB-04 revenue code reference row."
    roles: [SystemAdmin]
    code: 201
    input: [code, description, requires_hcpcs, allowed_code_types, pricing_class, "status?"]
    output: RevenueCode
    side_effects: []

  - method: GET
    path: "/chargemaster/revenue-codes"
    description: "List revenue codes."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: ["code?", "status?", "pricing_class?", "limit?", "offset?"]
    output: RevenueCode[]
    side_effects: []

  - method: GET
    path: "/chargemaster/revenue-codes/{revenue_code_id}"
    description: "Read one revenue code."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: []
    output: RevenueCode
    side_effects: []

  - method: POST
    path: "/chargemaster/revenue-codes/{revenue_code_id}/retire"
    description: "Retire a revenue code (status ACTIVE -> RETIRED). Items already ACTIVE keep billing but can no longer be activated or reactivated."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: RevenueCode
    side_effects: ["RevenueCode.status = RETIRED"]

  - method: POST
    path: "/chargemaster/departments"
    description: "Create a department under a facility."
    roles: [SystemAdmin]
    code: 201
    input: [facility_id, name, cost_center_code, manager_user_id, "allowed_revenue_code_values?"]
    output: Department
    side_effects: ["Department created with capture_hold = false and all leakage counters 0"]

  - method: GET
    path: "/chargemaster/departments"
    description: "List departments, filterable by owning facility."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: ["facility_id?", "capture_hold?", "limit?", "offset?"]
    output: Department[]
    side_effects: []

  - method: GET
    path: "/chargemaster/departments/{department_id}"
    description: "Read one department including capture_hold, unresolved_finding_amount_cents and recovered_charge_cents."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: []
    output: Department
    side_effects: []

  # ---- price rules -----------------------------------------------------------
  - method: POST
    path: "/chargemaster/price-rules"
    description: "Create a price-setting methodology rule for a (facility, revenue code) scope. Passing supersede_rule_id retires the named ACTIVE rule instead of colliding with it."
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: [facility_id, revenue_code_id, pricing_method, effective_from, "markup_tiers?", "min_medicare_multiple_bp?", "market_cap_multiple_bp?", "flat_fee_cents?", "effective_to?", "supersede_rule_id?"]
    output: PriceRule
    side_effects:
      - "Half-open overlap check against ACTIVE rules of the same scope key (ERR_PRICE_RULE_OVERLAP); the rule named by supersede_rule_id is excluded from that check"
      - "Cascade link 1: when supersede_rule_id is present that rule transitions ACTIVE -> SUPERSEDED, its effective_to is truncated to the new rule's effective_from and superseded_by_rule_id is set"
      - "Cascade link 2: every ChargeItem with applied_price_rule_id == the superseded rule transitions price_status PRICED_CURRENT -> PRICE_STALE (ChargeItem.version += 1 each)"
      - "Cascade link 3: Facility.stale_price_item_count recomputed; chargemaster_posture becomes RESTRICTED once the count is >= 5; Facility.version += 1"

  - method: GET
    path: "/chargemaster/price-rules"
    description: "List price rules, filterable by facility, revenue code, status and supersession target."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "revenue_code_id?", "superseded_by_rule_id?", "status?", "limit?", "offset?"]
    output: PriceRule[]
    side_effects: []

  - method: GET
    path: "/chargemaster/price-rules/{price_rule_id}"
    description: "Read one price rule including applied_item_count."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: []
    output: PriceRule
    side_effects: []

  # ---- payer contracts -------------------------------------------------------
  - method: POST
    path: "/chargemaster/payer-contracts"
    description: "Create a payer contract term (closed interval, notice-buffer enforced against the prior term of the same scope key)."
    roles: [ContractManager]
    code: 201
    input: [facility_id, payer_code, product_line, reimbursement_method, term_start_date, term_end_date, "percent_of_charge_bp?", "fee_schedule_cents?", "case_rate_cents?", "trailing_units?", "renegotiation_notice_days?"]
    output: PayerContract
    side_effects:
      - "Closed-interval overlap check (ERR_CONTRACT_TERM_OVERLAP) then notice-buffer check (ERR_CONTRACT_TERM_BUFFER_VIOLATION)"
      - "Every PriceChangeImpactAnalysis for the facility with status == COMPUTED transitions to STALE"

  - method: GET
    path: "/chargemaster/payer-contracts"
    description: "List payer contracts, filterable by facility and payer."
    roles: [SystemAdmin, ContractManager, ComplianceOfficer, RevenueIntegrityAnalyst, PricingCommitteeApprover]
    code: 200
    input: ["facility_id?", "payer_code?", "product_line?", "status?", "limit?", "offset?"]
    output: PayerContract[]
    side_effects: []

  - method: GET
    path: "/chargemaster/payer-contracts/{payer_contract_id}"
    description: "Read one payer contract."
    roles: [SystemAdmin, ContractManager, ComplianceOfficer, RevenueIntegrityAnalyst, PricingCommitteeApprover]
    code: 200
    input: []
    output: PayerContract
    side_effects: []

  - method: POST
    path: "/chargemaster/payer-contracts/{payer_contract_id}/terminate"
    description: "Terminate a payer contract term early (status ACTIVE -> TERMINATED)."
    roles: [ContractManager]
    code: 200
    input: ["termination_note?"]
    output: PayerContract
    side_effects:
      - "PayerContract.status = TERMINATED; version += 1"
      - "Every PriceChangeImpactAnalysis for the facility with status == COMPUTED transitions to STALE"

  # ---- charge items (chargemaster line items) --------------------------------
  - method: POST
    path: "/chargemaster/charge-items"
    description: "Create a chargemaster item in DRAFT with price_status = PRICE_STALE (never priced yet). Blocked entirely while the facility is FROZEN, and blocked for CPT/HCPCS items while the facility is RESTRICTED."
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: [facility_id, department_id, revenue_code_id, cdm_number, description, code_type, cost_basis_cents, medicare_rate_cents, market_p75_cents, effective_from, "code_value?", "companion_required_item_id?", "companion_window_hours?"]
    output: ChargeItem
    side_effects: ["ChargeItem created with lifecycle_status = DRAFT, price_status = PRICE_STALE, gross_charge_cents = 0, version = 1"]

  - method: GET
    path: "/chargemaster/charge-items"
    description: "List chargemaster items with filters; the reverse-reachability channel for every ChargeItem foreign key (including the self-referential duplicate and companion links) and for cascade-created state changes."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: ["facility_id?", "department_id?", "revenue_code_id?", "duplicate_of_item_id?", "companion_required_item_id?", "applied_price_rule_id?", "last_code_cycle_id?", "lifecycle_status?", "price_status?", "code_value?", "cdm_number?", "limit?", "offset?"]
    output: ChargeItem[]
    side_effects: []

  - method: GET
    path: "/chargemaster/charge-items/{charge_item_id}"
    description: "Read one chargemaster item including gross_charge_cents, prior_gross_charge_cents, price_conflict, both state dimensions and version (the value clients pass back as expected_charge_item_version)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: []
    output: ChargeItem
    side_effects: []

  - method: GET
    path: "/chargemaster/charge-items/{charge_item_id}/duplicate-candidates"
    description: "Read-only duplicate report: ACTIVE non-duplicate sibling items of the same facility ranked by duplicate_similarity_score DESC then created_at ASC under the facility's duplicate_detection_mode variant."
    roles: [RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: ["min_score?", "limit?", "offset?"]
    output: ChargeItem[]
    side_effects: []

  - method: POST
    path: "/chargemaster/charge-items/{charge_item_id}/reprice"
    description: "Run gross_charge_from_price_rule and settle the pricing dimension (price_status -> PRICED_CURRENT). Independent of the lifecycle dimension: a DRAFT item and an ACTIVE item are both repriceable."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeItem
    side_effects:
      - "prior_gross_charge_cents := gross_charge_cents; gross_charge_cents := gross_charge_from_price_rule output; applied_price_rule_id and price_conflict set; price_status -> PRICED_CURRENT; version += 1"
      - "When lifecycle_status == ACTIVE: Facility aggregates, stale_price_item_count, chargemaster_posture and transparency_status recomputed; any PUBLISHED TransparencyFile -> SUPERSEDED; Facility.version += 1"
      - "Every COMPUTED PriceChangeImpactAnalysis whose request targets this item -> STALE"

  - method: POST
    path: "/chargemaster/charge-items/{charge_item_id}/lifecycle"
    description: "Drive the lifecycle dimension. action IN {SUBMIT_FOR_REVIEW, RETURN_TO_DRAFT, APPROVE, ACTIVATE, DEACTIVATE, REACTIVATE, ARCHIVE, MARK_DUPLICATE}; duplicate_of_item_id is required only for MARK_DUPLICATE."
    roles: [RevenueIntegrityAnalyst, PricingCommitteeApprover]
    code: 200
    input: [action, "duplicate_of_item_id?", "note?"]
    output: ChargeItem
    side_effects:
      - "The §1.2 ChargeItem lifecycle_status transition for the given action, with its full cascade (Facility aggregates, TransparencyFile supersession, CodeUpdateEntry deferral)"
      - "increments ChargeItem.version by 1"

  # ---- department change requests --------------------------------------------
  - method: POST
    path: "/chargemaster/change-requests"
    description: "Department manager submits a chargemaster change request (status SUBMITTED). projected_gross_charge_cents and projected_markup_ratio_bp are computed at submission as a dry run."
    roles: [DepartmentManager]
    code: 201
    input: [department_id, charge_item_id, request_type, justification, "proposed_cost_basis_cents?", "proposed_revenue_code_id?", "proposed_description?"]
    output: ChangeRequest
    side_effects:
      - "ChangeRequest created with status = SUBMITTED, revision_round = 0, submitted_by_user_id = X-User-ID, version = 1"
      - "projected_gross_charge_cents := gross_charge_from_price_rule dry run; projected_markup_ratio_bp := markup_compliance_ratio"
      - "Department.open_request_count recomputed"

  - method: GET
    path: "/chargemaster/change-requests"
    description: "List change requests with filters; the reverse-reachability channel for department_id, charge_item_id and proposed_revenue_code_id."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: ["department_id?", "charge_item_id?", "proposed_revenue_code_id?", "status?", "request_type?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []

  - method: GET
    path: "/chargemaster/change-requests/{change_request_id}"
    description: "Read one change request including revision_round, pinned_charge_item_version and the segregation-of-duties actor fields."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []

  - method: POST
    path: "/chargemaster/change-requests/{change_request_id}/decisions"
    description: "Non-approval decisions. decision IN {REVIEW, REQUEST_CHANGES, REJECT, WITHDRAW}. REVIEW and REQUEST_CHANGES are analyst actions, REJECT is an approver action, WITHDRAW is the submitter's action."
    roles: [RevenueIntegrityAnalyst, PricingCommitteeApprover, DepartmentManager]
    code: 200
    input: [decision, "decision_note?"]
    output: ChangeRequest
    side_effects:
      - "The §1.2 ChangeRequest transition for the given decision; version += 1"
      - "REJECT additionally reverts ChargeItem.price_status REPRICE_PENDING -> PRICE_STALE when no other APPROVED request targets the item"

  - method: POST
    path: "/chargemaster/change-requests/{change_request_id}/approve"
    description: "Pricing committee approval (UNDER_REVIEW -> APPROVED). Requires expected_charge_item_version — the ChargeItem.version the approver last observed — and pins it for implementation."
    roles: [PricingCommitteeApprover]
    code: 200
    input: [expected_charge_item_version, "decision_note?"]
    output: ChangeRequest
    side_effects:
      - "OCC: rejects with ERR_STALE_ITEM_VERSION (412) when expected_charge_item_version != ChargeItem.version"
      - "status = APPROVED; approved_by_user_id = X-User-ID; increments ChangeRequest.version by 1"
      - "For request_type IN {PRICE_CHANGE, NEW_ITEM}: ChargeItem.price_status -> REPRICE_PENDING and increments ChargeItem.version by 1; pinned_charge_item_version stores the post-bump version"
      - "For request_type IN {DEACTIVATION, REVENUE_CODE_REMAP}: pinned_charge_item_version stores the observed version and the item is untouched"

  - method: POST
    path: "/chargemaster/change-requests/{change_request_id}/resubmit"
    description: "Department manager answers a CHANGES_REQUESTED review and pushes the request back to SUBMITTED, incrementing revision_round."
    roles: [DepartmentManager]
    code: 200
    input: [justification, "proposed_cost_basis_cents?", "proposed_revenue_code_id?", "proposed_description?"]
    output: ChangeRequest
    side_effects:
      - "revision_round += 1 (rejected once revision_round is already 3); proposed_* overwritten; reviewed_by_user_id cleared; status = SUBMITTED; version += 1"
      - "projected_gross_charge_cents and projected_markup_ratio_bp recomputed"

  - method: POST
    path: "/chargemaster/change-requests/{change_request_id}/implement"
    description: "Apply an APPROVED request to the chargemaster. Requires the pinned ChargeItem.version to still match; the branch taken depends on request_type."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: ["implementation_note?"]
    output: ChangeRequest
    side_effects:
      - "ERR_PINNED_VERSION_STALE (409) when pinned_charge_item_version != ChargeItem.version; the request remains APPROVED and nothing is mutated"
      - "status = IMPLEMENTED; version += 1; the request_type branch mutates the ChargeItem (price / revenue code / deactivation) and increments ChargeItem.version by 1"
      - "Cascade: PUBLISHED TransparencyFile -> SUPERSEDED, Facility.published_transparency_file_id cleared, transparency_status = NEEDS_REFRESH, aggregates and posture recomputed, Facility.version += 1"
      - "Cascade: other APPROVED ChangeRequests on the same item whose pin no longer matches -> VOIDED_STALE"
      - "Every COMPUTED PriceChangeImpactAnalysis for this request -> STALE"

  # ---- annual code update (CPT/HCPCS) ----------------------------------------
  - method: POST
    path: "/chargemaster/code-update-cycles"
    description: "Load an annual CPT/HCPCS code update cycle for a facility (status LOADED)."
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: [facility_id, cycle_year, code_set, "cost_inflator_bp?"]
    output: CodeUpdateCycle
    side_effects: ["CodeUpdateCycle created with status = LOADED and all entry counters 0"]

  - method: GET
    path: "/chargemaster/code-update-cycles"
    description: "List code update cycles, filterable by owning facility."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "code_set?", "cycle_year?", "status?", "limit?", "offset?"]
    output: CodeUpdateCycle[]
    side_effects: []

  - method: GET
    path: "/chargemaster/code-update-cycles/{cycle_id}"
    description: "Read one cycle including entry counters and the pre-activation snapshots used by rollback."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: []
    output: CodeUpdateCycle
    side_effects: []

  - method: POST
    path: "/chargemaster/code-update-cycles/{cycle_id}/entries"
    description: "Add a code update entry (ADD / DELETE / REVISE / CROSSWALK) to a cycle in LOADED or MAPPING status."
    roles: [RevenueIntegrityAnalyst]
    code: 201
    input: [action, "old_code_value?", "new_code_value?", "new_revenue_code_id?"]
    output: CodeUpdateEntry
    side_effects: ["CodeUpdateEntry created with status = PENDING; CodeUpdateCycle.entry_count and unmapped_entry_count recomputed; CodeUpdateCycle.version += 1"]

  - method: POST
    path: "/chargemaster/code-update-cycles/{cycle_id}/lifecycle"
    description: "Drive the cycle state machine. action IN {START_MAPPING, APPROVE_CROSSWALK, ACTIVATE, ROLL_BACK, CANCEL}."
    roles: [RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: CodeUpdateCycle
    side_effects:
      - "START_MAPPING / CANCEL flip Facility.chargemaster_posture between RESTRICTED and OPEN"
      - "ACTIVATE snapshots the facility aggregates, applies every MAPPED entry in created_at ASC order (entry -> ChargeItem -> TransparencyFile -> Facility, four cascade links)"
      - "ROLL_BACK reverts every APPLIED entry in created_at DESC order and restores Facility.active_item_count and aggregate_gross_charge_cents to the pre-activation snapshots"
      - "increments CodeUpdateCycle.version by 1"

  - method: GET
    path: "/chargemaster/code-update-entries"
    description: "List code update entries with filters; the reverse-reachability channel for cycle_id, target_charge_item_id, new_revenue_code_id and prior_revenue_code_id (entries are cascade-mutated, so this is their only discovery channel)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "target_charge_item_id?", "new_revenue_code_id?", "prior_revenue_code_id?", "status?", "action?", "limit?", "offset?"]
    output: CodeUpdateEntry[]
    side_effects: []

  - method: GET
    path: "/chargemaster/code-update-entries/{entry_id}"
    description: "Read one entry including carried_gross_charge_cents and the prior_* rollback snapshots."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: []
    output: CodeUpdateEntry
    side_effects: []

  - method: POST
    path: "/chargemaster/code-update-entries/{entry_id}/disposition"
    description: "Map or defer a PENDING entry. action IN {MAP, DEFER}; MAP resolves the target item from old_code_value and computes carried_gross_charge_cents."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: [action, "new_revenue_code_id?", "defer_reason?"]
    output: CodeUpdateEntry
    side_effects:
      - "MAP: target_charge_item_id resolved, carried_gross_charge_cents := code_update_crosswalk_price_carry, status -> MAPPED, mapped_by_user_id set"
      - "DEFER: status -> DEFERRED with defer_reason"
      - "CodeUpdateCycle.unmapped_entry_count recomputed; CodeUpdateCycle.version += 1; CodeUpdateEntry.version += 1"

  # ---- charge capture reconciliation -----------------------------------------
  - method: POST
    path: "/chargemaster/charge-capture-batches"
    description: "Ingest a charge capture batch for a department over a closed service-date window. At most two non-CLOSED batches of the department may cover any single day."
    roles: [DepartmentManager]
    code: 201
    input: [facility_id, department_id, window_start_date, window_end_date]
    output: ChargeCaptureBatch
    side_effects: ["ChargeCaptureBatch created with status = INGESTED, reconcile_pass_count = 0, all counters 0"]

  - method: GET
    path: "/chargemaster/charge-capture-batches"
    description: "List capture batches, filterable by facility and department."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: ["facility_id?", "department_id?", "status?", "limit?", "offset?"]
    output: ChargeCaptureBatch[]
    side_effects: []

  - method: GET
    path: "/chargemaster/charge-capture-batches/{batch_id}"
    description: "Read one batch including mean_line_variance_bp, exception_line_count, open_finding_count and reconcile_pass_count."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: []
    output: ChargeCaptureBatch
    side_effects: []

  - method: POST
    path: "/chargemaster/charge-capture-batches/{batch_id}/lines"
    description: "Append a captured charge line to an INGESTED batch. service_datetime must fall inside the batch's closed window."
    roles: [DepartmentManager]
    code: 201
    input: [submitted_cdm_number, encounter_id, payer_code, service_datetime, quantity, posted_charge_cents]
    output: CapturedCharge
    side_effects: ["CapturedCharge created with match_status = UNRECONCILED; ChargeCaptureBatch.line_count and total_posted_charge_cents recomputed; ChargeCaptureBatch.version += 1"]

  - method: POST
    path: "/chargemaster/charge-capture-batches/{batch_id}/reconcile"
    description: "Run a reconciliation pass (INGESTED -> RECONCILING or DISPUTED -> RECONCILING): assigns per-line match_status, computes the variance roll-up and runs missing-charge detection."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: []
    output: ChargeCaptureBatch
    side_effects:
      - "status -> RECONCILING; reconcile_pass_count += 1; version += 1"
      - "Every CapturedCharge re-evaluated (charge_item_id, expected_charge_cents, line_variance_bp, match_status)"
      - "mean_line_variance_bp per charge_capture_variance_summary (round per line, then average)"
      - "missing_charge_detection creates OPEN MissingChargeFinding rows and dismisses findings whose companion appeared on this pass"

  - method: POST
    path: "/chargemaster/charge-capture-batches/{batch_id}/lifecycle"
    description: "Drive the batch state machine. action IN {FINALIZE, DISPUTE, CLOSE}."
    roles: [RevenueIntegrityAnalyst, DepartmentManager]
    code: 200
    input: [action, "note?"]
    output: ChargeCaptureBatch
    side_effects:
      - "FINALIZE: RECONCILING -> RECONCILED; DISPUTE: RECONCILED -> DISPUTED; CLOSE: RECONCILED -> CLOSED"
      - "CLOSE requires open_finding_count == 0 and Department.capture_hold == false"
      - "increments ChargeCaptureBatch.version by 1"

  - method: GET
    path: "/chargemaster/captured-charges"
    description: "List captured charge lines with filters; the reverse-reachability channel for batch_id and charge_item_id (lines are mutated by reconcile, so this is their discovery channel)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: ["batch_id?", "charge_item_id?", "encounter_id?", "match_status?", "limit?", "offset?"]
    output: CapturedCharge[]
    side_effects: []

  - method: GET
    path: "/chargemaster/captured-charges/{captured_charge_id}"
    description: "Read one captured line including expected_charge_cents, line_variance_bp and match_status."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, ContractManager, DepartmentManager]
    code: 200
    input: []
    output: CapturedCharge
    side_effects: []

  - method: GET
    path: "/chargemaster/missing-charge-findings"
    description: "List missing-charge findings with filters; the reverse-reachability channel for batch_id, department_id, trigger_captured_charge_id, expected_charge_item_id and recovery_captured_charge_id (findings are created by cascade)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: ["batch_id?", "department_id?", "trigger_captured_charge_id?", "expected_charge_item_id?", "recovery_captured_charge_id?", "status?", "limit?", "offset?"]
    output: MissingChargeFinding[]
    side_effects: []

  - method: GET
    path: "/chargemaster/missing-charge-findings/{finding_id}"
    description: "Read one finding including estimated_lost_charge_cents (frozen at creation)."
    roles: [SystemAdmin, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer, DepartmentManager]
    code: 200
    input: []
    output: MissingChargeFinding
    side_effects: []

  - method: POST
    path: "/chargemaster/missing-charge-findings/{finding_id}/disposition"
    description: "Disposition a finding. action IN {CONFIRM, DISMISS, RESOLVE}; RESOLVE requires the late-posted companion line."
    roles: [RevenueIntegrityAnalyst]
    code: 200
    input: [action, "disposition_note?", "recovery_captured_charge_id?"]
    output: MissingChargeFinding
    side_effects:
      - "CONFIRM: status -> CONFIRMED; Department.unresolved_finding_amount_cents += estimated_lost_charge_cents; capture_hold flips true at >= 500000; Department.version += 1"
      - "RESOLVE: status -> RESOLVED; the same amount moves from unresolved_finding_amount_cents to recovered_charge_cents; capture_hold recomputed; Department.version += 1"
      - "DISMISS: status -> DISMISSED; ChargeCaptureBatch.open_finding_count recomputed"
      - "increments MissingChargeFinding.version by 1"

  # ---- payer contract impact analysis ----------------------------------------
  - method: POST
    path: "/chargemaster/price-change-analyses"
    description: "Compute the payer contract impact of a change request's price change under one of the two variants."
    roles: [ContractManager, RevenueIntegrityAnalyst]
    code: 201
    input: [change_request_id, variant]
    output: PriceChangeImpactAnalysis
    side_effects:
      - "payer_lines and total_reimbursement_delta_cents computed by payer_impact_delta for the chosen variant"
      - "analysed_charge_item_version, old_gross_charge_cents and new_gross_charge_cents snapshotted; status = COMPUTED"

  - method: GET
    path: "/chargemaster/price-change-analyses"
    description: "List impact analyses, filterable by change request; the reverse-reachability channel for change_request_id."
    roles: [SystemAdmin, ContractManager, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: ["change_request_id?", "variant?", "status?", "limit?", "offset?"]
    output: PriceChangeImpactAnalysis[]
    side_effects: []

  - method: GET
    path: "/chargemaster/price-change-analyses/{analysis_id}"
    description: "Read one impact analysis including payer_lines and total_reimbursement_delta_cents."
    roles: [SystemAdmin, ContractManager, RevenueIntegrityAnalyst, PricingCommitteeApprover, ComplianceOfficer]
    code: 200
    input: []
    output: PriceChangeImpactAnalysis
    side_effects: []

  - method: POST
    path: "/chargemaster/price-change-analyses/{analysis_id}/sign-off"
    description: "Compliance sign-off on a COMPUTED analysis whose analysed_charge_item_version still matches the live item."
    roles: [ComplianceOfficer]
    code: 200
    input: ["signoff_note?"]
    output: PriceChangeImpactAnalysis
    side_effects: ["status = SIGNED_OFF; signed_off_by_user_id = X-User-ID; version += 1"]

  # ---- transparency file -----------------------------------------------------
  - method: POST
    path: "/chargemaster/transparency-files"
    description: "Build a machine-readable transparency file for a facility (status BUILDING). Requires expected_facility_version — the Facility.version the client last observed — because the build supersedes any previously published file."
    roles: [ComplianceOfficer]
    code: 201
    input: [facility_id, file_format, expected_facility_version]
    output: TransparencyFile
    side_effects:
      - "OCC: rejects with ERR_STALE_FACILITY_VERSION (412) when expected_facility_version != Facility.version"
      - "transparency_file_build computes as_of_datetime, included_item_count, total_gross_charge_cents, payer_column_count, content_hash and validation_errors"
      - "status = BUILDING; increments Facility.version by 1 and recomputes Facility.chargemaster_posture -> FROZEN"

  - method: GET
    path: "/chargemaster/transparency-files"
    description: "List transparency files, filterable by facility and supersession target."
    roles: [SystemAdmin, ComplianceOfficer, RevenueIntegrityAnalyst, PricingCommitteeApprover, ContractManager]
    code: 200
    input: ["facility_id?", "superseded_by_file_id?", "status?", "limit?", "offset?"]
    output: TransparencyFile[]
    side_effects: []

  - method: GET
    path: "/chargemaster/transparency-files/{file_id}"
    description: "Read one transparency file including content_hash and validation_errors."
    roles: [SystemAdmin, ComplianceOfficer, RevenueIntegrityAnalyst, PricingCommitteeApprover, ContractManager]
    code: 200
    input: []
    output: TransparencyFile
    side_effects: []

  - method: POST
    path: "/chargemaster/transparency-files/{file_id}/lifecycle"
    description: "Drive the transparency file state machine. action IN {VALIDATE, PUBLISH, FAIL}. VALIDATE routes to VALIDATED or FAILED depending on validation_errors."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: TransparencyFile
    side_effects:
      - "VALIDATE recomputes transparency_file_build; empty validation_errors -> VALIDATED and every ACTIVE PRICED_CURRENT item is frozen (price_status -> PRICE_FROZEN); non-empty -> FAILED"
      - "PUBLISH -> PUBLISHED, supersedes any prior PUBLISHED file, thaws every PRICE_FROZEN item, sets Facility.published_transparency_file_id and transparency_status = CURRENT"
      - "FAIL from VALIDATED thaws every PRICE_FROZEN item and leaves the facility without a published file"
      - "increments TransparencyFile.version by 1 and Facility.version by 1"

  # ---- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it NEVER falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical now := to_iso8601 for every subsequent request"
      - "Every PayerContract with status == ACTIVE whose term_end_date < the new logical now transitions to EXPIRED"

# =============================================================================
# §1.6 Error Code Catalog (every id is referenced by at least one §1.2 transition
# precondition or §1.4 validation row)
# =============================================================================
errors:
  # -- auth / authorization ---------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Acting role is not listed in the endpoint's roles" }
  - { id: ERR_DEPARTMENT_SCOPE_VIOLATION, http: 403, condition: "DepartmentManager's X-User-ID is not the manager_user_id of the department owning the target resource, or a WITHDRAW/resubmit is attempted by someone other than submitted_by_user_id" }

  # -- existence --------------------------------------------------------------
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility_id does not resolve to a Facility" }
  - { id: ERR_CHARGE_ITEM_NOT_FOUND, http: 404, condition: "charge_item_id in the path does not resolve to a ChargeItem" }
  - { id: ERR_CHANGE_REQUEST_NOT_FOUND, http: 404, condition: "change_request_id in the path does not resolve to a ChangeRequest" }
  - { id: ERR_CODE_UPDATE_NOT_FOUND, http: 404, condition: "cycle_id or entry_id in the path does not resolve" }
  - { id: ERR_CAPTURE_RESOURCE_NOT_FOUND, http: 404, condition: "batch_id, captured_charge_id or finding_id in the path does not resolve" }
  - { id: ERR_GOVERNANCE_RESOURCE_NOT_FOUND, http: 404, condition: "file_id, analysis_id, price_rule_id, payer_contract_id, department_id or revenue_code_id in the path does not resolve" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "A foreign key supplied in the request body does not resolve (validated left-to-right)" }
  - { id: ERR_CROSSWALK_TARGET_NOT_FOUND, http: 404, condition: "MAP found no ChargeItem in the facility with code_value == old_code_value in lifecycle_status IN {ACTIVE, INACTIVE, APPROVED}" }

  # -- schema -----------------------------------------------------------------
  - { id: ERR_VALIDATION, http: 422, condition: "Payload violates the schema: missing required field, illegal enum member, negative amount, quantity < 1, justification shorter than 10 characters, malformed ISO 8601, unsorted markup_tiers, first tier min_cost_basis_cents != 0, effective_to <= effective_from, term_end_date < term_start_date, window_end_date < window_start_date, empty defer_reason or disposition_note where required, or limit/offset out of range" }

  # -- state / posture / OCC ---------------------------------------------------
  - { id: ERR_INVALID_ITEM_LIFECYCLE_STATE, http: 409, condition: "The requested lifecycle action is not declared from the item's current lifecycle_status (e.g. ARCHIVE from ACTIVE, APPROVE from DRAFT, reprice on an ARCHIVED item)" }
  - { id: ERR_INVALID_ITEM_PRICE_STATE, http: 409, condition: "The requested pricing effect is not declared from the item's current price_status (e.g. implementing a PRICE_CHANGE request against an item that is not REPRICE_PENDING)" }
  - { id: ERR_INVALID_REQUEST_STATE, http: 409, condition: "The requested ChangeRequest decision, resubmit or implement is not declared from the request's current status" }
  - { id: ERR_INVALID_CYCLE_STATE, http: 409, condition: "The requested CodeUpdateCycle action is not declared from its current status, entries are added to a cycle past MAPPING, or CANCEL is attempted with applied_entry_count > 0" }
  - { id: ERR_INVALID_ENTRY_STATE, http: 409, condition: "A CodeUpdateEntry disposition was attempted on an entry whose status is not PENDING" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "The requested batch action is not declared from its current status, a line is appended to a batch that is not INGESTED, or a finding is dispositioned while its batch is CLOSED" }
  - { id: ERR_INVALID_FINDING_STATE, http: 409, condition: "The requested finding disposition is not declared from its current status (e.g. RESOLVE on an OPEN finding, CONFIRM on a DISMISSED finding)" }
  - { id: ERR_INVALID_FILE_STATE, http: 409, condition: "The requested transparency-file action is not declared from its current status (e.g. PUBLISH from BUILDING, VALIDATE from PUBLISHED)" }
  - { id: ERR_INVALID_ANALYSIS_STATE, http: 409, condition: "Sign-off attempted on an analysis whose status is not COMPUTED" }
  - { id: ERR_FACILITY_FROZEN, http: 409, condition: "Facility.chargemaster_posture == FROZEN (a TransparencyFile is BUILDING or VALIDATED) and the request is a posture-gated write" }
  - { id: ERR_FACILITY_RESTRICTED, http: 409, condition: "Facility.chargemaster_posture == RESTRICTED and the request creates a CPT/HCPCS item or approves a REVENUE_CODE_REMAP request" }
  - { id: ERR_STALE_ITEM_VERSION, http: 412, condition: "expected_charge_item_version does not equal the live ChargeItem.version on approve" }
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version does not equal the live Facility.version on transparency build or facility patch" }

  # -- compliance / segregation of duties --------------------------------------
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Reviewer equals submitter, approver equals submitter or reviewer, crosswalk approver equals an entry mapper, or REQUEST_CHANGES is issued by someone other than the reviewer of record" }
  - { id: ERR_REQUEST_NOT_REVIEWED, http: 409, condition: "Approve attempted while ChangeRequest.reviewed_by_user_id is null" }
  - { id: ERR_TRANSPARENCY_BLACKOUT, http: 409, condition: "Publish attempted while a CodeUpdateCycle of the facility is in MAPPING or CROSSWALK_APPROVED" }
  - { id: ERR_UNMAPPED_CODE_ENTRIES, http: 409, condition: "APPROVE_CROSSWALK attempted while unmapped_entry_count > 0" }
  - { id: ERR_ANALYSIS_SIGNOFF_STALE, http: 409, condition: "Sign-off attempted on a STALE analysis, or on a COMPUTED analysis whose analysed_charge_item_version no longer matches the live item" }

  # -- referential integrity ---------------------------------------------------
  - { id: ERR_REVENUE_CODE_MAPPING_INVALID, http: 422, condition: "code_type is not in RevenueCode.allowed_code_types, or the revenue code requires HCPCS/CPT and the item has no code_value" }
  - { id: ERR_DEPARTMENT_REVENUE_CODE_NOT_ALLOWED, http: 422, condition: "Department.allowed_revenue_code_values is non-empty and does not contain the mapped RevenueCode.code" }
  - { id: ERR_REVENUE_CODE_RETIRED, http: 409, condition: "Activation or reactivation attempted while the mapped RevenueCode.status == RETIRED" }
  - { id: ERR_COMPANION_ITEM_INVALID, http: 422, condition: "companion_required_item_id is the item itself, belongs to another facility, or references an ARCHIVED item" }
  - { id: ERR_DUPLICATE_TARGET_INVALID, http: 422, condition: "duplicate_of_item_id is the item itself, belongs to another facility, is not ACTIVE, or is itself flagged as a duplicate" }
  - { id: ERR_CROSSWALK_TARGET_AMBIGUOUS, http: 409, condition: "More than one ChargeItem in the facility matches old_code_value" }
  - { id: ERR_PINNED_VERSION_STALE, http: 409, condition: "ChangeRequest.pinned_charge_item_version no longer equals ChargeItem.version at implement time" }
  - { id: ERR_RECOVERY_LINE_INVALID, http: 422, condition: "recovery_captured_charge_id is outside the finding's batch or its charge_item_id differs from expected_charge_item_id" }

  # -- temporal ----------------------------------------------------------------
  - { id: ERR_EFFECTIVE_DATE_IN_PAST, http: 422, condition: "ChargeItem.effective_from is earlier than the logical now at creation" }
  - { id: ERR_ITEM_NOT_YET_EFFECTIVE, http: 409, condition: "Activation attempted while effective_from is later than the logical now" }
  - { id: ERR_PRICE_RULE_OVERLAP, http: 409, condition: "A new PriceRule's half-open [effective_from, effective_to) interval intersects an ACTIVE rule of the same (facility_id, revenue_code_id) scope key; abutting intervals do not collide" }
  - { id: ERR_CONTRACT_TERM_OVERLAP, http: 409, condition: "A new PayerContract's closed [term_start_date, term_end_date] interval intersects a term of the same (facility_id, payer_code, product_line) scope key; abutting terms DO collide" }
  - { id: ERR_CONTRACT_TERM_BUFFER_VIOLATION, http: 409, condition: "The gap between the prior term's end and the new term's start is less than or exactly renegotiation_notice_days days" }
  - { id: ERR_BATCH_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "Some calendar day inside the new batch window would be covered by a third non-CLOSED batch of the same department" }
  - { id: ERR_SERVICE_DATE_OUTSIDE_WINDOW, http: 422, condition: "A captured line's service_datetime falls outside the batch's closed window" }

  # -- constraint --------------------------------------------------------------
  - { id: ERR_DUPLICATE_CDM_NUMBER, http: 409, condition: "cdm_number already exists within the facility" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "cms_certification_number, cost_center_code within a facility, RevenueCode.code, or (facility_id, code_set, cycle_year) already exists" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 409, condition: "Resubmit attempted while revision_round is already 3" }
  - { id: ERR_BATCH_HAS_NO_LINES, http: 422, condition: "Reconcile attempted on a batch with line_count == 0" }
  - { id: ERR_CYCLE_HAS_NO_ENTRIES, http: 422, condition: "START_MAPPING attempted on a cycle with entry_count == 0" }
  - { id: ERR_CYCLE_HAS_NO_MAPPED_ENTRIES, http: 422, condition: "APPROVE_CROSSWALK attempted on a cycle whose entries are all DEFERRED" }
  - { id: ERR_NOTHING_TO_DISPUTE, http: 422, condition: "DISPUTE attempted on a batch with exception_line_count == 0" }
  - { id: ERR_NO_PUBLISHABLE_ITEMS, http: 422, condition: "Publish attempted with included_item_count == 0 (empty inclusion set)" }
  - { id: ERR_BATCH_LINES_UNRECONCILED, http: 409, condition: "FINALIZE attempted while at least one CapturedCharge still has match_status == UNRECONCILED" }
  - { id: ERR_FINDINGS_OPEN, http: 409, condition: "CLOSE attempted while open_finding_count > 0" }
  - { id: ERR_DEPARTMENT_CAPTURE_HOLD, http: 409, condition: "Department.capture_hold == true blocks batch ingestion and batch closure" }
  - { id: ERR_ITEM_IN_OPEN_BATCH, http: 409, condition: "Deactivation, duplicate retirement or archival attempted while the item has captured lines in an unsettled batch" }
  - { id: ERR_ITEM_HAS_OPEN_REQUEST, http: 409, condition: "Archival attempted while an open ChangeRequest targets the item, or cycle activation attempted while an APPROVED request targets a mapped item" }
  - { id: ERR_ITEM_PENDING_CODE_UPDATE, http: 409, condition: "Activation attempted while a MAPPED entry of a CROSSWALK_APPROVED cycle targets the item" }
  - { id: ERR_DUPLICATE_SIMILARITY_TOO_LOW, http: 422, condition: "duplicate_similarity_score under the facility's variant is below 0.8000" }
  - { id: ERR_ITEM_PRICE_NOT_CURRENT, http: 409, condition: "Approve or reactivate attempted while price_status != PRICED_CURRENT" }
  - { id: ERR_ITEM_PRICE_FROZEN, http: 409, condition: "Reprice attempted while price_status == PRICE_FROZEN by a pending transparency publication" }
  - { id: ERR_ITEM_RETIRED_AS_DUPLICATE, http: 409, condition: "Reactivate attempted on an item whose duplicate_of_item_id is set" }

  # -- fiscal ------------------------------------------------------------------
  - { id: ERR_NO_APPLICABLE_PRICE_RULE, http: 422, condition: "price_rule_selector's candidate set is empty for the item's (facility_id, revenue_code_id) scope at the logical now" }
  - { id: ERR_AGGREGATE_MARKUP_LIMIT, http: 422, condition: "markup_compliance_ratio's projected_markup_ratio_bp exceeds Facility.aggregate_markup_limit_bp" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Configures facilities, revenue-code reference data, departments and the logical clock. Never touches item pricing or approvals."
    identity: opaque
    exclusive_operations:
      - "POST /chargemaster/facilities"
      - "PATCH /chargemaster/facilities/{facility_id}"
      - "POST /chargemaster/revenue-codes"
      - "POST /chargemaster/revenue-codes/{revenue_code_id}/retire"
      - "POST /chargemaster/departments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints except GET /chargemaster/charge-items/{charge_item_id}/duplicate-candidates"

  - name: RevenueIntegrityAnalyst
    description: "Owns chargemaster maintenance: drafts items, reprices, cleans up duplicates and inactive items, reviews department requests, maps annual code updates, and reconciles charge capture."
    identity: opaque
    exclusive_operations:
      - "POST /chargemaster/charge-items"
      - "POST /chargemaster/charge-items/{charge_item_id}/reprice"
      - "POST /chargemaster/price-rules"
      - "POST /chargemaster/code-update-cycles"
      - "POST /chargemaster/code-update-cycles/{cycle_id}/entries"
      - "POST /chargemaster/code-update-entries/{entry_id}/disposition"
      - "POST /chargemaster/change-requests/{change_request_id}/implement"
      - "POST /chargemaster/charge-capture-batches/{batch_id}/reconcile"
      - "POST /chargemaster/missing-charge-findings/{finding_id}/disposition"
    shared_operations:
      - "POST /chargemaster/charge-items/{charge_item_id}/lifecycle (actions SUBMIT_FOR_REVIEW, RETURN_TO_DRAFT, DEACTIVATE, ARCHIVE, MARK_DUPLICATE) — shared with PricingCommitteeApprover"
      - "POST /chargemaster/change-requests/{change_request_id}/decisions (REVIEW, REQUEST_CHANGES)"
      - "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle (START_MAPPING)"
      - "POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle (FINALIZE, CLOSE)"
      - "POST /chargemaster/price-change-analyses"
      - "GET /chargemaster/charge-items/{charge_item_id}/duplicate-candidates and all other GET endpoints"
    note: "Segregation of duties: an analyst who reviews a ChangeRequest can never approve it, and the analyst who mapped a code-update entry can never approve that cycle's crosswalk."

  - name: PricingCommitteeApprover
    description: "Approves prices: item approval/activation and ChangeRequest approval, plus annual crosswalk approval."
    identity: opaque
    exclusive_operations:
      - "POST /chargemaster/change-requests/{change_request_id}/approve"
      - "POST /chargemaster/charge-items/{charge_item_id}/lifecycle (actions APPROVE, ACTIVATE, REACTIVATE)"
    shared_operations:
      - "POST /chargemaster/change-requests/{change_request_id}/decisions (REJECT)"
      - "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle (APPROVE_CROSSWALK)"
      - "All GET endpoints"
    note: "May never be the submitter or the reviewer of the request it approves (ERR_SEGREGATION_OF_DUTIES)."

  - name: ComplianceOfficer
    description: "Owns price transparency publication, impact-analysis sign-off, and the activation/rollback of annual code update cycles."
    identity: opaque
    exclusive_operations:
      - "POST /chargemaster/transparency-files"
      - "POST /chargemaster/transparency-files/{file_id}/lifecycle"
      - "POST /chargemaster/price-change-analyses/{analysis_id}/sign-off"
      - "POST /chargemaster/code-update-cycles/{cycle_id}/lifecycle (actions ACTIVATE, ROLL_BACK, CANCEL)"
    shared_operations:
      - "All GET endpoints including GET /chargemaster/charge-items/{charge_item_id}/duplicate-candidates"

  - name: ContractManager
    description: "Owns payer contract terms and runs payer impact analyses of proposed price changes."
    identity: opaque
    exclusive_operations:
      - "POST /chargemaster/payer-contracts"
      - "POST /chargemaster/payer-contracts/{payer_contract_id}/terminate"
    shared_operations:
      - "POST /chargemaster/price-change-analyses — shared with RevenueIntegrityAnalyst"
      - "All GET endpoints except GET /chargemaster/charge-items/{charge_item_id}/duplicate-candidates"

  - name: DepartmentManager
    description: "Requests chargemaster changes for one department and submits that department's charge capture batches. X-User-ID must equal Department.manager_user_id."
    identity: "entity_backed:Department"
    exclusive_operations:
      - "POST /chargemaster/change-requests"
      - "POST /chargemaster/change-requests/{change_request_id}/resubmit"
      - "POST /chargemaster/charge-capture-batches"
      - "POST /chargemaster/charge-capture-batches/{batch_id}/lines"
    shared_operations:
      - "POST /chargemaster/change-requests/{change_request_id}/decisions (WITHDRAW only, and only for own submissions)"
      - "POST /chargemaster/charge-capture-batches/{batch_id}/lifecycle (DISPUTE only)"
      - "GET endpoints scoped to the facility and department the manager belongs to"
    note: "identity is entity_backed:Department — X-User-ID is compared against Department.manager_user_id, which is the id-bearing field this role acts through (a Department row may name only one manager_user_id)."

