  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2, different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bind_state_beats_license_safety
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: |
          Category pair state(priority 5) vs business_safety(priority 8): a policy
          that is already BOUND and whose producer also lacks an ACTIVE license,
          when bound again, returns ERR_INVALID_STATE (the lower-numbered state
          check), not ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "A BOUND policy (already bound once); its producer's license has since been omitted-equivalent (no active license matching) so binding again would also fail the safety check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier C5", naic_code: "55001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto C5", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod C5", npn: "NPN551", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2026-06-15T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct C5", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state precondition, priority 5, beats ERR_LICENSE_NOT_ACTIVE at priority 8)"
            - "Policy.${pol_id}.status == BOUND (unchanged)"

      - name: cancel_temporal_beats_state
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - state_machines.Policy.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Category pair state(priority 5) vs business_temporal(priority 15): a
          QUOTED policy (wrong state) given a cancellation_date outside its term
          returns ERR_INVALID_STATE (priority 5), not ERR_CANCEL_OUT_OF_TERM
          (priority 15) — a different category pairing than the bind conflict.
        test_recipe:
          setup:
            - "A QUOTED policy (never activated); the cancel attempt also carries an out-of-term cancellation_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier C5b", naic_code: "55002", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto C5b", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod C5b", npn: "NPN552", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct C5b", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v}", cancellation_date: "2030-01-01T00:00:00Z", cancellation_reason: "INSURED_REQUEST" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (priority 5) beats ERR_CANCEL_OUT_OF_TERM (priority 15)"
            - "Policy.${pol_id}.status == QUOTED (unchanged)"

  # =================================================================
  # Rule 6 — boundary_precision_check (>= 2, different metrics + endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
