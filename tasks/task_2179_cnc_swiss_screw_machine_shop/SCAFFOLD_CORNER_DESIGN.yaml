  - name: offset_drift_threshold_fires_at_exactly_the_limit
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.tool_wear_state
    - entities.ToolAssignment.fields.drift_limit_um
    - state_machines.ToolAssignment.IN_SERVICE_to_OFFSET_HOLD
    distinguishing_aspect: |
      The drift accumulator is cumulative and the comparison is inclusive on the absolute value: logs of +3 then +4 leave the station IN_SERVICE at 7 microns, and a further -1 leaves it at 6, while a station driven to exactly -8 by +3 then -11 is held.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Machines SW-01 and SW-02 each carry one IN_SERVICE station rated 1500 pieces with drift_limit_um 8.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          m1: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-02
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          m2: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${m1}
          station: 5
          tool_code: TA
          expected_life_pieces: 1500
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          t1: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${m2}
          station: 5
          tool_code: TB
          expected_life_pieces: 1500
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          t2: $.data.id
      - call: POST /swiss-shop/tool-assignments/${t1}/offset-logs
        payload:
          pieces_produced: 10
          measured_drift_um: 3
        as: Machinist
        as_user_id: ${op_mach}
      - call: POST /swiss-shop/tool-assignments/${t2}/offset-logs
        payload:
          pieces_produced: 10
          measured_drift_um: 3
        as: Machinist
        as_user_id: ${op_mach}
      trigger:
      - call: POST /swiss-shop/tool-assignments/${t1}/offset-logs
        payload:
          pieces_produced: 10
          measured_drift_um: 4
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          u_status: $.data.status
          u_drift: $.data.cumulative_drift_um
      - call: POST /swiss-shop/tool-assignments/${t1}/offset-logs
        payload:
          pieces_produced: 10
          measured_drift_um: -1
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          u2_status: $.data.status
          u2_drift: $.data.cumulative_drift_um
      - call: POST /swiss-shop/tool-assignments/${t2}/offset-logs
        payload:
          pieces_produced: 10
          measured_drift_um: -11
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          h_status: $.data.status
          h_drift: $.data.cumulative_drift_um
      assert:
      - ${u_drift} == 7
      - ${u_status} == IN_SERVICE
      - ${u2_drift} == 6
      - ${u2_status} == IN_SERVICE
      - ${h_drift} == -8
      - ${h_status} == OFFSET_HOLD
      - ToolAssignment.${t1}.pieces_since_index == 30
      - Machine.${m1}.status == AVAILABLE
      - Machine.${m2}.status == DOWN
