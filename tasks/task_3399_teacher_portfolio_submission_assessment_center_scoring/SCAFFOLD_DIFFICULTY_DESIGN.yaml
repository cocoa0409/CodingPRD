        distinguishing_aspect: "Category pair {business_constraint, business_safety}: an assignment request carrying BOTH submission_id and benchmark_id for a same-district assessor violates the target-shape constraint and the conflict-of-interest bar; the constraint (priority 7) wins with 422 ERR_ASSIGNMENT_TARGET_AMBIGUOUS, never the 403 safety error."
