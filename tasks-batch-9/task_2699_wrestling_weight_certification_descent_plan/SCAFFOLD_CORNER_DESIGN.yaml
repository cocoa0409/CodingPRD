            - "The suspension moved Assessor ${assessor_id} to status 'SUSPENDED' and cascaded Assessment ${assess_a} to status 'VOIDED' with void_reason == 'ASSESSOR_SUSPENDED'"
            - "${e_finalize} == 'ERR_ASSESSMENT_INVALID_STATE' (409) — a VOIDED assessment cannot be finalized"
            - "${e_suspend} == 'ERR_ASSESSOR_INVALID_STATE' (409) — SUSPENDED is terminal, so there is no SUSPENDED -> SUSPENDED hop"
            - "${audit_outcome} == 'INCONCLUSIVE' and the audit status is 'FINALIZED' with discrepancy_score == null (0 samples is below audit_min_sample_count 3)"
            - "${e_audit} == 'ERR_AUDIT_INVALID_STATE' (409) — FINALIZED is terminal"
            - "GET /assessments/${assess_a} still shows status 'VOIDED', min_certified_weight_lbs == null and min_weight_class_lbs == null; the refused finalize computed nothing"
            - "Wrestler ${wrestler_a}.certification_status is still 'UNCERTIFIED' — the voided draft never produced figures"

