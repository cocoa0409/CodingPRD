              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v_create: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v_assign: $.data.version }
          trigger:
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v_assign}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v_hold: $.data.version }
          assert:
            - "v_create == 1; v_assign == 2; the booking's version after the hold create == 3"

      - name: derived_balance_due_reconciles_after_payment
        claim_type: derived_field_reconciliation
        grounds: ["entities.Booking.fields.balance_due_cents", "entities.Booking.fields.amount_paid_cents", "calculations.milestone_schedule"]
        distinguishing_aspect: "After confirm (charge 3135200) and a 783800 deposit, balance_due_cents reconciles to 2351400; a further 500000 payment drops it to 1851400."
        test_recipe:
          setup: ["Confirmed booking charge 3135200; deposit 783800 paid"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "S", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cc", email: "cor24@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 500000, method: "CARD" }
              as: FinanceOfficer
            - call: "GET /bookings/${booking_id}"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { bal: $.data.balance_due_cents, paid: $.data.amount_paid_cents }
          assert:
            - "Booking.${booking_id}.amount_paid_cents == 1283800 and balance_due_cents == 1851400 (3135200 - 1283800)"

      - name: cascade_confirm_commits_all_held_holds
        claim_type: cascading_side_effects
        grounds: ["state_machines.Booking.HELD_to_CONFIRMED", "state_machines.SpaceHold.HELD_to_COMMITTED"]
        distinguishing_aspect: "Confirm cascades: both HELD SpaceHolds (ceremony + reception) transition to COMMITTED in the same request."
        excluded_because:
          difficulty_instance: compensating_invariant / reschedule_conserves_distinct_committed_space_count
          rationale: "The HELD->COMMITTED commit-on-confirm cascade is exercised as the precondition state of the reschedule conservation §1.8 instance, which asserts the two holds are COMMITTED."

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_charge_visible_in_confirm_response
        claim_type: immediate
        grounds: ["entities.Booking.fields.event_charge_cents", "state_machines.Booking.HELD_to_CONFIRMED"]
        distinguishing_aspect: "The provisional event_charge_cents (3135200) is present in the same confirm response, not lagged to a later read."
        excluded_because:
          difficulty_instance: combinatorial_formula / fb_floor_max_with_service_then_tax_nesting
          rationale: "That §1.8 instance captures event_charge_cents directly from the confirm response, proving immediate visibility."
