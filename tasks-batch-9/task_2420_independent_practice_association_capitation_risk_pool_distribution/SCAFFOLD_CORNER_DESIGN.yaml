          setup:
            - "Agreement AGR_C5, same money shape as AGR_C4, pool RESERVED at 3380 under COMPLETION_FACTOR, and the single ACTIVE physician holds a FINAL 2026 scorecard (9000/8000/7000 -> composite 8200, release 7500)."
