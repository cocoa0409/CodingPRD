# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Blood Donation Center — breadth probe over §1.1-§1.7 claims not in §1.8.
# section/claim_type values come verbatim from references/claim-extraction-guide.md.
# Every active instance's setup_api_calls/trigger chain is executable from
# empty-DB using only §1.5 endpoints. excluded_because stubs cite a §1.8 instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_center_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.DonationCenter, endpoints]
        distinguishing_aspect: "POST /blood-bank/centers with name+region_code -> 201; response carries id, current_utc default 1970-01-01T00:00:00.000Z, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/centers"
              payload: { name: "Coastal Blood", region_code: "US-WA" }
              as: CenterAdmin
              captures: { cid: $.data.id, cur: $.data.current_utc, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "DonationCenter.current_utc == 1970-01-01T00:00:00.000Z"
            - "DonationCenter.version == 1"

      - name: register_donor_missing_required_blood_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Donor.fields.blood_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting blood_type (source:input, no default) on POST /blood-bank/donors -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A center exists."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Coastal Blood", region_code: "US-WA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "No Type", date_of_birth: "1990-01-01", weight_kg: 70 }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: get_donor_nonexistent_id_returns_donor_not_found
        claim_type: Not Found
        grounds:
          - entities.Donor
          - "errors[ERR_DONOR_NOT_FOUND]"
        distinguishing_aspect: "GET /blood-bank/donors/{id} with a random UUID -> ERR_DONOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /blood-bank/donors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DONOR_NOT_FOUND"
            - "HTTP status == 404"

      - name: donor_underage_eligibility_computed_from_dob
        claim_type: Computed Fields
        grounds: [entities.Donor.fields.eligibility_status, entities.Donor.fields.date_of_birth]
        distinguishing_aspect: "A donor born 2008-06-01 registered at current_utc 2025-01-01 (age 16) gets eligibility_status UNDERAGE (computed; input eligibility ignored)."
        test_recipe:
          setup: ["Center clock at 2025-01-01."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Coastal Blood", region_code: "US-WA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Teen Tess", date_of_birth: "2008-06-01", weight_kg: 55, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { elig: $.data.eligibility_status }
          assert:
            - "Donor.eligibility_status == UNDERAGE (age 16 < 18 at 2025-01-01)"

      - name: register_donor_invalid_blood_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Donor.fields.blood_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /blood-bank/donors with blood_type 'Z_POS' (not an enum member) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A center exists."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Coastal Blood", region_code: "US-WA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Bad Enum", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "Z_POS" }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: list_donors_pagination_envelope
        claim_type: Listing
        grounds: [entities.Donor, endpoints]
        distinguishing_aspect: "GET /blood-bank/donors returns an array envelope with response_type array and pagination fields total_count/has_more."
        test_recipe:
          setup: ["A center with two donors."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Coastal Blood", region_code: "US-WA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "D One", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "D Two", date_of_birth: "1991-01-01", weight_kg: 72, blood_type: "A_POS" }
              as: IntakeNurse
          trigger:
            - call: "GET /blood-bank/donors?center_id=${cid}&limit=1&offset=0"
              payload: {}
              as: IntakeNurse
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true with limit 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: checkin_already_checked_in_returns_not_scheduled
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - "errors[ERR_APPOINTMENT_NOT_SCHEDULED]"
        distinguishing_aspect: "Calling check-in twice: the second call hits an appointment in CHECKED_IN -> ERR_APPOINTMENT_NOT_SCHEDULED (409); no side effects fire."
        test_recipe:
          setup: ["An eligible donor with a CHECKED_IN appointment."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Dup Checkin", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_NOT_SCHEDULED"
            - "HTTP status == 409"

      - name: lift_already_lifted_deferral_returns_not_active
        claim_type: Idempotency
        grounds:
          - state_machines.Deferral.ACTIVE_to_LIFTED
          - "errors[ERR_DEFERRAL_NOT_ACTIVE]"
        distinguishing_aspect: "Lifting a LIFTED deferral a second time -> ERR_DEFERRAL_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A donor with a TEMPORARY TRAVEL deferral already LIFTED."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Lift Twice", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/deferrals"
              payload: { donor_id: "${did}", category: "TRAVEL", kind: "TEMPORARY", reason: "short trip", duration_days: 21 }
              as: IntakeNurse
              captures: { defid: $.data.id }
            - call: "POST /blood-bank/deferrals/${defid}/lift"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/deferrals/${defid}/lift"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEFERRAL_NOT_ACTIVE"

      - name: reserve_terminal_issued_unit_returns_not_available
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.BloodUnit.RESERVED_to_ISSUED
          - "errors[ERR_UNIT_NOT_AVAILABLE]"
        distinguishing_aspect: "An ISSUED unit (terminal) cannot be reserved -> ERR_UNIT_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["An AVAILABLE unit reserved then issued (now ISSUED)."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Issued Donor", date_of_birth: "1985-01-01", weight_kg: 75, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 75, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${aid}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { donid: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${donid}", component: "RBC", din: "DIN-ISS-001" }
              as: LabTechnician
              captures: { uid: $.data.id }
            - call: "POST /blood-bank/donations/${donid}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /blood-bank/blood-units/${uid}/reserve"
              payload: {}
              as: InventoryManager
            - call: "POST /blood-bank/blood-units/${uid}/issue"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /blood-bank/blood-units/${uid}/reserve"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_AVAILABLE (ISSUED is terminal)"

      - name: no_show_before_slot_window_ends_returns_slot_window_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_NO_SHOW
          - "validations[priority=11]"
          - "errors[ERR_SLOT_WINDOW_OPEN]"
        distinguishing_aspect: "Marking no-show while current_utc < slot.ends_at -> ERR_SLOT_WINDOW_OPEN (409)."
        test_recipe:
          setup: ["A CHECKED_IN appointment whose slot ends_at is 2025-01-01T18:00 while clock is 2025-01-01T09:00."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T09:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Early NoShow", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments/${aid}/no-show"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_WINDOW_OPEN (current_utc 09:00 < ends_at 18:00)"

      - name: temporary_deferral_auto_expires_on_clock_advance
        claim_type: Side Effect Execution
        grounds: [state_machines.Deferral.ACTIVE_to_EXPIRED, entities.Donor.fields.eligibility_status]
        distinguishing_aspect: "A TEMPORARY 14-day deferral created at 2025-01-01 auto-EXPIRES when the clock advances to 2025-01-15 (>= expires_at); donor returns to ELIGIBLE."
        test_recipe:
          setup: ["A donor with a TEMPORARY MEDICATION deferral (14d) at 2025-01-01; advance clock to 2025-01-15."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Temp Expire", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/deferrals"
              payload: { donor_id: "${did}", category: "MEDICATION", kind: "TEMPORARY", reason: "antibiotic course", duration_days: 14 }
              as: IntakeNurse
              captures: { defid: $.data.id }
          trigger:
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-15T00:00:00.000Z" }
              as: CenterAdmin
            - call: "GET /blood-bank/deferrals/${defid}"
              payload: {}
              as: IntakeNurse
              captures: { dstatus: $.data.status }
            - call: "GET /blood-bank/donors/${did}"
              payload: {}
              as: IntakeNurse
              captures: { elig: $.data.eligibility_status }
          assert:
            - "Deferral.${defid}.status == EXPIRED (current_utc 2025-01-15 >= expires_at 2025-01-15)"
            - "Donor.${did}.eligibility_status == ELIGIBLE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: hemoglobin_at_exact_floor_passes_screening
        claim_type: Constants Applied
        grounds: [calculations.screening_outcome, entities.HealthScreening.fields.outcome]
        distinguishing_aspect: "hemoglobin_g_dl exactly 12.5 (== UNISEX_HGB_FLOOR) PASSES the hemoglobin check (boundary >=)."
        test_recipe:
          setup: ["A CHECKED_IN appointment; screening with hemoglobin 12.5 and otherwise-passing vitals."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Floor Hgb", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 12.5, systolic_bp: 120, pulse_bpm: 70, weight_kg: 70, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
              captures: { outcome: $.data.outcome }
          assert:
            - "HealthScreening.outcome == PASS (12.5 == floor satisfies >=)"

      - name: screening_travel_risk_auto_raises_temporary_deferral
        claim_type: Correct Result
        grounds: [calculations.screening_outcome, state_machines.Deferral, entities.Deferral.fields.category]
        distinguishing_aspect: "A screening with recent_travel_risk true fails with TRAVEL_RISK and auto-raises a TEMPORARY TRAVEL deferral (21d); donor -> TEMP_DEFERRED."
        test_recipe:
          setup: ["A CHECKED_IN appointment; screening flags travel risk."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Travis Travel", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "A_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 70, recent_travel_risk: true, disqualifying_medication: false }
              as: IntakeNurse
              captures: { outcome: $.data.outcome, reason: $.data.failure_reason }
            - call: "GET /blood-bank/deferrals?donor_id=${did}"
              payload: {}
              as: IntakeNurse
              captures: { dcat: "$.data[0].category", dkind: "$.data[0].kind" }
          assert:
            - "HealthScreening.outcome == FAIL and failure_reason == TRAVEL_RISK"
            - "A Deferral exists with category == TRAVEL and kind == TEMPORARY"
            - "Donor.${did}.eligibility_status == TEMP_DEFERRED"

      - name: plasma_per_collection_cap_at_band_boundary_passes
        claim_type: Correct Result
        grounds:
          - calculations.plasma_volume_cap
          - "validations[priority=8.3]"
        distinguishing_aspect: "A 60 kg donor (band cap 690) donating exactly 690 mL plasma passes the per-collection cap (volume_ml <= cap), creating a COLLECTED donation."
        test_recipe:
          setup: ["A CHECKED_IN PLASMA appointment with a PASS screening (weight 60); collect exactly 690 mL."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Plasma Center", region_code: "US-TX" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Cap Edge", date_of_birth: "1990-01-01", weight_kg: 60, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "PLASMA", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 13.5, systolic_bp: 120, pulse_bpm: 70, weight_kg: 60, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments/${aid}/donations"
              payload: { volume_ml: 690 }
              as: IntakeNurse
              captures: { dstatus: $.data.status, vol: $.data.volume_ml }
          assert:
            - "Donation.status == COLLECTED (690 == band cap 690, <= passes)"
            - "Donation.volume_ml == 690"

  # ===========================================================================
  - section: validations
    instances:
      - name: permanent_deferral_with_duration_days_returns_invalid_duration
