      - name: dispute_amounts_are_bounded_by_the_cession_and_the_line_must_be_on_the_advocacy_layer
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=63]
          - validations[priority=69]
          - validations[priority=65]
          - validations[priority=31]
          - entities.ClaimAdvocacy.disputed_minor
          - errors.ERR_LINE_LAYER_MISMATCH
          - errors.ERR_DISPUTE_EXCEEDS_CESSION
          - errors.ERR_RESOLUTION_AMOUNT_INVALID
          - errors.ERR_DISPUTE_STATE_INVALID
        distinguishing_aspect: |
          Three separate cross-entity readings stack here. The cited signing line must sit on the
          advocacy's OWN layer, so Alpha's line on the sibling layer of the SAME program is still a
          mismatch. The disputed cap is an AGGREGATE over the advocacy's RAISED / UPHELD /
          SETTLED_PARTIAL disputes, not a per-dispute cap, and exact equality with ceded_claim_minor
          is allowed. Resolution amounts are conditional on the resolution word: 0 for UPHELD,
          exactly disputed_minor for WITHDRAWN, strictly inside the open interval for
          SETTLED_PARTIAL — so settled == disputed under SETTLED_PARTIAL is refused even though the
          same number is mandatory under WITHDRAWN. WITHDRAWN disputes contribute 0 back to
          ClaimAdvocacy.disputed_minor, which is what re-opens collectible_minor.
