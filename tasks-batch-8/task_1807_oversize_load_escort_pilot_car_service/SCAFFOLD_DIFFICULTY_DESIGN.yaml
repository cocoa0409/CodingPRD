            - "Invoice.${inv_id}.subtotal_cents == 207125; volume_discount_cents == 4143 (tier basis 0 + 207125 >= 100000 -> round_half_up(207125 x 0.02) = round_half_up(4142.5) = 4143)"
            - "Invoice.${inv_id}.fuel_surcharge_cents == 14105 (7% on UNDISCOUNTED base+equipment 201500, standby excluded: round_half_up(201500 x 0.07) = 14105)"
