            - "after that refusal PolicyViolationCase.${case_id}.state == \"REMEDIATION_SUBMITTED\", version == 3 and failed_verification_count == 0 — the rejected call wrote nothing"
            - "the VERIFY by cmp-002 returns HTTP 200 with state == \"VERIFIED_CLEARED\" and version == 4"
            - "Affiliate.${aff_id}.open_violation_case_count == 0 after the clearing verify"

      - name: affiliate_partner_cannot_read_another_partners_rows
        claim_type: peer_role_resource_isolation
        grounds:
          - roles[AffiliatePartner]
          - validations[priority 13]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[GET /affiliates/{id}]
          - endpoints[GET /affiliates/{id}/tax-documents]
