              payload: { production_lot_id: "${lot_id}", lot_test_id: "${test_id}", cert_serial: "CERT-0001", expected_production_lot_version: "${lot_v}" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { cert_id: $.data.id }
            - call: "POST /certification-documents/${cert_id}/issue"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /pack-units"
              payload: { production_lot_id: "${lot_id}", certification_document_id: "${cert_id}", label_serial: "PK-0001", actual_count: 100, label_fields_complete: true }
              as: ShippingClerk
              as_user_id: "ship-1"
              captures: { pack_id: $.data.id }
            - call: "POST /pack-units/${pack_id}/seal"
              payload: {}
              as: ShippingClerk
              as_user_id: "ship-1"
            - call: "POST /certification-documents/${cert_id}/revoke"
              payload: { reason: "customer complaint on thread gauge" }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-lots/${lot_id}/release-hold"
              payload: { note: "complaint closed as gauge error at the customer" }
              as: QualityManager
              as_user_id: "qm-1"
