            - "WorkOrder.${wo_id}.status == APPROVED  # hop 1"
            - "exactly one StockReservation exists for the work order, status OPEN, cut_length_mm == 500  # hop 2"
            - "StockReservation.${res_id}.inventory_item_id == ${rod_item_id}"
            - "InventoryItem.${rod_item_id}.length_mm == 497 and status == AVAILABLE  # hop 3: 1000 - (500+3); remnant 497 >= 300 stays AVAILABLE"

      - name: certificate_revoke_cascade_depth2
        grounds:
          - state_machines.Certificate.ISSUED_to_REVOKED
