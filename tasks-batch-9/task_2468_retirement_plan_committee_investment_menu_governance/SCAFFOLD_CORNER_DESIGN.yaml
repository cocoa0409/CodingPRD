            - "trigger call 1 returned 422 ERR_ROLLING_WINDOW_UNAVAILABLE — priority 79 — because Fund.${fund_lc_a_id}.watch_started_quarter_index is null"
            - "trigger call 2, which adds both rolling_since_watch fields, returned the identical 422 ERR_ROLLING_WINDOW_UNAVAILABLE: the gate is the fund's watch history, not the payload's completeness"
            - "after both rejections QuarterlyReview.${review_x3_id}.status is still DRAFT, scorecard_count == 0, submitted_scorecard_count == 0 and version is still ${review_x3_v0} — a rejected scorecard must not consume the OCC version"
            - "no FundScorecard row exists for (${review_x3_id}, ${fund_lc_a_id}): GET /governance/fund-scorecards?review_id=${review_x3_id} returns total_count 0"
            - "STRUCTURAL NOTE recorded, not asserted: this makes ROLLING_SINCE_WATCH unusable on a first review of a clean menu — every fund is CLEAR with a null watch_started_quarter_index, so the review can never leave DRAFT and can never be presented. The variant only becomes scoreable after a TRAILING_PERIOD review has finalized and put at least one fund on watch."

      - name: the_onboarding_join_point_refuses_a_fourth_member_module_by_module_seat_by_seat_and_day_by_day
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MODULE_NOT_WAIVABLE
          - errors.ERR_TRAINING_SCORE_INSUFFICIENT
          - errors.ERR_ACCEPTANCE_ALREADY_SIGNED
          - errors.ERR_SEAT_NOT_ACTIVE
          - errors.ERR_TERM_NOT_IN_EFFECT
          - validations.priority_86
        distinguishing_aspect: "One appointment is walked through every remaining gate on the ACCEPTANCE_PENDING -> ACTIVE join in the order §1.2 declares them, with the two satisfiable ones satisfied in between: FIDUCIARY_DUTIES cannot be waived even with a long waiver_basis while IPS_MECHANICS can; a 79.99 completion is rejected AND leaves the record ASSIGNED so the retry is legal; a second acceptance is refused because acceptance_signed_at is already set (not because the state is wrong); and with acceptance and training both in hand the residual failures are the seat's status and then the term interval — two gates that no amount of documentation can close, only a REINSTATE and a clock move."
        test_recipe:
          setup:
            - "chain_l2: governed plan with three FILLED voting seats, three ACTIVE members, charter ADOPTED, IPS-2026-A ADOPTED, menu_posture OPEN, logical clock 2026-08-01T00:00:00Z, Plan.fiscal_quarter_index 0, Plan.max_voting_seats 5, Plan.documented_acceptance_count 3."
            - "A fourth voting seat S-IND (INDEPENDENT, seat_index 4) is created and an appointment is made on it for a term that has NOT started yet: 2026-10-01 .. 2027-09-30. The seat goes VACANT -> FILLED and the member starts APPOINTED with fiduciary_training_status NOT_ASSIGNED and acceptance_signed_at null."
            - "Meeting 1 from chain_l2 is already MINUTES_APPROVED, so no CommitteeMeeting on the plan is IN_SESSION and the seat SUSPEND gate is open."
          setup_api_calls:
            - *chain_l2
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "S-IND", seat_class: "INDEPENDENT", voting: true, seat_index: 4 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seat_ind_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_ind_id}", member_name: "Dana Ruiz", term_start_date: "2026-10-01", term_end_date: "2027-09-30", independence_flag: true }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { mem_ind_id: $.data.id }
          trigger:
            - call: "POST /governance/training-records"
              payload: { member_id: "${mem_ind_id}", module_code: "FIDUCIARY_DUTIES", status: "WAIVED", waiver_basis: "holds an ASPPA fiduciary credential renewed in 2026" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/training-records"
              payload: { member_id: "${mem_ind_id}", module_code: "FIDUCIARY_DUTIES", validity_quarters: 8 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { rec_ind_duties_id: $.data.id }
            - call: "POST /governance/training-records/${rec_ind_duties_id}/complete"
              payload: { score_pct: 79.99 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/training-records/${rec_ind_duties_id}/complete"
              payload: { score_pct: 80.00 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/training-records"
              payload: { member_id: "${mem_ind_id}", module_code: "IPS_MECHANICS", status: "WAIVED", waiver_basis: "co-authored the plan's prior IPS as outside counsel", validity_quarters: 8 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { rec_ind_ips_id: $.data.id }
            - call: "POST /governance/committee-members/${mem_ind_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-2026-IND-01" }
              as: CommitteeMember
              as_user_id: "${mem_ind_id}"
            - call: "POST /governance/committee-members/${mem_ind_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-2026-IND-02" }
              as: CommitteeMember
              as_user_id: "${mem_ind_id}"
            - call: "POST /governance/committee-seats/${seat_ind_id}/status"
              payload: { action: "SUSPEND", reason: "background check pending" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${mem_ind_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-seats/${seat_ind_id}/status"
              payload: { action: "REINSTATE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${mem_ind_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T09:00:00Z" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${mem_ind_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "call 1 returned 422 ERR_MODULE_NOT_WAIVABLE even though waiver_basis is 47 characters: the module identity is the gate, and no FiduciaryTrainingRecord row was created — GET /governance/training-records?member_id=${mem_ind_id} still returns total_count 0 and CommitteeMember.${mem_ind_id}.status is still APPOINTED"
            - "call 2 returned 201 with status ASSIGNED and assigned_quarter_index == 0, and drove the training branch of the fork: CommitteeMember.${mem_ind_id}.status APPOINTED -> TRAINING_ASSIGNED with fiduciary_training_status == ASSIGNED and Plan.documented_acceptance_count unchanged at 3 (branch-specific side effect)"
            - "call 3 returned 422 ERR_TRAINING_SCORE_INSUFFICIENT — priority 86 — and FiduciaryTrainingRecord.${rec_ind_duties_id}.status is still ASSIGNED with completed_quarter_index null and score_pct not stored"
            - "call 4, the same endpoint at exactly the 80.00 floor, returned 200: status COMPLETED, completed_quarter_index == 0. fiduciary_training_status is still ASSIGNED because IPS_MECHANICS is not yet on file"
            - "call 5 returned 201 with status WAIVED and completed_quarter_index == 0 — IPS_MECHANICS is waivable — and now fiduciary_training_status == COMPLETED, both required modules being COMPLETED-or-WAIVED and unexpired"
            - "call 6 returned 200: acceptance_signed_at == 2026-08-01T00:00:00Z, acceptance_doc_ref == ACC-2026-IND-01, status TRAINING_ASSIGNED -> ACCEPTANCE_PENDING, Plan.documented_acceptance_count 3 -> 4"
            - "call 7 returned 409 ERR_ACCEPTANCE_ALREADY_SIGNED and did NOT overwrite acceptance_doc_ref: it is still ACC-2026-IND-01, acceptance_signed_at is unchanged and documented_acceptance_count is still 4 — a refused re-sign must not double-count"
            - "call 8 returned 200 with CommitteeSeat.${seat_ind_id}.status FILLED -> SUSPENDED while CommitteeMember.${mem_ind_id}.status stays ACCEPTANCE_PENDING"
            - "call 9 returned 409 ERR_SEAT_NOT_ACTIVE: with acceptance on file and training COMPLETED the first two join preconditions pass, so the seat gate is what answers — it is checked before the term gate"
            - "call 10 returned 200 taking the SUSPENDED -> FILLED arm (not SUSPENDED -> VACANT) because a non-terminal ACCEPTANCE_PENDING appointment still occupies the seat"
            - "call 11 returned 409 ERR_TERM_NOT_IN_EFFECT: the logical clock is 2026-08-01 and the closed term interval [2026-10-01, 2027-09-30] does not contain it. Plan.documented_acceptance_count is still 4 and the member is still ACCEPTANCE_PENDING"
            - "call 13, after moving the clock to the first inclusive day of the term, returned 200: status ACCEPTANCE_PENDING -> ACTIVE. Plan.documented_acceptance_count is 4 — activation must NOT add a second increment on top of the one acceptance already made"
            - "the fourth voting seat did not trip ERR_VOTING_SEATS_EXCEEDED: FILLED voting seats were 3 at appointment time and 3 + 1 <= Plan.max_voting_seats == 5"
            - "SPEC NOTE recorded, not asserted: fiduciary_training_status is declared in §1.1 with enum NOT_ASSIGNED | ASSIGNED | COMPLETED | EXPIRED and default NOT_ASSIGNED, yet POST /governance/committee-members claims it is set to PENDING and both the activate side-effect note and ERR_TRAINING_NOT_CURRENT compare it to CURRENT. Three names for two states; the §1.1 enum plus the §1.2 precondition (== COMPLETED) is taken as authoritative here."
            - "SPEC NOTE recorded, not asserted: Plan.documented_acceptance_count is incremented by the acceptance transition in §1.2 AND by the activate endpoint in §1.5. Only one of the two can be right; the §1.2 branch-specific attribution is used above because end-term's decrement is conditioned on acceptance_signed_at, not on having been ACTIVE."

      - name: the_seating_and_submission_gates_separate_referential_failures_from_capacity_failures_on_a_full_menu
        claim_type: Violation → Error
        grounds:
          - errors.ERR_FUND_NOT_CANDIDATE
          - errors.ERR_MENU_CAPACITY_EXHAUSTED
          - errors.ERR_OUTGOING_FUND_MISMATCH
          - validations.priority_42
          - validations.priority_80
        distinguishing_aspect: "The menu is deliberately driven to available_menu_slots == 0 so that every seating attempt violates capacity, and then the SAME endpoint is called twice — once with an already-seated fund and once with a genuine candidate — to prove that the referential state error at priority 42 answers before the fiscal capacity error at priority 80, and that capacity is what is left when the referential gate passes. The proposal half shows the mirror image: create validates only the INCOMING fund's asset class, so a proposal naming a completely unrelated outgoing fund is accepted as a DRAFT and only rejected at submit, with 422 ERR_OUTGOING_FUND_MISMATCH."
        test_recipe:
          setup:
            - "chain_l3: capacity 6, occupied 5, reserved 0, available 1, menu_posture OPEN, IPS-2026-A ADOPTED."
            - "BNDIY (CORE_BOND, net 20 bps against a 30 bps peer median, 40 quarters of track record, style_drift_r2 0.9300) is registered and seated into a NEW CORE_BOND SPECIALTY slot, taking occupied to 6 and available to 0 — the capacity triple is now 6 + 0 + 0 == menu_slot_capacity."
            - "LCGRC (US_LARGE_CAP, net 36 bps against a 40 bps peer median) and BNDIZ (CORE_BOND, net 18 bps) are registered and left CANDIDATE; both clear every IPS-2026-A criterion, so neither can be confused with an eligibility failure."
