# =============================================================================
# Task 1258: Electronics Test & Burn-In Services — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every chain replays against SCAFFOLD.yaml §1.5 from empty-DB.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two DIFFERENT entity domains: Lot vs Chamber)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lot_yield_first_pass_vs_final_diverge
        grounds:
          - calculations.lot_yield_metrics
          - entities.Lot.fields.suggested_disposition
          - endpoints."GET /api/lots/{lot_id}/yield-report"
        distinguishing_aspect: |
          Lot-domain dual variant: identical lot data (4 units, one soft-fail retested to pass)
          yields first_pass_yield 0.5 under FIRST_PASS (first-insertion passes / tested units)
          and final_yield 0.75 under FINAL (currently PASSED / quantity) — same data, two
          defensible algorithms, different numbers.
        test_recipe:
          setup:
            - "Customer, RELEASED program (bin_map 1=PASS/2=SOFT_FAIL/9=HARD_FAIL, max_retests 2), AVAILABLE fixture"
            - "Lot of 4 units IN_TEST; SN-1 pass, SN-2 pass, SN-3 soft-fail, SN-4 hard-fail on first insertion"
            - "SN-3 retested (authorization by a different engineer) to bin 1 PASS"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "YieldCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-100", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 }, { target_temp_c: 95, ramp_rate_c_per_min: 3, soak_minutes: 45 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-1", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-100", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { u2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { u3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { u4: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u3}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u4}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u3}", reason: "marginal socket contact" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u3}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "GET /api/lots/${lot}/yield-report", as: TestEngineer, as_user_id: "eng-1", captures: { fpy: $.data.first_pass_yield, fy: $.data.final_yield } }
          assert:
            - "yield report first_pass_yield == 0.5 (2 first-insertion passes / 4 tested units)"
            - "yield report final_yield == 0.75 (3 currently PASSED / quantity 4)"
            - "${fpy} != ${fy} for identical underlying data"
            - "units_passed == 3 AND units_failed == 1 AND units_untested == 0 AND retested_unit_count == 1"
            - "bin_counts == {\"1\": 3, \"2\": 1, \"9\": 1} over tally-effective results"

      - name: chamber_utilization_scheduled_vs_actual_diverge
        grounds:
          - calculations.chamber_utilization
          - endpoints."GET /api/chambers/{chamber_id}/utilization"
        distinguishing_aspect: |
          Chamber-domain dual variant (different entity domain than the Lot yield instance):
          over the same window, basis=SCHEDULED counts RESERVED+IN_PROGRESS+COMPLETED work
          against the full window (0.15) while basis=ACTUAL counts COMPLETED work only against
          the elapsed portion at the logical clock (0.2).
        test_recipe:
          setup:
            - "RELEASED program with AVAILABLE fixture; lot of 1 unit QUEUED"
            - "Chamber CH-U: slot_count 4, classes [A]; logical clock starts 2026-06-01T00:00:00Z"
            - "R1: class A, 2 slots, 01:00-03:00, driven to COMPLETED; R2: class A, 1 slot, 04:00-06:00, left RESERVED"
            - "Clock positioned at 2026-06-01T05:00:00Z (mid-window of R2, before its end)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "UtilCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-200", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-U", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-200", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-U", area_code: "AREA-U", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T01:00:00Z", end_at: "2026-06-01T03:00:00Z", slot_count: 2 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T01:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations/${r1}/start", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T03:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations/${r1}/complete", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T04:00:00Z", end_at: "2026-06-01T06:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T05:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "GET /api/chambers/${ch}/utilization", payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-01T10:00:00Z", basis: "SCHEDULED" }, as: OperationsManager, as_user_id: "ops-1", captures: { sched: $.data.utilization_ratio } }
            - { call: "GET /api/chambers/${ch}/utilization", payload: { window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-01T10:00:00Z", basis: "ACTUAL" }, as: OperationsManager, as_user_id: "ops-1", captures: { act: $.data.utilization_ratio } }
          assert:
            - "SCHEDULED utilization_ratio == 0.15 (numerator 360 slot-minutes = 2x120 + 1x120 over denominator 4 x 600)"
            - "ACTUAL utilization_ratio == 0.2 (numerator 240 slot-minutes COMPLETED only over denominator 4 x 300 elapsed minutes)"
            - "${sched} != ${act} over the identical window and chamber state"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two DIFFERENT modes: (a) nested multi-input
  # branching vs (b) pinned nested-rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: disposition_suggestion_three_branch_nested
        grounds:
          - calculations.disposition_suggestion
          - calculations.lot_yield_metrics
          - state_machines.Lot.IN_TEST_to_AWAITING_DISPOSITION
        distinguishing_aspect: |
          Mode (a) combinatorial: suggestion is a nested top-down branch over THREE inputs
          (first_pass_yield, escape_count, retest_rate) with tiered thresholds — three lots
          landing in SHIP / MRB_REVIEW / SCRAP_REVIEW respectively prove the branch lattice,
          including the exact-threshold SHIP case (0.75 >= 0.75 with retest_rate 0.25 <= 0.25).
        test_recipe:
          setup:
            - "One customer, one RELEASED program (max_retests 2), one AVAILABLE fixture"
            - "Lot A (4 units): 3 first-pass, 1 soft-fail retested to pass -> FPY 0.75, retest_rate 0.25, escapes 0"
            - "Lot B (4 units): 2 first-pass, 2 hard-fail -> FPY 0.5"
            - "Lot C (4 units): 1 first-pass, 3 hard-fail -> FPY 0.25"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "BranchCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-300", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-B", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            # --- Lot A ---
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-300", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lotA: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotA}", serial_number: "A-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { a1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotA}", serial_number: "A-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { a2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotA}", serial_number: "A-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { a3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotA}", serial_number: "A-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { a4: $.data.id } }
            - { call: "POST /api/lots/${lotA}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotA}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${a1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${a2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${a3}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${a4}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${a4}", reason: "socket retry" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${a4}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            # --- Lot B ---
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-300", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lotB: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotB}", serial_number: "B-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { b1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotB}", serial_number: "B-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { b2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotB}", serial_number: "B-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { b3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotB}", serial_number: "B-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { b4: $.data.id } }
            - { call: "POST /api/lots/${lotB}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotB}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${b1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${b2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${b3}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${b4}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            # --- Lot C ---
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-300", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lotC: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotC}", serial_number: "C-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { c1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotC}", serial_number: "C-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { c2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotC}", serial_number: "C-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { c3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotC}", serial_number: "C-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { c4: $.data.id } }
            - { call: "POST /api/lots/${lotC}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotC}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${c1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${c2}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${c3}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${c4}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/lots/${lotA}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotB}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotC}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "GET /api/lot-disposition-reviews", payload: { lot_id: "${lotB}" }, as: QualityEngineer, as_user_id: "qe-1", captures: { revB_sugg: "$.data[0].suggested_disposition" } }
            - { call: "GET /api/lot-disposition-reviews", payload: { lot_id: "${lotC}" }, as: QualityEngineer, as_user_id: "qe-1", captures: { revC_sugg: "$.data[0].suggested_disposition" } }
          assert:
            - "Lot ${lotA}.suggested_disposition == SHIP (FPY 3/4 == 0.75 >= 0.75, escapes 0, retest_rate 1/4 == 0.25 <= 0.25 — both thresholds inclusive)"
            - "Lot ${lotB}.suggested_disposition == MRB_REVIEW (FPY 0.5: below SHIP band, not below SCRAP_FPY_THRESHOLD 0.5)"
            - "Lot ${lotC}.suggested_disposition == SCRAP_REVIEW (FPY 0.25 < 0.5)"
            - "Auto-created review for lot B: ${revB_sugg} == MRB_REVIEW; for lot C: ${revC_sugg} == SCRAP_REVIEW; no PENDING review exists for lot A"

      - name: burn_in_profile_duration_segment_rounding
        grounds:
          - calculations.burn_in_profile_duration
          - entities.ChamberReservation.fields.planned_duration_minutes
        distinguishing_aspect: |
          Mode (b) nested rounding: per-segment round_half_up THEN sum (the pinned order)
          yields 92 minutes for the two-segment profile; the alternative sum-then-round
          order yields 93 — the scaffold pins per-segment-first and this instance locks it.
        test_recipe:
          setup:
            - "RELEASED program with burn_profile [55C @ 7C/min soak 30, 95C @ 3C/min soak 45] and AVAILABLE fixture"
            - "Lot of 1 unit QUEUED; chamber with class A; clock at 2026-06-01T00:00:00Z"
            - "Segment math: ramp1 = round_half_up((55-25)/7) = round_half_up(4.2857) = 4; seg1 = 4 + 30 = 34; ramp2 = round_half_up((95-55)/3) = round_half_up(13.3333) = 13; seg2 = 13 + 45 = 58; total = 92"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "RoundCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-400", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 }, { target_temp_c: 95, ramp_rate_c_per_min: 3, soak_minutes: 45 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-R", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-400", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-R", area_code: "AREA-R", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { dur: $.data.planned_duration_minutes } }
          assert:
            - "${dur} == 92 (per-segment round_half_up(4.2857)=4 + 30, round_half_up(13.3333)=13 + 45, then summed)"
            - "${dur} != 93 (the sum-then-round alternative 4.2857+30+13.3333+45 = 92.619 -> 93 is NOT the contract)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two DIFFERENT entities: Unit cycle vs
  # Lot branching-with-rework loop)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: unit_retest_cycle_bounded_loop
        grounds:
          - state_machines.Unit
          - calculations.retest_policy_gate
          - state_machines.RetestAuthorization
        distinguishing_aspect: |
          Cyclic machine on Unit: UNTESTED -> FAILED -> (authorized retest) -> FAILED ->
          (authorized retest) -> PASSED traverses the FAILED self-loop; each traversal
          consumes one RetestAuthorization and is bounded by max_retests_per_unit.
        test_recipe:
          setup:
            - "RELEASED program max_retests_per_unit 2; lot of 1 unit IN_TEST; fixture AVAILABLE"
            - "Unit SN-1: first insertion bin 2 (SOFT_FAIL) -> FAILED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "LoopCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-500", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-L", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-500", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { r1: $.data.id } }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "first retry" }, as: TestEngineer, as_user_id: "eng-2", captures: { auth1: $.data.id } }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "second retry" }, as: TestEngineer, as_user_id: "eng-2", captures: { auth2: $.data.id } }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { r3: $.data.id } }
            - { call: "GET /api/units/${u1}", as: TestEngineer, as_user_id: "eng-1", captures: { u_status: $.data.test_status, u_count: $.data.retest_count } }
            - { call: "GET /api/retest-authorizations/${auth1}", as: TestEngineer, as_user_id: "eng-2", captures: { auth1_status: $.data.status } }
          assert:
            - "Result ${r2}.insertion_index == 2 and unit stayed FAILED after the first retest (self-loop FAILED -> FAILED)"
            - "Unit.${u1}.test_status == PASSED after the second retest AND retest_count == 2"
            - "Authorization ${auth1} status == CONSUMED (exactly one authorization per retest insertion)"
            - "${u_status} == PASSED AND ${u_count} == 2 AND ${auth1_status} == CONSUMED"

      - name: lot_rework_loop_returns_to_queued
        grounds:
          - state_machines.Lot
          - state_machines.LotDispositionReview
          - calculations.unit_tally_projection
        distinguishing_aspect: |
          Branching-with-loop machine on Lot (different entity than the Unit cycle):
          AWAITING_DISPOSITION forks to {SHIPPED, SCRAPPED, REWORK}; REWORK loops the lot
          back to QUEUED with unit state reset, and the lot re-traverses IN_TEST ->
          AWAITING_DISPOSITION -> SHIPPED on the second pass.
        test_recipe:
          setup:
            - "RELEASED program; lot of 4 units: 2 pass, 2 hard-fail -> complete-test lands AWAITING_DISPOSITION with auto MRB_REVIEW review"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ReworkCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-600", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-W", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-600", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "W-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { w1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "W-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { w2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "W-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { w3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "W-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { w4: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w3}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w4}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lot}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "GET /api/lot-disposition-reviews", payload: { lot_id: "${lot}" }, as: QualityEngineer, as_user_id: "qe-1", captures: { rev: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/lot-disposition-reviews/${rev}/decide", payload: { decision: "REWORK", rationale: "reflow solder and retest" }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /api/lots/${lot}", as: OperationsManager, as_user_id: "ops-1", captures: { st_mid: $.data.status, unt_mid: $.data.units_untested } }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w3}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${w4}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lot}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1", captures: { st_end: $.data.status } }
          assert:
            - "After REWORK decide: ${st_mid} == QUEUED AND ${unt_mid} == 4 (units reset to UNTESTED, prior results excluded_from_tally)"
            - "Unit ${w3}.retest_count == 0 after rework (history reset)"
            - "Second pass: all four units PASSED, complete-test yields suggested_disposition == SHIP (FPY 1.0, retested 0, escapes 0)"
            - "${st_end} == SHIPPED — full loop QUEUED->IN_TEST->AWAITING_DISPOSITION->QUEUED->IN_TEST->AWAITING_DISPOSITION->SHIPPED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two DIFFERENT triggers: program release vs
  # RMA close; depth >= 3 and depth >= 2 respectively)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: program_supersession_cascade_depth3
        grounds:
          - state_machines.TestProgram.VALIDATED_to_RELEASED
          - state_machines.Fixture
          - state_machines.ChamberReservation
          - calculations.chamber_slot_ledger
          - concurrency_rules[program-revision-stale-version]
        distinguishing_aspect: |
          Depth-3 cascade from POST release of revision 2: old program -> OBSOLETE (hop 1)
          forces its fixture -> DECOMMISSIONED (hop 2), which itself cancels the RESERVED
          chamber reservation using that fixture (hop 3), which itself recomputes
          Chamber.available_slots (hop 4 / ledger). Each hop is caused by the previous
          hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Program P1 RELEASED with fixture F1 AVAILABLE; lot QUEUED; chamber CH-S slots 4"
            - "Reservation R1 RESERVED on CH-S referencing F1 (2 slots, future window); available_slots == 2"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "CascadeCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-700", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog1: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog1}", serial_number: "FX-1", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix1: $.data.id } }
            - { call: "POST /api/fixtures/${fix1}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog1}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog1}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-700", quantity: 1, program_id: "${prog1}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-S", area_code: "AREA-S", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix1}", profile_class: "A", start_at: "2026-06-02T10:00:00Z", end_at: "2026-06-02T11:00:00Z", slot_count: 2 }, as: OperationsManager, as_user_id: "ops-1", captures: { res1: $.data.id } }
            - { call: "GET /api/test-programs/${prog1}", as: TestEngineer, as_user_id: "eng-1", captures: { prog1_v: $.data.version } }
            - { call: "POST /api/test-programs/${prog1}/revisions", payload: { expected_test_program_version: "${prog1_v}" }, as: TestEngineer, as_user_id: "eng-1", captures: { prog2: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog2}", serial_number: "FX-2", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix2: $.data.id } }
            - { call: "POST /api/fixtures/${fix2}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog2}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/test-programs/${prog2}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "GET /api/test-programs/${prog1}", as: TestEngineer, as_user_id: "eng-1", captures: { p1_status: $.data.status } }
            - { call: "GET /api/fixtures/${fix1}", as: TestEngineer, as_user_id: "eng-1", captures: { f1_status: $.data.status } }
            - { call: "GET /api/chamber-reservations/${res1}", as: OperationsManager, as_user_id: "ops-1", captures: { r1_status: $.data.status } }
            - { call: "GET /api/chambers/${ch}", as: OperationsManager, as_user_id: "ops-1", captures: { ch_avail: $.data.available_slots } }
          assert:
            - "Hop 1: ${p1_status} == OBSOLETE (superseded by the released revision 2)"
            - "Hop 2: ${f1_status} == DECOMMISSIONED (caused by hop 1, not by the release request directly)"
            - "Hop 3: ${r1_status} == CANCELLED (caused by hop 2's decommission)"
            - "Hop 4 ledger: ${ch_avail} == 4 (the 2 slots freed by hop 3's cancellation)"

      - name: rma_escape_cascade_creates_review
        grounds:
          - state_machines.RmaCase
          - state_machines.Lot.SHIPPED_to_CONTAINED
          - calculations.rma_escape_containment
          - state_machines.Unit.PASSED_to_FAILED
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (RMA close, not program release):
          RmaCase CLOSED with TEST_ESCAPE mutates the Lot (escape_count++, SHIPPED ->
          CONTAINED, escaped Unit -> FAILED), and that lot mutation itself auto-creates a
          PENDING LotDispositionReview with suggested_disposition SCRAP_REVIEW.
        test_recipe:
          setup:
            - "Lot of 2 units, both passed first insertion; suggestion SHIP; lot SHIPPED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "EscapeCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-800", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-E", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-800", quantity: 2, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "E-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "E-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { u2: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lot}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/rma-cases", payload: { lot_id: "${lot}", unit_id: "${u1}", failure_mode: "field failure at customer" }, as: CustomerRep, as_user_id: "${cust}", captures: { rma: $.data.id } }
            - { call: "POST /api/rma-cases/${rma}/start-fa", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /api/rma-cases/${rma}/complete-fa", payload: { fa_conclusion: "TEST_ESCAPE" }, as: QualityEngineer, as_user_id: "qe-1" }
          trigger:
            - { call: "POST /api/rma-cases/${rma}/close", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /api/lots/${lot}", as: QualityEngineer, as_user_id: "qe-1", captures: { lot_status: $.data.status, lot_esc: $.data.escape_count, lot_pass: $.data.units_passed, lot_fail: $.data.units_failed } }
            - { call: "GET /api/units/${u1}", as: QualityEngineer, as_user_id: "qe-1", captures: { u1_status: $.data.test_status } }
            - { call: "GET /api/lot-disposition-reviews", payload: { lot_id: "${lot}" }, as: QualityEngineer, as_user_id: "qe-1", captures: { rev_status: "$.data[0].status", rev_sugg: "$.data[0].suggested_disposition" } }
          assert:
            - "Hop 1 (RmaCase -> Lot): ${lot_status} == CONTAINED AND ${lot_esc} == 1"
            - "Hop 1 side: ${u1_status} == FAILED AND ${lot_pass} == 1 AND ${lot_fail} == 1 (escaped unit reclassified)"
            - "Hop 2 (Lot -> Review, caused by hop 1): ${rev_status} == PENDING AND ${rev_sugg} == SCRAP_REVIEW"
            - "Unit tally invariant holds post-cascade: 1 passed + 1 failed + 0 untested == quantity 2"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two DIFFERENT error-category
  # pairs: business_safety vs business_temporal; state vs business_referential)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: esd_safety_beats_slot_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - calculations.esd_area_containment
          - errors[ERR_ESD_CONTAINMENT]
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety (p6) vs business_temporal (p7): the request
          violates BOTH the ESD containment gate (open MAJOR audit on the chamber's area,
          certification-requiring customer) AND the half-open overlap rule; priority
          ordering must surface ERR_ESD_CONTAINMENT, not ERR_SLOT_OVERLAP.
        test_recipe:
          setup:
            - "Customer with requires_esd_certification TRUE; RELEASED program + AVAILABLE fixture; lot QUEUED"
            - "Chamber in AREA-X, class A, slots 4; R1 RESERVED 10:00-11:00"
            - "OPEN EsdAudit with a MAJOR finding on AREA-X"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "CertCo", tier: "STRATEGIC", requires_esd_certification: true }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-900", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-X", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-900", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-X", area_code: "AREA-X", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
            - { call: "POST /api/esd-audits", payload: { area_code: "AREA-X", findings: [ { severity: "MAJOR", description: "wrist-strap station failed" } ] }, as: QualityEngineer, as_user_id: "qe-1", captures: { audit: $.data.id } }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ESD_CONTAINMENT (business_safety p6 fires before business_temporal p7)"
            - "${err} != ERR_SLOT_OVERLAP even though 10:30-11:30 overlaps R1's 10:00-11:00"
            - "Reservation count on chamber ${ch} remains 1 (rejected request persisted nothing)"

      - name: lot_state_beats_program_superseded
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROGRAM_SUPERSEDED]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_referential (p8) — a DIFFERENT pair
          than the safety/temporal instance: the lot is already AWAITING_DISPOSITION (state
          violation) AND the pinned program revision is OBSOLETE (referential violation);
          priority ordering must surface ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Lot of 2 units: SN-1 pass, SN-2 hard-fail; complete-test -> AWAITING_DISPOSITION"
            - "Program then superseded: revision 2 minted, fixtured, validated, released -> revision 1 OBSOLETE"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "PrioCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-910", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog1: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog1}", serial_number: "FX-P1", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix1: $.data.id } }
            - { call: "POST /api/fixtures/${fix1}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog1}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog1}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-910", quantity: 2, program_id: "${prog1}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "P-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { p1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "P-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { p2: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${p1}", fixture_id: "${fix1}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${p2}", fixture_id: "${fix1}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lot}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "GET /api/test-programs/${prog1}", as: TestEngineer, as_user_id: "eng-1", captures: { prog1_v: $.data.version } }
            - { call: "POST /api/test-programs/${prog1}/revisions", payload: { expected_test_program_version: "${prog1_v}" }, as: TestEngineer, as_user_id: "eng-1", captures: { prog2: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog2}", serial_number: "FX-P2", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix2: $.data.id } }
            - { call: "POST /api/fixtures/${fix2}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog2}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog2}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${p2}", fixture_id: "${fix2}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (lot AWAITING_DISPOSITION is a p4 state violation and wins over p8)"
            - "${err} != ERR_PROGRAM_SUPERSEDED even though the lot's pinned revision is OBSOLETE"
            - "Unit ${p2}.test_status remains FAILED (no insertion persisted)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two DIFFERENT metrics on DIFFERENT
  # endpoints: retest count strict-< vs first-pass-yield inclusive->=)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: retest_limit_boundary_at_max
        grounds:
          - calculations.retest_policy_gate
          - validations[priority=9]
          - errors[ERR_RETEST_LIMIT_REACHED]
        distinguishing_aspect: |
          Metric = unit.retest_count against max_retests_per_unit (integer strict <):
          at retest_count == max-1 the authorization succeeds; at retest_count == max the
          same call fails with ERR_RETEST_LIMIT_REACHED. Endpoint: POST /api/retest-authorizations.
        test_recipe:
          setup:
            - "RELEASED program max_retests_per_unit 2; lot of 1 unit IN_TEST"
            - "Unit: insertion 1 soft-fail (retest_count 0); auth1; insertion 2 soft-fail (retest_count 1)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "BoundCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-111", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-B1", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-111", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "retry one" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "retry two at boundary count 1 < 2" }, as: TestEngineer, as_user_id: "eng-2", captures: { auth2: $.data.id } }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "retry three past boundary count 2 >= 2" }, as: TestEngineer, as_user_id: "eng-2", captures: { err: $.data.error_id } }
          assert:
            - "Authorization at retest_count == 1 (== max-1) succeeded: ${auth2} is a created id"
            - "${err} == ERR_RETEST_LIMIT_REACHED at retest_count == 2 == max (comparison is strict <, equality rejects)"
            - "Unit.${u1}.retest_count == 2 and test_status == FAILED (rejected authorization changed nothing)"

      - name: ship_yield_threshold_inclusive
        grounds:
          - calculations.disposition_suggestion
          - errors[ERR_DISPOSITION_REVIEW_REQUIRED]
          - state_machines.Lot.AWAITING_DISPOSITION_to_SHIPPED
        distinguishing_aspect: |
          Metric = first_pass_yield against SHIP_FPY_THRESHOLD (ratio inclusive >=), reached
          through POST /api/lots/{lot_id}/ship — a different metric AND a different endpoint
          than the retest-count instance: FPY exactly 0.75 ships; FPY 0.5 is rejected.
        test_recipe:
          setup:
            - "Lot OK (4 units): 3 first-pass + 1 soft-fail retested to pass -> FPY exactly 0.75, retest_rate 0.25, escapes 0"
            - "Lot NO (4 units): 2 pass + 2 hard-fail -> FPY 0.5, auto MRB_REVIEW review exists"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ThreshCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-112", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-T", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            # Lot OK
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-112", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lotOK: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotOK}", serial_number: "K-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { k1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotOK}", serial_number: "K-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { k2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotOK}", serial_number: "K-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { k3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotOK}", serial_number: "K-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { k4: $.data.id } }
            - { call: "POST /api/lots/${lotOK}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotOK}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${k1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${k2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${k3}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${k4}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${k4}", reason: "socket retry" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${k4}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lotOK}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            # Lot NO
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-112", quantity: 4, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lotNO: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotNO}", serial_number: "N-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { n1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotNO}", serial_number: "N-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { n2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotNO}", serial_number: "N-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { n3: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lotNO}", serial_number: "N-4" }, as: OperationsManager, as_user_id: "ops-1", captures: { n4: $.data.id } }
            - { call: "POST /api/lots/${lotNO}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lotNO}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${n1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${n2}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${n3}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${n4}", fixture_id: "${fix}", bin_code: 9 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lotNO}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/lots/${lotOK}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1", captures: { ok_status: $.data.status } }
            - { call: "POST /api/lots/${lotNO}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "Lot OK: FPY exactly 3/4 == 0.75 meets the INCLUSIVE threshold -> ${ok_status} == SHIPPED"
            - "Lot NO: FPY 2/4 == 0.5 below threshold -> ${err} == ERR_DISPOSITION_REVIEW_REQUIRED"
            - "Lot OK threshold conjuncts at their own boundaries: retest_rate 1/4 == 0.25 <= RETEST_RATE_MAX and escape_count 0"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (two DIFFERENT entity pairs:
  # ChamberReservation->Chamber and TestResult->CustomerEquipment)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_requires_chamber_online
        grounds:
          - validations[priority=8]
          - state_machines.Chamber
          - errors[ERR_CHAMBER_NOT_ONLINE]
        distinguishing_aspect: |
          Pair ChamberReservation -> Chamber: reservation creation is gated on the
          CHAMBER's status (MAINTENANCE rejects with ERR_CHAMBER_NOT_ONLINE); the
          reservation's own state plays no role because it does not exist yet.
        test_recipe:
          setup:
            - "RELEASED program, AVAILABLE fixture, lot QUEUED; chamber CH-M placed into MAINTENANCE"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "GateCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-121", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-G", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-121", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-M", area_code: "AREA-M", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "PATCH /api/chambers/${ch}", payload: { status: "MAINTENANCE" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CHAMBER_NOT_ONLINE"
            - "No reservation row exists for chamber ${ch} afterwards (list count 0)"

      - name: result_requires_equipment_in_service
        grounds:
          - validations[priority=8]
          - calculations.equipment_calibration_status
          - state_machines.CustomerEquipment
          - errors[ERR_EQUIPMENT_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Pair TestResult -> CustomerEquipment (different pair than the Chamber instance):
          result recording is gated on the referenced equipment's EFFECTIVE status; the
          lazy derivation flips it to CALIBRATION_DUE because the default logical clock
          2026-05-01T00:00:00Z equals next_calibration_due (inclusive >= boundary).
        test_recipe:
          setup:
            - "RELEASED program, AVAILABLE fixture, lot of 1 IN_TEST"
            - "Equipment EQ-1: last_calibrated_at 2026-04-01T00:00:00Z, interval 30 days -> due exactly 2026-05-01T00:00:00Z; clock left at its startup default"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "CalCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-131", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-C", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-131", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/customer-equipment", payload: { customer_id: "${cust}", equipment_type: "TESTER", serial_number: "EQ-1", calibration_interval_days: 30, last_calibrated_at: "2026-04-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { eq: $.data.id } }
            - { call: "GET /api/customer-equipment/${eq}", as: OperationsManager, as_user_id: "ops-1", captures: { eq_status: $.data.status, eq_due: $.data.next_calibration_due } }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1, equipment_id: "${eq}" }, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "${eq_due} == 2026-05-01T00:00:00Z AND ${eq_status} == CALIBRATION_DUE (inclusive >= at exact due instant)"
            - "${err} == ERR_EQUIPMENT_NOT_IN_SERVICE"
            - "Unit.${u1}.test_status remains UNTESTED (no insertion persisted)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two DIFFERENT interval semantics on two
  # DIFFERENT resources: chamber half-open + class-conditional purge buffer vs
  # equipment maintenance CLOSED intervals where touching endpoints conflict)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: chamber_half_open_adjacency_vs_profile_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_SLOT_OVERLAP]
          - errors[ERR_PROFILE_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Chamber semantics (resource #1): half-open [start,end) windows where SAME-class
          adjacency is legal but a DIFFERENT-class adjacent run needs a 30-minute purge
          gap; proven by one true overlap rejection, one accepted same-class adjacency,
          and one rejected different-class adjacency.
        test_recipe:
          setup:
            - "RELEASED program + AVAILABLE fixture; lot QUEUED; chamber slots 8 classes [A, B]; clock 2026-06-01T00:00:00Z"
            - "R1: class A 10:00-11:00 RESERVED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "OverlapCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-141", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-O", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-141", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-O", area_code: "AREA-O", slot_count: 8, supported_profile_classes: ["A", "B"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "B", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err_buf: $.data.error_id } }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r_adj: $.data.id } }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err_ov: $.data.error_id } }
          assert:
            - "${err_buf} == ERR_PROFILE_BUFFER_VIOLATION (class B abutting class A at 11:00 lacks the 30-minute purge)"
            - "Same-class adjacency accepted: ${r_adj} created for class A 11:00-12:00 (half-open: start == prior end is not overlap)"
            - "${err_ov} == ERR_SLOT_OVERLAP for 10:30-11:30 vs R1 10:00-11:00"
            - "Chamber ${ch} has exactly 2 reservations afterwards"

      - name: equipment_maintenance_closed_interval_conflict
        grounds:
          - validations[priority=7]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
          - state_machines.MaintenanceOrder
        distinguishing_aspect: |
          CustomerEquipment semantics (resource #2, different from Chamber): maintenance
          windows are CLOSED intervals, so touching endpoints CONFLICT — [10:00,11:00]
          followed by [11:00,12:00] is rejected, while [11:01,12:00] succeeds; there is no
          class-conditional buffer concept at all.
        test_recipe:
          setup:
            - "Customer equipment EQ-M registered (long calibration interval so CALIBRATION_DUE does not interfere)"
            - "MO1: CALIBRATION window [2026-06-01T10:00, 2026-06-01T11:00] OPEN"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "MaintCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/customer-equipment", payload: { customer_id: "${cust}", equipment_type: "TESTER", serial_number: "EQ-M", calibration_interval_days: 365, last_calibrated_at: "2026-04-15T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { eq: $.data.id } }
            - { call: "POST /api/maintenance-orders", payload: { target_type: "EQUIPMENT", target_id: "${eq}", kind: "CALIBRATION", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T11:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { mo1: $.data.id } }
          trigger:
            - { call: "POST /api/maintenance-orders", payload: { target_type: "EQUIPMENT", target_id: "${eq}", kind: "PREVENTIVE", window_start: "2026-06-01T11:00:00Z", window_end: "2026-06-01T12:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { err_touch: $.data.error_id } }
            - { call: "POST /api/maintenance-orders", payload: { target_type: "EQUIPMENT", target_id: "${eq}", kind: "PREVENTIVE", window_start: "2026-06-01T11:01:00Z", window_end: "2026-06-01T12:00:00Z" }, as: OperationsManager, as_user_id: "ops-1", captures: { mo3: $.data.id } }
          assert:
            - "${err_touch} == ERR_MAINTENANCE_WINDOW_CONFLICT (closed intervals: window_start 11:00 <= existing window_end 11:00 conflicts)"
            - "${mo3} created for [11:01, 12:00] (a real gap of one minute is required and sufficient)"
            - "GET /api/maintenance-orders?target_id=${eq} returns 2 rows (MO1 OPEN, MO3 OPEN)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two DIFFERENT conserved quantities:
  # chamber slot ledger vs lot unit tally)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chamber_slot_ledger_reserve_cancel_invariant
        grounds:
          - calculations.chamber_slot_ledger
          - state_machines.ChamberReservation.RESERVED_to_CANCELLED
          - entities.Chamber.fields.available_slots
        distinguishing_aspect: |
          Conserved quantity = chamber slots: for every step, sum(slot_count over
          RESERVED/IN_PROGRESS reservations) + available_slots == slot_count == 8;
          a reserve/cancel compensating pair returns the ledger to its exact prior value.
        test_recipe:
          setup:
            - "RELEASED program + AVAILABLE fixture; lot QUEUED; chamber slots 8 class A; clock 2026-06-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "LedgerCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-151", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-S", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-151", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-L", area_code: "AREA-L", slot_count: 8, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", slot_count: 3 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
            - { call: "GET /api/chambers/${ch}", as: OperationsManager, as_user_id: "ops-1", captures: { avail_1: $.data.available_slots } }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T13:00:00Z", slot_count: 5 }, as: OperationsManager, as_user_id: "ops-1", captures: { r2: $.data.id } }
            - { call: "GET /api/chambers/${ch}", as: OperationsManager, as_user_id: "ops-1", captures: { avail_2: $.data.available_slots } }
            - { call: "POST /api/chamber-reservations/${r1}/cancel", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "GET /api/chambers/${ch}", as: OperationsManager, as_user_id: "ops-1", captures: { avail_3: $.data.available_slots } }
          assert:
            - "${avail_1} == 5 (3 reserved: 3 + 5 == 8)"
            - "${avail_2} == 0 (3 + 5 committed: capacity boundary — slot_count equal to remaining was allowed)"
            - "${avail_3} == 5 (compensating cancel of R1 restored exactly the pre-R1 ledger: 5 committed + 5 available == 8)"
            - "Reservation ${r1}.status == CANCELLED and ${r2} remains RESERVED"

      - name: lot_unit_tally_record_void_invariant
        grounds:
          - calculations.unit_tally_projection
          - state_machines.Unit
          - endpoints."POST /api/test-results/{result_id}/void"
        distinguishing_aspect: |
          Conserved quantity = lot unit census (different quantity than chamber slots):
          units_untested + units_passed + units_failed == quantity == 3 across a
          record/void compensating pair; voiding a result returns the unit to UNTESTED
          and the tallies to their exact pre-record values.
        test_recipe:
          setup:
            - "Lot of 3 units IN_TEST; no results yet (tallies 3/0/0)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "TallyCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-161", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-Y", site_count: 4 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-161", quantity: 3, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "T-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { t1: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "T-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { t2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "T-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { t3: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${t1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { res1: $.data.id } }
            - { call: "POST /api/test-results", payload: { unit_id: "${t2}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { res2: $.data.id } }
            - { call: "GET /api/lots/${lot}", as: QualityEngineer, as_user_id: "qe-1", captures: { p_1: $.data.units_passed, f_1: $.data.units_failed, u_1: $.data.units_untested } }
            - { call: "POST /api/test-results/${res2}/void", payload: { reason: "mis-keyed bin entry" }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /api/lots/${lot}", as: QualityEngineer, as_user_id: "qe-1", captures: { p_2: $.data.units_passed, f_2: $.data.units_failed, u_2: $.data.units_untested } }
            - { call: "GET /api/units/${t2}", as: QualityEngineer, as_user_id: "qe-1", captures: { t2_status: $.data.test_status } }
          assert:
            - "After two records: ${p_1} == 1 AND ${f_1} == 1 AND ${u_1} == 1 (sum 3 == quantity)"
            - "After compensating void: ${p_2} == 1 AND ${f_2} == 0 AND ${u_2} == 2 (sum 3; exact pre-record values for unit T-2)"
            - "${t2_status} == UNTESTED (replay over remaining non-voided results is empty)"
            - "Result ${res2}.voided == true and remains queryable (append-only log preserves the row)"
