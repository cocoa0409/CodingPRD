  - rule_id: resource_temporal_overlap
    instances:
      - name: adjacent_comment_period_allowed_overlapping_period_rejected
        interval_semantics: "half-open [opens_at, closes_at), no buffer"
        resource: PublicCommentPeriod
        grounds:
          - calculations.comment_window_semantics
          - validations[priority 18].ERR_COMMENT_PERIOD_OVERLAP
          - endpoints[POST /comment-periods].side_effects
        distinguishing_aspect: |
          The comment-period resource uses HALF-OPEN intervals with no buffer, so a period may open exactly
          at a prior period's closes_at: P2 opening 2026-08-31 against P1 closing 2026-08-31 is accepted,
          while P3 opening 2026-09-29 against P2's [2026-08-31, 2026-09-30) is rejected by a single day of
          overlap. Touching endpoints are legal here, which is the opposite convention from the closure
          window resource.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application submitted and accepted, so P1 was auto-created opening 2026-08-01 and closing 2026-08-31"
            - "P2 created opening exactly 2026-08-31 for 30 days, closing 2026-09-30 - accepted because touching endpoints do not overlap"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
