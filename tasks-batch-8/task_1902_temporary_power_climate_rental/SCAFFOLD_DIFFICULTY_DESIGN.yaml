  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (Permit x Contract; Incident x Contract)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: mobilize_requires_approved_permit
        grounds:
          - state_machines.RentalContract.CONFIRMED_to_MOBILIZING
          - state_machines.Permit.SUBMITTED_to_APPROVED
          - errors[ERR_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Entity pair Permit x RentalContract: the CONFIRMED->MOBILIZING
          transition is gated on a separate Permit entity reaching APPROVED;
          without it the transition fails with ERR_PERMIT_REQUIRED and succeeds
          only after the permit's own lifecycle completes.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (CA-SCAQMD); Unit U1 (100 kW, nox 5.0, TIER_4F) -> site screening requires a permit"
            - "Contract K1 CONFIRMED with U1 reserved (window 2026-09-01..2026-09-08, load 80 -> sized 100)"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Cali Builders", billing_email: "ap@cali.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "LA Basin Yard", jurisdiction_code: "CA-SCAQMD", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 100, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 5.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "LAX-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 80 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
              captures: { err: $.data.error_id }
            - call: "POST /power-rental/permits"
              payload: { contract_id: "${con_id}", permit_type: "EMISSIONS" }
              as: SalesEngineer
              captures: { perm_id: $.data.id }
            - call: "POST /power-rental/permits/${perm_id}/submit"
              payload: {}
              as: SalesEngineer
            - call: "POST /power-rental/permits/${perm_id}/record-decision"
              payload: { outcome: "APPROVED" }
              as: SalesEngineer
              captures: { perm_status: $.data.status }
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
              captures: { k_status: $.data.status }
          assert:
            - "first mobilize: error_id == ERR_PERMIT_REQUIRED; contract stays CONFIRMED"
            - "Permit.${perm_id}.status == APPROVED after record-decision"
            - "second mobilize succeeds: contract status == MOBILIZING"

      - name: close_blocked_by_reported_incident
        grounds:
          - state_machines.RentalContract.OFF_HIRE_to_CLOSED
          - state_machines.Incident.REPORTED_to_ASSESSED
          - errors[ERR_OPEN_INCIDENTS]
        distinguishing_aspect: |
          Entity pair Incident x RentalContract (different pair than Permit x
          Contract): OFF_HIRE->CLOSED is gated on all child incidents leaving
          REPORTED; the close fails with ERR_OPEN_INCIDENTS, then succeeds after
          assessment and invoices exactly the assessed charge.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000)"
            - "Contract K1 (window 2026-09-01..2026-09-08, load 160 -> sized 200) ON_RENT with U1 DEPLOYED; clock 2026-09-04"
