# =============================================================================
# Task 1940: Electric Outage Management & Storm Restoration
# Investor-owned electric utility — outage prediction (meter last-gasp & call
# clustering), crew assignment & switching orders, ETR publication & revision,
# damage assessment & material staging, priority customers, mutual-aid crews &
# lodging, restoration verification & nested outages, event cost accounting &
# FEMA claims.
# =============================================================================

scenario: |
  1940. Electric Outage Management & Storm Restoration (investor-owned electric
  utility): outage prediction from meter last-gasp & call clustering, crew
  assignment & switching order, estimated restoration time publication &
  revision, damage assessment & material staging, priority customers
  (medical/critical facility), mutual-aid crew integration & lodging,
  restoration verification & nested outage, event cost accounting & FEMA claim

domain_name: electric-outage-management
api_prefix: /om

complexity_profile:
  primary_archetype: quota / allocation        # crews, lodging rooms, and material stock are finite pools reserved/committed/released
  secondary_archetype: temporal windowing      # ETR revision horizons, mutual-aid engagement windows, lodging blocks, cert expiry
  complexity_layers:
    - cascading_side_effects                   # assessment-accept -> supersede -> ETR revision -> outage fields; verify-fail -> reopen -> forced ETR
    - rate / threshold triggers                # clustering promotion thresholds, fatigue cap, FEMA per-county threshold
    - optimistic_concurrency                   # OCC on Outage.version for ETR revision and assessment accept
    - derived_field_reconciliation             # event cost rollup, outage.current_etr, stock reserved/available, priority score
  entity_topology: graph                       # flat FK-linked peers + self-referential Outage.parent_outage_id (nested outage DAG) + many-to-many crew/work-order assignment
  state_machine_shape: parallel                # WorkOrder carries execution_status x verification_status dimensions that evolve independently and can reopen across dimensions
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties            # switching-order issuer != approver; FEMA claim preparer != certifier
  consistency_model: immediate                 # all side effects atomic within the triggering request

# =============================================================================
# Logical clock
# =============================================================================
# All temporal rules (ETR horizons, engagement windows, lodging windows,
# certification expiry, eligibility windows, fatigue windows) evaluate against
# a server-side logical clock. POST /om/_clock/set_current_utc sets it. Before
# any set call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall
# back to wall-clock time.

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Display name of the storm event" }
      - { name: event_type, type: enum, source: input, description: "THUNDERSTORM | HURRICANE | ICE_STORM | WILDFIRE_PSPS | TORNADO" }
      - { name: event_status, type: enum, source: system, description: "DECLARED | ACTIVE | DEMOBILIZING | CLOSED", default: DECLARED }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until ACTIVE" }
      - { name: open_outage_count, type: integer, source: computed, description: "Count of outages for this event with outage_status NOT IN {VERIFIED, CANCELLED}" }
      - { name: total_labor_cents, type: integer, source: computed, description: "Sum of CostLedgerEntry.amount_cents for this event with entry_type IN {LABOR_INTERNAL, LABOR_MUTUAL_AID} (reversal entries carry negative amounts and net out)" }
      - { name: total_material_cents, type: integer, source: computed, description: "Sum of MATERIAL entries for this event" }
      - { name: total_mutual_aid_cents, type: integer, source: computed, description: "Sum of LABOR_MUTUAL_AID + MUTUAL_AID_PENALTY entries" }
      - { name: total_lodging_cents, type: integer, source: computed, description: "Sum of LODGING entries (per-crew shares + overhead residual)" }
      - { name: total_event_cost_cents, type: integer, source: computed, description: "Sum of ALL CostLedgerEntry amounts for this event across every entry_type" }
      - { name: capital_cost_cents, type: integer, source: computed, description: "Sum of entries with cost_class = CAPITAL" }
      - { name: om_cost_cents, type: integer, source: computed, description: "Sum of entries with cost_class = O_AND_M" }

  - name: Feeder
    parent: null
    common_fields: true
    fields:
      - { name: feeder_code, type: string, source: input, description: "Unique operating code of the distribution circuit" }
      - { name: county_code, type: string, source: input, description: "County the feeder serves; FEMA claims are evaluated per county" }
      - { name: service_customer_count, type: integer, source: input, description: "Total customers on the feeder", constraints: ">= 1" }
      - { name: cluster_signal_threshold, type: integer, source: input, description: "Meter last-gasp count at/above which a cluster promotes to an outage", default: 3, constraints: ">= 1" }
      - { name: cluster_call_threshold, type: integer, source: input, description: "Customer-call count at/above which a cluster promotes to an outage", default: 5, constraints: ">= 1" }
      - { name: certified_priority_count, type: integer, source: computed, description: "Count of PriorityCustomer rows on this feeder with certification_status = CERTIFIED" }

  - name: PriorityCustomer
    parent: null
    common_fields: true
    fields:
      - { name: account_ref, type: string, source: input, description: "Utility account reference" }
      - { name: priority_class, type: enum, source: input, description: "LIFE_SUPPORT | CRITICAL_FACILITY" }
      - { name: feeder_id, type: string, source: input, description: "FK -> Feeder.id; feeder serving this customer" }
      - { name: certification_status, type: enum, source: system, description: "REGISTERED | CERTIFIED | SUSPENDED | DECERTIFIED", default: REGISTERED }
      - { name: certified_through, type: datetime, source: input, description: "Certification expiry instant; must be strictly after the logical now at certify time" }

  - name: TroubleSignal
    parent: null
    common_fields: false
    fields:
      - { name: signal_type, type: enum, source: input, description: "METER_LAST_GASP | CUSTOMER_CALL | SCADA_TRIP | METER_RESTORE_PING" }
      - { name: feeder_id, type: string, source: input, description: "FK -> Feeder.id; feeder the signal originated on" }
      - { name: outage_id, type: string, source: system, description: "FK -> Outage.id; set when clustered, or supplied at ingest for METER_RESTORE_PING; null otherwise" }
      - { name: occurred_at, type: datetime, source: input, description: "When the signal occurred; must be <= logical now" }
      - { name: disposition, type: enum, source: system, description: "UNCLUSTERED | CLUSTERED | DISMISSED", default: UNCLUSTERED }

  - name: Outage
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; owning event" }
      - { name: feeder_id, type: string, source: input, description: "FK -> Feeder.id; affected feeder" }
      - { name: parent_outage_id, type: string, source: input, description: "FK -> Outage.id; upstream outage this outage is nested inside; null for root outages. Must reference an outage on the same event that is not in {VERIFIED, CANCELLED}" }
      - { name: outage_status, type: enum, source: system, description: "SUSPECTED | CONFIRMED | ASSESSED | WORKING | RESTORED | VERIFIED | CANCELLED", default: SUSPECTED }
      - { name: cause_code, type: enum, source: input, description: "TREE | LIGHTNING | EQUIPMENT | VEHICLE | UNKNOWN; set at confirm" }
      - { name: customers_affected, type: integer, source: input, description: "Confirmed customer count; set at confirm", constraints: ">= 1" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical timestamp of confirmation; null until CONFIRMED" }
      - { name: current_etr, type: datetime, source: system, description: "Currently published ETR; mirrors the highest-seq EtrRevision.published_etr; null until first revision" }
      - { name: etr_missed, type: boolean, source: computed, description: "true when logical now > current_etr; recomputed on read and on every revision" }
      - { name: has_priority_customers, type: boolean, source: computed, description: "true when any CERTIFIED PriorityCustomer exists on this outage's feeder" }
      - { name: priority_score, type: integer, source: computed, description: "Dispatch ranking score per calculation outage_priority_score" }
      - { name: restoration_reported_at, type: datetime, source: system, description: "Logical timestamp of WORKING -> RESTORED; null until restored" }
      - { name: merged_into_outage_id, type: string, source: system, description: "FK -> Outage.id; set when this outage was cancelled by merge; null otherwise" }

  - name: EtrRevision
    parent: null
    common_fields: false
    fields:
      - { name: outage_id, type: string, source: system, description: "FK -> Outage.id; outage this revision publishes for" }
      - { name: revision_seq, type: integer, source: system, description: "Per-outage monotonic sequence starting at 1" }
      - { name: revision_reason, type: enum, source: input, description: "INITIAL | DAMAGE_FOUND | CREW_DELAYED | NESTED_DISCOVERED | WEATHER_DELAY | CORRECTION | VERIFICATION_FAILED" }
      - { name: published_etr, type: datetime, source: input, description: "The ETR instant being published (manual) or computed (system revisions)" }
      - { name: previous_etr, type: datetime, source: system, description: "The outage's current_etr immediately before this revision; null for seq 1" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of the revising dispatcher, or 'system' for auto revisions" }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: outage_id, type: string, source: input, description: "FK -> Outage.id; assessed outage" }
      - { name: assessor_crew_id, type: string, source: system, description: "FK -> Crew.id; set from X-User-ID of the creating FieldCrewLead" }
      - { name: assessment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | SUPERSEDED", default: DRAFT }
      - { name: damage_class, type: enum, source: input, description: "MINOR | MAJOR | CATASTROPHIC" }
      - { name: estimated_repair_minutes, type: integer, source: input, description: "Assessed repair duration", constraints: ">= 1" }
      - { name: requires_switching, type: boolean, source: input, description: "Whether restoration requires an executed switching order" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew code" }
      - { name: crew_type, type: enum, source: input, description: "LINE | TREE | DAMAGE_ASSESSOR | SUBSTATION" }
      - { name: home_base, type: string, source: input, description: "Home depot" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Loaded internal labor rate per hour", constraints: ">= 0" }
      - { name: crew_status, type: enum, source: system, description: "OFF_DUTY | AVAILABLE | EN_ROUTE | ON_SITE", default: OFF_DUTY }
      - { name: shift_started_at, type: datetime, source: system, description: "Logical timestamp of latest OFF_DUTY -> AVAILABLE" }
      - { name: worked_minutes_this_shift, type: integer, source: computed, description: "Sum of (completed_at - arrived_at) minutes over work orders completed by this crew since shift_started_at, plus (now - arrived_at) if currently ON_SITE on an IN_PROGRESS work order" }

  - name: MutualAidCrew
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; event this crew is engaged for" }
      - { name: company_name, type: string, source: input, description: "External utility/contractor name" }
      - { name: crew_type, type: enum, source: input, description: "LINE | TREE | DAMAGE_ASSESSOR | SUBSTATION" }
      - { name: roster_size, type: integer, source: input, description: "Headcount; drives lodging room consumption and per-diem", constraints: ">= 1" }
      - { name: service_county_code, type: string, source: input, description: "County this crew's costs are attributed to" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Per-day crew rate", constraints: ">= 0" }
      - { name: per_diem_cents, type: integer, source: input, description: "Per-day per-head per-diem", constraints: ">= 0" }
      - { name: committed_window_start, type: datetime, source: input, description: "Engagement window start (inclusive)" }
      - { name: committed_window_end, type: datetime, source: input, description: "Engagement window end (exclusive); must be after start" }
      - { name: ma_status, type: enum, source: system, description: "REQUESTED | AVAILABLE | DEMOBILIZING | DEPARTED | CANCELLED", default: REQUESTED }
      - { name: arrived_at, type: datetime, source: system, description: "Logical timestamp of arrival; null until AVAILABLE" }
      - { name: departed_at, type: datetime, source: system, description: "Logical timestamp of departure; null until DEPARTED" }
      - { name: lodging_block_id, type: string, source: system, description: "FK -> LodgingBlock.id; assigned lodging block; null when unassigned" }
      - { name: engagement_cost_cents, type: integer, source: computed, description: "Total engagement cost computed at DEPARTED per mutual_aid_engagement_cost; null until departure" }

  - name: LodgingBlock
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; event this block serves" }
      - { name: hotel_name, type: string, source: input, description: "Hotel identifier; uniqueness/overlap scope is (storm_event_id, hotel_name)" }
      - { name: county_code, type: string, source: input, description: "County the lodging cost is attributed to" }
      - { name: room_count, type: integer, source: input, description: "Rooms under contract", constraints: ">= 1" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Pre-tax nightly rate per room", constraints: ">= 0" }
      - { name: window_start, type: datetime, source: input, description: "First night (inclusive); window length must be a whole number of 24h nights" }
      - { name: window_end, type: datetime, source: input, description: "Checkout day (exclusive)" }
      - { name: block_status, type: enum, source: system, description: "OPEN | COMMITTED | RELEASED", default: OPEN }
      - { name: rooms_allocated, type: integer, source: computed, description: "Sum of roster_size over MutualAidCrews currently assigned to this block" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: outage_id, type: string, source: input, description: "FK -> Outage.id; outage being worked" }
      - { name: work_type, type: enum, source: input, description: "ASSESSMENT | REPAIR | REPLACE_POLE | REPLACE_TRANSFORMER | SWITCHING" }
      - { name: required_crew_type, type: enum, source: input, description: "LINE | TREE | DAMAGE_ASSESSOR | SUBSTATION" }
      - { name: requires_switching_order, type: boolean, source: input, description: "When true, start requires an EXECUTED SwitchingOrder on this work order" }
      - { name: execution_status, type: enum, source: system, description: "CREATED | READY | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED (parallel dimension 1)", default: CREATED }
      - { name: verification_status, type: enum, source: system, description: "PENDING_VERIFY | VERIFY_PASSED | VERIFY_FAILED (parallel dimension 2)", default: PENDING_VERIFY }
      - { name: assigned_crew_id, type: string, source: system, description: "FK -> Crew.id; internal assignee; null when unassigned or MA-assigned" }
      - { name: assigned_mutual_aid_crew_id, type: string, source: system, description: "FK -> MutualAidCrew.id; mutual-aid assignee; null when unassigned or internally assigned. Exactly one of assigned_crew_id / assigned_mutual_aid_crew_id is non-null once dispatched" }
      - { name: switching_order_id, type: string, source: system, description: "FK -> SwitchingOrder.id; set when a switching order is created for this work order; null otherwise" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical timestamp the assignee arrived on site" }
      - { name: completed_at, type: datetime, source: system, description: "Logical timestamp of completion" }

  - name: SwitchingOrder
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this switching order authorizes" }
      - { name: switching_steps, type: array, source: input, description: "Ordered list of switching step descriptions", constraints: "at least 1 step" }
      - { name: so_status, type: enum, source: system, description: "DRAFT | ISSUED | APPROVED | EXECUTED | ABORTED", default: DRAFT }
      - { name: issuer_user_id, type: string, source: system, description: "X-User-ID of the SystemOperator who created/issued" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the approving SystemOperator; MUST differ from issuer_user_id" }

  - name: MaterialStock
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_code, type: string, source: input, description: "Warehouse identifier; unique with material_sku" }
      - { name: material_sku, type: string, source: input, description: "Stock-keeping unit; unique with warehouse_code" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Physical units on hand", constraints: ">= 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-unit cost", constraints: ">= 0" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Sum of quantity over requisitions on this stock in STAGED status" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_on_hand - quantity_reserved" }

  - name: MaterialRequisition
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order the material is for" }
      - { name: material_stock_id, type: string, source: input, description: "FK -> MaterialStock.id; stock pool drawn from" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: ">= 1" }
      - { name: requisition_status, type: enum, source: system, description: "REQUESTED | STAGED | ISSUED | CONSUMED | RETURNED | CANCELLED", default: REQUESTED }

  - name: CostLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: storm_event_id, type: string, source: system, description: "FK -> StormEvent.id; event the cost accrues to" }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; originating work order for labor/material entries; null for mutual-aid engagement and lodging entries" }
      - { name: entry_type, type: enum, source: system, description: "LABOR_INTERNAL | LABOR_MUTUAL_AID | MATERIAL | LODGING | MUTUAL_AID_PENALTY" }
      - { name: cost_class, type: enum, source: system, description: "CAPITAL | O_AND_M; CAPITAL for labor/material on work_type IN {REPLACE_POLE, REPLACE_TRANSFORMER}, O_AND_M otherwise; mutual-aid and lodging entries are always O_AND_M" }
      - { name: county_code, type: string, source: system, description: "County attribution: feeder county via work order outage for labor/material; service_county_code for mutual-aid; block county for lodging" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; reversal entries carry negative amounts" }
      - { name: posted_at, type: datetime, source: system, description: "Logical timestamp the entry posted" }
      - { name: reversed_entry_id, type: string, source: system, description: "FK -> CostLedgerEntry.id; set on a reversal entry, referencing the entry it reverses; null on original entries" }

  - name: FemaClaim
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; claimed event" }
      - { name: county_code, type: string, source: input, description: "County this claim covers" }
      - { name: threshold_cents, type: integer, source: input, description: "County per-capita eligibility threshold", constraints: ">= 0" }
      - { name: claim_status, type: enum, source: system, description: "DRAFT | SUBMITTED | CERTIFIED | OBLIGATED | PAID | WITHDRAWN", default: DRAFT }
      - { name: eligible_cost_cents, type: integer, source: computed, description: "Current eligible cost per calculation fema_eligibility; live-recomputed while DRAFT" }
      - { name: eligible_snapshot_cents, type: integer, source: system, description: "Eligible cost frozen at submit; null until SUBMITTED" }
      - { name: variance_cents, type: integer, source: computed, description: "eligible_cost_cents - eligible_snapshot_cents once submitted; null while DRAFT" }
      - { name: preparer_user_id, type: string, source: system, description: "X-User-ID of the submitting ClaimsOfficer; cleared on withdraw" }
      - { name: certifier_user_id, type: string, source: system, description: "X-User-ID of the certifying ClaimsOfficer; MUST differ from preparer_user_id" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: StormEvent
    field: event_status
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /om/storm-events/{id}/activate"
        actor: EmergencyDirector
        preconditions: []
        side_effects: ["sets activated_at to logical now"]
      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "POST /om/storm-events/{id}/begin_demobilization"
        actor: EmergencyDirector
        preconditions:
          - "Every outage with storm_event_id = this event has outage_status IN {VERIFIED, CANCELLED} (else ERR_EVENT_HAS_OPEN_WORK)"
          - "Every mutual-aid crew with storm_event_id = this event has ma_status IN {DEPARTED, CANCELLED} (else ERR_EVENT_HAS_OPEN_WORK)"
          - "Every material requisition whose work order belongs to an outage of this event has requisition_status IN {CONSUMED, RETURNED, CANCELLED} (else ERR_EVENT_HAS_OPEN_WORK)"
          - "Every lodging block with storm_event_id = this event has block_status = RELEASED (else ERR_EVENT_HAS_OPEN_WORK)"
        side_effects: []
      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /om/storm-events/{id}/close"
        actor: EmergencyDirector
        preconditions:
          - "No switching order on any work order of this event's outages has so_status IN {DRAFT, ISSUED, APPROVED} (else ERR_EVENT_HAS_OPEN_WORK)"
        side_effects: ["After CLOSED, any mutation scoped to this event is rejected with ERR_EVENT_CLOSED"]

  - entity: PriorityCustomer
    field: certification_status
    initial_state: REGISTERED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: REGISTERED
        to: CERTIFIED
        trigger: "POST /om/priority-customers/{id}/certify"
        actor: Dispatcher
        preconditions: ["certified_through > logical now (else ERR_CERTIFICATION_WINDOW_PAST)"]
        side_effects: ["sets certified_through"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system sweep inside POST /om/_clock/set_current_utc when logical now advances past certified_through"
        actor: system
        preconditions: ["logical now > certified_through"]
        side_effects: ["recomputes certified_priority_count on the linked feeder", "recomputes has_priority_customers and priority_score on every non-terminal outage on the linked feeder"]
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /om/priority-customers/{id}/certify"
        actor: Dispatcher
        preconditions: ["certified_through > logical now (else ERR_CERTIFICATION_WINDOW_PAST)"]
        side_effects: ["sets certified_through", "recomputes certified_priority_count / has_priority_customers / priority_score on linked feeder outages"]
      - from: [REGISTERED, CERTIFIED, SUSPENDED]
        to: DECERTIFIED
        trigger: "POST /om/priority-customers/{id}/decertify"
        actor: Dispatcher
        preconditions: []
        side_effects: ["recomputes certified_priority_count / has_priority_customers / priority_score on linked feeder outages"]

  - entity: TroubleSignal
    field: disposition
    initial_state: UNCLUSTERED
    terminal_states: [CLUSTERED, DISMISSED]
    transitions:
      - from: UNCLUSTERED
        to: CLUSTERED
        trigger: "system inside POST /om/storm-events/{id}/run_clustering (signal belongs to a promoted cluster)"
        actor: system
        preconditions: []
        side_effects: ["sets outage_id to the promoted outage"]
      - from: UNCLUSTERED
        to: CLUSTERED
        trigger: "system at ingest when signal_type = METER_RESTORE_PING (outage_id supplied in payload)"
        actor: system
        preconditions: ["referenced outage has outage_status IN {WORKING, RESTORED} (else ERR_PING_OUTAGE_STATE)"]
        side_effects: ["sets outage_id from payload"]
      - from: UNCLUSTERED
        to: DISMISSED
        trigger: "system inside POST /om/outages/{id}/cancel (false-alarm cancel dismisses the outage's clustered signals)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Outage
    field: outage_status
    initial_state: SUSPECTED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "POST /om/outages/{id}/confirm"
        actor: Dispatcher
        preconditions: ["customers_affected >= 1 and cause_code supplied"]
        side_effects:
          - "sets customers_affected, cause_code, confirmed_at = logical now"
          - "creates EtrRevision seq 1 (revision_reason INITIAL, issued_by 'system') with published_etr computed per calculation etr_estimate (provisional variant)"
          - "sets current_etr to that published_etr and increments Outage.version by 1"
          - "recomputes priority_score"
      - from: CONFIRMED
        to: ASSESSED
        trigger: "system inside POST /om/damage-assessments/{id}/accept when the accepted assessment is the first ACCEPTED assessment on this outage"
        actor: system
        preconditions: []
        side_effects: ["increments Outage.version by 1"]
      - from: [CONFIRMED, ASSESSED]
        to: WORKING
        trigger: "system inside POST /om/work-orders/{id}/start when the first non-cancelled work order on this outage enters IN_PROGRESS"
        actor: system
        preconditions: []
        side_effects: ["increments Outage.version by 1 (a single increment for the whole start request)"]
      - from: WORKING
        to: RESTORED
        trigger: "POST /om/outages/{id}/report_restored"
        actor: Dispatcher
        preconditions:
          - "Every work order with outage_id = this outage has execution_status IN {COMPLETED, CANCELLED} (else ERR_OUTAGE_WORK_OPEN)"
          - "At least one work order on this outage has execution_status = COMPLETED"
        side_effects:
          - "sets restoration_reported_at = logical now"
          - "increments Outage.version by 1"
          - "does NOT change child (nested) outages: nested outages in {CONFIRMED, ASSESSED, WORKING} remain open and must be worked independently"
      - from: RESTORED
        to: VERIFIED
        trigger: "POST /om/outages/{id}/verify"
        actor: Dispatcher
        preconditions:
          - "Every child outage (parent_outage_id = this outage) has outage_status IN {VERIFIED, CANCELLED} (else ERR_OUTAGE_CHILDREN_OPEN)"
          - "Every non-cancelled work order on this outage has verification_status = VERIFY_PASSED (else ERR_UNVERIFIED_WORK_REMAINS)"
          - "At least one CLUSTERED TroubleSignal with signal_type = METER_RESTORE_PING and outage_id = this outage has occurred_at >= restoration_reported_at (else ERR_RESTORE_PING_MISSING)"
        side_effects: ["increments Outage.version by 1"]
      - from: [SUSPECTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /om/outages/{id}/cancel (false alarm)"
        actor: Dispatcher
        preconditions: ["No work orders exist with outage_id = this outage (else ERR_OUTAGE_WORK_OPEN)"]
        side_effects:
          - "every TroubleSignal with outage_id = this outage transitions CLUSTERED -> DISMISSED"
          - "increments Outage.version by 1"
      - from: [SUSPECTED, CONFIRMED, ASSESSED]
        to: CANCELLED
        trigger: "POST /om/outages/{id}/merge (duplicate merged into a target outage)"
        actor: Dispatcher
        preconditions:
          - "target_outage_id references an outage on the SAME storm event (else ERR_CROSS_EVENT_LINK) with outage_status NOT IN {VERIFIED, CANCELLED} (else ERR_INVALID_STATE_TRANSITION)"
          - "target_outage_id != this outage's id, and the target is not a transitive descendant of this outage (walk parent_outage_id chain; else ERR_MERGE_CYCLE)"
        side_effects:
          - "sets merged_into_outage_id = target_outage_id"
          - "re-links every TroubleSignal with outage_id = this outage to the target (outage_id = target), keeping disposition CLUSTERED"
          - "if this outage was in {CONFIRMED, ASSESSED}: target.customers_affected += this outage's customers_affected and target's priority_score is recomputed"
          - "every non-terminal work order on this outage transitions to execution_status CANCELLED; any assigned crew transitions EN_ROUTE -> AVAILABLE"
          - "every child outage (parent_outage_id = this outage) is re-parented: parent_outage_id = target_outage_id"
          - "increments Outage.version by 1 on both source and target"

  - entity: DamageAssessment
    field: assessment_status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /om/damage-assessments/{id}/submit"
        actor: FieldCrewLead
        preconditions: ["X-User-ID equals assessor_crew_id (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /om/damage-assessments/{id}/return (rework loop)"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /om/damage-assessments/{id}/accept"
        actor: Dispatcher
        preconditions:
          - "expected_outage_version equals the linked outage's current version (OCC; else ERR_STALE_OUTAGE_VERSION)"
          - "linked outage has outage_status IN {CONFIRMED, ASSESSED, WORKING} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "any other DamageAssessment on the same outage currently ACCEPTED transitions to SUPERSEDED"
          - "if the linked outage is CONFIRMED, it transitions CONFIRMED -> ASSESSED"
          - "creates a system EtrRevision (revision_reason DAMAGE_FOUND, issued_by 'system') on the linked outage with published_etr computed per calculation etr_estimate (post_assessment variant) and sets outage.current_etr"
          - "increments Outage.version by exactly 1 for the whole accept request (state change + revision together)"
          - "recomputes outage.priority_score"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system inside POST /om/damage-assessments/{id}/accept of a different assessment on the same outage"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Crew
    field: crew_status
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /om/crews/{id}/start_shift"
        actor: Dispatcher
        preconditions: []
        side_effects: ["sets shift_started_at = logical now", "resets worked_minutes_this_shift baseline to 0"]
      - from: AVAILABLE
        to: EN_ROUTE
        trigger: "system inside POST /om/work-orders/{id}/assign or POST /om/storm-events/{id}/dispatch_next"
        actor: system
        preconditions: ["fatigue projection per calculation crew_fatigue_projection <= 960 minutes (else ERR_FATIGUE_LIMIT_EXCEEDED)"]
        side_effects: []
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /om/work-orders/{id}/arrive"
        actor: "FieldCrewLead (own crew) or Dispatcher"
        preconditions: ["linked work order has execution_status = DISPATCHED"]
        side_effects: ["sets work order arrived_at = logical now"]
      - from: ON_SITE
        to: AVAILABLE
        trigger: "system inside POST /om/work-orders/{id}/complete"
        actor: system
        preconditions: []
        side_effects: ["adds (completed_at - arrived_at) minutes to worked_minutes_this_shift"]
      - from: EN_ROUTE
        to: AVAILABLE
        trigger: "system inside POST /om/work-orders/{id}/cancel (crew released before arrival)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [AVAILABLE, EN_ROUTE, ON_SITE]
        to: OFF_DUTY
        trigger: "POST /om/crews/{id}/end_shift"
        actor: Dispatcher
        preconditions: ["crew is not EN_ROUTE or ON_SITE on any non-terminal work order (else ERR_INVALID_STATE_TRANSITION); i.e., only AVAILABLE -> OFF_DUTY is accepted"]
        side_effects: []

  - entity: MutualAidCrew
    field: ma_status
    initial_state: REQUESTED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: AVAILABLE
        trigger: "POST /om/mutual-aid-crews/{id}/mark_arrived"
        actor: MutualAidCoordinator
        preconditions:
          - "logical now is within [committed_window_start, committed_window_end) (else ERR_OUTSIDE_ENGAGEMENT_WINDOW)"
          - "linked storm event has event_status = ACTIVE (else ERR_EVENT_NOT_ACTIVE)"
        side_effects: ["sets arrived_at = logical now"]
      - from: AVAILABLE
        to: DEMOBILIZING
        trigger: "POST /om/mutual-aid-crews/{id}/demobilize"
        actor: MutualAidCoordinator
        preconditions: ["no work order assigned to this crew has execution_status IN {DISPATCHED, IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "releases lodging: if lodging_block_id is set, clears it and decrements the block's rooms_allocated by roster_size"
      - from: DEMOBILIZING
        to: DEPARTED
        trigger: "POST /om/mutual-aid-crews/{id}/depart"
        actor: MutualAidCoordinator
        preconditions: []
        side_effects:
          - "sets departed_at = logical now"
          - "computes engagement_cost_cents per calculation mutual_aid_engagement_cost (full vs early variant by departure_reason)"
          - "posts CostLedgerEntry LABOR_MUTUAL_AID (actual engagement cost; county = service_county_code)"
          - "if the early variant produced a penalty, posts CostLedgerEntry MUTUAL_AID_PENALTY"
          - "recomputes the event's total_mutual_aid_cents, total_labor_cents, total_event_cost_cents, om_cost_cents"
      - from: [REQUESTED]
        to: CANCELLED
        trigger: "POST /om/mutual-aid-crews/{id}/cancel"
        actor: MutualAidCoordinator
        preconditions: ["lodging_block_id is null (release lodging first via demobilize is N/A from REQUESTED; assignment is only possible from AVAILABLE, so a REQUESTED crew never holds lodging)"]
        side_effects: []

  - entity: LodgingBlock
    field: block_status
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /om/lodging-blocks/{id}/commit"
        actor: MutualAidCoordinator
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /om/lodging-blocks/{id}/release"
        actor: MutualAidCoordinator
        preconditions: ["rooms_allocated = 0 (no crew currently assigned; else ERR_LODGING_HAS_ACTIVE_CREWS)"]
        side_effects:
          - "posts per-crew LODGING CostLedgerEntries per calculation lodging_cost_allocation (one per crew that was assigned during the block's life, recorded at assignment time)"
          - "posts one overhead LODGING entry for the rounding/unbooked residual"
          - "recomputes the event's total_lodging_cents and total_event_cost_cents"

  - entity: WorkOrder
    field: execution_status
    initial_state: CREATED
    terminal_states: [COMPLETED, CANCELLED]
    note: "PARALLEL DIMENSIONS: execution_status and verification_status evolve independently. verification_status only moves while execution_status = COMPLETED (verify endpoint) except VERIFY_FAILED which reopens execution."
    transitions:
      - from: CREATED
        to: READY
        trigger: "POST /om/work-orders/{id}/ready"
        actor: Dispatcher
        preconditions:
          - "linked outage has outage_status IN {CONFIRMED, ASSESSED, WORKING} (else ERR_INVALID_STATE_TRANSITION)"
          - "if work_type != ASSESSMENT: at least one DamageAssessment on the linked outage has assessment_status = ACCEPTED (else ERR_ASSESSMENT_REQUIRED)"
        side_effects: []
      - from: READY
        to: DISPATCHED
        trigger: "POST /om/work-orders/{id}/assign or POST /om/storm-events/{id}/dispatch_next"
        actor: Dispatcher
        preconditions:
          - "exactly one of crew_id / mutual_aid_crew_id supplied (both -> ERR_ASSIGNEE_AMBIGUOUS; neither -> ERR_INVALID_REQUEST)"
          - "internal crew: crew_status = AVAILABLE (else ERR_CREW_NOT_AVAILABLE), crew_type = required_crew_type (else ERR_CREW_TYPE_MISMATCH), fatigue projection <= 960 (else ERR_FATIGUE_LIMIT_EXCEEDED)"
          - "mutual-aid crew: ma_status = AVAILABLE (else ERR_CREW_NOT_AVAILABLE), crew_type = required_crew_type (else ERR_CREW_TYPE_MISMATCH), logical now within [committed_window_start, committed_window_end) (else ERR_OUTSIDE_ENGAGEMENT_WINDOW)"
        side_effects:
          - "sets assigned_crew_id or assigned_mutual_aid_crew_id"
          - "internal crew transitions AVAILABLE -> EN_ROUTE (mutual-aid crews keep ma_status AVAILABLE while assigned)"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /om/work-orders/{id}/start"
        actor: "FieldCrewLead (own crew) or Dispatcher"
        preconditions:
          - "assigned internal crew has crew_status = ON_SITE (else ERR_CREW_NOT_ON_SITE); mutual-aid assignments skip the on-site check"
          - "if requires_switching_order: the SwitchingOrder with id = switching_order_id has so_status = EXECUTED (else ERR_SWITCHING_NOT_EXECUTED)"
        side_effects:
          - "if this is the first non-cancelled work order on the outage to enter IN_PROGRESS and the outage is CONFIRMED or ASSESSED, the outage transitions to WORKING (single version increment for the whole request)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /om/work-orders/{id}/complete"
        actor: "FieldCrewLead (own crew) or Dispatcher"
        preconditions: []
        side_effects:
          - "sets completed_at = logical now"
          - "internal crew: transitions ON_SITE -> AVAILABLE and accumulates worked minutes"
          - "internal crew only: posts CostLedgerEntry LABOR_INTERNAL with amount per calculation labor_cost_posting (mutual-aid assignments post no labor entry; their cost is settled at crew departure)"
      - from: [CREATED, READY, DISPATCHED]
        to: CANCELLED
        trigger: "POST /om/work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "if an internal crew is EN_ROUTE on this work order, it transitions EN_ROUTE -> AVAILABLE and assigned_crew_id clears"
          - "every material requisition on this work order in REQUESTED transitions to CANCELLED; every one in STAGED transitions to CANCELLED and releases its reservation (stock quantity_reserved -= quantity)"

  - entity: WorkOrderVerification
    field: verification_status
    initial_state: PENDING_VERIFY
    terminal_states: [VERIFY_PASSED]
    note: "Second parallel state dimension of WorkOrder (same row). VERIFY_FAILED is non-terminal: a re-completion returns the dimension to PENDING_VERIFY."
    transitions:
      - from: PENDING_VERIFY
        to: VERIFY_PASSED
        trigger: "POST /om/work-orders/{id}/verify with outcome = PASSED"
        actor: Dispatcher
        preconditions: ["execution_status = COMPLETED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: PENDING_VERIFY
        to: VERIFY_FAILED
        trigger: "POST /om/work-orders/{id}/verify with outcome = FAILED"
        actor: Dispatcher
        preconditions: ["execution_status = COMPLETED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "execution_status reopens COMPLETED -> IN_PROGRESS (cross-dimension cascade); completed_at clears"
          - "creates a system EtrRevision (revision_reason VERIFICATION_FAILED, issued_by 'system') on the linked outage with published_etr = logical now + 180 minutes; sets outage.current_etr and increments Outage.version by 1"
      - from: VERIFY_FAILED
        to: PENDING_VERIFY
        trigger: "system inside POST /om/work-orders/{id}/complete (re-completion after a failed verification)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SwitchingOrder
    field: so_status
    initial_state: DRAFT
    terminal_states: [EXECUTED, ABORTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /om/switching-orders/{id}/issue"
        actor: SystemOperator
        preconditions: ["X-User-ID equals issuer_user_id (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: []
      - from: ISSUED
        to: DRAFT
        trigger: "POST /om/switching-orders/{id}/issue is not applicable; no return transition — corrections require abort and a new order"
        actor: SystemOperator
        preconditions: ["this transition does not exist; listed to pin that ISSUED -> DRAFT is rejected with ERR_INVALID_STATE_TRANSITION"]
        side_effects: []
        note: "EXPLICIT NON-TRANSITION: ISSUED cannot revert to DRAFT"
      - from: ISSUED
        to: APPROVED
        trigger: "POST /om/switching-orders/{id}/approve"
        actor: SystemOperator
        preconditions: ["X-User-ID != issuer_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["sets approver_user_id = X-User-ID"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /om/switching-orders/{id}/execute"
        actor: SystemOperator
        preconditions:
          - "linked work order has execution_status NOT IN {COMPLETED, CANCELLED} (else ERR_INVALID_STATE_TRANSITION)"
          - "linked outage's storm event has event_status = ACTIVE (else ERR_EVENT_NOT_ACTIVE)"
        side_effects: []
      - from: [DRAFT, ISSUED, APPROVED]
        to: ABORTED
        trigger: "POST /om/switching-orders/{id}/abort"
        actor: SystemOperator
        preconditions: []
        side_effects: ["clears switching_order_id on the linked work order (a fresh switching order must be created before start)"]

  - entity: MaterialRequisition
    field: requisition_status
    initial_state: REQUESTED
    terminal_states: [CONSUMED, RETURNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: STAGED
        trigger: "POST /om/material-requisitions/{id}/stage"
        actor: MaterialsManager
        preconditions: ["stock quantity_available >= quantity (else ERR_INSUFFICIENT_MATERIAL)"]
        side_effects: ["stock quantity_reserved += quantity"]
      - from: STAGED
        to: ISSUED
        trigger: "POST /om/material-requisitions/{id}/issue"
        actor: MaterialsManager
        preconditions: []
        side_effects:
          - "stock quantity_reserved -= quantity and quantity_on_hand -= quantity"
          - "posts CostLedgerEntry MATERIAL with amount = quantity * unit_cost_cents (county = work order outage's feeder county; cost_class per work_type)"
          - "recomputes event total_material_cents / total_event_cost_cents"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /om/material-requisitions/{id}/return"
        actor: MaterialsManager
        preconditions: []
        side_effects:
          - "stock quantity_on_hand += quantity"
          - "posts a reversal CostLedgerEntry MATERIAL with amount = -(original issue amount) and reversed_entry_id = the issue entry's id"
          - "recomputes event total_material_cents / total_event_cost_cents"
      - from: ISSUED
        to: CONSUMED
        trigger: "POST /om/material-requisitions/{id}/consume"
        actor: MaterialsManager
        preconditions: []
        side_effects: []
      - from: [REQUESTED, STAGED]
        to: CANCELLED
        trigger: "POST /om/material-requisitions/{id}/cancel, or system inside work-order cancel / outage merge"
        actor: "MaterialsManager or system"
        preconditions: []
        side_effects: ["if STAGED: stock quantity_reserved -= quantity"]

  - entity: FemaClaim
    field: claim_status
    initial_state: DRAFT
    terminal_states: [PAID, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /om/fema-claims/{id}/submit"
        actor: ClaimsOfficer
        preconditions:
          - "storm event has event_status IN {DEMOBILIZING, CLOSED} (else ERR_EVENT_NOT_DEMOBILIZING)"
          - "eligible_cost_cents >= threshold_cents (boundary: equality qualifies; else ERR_FEMA_THRESHOLD_NOT_MET)"
        side_effects:
          - "sets preparer_user_id = X-User-ID"
          - "freezes eligible_snapshot_cents = current eligible_cost_cents"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /om/fema-claims/{id}/certify"
        actor: ClaimsOfficer
        preconditions: ["X-User-ID != preparer_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["sets certifier_user_id = X-User-ID"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /om/fema-claims/{id}/withdraw (revision loop)"
        actor: ClaimsOfficer
        preconditions: []
        side_effects: ["clears preparer_user_id and eligible_snapshot_cents"]
      - from: CERTIFIED
        to: OBLIGATED
        trigger: "POST /om/fema-claims/{id}/obligate"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: OBLIGATED
        to: PAID
        trigger: "POST /om/fema-claims/{id}/mark_paid"
        actor: Regulator
        preconditions: []
        side_effects: []
      - from: [DRAFT, SUBMITTED]
        to: WITHDRAWN
        trigger: "POST /om/fema-claims/{id}/withdraw with payload permanent = true"
        actor: ClaimsOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: etr-revision-stale-outage
    parent_entity: Outage
    write_endpoint: "POST /om/outages/{id}/etr-revisions"
    occ_field: expected_outage_version
    description: |
      Publishing an ETR revision against an Outage whose version has advanced
      since the client last observed it is rejected. The new revision would
      legitimately supersede the current ETR (no state precondition catches
      it — the outage is still in the same status), so the stale-view writer
      is stopped by the OCC check instead of silently reordering history.
    error_id: ERR_STALE_OUTAGE_VERSION
    http_status: 412
  - rule_id: assessment-accept-stale-outage
    parent_entity: Outage
    write_endpoint: "POST /om/damage-assessments/{id}/accept"
    occ_field: expected_outage_version
    description: |
      Accepting a damage assessment against an Outage whose version has
      advanced since the client last observed it is rejected. Accepting is a
      create-with-supersede operation (a newer accepted assessment legitimately
      supersedes the prior one and rewrites the ETR), so a stale-view accept
      is stopped by OCC rather than superseding on outdated observations.
    error_id: ERR_STALE_OUTAGE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: etr_estimate
    trigger: "outage confirm (provisional variant, EtrRevision seq 1); damage-assessment accept (post_assessment variant, system revision)"
    algorithm: forward_looking
    formula: |
      PROVISIONAL variant (at confirm, no accepted assessment exists):
        base_minutes = BASE_PREP_MINUTES
                     + round_half_up(min(customers_affected, CUSTOMER_CAP) * PER_CUSTOMER_MINUTES * CAUSE_FACTOR[cause_code])
        published_etr = confirmed_at + base_minutes minutes
      POST_ASSESSMENT variant (at assessment accept):
        crew_factor = 1.0 if any work order on the outage with execution_status NOT IN {CANCELLED} has
                      (assigned_crew_id non-null OR assigned_mutual_aid_crew_id non-null), else 1.5
        repair = round_half_up(estimated_repair_minutes * crew_factor)   # rounding pinned HERE, before overhead add
        published_etr = accepted_at + (repair + (SWITCHING_OVERHEAD_MINUTES if requires_switching else 0)) minutes
      EVALUATION ORDER PIN (circular-looking dependency): priority_score uses etr_missed which reads
      current_etr; dispatch ranking uses priority_score; crew_factor depends on assignment. The server
      MUST evaluate in this order: (1) scores/ranking use the PRE-revision current_etr; (2) assignment
      happens; (3) ETR recompute observes the post-assignment crew_factor. Never re-derive ranking
      inputs from the ETR being computed in the same request.
    input_set: "the outage being confirmed/assessed; its ACCEPTED damage assessment (post_assessment variant); its non-cancelled work orders"
    constants:
      BASE_PREP_MINUTES: 120
      PER_CUSTOMER_MINUTES: 2
      CUSTOMER_CAP: 5000
      SWITCHING_OVERHEAD_MINUTES: 45
      CAUSE_FACTOR: { TREE: 1.5, LIGHTNING: 1.2, EQUIPMENT: 1.0, VEHICLE: 1.3, UNKNOWN: 1.4 }
    precision: "whole minutes, round_half_up applied to the multiplication BEFORE adding overheads"
    variants:
      - name: provisional
        when: "SUSPECTED -> CONFIRMED; no accepted assessment yet"
        difference: "uses customers_affected x cause factor; ignores field assessment data entirely"
      - name: post_assessment
        when: "damage-assessment accept"
        difference: "uses estimated_repair_minutes x crew_factor + switching overhead; for identical outage data the two variants produce different ETRs (e.g., 420 min provisional vs 362 min post-assessment for repair=241 unassigned)"

  - name: etr_revision_constraints
    trigger: "POST /om/outages/{id}/etr-revisions (manual revisions only; system revisions from assessment-accept or verify-fail are exempt from the backward/cap/lock rules)"
    algorithm: threshold
    formula: |
      Let now = logical now, cur = outage.current_etr, new = payload published_etr.
      1. new <= now -> ERR_ETR_IN_PAST (an ETR must always be in the future).
      2. Backward revision (new < cur): allowed ONLY when revision_reason = CORRECTION AND
         outage_status IN {CONFIRMED, ASSESSED}; otherwise ERR_ETR_BACKWARD_FORBIDDEN.
         When now > cur (ETR missed): CORRECTION is always rejected.
      3. Extension (new > cur): delta = new - cur must be <= MAX_SINGLE_EXTENSION_MINUTES unless
         revision_reason = DAMAGE_FOUND (uncapped). delta == MAX_SINGLE_EXTENSION_MINUTES is ALLOWED
         (boundary is inclusive); delta of cap+1 minute -> ERR_ETR_EXTENSION_EXCEEDS_CAP.
      4. Public-commit lock horizon: when now is within [cur - PUBLIC_LOCK_MINUTES, cur] (inclusive
         both ends), every revision is rejected with ERR_ETR_LOCKED_HORIZON except reason
         NESTED_DISCOVERED. When now > cur (missed), the lock no longer applies.
      On success: revision_seq = max(existing seq for outage) + 1; previous_etr = cur;
      outage.current_etr = new; Outage.version += 1; etr_missed recomputed.
    input_set: "the target outage; its EtrRevision history"
    constants:
      MAX_SINGLE_EXTENSION_MINUTES: 360
      PUBLIC_LOCK_MINUTES: 30
      REWORK_EXTENSION_MINUTES: 180   # used by VERIFICATION_FAILED system revisions
    precision: "minute precision on datetimes"

  - name: clustering_promotion
    trigger: "POST /om/storm-events/{id}/run_clustering"
    algorithm: threshold
    formula: |
      For the given feeder_id:
        candidates = TroubleSignals with feeder_id = feeder_id, disposition = UNCLUSTERED,
                     signal_type IN {METER_LAST_GASP, CUSTOMER_CALL, SCADA_TRIP}
        Sort by occurred_at ASC (tie-break: created_at ASC — never id).
        anchor = earliest candidate by that order. group = candidates with occurred_at in
                 [anchor.occurred_at, anchor.occurred_at + CLUSTER_WINDOW_MINUTES] (inclusive end).
        L = count(METER_LAST_GASP in group), C = count(CUSTOMER_CALL in group), S = count(SCADA_TRIP in group)
        PROMOTE iff S >= 1 OR L >= feeder.cluster_signal_threshold OR C >= feeder.cluster_call_threshold
        (boundary: counts exactly EQUAL to the threshold promote; threshold-1 does not).
        On promote: create Outage(storm_event_id = path event, feeder_id, outage_status = SUSPECTED,
          customers_affected null until confirm); every signal in group -> CLUSTERED with outage_id set.
        If not promoted: all candidates remain UNCLUSTERED (they may accumulate across runs; each run
          re-anchors at the earliest still-UNCLUSTERED signal).
        Only ONE group is evaluated per run (the anchored group); repeat runs promote further groups.
    input_set: "UNCLUSTERED signals of the feeder; METER_RESTORE_PING signals are never clustered here"
    constants:
      CLUSTER_WINDOW_MINUTES: 60
    precision: "minute precision"

  - name: outage_priority_score
    trigger: "recomputed on outage confirm, on ETR revision, on clock sweep that suspends/certifies a priority customer on the feeder, and on read"
    algorithm: weighted_scoring
    formula: |
      score = (LIFE_SUPPORT_BONUS if exists PriorityCustomer on outage.feeder_id with
                 certification_status = CERTIFIED and priority_class = LIFE_SUPPORT else 0)
            + (CRITICAL_FACILITY_BONUS if exists CERTIFIED CRITICAL_FACILITY on the feeder else 0)
            + min(customers_affected, CUSTOMER_SCORE_CAP)
            + floor((now - confirmed_at) in hours) * AGE_HOURLY_POINTS
            + (MISSED_ETR_BONUS if etr_missed else 0)
      Dispatch selector (POST /om/storm-events/{id}/dispatch_next):
        eligible = work orders with execution_status = READY, required_crew_type = crew.crew_type,
                   whose outage belongs to the path event and is NOT IN {VERIFIED, CANCELLED}.
        ranking = outage.priority_score DESC; tie-break = work order created_at ASC (never id).
        empty eligible set -> ERR_NO_ELIGIBLE_WORK.
    input_set: "the outage; CERTIFIED priority customers on its feeder; logical now"
    constants:
      LIFE_SUPPORT_BONUS: 10000
      CRITICAL_FACILITY_BONUS: 4000
      CUSTOMER_SCORE_CAP: 10000
      AGE_HOURLY_POINTS: 50
      MISSED_ETR_BONUS: 2000
    precision: "integer points"

  - name: crew_fatigue_projection
    trigger: "POST /om/work-orders/{id}/assign and POST /om/storm-events/{id}/dispatch_next (internal crews only)"
    algorithm: threshold
    formula: |
      projected = crew.worked_minutes_this_shift + estimate
      where estimate = estimated_repair_minutes of the outage's ACCEPTED assessment, else DEFAULT_ESTIMATE_MINUTES.
      Assign is allowed iff projected <= MAX_CONTINUOUS_WORK_MINUTES (boundary: exactly 960 is ALLOWED;
      961 -> ERR_FATIGUE_LIMIT_EXCEEDED).
    input_set: "the crew's completed/in-progress work orders since shift_started_at; the outage's ACCEPTED assessment"
    constants:
      MAX_CONTINUOUS_WORK_MINUTES: 960
      DEFAULT_ESTIMATE_MINUTES: 120
    precision: "whole minutes"

  - name: mutual_aid_engagement_cost
    trigger: "POST /om/mutual-aid-crews/{id}/depart"
    algorithm: tiered_pricing
    formula: |
      daily_cost = daily_rate_cents + roster_size * per_diem_cents
      billable_start = max(committed_window_start, arrived_at)
      actual_days = ceil( (departed_at - billable_start) / 24h )        # exactly 24h -> 1 day; 24h+1min -> 2
      FULL variant (departure_reason = COMPLETED, or departed_at >= committed_window_end):
        engagement_cost = actual_days * daily_cost; penalty = 0
      EARLY variant (departure_reason = EARLY_RELEASE and departed_at < committed_window_end):
        remaining_days = ceil( (committed_window_end - departed_at) / 24h )
        penalty = round_half_up(remaining_days * daily_rate_cents * EARLY_EXIT_PENALTY_PCT)
          # per-diem is NOT paid on the penalty; rounding pinned at this final penalty step only
        engagement_cost = actual_days * daily_cost + penalty
      Posts: LABOR_MUTUAL_AID entry = actual_days * daily_cost; if penalty > 0, a separate
      MUTUAL_AID_PENALTY entry = penalty (MUTUAL_AID_PENALTY is FEMA-ineligible).
    input_set: "the departing mutual-aid crew"
    constants:
      EARLY_EXIT_PENALTY_PCT: 0.25
    precision: "2 decimal places internally; final amounts in whole cents, round_half_up"
    variants:
      - name: full_engagement
        when: "departure_reason = COMPLETED or departure at/after window end"
        difference: "no penalty; for identical window and rates a 4-day full engagement costs 320000 cents vs 185000 cents for a 2-day early release (roster 4, rate 50000, per-diem 7500)"
      - name: early_release
        when: "departure_reason = EARLY_RELEASE before window end"
        difference: "pays actual days plus 25% of remaining days' daily_rate (no per-diem on penalty)"

  - name: lodging_cost_allocation
    trigger: "POST /om/lodging-blocks/{id}/release"
    algorithm: waterfall_allocation
    formula: |
      block_nights = (window_end - window_start) / 24h (whole number enforced at creation)
      block_total = round_half_up(room_count * block_nights * nightly_rate_cents * (1 + LODGING_TAX_PCT))
      For each mutual-aid crew that held an assignment to this block (assignment facts recorded at
      assign/unassign time), in order of assignment created_at ASC:
        crew_nights = (min(crew window_end, window_end) - max(crew window_start, window_start)) / 24h
        share = round_half_up(roster_size * crew_nights * nightly_rate_cents * (1 + LODGING_TAX_PCT))
        post LODGING entry = share (county = block county_code)
      ROUNDING ORDER PIN: tax is applied per crew share and rounded half-up to cents BEFORE summing;
      the block total is rounded separately. residual = block_total - sum(shares) posts as one LODGING
      overhead entry (no crew reference) — this residual deliberately absorbs sub-cent rounding drift
      (e.g., 5 rooms x 1 night x 12345 cents at 7% tax: shares 26418 + 39627, block total 66046,
      residual 1 cent).
    input_set: "the lodging block; all crews that were assigned to it during its life"
    constants:
      LODGING_TAX_PCT: 0.07
    precision: "whole cents, round_half_up, per-share-first order pinned"

  - name: labor_cost_posting
    trigger: "POST /om/work-orders/{id}/complete (internal crews only)"
    algorithm: aggregation
    formula: |
      worked_minutes = completed_at - arrived_at (minutes)
      amount_cents = round_half_up(worked_minutes * crew.hourly_rate_cents / 60)
      entry_type = LABOR_INTERNAL; county = outage.feeder.county_code
      cost_class = CAPITAL if work_type IN {REPLACE_POLE, REPLACE_TRANSFORMER} else O_AND_M
      Mutual-aid-assigned work orders post NO entry here (their cost is settled at crew departure).
    input_set: "the completed work order; its assigned internal crew"
    precision: "whole cents, round_half_up at posting (e.g., 30 min at 10001 cents/hr -> 5001 cents)"

  - name: event_cost_rollup
    trigger: "every CostLedgerEntry posting (including reversals)"
    algorithm: aggregation
    formula: |
      Reversal entries carry negative amount_cents and reversed_entry_id -> the original entry;
      rollups simply SUM ALL entries (originals + reversals) for the event:
        total_labor_cents    = sum(entry_type IN {LABOR_INTERNAL, LABOR_MUTUAL_AID})
        total_material_cents = sum(entry_type = MATERIAL)
        total_mutual_aid_cents = sum(entry_type IN {LABOR_MUTUAL_AID, MUTUAL_AID_PENALTY})
        total_lodging_cents  = sum(entry_type = LODGING)
        total_event_cost_cents = sum(ALL entries)
        capital_cost_cents / om_cost_cents split by cost_class
    input_set: "all CostLedgerEntry rows with storm_event_id = the event (reversals included)"
    precision: "whole cents"

  - name: fema_eligibility
    trigger: "read of FemaClaim.eligible_cost_cents (DRAFT); frozen into eligible_snapshot_cents at submit"
    algorithm: aggregation
    formula: |
      eligible = sum of CostLedgerEntry.amount_cents where
        entry.storm_event_id = claim.storm_event_id
        AND entry.county_code = claim.county_code
        AND entry.entry_type IN {LABOR_INTERNAL, LABOR_MUTUAL_AID, MATERIAL}
          (LODGING and MUTUAL_AID_PENALTY are FEMA-ineligible and excluded)
        AND entry.posted_at >= storm_event.activated_at
        AND entry.posted_at <= storm_event.activated_at + ELIGIBILITY_HOURS hours (inclusive both ends)
      Reversal entries net against their originals inside the sum.
      meets_threshold = (eligible >= threshold_cents)   # boundary: equality QUALIFIES
      After submit: variance_cents = eligible_cost_cents - eligible_snapshot_cents (recomputed on read).
    input_set: "ledger entries for the event attributed to the claim's county inside the eligibility window"
    constants:
      ELIGIBILITY_HOURS: 96
    precision: "whole cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right; body-supplied FK references (feeder_id, storm_event_id, parent_outage_id, outage_id, crew_id, mutual_aid_crew_id, material_stock_id, work_order_id, lodging_block_id, target_outage_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "Target resource's own state permits the transition (per state_machines); includes event posture gates (ERR_EVENT_NOT_ACTIVE for clustering/arrival/switching-execute outside ACTIVE; ERR_EVENT_NOT_DEMOBILIZING for FEMA submit outside DEMOBILIZING/CLOSED; ERR_EVENT_CLOSED for any mutation scoped to a CLOSED event; ERR_LODGING_NOT_COMMITTED for assign_lodging on a non-COMMITTED block; ERR_PING_OUTAGE_STATE for restore pings on outages outside {WORKING, RESTORED}) and cross-entity child-state gates (ERR_OUTAGE_WORK_OPEN, ERR_OUTAGE_CHILDREN_OPEN, ERR_UNVERIFIED_WORK_REMAINS, ERR_RESTORE_PING_MISSING)"
    error_id: "ERR_INVALID_STATE_TRANSITION (own-state) | ERR_EVENT_NOT_ACTIVE | ERR_EVENT_NOT_DEMOBILIZING | ERR_EVENT_CLOSED | ERR_LODGING_NOT_COMMITTED | ERR_PING_OUTAGE_STATE | ERR_OUTAGE_WORK_OPEN | ERR_OUTAGE_CHILDREN_OPEN | ERR_UNVERIFIED_WORK_REMAINS | ERR_RESTORE_PING_MISSING"
    http_status: 400
    applies_to: "state-transition endpoints"
    note: "Within priority 4, the resource's OWN state check fires before cross-entity child-state checks."
  - priority: 5
    category: business_safety
    check: "Safety and segregation-of-duties gates: switching order must be EXECUTED before a switching-flagged work order starts (ERR_SWITCHING_NOT_EXECUTED); crew fatigue projection <= 960 minutes (ERR_FATIGUE_LIMIT_EXCEEDED); crew must be ON_SITE to start (ERR_CREW_NOT_ON_SITE); switching-order approver must differ from issuer and FEMA certifier must differ from preparer (ERR_SEGREGATION_OF_DUTIES); FieldCrewLead may only act on their own crew's work orders / assessments (ERR_OWNERSHIP_MISMATCH)"
    error_id: "ERR_SWITCHING_NOT_EXECUTED | ERR_FATIGUE_LIMIT_EXCEEDED | ERR_CREW_NOT_ON_SITE | ERR_SEGREGATION_OF_DUTIES | ERR_OWNERSHIP_MISMATCH"
    http_status: 422
    applies_to: "work-order start/assign, dispatch_next, switching-order approve, fema certify, FieldCrewLead action endpoints"
    note: "ERR_SEGREGATION_OF_DUTIES and ERR_OWNERSHIP_MISMATCH return http 403; the rest 422."
  - priority: 6
    category: business_referential
    check: "Cross-aggregate link integrity: parent outage must belong to the same storm event (ERR_CROSS_EVENT_LINK) and must not be VERIFIED/CANCELLED (ERR_PARENT_OUTAGE_TERMINAL); merge target must be same-event and non-terminal and not a descendant (ERR_CROSS_EVENT_LINK / ERR_MERGE_CYCLE); lodging block and mutual-aid crew must share the same storm event (ERR_CROSS_EVENT_LINK); a non-ASSESSMENT work order requires an ACCEPTED damage assessment on its outage (ERR_ASSESSMENT_REQUIRED)"
    error_id: "ERR_CROSS_EVENT_LINK | ERR_PARENT_OUTAGE_TERMINAL | ERR_MERGE_CYCLE | ERR_ASSESSMENT_REQUIRED"
    http_status: 422
    applies_to: "outage create/merge, assign_lodging, work-order ready"
  - priority: 7
    category: business_temporal
    check: "Temporal window rules: published ETR must be after logical now (ERR_ETR_IN_PAST); backward manual revision only as CORRECTION pre-WORKING (ERR_ETR_BACKWARD_FORBIDDEN); revisions inside the public-commit lock horizon rejected except NESTED_DISCOVERED (ERR_ETR_LOCKED_HORIZON); mutual-aid arrival/assignment only inside the committed window (ERR_OUTSIDE_ENGAGEMENT_WINDOW); crew window must be contained in lodging block window (ERR_WINDOW_OUTSIDE_BLOCK); new lodging block windows must not overlap an existing block for the same (storm_event_id, hotel_name) under half-open semantics (ERR_LODGING_WINDOW_OVERLAP); signal occurred_at must not be in the future (ERR_SIGNAL_IN_FUTURE); certified_through must be after logical now (ERR_CERTIFICATION_WINDOW_PAST)"
    error_id: "ERR_ETR_IN_PAST | ERR_ETR_BACKWARD_FORBIDDEN | ERR_ETR_LOCKED_HORIZON | ERR_OUTSIDE_ENGAGEMENT_WINDOW | ERR_WINDOW_OUTSIDE_BLOCK | ERR_LODGING_WINDOW_OVERLAP | ERR_SIGNAL_IN_FUTURE | ERR_CERTIFICATION_WINDOW_PAST"
    http_status: 422
    applies_to: "etr-revisions, mark_arrived, assign, assign_lodging, lodging-block create, trouble-signal create, priority-customer certify"
  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: single manual ETR extension capped at 360 minutes unless DAMAGE_FOUND (ERR_ETR_EXTENSION_EXCEEDS_CAP); exactly one assignee (ERR_ASSIGNEE_AMBIGUOUS, http 400); crew type must match required_crew_type (ERR_CREW_TYPE_MISMATCH); crew must be AVAILABLE (ERR_CREW_NOT_AVAILABLE); duplicate (warehouse_code, material_sku) stock rejected (ERR_DUPLICATE_STOCK, http 409); dispatch pool empty (ERR_NO_ELIGIBLE_WORK)"
    error_id: "ERR_ETR_EXTENSION_EXCEEDS_CAP | ERR_ASSIGNEE_AMBIGUOUS | ERR_CREW_TYPE_MISMATCH | ERR_CREW_NOT_AVAILABLE | ERR_DUPLICATE_STOCK | ERR_NO_ELIGIBLE_WORK"
    http_status: 422
    applies_to: "etr-revisions, work-order assign, dispatch_next, material-stock create"
  - priority: 9
    category: business_fiscal
    check: "Capacity/quota/fiscal checks last: lodging rooms_allocated + roster_size <= room_count (ERR_NO_ROOMS_AVAILABLE); staged quantity <= stock quantity_available (ERR_INSUFFICIENT_MATERIAL); FEMA eligible >= threshold (ERR_FEMA_THRESHOLD_NOT_MET)"
    error_id: "ERR_NO_ROOMS_AVAILABLE | ERR_INSUFFICIENT_MATERIAL | ERR_FEMA_THRESHOLD_NOT_MET"
    http_status: 422
    applies_to: "assign_lodging, material-requisition stage, fema submit"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
# Reader alias: all nine authenticated roles may read.
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/om/_clock/set_current_utc"
    description: "Sets the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing the clock sweeps: CERTIFIED priority customers whose certified_through < now become SUSPENDED; etr_missed flags recompute on read."
    roles: [EmergencyDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["priority-customer expiry sweep", "feeder certified_priority_count recompute", "outage has_priority_customers / priority_score recompute"]

  # --- StormEvent ---
  - method: POST
    path: "/om/storm-events"
    description: "Declare a storm event (starts DECLARED)"
    roles: [EmergencyDirector]
    code: 201
    input: [event_name, event_type]
    output: StormEvent
    side_effects: ["event_status = DECLARED"]
  - method: GET
    path: "/om/storm-events"
    description: "List storm events, filterable by event_status; paginated"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["event_status?", "limit?", "offset?"]
    output: "StormEvent[]"
    side_effects: []
  - method: GET
    path: "/om/storm-events/{id}"
    description: "Get one storm event including computed cost rollups"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: StormEvent
    side_effects: []
  - method: POST
    path: "/om/storm-events/{id}/activate"
    description: "DECLARED -> ACTIVE; sets activated_at"
    roles: [EmergencyDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["sets activated_at = logical now", "increments version"]
  - method: POST
    path: "/om/storm-events/{id}/begin_demobilization"
    description: "ACTIVE -> DEMOBILIZING; requires all outages VERIFIED/CANCELLED, all MA crews DEPARTED/CANCELLED, all requisitions terminal, all lodging blocks RELEASED"
    roles: [EmergencyDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["increments version"]
  - method: POST
    path: "/om/storm-events/{id}/close"
    description: "DEMOBILIZING -> CLOSED; requires no switching order still in DRAFT/ISSUED/APPROVED"
    roles: [EmergencyDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["increments version"]
  - method: POST
    path: "/om/storm-events/{id}/run_clustering"
    description: "Evaluate the anchored UNCLUSTERED signal group for a feeder per calculation clustering_promotion; requires event_status = ACTIVE"
    roles: [Dispatcher]
    code: 200
    input: [feeder_id]
    output: "{ promoted: boolean, outage_id: string, clustered_signal_count: integer }"
    side_effects: ["on promote: creates SUSPECTED outage, marks group signals CLUSTERED with outage_id", "event must be ACTIVE else ERR_EVENT_NOT_ACTIVE"]
  - method: POST
    path: "/om/storm-events/{id}/dispatch_next"
    description: "Selector: assign the given AVAILABLE crew to the top-ranked eligible READY work order (priority_score DESC, created_at ASC tie-break)"
    roles: [Dispatcher]
    code: 200
    input: [crew_id]
    output: WorkOrder
    side_effects: ["work order READY -> DISPATCHED with assigned_crew_id", "crew AVAILABLE -> EN_ROUTE", "fatigue projection checked (ERR_FATIGUE_LIMIT_EXCEEDED)"]
  - method: GET
    path: "/om/storm-events/{id}/cost-summary"
    description: "Computed read of the event cost rollup"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: "{ total_labor_cents: integer, total_material_cents: integer, total_mutual_aid_cents: integer, total_lodging_cents: integer, total_event_cost_cents: integer, capital_cost_cents: integer, om_cost_cents: integer }"
    side_effects: []

  # --- Feeder ---
  - method: POST
    path: "/om/feeders"
    description: "Register a feeder (clustering thresholds default to 3 last-gasps / 5 calls)"
    roles: [EmergencyDirector]
    code: 201
    input: [feeder_code, county_code, service_customer_count, "cluster_signal_threshold?", "cluster_call_threshold?"]
    output: Feeder
    side_effects: []
  - method: GET
    path: "/om/feeders/{id}"
    description: "Get one feeder"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: Feeder
    side_effects: []

  # --- PriorityCustomer ---
  - method: POST
    path: "/om/priority-customers"
    description: "Register a priority customer (starts REGISTERED)"
    roles: [Dispatcher]
    code: 201
    input: [account_ref, priority_class, feeder_id]
    output: PriorityCustomer
    side_effects: ["certification_status = REGISTERED"]
  - method: GET
    path: "/om/priority-customers/{id}"
    description: "Get one priority customer"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: PriorityCustomer
    side_effects: []
  - method: GET
    path: "/om/priority-customers"
    description: "List priority customers, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["feeder_id?", "certification_status?", "limit?", "offset?"]
    output: "PriorityCustomer[]"
    side_effects: []
  - method: POST
    path: "/om/priority-customers/{id}/certify"
    description: "REGISTERED -> CERTIFIED or SUSPENDED -> CERTIFIED; certified_through must be after logical now"
    roles: [Dispatcher]
    code: 200
    input: [certified_through]
    output: PriorityCustomer
    side_effects: ["sets certified_through", "recomputes feeder certified_priority_count and outage priority scores on the feeder", "increments version"]
  - method: POST
    path: "/om/priority-customers/{id}/decertify"
    description: "Any non-terminal state -> DECERTIFIED (terminal)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: PriorityCustomer
    side_effects: ["recomputes feeder certified_priority_count and outage priority scores", "increments version"]

  # --- TroubleSignal ---
  - method: POST
    path: "/om/trouble-signals"
    description: "Ingest a telemetry/call signal. METER_RESTORE_PING requires outage_id and the outage in {WORKING, RESTORED}; other types must not carry outage_id. occurred_at must be <= logical now."
    roles: [TelemetryGateway]
    code: 201
    input: [signal_type, feeder_id, occurred_at, "outage_id?"]
    output: TroubleSignal
    side_effects: ["METER_RESTORE_PING: disposition = CLUSTERED with outage_id set; all others: disposition = UNCLUSTERED"]
  - method: GET
    path: "/om/trouble-signals/{id}"
    description: "Get one signal"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: TroubleSignal
    side_effects: []
  - method: GET
    path: "/om/trouble-signals"
    description: "List signals, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["feeder_id?", "outage_id?", "signal_type?", "disposition?", "limit?", "offset?"]
    output: "TroubleSignal[]"
    side_effects: []

  # --- Outage ---
  - method: POST
    path: "/om/outages"
    description: "Manually create a SUSPECTED outage (clustering creates them too); parent_outage_id creates a nested outage and must reference a non-terminal outage on the same event"
    roles: [Dispatcher]
    code: 201
    input: [storm_event_id, feeder_id, "parent_outage_id?"]
    output: Outage
    side_effects: ["outage_status = SUSPECTED", "event must be ACTIVE (ERR_EVENT_NOT_ACTIVE)", "parent linkage re-parenting rules per state machine"]
  - method: GET
    path: "/om/outages/{id}"
    description: "Get one outage (current_etr, etr_missed, priority_score computed)"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: Outage
    side_effects: []
  - method: GET
    path: "/om/outages"
    description: "List outages, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["storm_event_id?", "feeder_id?", "parent_outage_id?", "merged_into_outage_id?", "outage_status?", "limit?", "offset?"]
    output: "Outage[]"
    side_effects: []
  - method: POST
    path: "/om/outages/{id}/confirm"
    description: "SUSPECTED -> CONFIRMED; creates EtrRevision seq 1 (provisional ETR variant)"
    roles: [Dispatcher]
    code: 200
    input: [customers_affected, cause_code]
    output: Outage
    side_effects: ["sets customers_affected, cause_code, confirmed_at", "creates INITIAL EtrRevision", "sets current_etr", "recomputes priority_score", "increments version"]
  - method: POST
    path: "/om/outages/{id}/cancel"
    description: "SUSPECTED/CONFIRMED -> CANCELLED (false alarm); clustered signals become DISMISSED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Outage
    side_effects: ["signals CLUSTERED -> DISMISSED", "increments version"]
  - method: POST
    path: "/om/outages/{id}/merge"
    description: "Merge this duplicate outage into target_outage_id; source -> CANCELLED with signals, customer counts, work orders, and child outages moved to the target"
    roles: [Dispatcher]
    code: 200
    input: [target_outage_id]
    output: Outage
    side_effects: ["signals re-linked to target", "customers_affected transferred", "non-terminal work orders cancelled with crew release", "child outages re-parented", "both versions increment"]
  - method: POST
    path: "/om/outages/{id}/report_restored"
    description: "WORKING -> RESTORED; all work orders must be COMPLETED/CANCELLED with at least one COMPLETED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Outage
    side_effects: ["sets restoration_reported_at", "increments version"]
  - method: POST
    path: "/om/outages/{id}/verify"
    description: "RESTORED -> VERIFIED; requires children terminal, work-order verifications passed, and a restore ping at/after restoration_reported_at"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Outage
    side_effects: ["increments version"]

