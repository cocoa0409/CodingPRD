  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_org_id_rejected_even_after_termination
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_DUPLICATE_ORG_ID
        distinguishing_aspect: "org_id uniqueness spans TERMINATED members: registering org 1000000, terminating it, then re-registering the same org_id still returns 409 ERR_DUPLICATE_ORG_ID."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A (org 1000000) ACTIVE with signer, zero loans; terminated immediately (effective_date == clock); member is TERMINATED."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id, m_a_v: $.data.version }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "GET /registry/members/${m_a}"
              payload: {}
              as: RegistryAdmin
              captures: { m_a_v2: $.data.version }
            - call: "POST /registry/members/${m_a}/terminate"
              payload: { effective_date: "2026-01-05T00:00:00Z", expected_member_version: "${m_a_v2}" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Reborn", org_id: "1000000", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Member.${m_a}.status == TERMINATED"
            - "the re-registration returns 409 and err == ERR_DUPLICATE_ORG_ID"

      - name: duplicate_idempotency_key_rejected_while_rejected_transfer_frees_key
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_DUPLICATE_IDEMPOTENCY_KEY
        distinguishing_aspect: "The idempotency-key uniqueness scope excludes REJECTED transfers: reusing key K after a CONFIRMED transfer is 409; once that transfer is match-rejected (REJECTED), a new transfer with key K succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Members A, B ACTIVE with signers; A registers 2 TX loans."
            - "Transfer T1 (loan1, key K) CONFIRMED; T1 match-rejected by A (T1 REJECTED)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan1: $.data.id, loan1_v: $.data.version }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan2: $.data.id, loan2_v: $.data.version }
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan1}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "K", expected_loan_version: "${loan1_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan2}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "K", expected_loan_version: "${loan2_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /registry/transfers/${t1}/reject-match"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan2}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "K", expected_loan_version: "${loan2_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { t2: $.data.id }
          assert:
            - "the duplicate-key attempt while T1 is CONFIRMED returns 409 err_dup == ERR_DUPLICATE_IDEMPOTENCY_KEY"
            - "after T1 is REJECTED the same key succeeds: Transfer.${t2}.status == CONFIRMED"

      - name: self_transfer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_SELF_TRANSFER
        distinguishing_aspect: "to_member equal to the current holder of the moved right is a 422 ERR_SELF_TRANSFER, distinct from any not-found or state error."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with signer; one TX loan (version 1), A holds both rights."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
