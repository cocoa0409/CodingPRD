            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slotA: $.data.id, slotA_v: $.data.version } }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "PM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 296 }, as: IntegratorAdmin, captures: { slotB: $.data.id, slotB_v: $.data.version } }
          trigger:
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slotA}", head_count: 100, expected_slot_version: "${slotA_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slotB}", head_count: 100, expected_slot_version: "${slotB_v}" }, as: FieldTech, captures: { err: $.data.error_id } }
          assert:
            - "Booking into max-300 slot succeeds (296.05 <= 300): load ${load1} SCHEDULED"
            - "Booking into max-296 slot -> 409 ERR_WEIGHT_WINDOW_PROJECTED (${err}) (296.05 > 296)"

      - name: settlement_preview_variant_selection
        claim_type: variant_selection
        grounds: [ calculations.settlement_pay, "errors[ERR_GROUP_NOT_ACTIVE]"]
        distinguishing_aspect: "The PROVISIONAL variant is only computed while the group is PLACED/MARKETING: preview on a SCHEDULED group is rejected; after confirm it returns variant == PROVISIONAL."
        test_recipe:
          setup: ["group SCHEDULED (not yet confirmed)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
          trigger:
            - { call: "GET /pig-groups/${group_id}/settlement-preview", payload: {}, as: FieldTech, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "GET /pig-groups/${group_id}/settlement-preview", payload: {}, as: FieldTech, captures: { variant: $.data.variant, base: $.data.base_pay_cents } }
          assert:
            - "Preview on SCHEDULED -> 409 ERR_GROUP_NOT_ACTIVE (${err})"
            - "Preview on PLACED -> 200, variant == PROVISIONAL (${variant}), base_pay_cents == 4000000 (${base})"

      - name: space_check_head_and_floor_limits
        claim_type: constants_applied
        grounds: [ calculations.space_requirement_check, "errors[ERR_SPACE_HEAD_EXCEEDED]", "errors[ERR_FLOOR_SPACE_EXCEEDED]"]
        distinguishing_aspect: "Both quota constants enforced: head 1201 > capacity 1200 -> ERR_SPACE_HEAD_EXCEEDED; head 1000 x 8 sqft = 8000 > 7000 sqft floor -> ERR_FLOOR_SPACE_EXCEEDED."
        test_recipe:
          setup: ["contract ACTIVE; barn Big (1200 head, 9600 sqft); barn Small (1500 head, 7000 sqft)"]
          setup_api_calls:
