            - "Clock default 2026-09-01. RLD with one LISTED patent expiring 2027-02-01; application with PARAGRAPH_III_DEFER certification, ACCEPTED BE study, PASSED inspection; submitted and tentatively approved (patent block until 2027-02-01); cycle 1 CLOSED with closed_reason TENTATIVE_APPROVAL."
