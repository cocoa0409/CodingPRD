            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { club_v_pre: $.data.version }
            - call: "POST /api/award-applications/${aa_id}/nominate"
              payload: { expected_club_version: "${club_v_pre}" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications/${aa_id}/endorse"
              payload: {}
              as: Volunteer
