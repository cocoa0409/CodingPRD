      - name: roles_cannot_perform_another_roles_exclusive_operations
        claim_type: exclusive_operation_denial
        grounds:
          - roles
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The role matrix is exclusive for every write: certification belongs to
          NexusAnalyst, adoption to CouncilClerk and expenditures to FinanceOfficer. Each
          call below is otherwise perfectly valid - correct path, correct body, correct
          state - so only the role can be the reason for the rejection. The fourth call sends
          a role string outside the declared six to prove the role check rejects unknown
          roles rather than treating them as anonymous or as a wildcard.
        test_recipe:
          setup:
            - "A NEXUS_CERTIFIED study exists in HARBOR with both components allocated and priced."
            - "The PARKS category version is captured so the expenditure body is fully valid."
            - "The PARKS fund is empty, so an authorised expenditure would fail later on balance - the role check must fire first."
