  # ===========================================================================
  - section: validations
    instances:
      - name: payment_amount_must_equal_allocation_sum
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Payment with amount_cents 5000 but allocations summing to 4000 is rejected ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Account ACTIVE; invoice ISSUED 5000"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 5000, method: ACH, allocations: [ { invoice_id: "${inv}", amount_cents: 4000 } ] }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; no Payment row persisted; invoice untouched (amount_paid_cents == 0)"

      - name: allocation_exceeds_invoice_due_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_ALLOCATION_EXCEEDS_DUE]"]
        distinguishing_aspect: "Allocating 6000 against an invoice whose amount_due is 5000 fails with 422 ERR_ALLOCATION_EXCEEDS_DUE (fiscal cap, after shape checks pass)."
        test_recipe:
          setup: ["Account ACTIVE; invoice ISSUED 5000"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 6000, method: ACH, allocations: [ { invoice_id: "${inv}", amount_cents: 6000 } ] }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLOCATION_EXCEEDS_DUE (http 422)"

      - name: allocation_to_foreign_invoice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_ALLOCATION_ACCOUNT_MISMATCH]"]
        distinguishing_aspect: "Allocating an invoice owned by account B inside account A's payment fails ERR_ALLOCATION_ACCOUNT_MISMATCH even when amounts are consistent."
        test_recipe:
          setup: ["Accounts A and B ACTIVE; invoice ISSUED 5000 owned by B"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "A Corp", account_type: CORPORATE, tax_id: "T-A", billing_email: "a@x.example" }, as: PremiumSalesRep, captures: { aca: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "B Corp", account_type: CORPORATE, tax_id: "T-B", billing_email: "b@x.example" }, as: PremiumSalesRep, captures: { acb: $.data.id } }
            - { call: "POST /api/invoices", payload: { account_id: "${acb}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { invb: $.data.id } }
            - { call: "POST /api/invoices/${invb}/issue", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/payments", payload: { account_id: "${aca}", amount_cents: 5000, method: ACH, allocations: [ { invoice_id: "${invb}", amount_cents: 5000 } ] }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLOCATION_ACCOUNT_MISMATCH (http 422)"

      - name: agreement_create_with_ghost_suite_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK resolution: suite_id that does not exist in a POST /api/agreements body fails 404 ERR_NOT_FOUND (not 400)."
        test_recipe:
          setup: ["Account ACTIVE; S1 exists PUBLISHED"]
