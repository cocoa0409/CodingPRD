        distinguishing_aspect: "The second period starts on 2026-06-30, the exact last day of the first period, so the closed-inclusive comparison rejects it with ERR_PERIOD_OVERLAP 409; starting one day later on 2026-07-01 is accepted, and only two ProgressReport rows exist at the end."
        test_recipe:
          setup:
            - "One water system with one filed report covering 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2103021", system_name: "Period Water", compliance_deadline_date: "2027-10-16" }
