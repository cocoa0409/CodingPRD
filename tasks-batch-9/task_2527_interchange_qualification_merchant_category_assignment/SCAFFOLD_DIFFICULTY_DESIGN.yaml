        grounds:
          - state_machines.ReclassificationRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.ReclassificationRequest.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ReclassificationRequest.INFO_REQUESTED_to_SUBMITTED
          - entities.ReclassificationRequest.fields.review_round
          - validations[priority=24]
          - errors[ERR_REVIEW_ROUND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          CYCLIC shape: the request re-enters SUBMITTED twice via
          UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED, so review_round climbs 1 -> 2 -> 3, and the
          loop is bounded by a counter rather than by a terminal state — the third request-info is
          refused with ERR_REVIEW_ROUND_LIMIT_EXCEEDED while the request stays in UNDER_REVIEW.
