              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /prosthetics/patients"
              payload: { limit: 500, offset: 0 }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_VALIDATION"
            - "the same call with limit 100 returns HTTP 200 with total_count 1 and has_more false"

