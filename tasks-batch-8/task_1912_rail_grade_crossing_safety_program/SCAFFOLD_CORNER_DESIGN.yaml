            - "RailroadMaintainer POST /funding-programs -> ERR_FORBIDDEN_ROLE (403)"

      - name: closure_self_accept_forbidden
        claim_type: segregation_of_duties
        grounds: [state_machines.ClosureAgreement.PROPOSED_to_DOT_ACCEPTED, "errors[ERR_SELF_ACCEPT_FORBIDDEN]"]
        distinguishing_aspect: "The officer who tabled the current DOT offer cannot accept it; a different officer can."
        test_recipe:
          setup: ["Locality; ACTIVE crossing; agreement created and proposed by officer-1"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "SoD City", state_code: "KS", contact_email: "pw@sod.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-060021", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "DOT_ACCEPTED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "DOT_ACCEPTED" }
              as: RailSafetyOfficer
              as_user_id: "officer-2"
              captures: { st: $.data.status, acc: $.data.dot_accepted_by_user_id }
          assert:
            - "officer-1 (who tabled the DOT offer) accepting -> ERR_SELF_ACCEPT_FORBIDDEN (403)"
            - "officer-2 accepting -> DOT_ACCEPTED with dot_accepted_by_user_id == officer-2"

      - name: ratify_wrong_locality_rejected
        claim_type: exclusive_operation_denied
        grounds: [state_machines.ClosureAgreement.DOT_ACCEPTED_to_LOCALITY_RATIFIED, "errors[ERR_LOCALITY_MISMATCH]"]
        distinguishing_aspect: "Only the agreement's own locality (X-User-ID == locality_id) may ratify."
        test_recipe:
          setup: ["Two localities; ACTIVE crossing; agreement with locality 1, DOT_ACCEPTED"]
          setup_api_calls:
