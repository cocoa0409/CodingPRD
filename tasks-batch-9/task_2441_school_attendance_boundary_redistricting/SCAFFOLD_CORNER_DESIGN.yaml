  - name: portables_flag_conditions_effective_capacity
    claim_type: conditional_validation
    grounds:
    - entities.BoundaryStudy.fields.portables_count_toward_capacity
    - entities.School.fields.effective_capacity_seats
    - calculations.school_capacity_utilization
    - endpoints[POST /redistricting/studies/{id}/schools]
    distinguishing_aspect: Two schools with byte-identical capacity inputs (500 core + 40 portable) land on different effective_capacity_seats - 540 and 500 - purely because their parent studies disagree on portables_count_toward_capacity. The flag is read from the STUDY, not from the school, so the same School payload is legitimately capacity-ambiguous until its parent is known.
    test_recipe:
      setup:
      - 'Two Eastmere USD studies exist: ''Portables Counted Study'' with portables_count_toward_capacity true and ''Portables Ignored Study'' with it false. Both are in SETUP.'
      - Alder Elementary (500 core + 40 portable) already exists under the first study; Fir Elementary with the identical capacity payload is created under the second.
      - required_program_types is empty on both studies, so no program placement is involved and enrolled_students_of_record is 0 for both schools.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: Portables Counted Study
          district_name: Eastmere USD
          target_school_year: 2029
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types: []
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          pa_id: $.data.id
      - call: POST /redistricting/studies/${pa_id}/schools
        payload:
          name: Alder Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          pa1_id: $.data.id
      - call: POST /redistricting/studies
        payload:
          name: Portables Ignored Study
          district_name: Eastmere USD
          target_school_year: 2029
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: false
          required_program_types: []
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          pb_id: $.data.id
      trigger:
      - call: POST /redistricting/studies/${pb_id}/schools
        payload:
          name: Fir Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          pb1_id: $.data.id
      assert:
      - The call returns HTTP 201
      - School.${pa1_id}.effective_capacity_seats == 540 - the flag is true on its study
      - School.${pb1_id}.effective_capacity_seats == 500 - the same 40 portable seats are ignored
      - School.${pb1_id}.portable_capacity_seats == 40 - the input is stored, only the derived total differs
      - School.${pa1_id}.enrolled_students_of_record == 0 and School.${pb1_id}.enrolled_students_of_record == 0
