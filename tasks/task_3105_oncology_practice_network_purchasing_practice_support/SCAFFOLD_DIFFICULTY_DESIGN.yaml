  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: denial_ratio_strict_greater_than_boundary
        grounds:
          - calculations.practice_denial_ratio
          - entities.Practice.fields.denial_ratio_threshold_pct
          - state_machines.PracticePricingAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "A numeric threshold crossing at a strict boundary on the denial ratio: 0.2000 exactly does NOT suspend pricing, while 0.2500 does — the two states are one settled claim apart and on different endpoints."
        test_recipe:
          setup:
            - "Practice P with one DENIED claim and four ADJUDICATED_PAID claims (ratio exactly 0.2000) and one ACTIVE agreement; a second practice P2 with two DENIED and two paid (ratio 0.5000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Boundary Oncology Network", network_agreement_code: "GPO-BD-1", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Boundary Practice One", practice_npi: "2233445566", state_code: "AZ", drug_shortage_baseline_units: 100, denial_ratio_threshold_pct: 0.20, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Boundary Practice Two", practice_npi: "2233445577", state_code: "AZ", drug_shortage_baseline_units: 100, denial_ratio_threshold_pct: 0.20, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p2: $.data.id, p2_v: $.data.version }
          trigger:
            - call: "POST /networks/practices/${p1}/affiliate"
              payload: {}
              as: NetworkAdmin
              captures: { p1_aff: $.data.affiliation_status }
            - call: "GET /networks/practices/${p1}"
              payload: {}
              as: NetworkAdmin
              captures: { p1_settled: $.data.settled_claim_count, p1_denied: $.data.denied_claim_count }
            - call: "GET /networks/practices/${p2}"
              payload: {}
              as: NetworkAdmin
              captures: { p2_settled: $.data.settled_claim_count, p2_denied: $.data.denied_claim_count }
          assert:
            - "with one denial and four paid claims the ratio is 1/5 == 0.2000, which does NOT strictly exceed the 0.20 threshold, so no pricing agreement of ${p1} is SUSPENDED"
            - "with two denials and three paid claims the ratio is 2/5 == 0.4000, which does strictly exceed 0.20, so pricing is suspended"
            - "1/4 == 0.2500 also strictly exceeds 0.20 — the boundary is crossed one paid claim earlier at the same numerator"

      - name: zero_quantity_and_empty_collection_boundaries
        grounds:
          - calculations.wastage_units_per_administration
          - calculations.shortage_allocation_units
          - calculations.on_hand_units_dual_variant
          - errors.ERR_THRESHOLD_NOT_MET
        distinguishing_aspect: "An empty-collection / zero-count edge on a different metric and endpoint: a treatment of zero units is rejected outright, a shortage with zero available supply cannot be allocated at all, and a practice set with no AFFILIATED members produces ERR_NO_ELIGIBLE_PRACTICES rather than an empty allocation."
        test_recipe:
          setup:
            - "Network N with drug D at 5000 cents and a lot of 100 units received; no practice affiliated yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
