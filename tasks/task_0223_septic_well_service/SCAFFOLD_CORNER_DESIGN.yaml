        claim_type: cascading_side_effects
        grounds:
          - state_machines.Account.GOOD_to_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / account_hold_cascade_cancel_then_route_recount
          rationale: "Account-hold cascade to WO cancel and route recount is the asserted chain of that §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: scheduled_estimate_visible_in_same_response
        claim_type: immediate
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.estimated_cost_cents
        distinguishing_aspect: "The schedule response itself carries the freshly-computed estimated_cost_cents (immediate consistency, no re-read needed): PUMPING 800 gal -> 29000."
        test_recipe:
          setup: ["Account GOOD; Site; ACTIVE tech; OPEN route; DRAFT PUMPING WO estimated_gallons=800."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-16" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-16", window_start_minute: 540, estimated_gallons: 800 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
              captures: { est: $.data.estimated_cost_cents }
          assert:
            - "schedule response $.data.estimated_cost_cents == 29000"
            - "WorkOrder.${wo_id}.status == SCHEDULED"
