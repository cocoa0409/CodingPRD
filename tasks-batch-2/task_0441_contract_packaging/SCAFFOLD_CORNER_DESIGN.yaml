        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bomline-add-stale-recipe]", "endpoints./copack/recipes/{id}/bom-lines"]
        distinguishing_aspect: "After one bom-line add bumps recipe version to 2, a second add still carrying expected_recipe_version==1 (the pre-add version) is rejected with ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["DRAFT recipe at version 1; client adds one line (version -> 2) then retries with stale version 1"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp1: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "OIL", name: "Oil", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp2: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp1}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp2}", qty_per_unit: 1, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bomline-add-stale-recipe]", entities.Recipe.fields.version]
        distinguishing_aspect: "Adding a bom-line with the CURRENT expected_recipe_version succeeds (201) and increments Recipe.version by exactly 1."
        test_recipe:
          setup: ["DRAFT recipe version 1"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cid: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cid}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp1: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cid}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
          trigger:
