            - "the reject attempt returns 404 with error_id == ERR_CLAIM_NOT_FOUND"
            - "the roll attempt returns 404 with error_id == ERR_DC_NOT_FOUND"
            - "all three responses are 404s and none of them is a 400 ERR_INVALID_REQUEST"

