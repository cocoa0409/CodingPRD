          - validations[priority=1]
        distinguishing_aspect: "Request sent WITHOUT X-User-ID / X-User-Role headers -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or business check runs."
        test_recipe:
          setup: ["Clock default; empty DB. The trigger call is sent with NO auth headers (this is the point of the test)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "No Header", date_of_birth: "1990-01-01", email: "nh@x.org", phone: "555-9701" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: role_denied_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "A DepartmentHead calling POST /placements with two nonexistent FK ids fails role authorization (403 ERR_UNAUTHORIZED_ROLE) — priority 3 beats the priority-4 existence check that would otherwise yield 404."
        test_recipe:
          setup: ["Clock default; empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/placements", payload: { request_id: "11111111-2222-4333-8444-555555555555", volunteer_id: "22222222-3333-4444-8555-666666666666" }, as: DepartmentHead, as_user_id: "dh-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (http 403), NOT ERR_NOT_FOUND"

      - name: signup_window_boundary_closed_at_cutoff
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
        distinguishing_aspect: "Signup cutoff is EXCLUSIVE at start-24h: at 07:59 (before cutoff) signup succeeds; at exactly 08:00:00 (= start - 24h) the window is closed and a re-signup after cancelling fails ERR_SIGNUP_WINDOW_CLOSED."
        test_recipe:
          setup: ["Clock 2026-08-09T07:59:00Z; volunteer V fully ACTIVE; shift 2026-08-10T08:00:00Z-12:00:00Z PUBLISHED capacity 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/departments", payload: { name: "Emergency", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "ED Greeter", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Window Wes", date_of_birth: "1990-01-01", email: "ww@x.org", phone: "555-9702" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v_id}" }, as: VolunteerCoordinator, captures: { plc: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc}/accept", as: Volunteer, as_user_id: "${v_id}" }
            - { call: "POST /auxiliary/volunteers/${v_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/shifts", payload: { department_id: "${dept_id}", role_id: "${role_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T12:00:00Z", capacity: 2 }, as: VolunteerCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /auxiliary/shifts/${s1}/publish", as: VolunteerCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:59:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/shift-assignments", payload: { shift_id: "${s1}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { asg: $.data.id, ok_st: $.data.status } }
            - { call: "POST /auxiliary/shift-assignments/${asg}/cancel", as: VolunteerCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T08:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/shift-assignments", payload: { shift_id: "${s1}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "at 07:59 (before start-24h): signup succeeds (SIGNED_UP)"
            - "at exactly 08:00:00 == start-24h (boundary is exclusive): re-signup fails ERR_SIGNUP_WINDOW_CLOSED (409)"

      - name: self_cancel_window_staff_override
        claim_type: conditional_validation
        grounds:
          - validations[priority=11]
          - state_machines.ShiftAssignment.SIGNED_UP_to_CANCELLED
        distinguishing_aspect: "Same assignment, same instant (start-20h): the VOLUNTEER's self-cancel fails ERR_CANCEL_WINDOW_CLOSED while the staff cancel succeeds — the 24h window is conditional on the caller's role."
        test_recipe:
          setup: ["Clock 2026-08-01T12:00:00Z at trigger time; volunteer V fully ACTIVE; shift 2026-08-02T08:00:00Z-12:00:00Z PUBLISHED; V SIGNED_UP (signed up at 2026-08-01T00:00:00Z, comfortably before start-24h)"]
