          setup:
            - "Ports 4601 (NE), 3901 (MW) and 3801 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M1 = IT 4601->3901 filed 2026-08-01 and departed, so it is IN_TRANSIT and has not arrived."
