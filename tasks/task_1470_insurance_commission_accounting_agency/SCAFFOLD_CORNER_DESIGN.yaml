              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/policies/${pol_id}/cancel"
              payload: { cancel_effective_date: "2026-08-15" }
