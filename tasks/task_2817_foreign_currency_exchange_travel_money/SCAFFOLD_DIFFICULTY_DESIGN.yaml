              as: BranchTeller
              captures: { cust1_v: "$.data.version" }
            - call: "POST /buyback-contracts"
              payload: { customer_id: "${cust1_id}", origin_transaction_id: "${txn1_id}", expected_customer_version: "${cust1_v}" }
              as: BranchTeller
              captures: { contracta_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust2_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 8 }] }
