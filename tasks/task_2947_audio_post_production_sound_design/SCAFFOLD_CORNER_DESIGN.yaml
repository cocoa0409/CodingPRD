        excluded_because:
          difficulty_instance: transitive_cascade / library_asset_revoke_cascade_reaches_booking_and_billing
          rationale: "Entity A (LibraryAsset) changing and entity B (AssetUsage/StemPackage/Deliverable/MixStageBooking/Project) adjusting is the whole subject of that instance."

