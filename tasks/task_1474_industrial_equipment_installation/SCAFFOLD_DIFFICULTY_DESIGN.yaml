            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_x}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_x: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_x}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_x}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_x}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_x: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_x}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_x}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_x}/advance", payload: {}, as: ProjectManager, captures: { p_x_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_x}", expected_project_version: "${p_x_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_x1: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_x1}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_x1}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_x}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_x: $.data.id } }
            - { call: "GET /v1/projects/${p_x}", payload: {}, as: ProjectManager, captures: { p_x_v2: $.data.version } }
          trigger:
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_x}", expected_project_version: "${p_x_v2}", lift_weight_tons: 45, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 60, rigging_config: TANDEM }, as: SiteSupervisor, captures: { rp_x2: $.data.id, rp_x2_rev: $.data.revision } }
          assert:
            - "RiggingPlan.${rp_x1}.status == SUPERSEDED (cascade hop 1)"
            - "Project.${p_x}.approved_rigging_plan_id == null and approved_rigging_plan_revision == null (cascade hop 2)"
            - "LiftPermit.${lp_x}.status == CANCELLED (cascade hop 3)"
            - "RiggingPlan.${rp_x2}.status == DRAFT and revision == 2 (${rp_x2_rev} == 2)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=26]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a PROGRESS invoice on a COMPLETED project
          whose TM gross would also breach the NTE cap must fail with ERR_INVALID_STATE
          (priority 5), never ERR_NTE_EXCEEDED (priority 26). Sibling uses a different pair.
        test_recipe:
          setup:
            - "TM project with NTE contract_amount_cents 100000, run all the way to COMPLETED, carrying one APPROVED 10h MW_JOURNEYMAN DAY entry (114500) on 2026-08-09 — gross would exceed the NTE cap if state allowed"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Conflict Job", customer_name: "Acme", site_address: "10 Plant Rd", billing_mode: TM, contract_amount_cents: 100000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_f: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_f}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_f: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_f}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_f}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_f}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_f: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_f}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_f}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_f}/advance", payload: {}, as: ProjectManager, captures: { p_f_v: $.data.version } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_f}", worker_ref: "U-7001", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 10, shift: DAY }, as: SiteSupervisor, captures: { le_f: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_f}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_f}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_f}", expected_project_version: "${p_f_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_f: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_f}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_f}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_f}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_f: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/lift-permits/${lp_f}/execute", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/projects/${p_f}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists", payload: { project_id: "${p_f}", items: [{ item_key: "GROUT", description: "grout cured", required: true }] }, as: ProjectManager, captures: { cc_f: $.data.id } }
            - { call: "POST /v1/alignment-records", payload: { project_id: "${p_f}", measurement_point: "PUMP-MOTOR", tolerance_class: PRECISION, measured_offset_mils: 1.5, measured_angular_mils_per_in: 0.4 }, as: SiteSupervisor, captures: { ar_f: $.data.id } }
            - { call: "POST /v1/alignment-records/${ar_f}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_f}/check-item", payload: { item_key: "GROUT" }, as: SiteSupervisor }
            - { call: "POST /v1/commissioning-checklists/${cc_f}/submit", payload: {}, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_f}/sign-off", payload: {}, as: CustomerRep }
            - { call: "POST /v1/projects/${p_f}/advance", payload: {}, as: ProjectManager, captures: { p_f_done: $.data.work_status } }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_f}", kind: PROGRESS, period_start: "2026-08-09", period_end: "2026-08-09" }, as: ProjectManager, captures: { inv_f_err: $.data.error_id } }
          assert:
            - "Project reached COMPLETED (${p_f_done} == COMPLETED)"
            - "Invoice attempt fails with error_id ERR_INVALID_STATE — NOT ERR_NTE_EXCEEDED, although gross 114500 would breach NTE 100000"
            - "No Invoice row is created for the project (GET /v1/projects/${p_f}/invoices returns empty)"

      - name: lockout_safety_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=23]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: a lockout window created while the
          safety plan is SUSPENDED that also violates the 30-minute feeder buffer must fail with
          ERR_SAFETY_PLAN_NOT_ACTIVE (priority 9), never ERR_LOCKOUT_CONFLICT (priority 23).
        test_recipe:
          setup:
            - "Project with SafetyPlan, plan ACTIVATED then SUSPENDED; one existing SCHEDULED lockout on feeder F-1 for 2026-08-10 10:00-14:00 (created while plan was ACTIVE)"
            - "Clock at default 2026-08-01T00:00:00Z (window still in the future)"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Lockout Conflict Job", customer_name: "Acme", site_address: "11 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_l: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_l}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_l: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_l}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_l}", feeder_id: "F-1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T14:00:00Z" }, as: SafetyOfficer, captures: { lw_l1: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_l}/suspend", payload: {}, as: SafetyOfficer }
          trigger:
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_l}", feeder_id: "F-1", starts_at: "2026-08-10T14:15:00Z", ends_at: "2026-08-10T15:00:00Z" }, as: SafetyOfficer, captures: { lw_l_err: $.data.error_id } }
          assert:
            - "Creation fails with error_id ERR_SAFETY_PLAN_NOT_ACTIVE — NOT ERR_LOCKOUT_CONFLICT, although the 15-minute gap violates the 30-minute buffer"
            - "LockoutWindow.${lw_l1}.status remains SCHEDULED (suspend does not cancel scheduled lockouts)"

  - rule_id: boundary_precision_check
    instances:
      - name: alignment_exact_tolerance_passes
        grounds:
          - calculations.alignment_verdict
        distinguishing_aspect: |
          Boundary on the offset/angular metrics (mils) via POST /v1/alignment-records: measured
          values exactly equal to the PRECISION tolerances (2.0 mils, 0.5 mils/in) PASS because
          the comparison is <=, not <. Sibling boundary is on hours via a different endpoint.
        test_recipe:
          setup:
            - "Fresh project (alignment recording is not phase-gated)"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Alignment Job", customer_name: "Acme", site_address: "12 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_a: $.data.id } }
          trigger:
            - { call: "POST /v1/alignment-records", payload: { project_id: "${p_a}", measurement_point: "PUMP-MOTOR", tolerance_class: PRECISION, measured_offset_mils: 2.0, measured_angular_mils_per_in: 0.5 }, as: SiteSupervisor, captures: { ar_a: $.data.id, ar_a_off: $.data.offset_passed, ar_a_ang: $.data.angular_passed, ar_a_verdict: $.data.verdict } }
            - { call: "POST /v1/alignment-records", payload: { project_id: "${p_a}", measurement_point: "GEARBOX-MOTOR", tolerance_class: PRECISION, measured_offset_mils: 2.01, measured_angular_mils_per_in: 0.5 }, as: SiteSupervisor, captures: { ar_b_verdict: $.data.verdict } }
          assert:
            - "Boundary record: offset_passed == true, angular_passed == true, verdict == PASS (${ar_a_off}/${ar_a_ang}/${ar_a_verdict})"
            - "One-hundredth over: 2.01 mils offset yields verdict == FAIL (${ar_b_verdict})"

      - name: labor_exact_daily_threshold_no_ot
        grounds:
          - calculations.labor_cost
        distinguishing_aspect: |
          Boundary on the hours metric via POST /v1/labor-entries: exactly 8.0 hours worked
          yields overtime_hours == 0 because OT requires hours_worked > 8 (strictly greater).
          Sibling boundary is on mils via a different endpoint and metric.
        test_recipe:
          setup:
            - "DAILY_OT project, no prior entries for worker U-8001"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Boundary Job", customer_name: "Acme", site_address: "13 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_b: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_b}", worker_ref: "U-8001", classification: MW_JOURNEYMAN, work_date: "2026-08-10", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_b: $.data.id, b_ot: $.data.overtime_hours, b_total: $.data.total_cost_cents } }
          assert:
            - "overtime_hours == 0 at exactly 8.0 hours (${b_ot} == 0); regular_hours == 8"
            - "total_cost_cents == 84800 (68000 straight + 0 OT + 16800 fringe)"

