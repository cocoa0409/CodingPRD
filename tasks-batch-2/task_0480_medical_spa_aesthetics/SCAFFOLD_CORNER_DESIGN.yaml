            - "InjectableLot.${qz_lot}.status == QUARANTINED"
            - "response error_id == ERR_INSUFFICIENT_LOT_UNITS"
            - "response http_status == 409"

      - name: dual_variant_session_charge_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.session_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / session_charge_member_vs_nonmember_diverges
          rationale: "The dual-variant calculation layer is the depth probe in §1.8; member-vs-nonmember divergence covers it."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_commit_reflects_charge_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.TreatmentSession.BOOKED_to_COMMITTED
          - entities.TreatmentSession.fields.final_charge_cents
        distinguishing_aspect: "The commit response itself carries final_charge_cents and status==COMMITTED (immediate consistency; no read-after-write lag)."
        test_recipe:
          setup: ["a BOOKED session for a non-member, 20u @1000, BEFORE photo on file"]
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Im2 Inj", license_number: "L-IM2-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { im2_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Im2 Dir", license_number: "L-IM2-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { im2_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-IM2", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { im2_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Im2 Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { im2_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${im2_pat}", kind: "CONSENT", storage_uri: "s3://im2-c", signed: true }
              as: Provider
              as_user_id: "${im2_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${im2_pat}", exam_provider_id: "${im2_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${im2_inj}"
              captures: { im2_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${im2_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${im2_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${im2_cons}", director_provider_id: "${im2_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${im2_dir}"
              captures: { im2_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${im2_pat}", consultation_id: "${im2_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${im2_inj}"
              captures: { im2_plan: $.data.id, im2_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${im2_plan}/activate"
              payload: { expected_treatment_plan_version: "${im2_plan_v}" }
              as: Provider
              as_user_id: "${im2_inj}"
              captures: { im2_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${im2_plan}", standing_order_id: "${im2_so}", injector_provider_id: "${im2_inj}", injectable_lot_id: "${im2_lot}", planned_units: 20, expected_treatment_plan_version: "${im2_plan_v2}" }
              as: Provider
              as_user_id: "${im2_inj}"
              captures: { im2_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${im2_pat}", treatment_session_id: "${im2_sess}", kind: "BEFORE", storage_uri: "s3://im2-b" }
              as: Provider
              as_user_id: "${im2_inj}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${im2_sess}/commit"
              payload: {}
              as: Provider
              as_user_id: "${im2_inj}"
              captures: { im2_charge: $.data.final_charge_cents }
          assert:
            - "TreatmentSession.${im2_sess}.status == COMMITTED"
            - "TreatmentSession.${im2_sess}.final_charge_cents == 20000"
