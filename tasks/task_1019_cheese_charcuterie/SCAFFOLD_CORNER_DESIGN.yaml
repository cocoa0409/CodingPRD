  # =========================================================================
  - section: cross_cutting
    instances:
      - name: corner_allocate_stale_lot_version_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lot-allocate-stale-version]", "errors[ERR_STALE_LOT_VERSION]"]
        distinguishing_aspect: "After a first allocate against a lot advances Lot.version, a second allocate still carrying the earlier expected_lot_version is rejected with ERR_STALE_LOT_VERSION (412)."
        test_recipe:
          setup: ["RETAIL customer; product min_aging 0 shrink 0; READY lot 1000g; DRAFT order with two 300g lines; lot version captured before the first allocate."]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_type: "RETAIL", name: "OCC Cust", region_code: "CA" }, as: ShopManager, captures: { c: "$.data.id" } }
            - { call: "POST /api/products", payload: { name: "OCC Cheese", category: "CHEESE", milk_type: "COW", pasteurized: true, form: "BLOCK", pricing_mode: "BY_WEIGHT", price_per_kg_cents: 3000, allergens: ["MILK"], min_aging_days: 0, target_aging_days: 0, shrink_pct_per_day: 0 }, as: ShopManager, captures: { p: "$.data.id" } }
