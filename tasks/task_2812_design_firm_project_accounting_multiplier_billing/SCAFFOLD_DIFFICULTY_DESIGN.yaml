              payload: { client_id: "${cl_id}", name: "Riverside Library", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
