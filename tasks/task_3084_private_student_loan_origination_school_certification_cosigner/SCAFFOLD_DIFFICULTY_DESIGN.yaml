        distinguishing_aspect: "A file that is at once in the wrong state (already DENIED) and fiscally unacceptable (its blended score lands in tier DECLINED) returns the state-category error, so the state-vs-business_fiscal ordering is observable rather than the two checks merely co-existing."
        test_recipe:
          setup:
            - "A DENIED application whose score pair would produce DECLINED anyway."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Nina Borrower", email: "nina@example.com", state_code: "NV", program_level: "UNDERGRADUATE", credit_score: 560, dti_ratio: 0.52 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Desert State College", school_code: "003012", state_code: "NV", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-PRI", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Otto Cosigner", email: "otto@example.com", state_code: "NV", relationship: "PARENT", credit_score: 590, credit_history_months: 90, dti_ratio: 0.5 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 590, dti_ratio: 0.5 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 805000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "DEFERRED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "DENY" }
              as: Underwriter
              captures: { reason: $.data.denial_reason }
          trigger:
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
              captures: { err_state: $.data.error_id }
          assert:
            - "${reason} == CREDIT_SCORE — the first fiscal gate failed on the way to DENIED"
            - "${err_state} == ERR_INVALID_STATE — state (priority 13) outranks fiscal decline (priority 25)"
            - "LoanApplication.${app}.application_status is still DENIED and no Loan exists for it"
