          rationale: "That instance runs the identical QLICI set under both award methods and asserts 89.47 against 64.04, including the PASS/FAIL flip, so a separate divergence probe adds nothing."

      - name: substantially_all_variant_selection_depends_on_the_award_method_and_the_call_site
        claim_type: variant_selection
        grounds:
          - calculations.substantially_all_percentage.variants
          - endpoints[POST /nmtc/qeis/{id}/annual-tests]
        excluded_because:
          difficulty_instance: dual_variant_calc / substantially_all_direct_vs_aggregate_diverge_on_late_deployed_qlici
          rationale: "The same instance asserts that interim recomputes on QLICI deployment always use DIRECT_TRACING while only the annual test honours AGGREGATE_BALANCE, which is exactly the variant-selection claim."

      - name: job_quality_variants_score_the_same_reports_differently
        claim_type: reconciliation
        grounds:
          - calculations.job_quality_compliance.variants
          - entities.CommunityBenefitsAgreement.fields.measurement_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / job_quality_headcount_vs_payroll_hours_diverge_on_same_reports
          rationale: "That instance certifies the identical two-report set under HEADCOUNT (72.00 SHORTFALL) and PAYROLL_HOURS (86.52 CURE_REQUIRED) and reconciles the resulting agreement statuses."

      - name: cde_fee_allocation_distributes_a_signed_rounding_residual
        claim_type: correct_result
        grounds:
          - calculations.cde_asset_management_fee_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_allocation_rounds_per_qlici_then_pushes_signed_residual_to_earliest_largest
          rationale: "That instance already pins the exact per-QLICI shares [166666, 166667, 166667] including the negative one-cent residual and its earliest-created-largest tie-break."

      - name: qei_reserve_tier_boundaries_are_evaluated_on_the_gross_amount
        claim_type: threshold
        grounds:
          - calculations.qei_reserve_and_net_deployable
        excluded_because:
          difficulty_instance: combinatorial_formula / qei_reserve_tier_selected_from_gross_amount_before_fee_subtraction
          rationale: "That instance walks the 499,999,999 / 500,000,000 / 1,499,999,999 / 1,500,000,000 tier boundaries and shows the tier is chosen before the fee is netted."

  # ===========================================================================
  - section: validations
    instances:
      - name: pagination_limit_of_zero_returns_invalid_pagination
        claim_type: violation_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit must be an integer in [1,100]: limit=0 returns 400 ERR_INVALID_PAGINATION rather than silently falling back to the default of 10, and limit=100 at the top of the range succeeds."
        test_recipe:
          setup:
            - "One CERTIFIED CDE so the list is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-111", service_area_scope: "STATEWIDE" }
              as: CertifyingAgency
          trigger:
            - call: "GET /nmtc/cdes"
              payload: { limit: 0 }
              as: CertifyingAgency
            - call: "GET /nmtc/cdes"
              payload: { limit: 101 }
              as: CertifyingAgency
            - call: "GET /nmtc/cdes"
              payload: { offset: -1 }
              as: CertifyingAgency
            - call: "GET /nmtc/cdes"
              payload: { limit: 100, offset: 0 }
              as: CertifyingAgency
          assert:
            - "limit=0 returns HTTP 400 with error_id == \"ERR_INVALID_PAGINATION\""
            - "limit=101 returns HTTP 400 with error_id == \"ERR_INVALID_PAGINATION\" (100 is the inclusive maximum)"
            - "offset=-1 returns HTTP 400 with error_id == \"ERR_INVALID_PAGINATION\""
            - "limit=100, offset=0 returns HTTP 200 with limit == 100, offset == 0, total_count == 1, has_more == false"

      - name: a_qalicb_outside_the_award_service_area_blocks_the_qlici
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_OUTSIDE_SERVICE_AREA]
          - entities.AllocationAward.fields.service_area_state_codes
        distinguishing_aspect: "The service-area check compares the QALICB's state_code against the AWARD's declared states, not the CDE's scope: a fully CERTIFIED Louisiana business with a signed benefits agreement is still refused by an MS-only award, while the same structure accepts an MS business."
        test_recipe:
          setup:
            - "Award declaring service_area_state_codes [\"MS\"] only, signed and ACTIVE, with a funded QEI of 100,000,000 cents (95,000,000 net)."
            - "Two CERTIFIED QALICBs: one in MS and one in LA, each in an eligible tract and each with a benefits agreement bound to the award."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
