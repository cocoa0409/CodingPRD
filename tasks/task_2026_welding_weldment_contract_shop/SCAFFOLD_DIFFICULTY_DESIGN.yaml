          trigger:
            - call: "GET /weld-shop/shops/${shop_id}/joints/${joint_id}"
              as: Any
              captures: { fab: $.data.fabrication_status, insp: $.data.inspection_status }
          assert:
            - "Joint.fabrication_status == 'WELDED_OUT' (fabrication axis)"
            - "Joint.inspection_status == 'READY_FOR_VT' (inspection axis auto-advanced)"
            - "Two dimensions exist on one entity and evolve semi-independently"

  # -------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3, one >= 2)
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: wps_supersede_cascade_depth_3
        grounds:
          - state_machines.WPS.APPROVED_to_SUPERSEDED
          - state_machines.Joint
          - state_machines.WelderQualification
        distinguishing_aspect: |
          Depth-3 cascade triggered by WPS rev N+1 approval:
          link 1: prior APPROVED WPS rev N → SUPERSEDED;
          link 2: PENDING Joints referencing rev N flip to ON_HOLD (caused by
          the WPS supersession, not the original approve call);
          link 3: WelderQualification rows referencing the superseded WPS are
          re-evaluated; those whose welder's last_weld_at_utc is older than
          183 days at current_utc flip to LAPSED. Each link is caused by the
          previous, not by the original approve.
        test_recipe:
          setup:
            - "Shop + approved PQR + WPS rev 1 APPROVED; rev 2 DRAFT"
            - "Joint J1 in PENDING fabrication referencing rev 1"
            - "Welder W with QUALIFIED qualification referencing rev 1; qualified_at = 2026-01-01T00:00:00Z, last_weld_at = 2026-01-01T00:00:00Z; current clock at 2026-08-01 (past 183-day expiry)"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S7", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W7", full_name: "Welder Seven" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-7", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-7" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-7", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r1_id: $.data.id, wps_r1_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r1_id}/approve"
              payload: { expected_wps_version: "${wps_r1_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-7", revision: 2, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r2_id: $.data.id, wps_r2_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_r1_id}", process: "SMAW", qualified_at_utc: "2026-01-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "F7", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-7", customer_name: "Cust G", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-7", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { weldment_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${weldment_id}/joints"
              payload: { joint_number: "J7", wps_id: "${wps_r1_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { joint_id: $.data.id }
            # Note: joint stays in PENDING — do NOT call start-fabrication
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r2_id}/approve"
              payload: { expected_wps_version: "${wps_r2_v}" }
              as: QCManager
            - call: "GET /weld-shop/shops/${shop_id}/wps/${wps_r1_id}"
              as: Any
              captures: { r1_status: $.data.status }
            - call: "GET /weld-shop/shops/${shop_id}/joints/${joint_id}"
              as: Any
              captures: { joint_fab: $.data.fabrication_status }
            - call: "GET /weld-shop/shops/${shop_id}/welder-qualifications/${qual_id}"
              as: Any
              captures: { qual_status: $.data.status }
          assert:
            - "WPS rev 1 status == 'SUPERSEDED' (link 1)"
            - "Joint J7 fabrication_status == 'ON_HOLD' (link 2 — cascaded from link 1, not directly from approve)"
            - "WelderQualification status == 'LAPSED' (link 3 — re-evaluated because its WPS was superseded AND its last_weld_at is past 183 days at current clock)"

      - name: oven_offline_cascade_depth_2
        grounds:
          - state_machines.Oven.ONLINE_to_OFFLINE
          - state_machines.ConsumableLot
        distinguishing_aspect: |
          Depth-2 cascade triggered by oven take-offline:
          link 1: all OPEN ConsumableIssues for lots in this oven → VOID;
          link 2: their ConsumableLots → QUARANTINED (caused by issue void,
          not directly by the oven call). Distinct trigger from WPS approval.
        test_recipe:
          setup:
            - "Shop + oven ONLINE + SMAW lot ISSUED with one OPEN ConsumableIssue"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S8", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W8", full_name: "Welder Eight" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV8", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L8", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
              captures: { issue_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/take-offline"
              payload: {}
              as: MaterialController
            - call: "GET /weld-shop/shops/${shop_id}/consumable-lots/${lot_id}"
              as: Any
              captures: { lot_status: $.data.status }
            - call: "GET /weld-shop/shops/${shop_id}/consumable-issues"
              payload: {}
              as: Any
              captures: { issue0_status: "$.data[0].status" }
          assert:
            - "Oven.status == 'OFFLINE'"
            - "ConsumableIssue[0].status == 'VOID' (link 1)"
            - "ConsumableLot.status == 'QUARANTINED' (link 2 — caused by issue void cascade)"

  # -------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_wps_approve
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.WPS
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE / ERR_WPS_NOT_DRAFT) vs
          business_safety (priority 6, ERR_SEGREGATION_OF_DUTIES). When WPS
          is in APPROVED state (not DRAFT) AND the approving user equals the
          PQR reviewer, priority 5 wins and the error is ERR_WPS_NOT_DRAFT —
          not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Shop + PQR approved by QCManager user U1"
            - "WPS created referencing that PQR, approved by QCManager user U2 (segregation ok)"
            - "Second approve attempt by U1 — but WPS is no longer DRAFT"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S9", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-9", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-9" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            # Approve PQR as user U1
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
              as_user_id: "U1"
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-9", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            # Approve WPS as user U2 (segregation satisfied)
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
              as_user_id: "U2"
          trigger:
            # Attempt second approve as U1 (would violate segregation AND state)
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
              as_user_id: "U1"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_WPS_NOT_DRAFT' (priority 5 state error beats priority 6 segregation error)"
            - "err != 'ERR_SEGREGATION_OF_DUTIES'"

      - name: safety_vs_fiscal_on_consumable_issue
        grounds:
          - validations[priority=11]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair: business_safety (priority 11, ERR_LOT_NOT_USABLE) vs
          business_fiscal (priority 18, ERR_INSUFFICIENT_LOT_QUANTITY).
          Issuing from a QUARANTINED lot with insufficient remaining_kg
          triggers priority 11 first — lot status error, not quantity.
        test_recipe:
          setup:
            - "Shop + oven + SMAW lot in QUARANTINED state with remaining_kg = 1"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S10", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W10", full_name: "Welder Ten" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV10", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L10", filler_spec: "E7018", process: "SMAW", received_kg: 2, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 1 }
              as: MaterialController
              captures: { issue_id: $.data.id }
            # Take oven offline to cascade lot to QUARANTINED
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/take-offline"
              payload: {}
              as: MaterialController
            # Bring oven back online — lot stays QUARANTINED
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/bring-online"
              payload: {}
              as: MaterialController
          trigger:
            # Try to issue 5 kg from a QUARANTINED lot with only 1 kg remaining
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_LOT_NOT_USABLE' (priority 11 business_safety beats priority 18 business_fiscal)"
            - "err != 'ERR_INSUFFICIENT_LOT_QUANTITY'"

  # -------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
