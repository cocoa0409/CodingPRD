            - "The second sweep reports blocks_released == 1 (the aging boundary is inclusive)"
            - "INVARIANT RESTORED: RateCenter.${rc_id}.available_block_count == 5, assigned_block_count == 0 and NPA.${npa_id}.available_block_count == 5"
            - "INVARIANT RESTORED: NPA.${npa_id}.status == ACTIVE with jeopardy_declared_at == null and RateCenter.${rc_id}.jeopardy_flag == false"
            - "INVARIANT RESTORED: NumberBlock.${blk0_id}.allocation_status == POOL_AVAILABLE with holder_carrier_id == null, assigned_at == null, activation_due_at == null and aging_release_at == null"
            - "NOT COMPENSATED: Carrier.${carrier_a_id}.blocks_held_count == 0 but reclamation_strike_count == 1 and AllocationRequest.${req_id}.status is still APPROVED with granted_block_count == 1"

      - name: single_published_routing_record_conserved_across_port_activate_then_snapback
        grounds:
          - state_machines.PortRequest.ACTIVATED_to_SNAPPED_BACK
          - state_machines.NumberBlock.PORT_LOCKED_to_LERG_PUBLISHED
          - state_machines.RoutingRecord.PUBLISHED_to_SUPERSEDED
          - entities.NumberBlock.fields.current_lrn
          - entities.NumberBlock.fields.npac_db_version
        distinguishing_aspect: |
          The snapback compensation republishes the pre-port LRN as a THIRD
          ledger row rather than resurrecting the first one, so the block ends
          with three RoutingRecord rows, exactly one PUBLISHED, current_lrn back
          at 6145560000 and npac_db_version at 3 - a counter that is never
          rolled back even though the routing state returns to where it started.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carriers A (OCN 1234, losing) and B (OCN 5678, gaining) both ELIGIBLE in OH; carrier A has a submitted 2026H1 filing computing to 93.33."
            - "Block 614-558-3 is held by carrier A as ASSIGNED and carries one PUBLISHED routing record with lrn 6145560000 effective 2026-08-01T00:00:00Z, so routing_status is LERG_PUBLISHED and npac_db_version is 1."
            - "Carrier B filed a port request for 6145583000 with requested_lrn 6145570000, carrier A concurred, and porting operations activated it, so the block is PORT_LOCKED with current_lrn 6145570000 and npac_db_version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
              captures: { carrier_b_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_b_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_b_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH02DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
            - call: "POST /numbering/carriers/${carrier_b_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "558", thousands_digit: 3, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
              captures: { blk_id: $.data.id }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2800, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [1200, 800, 600, 400] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "GET /numbering/blocks/${blk_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { blk_v1: $.data.version }
            - call: "POST /numbering/blocks/${blk_id}/routing-records"
              payload: { lrn: "6145560000", switch_clli: "CLMBOH01DS0", effective_at: "2026-08-01T00:00:00Z", expected_block_version: "${blk_v1}" }
              as: NumberingAdministrator
              captures: { rec1_id: $.data.id }
            - call: "POST /numbering/port-requests"
              payload: { telephone_number: "6145583000", number_block_id: "${blk_id}", from_carrier_id: "${carrier_a_id}", to_carrier_id: "${carrier_b_id}", requested_lrn: "6145570000", desired_due_at: "2026-08-15T00:00:00Z" }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { port_id: $.data.id }
            - call: "POST /numbering/port-requests/${port_id}/transitions"
              payload: { action: "CONCUR" }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/port-requests/${port_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: PortingOperations
              as_user_id: "porting-1"
          trigger:
            - call: "POST /numbering/port-requests/${port_id}/transitions"
              payload: { action: "CANCEL" }
              as: PortingOperations
              as_user_id: "porting-1"
          assert:
            - "PortRequest.${port_id}.status == SNAPPED_BACK with closed_at == 2026-08-01T00:00:00Z and npac_db_version_at_activation still 2"
            - "NumberBlock.${blk_id}.routing_status == LERG_PUBLISHED and allocation_status is still ASSIGNED"
            - "INVARIANT: GET /numbering/blocks/${blk_id}/routing-records returns exactly 3 rows and exactly 1 has record_status PUBLISHED"
            - "The single PUBLISHED row carries lrn 6145560000 with end_at == null, and NumberBlock.${blk_id}.current_lrn == 6145560000"
            - "RoutingRecord.${rec1_id}.record_status == SUPERSEDED - the original row is NOT resurrected"
            - "NOT ROLLED BACK: NumberBlock.${blk_id}.npac_db_version == 3"
            - "Carrier.${carrier_a_id}.blocks_held_count == 1 - a port never moved the block between carriers"
