            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "EXP-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-01-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: ENDORSE }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_APPRAISAL_EXPIRED"

      - name: transfer_to_case_with_live_appraisal_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CASE_ALREADY_HAS_APPRAISAL]", "state_machines.Appraisal.ACCEPTED_to_TRANSFERRED"]
        distinguishing_aspect: "Transferring into a case that already holds a DELIVERED appraisal fails with 409 ERR_CASE_ALREADY_HAS_APPRAISAL — one live appraisal per case."
        test_recipe:
          setup: ["one lender, case1 with an ACCEPTED appraisal, case2 with a DELIVERED appraisal; clock before expiry"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Double Appraisal Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "DA-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_1: $.data.id } }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "DA-2", base_loan_amount_cents: 28000000, appraised_value_cents: 30000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 190000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_2: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_1}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_1: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_1}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_2}/appraisals", payload: { appraised_value_cents: 30000000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}" }
