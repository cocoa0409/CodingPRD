            - "${e_dup_lane} == ERR_DUPLICATE_AGREEMENT with HTTP 422: DRAFT counts as an open lane"
            - "${second_lane_status} == DRAFT and ${second_lane_region} == TX"
            - "the agreement listing for ${merchant_id} returns meta.total_count == 2"

