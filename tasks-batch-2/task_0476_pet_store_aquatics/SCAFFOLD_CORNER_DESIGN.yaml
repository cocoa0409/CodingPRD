          - entities.InventoryLot.fields.status
        distinguishing_aspect: "Two lots (A expiry 2026-06, qty 2; B expiry 2026-12, qty 5); run-shipment for 3 units draws 2 from A (→0, DEPLETED) then 1 from B (→4) — earliest expiry first."
        test_recipe:
          setup: ["Store S, Product P, lot A (expiry earlier, qty 2) and lot B (expiry later, qty 5); ACTIVE subscription qty=3 due now."]
