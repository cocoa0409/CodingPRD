              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Analytics Read Supply", tax_id_last4: "1515", remittance_email: "ar@analytics.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
