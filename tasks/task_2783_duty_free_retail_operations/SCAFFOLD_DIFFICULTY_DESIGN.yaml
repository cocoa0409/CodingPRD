          setup:
            - "Terminal SIN in SG"
            - "One LIQUOR product priced 8000 cents at 2400 bps, LISTED, 100 units received into bonded stock"
            - "One RESERVED pre-order for 60 units held by the traveller over [2026-08-10, 2026-08-12], program PICKUP_ON_DEPARTURE"
            - "ConcessionAgreement 2026-08 at SIN activated, then closed once the clock reaches 2026-09-01T00:00:00Z"
            - "A CustomsAudit for period 2026-08 prepared by user-stock-01 and submitted with counted_qty 30 against an expected_qty_snapshot of 100"
