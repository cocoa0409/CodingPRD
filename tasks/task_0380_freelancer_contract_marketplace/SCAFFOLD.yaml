# =============================================================================
# Freelancer & Contract Work Marketplace (Upwork-style) — Seed Tables (v1)
# =============================================================================

scenario: |
  Freelancer & Contract Work Marketplace (Upwork style): job posting & proposal/bid,
  milestone & escrow funding, hourly time-tracking & verification, release/dispute &
  arbitration, platform fee & payout, rating/reputation, contract/SOW, 1099 reporting

domain_name: freelancer-contract-marketplace
api_prefix: /

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency       # escrow funding / milestone release on Contract.version
    - cascading_side_effects       # dispute resolution + contract termination cascades
    - dual_variant_calculation     # standard vs disputed milestone release; YTD 1099 by mode
    - rate_threshold_triggers      # platform fee tiers; $600 1099 threshold

  entity_topology: flat
  # Peer entities linked by foreign keys (Client, Freelancer, JobPosting, Proposal,
  # Contract, Milestone, TimeLog, EscrowTransaction, Dispute, Payout, Review, TaxRecord).
  # URLs are mostly /clients/{id}, /freelancers/{id}, /contracts/{id} with FK bodies,
  # not deep nesting.

  state_machine_shape: cyclic
  # Proposal supports cyclic negotiation rounds (SUBMITTED -> COUNTERED -> SUBMITTED);
  # Milestone is branching fork-join (SUBMITTED -> {APPROVED, DISPUTED}); Dispute and
  # Contract carry their own non-linear lifecycles.

  relationship_patterns:
    - one_to_many        # Contract has many Milestones; Milestone has many TimeLogs / EscrowTransactions
    - cross_aggregate    # Milestone release writes Freelancer.lifetime fields and TaxRecord

  role_model: peer_roles
  # Client owns JobPostings/Contracts/funding; Freelancer owns Proposals/TimeLogs/Payouts;
  # Arbitrator (opaque) resolves Disputes; PlatformAdmin (opaque) runs clock / tax sweeps.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: display_name, type: string, source: input, description: "Client / company name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among clients" }
      - { name: wallet_balance_cents, type: integer, source: system, default: 0, description: "Prepaid wallet funds available to fund escrow; never negative" }
      - { name: escrow_held_cents, type: integer, source: computed, description: "Sum of EscrowTransaction.amount_cents with status=HELD across this client's contracts" }
      - { name: lifetime_funded_cents, type: integer, source: computed, description: "Cumulative cents moved from wallet into escrow (FUND ledger entries)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Freelancer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: display_name, type: string, source: input, description: "Freelancer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among freelancers" }
      - { name: tax_id_on_file, type: boolean, source: input, default: false, description: "Whether a W-9 / TIN is on file; gates payout and 1099" }
      - { name: skills, type: array, source: input, description: "Array of skill tag strings" }
      - { name: lifetime_earnings_cents, type: integer, source: computed, description: "Cumulative net cents paid out (Payout.net_cents with status=PAID), used for fee tiering" }
      - { name: lifetime_gross_billed_cents, type: integer, source: computed, description: "Cumulative gross cents released to this freelancer before fees" }
      - { name: completed_contract_count, type: integer, source: computed, description: "Count of Contracts in COMPLETED for this freelancer" }
      - { name: dispute_loss_count, type: integer, source: computed, description: "Count of Disputes resolved CLIENT_FAVOR or SPLIT against this freelancer" }
      - { name: reputation_score, type: number, source: computed, description: "0-100 weighted reputation; see calculations.reputation_score" }
      - { name: fee_tier, type: enum, source: computed, description: "TIER_A | TIER_B | TIER_C derived from lifetime_earnings_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: JobPosting
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owner of the posting" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: billing_type, type: enum, source: input, description: "FIXED | HOURLY; pins how contracts under this posting bill" }
      - { name: budget_cents, type: integer, source: input, description: "Advertised budget (FIXED) or per-hour cap context; minimum 100" }
      - { name: required_skills, type: array, source: input, description: "Array of skill tags a proposing freelancer must cover" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | AWARDED | CLOSED | CANCELLED" }
      - { name: proposal_count, type: integer, source: computed, description: "Count of Proposals for this posting in non-terminal states" }
      - { name: awarded_proposal_id, type: string, source: system, description: "Id of the accepted Proposal (references Proposal.id) set when status=AWARDED, else null; reverse lookup via the posting's own proposals list" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: job_posting_id, type: string, source: input, description: "FK -> JobPosting.id; the posting being bid on" }
      - { name: freelancer_id, type: string, source: input, description: "FK -> Freelancer.id; the bidder" }
      - { name: bid_amount_cents, type: integer, source: input, description: "Bid total (FIXED) or hourly rate in cents (HOURLY); current live value after counters" }
      - { name: cover_letter, type: string, source: input, description: "Proposal text" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of completed counter rounds (incremented each COUNTERED transition)" }
      - { name: last_actor, type: enum, source: system, default: FREELANCER, description: "FREELANCER | CLIENT — who made the most recent offer; pins whose turn it is" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from posting at award" }
      - { name: freelancer_id, type: string, source: system, description: "FK -> Freelancer.id; copied from accepted proposal" }
      - { name: proposal_id, type: string, source: system, description: "Id of the accepted Proposal this contract was created from (references Proposal.id); 1:1 provenance pointer, reachable forward from the proposal's accept response" }
      - { name: billing_type, type: enum, source: system, description: "FIXED | HOURLY; copied from posting" }
      - { name: sow_text, type: string, source: input, description: "Statement of Work prose agreed at activation" }
      - { name: agreed_amount_cents, type: integer, source: system, description: "FIXED: total contract value; HOURLY: agreed hourly rate in cents (copied from proposal bid_amount_cents)" }
      - { name: hourly_cap_hours, type: number, source: input, description: "HOURLY only: max billable hours per UTC calendar day across this contract; null for FIXED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | TERMINATED | COMPLETED" }
      - { name: total_released_cents, type: integer, source: computed, description: "Sum of gross released to freelancer across milestones (EscrowTransaction RELEASE entries)" }
      - { name: total_refunded_cents, type: integer, source: computed, description: "Sum of escrow refunded to client (EscrowTransaction REFUND entries)" }
      - { name: open_milestone_count, type: integer, source: computed, description: "Count of Milestones not in a terminal state" }
      - { name: open_dispute_count, type: integer, source: computed, description: "Count of Disputes on this contract not in a terminal state" }

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; parent contract" }
      - { name: title, type: string, source: input, description: "Deliverable name" }
      - { name: amount_cents, type: integer, source: input, description: "FIXED: escrow amount to fund; HOURLY: computed cap from approved hours (see calculations); minimum 100" }
      - { name: funded_cents, type: integer, source: computed, description: "Sum of EscrowTransaction.amount_cents FUND minus REFUND for this milestone; equals held escrow" }
      - { name: released_gross_cents, type: integer, source: computed, description: "Gross cents released to freelancer for this milestone (may be partial after SPLIT dispute)" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cents refunded to client for this milestone" }
      - { name: ordinal, type: integer, source: input, description: "1-based sequence position within the contract; unique per contract" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FUNDED | SUBMITTED | APPROVED | DISPUTED | RELEASED | REFUNDED | CANCELLED" }

  - name: TimeLog
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; HOURLY contract this log bills" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; the HOURLY milestone accumulating these hours" }
      - { name: freelancer_id, type: string, source: system, description: "Id of the working freelancer (references Freelancer.id) copied from contract; denormalized for the daily-cap aggregate, reachable via the contract/milestone timelog lists" }
      - { name: work_date, type: string, source: input, description: "UTC calendar date (YYYY-MM-DD) the work occurred" }
      - { name: start_minute, type: integer, source: input, description: "Minutes from 00:00 UTC on work_date when the interval starts; 0-1439" }
      - { name: end_minute, type: integer, source: input, description: "Minutes from 00:00 UTC on work_date when the interval ends; half-open [start,end); 1-1440; > start_minute" }
      - { name: billable_minutes, type: integer, source: computed, description: "end_minute - start_minute" }
      - { name: memo, type: string, source: input, description: "Work description" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED | VERIFIED | REJECTED" }

  - name: EscrowTransaction
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "Ledger insertion time; ordering key for the escrow ledger" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract this ledger row belongs to" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; milestone this ledger row belongs to" }
      - { name: txn_type, type: enum, source: system, description: "FUND | RELEASE | REFUND; append-only ledger event type" }
      - { name: amount_cents, type: integer, source: system, description: "Positive cents moved by this event" }
      - { name: status, type: enum, source: system, description: "HELD (FUND still in escrow) | SETTLED (RELEASE/REFUND completed) | REVERSED (FUND undone by a matching REFUND)" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; copied from milestone" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; the disputed milestone" }
      - { name: raised_by, type: enum, source: input, description: "CLIENT | FREELANCER" }
      - { name: reason, type: string, source: input, description: "Dispute description" }
      - { name: claimed_release_cents, type: integer, source: input, description: "Freelancer's claimed release amount; <= milestone.funded_cents" }
      - { name: arbitrator_award_cents, type: integer, source: input, description: "Cents the arbitrator releases to freelancer on resolution; remainder refunded to client; 0..funded_cents" }
      - { name: resolution, type: enum, source: system, description: "FREELANCER_FAVOR | CLIENT_FAVOR | SPLIT — set at resolution, else null" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_ARBITRATION | RESOLVED | WITHDRAWN" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: freelancer_id, type: string, source: input, description: "FK -> Freelancer.id; payee" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; milestone whose release this payout settles" }
      - { name: gross_cents, type: integer, source: system, description: "Gross released to freelancer for this milestone (= milestone.released_gross_cents at payout creation)" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform fee withheld; see calculations.platform_fee" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - platform_fee_cents; amount the freelancer receives" }
      - { name: tax_year, type: integer, source: system, description: "UTC year of the release, used for 1099 aggregation" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PAID | HELD_NO_TAX_ID" }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the completed contract being reviewed" }
      - { name: author_role, type: enum, source: input, description: "CLIENT | FREELANCER — who wrote the review" }
      - { name: freelancer_id, type: string, source: system, description: "Id of the reviewed freelancer (references Freelancer.id) copied from the contract; reachable via the contract's reviews list" }
      - { name: rating, type: integer, source: input, description: "1-5 star rating" }
      - { name: comment, type: string, source: input, description: "Review text" }

  - name: TaxRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "Generation timestamp" }
      - { name: freelancer_id, type: string, source: input, description: "FK -> Freelancer.id; subject of the 1099" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year being reported" }
      - { name: reportable_gross_cents, type: integer, source: system, description: "Sum of Payout.gross_cents with status=PAID and tax_year=this year for this freelancer" }
      - { name: is_reportable, type: boolean, source: system, description: "True when reportable_gross_cents >= REPORTING_THRESHOLD_CENTS (60000)" }
      - { name: form_status, type: enum, source: system, description: "BELOW_THRESHOLD | GENERATED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: JobPosting
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "system (first Proposal submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "proposal_count increments to 1"

      - from: [OPEN, UNDER_REVIEW]
        to: AWARDED
        trigger: "system (a Proposal under this posting transitions to ACCEPTED)"
        actor: system
        preconditions:
          - "JobPosting.status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "awarded_proposal_id set to the accepted Proposal.id"
          - "All sibling Proposals in {SUBMITTED, COUNTERED} transition to DECLINED (cascade)"
          - "A Contract is created in DRAFT for the awarded proposal"

      - from: AWARDED
        to: CLOSED
        trigger: "system (the awarded Contract transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [OPEN, UNDER_REVIEW]
        to: CANCELLED
        trigger: "POST /job-postings/{id}/cancel"
        actor: Client
        preconditions:
          - "JobPosting.status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "All Proposals in {SUBMITTED, COUNTERED} transition to DECLINED (cascade)"

  - entity: Proposal
    field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: [SUBMITTED, COUNTERED]
        to: COUNTERED
        trigger: "POST /proposals/{id}/counter"
        actor: "Client or Freelancer"
        preconditions:
          - "JobPosting.status IN {OPEN, UNDER_REVIEW}"
          - "round_count < MAX_COUNTER_ROUNDS (5)"
          - "the acting party is the opposite of Proposal.last_actor (counter-offer must alternate turns)"
        side_effects:
          - "bid_amount_cents updated to the new offer"
          - "round_count increments by 1"
          - "last_actor flips to the acting party"
        note: "Cyclic: COUNTERED -> COUNTERED supports multiple negotiation rounds; turn must alternate."

      - from: [SUBMITTED, COUNTERED]
        to: ACCEPTED
        trigger: "POST /proposals/{id}/accept"
        actor: "Client (accepts a freelancer offer) or Freelancer (accepts a client counter)"
        preconditions:
          - "JobPosting.status IN {OPEN, UNDER_REVIEW}"
          - "the acting party is the opposite of Proposal.last_actor (you cannot accept your own live offer)"
        side_effects:
          - "JobPosting -> AWARDED (cross-entity)"
          - "sibling Proposals in {SUBMITTED, COUNTERED} -> DECLINED (cascade)"
          - "Contract created in DRAFT with billing_type, agreed_amount_cents from this proposal"

      - from: [SUBMITTED, COUNTERED]
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw"
        actor: Freelancer
        preconditions:
          - "acting Freelancer owns this proposal"
        side_effects:
          - "proposal_count on JobPosting recomputed"

      - from: [SUBMITTED, COUNTERED]
        to: DECLINED
        trigger: "POST /proposals/{id}/decline or system (sibling award / posting cancel cascade)"
        actor: "Client or system"
        preconditions: []
        side_effects:
          - "proposal_count on JobPosting recomputed"

  - entity: Contract
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: Client
        preconditions:
          - "Contract.status == DRAFT"
          - "sow_text provided"
        side_effects:
          - "JobPosting -> CLOSED (cross-entity)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /contracts/{id}/complete"
        actor: Client
        preconditions:
          - "Contract.status == ACTIVE"
          - "open_milestone_count == 0 (every milestone in RELEASED, REFUNDED, or CANCELLED)"
          - "open_dispute_count == 0"
        side_effects:
          - "Freelancer.completed_contract_count increments"
          - "Freelancer.reputation_score recomputed"

      - from: [DRAFT, ACTIVE]
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: Client
        preconditions:
          - "Contract.status IN {DRAFT, ACTIVE}"
          - "open_dispute_count == 0"
        side_effects:
          - "Each Milestone in {DRAFT, FUNDED, SUBMITTED, APPROVED} -> CANCELLED (cascade hop 1)"
          - "Each cancelled Milestone with funded_cents > 0 emits a REFUND EscrowTransaction returning held escrow to Client.wallet_balance_cents (cascade hop 2)"
          - "Freelancer.reputation_score recomputed"

  - entity: Milestone
    field: status
    initial_state: DRAFT
    terminal_states: [RELEASED, REFUNDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FUNDED
        trigger: "POST /contracts/{id}/milestones/{milestoneId}/fund"
        actor: Client
        preconditions:
          - "Contract.status == ACTIVE (cross-entity)"
          - "Client.wallet_balance_cents >= amount_cents"
          - "expected_contract_version matches Contract.version (OCC)"
        side_effects:
          - "Client.wallet_balance_cents debited by amount_cents"
          - "FUND EscrowTransaction created (status=HELD); milestone.funded_cents = amount_cents"
          - "increments Contract.version by 1"

      - from: FUNDED
        to: SUBMITTED
        trigger: "POST /contracts/{id}/milestones/{milestoneId}/submit-work"
        actor: Freelancer
        preconditions:
          - "Milestone.status == FUNDED"
          - "Contract.status == ACTIVE (cross-entity)"
          - "for HOURLY: at least one VERIFIED TimeLog exists for this milestone"
        side_effects: []
        note: "Fork point: from SUBMITTED the milestone branches to APPROVED or DISPUTED."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /contracts/{id}/milestones/{milestoneId}/approve"
        actor: Client
        preconditions:
          - "Milestone.status == SUBMITTED"
        side_effects: []
        note: "Branch A of the fork."

      - from: APPROVED
        to: RELEASED
        trigger: "POST /contracts/{id}/milestones/{milestoneId}/release"
        actor: Client
        preconditions:
          - "Milestone.status == APPROVED"
          - "expected_contract_version matches Contract.version (OCC)"
        side_effects:
          - "RELEASE EscrowTransaction created for full funded_cents (status=SETTLED); milestone.released_gross_cents = funded_cents"
          - "FUND EscrowTransaction for this milestone -> SETTLED"
          - "Payout created (gross_cents = released_gross_cents); platform_fee and net computed"
          - "Freelancer.lifetime_gross_billed_cents += gross; on Payout PAID, lifetime_earnings_cents += net (recomputes fee_tier, reputation_score)"
          - "increments Contract.version by 1"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /contracts/{id}/milestones/{milestoneId}/dispute"
        actor: "Client or Freelancer"
        preconditions:
          - "Milestone.status == SUBMITTED"
        side_effects:
          - "Dispute created in OPEN; Contract.open_dispute_count increments"
        note: "Branch B of the fork — diverges from APPROVED with a different side-effect set."

      - from: DISPUTED
        to: RELEASED
        trigger: "system (Dispute resolved FREELANCER_FAVOR or SPLIT with award > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "RELEASE EscrowTransaction for arbitrator_award_cents; if award < funded_cents a REFUND EscrowTransaction returns the remainder to Client.wallet"
          - "Payout created (gross = award); fee/net computed"

      - from: DISPUTED
        to: REFUNDED
        trigger: "system (Dispute resolved CLIENT_FAVOR, award == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND EscrowTransaction for full funded_cents to Client.wallet_balance_cents"
          - "Freelancer.dispute_loss_count increments; reputation_score recomputed"

      - from: [DRAFT, FUNDED, SUBMITTED, APPROVED]
        to: CANCELLED
        trigger: "system (parent Contract terminated)"
        actor: system
        preconditions: []
        side_effects:
          - "if funded_cents > 0: REFUND EscrowTransaction returns held escrow to Client.wallet_balance_cents"

  - entity: TimeLog
    field: status
    initial_state: LOGGED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /contracts/{id}/timelogs/{timelogId}/verify"
        actor: Client
        preconditions:
          - "TimeLog.status == LOGGED"
          - "Contract.status == ACTIVE (cross-entity)"
        side_effects:
          - "milestone.amount_cents recomputed from sum of VERIFIED billable_minutes * agreed hourly rate (see calculations.hourly_milestone_cap)"

      - from: LOGGED
        to: REJECTED
        trigger: "POST /contracts/{id}/timelogs/{timelogId}/reject"
        actor: Client
        preconditions:
          - "TimeLog.status == LOGGED"
        side_effects: []

  - entity: Dispute
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_ARBITRATION
        trigger: "POST /disputes/{id}/assign-arbitration"
        actor: Arbitrator
        preconditions:
          - "Dispute.status == OPEN"
        side_effects: []

      - from: UNDER_ARBITRATION
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: Arbitrator
        preconditions:
          - "Dispute.status == UNDER_ARBITRATION"
          - "0 <= arbitrator_award_cents <= milestone.funded_cents"
        side_effects:
          - "resolution set: award==funded -> FREELANCER_FAVOR; award==0 -> CLIENT_FAVOR; else SPLIT"
          - "Milestone transitions: award>0 -> RELEASED (full or split); award==0 -> REFUNDED (cascade hop 1)"
          - "RELEASE and/or REFUND EscrowTransactions emitted (cascade hop 2)"
          - "Contract.open_dispute_count decrements; Freelancer reputation recomputed (cascade hop 3 on CLIENT_FAVOR/SPLIT)"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: "Client or Freelancer (the raiser)"
        preconditions:
          - "Dispute.status == OPEN"
          - "acting party == Dispute.raised_by"
        side_effects:
          - "Milestone returns to SUBMITTED; Contract.open_dispute_count decrements"

  - entity: Payout
    field: status
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /payouts/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PENDING"
          - "Freelancer.tax_id_on_file == true"
        side_effects:
          - "Freelancer.lifetime_earnings_cents += net_cents (recomputes fee_tier)"
          - "Freelancer.reputation_score recomputed"

      - from: PENDING
        to: HELD_NO_TAX_ID
        trigger: "POST /payouts/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PENDING"
          - "Freelancer.tax_id_on_file == false"
        side_effects: []
        note: "Settlement attempted but blocked; no lifetime_earnings update."

      - from: HELD_NO_TAX_ID
        to: PAID
        trigger: "POST /payouts/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == HELD_NO_TAX_ID"
          - "Freelancer.tax_id_on_file == true"
        side_effects:
          - "Freelancer.lifetime_earnings_cents += net_cents (recomputes fee_tier)"
          - "Freelancer.reputation_score recomputed"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: milestone-fund-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/milestones/{milestoneId}/fund"
    occ_field: "expected_contract_version"
    description: |
      Funding a Milestone draws against the Client wallet and advances the
      Contract.version. A fund request carrying a Contract version older than
      the current one is rejected: the client's view of the contract is stale
      because another fund or release has already moved escrow and advanced the
      version since the client last read it.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: milestone-release-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/milestones/{milestoneId}/release"
    occ_field: "expected_contract_version"
    description: |
      Releasing escrow on an APPROVED milestone advances Contract.version. A
      release request carrying a stale Contract version is rejected, capturing
      the case where a prior fund or release already advanced the version since
      the client last observed it.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: platform_fee
    trigger: "Payout creation on milestone RELEASE (full, split, or dispute award)"
    algorithm: tiered_pricing
    formula: |
      Inputs: gross_cents (this payout), freelancer.lifetime_earnings_cents (BEFORE this payout),
              freelancer.dispute_loss_count.
      Step 1 — base tier rate from lifetime_earnings_cents (the fee TIER is keyed on the
               pre-payout lifetime, so the value is well-defined; evaluation order is pinned):
        if lifetime_earnings_cents <  TIER_A_CEIL (50000_00): rate = 0.20  (TIER_A)
        elif lifetime_earnings_cents < TIER_B_CEIL (1000000_00): rate = 0.10 (TIER_B)
        else: rate = 0.05 (TIER_C)
      Step 2 — risk surcharge: if freelancer.dispute_loss_count >= RISK_LOSS_THRESHOLD (3): rate += 0.05
      Step 3 — effective rate clamped: rate = min(rate, MAX_RATE 0.25)
      Step 4 — platform_fee_cents = floor(gross_cents * rate), but never below MIN_FEE_CENTS (100)
               unless gross_cents == 0 (then fee = 0); and never exceeding gross_cents.
      net_cents = gross_cents - platform_fee_cents
    input_set: "Single payout; lifetime_earnings_cents read BEFORE this payout is added."
    constants:
      TIER_A_CEIL: 5000000
      TIER_B_CEIL: 100000000
      TIER_A_RATE: 0.20
      TIER_B_RATE: 0.10
      TIER_C_RATE: 0.05
      RISK_LOSS_THRESHOLD: 3
      RISK_SURCHARGE: 0.05
      MAX_RATE: 0.25
      MIN_FEE_CENTS: 100
    precision: "floor truncation to integer cents; rate arithmetic in IEEE-754 double"

  - name: hourly_milestone_cap
    trigger: "TimeLog verification (LOGGED -> VERIFIED) on an HOURLY milestone"
    algorithm: aggregation
    formula: |
      Pinned rounding order — round PER VERIFIED TimeLog, THEN sum (NOT sum-minutes-then-round):
        for each VERIFIED TimeLog t on this milestone:
          per_log_cents = floor(t.billable_minutes / 60 * contract.agreed_amount_cents)
        milestone.amount_cents = sum(per_log_cents over VERIFIED logs)
      Daily cap enforcement happens at TimeLog creation (see validations), not here.
      If zero VERIFIED logs: milestone.amount_cents = 0 and the milestone cannot be submitted.
    input_set: "VERIFIED TimeLogs for this milestone only; LOGGED and REJECTED excluded."
    constants:
      MINUTES_PER_HOUR: 60
    precision: "floor truncation per log, then integer sum; order-independent because each log floored independently"

  - name: daily_hours_overlap
    trigger: "TimeLog creation on an HOURLY contract"
    algorithm: interval_merge
    formula: |
      Two checks, each with DIFFERENT interval semantics:
      (A) Same-milestone overlap: the new [start_minute, end_minute) half-open interval on
          work_date MUST NOT intersect any existing LOGGED or VERIFIED TimeLog interval on the
          SAME milestone and SAME work_date. Adjacency is allowed: [60,120) and [120,180) do
          NOT overlap (touching endpoints permitted).
      (B) Cross-contract daily aggregate cap: summed VERIFIED+LOGGED billable_minutes for this
          FREELANCER across ALL contracts on this work_date, plus the new interval's minutes,
          MUST NOT exceed GLOBAL_DAILY_MINUTE_CAP (720 = 12h). This is aggregate-capacity
          geometry (a running total), not pairwise overlap.
    input_set: "Check A: same milestone+date; Check B: all of freelancer's contracts, same date."
    constants:
      GLOBAL_DAILY_MINUTE_CAP: 720
    precision: "integer minutes"

  - name: reputation_score
    trigger: "Contract completion, milestone REFUNDED on dispute, Payout PAID, dispute SPLIT/CLIENT_FAVOR"
    algorithm: weighted_scoring
    formula: |
      Inputs: completed_contract_count (C), dispute_loss_count (L), avg_review_rating (R, 0 if no reviews).
      total_outcomes = C + L
      completion_rate = C / total_outcomes  (0 if total_outcomes == 0)
      rating_factor   = R / 5               (0 if no reviews)
      raw = (completion_rate * COMPLETION_WEIGHT) + (rating_factor * RATING_WEIGHT)
      acute_penalty = min(L * LOSS_PENALTY, MAX_PENALTY)
      reputation_score = round(max(0, min(100, raw * 100 - acute_penalty)), 2)
      New freelancers with total_outcomes == 0 and no reviews -> reputation_score = 0.0
    input_set: "Reviews with author_role=CLIENT for this freelancer's contracts; completed/lost counts."
    constants:
      COMPLETION_WEIGHT: 0.6
      RATING_WEIGHT: 0.4
      LOSS_PENALTY: 4
      MAX_PENALTY: 40
    precision: "2 decimal places, round_half_up"

  - name: escrow_conservation
    trigger: "every EscrowTransaction write (fund, release, refund) and every cancel/terminate cascade"
    algorithm: conservation_law
    formula: |
      Per milestone, over its EscrowTransaction ledger:
        funded_cents   = sum(FUND.amount where status=HELD)       (escrow still held)
        released_gross = sum(RELEASE.amount, status=SETTLED)
        refunded_cents = sum(REFUND.amount, status=SETTLED)
        sum(all FUND.amount, any status) == released_gross + refunded_cents + funded_cents
      Global wallet invariant for a Client:
        Client.lifetime_funded_cents == (current escrow_held_cents)
                                       + sum(RELEASE gross across client's milestones)
                                       + sum(REFUND back to wallet across client's milestones)
      Every FUND debits wallet by exactly amount; every REFUND credits wallet by exactly amount;
      RELEASE never touches wallet (escrow -> freelancer).
    input_set: "All EscrowTransactions for the milestone / client."
    precision: "integer cents; exact, no rounding"

  - name: tax_year_reportable
    trigger: "POST /tax-records (1099 generation) and the platform tax sweep"
    algorithm: aggregation
    formula: |
      DUAL VARIANT on reporting basis (both valid bases; the basis is selected by the
      request and produces DIFFERENT totals for the same freelancer-year):
        variant GROSS_BASIS (default, IRS 1099-NEC convention):
          reportable_gross_cents = sum(Payout.gross_cents where status=PAID, tax_year=Y, freelancer=F)
        variant NET_BASIS (platform internal statement):
          reportable_gross_cents = sum(Payout.net_cents where status=PAID, tax_year=Y, freelancer=F)
      is_reportable = (reportable_gross_cents >= REPORTING_THRESHOLD_CENTS)   # boundary: >= , not >
      form_status   = GENERATED if is_reportable else BELOW_THRESHOLD
      Only PAID payouts count; PENDING and HELD_NO_TAX_ID are excluded from the sweep.
    input_set: "Payouts with status=PAID for the freelancer and tax_year; basis chosen by 'basis' input."
    constants:
      REPORTING_THRESHOLD_CENTS: 60000     # $600.00 IRS threshold
    precision: "integer cents; threshold compared with >= (inclusive)"

  - name: job_match_score
    trigger: "GET /job-postings/{id}/ranked-proposals (server ranks live proposals)"
    algorithm: weighted_scoring
    formula: |
      For each Proposal in {SUBMITTED, COUNTERED} on the posting:
        skill_coverage = (count of posting.required_skills present in freelancer.skills)
                         / max(1, len(posting.required_skills))
        rep_factor     = freelancer.reputation_score / 100
        price_factor   = clamp(posting.budget_cents / max(1, bid_amount_cents), 0, 1)
        match = skill_coverage * SKILL_W + rep_factor * REP_W + price_factor * PRICE_W
      Rank DESC by match; tie-break by Proposal.created_at ASC (never by id).
    input_set: "Live proposals (SUBMITTED, COUNTERED) on the posting; terminal proposals excluded."
    constants:
      SKILL_W: 0.5
      REP_W: 0.3
      PRICE_W: 0.2
    precision: "match rounded to 4 decimals for ordering; tie-break created_at ASC"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; entity_backed role's X-User-ID must own the targeted resource where ownership applies"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist; validated left-to-right (client/freelancer/contract before child)"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_FREELANCER_NOT_FOUND / ERR_JOB_POSTING_NOT_FOUND / ERR_PROPOSAL_NOT_FOUND / ERR_CONTRACT_NOT_FOUND / ERR_MILESTONE_NOT_FOUND / ERR_TIMELOG_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_PAYOUT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: business_referential
    check: "Required input fields present and well-typed; enums in range; rating 1-5; amounts/minutes within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: business_referential
    check: "Freelancer.skills must cover JobPosting.required_skills when submitting a Proposal"
    error_id: ERR_SKILLS_NOT_COVERED
    http_status: 422
    applies_to: "POST /proposals"

  - priority: 6
    category: state
    check: "Target resource in correct state for the operation (e.g., Milestone FUNDED to submit-work, APPROVED to release)"
    error_id: "ERR_INVALID_MILESTONE_STATE / ERR_INVALID_PROPOSAL_STATE / ERR_INVALID_CONTRACT_STATE / ERR_INVALID_DISPUTE_STATE / ERR_INVALID_TIMELOG_STATE / ERR_INVALID_PAYOUT_STATE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state precondition: parent Contract must be ACTIVE to fund/submit/verify; JobPosting OPEN/UNDER_REVIEW to counter/accept"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "milestone fund/submit-work, timelog verify"

  - priority: 8
    category: business_constraint
    check: "Counter-offer turn must alternate (acting party != last_actor); accept cannot accept your own live offer; round_count < MAX_COUNTER_ROUNDS"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    applies_to: "POST /proposals/{id}/counter, POST /proposals/{id}/accept"

  - priority: 9
    category: business_temporal
    check: "Same-milestone TimeLog interval must not overlap an existing LOGGED/VERIFIED interval on the same work_date (half-open)"
    error_id: ERR_TIMELOG_OVERLAP
    http_status: 409
    applies_to: "POST /contracts/{id}/timelogs"

  - priority: 10
    category: business_temporal
    check: "Cross-contract daily aggregate: freelancer's total LOGGED+VERIFIED minutes for work_date + new minutes must not exceed GLOBAL_DAILY_MINUTE_CAP (720)"
    error_id: ERR_DAILY_HOURS_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /contracts/{id}/timelogs"

  - priority: 11
    category: business_constraint
    check: "Dispute resolution award must satisfy 0 <= arbitrator_award_cents <= milestone.funded_cents"
    error_id: ERR_AWARD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /disputes/{id}/resolve"

  - priority: 12
    category: business_constraint
    check: "Cannot complete a Contract while open_milestone_count > 0 or open_dispute_count > 0; cannot terminate while open_dispute_count > 0"
    error_id: ERR_CONTRACT_HAS_OPEN_ITEMS
    http_status: 409
    applies_to: "POST /contracts/{id}/complete, POST /contracts/{id}/terminate"

  - priority: 13
    category: business_fiscal
    check: "Funding a milestone requires Client.wallet_balance_cents >= amount_cents"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /contracts/{id}/milestones/{milestoneId}/fund"

  - priority: 14
    category: state
    check: "OCC: expected_contract_version must equal current Contract.version on fund/release"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "milestone fund, milestone release"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Create a client account"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email]
    output: Client
    side_effects: ["status=ACTIVE, wallet_balance_cents=0"]

  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [PlatformAdmin, Client]
    code: 200
    input: ["email?"]
    output: "Client[]"
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [PlatformAdmin, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/wallet/deposit"
    description: "Top up client wallet (admin/finance operation)"
    roles: [PlatformAdmin, Client]
    code: 200
    input: [amount_cents]
    output: Client
    side_effects: ["wallet_balance_cents += amount_cents (amount_cents >= 1)"]

  - method: GET
    path: "/clients/{id}/job-postings"
    description: "List job postings owned by a client (FK reverse-reachability for JobPosting.client_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "JobPosting[]"
    side_effects: []

  - method: GET
    path: "/clients/{id}/contracts"
    description: "List contracts for a client (FK reverse-reachability for Contract.client_id)"
    roles: [PlatformAdmin, Client]
    code: 200
    input: []
    output: "Contract[]"
    side_effects: []

  # ---- Freelancers ----
  - method: POST
    path: "/freelancers"
    description: "Create a freelancer account"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email, skills, "tax_id_on_file?"]
    output: Freelancer
    side_effects: ["status=ACTIVE, lifetime fields 0, reputation_score=0"]

  - method: GET
    path: "/freelancers"
    description: "List freelancers"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: ["email?"]
    output: "Freelancer[]"
    side_effects: []

  - method: GET
    path: "/freelancers/{id}"
    description: "Get a freelancer (computed reputation, fee_tier, lifetime fields)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Freelancer
    side_effects: []

  - method: PATCH
    path: "/freelancers/{id}"
    description: "Update freelancer profile (skills, tax_id_on_file)"
    roles: [PlatformAdmin, Freelancer]
    code: 200
    input: ["skills?", "tax_id_on_file?"]
    output: Freelancer
    side_effects: ["if tax_id_on_file set true, prior HELD_NO_TAX_ID payouts become settle-eligible"]

  - method: GET
    path: "/freelancers/{id}/proposals"
    description: "List proposals submitted by a freelancer (FK reverse-reachability for Proposal.freelancer_id)"
    roles: [PlatformAdmin, Freelancer]
    code: 200
    input: []
    output: "Proposal[]"
    side_effects: []

  - method: GET
    path: "/freelancers/{id}/contracts"
    description: "List contracts for a freelancer (FK reverse-reachability for Contract.freelancer_id)"
    roles: [PlatformAdmin, Freelancer, Client]
    code: 200
    input: []
    output: "Contract[]"
    side_effects: []

  - method: GET
    path: "/freelancers/{id}/payouts"
    description: "List payouts for a freelancer (FK reverse-reachability for Payout.freelancer_id)"
    roles: [PlatformAdmin, Freelancer]
    code: 200
    input: ["tax_year?"]
    output: "Payout[]"
    side_effects: []

  - method: GET
    path: "/freelancers/{id}/tax-records"
    description: "List generated tax records for a freelancer (FK reverse-reachability for TaxRecord.freelancer_id)"
    roles: [PlatformAdmin, Freelancer]
    code: 200
    input: []
    output: "TaxRecord[]"
    side_effects: []

  # ---- Job Postings ----
  - method: POST
    path: "/job-postings"
    description: "Create a job posting"
    roles: [Client]
    code: 201
    input: [client_id, title, billing_type, budget_cents, required_skills]
    output: JobPosting
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/job-postings"
    description: "List job postings"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: ["client_id?", "status?"]
    output: "JobPosting[]"
    side_effects: []

  - method: GET
    path: "/job-postings/{id}"
    description: "Get a job posting"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: JobPosting
    side_effects: []

  - method: POST
    path: "/job-postings/{id}/cancel"
    description: "Cancel a posting; declines all live proposals (cascade)"
    roles: [Client]
    code: 200
    input: []
    output: JobPosting
    side_effects: ["status -> CANCELLED, live proposals -> DECLINED"]

  - method: GET
    path: "/job-postings/{id}/proposals"
    description: "List proposals for a posting (FK reverse-reachability for Proposal.job_posting_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "Proposal[]"
    side_effects: []

  - method: GET
    path: "/job-postings/{id}/ranked-proposals"
    description: "Server-ranked live proposals by job_match_score (computed read)"
    roles: [PlatformAdmin, Client]
    code: 200
    input: []
    output: "Proposal[]"
    side_effects: []

  # ---- Proposals ----
  - method: POST
    path: "/proposals"
    description: "Submit a proposal/bid on a posting"
    roles: [Freelancer]
    code: 201
    input: [job_posting_id, freelancer_id, bid_amount_cents, cover_letter]
    output: Proposal
    side_effects: ["status=SUBMITTED, last_actor=FREELANCER; first proposal moves posting OPEN -> UNDER_REVIEW"]

  - method: GET
    path: "/proposals/{id}"
    description: "Get a proposal"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: POST
    path: "/proposals/{id}/counter"
    description: "Counter-offer (alternating turns); cyclic negotiation"
    roles: [Client, Freelancer]
    code: 200
    input: [actor_role, bid_amount_cents]
    output: Proposal
    side_effects: ["status -> COUNTERED, bid_amount_cents updated, round_count++, last_actor flips"]

  - method: POST
    path: "/proposals/{id}/accept"
    description: "Accept the live offer; awards posting and creates DRAFT contract"
    roles: [Client, Freelancer]
    code: 200
    input: [actor_role]
    output: Proposal
    side_effects: ["status -> ACCEPTED, posting -> AWARDED, siblings -> DECLINED, Contract created (DRAFT)"]

  - method: POST
    path: "/proposals/{id}/decline"
    description: "Client declines a proposal"
    roles: [Client]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/proposals/{id}/withdraw"
    description: "Freelancer withdraws their proposal"
    roles: [Freelancer]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> WITHDRAWN"]

  # ---- Contracts ----
  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract (computed totals, open counts)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT contract with SOW text"
    roles: [Client]
    code: 200
    input: [sow_text, "hourly_cap_hours?"]
    output: Contract
    side_effects: ["status -> ACTIVE, posting -> CLOSED"]

  - method: POST
    path: "/contracts/{id}/complete"
    description: "Complete an ACTIVE contract with no open items"
    roles: [Client]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> COMPLETED, freelancer completed_contract_count++ , reputation recomputed"]

  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate a contract; cancels milestones and refunds escrow (cascade)"
    roles: [Client]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> TERMINATED, milestones -> CANCELLED, escrow refunded to wallet, reputation recomputed"]

  - method: GET
    path: "/contracts/{id}/milestones"
    description: "List milestones for a contract (FK reverse-reachability for Milestone.contract_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "Milestone[]"
    side_effects: []

  - method: GET
    path: "/contracts/{id}/timelogs"
    description: "List timelogs for a contract (FK reverse-reachability for TimeLog.contract_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: ["milestone_id?", "work_date?"]
    output: "TimeLog[]"
    side_effects: []

  - method: GET
    path: "/contracts/{id}/escrow-transactions"
    description: "List escrow ledger rows for a contract (FK reverse-reachability for EscrowTransaction.contract_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: ["milestone_id?"]
    output: "EscrowTransaction[]"
    side_effects: []

  - method: GET
    path: "/contracts/{id}/disputes"
    description: "List disputes for a contract (FK reverse-reachability for Dispute.contract_id)"
    roles: [PlatformAdmin, Client, Freelancer, Arbitrator]
    code: 200
    input: []
    output: "Dispute[]"
    side_effects: []

  - method: GET
    path: "/contracts/{id}/reviews"
    description: "List reviews for a contract (FK reverse-reachability for Review.contract_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "Review[]"
    side_effects: []

  # ---- Milestones ----
  - method: POST
    path: "/contracts/{id}/milestones"
    description: "Create a milestone under an ACTIVE contract (DRAFT)"
    roles: [Client]
    code: 201
    input: [title, amount_cents, ordinal]
    output: Milestone
    side_effects: ["status=DRAFT; FIXED uses amount_cents, HOURLY amount recomputed from VERIFIED timelogs"]

  - method: GET
    path: "/contracts/{id}/milestones/{milestoneId}"
    description: "Get a milestone"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: POST
    path: "/contracts/{id}/milestones/{milestoneId}/fund"
    description: "Fund escrow for a milestone (OCC on contract version)"
    roles: [Client]
    code: 200
    input: [expected_contract_version]
    output: Milestone
    side_effects: ["wallet debited, FUND escrow HELD, milestone -> FUNDED, Contract.version++"]

  - method: POST
    path: "/contracts/{id}/milestones/{milestoneId}/submit-work"
    description: "Freelancer submits the milestone deliverable"
    roles: [Freelancer]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/contracts/{id}/milestones/{milestoneId}/approve"
    description: "Client approves the submitted milestone (branch A)"
    roles: [Client]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/contracts/{id}/milestones/{milestoneId}/release"
    description: "Release escrow to freelancer; creates payout (OCC on contract version)"
    roles: [Client]
    code: 200
    input: [expected_contract_version]
    output: Milestone
    side_effects: ["RELEASE escrow SETTLED, milestone -> RELEASED, Payout created, Contract.version++"]

  - method: POST
    path: "/contracts/{id}/milestones/{milestoneId}/dispute"
    description: "Open a dispute on a submitted milestone (branch B)"
    roles: [Client, Freelancer]
    code: 201
    input: [raised_by, reason, claimed_release_cents]
    output: Dispute
    side_effects: ["milestone -> DISPUTED, Dispute created OPEN, Contract.open_dispute_count++"]

  # ---- TimeLogs ----
  - method: POST
    path: "/contracts/{id}/timelogs"
    description: "Log hourly work against an HOURLY milestone"
    roles: [Freelancer]
    code: 201
    input: [milestone_id, work_date, start_minute, end_minute, memo]
    output: TimeLog
    side_effects: ["status=LOGGED, billable_minutes computed; overlap and daily-cap checks applied"]

  - method: POST
    path: "/contracts/{id}/timelogs/{timelogId}/verify"
    description: "Client verifies a logged interval"
    roles: [Client]
    code: 200
    input: []
    output: TimeLog
    side_effects: ["status -> VERIFIED, milestone.amount_cents recomputed"]

  - method: POST
    path: "/contracts/{id}/timelogs/{timelogId}/reject"
    description: "Client rejects a logged interval"
    roles: [Client]
    code: 200
    input: []
    output: TimeLog
    side_effects: ["status -> REJECTED"]

  # ---- Disputes ----
  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [PlatformAdmin, Client, Freelancer, Arbitrator]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/disputes/{id}/assign-arbitration"
    description: "Arbitrator takes the dispute under arbitration"
    roles: [Arbitrator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_ARBITRATION"]

  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Arbitrator resolves with an award; drives milestone release/refund cascade"
    roles: [Arbitrator]
    code: 200
    input: [arbitrator_award_cents]
    output: Dispute
    side_effects: ["resolution set, milestone RELEASED or REFUNDED, escrow settled, reputation recomputed"]

  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Raiser withdraws an OPEN dispute; milestone returns to SUBMITTED"
    roles: [Client, Freelancer]
    code: 200
    input: [actor_role]
    output: Dispute
    side_effects: ["status -> WITHDRAWN, milestone -> SUBMITTED"]

  # ---- Payouts ----
  - method: GET
    path: "/payouts/{id}"
    description: "Get a payout (fee, net, status)"
    roles: [PlatformAdmin, Freelancer, Client]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: POST
    path: "/payouts/{id}/settle"
    description: "Settle a pending payout; gated on tax_id_on_file"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status -> PAID (lifetime_earnings += net) or HELD_NO_TAX_ID"]

  - method: GET
    path: "/milestones/{id}"
    description: "Get a milestone by its global id (registers the milestone collection for FK reverse-reachability)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/milestones/{id}/payouts"
    description: "List payouts for a milestone (FK reverse-reachability for Payout.milestone_id)"
    roles: [PlatformAdmin, Freelancer, Client]
    code: 200
    input: []
    output: "Payout[]"
    side_effects: []

  # ---- Milestone-scoped escrow / timelog reverse reachability ----
  - method: GET
    path: "/milestones/{id}/escrow-transactions"
    description: "List escrow rows for a milestone (FK reverse-reachability for EscrowTransaction.milestone_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "EscrowTransaction[]"
    side_effects: []

  - method: GET
    path: "/milestones/{id}/timelogs"
    description: "List timelogs for a milestone (FK reverse-reachability for TimeLog.milestone_id)"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: "TimeLog[]"
    side_effects: []

  - method: GET
    path: "/milestones/{id}/disputes"
    description: "List disputes for a milestone (FK reverse-reachability for Dispute.milestone_id)"
    roles: [PlatformAdmin, Client, Freelancer, Arbitrator]
    code: 200
    input: []
    output: "Dispute[]"
    side_effects: []

  # ---- Reviews ----
  - method: POST
    path: "/reviews"
    description: "Leave a review on a COMPLETED contract"
    roles: [Client, Freelancer]
    code: 201
    input: [contract_id, author_role, rating, comment]
    output: Review
    side_effects: ["if author_role=CLIENT, freelancer reputation recomputed"]

  - method: GET
    path: "/reviews/{id}"
    description: "Get a review"
    roles: [PlatformAdmin, Client, Freelancer]
    code: 200
    input: []
    output: Review
    side_effects: []

  # ---- Tax / 1099 ----
  - method: POST
    path: "/tax-records"
    description: "Generate a 1099 tax record for a freelancer-year (dual-basis aggregation)"
    roles: [PlatformAdmin]
    code: 201
    input: [freelancer_id, tax_year, "basis?"]
    output: TaxRecord
    side_effects: ["reportable_gross_cents and form_status computed from PAID payouts"]

  - method: GET
    path: "/tax-records/{id}"
    description: "Get a tax record"
    roles: [PlatformAdmin, Freelancer]
    code: 200
    input: []
    output: TaxRecord
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for operation, or entity_backed user does not own the resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, out-of-range amount/minute/rating" }

  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_FREELANCER_NOT_FOUND, http: 404, condition: "Freelancer id does not exist" }
  - { id: ERR_JOB_POSTING_NOT_FOUND, http: 404, condition: "JobPosting id does not exist" }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "Proposal id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id does not exist" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Milestone id does not exist" }
  - { id: ERR_TIMELOG_NOT_FOUND, http: 404, condition: "TimeLog id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout id does not exist" }
  - { id: ERR_TAX_RECORD_NOT_FOUND, http: 404, condition: "TaxRecord id does not exist" }

  - { id: ERR_SKILLS_NOT_COVERED, http: 422, condition: "Freelancer skills do not cover the posting's required_skills" }
  - { id: ERR_INVALID_PROPOSAL_STATE, http: 409, condition: "Proposal not in a state permitting the operation" }
  - { id: ERR_NOT_YOUR_TURN, http: 409, condition: "Counter/accept by the party who made the last live offer, or round cap reached" }
  - { id: ERR_INVALID_CONTRACT_STATE, http: 409, condition: "Contract not in a state permitting the operation" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires parent Contract in ACTIVE" }
  - { id: ERR_INVALID_MILESTONE_STATE, http: 409, condition: "Milestone not in a state permitting the operation" }
  - { id: ERR_NO_VERIFIED_TIMELOGS, http: 409, condition: "HOURLY milestone has zero VERIFIED timelogs; cannot submit (zero-set boundary)" }
  - { id: ERR_INVALID_TIMELOG_STATE, http: 409, condition: "TimeLog not in LOGGED state for verify/reject" }
  - { id: ERR_TIMELOG_OVERLAP, http: 409, condition: "New interval overlaps an existing LOGGED/VERIFIED interval on the same milestone+date" }
  - { id: ERR_DAILY_HOURS_CAP_EXCEEDED, http: 409, condition: "Freelancer daily aggregate minutes would exceed GLOBAL_DAILY_MINUTE_CAP (720)" }
  - { id: ERR_INVALID_DISPUTE_STATE, http: 409, condition: "Dispute not in a state permitting the operation" }
  - { id: ERR_AWARD_OUT_OF_RANGE, http: 422, condition: "arbitrator_award_cents outside [0, milestone.funded_cents]" }
  - { id: ERR_CONTRACT_HAS_OPEN_ITEMS, http: 409, condition: "Complete/terminate blocked by open milestones or open disputes" }
  - { id: ERR_INVALID_PAYOUT_STATE, http: 409, condition: "Payout not in a settle-eligible state" }
  - { id: ERR_REVIEW_CONTRACT_NOT_COMPLETED, http: 409, condition: "Review target contract is not COMPLETED" }

  - { id: ERR_INSUFFICIENT_WALLET, http: 402, condition: "Client wallet balance below milestone funding amount" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match current Contract.version (OCC)" }
  - { id: ERR_DUPLICATE_MILESTONE_ORDINAL, http: 409, condition: "Milestone ordinal already used within the contract" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Client
    description: "Buyer of work; owns postings, contracts, funds escrow, approves/releases milestones"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /job-postings — create posting"
      - "POST /job-postings/{id}/cancel — cancel posting"
      - "POST /proposals/{id}/decline — decline a proposal"
      - "POST /contracts/{id}/activate — activate contract"
      - "POST /contracts/{id}/complete — complete contract"
      - "POST /contracts/{id}/terminate — terminate contract"
      - "POST /contracts/{id}/milestones — create milestone"
      - "POST /contracts/{id}/milestones/{mid}/fund — fund escrow"
      - "POST /contracts/{id}/milestones/{mid}/approve — approve milestone"
      - "POST /contracts/{id}/milestones/{mid}/release — release escrow"
      - "POST /contracts/{id}/timelogs/{tid}/verify — verify timelog"
      - "POST /contracts/{id}/timelogs/{tid}/reject — reject timelog"
    shared_operations:
      - "POST /clients/{id}/wallet/deposit — deposit (shared with PlatformAdmin)"
      - "POST /proposals/{id}/counter — counter (shared with Freelancer)"
      - "POST /proposals/{id}/accept — accept (shared with Freelancer)"
      - "POST /contracts/{id}/milestones/{mid}/dispute — dispute (shared with Freelancer)"
      - "POST /disputes/{id}/withdraw — withdraw (shared with Freelancer)"
      - "POST /reviews — review (shared with Freelancer)"
      - "GET reads across own clients/contracts/postings/milestones/disputes/payouts/reviews"

  - name: Freelancer
    description: "Seller of work; submits proposals, logs hours, submits milestones, receives payouts"
    identity: "entity_backed:Freelancer"
    exclusive_operations:
      - "POST /proposals — submit proposal"
      - "POST /proposals/{id}/withdraw — withdraw proposal"
      - "PATCH /freelancers/{id} — update own profile"
      - "POST /contracts/{id}/milestones/{mid}/submit-work — submit milestone work"
      - "POST /contracts/{id}/timelogs — log hours"
    shared_operations:
      - "POST /proposals/{id}/counter — counter (shared with Client)"
      - "POST /proposals/{id}/accept — accept (shared with Client)"
      - "POST /contracts/{id}/milestones/{mid}/dispute — dispute (shared with Client)"
      - "POST /disputes/{id}/withdraw — withdraw (shared with Client)"
      - "POST /reviews — review (shared with Client)"
      - "GET reads across own proposals/contracts/payouts/tax-records/timelogs"

  - name: Arbitrator
    description: "Neutral third party who arbitrates disputes; cannot fund, release, or transact"
    identity: "opaque"
    exclusive_operations:
      - "POST /disputes/{id}/assign-arbitration — take dispute"
      - "POST /disputes/{id}/resolve — resolve with award"
    shared_operations:
      - "GET /disputes/{id} and dispute lists"

  - name: PlatformAdmin
    description: "Operator; provisions accounts, settles payouts, runs tax sweeps, advances clock-like sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /freelancers — create freelancer"
      - "POST /payouts/{id}/settle — settle payout"
      - "POST /tax-records — generate 1099"
    shared_operations:
      - "POST /clients/{id}/wallet/deposit — deposit (shared with Client)"
      - "GET reads across all resources"
