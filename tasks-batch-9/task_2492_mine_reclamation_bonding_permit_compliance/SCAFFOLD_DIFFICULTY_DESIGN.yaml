# =============================================================================
# task_2492 — Mine Reclamation Bonding & Permit Compliance
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances.
# Every literal below was computed against the §1.3 formulas and their
# constants with Decimal / ROUND_HALF_UP.
# The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bond_required_full_plan_vs_incremental_variant_divergence
        grounds:
          - calculations.bond_required_amount
          - entities.Permit.fields.bond_basis
          - entities.Permit.fields.bond_required_amount
          - entities.Permit.fields.reclaimed_acres_credited
          - concurrency_rules[bond-recalculation-stale-permit]
        distinguishing_aspect: |
          This dual variant lives in the Permit cost-accounting domain: the same
          ACCEPTED estimate priced under FULL_PLAN (whole mining plan, 120 acres)
          yields 865998.00 while under INCREMENTAL (disturbed minus reclaimed, 45
          acres) it yields 324749.25 — a 541248.75 divergence on the identical
          input row.
        test_recipe:
          setup:
            - "One operator, one mine site, one permit for 120 planned acres."
            - "A single ReclamationCostEstimate at 6000.00 per acre, effective 2026-07-01, ACCEPTED (escalation_years 0 against the default clock)."
            - "A 900000.00 CASH instrument ACCEPTED, permit ISSUED, disturbance reported as 120 disturbed / 75 reclaimed acres."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Ridgeback Aggregates LLC", tangible_net_worth: 40000000.00, fixed_assets_in_state: 25000000.00, total_liabilities: 8000000.00, net_income_prior_year: 5000000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Elk Hollow Pit", county: "Carbon", total_acres: 400.00 }
              as: ProgramDirector
              captures: { site_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site_id}", operator_id: "${op_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { est_id: $.data.id }
            - call: "GET /mining/permits/${permit_id}"
              as: PermitReviewer
              captures: { pv1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est_id}/accept"
              payload: { expected_permit_version: "${pv1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { inst_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${permit_id}/disturbance"
              payload: { disturbed_acres: 120.00, reclaimed_acres_credited: 75.00 }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "GET /mining/permits/${permit_id}"
              as: BondSpecialist
              captures: { pv2: $.data.version }
            - call: "POST /mining/permits/${permit_id}/recalculate-bond"
              payload: { basis: "INCREMENTAL", expected_permit_version: "${pv2}" }
              as: BondSpecialist
              as_user_id: "bs-001"
          assert:
            - "The trigger's GET shows Permit.${permit_id}.bond_basis == FULL_PLAN and Permit.${permit_id}.bond_required_amount == 865998.00"
            - "After recalculate-bond, Permit.${permit_id}.bond_basis == INCREMENTAL"
            - "Permit.${permit_id}.bond_required_amount == 324749.25"
            - "The FULL_PLAN minus INCREMENTAL divergence equals 541248.75"
            - "Permit.${permit_id}.bond_held_amount == 900000.00 and Permit.${permit_id}.bond_deficiency_amount == 0.00"
            - "Permit.${permit_id}.compliance_posture == COMPLIANT"

      - name: self_bond_capacity_net_worth_vs_fixed_asset_variant_divergence
        grounds:
          - calculations.operator_self_bond_capacity
          - entities.Operator.fields.elected_financial_test
          - entities.Operator.fields.self_bond_capacity_amount
          - state_machines.Operator.self_bond_status.QUALIFIED_to_UNTESTED
        distinguishing_aspect: |
          This dual variant lives in the Operator financial-risk domain — a
          different entity domain from the Permit bond-costing variant: one
          operator row with TNW 24000000.00 and in-state fixed assets
          30000000.00 qualifies under both tests but yields capacity 6000000.00
          under NET_WORTH_TEST versus 3000000.00 under FIXED_ASSET_TEST.
        test_recipe:
          setup:
            - "One operator with tangible_net_worth 24000000.00, fixed_assets_in_state 30000000.00, total_liabilities 9600000.00 (leverage threshold exactly 24000000.00), net_income_prior_year 3000000.00."
            - "elected_financial_test is NET_WORTH_TEST at creation."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Two Rivers Mining Co", tangible_net_worth: 24000000.00, fixed_assets_in_state: 30000000.00, total_liabilities: 9600000.00, net_income_prior_year: 3000000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op2_id: $.data.id }
          trigger:
            - call: "POST /mining/operators/${op2_id}/financial-test"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "PATCH /mining/operators/${op2_id}/financials"
              payload: { elected_financial_test: "FIXED_ASSET_TEST" }
              as: ProgramDirector
            - call: "POST /mining/operators/${op2_id}/financial-test"
              as: BondSpecialist
              as_user_id: "bs-001"
          assert:
            - "After the first financial-test, Operator.${op2_id}.self_bond_status == QUALIFIED and Operator.${op2_id}.self_bond_capacity_amount == 6000000.00"
            - "After the PATCH, Operator.${op2_id}.self_bond_status == UNTESTED and Operator.${op2_id}.self_bond_capacity_amount == 0.00"
            - "After the second financial-test, Operator.${op2_id}.self_bond_status == QUALIFIED and Operator.${op2_id}.self_bond_capacity_amount == 3000000.00"
            - "The NET_WORTH_TEST minus FIXED_ASSET_TEST divergence equals 3000000.00 on identical financial inputs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bond_required_rounding_order_pinned_per_acre_before_multiply
        grounds:
          - calculations.bond_required_amount
          - entities.ReclamationCostEstimate.fields.direct_cost_per_acre
          - entities.Permit.fields.bond_required_amount
        distinguishing_aspect: |
          Mode (b), nested rounding whose order changes the cents: with
          direct_cost_per_acre 6133.33 over 120 acres the pinned order (round
          per_acre_loaded to 7268.00 first, then multiply) yields 885242.40,
          whereas deferring the rounding to the subtotal yields 885241.92 — a
          0.48 spread the test pins to the normative order.
        test_recipe:
          setup:
            - "One operator, one mine site, one permit for 120 planned acres."
            - "An estimate at 6133.33 per acre effective 2026-07-01 (escalation_years 0 against the default clock), still SUBMITTED."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Cedar Gap Coal Inc", tangible_net_worth: 15000000.00, fixed_assets_in_state: 9000000.00, total_liabilities: 5000000.00, net_income_prior_year: 1200000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op3_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Cedar Gap No. 4", county: "Fayette", total_acres: 320.00 }
              as: ProgramDirector
              captures: { site3_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site3_id}", operator_id: "${op3_id}", mining_plan_acres: 120.00, post_mining_land_use: "FORESTLAND", proposed_start_date: "2026-09-15" }
              as: Operator
              as_user_id: "${op3_id}"
              captures: { permit3_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit3_id}", estimator_firm: "Bluestone Estimating Group", estimator_license_no: "RE-5502", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6133.33 }
              as: Operator
              as_user_id: "${op3_id}"
              captures: { est3_id: $.data.id }
            - call: "GET /mining/permits/${permit3_id}"
              as: PermitReviewer
              captures: { p3v1: $.data.version }
          trigger:
            - call: "POST /mining/reclamation-cost-estimates/${est3_id}/accept"
              payload: { expected_permit_version: "${p3v1}" }
              as: PermitReviewer
          assert:
            - "ReclamationCostEstimate.${est3_id}.status == ACCEPTED"
            - "Permit.${permit3_id}.bond_required_amount == 885242.40"
            - "Permit.${permit3_id}.bond_required_amount != 885241.92"
            - "Permit.${permit3_id}.bond_deficiency_amount == 885242.40 (nothing has been posted yet)"
            - "Permit.${permit3_id}.compliance_posture == BOND_DEFICIENT"

      - name: penalty_credit_cap_and_imminent_harm_surcharge_interaction
        grounds:
          - calculations.penalty_assessment_amount
          - calculations.violation_history_points
          - entities.ViolationNotice.fields.penalty_amount
          - state_machines.ViolationNotice.penalty_status.NONE_to_ASSESSED
        distinguishing_aspect: |
          Mode (a), a four-input non-linear formula whose two bands are keyed on
          different intermediates: the good-faith credit cap is keyed on base
          (5100.00 -> cap 1500.00, clipping the 1530.00 raw credit) while the
          imminent-harm surcharge is keyed on the post-credit subtotal (3600.00 ->
          0.10), producing 3960.00 rather than the 4500.00 a base-keyed surcharge
          would give.
        test_recipe:
          setup:
            - "An issued permit with an inspector profile and a COMPLETED, FAIL routine inspection."
            - "A ViolationNotice with severity 30 / negligence 30 / duration 25 points, no prior notices, violation_class IMMINENT_HARM — total_points 85."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Slate Creek Minerals", tangible_net_worth: 18000000.00, fixed_assets_in_state: 12000000.00, total_liabilities: 6000000.00, net_income_prior_year: 900000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op4_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Slate Creek Surface Mine", county: "Boone", total_acres: 500.00 }
              as: ProgramDirector
              captures: { site4_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site4_id}", operator_id: "${op4_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op4_id}"
              captures: { permit4_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit4_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op4_id}"
              captures: { est4_id: $.data.id }
            - call: "GET /mining/permits/${permit4_id}"
              as: PermitReviewer
              captures: { p4v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est4_id}/accept"
              payload: { expected_permit_version: "${p4v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit4_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op4_id}"
              captures: { inst4_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst4_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit4_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Dana Whitlock", certification_level: "CERT_III", region: "SOUTH" }
              as: ProgramDirector
              captures: { insp4_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${permit4_id}", inspector_id: "${insp4_id}", inspection_type: "ROUTINE", scheduled_start: "2026-08-10T09:00:00Z", duration_hours: 4 }
              as: ProgramDirector
              captures: { ins4_id: $.data.id }
            - call: "POST /mining/inspections/${ins4_id}/record-result"
              payload: { result: "VIOLATIONS_FOUND", findings_note: "Sediment pond embankment breached; discharge to Slate Creek." }
              as: Inspector
              as_user_id: "${insp4_id}"
            - call: "POST /mining/violation-notices"
              payload: { inspection_id: "${ins4_id}", violation_class: "IMMINENT_HARM", severity_points: 30, negligence_points: 30, duration_points: 25, abatement_days: 15 }
              as: Inspector
              as_user_id: "${insp4_id}"
              captures: { vn4_id: $.data.id }
          trigger:
            - call: "POST /mining/violation-notices/${vn4_id}/assess-penalty"
              payload: { good_faith_level: "RAPID" }
              as: ProgramDirector
          assert:
            - "ViolationNotice.${vn4_id}.history_points == 0 and ViolationNotice.${vn4_id}.total_points == 85"
            - "ViolationNotice.${vn4_id}.penalty_status == ASSESSED"
            - "ViolationNotice.${vn4_id}.penalty_amount == 3960.00"
            - "ViolationNotice.${vn4_id}.penalty_amount != 4500.00 (the value a base-keyed surcharge band would produce)"
            - "Operator.${op4_id}.outstanding_penalty_balance == 3960.00"
            - "Operator.${op4_id}.violation_points_total == 85"
            - "Permit.${permit4_id}.compliance_posture == NOTICE_ACTIVE and Permit.${permit4_id}.status == ISSUED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_status_and_compliance_posture_advance_independently
        grounds:
          - state_machines.Permit.status.ISSUED_to_RECLAMATION_PHASE
          - state_machines.Permit.compliance_posture.COMPLIANT_to_NOTICE_ACTIVE
          - entities.Permit.fields.compliance_posture
          - calculations.permit_compliance_posture
        distinguishing_aspect: |
          Non-linearity by parallel state dimensions on the Permit entity: a
          violation notice moves compliance_posture COMPLIANT -> NOTICE_ACTIVE
          while status stays ISSUED, and a later cease-mining moves status
          ISSUED -> RECLAMATION_PHASE while compliance_posture stays
          NOTICE_ACTIVE — neither dimension constrains the other's value.
        test_recipe:
          setup:
            - "An ISSUED permit with 120 disturbed acres, a bonded 900000.00 CASH instrument and compliance_posture COMPLIANT."
            - "An inspector profile plus a COMPLETED, FAIL routine inspection ready to carry a notice."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Winterhawk Sand & Gravel", tangible_net_worth: 16000000.00, fixed_assets_in_state: 8000000.00, total_liabilities: 5000000.00, net_income_prior_year: 700000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op5_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Winterhawk Bar", county: "Grand", total_acres: 260.00 }
              as: ProgramDirector
              captures: { site5_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site5_id}", operator_id: "${op5_id}", mining_plan_acres: 120.00, post_mining_land_use: "WILDLIFE_HABITAT", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op5_id}"
              captures: { permit5_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit5_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op5_id}"
              captures: { est5_id: $.data.id }
            - call: "GET /mining/permits/${permit5_id}"
              as: PermitReviewer
              captures: { p5v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est5_id}/accept"
              payload: { expected_permit_version: "${p5v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit5_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op5_id}"
              captures: { inst5_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst5_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit5_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${permit5_id}/disturbance"
              payload: { disturbed_acres: 120.00 }
              as: Operator
              as_user_id: "${op5_id}"
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Marta Ocasio", certification_level: "CERT_II", region: "WEST" }
              as: ProgramDirector
              captures: { insp5_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${permit5_id}", inspector_id: "${insp5_id}", inspection_type: "ROUTINE", scheduled_start: "2026-08-12T08:00:00Z", duration_hours: 3 }
              as: ProgramDirector
              captures: { ins5_id: $.data.id }
            - call: "POST /mining/inspections/${ins5_id}/record-result"
              payload: { result: "VIOLATIONS_FOUND", findings_note: "Topsoil stockpile not stabilized." }
              as: Inspector
              as_user_id: "${insp5_id}"
          trigger:
            - call: "POST /mining/violation-notices"
              payload: { inspection_id: "${ins5_id}", violation_class: "NON_COMPLIANCE", severity_points: 20, negligence_points: 15, duration_points: 10, abatement_days: 30 }
              as: Inspector
              as_user_id: "${insp5_id}"
              captures: { vn5_id: $.data.id }
            - call: "POST /mining/permits/${permit5_id}/cease-mining"
              as: Operator
              as_user_id: "${op5_id}"
          assert:
            - "ViolationNotice.${vn5_id}.total_points == 45 and ViolationNotice.${vn5_id}.notice_status == ISSUED"
            - "Immediately after the notice, Permit.${permit5_id}.compliance_posture == NOTICE_ACTIVE and Permit.${permit5_id}.status == ISSUED"
            - "After cease-mining, Permit.${permit5_id}.status == RECLAMATION_PHASE"
            - "After cease-mining, Permit.${permit5_id}.compliance_posture is still NOTICE_ACTIVE"
            - "Permit.${permit5_id}.bond_held_amount == 900000.00 across both transitions"

      - name: permit_revision_info_request_cycle_bounded_by_round_cap
        grounds:
          - state_machines.PermitRevision.SUBMITTED_to_INFO_REQUESTED
          - state_machines.PermitRevision.INFO_REQUESTED_to_SUBMITTED
          - entities.PermitRevision.fields.round_count
          - validations[priority=13]
          - errors[ERR_REVISION_ROUND_LIMIT]
        distinguishing_aspect: |
          Non-linearity by cycle on the PermitRevision entity — a different
          entity from the Permit parallel-dimension instance: SUBMITTED ->
          INFO_REQUESTED -> SUBMITTED runs twice, incrementing round_count to 2,
          and the third resubmit is refused with ERR_REVISION_ROUND_LIMIT rather
          than looping forever.
        test_recipe:
          setup:
            - "An ISSUED permit in COMPLIANT posture."
            - "A SEQUENCE_CHANGE revision submitted against it, round_count 0."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Blackrock Quarry Partners", tangible_net_worth: 14000000.00, fixed_assets_in_state: 7000000.00, total_liabilities: 5000000.00, net_income_prior_year: 600000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { op6_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Blackrock North Bench", county: "Lincoln", total_acres: 240.00 }
              as: ProgramDirector
              captures: { site6_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${site6_id}", operator_id: "${op6_id}", mining_plan_acres: 120.00, post_mining_land_use: "INDUSTRIAL", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${op6_id}"
              captures: { permit6_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${permit6_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${op6_id}"
              captures: { est6_id: $.data.id }
            - call: "GET /mining/permits/${permit6_id}"
              as: PermitReviewer
              captures: { p6v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est6_id}/accept"
              payload: { expected_permit_version: "${p6v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${permit6_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${op6_id}"
              captures: { inst6_id: $.data.id }
            - call: "POST /mining/bond-instruments/${inst6_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit6_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "POST /mining/permit-revisions"
              payload: { permit_id: "${permit6_id}", revision_type: "SEQUENCE_CHANGE", sequence_note: "Advance the west highwall cut ahead of the east bench." }
              as: Operator
              as_user_id: "${op6_id}"
              captures: { rev6_id: $.data.id }
          trigger:
            - call: "POST /mining/permit-revisions/${rev6_id}/request-info"
              payload: { info_request_note: "Provide the revised pit sequencing map." }
              as: PermitReviewer
            - call: "POST /mining/permit-revisions/${rev6_id}/resubmit"
              payload: { response_note: "Sequencing map attached, revision A." }
              as: Operator
              as_user_id: "${op6_id}"
            - call: "POST /mining/permit-revisions/${rev6_id}/request-info"
              payload: { info_request_note: "Map lacks the drainage overlay." }
              as: PermitReviewer
            - call: "POST /mining/permit-revisions/${rev6_id}/resubmit"
              payload: { response_note: "Drainage overlay added, revision B." }
              as: Operator
              as_user_id: "${op6_id}"
            - call: "POST /mining/permit-revisions/${rev6_id}/request-info"
              payload: { info_request_note: "Overlay scale is wrong." }
              as: PermitReviewer
            - call: "POST /mining/permit-revisions/${rev6_id}/resubmit"
              payload: { response_note: "Third attempt, revision C." }
              as: Operator
              as_user_id: "${op6_id}"
