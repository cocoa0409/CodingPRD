            - "${err_re_decision} == ERR_FORBIDDEN_ROLE with HTTP 403 and no ClosureNotice or decision row exists afterwards"
            - "${read_status} == DRAFT and ${read_v} == ${case_v1} — RealEstateManager keeps the shared read while losing the write"
            - "${submitted_status} == SUBMITTED — the same body from the owning role succeeds, proving the three refusals were role-driven and left no state behind"

      - name: a_second_strategist_cannot_submit_another_authors_case
