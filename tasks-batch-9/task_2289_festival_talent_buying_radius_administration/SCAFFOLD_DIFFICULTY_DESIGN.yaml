          setup:
            - "Harbor Lights fixture with one accepted booking for a draw-72 ELECTRONIC act, whose clause carries radius_miles 150 and window 2026-10-05 to 2027-01-04 with exclusivity_scope FULL, and is therefore ACTIVE."
