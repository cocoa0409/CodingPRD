              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_ota: $.data.id }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-OPT", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp_opt: $.data.id }
            - call: "POST /fee-programs/${fp_opt}/fees"
              payload: { code: "SPA_CREDIT", label: "Optional spa credit", classification: "OPTIONAL", basis: "PER_STAY", amount_cents: 5000, avoidable: true, disclosure_text: "Optional spa credit, added only when the guest asks for it." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_spa: $.data.id }
            - call: "POST /fee-programs/${fp_opt}/submit-review"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
          trigger:
            - call: "POST /fee-programs/${fp_opt}/publish"
              payload: { attestation_note: "Optional-only program; there is no mandatory fee to disclose." }
              as: ComplianceOfficer
