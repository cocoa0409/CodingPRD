  - rule_id: transitive_cascade
    instances:
      - name: energize_cascade_depth_five_density_capped_blocks_neighbour_circuit
        grounds:
          - state_machines.PowerCircuit.APPROVED_to_ENERGIZED
          - state_machines.Cabinet.INSTALLED_to_ACTIVE
          - state_machines.Cabinet.RESERVED_to_CAPACITY_HELD
          - state_machines.PowerCircuit.DESIGNED_to_BLOCKED
          - calculations.row_capacity_and_posture
          - calculations.contract_provisioning_rollup
        distinguishing_aspect: |
          A single energize call propagates five hops deep and ACROSS an aggregate boundary:
          circuit → its own cabinet (INSTALLED→ACTIVE) → the row (allocated 17.280 >= density
          ceiling 16.000, so row_status flips DENSITY_CAPPED) → a DIFFERENT cabinet in the row
          (RESERVED→CAPACITY_HELD) → that neighbour's untouched DESIGNED circuit
          (DESIGNED→BLOCKED). The 10 percent rejection tolerance (17.600) is what lets the
          capped posture be reached instead of a 422.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row H8/R1: design_density_kw_per_cabinet 8.0, max_row_power_kw 200.0, cooling_capacity_kw 60.0."
            - "Contract ACTIVE, committed_cabinet_count 2, power_commit_kw 20.0, redundancy_requirement N."
            - "Cabinet C01 rated 18.0 kW INSTALLED on the contract, carrying one APPROVED 90A/240V/SINGLE PRIMARY circuit (derated 17.280)."
            - "Cabinet C02 rated 10.0 kW RESERVED on the same contract in the same row, carrying one DESIGNED 25A/240V/SINGLE PRIMARY circuit that is never approved."
            - "With 2 occupied slots the row's density_ceiling_kw is 16.000 and its rejection ceiling is 17.600, so 17.280 is admitted but caps the row."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Bramble Compute", account_code: "BRM" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H8", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 8.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9008", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 18.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 10.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab1_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 90, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir1_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab2_id}", circuit_code: "A-2", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 25, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir2_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir1_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
