  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    rule_summary: >-
      None of the six machines is a straight line. SM3 re-enters ACCEPTED after a
      detour through AUDIT_ADJUSTED and must NOT repeat the side effects of its
      first arrival. SM4 forks out of FIELDWORK into two terminal-ish branches
      whose admissibility is decided by child data rather than by the caller.
      SM1 and SM2 are two independent dimensions on one CarriageAgreement row,
      coupled in exactly one direction.
    instances:

      - instance_id: NL-1
        name: accepted_report_reenters_accepted_after_audit_adjustment
        grounds:
          - state_machines.SubscriberReport.ACCEPTED_to_AUDIT_ADJUSTED
          - state_machines.SubscriberReport.AUDIT_ADJUSTED_to_ACCEPTED
          - entities.SubscriberReport.fields.audit_adjustment_cents
          - entities.CarriageAgreement.fields.consecutive_compliant_periods
        title: "SM3 — ACCEPTED -> AUDIT_ADJUSTED -> ACCEPTED re-entry must not re-run the compliance side effects"
        state_machine: "SubscriberReport.status (SM3)"
        rationale: >-
          A report reaches ACCEPTED twice. The first arrival stamps the FINAL fee
          and drives agreement_penetration_compliance, moving revenue and the
          compliance counters. The second arrival — after an audit adjustment has
          been accepted — is a settlement acknowledgement only: the same target
          state, but a strictly smaller side-effect set. Any implementation that
          hangs the compliance cascade off "entered ACCEPTED" rather than off the
          SUBMITTED -> ACCEPTED edge double-counts the compliant period and
          double-counts revenue.
        distinguishing_aspect: >-
          After the cycle completes, consecutive_compliant_periods == 1 (NOT 2)
          and recognized_revenue_cents == 5200000 (NOT 10400000), while
          audit_adjustment_cents == 400000 survives the transition back to
          ACCEPTED. The report's license_fee_due_cents is unchanged at 5200000 —
          the adjustment lives on its own field and is never folded into the
          licence fee.
        test_recipe:
          setup: >-
            The Cliffside Telco fixture of CF-2 (flat 40.0000, BASIC, 50%
            penetration floor, 200,000 subscribers) with 2026-06 reported at
            130,000 and accepted: 65.00% penetration is compliant, so the first
            arrival at ACCEPTED sets penetration_compliance_status COMPLIANT,
            consecutive_compliant_periods 1, penetration_breach_count 0 and
            recognized_revenue_cents 5,200,000. An audit over 2026-06 then finds
            140,000 actual subscribers — a 10,000 variance, 7.69% of reported,
            which lands in the 1.10 penalty tier and shifts the 2,500,000-cent
            audit cost. Issuing findings flips the report to AUDIT_ADJUSTED with
            audit_adjustment_cents = round_half_up(10,000 * 40.0000 * 1.00, 0) =
            400,000.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_id: "id"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep4_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep4_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/agreements/${a4_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                a4_compliant_run_1: "consecutive_compliant_periods"
                a4_revenue_1: "recognized_revenue_cents"
            - call: "POST /carriage/audit-engagements"
              payload:
                agreement_id: "${a4_id}"
                sample_period_start: "2026-06"
                sample_period_end: "2026-06"
                rate_basis: "PERIOD_RATE"
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                eng4_id: "id"
            - call: "POST /carriage/audit-engagements/${eng4_id}/lifecycle"
              payload:
                action: "START_FIELDWORK"
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "POST /carriage/audit-engagements/${eng4_id}/findings"
              payload:
                subscriber_report_id: "${rep4_id}"
                audited_subscribers: 140000
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "POST /carriage/audit-engagements/${eng4_id}/lifecycle"
              payload:
                action: "ISSUE_FINDINGS"
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                eng4_recovery: "recovery_amount_cents"
            - call: "GET /carriage/subscriber-reports/${rep4_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                rep4_status_mid: "status"
                rep4_adjustment: "audit_adjustment_cents"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep4_id}/review"
            payload:
              action: "ACCEPT_ADJUSTMENT"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "the captured a4_compliant_run_1 equals 1 and a4_revenue_1 equals 5200000"
            - "the captured rep4_status_mid equals \"AUDIT_ADJUSTED\", rep4_adjustment equals 400000 and eng4_recovery equals 2943300"
            - "response body status == \"ACCEPTED\" (the second arrival at the same state)"
            - "response body license_fee_due_cents == 5200000 (unchanged by the round trip)"
            - "response body audit_adjustment_cents == 400000 (retained, not cleared)"
            - "response body billable_subscribers == 130000"
            - "GET /carriage/agreements/${a4_id} returns consecutive_compliant_periods == 1, NOT 2"
            - "GET /carriage/agreements/${a4_id} returns penetration_breach_count == 0"
            - "GET /carriage/agreements/${a4_id} returns recognized_revenue_cents == 5200000, NOT 10400000"
            - "GET /carriage/agreements/${a4_id} returns lifecycle_status == \"EXECUTED\""

      - instance_id: NL-2
        name: audit_fieldwork_forks_on_presence_of_findings
        grounds:
          - state_machines.AuditEngagement.FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.AuditEngagement.FIELDWORK_to_CLOSED_NO_FINDING
          - errors[ERR_FINDINGS_PRESENT_CANNOT_CLOSE]
          - errors[ERR_NO_AUDIT_FINDINGS]
        title: "SM4 — the FIELDWORK fork is decided by child findings, and each branch forbids the other's exit"
        state_machine: "AuditEngagement.status (SM4)"
        rationale: >-
          Out of FIELDWORK an engagement may go to FINDINGS_ISSUED (opening a
          recovery chain that touches four other entities) or to
          CLOSED_NO_FINDING (a dead end that touches nothing). Which exits are
          admissible is not a property of the request: it is a property of the
          AuditFinding rows already attached. An engagement holding a
          positive-variance finding cannot close clean, and an engagement holding
          only a zero-variance finding cannot issue. The fork therefore has to be
          evaluated against child data on every lifecycle call.
        distinguishing_aspect: >-
          On the SAME action=CLOSE_NO_FINDING request, an engagement whose single
          finding has variance_subscribers == 10000 answers 409
          ERR_FINDINGS_PRESENT_CANNOT_CLOSE, while a sibling engagement whose
          single finding has variance_subscribers == 0 answers 200 with status
          CLOSED_NO_FINDING and every recovery field zeroed. Mirrored: the second
          engagement answers 422 ERR_NO_AUDIT_FINDINGS to action=ISSUE_FINDINGS.
        test_recipe:
          setup: >-
            Cliffside Telco with two accepted months on the same agreement:
            2026-05 at 120,000 subscribers and 2026-06 at 130,000, both above the
            50% floor. Two engagements are opened, one per month, both under
            PERIOD_RATE, and both reach FIELDWORK. The 2026-06 engagement records
            a finding of 140,000 audited against 130,000 reported — a 10,000
            variance. The 2026-05 engagement records a finding of exactly 120,000
            audited against 120,000 reported — a clean month, variance 0.
          setup_api_calls:
            - call: "POST /carriage/distributors"
