# =============================================================================
# task_0019_edu_live_stream — Scaffold Difficulty Design (§1.8)
# Test Targeting Index cross-referencing §1.1–§1.7 of SCAFFOLD.yaml
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_provisional_vs_final_diverges_on_progress_growth
        grounds:
          - calculations.refund_provisional
          - calculations.refund_final
          - state_machines.RefundRequest.PENDING_to_APPROVED
          - entities.RefundRequest.fields.provisional_amount_cents
          - entities.RefundRequest.fields.final_amount_cents
        distinguishing_aspect: |
          Operates on the RefundRequest/Enrollment monetary domain. The provisional
          variant snapshots progress and attendance at requested_at; the final
          variant re-snapshots both at approval_ts. This is a different entity
          domain from the chapter-completion vs watch-duration dual-variant pair,
          which sits on the Enrollment learning-progress domain (no money, no
          time-window tier table).
        test_recipe:
          setup:
            - "Course PUBLISHED with list_price_cents=100000, discount_percent=0, two required chapters of 1000 video_duration_seconds each."
            - "Student enrolled at clock now_ts=T0 → Enrollment.paid_amount_cents=100000."
            - "Advance clock by 10 days; create 4 Attendance rows mark=ATTENDED for the enrollment; create 1 WatchSession of 500s on chapter 1 (chapter_completion=0%, watch_duration=25.0%, progress_percent=25.0)."
            - "POST refund-request with materials_kit_count=1 → provisional_amount_cents computed."
            - "Advance clock by 2 days (total elapsed = 12d); create 1 more Attendance row mark=ATTENDED (5 total) and 1 more WatchSession of 100s on chapter 1 (watch_duration=30.0%, progress_percent=30.0)."
          trigger:
            - "POST /refund-requests/{refundRequestId}/approve"
          assert:
            - "RefundRequest.provisional_amount_cents == 59000"   # 70000 - 5000(kits) - 6000(4*1500) = 59000
            - "RefundRequest.final_amount_cents == 57500"         # 70000 - 5000 - 7500(5*1500) = 57500
            - "RefundRequest.final_amount_cents != RefundRequest.provisional_amount_cents"
            - "Enrollment.refund_amount_cents == 57500"

      - name: chapter_completion_vs_watch_duration_diverges_on_partial_views
        grounds:
          - calculations.chapter_completion_percent
          - calculations.watch_duration_percent
          - entities.Enrollment.fields.chapter_completion_percent
          - entities.Enrollment.fields.watch_duration_percent
          - entities.Enrollment.fields.progress_percent
        distinguishing_aspect: |
          Operates on the Enrollment learning-progress domain — no money, no time
          window. Chapter-completion treats each chapter as binary (full duration
          or zero); watch-duration treats it continuously. Identical WatchSession
          inputs produce different numbers, distinct from the refund pair which
          operates on monetary cents and tier ratios.
        test_recipe:
          setup:
            - "Course PUBLISHED with two required chapters of video_duration_seconds=1000 each."
            - "Student enrolled."
            - "Create one WatchSession of seconds_watched=990 on chapter 1; no WatchSession on chapter 2."
          trigger:
            - "GET /enrollments/{enrollmentId}"
          assert:
            - "Enrollment.chapter_completion_percent == 0.0"
            - "Enrollment.watch_duration_percent == 49.5"
            - "Enrollment.progress_percent == 49.5"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: enrollment_paid_amount_three_input_nonlinear
        grounds:
          - calculations.enrollment_paid_amount
          - entities.Course.fields.list_price_cents
          - entities.Course.fields.discount_percent
          - entities.Course.fields.status
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): three inputs (list_price_cents, discount_percent, status)
          interact non-linearly via the status gate (must be PUBLISHED) and the
          discount clamp at MAX_DISCOUNT_PERCENT=80. A 99%-input clamps to 80%
          before multiplying, so the result is non-linear in raw discount_percent.
        test_recipe:
          setup:
            - "Course PUBLISHED with list_price_cents=10000."
            - "Student registered."
          trigger:
            - "PATCH /courses/{courseId} with discount_percent=99 then POST enrollment"
            - "POST /courses/{courseId}/enrollments"
          assert:
            - "Course.discount_percent stored as 99 BUT Enrollment.paid_amount_cents == 2000"  # clamp to 80 → 10000*0.20=2000
            - "If discount_percent were 0: Enrollment.paid_amount_cents == 10000"
            - "If discount_percent were 15: Enrollment.paid_amount_cents == 8500"

      - name: at_risk_alert_circular_eval_order_pinned
        grounds:
          - calculations.at_risk_alert
          - calculations.chapter_completion_percent
          - calculations.watch_duration_percent
          - state_machines.Enrollment.ACTIVE_to_AT_RISK
          - entities.Enrollment.fields.learning_status
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (progress_percent depends on
          chapter+watch; risk_score depends on progress_percent; learning_status
          depends on risk_score) where the scaffold pins evaluation order
          1→2→3→4→5→6→7. Without the pinned order, the value is undefined
          because progress feeds risk feeds status which is read by callers
          who then alter watch-sessions. This is a different mode from the
          paid_amount instance which is a pure 3-input formula with no circular
          shape.
        test_recipe:
          setup:
            - "Course PUBLISHED with two required chapters of 1000s each."
            - "Student enrolled at T0."
            - "Advance clock by 14 days (>=AT_RISK_DAYS_THRESHOLD)."
            - "Create one WatchSession of 200s on chapter 1 (progress_percent=10.0)."
          trigger:
            - "POST /_sweep/at-risk"
          assert:
            - "Enrollment.chapter_completion_percent == 0.0"   # computed first
            - "Enrollment.watch_duration_percent == 10.0"      # computed second
            - "Enrollment.progress_percent == 10.0"            # max(); tie rule documented
            - "Enrollment.learning_status == AT_RISK"          # progress<30, days>=14

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: course_branching_with_revert_leg
        grounds:
          - state_machines.Course.UNDER_REVIEW_to_REJECTED
          - state_machines.Course.REJECTED_to_DRAFT
          - state_machines.Course.UNDER_REVIEW_to_PUBLISHED
        distinguishing_aspect: |
          Branching shape: from UNDER_REVIEW the machine forks to {PUBLISHED,
          REJECTED}; the REJECTED branch can re-enter DRAFT via return-to-draft,
          producing a non-linear topology. This is a different entity from the
          Submission cyclic loop (which is on the Submission row).
        test_recipe:
          setup:
            - "Course in DRAFT with one required Chapter."
          trigger:
            - "POST /courses/{courseId}/submit-for-review (DRAFT→UNDER_REVIEW)"
            - "POST /courses/{courseId}/reject (UNDER_REVIEW→REJECTED)"
            - "POST /courses/{courseId}/return-to-draft (REJECTED→DRAFT)"
            - "POST /courses/{courseId}/submit-for-review again (DRAFT→UNDER_REVIEW)"
            - "POST /courses/{courseId}/approve (UNDER_REVIEW→PUBLISHED)"
          assert:
            - "Course.status sequence: DRAFT, UNDER_REVIEW, REJECTED, DRAFT, UNDER_REVIEW, PUBLISHED"
            - "Two distinct SyllabusRevision rows exist (one per submit-for-review)"
            - "Course.published_syllabus_revision_id == latest SyllabusRevision.id"

      - name: submission_cyclic_revision_loop
        grounds:
          - state_machines.Submission.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Submission.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Submission.REVISION_REQUESTED_to_SUBMITTED
          - entities.Submission.fields.revision_count
        distinguishing_aspect: |
          Cyclic shape: SUBMITTED → UNDER_REVIEW → REVISION_REQUESTED → SUBMITTED
          forms a closed loop on the same entity. revision_count strictly
          increases each time the cycle completes. Different entity from Course's
          branching shape.
        test_recipe:
          setup:
            - "Course PUBLISHED with one Assignment (format=TEXT, max_score=100, due_ts in the future)."
            - "Student enrolled."
          trigger:
            - "POST /assignments/{id}/submissions (revision_count=0, status=SUBMITTED)"
            - "POST /submissions/{id}/start-review (UNDER_REVIEW)"
            - "POST /submissions/{id}/request-revision feedback='please redo' (REVISION_REQUESTED)"
            - "PUT /submissions/{id}/payload payload_text='v2' (revision_count=1, SUBMITTED)"
            - "POST /submissions/{id}/start-review (UNDER_REVIEW)"
            - "POST /submissions/{id}/request-revision feedback='almost' (REVISION_REQUESTED)"
            - "PUT /submissions/{id}/payload payload_text='v3' (revision_count=2, SUBMITTED)"
          assert:
            - "Submission.revision_count == 2"
            - "Submission.status == SUBMITTED"
            - "the cycle visited UNDER_REVIEW twice and REVISION_REQUESTED twice"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: course_delist_depth_3_cascade
        grounds:
          - state_machines.Course.PUBLISHED_to_DELISTED
          - state_machines.LiveClass.SCHEDULED_to_CANCELLED
          - state_machines.Enrollment.ACTIVE_to_AT_RISK
          - calculations.refund_provisional
          - entities.RefundRequest.fields.provisional_amount_cents
        distinguishing_aspect: |
          Depth-3 transitive chain from a single trigger:
          link 1: POST delist mutates Course (status=DELISTED, posture=FROZEN);
          link 2: that Course mutation itself mutates LiveClass rows (SCHEDULED→CANCELLED);
          link 3: each LiveClass cancellation itself mutates affected Enrollments
                  (learning_status→AT_RISK), which in turn forces recomputation of
                  any PENDING RefundRequest.provisional_amount_cents.
          Each link is caused by the previous link (not directly by the
          delist call). Different trigger from the refund-approval cascade.
        test_recipe:
          setup:
            - "Course PUBLISHED. Two Enrollments, each with one ACTIVE learning_status."
            - "One LiveClass SCHEDULED for tomorrow."
            - "One RefundRequest in PENDING for Enrollment A with provisional_amount_cents=70000."
          trigger:
            - "POST /courses/{courseId}/delist"
          assert:
            - "Course.status == DELISTED AND Course.posture == FROZEN"
            - "LiveClass.status == CANCELLED for the previously-SCHEDULED row"
            - "Enrollment_A.learning_status == AT_RISK"
            - "Enrollment_B.learning_status == AT_RISK"
            - "RefundRequest_A.provisional_amount_cents recomputed (audit log entry recorded)"

      - name: refund_approve_depth_2_cascade
        grounds:
          - state_machines.RefundRequest.PENDING_to_APPROVED
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.AuditLogEntry.fields.action
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (refund approve, not course
          delist):
          link 1: approve mutates RefundRequest (PENDING→APPROVED);
          link 2: that RefundRequest mutation itself mutates the Enrollment's
                  payment_status to REFUNDED and learning_status to WITHDRAWN.
          AuditLogEntry is appended in the same transaction as link 2, so the
          trigger of the audit row is the cascaded enrollment mutation, not
          the original approve call directly.
        test_recipe:
          setup:
            - "Course PUBLISHED, Student enrolled, Enrollment with payment_status=PAID, learning_status=ACTIVE."
            - "RefundRequest in PENDING with provisional_amount_cents=70000."
          trigger:
            - "POST /refund-requests/{refundRequestId}/approve"
          assert:
            - "RefundRequest.status == APPROVED AND RefundRequest.final_amount_cents != null"
            - "Enrollment.payment_status == REFUNDED AND Enrollment.learning_status == WITHDRAWN"
            - "AuditLogEntry exists with action='REFUND_APPROVED' AND subject_id == refundRequestId"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_state_wins
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.LiveClass.SCHEDULED_to_RESCHEDULED
        distinguishing_aspect: |
          Pair (state, business_temporal): when reschedule is called on a
          LiveClass that is already ENDED AND the requested new slot also
          collides with another room booking, the state error
          (ERR_LIVE_CLASS_NOT_SCHEDULED) wins because category=state is at
          priority 5 while ERR_ROOM_CONFLICT is at priority 8.
        test_recipe:
          setup:
            - "LiveClass started and ENDED (status=ENDED)."
            - "Another LiveClass SCHEDULED occupying room R from t1 to t2."
          trigger:
            - "POST /live-classes/{liveClassId}/reschedule with room_id=R, start_ts in [t1,t2)"
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_LIVE_CLASS_NOT_SCHEDULED'"
            - "Response error_id != 'ERR_ROOM_CONFLICT'"

      - name: business_safety_vs_business_constraint_safety_wins
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - state_machines.Submission.UNDER_REVIEW_to_GRADED
        distinguishing_aspect: |
          Pair (business_safety, business_constraint): when grading is attempted
          with both plagiarism_score >= threshold AND score outside [0, max_score],
          the safety error (ERR_PLAGIARISM_BLOCKED) wins because category
          business_safety sits at priority 7 while business_constraint
          ERR_SCORE_OUT_OF_RANGE sits at priority 17. Different category pair
          from the state-vs-temporal instance.
        test_recipe:
          setup:
            - "Course PUBLISHED, Assignment with max_score=100."
            - "Submission UNDER_REVIEW with plagiarism_score=0.95 (>=0.8 threshold) and override_plagiarism unset."
          trigger:
            - "POST /submissions/{submissionId}/grade with score=200 and feedback='x'"
          assert:
            - "Response status code == 403"
            - "Response error_id == 'ERR_PLAGIARISM_BLOCKED'"
            - "Response error_id != 'ERR_SCORE_OUT_OF_RANGE'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_vs_absent_at_exact_1800_seconds
        grounds:
          - calculations.attendance_mark_derivation
          - entities.Attendance.fields.mark
          - validations[priority=10]
        distinguishing_aspect: |
          Numeric-threshold boundary on attendance time delta. delta == 1800
          (exactly 30 min after start_ts) yields mark=LATE; delta == 1801 yields
          ERR_CHECKIN_WINDOW_CLOSED (and at LiveClass END the autofill fires
          mark=ABSENT). Endpoint: POST /live-classes/{id}/check-in.
        test_recipe:
          setup:
            - "LiveClass LIVE with start_ts=10000."
            - "Student enrolled."
          trigger:
            - "POST /live-classes/{id}/check-in checkin_method=TIME_WINDOW checkin_ts=11800"
          assert:
            - "Response code == 201"
            - "Attendance.mark == 'LATE'"
            - "Subsequent attempt with checkin_ts=11801 returns code==409 and error_id=='ERR_CHECKIN_WINDOW_CLOSED'"

      - name: refund_tier_boundary_at_progress_5_and_days_7
        grounds:
          - calculations.refund_provisional
          - entities.RefundRequest.fields.provisional_amount_cents
        distinguishing_aspect: |
          Empty-collection / inclusive-boundary edge on refund tier table:
          progress == 5.0 AND days_elapsed == 7 → ratio=1.00 (full refund).
          progress == 5.1 OR days_elapsed == 8 → ratio=0.70 (mid tier).
          The tier conditions use <= (inclusive); off-by-one tests must
          succeed on the exact boundary. Different metric (monetary tier)
          and different endpoint (POST refund-requests) from the attendance
          boundary.
        test_recipe:
          setup:
            - "Course PUBLISHED list_price_cents=100000 discount=0; Student enrolled at T0; paid=100000."
            - "Advance clock by exactly 7 days; create WatchSession totaling progress_percent=5.0."
          trigger:
            - "POST /enrollments/{id}/refund-requests with materials_kit_count=0"
          assert:
            - "RefundRequest.provisional_amount_cents == 100000"   # ratio=1.00
            - "If repeated with progress_percent=5.1 → provisional_amount_cents == 70000"   # ratio=0.70
            - "If repeated with days_elapsed=8 (and progress=5.0) → provisional_amount_cents == 70000"   # ratio=0.70

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: live_class_start_blocked_by_course_posture
        grounds:
          - state_machines.LiveClass.SCHEDULED_to_LIVE
          - entities.Course.fields.posture
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair (LiveClass, Course). LiveClass.SCHEDULED→LIVE transition's
          valid set depends on Course.posture: when posture==FROZEN (after
          delist), the start transition is rejected with ERR_COURSE_FROZEN.
        test_recipe:
          setup:
            - "Course PUBLISHED with one LiveClass SCHEDULED 5 minutes from now."
            - "Then POST /courses/{courseId}/delist (posture→FROZEN)."
          trigger:
            - "POST /live-classes/{liveClassId}/start"
          assert:
            - "Response code == 409"
            - "Response error_id == 'ERR_COURSE_FROZEN'"
            - "LiveClass.status remains CANCELLED (cascaded by delist) — NOT LIVE"

      - name: leave_approval_blocked_by_live_class_status
        grounds:
          - state_machines.LeaveRequest.PENDING_to_APPROVED
          - entities.LiveClass.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair (LeaveRequest, LiveClass) — different from the
          (LiveClass, Course) pair above. LeaveRequest.PENDING→APPROVED
          transition's valid set depends on the target LiveClass.status: if
          the live class is already LIVE or ENDED, approve is rejected with
          ERR_LIVE_CLASS_ALREADY_STARTED.
        test_recipe:
          setup:
            - "LiveClass started → status=LIVE."
            - "Student creates LeaveRequest for that LiveClass (status=PENDING)."
          trigger:
            - "POST /leave-requests/{leaveRequestId}/approve"
          assert:
            - "Response code == 409"
            - "Response error_id == 'ERR_LIVE_CLASS_ALREADY_STARTED'"
            - "LeaveRequest.status remains PENDING"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_half_open_with_post_buffer
        grounds:
          - calculations.room_overlap_check
          - entities.LiveClass.fields.room_id
          - entities.LiveClass.fields.start_ts
          - entities.LiveClass.fields.end_ts
          - validations[priority=8]
          - concurrency_rules[room]
        distinguishing_aspect: |
          Room resource. Half-open interval [start_ts, end_ts) with a 600-second
          post-buffer added to the existing session's end_ts. Adjacency-touching
          (new.start_ts == existing.end_ts) is REJECTED because new.start_ts <
          existing.end_ts + 600. Distinct interval geometry from the instructor
          availability rule (closed, no buffer).
        test_recipe:
          setup:
            - "Existing LiveClass scheduled in room R from start_ts=1000 to end_ts=2000."
          trigger:
            - "POST /courses/{courseId}/live-classes with room_id=R, start_ts=2000, end_ts=3000"
          assert:
            - "Response code == 409 AND error_id == 'ERR_ROOM_CONFLICT'"
            - "If start_ts=2600 (== 2000 + 600) instead → response code == 201 (boundary touch on buffer end is allowed because new.start_ts < end_ts+600 is FALSE at exactly +600)"
            - "If start_ts=2599 → response code == 409 AND error_id == 'ERR_ROOM_CONFLICT'"

      - name: instructor_availability_closed_interval_containment
        grounds:
          - calculations.instructor_availability_check
          - entities.Instructor.fields.availability_windows
          - validations[priority=9]
        distinguishing_aspect: |
          Instructor resource (different from room). Closed-on-both-ends
          interval semantics, no buffer. A LiveClass is acceptable iff some
          window w satisfies w.start_ts <= class.start_ts AND class.end_ts <= w.end_ts.
          Touching the window's end (class.end_ts == w.end_ts) is ALLOWED;
          this is opposite to the room half-open rule. Different interval
          semantics.
        test_recipe:
          setup:
            - "Instructor with availability_windows = [{start_ts: 1000, end_ts: 5000}]."
          trigger:
            - "POST /courses/{courseId}/live-classes with instructor_id=that, room_id=fresh, start_ts=4000, end_ts=5000"
          assert:
            - "Response code == 201"          # exact touch on window end is allowed
            - "If start_ts=4000, end_ts=5001 → response code == 409 AND error_id == 'ERR_INSTRUCTOR_UNAVAILABLE'"
            - "If start_ts=999, end_ts=2000 → response code == 409 AND error_id == 'ERR_INSTRUCTOR_UNAVAILABLE'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_request_then_reject_preserves_paid_amount
        grounds:
          - state_machines.Enrollment.PAID_to_REFUND_PENDING
          - state_machines.RefundRequest.PENDING_to_REJECTED
          - entities.Enrollment.fields.paid_amount_cents
          - entities.Enrollment.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity: monetary balance on Enrollment. The sequence
          (refund-request creation) then (refund-request reject) must leave
          Enrollment.paid_amount_cents and Enrollment.payment_status unchanged
          from before the request, with no money having moved. Pinned formula:
          POST_paid_amount_cents == PRE_paid_amount_cents AND
          POST_payment_status == 'PAID' AND Enrollment.refund_amount_cents IS NULL.
        test_recipe:
          setup:
            - "Course PUBLISHED list_price_cents=10000 discount=15; Student enrolled (paid_amount_cents=8500); payment_status=PAID."
          trigger:
            - "POST /enrollments/{enrollmentId}/refund-requests"
            - "POST /refund-requests/{refundRequestId}/reject with rejection_reason='ineligible'"
          assert:
            - "Enrollment.paid_amount_cents == 8500 (unchanged from pre-cycle)"
            - "Enrollment.payment_status == 'PAID' (unchanged)"
            - "Enrollment.refund_amount_cents IS NULL"
            - "RefundRequest.status == 'REJECTED'"

      - name: submission_revise_loop_does_not_advance_progress
        grounds:
          - state_machines.Submission.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Submission.REVISION_REQUESTED_to_SUBMITTED
          - calculations.chapter_completion_percent
          - entities.Enrollment.fields.progress_percent
          - entities.Submission.fields.revision_count
        distinguishing_aspect: |
          Conserved quantity: Enrollment.progress_percent (a learning-progress
          quantity, distinct from monetary balance above). The forward action
          (request-revision) and its compensating action (PUT payload to
          re-submit) must NOT advance the parent Enrollment.progress_percent —
          progress is only allowed to change when Submission reaches GRADED.
          Pinned invariant: PRE_progress_percent == POST_progress_percent
          across the full request-revision → re-submit cycle, even though
          revision_count strictly increases.
        test_recipe:
          setup:
            - "Course PUBLISHED with two required chapters (1000s each)."
            - "Student enrolled. Single WatchSession of 200s on chapter 1 (progress_percent=10.0)."
            - "Submission UNDER_REVIEW for an Assignment, plagiarism_score=0.10."
          trigger:
            - "POST /submissions/{id}/request-revision with feedback='please redo'"
            - "PUT /submissions/{id}/payload payload_text='v2'"
          assert:
            - "Enrollment.progress_percent == 10.0 (unchanged across the cycle)"
            - "Submission.revision_count == 1 (strictly increased — not conserved)"
            - "Submission.status == 'SUBMITTED'"
