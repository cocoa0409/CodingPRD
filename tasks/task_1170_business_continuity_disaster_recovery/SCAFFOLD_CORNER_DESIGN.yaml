              captures: { p_after: $.data.pressure_score, open_cnt: $.data.open_gap_count, overdue_cnt: $.data.overdue_gap_count }
          assert:
            - "p_before == 7 (3*2 + 1*1)"
            - "p_after == 30 ((7 + 4*2) * 2 for the overdue CRITICAL) — not 15, the doubler applies to the whole sum"
            - "open_cnt == 3 and overdue_cnt == 2"
