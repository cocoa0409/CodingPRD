      - name: calciner_capacity_ignores_completed_and_aborted_batches
        claim_type: input_set_filtering
        grounds:
          - calculations.calciner_aggregate_capacity
          - errors[ERR_CALCINER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The aggregate rate check reads only PLANNED, FEEDING and CALCINING batches, so a 40.0 tph
          window that fully overlaps the COMPLETED B1 (40.0 tph) is accepted on a 60 tph calciner, a
          window overlapping an ABORTED batch is likewise accepted, while a second live 40.0 tph batch
          overlapping the accepted one is rejected at 80.0 tph.
        test_recipe:
          setup:
            - "Plant GYP-1 (calciner_capacity_tph 60) with batch B1 at 40.0 tph over 2026-08-02T08:00Z-14:00Z, COMPLETED after a passing stucco test."
            - "Lots A and B retain 120.000 t each after B1."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
