        excluded_because:
          difficulty_instance: "multi_level_cascade / adding_a_ticket_tier_decertifies_the_safety_plan_and_halts_sales"
          rationale: "CASCADE B — a tier that raises expected_attendance past a provisioning threshold auto-returns the CERTIFIED plan, drives safety_state to SAFETY_DRAFT, halts sales and voids PENDING orders — is asserted there link by link, including the partial-failure case where the requirement does not move and no cascade fires."

