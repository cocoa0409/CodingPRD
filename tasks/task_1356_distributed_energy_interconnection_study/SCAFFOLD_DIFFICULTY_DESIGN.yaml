scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_standard_vs_expedited_storage_flat
        grounds:
          - calculations.deposit_assessment
          - entities.Project.fields.deposit_required_cents
        distinguishing_aspect: |
          Deposit assessment (Project domain) exhibits the dual variant: an identical
          5 MW ENERGY_ONLY request costs 500000 cents under STANDARD but 300000 cents
          under EXPEDITED; the variant is selected by technology == STORAGE and capacity <= 5.
        test_recipe:
          setup:
            - "One developer onboarded; one FORMING cluster (region WEST, capacity 200 MW, window 2026-08-01..2026-09-01)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "Battery A", technology: "STORAGE", capacity_mw: 5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-7" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_storage: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "Solar A", technology: "SOLAR", capacity_mw: 5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-8" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_solar: $.data.id }
          assert:
            - "Project.${p_storage}.deposit_required_cents == 300000 (EXPEDITED flat)"
            - "Project.${p_solar}.deposit_required_cents == 500000 (STANDARD: 5 * 100000)"
            - "Both projects have identical capacity_mw 5 and service_type ENERGY_ONLY, so the 200000-cent delta is attributable solely to variant selection"
            - "Project.${p_storage}.status == SUBMITTED and Project.${p_solar}.status == SUBMITTED"

      - name: study_cost_allocation_provisional_vs_final
        grounds:
          - calculations.study_cost_allocation
          - entities.CostShare.fields.allocated_cents
          - entities.CostShare.fields.basis
        distinguishing_aspect: |
          Study cost allocation (Study domain) exhibits the dual variant: identical
          membership (10 MW + 30 MW) and identical total 1000000 cents yield PROVISIONAL
          shares 250000/750000 but FINAL shares 375000/625000 after publish-results.
        test_recipe:
          setup:
            - "P1 (10 MW SOLAR) and P2 (30 MW WIND) both READY in one cluster; study scoped with total_cost_cents 1000000"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-7" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p1-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p1-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p1_m1}/review"
              payload: { decision: "ACCEPTED", review_note: "ok" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p1_m2}/review"
              payload: { decision: "ACCEPTED", review_note: "ok" }
              as: QueueAdministrator
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P2", technology: "WIND", capacity_mw: 30, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-9" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/deposits"
              payload: { amount_cents: 4500000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p2-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m1: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p2-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p2_m1}/review"
              payload: { decision: "ACCEPTED", review_note: "ok" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p2_m2}/review"
              payload: { decision: "ACCEPTED", review_note: "ok" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 1000000 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /interconnection/projects/${p1_id}/cost-shares"
              as: QueueAdministrator
              captures: { p1_prov: "$.data[0].allocated_cents", p1_prov_basis: "$.data[0].basis" }
            - call: "GET /interconnection/projects/${p2_id}/cost-shares"
              as: QueueAdministrator
              captures: { p2_prov: "$.data[0].allocated_cents" }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}/cost-shares"
              as: QueueAdministrator
              captures: { p1_fin: "$.data[0].allocated_cents", p1_fin_basis: "$.data[0].basis" }
            - call: "GET /interconnection/projects/${p2_id}/cost-shares"
              as: QueueAdministrator
              captures: { p2_fin: "$.data[0].allocated_cents" }
          assert:
            - "${p1_prov} == 250000 and ${p1_prov_basis} == PROVISIONAL"
            - "${p2_prov} == 750000"
            - "${p1_fin} == 375000 and ${p1_fin_basis} == FINAL"
            - "${p2_fin} == 625000"
            - "${p1_fin} != ${p1_prov} — identical membership and total, different variant, different cents"
            - "${p1_fin} + ${p2_fin} == 1000000 (sum conserved)"

  - rule_id: combinatorial_formula
    instances:
      - name: deposit_tiered_multifactor_capacity_service
        grounds:
          - calculations.deposit_assessment
        distinguishing_aspect: |
          Mode (a): three inputs (capacity_mw, technology, service_type) interact
          non-linearly — tier-1/tier-2 split at 20 MW multiplied by the CAPACITY
          service multiplier; 25 MW WIND CAPACITY yields 3900000 while identical
          capacity ENERGY_ONLY yields 3250000.
        test_recipe:
          setup:
            - "One developer; one FORMING cluster (capacity 200 MW)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "WindCap", technology: "WIND", capacity_mw: 25, service_type: "CAPACITY", point_of_interconnection: "SUB-10" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_cap: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "WindEo", technology: "WIND", capacity_mw: 25, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-11" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_eo: $.data.id }
          assert:
            - "Project.${p_cap}.deposit_required_cents == 3900000 ((20*100000 + 5*250000) * 1.2)"
            - "Project.${p_eo}.deposit_required_cents == 3250000 (20*100000 + 5*250000)"
            - "The 650000-cent delta isolates the service_type multiplier at a tier-straddling capacity"

      - name: study_final_allocation_per_component_rounding
        grounds:
          - calculations.study_cost_allocation
        distinguishing_aspect: |
          Mode (b): FINAL allocation pins per-component rounding (round headcount and
          capacity components to integer cents first, then sum, then assign the residual
          to the largest-capacity project); with T=999999 and capacities 10/10/20 the
          pinned order yields 291667/291667/416665, while sum-then-round would yield
          291666/291666/416667.
        test_recipe:
          setup:
            - "Three READY projects in one cluster: P1 10 MW SOLAR, P2 10 MW WIND, P3 20 MW SOLAR; study scoped with total_cost_cents 999999 and results published"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p1-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p1-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p1_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p1_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P2", technology: "WIND", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-2" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p2-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m1: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p2-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p2_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p2_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P3", technology: "SOLAR", capacity_mw: 20, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-3" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p3_id: $.data.id }
            - call: "POST /interconnection/projects/${p3_id}/deposits"
              payload: { amount_cents: 2000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p3_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p3-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p3_m1: $.data.id }
            - call: "POST /interconnection/projects/${p3_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p3-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p3_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p3_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p3_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 999999 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}/cost-shares"
              as: QueueAdministrator
              captures: { p1_share: "$.data[0].allocated_cents" }
            - call: "GET /interconnection/projects/${p2_id}/cost-shares"
              as: QueueAdministrator
              captures: { p2_share: "$.data[0].allocated_cents" }
            - call: "GET /interconnection/projects/${p3_id}/cost-shares"
              as: QueueAdministrator
              captures: { p3_share: "$.data[0].allocated_cents" }
          assert:
            - "${p1_share} == 291667 (head 166667 + capacity 125000)"
            - "${p2_share} == 291667"
            - "${p3_share} == 416665 (head 166667 + capacity 250000 = 416667, minus residual 2 assigned to the largest-capacity project)"
            - "${p1_share} + ${p2_share} + ${p3_share} == 999999"
            - "Sum-then-round order would have produced 416666 for P3 before residual; the pinned per-component order produces 416665 after residual"

  - rule_id: non_linear_state_machine
    instances:
      - name: project_study_complete_restudy_cycle
        grounds:
          - state_machines.Project.STUDY_COMPLETE_to_RESTUDY_REQUIRED
          - state_machines.Project.RESTUDY_REQUIRED_to_STUDY_COMPLETE
          - state_machines.Study.RESULTS_PUBLISHED_to_IN_PROGRESS
        distinguishing_aspect: |
          Project's machine is cyclic: STUDY_COMPLETE -> RESTUDY_REQUIRED -> STUDY_COMPLETE,
          driven by a sibling withdrawal reopening the cluster study and the reopened
          study publishing again. The cycle is on Project, distinct from the
          MilestoneSubmission cycle in the sibling instance.
        test_recipe:
          setup:
            - "P1 (10 MW SOLAR) and P2 (30 MW WIND) both STUDY_COMPLETE under one study (total 1000000 cents, RESULTS_PUBLISHED)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p1-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p1-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p1_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p1_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P2", technology: "WIND", capacity_mw: 30, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-2" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/deposits"
              payload: { amount_cents: 4500000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p2-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m1: $.data.id }
            - call: "POST /interconnection/projects/${p2_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p2-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p2_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p2_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 1000000 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
          trigger:
            - call: "POST /interconnection/projects/${p2_id}/withdraw"
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_status_mid: $.data.status }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_status_end: $.data.status }
          assert:
            - "${p1_status_mid} == RESTUDY_REQUIRED (STUDY_COMPLETE -> RESTUDY_REQUIRED on sibling withdrawal)"
            - "${p1_status_end} == STUDY_COMPLETE (RESTUDY_REQUIRED -> STUDY_COMPLETE on republish — cycle closed)"
            - "Study.${s_id}.status == RESULTS_PUBLISHED at the end (IN_PROGRESS after reopen, RESULTS_PUBLISHED after second publish)"

      - name: milestone_reject_resubmit_cycle
        grounds:
          - state_machines.MilestoneSubmission.PENDING_REVIEW_to_REJECTED
          - state_machines.MilestoneSubmission.REJECTED_to_PENDING_REVIEW
        distinguishing_aspect: |
          MilestoneSubmission's machine is cyclic on a different entity than Project:
          PENDING_REVIEW -> REJECTED -> PENDING_REVIEW -> ACCEPTED, with evidence_uri
          replaced and review_note cleared on resubmission.
        test_recipe:
          setup:
            - "One QUEUED project (10 MW SOLAR, deposit fully posted)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/site-v1.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /interconnection/milestone-submissions/${m_id}/review"
              payload: { decision: "REJECTED", review_note: "lease expires too soon" }
              as: QueueAdministrator
              captures: { st_rejected: $.data.status, note_rejected: $.data.review_note }
            - call: "POST /interconnection/milestone-submissions/${m_id}/resubmit"
              payload: { evidence_uri: "s3://ev/site-v2.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { st_pending: $.data.status, uri_after: $.data.evidence_uri, note_after: $.data.review_note }
