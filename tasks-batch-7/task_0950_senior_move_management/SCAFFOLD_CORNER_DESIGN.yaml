        distinguishing_aspect: "With inventory_item_count 0 the summary selects ASSESSMENT_HEURISTIC and reports ROOM_COUNT_STUDIO 2 times VOLUME_PER_ROOM_CFT 180, that is 360.00 cft, while Engagement.total_inventory_volume_cft is still 0."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement with no inventory items."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 15, origin_stairs_flights: 1, origin_long_carry_feet: 75 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "GET /engagements/${eng}/summary"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "the summary responds 200 with volume_estimate_variant == ASSESSMENT_HEURISTIC"
            - "the summary reports volume_estimate_cft == 360.00"
            - "Engagement.${eng}.inventory_item_count == 0"
            - "Engagement.${eng}.total_inventory_volume_cft == 0.00"

      - name: volume_estimate_switches_to_the_inventory_rollup_on_the_first_item
        claim_type: Variant Selection
        grounds: ['calculations.engagement_volume_estimate', 'endpoints["GET /engagements/{id}/summary"]', 'invariants[INV_INVENTORY_VOLUME_CONSERVATION]']
        distinguishing_aspect: "The branch boundary is inventory_item_count 0 to 1: cataloguing a single 42.5 cft item flips the summary from ASSESSMENT_HEURISTIC 360.00 to INVENTORY_ROLLUP 42.50, so the estimate falls rather than rises."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement to which exactly one 42.5 cft item is added."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 15, origin_stairs_flights: 1, origin_long_carry_feet: 75 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Walnut sideboard", category: "FURNITURE", footprint_linear_inches: 60, volume_cft: 42.5 }
              as: MOVE_MANAGER
              captures: { it: "$.data.id" }
            - call: "GET /engagements/${eng}/summary"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "the summary responds 200 with volume_estimate_variant == INVENTORY_ROLLUP"
            - "the summary reports volume_estimate_cft == 42.50"
            - "Engagement.${eng}.inventory_item_count == 1"
            - "Engagement.${eng}.total_inventory_volume_cft == 42.50"
            - "Engagement.${eng}.keep_volume_cft == 0.00 because the item is still UNDECIDED"

      - name: travel_surcharge_at_exactly_forty_miles_stays_inside_band_one
