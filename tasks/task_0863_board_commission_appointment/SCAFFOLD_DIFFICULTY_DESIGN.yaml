  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reappointment_seat_term_overlap_half_open
        grounds:
          - validations[priority=72]
          - state_machines.Term.ACTIVE_to_HOLDOVER
          - entities.Term.fields.term_end_date
        distinguishing_aspect: "Seat resource, half-open [start,end) semantics: a reappointment term starting 2030-08-01 collides with the incumbent holdover term whose window runs to 2030-08-30, so ERR_TERM_OVERLAP; a start of exactly 2030-08-30 (adjacency) would be allowed."
        test_recipe:
          setup:
            - "Member1 on seat X, term [2026-06-01,2030-06-01) expired to HOLDOVER (window extended to 2030-08-30); reappointment requested with start 2030-08-01 (inside the holdover window)."
