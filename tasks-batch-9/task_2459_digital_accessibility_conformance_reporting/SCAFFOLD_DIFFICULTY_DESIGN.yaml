  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: publish_report_state_error_precedes_missing_in_scope_components
        grounds:
          - validations[priority=32]
          - validations[priority=68]
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Pair 1 of 2 conflicts a `state` rule (priority 32) with a `business_referential` rule
          (priority 68): a DRAFT report on a product whose whole component inventory is out of
          scope violates both, and the API must answer ERR_REPORT_NOT_APPROVED 409 rather than
          ERR_NO_IN_SCOPE_COMPONENTS 422. The second trigger call proves rule 68 really was
          violated all along.
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with no success criteria yet, and a product targeting level AA"
            - "Two components exist but both carry in_scope false, so Product.components_in_scope_count is 0"
            - "A report has been opened and is still in state DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Internal Admin Console", component_type: "DESKTOP_APP", in_scope: false, assessment_scope: "EXCLUDED", applicable_criteria_count: 40, user_reach_pct: 5 }
              as: AccessibilityLead
              captures: { comp_out_1_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Batch Import CLI", component_type: "DESKTOP_APP", in_scope: false, assessment_scope: "EXCLUDED", applicable_criteria_count: 40, user_reach_pct: 2 }
              as: AccessibilityLead
              captures: { comp_out_2_id: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v1: $.data.version, in_scope_count: $.data.components_in_scope_count }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v1}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id, rep_state: $.data.state }
          trigger:
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { first_error: $.data.error_id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Ready for reviewer sign-off" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Nothing in scope, approving the shell" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { second_error: $.data.error_id }
          assert:
            - "${in_scope_count} == 0"
            - "${rep_state} == DRAFT"
            - "First publish returns HTTP 409 and ${first_error} == ERR_REPORT_NOT_APPROVED (priority 32 wins over priority 68)"
            - "Second publish returns HTTP 422 and ${second_error} == ERR_NO_IN_SCOPE_COMPONENTS"
            - "ConformanceReport.${rep_id}.state == APPROVED (neither rejected publish call transitioned the report)"
            - "ConformanceReport.${rep_id}.published_at is null"

      - name: attest_segregation_of_duties_precedes_expired_evidence
        grounds:
          - validations[priority=52]
          - validations[priority=62]
          - state_machines.CriterionAssessment.DRAFT_to_ATTESTED
        distinguishing_aspect: |
          Pair 2 of 2 uses a different error-category pair — `business_safety` (priority 52,
          403) against `business_temporal` (priority 62, 422): an attestation attempted by the
          authoring user 122 days after authoring must answer ERR_SEGREGATION_OF_DUTIES, and only
          once a different reviewer attests does the 90-day evidence-age rule surface.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40 and one COMPLETED MANUAL SCREEN_READER run of 40 criteria, so coverage_pct is 45.00 and assessment_state is COMPLETE"
            - "A DRAFT assessment for criterion 1.1.1 was authored by user tester-1 while the clock read 2026-08-01T00:00:00Z"
            - "The clock is moved to 2026-12-01T00:00:00Z, which is 122 days later and past EVIDENCE_MAX_AGE_DAYS of 90"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_sr_id: $.data.id }
            - call: "POST /assessment-runs/${run_sr_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_v1: $.data.version }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit1_id}", support_level: "SUPPORTS", expected_component_version: "${comp_v1}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: AccessibilityLead
          trigger:
            - call: "POST /criterion-assessments/${ca1_id}/attest"
              payload: { attestation_note: "Self-attesting my own assessment" }
              as: ConformanceReviewer
              as_user_id: "tester-1"
              captures: { first_error: $.data.error_id }
            - call: "POST /criterion-assessments/${ca1_id}/attest"
              payload: { attestation_note: "Independent reviewer attesting the same row" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
              captures: { second_error: $.data.error_id }
          assert:
            - "First attest returns HTTP 403 and ${first_error} == ERR_SEGREGATION_OF_DUTIES (priority 52 wins over priority 62)"
            - "Second attest returns HTTP 422 and ${second_error} == ERR_ASSESSMENT_EVIDENCE_EXPIRED"
            - "CriterionAssessment.${ca1_id}.attestation_state == DRAFT"
            - "CriterionAssessment.${ca1_id}.attested_by_user_id is null"
            - "Product.${prod_id}.assessed_criteria_count == 1 (DRAFT rows still count toward the PROVISIONAL variant)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: coverage_exactly_at_min_attest_threshold_versus_one_unit_short
        grounds:
          - calculations.component_testing_coverage_pct
          - validations[priority=58]
          - entities.ProductComponent.fields.assessment_state
        distinguishing_aspect: |
          Boundary 1 of 3 on the percentage metric coverage_pct at MIN_ATTEST_COVERAGE_PCT, probed
          through POST /criterion-assessments/{id}/attest: 40 of 40 manual screen-reader units land
          exactly on 45.00 and attest, while 39 of 40 units land on 43.88 (0.45 * 0.975 rounded
          half-up) and are refused — one exercised criterion separates the two sides.
        test_recipe:
          setup:
            - "Two in-scope components, each with applicable_criteria_count 40, on the same SCREEN_READER bench with a 30-minute reconfiguration buffer"
            - "Component A has a COMPLETED MANUAL run of 40 exercised criteria, so coverage_pct is exactly 45.00 and assessment_state is COMPLETE"
            - "Component B has a COMPLETED MANUAL run of 39 exercised criteria, so coverage_pct is 43.88 and assessment_state is still IN_TESTING"
            - "Each component has one DRAFT assessment for criterion 1.1.1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_a_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Mobile App", component_type: "MOBILE_APP", in_scope: true, assessment_scope: "PARTIAL", applicable_criteria_count: 40, user_reach_pct: 40 }
              as: AccessibilityLead
              captures: { comp_b_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_a_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_a_id: $.data.id }
            - call: "POST /assessment-runs/${run_a_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_b_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T15:00:00Z", criteria_exercised: 39, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_b_id: $.data.id }
            - call: "POST /assessment-runs/${run_b_id}/complete"
              payload: { defects_found: 2 }
              as: AccessibilityTester
            - call: "GET /components/${comp_a_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_a_v: $.data.version, coverage_a: $.data.coverage_pct, state_a: $.data.assessment_state }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_a_id}", criterion_id: "${crit1_id}", support_level: "SUPPORTS", expected_component_version: "${comp_a_v}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca_a_id: $.data.id }
            - call: "GET /components/${comp_b_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_b_v: $.data.version, coverage_b: $.data.coverage_pct, state_b: $.data.assessment_state }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_b_id}", criterion_id: "${crit1_id}", support_level: "SUPPORTS", expected_component_version: "${comp_b_v}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca_b_id: $.data.id }
