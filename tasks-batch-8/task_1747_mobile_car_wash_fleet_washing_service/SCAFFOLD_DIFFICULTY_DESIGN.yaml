          - state_machines.DamageClaim.UNDER_REVIEW_to_DENIED
          - state_machines.DamageClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          DamageClaim forks at UNDER_REVIEW into APPROVED -> PAID (approved_amount_cents
          set to the class cap, credit eligibility created) versus DENIED (deny_reason set,
