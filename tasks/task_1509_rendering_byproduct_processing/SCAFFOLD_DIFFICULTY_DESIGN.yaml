          assert:
            - "Preconditions verified: lot grade == FEED_GRADE and status == RELEASED; order margin_pct == 11.63 < floor 20.0 (both failures armed)"
            - "${err1} == ERR_SPEC_BELOW_CONTRACT_MIN (business_safety priority 10 beats business_fiscal priority 17)"
            - "SalesOrder.${ord_id}.status remains PRICED; ProductLot.${lot_id}.allocated_lbs remains 0"

  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: odor_score_600_boundary
        grounds:
          - calculations.odor_score_update
          - state_machines.Plant.OPERATING_to_RESTRICTED
          - entities.Plant.fields.odor_score
        distinguishing_aspect: |
          Numeric threshold metric (odor score) on the odor-event confirm endpoint: the
          posture flip fires only when score drops STRICTLY BELOW 600 — a score of exactly
          600 after HIGH+HIGH+MEDIUM (1000-150-150-100) keeps posture OPERATING, and the
          next LOW (-50 -> 550) flips it to RESTRICTED.
        test_recipe:
          setup:
            - "Plant only (no permit needed: score cascade works with permit_id null)"
            - "Four odor events REPORTED by co-1 with severities HIGH, HIGH, MEDIUM, LOW"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T09:00:00Z", location_description: "East fence", severity: "HIGH" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev1: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T10:00:00Z", location_description: "North gate", severity: "HIGH" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev2: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T11:00:00Z", location_description: "South pond", severity: "MEDIUM" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev3: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T12:00:00Z", location_description: "West scale", severity: "LOW" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev4: $.data.id } }
            - { call: "POST /rendering/odor-events/${ev1}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /rendering/odor-events/${ev2}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /rendering/odor-events/${ev3}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
            - { call: "POST /rendering/odor-events/${ev4}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
          assert:
            - "After 3rd confirm: Plant.odor_score == 600 exactly (1000 - 150 - 150 - 100) and posture == OPERATING (600 is NOT < 600)"
            - "After 4th confirm: Plant.odor_score == 550 and posture == RESTRICTED (550 < 600)"
            - "OdorEvents ${ev1}..${ev4}.status == CONFIRMED, confirmed_by == 'co-2', permit_id == null"

      - name: route_capacity_exact_fit
        grounds:
          - calculations.route_capacity_check
          - entities.Vehicle.fields.capacity_lbs
          - entities.RouteStop.fields.estimated_weight_lbs
        distinguishing_aspect: |
          Zero/edge-count metric (planned lbs vs integer capacity) on the route-stop creation
          endpoint — different metric and endpoint from the odor-score boundary: estimated
          weights summing to EXACTLY capacity (25000 + 15000 == 40000) are accepted, and one
          additional pound (40001) is rejected with ERR_ROUTE_OVER_CAPACITY.
        test_recipe:
          setup:
            - "Plant; supplier + ACTIVE agreement [BOVINE]; RAW vehicle capacity EXACTLY 40000; PLANNED route 2026-08-10"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 40000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
          trigger:
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 25000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any, captures: { rv2: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 2, scheduled_window_start: "2026-08-10T10:00:00Z", scheduled_window_end: "2026-08-10T11:00:00Z", estimated_weight_lbs: 15000, estimated_distance_miles: 5, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv2}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s2: $.data.id } }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any, captures: { rv3: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 3, scheduled_window_start: "2026-08-10T12:00:00Z", scheduled_window_end: "2026-08-10T13:00:00Z", estimated_weight_lbs: 1, estimated_distance_miles: 1, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv3}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "Stop1 (25000) and stop2 (15000) created: cumulative 40000 == capacity 40000 is allowed (<=, not <)"
            - "${err1} == ERR_ROUTE_OVER_CAPACITY for the +1 lb stop (cumulative 40001 > 40000)"
            - "Route has exactly 2 non-cancelled stops after the rejection"

  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_blocked_by_suspended_contract
        grounds:
          - state_machines.SalesOrder.PRICED_to_CONFIRMED
          - state_machines.CustomerContract.ACTIVE_to_SUSPENDED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair SalesOrder -> CustomerContract: an order in perfect PRICED state cannot
          confirm while its contract is SUSPENDED; the dependency is on the PARENT contract's
          state, not the order's own machine.
        test_recipe:
          setup:
            - "Plant (std cost 38); FIXED TALLOW contract ACTIVE (base 50, floor 15.0, window 2026-08-01..2026-12-31); order qty 100 ship 2026-08-20 PRICED with expected_grade STANDARD (unit 50, margin 24.0)"
            - "Contract then SUSPENDED by SalesManager"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 100000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-20", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
            - { call: "POST /rendering/sales-orders/${ord_id}/price", payload: { expected_grade: "STANDARD" }, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/suspend", payload: {}, as: SalesManager, as_user_id: "sm-1" }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord_id}/confirm", payload: { allocations: [] }, as: SalesManager, as_user_id: "sm-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_CONTRACT_NOT_ACTIVE (referential priority 11 fires before allocation-sum priority 13, so empty allocations never get evaluated)"
            - "SalesOrder.${ord_id}.status remains PRICED"

      - name: stop_create_blocked_by_suspended_agreement
        grounds:
          - state_machines.RouteStop.transitions
          - state_machines.SupplierAgreement.ACTIVE_to_SUSPENDED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair RouteStop -> SupplierAgreement (different pair from
          SalesOrder->CustomerContract): a stop cannot be added while the governing agreement
          is SUSPENDED, even though route, supplier, and vehicle are all valid.
        test_recipe:
          setup:
            - "Plant; supplier; agreement [BOVINE] ACTIVE then SUSPENDED; RAW vehicle; PLANNED route 2026-08-10"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/suspend", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
          trigger:
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_AGREEMENT_NOT_ACTIVE"
            - "Route remains PLANNED with 0 stops; SupplierAgreement.${agr_id}.status == SUSPENDED"

  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_half_open_adjacency
        grounds:
          - calculations.vehicle_route_overlap
          - entities.CollectionRoute.fields.scheduled_departure
          - entities.CollectionRoute.fields.scheduled_return
        distinguishing_aspect: |
          Interval semantics: PAIRWISE HALF-OPEN [departure, return) on the Vehicle resource —
          a route starting exactly when another ends (12:00 == 12:00) is allowed, while an
          interior overlap (11:00 vs [08:00,12:00)) is rejected with
          ERR_VEHICLE_SCHEDULE_OVERLAP.
        test_recipe:
          setup:
            - "Plant; RAW vehicle V1; route A 2026-08-10 [08:00, 12:00) created for V1"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "RA", service_date: "2026-08-10", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_return: "2026-08-10T12:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { ra: $.data.id } }
          trigger:
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "RB", service_date: "2026-08-10", scheduled_departure: "2026-08-10T12:00:00Z", scheduled_return: "2026-08-10T16:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { rb: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "RC", service_date: "2026-08-10", scheduled_departure: "2026-08-10T11:00:00Z", scheduled_return: "2026-08-10T15:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "Route B [12:00,16:00) created successfully (201) — adjacency at 12:00 == A.return is NOT an overlap under half-open semantics"
            - "${err1} == ERR_VEHICLE_SCHEDULE_OVERLAP for route C [11:00,15:00) — interior overlap with A"
            - "Exactly 2 routes exist for vehicle ${veh_id} afterwards"

      - name: cooker_aggregate_capacity
        grounds:
          - calculations.cooker_capacity_check
          - entities.Plant.fields.cooker_capacity
          - entities.CookRun.fields.cook_start
        distinguishing_aspect: |
          Different interval semantics from the vehicle rule: AGGREGATE CAPACITY on the Plant
          cooker pool — a new run is rejected when the COUNT of overlapping active runs would
          reach cooker_capacity (2), not on any pairwise conflict; a run starting exactly at
          another's end (14:00 == 14:00) does not count as overlapping (half-open).
        test_recipe:
          setup:
            - "Plant with cooker_capacity 2; supplier + agreement [BOVINE]; one ACCEPTED 100000-lb BOVINE batch"
            - "Cook runs R1 [09:00,13:00) 30000 lbs and R2 [10:00,14:00) 30000 lbs already STAGED"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "SLAUGHTERHOUSE" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 100000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 30000 } ], cook_start: "2026-08-05T09:00:00Z", cook_end: "2026-08-05T13:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { cr1: $.data.id } }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 2, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 30000 } ], cook_start: "2026-08-05T10:00:00Z", cook_end: "2026-08-05T14:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { cr2: $.data.id } }
          trigger:
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 3, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 10000 } ], cook_start: "2026-08-05T11:00:00Z", cook_end: "2026-08-05T12:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { err1: $.data.error_id } }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 3, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 5000 } ], cook_start: "2026-08-05T14:00:00Z", cook_end: "2026-08-05T16:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { cr4: $.data.id } }
          assert:
            - "${err1} == ERR_COOKER_CAPACITY_EXCEEDED (2 overlapping active runs == cooker_capacity 2)"
            - "CookRun.${cr4} created (201): R1 ends 13:00 <= 14:00 and R2 ends 14:00 == start, so zero overlaps under half-open windows"
            - "Batch reserved_lbs == 65000 after R4 (30000 + 30000 + 5000); failed R3 reservation never applied"

  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cook_stage_cancel_mass_conservation
        grounds:
          - calculations.batch_mass_conservation
          - state_machines.CookRun.STAGED_to_CANCELLED
          - entities.InboundBatch.fields.remaining_lbs
        distinguishing_aspect: |
          Conserved quantity: RAW MATERIAL MASS (lbs). The forward action (stage 4000 lbs)
          paired with its compensating action (cancel) leaves weight_lbs == remaining + reserved
          + consumed exactly restored: remaining returns 6000 -> 10000, reserved 4000 -> 0,
          consumed stays 0 — no drift.
        test_recipe:
          setup:
            - "Plant (cooker_capacity 2); supplier + agreement [BOVINE]; ACCEPTED 10000-lb BOVINE batch"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 10000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 4000 } ], cook_start: "2026-08-05T06:00:00Z", cook_end: "2026-08-05T10:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { run_id: $.data.id } }
            - { call: "GET /rendering/inbound-batches/${bat_id}", as: Any }
          trigger:
            - { call: "POST /rendering/cook-runs/${run_id}/cancel", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "GET /rendering/inbound-batches/${bat_id}", as: Any }
          assert:
            - "Mid-state (before cancel): batch.remaining_lbs == 6000, reserved_lbs == 4000, consumed_lbs == 0 (10000 == 6000 + 4000 + 0)"
            - "After cancel: batch.remaining_lbs == 10000, reserved_lbs == 0, consumed_lbs == 0 — mass invariant 10000 == 10000 + 0 + 0 restored exactly"
            - "CookRun.${run_id}.status == CANCELLED"

      - name: collect_void_fee_conservation
        grounds:
          - calculations.settlement_accrual_conservation
          - state_machines.RouteStop.COLLECTED_to_VOIDED
          - entities.PeriodSettlement.fields.pickup_fees_accrued_cents
        distinguishing_aspect: |
          Conserved quantity: ACCRUED DOLLARS (cents) — a different quantity from raw mass.
          Collect accrues final fee 22000 + transport 3000 to the settlement and 22000 to the
          supplier; the compensating void restores all three accumulators to exactly 0 and
          rejects the linked batch.
        test_recipe:
          setup:
            - "Plant; supplier; ACTIVE agreement (base 10000, 2 cents/lb, 100 cents/mi, no dead stock, no minimum, no discount); RAW vehicle; route 2026-08-10 DISPATCHED; stop (est 5000 lbs, 20 mi) ARRIVED"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 20, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "POST /rendering/collection-routes/${r1}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/collect", payload: { actual_weight_lbs: 5000, actual_distance_miles: 20, temperature_f: 62.0 }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { sett_id: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements/${sett_id}", as: Any }
            - { call: "GET /rendering/suppliers/${sup_id}", as: Any }
          trigger:
            - { call: "POST /rendering/route-stops/${s1}/void", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/period-settlements/${sett_id}", as: Any }
            - { call: "GET /rendering/suppliers/${sup_id}", as: Any }
            - { call: "GET /rendering/inbound-batches?route_stop_id=${s1}", as: Any, captures: { bat_id: "$.data[0].id" } }
          assert:
            - "Mid-state (after collect): settlement.pickup_fees_accrued_cents == 22000, transport_costs_cents == 3000 (20 * 150), supplier.outstanding_service_fees_cents == 22000"
            - "After void: settlement.pickup_fees_accrued_cents == 0 AND transport_costs_cents == 0 AND supplier.outstanding_service_fees_cents == 0 (exact restoration)"
            - "RouteStop.${s1}.status == VOIDED; InboundBatch.${bat_id}.status == REJECTED"
