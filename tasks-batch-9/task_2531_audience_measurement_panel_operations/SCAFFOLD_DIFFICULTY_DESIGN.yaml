          - state_machines.ClientNotification.SENT_to_ACKNOWLEDGED
          - state_machines.MethodologyChange.NOTIFIED_to_EFFECTIVE
          - entities.MethodologyChange.fields.notified_client_count
          - entities.MethodologyChange.fields.acknowledged_client_count
          - endpoints[POST /client-notifications/{client_notification_id}/acknowledge]
          - errors[ERR_ACKNOWLEDGEMENTS_MISSING]
          - calculations.methodology_impact_delta
        distinguishing_aspect: |
          A different entity pair from the publication gate - MethodologyChange -> ClientNotification:
          the change cannot leave NOTIFIED while a single one of its two SENT notifications is
          unacknowledged, and the identical activate call flips from ERR_ACKNOWLEDGEMENTS_MISSING to
