# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2829 — HVAC Filter Subscription & Resident Benefit Package
#
# Breadth probe. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; corners already asserted by §1.8 appear
# as excluded_because stubs naming the covering difficulty instance.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: filtersku_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds: [entities.FilterSku, endpoints.POST_filter-skus]
        distinguishing_aspect: "A POST carrying all seven required inputs returns 201 with the catalog row fully populated, status defaulted to ACTIVE and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock has been pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_id: "$.data.id" }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "FilterSku.${sku_id}.sku_code == SKU-16251-M8 and size_code == 16x25x1"
            - "FilterSku.${sku_id}.thickness_inches == 1, merv_rating == 8, unit_cost_cents == 680, ship_weight_oz == 14, pack_quantity == 1"
            - "FilterSku.${sku_id}.status == ACTIVE (declared default)"
            - "FilterSku.${sku_id}.version == 1 and id is a bare UUID with no type prefix"

      - name: property_retrieval_returns_stored_and_defaulted_fields
        claim_type: retrieval
        grounds: [entities.Property, endpoints.GET_properties_id]
        distinguishing_aspect: "GET /properties/{id} echoes every stored input plus the three system fields at their declared defaults (ONBOARDING, 0, 0)."
        test_recipe:
          setup:
            - "One property has been created and nothing else has happened to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: ProgramOperator
          assert:
            - "HTTP 200 with Property.${prop_id}.name == Cedar Ridge and state_code == TX"
            - "Property.${prop_id}.billing_mode == PM_BILLED, benefit_tier == PLUS, damage_waiver_enabled == true, aqg_enabled == true, credit_limit_cents == 5000000"
            - "Property.${prop_id}.status == ONBOARDING, suspend_reason == null, outstanding_balance_cents == 0, unit_count == 0"
            - "Property.${prop_id}.version == 1"

      - name: subscriptions_list_reports_total_count_has_more_and_honours_filters
        claim_type: listing
        grounds: [endpoints.GET_subscriptions, response_envelope.pagination_fields]
        distinguishing_aspect: "Two PENDING_SETUP subscriptions at one property: limit 1 offset 0 returns one row with total_count 2 and has_more true, offset 1 flips has_more to false, and a resident_id filter narrows total_count to 1."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' is ACTIVE with units A-101 and A-102 and one ACTIVE 16x25x1 MERV 8 SKU."
            - "Residents Ada and Ben each hold exactly one PENDING_SETUP subscription (neither was activated)."
            - "Logical clock stands at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-102", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_b_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ben Ortiz", email: "ben.ortiz@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_b_id}", unit_id: "${unit_b_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_b_id: "$.data.id" }
          trigger:
            - call: "GET /subscriptions"
              payload: { property_id: "${prop_id}", status: "PENDING_SETUP", limit: 1, offset: 0 }
              as: ProgramOperator
            - call: "GET /subscriptions"
              payload: { property_id: "${prop_id}", status: "PENDING_SETUP", limit: 1, offset: 1 }
              as: ProgramOperator
            - call: "GET /subscriptions"
              payload: { resident_id: "${res_b_id}" }
              as: ProgramOperator
          assert:
            - "the first list call returns response_type array with exactly 1 element, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "the second list call returns exactly 1 element, total_count == 2, has_more == false, offset == 1"
            - "the two calls together return ${sub_a_id} and ${sub_b_id} with no duplicate and no omission"
            - "the resident_id filter returns exactly 1 element (${sub_b_id}) with total_count == 1 and has_more == false"
            - "the resident_id call applies the default limit 10 and default offset 0"

      - name: get_subscription_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [errors.ERR_SUBSCRIPTION_NOT_FOUND, validations.priority_3]
        distinguishing_aspect: "A syntactically valid UUID that matches no row yields ERR_SUBSCRIPTION_NOT_FOUND 404 in the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "GET /subscriptions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_SUBSCRIPTION_NOT_FOUND"
            - "the response carries a human-readable data.message and the standard meta block"

      - name: create_resident_without_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Resident.fields.email, errors.ERR_INVALID_REQUEST, validations.priority_5]
        distinguishing_aspect: "email is source input with no default, so omitting it is rejected with ERR_INVALID_REQUEST 400 and no Resident row is created."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Resident row exists afterwards"

      - name: shipment_quantity_defaults_to_filters_per_shipment_when_omitted
        claim_type: defaults
        grounds: [endpoints.POST_subscriptions_id_shipments, entities.Shipment.fields.quantity, calculations.filters_per_shipment]
        distinguishing_aspect: "quantity is optional on shipment creation; omitting it copies Subscription.filters_per_shipment (2 for a two-slot unit on a pack_quantity 1 SKU) rather than defaulting to 1."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' is ACTIVE, PM_BILLED, PLUS with both flags on and credit_limit_cents 5000000; the only SKU is 16x25x1 MERV 8 at 680 cents with pack_quantity 1."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2, so filters_per_shipment is 2 and ship_cadence_days is 75."
            - "The subscription was activated on 2026-08-05, so shipment #1 is SCHEDULED for 2026-08-05 and 2026-10-19 is the first cadence-legal follow-up date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions/${sub_a_id}/shipments"
              payload: { scheduled_ship_date: "2026-10-19" }
              as: ProgramOperator
              captures: { ship2_id: "$.data.id" }
          assert:
            - "HTTP 201 with Shipment.${ship2_id}.quantity == 2, copied from Subscription.${sub_a_id}.filters_per_shipment"
            - "Shipment.${ship2_id}.status == SCHEDULED, sequence_number == 2, sku_id == ${sku_m8_id}"
            - "Shipment.${ship2_id}.tracking_code == null because the optional field was omitted"
            - "Shipment.${ship2_id}.version == 1"

      - name: subscription_computed_pricing_fields_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.Subscription.fields.monthly_fee_cents, entities.Subscription.fields.ship_cadence_days, calculations.monthly_fee_cents]
        distinguishing_aspect: "monthly_fee_cents, ship_cadence_days, filters_per_shipment and assigned_sku_id are source computed; client-supplied values for them are discarded and the §1.3 results (3546 / 75 / 2) are stored instead."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' is ACTIVE, PM_BILLED, PLUS with both flags on; the only SKU is 16x25x1 MERV 8 at 680 cents."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2 and resident Ada has household_size 3 with no flags."
            - "Logical clock stands at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31", monthly_fee_cents: 99, ship_cadence_days: 999, filters_per_shipment: 42 }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
          assert:
            - "HTTP 201 and Subscription.${sub_a_id}.monthly_fee_cents == 3546, NOT the supplied 99"
            - "Subscription.${sub_a_id}.ship_cadence_days == 75, NOT the supplied 999"
            - "Subscription.${sub_a_id}.filters_per_shipment == 2, NOT the supplied 42"
            - "Subscription.${sub_a_id}.assigned_sku_id == ${sku_m8_id} and property_id == ${prop_id}, both resolved server-side"

      - name: filtersku_system_fields_client_extra_field_ignored
        claim_type: system_fields
        grounds: [entities.FilterSku, complexity_profile.consistency_model]
        distinguishing_aspect: "id, created_at, updated_at, version and status are server-minted; supplying them in the body changes nothing and the server keeps its own values."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1, id: "99999999-9999-4999-8999-999999999999", version: 77, status: "DISCONTINUED" }
              as: ProgramOperator
              captures: { sku_id: "$.data.id" }
          assert:
            - "HTTP 201 and the returned id is NOT 99999999-9999-4999-8999-999999999999"
            - "FilterSku.${sku_id}.version == 1, not the supplied 77"
            - "FilterSku.${sku_id}.status == ACTIVE, not the supplied DISCONTINUED"
            - "created_at and updated_at are ISO 8601 UTC values minted by the server"

      - name: create_unit_with_unknown_system_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Unit.fields.hvac_system_type, errors.ERR_INVALID_REQUEST, validations.priority_5]
        distinguishing_aspect: "hvac_system_type is constrained to four members; MINI_SPLIT is not one of them, so the create is rejected with ERR_INVALID_REQUEST 400 and unit_count stays 0."
        test_recipe:
          setup:
            - "One property exists in ONBOARDING with unit_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "MINI_SPLIT", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Unit row was created and Property.${prop_id}.unit_count == 0"
            - "Property.${prop_id}.version is unchanged at 1"

      - name: runtime_reading_immutable_row_carries_no_version_field
        claim_type: immutability
        grounds: [entities.RuntimeReading, endpoints.POST_units_id_runtime-readings]
        distinguishing_aspect: "RuntimeReading declares common_fields false, so the row exposes only id and created_at — no version, no updated_at — and §1.5 offers no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' is ACTIVE with unit A-101 (TWO_STAGE, two slots)."
            - "Logical clock stands at 2026-08-07T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-08T00:00:00Z", runtime_minutes: 168, static_pressure_delta_pa: 100, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
              captures: { reading_id: "$.data.id" }
          assert:
            - "HTTP 201 and the RuntimeReading response contains id and created_at"
            - "the response contains NO version field and NO updated_at field"
            - "RuntimeReading.${reading_id}.unit_id == ${unit_a_id}, runtime_minutes == 168, static_pressure_delta_pa == 100, source == PRESSURE_SENSOR"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint for RuntimeReading, so the row can never be amended"

      - name: create_unit_under_unknown_property_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Unit.parent, errors.ERR_PROPERTY_NOT_FOUND, validations.priority_3]
        distinguishing_aspect: "The nested create resolves its parent from the path; an unknown property id yields ERR_PROPERTY_NOT_FOUND 404 before any body validation runs."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no property has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /properties/22222222-2222-4222-8222-222222222222/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "no Unit row was created"

      - name: create_subscription_with_unknown_unit_id_not_found
        claim_type: flat
        grounds: [entities.Subscription.fields.unit_id, errors.ERR_UNIT_NOT_FOUND, validations.priority_3]
        distinguishing_aspect: "Entity topology is flat, so cross-aggregate FK ids arrive in the body; a body unit_id that resolves to nothing is rejected with ERR_UNIT_NOT_FOUND 404 even though the resident id is perfectly valid."
        test_recipe:
          setup:
            - "One ACTIVE SKU and one registered resident exist; no unit matches the id in the request body."
            - "Logical clock stands at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions"
