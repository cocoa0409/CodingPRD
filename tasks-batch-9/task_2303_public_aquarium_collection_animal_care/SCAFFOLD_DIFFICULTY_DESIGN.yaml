      trigger:
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-07-31T10:00:00Z', ends_at: '2026-07-31T11:00:00Z', max_guests: 6, guest_count: 9, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-01T00:00:00Z', ends_at: '2026-08-01T01:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err2: $.data.error_id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 9, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err3: $.data.error_id}
      - call: GET /aquarium/exhibits/${ex_id}/interaction-sessions
        payload: {}
        as: AquaristTechnician
      assert:
      - trigger[0] returns 422 ERR_SESSION_IN_PAST, NOT ERR_GUEST_CAPACITY_EXCEEDED, although guest_count 9 > max_guests 6 also holds
      - 'trigger[1] returns 422 ERR_SESSION_IN_PAST as well: the rule is strict, starts_at exactly equal to clock_now is not in the future'
      - trigger[2] (window moved to 2026-08-02, same 9-over-6 overload) returns 422 ERR_GUEST_CAPACITY_EXCEEDED at priority 38
      - trigger[3] returns total_count == 0 — none of the three rejected requests created a row
      - the exhibit is OPEN with interaction_program_enabled true, so priorities 15 and 18 never fire
      - no session exists on the exhibit, so the priority 34 buffer rule never fires either
      - Exhibit.suspended_session_count stays 0 and Exhibit.version is unchanged by all three rejections
- rule_id: boundary_precision_check
  rationale: Three different comparison operators on three different quantities, each probed at the boundary value and one representable step either side.
  instances:
  - name: boundary_ammonia_ratio_exactly_two_flips_warning_to_critical
    grounds:
    - §1.3 water_quality_index constants AMMONIA_WARN 0.020, AMMONIA_CRIT 0.050, WARNING_RATIO 1.0, CRITICAL_RATIO 2.0
    - §1.1 WaterQualityReading.water_quality_index_snapshot / severity / breach_parameters
    - §1.2 LifeSupportSystem NORMAL -> NORMAL, NORMAL -> WARNING, WARNING -> CRITICAL
    - §1.5 POST /aquarium/life-support-systems/{id}/water-quality-readings
    distinguishing_aspect: Both severity comparisons are >=, and the ammonia ratio is a linear map of the raw reading, so the three probes 0.020 / 0.0485 / 0.050 land on ratio exactly 0.0, 1.9 and exactly 2.0. A reading sitting exactly ON the WARN limit is NOT a breach (ratio 0.0, index 100.00), while a reading sitting exactly ON the CRIT limit IS CRITICAL. Implementing either comparison as strict > gives 100.00/NORMAL for the third probe or a WARNING band for the first.
    test_recipe:
      setup: One COLD_MARINE plant with every other parameter pinned exactly at its habitat target, so the ammonia ratio is the ONLY non-zero ratio and it is simultaneously the sum term and the max term. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
