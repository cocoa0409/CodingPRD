          - entities.ExemptionApplication.fields.status
        distinguishing_aspect: "POST /exemption-applications/{id}/submit on a DRAFT application returns 200 with status SUBMITTED and version 2, and it does not skip ahead to UNDER_REVIEW because no VerificationCheck has been recorded yet."
        test_recipe:
          setup:
            - "ReliefProgram HOMESTEAD_BASIC is OPEN, Parcel P1 and TaxpayerAccount T exist."
