# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2619_corporate_fitness_center_management
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves
# into SCAFFOLD.yaml §1.1–§1.7; every numeric assert below was computed by
# executing the referenced calculations[].formula with its constants.
# Logical clock default is 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: invoice_management_fee_variant_flat_fee_minus_coverage_penalty
        grounds:
          - calculations.monthly_invoice_amounts
          - calculations.coverage_shortfall_penalty
          - entities.MonthlyInvoice.fields.fee_structure_snapshot
          - entities.MonthlyInvoice.fields.coverage_penalty_cents
          - entities.ClientContract.fields.pending_penalty_cents
          - state_machines.ProgramSession.SCHEDULED_to_CANCELLED_NO_COVER
          - concurrency_rules[invoice-draft-stale-contract]
        distinguishing_aspect: |
          Money domain (MonthlyInvoice x ClientContract ledger): the
          MANAGEMENT_FEE variant of calculations.monthly_invoice_amounts bills the
          contracted flat fee and deducts a coverage penalty, producing
          net_amount_cents == 39400 with admin_markup_cents == 0 and
          volume_credit_cents == 0 — structurally different fields from the
          COST_PLUS variant, which on this same calculation fills a markup and a
          volume credit and never deducts a coverage penalty.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE MANAGEMENT_FEE contract for Axle Logistics, management_fee_cents = 40000, not_to_exceed_cents null."
            - "Site manager with a VERIFIED CPR_AED credential; one READY AED in Studio A; one instructor with a VERIFIED GROUP_EX_CERT and a 2026-07-15 drill."
            - "One ACTIVE offering; two sessions scheduled and then cancelled with cancel_reason NO_COVER, so contract.uncovered_session_count == 2 and contract.pending_penalty_cents == 600."
            - "No session ever completed, so labor_subtotal_cents and program_direct_cost_cents are both 0; no asset downtime, so downtime_credit_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Axle Logistics", site_code: "AXL-01", fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 2.0, participation_target_pct: 30, term_start_on: "2026-07-01", term_end_on: "2027-06-30", management_fee_cents: 40000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /facility-rooms"
              payload: { contract_id: "${c_id}", room_name: "Studio A", room_type: "STUDIO", max_occupancy: 20 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { room_a_id: $.data.id }
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_id}", room_id: "${room_a_id}", asset_type: "AED", asset_tag: "AED-01", pad_expiry_on: "2027-03-31", battery_expiry_on: "2027-03-31", last_inspection_on: "2026-07-20" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { aed_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Ravi Patel", role_type: "GROUP_EX_INSTRUCTOR", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 4700 }
              as: OperatorAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${inst1_id}", credential_type: "GROUP_EX_CERT", issuer: "ACE", credential_number: "ACE-4410", expires_on: "2027-05-31" }
