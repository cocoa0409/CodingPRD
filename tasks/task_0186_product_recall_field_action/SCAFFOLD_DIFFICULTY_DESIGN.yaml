  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Lot serial range: closed-interval, touching endpoints collide -----
      - name: lot_serial_range_closed_interval_touch_collision
        grounds:
          - validations[priority=26]
          - entities.Lot.fields.serial_start
          - entities.Lot.fields.serial_end
          - errors[ERR_LOT_RANGE_OVERLAP]
        distinguishing_aspect: >
          A second Lot [100..200] for the same product collides with an existing
          [1..100] because Lot ranges are CLOSED intervals and serial 100 cannot
          belong to two lots (touching endpoints collide) — a closed-interval
          overlap on the Lot resource.
        test_recipe:
          setup:
            - "Product with Lot L1 covering serials [1..100]."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-OV1", name: "Battery", regulator: "CPSC", unit_list_price_cents: 2500 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "OV-A", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "OV-B", serial_start: 100, serial_end: 200 }
              as: RecallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_LOT_RANGE_OVERLAP"

      # --- Recall serial window: unbounded/half-open semantics ---------------
      - name: recall_window_unbounded_overlap_on_same_product
        grounds:
          - validations[priority=27]
          - entities.Recall.fields.serial_filter_start
          - entities.Recall.fields.serial_filter_end
          - errors[ERR_RECALL_WINDOW_OVERLAP]
        distinguishing_aspect: >
          A second non-terminal Recall on the same product with an UNBOUNDED window
          (no serial_filter) overlaps an existing recall's bounded [1..50] window,
          because null bounds extend to -/+ infinity — half-open/unbounded interval
          semantics on the Recall resource, geometrically different from Lot's finite
          closed ranges and on a different entity.
        test_recipe:
          setup:
            - "Product with Recall R1 (non-terminal) whose window is serial_filter [1..50]."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-OV2", name: "Cable", regulator: "CPSC", unit_list_price_cents: 2500 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "OV2-A", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "fray", hazard_severity: "MINOR", serial_filter_start: 1, serial_filter_end: 50 }
              as: RecallCoordinator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "fray-2", hazard_severity: "MINOR" }
              as: RecallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_RECALL_WINDOW_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Conserved: recovered_unit_count returns to 0 after cancel ---------
      - name: cancel_return_restores_recovered_count_invariant
        grounds:
          - state_machines.Disposition.logistics:PENDING_to_logistics:RETURNED
          - state_machines.Disposition.logistics:PENDING_to_logistics:CANCELLED
          - calculations.effectiveness_recompute
          - entities.Recall.fields.recovered_unit_count
        distinguishing_aspect: >
          Forward action receive-return raises Recall.recovered_unit_count by 1;
          its compensating action cancel (on the SAME disposition) must leave
          recovered_unit_count == its pre-return value. Conserved quantity:
          recovered_unit_count = count(Disposition d where d.recall_id==recall.id
          AND d.logistics_status IN {RETURNED,REPLACED}).
        test_recipe:
          setup:
            - "Recall CLASS_II announced & MONITORING; one affected RETURN disposition; recovered_unit_count starts 0."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CI1", name: "Helmet", regulator: "CPSC", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "CI1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CCI", contact_channel: "EMAIL", contact_address: "ci@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 4, customer_id: "${cust}", sale_price_cents: 5000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "crack", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d16: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit}", disposition_type: "RETURN", expected_recall_version: "${rcv_d16}" }
              as: FieldServiceAgent
              captures: { d: $.data.id }
            - call: "POST /dispositions/${d}/receive-return"
              payload: {}
              as: FieldServiceAgent
          trigger:
            - call: "POST /dispositions/${d}/cancel"
              payload: {}
              as: FieldServiceAgent
            - call: "GET /recalls/${rc}"
              payload: {}
              as: RecallCoordinator
              captures: { rec: $.data.recovered_unit_count, eff: $.data.effectiveness_pct }
          assert:
            - "Recall.${rc}.recovered_unit_count == 0"
            - "Recall.${rc}.effectiveness_pct == 0"

      # --- Conserved: total_refund_cents unaffected by VOID compensation -----
      - name: cancel_owed_voids_without_touching_refund_ledger_invariant
        grounds:
          - state_machines.Disposition.financial:NOT_OWED_to_financial:OWED
          - state_machines.Disposition.logistics:PENDING_to_logistics:CANCELLED
          - calculations.refund_ledger_recompute
          - entities.Recall.fields.total_refund_cents
        distinguishing_aspect: >
          Accruing a refund (NOT_OWED->OWED) never adds to total_refund_cents (only
          settle does); cancelling the OWED disposition VOIDs the liability and must
          leave total_refund_cents == 0. Conserved quantity: total_refund_cents =
          sum(d.refund_amount_cents where d.financial_status==REFUNDED) — a different
          conserved quantity (settled refund cents) than recovered_unit_count.
        test_recipe:
          setup:
            - "Recall CLASS_II announced & MONITORING; REFUND disposition RETURNED then OWED; nothing settled."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CI2", name: "Scooter", regulator: "CPSC", unit_list_price_cents: 15000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "CI2", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CCI2", contact_channel: "EMAIL", contact_address: "ci2@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 6, customer_id: "${cust}", sale_price_cents: 15000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "brake", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d17: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit}", disposition_type: "REFUND", refund_basis: "SALE_PRICE", expected_recall_version: "${rcv_d17}" }
              as: FieldServiceAgent
              captures: { d: $.data.id }
            - call: "POST /dispositions/${d}/receive-return"
              payload: {}
              as: FieldServiceAgent
            - call: "POST /dispositions/${d}/accrue-refund"
              payload: {}
              as: FinanceClerk
          trigger:
            - call: "POST /dispositions/${d}/cancel"
              payload: {}
              as: FieldServiceAgent
              captures: { fin: $.data.financial_status }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: RecallCoordinator
              captures: { ledger: $.data.total_refund_cents }
          assert:
            - "Disposition.${d}.financial_status == VOID"
            - "Recall.${rc}.total_refund_cents == 0"
