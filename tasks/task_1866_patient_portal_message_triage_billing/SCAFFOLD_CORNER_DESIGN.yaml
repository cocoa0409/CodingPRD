# =============================================================================
# Task 1866 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide.
# §1.8-covered corners appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_plan_conditional_fields_and_defaults
        claim_type: required_fields
        grounds:
          - "entities.Patient.fields.copay_cents"
          - "entities.Patient.fields.coinsurance_pct"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "COPAY without copay_cents is rejected; a COINSURANCE patient is created with computed defaults outstanding_billed_cents == 0 and education_gate_open == false."
        test_recipe:
          setup: ["Empty DB; PracticeAdmin is opaque (no staff record needed)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /inbox/patients", payload: { full_name: "NoCopay", plan_type: "COPAY" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Coins", plan_type: "COINSURANCE", coinsurance_pct: 0.25 }, as: PracticeAdmin, captures: { pat: "$.data.id", out0: "$.data.outstanding_billed_cents", gate0: "$.data.education_gate_open" } }
          assert:
            - "COPAY without copay_cents: error_id == ERR_INVALID_REQUEST (400)"
            - "COINSURANCE with coinsurance_pct: 201; outstanding_billed_cents == 0; education_gate_open == false; version == 1"

      - name: message_creation_system_fields_and_default_clock
        claim_type: system_fields
        grounds:
          - "entities.PortalMessage.fields.received_at"
          - "entities.PortalMessage.fields.status"
          - "entities.PortalMessage.fields.billing_disposition"
        distinguishing_aspect: "Without any clock-set call the logical clock defaults to 2026-08-01T00:00:00Z, so received_at equals that literal; new messages start RECEIVED / UNDETERMINED / reopen_count 0 / sla_breached false."
        test_recipe:
          setup: ["Patient exists; logical clock NEVER set (startup default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/portal-messages", payload: { subject: "Hello", body: "First" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", rcv: "$.data.received_at", st: "$.data.status" } }
          assert:
            - "received_at == 2026-08-01T00:00:00Z (default logical clock, not wall clock)"
            - "status == RECEIVED (initial state); billing_disposition == UNDETERMINED; reopen_count == 0; sla_breached == false; urgency == null; category == null"
            - "id is a server-minted UUID with no type prefix; version == 1"

      - name: message_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a well-formed but nonexistent message UUID returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["Nurse staff exists"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
          trigger:
            - { call: "GET /inbox/portal-messages/00000000-0000-4000-8000-000000000000", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["http 404; error_id == ERR_NOT_FOUND; response_type == error"]

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assign_before_triage_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PortalMessage.TRIAGED_to_ASSIGNED"
          - "errors[ERR_MESSAGE_INVALID_STATE]"
        distinguishing_aspect: "assign requires status TRIAGED; on a fresh RECEIVED message it is rejected and no assignee is set."
        test_recipe:
          setup: ["Nurse exists; message in RECEIVED"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_MESSAGE_INVALID_STATE (409)", "message stays RECEIVED with assignee_id null"]

      - name: complete_from_triaged_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PortalMessage.IN_REVIEW_to_RESOLVED"
          - "errors[ERR_MESSAGE_INVALID_STATE]"
        distinguishing_aspect: "complete requires IN_REVIEW; a TRIAGED message (never claimed) cannot be completed even by the pool's nurse."
        test_recipe:
          setup: ["Nurse pool + coverage; message TRIAGED to nurse pool (no assignee)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "too early" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_MESSAGE_INVALID_STATE (409)", "message stays TRIAGED"]

      - name: patient_reply_on_in_review_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PortalMessage.RESOLVED_to_REOPENED"
          - "errors[ERR_MESSAGE_INVALID_STATE]"
        distinguishing_aspect: "Patient reply reopens only from RESOLVED; a patient reply while the message is IN_REVIEW is rejected and does not change status or counts."
        test_recipe:
          setup: ["Message IN_REVIEW with nurse assignee (nurse pool, wide coverage)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/reply", payload: { body: "are you there?" }, as: Patient, as_user_id: "${pat}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_MESSAGE_INVALID_STATE (409)", "message stays IN_REVIEW; reopen_count == 0; nurse open_inbox_count unchanged == 1"]

      - name: closed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PortalMessage.RESOLVED_to_CLOSED"
          - "errors[ERR_MESSAGE_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal: after close, patient reply and re-triage are both rejected with ERR_MESSAGE_INVALID_STATE."
        test_recipe:
          setup: ["Administrative message RESOLVED then CLOSED by the nurse (no claim in flight)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "done" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/close", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { st_closed: "$.data.status" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/reply", payload: { body: "ping" }, as: Patient, as_user_id: "${pat}", captures: { err1: "$.data.error_id" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v2}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "close succeeded: status == CLOSED"
            - "patient reply on CLOSED: error_id == ERR_MESSAGE_INVALID_STATE (409)"
            - "triage on CLOSED: error_id == ERR_MESSAGE_INVALID_STATE (409) — terminal lockdown (state check precedes the OCC version check would only matter on non-terminal states; here the version was re-read fresh)"

      - name: consent_respond_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ConsentRecord.REQUESTED_to_GRANTED"
          - "errors[ERR_CONSENT_ALREADY_RESPONDED]"
        distinguishing_aspect: "A GRANTED consent is terminal for responses; a second respond call is rejected with ERR_CONSENT_ALREADY_RESPONDED."
        test_recipe:
          setup: ["Full determination flow: 8 provider minutes, consent REQUESTED, then GRANTED"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat}", captures: { c_st: "$.data.status" } }
          trigger:
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "DECLINED" }, as: Patient, as_user_id: "${pat}", captures: { err: "$.data.error_id" } }
          assert:
            - "first respond: status == GRANTED, responded_at set, message back to IN_REVIEW with billing_disposition == CHARGEABLE"
            - "second respond: error_id == ERR_CONSENT_ALREADY_RESPONDED (409); consent stays GRANTED"

      - name: cosign_return_loops_back_to_in_review
        claim_type: valid_transition
        grounds:
          - "state_machines.PortalMessage.PENDING_COSIGN_to_IN_REVIEW"
          - "state_machines.PortalMessage.IN_REVIEW_to_PENDING_COSIGN"
        distinguishing_aspect: "The RETURN branch of cosign moves PENDING_COSIGN -> IN_REVIEW with the delegate retained as assignee and pending_cosign_by cleared — a branching fork with distinct side effects from COSIGN."
        test_recipe:
          setup: ["Provider P2 delegates pool to nurse N1; CLINICAL message completed by N1 -> PENDING_COSIGN with pending_cosign_by_id == P2"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse T", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_tri: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse D", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_del: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P2", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n_del}", pool_id: "${pool_p}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: Provider, as_user_id: "${p2}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${n_del}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${n_del}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "draft advice" }, as: TriageNurse, as_user_id: "${n_del}", captures: { st_pc: "$.data.status", pc_by: "$.data.pending_cosign_by_id" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/cosign", payload: { action: "RETURN" }, as: Provider, as_user_id: "${p2}", captures: { st_ir: "$.data.status" } }
            - { call: "GET /inbox/staff/${n_del}", payload: {}, as: Provider, as_user_id: "${p2}", captures: { nd_cnt: "$.data.open_inbox_count" } }
          assert:
            - "complete by delegate on CLINICAL message: status == PENDING_COSIGN and pending_cosign_by_id == ${p2}"
            - "RETURN: status == IN_REVIEW, pending_cosign_by_id == null, assignee_id unchanged == ${n_del}"
            - "open_inbox_count of delegate unchanged == 1 (both statuses are in the counted set)"

      - name: escalate_acknowledge_moves_message_to_in_review
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Escalation.OPEN_to_ACKNOWLEDGED"
          - "state_machines.PortalMessage.ESCALATED_to_IN_REVIEW"
          - "errors[ERR_ESCALATION_INVALID_STATE]"
        distinguishing_aspect: "Acknowledgement flips the escalation to ACKNOWLEDGED and the message to IN_REVIEW with the on-call provider retained; a second acknowledge is rejected."
        test_recipe:
          setup: ["URGENT message TRIAGED to provider pool; on-call shift for P3 covers 10:00"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P3", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${p3}", start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T20:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "after-hours urgent" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { esc: "$.data.id", esc_st: "$.data.status" } }
          trigger:
            - { call: "POST /inbox/escalations/${esc}/acknowledge", payload: {}, as: Provider, as_user_id: "${p3}", captures: { ack_st: "$.data.status", ack_at: "$.data.acknowledged_at" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${p3}", captures: { m_st: "$.data.status", m_asg: "$.data.assignee_id" } }
            - { call: "POST /inbox/escalations/${esc}/acknowledge", payload: {}, as: Provider, as_user_id: "${p3}", captures: { err: "$.data.error_id" } }
          assert:
            - "escalate: Escalation status == OPEN with provider_id == ${p3}; message ESCALATED with assignee ${p3}"
            - "acknowledge: status == ACKNOWLEDGED, acknowledged_at == 2026-08-03T10:00:00Z; message status == IN_REVIEW with assignee retained == ${p3}"
            - "second acknowledge: error_id == ERR_ESCALATION_INVALID_STATE (409)"

      - name: escalate_routine_urgency_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_URGENCY_NOT_ESCALATABLE]"
        distinguishing_aspect: "Escalation is gated on urgency IN {URGENT, EMERGENT}; a ROUTINE message is rejected even when on-call coverage exists."
        test_recipe:
          setup: ["ROUTINE message TRIAGED; provider on call"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P3", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${p3}", start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T20:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "not urgent" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_URGENCY_NOT_ESCALATABLE (409)", "no Escalation created: GET /inbox/escalations?message_id=${m} total_count == 0"]

      - name: reopen_side_effects_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - "state_machines.PortalMessage.RESOLVED_to_REOPENED"
        excluded_because:
          difficulty_instance: message_resolved_reopen_retriage_cycle
          rationale: "Reopen counter increment, assignee retention, and count re-increment are asserted in the named §1.8 instance's recipe."

      - name: claim_denial_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - "state_machines.EVisitClaim.SUBMITTED_to_DENIED"
        excluded_because:
          difficulty_instance: claim_denial_reopens_message_and_trips_overload
          rationale: "The 3-hop denial cascade (message reopen -> count increment -> overload flip) is asserted hop-by-hop in the named §1.8 instance."

      - name: claim_paid_autoclose_covered_by_difficulty
        claim_type: side_effect_execution
        grounds:
          - "state_machines.EVisitClaim.SUBMITTED_to_PAID"
          - "state_machines.PortalMessage.RESOLVED_to_CLOSED"
        excluded_because:
          difficulty_instance: claim_denied_rework_resubmit_cycle
          rationale: "The PAID auto-close of the RESOLVED message is asserted at the end of the named §1.8 instance (message.status == CLOSED)."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: clinical_minutes_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - "calculations.clinical_minutes_total"
          - "entities.PortalMessage.fields.clinical_minutes_total"
        distinguishing_aspect: "Only CLINICAL_REVIEW entries by PROVIDER-typed staff count: nurse clinical entries and provider ADMINISTRATIVE entries are excluded from clinical_minutes_total."
        test_recipe:
          setup: ["Message IN_REVIEW assigned to provider P (provider pool, P coverage)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 6 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 4 }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "ADMINISTRATIVE", minutes: 3 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { cmt: "$.data.clinical_minutes_total" } }
          assert:
            - "clinical_minutes_total == 6 (provider CLINICAL_REVIEW only; nurse's 4 CLINICAL excluded by staff_type, provider's 3 ADMINISTRATIVE excluded by entry_kind)"
            - "all three entries exist: GET /inbox/time-entries?message_id=${m} total_count == 3"

      - name: from_receipt_retriage_keeps_original_base
        claim_type: variant_selection
        grounds:
          - "calculations.response_deadline"
          - "entities.Pool.fields.deadline_policy"
        distinguishing_aspect: "Under FROM_RECEIPT, re-triage recomputes response_due_at from the ORIGINAL received_at, so the deadline is invariant across re-triage (unlike FROM_TRIAGE, where it moves — asserted in §1.8)."
        test_recipe:
          setup: ["FROM_RECEIPT pool, urgent 120; message received 2026-08-03T09:30:00Z; triaged at 10:00 (due 11:30)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_RECEIPT" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { due1: "$.data.response_due_at" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: PracticeAdmin }
          trigger:
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v2}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { due2: "$.data.response_due_at" } }
          assert:
            - "due after first triage == 2026-08-03T11:30:00Z (received 09:30 + 120m — NOT triaged 10:00 + 120m)"
            - "due after re-triage at 11:00 == 2026-08-03T11:30:00Z (unchanged: FROM_RECEIPT keeps the original base)"
            - "${due1} == ${due2}"

      - name: overload_flag_boundary_at_threshold
        claim_type: constants_applied
        grounds:
          - "calculations.overload_flag"
          - "entities.StaffMember.fields.inbox_overloaded"
        distinguishing_aspect: "Overload threshold is >= 5: at exactly 4 open messages the flag is false; the 5th assignment flips it true; completing one drops it back to false."
