  # =========================================================================
  # STATE MACHINES
  # =========================================================================
  - section: state_machines
    instances:

      - name: mit_pass_refreshes_the_due_date_and_lifts_the_well_out_of_mit_due
        claim_type: valid_transition
        grounds:
          - state_machines.Well.transitions.MIT_DUE_to_MIT_CURRENT
          - state_machines.MechanicalIntegrityTest.transitions.SCHEDULED_to_PASSED
          - global_constants.MIT_INTERVAL_DAYS
          - endpoints[POST /mechanical-integrity-tests/{id}/record-result]
        distinguishing_aspect: |
          The refresh is anchored on the MIT's recorded_at (the logical clock when the result was
          recorded), not on the scheduled window and not on the old due date: a well registered
          with last_mit_passed_at 2025-07-01T00:00:00Z is born MIT_DUE (mit_due_at 2026-07-01 is
          already behind the 2026-08-01 clock), and a PASS recorded at 2026-08-02T00:00:00Z moves
          last_mit_passed_at to that instant and mit_due_at to exactly 2027-08-02T00:00:00Z while
          also copying result_pressure_psig onto the well's casing_pressure_psig.
        test_recipe:
          setup:
            - "Field F_MINI with a single well MINI-1 whose last_mit_passed_at is 2025-07-01T00:00:00Z, so it is registered MIT_DUE."
            - "A PRESSURE_TEST is scheduled on MINI-1 for 2026-08-01T06:00:00Z to 2026-08-01T18:00:00Z; the clock is then moved to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2025-07-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-01T06:00:00Z", scheduled_end_at: "2026-08-01T18:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FieldOperator
          trigger:
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "PASS", result_pressure_psig: 1450 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /wells/${w1}"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "the record-result call returns HTTP 200 (not 201)"
            - "MechanicalIntegrityTest.${m1}.status == PASSED, outcome == PASS, result_pressure_psig == 1450"
            - "MechanicalIntegrityTest.${m1}.recorded_by_user_id == eng-a and recorded_at == 2026-08-02T00:00:00Z"
            - "Well.${w1}.integrity_state == MIT_CURRENT"
            - "Well.${w1}.last_mit_passed_at == 2026-08-02T00:00:00Z"
            - "Well.${w1}.mit_due_at == 2027-08-02T00:00:00Z"
            - "Well.${w1}.casing_pressure_psig == 1450"
            - "Well.${w1}.operational_state == IN_SERVICE, shut_in_reason == null, service_change_count == 0"
            - "StorageField.${f1}.field_posture == OPEN with max_withdrawal_rate_dth_per_day == 150000 and max_injection_rate_dth_per_day == 150000"

      - name: mit_inconclusive_closes_the_test_and_touches_neither_well_dimension
        claim_type: side_effect_execution
        grounds:
          - state_machines.Well.transitions.MIT_CURRENT_to_MIT_CURRENT
          - state_machines.MechanicalIntegrityTest.transitions.SCHEDULED_to_FAILED
          - endpoints[POST /mechanical-integrity-tests/{id}/record-result]
          - entities.RemediationProgram
        distinguishing_aspect: |
          INCONCLUSIVE shares the SCHEDULED -> FAILED test edge with FAIL yet fires NONE of FAIL's
          cascade: no RemediationProgram row is created, the well stays IN_SERVICE and MIT_CURRENT,
          last_mit_passed_at and mit_due_at are NOT refreshed (that is a PASS-only side effect),
          casing_pressure_psig is left at 0 even though a result pressure was supplied, and the
          field posture and rates are untouched.
        test_recipe:
          setup:
            - "Field F_MINI with a single MIT_CURRENT well MINI-1 (last_mit_passed_at 2026-06-01T00:00:00Z)."
            - "A NOISE_LOG is scheduled for 2026-08-01T06:00:00Z to 2026-08-01T18:00:00Z; the clock is moved to 2026-08-02T00:00:00Z."
