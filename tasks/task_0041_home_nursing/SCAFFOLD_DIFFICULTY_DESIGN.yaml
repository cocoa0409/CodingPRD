# =============================================================================
# Home Nursing Service — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Every grounds[] reference resolves to a declared element in the
# sibling SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_fee_estimated_vs_final
        grounds:
          - calculations.estimated_fee
          - calculations.final_settlement
          - entities.Order.fields.estimated_fee_cents
          - entities.Order.fields.final_fee_cents
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          The two calculations operate on the Order monetary domain: estimated_fee uses
          forward_looking inputs (planned scheduled_start and ServiceItem-default coords,
          package only projected), whereas final_settlement uses chronological inputs
          (accepted Dispatch.distance_km and ServiceRecord.checkin_at hour-of-day,
          package consumption confirmed) — same Order, two valid algorithms producing
          provably different cents on identical scenario inputs.
        test_recipe:
          setup:
            - "POST /service-items: code=IV001, base_price_cents=20000, required_skill=IV_INFUSION, requires_medical_doc=false, requires_eligibility_review=false, duration_minutes=30, active=true"
            - "POST /nurses: nurse N1 with home_lat=31.30, home_lng=121.40, specialty_tags=['IV_INFUSION'], revenue_share_bps=7000"
            - "Certify N1 (CERTIFIED) via POST /nurses/{id}/certification-records (kind=INITIAL, outcome=PASS, training_hours=24)"
            - "POST /_events/emit (system=identity-verification) so license_verified=true and hospital_affiliation_verified=true"
            - "POST /orders as Patient: service_lat=31.20, service_lng=121.40, scheduled_start=2026-06-01T10:00:00Z (Monday daytime)"
          trigger:
            - "Read Order.estimated_fee_cents immediately after POST /orders"
            - "Nurse N1 accepts the offered Dispatch (distance_km ≈ 11.119)"
            - "Nurse posts ServiceRecord with checkin_at=2026-06-01T22:30:00Z (NIGHT band)"
            - "Patient calls POST /orders/{id}/confirm-completion"
            - "Read GET /orders/{id}/settlement"
          assert:
            - "Order.estimated_fee_cents == 21200  # 20000 + 0 + 0 - 0 = 20000 net; +6% tax = 21200"
            - "Settlement.gross_fee_cents == 27400  # 20000 + 1400 distance + 6000 night surcharge"
            - "Settlement.tax_cents == 1644  # round_half_up(27400*0.06)"
            - "Order.estimated_fee_cents != Settlement.gross_fee_cents + Settlement.tax_cents"

      - name: nurse_rating_aggregate_vs_complaint_rating_impact
        grounds:
          - calculations.nurse_rating_aggregate
          - state_machines.Complaint.MEDIATION_to_RESOLVED
          - entities.Nurse.fields.rating
          - entities.Complaint.fields.rating_impact
        distinguishing_aspect: |
          This dual-variant operates on a different entity domain (Nurse reputation/quality)
          than the fee dual-variant: nurse_rating_aggregate computes a forward-looking
          window mean over the latest 50 ratings (5.00 default per COMPLETED order), while
          the Complaint MEDIATION→RESOLVED rating_impact applies a chronological signed
          delta in [-1.0, 0] keyed only on NURSE_RELATED routing — same Nurse, two
          different reduction algorithms producing different rating values for identical
          Complaint inputs.
        test_recipe:
          setup:
            - "Complete one Order for Nurse N1 with no complaint (rating contribution = 5.00)"
            - "Complete a second Order for Nurse N1 (rating contribution = 5.00 baseline)"
          trigger:
            - "Patient submits Complaint on order #2 with category=NURSE_MISCONDUCT"
            - "ComplianceOfficer triages → MEDIATION → resolves with decision=UPHOLD, rating_impact=-2.0 (clamped to -1.0)"
            - "Read GET /nurses/{N1}"
          assert:
            - "Complaint.rating_impact == -1.0  # clamped from -2.0"
            - "Nurse.rating == 4.50  # mean of [5.00, 4.00] over 2 entries"
            - "Without the complaint resolve, Nurse.rating would be 5.00 — confirming dual-variant"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2; modes from {a,b,c})
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: final_settlement_nested_rounding_order
        grounds:
          - calculations.final_settlement
          - entities.Settlement.fields.gross_fee_cents
          - entities.Settlement.fields.tax_cents
          - entities.Settlement.fields.nurse_revenue_share_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins
          'round_half_up per component THEN sum'. With base=20000, distance=11.119km,
          checkin=22:30 night, revenue_share_bps=7000: per-component yields
          distance_surcharge=1400 (ceil first, integer multiply), tod_surcharge=6000
          (round_half_up of 20000*0.30), gross=27400, tax=round(27400*0.06)=1644,
          nurse_share=round(27400*0.70)=19180. If instead the implementation summed
          fractional cents and rounded once, the nurse share would be 19180.0 (same
          here) but a different scenario with base=15000, distance=7.4 yields 1.2*7=
          rounding splits at line vs total. The scaffold explicitly forbids 'sum then
          round' to keep cents deterministic.
        test_recipe:
          setup:
            - "Identical setup to order_fee_estimated_vs_final, plus N1.revenue_share_bps=7000"
          trigger:
            - "Complete the Order; read GET /orders/{id}/settlement"
          assert:
            - "Settlement.gross_fee_cents == 27400"
            - "Settlement.tax_cents == 1644"
            - "Settlement.nurse_revenue_share_cents == 19180  # round_half_up(27400*0.70)"
            - "Settlement.platform_share_cents == 8220  # 27400 - 19180"

      - name: nurse_dispatch_score_combinatorial
        grounds:
          - calculations.nurse_dispatch_score
          - entities.Dispatch.fields.ranked_score
          - entities.Nurse.fields.rating
          - entities.Nurse.fields.max_daily_orders
        distinguishing_aspect: |
          MODE (a): formula with 4 inputs (distance_km, current_load, max_daily_orders,
          rating) and non-linear interaction via tiered weights and conditional
          eligibility filter. Two nurses N1 (distance=10km, load=2/6, rating=4.80) and
          N2 (distance=12km, load=0/6, rating=5.00): score(N1)=0.5*(10/15)+0.3*(2/6)+
          0.2*(0.20)=0.3333+0.1000+0.0400=0.4733; score(N2)=0.5*(12/15)+0.3*0+0.2*0=
          0.4000. N2 wins despite greater distance, because load and rating
          dominate — different from any single tiered-rate formula because the weights
          combine three independent signals plus an eligibility cutoff. Distinct mode
          from final_settlement's mode (b) nested rounding.
        test_recipe:
          setup:
            - "Two CERTIFIED nurses N1 (home 10km from service, currently in 2 in-progress orders, rating=4.80) and N2 (home 12km, no in-progress, rating=5.00). Both have IV_INFUSION specialty."
            - "POST /orders requesting IV_INFUSION at known coordinates"
          trigger:
            - "Read GET /orders/{id}/dispatches; observe which nurse the system selected"
          assert:
            - "exactly one Dispatch row exists"
            - "Dispatch.nurse_id == N2  # because score 0.4000 < 0.4733"
            - "Dispatch.ranked_score == 0.4000"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_status_payment_status_parallel
        grounds:
          - state_machines.Order.status
          - state_machines.Order.payment_status
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - state_machines.Order.AUTHORIZED_to_REFUNDED
        distinguishing_aspect: |
          PARALLEL state dimensions on the Order entity: status (SUBMITTED→…→COMPLETED|
          CANCELLED|REJECTED) and payment_status (UNPAID→AUTHORIZED→{CAPTURED,REFUNDED})
          evolve INDEPENDENTLY on the same row. status=CANCELLED with payment_status=
          REFUNDED is valid; status=COMPLETED with payment_status=AUTHORIZED is invalid.
          The two dimensions are independent enums, not a single linear chain.
        test_recipe:
          setup:
            - "Standard CERTIFIED nurse, ServiceItem, Patient setup"
          trigger:
            - "POST /orders → expect status=SUBMITTED|AWAITING_DISPATCH (depending on requires_eligibility_review) and payment_status=AUTHORIZED"
            - "POST /orders/{id}/cancel before any nurse accepts"
          assert:
            - "Order.status == CANCELLED"
            - "Order.payment_status == REFUNDED  # both dimensions advanced independently"

      - name: dispatch_cycle_via_reject_redispatch
        grounds:
          - state_machines.Dispatch.OFFERED_to_REJECTED
          - state_machines.Dispatch.OFFERED_to_EXPIRED
          - state_machines.Order.DISPATCHED_to_AWAITING_DISPATCH
          - calculations.nurse_dispatch_score
          - entities.Order.fields.dispatch_attempt_count
        distinguishing_aspect: |
          BRANCHING fork with revert: Order.AWAITING_DISPATCH→DISPATCHED→AWAITING_DISPATCH
          forms a cycle through Dispatch.OFFERED→REJECTED (or EXPIRED), creating an
          A→B→A loop on the Order status machine. Distinct entity from Order's
          parallel-dimension instance: this non-linearity is on the Dispatch+Order
          coupling, not on the parallel payment dimension.
        test_recipe:
          setup:
            - "Two CERTIFIED nurses N1 and N2 within radius for same ServiceItem"
            - "POST /orders → Dispatch d1 created for whichever ranks first"
          trigger:
            - "Nurse N1 calls POST /dispatches/{d1}/reject"
            - "Read GET /orders/{id}/dispatches"
          assert:
            - "Order.status == DISPATCHED → AWAITING_DISPATCH → DISPATCHED (after re-selector picks N2 and N2 accepts)"
            - "Order.dispatch_attempt_count == 2"
            - "First Dispatch d1.status == REJECTED, second Dispatch d2.status == ACCEPTED, d2.nurse_id != N1"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: nurse_disqualify_cascade_depth_4
        grounds:
          - state_machines.Nurse.CERTIFIED_to_DISQUALIFIED
          - state_machines.Dispatch.OFFERED_to_CANCELLED
          - state_machines.Order.DISPATCHED_to_AWAITING_DISPATCH
          - calculations.nurse_dispatch_score
          - state_machines.Order.AWAITING_DISPATCH_to_CANCELLED  # via empty pool
        distinguishing_aspect: |
          Trigger = ComplianceOfficer DISQUALIFIES Nurse N. Hop 1: Nurse.status
          PENDING/CERTIFIED/EXPIRING→DISQUALIFIED itself causes Hop 2: any OFFERED
          Dispatch row tied to N flips to CANCELLED. Hop 2's mutation on Dispatch
          itself causes Hop 3: the Order whose only remaining ACCEPTED dispatch is now
          gone re-runs the selector (Order.DISPATCHED→AWAITING_DISPATCH). Hop 3's
          re-selector exhaustion causes Hop 4: Order.AWAITING_DISPATCH→CANCELLED with
          ERR_NO_AVAILABLE_NURSE; that cancellation then refunds the AUTHORIZED
          payment. Each hop is caused by the previous hop, not by the original DISQUALIFY
          action — depth=4. Chain pinned in side_effects of the DISQUALIFICATION
          transition.
        test_recipe:
          setup:
            - "Single CERTIFIED Nurse N1 (only candidate for IV_INFUSION in radius)"
            - "POST /orders → Dispatch d1 OFFERED to N1"
          trigger:
            - "ComplianceOfficer POSTs disqualification record on N1"
          assert:
            - "Nurse.certification_status == DISQUALIFIED"
            - "Dispatch d1.status == CANCELLED"
            - "Order.status == CANCELLED  # selector empty after exclusion"
            - "Order.payment_status == REFUNDED  # cascaded refund"

      - name: completion_cascade_depth_3
        grounds:
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.ServiceRecord.AWAITING_PATIENT_CONFIRM_to_COMPLETED
          - calculations.final_settlement
          - entities.Settlement.fields.status
          - entities.Package.fields.used_credits
          - entities.Package.fields.status
        distinguishing_aspect: |
          Trigger = Patient confirm-completion. Hop 1: Order.IN_PROGRESS→COMPLETED
          itself causes Hop 2: ServiceRecord.AWAITING_PATIENT_CONFIRM→COMPLETED AND
          Settlement creation in FINALIZED. Hop 2 (Settlement create) itself causes
          Hop 3: Package.used_credits += 1 and (if reaches total_credits)
          Package.status→EXHAUSTED. Different trigger from disqualify cascade — depth
          is 3 along the Package side and propagates through ServiceRecord+Settlement
          along the financial side, demonstrating a separate propagation pattern.
        test_recipe:
          setup:
            - "Package P with patient_id=Patient1, total_credits=1, used_credits=0, status=ACTIVE"
            - "Order created using package_id=P, completed dispatch + service record"
          trigger:
            - "Patient calls POST /orders/{id}/confirm-completion"
          assert:
            - "Order.status == COMPLETED"
            - "ServiceRecord.status == COMPLETED"
            - "Settlement exists with status=FINALIZED, package_deduction_cents == ServiceItem.base_price_cents"
            - "Package.used_credits == 1, Package.status == EXHAUSTED"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_checkin
        grounds:
          - validations[priority=4]   # ERR_INVALID_STATE
          - validations[priority=10]  # ERR_CHECKIN_OUT_OF_RANGE
          - validations[priority=11]  # ERR_FACE_VERIFICATION_FAILED
        distinguishing_aspect: |
          Pair: state vs business_safety. A nurse calls POST /orders/{id}/service-record
          when (a) Order.status is CANCELLED (not DISPATCHED) AND (b) GPS is 5km away
          AND (c) face_verification_passed=false. Three checks fail simultaneously.
          Priority dictates state (priority=4) wins → ERR_INVALID_STATE, NOT the
          business_safety errors at priorities 10–11.
        test_recipe:
          setup:
            - "Create Order, Patient cancels before any acceptance (status=CANCELLED)"
            - "Nurse N1 (CERTIFIED) attempts to file service record"
          trigger:
            - "POST /orders/{id}/service-record with checkin coords 50km off and face_verification_passed=false"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE'  # priority 4 trumps 10 and 11"

      - name: business_referential_vs_business_temporal_dispatch
        grounds:
          - validations[priority=5]   # ERR_RESOURCE_LINK_INVALID
          - validations[priority=9]   # ERR_DISPATCH_WINDOW_EXPIRED
        distinguishing_aspect: |
          Pair: business_referential vs business_temporal — distinct from the previous
          pair. Nurse N2 attempts POST /dispatches/{d1}/accept where d1.nurse_id ≠ N2
          AND d1.accept_deadline already passed. The referential check (Dispatch.nurse_id
          == X-User-ID) at priority 5 fires before the temporal window check at
          priority 9.
        test_recipe:
          setup:
            - "Two nurses N1, N2; Order has Dispatch d1 to N1"
            - "Advance clock past d1.accept_deadline"
          trigger:
            - "Nurse N2 posts POST /dispatches/{d1}/accept"
          assert:
            - "HTTP 422"
            - "error_id == 'ERR_RESOURCE_LINK_INVALID'  # priority 5 trumps priority 9"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refund_window_tier_boundary_seconds
        grounds:
          - calculations.refund_calc
          - entities.Settlement.fields.refund_cents
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric boundary on a TIME metric reachable through POST /orders/{id}/refund.
          With Settlement.gross_fee_cents=27400 and tax=1644 (total=29044): at exactly
          1 hour (3600s) since completed_at, refund=29044 (full); at 1h+1ms (3601s),
          refund=round_half_up(29044*0.5)=14522; at exactly 24h, refund=
          round_half_up(29044*0.2)=5809; at 24h+1ms, ERR_REFUND_WINDOW_EXPIRED. The
          tier comparator is '<= boundary' inclusive on the lower tier.
        test_recipe:
          setup:
            - "Completed Order with Settlement(gross=27400, tax=1644, status=FINALIZED)"
          trigger:
            - "Advance clock to ServiceRecord.completed_at + 3600s; POST /orders/{id}/refund"
          assert:
            - "Settlement.refund_cents == 29044  # exactly 1h boundary inclusive on full tier"
            - "Repeat with clock at +3601s on a sibling completed order: refund_cents == 14522"
            - "Repeat with clock at +86401s: HTTP 422 with error_id=='ERR_REFUND_WINDOW_EXPIRED'"

      - name: dispatch_distance_radius_zero_pool
        grounds:
          - calculations.nurse_dispatch_score
          - errors.ERR_NO_AVAILABLE_NURSE
          - entities.Dispatch.fields.distance_km
        distinguishing_aspect: |
          Different metric (distance) on a different endpoint (POST /orders, internal
          selector). MAX_DISPATCH_RADIUS_KM=15. With one Nurse N1 at exactly 15.000km
          → eligible; at 15.001km → empty pool → Order.status=CANCELLED with
          ERR_NO_AVAILABLE_NURSE. Boundary uses '<=' on radius.
        test_recipe:
          setup:
            - "One nurse N1 with home 15.000km from service address (computed Haversine)"
          trigger:
            - "POST /orders"
          assert:
            - "Dispatch d1 created with d1.distance_km == 15.000"
            - "Repeat scenario with N1 at 15.001km: Order.status == CANCELLED, error not raised on POST /orders body but cancelled_reason mentions ERR_NO_AVAILABLE_NURSE"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_complete_requires_waste_archived
        grounds:
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.WasteEntry.HANDED_OVER_to_ARCHIVED
          - validations[priority=13]   # ERR_WASTE_NOT_ARCHIVED
        distinguishing_aspect: |
          Entity pair: Order ↔ WasteEntry. Order.IN_PROGRESS→COMPLETED is
          gated on every WasteEntry.status == ARCHIVED for that order (when the
          ServiceItem produces waste). One entity's transition depends on a child's
          state.
        test_recipe:
          setup:
            - "ServiceItem with required_skill=WOUND_CARE (produces waste); order through IN_PROGRESS"
            - "Nurse registers WasteEntry w1 (REGISTERED) and patches sealing/handover (HANDED_OVER)"
          trigger:
            - "Patient calls POST /orders/{id}/confirm-completion BEFORE certificate event"
          assert:
            - "HTTP 409, error_id=='ERR_WASTE_NOT_ARCHIVED'"
            - "Then POST /_events/emit (system=medical-waste-disposal, CERTIFICATE_ISSUED, w1) → w1.status=ARCHIVED"
            - "Retry confirm-completion succeeds; Order.status=COMPLETED"

      - name: dispatch_accept_requires_order_state
        grounds:
          - state_machines.Dispatch.OFFERED_to_ACCEPTED
          - state_machines.Order.AWAITING_DISPATCH_to_DISPATCHED
          - validations[priority=8]   # ERR_DISPATCH_ALREADY_TAKEN
        distinguishing_aspect: |
          Entity pair: Dispatch ↔ Order. Different pair from Order↔WasteEntry. A
          Dispatch.OFFERED→ACCEPTED transition is gated on the parent Order being
          in AWAITING_DISPATCH (or DISPATCHED with no other ACCEPTED). If another
          Dispatch already won, the late accept is rejected ERR_DISPATCH_ALREADY_TAKEN.
        test_recipe:
          setup:
            - "Two nurses N1 and N2 both eligible; force selector to issue dispatches d1 and d2 (achieved by initial accept→reject loop)"
            - "Have N1 accept d1 first"
          trigger:
            - "N2 calls POST /dispatches/{d2}/accept"
          assert:
            - "HTTP 409, error_id=='ERR_DISPATCH_ALREADY_TAKEN'"
            - "Order.status == DISPATCHED (unchanged by N2's failed accept)"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: nurse_daily_workload_count_aggregate
        grounds:
          - calculations.nurse_dispatch_score
          - entities.Nurse.fields.max_daily_orders
          - errors.ERR_NO_AVAILABLE_NURSE
        distinguishing_aspect: |
          Resource = Nurse availability bound on a CALENDAR-DAY interval (24h closed
          window in the nurse's local time zone). Count-aggregate semantic: the nurse
          is excluded from candidate pool if count(orders in {DISPATCHED, IN_PROGRESS})
          on the order's local calendar day >= max_daily_orders. Aggregate cap, not
          point-overlap.
        test_recipe:
          setup:
            - "Nurse N1 with max_daily_orders=2; two prior orders today both in DISPATCHED state"
          trigger:
            - "POST /orders for the same calendar day"
          assert:
            - "N1 NOT in candidate pool (count=2 not strictly less than max=2)"
            - "If N1 is the only candidate: Order.status==CANCELLED with reason ERR_NO_AVAILABLE_NURSE"

      - name: dispatch_acceptance_window_pointwise
        grounds:
          - state_machines.Dispatch.OFFERED_to_ACCEPTED
          - state_machines.Dispatch.OFFERED_to_EXPIRED
          - entities.Dispatch.fields.accept_deadline
          - validations[priority=9]
        distinguishing_aspect: |
          Different interval semantic from the workload count: this is a POINT-IN-TIME
          adjacency check on a single resource (the Dispatch row). 'now() < accept_deadline'
          half-open interval — exactly accept_deadline is OUT (rejected with
          ERR_DISPATCH_WINDOW_EXPIRED), one tick before is IN. Different resource
          entity (Dispatch vs Nurse) and different geometric treatment (open boundary
          vs aggregate count).
        test_recipe:
          setup:
            - "Dispatch d1 OFFERED with accept_deadline = T+60s"
          trigger:
            - "POST /_clock/advance (to=T+60s); Nurse calls POST /dispatches/{d1}/accept"
          assert:
            - "HTTP 409, error_id=='ERR_DISPATCH_WINDOW_EXPIRED'  # accept_deadline NOT inclusive"
            - "If clock is T+59s instead: accept succeeds, d1.status=ACCEPTED"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_balance_invariant_on_cancel_chain
        grounds:
          - state_machines.Order.AWAITING_DISPATCH_to_CANCELLED
          - state_machines.Order.AUTHORIZED_to_REFUNDED
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity #1: PATIENT NET CASH. Forward action POST /orders triggers
          payment AUTHORIZE (escrow). Compensating action POST /orders/{id}/cancel
          triggers REFUND. Invariant pinned: after the pair, sum_over(payment events
          for this Order)==0 cents — Patient out-of-pocket is exactly zero. The cancel
          must NOT leave any Settlement row in a non-REVERSED state.
        test_recipe:
          setup:
            - "Patient creates Order; payment_status flips to AUTHORIZED (escrowed: gross+tax)"
          trigger:
            - "Patient cancels before nurse acceptance"
          assert:
            - "Order.payment_status == REFUNDED"
            - "GET /orders/{id}/settlement returns 404 OR returns Settlement.status==REVERSED with refund_cents == authorized_amount"
            - "Conserved invariant: authorized_amount - refund_cents == 0"

      - name: nurse_rating_floor_invariant_under_compensation_chain
        grounds:
          - state_machines.Complaint.MEDIATION_to_RESOLVED
          - calculations.nurse_rating_aggregate
          - entities.Nurse.fields.rating
          - entities.Complaint.fields.rating_impact
        distinguishing_aspect: |
          Conserved quantity #2: NURSE RATING FLOOR. Different from cash invariant.
          Forward action: Complaint resolution applies rating_impact in [-1.0, 0].
          Compensating action: a successful subsequent COMPLETED order with no
          complaint contributes 5.00 to the rolling-50 mean. Invariant pinned:
          Nurse.rating ALWAYS in [1.00, 5.00] — clamped on every recompute. After
          ANY chain of resolves+completions, the rating never falls below 1.00 or
          rises above 5.00 even if a malicious resolve sends rating_impact=-99.
          Conservation: rating ∈ [RATING_FLOOR, RATING_CEIL] is invariant across
          all transitions.
        test_recipe:
          setup:
            - "Nurse N1 with 50 prior COMPLETED orders (rating=5.00 baseline)"
          trigger:
            - "Submit and resolve 3 NURSE_RELATED complaints, each with rating_impact=-1.0"
          assert:
            - "Nurse.rating == round_half_up((47*5.0 + 3*4.0)/50, 2) == 4.94"
            - "Even with rating_impact=-1.0 applied 50 times, Nurse.rating clamped to 1.00 (floor invariant holds)"
            - "Nurse.rating <= 5.00 always"
