              payload: { loop_id: "${loop_b_id}", rate_schedule_id: "${rs_u_id}", customer_name: "Bayside Chillers", customer_class: "UNIVERSITY", reserved_capacity_kw: 400.0, service_mode: "COOLING", service_start_date: "2026-09-01T00:00:00Z", service_end_date: "2027-09-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { e_service_mode: $.data.error_id }
            - call: "POST /district-energy/dispatch-plans"
              payload: { loop_id: "${loop_b_id}", forecast_id: "${f_z_id}", expected_loop_version: "${loop_b_v}" }
              as: DispatchOperator
