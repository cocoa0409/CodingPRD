              as: PlatformAdmin
              captures: { r2_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r2_id}" }
              as: PlatformAdmin
              captures: { vr_r2_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/claim"
