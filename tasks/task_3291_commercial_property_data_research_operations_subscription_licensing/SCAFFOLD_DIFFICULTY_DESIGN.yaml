- rule_id: priority_pair_validation_conflict
  instances:
  - name: auth_outranks_existence_on_a_property_read
    grounds:
    - validations.priority_1_auth
    - validations.priority_3_existence
    - errors.ERR_UNAUTHENTICATED
    - errors.ERR_PROPERTY_NOT_FOUND
    distinguishing_aspect: 'The (auth, existence) pair: an unauthenticated request for a property id that does not exist answers 401 ERR_UNAUTHENTICATED, not 404 ERR_PROPERTY_NOT_FOUND.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. No Property has been created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /data-research/properties/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ResearchAnalyst
        captures:
          unauthenticated_error: $.data.error_id
      assert:
      - the response status is 401 and error_id == ERR_UNAUTHENTICATED
      - error_id != ERR_PROPERTY_NOT_FOUND even though the property id does not exist
      - repeating the same request with a valid X-User-ID and X-User-Role yields 404 ERR_PROPERTY_NOT_FOUND, proving the auth check ran first
