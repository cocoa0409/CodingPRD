              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z3", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
