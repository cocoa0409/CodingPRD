  # ===========================================================================
  # Rule 8 — resource/temporal overlap under four different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: machine_occupancy_widened_by_changeover_buffer_on_both_ends
        grounds:
          - validations.priority_63
          - errors.ERR_MACHINE_WINDOW_CONFLICT
          - entities.PaperMachine.fields.changeover_buffer_minutes
          - state_machines.ProductionRun.initial_SCHEDULED
        distinguishing_aspect: |
          Interval semantics: the REQUESTED window is widened by changeover_buffer_minutes on
          BOTH ends and tested against other runs' UNWIDENED closed windows. On PM1 (buffer 60)
          an incumbent run occupies 00:00..06:00 and a request for 06:30..12:00 must be refused
          because widening reaches back to 05:30; a request for 07:01..12:00 widens to 06:01 and
          is accepted. The one-sided reading (widen only forward, or widen the incumbent instead)
          accepts 06:30, and 07:00 must also still be refused because widening lands exactly on
          06:00 and the incumbent interval is closed.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 / OCC_11 and PaperGradeSpec TL_140 declared; PaperMachine PM1 with changeover_buffer_minutes 60."
            - "A QUEUED PulpBatch targeting TL_140 exists — run CREATION never inspects batch status, so no pulping is needed to probe interval geometry."
            - "Run R1 is created on PM1 over 2026-08-02T00:00:00Z..06:00:00Z and stays SCHEDULED, so it is inside the {SCHEDULED, RUNNING} occupancy set."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-machines", payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 20.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.400 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_id: "$.data.id", pm1_v1: "$.data.version" } }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-A-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 14.50, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 18.000, tare_tons: 1.500, moisture_pct: 11.00, contamination_pct: 3.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm1_v1}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_1: "$.data.id" } }
            - { call: "GET /paper-machines/${pm1_id}", payload: {}, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_v2: "$.data.version" } }
          trigger:
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T06:30:00Z", window_end: "2026-08-02T12:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm1_v2}" }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T07:00:00Z", window_end: "2026-08-02T12:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm1_v2}" }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T07:01:00Z", window_end: "2026-08-02T12:00:00Z", pulp_draw_tons: 10.000, expected_machine_version: "${pm1_v2}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_3: "$.data.id" } }
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == \"ERR_MACHINE_WINDOW_CONFLICT\" (widened start 05:30 falls inside the incumbent closed window)"
            - "the second trigger call returns HTTP 409 with data.error_id == \"ERR_MACHINE_WINDOW_CONFLICT\" (widened start 06:00 touches the incumbent end and the interval is closed)"
            - "the third trigger call returns HTTP 201 (widened start 06:01 clears the incumbent end by one minute)"
            - "ProductionRun.${run_3}.run_status == SCHEDULED AND ProductionRun.${run_3}.window_start == \"2026-08-02T07:01:00Z\""
            - "GET /paper-machines/${pm1_id}/runs returns total_count == 2, so neither refused request left a row behind"
            - "ProductionRun.${run_1}.window_end == \"2026-08-02T06:00:00Z\" and it was never widened in storage"

      - name: machine_occupancy_touching_endpoints_collide_with_zero_buffer
        grounds:
          - validations.priority_63
          - errors.ERR_MACHINE_WINDOW_CONFLICT
          - calculations.steam_waterfall_dispatch.variants.half_open_vs_closed
          - entities.PaperMachine.fields.changeover_buffer_minutes
        distinguishing_aspect: |
          Interval semantics: with changeover_buffer_minutes 0 the widening term vanishes, which
          isolates the CLOSED-versus-half-open question on its own. Back-to-back windows whose
          window_end equals the next window_start share a single instant and must therefore still
          collide on a machine, while a one-minute later start is accepted — the identical pair of
          timestamps coexists happily on the steam header, so an implementation that shares one
          overlap helper between the two subsystems fails exactly one of these two instances.
        test_recipe:
          setup:
            - "FiberGrade OCC_11 (with MIX_54 as its downgrade target) and PaperGradeSpec TL_140 declared."
            - "PaperMachine PM3 created with changeover_buffer_minutes 0 so the buffered widening is a no-op."
            - "A QUEUED TL_140 PulpBatch exists to satisfy the product-match rule on run creation."
            - "Run R1 occupies 2026-08-12T00:00:00Z..06:00:00Z and stays SCHEDULED."
