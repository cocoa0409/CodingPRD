# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every instance replays from an empty DB using only §1.5 endpoints. The logical
# clock starts at its fixed default 2026-08-01T00:00:00Z; instances that need a
# different instant call POST /_clock/set_current_utc explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: escrow_variance_strict_three_way_versus_bank_to_trial
        grounds:
          - calculations.escrow_three_way_variance
          - entities.EscrowAudit.fields.variance_method
          - entities.EscrowAudit.fields.reconciliation_variance_cents
          - entities.EscrowAccount.fields.adjusted_bank_balance_cents
          - state_machines.EscrowAudit.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This dual variant lives on the escrow reconciliation domain
          (EscrowAccount balances read by an EscrowAudit): with byte-identical
          balances on two accounts, a SURPRISE audit reports 20000 (the maximum
          of all three pairwise legs, the book-to-trial break included) while a
          SCHEDULED audit reports 5000 (bank-to-trial leg only).
        test_recipe:
          setup:
            - "One APPOINTED agency in state CA with an ACCEPTED financial review and an ACTIVE appointment; oversight_posture OPEN."
            - "Two escrow accounts of that agency carrying identical snapshots: book 10000000, bank 10120000, outstanding items 100000, trial 10015000, so adjusted_bank_balance_cents is 10020000 on both."
            - "One DRAFT SURPRISE audit on the first account and one DRAFT SCHEDULED audit on the second, both as_of_date 2026-07-31."
            - "StateProgram.three_way_tolerance_cents is 100000, above both variances, so neither submission raises a finding."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea1_id: "$.data.id" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-2" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea2_id: "$.data.id" }
            - call: "POST /escrow-accounts/${ea1_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10120000, outstanding_items_cents: 100000, trial_balance_cents: 10015000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-31" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /escrow-accounts/${ea2_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10120000, outstanding_items_cents: 100000, trial_balance_cents: 10015000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-31" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea1_id}", audit_type: "SURPRISE", as_of_date: "2026-07-31" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_surprise_id: "$.data.id" }
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea2_id}", audit_type: "SCHEDULED", as_of_date: "2026-07-31" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_scheduled_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-audits/${au_surprise_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { surprise_variance: "$.data.reconciliation_variance_cents", surprise_method: "$.data.variance_method" }
            - call: "POST /escrow-audits/${au_scheduled_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { scheduled_variance: "$.data.reconciliation_variance_cents", scheduled_method: "$.data.variance_method" }
          assert:
            - "EscrowAudit.${au_surprise_id}.variance_method == \"STRICT_THREE_WAY\""
            - "EscrowAudit.${au_surprise_id}.reconciliation_variance_cents == 20000"
            - "EscrowAudit.${au_scheduled_id}.variance_method == \"BANK_TO_TRIAL\""
            - "EscrowAudit.${au_scheduled_id}.reconciliation_variance_cents == 5000"
            - "EscrowAudit.${au_surprise_id}.open_finding_count == 0 and EscrowAudit.${au_scheduled_id}.open_finding_count == 0 (both variances are at or below three_way_tolerance_cents 100000)"
            - "GET /escrow-audits/${au_surprise_id}/findings returns total_count == 0"

      - name: defalcation_score_rolling_window_versus_lifetime_uncleared
        grounds:
          - calculations.agency_defalcation_score
          - entities.Agency.fields.defalcation_score
          - entities.Agency.fields.escrow_standing
          - state_machines.EscrowAudit.UNDER_REVIEW_to_CLOSED_ADVERSE
          - entities.AuditFinding.fields.severity
        distinguishing_aspect: |
          This dual variant lives on the agency risk-scoring domain (Agency
          fields aggregated over AuditFinding / EscrowAudit history), not on
          escrow balance reconciliation: on one identical history the closure
          path scores 20 (rolling_window_365 drops the 2025-01-10 audit and its
          CRITICAL finding) while opening a new audit scores 53
          (lifetime_uncleared keeps that uncleared CRITICAL but drops nothing
          for age), moving escrow_standing from COMPLIANT to WATCH.
        test_recipe:
          setup:
            - "Logical clock first moved to 2025-01-10, then to 2026-08-01, so exactly one audit falls outside the 365-day window."
            - "Audit X on escrow account ESCROW-1 (as_of_date 2025-01-10) closed CLOSED_ADVERSE with one auto-raised THREE_WAY_VARIANCE finding of exposure 6000000, severity CRITICAL, status ESCALATED."
            - "Audit Y on escrow account ESCROW-2 (as_of_date 2026-07-05) is UNDER_REVIEW with one auto-raised THREE_WAY_VARIANCE finding of exposure 2000000, severity HIGH, status ESCALATED."
            - "A third escrow account ESCROW-3 exists with no audit yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-01-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea1_id: "$.data.id" }
            - call: "POST /escrow-accounts/${ea1_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10000000, outstanding_items_cents: 0, trial_balance_cents: 4000000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2025-01-10" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea1_id}", audit_type: "SCHEDULED", as_of_date: "2025-01-10" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_x_id: "$.data.id" }
            - call: "POST /escrow-audits/${au_x_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
            - call: "GET /escrow-audits/${au_x_id}/findings"
              payload: {}
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { f_x_id: "$.data[0].id" }
            - call: "POST /escrow-audits/${au_x_id}/state"
              payload: { to_state: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /audit-findings/${f_x_id}/state"
              payload: { to_state: "ESCALATED", disposition_note: "Trust shortfall unresolved" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
            - call: "POST /escrow-audits/${au_x_id}/state"
              payload: { to_state: "CLOSED_ADVERSE", note: "Adverse closure 2025" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-2" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea2_id: "$.data.id" }
            - call: "POST /escrow-accounts/${ea2_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10000000, outstanding_items_cents: 0, trial_balance_cents: 8000000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-05" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-3" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea3_id: "$.data.id" }
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea2_id}", audit_type: "SCHEDULED", as_of_date: "2026-07-05" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_y_id: "$.data.id" }
            - call: "POST /escrow-audits/${au_y_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
            - call: "GET /escrow-audits/${au_y_id}/findings"
              payload: {}
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { f_y_id: "$.data[0].id" }
            - call: "POST /escrow-audits/${au_y_id}/state"
              payload: { to_state: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /audit-findings/${f_y_id}/state"
              payload: { to_state: "ESCALATED", disposition_note: "Repeat shortfall" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /escrow-audits/${au_y_id}/state"
              payload: { to_state: "CLOSED_ADVERSE", note: "Adverse closure 2026" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { score_after_closure: "$.data.defalcation_score", standing_after_closure: "$.data.escrow_standing" }
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea3_id}", audit_type: "SCHEDULED", as_of_date: "2026-08-01" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_z_id: "$.data.id" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { score_after_open: "$.data.defalcation_score", standing_after_open: "$.data.escrow_standing" }
          assert:
            - "${score_after_closure} == 20 (rolling_window_365: C=0, H=1, A=1 -> 12 + 8)"
            - "${standing_after_closure} == \"COMPLIANT\""
            - "${score_after_open} == 53 (lifetime_uncleared: C=1, H=1, A=2 -> 25 + 12 + 16)"
            - "${standing_after_open} == \"WATCH\""
            - "Agency.${ag_id}.oversight_posture == \"RESTRICTED\" after trigger[2] (both escrow_standing WATCH and open_critical_finding_count 1 are RESTRICTED conditions, and neither is a FROZEN condition)"
            - "Agency.${ag_id}.defalcation_score != ${score_after_closure} after trigger[2] — the two variants disagree on identical history"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_split_rounds_each_line_then_sums
        grounds:
          - calculations.remittance_premium_split
          - entities.RemittanceLine.fields.agency_retention_cents
          - entities.RemittanceLine.fields.underwriter_share_cents
          - entities.RemittanceStatement.fields.underwriter_share_cents
          - state_machines.RemittanceStatement.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER is observable: three lines of
          33333 cents at premium_split_agency_pct 0.80 sum to underwriter_share
          20001 when each line is rounded first, but 20000 under the forbidden
          sum-then-round order, so the two orders differ by exactly 1 cent.
        test_recipe:
          setup:
            - "APPOINTED agency in CA with premium_split_agency_pct 0.80 and policy_issuance_deadline_days 30; oversight_posture OPEN; clock at its 2026-08-01 default."
            - "Three ISSUED policy files with gross_premium_cents 33333 each and closing dates 2026-07-05, 2026-07-10 and 2026-07-20 (elapsed 27, 22 and 12 days, all timely)."
            - "A DRAFT remittance statement for 2026-07-01..2026-07-31 carrying one line per policy, each reporting 33333 cents."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v1: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-1", closing_date: "2026-07-05", liability_amount_cents: 40000000, gross_premium_cents: 33333, complex_title_flag: false, expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf1_id: "$.data.id" }
            - call: "POST /policy-files/${pf1_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v2: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-2", closing_date: "2026-07-10", liability_amount_cents: 40000000, gross_premium_cents: 33333, complex_title_flag: false, expected_agency_version: "${ag_v2}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf2_id: "$.data.id" }
            - call: "POST /policy-files/${pf2_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-2" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v3: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-3", closing_date: "2026-07-20", liability_amount_cents: 40000000, gross_premium_cents: 33333, complex_title_flag: false, expected_agency_version: "${ag_v3}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf3_id: "$.data.id" }
            - call: "POST /policy-files/${pf3_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-3" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v4: "$.data.version" }
            - call: "POST /remittance-statements"
              payload: { agency_id: "${ag_id}", period_start: "2026-07-01", period_end: "2026-07-31", expected_agency_version: "${ag_v4}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { st_id: "$.data.id" }
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf1_id}", reported_gross_premium_cents: 33333 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ln1_id: "$.data.id" }
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf2_id}", reported_gross_premium_cents: 33333 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ln2_id: "$.data.id" }
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf3_id}", reported_gross_premium_cents: 33333 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ln3_id: "$.data.id" }
          trigger:
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          assert:
            - "RemittanceLine.${ln1_id}.agency_retention_cents == 26666 and RemittanceLine.${ln1_id}.underwriter_share_cents == 6667"
            - "RemittanceLine.${ln2_id}.underwriter_share_cents == 6667 and RemittanceLine.${ln3_id}.underwriter_share_cents == 6667"
            - "RemittanceStatement.${st_id}.reported_gross_premium_cents == 99999"
            - "RemittanceStatement.${st_id}.agency_retention_cents == 79998"
            - "RemittanceStatement.${st_id}.underwriter_share_cents == 20001 (the forbidden sum-then-round order yields 20000)"
            - "RemittanceStatement.${st_id}.status == \"SUBMITTED\""

      - name: claim_tier_pinned_from_gross_loss_not_from_net_exposure
        grounds:
          - calculations.claim_recourse_and_indemnity
          - entities.AgencyClaim.fields.recourse_tier
          - entities.AgencyClaim.fields.indemnity_offset_cents
          - entities.AgencyClaim.fields.recourse_amount_cents
          - state_machines.AgencyClaim.INVESTIGATING_to_RECOURSE_DEMANDED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: the tier is fixed from the GROSS loss ratio 80000000/200000000
          = 0.40 -> TIER_2, giving indemnity 60000000, recourse 36000000 and
          exposure 20000000; re-deriving the tier from the resulting exposure
          (0.10 -> TIER_1) would produce indemnity 40000000 and recourse
          24000000, so the pinned order is observable in three fields.
        test_recipe:
          setup:
