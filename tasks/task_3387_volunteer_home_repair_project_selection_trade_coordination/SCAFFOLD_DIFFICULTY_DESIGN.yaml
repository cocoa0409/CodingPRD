              captures: { proj: "$.data[0].id", posture0: "$.data[0].readiness_posture" }
            - call: "GET /rebuild/scope-items"
              payload: { assessment_id: "${asm}" }
              as: Any
              captures: { si_e: "$.data[0].id" }
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "Gate Electric", trade: "ELECTRICAL", license_number: "E-6", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { contr: $.data.id }
            - call: "POST /rebuild/trade-work-orders"
              payload: { project_id: "${proj}", contractor_id: "${contr}", scope_item_ids: ["${si_e}"] }
              as: AffiliateStaff
              captures: { wo: $.data.id }
            - call: "POST /rebuild/events"
              payload: { project_id: "${proj}", name: "Gate Day", event_date: "2026-10-10", max_volunteers: 2 }
              as: AffiliateStaff
              captures: { ev: $.data.id }
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "PUBLISHED" }
              as: AffiliateStaff
            - call: "POST /rebuild/volunteers"
              payload: { full_name: "Lead Gate", email: "lg@x.example", team_leader_eligible: true }
              as: Anonymous
              captures: { v1: $.data.id }
            - call: "PATCH /rebuild/volunteers/${v1}"
              payload: { waiver_signed_on: "2026-08-01" }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "PATCH /rebuild/volunteers/${v1}"
              payload: { safety_training_completed_on: "2026-08-15" }
              as: AffiliateStaff
            - call: "POST /rebuild/enrollments"
              payload: { event_id: "${ev}", volunteer_id: "${v1}", is_team_leader: true }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "LOCKED" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "QUOTED", quote_cents: 100000 }
              as: TradePartner
              as_user_id: "${contr}"
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "APPROVED" }
              as: AffiliateStaff
            - call: "POST /rebuild/trade-work-orders/${wo}/schedule"
              payload: { visit_start: "2026-10-05T08:00:00Z", visit_end: "2026-10-05T12:00:00Z" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "LOCKED" }
              as: AffiliateStaff
              captures: { ev_status: $.data.status }
            - call: "GET /rebuild/projects/${proj}"
              payload: {}
              as: Any
              captures: { proj_status: $.data.status, posture: $.data.readiness_posture }
          assert:
            - "posture0 == BLOCKED (a licensed item with no covering order blocks readiness)"
            - "err == ERR_EVENT_NOT_LOCKABLE (QUOTE_REQUESTED does not count as coverage)"
            - "ev_status == LOCKED after the order is SCHEDULED"
            - "proj_status == EVENT_SCHEDULED and posture == READY (the cross-entity gate opened on TradeWorkOrder.state, not on any event field)"

