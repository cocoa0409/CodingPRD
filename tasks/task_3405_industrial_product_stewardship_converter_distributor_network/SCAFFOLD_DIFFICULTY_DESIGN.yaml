  - rule_id: transitive_cascade
    instances:
      - name: phaseout_enforce_cascades_clearance_order_accrual
        grounds:
          - state_machines.PhaseOutProgram.QUALIFYING_to_ENFORCED
          - state_machines.JurisdictionClearance.CLEARED_to_SUSPENDED
          - state_machines.Order.compliance_CLEAR_to_FLAGGED
          - calculations.phaseout_enforcement_sweep
        distinguishing_aspect: |
          Depth-3 cascade from the ENFORCED transition: (1) matching CLEARED
          clearance SUSPENDED, (2) orders on that (formulation, jurisdiction)
          FLAGGED, (3) the touching RebateAccrual's excluded_order_count
          recomputed — each link caused by the previous one, while the
          reformulated successor's clearance stays CLEARED.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. DE jurisdiction; RESTRICTED substance; F-300 with 5000ppm of it; F-300 ACTIVE via FULL_DISCLOSURE clearance."
            - "Distributor STANDARD agreement base 10000c; rebate program tier [{0,0.01}] ACTIVE; O1 qty 10 SHIPPED (accrual 1000c); O2 qty 5 PENDING."
            - "Phase-out program for the substance in [DE] at trigger 1000ppm, advanced to QUALIFYING with successor F-300R (CLEARED in DE) and 2 qualified customers."
