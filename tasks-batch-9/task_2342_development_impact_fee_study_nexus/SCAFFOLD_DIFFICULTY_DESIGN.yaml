              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_b_id}/publish-notice"
              payload: { notice_method: "NEWSPAPER", notice_days: 30 }
              as: CouncilClerk
              as_user_id: "clerk-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-14T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_b_id}/publish-notice"
              payload: { notice_method: "NEWSPAPER", notice_days: 30 }
              as: CouncilClerk
              as_user_id: "clerk-1"
              captures: { window_b: $.data.protest_window_ends_at }
          assert:
            - "${window_a} == 2026-02-14T00:00:00Z"
            - "the first publish-notice returns 409 with error_id ERR_NOTICE_WINDOW_OVERLAP"
            - "immediately after that failure: FeeStudy.${study_b_id}.status == NEXUS_CERTIFIED and notice_published_at == null"
            - "the second publish-notice returns 200 with FeeStudy.${study_b_id}.status == NOTICE_PUBLISHED"
            - "FeeStudy.${study_b_id}.notice_published_at == 2026-02-14T00:00:00Z"
            - "${window_b} == 2026-03-16T00:00:00Z"
            - "FeeStudy.${study_id}.status == NOTICE_PUBLISHED (still, and untouched by B's notice)"

