scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: asd_vs_lrfd_governing_combination_on_engineering_design
        grounds:
          - calculations.design_load_combination_and_required_moment
          - entities.EngineeringDesign.fields.design_variant
          - entities.EngineeringDesign.fields.governing_combination
          - entities.EngineeringDesign.fields.required_moment_kip_ft
          - state_machines.EngineeringDesign.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          The dual variant here lives on the EngineeringDesign entity in the structural-engineering
          domain: ASD and LRFD read the identical dead/wind/snow triple off one locked configuration
          yet select different governing combinations (ASD_D_PLUS_0_6W at 32.35 psf vs
          LRFD_1_2D_PLUS_1_0W_PLUS_0_5S at 54.24 psf) and therefore different required moments
          (1010.94 vs 1695.00 kip-ft) — no money is involved anywhere in this instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Jurisdiction TX-HARRIS: exposure C, 140 mph, ground snow 5 psf, freight zone 3, territory TX-GULF."
            - "Builder Gulf Steel Builders is AUTHORIZED in TX-GULF."
            - "BuildingConfiguration cfg1 is LOCKED with clear span 100 ft, bay spacing 25 ft, 4 bays, eave 24 ft, pitch 1:12, PBR panels, R-19 insulation; its computed loads are dead 3.08 psf, wind 48.79 psf, snow 3.50 psf."
            - "One ASD EngineeringDesign already exists against cfg1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d_asd_id: $.data.id }
          trigger:
            - call: "GET /building-configurations/${cfg1_id}"
              payload: {}
              as: Engineer
              captures: { cfg1_v2: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "LRFD", expected_configuration_version: "${cfg1_v2}" }
              as: Engineer
              captures: { d_lrfd_id: $.data.id }
          assert:
            - "BuildingConfiguration.${cfg1_id}.dead_load_psf == 3.08"
            - "BuildingConfiguration.${cfg1_id}.design_wind_pressure_psf == 48.79"
            - "BuildingConfiguration.${cfg1_id}.roof_snow_load_psf == 3.50"
            - "EngineeringDesign.${d_asd_id}.governing_combination == ASD_D_PLUS_0_6W"
            - "EngineeringDesign.${d_asd_id}.governing_load_psf == 32.35"
            - "EngineeringDesign.${d_asd_id}.required_moment_kip_ft == 1010.94"
            - "EngineeringDesign.${d_lrfd_id}.governing_combination == LRFD_1_2D_PLUS_1_0W_PLUS_0_5S"
            - "EngineeringDesign.${d_lrfd_id}.governing_load_psf == 54.24"
            - "EngineeringDesign.${d_lrfd_id}.required_moment_kip_ft == 1695.00"
            - "EngineeringDesign.${d_asd_id}.status == SUPERSEDED"

      - name: preliminary_vs_final_price_variant_on_order_release
        grounds:
          - calculations.quote_price_pipeline
          - calculations.builder_credit_ledger
          - entities.Quote.fields.quoted_price_cents
          - entities.Order.fields.final_price_cents
          - entities.Order.fields.price_delta_cents
          - state_machines.Order.PROD_NOT_RELEASED_to_PROD_RELEASED
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — commercial pricing across
          Quote and Order — and on a different metric (cents, not kip-ft): PRELIMINARY bills steel on
          the configuration's 49680.00 lb parametric estimate (9719236 cents) while FINAL bills on the
          approved design's 46854.48 lb detailed rollup (9458205 cents), a -261031 cent reconciliation
          that also moves the builder's credit ledger.
        test_recipe:
          setup:
            - "CHAIN-CORE reference fixture at clock 2026-08-05T00:00:00Z: jurisdiction TX-HARRIS (freight zone 3), AUTHORIZED SILVER builder with a 200000000 cent credit limit, LOCKED configuration cfg1, two accessory kits (2 x 385075 cents / 640.5 lb and 3 x 129933 cents / 88.25 lb), quote at 240 freight miles with zero adjustment, ISSUED and ACCEPTED, order o1 at SITE-A."
            - "ASD design d1 carries the 10-component reference bill of material, is APPROVED, and its permit set dp1 is SEALED in TX."
            - "Order o1 is ENG_SEALED and PROD_NOT_RELEASED; builder credit_used_cents is the accepted quote price."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "OVERHEAD_DOOR", quantity: 2, unit_price_cents: 385075, unit_weight_lbs: 640.5, erection_stage: "TRIM_ACCESSORY" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "VENTILATION", quantity: 3, unit_price_cents: 129933, unit_weight_lbs: 88.25, erection_stage: "ROOF_PANEL" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/issue"
              payload: {}
              as: SalesEngineer
            - call: "POST /quotes/${q1_id}/accept"
              payload: { job_site_code: "SITE-A", requested_erection_start_date: "2026-09-15T00:00:00Z", site_delivery_capacity: 2 }
              as: Builder
              as_user_id: "${b1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d1_id: $.data.id }
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-1", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 24.5, weight_per_ft: 62.35 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "R-1", member_type: "RAFTER", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 51.25, weight_per_ft: 48.7 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-2", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 2, length_ft: 24.5, weight_per_ft: 45.15 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "SECONDARY_MEMBER", mark: "P-1", member_type: "PURLIN", erection_stage: "SECONDARY_FRAME", quantity: 40, length_ft: 25.083, weight_per_ft: 3.375 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "SECONDARY_MEMBER", mark: "G-1", member_type: "GIRT", erection_stage: "SECONDARY_FRAME", quantity: 16, length_ft: 24.5, weight_per_ft: 2.605 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PANEL_BUNDLE", mark: "PB-1", member_type: "PANEL", erection_stage: "ROOF_PANEL", quantity: 4, length_ft: 51.25, weight_per_ft: 1.45 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PANEL_BUNDLE", mark: "PB-2", member_type: "PANEL", erection_stage: "WALL_PANEL", quantity: 4, length_ft: 24.0, weight_per_ft: 1.45 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "ANCHOR_PACKAGE", mark: "AB-1", member_type: "ANCHOR_BOLT", erection_stage: "ANCHORAGE", quantity: 10, length_ft: 1.5, weight_per_ft: 2.2 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "CONNECTION_DETAIL", mark: "K-1", member_type: "DETAIL", erection_stage: "PRIMARY_FRAME", connection_type: "KNEE", capacity_moment_kip_ft: 1100 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "CONNECTION_DETAIL", mark: "B-1", member_type: "DETAIL", erection_stage: "ANCHORAGE", connection_type: "BASE", capacity_moment_kip_ft: 900 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d1_id}/review"
              payload: { decision: "APPROVE" }
              as: EngineeringManager
              as_user_id: "u_mgr_1"
            - call: "POST /drawing-packages"
              payload: { design_id: "${d1_id}", jurisdiction_id: "${j1_id}", sealing_license_state: "TX", sheet_count: 24 }
              as: SealingEngineer
              captures: { dp1_id: $.data.id }
            - call: "POST /drawing-packages/${dp1_id}/seal"
              payload: {}
              as: SealingEngineer
              as_user_id: "u_seal_1"
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { o1_v: $.data.version }
          trigger:
            - call: "POST /orders/${o1_id}/release-to-fabrication"
              payload: { expected_order_version: "${o1_v}" }
              as: ProductionPlanner
          assert:
            - "Quote.${q1_id}.billable_frame_weight_lbs == 49680.00"
            - "Quote.${q1_id}.steel_cost_cents == 4570560"
            - "Quote.${q1_id}.panel_cost_cents == 4123350"
            - "Quote.${q1_id}.accessory_cost_cents == 1159949"
            - "Quote.${q1_id}.subtotal_cents == 9853859"
            - "Quote.${q1_id}.billable_tons == 25.613"
            - "Quote.${q1_id}.freight_cost_cents == 165972"
            - "Quote.${q1_id}.pre_discount_total_cents == 10019831"
            - "Quote.${q1_id}.total_discount_rate == 0.03"
            - "Quote.${q1_id}.quoted_price_cents == 9719236"
            - "EngineeringDesign.${d1_id}.frame_weight_lbs == 46854.48"
            - "Order.${o1_id}.final_price_cents == 9458205"
            - "Order.${o1_id}.price_delta_cents == -261031"
            - "Order.${o1_id}.production_status == PROD_RELEASED"
            - "Builder.${b1_id}.credit_used_cents == 9458205"
            - "Builder.${b1_id}.credit_available_cents == 190541795"

  - rule_id: combinatorial_formula
    instances:
      - name: pinned_per_line_rounding_order_in_design_weight_rollup
        grounds:
          - calculations.design_weight_rollup
          - entities.DesignComponent.fields.unit_weight_lbs
          - entities.DesignComponent.fields.line_weight_lbs
          - entities.EngineeringDesign.fields.frame_weight_lbs
          - entities.EngineeringDesign.fields.shippable_weight_lbs
        distinguishing_aspect: |
          This is mode (b) — nested rounding where the order changes the answer. The scaffold pins
          round(length x plf) -> multiply by quantity -> round the line -> sum the lines, which yields
          frame_weight_lbs 46854.48 for the reference bill of material; the rival order (sum the raw
          length x plf x quantity products, round once) yields 46854.22, a 0.26 lb divergence that
          propagates into steel cost and freight tons.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; LOCKED configuration cfg1."
            - "An ASD EngineeringDesign d1 exists against cfg1 with no components yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-1", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 24.5, weight_per_ft: 62.35 }
              as: Engineer
              captures: { c1_unit: $.data.unit_weight_lbs, c1_line: $.data.line_weight_lbs }
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "R-1", member_type: "RAFTER", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 51.25, weight_per_ft: 48.7 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-2", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 2, length_ft: 24.5, weight_per_ft: 45.15 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "SECONDARY_MEMBER", mark: "P-1", member_type: "PURLIN", erection_stage: "SECONDARY_FRAME", quantity: 40, length_ft: 25.083, weight_per_ft: 3.375 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "SECONDARY_MEMBER", mark: "G-1", member_type: "GIRT", erection_stage: "SECONDARY_FRAME", quantity: 16, length_ft: 24.5, weight_per_ft: 2.605 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PANEL_BUNDLE", mark: "PB-1", member_type: "PANEL", erection_stage: "ROOF_PANEL", quantity: 4, length_ft: 51.25, weight_per_ft: 1.45 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PANEL_BUNDLE", mark: "PB-2", member_type: "PANEL", erection_stage: "WALL_PANEL", quantity: 4, length_ft: 24.0, weight_per_ft: 1.45 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "ANCHOR_PACKAGE", mark: "AB-1", member_type: "ANCHOR_BOLT", erection_stage: "ANCHORAGE", quantity: 10, length_ft: 1.5, weight_per_ft: 2.2 }
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "CONNECTION_DETAIL", mark: "K-1", member_type: "DETAIL", erection_stage: "PRIMARY_FRAME", connection_type: "KNEE", capacity_moment_kip_ft: 1100 }
              as: Engineer
              captures: { k1_line: $.data.line_weight_lbs }
          assert:
            - "DesignComponent C-1 unit_weight_lbs == 1527.58 and line_weight_lbs == 15275.80"
            - "DesignComponent R-1 unit_weight_lbs == 2495.88 and line_weight_lbs == 24958.80"
            - "DesignComponent C-2 unit_weight_lbs == 1106.18 and line_weight_lbs == 2212.36"
            - "DesignComponent P-1 unit_weight_lbs == 84.66 and line_weight_lbs == 3386.40"
            - "DesignComponent G-1 unit_weight_lbs == 63.82 and line_weight_lbs == 1021.12"
            - "DesignComponent K-1 line_weight_lbs == 0"
            - "EngineeringDesign.${d1_id}.frame_weight_lbs == 46854.48"
            - "EngineeringDesign.${d1_id}.frame_weight_lbs != 46854.22"
            - "EngineeringDesign.${d1_id}.shippable_weight_lbs == 47323.92"
            - "EngineeringDesign.${d1_id}.component_count == 9"

      - name: freight_inclusive_volume_tier_pinned_evaluation_order
        grounds:
          - calculations.quote_price_pipeline
          - entities.Quote.fields.pre_discount_total_cents
          - entities.Quote.fields.volume_discount_rate
          - entities.Quote.fields.quoted_price_cents
          - validations[priority=15]
        distinguishing_aspect: |
          This is mode (c) — a circular-looking dependency whose evaluation order the scaffold pins:
          the volume tier is keyed on pre_discount_total_cents, which already contains freight, so
          freight helps select the discount rate that is then applied to freight itself. With
          adjustment 14980169 the base lands on exactly 25000000, the 0.02 volume tier fires on top of
          the 0.03 SILVER tier and the price is 23750000; keying the tier on the freight-free base
          (24834028) would leave the rate at 0.03 and produce 24250000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS (freight zone 3); AUTHORIZED SILVER builder; LOCKED configuration cfg1 with the two reference accessory kits, so parts subtotal is 9853859 cents and freight over 240 miles is 165972 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "OVERHEAD_DOOR", quantity: 2, unit_price_cents: 385075, unit_weight_lbs: 640.5, erection_stage: "TRIM_ACCESSORY" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "VENTILATION", quantity: 3, unit_price_cents: 129933, unit_weight_lbs: 88.25, erection_stage: "ROOF_PANEL" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: 14980169 }
              as: SalesEngineer
              captures: { q_tier_id: $.data.id }
          assert:
            - "Quote.${q_tier_id}.subtotal_cents == 9853859"
            - "Quote.${q_tier_id}.freight_cost_cents == 165972"
            - "Quote.${q_tier_id}.pre_discount_total_cents == 25000000"
            - "Quote.${q_tier_id}.tier_discount_rate == 0.03"
            - "Quote.${q_tier_id}.volume_discount_rate == 0.02"
            - "Quote.${q_tier_id}.total_discount_rate == 0.05"
            - "Quote.${q_tier_id}.quoted_price_cents == 23750000"
            - "Quote.${q_tier_id}.quoted_price_cents != 24250000"

  - rule_id: non_linear_state_machine
    instances:
      - name: engineering_design_revision_cycle_returns_to_draft
        grounds:
          - state_machines.EngineeringDesign
          - state_machines.EngineeringDesign.REVISION_REQUIRED_to_DRAFT
          - entities.EngineeringDesign.fields.revision_count
          - entities.EngineeringDesign.fields.submitted_by_user_id
          - entities.EngineeringDesign.fields.reviewed_by_user_id
