# =============================================================================
# Scaffold: Premium Seating & Suite License Management (stadium premium sales office)
# =============================================================================
scenario: |
  Premium Seating & Suite License Management (stadium premium sales office): suite/club
  inventory & multi-year license agreement, annual license fee, food-and-beverage minimum
  & catering ordering, event-day access credential & guest list, single-event suite rental
  & pricing, license transfer/sublease approval, renewal negotiation & waitlist,
  amenity/renovation assessment

domain_name: premium-seating-suite-licensing
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: peer_roles
  consistency_model: immediate
  difficulty_target: expert_plus
  entity_count: 15
  state_machine_count: 14
  calculation_count: 10
  concurrency_rule_count: 3
  validation_count: 24
  endpoint_count: 68
  error_code_count: 35
  role_count: 5

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# List endpoints sort by created_at ASC; rows created within the same logical-clock
# instant (e.g. cascade-created invoices) keep their creation sequence within that
# instant. Resource ids never influence ordering or any other observable decision.
list_ordering: "created_at ASC, then insertion sequence within identical timestamps"

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: address, type: string, source: input, description: "Venue street address" }
      - { name: default_catering_cutoff_hours, type: integer, source: input, default: 72, description: "Hours before event start after which catering orders/cancellations are locked or penalized; Event.catering_cutoff_hours overrides per event" }

  - name: Suite
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; owning venue" }
      - { name: suite_code, type: string, source: input, description: "Human code (e.g. 'S-201'); unique per venue" }
      - { name: tier, type: enum, source: input, description: "FOUNDERS | PLATINUM | GOLD | SILVER" }
      - { name: capacity_seats, type: integer, source: input, description: "Max guests; caps active credentials per event; must be > 0" }
      - { name: base_annual_fee_cents, type: integer, source: input, description: "Default annual license fee used for quotes and waitlist conversions; >= 0" }
      - { name: f_b_minimum_cents, type: integer, source: input, description: "Default annual food-and-beverage minimum for agreements; >= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | LICENSED | OUT_OF_SERVICE; LICENSED is system-managed by agreement lifecycle, AVAILABLE<->OUT_OF_SERVICE toggled by StadiumAdmin" }
      - { name: current_agreement_id, type: string, source: computed, description: "Agreement currently licensing this suite (status ACTIVE|SUSPENDED|EXPIRING), else null" }

  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; owning venue" }
      - { name: label, type: string, source: input, description: "Season label (e.g. '2026-27'); unique per venue" }
      - { name: starts_on, type: datetime, source: input, description: "Season start (ISO8601 UTC)" }
      - { name: ends_on, type: datetime, source: input, description: "Season end (ISO8601 UTC); must be after starts_on" }
      - { name: renewal_window_opens_on, type: datetime, source: input, description: "Renewal offers for the following season may be created from this instant (inclusive)" }
      - { name: renewal_window_closes_on, type: datetime, source: input, description: "Renewal offers may be created until this instant (inclusive; boundary uses <=)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SETTLED" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season hosting this event" }
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: event_type, type: enum, source: input, description: "REGULAR | RIVALRY | PLAYOFF | CONCERT; REGULAR+RIVALRY are covered by season licenses, PLAYOFF+CONCERT are not" }
      - { name: starts_at, type: datetime, source: input, description: "Event start (ISO8601 UTC); must fall inside its season [starts_on, ends_on]" }
      - { name: duration_hours, type: integer, source: input, default: 4, description: "Event length; occupancy interval is [starts_at, starts_at + duration_hours)" }
      - { name: rental_base_price_cents, type: integer, source: input, description: "Base single-event rental price before tier multiplier/surcharges; >= 0" }
      - { name: catering_cutoff_hours, type: integer, source: input, description: "Optional per-event override of Venue.default_catering_cutoff_hours; null = inherit", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Licensee legal name" }
      - { name: account_type, type: enum, source: input, description: "CORPORATE | INDIVIDUAL | BROKER; BROKER accounts may not receive SUBLEASE transfers" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier; unique across all accounts" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED" }
      - { name: credit_standing, type: enum, source: computed, description: "GOOD | WATCH | HOLD; HOLD when any non-void invoice is >= 30 days past due, WATCH when 1..29 days past due, else GOOD" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Sum of amount_due_cents over this account's invoices in {ISSUED, PARTIALLY_PAID}" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Sum of amount_cents over this account's payments that ever reached CLEARED (refunds do not decrement)" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; licensed suite" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; license holder" }
      - { name: start_season_id, type: string, source: input, description: "FK -> Season.id; first covered season; covered seasons are the term_seasons PUBLISHED seasons of the suite's venue starting at this one, ordered by starts_on ASC" }
      - { name: term_seasons, type: integer, source: input, description: "Number of consecutive covered seasons; 1..10" }
      - { name: base_annual_fee_cents, type: integer, source: input, description: "Season-1 license fee before escalation; >= 0" }
      - { name: escalator_bp, type: integer, source: input, description: "Annual fee escalation in basis points (e.g. 300 = 3.00%); 0..2000" }
      - { name: f_b_minimum_cents, type: integer, source: input, description: "Annual food-and-beverage minimum per covered season; >= 0" }
      - { name: executed_on, type: datetime, source: system, description: "Logical-clock instant of execution; null until ACTIVE" }
      - { name: fee_schedule_cents, type: array, source: computed, description: "Per-season fees computed by license_fee_schedule (rounded_step variant) at execution" }
      - { name: current_season_index, type: integer, source: computed, description: "1-based index of the covered season containing the logical clock; 1 before season 1 starts, term_seasons after the last covered season ends" }
      - { name: f_b_accrued_cents_current_season, type: integer, source: computed, description: "Accrued F&B credit (net variant) toward the current covered season's minimum; see f_b_minimum_accrual" }
      - { name: suspension_reason, type: enum, source: system, description: "ACCOUNT_DEFAULT | ADMINISTRATIVE; null while not SUSPENDED" }
      - { name: suspension_count, type: integer, source: system, default: 0, description: "Number of times this agreement has entered SUSPENDED" }
      - { name: renewal_agreement_id, type: string, source: system, description: "Agreement created by an accepted renewal offer; null otherwise" }
      - { name: active_sublease_account_id, type: string, source: system, description: "Account holding an approved sublease; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_EXECUTION | ACTIVE | SUSPENDED | EXPIRING | RENEWED | EXPIRED | TERMINATED | TRANSFERRED | WITHDRAWN" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; billed account" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; null when not agreement-related", default: null }
      - { name: rental_id, type: string, source: input, description: "FK -> SingleEventRental.id; null when not rental-related", default: null }
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id; null when not assessment-related", default: null }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season context (set on LICENSE_FEE and F_B_SHORTFALL); null otherwise", default: null }
      - { name: invoice_type, type: enum, source: system, description: "LICENSE_FEE | F_B_SHORTFALL | TRANSFER_FEE | TERMINATION_FEE | RENTAL | ASSESSMENT | MANUAL; auto-created invoices set their own type, POST /invoices always creates MANUAL" }
      - { name: lines, type: array, source: input, description: "Line items [{description, quantity, unit_price_cents}]; quantity > 0, unit_price_cents >= 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of quantity*unit_price_cents over lines (integer math, no rounding needed)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Per late_fee_accrual; recomputed on every read and on season settle" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of cleared allocations to this invoice (net of refunds)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "subtotal_cents + late_fee_cents - amount_paid_cents; floor 0" }
      - { name: due_on, type: datetime, source: input, description: "Payment due instant; required on POST /invoices; system-set on auto-created invoices (LICENSE_FEE/F_B_SHORTFALL/MANUAL-ish auto: issue+30d, TRANSFER_FEE: issue+14d, RENTAL: event start -7d, ASSESSMENT: levy+60d)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the invoice entered ISSUED; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOID" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; paying account" }
      - { name: amount_cents, type: integer, source: input, description: "Total payment; must equal the sum of allocations[].amount_cents; > 0" }
      - { name: method, type: enum, source: input, description: "ACH | CARD | WIRE" }
      - { name: allocations, type: array, source: input, description: "[{invoice_id, amount_cents}]; every invoice must belong to account_id and be ISSUED or PARTIALLY_PAID; per-invoice allocation <= invoice amount_due_cents" }
      - { name: status, type: enum, source: system, description: "INITIATED | CLEARED | FAILED | REFUNDED" }

  - name: CateringOrder
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event served" }
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; suite served" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; exactly one of agreement_id / rental_id required", default: null }
      - { name: rental_id, type: string, source: input, description: "FK -> SingleEventRental.id; exactly one of agreement_id / rental_id required", default: null }
      - { name: package_tier, type: enum, source: input, description: "STANDARD | PREMIUM | LUXE; informational label on the order" }
      - { name: guest_count, type: integer, source: input, description: "Guests served; > 0 and <= suite capacity_seats" }
      - { name: lines, type: array, source: input, description: "[{item_code, description, quantity, unit_price_cents, discount_pct?}]; quantity > 0, unit_price_cents >= 0, discount_pct in [0,1]" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Per catering_order_total: per-line round_half_up then sum" }
      - { name: service_fee_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * 0.18)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + service_fee_cents" }
      - { name: accrual_cents, type: integer, source: computed, description: "Amount counting toward the F&B minimum (net variant): subtotal_cents while CONFIRMED/FULFILLED, cancel_fee_cents while CANCELLED_LATE, else 0" }
      - { name: cancel_fee_cents, type: integer, source: computed, description: "0 unless CANCELLED_LATE, then round_half_up(0.5 * total_cents at cancellation time)" }
      - { name: status, type: enum, source: system, description: "PLACED | CONFIRMED | FULFILLED | CANCELLED | CANCELLED_LATE. Orders are created directly in PLACED" }

  - name: AccessCredential
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event admitted to" }
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; suite accessed" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; exactly one of agreement_id / rental_id required", default: null }
      - { name: rental_id, type: string, source: input, description: "FK -> SingleEventRental.id; exactly one of agreement_id / rental_id required", default: null }
      - { name: guest_name, type: string, source: input, description: "Guest full name" }
      - { name: guest_email, type: string, source: input, description: "Guest email; unique per (event_id, suite_id) among credentials not in {REVOKED, EXPIRED}" }
      - { name: credential_type, type: enum, source: input, description: "HOLDER | GUEST | VIP" }
      - { name: barcode, type: string, source: system, description: "Server-minted unique barcode" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVATED | REVOKED | EXPIRED" }

  - name: SingleEventRental
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event rented for" }
      - { name: suite_id, type: string, source: input, description: "FK -> Suite.id; suite rented" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; renting account" }
      - { name: guest_count, type: integer, source: input, description: "Expected guests; > 0; drives overage pricing beyond suite capacity_seats" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Per rental_price_quote at creation; immutable afterwards" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(quoted_price_cents * 0.30)" }
      - { name: hold_expires_at, type: datetime, source: system, description: "Logical clock + 48h at the moment the rental enters HELD; null until HELD" }
      - { name: cancel_fee_cents, type: integer, source: computed, description: "Tiered by whole days between cancellation clock and event starts_at: >=14 -> 10% of quoted, 7..13 -> 30%, 3..6 -> 50%, <3 -> 100%; 0 when cancelled from QUOTED/HELD or because the event was CANCELLED" }
      - { name: status, type: enum, source: system, description: "QUOTED | HELD | CONFIRMED | SETTLED | CANCELLED | EXPIRED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; agreement being transferred/subleased" }
      - { name: from_account_id, type: string, source: input, description: "FK -> Account.id; current holder; must equal agreement.account_id" }
      - { name: to_account_id, type: string, source: input, description: "FK -> Account.id; prospective transferee; must differ from from_account_id" }
      - { name: transfer_type, type: enum, source: input, description: "SALE_TRANSFER | SUBLEASE; SUBLEASE may not target a BROKER account" }
      - { name: asking_price_cents, type: integer, source: input, description: "Declared consideration; >= 0; drives SUBLEASE fee" }
      - { name: transfer_fee_cents, type: integer, source: computed, description: "Per transfer_fee at SUBMITTED -> UNDER_REVIEW entry; frozen once computed" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | REJECTED | WITHDRAWN | COMPLETED" }

  - name: RenewalOffer
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; agreement being renewed" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; first season of the proposed renewal term; must be the venue's PUBLISHED season with the smallest starts_on strictly after the agreement's last covered season" }
      - { name: proposed_fee_cents, type: integer, source: input, description: "Proposed season-1 fee of the renewal term; >= 0" }
      - { name: proposed_escalator_bp, type: integer, source: input, description: "Proposed renewal escalator; 0..2000" }
      - { name: proposed_term_seasons, type: integer, source: input, description: "Proposed renewal term length; 1..10" }
      - { name: response_due_on, type: datetime, source: input, description: "Holder response deadline (inclusive; after it the offer may be EXPIRED by the settle sweep)" }
      - { name: round_index, type: integer, source: system, default: 1, description: "Negotiation round; +1 on every COUNTERED and every REVISED transition" }
      - { name: status, type: enum, source: system, description: "OFFERED | COUNTERED | REVISED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; waiting account" }
      - { name: desired_tier, type: enum, source: input, description: "FOUNDERS | PLATINUM | GOLD | SILVER" }
      - { name: target_season_id, type: string, source: input, description: "FK -> Season.id; desired start season; null = any future season", default: null }
      - { name: priority_score, type: number, source: computed, description: "Per waitlist_priority_score; recomputed on every read" }
      - { name: offered_suite_id, type: string, source: system, description: "Suite offered while OFFERED; null otherwise" }
      - { name: status, type: enum, source: system, description: "WAITING | OFFERED | CONVERTED | DECLINED | EXPIRED | WITHDRAWN" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue being renovated" }
      - { name: name, type: string, source: input, description: "Assessment name (e.g. '2027 Club Renovation')" }
      - { name: total_cost_cents, type: integer, source: input, description: "Total project cost to allocate; > 0" }
      - { name: allocation_method, type: enum, source: input, description: "PER_SUITE_EQUAL | BY_SEAT; see assessment_share_allocation" }
      - { name: levied_at, type: datetime, source: system, description: "Logical-clock instant of levy; null until LEVIED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | APPROVED | LEVIED | SETTLED | CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /api/accounts/{id}/set_status {target_status: ACTIVE}"
        actor: FinanceController | PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/accounts/{id}/set_status {target_status: SUSPENDED} OR system during POST /api/seasons/{id}/settle when credit_standing recomputes to HOLD"
        actor: FinanceController | StadiumAdmin | system
        preconditions: []
        side_effects:
          - "Cascade (both triggers): every LicenseAgreement of this account in ACTIVE or EXPIRING -> SUSPENDED; suspension_reason = ADMINISTRATIVE when triggered by manual set_status, ACCOUNT_DEFAULT when triggered by the settle sweep"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/accounts/{id}/set_status {target_status: ACTIVE} OR system auto-reinstate when a payment clear drives balance_due_cents to 0 and no invoice is past due (cascade link 3 of payment clearing)"
        actor: FinanceController | StadiumAdmin | system
        preconditions:
          - "Manual reinstate: credit_standing must be GOOD (no invoice >= 1 day past due), else ERR_ACCOUNT_CREDIT_HOLD"
        side_effects:
          - "Cascade: every LicenseAgreement of this account in SUSPENDED with suspension_reason=ACCOUNT_DEFAULT -> ACTIVE (auto-cure). ADMINISTRATIVE suspensions are NOT auto-cured by reinstate; they require POST /api/agreements/{id}/cure"
    note: "PROSPECT is enterable only at creation; SUSPENDED -> PROSPECT and ACTIVE -> PROSPECT are rejected with ERR_INVALID_STATE_TRANSITION"

  - entity: Suite
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /api/suites/{id}/set_status {target_status: OUT_OF_SERVICE}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /api/suites/{id}/set_status {target_status: AVAILABLE}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: LICENSED
        trigger: "system (on LicenseAgreement DRAFT/PENDING_EXECUTION -> ACTIVE via execute)"
        actor: system
        preconditions: []
        side_effects: ["suite.current_agreement_id = the executed agreement"]
      - from: LICENSED
        to: AVAILABLE
        trigger: "system (on agreement TERMINATED, EXPIRED, or TRANSFERRED)"
        actor: system
        preconditions: []
        side_effects: ["suite.current_agreement_id = null"]
    note: "LICENSED -> OUT_OF_SERVICE is forbidden (rejected ERR_SUITE_LICENSED); the agreement must end first. LICENSED is enterable only via the system transition on agreement execute, and leavable only via agreement TERMINATED/EXPIRED/TRANSFERRED"

  - entity: Season
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/seasons/{id}/publish"
        actor: StadiumAdmin
        preconditions: ["ends_on > starts_on (else ERR_INVALID_REQUEST)"]
        side_effects: []
      - from: PUBLISHED
        to: SETTLED
        trigger: "POST /api/seasons/{id}/settle"
        actor: FinanceController | StadiumAdmin
        preconditions:
          - "logical clock strictly after season.ends_on (else ERR_INVALID_STATE_TRANSITION)"
          - "all events of this season in {COMPLETED, CANCELLED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Ops-run cascade link 1: for each LicenseAgreement covering this season with status in {ACTIVE, SUSPENDED, EXPIRING}, run f_b_minimum_accrual over this season's events (net variant; prorated when executed_on > season.starts_on)"
          - "Ops-run cascade link 2: shortfall > 0 -> create F_B_SHORTFALL invoice (status ISSUED, due_on = clock + 30d) -> Account.balance_due_cents recomputes upward"
          - "Ops-run cascade link 3: account recompute -> credit_standing HOLD -> Account -> SUSPENDED -> its ACTIVE/EXPIRING agreements -> SUSPENDED (ACCOUNT_DEFAULT)"
          - "Term bookkeeping (runs AFTER the credit cascade, and skips agreements the cascade just suspended): agreement whose last covered season is this one -> RENEWED if renewal_agreement_id is set, else EXPIRED (suite -> AVAILABLE on EXPIRED); otherwise, agreement whose NEXT covered season is its last covered season -> EXPIRING"
          - "Sweep: RenewalOffer in {OFFERED, REVISED} with response_due_on < clock -> EXPIRED; WaitlistEntry WAITING with target_season_id == this season -> EXPIRED"
    note: "SETTLED is the operational terminal; settle is non-reentrant (a second settle hits ERR_INVALID_STATE_TRANSITION)"

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/events/{id}/set_status {target_status: CANCELLED}"
        actor: StadiumAdmin
        preconditions: ["logical clock < event.starts_at (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "Cascade: CateringOrder of this event in {DRAFT, PLACED, CONFIRMED} -> CANCELLED with cancel_fee_cents=0 and accrual removed (agreement f_b_accrued_cents_current_season recomputes down)"
          - "Cascade: AccessCredential of this event in {ISSUED, ACTIVATED} -> EXPIRED"
          - "Cascade: SingleEventRental of this event in {QUOTED, HELD, CONFIRMED} -> CANCELLED with cancel_fee_cents=0; its unpaid RENTAL invoice -> VOID"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/events/{id}/set_status {target_status: COMPLETED}"
        actor: StadiumAdmin
        preconditions: ["logical clock >= event.starts_at + duration_hours (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "Cascade: AccessCredential of this event in ISSUED -> EXPIRED"
          - "Cascade: SingleEventRental of this event in CONFIRMED -> SETTLED"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [RENEWED, EXPIRED, TERMINATED, TRANSFERRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_EXECUTION
        trigger: "POST /api/agreements/{id}/submit"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/agreements/{id}/terminate {reason: WITHDRAWN} is NOT used; DRAFT withdrawal is via terminate with fee waived - see terminate"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: []
        note: "terminate from DRAFT lands in WITHDRAWN with no fee invoice"
      - from: PENDING_EXECUTION
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/execute"
        actor: AccountHolder
        preconditions:
          - "caller AccountHolder must own agreement.account_id (ERR_ACCOUNT_SCOPE_VIOLATION)"
          - "account.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED / ERR_INVALID_STATE_TRANSITION when PROSPECT: PROSPECT is rejected with ERR_INVALID_STATE_TRANSITION)"
          - "account.credit_standing != HOLD (else ERR_ACCOUNT_CREDIT_HOLD)"
          - "suite.status == AVAILABLE (else ERR_SUITE_NOT_AVAILABLE when OUT_OF_SERVICE, ERR_SUITE_ALREADY_LICENSED when LICENSED)"
          - "no other agreement on this suite in {PENDING_EXECUTION, ACTIVE, SUSPENDED, EXPIRING} with overlapping covered seasons (else ERR_SUITE_ALREADY_LICENSED)"
          - "start season PUBLISHED, not SETTLED (else ERR_SEASON_LOCKED)"
        side_effects:
          - "executed_on = logical clock; fee_schedule_cents computed (license_fee_schedule, rounded_step)"
          - "create LICENSE_FEE invoice (ISSUED, due_on = clock + 30d): season-1 fee, prorated by first_season_proration when executed_on > season.starts_on"
          - "suite -> LICENSED, suite.current_agreement_id = this agreement"
      - from: PENDING_EXECUTION
        to: WITHDRAWN
        trigger: "POST /api/agreements/{id}/terminate"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (account -> SUSPENDED cascade) OR POST /api/agreements/{id}/terminate is unrelated; manual administrative suspension is not exposed"
        actor: system
        preconditions: ["suspension_reason=ACCOUNT_DEFAULT set by cascade"]
        side_effects: ["suspension_count += 1"]
      - from: EXPIRING
        to: SUSPENDED
        trigger: "system (account -> SUSPENDED cascade)"
        actor: system
        preconditions: []
        side_effects: ["suspension_count += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/cure OR system auto-cure when account reinstates (cascade)"
        actor: FinanceController | StadiumAdmin | system
        preconditions:
          - "account.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
          - "no invoice of this agreement in {ISSUED, PARTIALLY_PAID} with due_on < clock (else ERR_UNSETTLED_BALANCE)"
        side_effects: ["suspension_reason = null"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/agreements/{id}/terminate"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions:
          - "no invoice of this agreement in {ISSUED, PARTIALLY_PAID} (else ERR_UNSETTLED_BALANCE)"
        side_effects:
          - "create TERMINATION_FEE invoice (ISSUED, due_on = clock + 30d) per early_termination_fee"
          - "suite -> AVAILABLE; current_agreement_id = null"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/agreements/{id}/terminate"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: ["same as ACTIVE -> TERMINATED (fee uses current_season_index at termination)"]
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system (on TransferRequest APPROVED -> COMPLETED for SALE_TRANSFER)"
        actor: system
        preconditions: []
        side_effects:
          - "new LicenseAgreement created directly in ACTIVE: account_id = to_account, same suite, remaining covered seasons, fee_schedule_cents = remaining tail of the original schedule, f_b_minimum_cents unchanged, executed_on = clock"
          - "suite stays LICENSED; current_agreement_id = new agreement"
      - from: ACTIVE
        to: EXPIRING
        trigger: "system (season settle when the next covered season is the agreement's last)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRING
        to: RENEWED
        trigger: "system (season settle of the last covered season, renewal_agreement_id set)"
        actor: system
        preconditions: []
        side_effects: ["suite -> AVAILABLE, then immediately LICENSED by the renewal agreement's execution if pending; otherwise AVAILABLE"]
      - from: EXPIRING
        to: EXPIRED
        trigger: "system (season settle of the last covered season, no renewal_agreement_id)"
        actor: system
        preconditions: []
        side_effects: ["suite -> AVAILABLE; current_agreement_id = null"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{id}/issue (manual invoices); auto-created invoices enter ISSUED directly at creation"
        actor: FinanceController | StadiumAdmin | system
        preconditions: ["lines non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["issued_at = clock", "Account.balance_due_cents recomputes upward"]
      - from: DRAFT
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: FinanceController | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment CLEARED with allocation < amount_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents increases; Account.balance_due_cents recomputes downward (cascade link 2 of payment clearing)"]
      - from: ISSUED
        to: PAID
        trigger: "system (payment CLEARED with allocation == amount_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["same ledger-sync cascade as PARTIALLY_PAID; balance_due_cents may hit 0 and trigger account auto-reinstate (cascade link 3)"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment CLEARED covering remainder)"
        actor: system
        preconditions: []
        side_effects: ["same cascade as ISSUED -> PAID"]
      - from: ISSUED
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: FinanceController | StadiumAdmin
        preconditions:
          - "no payments in {INITIATED, CLEARED} allocate to this invoice (else ERR_INVOICE_HAS_PAYMENTS)"
          - "its season (if season_id set) is not SETTLED (else ERR_SEASON_LOCKED)"
        side_effects: ["Account.balance_due_cents recomputes downward"]
      - from: PAID
        to: ISSUED
        trigger: "system (payment REFUNDED re-opens the invoice; compensation transition)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents decreases by refunded allocation; balance_due_cents recomputes upward"]
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "system (payment REFUNDED covering the full paid portion)"
        actor: system
        preconditions: []
        side_effects: ["same compensation as PAID -> ISSUED"]
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system (payment REFUNDED partially covering the paid portion)"
        actor: system
        preconditions: []
        side_effects: ["same compensation"]

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [FAILED, REFUNDED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /api/payments/{id}/set_status {target_status: CLEARED}"
        actor: FinanceController | StadiumAdmin
        preconditions: []
        side_effects:
          - "Cascade link 1: each allocated invoice amount_paid_cents += allocation; invoice -> PARTIALLY_PAID or PAID"
          - "Cascade link 2: Account.balance_due_cents recomputes downward; lifetime_spend_cents += amount_cents"
          - "Cascade link 3: if balance_due_cents == 0 and no invoice past due and account SUSPENDED -> account -> ACTIVE"
          - "Cascade link 4: account ACTIVE -> its ACCOUNT_DEFAULT-suspended agreements -> ACTIVE"
      - from: INITIATED
        to: FAILED
        trigger: "POST /api/payments/{id}/set_status {target_status: FAILED}"
        actor: FinanceController | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: REFUNDED
        trigger: "POST /api/payments/{id}/set_status {target_status: REFUNDED}"
        actor: FinanceController | StadiumAdmin
        preconditions: []
        side_effects:
          - "Compensation: each allocated invoice amount_paid_cents -= allocation; PAID/PARTIALLY_PAID invoices revert (PAID->ISSUED/PARTIALLY_PAID, PARTIALLY_PAID->ISSUED)"
          - "Account.balance_due_cents recomputes upward by exactly amount_cents (invariant: clear+refund nets to zero)"
          - "lifetime_spend_cents NOT decremented"

  - entity: CateringOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED, CANCELLED_LATE]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /api/catering-orders/{id}/set_status {target_status: CONFIRMED}"
        actor: EventServicesManager | StadiumAdmin
        preconditions:
          - "event still SCHEDULED (else ERR_EVENT_NOT_SCHEDULED)"
          - "clock <= event.starts_at - cutoff (else ERR_CATERING_CUTOFF_PASSED)"
          - "if agreement_id present: agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE); if rental_id present: rental.status == CONFIRMED"
        side_effects: ["agreement f_b_accrued_cents_current_season += accrual_cents (net subtotal) when agreement_id present and event is in the agreement's current covered season"]
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /api/catering-orders/{id}/set_status {target_status: FULFILLED}"
        actor: EventServicesManager | StadiumAdmin
        preconditions: ["clock >= event.starts_at (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/set_status {target_status: CANCELLED}"
        actor: AccountHolder | EventServicesManager | StadiumAdmin
        preconditions: ["AccountHolder caller must own the order's agreement/rental account (ERR_ACCOUNT_SCOPE_VIOLATION)"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/set_status {target_status: CANCELLED}"
        actor: AccountHolder | EventServicesManager | StadiumAdmin
        preconditions: ["clock <= event.starts_at - cutoff (else the transition lands in CANCELLED_LATE, not CANCELLED)"]
        side_effects: ["accrual removed: agreement f_b_accrued_cents_current_season -= accrual_cents (compensation; invariant: confirm+free-cancel nets accrual to zero)"]
      - from: CONFIRMED
        to: CANCELLED_LATE
        trigger: "POST /api/catering-orders/{id}/set_status {target_status: CANCELLED} when clock > event.starts_at - cutoff"
        actor: AccountHolder | EventServicesManager | StadiumAdmin
        preconditions: ["clock < event.starts_at (at/after start the order can no longer be cancelled: ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "cancel_fee_cents = round_half_up(0.5 * total_cents); accrual_cents switches from subtotal to cancel_fee_cents"
          - "agreement f_b_accrued_cents_current_season adjusts by (cancel_fee_cents - subtotal_cents)"

  - entity: AccessCredential
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVATED
        trigger: "POST /api/credentials/{id}/set_status {target_status: ACTIVATED}"
        actor: EventServicesManager | StadiumAdmin
        preconditions:
          - "clock within [event.starts_at - 4h, event.starts_at + duration_hours] (else ERR_CREDENTIAL_WINDOW)"
          - "event still SCHEDULED (else ERR_EVENT_NOT_SCHEDULED)"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /api/credentials/{id}/set_status {target_status: REVOKED}"
        actor: AccountHolder | EventServicesManager | StadiumAdmin
        preconditions: ["AccountHolder caller must own the credential's agreement/rental account (ERR_ACCOUNT_SCOPE_VIOLATION)"]
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (event COMPLETED or CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVATED
        to: EXPIRED
        trigger: "system (event CANCELLED cascade only)"
        actor: system
        preconditions: []
        side_effects: []
        note: "ACTIVATED is sticky through event completion (guest attended); only CANCELLED events expire activated credentials"

  - entity: SingleEventRental
    initial_state: QUOTED
    terminal_states: [SETTLED, CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: HELD
        trigger: "POST /api/rentals/{id}/set_status {target_status: HELD}"
        actor: PremiumSalesRep | AccountHolder | StadiumAdmin
        preconditions:
          - "availability (Rule 8 set-membership): no rental on same (suite,event) in {HELD, CONFIRMED}; if event_type in {REGULAR, RIVALRY}: no agreement on suite in {ACTIVE, SUSPENDED, EXPIRING} covering the event's season; suite not OUT_OF_SERVICE (all -> ERR_SUITE_NOT_AVAILABLE)"
          - "account.status != SUSPENDED (else ERR_ACCOUNT_SUSPENDED)"
        side_effects: ["hold_expires_at = clock + 48h"]
      - from: HELD
        to: CONFIRMED
        trigger: "POST /api/rentals/{id}/set_status {target_status: CONFIRMED}"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions:
          - "clock <= hold_expires_at (else ERR_HOLD_EXPIRED)"
          - "account.credit_standing != HOLD (else ERR_ACCOUNT_CREDIT_HOLD)"
          - "availability re-checked (ERR_SUITE_NOT_AVAILABLE)"
        side_effects: ["create RENTAL invoice (ISSUED, full quoted_price_cents, due_on = event.starts_at - 7d)"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /api/rentals/{id}/set_status {target_status: CANCELLED}"
        actor: PremiumSalesRep | AccountHolder | StadiumAdmin
        preconditions: ["AccountHolder caller must own rental.account_id (ERR_ACCOUNT_SCOPE_VIOLATION)"]
        side_effects: ["cancel_fee_cents = 0"]
      - from: HELD
        to: CANCELLED
        trigger: "POST /api/rentals/{id}/set_status {target_status: CANCELLED}"
        actor: PremiumSalesRep | AccountHolder | StadiumAdmin
        preconditions: ["scope as above"]
        side_effects: ["cancel_fee_cents = 0"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/rentals/{id}/set_status {target_status: CANCELLED}"
        actor: PremiumSalesRep | AccountHolder | StadiumAdmin
        preconditions:
          - "scope as above"
          - "rental RENTAL invoice status == ISSUED (not PARTIALLY_PAID/PAID; else ERR_RENTAL_SETTLEMENT_REQUIRED)"
          - "clock < event.starts_at (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "cancel_fee_cents per tiered table on days-to-event; RENTAL invoice -> VOID"
          - "if cancel_fee_cents > 0: create new RENTAL invoice (ISSUED, single 'cancellation fee' line, due_on = clock + 14d)"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /api/rentals/{id}/set_status {target_status: EXPIRED}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: HELD
        to: EXPIRED
        trigger: "POST /api/rentals/{id}/set_status {target_status: EXPIRED}"
        actor: StadiumAdmin
        preconditions: ["clock > hold_expires_at (else ERR_HOLD_NOT_EXPIRED)"]
        side_effects: []
      - from: CONFIRMED
        to: SETTLED
        trigger: "system (event COMPLETED cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransferRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, COMPLETED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/transfer-requests/{id}/set_status {target_status: UNDER_REVIEW}"
        actor: PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: ["transfer_fee_cents computed and frozen (transfer_fee calc)"]
      - from: UNDER_REVIEW
