            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 2 }, as: FarmManager, captures: { day_id: $.data.id } }
