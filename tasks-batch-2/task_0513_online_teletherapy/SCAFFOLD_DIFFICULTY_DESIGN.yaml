            - "Subscription.${sub_id}.current_period_start == 2026-06-08T00:00:00Z"
      - name: financial_aid_band_exactly_at_ceiling_falls_to_next_band
        grounds:
          - calculations.financial_aid_tier_banding
          - state_machines.FinancialAidApplication.SUBMITTED_to_APPROVED
          - entities.FinancialAidApplication.fields.awarded_tier
        distinguishing_aspect: "Boundary on a different metric (income band) via POST /approve: adjusted_income exactly equal to TIER_2_CEILING (4,000,000) is NOT < ceiling, so it falls to the next-less-generous band TIER_1, proving strict '<' at the boundary."
