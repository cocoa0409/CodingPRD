    instances:
      - name: standard_supersede_cascades_to_decert_models_placements_project_and_quote
        grounds:
          - state_machines.PlaygroundStandard.ACTIVE_to_SUPERSEDED
          - state_machines.ComponentModel.CERTIFIED_to_DECERTIFIED
          - state_machines.ComponentPlacement.VALIDATED_to_NEEDS_RECERTIFICATION
          - state_machines.DesignProject.CERTIFIED_to_REVISION_REQUESTED
          - state_machines.DesignRendering.ISSUED_to_SUPERSEDED
          - state_machines.Quote.ISSUED_to_EXPIRED
          - calculations.surfacing_depth_requirement
          - validations[priority=47]
        distinguishing_aspect: |
          A single POST /playground/standards/{id}/supersede propagates five hops deep along the
          certification edge - standard -> ComponentModel -> ComponentPlacement -> DesignProject
          (compliance_status AND design_status) -> DesignRendering/Quote - and the same call
          re-derives the touched PlayArea's critical_fall_height_cm to 0 because every placement
          left the DRAFT/VALIDATED input set; the trigger is a compliance edition change, not an
          inspection outcome.
