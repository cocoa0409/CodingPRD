      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
