# =============================================================================
# Supplemental & Voluntary Benefits (Aflac-style) — benchmark seed tables (v1)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Supplemental & Voluntary Benefits (Aflac style): policy type
  (accident/critical-illness/hospital-indemnity), payroll-deduction enrollment,
  guaranteed-issue window, claim & benefit-schedule payout (flat per event),
  wellness/rider benefit, portability on termination, cafeteria-plan
  (Section 125) integration, direct-deposit claim

domain_name: supplemental-voluntary-benefits
api_prefix: /benefits

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # guaranteed-issue vs evidence-of-insurability premium; provisional vs adjudicated claim payout
    - cascading_side_effects          # claim approval -> disbursement -> ledger; termination -> enrollment -> portability
    - rate_threshold_triggers         # annual benefit caps, per-event lifetime maxima, GI window boundaries
    - derived_field_reconciliation    # employee.total_weekly_deduction_cents, enrollment.benefit_remaining_cents
    - optimistic_concurrency          # CREATE-with-supersede on PortabilityConversion against a stale Enrollment

  entity_topology: flat
  # Peer collections under /benefits linked by foreign keys (employer_id,
  # plan_product_id, enrollment_id, ...). No nesting in URL paths; every
  # parent->child relationship is discovered via a filtered list endpoint.

  state_machine_shape: parallel
  # Enrollment carries two independent state dimensions: lifecycle_status
  # (PENDING->ACTIVE->...) and funding_status (UNFUNDED<->CURRENT<->LAPSED) that
  # evolve on different triggers. Claim is branching fork-join with revert.

  relationship_patterns:
    - one_to_many        # Employer -> Employees, PlanProduct -> BenefitScheduleItems (FK links)
    - cross_aggregate    # Claim references Enrollment + DisbursementAccount across aggregates
    - polymorphic        # Claim.event_code is interpreted against the enrolled product's schedule

  role_model: peer_roles
  # BenefitsAdmin (employer side), ClaimsAdjuster (carrier side), Employee
  # (self-service), Payroll (deduction processing), plus opaque System. No single
  # role can do another's exclusive operations.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: section_125_plan_active, type: boolean, source: input, default: true, description: "Whether the employer sponsors a Section 125 cafeteria plan; gates pre-tax elections" }
      - { name: pay_periods_per_year, type: integer, source: input, default: 52, description: "Payroll frequency: 52 (weekly), 26 (biweekly), 24 (semimonthly), 12 (monthly)", constraints: "one of {52, 26, 24, 12}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }

  - name: PlanProduct
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; owning employer" }
      - { name: policy_type, type: enum, source: input, description: "ACCIDENT | CRITICAL_ILLNESS | HOSPITAL_INDEMNITY", constraints: "ACCIDENT | CRITICAL_ILLNESS | HOSPITAL_INDEMNITY" }
      - { name: product_name, type: string, source: input, description: "Marketing name of the product" }
      - { name: weekly_premium_cents, type: integer, source: input, description: "Base weekly premium in cents at guaranteed-issue; the per-week cost before pay-period conversion", constraints: ">= 0" }
      - { name: eoi_surcharge_bps, type: integer, source: input, default: 0, description: "Evidence-of-insurability surcharge in basis points applied to premium when enrolled OUTSIDE the guaranteed-issue window", constraints: ">= 0" }
      - { name: annual_benefit_cap_cents, type: integer, source: input, description: "Maximum total benefit the product pays per enrollment per benefit year", constraints: ">= 0" }
      - { name: portability_loadup_bps, type: integer, source: input, default: 1000, description: "Premium load-up in basis points applied to weekly_premium_cents when the policy is ported after termination", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | CLOSED — DRAFT cannot be enrolled into; OPEN accepts enrollments; CLOSED is retired", constraints: "DRAFT | OPEN | CLOSED" }

  - name: BenefitScheduleItem
    parent: PlanProduct
    common_fields: false
    fields:
      - { name: plan_product_id, type: string, source: system, description: "FK -> PlanProduct.id; owning product" }
      - { name: event_code, type: string, source: input, description: "Covered-event code (e.g., FRACTURE_FEMUR, HEART_ATTACK, HOSP_ADMIT). Unique per plan_product_id" }
      - { name: flat_benefit_cents, type: integer, source: input, description: "Flat payout per occurrence of this event, in cents", constraints: ">= 0" }
      - { name: lifetime_max_occurrences, type: integer, source: input, default: 0, description: "Max times this event can be paid per enrollment over its life; 0 means unlimited", constraints: ">= 0" }
      - { name: is_wellness, type: boolean, source: input, default: false, description: "True if this is the wellness/rider benefit line (paid on WELLNESS_SCREENING, exempt from the annual cap)" }

  - name: EnrollmentPeriod
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; owning employer" }
      - { name: label, type: string, source: input, description: "Open-enrollment label (e.g., 'OE-2026')" }
      - { name: gi_window_start, type: datetime, source: input, description: "Guaranteed-issue window start (inclusive). Enrollments created at-or-after this and strictly-before gi_window_end are guaranteed-issue (no EOI surcharge)" }
      - { name: gi_window_end, type: datetime, source: input, description: "Guaranteed-issue window end (exclusive). At-or-after this instant, enrollment requires EOI and incurs eoi_surcharge_bps", constraints: "gi_window_end > gi_window_start" }
      - { name: benefit_year_start, type: datetime, source: input, description: "Benefit-year start used to scope the annual_benefit_cap accumulation window" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | OPEN | CLOSED", constraints: "SCHEDULED | OPEN | CLOSED" }

  - name: Employee
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; employing organization" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Unique per employer_id among EMPLOYED employees" }
      - { name: employment_status, type: enum, source: system, default: "EMPLOYED", description: "EMPLOYED | TERMINATED", constraints: "EMPLOYED | TERMINATED" }
      - { name: total_weekly_deduction_cents, type: integer, source: computed, description: "Sum of weekly_deduction_cents across this employee's ACTIVE enrollments; recomputed on enrollment activate/lapse/terminate" }

  - name: DisbursementAccount
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; account owner" }
      - { name: routing_number, type: string, source: input, description: "9-digit ABA routing number", constraints: "exactly 9 digits" }
      - { name: account_last4, type: string, source: input, description: "Last four digits of the deposit account" }
      - { name: verification_status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED | VERIFIED — direct-deposit claims require VERIFIED", constraints: "UNVERIFIED | VERIFIED" }
      - { name: is_default, type: boolean, source: system, default: false, description: "Whether this is the employee's default disbursement target; at most one VERIFIED default per employee" }

  - name: Enrollment
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; the enrolled member" }
      - { name: plan_product_id, type: string, source: input, description: "FK -> PlanProduct.id; the chosen product" }
      - { name: enrollment_period_id, type: string, source: input, description: "FK -> EnrollmentPeriod.id; the open-enrollment context establishing the GI window and benefit year" }
      - { name: pretax, type: boolean, source: input, default: false, description: "If true, premium is deducted pre-tax under Section 125; requires employer.section_125_plan_active" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical-clock instant the enrollment was created; decides GI-window membership" }
      - { name: gi_status, type: enum, source: computed, description: "GUARANTEED_ISSUE | EVIDENCE_REQUIRED — set at creation from enrolled_at vs the period GI window", constraints: "GUARANTEED_ISSUE | EVIDENCE_REQUIRED" }
      - { name: weekly_premium_cents, type: integer, source: computed, description: "Frozen weekly premium for this enrollment including EOI surcharge / portability load-up; see calc premium_assessment" }
      - { name: weekly_deduction_cents, type: integer, source: computed, description: "Per-pay-period payroll deduction derived from weekly_premium_cents and employer.pay_periods_per_year; see calc deduction_conversion" }
      - { name: benefit_paid_cents, type: integer, source: computed, default: 0, description: "Running total of capped benefit dollars paid to this enrollment in the current benefit year (wellness excluded)" }
      - { name: benefit_remaining_cents, type: integer, source: computed, description: "= product.annual_benefit_cap_cents - benefit_paid_cents; floored at 0" }
      - { name: lifecycle_status, type: enum, source: system, default: "PENDING", description: "Lifecycle dimension: PENDING | ACTIVE | TERMINATED | PORTED | DECLINED", constraints: "PENDING | ACTIVE | TERMINATED | PORTED | DECLINED" }
      - { name: funding_status, type: enum, source: system, default: "UNFUNDED", description: "Funding dimension (independent of lifecycle): UNFUNDED | CURRENT | LAPSED", constraints: "UNFUNDED | CURRENT | LAPSED" }

  - name: PayrollDeduction
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the funded policy" }
      - { name: pay_period_index, type: integer, source: input, description: "Monotonic pay-period sequence number within the benefit year; unique per enrollment_id", constraints: ">= 0" }
      - { name: amount_cents, type: integer, source: computed, description: "Deducted amount for this period; equals enrollment.weekly_deduction_cents at posting time" }
      - { name: outcome, type: enum, source: input, description: "POSTED | FAILED — POSTED funds the enrollment, FAILED counts toward lapse", constraints: "POSTED | FAILED" }

  - name: Claim
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the policy under which the claim is filed" }
      - { name: disbursement_account_id, type: string, source: input, description: "FK -> DisbursementAccount.id; direct-deposit target for an approved payout" }
      - { name: event_code, type: string, source: input, description: "Covered-event code; must match a BenefitScheduleItem.event_code on the enrolled product" }
      - { name: event_date, type: datetime, source: input, description: "Date the covered event occurred; must fall on/after enrollment.enrolled_at" }
      - { name: claimed_cents, type: integer, source: computed, description: "Scheduled flat benefit for the event_code at filing time (before cap/lifetime limiting)" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Benefit actually approved after cap and lifetime-max limiting; see calc claim_adjudication" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Amount disbursed; equals approved_cents once a Disbursement settles, else 0" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | PAID | VOIDED", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | PAID | VOIDED" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Populated when status=DENIED" }

  - name: Disbursement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the approved claim being paid" }
      - { name: disbursement_account_id, type: string, source: system, description: "FK -> DisbursementAccount.id; the direct-deposit target" }
      - { name: amount_cents, type: integer, source: computed, description: "= claim.approved_cents at disbursement creation" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | SETTLED | RETURNED", constraints: "INITIATED | SETTLED | RETURNED" }

  - name: PortabilityConversion
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the terminated enrollment being ported" }
      - { name: expected_enrollment_version, type: integer, source: input, description: "OCC: the Enrollment.version the client last observed; rejected if stale" }
      - { name: direct_bill_weekly_cents, type: integer, source: computed, description: "Ported weekly premium = product.weekly_premium_cents * (1 + portability_loadup_bps/10000), rounded; see calc portability_premium" }
      - { name: status, type: enum, source: system, default: "CONVERTED", description: "CONVERTED | CANCELLED", constraints: "CONVERTED | CANCELLED" }

  - name: Section125Election
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the pre-tax enrollment this election governs" }
      - { name: plan_year_label, type: string, source: input, description: "Cafeteria plan year (e.g., '2026')" }
      - { name: annual_pretax_amount_cents, type: integer, source: computed, description: "Locked annual pre-tax election = enrollment.weekly_premium_cents * 52; irrevocable absent a qualifying event" }
      - { name: status, type: enum, source: system, default: "LOCKED", description: "LOCKED | REVOKED — REVOKED only via a qualifying-life-event change", constraints: "LOCKED | REVOKED" }
      - { name: qualifying_event, type: string, source: system, default: null, description: "Populated on REVOKED: the qualifying-life-event reason (e.g., TERMINATION, MARRIAGE)" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  # --- Enrollment: PARALLEL state dimensions (lifecycle × funding) ---
  - entity: Enrollment
    initial_state: PENDING            # lifecycle dimension initial; funding initial = UNFUNDED
    terminal_states: [DECLINED, PORTED]
    transitions:
      # lifecycle dimension
      - from: PENDING
        to: ACTIVE
        trigger: "POST /benefits/enrollments/{enrollmentId}/activate"
        actor: BenefitsAdmin
        preconditions:
          - "enrollment.lifecycle_status == PENDING"
          - "PlanProduct.status == OPEN (else ERR_PRODUCT_NOT_OPEN)"
          - "Employee.employment_status == EMPLOYED (else ERR_EMPLOYEE_TERMINATED)"
          - "if enrollment.pretax: Employer.section_125_plan_active == true (else ERR_SECTION125_INACTIVE)"
        side_effects:
          - "Recompute Employee.total_weekly_deduction_cents (add this enrollment's weekly_deduction_cents)"
          - "If pretax: create Section125Election (status=LOCKED, annual_pretax_amount_cents = weekly_premium_cents*52)"
      - from: PENDING
        to: DECLINED
        trigger: "POST /benefits/enrollments/{enrollmentId}/decline"
        actor: BenefitsAdmin
        preconditions:
          - "enrollment.lifecycle_status == PENDING"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /benefits/employees/{employeeId}/terminate (cascade) OR POST /benefits/enrollments/{enrollmentId}/terminate"
        actor: BenefitsAdmin
        preconditions:
          - "enrollment.lifecycle_status == ACTIVE"
        side_effects:
          - "Recompute Employee.total_weekly_deduction_cents (remove this enrollment's weekly_deduction_cents)"
          - "If a LOCKED Section125Election exists: transition it to REVOKED with qualifying_event=TERMINATION"
          - "funding_status set to LAPSED"
      - from: TERMINATED
        to: PORTED
        trigger: "POST /benefits/enrollments/{enrollmentId}/portability-conversions (create PortabilityConversion)"
        actor: Employee
        preconditions:
          - "enrollment.lifecycle_status == TERMINATED"
          - "no existing CONVERTED PortabilityConversion for this enrollment (else ERR_ALREADY_PORTED)"
          - "expected_enrollment_version matches Enrollment.version (else ERR_STALE_ENROLLMENT_VERSION)"
        side_effects:
          - "Create PortabilityConversion (status=CONVERTED) with computed direct_bill_weekly_cents"
          - "increments Enrollment.version by 1"
      # funding dimension (independent of lifecycle)
      - from: UNFUNDED
        to: CURRENT
        trigger: "POST /benefits/enrollments/{enrollmentId}/payroll-deductions with outcome=POSTED"
        actor: Payroll
        preconditions:
          - "enrollment.lifecycle_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "Create PayrollDeduction (outcome=POSTED, amount_cents = weekly_deduction_cents)"
          - "Reset consecutive_failed_count to 0"
          - "funding_status = CURRENT"
      - from: CURRENT
        to: LAPSED
        trigger: "POST /benefits/enrollments/{enrollmentId}/payroll-deductions with outcome=FAILED (third consecutive)"
        actor: Payroll
        preconditions:
          - "enrollment.lifecycle_status == ACTIVE"
        side_effects:
          - "Create PayrollDeduction (outcome=FAILED)"
          - "Increment consecutive_failed_count; when it reaches 3, funding_status = LAPSED"
      - from: LAPSED
        to: CURRENT
        trigger: "POST /benefits/enrollments/{enrollmentId}/payroll-deductions with outcome=POSTED"
        actor: Payroll
        preconditions:
          - "enrollment.lifecycle_status == ACTIVE"
        side_effects:
          - "Create PayrollDeduction (outcome=POSTED); funding_status = CURRENT; consecutive_failed_count = 0"
        note: "Reinstatement loop CURRENT->LAPSED->CURRENT makes the funding dimension cyclic."

  # --- Claim: BRANCHING fork-join with revert ---
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /benefits/claims/{claimId}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /benefits/claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "Enrollment.funding_status == CURRENT (else ERR_ENROLLMENT_NOT_FUNDED)"
          - "claim_adjudication yields approved_cents > 0 (else ERR_BENEFIT_EXHAUSTED)"
        side_effects:
          - "Run claim_adjudication: set approved_cents (capped + lifetime-limited)"
          - "Debit Enrollment.benefit_paid_cents by approved_cents (wellness events excluded); recompute benefit_remaining_cents"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /benefits/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "Set denial_reason from request"
      - from: APPROVED
        to: PAID
        trigger: "POST /benefits/claims/{claimId}/disburse (create Disbursement)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == APPROVED"
          - "DisbursementAccount.verification_status == VERIFIED (else ERR_ACCOUNT_NOT_VERIFIED)"
        side_effects:
          - "Create Disbursement (status=SETTLED, amount_cents = approved_cents)"
          - "Set claim.paid_cents = approved_cents"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /benefits/claims/{claimId}/reopen"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == APPROVED"
          - "no SETTLED Disbursement exists for this claim (else ERR_CLAIM_ALREADY_PAID)"
        side_effects:
          - "COMPENSATION: credit Enrollment.benefit_paid_cents back by approved_cents (wellness excluded); recompute benefit_remaining_cents"
          - "Reset claim.approved_cents = 0"
        note: "Revert edge makes the Claim machine branching-with-revert; the credit-back is the compensating action that conserves benefit_paid_cents."
      - from: APPROVED
        to: VOIDED
        trigger: "POST /benefits/claims/{claimId}/void"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == APPROVED"
          - "no SETTLED Disbursement exists for this claim (else ERR_CLAIM_ALREADY_PAID)"
        side_effects:
          - "COMPENSATION: credit Enrollment.benefit_paid_cents back by approved_cents (wellness excluded); recompute benefit_remaining_cents"

  # --- PlanProduct: linear config lifecycle ---
  - entity: PlanProduct
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /benefits/plan-products/{planProductId}/open"
        actor: BenefitsAdmin
        preconditions:
          - "product.status == DRAFT"
          - "at least one BenefitScheduleItem exists for this product (else ERR_SCHEDULE_EMPTY)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /benefits/plan-products/{planProductId}/close"
        actor: BenefitsAdmin
        preconditions:
          - "product.status == OPEN"
        side_effects: []

  # --- EnrollmentPeriod: linear ---
  - entity: EnrollmentPeriod
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /benefits/enrollment-periods/{periodId}/open"
        actor: BenefitsAdmin
        preconditions:
          - "period.status == SCHEDULED"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /benefits/enrollment-periods/{periodId}/close"
        actor: BenefitsAdmin
        preconditions:
          - "period.status == OPEN"
        side_effects: []

  # --- Disbursement: settlement / return ---
  - entity: Disbursement
    initial_state: INITIATED
    terminal_states: [SETTLED, RETURNED]
    transitions:
      - from: INITIATED
        to: SETTLED
        trigger: "system (synchronous on creation when account VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Set parent Claim.status = PAID and Claim.paid_cents = amount_cents"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /benefits/disbursements/{disbursementId}/return"
        actor: ClaimsAdjuster
        preconditions:
          - "disbursement.status == SETTLED"
        side_effects:
          - "COMPENSATION: credit Enrollment.benefit_paid_cents back by amount_cents (wellness excluded); recompute benefit_remaining_cents"
          - "Set parent Claim.status = APPROVED and Claim.paid_cents = 0"
        note: "ACH return reverses the ledger and bumps the claim back to APPROVED."

  # --- Section125Election: locked-then-revoked on qualifying event ---
  - entity: Section125Election
    initial_state: LOCKED
    terminal_states: [REVOKED]
    transitions:
      - from: LOCKED
        to: REVOKED
        trigger: "system (cascaded from POST /benefits/enrollments/{enrollmentId}/terminate or POST /benefits/employees/{employeeId}/terminate)"
        actor: system
        preconditions:
          - "election.status == LOCKED"
          - "the governing Enrollment is transitioning ACTIVE -> TERMINATED (a qualifying life event)"
        side_effects:
          - "Set qualifying_event = TERMINATION"
        note: "The IRS Section-125 irrevocability rule means LOCKED elections only flip to REVOKED on a qualifying life event; here that event is the enrollment/employee termination cascade. No direct API endpoint mutates this machine."

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1) — true races only, OCC on parent version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: port-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /benefits/enrollments/{enrollmentId}/portability-conversions"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a PortabilityConversion against an Enrollment whose version has
      advanced since the client last observed it is rejected. A reinstatement
      payroll-deduction posting or a benefit credit-back can bump
      Enrollment.version between the client's read and this create, so the
      client's view of the terminated enrollment is stale.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: premium_assessment
    trigger: "Enrollment creation (POST /benefits/enrollments)"
    algorithm: threshold
    formula: |
      base = PlanProduct.weekly_premium_cents
      # GI-window membership decides the EOI surcharge (boundary: [start, end))
      if EnrollmentPeriod.gi_window_start <= enrolled_at < EnrollmentPeriod.gi_window_end:
        gi_status = GUARANTEED_ISSUE
        weekly_premium_cents = base
      else:
        gi_status = EVIDENCE_REQUIRED
        # surcharge applied multiplicatively, round half up to whole cents
        weekly_premium_cents = round_half_up(base * (1 + eoi_surcharge_bps / 10000))
    input_set: "the single PlanProduct + EnrollmentPeriod referenced by the enrollment"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up"
    variants:
      - name: guaranteed_issue
        when: "enrolled_at within [gi_window_start, gi_window_end)"
        difference: "no EOI surcharge; weekly_premium_cents = base"
      - name: evidence_required
        when: "enrolled_at at/after gi_window_end (or before gi_window_start)"
        difference: "weekly_premium_cents = base scaled by (1 + eoi_surcharge_bps/10000)"

  - name: deduction_conversion
    trigger: "Enrollment creation; recomputed if weekly_premium_cents changes"
    algorithm: tiered_pricing
    formula: |
      # Convert a weekly premium to a per-pay-period deduction.
      annual_cents = weekly_premium_cents * 52
      ppy = Employer.pay_periods_per_year   # one of 52, 26, 24, 12
      # Distribute annual across pay periods; pin order: divide then floor,
      # remainder cents are added to the FINAL period of the year (handled at
      # payroll time), so the per-period base is the floor.
      weekly_deduction_cents = floor(annual_cents / ppy)
    input_set: "the enrollment's frozen weekly_premium_cents and the employer pay frequency"
    constants:
      WEEKS_PER_YEAR: 52
    precision: "whole cents, floor; remainder to final period"
    variants:
      - name: weekly_payroll
        when: "Employer.pay_periods_per_year == 52"
        difference: "weekly_deduction_cents == weekly_premium_cents (annual/52)"
      - name: monthly_payroll
        when: "Employer.pay_periods_per_year == 12"
        difference: "weekly_deduction_cents == floor(weekly_premium_cents*52/12), a larger per-period amount"

  - name: claim_adjudication
    trigger: "Claim approval (POST /benefits/claims/{claimId}/approve)"
    algorithm: waterfall_allocation
    formula: |
      sched = BenefitScheduleItem for (enrollment.plan_product_id, claim.event_code)
      claimed_cents = sched.flat_benefit_cents
      # 1. lifetime-occurrence limit (count prior APPROVED/PAID claims of this
      #    event_code on this enrollment, EXCLUDING any later reverted/voided)
      if sched.lifetime_max_occurrences > 0:
        prior = count(claims with same enrollment_id, same event_code,
                      status in {APPROVED, PAID})
        if prior >= sched.lifetime_max_occurrences:
          approved_cents = 0   # -> ERR_LIFETIME_MAX_REACHED at validation
      # 2. annual cap (wellness events bypass the cap entirely)
      if sched.is_wellness:
        approved_cents = claimed_cents          # uncapped, does NOT touch benefit_paid_cents
      else:
        remaining = max(0, product.annual_benefit_cap_cents - enrollment.benefit_paid_cents)
        approved_cents = min(claimed_cents, remaining)
      # approved_cents == 0 for a non-wellness claim => ERR_BENEFIT_EXHAUSTED
    input_set: "prior APPROVED/PAID claims on the enrollment for occurrence count; enrollment.benefit_paid_cents for the cap"
    constants: {}
    precision: "whole cents; no rounding (flat amounts are integral cents)"
    variants:
      - name: provisional_at_filing
        when: "claim is created (SUBMITTED); claimed_cents recorded but approved_cents stays 0"
        difference: "claimed_cents = raw schedule amount, NOT yet limited by cap or lifetime max"
      - name: adjudicated_at_approval
        when: "claim moves UNDER_REVIEW -> APPROVED"
        difference: "approved_cents = min(claimed_cents, annual_remaining) after lifetime check; can be < claimed_cents"

  - name: portability_premium
    trigger: "PortabilityConversion creation (TERMINATED enrollment ported)"
    algorithm: threshold
    formula: |
      base = PlanProduct.weekly_premium_cents   # NOTE: product base, not the
                                                # enrollment's surcharged premium
      direct_bill_weekly_cents = round_half_up(base * (1 + portability_loadup_bps / 10000))
    input_set: "the ported enrollment's PlanProduct base premium and load-up bps"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up"

  - name: lapse_evaluation
    trigger: "PayrollDeduction posting (outcome FAILED or POSTED)"
    algorithm: chronological
    formula: |
      # Process deductions in pay_period_index ascending (NOT created_at).
      # Maintain consecutive_failed_count:
      #   POSTED -> count = 0, funding_status = CURRENT
      #   FAILED -> count += 1; if count >= LAPSE_THRESHOLD (3): funding_status = LAPSED
      # Boundary: the 3rd consecutive FAILED lapses; the 2nd does not.
    input_set: "this enrollment's PayrollDeduction rows ordered by pay_period_index ascending"
    constants:
      LAPSE_THRESHOLD: 3
    precision: "integer count"

  - name: employee_total_deduction
    trigger: "Enrollment activate / terminate / lapse; derived-field reconciliation"
    algorithm: aggregation
    formula: |
      Employee.total_weekly_deduction_cents =
        sum(e.weekly_deduction_cents
            for e in this employee's Enrollments
            where e.lifecycle_status == ACTIVE)
    input_set: "this employee's Enrollments filtered to lifecycle_status == ACTIVE"
    constants: {}
    precision: "whole cents"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves (employer, product, period, employee, enrollment, claim, account), validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Cross-aggregate references are consistent (enrollment's product belongs to the path employer; claim's disbursement_account belongs to the enrollment's employee; enrollment's product matches the schedule item's product)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 409
    applies_to: "POST enrollments, POST claims"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Section 125 pre-tax enrollment requires employer.section_125_plan_active == true"
    error_id: ERR_SECTION125_INACTIVE
    http_status: 409
    applies_to: "POST enrollments (pretax=true), POST .../activate"

  - priority: 7
    category: business_temporal
    check: "Claim.event_date must be on/after enrollment.enrolled_at and the enrollment must be ACTIVE when the claim is filed"
    error_id: ERR_EVENT_BEFORE_COVERAGE
    http_status: 422
    applies_to: "POST claims"

  - priority: 8
    category: business_constraint
    check: "Claim.event_code must match a BenefitScheduleItem on the enrolled product"
    error_id: ERR_EVENT_NOT_COVERED
    http_status: 422
    applies_to: "POST claims"

  - priority: 9
    category: business_safety
    check: "Direct-deposit disbursement requires the target DisbursementAccount.verification_status == VERIFIED"
    error_id: ERR_ACCOUNT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST .../claims/{id}/disburse"

  - priority: 10
    category: business_constraint
    check: "Approving a claim whose lifetime occurrence count is already at the schedule item's lifetime_max_occurrences is rejected"
    error_id: ERR_LIFETIME_MAX_REACHED
    http_status: 409
    applies_to: "POST .../claims/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Approving a non-wellness claim when the enrollment's annual benefit remaining is 0 is rejected (cap already exhausted)"
    error_id: ERR_BENEFIT_EXHAUSTED
    http_status: 409
    applies_to: "POST .../claims/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "Approving a claim requires the enrollment.funding_status == CURRENT"
    error_id: ERR_ENROLLMENT_NOT_FUNDED
    http_status: 409
    applies_to: "POST .../claims/{id}/approve"

  - priority: 13
    category: business_constraint
    check: "Porting requires the enrollment.lifecycle_status == TERMINATED and no existing CONVERTED PortabilityConversion"
    error_id: ERR_ALREADY_PORTED
    http_status: 409
    applies_to: "POST .../portability-conversions"

  - priority: 14
    category: concurrency
    check: "expected_enrollment_version must equal the current Enrollment.version (OCC)"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST .../portability-conversions"

  - priority: 15
    category: business_constraint
    check: "Enrollment uniqueness: an employee may hold at most one non-terminal enrollment (lifecycle in {PENDING, ACTIVE}) per PlanProduct"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST enrollments"

  - priority: 16
    category: business_constraint
    check: "Request body field-level validation (enum membership, non-negative amounts, 9-digit routing number, required fields present)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

