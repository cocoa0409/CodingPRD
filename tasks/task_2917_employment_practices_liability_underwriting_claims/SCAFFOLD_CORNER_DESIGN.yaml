              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /epli/defense-invoices/${inv_id}/dispute"
              payload: { partner_hours: 1.0 }
              as: PanelCounsel
              as_user_id: "${firm_id}"
              captures: { e_disputable: $.data.error_id }
            - call: "POST /epli/defense-invoices/${inv_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-002"
              captures: { e_approvable: $.data.error_id }
            - call: "POST /epli/defense-invoices/${inv_id}/audit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/defense-invoices/${inv_id}/audit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_auditable: $.data.error_id }
            - call: "POST /epli/claims/${c1_id}/indemnity-payments"
              payload: { amount_cents: 2500000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay_id: $.data.id }
            - call: "POST /epli/indemnity-payments/${pay_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
            - call: "POST /epli/indemnity-payments/${pay_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
              captures: { e_pay_approvable: $.data.error_id }
            - call: "POST /epli/indemnity-payments/${pay_id}/void"
              payload: { void_reason: "Settlement collapsed" }
              as: ClaimsManager
              as_user_id: "clm-001"
            - call: "POST /epli/indemnity-payments/${pay_id}/void"
              payload: { void_reason: "Again" }
              as: ClaimsManager
              as_user_id: "clm-001"
              captures: { e_pay_voidable: $.data.error_id }
            - call: "POST /epli/defense-assignments/${asg_id}/close"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/defense-assignments/${asg_id}/close"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_asg_closable: $.data.error_id }
          assert:
            - "dispute on the SUBMITTED invoice returns 409 with error_id ERR_INVOICE_NOT_DISPUTABLE"
            - "approve on the SUBMITTED invoice returns 409 with error_id ERR_INVOICE_NOT_APPROVABLE, not ERR_RETENTION_NOT_SATISFIED, because the state check at priority 8 runs first"
            - "the audit returns 200: DefenseInvoice.${inv_id}.status == UNDER_AUDIT with allowed_amount_cents 450000"
            - "the replayed audit returns 409 with error_id ERR_INVOICE_NOT_AUDITABLE and allowed_amount_cents stays 450000"
            - "the payment approval returns 200 and the replay returns 409 with error_id ERR_PAYMENT_NOT_APPROVABLE"
            - "the void returns 200 with status VOIDED and Claim.${c1_id}.retention_satisfied_cents back to 0, and the replayed void returns 409 with error_id ERR_PAYMENT_NOT_VOIDABLE"
            - "the assignment close returns 200 and the replay returns 409 with error_id ERR_ASSIGNMENT_NOT_CLOSABLE"
            - "DefensePanelFirm.${firm_id}.open_matter_count == 0 after the single successful close"

      - name: a_missing_or_blank_user_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - rbac.identity_resolution
        distinguishing_aspect: "Authentication is resolved before anything else: with no X-User-ID header, with an empty-string header, and with a header value that matches no principal, the same 401 ERR_UNAUTHENTICATED is returned even when the rest of the request is a well-formed write that a valid PlatformAdmin would have accepted."
        test_recipe:
          setup:
            - "An empty database; no header is supplied on the first call, an empty string on the second, and an unknown principal id on the third."
          setup_api_calls: []
          trigger:
            - call: "GET /epli/jurisdictions"
              payload: {}
              as: none
              as_user_id: null
              captures: { e_missing: $.data.error_id }
            - call: "GET /epli/jurisdictions"
              payload: {}
              as: none
              as_user_id: ""
              captures: { e_blank: $.data.error_id }
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: none
              as_user_id: "nobody-999"
              captures: { e_unknown: $.data.error_id }
          assert:
            - "the request with no X-User-ID header returns 401 with error_id ERR_UNAUTHENTICATED"
            - "the request with X-User-ID set to the empty string returns 401 with error_id ERR_UNAUTHENTICATED"
            - "the well-formed jurisdiction create under an unknown principal returns 401 with error_id ERR_UNAUTHENTICATED and creates no row"
            - "a following GET /epli/jurisdictions as admin-001 returns total_count 0, proving the unauthenticated write was not applied"

  - section: rbac
    instances:

      - name: exclusive_write_endpoints_refuse_every_other_role
        claim_type: exclusive_operations
        grounds:
          - rbac.PlatformAdmin.exclusive_operations
          - rbac.Underwriter.exclusive_operations
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Authorisation is resolved from X-User-ID before any body or path validation, so eight cross-role attempts on endpoints whose payloads are perfectly valid all return 403 ERR_UNAUTHORIZED — including a read, GET /epli/defense-panel-firms, that Underwriter is deliberately not granted even though it holds the rest of the underwriting read surface."
        test_recipe:
          setup:
            - "Jurisdiction TX exists and applicant Vantage Mills LLC ${app_id} was created by uw-001, proving the positive side of Underwriter's exclusive create."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Vantage Mills LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_jur: $.data.error_id }
            - call: "POST /epli/rate-plans"
              payload: { name: "Rogue Plan", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_plan: $.data.error_id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Rogue Counsel LLP", tier: "LOCAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_firm: $.data.error_id }
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: UnderwritingManager
              as_user_id: "uwm-001"
              captures: { e_clock: $.data.error_id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Rogue Holdings LLC", total_headcount: 10, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 10 }], primary_jurisdiction_code: "TX" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_app: $.data.error_id }
            - call: "PATCH /epli/applicants/${app_id}"
              payload: { prior_year_separations: 9 }
              as: UnderwritingManager
              as_user_id: "uwm-001"
              captures: { e_patch: $.data.error_id }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "00000000-0000-4000-8000-000000000002", requested_aggregate_limit_cents: 10000000, requested_retention_cents: 2500000, expected_applicant_version: "${app_v}" }
              as: UnderwritingManager
              as_user_id: "uwm-001"
              captures: { e_asm: $.data.error_id }
            - call: "GET /epli/defense-panel-firms"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_read: $.data.error_id }
          assert:
            - "all eight calls return HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "the assessment attempt returns ERR_UNAUTHORIZED and not ERR_RATE_PLAN_NOT_FOUND, even though its rate_plan_id was never minted, because priority 2 precedes priority 5"
            - "the PATCH attempt returns ERR_UNAUTHORIZED and leaves Applicant.${app_id}.prior_year_separations at 4 and version at ${app_v}"
            - "no Jurisdiction with code CA, no RatePlan named Rogue Plan, no DefensePanelFirm named Rogue Counsel LLP and no Applicant named Rogue Holdings LLC exists afterwards"
            - "the logical clock is still 2026-08-01T00:00:00.000Z"

      - name: panel_counsel_can_only_bill_its_own_assignments
        claim_type: peer_roles
        grounds:
          - rbac.PanelCounsel
          - validations[priority=6]
          - errors.ERR_NOT_ASSIGNED_COUNSEL
        distinguishing_aspect: "PanelCounsel identity is entity_backed on DefensePanelFirm, so the check is data-level rather than role-level: firm B holds the PanelCounsel role and still gets 403 ERR_NOT_ASSIGNED_COUNSEL when it submits or disputes on firm A's assignment, while firm A's identical submission is accepted — and firm B may still read the assignment."
