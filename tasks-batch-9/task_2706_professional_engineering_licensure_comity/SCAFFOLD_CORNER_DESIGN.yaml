            - "trigger[0] response.data.error_id == \"ERR_STALE_CASE_VERSION\""
            - "trigger[1] response.data.version == ${case_pim_v1} + 1"
            - "trigger[2] http_status == 201"
            - "trigger[2] response.data.status == \"PROPOSED\""
            - "trigger[2] response.data.penalty_cents == 298000"
            - "ConsentOrder.${co_pim_1}.status == \"SUPERSEDED\""
            - "Case.${case_pim}.sanction_status == \"PROPOSED\""
            - "Case.${case_pim}.version == ${case_pim_v1} + 2"

