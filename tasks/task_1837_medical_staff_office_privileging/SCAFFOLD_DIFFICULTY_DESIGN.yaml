  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_waive
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_VERIFICATION_NOT_WAIVABLE]
          - errors[ERR_PRIMARY_SOURCE_NOT_WAIVABLE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: waiving an NPDB_QUERY item that is
          already VERIFIED violates BOTH the state precondition (not in {REQUESTED,RECEIVED}
          -> ERR_VERIFICATION_NOT_WAIVABLE, priority 5) and the safety rule (primary-source
          NPDB not waivable -> ERR_PRIMARY_SOURCE_NOT_WAIVABLE, priority 7). State priority
          wins, so the response must be ERR_VERIFICATION_NOT_WAIVABLE (409), never the
          safety error.
        test_recipe:
          setup:
            - "Member W1 with INITIAL application APPW SUBMITTED; NPDB_QUERY verification item (is_primary_source=true) already advanced to VERIFIED (a QUERY_INITIAL NpdbReport was filed first to satisfy the verify gate)"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. W", npdb_subject_id: "NPDB-W1", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { w1_id: $.data.id, w1_v: $.data.version }
