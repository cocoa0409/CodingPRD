# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Corporate Actions Processing — 9 rules x >=2 instances = 19 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: entitlement_basis_divergence_trade_vs_settled
        grounds:
          - calculations.record_position_snapshot
          - entities.Entitlement.fields.calculation_basis
          - state_machines.Entitlement.PROJECTED_to_FIRM
        distinguishing_aspect: |
          Same lots, same record_date: TRADE_DATE_BASIS (projected at confirm)
          includes the 2026-05-14 lot while SETTLED_BASIS (firm capture) excludes
          it (acquisition after record_date - 2d = 2026-05-13), yielding
          1250 vs 1000 position and 2500 vs 2000 entitled shares on the SAME row.
        test_recipe:
          setup:
            - "ACME security; account A1 with lot L1 qty 1000 acq 2026-04-01 and lot L2 qty 250 acq 2026-05-14"
            - "SPLIT 2:1 event, record_date 2026-05-15, payable 2026-05-29, scrubbed from 2 vendor notifications, CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000001", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "Holder One" }, as: DeskAdministrator, captures: { acct_id: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${acct_id}", security_id: "${sec_id}", quantity: 1000, acquisition_date: "2026-04-01", cost_basis_total_cents: 10000000 }, as: DeskAdministrator }
            - { call: "POST /api/position-lots", payload: { account_id: "${acct_id}", security_id: "${sec_id}", quantity: 250, acquisition_date: "2026-05-14", cost_basis_total_cents: 2500000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { src1_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { src2_id: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src1_id}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1_id: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src2_id}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2_id: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1_id}", "${n2_id}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${acct_id}", payload: {}, as: OperationsManager, captures: { ent_id: "$.data[0].id", proj_pos: "$.data[0].record_position_quantity", proj_sh: "$.data[0].entitled_shares"} }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "GET /api/entitlements/${ent_id}", payload: {}, as: OperationsManager, captures: { firm_pos: $.data.record_position_quantity, firm_sh: $.data.entitled_shares, firm_basis: $.data.calculation_basis, firm_status: $.data.status } }
          assert:
            - "Projected (captured at confirm): record_position_quantity == 1250, entitled_shares == 2500, calculation_basis == TRADE_DATE_BASIS"
            - "Firm (after capture): Entitlement.${ent_id}.record_position_quantity == 1000 AND entitled_shares == 2000 AND calculation_basis == SETTLED_BASIS AND status == FIRM"
            - "The two variants disagree on identical lots: 2500 != 2000"

      - name: claim_compensation_event_terms_vs_market_value
        grounds:
          - calculations.claim_compensation_amount
          - entities.CorporateActionEvent.fields.claim_compensation_basis
          - state_machines.Claim.FILED_to_APPROVED
        distinguishing_aspect: |
          Claim-domain dual variant (distinct from the Entitlement basis variant):
          two identical missed 10-share entitlements compensate 50000 cents under
          EVENT_TERMS (10 x 5000) but 56000 cents under MARKET_VALUE (10 x 5600),
          the variant selected by event.claim_compensation_basis.
        test_recipe:
          setup:
            - "Two securities ACT and ACM; two accounts AT (5 sh ACT) and AM (5 sh ACM), lots acq 2026-04-01"
            - "Each security gets a SPLIT 2:1 event (price 5000), pool 100000; ACT event basis EVENT_TERMS, ACM event basis MARKET_VALUE"
            - "Both events CONFIRMED, captured at 2026-05-15; both accounts FROZEN before booking so both entitlements -> MISSED"
            - "Clock at 2026-06-01 (within claim window payable 2026-05-29 + 30d)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACT", cusip: "CUSP000101", name: "Act Terms Inc" }, as: DeskAdministrator, captures: { sec_t: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "ACM", cusip: "CUSP000102", name: "Acm Market Inc" }, as: DeskAdministrator, captures: { sec_m: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "AT-1", holder_name: "Terms Holder" }, as: DeskAdministrator, captures: { acct_t: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "AM-1", holder_name: "Market Holder" }, as: DeskAdministrator, captures: { acct_m: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${acct_t}", security_id: "${sec_t}", quantity: 5, acquisition_date: "2026-04-01", cost_basis_total_cents: 25000 }, as: DeskAdministrator }
            - { call: "POST /api/position-lots", payload: { account_id: "${acct_m}", security_id: "${sec_m}", quantity: 5, acquisition_date: "2026-04-01", cost_basis_total_cents: 25000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Gamma", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { src1_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Depo Delta", source_type: "DEPOSITORY", reliability_weight: 5 }, as: DeskAdministrator, captures: { src2_id: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src1_id}", security_id: "${sec_t}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { nt1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src2_id}", security_id: "${sec_t}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { nt2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src1_id}", security_id: "${sec_m}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { nm1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${src2_id}", security_id: "${sec_m}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { nm2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_t}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${nt1}", "${nt2}"], compensation_pool_cents: 100000, claim_compensation_basis: "EVENT_TERMS" }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_t: $.data.id }
            - call: "POST /api/events"
              payload: { security_id: "${sec_m}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 5000, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${nm1}", "${nm2}"], compensation_pool_cents: 100000, claim_compensation_basis: "MARKET_VALUE" }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_m: $.data.id }
            - { call: "POST /api/events/${ev_t}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/events/${ev_m}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_t}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "POST /api/events/${ev_m}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "PUT /api/accounts/${acct_t}", payload: { status: "FROZEN" }, as: OperationsManager }
            - { call: "PUT /api/accounts/${acct_m}", payload: { status: "FROZEN" }, as: OperationsManager }
            - { call: "POST /api/events/${ev_t}/book", payload: {}, as: OperationsManager }
            - { call: "POST /api/events/${ev_m}/book", payload: {}, as: OperationsManager }
            - { call: "GET /api/entitlements?event_id=${ev_t}&account_id=${acct_t}", payload: {}, as: OperationsManager, captures: { ent_t: "$.data[0].id", ent_t_status: "$.data[0].status"} }
            - { call: "GET /api/entitlements?event_id=${ev_m}&account_id=${acct_m}", payload: {}, as: OperationsManager, captures: { ent_m: "$.data[0].id"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/claims", payload: { event_id: "${ev_t}", entitlement_id: "${ent_t}", account_id: "${acct_t}", reason: "MISSED_ENTITLEMENT", claimed_amount_cents: 50000 }, as: AccountHolder, as_user_id: "${acct_t}", captures: { cl_t: $.data.id } }
            - { call: "POST /api/claims", payload: { event_id: "${ev_m}", entitlement_id: "${ent_m}", account_id: "${acct_m}", reason: "MISSED_ENTITLEMENT", claimed_amount_cents: 56000, market_price_cents: 5600 }, as: AccountHolder, as_user_id: "${acct_m}", captures: { cl_m: $.data.id } }
          trigger:
            - { call: "POST /api/claims/${cl_t}/decide", payload: { decision: "APPROVED" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { comp_t: $.data.compensation_cents } }
            - { call: "POST /api/claims/${cl_m}/decide", payload: { decision: "APPROVED" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { comp_m: $.data.compensation_cents } }
          assert:
            - "Entitlements went MISSED (frozen accounts): ${ent_t_status} == MISSED"
            - "Claim.${cl_t}.compensation_cents == 50000 (EVENT_TERMS: 10 sh x 5000)"
            - "Claim.${cl_m}.compensation_cents == 56000 (MARKET_VALUE: 10 sh x 5600)"
            - "Identical missed positions diverge by basis variant: 50000 != 56000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: merger_proration_odd_lot_waterfall
        grounds:
          - calculations.merger_proration_allocation
          - entities.CorporateActionEvent.fields.terms
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: cash pool, aggregate cash
          elected, per-account shares, odd-lot classification (99 < 100 <= 120)
          and a floored 4dp proration factor interact: odd-lot A3 is paid in full
          (495000), round-lot A1/A2 get factor 0.3375 -> floor(120 x 0.3375)=40
          cash shares -> 200000 cents + 80 stock shares each.
        test_recipe:
          setup:
            - "ACME and acquirer NEWCO securities; accounts A1 (120 sh), A2 (120 sh), A3 (99 sh), lots acq 2026-04-01"
            - "MERGER event (cash 5000/sh, pool 900000, 1:1 stock, default STOCK), deadline 2026-05-20T16:00:00Z, record 2026-05-15, payable 2026-05-29, CONFIRMED and FIRM-captured at 2026-05-15"
            - "All three accounts elect CASH before the deadline"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000201", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "NWC", cusip: "CUSP000202", name: "Newco Inc" }, as: DeskAdministrator, captures: { newco_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-2", holder_name: "Two" }, as: DeskAdministrator, captures: { a2: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-3", holder_name: "Three" }, as: DeskAdministrator, captures: { a3: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 120, acquisition_date: "2026-04-01", cost_basis_total_cents: 600000 }, as: DeskAdministrator }
            - { call: "POST /api/position-lots", payload: { account_id: "${a2}", security_id: "${sec_id}", quantity: 120, acquisition_date: "2026-04-01", cost_basis_total_cents: 600000 }, as: DeskAdministrator }
            - { call: "POST /api/position-lots", payload: { account_id: "${a3}", security_id: "${sec_id}", quantity: 99, acquisition_date: "2026-04-01", cost_basis_total_cents: 495000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "MERGER", election_required: true, election_deadline: "2026-05-20T16:00:00Z", terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}" }
            - { call: "GET /api/events/${ev_id}", payload: {}, as: OperationsManager, captures: { ev_v: $.data.version } }
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a2}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a2}" }
            - { call: "GET /api/events/${ev_id}", payload: {}, as: OperationsManager, captures: { ev_v: $.data.version } }
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a3}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a3}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: DeskAdministrator }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_id: $.data.id, bk_cash: $.data.total_cash_credited_cents, bk_sh: $.data.total_whole_shares_credited } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { a1_cash: $.data.cash_balance_cents } }
            - { call: "GET /api/accounts/${a3}", payload: {}, as: OperationsManager, captures: { a3_cash: $.data.cash_balance_cents } }
            - { call: "GET /api/position-lots?account_id=${a1}&security_id=${newco_id}", payload: {}, as: OperationsManager, captures: { a1_newco_qty: "$.data[0].quantity"} }
          assert:
            - "A3 (odd-lot 99 < 100): cash_balance_cents == 495000 (full cash, no proration); GET /api/position-lots?account_id=${a3}&security_id=${newco_id} returns total_count == 0"
            - "A1 (round-lot 120): cash_balance_cents == 200000 (floor(120 x 0.3375) = 40 shares x 5000); NEWCO lot quantity == 80"
            - "Booking.${bk_id}.total_cash_credited_cents == 895000 AND total_whole_shares_credited == 160 (pool 900000 retains 5000)"

      - name: cash_in_lieu_per_lot_floor_then_sum
        grounds:
          - calculations.cash_in_lieu_amount
          - calculations.entitlement_share_quantity
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: booking floors PER LOT then
          sums fractions (10.5x1.5=15.75->15 + 10.6x1.5=15.9->15; frac 1.65 ->
          5499 cents), while the aggregate projection floors the sum (31.65 -> 31,
          frac 0.65 -> 2166 cents): same inputs, 30 vs 31 whole shares and
          5499 vs 2166 cash-in-lieu cents.
        test_recipe:
          setup:
            - "ACME security; account A1 with lots 10.5 sh (acq 2026-04-01, basis 105000) and 10.6 sh (acq 2026-04-02, basis 106000)"
            - "SPLIT 3:2 event, price 3333, ROUND_HALF_UP, record 2026-05-15, CONFIRMED then FIRM-captured at 2026-05-15"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000301", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 10.5, acquisition_date: "2026-04-01", cost_basis_total_cents: 105000 }, as: DeskAdministrator, captures: { l1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 10.6, acquisition_date: "2026-04-02", cost_basis_total_cents: 106000 }, as: DeskAdministrator, captures: { l2: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 3, ratio_den: 2, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 3, ratio_den: 2, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 3, ratio_den: 2, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${a1}", payload: {}, as: OperationsManager, captures: { ent_id: "$.data[0].id", proj_sh: "$.data[0].entitled_shares", proj_cil: "$.data[0].cash_in_lieu_cents"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_id: $.data.id } }
            - { call: "GET /api/entitlements/${ent_id}", payload: {}, as: OperationsManager, captures: { bk_sh: $.data.booked_whole_shares, bk_cil: $.data.booked_cash_in_lieu_cents } }
            - { call: "GET /api/position-lots/${l1}", payload: {}, as: OperationsManager, captures: { l1_qty: $.data.quantity, l1_basis: $.data.cost_basis_total_cents } }
            - { call: "GET /api/position-lots/${l2}", payload: {}, as: OperationsManager, captures: { l2_qty: $.data.quantity, l2_basis: $.data.cost_basis_total_cents } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { a1_cash: $.data.cash_balance_cents } }
          assert:
