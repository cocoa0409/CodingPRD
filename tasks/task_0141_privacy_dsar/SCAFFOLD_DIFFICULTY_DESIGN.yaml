              captures: { notif_id: "$.data[0].id", ack_deadline: "$.data[0].ack_deadline_at" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-11T10:00:01Z" }
              as: PrivacyOfficer
          assert:
            - "ProcessorNotification.${notif_id}.ack_deadline_at == 2026-01-11T10:00:00Z"
            - "ProcessorNotification.${notif_id}.state == OVERDUE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_request_count_conserved_across_intake_and_close
        grounds:
          - entities.Controller.fields.open_request_count
          - state_machines.DsarRequest.VERIFICATION_REJECTED_to_CLOSED_REJECTED
          - state_machines.DsarRequest.PENDING_VERIFICATION_to_VERIFICATION_REJECTED
        distinguishing_aspect: |
          Conserved quantity = Controller.open_request_count: intake increments it to 1, the
          compensating close (VERIFICATION_REJECTED -> CLOSED_REJECTED) decrements it back to 0, so
          open_request_count == count of non-terminal requests of the controller holds before and after.
        test_recipe:
          setup:
            - "A single request intaken then rejected and closed; controller open_request_count must return to 0."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C16", jurisdiction: "GDPR", dpo_email: "dpo@c16.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c16@x.example", full_name: "C16 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "GET /controllers/${ctrl_id}"
              as: PrivacyOfficer
              captures: { open_after_intake: $.data.open_request_count }
            - call: "POST /dsar-requests/${req_id}/reject-identity"
              payload: { reason: "no match" }
              as: IntakeAgent
              as_user_id: "intake-16"
          trigger:
            - call: "POST /dsar-requests/${req_id}/close"
              payload: { disposition: "REJECTED" }
              as: PrivacyOfficer
              captures: { final_status: $.data.status }
          assert:
            - "Controller.${ctrl_id}.open_request_count == 0"
            - "DsarRequest.${req_id}.status == CLOSED_REJECTED"

      - name: consent_grant_count_conserved_suppress_then_no_double_withdraw
        grounds:
          - entities.ConsentRecord.fields.state
          - state_machines.ConsentRecord.GRANTED_to_WITHDRAWN
          - state_machines.FulfillmentItem.DISPATCHED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = count of GRANTED ConsentRecords for the subject: a SUPPRESS completion
          withdraws exactly the GRANTED MARKETING/ANALYTICS/SALE_OF_DATA records once (granted_count drops
          from 1 to 0); an ESSENTIAL record stays GRANTED, so withdrawn + still_granted == original total (no drift).
        test_recipe:
          setup:
            - "Subject with one GRANTED MARKETING consent and one GRANTED ESSENTIAL consent; OPT_OUT request fulfilled via SUPPRESS."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C17", jurisdiction: "CCPA", dpo_email: "dpo@c17.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "P17", notify_email: "p17@x.example", sla_ack_hours: 72 }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c17@x.example", full_name: "C17 Subj", jurisdiction_residency: "CALIFORNIA" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${sub_id}", purpose: "MARKETING" }
              as: IntakeAgent
              captures: { consent_mkt_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${sub_id}", purpose: "ESSENTIAL" }
              as: IntakeAgent
              captures: { consent_ess_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "OPT_OUT", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-17" }
              as: IntakeAgent
              as_user_id: "intake-17"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "BEHAVIORAL", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id: $.data.id }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: $.data.version }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-17"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_id}" }
              as: PrivacyOfficer
              captures: { item_id: "$.data[0].id", item_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item_id}/dispatch"
              payload: { expected_item_version: "${item_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item_id}/notifications"
              as: FulfillmentWorker
              captures: { notif_id: "$.data[0].id" }
            - call: "POST /processor-notifications/${notif_id}/acknowledge"
              as: ProcessorAgent
          trigger:
            - call: "POST /fulfillment-items/${item_id}/complete"
              as: FulfillmentWorker
          assert:
            - "ConsentRecord.${consent_mkt_id}.state == WITHDRAWN"
            - "ConsentRecord.${consent_ess_id}.state == GRANTED"
