          assert:
            - "UtilityOwner.${o1}.open_commitment_days == 15 after the first commitment (window_end exclusive)"
            - "The first trigger call returns 409 with error_id ERR_FACILITY_WINDOW_CONFLICT: 2027-04-22 is inside the existing window widened by the 3-day buffer, even though the raw intervals do not overlap"
            - "The second trigger call returns 201: 2027-04-23 equals existing.window_end plus 3 days, and the exclusion test is strict less-than, so the window is admitted"
