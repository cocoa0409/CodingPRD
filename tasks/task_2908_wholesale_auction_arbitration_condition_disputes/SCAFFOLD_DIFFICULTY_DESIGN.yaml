  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: window_boundary_three_way_at_48h_plus_1s_and_plus_4s
        grounds:
          - calculations.arbitration_window_evaluation
          - entities.ArbitrationCase.fields.hours_elapsed_at_claim
          - validations[priority=33]
          - errors.ERR_ARBITRATION_WINDOW_EXPIRED
        distinguishing_aspect: |
          A three-point probe on the TIME axis whose middle point is a deliberate
          precision artifact: hours_elapsed_at_claim is rounded half-up to 3 decimals, so
          a claim filed one second past a 48-hour window still evaluates to 48.000 and is
          admitted, while four seconds past evaluates to 48.001 and is barred. An
          implementation comparing raw instants instead of the rounded figure fails the
          middle point; one comparing with `<` instead of `<=` fails the first.
        test_recipe:
          setup:
            - "one Seller, one Buyer and the MECHANICAL policy with window_hours 48, mileage_limit 250 and min_claim_amount_cents 60000"
            - "THREE AuctionSale rows, all at hammer_time_utc 2026-08-01T00:00:00Z with announced_odometer_miles 84000, so all three share one window boundary at 2026-08-03T00:00:00Z"
            - "no PostSaleInspection exists on any of them, so psi_extension_applied_hours is 0 and effective_window_hours is exactly 48"
            - "the clock advances monotonically 2026-08-03T00:00:00Z -> :01Z -> :04Z across the three probes"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_at_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE22222", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_plus1s_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE33333", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_plus4s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AuctionAdmin
          trigger:
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_at_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84100, complaint_text: "Filed exactly on the window boundary" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_at_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:01Z" }
              as: AuctionAdmin
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_plus1s_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84100, complaint_text: "Filed one second past the boundary" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_plus1s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:04Z" }
              as: AuctionAdmin
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_plus4s_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84100, complaint_text: "Filed four seconds past the boundary" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
          assert:
            - "probe 1 (exactly at the boundary) — HTTP 201 with hours_elapsed_at_claim == 48.0, effective_window_hours == 48, psi_extension_applied_hours == 0 and window_eligible == true; the <= comparison is inclusive"
            - "probe 2 (+1 second) — HTTP 201 with hours_elapsed_at_claim == 48.0, because 1/3600 h = 0.000278 rounds half-up to 0.000 at three decimals; window_eligible == true"
            - "probe 3 (+4 seconds) — HTTP 409 with response.data.error_id == \"ERR_ARBITRATION_WINDOW_EXPIRED\", because 4/3600 h = 0.001111 rounds to 0.001 and 48.001 > 48"
            - "GET /arbitration/cases/${case_at_id} and GET /arbitration/cases/${case_plus1s_id} both return status == \"SUBMITTED\" and hours_elapsed_at_claim == 48.0"
            - "GET /arbitration/cases?sale_id=${sale_plus4s_id} returns 0 rows and GET /arbitration/sales/${sale_plus4s_id} returns arbitration_status == \"NONE\""
            - "GET /arbitration/buyers/${buyer_id} returns lifetime_claim_count == 2 and open_claim_count == 2 — the rejected probe incremented nothing"

      - name: min_scorecard_sales_boundary_gates_a_higher_rate_than_the_block_threshold
        grounds:
          - calculations.seller_arbitration_rate
          - state_machines.Seller.GOOD_STANDING_to_BLOCKED
          - entities.Seller.fields.rolling_window_sales_count
          - endpoints[GET /arbitration/sellers/{id}/scorecard]
        distinguishing_aspect: |
          Two thresholds fight each other at their own boundaries and the SMALLER rate
          wins the worse outcome: seller A ends at 3333 bps on 3 in-window sales and stays
          GOOD_STANDING because rolling_window_sales_count 3 is one short of
          MIN_SCORECARD_SALES 4, while seller B ends at exactly 2500 bps on 4 sales and is
          BLOCKED because the tier comparison is inclusive (>= TIER_BLOCK_BPS). Both
          boundary directions are probed on the same trigger.
