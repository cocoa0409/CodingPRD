            - "GET /amnesty/payment-plans/${plan_id}/installments?status=DEFAULTED returns total_count == 11"
            - "GET /amnesty/payment-plans/${plan_id}/installments?status=LATE returns total_count == 0"
            - "GET /amnesty/payment-plans/${plan_id}/installments?status=SCHEDULED returns total_count == 0"
            - "VoluntaryDisclosureAgreement.${agr_id}.payment_status == \"DELINQUENT\""
            - "VoluntaryDisclosureAgreement.${agr_id}.status == \"EXECUTED\""
            - "a second sweep at the same clock instant reports marked_late_count 0, defaulted_installment_count 0 and defaulted_plan_count 0"

      - name: cyclic_negotiation_loop_terminates_on_the_counter_cap
        claim_type: cyclic shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PreClearanceRequest.TERMS_OFFERED_to_COUNTERED
        excluded_because:
          difficulty_instance: negotiation_cycles_three_counters_then_hits_counter_limit
          rationale: |
            That instance drives the TERMS_OFFERED -> COUNTERED -> TERMS_OFFERED loop
            four times, asserts round_index 7 and counter_count 3, and shows the cycle
            terminating on MAX_REPRESENTATIVE_COUNTERS. A corner test would replay the
            same loop with fewer iterations.

      - name: parallel_status_and_payment_status_dimensions
        claim_type: parallel shape
        grounds:
          - complexity_profile.state_machine_shape
          - entities.VoluntaryDisclosureAgreement.fields.payment_status
        excluded_because:
          difficulty_instance: agreement_status_and_payment_status_move_on_independent_axes
          rationale: |
            The independence of the lifecycle axis and the cash axis is exactly that
            instance's subject: it defaults a plan and shows status staying EXECUTED
            while payment_status becomes DELINQUENT.

      - name: cascade_down_from_program_close
        claim_type: Cascade down
        grounds:
          - state_machines.AmnestyProgram.OPEN_to_CLOSED.side_effects
        excluded_because:
          difficulty_instance: program_close_cascades_two_independent_chains
          rationale: |
            That instance verifies both close chains, including the rule that only
            non-terminal children are touched (a DRAFT return is VOIDED, a DRAFTED
            agreement LAPSES) and that the two chains do not contaminate each other.

      - name: compensation_reverses_every_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.VoluntaryDisclosureAgreement.BREACHED_to_EXECUTED.side_effects
        excluded_because:
          difficulty_instance: breach_rescission_restores_the_waiver_ledger_exactly
          rationale: |
            That instance walks all five breach hops and their four compensating hops and
            asserts the waiver-ledger identity holds again with no drift, which is the
            whole content of the Compensation row.

  # =========================================================================
  - section: Table 3 Calculations
    instances:
      - name: penalty_tier_boundary_at_ninety_days_late
        claim_type: Constants Applied
        grounds:
          - calculations.return_statutory_liability.constants.TIER_1_MAX_DAYS_LATE
          - calculations.return_statutory_liability.constants.PENALTY_RATE_TIER_1
          - entities.DisclosureReturn.fields.penalty_rate_applied
        distinguishing_aspect: |
          The tier comparison is <= on the boundary, and both returns accrue to the same
          2026-12-01 cutoff, so the ONLY difference between them is one day of lateness:
          due 2026-09-02 gives days_late 90 and rate 0.05, due 2026-09-01 gives 91 and
          rate 0.15 — a three-fold penalty step across a single day. Interest, being
          linear in days_late, moves by only 250 cents over the same step.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term and window_close_at 2026-12-01T00:00:00Z"
            - "Taxpayer Verdant Row holds an EXECUTED walk-in agreement (no pre-clearance), so returns accrue to the window close"
            - "Two non-overlapping DRAFT returns of 1000000 cents each exist: Q1 2025 due 2026-09-02 and Q2 2025 due 2026-09-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Verdant Row Landscaping LLC", taxpayer_type: "BUSINESS", tin_last4: "8123" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2026-09-02", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-04-01", period_end_date: "2025-06-30", original_due_date: "2026-09-01", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_b_id: $.data.id }
          trigger:
            - call: "POST /amnesty/returns/${ret_a_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/returns/${ret_b_id}/file"
              payload: {}
              as: Taxpayer
