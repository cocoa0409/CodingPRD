  # --- content decisions ---------------------------------------------------
  - method: POST
    path: "/api/communities/{id}/content-decisions"
    description: "Record a moderator content decision consuming a backlog item"
    roles: [Moderator, PlatformAdmin]
    code: 201
    input: ["auto_detection_backlog_item_id", "decision_outcome", "decision_confidence", "dissection_band", "precedent_approval_count", "community_health_index_override_present?"]
    output: ContentDecision
    side_effects:
      - "status=RECORDED; effective_enforcement_tier, requires_cross_power_approval and community_safety_override computed; audit_log_ref minted"
      - "the consumed backlog item -> status=CONSUMED"
      - "every ContentReport of the community whose content_source_type and content_source_id equal the consumed backlog item's source_type and source_id moves out of OPEN: to RESOLVED, or to RESOLVED_LOCKED when the outcome is LOCK, or back from RESOLVED to OPEN when the outcome is REPORT_REJECTED; a report already in the terminal RESOLVED_LOCKED state is never moved"
      - "when the outcome is WARNING_ISSUED, MUTE_ISSUED or BAN_ISSUED an AccountSanction row is synthesized for the backlog item's subject_account_id with status=ACTIVE, decision_outcome copied, sanction_date_utc=logical clock, is_account_wide=false and account_wide_enforcement_counted=false"
      - "Account.karma_points and Account.account_sanction_index recomputed; the issuing Community.applying_sanction_count recomputed"
      - "when the acting X-User-Role is Moderator, the acting moderator row's last_moderation_action_at_utc = logical clock"
      - "Community.open_report_weight, Community.health_index and Community.enforcement_tier recomputed"
      - "Community ACTIVE_to_ACTIVE self-loop recompute fires; when the recomputed account_sanction_index gate is met the community also moves into RESTRICTED and into INSTITUTION_NEGOTIATION in the same request when that second gate is also met"
      - "increments Community.version by 1"

  - method: GET
    path: "/api/communities/{id}/content-decisions"
