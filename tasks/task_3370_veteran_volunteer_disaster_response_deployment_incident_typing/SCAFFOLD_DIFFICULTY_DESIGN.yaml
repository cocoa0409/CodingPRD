  - rule_id: resource_temporal_overlap
    instances:
      - name: duty_shift_half_open_adjacency
        grounds:
          - validations[priority=13]
          - entities.DutyShift.fields.starts_at
          - entities.DutyShift.fields.ends_at
        distinguishing_aspect: |
          Half-open interval semantics on the Deployment resource: shift B with
          starts_at exactly equal to shift A's ends_at is admitted (adjacency is
          not overlap), while shift C straddling A's interior is rejected with
          ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Operation OPEN (caps [CHAINSAW]); d1 (v1 CHAINSAW, DEPLOYABLE) ACCEPTED then ON_SITE at 2026-09-10T08:00Z"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Hurricane Helena", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Helena Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
          trigger:
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: OPERATIONS, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T12:00:00Z" }
              as: OperationsLead
              captures: { s1: $.data.id }
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: LOGISTICS, starts_at: "2026-09-10T12:00:00Z", ends_at: "2026-09-10T16:00:00Z" }
              as: OperationsLead
              captures: { s2: $.data.id }
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: OPERATIONS, starts_at: "2026-09-10T11:00:00Z", ends_at: "2026-09-10T13:00:00Z" }
              as: OperationsLead
              captures: { err: $.data.error_id }
          assert:
            - "Shift A created: DutyShift.${s1} exists with status == SCHEDULED"
            - "Shift B (adjacent, starts == A.ends) created: DutyShift.${s2} exists with status == SCHEDULED"
            - "Shift C (straddling interior): error_id == ERR_SHIFT_OVERLAP (http 409)"
            - "Exactly 2 duty shifts exist for Deployment.${d1}"

      - name: deployment_window_rest_buffer_gap
        grounds:
          - validations[priority=12]
          - state_machines.Deployment.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Buffer-gap interval semantics on the Volunteer resource (different
          resource and different semantics than the half-open duty-shift rule):
          a new deployment whose planned_start is 23h after the volunteer's
          demobed_at is rejected, while exactly REST_BUFFER_HOURS(24) is
          admissible.
        test_recipe:
          setup:
            - "v1 DEPLOYABLE (availability 2026-09-05..2026-09-30); d1 under op1 DEMOBED with demobed_at == 2026-09-12T17:00:00Z"
            - "op2 under the same TYPED incident, OPEN (caps [CHAINSAW])"
            - "d2 offered under op2 with planned_start 2026-09-13T16:00:00Z; d3 offered with planned_start 2026-09-13T17:00:00Z"
          setup_api_calls:
