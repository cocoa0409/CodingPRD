      - name: empty_set_and_zero_denominator_statistics_return_exact_zero
        grounds: "§1.3 calculation occupancy_statistics ('the empty-set cases return exactly 0.00 rather than erroring or yielding null'), specifically the rooms_available_count == 0 and rooms_occupied_count == 0 guards."
        distinguishing_aspect: >-
          Empty-set and zero-denominator edges rather than an inequality boundary, and the two
          guards are deliberately separated: on 2026-08-01 the occupied count is zero while rooms
          are available, and on 2026-08-02 a room is occupied while the available count is zero, so
          an implementation that shares one guard for both divisions cannot pass both days.
        test_recipe:
          setup: "Standard property with room_count_total 100. Business date 2026-08-01 has out_of_order_room_count 4 and no folios at all. Business date 2026-08-02 has out_of_order_room_count 100, so rooms_available_count is 0, and carries one in-house CASH folio at rate 200.00 created only after 2026-08-01 has been posted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
