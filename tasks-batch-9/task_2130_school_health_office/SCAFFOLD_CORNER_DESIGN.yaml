            - "After QUARANTINE: MedicationStockLot.${lot_id}.status == QUARANTINED and version == 2"
            - "After QUARANTINE: School.${sch_id}.epinephrine_days_of_supply == 0.0"
            - "After QUARANTINE: School.${sch_id}.stock_protocol_status == DEPLETED"
            - "After RESTORE: MedicationStockLot.${lot_id}.status == AVAILABLE and version == 3"
            - "After RESTORE: MedicationStockLot.${lot_id}.days_of_supply == 33.33"
            - "After RESTORE: School.${sch_id}.epinephrine_days_of_supply == 33.33"
            - "MedicationStockLot.${lot_id}.received_total == 10 and quantity_on_hand == 10 throughout"

