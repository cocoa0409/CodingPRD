      - name: audit_transition_with_stale_expected_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.audit-decision-stale-audit
          - validations[priority=27]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The requested APPROVED transition is legal from IN_REVIEW and decision_notes is supplied, so every earlier rung of the ladder passes and the only failing rule is the OCC cursor: an expected_course_audit_version observed before the IN_REVIEW write is rejected with 412 ERR_STALE_VERSION."
