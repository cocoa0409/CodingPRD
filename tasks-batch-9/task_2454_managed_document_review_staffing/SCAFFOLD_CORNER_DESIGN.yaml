              as: QCLead
              captures: { sf_id: $.data.id }
            - &c_sample_full_pass
              call: "POST /qc-samples/${sf_id}/validate"
              payload: { coding_error_count: 0, privilege_error_count: 0 }
              as: QCLead
            - &c_priv1_validate
