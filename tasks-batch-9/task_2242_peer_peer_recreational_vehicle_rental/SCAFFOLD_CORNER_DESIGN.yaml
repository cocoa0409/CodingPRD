          The rule is non-decreasing, not strictly increasing: a MID_TRIP reading
          repeating the PRE_TRIP values exactly (42000 miles, 120.0 generator
          hours) at a LATER recorded_at is accepted 201, so a rig that sat
          parked overnight records legally and the booking now has two readings.
