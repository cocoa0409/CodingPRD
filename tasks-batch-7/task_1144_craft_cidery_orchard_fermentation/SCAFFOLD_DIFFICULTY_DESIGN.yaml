            # Two 50 L runs in 2026
            - call: "POST /cidery/packaging-runs"
              payload: { product_id: "${p15}", fermentation_batch_id: "${fb15}", package_format: "BOTTLE_500ML", volume_liters: 50, label_approval_id: "${la15}", license_id: "${lic15}" }
