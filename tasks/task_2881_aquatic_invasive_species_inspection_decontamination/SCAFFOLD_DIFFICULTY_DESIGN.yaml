            - "EducationCampaign.${camp2}.alternate_effectiveness_score == 52.00"
            - "EducationCampaign.${camp1}.effectiveness_score - EducationCampaign.${camp2}.effectiveness_score == 16.67"
            - "InspectionStation.${st_t}.campaign_allocated_cents == 101000"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_signed_credits_clamp_with_independent_quarantine_warrant
        grounds:
          - calculations.watercraft_risk_score
          - calculations.watercraft_risk_band
          - calculations.reciprocity_seal_decision
          - entities.InspectionRecord.fields.risk_score
          - entities.InspectionRecord.fields.quarantine_warranted
        distinguishing_aspect: |
          Mode (a) - four inputs interact non-additively in one formula: a signed
          sum (tier 5 + infestation 30 - dry credit 25 - reciprocity credit 20 =
          -10) is multiplied by the vessel factor, rounded ONCE, then clamped to
          [0, 100], so the clamp is load-bearing rather than decorative; and
          because risk_band (LOW at score 0) and quarantine_warranted (true from
          CONFIRMED_INFESTED) are read from different terms of the same
          evaluation, a vessel can be simultaneously the lowest possible band and
          quarantine-warranted. No decomposition of the formula into independent
          per-term contributions reproduces both outputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T10:00:00Z."
            - "WaterBody 'Canyon Ferry' with risk_tier LOW but infestation_status CONFIRMED_INFESTED (30 points)."
            - "ReciprocityAgreement with Idaho: accepted_seal_prefix 'ID-', max_seal_age_hours 72, honors_our_seals true, status ACTIVE."
            - "Watercraft MT-3001, OPEN_HULL (vessel_factor 1.00), last_removed_at 2026-07-26T09:00:00Z - 240 h of standing time at arrival, giving the maximum dry credit of 25."
            - "InspectionRecord INITIATED with arrived_at 2026-08-05T09:00:00Z, presenting Idaho seal ID-55010 issued 2026-08-03T09:00:00Z (48 h old, inside the 72 h ceiling)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Canyon Ferry", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "LOW", infestation_status: "CONFIRMED_INFESTED" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Canyon Ferry Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 2, hot_water_capable: true, seal_stock_initial_count: 3 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /reciprocity-agreements"
              payload: { partner_state_code: "ID", accepted_seal_prefix: "ID-", honors_our_seals: true, max_seal_age_hours: 72, fee_waiver: false }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-3001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18, last_water_body_id: "${wb_id}", last_removed_at: "2026-07-26T09:00:00Z" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_v}", residual_water_present: false, standing_water_ml: 0, prior_water_body_id: "${wb_id}", presented_seal_number: "ID-55010", presented_seal_state_code: "ID", presented_seal_issued_at: "2026-08-03T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
          assert:
            - "InspectionRecord.${rec_id}.reciprocity_seal_honored == true"
            - "InspectionRecord.${rec_id}.reciprocity_credit_points == 20"
            - "InspectionRecord.${rec_id}.honored_agreement_id == ${agr_id}"
            - "InspectionRecord.${rec_id}.dry_credit_points == 25"
            - "InspectionRecord.${rec_id}.risk_score == 0"
            - "InspectionRecord.${rec_id}.advisory_risk_score == 0"
            - "InspectionRecord.${rec_id}.risk_band == LOW"
            - "InspectionRecord.${rec_id}.decon_mandatory == false"
            - "InspectionRecord.${rec_id}.quarantine_warranted == true"

      - name: campaign_allocation_floor_per_station_then_ordered_remainder
        grounds:
          - calculations.campaign_station_allocation_cents
          - entities.EducationCampaign.fields.station_allocations
          - entities.InspectionStation.fields.campaign_allocated_cents
          - state_machines.EducationCampaign.PLANNED_to_RUNNING
        distinguishing_aspect: |
          Mode (b) - the correct answer depends on the ROUNDING ORDER, not on the
          arithmetic: a 100000-cent budget over three equal-weight stations gives
          an exact share of 33333.33, so flooring per station first yields
          33333 x 3 = 99999 and the single leftover cent goes to the FIRST station
          in the pinned created_at ASC / name ASC order, producing
          33334 / 33333 / 33333. Summing exact shares and rounding once at the end
          (33333 / 33333 / 33334) or dropping the remainder (33333 x 3, one cent
          lost) both disagree with the pinned rule.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "WaterBody 'Fort Peck' as the campaign target."
            - "Three stations at that water body, created in the order Alpha Access, Bravo Access, Charlie Access, all still PLANNED (PLANNED is inside the candidate status set)."
            - "No InspectionRecord exists, so every station's traffic weight is exactly 1 and total_weight is 3."
            - "EducationCampaign 'Fort Peck Outreach' PLANNED with budget_cents 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Fort Peck", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "MODERATE", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Alpha Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: false, seal_stock_initial_count: 1 }
              as: ProgramAdmin
              captures: { st_a: $.data.id }
            - call: "POST /inspection-stations"
