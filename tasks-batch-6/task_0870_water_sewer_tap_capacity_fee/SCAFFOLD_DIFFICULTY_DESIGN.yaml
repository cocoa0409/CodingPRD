  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_beats_fees_unpaid
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - state_machines.ConnectionApplication.READY_FOR_ACTIVATION_to_ACTIVATED
        distinguishing_aspect: >
          On POST /connection-applications/{id}/activate an APPROVED (not READY) app with zero fees paid
          violates both the state precondition (priority 6, category state) and fees-paid (priority 17,
          category business_fiscal); the state error (ERR_INVALID_STATE) wins — pair {state, business_fiscal}.
        test_recipe:
          setup:
            - "App-G approved, RESIDENTIAL, no fees paid, meter never installed (still APPROVED, not READY)."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-G", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_g: "$.data.id" }
            - call: "POST /connection-applications/${app_g}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_g}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_g}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /connection-applications/${app_g}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
          trigger:
            - call: "POST /connection-applications/${app_g}/activate"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
              captures: { err_g: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: schedule_invalid_window_beats_inspector_overlap
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - calculations.inspector_window_overlap
        distinguishing_aspect: >
          On POST /inspections/{id}/schedule a request whose window end <= start (priority 12, category
          business_temporal) AND that also overlaps an existing SCHEDULED inspection on the same inspector
          (priority 13, category business_constraint) returns ERR_INVALID_WINDOW — pair
          {business_temporal, business_constraint}, distinct from {state, business_fiscal}.
        test_recipe:
          setup:
            - "Inspector with one SCHEDULED inspection 09:00-10:00; a second REQUESTED inspection on the same inspector to be scheduled with a bad, overlapping window."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-H", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_h: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp H" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_h: "$.data.id" }
            - call: "POST /inspections"
              payload: { application_id: "${app_h}", inspector_id: "${insp_h}", inspection_type: "TAP", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_h}"
              captures: { insp_h1: "$.data.id" }
            - call: "POST /inspections/${insp_h1}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_h}"
            - call: "POST /inspections"
              payload: { application_id: "${app_h}", inspector_id: "${insp_h}", inspection_type: "TAP", scheduled_start: "2026-06-01T09:30:00Z", scheduled_end: "2026-06-01T10:30:00Z" }
              as: FieldInspector
              as_user_id: "${insp_h}"
              captures: { insp_h2: "$.data.id" }
          trigger:
            - call: "POST /inspections/${insp_h2}/schedule"
              payload: { scheduled_start: "2026-06-01T09:30:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FieldInspector
              as_user_id: "${insp_h}"
              captures: { err_h: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_WINDOW"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: availability_distance_exact_boundary
        grounds:
          - calculations.availability_determination
          - entities.AvailabilityDetermination.fields.extension_required
          - validations[priority=8]
        distinguishing_aspect: >
          On POST /availability-determinations, distance_to_main_ft exactly 200 (== MAX_CONNECTION_DISTANCE_FT)
          yields water_main_available=true / extension_required=false (<=, not <); 201 yields available=false /
          extension_required=true — a numeric-threshold boundary on the distance metric.
        test_recipe:
          setup:
            - "Two WATER applications, one to receive a 200ft determination, one a 201ft determination."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-J1", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_j1: "$.data.id" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-J2", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_j2: "$.data.id" }
          trigger:
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_j1}", distance_to_main_ft: 200 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { avail_at: "$.data.water_main_available" }
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_j2}", distance_to_main_ft: 201 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { avail_over: "$.data.water_main_available" }
          assert:
            - "determination for ${app_j1}: water_main_available == true and extension_required == false"
            - "determination for ${app_j2}: water_main_available == false and extension_required == true"

      - name: escrow_drawdown_exact_held_boundary
        grounds:
          - validations[priority=15]
          - entities.DeveloperAgreement.fields.escrow_held_cents
          - errors[ERR_ESCROW_INSUFFICIENT]
        distinguishing_aspect: >
          On POST /developer-agreements/{id}/escrow-transactions a DRAWDOWN of exactly escrow_held_cents
          (4,000,000c) succeeds and drives held to 0; a subsequent DRAWDOWN of 1c is rejected
          ERR_ESCROW_INSUFFICIENT — a money-metric boundary on a distinct endpoint from the distance check.
        test_recipe:
          setup:
            - "Agreement offered (required 4,000,000c) with a single 4,000,000c deposit; held == 4,000,000c."
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-K", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_k: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${app_k}", developer_user_id: "dev-1", length_ft: 400, estimated_cost_cents: 4000000, total_assessable_front_ft: 400, total_assessable_area_sqft: 80000, reimbursement_cap_cents: 5000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { proj_k: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${proj_k}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_k: "$.data.id" }
            - call: "POST /developer-agreements/${agr_k}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_k_v: "$.data.version" }
            - call: "POST /developer-agreements/${agr_k}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 4000000, expected_developer_agreement_version: "${agr_k_v}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /developer-agreements/${agr_k}"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
              captures: { agr_k_v2: "$.data.version" }
          trigger:
            - call: "POST /developer-agreements/${agr_k}/escrow-transactions"
              payload: { txn_type: "DRAWDOWN", amount_cents: 4000000, expected_developer_agreement_version: "${agr_k_v2}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /developer-agreements/${agr_k}"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
              captures: { agr_k_v3: "$.data.version" }
            - call: "POST /developer-agreements/${agr_k}/escrow-transactions"
              payload: { txn_type: "DRAWDOWN", amount_cents: 1, expected_developer_agreement_version: "${agr_k_v3}" }
              as: Developer
              as_user_id: "dev-1"
              captures: { err_k: "$.data.error_id" }
          assert:
            - "first DRAWDOWN succeeds (201); DeveloperAgreement.${agr_k}.escrow_held_cents == 0"
            - "second DRAWDOWN of 1c: response status == 422 and data.error_id == ERR_ESCROW_INSUFFICIENT"

