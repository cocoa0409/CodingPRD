              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4820, measured_rear_axle_weight_lb: 2680 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ch_v3: "$.data.version" }
            - call: "POST /upfit/upfit-orders/${uo}/allocate-chassis"
              payload: { chassis_id: "${ch}", expected_chassis_version: "${ch_v3}" }
