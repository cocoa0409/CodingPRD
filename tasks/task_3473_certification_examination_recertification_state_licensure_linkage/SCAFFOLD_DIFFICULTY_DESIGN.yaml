  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: att_state_error_beats_retake_wait_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_ATT_NOT_ISSUABLE]
          - errors[ERR_RETAKE_WAIT_ACTIVE]
        distinguishing_aspect: |
          Category pair (state, business_temporal): scheduling against an ATT
          already CONSUMED by a delivered attempt while ALSO inside the 15-day
          retake wait violates both rules; priority 6 (state) beats priority 9
          (temporal), so ERR_ATT_NOT_ISSUABLE — not ERR_RETAKE_WAIT_ACTIVE —
          is returned.
        test_recipe:
          setup:
            - "Candidate passed attempt1 delivered 2026-09-03T12:00:00Z (ATT now CONSUMED); clock still 2026-09-03T12:00:00Z so any immediate retake slot is inside the 15-day wait"
