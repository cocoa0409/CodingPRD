              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/bookings"
