      - name: ccl_cascading_side_effects_expiry_to_escheat_to_program
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PointLot
          - calculations.lot_expiry_and_escheat_measurement
          - entities.LoyaltyProgram.fields.escheat_disclosure_required
        distinguishing_aspect: "One sweep call fans out three levels deep - lot lifecycle, period accumulators plus escheat accrual, then the program-level disclosure latch and the member dormancy flag."
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_expiry_to_escheat_to_program_disclosure_latch
          rationale: "The §1.8 transitive-cascade instance drives the entire chain and asserts each level's literals, so the cascading_side_effects layer is already probed at maximum depth on this path."

      - name: ccl_cascading_side_effects_approval_supersede_to_period_reopen
        claim_type: cascading_side_effects
        grounds:
          - state_machines.BreakageEstimate.transitions[SUBMITTED->APPROVED]
          - state_machines.AccountingPeriod
        distinguishing_aspect: "Approving a replacement estimate installs a new rate, supersedes the reigning estimate, and force-reopens the superseded estimate's already SOFT_CLOSED period - a three-link chain reaching a period the request never names."
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_estimate_supersede_forces_soft_closed_period_reopen
          rationale: "The §1.8 instance drives all three links, including the seven zeroed period fields and the reopen_count increment that is deliberately NOT gated at two, so this layer's second path is fully covered."

      - name: ccl_dual_variant_calculation_provisional_versus_final_release
        claim_type: dual_variant_calculation
        grounds:
          - calculations.redemption_revenue_release
        distinguishing_aspect: "The same allocation is measured twice against two different breakage rates - each lot's frozen rate at allocation, the program's current rate at fulfilment - and the divergence is retained as an explicit remeasurement delta."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_redemption_provisional_vs_final_release
          rationale: "The §1.8 dual-variant instance drives both variants over a multi-lot FIFO allocation and asserts the per-line divergence, which is exactly this layer's claim."

      - name: ccl_dual_variant_calculation_gross_versus_net_settlement
        claim_type: dual_variant_calculation
        grounds:
          - calculations.partner_settlement_net
          - entities.PartnerAgreement.fields.net_settlement_enabled
        distinguishing_aspect: "One flag on the agreement selects between two settlement formulas over identical point volumes, and the redemption payable leg is present in exactly one of them."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_partner_settlement_gross_vs_net
          rationale: "The §1.8 instance measures the same period under both bases and asserts the payable-leg delta, so the variant-selection and variant-divergence claims are both already covered."

  # ============================================================================
  # SECTION 9 of 9 - consistency_model (2 instances)
  # complexity_profile.consistency_model is `immediate`: every side effect of a
  # write is durable and readable by the time that write's response is returned.
  # There is no eventual-consistency window, no PENDING/PROCESSING state and no
  # saga compensation to await.
  # ============================================================================
  - section: consistency_model
    instances:
      - name: consistency_immediate_full_cascade_readable_in_the_next_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.lot_expiry_and_escheat_measurement
          - endpoints[POST /accounting-periods/{id}/expiry-sweep]
        distinguishing_aspect: "A single sweep's three-level fan-out is fully readable with no polling and no retry: the sweep's OWN response already carries the period accumulators, and the very next reads show the lot escheated, the member dormant and the program's disclosure latch set."
        test_recipe:
          setup:
            - "Program 'Immediate Core' ACTIVE (ssp 1200, point_expiry_days 730, cap 5000, historical 7500 so current_breakage_rate_bp 2500, escheat_disclosure_threshold_cents 3600)."
            - "StateExpiryRule DE: expiry_permitted true, min_dormancy_days 730, escheatment_required true, escheat_rate_bp 6000. Cohort C1. Member M1 BASE/DE."
            - "Two periods: per1 [2026-08-01, 2026-09-01) and per2 [2028-08-01, 2028-09-01), both OPEN."
            - "M1 holds a 5000-point lot issued at 2026-08-05 in per1: gross 6000, reserve 1500, deferred 4500, expires_at 2028-08-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Immediate Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 3600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "DE", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: true, escheat_rate_bp: 6000 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "DE", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2028-08", start_at: "2028-08-01T00:00:00Z", end_at: "2028-09-01T00:00:00Z" }
              as: Controller
              captures: { per2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LoyaltyAccountant
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 5000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-08-05T00:00:00Z" }
              as: LoyaltyAccountant
            - call: "POST /accounting-periods/${per2_id}/expiry-sweep"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /point-lots/${lot1_id}"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /members/${m1_id}"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
            - call: "GET /accounting-periods/${per1_id}"
              payload: {}
              as: Controller
          assert:
            - "The SWEEP's OWN response is the swept AccountingPeriod and already carries expiry_released_cents == 4500 and escheat_accrual_cents == round_half_up(6000 * 6000 / 10000) == 3600 - no second call is needed to observe the write"
            - "The IMMEDIATELY following GET /point-lots/${lot1_id} shows lifecycle_state == ESCHEATED with points_remaining 0, expired_gross_ssp_cents == 6000 and escheated_cents == 3600"
            - "The IMMEDIATELY following GET /members/${m1_id} shows status == DORMANT with point_balance 0, outstanding_gross_ssp_cents 0 and dormancy_days 731"
            - "The IMMEDIATELY following GET /programs/${prog_id} shows total_escheat_accrual_cents == 3600 and escheat_disclosure_required == true - the latch fires at >= the 3600 threshold and is visible at once"
            - "The same GET shows total_deferred_revenue_cents == 0 - the derived aggregate already excludes the escheated lot"
            - "GET /accounting-periods/${per1_id} shows issuance_deferred_cents STILL 4500 - the release was booked to the SWEPT period ${per2_id}, not retroactively to the issuing period"
            - "No response at any point exposes a PENDING, PROCESSING, IN_PROGRESS or QUEUED state, and no assertion above requires a retry, a delay or a second attempt"

      - name: consistency_immediate_reads_are_repeatable_and_never_transitional
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.BreakageEstimate.transitions[SUBMITTED->APPROVED]
          - entities.LoyaltyProgram.fields.current_breakage_rate_bp
        distinguishing_aspect: "An approval's rate installation is atomic and terminal from the caller's point of view: the approve response already reflects the new measurement, two consecutive reads return byte-identical values, and no §1.2 state machine declares a transitional state between SUBMITTED and APPROVED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Repeat Core' ACTIVE (ssp 1200, cap 5000, COHORT_WEIGHTED, historical 7500 so current_breakage_rate_bp 2500), rule TX, ONE cohort C1 observed 8200, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01) OPEN."
            - "M1 holds one 1000-point lot (gross 1200, deferred 900). An estimate prepared by acct-1 is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Repeat Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "August estimate, single cohort, no program changes.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              as_user_id: acct-1
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: acct-1
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              as_user_id: ctrl-1
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: ctrl-1
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { rate_first: $.data.current_breakage_rate_bp }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { rate_second: $.data.current_breakage_rate_bp }
            - call: "GET /breakage-estimates/${est1_id}/sensitivity"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /breakage-estimates/${est1_id}/sensitivity"
              payload: {}
              as: Controller
          assert:
            - "The APPROVE response itself already shows state == APPROVED with approved_by_user_id == 'ctrl-1', estimated_redemption_rate_bp == 8200, breakage_rate_bp == 1800 and required_liability_cents == round_half_up(1200 * 8200 / 10000) == 984"
            - "${rate_first} == 1800 - the installed rate is readable on the very next request, with no propagation delay"
            - "${rate_second} == ${rate_first} == 1800 - two consecutive reads by different roles agree exactly; reads are repeatable"
            - "BreakageEstimate.${est1_id} has no intermediate state between SUBMITTED and APPROVED - the §1.2 machine declares none, so no caller ever observes a half-applied approval"
            - "Both GET /breakage-estimates/${est1_id}/sensitivity calls return the IDENTICAL low_liability_cents == round_half_up(1200 * 7700 / 10000) == 924, base_liability_cents == 984, high_liability_cents == round_half_up(1200 * 8700 / 10000) == 1044 and band_range_cents == 120"
            - "The sensitivity bands are computed from the FROZEN outstanding_gross_ssp_cents_at_estimate 1200, so they do not drift between the two reads even though the rate has just changed"
            - "AccountingPeriod.${per1_id} remains OPEN with closing_liability_cents 0 - approving a rate does not implicitly close anything, so there is no partially-committed close to observe"
