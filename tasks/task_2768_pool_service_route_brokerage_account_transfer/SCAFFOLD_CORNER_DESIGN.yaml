      - name: settlement_dispute_and_repropose_status_gate
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_SETTLEMENT_NOT_PROPOSED"
          - "validations[priority=28]"
        distinguishing_aspect: "propose accepts DRAFT or DISPUTED, dispute and settle only PROPOSED, so every off-status call on the three settlement endpoints is a 409."
        excluded_because:
          difficulty_instance: "clawback_settlement_proposed_disputed_reproposed_cycle"
          rationale: "That instance walks DRAFT -> PROPOSED -> DISPUTED -> PROPOSED -> SETTLED and asserts ERR_SETTLEMENT_NOT_PROPOSED at each off-status attempt, including the second dispute of an already-DISPUTED settlement."

      - name: close_blocked_while_a_required_permit_is_not_terminal
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_LICENSE_NOT_TRANSFERRED"
          - "validations[priority=38]"
        distinguishing_aspect: "Every LicenseTransfer of the deal must be APPROVED or WAIVED before introduce or close; one NOT_STARTED, APPLIED or DENIED permit is enough to block both."
        excluded_because:
          difficulty_instance: "deal_close_blocked_until_every_required_permit_is_terminal"
          rationale: "That instance is exactly this fork-join: it closes only after the last of the two AZ permits reaches a terminal status, asserting ERR_LICENSE_NOT_TRANSFERRED for each intermediate combination."

      - name: valuation_with_no_qualifying_accounts_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_NO_VALUATION_INPUTS"
          - "validations[priority=42]"
        distinguishing_aspect: "An empty input set is a refusal, not a zero-valued valuation, so no 0-cent RouteValuation row may ever be created."
        excluded_because:
          difficulty_instance: "empty_valuation_input_set_is_not_zero_valued_rejected"
          rationale: "That instance requests both bases against a listing whose only accounts are EXCLUDED and asserts ERR_NO_VALUATION_INPUTS plus the absence of any new valuation row."

      - name: listing_exclusivity_window_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_LISTING_EXCLUSIVITY_OVERLAP"
          - "validations[priority=45]"
        distinguishing_aspect: "Two non-WITHDRAWN listings for the same (seller_id, region_code) may not have overlapping [start, end) exclusivity intervals."
        excluded_because:
          difficulty_instance: "listing_exclusivity_half_open_adjacency_allowed"
          rationale: "That instance pins the half-open boundary from both sides: an interval starting exactly on the neighbour's end_date is accepted and one starting a day earlier returns ERR_LISTING_EXCLUSIVITY_OVERLAP."

      - name: license_application_window_and_cooling_off_conflict
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_LICENSE_WINDOW_CONFLICT"
          - "validations[priority=46]"
        distinguishing_aspect: "The [applied_on, processing_window_end] interval is CLOSED and must additionally stay cooling_off_days clear of any other non-CANCELLED transfer for the same (buyer, state, permit) triple."
        excluded_because:
          difficulty_instance: "license_application_closed_window_plus_cooling_off_gap"
          rationale: "That instance tests the closed-interval endpoint and the cooling-off gap separately, so both halves of ERR_LICENSE_WINDOW_CONFLICT are already asserted."

      - name: introduction_after_the_forty_five_day_window_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_INTRODUCTION_WINDOW_CLOSED"
          - "validations[priority=47]"
        distinguishing_aspect: "The introduction window is half-open [accepted_on, accepted_on + INTRO_WINDOW_DAYS), so the 45th day is already outside it."
        excluded_because:
          difficulty_instance: "pair_b_safety_beats_temporal_on_introduce"
          rationale: "That instance drives the clock past the window and co-violates the licence-transfer safety rule, asserting the safety error wins while the window error is what fires once the permits are terminal."

      - name: close_with_an_underfunded_escrow_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_ESCROW_UNDERFUNDED"
          - "validations[priority=51]"
        distinguishing_aspect: "A close requires funded_amount_cents >= target_amount_cents; a short escrow is a 422 on its own."
        excluded_because:
          difficulty_instance: "pair_a_state_beats_fiscal_on_close"
          rationale: "That instance is the PAIR A conflict: a FINANCING_APPROVED deal with a short escrow co-violates priorities 23 and 51, and it asserts both the masked and unmasked outcomes of ERR_ESCROW_UNDERFUNDED."

      - name: counter_offer_that_does_not_improve_the_price_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_COUNTER_NOT_IMPROVED"
          - "validations[priority=54]"
        distinguishing_aspect: "A seller counter must be strictly above the standing price and a buyer re-offer strictly below it; equality is a refusal."
        excluded_because:
          difficulty_instance: "deal_offer_countered_offer_negotiation_cycle"
          rationale: "That instance runs the OFFER_SUBMITTED <-> COUNTERED loop twice and asserts ERR_COUNTER_NOT_IMPROVED at the equal-price attempt in both directions."

      - name: publish_or_valuation_by_a_suspended_seller_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_SELLER_SUSPENDED"
          - "validations[priority=65]"
        distinguishing_aspect: "Suspending the seller freezes publication, valuation, acceptance and introduction for every listing it owns, and reinstatement is not modelled."
        excluded_because:
          difficulty_instance: "listing_publish_and_valuation_blocked_by_suspended_seller"
          rationale: "That instance suspends the seller mid-flow and asserts ERR_SELLER_SUSPENDED on each of the four endpoints priority 65 guards."

      - name: reciprocity_waiver_without_a_licensed_in_state_buyer_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_RECIPROCITY_NOT_AVAILABLE"
          - "validations[priority=69]"
        distinguishing_aspect: "A waiver needs both Buyer.license_status == LICENSED and Buyer.state_code inside the profile's reciprocity_states; either half missing is a 422."
        excluded_because:
          difficulty_instance: "license_waiver_depends_on_buyer_state_and_profile_reciprocity"
          rationale: "That instance varies the buyer's state and licence status against the same profile and asserts ERR_RECIPROCITY_NOT_AVAILABLE for each failing combination."

  - section: rbac
    note: "Table-7 walk over the five roles: each role's exclusive_operations refused to the others (including PlatformAdmin, which is deliberately not a superuser), the shared_operations exercised through their second authorized role, and all three segregation_of_duties clauses -- verifier vs diligence, funder vs release, recorder vs proposal and funder vs settlement."
    instances:

      - name: broker_exclusive_listing_writes_are_unauthorized_for_every_other_role
        claim_type: exclusive_operations
        grounds:
          - "roles.Broker.exclusive_operations"
          - "errors.ERR_UNAUTHORIZED"
          - "validations[priority=2]"
          - "validations[priority=7]"
        distinguishing_aspect: "The role gate is checked before existence, so a Buyer PATCHing a listing id that does not exist gets 403 rather than 404 -- and the four listing-surface writes the Broker owns exclusively are refused to Seller, Buyer, EscrowAgent and even PlatformAdmin, which is the strongest role elsewhere in the API."
