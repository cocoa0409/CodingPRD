          - errors.ERR_NOTICE_TARGET_REQUIRED
        distinguishing_aspect: "The three ratio fields are optional at creation and only demanded at submit time: a TRANSFER_RATIO_CHANGE notice created without target_agreement_id returns 201, and its submit returns 422 ERR_NOTICE_TARGET_REQUIRED leaving the notice in DRAFT."
