# =============================================================================
# task_0175_art_auction_consignment — §1.9 Scaffold Corner Design
# Breadth probe over claim-extraction-guide sections against §1.1-§1.7.
# Every active instance's setup_api_calls drives empty-DB -> precondition.
# excluded_because stubs point to §1.8 instances that already cover the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_seller_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Seller, endpoints]
        distinguishing_aspect: "POST /sellers with all required fields -> 201 and response echoes legal_name, email, country_code; system mints id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Solo Seller", email: "solo@x.com", country_code: "US", payout_iban: "US00000000000000000000099" }
              as: SaleAdministrator
              captures: { sid: $.data.id, sv: $.data.version }
          assert:
            - "Response status == 201"
            - "Seller.legal_name == 'Solo Seller' and Seller.country_code == 'US'"
            - "Seller.version == 1 and Seller.id is a non-empty UUID"

      - name: get_seller_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Seller, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /sellers/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sellers/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_bidder_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Bidder, "errors[ERR_INVALID_REQUEST]", "validations[priority=6]"]
        distinguishing_aspect: "POST /bidders omitting required legal_name -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bidders"
              payload: { email: "noname@x.com", country_code: "US" }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_bidder_default_credit_limit_zero
        claim_type: Defaults
        grounds: [entities.Bidder.fields.credit_limit_cents, entities.Bidder.fields.status]
        distinguishing_aspect: "POST /bidders omitting credit_limit_cents -> default 0; status defaults ACTIVE; outstanding_balance_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bidders"
              payload: { legal_name: "Default Bidder", email: "def@x.com", country_code: "US" }
              as: SaleAdministrator
              captures: { bid: $.data.id, climit: $.data.credit_limit_cents, st: $.data.status, bal: $.data.outstanding_balance_cents }
          assert:
            - "Bidder.credit_limit_cents == 0"
            - "Bidder.status == ACTIVE"
            - "Bidder.outstanding_balance_cents == 0"

      - name: create_bidder_invalid_country_type_returns_400
        claim_type: Type Constraints
        grounds: [entities.Bidder.fields.credit_limit_cents, "errors[ERR_INVALID_REQUEST]", "validations[priority=6]"]
        distinguishing_aspect: "POST /bidders with negative credit_limit_cents -> 400 ERR_INVALID_REQUEST (non-negative integer required)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bidders"
              payload: { legal_name: "Neg Bidder", email: "neg@x.com", country_code: "US", credit_limit_cents: -100 }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: system_fields_ignored_on_lot_create
        claim_type: System Fields
        grounds: [entities.Lot.fields.hammer_price_cents, entities.Lot.fields.sale_status]
        distinguishing_aspect: "POST /auction-sales/{id}/lots: system fields (sale_status, hammer_price_cents) are server-set regardless of input; sale_status == CATALOGED, hammer 0, settlement_status NONE."
        test_recipe:
          setup: ["A CATALOGING sale with an ACTIVE consignment."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Sys", email: "sys@x.com", country_code: "US", payout_iban: "US00000000000000000000100" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Sys Sale", sale_date_utc: "2026-07-10T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Sys Work", artist_name: "Sys Artist", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id, ss: $.data.sale_status, set: $.data.settlement_status, hp: $.data.hammer_price_cents }
          assert:
            - "Lot.sale_status == CATALOGED"
            - "Lot.settlement_status == NONE"
            - "Lot.hammer_price_cents == 0"

      - name: premium_schedule_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PremiumSchedule]
        distinguishing_aspect: "PremiumSchedule has common_fields:false — only id/created_at; no version field, no update endpoint declared in §1.5."
        test_recipe:
          setup: ["A premium schedule exists."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Immutable", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
          trigger:
            - call: "GET /premium-schedules/${sched_id}"
              payload: {}
              as: SaleAdministrator
              captures: { nm: $.data.name }
          assert:
            - "GET /premium-schedules/{id} returns name and tiers; response carries no 'version' field (immutable entity)"

      - name: lot_parent_wrong_consignment_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Lot.fields.consignment_id, "errors[ERR_FK_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "POST /auction-sales/{id}/lots with a non-existent consignment_id -> 422 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["A CATALOGING sale exists; consignment_id in the body does not resolve."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std2", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /auction-sales"
              payload: { title: "FK Sale", sale_date_utc: "2026-07-11T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "00000000-0000-4000-8000-0000000000bb", lot_number: 1, title: "Orphan", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422 and data.error_id == ERR_FK_NOT_FOUND"

      - name: computed_outstanding_balance_after_invoice
        claim_type: Computed Fields
        grounds: [entities.Bidder.fields.outstanding_balance_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_bidder_balance_zero_after_reverse
          rationale: "The bidder outstanding_balance_cents computed-field correctness (0 -> 1,575,000) is asserted directly in that §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_from_published_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AuctionSale.CATALOGING_to_PUBLISHED, "errors[ERR_INVALID_STATE]", "validations[priority=7]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED sale -> 409 ERR_INVALID_STATE (from-state not CATALOGING)."
        test_recipe:
          setup: ["A sale with one lot, already PUBLISHED."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std3", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Pub", email: "pub@x.com", country_code: "US", payout_iban: "US00000000000000000000101" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Pub Sale", sale_date_utc: "2026-07-12T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Pub Work", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
          trigger:
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: publish_with_no_lots_returns_lots_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.AuctionSale.CATALOGING_to_PUBLISHED, "errors[ERR_LOTS_REQUIRED]"]
        distinguishing_aspect: "Publishing a CATALOGING sale with zero non-WITHDRAWN lots (lot_count 0) -> 409 ERR_LOTS_REQUIRED."
        test_recipe:
          setup: ["A CATALOGING sale with no lots."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std4", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /auction-sales"
              payload: { title: "Empty Sale", sale_date_utc: "2026-07-13T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_LOTS_REQUIRED"

      - name: close_sale_with_open_lot_returns_not_empty
        claim_type: Precondition Enforcement
        grounds: [state_machines.AuctionSale.LIVE_to_CLOSED, "errors[ERR_SALE_NOT_EMPTY_OF_OPEN_LOTS]"]
        distinguishing_aspect: "Closing a LIVE sale while a lot is still OPEN -> 409 ERR_SALE_NOT_EMPTY_OF_OPEN_LOTS."
        test_recipe:
          setup: ["LIVE sale with one OPEN lot that has not been knocked down."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std5", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Open", email: "open@x.com", country_code: "US", payout_iban: "US00000000000000000000102" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Open Sale", sale_date_utc: "2026-07-14T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Open Work", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: Auctioneer
              captures: { sv3: $.data.version }
          trigger:
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sv3}" }
              as: Auctioneer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_SALE_NOT_EMPTY_OF_OPEN_LOTS"

      - name: terminal_sale_closed_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.AuctionSale.LIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED sale (terminal) rejects open-bidding -> 409 ERR_INVALID_STATE; no further lifecycle transition allowed."
        test_recipe:
          setup: ["Sale CLOSED after its single lot was bought in."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std6", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Term", email: "term@x.com", country_code: "US", payout_iban: "US00000000000000000000103" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Term Sale", sale_date_utc: "2026-07-15T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Term Work", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lv: $.data.version }
            - call: "POST /lots/${lot_id}/buy-in"
              payload: { expected_lot_version: "${lv}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sv4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sv4}" }
              as: Auctioneer
              captures: { sv5: $.data.version }
          trigger:
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv5}" }
              as: Auctioneer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: retract_bid_recomputes_standing_high
        claim_type: Side Effect Execution
        grounds: [entities.Bid.fields.status, calculations.standing_high_bid, calculations.min_next_bid]
        distinguishing_aspect: "Retracting the high bid drops it from standing-high so a previously-too-low amount becomes acceptable: after retracting the 200000 bid, standing-high reverts to 100000, min_next_bid back to 110000."
        test_recipe:
          setup: ["OPEN lot with two ACCEPTED bids: 100000 then 200000 (standing-high 200000)."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std7", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Retract", email: "retract@x.com", country_code: "US", payout_iban: "US00000000000000000000104" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer R", email: "br@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Retract Sale", sale_date_utc: "2026-07-16T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Retract Work", artist_name: "X", artist_alive: false, low_estimate_cents: 120000, high_estimate_cents: 300000, reserve_cents: 90000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 100000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 200000, bid_channel: "FLOOR" }
              as: Auctioneer
              captures: { high_bid_id: $.data.id, high_bid_v: $.data.version }
          trigger:
            - call: "POST /bids/${high_bid_id}/retract"
              payload: { expected_bid_version: "${high_bid_v}" }
              as: Auctioneer
              captures: { rstatus: $.data.status }
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 110000, bid_channel: "FLOOR" }
              as: Auctioneer
              captures: { ok_id: $.data.id, ok_amt: $.data.amount_cents }
          assert:
            - "Retracted bid status == RETRACTED"
            - "Bid of 110000 now ACCEPTED (status 201) because standing-high reverted to 100000 after retraction"

      - name: knock_down_sold_branch_sets_winning_bid
        claim_type: Valid Transition
        grounds: [state_machines.Lot.OPEN_to_SOLD, entities.Bid.fields.status, entities.Lot.fields.winning_paddle_registration_id]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_lot_parallel_dimensions
          rationale: "The OPEN->SOLD valid transition (hammer set, sale_status SOLD) is exercised in that §1.8 instance's setup chain and asserted."

      - name: cancelled_terminate_cascade_withdraws_lots
        claim_type: Side Effect Execution
        grounds: [state_machines.Consignment.transitions, state_machines.Lot.CATALOGED_to_WITHDRAWN]
        distinguishing_aspect: "Terminating a consignment cascades its CATALOGED lots to WITHDRAWN (cascade-down side effect): the lot's sale_status becomes WITHDRAWN."
        test_recipe:
          setup: ["ACTIVE consignment with one CATALOGED lot in a CATALOGING sale."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std8", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Casc", email: "casc@x.com", country_code: "US", payout_iban: "US00000000000000000000105" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
              captures: { cons_v2: $.data.version }
