      - name: side_lot_assessed_cap_overrides_marginal_area_price
        claim_type: tiered_pricing
        grounds:
          - calculations.disposition_price_quote
        distinguishing_aspect: "The side-lot ladder is base + marginal area, then capped: a 30000 sqft lot prices at 10000 + 25000 x 2 = 60000 raw, but 25% of the 200000 assessed value caps it at 50000, so the quote is the cap - and marginal_area_sqft still reports the full 25000 that was priced before capping."
        test_recipe:
          setup:
            - "One vacant registry parcel of 30000 sqft with assessed_value_cents 200000."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-202050", address: "2050 Yarrow St", situs_ward: 3, lot_area_sqft: 30000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties/${p_id}/price-quote?program=SIDE_LOT"
              payload: { program: "SIDE_LOT" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { quoted: $.data.quoted_price_cents, marginal: $.data.marginal_area_sqft, cap: $.data.assessed_cap_cents, disc: $.data.discount_applied }
          assert:
            - "HTTP 200 and ${quoted} == 50000 and ${marginal} == 25000 and ${cap} == 50000"
            - "${disc} == false  # structure_present is false, so the condition discount never applies"
            - "the quote is max(10000, min(60000, 50000)) - the cap binds but the 10000 base floor still wins over any smaller cap"

      - name: side_lot_assessed_cap_rounds_half_up_on_odd_cent
        claim_type: precision
        grounds:
          - calculations.disposition_price_quote.constants.SIDE_LOT_ASSESSED_CAP_PCT
        distinguishing_aspect: "An assessed value of 200002 cents makes the cap 0.25 x 200002 = 50000.5 exactly; round_half_up takes it to 50001, so the quote is 50001 rather than the truncated 50000."
        test_recipe:
          setup:
            - "One vacant registry parcel of 30000 sqft with assessed_value_cents 200002 (raw side-lot price 60000, well above the cap)."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-202060", address: "2060 Zelkova St", situs_ward: 3, lot_area_sqft: 30000, assessed_value_cents: 200002, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties/${p_id}/price-quote?program=SIDE_LOT"
              payload: { program: "SIDE_LOT" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { quoted: $.data.quoted_price_cents, cap: $.data.assessed_cap_cents }
          assert:
            - "HTTP 200 and ${cap} == 50001 and ${quoted} == 50001"

      - name: program_floors_bind_for_homeowner_and_developer_on_same_parcel
        claim_type: tiered_pricing
        grounds:
          - calculations.disposition_price_quote.constants.HOMEOWNER_FLOOR_CENTS
          - calculations.disposition_price_quote.constants.DEVELOPER_FLOOR_CENTS
        distinguishing_aspect: "On one 100000-cent parcel the assessed share is below both program floors, so HOMEOWNER_SALE quotes the 100000 floor (not 55000) and DEVELOPER_RFP quotes the 500000 floor (not 90000): the same parcel carries different program prices, and the floor - not the percentage - is what is charged."
        test_recipe:
          setup:
            - "One vacant registry parcel with assessed_value_cents 100000 and lot 6000 sqft."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-202070", address: "2070 Aspen St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties/${p_id}/price-quote?program=HOMEOWNER_SALE"
              payload: { program: "HOMEOWNER_SALE" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { home_q: $.data.quoted_price_cents, home_tier: $.data.tier_applied }
            - call: "GET /land-bank/properties/${p_id}/price-quote?program=DEVELOPER_RFP"
              payload: { program: "DEVELOPER_RFP" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { dev_q: $.data.quoted_price_cents, dev_tier: $.data.tier_applied }
            - call: "GET /land-bank/properties/${p_id}/price-quote?program=COMMUNITY_USE"
              payload: { program: "COMMUNITY_USE" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { comm_q: $.data.quoted_price_cents }
          assert:
            - "${home_q} == 100000  # max(100000, round_half_up(0.55 * 100000) = 55000)"
            - "${dev_q} == 500000   # max(500000, round_half_up(0.90 * 100000) = 90000)"
            - "${comm_q} == 100     # nominal consideration, independent of assessed value"
            - "${home_tier} == HOMEOWNER_SALE and ${dev_tier} == DEVELOPER_RFP"

      - name: blight_score_rescored_when_code_violation_report_changes
        claim_type: weighted_scoring
        grounds:
          - calculations.blight_priority_score
          - endpoints["POST /land-bank/properties/{id}/code-violation-report"]
        distinguishing_aspect: "Re-reporting re-scores from scratch rather than accumulating: 1 complaint + 1 violation gives 8 + 0.75 + 1.5 + 3 = 13.25 -> 13.3, and a later report of 6 complaints + 3 violations gives 8 + 0.75 + 9 + 9 = 26.75 -> 26.8, with the single terminal round_half_up preventing per-term drift."
        test_recipe:
          setup:
            - "One grade B registry parcel with vacancy_months 3 (vacancy term 0.75)."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-202080", address: "2080 Beech St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "B", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id, score0: $.data.current_blight_score }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 1, nuisance_complaint_count: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { score1: $.data.current_blight_score }
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 3, nuisance_complaint_count: 6 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { score2: $.data.current_blight_score, viol2: $.data.open_code_violation_count, comp2: $.data.nuisance_complaint_count }
          assert:
            - "${score0} == 0  # a brand-new registry parcel carries no score until a recompute trigger fires"
            - "${score1} == 13.3 and ${score2} == 26.8"
            - "${viol2} == 3 and ${comp2} == 6  # the second report replaces the counts, it does not add to them"
            - "Property.${p_id}.intake_blight_score == null throughout (INTAKE_PROVISIONAL is only stamped at packet close)"

      - name: tif_recapture_raises_authorization_and_restores_source
        claim_type: aggregation
        grounds:
          - calculations.funding_ledger_position
          - endpoints["POST /land-bank/funding-sources/{id}/tif-recapture"]
        distinguishing_aspect: "A recapture receipt is added to authorized_cents (not to available_cents directly), which also raises the 5% reserve floor from 5000 to 7500 - and the release still clears the higher floor, flipping the source back to ACTIVE and releasing the parked packet."
        test_recipe:
