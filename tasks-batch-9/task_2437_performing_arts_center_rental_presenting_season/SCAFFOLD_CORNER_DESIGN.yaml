      - name: blocked_clearance_flips_to_cleared_after_tiers_raise_projected_gross
        claim_type: valid_transition
        grounds:
          - "§1.2 Engagement.financial_clearance BLOCKED -> CLEARED on re-assessment when risk_tier IN {LOW, MODERATE}."
          - "§1.3 financial_risk_score PRESENTED variant: fee_exposure_ratio = fee_basis_cents / max(1, projected_gross_cents), bands PROHIBITIVE >= 75, MODERATE >= 35."
          - "§1.3 engagement_margin PROJECTED sums ACTIVE PriceTier rows."
        distinguishing_aspect: >-
          The re-scoring edge, driven by a change in a THIRD entity: no field of
          the engagement or the artist changes between the two assessments, only
          the existence of an ACTIVE price tier, which collapses the fee-exposure
          term from its 1.0 clamp to 0.125 and moves the score across two band
          boundaries at once (82 -> 42). Also the only instance that exercises
          the `max(1, projected_gross_cents)` guard against a zero denominator.
        test_recipe:
          setup:
            - "Grand Hall (1200 seats) exists and artist 'Tidewater Ensemble' exists with guarantee_floor_cents 1000000, historical_sell_through_pct 0.8, routing window 2026-08-05T00:00Z -> 2026-08-20T00:00Z, min_days_between_engagements 0."
            - "A PRESENTED engagement exists on Grand Hall: load-in 2026-08-09T08:00Z, performance 2026-08-10T19:00Z-22:00Z, load-out 2026-08-11T02:00Z, 1 performance day, 1 load-in day. It sits inside the routing window, so §1.4 priority 62 passes. Version 1."
            - "Round 1 was opened at 2000000 / 0.10 (above the 1000000 floor) and left OFFERED, so §1.3 fee_basis_cents is 2000000; the engagement moved to version 2."
            - "The first assessment ran with NO price tiers: projected_gross_cents 0 -> exposure ratio clamps to min(1, 2000000/max(1,0)) = 1 -> 0.45; routing slack = min(floor_days(08-10T19:00 - 08-05T00:00) = 5, floor_days(08-20T00:00 - 08-10T22:00) = 9) = 5 -> 0.25 * (1 - 5/14) = 0.160714; lead = floor_days(08-10T19:00 - 08-01T00:00) = 9 -> 0.20 * (1 - 9/120) = 0.185; sell-through 0.10 * 0.2 = 0.02. Score = round_half_up(81.5714) = 82 >= 75 -> PROHIBITIVE -> financial_clearance BLOCKED, and the engagement is now at version 3."
            - "One ACTIVE tier ORCH was then drafted (1000 seats <= 1200 capacity, base 20000, ceiling 25000), which does not bump engagement.version, giving projected_gross_cents = round_half_up(20000 * 1000 * 0.8) = 16000000 for the next assessment."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Tidewater Ensemble", agency_name: "Harborlight Artists", guarantee_floor_cents: 1000000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-08-05T00:00:00Z", routing_window_end_utc: "2026-08-20T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Tidewater Ensemble Gala", load_in_start_utc: "2026-08-09T08:00:00Z", performance_start_utc: "2026-08-10T19:00:00Z", performance_end_utc: "2026-08-10T22:00:00Z", load_out_end_utc: "2026-08-11T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 2000000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
              captures: { eng_v2: "$.data.version", blocked_score: "$.data.risk_score" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 1000, base_price_cents: 20000, price_ceiling_cents: 25000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { tier_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v2}" }
          assert:
            - "The setup assessment recorded risk_score == 82, risk_tier 'PROHIBITIVE', financial_clearance 'BLOCKED', projected_gross_cents 0 and projected_margin_cents == -2250000 (0 - (2000000 + 250000))."
            - "The re-assessment returns 200 with risk_score == 42 (0.45*0.125 + 0.160714 + 0.185 + 0.02 = 0.421964 -> round_half_up(42.1964))."
            - "risk_tier == 'MODERATE' (42 is >= 35 and < 55) and financial_clearance == 'CLEARED' - BLOCKED is not a dead end."
            - "projected_gross_cents == 16000000 and projected_margin_cents == 13750000 (16000000 - 2250000)."
            - "engagement.version == ${eng_v2} + 1; the routing, lead and sell-through terms are byte-identical between the two assessments, so the whole 40-point move is attributable to the tier."

      - name: cancelled_engagement_is_locked_against_confirmation
        claim_type: terminal_state_lockdown
        excluded_because:
          difficulty_instance: confirm_state_check_outranks_deposit_shortfall
          rationale: >-
            That §1.8 priority_pair_validation_conflict instance already cancels
            a DRAFT engagement and then re-attempts confirmation, asserting 409
            ERR_ENGAGEMENT_NOT_DRAFT out of the CANCELLED terminal state (and
            proving the priority-40 state check outranks the priority-90 deposit
            shortfall). A separate corner probe of the same terminal state would
            assert a strict subset of those claims.

      - name: cancel_cascade_reverses_every_downstream_side_effect
        claim_type: compensation_cascade
        excluded_because:
          difficulty_instance: engagement_cancel_reverse_cascade_to_deposit_and_client_balance
          rationale: >-
            §1.8's transitive_cascade instance walks all eleven CANCEL CASCADE
            steps of the CONFIRMED -> CANCELLED edge end to end (labor calls to
            CANCELLED, equipment lines RELEASED with reserved_qty recomputed,
            rider and engagement equipment costs recomputed, tiers and ticketing
            CLOSED, education programs CANCELLED_WITH_ENGAGEMENT with subsidy
            refunds appended to the reserve, and the retained cancellation fee
            netted against the paid deposit on RentalClient.outstanding_balance_cents).
            Every guide claim for the cascade-down, conditional-cascade and
