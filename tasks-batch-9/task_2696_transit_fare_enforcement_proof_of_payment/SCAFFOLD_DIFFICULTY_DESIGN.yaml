  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: line_deployment_windows_are_half_open_so_adjacent_windows_are_allowed
        grounds:
          - validations[priority=40]
          - entities.InspectionDeployment.fields.window_start
          - entities.InspectionDeployment.fields.window_end
          - errors.ERR_DEPLOYMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          The contended resource is the LINE and the interval semantics are half-open
          [window_start, window_end): a second deployment starting exactly when the first ends
          (14:00:00Z) is legal, while one that straddles the boundary by an hour
          ([13:00, 15:00)) collides with the first and is refused with
          ERR_DEPLOYMENT_WINDOW_OVERLAP. The zone's max_concurrent_deployments is deliberately 4
          here so that the line rule, not the zone capacity rule, is the only thing under test.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED with max_concurrent_deployments 4; line L1 assigned with effective_from 2026-08-01T00:00:00Z."
            - "Deployment D1 on L1 is PLANNED for 2026-08-05T06:00:00Z..2026-08-05T14:00:00Z."
            - "Logical clock at 2026-08-01T02:00:00Z (all deployments are still in the future)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 4 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T14:00:00Z", window_end: "2026-08-05T18:00:00Z", planned_inspector_count: 2, sampling_method: "RANDOM_INTERCEPT", target_sample_size: 4 }
              as: EnforcementPlanner
              captures: { d2: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T13:00:00Z", window_end: "2026-08-05T15:00:00Z", planned_inspector_count: 2, sampling_method: "RANDOM_INTERCEPT", target_sample_size: 4 }
              as: EnforcementPlanner
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the adjacent window is accepted: HTTP 201 with InspectionDeployment.${d2}.window_start == 2026-08-05T14:00:00Z and status == PLANNED"
            - "InspectionDeployment.${d1}.window_end == 2026-08-05T14:00:00Z and InspectionDeployment.${d1}.status == PLANNED (untouched)"
            - "the straddling window is refused: HTTP 409 with ${err_overlap} == ERR_DEPLOYMENT_WINDOW_OVERLAP"
            - "GET /inspection-deployments?line_id=${l1} returns exactly 2 rows"
            - "InspectionDeployment.${d2}.target_sample_size == 4 and InspectionDeployment.${d2}.sample_adequacy_ratio == 0.0000"
            - "no third InspectionDeployment row exists with window_start == 2026-08-05T13:00:00Z"

      - name: zone_deployment_capacity_uses_closed_intervals_so_a_touching_window_consumes_a_slot
        grounds:
          - validations[priority=41]
          - entities.FareZone.fields.max_concurrent_deployments
          - errors.ERR_ZONE_DEPLOYMENT_CAPACITY
        distinguishing_aspect: |
          The contended resource is the ZONE, not the line, and the interval semantics are the
          opposite of the line rule: capacity is counted over CLOSED intervals
          [window_start, window_end]. A window that merely touches an existing deployment's end
          instant (14:00:00Z) therefore consumes a slot and, with two overlapping deployments
          already present in a zone whose max_concurrent_deployments is 2, is refused with
          ERR_ZONE_DEPLOYMENT_CAPACITY — while the same window shifted by one minute to 14:01:00Z is
          accepted. All three deployments sit on different lines, so the half-open line rule never
          fires.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED with max_concurrent_deployments 2; lines L1, L2 and L3 are all assigned to Z1 with effective_from 2026-08-01T00:00:00Z."
            - "Deployment D1 on L1 covers 2026-08-05T06:00:00Z..14:00:00Z; deployment D2 on L2 covers 2026-08-05T12:00:00Z..16:00:00Z."
            - "Logical clock at 2026-08-01T02:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L2", mode: "BUS_RAPID", daily_boardings: 21000, baseline_evasion_rate_bps: 900 }
              as: EnforcementPlanner
              captures: { l2: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L3", mode: "STREETCAR", daily_boardings: 9000, baseline_evasion_rate_bps: 1200 }
              as: EnforcementPlanner
              captures: { l3: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l2}", platform_segment_count: 3, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l3}", platform_segment_count: 2, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l2}", zone_id: "${z1}", window_start: "2026-08-05T12:00:00Z", window_end: "2026-08-05T16:00:00Z", planned_inspector_count: 2, sampling_method: "RANDOM_INTERCEPT", target_sample_size: 4 }
              as: EnforcementPlanner
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l3}", zone_id: "${z1}", window_start: "2026-08-05T14:00:00Z", window_end: "2026-08-05T15:00:00Z", planned_inspector_count: 1, sampling_method: "RANDOM_INTERCEPT", target_sample_size: 2 }
              as: EnforcementPlanner
              captures: { err_capacity: $.data.error_id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l3}", zone_id: "${z1}", window_start: "2026-08-05T14:01:00Z", window_end: "2026-08-05T15:00:00Z", planned_inspector_count: 1, sampling_method: "RANDOM_INTERCEPT", target_sample_size: 2 }
              as: EnforcementPlanner
              captures: { d3: $.data.id }
          assert:
            - "the touching window is refused: HTTP 409 with ${err_capacity} == ERR_ZONE_DEPLOYMENT_CAPACITY (D1's closed interval ends exactly at 14:00:00Z and still counts)"
            - "the one-minute-later window is accepted: HTTP 201 with InspectionDeployment.${d3}.window_start == 2026-08-05T14:01:00Z"
            - "InspectionDeployment.${d3}.status == PLANNED and InspectionDeployment.${d3}.planned_inspector_count == 1"
            - "GET /inspection-deployments?zone_id=${z1} returns exactly 3 rows"
            - "no InspectionDeployment row exists with window_start == 2026-08-05T14:00:00Z"
            - "FareZone.${z1}.max_concurrent_deployments == 2 and FareZone.${z1}.designation_status == DESIGNATED"
            - "the line rule never fired: ${err_capacity} != ERR_DEPLOYMENT_WINDOW_OVERLAP because D1, D2 and D3 are on three different lines"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: citation_money_identity_survives_direct_payment_service_credit_and_dismissal_reversal
        grounds:
          - calculations.citation_outstanding_balance_cents
          - calculations.service_hours_required
          - state_machines.Citation.adjudication_status.CONTESTED_to_DISMISSED
          - state_machines.CommunityServiceAssignment.ACTIVE_to_CANCELLED
          - entities.PenaltyPayment.fields.source
        distinguishing_aspect: |
          The conserved quantity is MONEY: at every observation point
          total_due_cents == amount_paid_cents + service_credit_cents + outstanding_balance_cents.
          The compensation is a reversal by APPENDING, never by deleting: the DISMISS decision adds a
          DISMISSAL_REVERSAL row for exactly the 2000 cents of cash the rider had paid, which nets
          amount_paid_cents to 0, while the 3000 cents of SERVICE_CREDIT earned before the dismissal
          is deliberately NOT reversed. An implementation that mutates or deletes the original DIRECT
          row, or that also reverses the service credit, breaks the identity and loses the audit
          trail even though the visible balances look plausible.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED (12000 bps), deployment D1 ACTIVE, rider R-100 with no history."
            - "First-offense NO_PROOF citation cit1: assessed 9000, admin_fee 720, total_due 9720, offense_sequence 1."
            - "The rider paid 2000 cents directly, so amount_paid 2000 and outstanding 7720 (identity 9720 = 2000 + 0 + 7720)."
            - "A community service assignment was opened: required_hours = ceil(7720 / 1500) = 6, settlement_status SERVICE_ACTIVE."
            - "2 hours were logged, crediting 3000 cents, so outstanding 4720 (identity 9720 = 2000 + 3000 + 4720) and the assignment is still ACTIVE."
            - "Logical clock at 2026-08-06T00:00:00Z, inside the contest window (deadline 2026-09-04T09:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /citations"
              payload: { encounter_id: "${e1}" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "POST /citations/${cit1}/payments"
              payload: { amount_cents: 2000 }
              as: Rider
              as_user_id: "${r1}"
              captures: { pay1: $.data.id }
            - call: "GET /citations/${cit1}"
              payload: {}
              as: Rider
              as_user_id: "${r1}"
              captures: { cv1: $.data.version }
            - call: "POST /community-service-assignments"
              payload: { citation_id: "${cit1}", partner_org_name: "Riverside Community Kitchen", expected_citation_version: "${cv1}" }
              as: Rider
              as_user_id: "${r1}"
              captures: { cs1: $.data.id }
            - call: "POST /community-service-assignments/${cs1}/log-hours"
              payload: { hours: 2 }
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /citations/${cit1}/contest"
              payload: {}
              as: Rider
              as_user_id: "${r1}"
              captures: { h1: $.data.id }
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "DISMISS", dismissal_reason_code: "FIRST_OFFENSE_DIVERSION" }
              as: HearingOfficer
              as_user_id: "HO-1"
          assert:
            - "pre-compensation identity: Citation.${cit1}.total_due_cents == 9720 == 2000 + 3000 + 4720"
            - "pre-compensation: CommunityServiceAssignment.${cs1}.required_hours == 6 and hours_completed == 2 and credited_cents == 3000 and status == ACTIVE"
            - "after the DISMISS: Citation.${cit1}.adjudication_status == DISMISSED and dismissal_reason_code == FIRST_OFFENSE_DIVERSION and dismissed_at == 2026-08-06T00:00:00Z"
            - "after the DISMISS: Citation.${cit1}.settlement_status == WRITTEN_OFF and outstanding_balance_cents == 0"
            - "after the DISMISS: Citation.${cit1}.amount_paid_cents == 0 (2000 paid in minus 2000 reversed)"
            - "after the DISMISS: Citation.${cit1}.service_credit_cents == 3000 (service credit is NOT reversed)"
            - "GET /citations/${cit1}/payments returns exactly 3 append-only rows: DIRECT 2000 (id ${pay1}), SERVICE_CREDIT 3000 with hours_credited 2, DISMISSAL_REVERSAL 2000 with plan_id null"
            - "the DIRECT row ${pay1} still has amount_cents == 2000 — the reversal did not mutate or delete it"
            - "CommunityServiceAssignment.${cs1}.status == CANCELLED with hours_completed == 2 and credited_cents == 3000 preserved"
            - "Citation.${cit1}.total_due_cents == 9720 and assessed_penalty_cents == 9000 preserved as the historical record"
            - "Rider.${r1}.prior_citation_count == 0 and Inspector.${i1}.citations_issued_count == 0"

      - name: deployment_encounter_count_conservation_across_void
        grounds:
          - calculations.deployment_sample_adequacy_ratio
          - state_machines.InspectionDeployment.ACTIVE_to_VOIDED
          - state_machines.InspectionEncounter.PENDING_to_VOIDED
          - entities.InspectionDeployment.fields.achieved_sample_count
          - entities.InspectionDeployment.fields.voided_encounter_count
        distinguishing_aspect: |
          A different conserved quantity — a COUNT of sampled riders rather than money — and a
          different compensating trigger. Voiding the deployment must partition its five encounters,
          not lose any: achieved_sample_count + voided_encounter_count == 5 both before (5 + 0) and
          after (3 + 2) the void, because only the two PENDING rows are swept while the three
          terminal COMPLIANT rows are untouched. sample_adequacy_ratio therefore drops from 1.0000
          to exactly 0.6000, and an implementation that voids everything, or that decrements
          achieved_sample_count without incrementing voided_encounter_count, breaks the partition.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED, line L1 assigned, deployment D1 ACTIVE 2026-08-05T06:00:00Z..14:00:00Z with target_sample_size 5."
            - "Five encounters exist on D1: e1, e2 and e3 (valid smartcards) were resolved COMPLIANT; e4 and e5 (fare_media_type NONE) are PENDING."
            - "Before the void: achieved_sample_count 5, voided_encounter_count 0, sample_adequacy_ratio 1.0000."
            - "Logical clock at 2026-08-05T10:00:00Z."
