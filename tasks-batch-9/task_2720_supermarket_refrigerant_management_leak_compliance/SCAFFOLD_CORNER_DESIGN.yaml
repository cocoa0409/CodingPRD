              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2026-10-01T00:00:00Z", estimated_cost_usd: 6000000.00, expected_system_version: "${sys1_v}" }
