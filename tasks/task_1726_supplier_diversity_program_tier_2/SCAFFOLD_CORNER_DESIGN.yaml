      - name: certification_verify_expired_window_returns_temporal_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_CERT_WINDOW_EXPIRED]
        distinguishing_aspect: "A certification still UNDER_REVIEW whose valid_to is before the clock date fails verify with ERR_CERT_WINDOW_EXPIRED — the pure temporal path, distinct from the EXPIRED-state priority case in §1.8."
        test_recipe:
          setup: ["Default clock 2026-08-01; supplier; certification submitted with valid_to 2026-07-01 (already past) and moved to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Expired Co", tax_id: "T-EXP", kind: "DIVERSE", contact_email: "e@x.com" }
