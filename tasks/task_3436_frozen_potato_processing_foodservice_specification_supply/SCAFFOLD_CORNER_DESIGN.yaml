              as: QualityAssuranceLead
              captures: { st1: $.data.status }
            - call: "POST /potato-ops/production-runs/${run2_id}/qa-release"
              payload: { measured_color_units: 3.01 }
              as: QualityAssuranceLead
              captures: { error_id: $.data.error_id }
          assert:
            - "measured 3.0 vs target 2.5 releases: R1 status == RELEASED (inclusive boundary)"
            - "measured 3.01 fails: 422 ERR_COLOR_OUT_OF_TOLERANCE"
            - "ProductionRun.${run2_id}.status remains QA_HOLD"

      - name: posture_thresholds_sprout_2_watch_4_quarantine_inclusive
        claim_type: Constants Applied
        grounds:
          - calculations.facility_posture
        distinguishing_aspect: "Both posture thresholds are inclusive: sprout_index 2.0 lands WATCH (not NORMAL), 4.0 lands QUARANTINED (not WATCH), and a later clean reading returns the facility to NORMAL."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; facility CELL-1."]
          setup_api_calls:
            - *k_clock
            - *k_facility
          trigger:
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-02T00:00:00Z", temperature_f: 38.0, humidity_pct: 90.0, co2_pct: 3.0, sprout_index: 2.0, disease_incidence_pct: 1.0 }
              as: StorageOperator
              captures: { p1: $.data.posture }
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-03T00:00:00Z", temperature_f: 39.0, humidity_pct: 91.0, co2_pct: 3.2, sprout_index: 4.0, disease_incidence_pct: 1.0 }
              as: StorageOperator
              captures: { p2: $.data.posture }
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-04T00:00:00Z", temperature_f: 38.0, humidity_pct: 90.0, co2_pct: 3.0, sprout_index: 1.9, disease_incidence_pct: 2.9 }
              as: StorageOperator
              captures: { p3: $.data.posture }
          assert:
            - "sprout_index 2.0 -> posture WATCH (inclusive >= 2.0)"
            - "sprout_index 4.0 -> posture QUARANTINED (inclusive >= 4.0)"
            - "sprout 1.9 / disease 2.9 -> posture NORMAL (both strictly below their WATCH thresholds)"

  # ===========================================================================
  - section: validations
    instances:
      - name: contract_create_missing_auth_headers_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER at priority 1 — before role, existence, or any business rule."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            # no `as:` / `as_user_id`: the test harness sends no identity headers
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "00000000-0000-4000-8000-000000000000", variety: "RUSSET_BURBANK", contracted_acres: 100, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type is error"

      - name: existence_404_precedes_state_409_on_activate
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_DRAFT
        distinguishing_aspect: "Existence outranks state: activating an unknown id yields 404 ERR_CONTRACT_NOT_FOUND, while activating a known ACTIVE contract yields 409 ERR_CONTRACT_NOT_DRAFT — two different categories, each at its own priority."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower; one contract already ACTIVE."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_contract
            - *k_activate
          trigger:
            - call: "POST /potato-ops/crop-contracts/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: GrowerRelationsManager
              captures: { err_404: $.data.error_id }
            - call: "POST /potato-ops/crop-contracts/${contract_id}/activate"
              payload: {}
              as: GrowerRelationsManager
              captures: { err_409: $.data.error_id }
          assert:
            - "unknown id: 404 ERR_CONTRACT_NOT_FOUND"
            - "known ACTIVE contract: 409 ERR_CONTRACT_NOT_DRAFT"
            - "err_404 != err_409"

      - name: lot_create_outside_delivery_window_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_OUTSIDE_DELIVERY_WINDOW
        distinguishing_aspect: "With every earlier check passing (ACTIVE contract, NORMAL facility, capacity available), a contracted delivery after the window closes (clock 2026-10-16 vs window end 2026-10-15) fails 422 ERR_OUTSIDE_DELIVERY_WINDOW."
        test_recipe:
          setup: ["Clock starts 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract (window ends 2026-10-15); clock advanced to 2026-10-16T00:00:00Z."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OUTSIDE_DELIVERY_WINDOW"
            - "GET /potato-ops/potato-lots?contract_id=${contract_id} returns 0 rows"

      - name: lot_create_variety_mismatch_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_VARIETY_MISMATCH
        distinguishing_aspect: "A contracted lot whose variety differs from the contract's variety (RANGER_RUSSET vs RUSSET_BURBANK) fails 422 ERR_VARIETY_MISMATCH even inside the delivery window."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE RUSSET_BURBANK contract."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RANGER_RUSSET", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_VARIETY_MISMATCH"
            - "GET /potato-ops/potato-lots?contract_id=${contract_id} returns 0 rows"

      - name: import_lot_mode_requires_open_event_and_manager_role
        claim_type: Conditional validation
        grounds:
          - endpoints.POST_/potato-ops/potato-lots
          - errors.ERR_OWNERSHIP_MISMATCH
          - errors.ERR_SHORTAGE_EVENT_NOT_OPEN
        distinguishing_aspect: "IMPORT sourcing mode is gated twice: a Grower-role caller is refused 403 ERR_OWNERSHIP_MISMATCH (import is a GrowerRelationsManager prerogative), and after execute-allocation the event is EXECUTED so further imports fail 409 ERR_SHORTAGE_EVENT_NOT_OPEN; an IMPORT lot carries origin IMPORT and null payment fields."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; facility; grower; chain A with ACTIVE agreement 600/wk; one OPEN shortage event."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 600, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *k_event
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { shortage_event_id: "${event_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 2020.0, tare_weight_cwt: 20.0, defect_pct: 3.0, specific_gravity: 1.075, sugar_end_rating: 2.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { err_role: $.data.error_id }
            - call: "POST /potato-ops/potato-lots"
              payload: { shortage_event_id: "${event_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 2020.0, tare_weight_cwt: 20.0, defect_pct: 3.0, specific_gravity: 1.075, sugar_end_rating: 2.5 }
              as: GrowerRelationsManager
              captures: { imp_lot_id: $.data.id, imp_origin: $.data.origin, imp_prov: $.data.provisional_payment_cents }
            - call: "POST /potato-ops/shortage-events/${event_id}/execute-allocation"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /potato-ops/potato-lots"
              payload: { shortage_event_id: "${event_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 2020.0, tare_weight_cwt: 20.0, defect_pct: 3.0, specific_gravity: 1.075, sugar_end_rating: 2.5 }
              as: GrowerRelationsManager
              captures: { err_closed: $.data.error_id }
          assert:
            - "Grower role in IMPORT mode: 403 ERR_OWNERSHIP_MISMATCH"
            - "GrowerRelationsManager import succeeds 201: origin == IMPORT, grade == B (defect 3.0/gravity 1.075/sugar 2.5 all B), provisional_payment_cents is null"
            - "after execute-allocation the same import fails 409 ERR_SHORTAGE_EVENT_NOT_OPEN"
            - "GET /potato-ops/potato-lots?shortage_event_id=${event_id} returns exactly 1 row"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: agreement_activate_locks_spec_and_pins_its_version
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/potato-ops/supply-agreements/{id}/activate
          - state_machines.CutSpecification.VALIDATED_to_LOCKED
          - entities.SupplyAgreement.fields.pinned_spec_version
        distinguishing_aspect: "Activation is a cross-entity write: the previously VALIDATED spec flips to LOCKED with ever_locked true and its version bumps to 3, and the agreement stores pinned_spec_version == 3 and current_week_allocation_cases == its weekly volume."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chain A; spec VALIDATED (version 2); agreement DRAFT."]
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - *k_agr_10k
          trigger:
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
              captures: { pin: $.data.pinned_spec_version, alloc: $.data.current_week_allocation_cases }
            - call: "GET /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { spec_status: "$.data[0].status", spec_ver: "$.data[0].version", spec_ever: "$.data[0].ever_locked" }
          assert:
            - "agreement: status ACTIVE, pinned_spec_version == 3, current_week_allocation_cases == 10000"
            - "spec: status == LOCKED, ever_locked == true, version == 3 (create 1, validate 2, lock 3)"

      - name: execute_allocation_response_carries_ordered_waterfall_results
        claim_type: Computed read
        grounds:
          - endpoints.POST_/potato-ops/shortage-events/{id}/execute-allocation
          - entities.ShortageEvent.fields.allocation_results
        distinguishing_aspect: "The execute-allocation response itself carries allocation_results ordered by the waterfall (TIER_1 before TIER_2), so clients need no follow-up read to learn the outcome."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chains A (TIER_1) and B (TIER_2) with ACTIVE agreements 600/wk each; OPEN waterfall event with a 1000-case pool."]
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 600, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *k_chain_b
            - *k_spec_b
            - call: "POST /potato-ops/cut-specifications/${spec_b_id}/validate"
              payload: { panel_score: 7.5 }
              as: QualityAssuranceLead
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 600, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_b_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/shortage-events"
              payload: { scope_variety: "RUSSET_BURBANK", declared_deficit_cwt: 5000, available_week_cases: 1000, response_mode: "PRIORITY_WATERFALL" }
              as: GrowerRelationsManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/shortage-events/${event_id}/execute-allocation"
              payload: {}
              as: GrowerRelationsManager
              captures: { results: $.data.allocation_results, ev_status: $.data.status }
          assert:
            - "the response status is 200 and the event status == EXECUTED"
            - "allocation_results == [{agreement_id: ${agr_a_id}, allocated_cases: 600}, {agreement_id: ${agr_b_id}, allocated_cases: 400}] in tier order"

      - name: run_reject_diverts_output_to_condemned_waste_batch
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ProductionRun.QA_HOLD_to_REJECTED
          - entities.ByproductBatch.fields.stream
        distinguishing_aspect: "Rejecting a QA_HOLD run writes the whole input mass to a REJECTED_PRODUCT batch with the request's routing (CONDEMNED_WASTE prices at 0 cents), consumes the lots, and leaves the agreement's released inventory untouched."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; full fixture; run R1 at QA_HOLD (620 prospective cases, 1000.0 cwt input)."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - *k_lot_a
            - *k_line
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - *k_agr_10k
            - *k_agr_act
            - *k_run1
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /potato-ops/production-runs/${run1_id}/reject"
              payload: { disposition: "CONDEMNED_WASTE" }
              as: QualityAssuranceLead
              captures: { r_status: $.data.status }
            - call: "GET /potato-ops/byproduct-batches"
              payload: { source_run_id: "${run1_id}" }
              as: QualityAssuranceLead
              captures: { b_stream: "$.data[0].stream", b_route: "$.data[0].routing", b_w: "$.data[0].weight_cwt", b_rev: "$.data[0].total_revenue_cents" }
            - call: "GET /potato-ops/potato-lots/${lot_id}"
              payload: {}
              as: QualityAssuranceLead
              captures: { lot_status: $.data.status }
          assert:
            - "ProductionRun.${run1_id}.status == REJECTED"
            - "the batch: stream REJECTED_PRODUCT, routing CONDEMNED_WASTE, weight_cwt 1000.0, total_revenue_cents == 0"
            - "PotatoLot.${lot_id}.status == CONSUMED"
            - "SupplyAgreement.${agr_a_id}.lifetime_released_cases == 0 (rejected output never enters inventory)"

  # ===========================================================================
  - section: errors
    instances:
      - name: run_create_with_unsupported_cut_family_returns_409
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CUT_FAMILY_UNSUPPORTED
          - endpoints.POST_/potato-ops/production-runs
        distinguishing_aspect: "A run whose spec cuts WEDGE on a line supporting only STRAIGHT and CRINKLE fails 409 ERR_CUT_FAMILY_UNSUPPORTED; the lots stay IN_STORAGE and no run row is created."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with lot; chain with LOCKED WEDGE spec and ACTIVE agreement; line LINE-1 supporting STRAIGHT and CRINKLE only."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - *k_lot_a
            - *k_line
            - *k_chain_a
            - call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_a_id}", spec_code: "SP-A-W", cut_family: "WEDGE", cut_size_mm: 12.0, coating_type: "NONE", target_color_units: 3.0, max_cook_time_sec: 240 }
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { spec_w_id: $.data.id }
            - call: "POST /potato-ops/cut-specifications/${spec_w_id}/validate"
              payload: { panel_score: 8.0 }
              as: QualityAssuranceLead
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_w_id}", weekly_contracted_cases: 5000, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_w_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_w_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_w_id}", agreement_id: "${agr_w_id}", input_lot_ids: ["${lot_id}"], scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CUT_FAMILY_UNSUPPORTED"
            - "PotatoLot.${lot_id}.status remains IN_STORAGE"
            - "GET /potato-ops/production-runs?line_id=${line_id} returns 0 rows"

  # ===========================================================================
  - section: rbac
    instances:
      - name: grower_role_cannot_validate_spec_returns_403
        claim_type: Peer role denial
        grounds:
          - roles.QualityAssuranceLead
          - endpoints.POST_/potato-ops/cut-specifications/{id}/validate
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "validate is exclusive to QualityAssuranceLead; a Grower caller with a perfectly valid payload is refused 403 ERR_INSUFFICIENT_PERMISSIONS at priority 2 and the spec stays SUBMITTED."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower GR-100; chain A with SUBMITTED spec."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_chain_a
            - *k_spec_a
          trigger:
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 8.0 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "CutSpecification.${spec_a_id}.status remains SUBMITTED with panel_score null"

      - name: chain_customer_cannot_create_spec_for_another_chain
        claim_type: Ownership denial
        grounds:
          - roles.ChainCustomer
          - validations[priority=3]
          - errors.ERR_OWNERSHIP_MISMATCH
        distinguishing_aspect: "ChainCustomer is entity-backed: customer_id in the body must equal X-User-ID; chain A's portal user posting a spec for chain B is refused 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chains A and B."]
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_chain_b
          trigger:
            - call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_b_id}", spec_code: "SP-X", cut_family: "STRAIGHT", cut_size_mm: 9.5, coating_type: "CLEAR", target_color_units: 2.5, max_cook_time_sec: 195 }
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_OWNERSHIP_MISMATCH"
            - "GET /potato-ops/cut-specifications?customer_id=${chain_b_id} returns 0 rows"

      - name: grower_cannot_deliver_against_another_growers_contract
        claim_type: Ownership denial
        grounds:
          - roles.Grower
          - validations[priority=3]
          - errors.ERR_OWNERSHIP_MISMATCH
        distinguishing_aspect: "Grower is entity-backed: delivering against a contract whose grower_id is a different grower is refused 403 ERR_OWNERSHIP_MISMATCH, even though the contract is ACTIVE and in-window."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; growers GR-100 and GR-200; facility; ACTIVE contract owned by GR-100."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - call: "POST /potato-ops/growers"
              payload: { grower_code: "GR-200", legal_name: "Snake River Produce Inc", region: "SNAKE_RIVER_VALLEY" }
              as: GrowerRelationsManager
              captures: { grower2_id: $.data.id }
            - *k_facility
            - *k_contract
            - *k_activate
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_OWNERSHIP_MISMATCH"
            - "GET /potato-ops/potato-lots?contract_id=${contract_id} returns 0 rows"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: accept_amendment_with_stale_version_returns_412_then_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-amend-accept-stale]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/potato-ops/crop-contracts/{id}/accept-amendment
        distinguishing_aspect: "The OCC gate keys on CropContract.version: proposing an amendment bumps the contract to version 3, so an accept carrying expected_crop_contract_version 2 is refused 412 ERR_STALE_VERSION with nothing applied, while the same accept carrying 3 applies the amended price and returns ACTIVE."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower; contract created (v1), activated (v2), amendment proposed (v3) raising base price to 2700."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_contract
            - *k_activate
            - call: "POST /potato-ops/crop-contracts/${contract_id}/propose-amendment"
              payload: { contracted_acres: 120, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2700, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /potato-ops/crop-contracts/${contract_id}/accept-amendment"
              payload: { expected_crop_contract_version: "${cv} - 1" }
              as: GrowerRelationsManager
              captures: { err_stale: $.data.error_id }
            - call: "POST /potato-ops/crop-contracts/${contract_id}/accept-amendment"
              payload: { expected_crop_contract_version: "${cv}" }
              as: GrowerRelationsManager
              captures: { c_status: $.data.status, c_price: $.data.base_price_per_cwt_cents, c_vol: $.data.contracted_volume_cwt, c_ver: $.data.version }
          assert:
            - "stale accept: 412 ERR_STALE_VERSION and the contract stays AMENDMENT_PENDING"
            - "fresh accept: 200, status == ACTIVE, base_price_per_cwt_cents == 2700, contracted_volume_cwt recomputed to 48000.0 (120 x 400)"
            - "version advances to 4 after the successful accept; pending_amendment is null"

      - name: released_unshipped_cases_reconcile_across_release_shipment_rejection
        claim_type: derived_field_reconciliation
        grounds:
          - entities.SupplyAgreement.fields.released_unshipped_cases
          - entities.SupplyAgreement.fields.lifetime_released_cases
          - entities.SupplyAgreement.fields.lifetime_shipped_cases
        distinguishing_aspect: "The derived inventory triple must reconcile at each step: release adds 620 (620/0/620), shipping 500 moves it to shipped (620/500/120), and an arrival rejection does NOT return cases (stays 620/500/120)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; full fixture with run R1 RELEASED (620 cases)."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - *k_lot_a
            - *k_line
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - *k_agr_10k
            - *k_agr_act
            - *k_run1
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - *k_run1_release
          trigger:
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { rel1: "$.data[0].lifetime_released_cases", uns1: "$.data[0].released_unshipped_cases" }
            - *k_ship_100
            - call: "POST /potato-ops/shipments/${ship_id}/reject-on-arrival"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { rel2: "$.data[0].lifetime_released_cases", ship2: "$.data[0].lifetime_shipped_cases", uns2: "$.data[0].released_unshipped_cases" }
          assert:
            - "after release: lifetime_released_cases == 620, released_unshipped_cases == 620"
            - "after shipment + rejection: lifetime_released_cases == 620, lifetime_shipped_cases == 0 (rejected cases never ship), released_unshipped_cases == 120"
            - "the rejected 500 cases are NOT returned to inventory (120, not 620)"

      - name: spec_revision_stale_flag_cascade_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CutSpecification.LOCKED_to_REVISION_REQUESTED
        excluded_because:
          difficulty_instance: cut_spec_revision_cycle_flags_and_reacks_agreement
          rationale: "The LOCKED -> REVISION_REQUESTED cascade that flags ACTIVE agreements spec_stale is asserted step-by-step in the named §1.8 instance."

      - name: dual_variant_payment_divergence_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.contract_final_settlement
        excluded_because:
          difficulty_instance: lot_settlement_provisional_vs_storage_adjusted_final
          rationale: "Provisional-vs-final divergence on identical lot data is the subject of the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: lot_create_response_immediately_carries_computed_fields
        claim_type: immediate
        grounds:
          - entities.PotatoLot.fields.grade
          - entities.PotatoLot.fields.net_weight_cwt
          - entities.PotatoLot.fields.provisional_payment_cents
        distinguishing_aspect: "Immediate consistency: the POST /potato-ops/potato-lots 201 response itself contains net_weight_cwt 1000.0, grade A, provisional_payment_cents 2700000 and status IN_STORAGE — no follow-up GET is needed to observe the computed fields."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
          trigger:
            - *k_lot_a
          assert:
            - "the 201 response body has net_weight_cwt == 1000.0, grade == A, provisional_payment_cents == 2700000, status == IN_STORAGE, origin == CONTRACTED"
            - "StorageFacility.${facility_id} read immediately after shows current_stock_cwt == 1000.0"
