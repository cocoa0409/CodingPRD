# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2417 — Warehouse Line of Credit for Mortgage Bankers
#
# Nine §0.5 rule_id blocks, 20 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every `${var}` is bound by a `captures:` on an
# earlier line of the same instance. Every numeric assert is a literal that was
# computed by executing the §1.3 formula.
#
# Shared fixture (anchored on first use, aliased afterwards):
#   facility "Meridian Mortgage Bankers LLC" — committed 20,000,000,000 cents,
#   wet sublimit 20,000,000,000, aged sublimit 2,000,000,000, S&D sublimit
#   1,000,000,000, min TNW 1,500,000,000, min liquidity 500,000,000,
#   min TTM net income 100,000,000, max investor concentration 0.35,
#   bailee period 30 days, unused line fee 0.0025, settlement account "4417".
#   CONFORMING advance rate 0.98 / wet haircut 0.02 / dwell limit 30 /
#   aging step 15 / curtailment step 0.005 / product sublimit 15,000,000,000.
#   Logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_wet_versus_dry_advance_sizing
        grounds:
          - calculations.advance_amount_determination
          - entities.ProductAdvanceRate.fields.wet_haircut
          - entities.Advance.fields.funding_type
          - entities.Advance.fields.advance_amount_cents
          - state_machines.Advance.funding_status.REQUESTED_to_FUNDED
        distinguishing_aspect: |
          The dual variant lives on the Advance (collateral-sizing) domain: the identical
          loan_amount_cents of 50,000,000 funds at 49,000,000 under the DRY_FUNDING variant
          and at 48,000,000 under the WET_FUNDING variant, a pinned delta of 1,000,000
          cents caused solely by wet_haircut entering stage 1 of the rate selection.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE facility with the canonical CONFORMING rate row (advance_rate 0.98, wet_haircut 0.02, wet_funding_allowed true)."
            - "One APPROVED custodian, one APPROVED investor and one OPEN commitment of 5,000,000,000 cents, so no orphan cap and no concentration cap can bind."
            - "Two REQUESTED advances of loan_amount_cents 50,000,000 each — one DRY with a CLEAR custodian receipt already in hand, one WET — each with a VERIFIED wire to account 4417."
          setup_api_calls:
            - &k_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - &k_facility
              call: "POST /facilities"
              payload:
                borrower_legal_name: "Meridian Mortgage Bankers LLC"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "4417"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: "$.data.id" }
            - &k_par_conforming
              call: "POST /facilities/${fac_id}/product-advance-rates"
              payload:
                product_code: "CONFORMING"
                advance_rate: 0.98
                wet_funding_allowed: true
                wet_haircut: 0.02
                dwell_limit_days: 30
                aging_step_days: 15
                curtailment_step_rate: 0.005
                product_sublimit_cents: 15000000000
              as: CreditOfficer
              as_user_id: "co_1"
            - &k_approve_facility
              call: "POST /facilities/${fac_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - &k_custodian
              call: "POST /facilities/${fac_id}/custodians"
              payload: { custodian_name: "First Doc Custody NA", wet_receipt_deadline_hours: 48 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cust_id: "$.data.id" }
            - &k_investor_a
              call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Alpha Aggregator", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_a_id: "$.data.id" }
            - &k_investor_a_approve
              call: "POST /investors/${inv_a_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - &k_commitment_a
              call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 5000000000
                price_pct: 1.0125
                effective_on: "2026-08-01"
                expires_on: "2026-12-31"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_a_id: "$.data.id" }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v1: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 50000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a_dry_id: "$.data.id" }
            - call: "POST /advances/${a_dry_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${a_dry_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w_dry_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${w_dry_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-DRY-001" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 50000000
                note_rate: 0.0650
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a_wet_id: "$.data.id" }
            - call: "GET /advances/${a_wet_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w_wet_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${w_wet_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-WET-001" }
              as: WireOperator
              as_user_id: "wo_1"
          trigger:
            - call: "POST /advances/${a_dry_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a_wet_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "Advance.${a_dry_id}.provisional_advance_amount_cents == 49000000"
            - "Advance.${a_dry_id}.advance_amount_cents == 49000000"
            - "Advance.${a_dry_id}.effective_advance_rate == 0.98"
            - "Advance.${a_wet_id}.provisional_advance_amount_cents == 48000000"
            - "Advance.${a_wet_id}.advance_amount_cents == 48000000"
            - "Advance.${a_wet_id}.effective_advance_rate == 0.96"
            - "Advance.${a_dry_id}.advance_amount_cents - Advance.${a_wet_id}.advance_amount_cents == 1000000"
            - "Advance.${a_dry_id}.concentration_capped == false"
            - "Advance.${a_wet_id}.concentration_capped == false"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 97000000"
            - "WarehouseFacility.${fac_id}.availability_cents == 19903000000"
            - "InvestorCommitment.${comm_a_id}.allocated_amount_cents == 97000000"
            - "InvestorCommitment.${comm_a_id}.status == PARTIALLY_ALLOCATED"

      - name: dual_variant_ttm_rolling_versus_annualized_quarter_profitability
        grounds:
          - calculations.covenant_evaluation
          - entities.CovenantTest.fields.profitability_variant
          - entities.CovenantTest.fields.profitability_metric_cents
          - entities.WarehouseFacility.fields.min_ttm_net_income_cents
          - state_machines.CovenantTest.BREACH_to_WAIVED
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — covenant compliance
          on CovenantTest, not collateral sizing on Advance: net_income_cents of 30,000,000
          yields profitability_metric_cents 120,000,000 and status PASS under
          ANNUALIZED_QUARTER on a facility with no priors, and 75,000,000 with status BREACH
          under TTM_ROLLING on a facility carrying three 15,000,000 priors.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Facility F1 ACTIVE with zero outstanding principal, so the COVENANT_BREACH margin call computes to 0 and is skipped."
            - "F1 carries three stored CovenantTest rows for period_end 2025-09-30, 2025-12-31 and 2026-03-31, each with net_income_cents 15,000,000, each BREACHed under ANNUALIZED_QUARTER and then WAIVED so consecutive_breach_count returns to 0 and F1 returns to ACTIVE."
            - "Facility F2 ACTIVE with zero stored covenant tests."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2025-09-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 15000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct1_id: "$.data.id", ct1_variant: "$.data.profitability_variant", ct1_metric: "$.data.profitability_metric_cents" }
            - call: "POST /covenant-tests/${ct1_id}/waive"
              payload: { reason: "Sponsor equity injection documented" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2025-12-31", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 15000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct2_id: "$.data.id" }
            - call: "POST /covenant-tests/${ct2_id}/waive"
              payload: { reason: "Sponsor equity injection documented" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-03-31", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 15000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct3_id: "$.data.id" }
            - call: "POST /covenant-tests/${ct3_id}/waive"
              payload: { reason: "Sponsor equity injection documented" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Keystone Home Loans Inc"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "8802"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac2_id: "$.data.id" }
            - call: "POST /facilities/${fac2_id}/product-advance-rates"
              payload:
                product_code: "CONFORMING"
                advance_rate: 0.98
                wet_funding_allowed: true
                wet_haircut: 0.02
                dwell_limit_days: 30
                aging_step_days: 15
                curtailment_step_rate: 0.005
                product_sublimit_cents: 15000000000
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac2_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
          trigger:
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 30000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct4_id: "$.data.id" }
            - call: "POST /facilities/${fac2_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 30000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct5_id: "$.data.id" }
          assert:
            - "CovenantTest.${ct1_id}.profitability_variant == ANNUALIZED_QUARTER"
            - "CovenantTest.${ct1_id}.profitability_metric_cents == 60000000"
            - "CovenantTest.${ct4_id}.profitability_variant == TTM_ROLLING"
            - "CovenantTest.${ct4_id}.profitability_metric_cents == 75000000"
            - "CovenantTest.${ct4_id}.breach_codes == [PROFITABILITY]"
            - "CovenantTest.${ct4_id}.status == BREACH"
            - "CovenantTest.${ct5_id}.profitability_variant == ANNUALIZED_QUARTER"
            - "CovenantTest.${ct5_id}.profitability_metric_cents == 120000000"
            - "CovenantTest.${ct5_id}.breach_codes == []"
            - "CovenantTest.${ct5_id}.status == PASS"
            - "WarehouseFacility.${fac_id}.status == RESTRICTED"
            - "WarehouseFacility.${fac_id}.consecutive_breach_count == 1"
            - "WarehouseFacility.${fac2_id}.status == ACTIVE"
            - "WarehouseFacility.${fac2_id}.consecutive_breach_count == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_mode_c_investor_concentration_closed_form_solve
        grounds:
          - calculations.concentration_constrained_advance
          - calculations.advance_amount_determination
          - entities.WarehouseFacility.fields.max_investor_concentration_pct
          - entities.TakeoutInvestor.fields.concentration_limit_pct
          - entities.TakeoutInvestor.fields.exposure_cents
          - entities.Advance.fields.concentration_capped
          - validations[priority=36]
        distinguishing_aspect: |
          Mode (c): the concentration ratio is measured on the POST-funding outstanding,
          which contains the very amount being solved for, so the scaffold pins the
          evaluation order and the closed form X_max = floor((L*O - E)/(1 - L)); with
          O = 5,760,000,000, E = 1,920,000,000 and L = 0.35 the funded amount is exactly
          147,692,307 rather than the provisional 192,000,000.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "ACTIVE facility, max_investor_concentration_pct 0.35, three APPROVED investors B, C and D each with concentration_limit_pct 0.60 (so L = min(0.35, 0.60) = 0.35) and one OPEN commitment of 5,000,000,000 cents each."
            - "Three WET CONFORMING advances of loan_amount_cents 2,000,000,000, one per investor, each funded at floor(2,000,000,000 * 0.96) = 1,920,000,000 — outstanding_principal_cents 5,760,000,000, exposure_cents 1,920,000,000 per investor, all three below the CONCENTRATION_FLOOR_CENTS of 5,000,000,000 at their own funding instant."
            - "A fourth REQUESTED WET advance of loan_amount_cents 200,000,000 allocated to investor B's commitment, with a VERIFIED wire."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Bravo Capital Markets", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_b_id: "$.data.id" }
            - call: "POST /investors/${inv_b_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload: { investor_id: "${inv_b_id}", product_code: "CONFORMING", committed_amount_cents: 5000000000, price_pct: 1.0125, effective_on: "2026-08-01", expires_on: "2026-12-31" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_b_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Charlie Loan Trust", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_c_id: "$.data.id" }
            - call: "POST /investors/${inv_c_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload: { investor_id: "${inv_c_id}", product_code: "CONFORMING", committed_amount_cents: 5000000000, price_pct: 1.0125, effective_on: "2026-08-01", expires_on: "2026-12-31" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_c_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Delta Whole Loan Fund", counterparty_rating: "B", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_d_id: "$.data.id" }
            - call: "POST /investors/${inv_d_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload: { investor_id: "${inv_d_id}", product_code: "CONFORMING", committed_amount_cents: 5000000000, price_pct: 1.0125, effective_on: "2026-08-01", expires_on: "2026-12-31" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_d_id: "$.data.id" }
            - call: "GET /facilities/${fac_id}"
              payload: {}
