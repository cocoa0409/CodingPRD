  # ===========================================================================
  # Active layers per §0.2: rate_threshold_triggers, optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation. The remaining rows of the
  # guide's layer table (soft_delete, idempotency, bulk_operations,
  # scheduled_actions, multi_tenancy, conditional_feature_flags,
  # derived_field_reconciliation, pagination_with_filtering as a declared layer)
  # are not part of this scaffold's profile and are skipped; offset pagination is
  # still probed as an entity-listing corner.
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_window_version_on_filing_create_conflicts_then_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.submission-create-stale-window
          - endpoints.POST_/submissions
        distinguishing_aspect: |
          The first of the two declared OCC rules, walked through all three of the
          layer's claims on one window: the correct version writes and bumps
          ReportingWindow.version by exactly one, the SAME version replayed on the
          next filing is stale and returns ERR_STALE_WINDOW_VERSION 412 with no
          row written, and re-reading the parent lets the identical call through.
          The stale attempt is a lost-update simulation — two reporters holding the
          same snapshot of a shared window ledger.
        test_recipe:
          setup:
            - "Alpha Packing owns plants EST-101 and EST-102; one OPEN CATTLE / LIVE_ANIMAL window exists and its version is read once, before any filing."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-102", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_b: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_snapshot: $.data.version }
          trigger:
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_snapshot}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_1: $.data.id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_b}", reporting_window_id: "${win_1}", expected_window_version: "${wv_snapshot}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_fresh: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_b}", reporting_window_id: "${win_1}", expected_window_version: "${wv_fresh}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_2: $.data.id }
          assert:
            - "The first filing succeeds: Submission.${sub_1}.status == DRAFT and the response's ReportingWindow version is ${wv_snapshot} + 1"
            - "${e_stale} == ERR_STALE_WINDOW_VERSION with HTTP 412; no second Submission row exists at that point and the window version is unchanged by the refusal"
            - "${wv_fresh} == ${wv_snapshot} + 1 — exactly one bump per successful write, none for the rejected one"
            - "The retry with the refreshed version succeeds: Submission.${sub_2}.status == DRAFT for plant ${plant_b} and the window version becomes ${wv_snapshot} + 2"
            - "GET /submissions filtered by reporting_window_id returns total_count == 2"

      - name: stale_entity_version_on_penalty_create_conflicts_then_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.penalty-create-stale-entity
          - endpoints.POST_/penalty-assessments
          - calculations.penalty_assessment_amount.repeat_index
        distinguishing_aspect: |
          The second declared OCC rule, on a parent whose version is bumped by the
          child write itself — so the stale replay is not merely rejected, it is
          the exact shape of a double-assessment bug. The retry after refreshing
          is deliberately NOT identical in effect: repeat_index has moved from 0 to
          1, so the second assessment is 1.5x the first (1000000 -> 1500000),
          which proves the 412 prevented a duplicate rather than delaying one.
        test_recipe:
          setup:
            - "Alpha Packing holds a DETERMINED (not ACTIVE) 2026 registration, so no governing registration exists and the volume factor is neutral 1.000; the entity's version is read once before the first assessment."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "GET /reporting-entities/${ent_a}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_snapshot: $.data.version }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_a}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_snapshot}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_1: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_a}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_snapshot}" }
              as: PenaltyOfficer
              as_user_id: "officer-2"
              captures: { e_stale_entity: $.data.error_id }
            - call: "GET /reporting-entities/${ent_a}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-2"
              captures: { ev_fresh: $.data.version }
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_a}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_fresh}" }
              as: PenaltyOfficer
              as_user_id: "officer-2"
              captures: { pen_2: $.data.id }
          assert:
            - "PenaltyAssessment.${pen_1}: repeat_index == 0, volume_factor == 1.000, suspension_surcharge == 1.00, assessed_amount_cents == 1000000, points == 8"
            - "${e_stale_entity} == ERR_STALE_ENTITY_VERSION with HTTP 412; only one PenaltyAssessment row exists at that point and ReportingEntity.${ent_a}.delinquency_points is still 8"
            - "${ev_fresh} == ${ev_snapshot} + 1"
            - "PenaltyAssessment.${pen_2}: repeat_index == 1, repeat_multiplier == 1.50, assessed_amount_cents == 1500000, points == 8, delinquency_tier_at_assessment == TIER_0"
            - "ReportingEntity.${ent_a}: assessed_penalty_cents == 2500000, outstanding_penalty_cents == 2500000, delinquency_points == 16, version == ${ev_snapshot} + 2"
            - "Registration.${reg_a}.status stays DETERMINED — 16 points is TIER_1 and no registration was governing anyway"

      - name: cumulative_delinquency_points_land_exactly_on_the_tier_1_floor
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_points_and_tier.constants.TIER_1_FLOOR_POINTS
          - calculations.penalty_assessment_amount.day_tier_multiplier
        distinguishing_aspect: |
          The cumulative point threshold approached from below and landed on
          exactly: 8 points for a registration failure plus 2 for a late filing is
          exactly TIER_1_FLOOR_POINTS (10). Nothing may cascade — TIER_1 has no
          side effect, only TIER_2 suspends — and each assessment reads the tier
          BEFORE its own points, so both rows record TIER_0 while the entity ends
          at TIER_1. The late row also pins the day tier: a filing 4320 minutes
          past the deadline is days_late 3, the first day inside the 1.50 band.
        test_recipe:
          setup:
            - "Alpha Packing holds an ACTIVE 2026 registration (measured_head 126000, volume factor 1.126) and one filing submitted at 2026-08-14T15:00:00Z against a submission deadline of 2026-08-11T15:00:00Z."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_a}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 1, max_single_reporter_share_pct: 100.00, min_reported_head: 1 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_late: $.data.id }
            - call: "POST /submissions/${sub_late}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 100, avg_net_price_per_cwt: 280.00, avg_carcass_weight_cwt: 8.00 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T15:00:00Z" }
              as: ProgramAdmin
            - call: "POST /submissions/${sub_late}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_late}/review"
              payload: { decision: "ACCEPT", review_note: "late but accurate" }
              as: MarketAnalyst
            - call: "GET /reporting-entities/${ent_a}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_1: $.data.version }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_a}", violation_type: "NON_REGISTRATION", expected_reporting_entity_version: "${ev_1}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_nonreg: $.data.id }
            - call: "GET /reporting-entities/${ent_a}"
              payload: {}
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { ev_2: $.data.version }
            - call: "POST /penalty-assessments"
              payload: { reporting_entity_id: "${ent_a}", violation_type: "LATE_FILING", expected_reporting_entity_version: "${ev_2}", submission_id: "${sub_late}" }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { pen_late: $.data.id }
          assert:
            - "Submission.${sub_late}: lateness_minutes == 4320, is_late == true, days_late == 3"
            - "PenaltyAssessment.${pen_nonreg}: assessed_amount_cents == 1126000 (1000000 * 1.00 * 1.00 * 1.126), points == 8, delinquency_tier_at_assessment == TIER_0"
            - "PenaltyAssessment.${pen_late}: days_late == 3, day_tier_multiplier == 1.50, repeat_index == 0 (repeat counting is per violation type), volume_factor == 1.126, assessed_amount_cents == 422250, points == 2, delinquency_tier_at_assessment == TIER_0"
            - "ReportingEntity.${ent_a}: delinquency_points == 10 — exactly the TIER_1 floor — assessed_penalty_cents == 1548250, outstanding_penalty_cents == 1548250"
            - "Registration.${reg_a}.status is still ACTIVE with suspended_reason null: crossing into TIER_1 has no cascade, only TIER_2 does"
            - "Neither assessment doubled its points, because neither read TIER_2 as its pre-assessment tier"

      - name: audit_finding_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AuditCase.FIELDWORK_to_DISCREPANCY.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / audit_material_finding_four_hop_chain
          rationale: "That §1.8 instance verifies the four-hop chain end to end and in order: audit finding -> submission UNDER_CORRECTION -> window ledger decrement -> every COMPUTED report of the window re-staled."

      - name: tier_breach_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Registration.ACTIVE_to_SUSPENDED.system_trigger
        excluded_because:
          difficulty_instance: transitive_cascade / penalty_tier_breach_three_hop_chain
          rationale: "That §1.8 instance drives the point total past the TIER_2 floor and verifies the three-hop cascade: assessment -> registration SUSPENDED (DELINQUENCY_TIER_BREACH) -> the firm's DRAFT and SUBMITTED filings VOIDED."

      - name: both_weighting_variants_over_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - calculations.market_report_aggregation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / head_vs_weight_weighted_market_average
          rationale: "That §1.8 instance computes both weighting variants over the same three-reporter data set and asserts the delta on switching, which is exactly this layer's claim."

      - name: instantaneous_volume_threshold_at_the_species_floor
        claim_type: rate_threshold_triggers
        grounds:
