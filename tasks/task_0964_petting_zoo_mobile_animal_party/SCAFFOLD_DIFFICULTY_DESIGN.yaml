            - { call: "POST /petting-zoo/customers", payload: { email: "school@x.com", full_name: "Riverside Elementary", customer_type: "SCHOOL" }, as: Anonymous, captures: { c5: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "School Field", address: "9 Scholar Rd", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_C", distance_miles: 90, max_guest_capacity: 200, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c5}", captures: { v5: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 2, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v5}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T11:00:00Z", guest_count: 60, child_guest_count: 40, booking_type: "SCHOOL_PROGRAM", planned_handwash_stations: 3 }, as: Customer, as_user_id: "${c5}", captures: { bk: $.data.id, bk_v: $.data.version } }
            - { call: "POST /petting-zoo/bookings/${bk}/add-ons", payload: { addon_type: "PONY_RIDE", duration_minutes: 45, expected_booking_version: "${bk_v}" }, as: Customer, as_user_id: "${c5}", captures: { ao: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/add-ons/${ao}/decide", payload: { decision: "APPROVED" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
          assert:
            - "Booking.${bk}.addon_subtotal_cents == 12000 (PONY_RIDE 45min <= 60min flat)"
            - "Booking.${bk}.discount_cents == 4350 (round_half_up(0.15 * 29000), computed FIRST on raw subtotal)"
            - "Booking.${bk}.surcharge_cents == 740 (round_half_up(0.03 * (29000 - 4350)), computed SECOND on discounted subtotal)"
            - "Booking.${bk}.travel_fee_cents == 17000 (ZONE_C base 14000 + 1 trailer 3000, no overage at 90mi)"
            - "Booking.${bk}.quoted_total_cents == 45890 (NOT 45889 from reversed order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: Booking cycle, Permit cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_weather_hold_cycle
        grounds:
          - state_machines.Booking.CONFIRMED_to_WEATHER_HOLD
          - state_machines.Booking.WEATHER_HOLD_to_CONFIRMED
        distinguishing_aspect: |
          Booking exhibits a live cycle CONFIRMED -> WEATHER_HOLD -> CONFIRMED ->
          WEATHER_HOLD (the entity loops back to a prior state, twice), unlike the
          sibling instance which is the Permit's DENIED -> SUBMITTED re-application
          cycle on a different entity.
        test_recipe:
          setup:
            - "Sheep fixture CONFIRMED: weekday booking 2026-06-17 14:00-16:00, 20 guests / 0 children / 1 station, quoted 17270, deposit 5181 paid, CONFIRMED at clock 2026-05-10"
            - "Clock then advanced to 2026-06-16T10:00:00Z"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c6@x.com", full_name: "Cust Six", customer_type: "PRIVATE" }, as: Anonymous, captures: { c6: $.data.id } }
            - { call: "POST /petting-zoo/customers/${c6}/insurance-certificates", payload: { provider: "Acme Mutual", policy_number: "POL-6", coverage_amount_cents: 500000, expires_at: "2027-01-01T00:00:00Z" }, as: Customer, as_user_id: "${c6}", captures: { cert6: $.data.id } }
            - { call: "POST /petting-zoo/insurance-certificates/${cert6}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c6}", captures: { v6: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 3, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v6}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c6}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 5181, method: "CARD" }, as: Customer, as_user_id: "${c6}" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c6}" }
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-06-16T10:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/bookings/${bk}/weather-assessments", payload: { assessed_at: "2026-06-16T09:30:00Z", forecast_temp_f: 38, forecast_precip_pct: 90, wind_mph: 35, verdict: "MANDATORY_HOLD" }, as: Coordinator, captures: { wa1: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/weather-hold", payload: { weather_assessment_id: "${wa1}" }, as: Coordinator, captures: { s1: $.data.status } }
            - { call: "POST /petting-zoo/bookings/${bk}/release-weather-hold", payload: {}, as: Coordinator, captures: { s2: $.data.status } }
            - { call: "POST /petting-zoo/bookings/${bk}/weather-assessments", payload: { assessed_at: "2026-06-16T09:45:00Z", forecast_temp_f: 36, forecast_precip_pct: 95, wind_mph: 40, verdict: "MANDATORY_HOLD" }, as: Coordinator, captures: { wa2: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/weather-hold", payload: { weather_assessment_id: "${wa2}" }, as: Coordinator, captures: { s3: $.data.status } }
          assert:
            - "status sequence: CONFIRMED -> ${s1} == WEATHER_HOLD -> ${s2} == CONFIRMED -> ${s3} == WEATHER_HOLD (cycle traversed twice)"
            - "Booking.${bk}.payment_status remains DEPOSIT_PAID throughout the hold cycle"

      - name: permit_denial_resubmission_cycle
        grounds:
          - state_machines.Permit.DENIED_to_SUBMITTED
          - state_machines.Permit.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          Permit exhibits the re-application cycle SUBMITTED -> DENIED -> SUBMITTED
          -> ISSUED with denial_reason set on denial and cleared to null on
          resubmission — a cycle on the Permit entity, distinct from the sibling
          Booking weather-hold cycle.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; venue requires_animal_permit=true; booking 2026-06-06 14:00-16:00 (well past the 336h lead time)"
            - "ANIMAL_EXHIBITION permit created in DRAFT"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c7@x.com", full_name: "Cust Seven", customer_type: "PRIVATE" }, as: Anonymous, captures: { c7: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "County Fairground", address: "4 Fair Rd", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 15, max_guest_capacity: 300, requires_animal_permit: true, requires_handwash_stations: true }, as: Customer, as_user_id: "${c7}", captures: { v7: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v7}", start_time: "2026-06-06T14:00:00Z", end_time: "2026-06-06T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c7}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/permits", payload: { permit_type: "ANIMAL_EXHIBITION", jurisdiction: "County Fair Board" }, as: Coordinator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/permits/${p1}/submit", payload: {}, as: Coordinator, as_user_id: "coord-1", captures: { st1: $.data.status } }
            - { call: "POST /petting-zoo/permits/${p1}/decide", payload: { decision: "DENIED", denial_reason: "incomplete application" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { st2: $.data.status, dr2: $.data.denial_reason } }
            - { call: "POST /petting-zoo/permits/${p1}/submit", payload: {}, as: Coordinator, as_user_id: "coord-1", captures: { st3: $.data.status, dr3: $.data.denial_reason } }
            - { call: "POST /petting-zoo/permits/${p1}/decide", payload: { decision: "ISSUED" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { st4: $.data.status } }
          assert:
            - "${st1} == SUBMITTED and ${st2} == DENIED and ${dr2} == incomplete application"
            - "${st3} == SUBMITTED and ${dr3} == null (resubmission clears denial_reason)"
            - "${st4} == ISSUED — full cycle DRAFT -> SUBMITTED -> DENIED -> SUBMITTED -> ISSUED"
            - "Permit.${p1}.submitted_by_user_id == coord-1 and decided_by_user_id == officer-1"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth 3 and depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: health_fail_quarantine_cascade
        grounds:
          - state_machines.Animal.AVAILABLE_to_QUARANTINE
          - state_machines.Booking.CONFIRMED_to_CANCELLED_COMPLIANCE
          - state_machines.BookingAnimal.CONFIRMED_to_REMOVED
        distinguishing_aspect: |
          Depth-3 chain from trigger POST health-records (FAIL): Animal ->
          QUARANTINE causes BookingAnimal -> REMOVED (link 2), which itself causes
          the now animal-less CONFIRMED Booking -> CANCELLED_COMPLIANCE with
          FORFEIT + PENALTY ledger entries (link 3) — each link caused by the
          previous one, not fan-out from the original call; the sibling cascade
          originates from a different trigger (booking cancel).
        test_recipe:
          setup:
            - "Goat fixture CONFIRMED: weekday booking 2026-06-17 14:00-16:00, 20 guests / 0 children / 1 station, goat SMALL tier3 8000c CONFIRMED as the only roster animal, quoted 16240, deposit 4872 paid, CONFIRMED at clock 2026-05-10"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c8@x.com", full_name: "Cust Eight", customer_type: "PRIVATE" }, as: Anonymous, captures: { c8: $.data.id } }
            - { call: "POST /petting-zoo/customers/${c8}/insurance-certificates", payload: { provider: "Acme Mutual", policy_number: "POL-8", coverage_amount_cents: 500000, expires_at: "2027-01-01T00:00:00Z" }, as: Customer, as_user_id: "${c8}", captures: { cert8: $.data.id } }
            - { call: "POST /petting-zoo/insurance-certificates/${cert8}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c8}", captures: { v8: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v8}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c8}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 4872, method: "CARD" }, as: Customer, as_user_id: "${c8}" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c8}" }
          trigger:
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-06-10T09:00:00Z", result: "FAIL", valid_until: "2026-06-10T09:00:00Z" }, as: Veterinarian }
          assert:
            - "Animal.${a_goat}.status == QUARANTINE (link 1)"
            - "GET /petting-zoo/bookings/${bk}/animals shows BookingAnimal.${ba} status == REMOVED with removal_reason == QUARANTINE (link 2)"
            - "Booking.${bk}.status == CANCELLED_COMPLIANCE (link 3: last CONFIRMED animal removed)"
            - "Ledger for ${bk}: PAYMENT 4872, FORFEIT 4872, PENALTY 3248 (round_half_up(0.20 * 16240)); no REFUND entry"
            - "Booking.${bk}.payment_status == FORFEITED"

      - name: customer_cancel_staff_release_cascade
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED_CUSTOMER
          - state_machines.StaffAssignment.ASSIGNED_to_RELEASED
          - entities.Handler.fields.scheduled_minutes_total
        distinguishing_aspect: |
          Depth-2 chain from trigger POST cancel (CUSTOMER): Booking ->
          CANCELLED_CUSTOMER causes StaffAssignment -> RELEASED (link 1), which
