# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (breadth coverage)
# Pool Supply Distribution & Route Warehouse.
# Names unique across BOTH design files. Sections follow claim-extraction-guide.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: branch_create_defaults_applied
        claim_type: creation_defaults
        grounds: ["entities.Branch.fields.willcall_cutoff_minutes", "entities.Branch.fields.status"]
        distinguishing_aspect: "Creating a Branch without willcall_cutoff_minutes applies default 90 and status OPEN, posture NORMAL, seasonal_pool_units 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
          assert:
            - "Branch.willcall_cutoff_minutes == 90"
            - "Branch.status == OPEN and posture == NORMAL and seasonal_pool_units == 0"
            - "version == 1 and id is a bare UUID (no prefix)"

      - name: account_computed_tier_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Account.fields.tier"]
        distinguishing_aspect: "tier is computed; a client cannot set it at create — created account is always PRO with ytd_volume_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-1", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /pool-supply/accounts/${acct_id}"
              as: BranchManager
          assert:
            - "Account.tier == PRO and ytd_volume_cents == 0 and credit_hold == false and status == ACTIVE"

      - name: product_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pool-supply/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RESOURCE_NOT_FOUND with http 404"

      - name: order_line_immutable_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.OrderLine"]
        distinguishing_aspect: "OrderLine has common_fields: false — no PATCH endpoint exists for lines; lines change only via parent order transitions."
        test_recipe:
          setup: ["empty DB (no calls needed — surface-level claim)"]
          setup_api_calls: []
          trigger:
            - call: "GET /pool-supply/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/lines"
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "Unknown order id still routes through lines list: ${err} == ERR_RESOURCE_NOT_FOUND (no line-mutation endpoint exists in §1.5)"

      - name: stock_lot_hazmat_class_copied_and_available_computed
        claim_type: computed_fields
        grounds: ["entities.StockLot.fields.hazmat_storage_class", "entities.StockLot.fields.qty_available"]
        distinguishing_aspect: "Lot creation copies hazmat_storage_class from the product and initializes qty_available == qty_on_hand."
        test_recipe:
          setup: ["branch + CORROSIVE_8 chemical product exist"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ACID-4X1", product_family: "CHEMICAL", hazmat_class: "CORROSIVE_8", base_price_cents: 4000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 12 }
              as: WarehouseLead
              captures: { lot_id: $.data.id }
          assert:
            - "StockLot.${lot_id}.hazmat_storage_class == CORROSIVE_8"
            - "qty_available == 12 and qty_reserved_willcall == 0 and qty_reserved_route == 0"

      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List endpoint honors envelope: limit/offset with total_count and has_more; defaults limit=10."
        test_recipe:
          setup: ["branch, account, product, lot; 1 draft order"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-2", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [] }
              as: CounterRep
          trigger:
            - call: "GET /pool-supply/orders"
              payload: { branch_id: "${br_id}" }
              as: CounterRep
          assert:
            - "Response has meta.api_request_id and response_type == array"
            - "total_count == 1 and has_more == false with default limit 10"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_picked_loaded_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SalesOrder", "errors[ERR_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "Confirm on a PICKED_LOADED order → ERR_ORDER_NOT_DRAFT; no side effects fire (no double reservation)."
        test_recipe:
          setup: ["branch, account, PARTS product lot 10; order confirmed and marked loaded"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-3", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "HOSE-25", product_family: "PARTS", base_price_cents: 3000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 10 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/mark-loaded"
              payload: {}
              as: WarehouseLead
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_DRAFT"
            - "fulfillment_status stays PICKED_LOADED"

      - name: order_cancel_reverts_commitment_fulfilled_to_committed
        claim_type: side_effect_execution
        grounds: ["state_machines.SalesOrder.CONFIRMED_to_CANCELLED", "state_machines.SeasonalCommitment"]
        distinguishing_aspect: "Compensation: cancelling the order that filled a commitment reverts the commitment FULFILLED → COMMITTED and restores consumed_units."
        test_recipe:
          setup:
            - "clock 2026-01-10; branch; program OPEN (10% discount, pool 1000); commitment 5 units"
            - "product lot 100; WILL_CALL order qty 5 referencing commitment; confirmed (commitment FULFILLED)"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-4", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "TAB-3IN", product_family: "CHEMICAL", base_price_cents: 1000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 100 }
              as: WarehouseLead
            - call: "POST /pool-supply/seasonal-programs"
              payload: { branch_id: "${br_id}", program_name: "EB", order_window_start: "2026-01-01T00:00:00Z", order_window_end: "2026-02-15T00:00:00Z", ship_window_start: "2026-03-01T00:00:00Z", ship_window_end: "2026-05-31T00:00:00Z", early_buy_discount_pct: 10, pool_cap_units: 1000 }
              as: BranchManager
              captures: { sp_id: $.data.id }
            - call: "POST /pool-supply/seasonal-programs/${sp_id}/open"
              payload: {}
              as: BranchManager
              captures: { sp_v: $.data.version }
            - call: "POST /pool-supply/seasonal-commitments"
              payload: { program_id: "${sp_id}", account_id: "${acct_id}", committed_units: 5, expected_program_version: "${sp_v}" }
              as: BranchManager
              captures: { cmt_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-01-10T15:00:00Z", commitment_id: "${cmt_id}", lines: [ { product_id: "${prod_id}", qty: 5 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "GET /pool-supply/branches/${br_id}"
              as: BranchManager
              captures: { br_v2: $.data.version }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v2}" }
              as: CounterRep
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/cancel"
              payload: {}
              as: BranchManager
          assert:
            - "SeasonalCommitment.${cmt_id}.status == COMMITTED (reverted from FULFILLED)"
            - "SeasonalCommitment.${cmt_id}.consumed_units == 0"

      - name: backorder_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.BackorderRequest", "errors[ERR_BACKORDER_NOT_OPEN]"]
        distinguishing_aspect: "CANCELLED backorder rejects both allocate and cancel with ERR_BACKORDER_NOT_OPEN."
        test_recipe:
          setup: ["branch; account; product threshold high; lot 0; order qty 4 confirmed → BO OPEN; BO cancelled"]
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: false, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-5", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "SKIM-B", product_family: "PARTS", base_price_cents: 2000, shortage_freeze_threshold: 1000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 0 }
              as: WarehouseLead
              captures: { lot_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 4 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "GET /pool-supply/backorder-requests"
              payload: {}
              as: BranchManager
              captures: { bo_id: "$.data[0].id" }
            - call: "POST /pool-supply/backorder-requests/${bo_id}/cancel"
              payload: {}
              as: BranchManager
            - call: "GET /pool-supply/stock-lots/${lot_id}"
              as: WarehouseLead
              captures: { lot_v: $.data.version }
          trigger:
            - call: "POST /pool-supply/backorder-requests/${bo_id}/allocate"
              payload: { lot_id: "${lot_id}", expected_stock_lot_version: "${lot_v}" }
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BACKORDER_NOT_OPEN"

      - name: rma_receive_rejects_expired_chemical_since_request
        claim_type: precondition_enforcement
        grounds: ["state_machines.ReturnAuthorization.APPROVED_to_RECEIVED", "errors[ERR_RMA_LOT_EXPIRED_SINCE_REQUEST]"]
        distinguishing_aspect: "Chemical RMA approved while lot unexpired, but clock advanced past expiry before receive → ERR_RMA_LOT_EXPIRED_SINCE_REQUEST at RECEIVE."
        test_recipe:
          setup:
            - "clock 2026-08-01; branch certified; account; EXPIRY-tracked CHEMICAL product; lot expiry 2026-08-10, qty 5"
            - "order qty 1 confirmed→invoiced→loaded→paid→completed"
            - "RMA reason OVERSTOCK (chemical, unexpired) approved; clock advanced to 2026-08-11"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-6", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ALG-60", product_family: "CHEMICAL", base_price_cents: 5000, expiry_tracked: true }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "LX", qty_on_hand: 5, expiry_date: "2026-08-10" }
              as: WarehouseLead
              captures: { lot_id: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "POST /pool-supply/orders/${ord_id}/invoice"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/mark-loaded"
              payload: {}
              as: WarehouseLead
            - call: "POST /pool-supply/orders/${ord_id}/pay"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/orders/${ord_id}/complete"
              payload: {}
              as: CounterRep
            - call: "POST /pool-supply/return-authorizations"
              payload: { account_id: "${acct_id}", order_id: "${ord_id}", product_id: "${prod_id}", lot_id: "${lot_id}", qty: 1, reason: "OVERSTOCK" }
              as: BranchManager
              captures: { rma_id: $.data.id }
            - call: "POST /pool-supply/return-authorizations/${rma_id}/approve"
              payload: {}
              as: BranchManager
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /pool-supply/return-authorizations/${rma_id}/receive"
              payload: {}
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RMA_LOT_EXPIRED_SINCE_REQUEST"
            - "ReturnAuthorization.${rma_id}.status stays APPROVED; lot qty_on_hand unchanged (5)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: fefo_allocation_prefers_earliest_expiry
        claim_type: correct_result
        grounds: ["calculations.backorder_waterfall_allocation", "entities.OrderLine.fields.allocated_lot_id"]
        distinguishing_aspect: "FEFO: among two lots, the line allocates from the lot with earliest expiry_date even if it was created second; tie-break is created_at ASC."
        test_recipe:
          setup:
            - "branch certified; account; expiry-tracked chemical"
            - "lot L2 created FIRST expiry 2026-12-01; lot L1 created SECOND expiry 2026-09-01 — both qty 10"
            - "order qty 4 WILL_CALL"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-7", account_type: "DEALER" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ALG-40", product_family: "CHEMICAL", base_price_cents: 3500, expiry_tracked: true }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L-LATE", qty_on_hand: 10, expiry_date: "2026-12-01" }
              as: WarehouseLead
              captures: { lot_late: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L-EARLY", qty_on_hand: 10, expiry_date: "2026-09-01" }
              as: WarehouseLead
              captures: { lot_early: $.data.id }
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T13:00:00Z", lines: [ { product_id: "${prod_id}", qty: 4 } ] }
              as: CounterRep
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "GET /pool-supply/orders/${ord_id}/lines"
              as: CounterRep
              captures: { alloc_lot: "$.data[0].allocated_lot_id" }
          assert:
            - "${alloc_lot} == ${lot_early} (earliest expiry wins despite later creation)"
            - "StockLot.${lot_early}.qty_reserved_willcall == 4; StockLot.${lot_late}.qty_reserved_willcall == 0"

      - name: freight_hazmat_surcharge_and_shortfall_cap
        claim_type: constants_applied
        grounds: ["calculations.freight_charge"]
        distinguishing_aspect: "Hazmat ROUTE order under free-minimum: freight = 2500 base + 1800 hazmat + min(shortfall, 7500). Subtotal 30000 → freight 11800."
        test_recipe:
          setup:
            - "clock 2026-06-01; branch certified; account with hazmat license 2027-01-01"
            - "hazmat chemical base 30000, lot 5; ROUTE order qty 1 route_date 2026-06-10"
          setup_api_calls:
            - call: "POST /pool-supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /pool-supply/branches"
              payload: { branch_code: "PHX-12", hazmat_storage_certified: true, peak_season_start: "04-01", peak_season_end: "09-30" }
              as: BranchManager
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "POST /pool-supply/accounts"
              payload: { account_number: "DLR-8", account_type: "DEALER", hazmat_delivery_license_expiry: "2027-01-01" }
              as: BranchManager
              captures: { acct_id: $.data.id }
            - call: "POST /pool-supply/products"
              payload: { sku: "ACID-M", product_family: "CHEMICAL", hazmat_class: "CORROSIVE_8", base_price_cents: 30000 }
              as: BranchManager
              captures: { prod_id: $.data.id }
            - call: "POST /pool-supply/stock-lots"
              payload: { branch_id: "${br_id}", product_id: "${prod_id}", lot_code: "L1", qty_on_hand: 5 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "ROUTE_DELIVERY", route_date: "2026-06-10", lines: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: RouteDispatcher
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pool-supply/orders/${ord_id}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: RouteDispatcher
          assert:
            - "SalesOrder.${ord_id}.order_subtotal_cents == 30000"
            - "SalesOrder.${ord_id}.freight_charge_cents == 11800 (2500 + 1800 + min(20000, 7500))"
            - "invoiced_cents == 41800"

      - name: backorder_waterfall_priority_order_premier_first
        claim_type: correct_result
        grounds: ["calculations.backorder_waterfall_allocation"]
        distinguishing_aspect: "Waterfall rank: PREMIER account's backorder (rank 1) is fully granted before PRO (rank 3) even though PRO's backorder was created earlier; residual partial allocation leaves PRO ALLOCATED with qty_open 1."
        test_recipe:
          setup:
            - "branch; accounts PRO-acct and PREMIER-acct (PREMIER seeded via 5000000c invoiced order)"
            - "product lot starts 0; threshold high; PRO order qty 3 confirmed → BO_PRO; PREMIER order qty 2 confirmed → BO_PRE"
            - "replenish lot by 3 → sweep grants 2 to PREMIER (CLOSED) then 1 to PRO (ALLOCATED, qty_open 2 → wait: PRO qty_open 3, grant min(3, remaining 1) = 1 → ALLOCATED qty_open 2)"
          setup_api_calls:
            - call: "POST /pool-supply/branches"
