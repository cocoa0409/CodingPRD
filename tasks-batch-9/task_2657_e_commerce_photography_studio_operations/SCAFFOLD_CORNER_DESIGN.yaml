# =============================================================================
# 1.9 Scaffold Corner Design - ecommerce-photo-studio-ops (task 2657)
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# SCAFFOLD.yaml's 1.1-1.7 surface. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs that cite
# the covering difficulty instance by name.
# =============================================================================
scaffold_corner_design:

  # ========================================================= Table 1: entities
  - section: entities
    instances:
      - name: vendor_creation_echoes_input_and_zeroes_the_custody_ledgers
        claim_type: creation
        grounds:
          - entities.Vendor
          - endpoints[POST /studio/vendors]
        distinguishing_aspect: "A vendor created with all four inputs returns 201 with the inputs echoed and outstanding_sample_count, late_return_count and coordination_hold initialised to 0/0/false."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 21, contact_email: "samples@northline.example" }
              as: StudioAdmin
              captures: { v_id: $.data.id }
          assert:
            - "response status == 201"
            - "Vendor.${v_id}.name == \"Northline Apparel\""
            - "Vendor.${v_id}.vendor_code == \"NRTH\""
            - "Vendor.${v_id}.sample_sla_days == 21"
            - "Vendor.${v_id}.contact_email == \"samples@northline.example\""
            - "Vendor.${v_id}.outstanding_sample_count == 0"
            - "Vendor.${v_id}.late_return_count == 0"
            - "Vendor.${v_id}.coordination_hold == false"
            - "Vendor.${v_id}.version == 1"

      - name: style_retrieval_returns_the_stored_row_with_derived_counters
        claim_type: retrieval
        grounds:
          - entities.Style
          - endpoints[GET /studio/styles/{style_id}]
        distinguishing_aspect: "GET /studio/styles/{style_id} returns exactly the persisted style: style_number TOP1001, content_state NOT_STARTED, required_item_count 0, allocated_cost_cents 0, delivered_asset_count 0."
        test_recipe:
          setup:
            - "One vendor, one APPAREL_TOP asset profile and one style TOP1001 exist; nothing else has happened to the style."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", priority_tier: "A" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
          trigger:
            - call: "GET /studio/styles/${sty_id}"
              as: ContentOps
          assert:
            - "response status == 200"
            - "response data.id == ${sty_id}"
            - "response data.style_number == \"TOP1001\""
            - "response data.vendor_id == ${v_id}"
            - "response data.asset_profile_id == ${ap_id}"
            - "response data.priority_tier == \"A\""
            - "response data.content_state == \"NOT_STARTED\""
            - "response data.required_item_count == 0"
            - "response data.allocated_cost_cents == 0"
            - "response data.delivered_asset_count == 0"

      - name: style_listing_filters_by_vendor_and_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /studio/styles]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three styles on vendor A and one on vendor B, GET /studio/styles?vendor_id=A&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Two vendors NRTH and SOUT share one APPAREL_TOP profile; styles TOP1001, TOP1002, TOP1003 belong to NRTH and TOP2001 belongs to SOUT."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { vA_id: $.data.id }
            - call: "POST /studio/vendors"
              payload: { name: "Southgate Mills", vendor_code: "SOUT", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { vB_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${vA_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1002", category: "APPAREL_TOP", vendor_id: "${vA_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1003", category: "APPAREL_TOP", vendor_id: "${vA_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
            - call: "POST /studio/styles"
              payload: { style_number: "TOP2001", category: "APPAREL_TOP", vendor_id: "${vB_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
          trigger:
            - call: "GET /studio/styles?vendor_id=${vA_id}&limit=2&offset=0"
              as: ContentOps
            - call: "GET /studio/styles?vendor_id=${vA_id}&limit=2&offset=2"
              as: ContentOps
          assert:
            - "first page: response status == 200 and len(response data) == 2"
            - "first page: total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "second page: len(response data) == 1 and total_count == 3 and has_more == false"
            - "no row on either page has vendor_id == ${vB_id}"

      - name: style_lookup_with_unknown_id_returns_style_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STYLE_NOT_FOUND]
          - endpoints[GET /studio/styles/{style_id}]
        distinguishing_aspect: "A syntactically valid but unknown style id yields 404 ERR_STYLE_NOT_FOUND, not 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the clock; no style has ever been created."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "GET /studio/styles/00000000-0000-4000-8000-000000000000"
              as: ContentOps
          assert:
            - "response status == 404"
            - "response error_id == \"ERR_STYLE_NOT_FOUND\""

      - name: station_creation_missing_required_station_code_is_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /studio/stations]
          - validations[priority=4].ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required station_code from POST /studio/stations returns 400 ERR_INVALID_REQUEST and persists no Station row."
        test_recipe:
          setup:
            - "Clock pinned; no stations exist."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/stations"
              payload: { station_type: "MODEL", daily_capacity_minutes: 1440 }
              as: StudioAdmin
          assert:
            - "response status == 400"
            - "response error_id == \"ERR_INVALID_REQUEST\""
            - "GET /studio/stations/{any id} still finds nothing; no Station was created"

      - name: station_creation_applies_buffer_concurrency_and_calibration_defaults
        claim_type: defaults
        grounds:
          - entities.Station.fields.buffer_minutes
          - entities.Station.fields.max_concurrent_sessions
          - entities.Station.fields.calibrated_until
          - endpoints[POST /studio/stations]
        distinguishing_aspect: "Omitting buffer_minutes, max_concurrent_sessions and calibrated_until yields 0, 1 and null respectively, and committed_minutes_today starts at 0."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/stations"
              payload: { station_code: "MAN-1", station_type: "MANNEQUIN", daily_capacity_minutes: 600 }
              as: StudioAdmin
              captures: { st_id: $.data.id }
          assert:
            - "response status == 201"
            - "Station.${st_id}.buffer_minutes == 0"
            - "Station.${st_id}.max_concurrent_sessions == 1"
            - "Station.${st_id}.calibrated_until == null"
            - "Station.${st_id}.committed_minutes_today == 0"
            - "Station.${st_id}.daily_capacity_minutes == 600"

      - name: talent_requires_release_is_computed_from_type_and_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.TalentProfile.fields.requires_release
          - endpoints[POST /studio/talent-profiles]
        distinguishing_aspect: "requires_release is derived strictly from talent_type - true for a MODEL and false for a PHOTOGRAPHER - and a client-supplied requires_release value in the body never reaches the row."
        test_recipe:
          setup:
            - "Clock pinned; no talent profiles exist."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Ada Vell", talent_type: "MODEL", hourly_rate_cents: 25000, day_rate_cents: 150000, requires_release: false }
              as: StudioAdmin
              captures: { md_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
          assert:
            - "TalentProfile.${md_id}.requires_release == true (the false in the body is ignored)"
            - "TalentProfile.${ph_id}.requires_release == false"
            - "TalentProfile.${md_id}.booked_minutes_today == 0"
            - "TalentProfile.${ph_id}.minimum_call_hours == 4 and TalentProfile.${ph_id}.max_daily_minutes == 480"

      - name: sample_system_fields_are_server_owned_at_creation
        claim_type: system_fields
        grounds:
          - entities.Sample.fields.custody_state
          - entities.Sample.fields.match_state
          - entities.Sample.fields.received_at
          - endpoints[POST /studio/samples]
        distinguishing_aspect: "A freshly pre-advised sample has server-set custody_state EXPECTED, match_state UNMATCHED, matched_style_id null, received_at null, due_return_at null, return_days_late 0 and version 1, none of which are client inputs."
        test_recipe:
          setup:
            - "One vendor NRTH exists; the sample has only been pre-advised, never received."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id, smp_created: $.data.created_at }
          assert:
            - "response status == 201"
            - "Sample.${smp_id}.custody_state == \"EXPECTED\""
            - "Sample.${smp_id}.match_state == \"UNMATCHED\""
            - "Sample.${smp_id}.matched_style_id == null"
            - "Sample.${smp_id}.received_at == null"
            - "Sample.${smp_id}.due_return_at == null"
            - "Sample.${smp_id}.return_days_late == 0"
            - "Sample.${smp_id}.version == 1"
            - "${smp_created} == \"2026-08-03T08:00:00.000Z\""
            - "Vendor.${v_id}.outstanding_sample_count == 0 (pre-advice does not enter the ledger)"

      - name: station_creation_with_invalid_station_type_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Station.fields.station_type
          - validations[priority=5].ERR_INVALID_REQUEST
        distinguishing_aspect: "station_type outside {MODEL, MANNEQUIN, STILL_LIFE} - here TABLETOP - returns 400 ERR_INVALID_REQUEST before any uniqueness or business check runs."
        test_recipe:
          setup:
            - "Clock pinned; no stations exist."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/stations"
              payload: { station_code: "TAB-1", station_type: "TABLETOP", daily_capacity_minutes: 600 }
              as: StudioAdmin
          assert:
            - "response status == 400"
            - "response error_id == \"ERR_INVALID_REQUEST\""

      - name: asset_profile_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.AssetProfile
          - endpoints[GET /studio/asset-profiles/{profile_id}]
        distinguishing_aspect: "AssetProfile declares common_fields: false, so its GET response exposes category/required_angles/naming_pattern but no version, no updated_at and no mutation endpoint exists for it anywhere in 1.5."
        test_recipe:
          setup:
            - "One APPAREL_TOP asset profile exists."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT", "BACK"], required_detail_shots: 1, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "GET /studio/asset-profiles/${ap_id}"
              as: Producer
          assert:
            - "response status == 200"
            - "response data.category == \"APPAREL_TOP\""
            - "response data.required_angles == [\"FRONT\", \"BACK\"]"
            - "response data.naming_pattern == \"{style_number}_{angle_code}_{seq}\""
            - "response data has no version field and no updated_at field"
            - "1.5 declares no PATCH/PUT/DELETE for /studio/asset-profiles/{profile_id}"

      - name: style_creation_with_unknown_vendor_reference_is_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Style.fields.vendor_id
          - validations[priority=7].ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "A body FK that names no existing row - vendor_id pointing at an unused UUID - returns 404 ERR_REFERENCE_NOT_FOUND, distinct from the 400 raised for a malformed body."
        test_recipe:
          setup:
            - "One APPAREL_TOP asset profile exists; no vendor has ever been created."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "00000000-0000-4000-8000-0000000000ff", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
          assert:
            - "response status == 404"
            - "response error_id == \"ERR_REFERENCE_NOT_FOUND\""
            - "GET /studio/styles?limit=10&offset=0 returns total_count == 0"

      - name: junction_and_self_referential_edges_are_discoverable_by_fk_filtered_lists
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - endpoints[GET /studio/talent-bookings]
          - endpoints[GET /studio/styles]
          - entities.Style.fields.base_style_id
        distinguishing_aspect: "The graph topology is navigable without URL nesting: the TalentBooking junction is reachable by both session_id and talent_id filters, and the self-referential colorway edge is reachable by base_style_id - each returning exactly the one linked row."
        test_recipe:
          setup:
            - "Base style TOP1001 has one colorway child TOP1001-BLK created with base_style_id pointing at it."
            - "One MODEL session holds one HELD photographer booking for Pia Ren."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_base_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001-BLK", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", base_style_id: "${sty_base_id}", colorway_code: "BLK" }
              as: StudioAdmin
              captures: { sty_child_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk_id: $.data.id }
          trigger:
            - call: "GET /studio/talent-bookings?session_id=${ses_id}&limit=10&offset=0"
              as: Producer
            - call: "GET /studio/talent-bookings?talent_id=${ph_id}&limit=10&offset=0"
              as: Producer
            - call: "GET /studio/styles?base_style_id=${sty_base_id}&limit=10&offset=0"
              as: ContentOps
          assert:
            - "session-filtered bookings: total_count == 1 and data[0].id == ${bk_id}"
            - "talent-filtered bookings: total_count == 1 and data[0].id == ${bk_id}"
            - "base-style-filtered styles: total_count == 1 and data[0].id == ${sty_child_id}"
            - "base-style-filtered styles: data[0].colorway_code == \"BLK\""

  # =================================================== Table 2: state machines
  - section: state_machines
    instances:
      - name: unlock_returns_a_locked_session_to_booked
        claim_type: valid_transition
        grounds:
          - state_machines.ShootSession.LOCKED_to_BOOKED
          - endpoints[POST /studio/shoot-sessions/{session_id}/unlock]
        distinguishing_aspect: "A LOCKED session that is unlocked returns to BOOKED and its version increments, while the item stays ASSIGNED and the station's committed minutes are untouched."
        test_recipe:
          setup:
            - "Style TOP1001 with a MATCHED sample IN_STUDIO and one required ON_MODEL item assigned to a 09:00-13:00 MODEL session, which is LOCKED."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/match"
