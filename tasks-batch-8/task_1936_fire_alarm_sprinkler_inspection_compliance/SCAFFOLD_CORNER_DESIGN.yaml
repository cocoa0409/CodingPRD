              payload: { contractor_id: "${con_id}", address_line: "1 Occ Ave", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v1: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v1}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan1: $.data.id }
          trigger:
