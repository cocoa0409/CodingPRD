        distinguishing_aspect: "Publishing a DRAFT disclosure at logical clock 2026-08-05T12:00:00Z sets status PUBLISHED, published_at 2026-08-05T12:00:00.000Z and version 2 — the timestamp comes from the clock, not from creation time."
