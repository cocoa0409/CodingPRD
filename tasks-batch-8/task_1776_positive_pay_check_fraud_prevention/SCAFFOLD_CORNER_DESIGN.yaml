            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Vie", user_role: "VIEWER" }, as: BankTreasuryManager, captures: { vw: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerViewer, as_user_id: "${vw}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_FOR_ROLE (403)"]

      - name: cross_enrollment_decision_denied
        claim_type: role_denial
        grounds: [roles, "validations[priority=3]"]
        distinguishing_aspect: "A CustomerManager of enrollment A attempting to decision an exception of enrollment B fails ownership scoping even though the role itself is permitted."
        test_recipe:
          setup: ["Two ACTIVE REVERSE-tier enrollments; manager user in A; OPEN exception in B"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OwnA", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enrA: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enrA}", display_name: "MgrA", user_role: "MANAGER" }, as: BankTreasuryManager, captures: { mgrA: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enrA}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sessA: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sessA}/complete", payload: { attendee_user_ids: ["${mgrA}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enrA}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/enrollments", payload: { business_name: "OwnB", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enrB: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enrB}", account_number: "850002" }, as: BankTreasuryManager, captures: { acctB: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enrB}", display_name: "AdminB", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { admB: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enrB}", trainer_id: "tr-2", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sessB: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sessB}/complete", payload: { attendee_user_ids: ["${admB}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enrB}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acctB}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { exB: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${exB}/decision", payload: { decision: "PAY" }, as: CustomerManager, as_user_id: "${mgrA}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_CROSS_ENROLLMENT_ACCESS (403)"]

      - name: admin_role_mismatch_decision_forbidden
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Claiming CustomerDecisionMaker while the EnrollmentUser record says ADMIN is rejected — the claimed role must match the persisted user_role."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment with an ADMIN user and one OPEN exception"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "MisCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "850003" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_FOR_ROLE (403): user_role ADMIN cannot claim CustomerDecisionMaker"]

      - name: bankops_cannot_create_enrollment
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Enrollment creation is exclusive to BankTreasuryManager."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /treasury/enrollments", payload: { business_name: "Nope", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankOps, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_FOR_ROLE (403)"]

      - name: waiver_authority_cap_boundary
        claim_type: role_denial
        grounds: ["validations[priority=10]", "errors[ERR_WAIVER_EXCEEDS_AUTHORITY]", state_machines.FeeLedgerEntry.BILLED_to_WAIVED]
        distinguishing_aspect: "BankOps may waive entries of amount_cents <= 1000; the 4600-cent MINIMUM_TOPUP exceeds the cap and is denied for BankOps (422) while BankTreasuryManager waives it."
        test_recipe:
          setup:
            - "REVERSE-tier enrollment with 2 August exceptions (provisional 400); period 2026-08 billed -> MINIMUM_TOPUP entry of 4600 (5000 - 400), status BILLED"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "CapWCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "850004" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "2", amount_cents: 100, payee_name_raw: "B", channel: "TELLER" }, as: BankOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "MONTHLY_BILLING", enrollment_id: "${enr}", period: "2026-08" }, as: BankOps, captures: { top: $.data.minimum_topup_cents } }
            - { call: "GET /treasury/fee-entries", payload: { enrollment_id: "${enr}", fee_type: "MINIMUM_TOPUP" }, as: BankOps, captures: { tfe: "$.data[0].id" } }
          trigger:
            - { call: "POST /treasury/fee-entries/${tfe}/waive", payload: { reason: "ops-over-cap" }, as: BankOps, captures: { err: $.data.error_id } }
            - { call: "POST /treasury/fee-entries/${tfe}/waive", payload: { reason: "manager-override" }, as: BankTreasuryManager, captures: { st: $.data.status } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { wv: $.data.waived_cents, net: $.data.net_due_cents } }
          assert:
            - "top == 4600 (monthly minimum 5000 - 400 provisional)"
            - "BankOps on a 4600-cent entry: err == ERR_WAIVER_EXCEEDS_AUTHORITY (422)"
            - "BankTreasuryManager: st == WAIVED"
            - "Statement after waiver: wv == 4600 and net == 400 (only the two billed exception fees remain)"
      - name: sod_upload_decision_conflict
        claim_type: segregation_of_duties
