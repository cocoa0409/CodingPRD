# =============================================================================
# Task 1904 — Hospital Emergency Preparedness & Surge Plan
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1904. Hospital Emergency Preparedness & Surge Plan (hospital emergency management): hazard vulnerability analysis & plan update cycle, exercise/drill schedule & after-action improvement, incident command activation & role assignment, surge capacity tiering & staffing call-back, supply/PPE cache & burn-rate calculation, patient tracking & family reunification, alternate care site & evacuation planning, coalition coordination & regulatory reporting

domain_name: hospital-emergency-preparedness-surge
api_prefix: /emergency

complexity_profile:
  primary_archetype: posture_driven_gating   # IncidentEvent ACTIVATED posture gates patients, callbacks, ACS commits/activation, incident-linked stock issues
  secondary_archetype: compliance_audit      # plan update cycle, AAR segregation of duties, regulatory filing deadlines with lateness tracking
  complexity_layers:
    - optimistic_concurrency                 # OCC on IncidentEvent.version for command role (re)assignment
    - cascading_side_effects                 # incident/ACS demobilize → capacity → tier → burn-rate recompute chains
    - rate_threshold_triggers                # surge tier boundaries, days-of-supply reorder threshold
    - selector_policy                        # staffing call-back auto-selection with ranking + tie-break
  entity_topology: flat                      # peer entities joined by FK fields in request bodies; no nested creation URLs
  state_machine_shape: cyclic                # IncidentEvent ACTIVATED↔DEACTIVATED re-activation loop; AlternateCareSite STANDBY→COMMITTED→ACTIVATED→DEMOBILIZED→COMMITTED loop; PlanRevision reject revert loop; CallBackRequest fork
  relationship_patterns:
    - one_to_many                            # IncidentEvent → CallBackRequest / PatientTrackRecord / CommandRoleAssignment
    - self_referential                       # PlanRevision.supersedes_revision_id
    - polymorphic                            # AfterActionReport.subject_id → ExerciseEvent | IncidentEvent
    - cross_aggregate                        # ExerciseEvent → PlanRevision; PatientTrackRecord → AlternateCareSite; SupplyItem burn ← IncidentEvent tier
  role_model: segregation_of_duties          # creator of PlanRevision / AfterActionReport / ExternalReport cannot approve/submit it
  consistency_model: immediate               # all derived fields recomputed synchronously; read-your-writes

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: badge_number, type: string, source: input, description: "Unique hospital badge number", constraints: "unique across all StaffMember rows" }
      - { name: department, type: enum, source: input, description: "Home department", constraints: "EMERGENCY | ICU | SURGERY | NURSING | PHARMACY | LOGISTICS | ADMINISTRATION" }
      - { name: role_qualifications, type: array, source: input, description: "Command roles this staff member is qualified to hold; items from command_role enum: INCIDENT_COMMANDER | PLANNING_CHIEF | LOGISTICS_CHIEF | PUBLIC_INFORMATION_OFFICER | LIAISON_OFFICER | SAFETY_OFFICER | MEDICAL_BRANCH_DIRECTOR" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Employment active flag; inactive staff are excluded from call-back selection" }
      - { name: callback_eligible, type: boolean, source: input, default: false, description: "Whether the staff member may receive surge call-back requests" }
      - { name: callback_seniority_score, type: integer, source: input, default: 0, description: "Call-back ranking score; higher is called earlier" }

  - name: HazardAssessment
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: string, source: input, description: "HVA cycle label, e.g. FY2026" }
      - { name: scoring_model, type: enum, source: input, description: "Risk scoring variant applied to every entry", constraints: "TWO_FACTOR | THREE_FACTOR_MITIGATION" }
      - { name: hazard_entries, type: array, source: input, default: [], description: "Embedded hazard rows; each item: { entry_key: string, hazard_name: string, category: NATURAL|TECHNOLOGICAL|HUMAN|HAZMAT, probability: int 0..3, severity: int 0..3, preparedness: int 0..3, risk_score: computed int }. Client-supplied risk_score is ignored; server computes it from scoring_model on every write." }
      - { name: max_risk_score, type: integer, source: computed, description: "max(risk_score) over hazard_entries; 0 when empty" }
      - { name: plan_review_triggered, type: boolean, source: computed, description: "Set at finalize: max_risk_score >= PLAN_REVIEW_TRIGGER_SCORE (6)" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED", constraints: "DRAFT | FINALIZED" }

  - name: PlanRevision
    parent: null
    common_fields: true
    fields:
      - { name: revision_label, type: string, source: input, description: "Human label, e.g. EOP-2026-B" }
      - { name: change_summary, type: string, source: input, description: "Summary of changes in this revision" }
      - { name: effective_date, type: datetime, source: input, description: "Date the revision takes effect once approved" }
      - { name: supersedes_revision_id, type: string, source: input, description: "FK -> PlanRevision.id; the currently-approved revision this draft supersedes. Optional; when present the target must be APPROVED.", constraints: "optional; self-referential" }
      - { name: source_hva_id, type: string, source: input, description: "FK -> HazardAssessment.id; the HVA cycle that motivated this revision", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT → IN_REVIEW → APPROVED → SUPERSEDED; IN_REVIEW → DRAFT on reject", constraints: "DRAFT | IN_REVIEW | APPROVED | SUPERSEDED" }
      - { name: created_by_id, type: string, source: system, description: "X-User-ID of the creator (segregation of duties: creator cannot approve)" }
      - { name: approved_by_id, type: string, source: system, description: "X-User-ID of approver; null until approved" }
      - { name: approved_at, type: datetime, source: system, description: "Approval timestamp; null until approved" }

  - name: ExerciseEvent
    parent: null
    common_fields: true
    fields:
      - { name: exercise_name, type: string, source: input, description: "Drill/exercise name" }
      - { name: exercise_type, type: enum, source: input, description: "Exercise format", constraints: "TABLETOP | FUNCTIONAL | FULL_SCALE" }
      - { name: scenario_category, type: enum, source: input, description: "Hazard category being exercised", constraints: "NATURAL | TECHNOLOGICAL | HUMAN | HAZMAT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled end (exclusive); must be strictly after scheduled_start" }
      - { name: plan_revision_id, type: string, source: input, description: "FK -> PlanRevision.id; plan version under test. Must exist at creation; must be APPROVED at start." }
      - { name: status, type: enum, source: system, description: "SCHEDULED → IN_PROGRESS → COMPLETED; SCHEDULED → CANCELLED", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: started_at, type: datetime, source: system, description: "Actual start timestamp; null until started" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; null until completed" }

  - name: AfterActionReport
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "Which subject this AAR covers", constraints: "EXERCISE | INCIDENT" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic subject reference: ExerciseEvent.id when subject_type=EXERCISE, IncidentEvent.id when subject_type=INCIDENT. Subject must be COMPLETED (exercise) or DEACTIVATED (incident). At most one AAR per subject." }
      - { name: summary, type: string, source: input, description: "Narrative summary of findings" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED", constraints: "DRAFT | SUBMITTED | APPROVED" }
      - { name: created_by_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties: creator cannot approve)" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp; null until submitted" }
      - { name: approved_by_id, type: string, source: system, description: "X-User-ID of approver; null until approved" }
      - { name: approved_at, type: datetime, source: system, description: "Approval timestamp; null until approved" }

  - name: ImprovementTask
    parent: null
    common_fields: true
    fields:
      - { name: after_action_report_id, type: string, source: input, description: "FK -> AfterActionReport.id; owning AAR. Tasks may be created only while the AAR is DRAFT or SUBMITTED." }
      - { name: description, type: string, source: input, description: "Corrective action description" }
      - { name: priority, type: enum, source: input, description: "Task priority", constraints: "HIGH | MEDIUM | LOW" }
      - { name: due_date, type: datetime, source: input, description: "Completion deadline; system marks task OVERDUE when clock passes it" }
      - { name: assigned_department, type: enum, source: input, description: "Responsible department", constraints: "EMERGENCY | ICU | SURGERY | NURSING | PHARMACY | LOGISTICS | ADMINISTRATION" }
      - { name: status, type: enum, source: system, description: "OPEN → IN_PROGRESS → VERIFIED_COMPLETE; OPEN/IN_PROGRESS → OVERDUE (system sweep); OVERDUE → IN_PROGRESS (resume)", constraints: "OPEN | IN_PROGRESS | OVERDUE | VERIFIED_COMPLETE" }

  - name: IncidentEvent
    parent: null
    common_fields: true
    fields:
      - { name: incident_name, type: string, source: input, description: "Incident name" }
      - { name: incident_type, type: enum, source: input, description: "Incident hazard type", constraints: "NATURAL | TECHNOLOGICAL | HUMAN | HAZMAT | INFECTIOUS" }
      - { name: declared_at, type: datetime, source: input, description: "When the incident was declared in the field (informational)" }
      - { name: status, type: enum, source: system, description: "ACTIVATED → DEACTIVATED → ACTIVATED (re-activation allowed). At most one incident ACTIVATED at any time.", constraints: "ACTIVATED | DEACTIVATED" }
      - { name: activation_count, type: integer, source: computed, description: "Number of times this incident has entered ACTIVATED (1 at creation, +1 per reactivation)" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of most recent activation" }
      - { name: deactivated_at, type: datetime, source: system, description: "Timestamp of most recent demobilization; null while first activation is ongoing" }
      - { name: staffed_bed_count, type: integer, source: system, description: "Staffed bed baseline from latest surge assessment; null until assessed" }
      - { name: projected_census, type: integer, source: system, description: "Projected patient census from latest surge assessment; null until assessed" }
      - { name: licensed_surge_capacity, type: integer, source: computed, description: "Regulatory-reporting capacity variant: staffed_bed_count only" }
      - { name: operational_surge_capacity, type: integer, source: computed, description: "Operational-planning capacity variant: staffed_bed_count + bed_capacity of every AlternateCareSite with status ACTIVATED and activated_incident_id == this incident" }
      - { name: current_surge_tier, type: enum, source: computed, description: "GREEN | YELLOW | ORANGE | RED from occupancy ratio vs operational_surge_capacity; null until first assessment. Stored and re-derived on assessment and on capacity-affecting cascades.", constraints: "GREEN | YELLOW | ORANGE | RED | null" }
      - { name: committed_staff_count, type: integer, source: computed, description: "Count of CallBackRequest rows for this incident with status ACCEPTED" }

  - name: CommandRoleAssignment
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; incident must be ACTIVATED" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; assignee" }
      - { name: command_role, type: enum, source: input, description: "ICS command role being filled", constraints: "INCIDENT_COMMANDER | PLANNING_CHIEF | LOGISTICS_CHIEF | PUBLIC_INFORMATION_OFFICER | LIAISON_OFFICER | SAFETY_OFFICER | MEDICAL_BRANCH_DIRECTOR" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RELIEVED (auto when a newer assignment for the same incident+command_role is created)", constraints: "ACTIVE | RELIEVED" }
      - { name: assigned_at, type: datetime, source: system, description: "Assignment timestamp" }

  - name: CallBackRequest
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; incident must be ACTIVATED" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; explicit recipient, or server-selected in auto-select mode" }
      - { name: response_window_hours, type: integer, source: input, default: 2, description: "Hours the staff member has to respond before the request expires" }
      - { name: status, type: enum, source: system, description: "PENDING → ACCEPTED | DECLINED | EXPIRED | CANCELLED; ACCEPTED → CANCELLED | COMPLETED", constraints: "PENDING | ACCEPTED | DECLINED | EXPIRED | CANCELLED | COMPLETED" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + response_window_hours; system marks EXPIRED when clock passes it" }
      - { name: responded_at, type: datetime, source: system, description: "Response timestamp; null while PENDING" }

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - { name: item_name, type: string, source: input, description: "Supply/PPE item name" }
      - { name: category, type: enum, source: input, description: "Supply category", constraints: "PPE | MEDICATION | OXYGEN | OTHER_SUPPLY" }
      - { name: unit, type: string, source: input, description: "Unit of measure, e.g. box, each, case" }
      - { name: reorder_min_days, type: integer, source: input, description: "Minimum days-of-supply floor; item is below reorder level when days_of_supply < reorder_min_days (strict)" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Ledger-derived stock: 0 at creation; RECEIVE +q, ISSUE -q, RETURN +q, ADJUST sets absolute q (reset). Recomputed synchronously on every StockTransaction." }
      - { name: observed_daily_burn_rate, type: number, source: computed, description: "Chronological variant: (ISSUE qty − RETURN qty) with occurred_at in [now−168h, now) ÷ 7, round_half_up 4dp" }
      - { name: projected_daily_burn_rate, type: number, source: computed, description: "Forward-looking variant: round_half_up(observed_daily_burn_rate × surge_multiplier, 4dp); surge_multiplier from the ACTIVATED incident's current_surge_tier" }
      - { name: days_of_supply, type: integer, source: computed, description: "floor(quantity_on_hand / projected_daily_burn_rate); null when projected rate is 0" }
      - { name: below_reorder_level, type: boolean, source: computed, description: "days_of_supply < reorder_min_days; false when days_of_supply is null" }

  - name: StockTransaction
    parent: null
    common_fields: false  # immutable append-only ledger: id + created_at only
    fields:
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id; item being transacted" }
      - { name: transaction_type, type: enum, source: input, description: "Ledger entry type", constraints: "RECEIVE | ISSUE | RETURN | ADJUST" }
      - { name: quantity, type: integer, source: input, description: "Units moved; must be > 0. ADJUST sets quantity_on_hand to this absolute value." }
      - { name: occurred_at, type: datetime, source: input, description: "Business timestamp used for burn-rate windows; must not be after the current clock time (backdating allowed)" }
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; optional incident linkage. When present, the incident must be ACTIVATED.", constraints: "optional" }
      - { name: note, type: string, source: input, description: "Free-text note", constraints: "optional" }

  - name: AlternateCareSite
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Alternate care site name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: bed_capacity, type: integer, source: input, description: "Total beds available when activated; must be > 0" }
      - { name: status, type: enum, source: system, description: "STANDBY → COMMITTED → ACTIVATED → DEMOBILIZED → COMMITTED (re-commitment loop)", constraints: "STANDBY | COMMITTED | ACTIVATED | DEMOBILIZED" }
      - { name: commitments, type: array, source: system, description: "Reserved activation windows; each item: { incident_id: string, window_start: datetime, window_end: datetime }. Appended by the commit action after the buffered-overlap check." }
      - { name: activated_incident_id, type: string, source: system, description: "FK -> IncidentEvent.id; incident this site currently serves. Set at activation from the containing commitment; null unless ACTIVATED.", constraints: "nullable" }
      - { name: current_census, type: integer, source: computed, description: "Count of PatientTrackRecord rows with transfer_site_id == this site and status == TRANSFERRED" }

  - name: PatientTrackRecord
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; incident must be ACTIVATED at creation" }
      - { name: patient_ref, type: string, source: input, description: "De-identified patient reference; unique per incident" }
      - { name: triage_category, type: enum, source: input, description: "START triage category", constraints: "IMMEDIATE | DELAYED | MINOR | EXPECTANT" }
      - { name: arrival_at, type: datetime, source: input, description: "Arrival timestamp" }
      - { name: status, type: enum, source: system, description: "TRACKED → TRANSFERRED → DISCHARGED; TRACKED → DISCHARGED", constraints: "TRACKED | TRANSFERRED | DISCHARGED" }
      - { name: transfer_site_id, type: string, source: system, description: "FK -> AlternateCareSite.id; set on transfer; null otherwise", constraints: "nullable" }
      - { name: transferred_at, type: datetime, source: system, description: "Transfer timestamp; null until transferred" }
      - { name: discharged_at, type: datetime, source: system, description: "Discharge timestamp; null until discharged" }
      - { name: reunified, type: boolean, source: computed, description: "True once a linked FamilyInquiry reaches REUNITED; false otherwise" }

  - name: FamilyInquiry
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; incident must be ACTIVATED at creation" }
      - { name: inquirer_name, type: string, source: input, description: "Name of the family member calling" }
      - { name: inquirer_phone, type: string, source: input, description: "Callback phone number" }
      - { name: sought_patient_ref, type: string, source: input, description: "Patient reference the family is asking about" }
      - { name: status, type: enum, source: system, description: "OPEN → MATCHED → REUNITED; OPEN → CLOSED_NO_MATCH", constraints: "OPEN | MATCHED | REUNITED | CLOSED_NO_MATCH" }
      - { name: matched_patient_record_id, type: string, source: system, description: "FK -> PatientTrackRecord.id; set by the match action; null until matched", constraints: "nullable" }
      - { name: matched_at, type: datetime, source: system, description: "Match timestamp; null until matched" }
      - { name: reunited_at, type: datetime, source: system, description: "Reunification timestamp; null until reunited" }

  - name: ExternalReport
    parent: null
    common_fields: true
    fields:
      - { name: audience, type: enum, source: input, description: "External recipient", constraints: "REGIONAL_COALITION | STATE_DOH | CMS | LOCAL_EMA" }
      - { name: report_type, type: enum, source: input, description: "Filing type; drives the due_at offset", constraints: "SITREP | SURGE_CAPACITY | AAR_SUMMARY | RESOURCE_REQUEST" }
      - { name: incident_id, type: string, source: input, description: "FK -> IncidentEvent.id; related incident", constraints: "optional" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end; due_at = period_end + type offset" }
      - { name: body_summary, type: string, source: input, description: "Report body summary" }
      - { name: due_at, type: datetime, source: computed, description: "period_end + 24h (SITREP, RESOURCE_REQUEST) | +72h (SURGE_CAPACITY) | +720h (AAR_SUMMARY)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED (immutable after submission)", constraints: "DRAFT | SUBMITTED" }
      - { name: created_by_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties: creator cannot submit)" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp; null until submitted" }
      - { name: submitted_late, type: boolean, source: computed, description: "submitted_at > due_at; null until submitted" }
      - { name: hours_late, type: number, source: computed, description: "round_half_up(max(0, submitted_at − due_at in seconds)/3600, 2dp); null until submitted" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HazardAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST /emergency/hazard-assessments/{id}/finalize
        actor: EmergencyManager
        preconditions:
          - "hazard_entries must contain at least 1 entry (ERR_HVA_NO_ENTRIES)"
        side_effects:
          - "Every entry's risk_score recomputed per hva_risk_score using this assessment's scoring_model; max_risk_score recomputed"
          - "plan_review_triggered := (max_risk_score >= PLAN_REVIEW_TRIGGER_SCORE)"
          - "hazard_entries frozen; further PATCH rejected"
        note: "Entries are editable via PATCH only while DRAFT."

  - entity: PlanRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: POST /emergency/plan-revisions/{id}/submit-review
        actor: EmergencyManager
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: POST /emergency/plan-revisions/{id}/approve
        actor: HospitalAdministrator
        preconditions:
          - "Segregation of duties: X-User-ID != created_by_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No other PlanRevision is APPROVED, except the one referenced by supersedes_revision_id (ERR_OTHER_PLAN_APPROVED)"
        side_effects:
          - "The revision named by supersedes_revision_id (if any) transitions APPROVED → SUPERSEDED"
          - "approved_by_id := X-User-ID; approved_at := now"
        note: "Invariant: at most one PlanRevision is APPROVED at any time."
      - from: IN_REVIEW
        to: DRAFT
        trigger: POST /emergency/plan-revisions/{id}/reject
        actor: HospitalAdministrator
        preconditions: []
        side_effects: []
        note: "Revert loop: a rejected revision returns to DRAFT and may be resubmitted."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (side effect of a successor revision's approve transition)"
        actor: system
        preconditions:
          - "A PlanRevision whose supersedes_revision_id == this revision is being approved"
        side_effects: []

  - entity: ExerciseEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /emergency/exercises/{id}/start
        actor: EmergencyManager
        preconditions:
          - "plan_revision_id references a PlanRevision with status APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "started_at := now"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /emergency/exercises/{id}/complete
        actor: EmergencyManager
        preconditions: []
        side_effects:
          - "completed_at := now"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /emergency/exercises/{id}/cancel
        actor: EmergencyManager
        preconditions: []
        side_effects: []
        note: "Cancelling an IN_PROGRESS exercise is rejected (ERR_INVALID_STATE)."

  - entity: AfterActionReport
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /emergency/after-action-reports/{id}/submit
        actor: EmergencyManager | IncidentCommander
        preconditions: []
        side_effects:
          - "submitted_at := now"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /emergency/after-action-reports/{id}/approve
        actor: HospitalAdministrator
        preconditions:
          - "Segregation of duties: X-User-ID != created_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_id := X-User-ID; approved_at := now"

  - entity: ImprovementTask
    initial_state: OPEN
    terminal_states: [VERIFIED_COMPLETE]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: PATCH /emergency/improvement-tasks/{id} (target_status=IN_PROGRESS)
        actor: EmergencyManager
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: PATCH /emergency/improvement-tasks/{id} (target_status=IN_PROGRESS)
        actor: EmergencyManager
        preconditions: []
        side_effects: []
        note: "Resuming an overdue task is allowed; the task keeps its original due_date."
      - from: IN_PROGRESS
        to: VERIFIED_COMPLETE
        trigger: PATCH /emergency/improvement-tasks/{id} (target_status=VERIFIED_COMPLETE)
        actor: EmergencyManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: OVERDUE
        trigger: "system (clock sweep on POST /emergency/_clock/set_current_utc)"
        actor: system
        preconditions:
          - "new clock time > due_date (strict; a task whose due_date equals the new time is NOT overdue)"
        side_effects: []
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (clock sweep on POST /emergency/_clock/set_current_utc)"
        actor: system
        preconditions:
          - "new clock time > due_date (strict)"
        side_effects: []

  - entity: IncidentEvent
    initial_state: ACTIVATED
    terminal_states: []
    transitions:
      - from: ACTIVATED
        to: DEACTIVATED
        trigger: POST /emergency/incidents/{id}/demobilize
        actor: IncidentCommander
        preconditions:
          - "No PatientTrackRecord for this incident has status TRACKED (ERR_PATIENTS_STILL_TRACKED)"
          - "No PatientTrackRecord has status TRANSFERRED with transfer_site_id referencing a site whose activated_incident_id == this incident (ERR_PATIENTS_STILL_ON_SITE)"
        side_effects:
          - "Step 1: every CallBackRequest for this incident in PENDING → EXPIRED; every one in ACCEPTED → COMPLETED (committed_staff_count rederived)"
          - "Step 2: every AlternateCareSite with status ACTIVATED and activated_incident_id == this incident → DEMOBILIZED; each such site transition itself triggers: (a) this incident's operational_surge_capacity recomputed without that site's beds, (b) current_surge_tier re-derived from the new capacity, (c) every SupplyItem's projected_daily_burn_rate / days_of_supply / below_reorder_level recomputed from the new surge multiplier context"
          - "Step 3: status := DEACTIVATED; deactivated_at := now"
          - "Step 4: with no incident ACTIVATED, surge multiplier falls back to 1.0; every SupplyItem's projected_daily_burn_rate recomputed"
        note: "Cyclic machine: a DEACTIVATED incident may be reactivated (e.g., a second surge wave)."
      - from: DEACTIVATED
        to: ACTIVATED
        trigger: POST /emergency/incidents/{id}/reactivate
        actor: IncidentCommander
        preconditions:
          - "No other IncidentEvent has status ACTIVATED (ERR_INCIDENT_ALREADY_ACTIVE)"
        side_effects:
          - "activation_count += 1; activated_at := now"
          - "Every SupplyItem's projected_daily_burn_rate recomputed using this incident's retained current_surge_tier (multiplier resumes; 1.0 if tier is null)"

  - entity: CommandRoleAssignment
    initial_state: ACTIVE
    terminal_states: [RELIEVED]
    transitions:
      - from: ACTIVE
        to: RELIEVED
        trigger: "system (side effect of POST /emergency/command-assignments creating a newer assignment for the same incident_id + command_role)"
        actor: system
        preconditions:
          - "A new CommandRoleAssignment for the same (incident_id, command_role) is being created"
        side_effects: []

  - entity: CallBackRequest
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED, CANCELLED, COMPLETED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: POST /emergency/callback-requests/{id}/respond (outcome=ACCEPT)
        actor: OnCallStaff
        preconditions:
          - "X-User-ID == this request's staff_member_id (ERR_NOT_CALLBACK_OWNER)"
        side_effects:
          - "responded_at := now"
          - "IncidentEvent.committed_staff_count for incident_id increases by 1 (rederived)"
      - from: PENDING
        to: DECLINED
        trigger: POST /emergency/callback-requests/{id}/respond (outcome=DECLINE)
        actor: OnCallStaff
        preconditions:
          - "X-User-ID == this request's staff_member_id (ERR_NOT_CALLBACK_OWNER)"
        side_effects:
          - "responded_at := now; committed_staff_count unchanged"
      - from: PENDING
        to: EXPIRED
        trigger: "system (clock sweep on POST /emergency/_clock/set_current_utc, or cascade of incident demobilize)"
        actor: system
        preconditions:
          - "Clock path: new clock time > expires_at (strict)"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: POST /emergency/callback-requests/{id}/cancel
        actor: PlanningChief
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /emergency/callback-requests/{id}/cancel
        actor: PlanningChief
        preconditions: []
        side_effects:
          - "Compensation: IncidentEvent.committed_staff_count for incident_id decreases by 1 (rederived)"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (cascade of incident demobilize — duty tour ends)"
        actor: system
        preconditions: []
        side_effects:
          - "IncidentEvent.committed_staff_count rederived (drops to 0 as all ACCEPTED requests complete)"

  - entity: AlternateCareSite
    initial_state: STANDBY
    terminal_states: []
    transitions:
      - from: STANDBY
        to: COMMITTED
        trigger: POST /emergency/alternate-care-sites/{id}/commit (first commitment)
        actor: IncidentCommander
        preconditions:
          - "The referenced incident has status ACTIVATED (ERR_INCIDENT_NOT_ACTIVATED)"
          - "window_start < window_end (ERR_INVALID_TIME_RANGE)"
          - "Buffered overlap: no existing commitment c in commitments satisfies new_start < c.window_end + 4h AND new_end > c.window_start - 4h (ERR_SITE_WINDOW_CONFLICT)"
        side_effects:
          - "commitments appends { incident_id, window_start, window_end }"
      - from: COMMITTED
        to: COMMITTED
        trigger: POST /emergency/alternate-care-sites/{id}/commit (additional future window)
        actor: IncidentCommander
        preconditions:
          - "Same as STANDBY → COMMITTED (incident ACTIVATED, valid range, buffered overlap check)"
        side_effects:
          - "commitments appends the new window; status unchanged"
      - from: ACTIVATED
        to: ACTIVATED
        trigger: POST /emergency/alternate-care-sites/{id}/commit (future window while activated)
        actor: IncidentCommander
        preconditions:
          - "Same as STANDBY → COMMITTED"
        side_effects:
          - "commitments appends the new window; status unchanged"
      - from: DEMOBILIZED
        to: COMMITTED
        trigger: POST /emergency/alternate-care-sites/{id}/commit (re-commitment loop)
        actor: IncidentCommander
        preconditions:
          - "Same as STANDBY → COMMITTED"
        side_effects:
          - "commitments appends the new window"
      - from: COMMITTED
        to: ACTIVATED
        trigger: POST /emergency/alternate-care-sites/{id}/activate
        actor: IncidentCommander
        preconditions:
          - "Some commitment c in commitments satisfies c.window_start <= now <= c.window_end (ERR_OUTSIDE_COMMIT_WINDOW)"
          - "The incident referenced by that commitment has status ACTIVATED (ERR_INCIDENT_NOT_ACTIVATED)"
        side_effects:
          - "activated_incident_id := that commitment's incident_id"
          - "That incident's operational_surge_capacity recomputed to include this site's bed_capacity; current_surge_tier re-derived; every SupplyItem's projected_daily_burn_rate recomputed"
      - from: ACTIVATED
        to: DEMOBILIZED
        trigger: POST /emergency/alternate-care-sites/{id}/demobilize, or cascade of incident demobilize
        actor: IncidentCommander
        preconditions:
          - "current_census == 0 (ERR_PATIENTS_STILL_ON_SITE)"
        side_effects:
          - "activated_incident_id := null"
          - "Link 2 of cascade: the previously served incident's operational_surge_capacity recomputed without this site's bed_capacity"
          - "Link 3 of cascade: that incident's current_surge_tier re-derived from the new operational_surge_capacity (tier = f(projected_census, operational_surge_capacity))"
          - "Link 4 of cascade: every SupplyItem's projected_daily_burn_rate / days_of_supply / below_reorder_level recomputed from the new surge multiplier"

  - entity: PatientTrackRecord
    initial_state: TRACKED
    terminal_states: [DISCHARGED]
    transitions:
      - from: TRACKED
        to: TRANSFERRED
        trigger: POST /emergency/patient-records/{id}/transfer
        actor: PlanningChief
        preconditions:
          - "Target site exists (ERR_NOT_FOUND)"
          - "Target site has status ACTIVATED (ERR_SITE_NOT_ACTIVATED)"
          - "site.activated_incident_id == this record's incident_id (ERR_CROSS_INCIDENT_REFERENCE)"
          - "site.current_census < site.bed_capacity (ERR_ACS_AT_CAPACITY)"
        side_effects:
          - "transfer_site_id := site_id; transferred_at := now"
          - "Target site's current_census increases by 1 (rederived)"
      - from: TRACKED
        to: DISCHARGED
        trigger: POST /emergency/patient-records/{id}/discharge
        actor: PlanningChief
        preconditions: []
        side_effects:
          - "discharged_at := now"
      - from: TRANSFERRED
        to: DISCHARGED
        trigger: POST /emergency/patient-records/{id}/discharge
        actor: PlanningChief
        preconditions: []
        side_effects:
          - "discharged_at := now"
          - "transfer_site site's current_census decreases by 1 (rederived)"

  - entity: FamilyInquiry
    initial_state: OPEN
    terminal_states: [REUNITED, CLOSED_NO_MATCH]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: POST /emergency/family-inquiries/{id}/match
        actor: PublicInformationOfficer
        preconditions:
          - "patient_record_id references an existing PatientTrackRecord (ERR_NOT_FOUND)"
          - "record.incident_id == this inquiry's incident_id (ERR_CROSS_INCIDENT_REFERENCE)"
          - "record.patient_ref == this inquiry's sought_patient_ref (ERR_PATIENT_REF_MISMATCH)"
          - "record.status == TRACKED (ERR_PATIENT_NOT_TRACKED)"
          - "No other FamilyInquiry in status MATCHED references the same record (ERR_PATIENT_ALREADY_MATCHED)"
        side_effects:
          - "matched_patient_record_id := patient_record_id; matched_at := now"
      - from: MATCHED
        to: REUNITED
        trigger: POST /emergency/family-inquiries/{id}/reunite
        actor: PublicInformationOfficer
        preconditions: []
        side_effects:
          - "reunited_at := now"
          - "The matched PatientTrackRecord's reunified := true"
      - from: OPEN
        to: CLOSED_NO_MATCH
        trigger: POST /emergency/family-inquiries/{id}/close-no-match
        actor: PublicInformationOfficer
        preconditions: []
        side_effects: []

  - entity: ExternalReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /emergency/external-reports/{id}/submit
        actor: LiaisonOfficer | HospitalAdministrator
        preconditions:
          - "Segregation of duties: X-User-ID != created_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "submitted_at := now; submitted_late and hours_late computed per report_lateness"
        note: "Late submission is accepted and flagged, never rejected."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: command-assignment-stale-incident
    parent_entity: IncidentEvent
    write_endpoint: "POST /emergency/command-assignments"
    occ_field: expected_incident_version
    description: |
      Creating a CommandRoleAssignment against an IncidentEvent whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just created an assignment (which
      legitimately supersedes the prior holder of the same command_role) and
      the current writer's view of the incident is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hva_risk_score
    trigger: "On HazardAssessment create, on PATCH replacing hazard_entries, and on finalize"
    algorithm: weighted_scoring
    formula: |
      Per entry e in hazard_entries:
        if scoring_model == TWO_FACTOR:
          e.risk_score = e.probability * e.severity
        if scoring_model == THREE_FACTOR_MITIGATION:
          e.risk_score = e.probability * (e.severity + (3 - e.preparedness))
      max_risk_score = max(e.risk_score over entries), or 0 when hazard_entries is empty.
      At finalize: plan_review_triggered = (max_risk_score >= PLAN_REVIEW_TRIGGER_SCORE).
    input_set: "All entries of this HazardAssessment (embedded array); no cross-entity input"
    constants:
      PLAN_REVIEW_TRIGGER_SCORE: 6
    precision: "integer arithmetic, no rounding"
    variants:
      - name: two_factor
        when: "scoring_model == TWO_FACTOR"
        difference: "Ignores preparedness; range 0..9"
      - name: three_factor_mitigation
        when: "scoring_model == THREE_FACTOR_MITIGATION"
        difference: "Adds (3 - preparedness) to severity before multiplying; range 0..18 — identical inputs yield a higher score than two_factor whenever preparedness < 3"

  - name: surge_capacity_and_tier
    trigger: "On POST /emergency/incidents/{id}/assess-surge; re-derived on any AlternateCareSite activation/demobilization affecting the incident"
    algorithm: threshold
    formula: |
      licensed_surge_capacity = staffed_bed_count                      # regulatory_reporting variant
      operational_surge_capacity = staffed_bed_count                   # operational_planning variant
          + sum(site.bed_capacity for site in AlternateCareSite
                where site.status == ACTIVATED and site.activated_incident_id == this incident)
      Tier uses integer cross-multiplication on operational_surge_capacity C and projected_census P
      (no floating point; exact boundaries):
        if C == 0: tier = RED when P > 0 else GREEN
        elif 100*P < 85*C:  tier = GREEN
        elif 100*P < 100*C: tier = YELLOW     # 0.85 <= ratio < 1.00
        elif 100*P < 115*C: tier = ORANGE     # 1.00 <= ratio < 1.15
        else:               tier = RED        # ratio >= 1.15 (1.15 exactly IS RED)
    input_set: "This incident's staffed_bed_count and projected_census; AlternateCareSite rows with status ACTIVATED and activated_incident_id == this incident (COMMITTED / DEMOBILIZED sites excluded)"
    constants:
      TIER_YELLOW_FLOOR_PCT: 85
      TIER_ORANGE_FLOOR_PCT: 100
      TIER_RED_FLOOR_PCT: 115
    precision: "integer cross-multiplication; boundaries inclusive on the higher tier"
    variants:
      - name: regulatory_reporting
        when: "Capacity surfaced to ExternalReport / coalition audiences"
        difference: "licensed_surge_capacity — staffed beds only; identical inputs yield a smaller capacity than operational_planning whenever any ACTIVATED site serves the incident"
      - name: operational_planning
        when: "Surge tiering and internal planning"
        difference: "operational_surge_capacity — staffed beds plus ACTIVATED alternate-care-site beds"

  - name: ppe_burn_rate
    trigger: "Recomputed synchronously on every StockTransaction write, on every surge-tier change (assess-surge or cascade), and on read of SupplyItem"
    algorithm: chronological
    formula: |
      Window W = [now - 168h, now) over the logical clock.
      net_issued = sum(t.quantity for ISSUE t of this item with t.occurred_at in W)
                 - sum(t.quantity for RETURN t of this item with t.occurred_at in W)
      (RECEIVE and ADJUST never enter the burn window.)
      observed_daily_burn_rate = round_half_up(net_issued / 7, 4)
      surge_multiplier:
        1.0 when no IncidentEvent is ACTIVATED or its current_surge_tier is null;
        else map(ACTIVATED incident's current_surge_tier): GREEN 1.0, YELLOW 1.25, ORANGE 1.5, RED 2.0
      Pinned rounding order (round-then-multiply-then-round):
        projected_daily_burn_rate = round_half_up(observed_daily_burn_rate * surge_multiplier, 4)
      days_of_supply = floor(quantity_on_hand / projected_daily_burn_rate) when projected > 0, else null
      below_reorder_level = (days_of_supply is not null) and (days_of_supply < reorder_min_days)   # strict <
    input_set: "StockTransaction rows of this SupplyItem with transaction_type in {ISSUE, RETURN} and occurred_at in [now−168h, now); the single ACTIVATED IncidentEvent (if any) for the multiplier"
    constants:
      BURN_WINDOW_HOURS: 168
      BURN_WINDOW_DAYS: 7
      MULTIPLIER_GREEN: 1.0
      MULTIPLIER_YELLOW: 1.25
      MULTIPLIER_ORANGE: 1.5
      MULTIPLIER_RED: 2.0
    precision: "rates: 4 decimal places, round_half_up; days_of_supply: integer floor"
    variants:
      - name: observed
        when: "Backward-looking chronological window"
        difference: "Unmultiplied; equals projected only when surge_multiplier == 1.0"
      - name: projected
        when: "Forward-looking planning under an ACTIVATED incident"
        difference: "Multiplies observed by the tier-keyed surge_multiplier; identical ledger yields a strictly larger rate whenever tier is YELLOW or worse"

  - name: committed_staffing
    trigger: "Rederived on CallBackRequest respond (ACCEPT), cancel of ACCEPTED, and incident demobilize cascade"
    algorithm: aggregation
    formula: |
      IncidentEvent.committed_staff_count =
        count(cb in CallBackRequest where cb.incident_id == this incident and cb.status == ACCEPTED)
    input_set: "CallBackRequest rows for this incident with status == ACCEPTED only (PENDING, DECLINED, EXPIRED, CANCELLED, COMPLETED excluded)"
    precision: "integer count"
    note: "Compensating invariant: an ACCEPTED request that is later CANCELLED returns committed_staff_count to its pre-accept value."

  - name: acs_census
    trigger: "Rederived on patient transfer, on patient discharge from TRANSFERRED, and on read of AlternateCareSite"
    algorithm: aggregation
    formula: |
      AlternateCareSite.current_census =
        count(p in PatientTrackRecord where p.transfer_site_id == this site and p.status == TRANSFERRED)
    input_set: "PatientTrackRecord rows with status == TRANSFERRED only"
    precision: "integer count"
    note: "Transfer gate: rejected when current_census >= bed_capacity (census == bed_capacity - 1 succeeds, == bed_capacity fails)."

  - name: report_lateness
    trigger: "due_at computed at ExternalReport creation; submitted_late / hours_late computed at submit"
    algorithm: threshold
    formula: |
      due_at = period_end + DUE_OFFSET[report_type]
      submitted_late = (submitted_at > due_at)        # strict; submitting exactly at due_at is NOT late
      hours_late = round_half_up(max(0, submitted_at - due_at in seconds) / 3600, 2)
    input_set: "This ExternalReport's period_end, report_type, submitted_at"
    constants:
      DUE_OFFSET_SITREP_HOURS: 24
      DUE_OFFSET_RESOURCE_REQUEST_HOURS: 24
      DUE_OFFSET_SURGE_CAPACITY_HOURS: 72
      DUE_OFFSET_AAR_SUMMARY_HOURS: 720
    precision: "hours_late: 2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "The given role appears in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path template ids resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Request body shape: required fields present, types and enum members valid, integer fields in range (quantity > 0, bed_capacity > 0, staffed_bed_count/projected_census >= 0, probability/severity/preparedness in 0..3, auto_select_count >= 1), occurred_at not after current clock time, callback create carries exactly one of staff_member_id / auto_select_count", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 5, category: existence, check: "Body-referenced ids resolve (incident_id, staff_member_id, plan_revision_id, site_id, patient_record_id, supply_item_id, after_action_report_id, supersedes_revision_id, source_hva_id, subject_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "endpoints with body FKs" }
  - { priority: 6, category: auth, check: "Identity/ownership: SoD — X-User-ID != created_by_id on plan approve, AAR approve, report submit; callback respond requires X-User-ID == staff_member_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST plan-revisions/{id}/approve, POST after-action-reports/{id}/approve, POST external-reports/{id}/submit (SoD); POST callback-requests/{id}/respond (ERR_NOT_CALLBACK_OWNER)" }
  - { priority: 7, category: state, check: "OCC: expected_incident_version must equal IncidentEvent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /emergency/command-assignments" }
  - { priority: 8, category: state, check: "Target resource state permits the requested transition (generic illegal-transition guard: ERR_INVALID_STATE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "Incident posture gate: incident-referencing creates (patients, inquiries, callbacks, command assignments, incident-linked stock transactions, ACS commit/activate) require the incident ACTIVATED", error_id: ERR_INCIDENT_NOT_ACTIVATED, http_status: 409, applies_to: "POST patient-records, family-inquiries, callback-requests, command-assignments, stock-transactions (when incident_id present), alternate-care-sites/{id}/commit, alternate-care-sites/{id}/activate, incidents/{id}/assess-surge" }
  - { priority: 10, category: business_safety, check: "Patient transfer only when site.current_census < site.bed_capacity", error_id: ERR_ACS_AT_CAPACITY, http_status: 422, applies_to: "POST /emergency/patient-records/{id}/transfer" }
  - { priority: 11, category: business_safety, check: "ISSUE quantity must not exceed supply item's current quantity_on_hand", error_id: ERR_INSUFFICIENT_STOCK, http_status: 422, applies_to: "POST /emergency/stock-transactions" }
  - { priority: 12, category: business_referential, check: "Cross-incident consistency: transfer site.activated_incident_id == patient.incident_id; match record.incident_id == inquiry.incident_id", error_id: ERR_CROSS_INCIDENT_REFERENCE, http_status: 422, applies_to: "POST patient-records/{id}/transfer, POST family-inquiries/{id}/match" }
  - { priority: 13, category: business_temporal, check: "Interval well-formedness and overlap: exercise scheduled_end > scheduled_start (ERR_INVALID_TIME_RANGE); exercise [start,end) half-open overlap vs exercises in {SCHEDULED, IN_PROGRESS} (ERR_EXERCISE_TIME_CONFLICT); ACS commit window valid + buffered ±4h overlap (ERR_INVALID_TIME_RANGE / ERR_SITE_WINDOW_CONFLICT); ACS activate requires now inside a commitment window (ERR_OUTSIDE_COMMIT_WINDOW)", error_id: ERR_INVALID_TIME_RANGE, http_status: 422, applies_to: "POST exercises, POST alternate-care-sites/{id}/commit, POST alternate-care-sites/{id}/activate" }
  - { priority: 14, category: business_constraint, check: "Uniqueness/aggregate/qualification constraints: badge_number unique (ERR_BADGE_NUMBER_EXISTS); (incident_id, patient_ref) unique (ERR_DUPLICATE_PATIENT_REF); one AAR per subject (ERR_AAR_ALREADY_EXISTS); at most one ACTIVATED incident (ERR_INCIDENT_ALREADY_ACTIVE); record not already MATCHED to another inquiry (ERR_PATIENT_ALREADY_MATCHED); record.patient_ref == sought_patient_ref (ERR_PATIENT_REF_MISMATCH); record TRACKED for match (ERR_PATIENT_NOT_TRACKED); staff qualified for command role (ERR_STAFF_NOT_QUALIFIED); staff active+eligible for explicit callback (ERR_STAFF_NOT_CALLBACK_ELIGIBLE); no PENDING/ACCEPTED callback for same staff+incident (ERR_DUPLICATE_CALLBACK); eligible pool >= auto_select_count (ERR_INSUFFICIENT_CALLBACK_POOL); HVA finalize requires >= 1 entry (ERR_HVA_NO_ENTRIES); supersedes target APPROVED (ERR_SUPERSEDE_TARGET_NOT_APPROVED); no other APPROVED plan beyond supersedes target (ERR_OTHER_PLAN_APPROVED); exercise start requires plan APPROVED (ERR_PLAN_NOT_APPROVED); demobilize requires no TRACKED patients (ERR_PATIENTS_STILL_TRACKED) and no TRANSFERRED patients at its sites (ERR_PATIENTS_STILL_ON_SITE); site demobilize requires current_census == 0 (ERR_PATIENTS_STILL_ON_SITE)", error_id: ERR_BADGE_NUMBER_EXISTS, http_status: 409, applies_to: "various (see per-error catalog)" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- staff roster ----
  - { method: POST, path: "/emergency/staff-members", description: "Register a staff member", roles: [HospitalAdministrator], code: 201, input: [full_name, badge_number, department, role_qualifications, "is_active?", "callback_eligible?", "callback_seniority_score?"], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/emergency/staff-members", description: "List staff with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["department?", "is_active?", "callback_eligible?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/emergency/staff-members/{id}", description: "Get one staff member", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: PATCH, path: "/emergency/staff-members/{id}", description: "Update mutable staff attributes", roles: [HospitalAdministrator], code: 200, input: ["department?", "role_qualifications?", "is_active?", "callback_eligible?", "callback_seniority_score?"], output: StaffMember, side_effects: ["increments StaffMember.version by 1"] }

  # ---- hazard vulnerability analysis ----
  - { method: POST, path: "/emergency/hazard-assessments", description: "Create an HVA cycle with optional initial hazard entries", roles: [EmergencyManager], code: 201, input: [fiscal_year, scoring_model, "hazard_entries?"], output: HazardAssessment, side_effects: ["hva_risk_score computed for each entry; max_risk_score computed"] }
  - { method: GET, path: "/emergency/hazard-assessments/{id}", description: "Get one HVA cycle with scored entries", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: HazardAssessment, side_effects: [] }
  - { method: PATCH, path: "/emergency/hazard-assessments/{id}", description: "Replace hazard_entries while DRAFT; recomputes scores", roles: [EmergencyManager], code: 200, input: [hazard_entries], output: HazardAssessment, side_effects: ["hva_risk_score recomputed per entry; max_risk_score recomputed", "increments HazardAssessment.version by 1"] }
  - { method: POST, path: "/emergency/hazard-assessments/{id}/finalize", description: "Freeze scores and compute plan_review_triggered", roles: [EmergencyManager], code: 200, input: [], output: HazardAssessment, side_effects: ["status DRAFT→FINALIZED; entries frozen", "increments HazardAssessment.version by 1"] }

  # ---- plan update cycle ----
  - { method: POST, path: "/emergency/plan-revisions", description: "Create a plan revision draft, optionally superseding the current APPROVED revision", roles: [EmergencyManager], code: 201, input: [revision_label, change_summary, effective_date, "supersedes_revision_id?", "source_hva_id?"], output: PlanRevision, side_effects: ["created_by_id := X-User-ID"] }
  - { method: GET, path: "/emergency/plan-revisions", description: "List plan revisions with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["supersedes_revision_id?", "source_hva_id?", "status?", "limit?", "offset?"], output: "PlanRevision[]", side_effects: [] }
  - { method: GET, path: "/emergency/plan-revisions/{id}", description: "Get one plan revision", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: PlanRevision, side_effects: [] }
  - { method: POST, path: "/emergency/plan-revisions/{id}/submit-review", description: "Submit a DRAFT revision for approval", roles: [EmergencyManager], code: 200, input: [], output: PlanRevision, side_effects: ["status DRAFT→IN_REVIEW", "increments PlanRevision.version by 1"] }
  - { method: POST, path: "/emergency/plan-revisions/{id}/approve", description: "Approve an IN_REVIEW revision (SoD: approver != creator); supersedes its predecessor", roles: [HospitalAdministrator], code: 200, input: [], output: PlanRevision, side_effects: ["status IN_REVIEW→APPROVED", "supersedes target (if any) APPROVED→SUPERSEDED", "approved_by_id/approved_at set", "increments PlanRevision.version by 1"] }
  - { method: POST, path: "/emergency/plan-revisions/{id}/reject", description: "Reject an IN_REVIEW revision back to DRAFT", roles: [HospitalAdministrator], code: 200, input: [], output: PlanRevision, side_effects: ["status IN_REVIEW→DRAFT", "increments PlanRevision.version by 1"] }

  # ---- exercises / drills ----
  - { method: POST, path: "/emergency/exercises", description: "Schedule an exercise; half-open [start,end) overlap check against exercises in SCHEDULED or IN_PROGRESS", roles: [EmergencyManager], code: 201, input: [exercise_name, exercise_type, scenario_category, scheduled_start, scheduled_end, plan_revision_id], output: ExerciseEvent, side_effects: [] }
  - { method: GET, path: "/emergency/exercises", description: "List exercises with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["plan_revision_id?", "status?", "exercise_type?", "limit?", "offset?"], output: "ExerciseEvent[]", side_effects: [] }
  - { method: GET, path: "/emergency/exercises/{id}", description: "Get one exercise", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: ExerciseEvent, side_effects: [] }
  - { method: POST, path: "/emergency/exercises/{id}/start", description: "Start a SCHEDULED exercise; requires referenced plan APPROVED", roles: [EmergencyManager], code: 200, input: [], output: ExerciseEvent, side_effects: ["status SCHEDULED→IN_PROGRESS", "started_at := now", "increments ExerciseEvent.version by 1"] }
  - { method: POST, path: "/emergency/exercises/{id}/complete", description: "Complete an IN_PROGRESS exercise", roles: [EmergencyManager], code: 200, input: [], output: ExerciseEvent, side_effects: ["status IN_PROGRESS→COMPLETED", "completed_at := now", "increments ExerciseEvent.version by 1"] }
  - { method: POST, path: "/emergency/exercises/{id}/cancel", description: "Cancel a SCHEDULED exercise", roles: [EmergencyManager], code: 200, input: [], output: ExerciseEvent, side_effects: ["status SCHEDULED→CANCELLED", "increments ExerciseEvent.version by 1"] }

  # ---- after-action reports & improvement tasks ----
  - { method: POST, path: "/emergency/after-action-reports", description: "Create an AAR for a COMPLETED exercise or DEACTIVATED incident; one per subject", roles: [EmergencyManager, IncidentCommander], code: 201, input: [subject_type, subject_id, summary], output: AfterActionReport, side_effects: ["created_by_id := X-User-ID"] }
  - { method: GET, path: "/emergency/after-action-reports/{id}", description: "Get one AAR", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: AfterActionReport, side_effects: [] }
  - { method: POST, path: "/emergency/after-action-reports/{id}/submit", description: "Submit a DRAFT AAR", roles: [EmergencyManager, IncidentCommander], code: 200, input: [], output: AfterActionReport, side_effects: ["status DRAFT→SUBMITTED", "submitted_at := now", "increments AfterActionReport.version by 1"] }
  - { method: POST, path: "/emergency/after-action-reports/{id}/approve", description: "Approve a SUBMITTED AAR (SoD: approver != creator)", roles: [HospitalAdministrator], code: 200, input: [], output: AfterActionReport, side_effects: ["status SUBMITTED→APPROVED", "increments AfterActionReport.version by 1"] }
  - { method: POST, path: "/emergency/improvement-tasks", description: "Add a corrective-action task to a DRAFT or SUBMITTED AAR", roles: [EmergencyManager], code: 201, input: [after_action_report_id, description, priority, due_date, assigned_department], output: ImprovementTask, side_effects: [] }
  - { method: GET, path: "/emergency/improvement-tasks", description: "List improvement tasks with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["after_action_report_id?", "status?", "limit?", "offset?"], output: "ImprovementTask[]", side_effects: [] }
  - { method: GET, path: "/emergency/improvement-tasks/{id}", description: "Get one improvement task", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: ImprovementTask, side_effects: [] }
  - { method: PATCH, path: "/emergency/improvement-tasks/{id}", description: "Advance task status per state machine (OPEN/OVERDUE→IN_PROGRESS, IN_PROGRESS→VERIFIED_COMPLETE)", roles: [EmergencyManager], code: 200, input: [target_status], output: ImprovementTask, side_effects: ["increments ImprovementTask.version by 1"] }

  # ---- incidents & incident command ----
  - { method: POST, path: "/emergency/incidents", description: "Declare and activate an incident; at most one incident ACTIVATED at a time", roles: [IncidentCommander], code: 201, input: [incident_name, incident_type, declared_at], output: IncidentEvent, side_effects: ["status := ACTIVATED", "activation_count := 1", "activated_at := now", "every SupplyItem projected burn recomputed (multiplier context changes)"] }
  - { method: GET, path: "/emergency/incidents/{id}", description: "Get one incident with surge fields and committed_staff_count", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: IncidentEvent, side_effects: [] }
  - { method: POST, path: "/emergency/incidents/{id}/assess-surge", description: "Record staffed beds + projected census; computes licensed/operational capacity and current_surge_tier", roles: [IncidentCommander, PlanningChief], code: 200, input: [staffed_bed_count, projected_census], output: IncidentEvent, side_effects: ["surge_capacity_and_tier computed and stored", "every SupplyItem projected_daily_burn_rate / days_of_supply / below_reorder_level recomputed", "increments IncidentEvent.version by 1"] }
  - { method: POST, path: "/emergency/incidents/{id}/demobilize", description: "Demobilize an ACTIVATED incident; cascades to callbacks, sites, capacity, tier, burn rates", roles: [IncidentCommander], code: 200, input: [], output: IncidentEvent, side_effects: ["PENDING callbacks → EXPIRED; ACCEPTED callbacks → COMPLETED", "ACTIVATED sites serving this incident → DEMOBILIZED (each triggering capacity/tier/burn recompute)", "status ACTIVATED→DEACTIVATED; deactivated_at := now", "surge multiplier falls back to 1.0; every SupplyItem projected burn recomputed", "increments IncidentEvent.version by 1"] }
  - { method: POST, path: "/emergency/incidents/{id}/reactivate", description: "Reactivate a DEACTIVATED incident (second surge wave)", roles: [IncidentCommander], code: 200, input: [], output: IncidentEvent, side_effects: ["status DEACTIVATED→ACTIVATED", "activation_count += 1; activated_at := now", "every SupplyItem projected burn recomputed with resumed tier multiplier", "increments IncidentEvent.version by 1"] }

  # ---- command role assignments (OCC-guarded) ----
  - { method: POST, path: "/emergency/command-assignments", description: "Assign (or relieve-and-reassign) an ICS command role on an ACTIVATED incident; OCC-guarded by expected_incident_version", roles: [IncidentCommander], code: 201, input: [incident_id, staff_member_id, command_role, expected_incident_version], output: CommandRoleAssignment, side_effects: ["any existing ACTIVE assignment for the same (incident_id, command_role) → RELIEVED", "assigned_at := now", "increments IncidentEvent.version by 1"] }
  - { method: GET, path: "/emergency/command-assignments", description: "List command assignments with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["incident_id?", "staff_member_id?", "status?", "limit?", "offset?"], output: "CommandRoleAssignment[]", side_effects: [] }
  - { method: GET, path: "/emergency/command-assignments/{id}", description: "Get one command assignment", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: CommandRoleAssignment, side_effects: [] }

  # ---- staffing call-back ----
  - { method: POST, path: "/emergency/callback-requests", description: "Create call-back request(s): explicit mode (staff_member_id) or auto-select mode (auto_select_count + optional required_department). Auto-select eligibility: is_active==true AND callback_eligible==true AND department match (when given) AND no PENDING/ACCEPTED request for this incident; ranked callback_seniority_score DESC, created_at ASC, badge_number ASC; pool smaller than count → 422 and nothing created. Response is always an array ordered by selection rank.", roles: [PlanningChief], code: 201, input: [incident_id, "staff_member_id?", "auto_select_count?", "required_department?", "response_window_hours?"], output: "CallBackRequest[]", side_effects: ["expires_at := created_at + response_window_hours per request"] }
  - { method: GET, path: "/emergency/callback-requests", description: "List call-back requests with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["incident_id?", "staff_member_id?", "status?", "limit?", "offset?"], output: "CallBackRequest[]", side_effects: [] }
  - { method: GET, path: "/emergency/callback-requests/{id}", description: "Get one call-back request", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: CallBackRequest, side_effects: [] }
  - { method: POST, path: "/emergency/callback-requests/{id}/respond", description: "Respond to your own PENDING call-back request (ACCEPT or DECLINE)", roles: [OnCallStaff], code: 200, input: [outcome], output: CallBackRequest, side_effects: ["outcome ACCEPT: status → ACCEPTED and incident.committed_staff_count +1; outcome DECLINE: status → DECLINED", "responded_at := now", "increments CallBackRequest.version by 1"] }
  - { method: POST, path: "/emergency/callback-requests/{id}/cancel", description: "Cancel a PENDING or ACCEPTED call-back request; cancelling ACCEPTED decrements committed_staff_count", roles: [PlanningChief], code: 200, input: ["reason?"], output: CallBackRequest, side_effects: ["status → CANCELLED", "if previously ACCEPTED: incident.committed_staff_count -1 (compensation)", "increments CallBackRequest.version by 1"] }

  # ---- supply / PPE cache ----
  - { method: POST, path: "/emergency/supply-items", description: "Register a supply/PPE cache item", roles: [LogisticsChief], code: 201, input: [item_name, category, unit, reorder_min_days], output: SupplyItem, side_effects: ["quantity_on_hand := 0"] }
  - { method: GET, path: "/emergency/supply-items", description: "List supply items with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["category?", "below_reorder_level?", "limit?", "offset?"], output: "SupplyItem[]", side_effects: [] }
  - { method: GET, path: "/emergency/supply-items/{id}", description: "Get one supply item with burn-rate fields, days_of_supply, below_reorder_level", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: SupplyItem, side_effects: [] }
  - { method: POST, path: "/emergency/stock-transactions", description: "Append a ledger transaction (RECEIVE/ISSUE/RETURN/ADJUST); ISSUE gated by stock on hand; optional incident linkage requires incident ACTIVATED", roles: [LogisticsChief], code: 201, input: [supply_item_id, transaction_type, quantity, occurred_at, "incident_id?", "note?"], output: StockTransaction, side_effects: ["quantity_on_hand recomputed synchronously (RECEIVE +q, ISSUE -q, RETURN +q, ADJUST := q)", "observed/projected burn rate, days_of_supply, below_reorder_level recomputed", "increments SupplyItem.version by 1"] }
  - { method: GET, path: "/emergency/stock-transactions", description: "List ledger transactions with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["supply_item_id?", "incident_id?", "transaction_type?", "limit?", "offset?"], output: "StockTransaction[]", side_effects: [] }
  - { method: GET, path: "/emergency/stock-transactions/{id}", description: "Get one ledger transaction", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: StockTransaction, side_effects: [] }

  # ---- alternate care sites & evacuation ----
  - { method: POST, path: "/emergency/alternate-care-sites", description: "Register an alternate care site", roles: [LogisticsChief], code: 201, input: [site_name, address, bed_capacity], output: AlternateCareSite, side_effects: ["status := STANDBY"] }
  - { method: GET, path: "/emergency/alternate-care-sites", description: "List sites with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["activated_incident_id?", "status?", "limit?", "offset?"], output: "AlternateCareSite[]", side_effects: [] }
  - { method: GET, path: "/emergency/alternate-care-sites/{id}", description: "Get one site with commitments and current_census", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: AlternateCareSite, side_effects: [] }
  - { method: POST, path: "/emergency/alternate-care-sites/{id}/commit", description: "Reserve an activation window for an ACTIVATED incident; buffered ±4h overlap check against existing commitments", roles: [IncidentCommander], code: 200, input: [incident_id, window_start, window_end], output: AlternateCareSite, side_effects: ["commitments appends the window", "status STANDBY→COMMITTED or DEMOBILIZED→COMMITTED (unchanged when already COMMITTED/ACTIVATED)", "increments AlternateCareSite.version by 1"] }
  - { method: POST, path: "/emergency/alternate-care-sites/{id}/activate", description: "Activate a COMMITTED site when now falls inside a commitment window and that commitment's incident is ACTIVATED", roles: [IncidentCommander], code: 200, input: [], output: AlternateCareSite, side_effects: ["status COMMITTED→ACTIVATED", "activated_incident_id := commitment's incident", "incident operational_surge_capacity / current_surge_tier recomputed; every SupplyItem projected burn recomputed", "increments AlternateCareSite.version by 1"] }
  - { method: POST, path: "/emergency/alternate-care-sites/{id}/demobilize", description: "Demobilize an ACTIVATED site (requires current_census == 0); cascades capacity → tier → burn recompute", roles: [IncidentCommander], code: 200, input: [], output: AlternateCareSite, side_effects: ["status ACTIVATED→DEMOBILIZED; activated_incident_id := null", "served incident's operational_surge_capacity recomputed without this site's beds", "incident current_surge_tier re-derived", "every SupplyItem projected burn recomputed", "increments AlternateCareSite.version by 1"] }

  # ---- patient tracking & family reunification ----
  - { method: POST, path: "/emergency/patient-records", description: "Register a tracked patient on an ACTIVATED incident; (incident_id, patient_ref) unique", roles: [PlanningChief], code: 201, input: [incident_id, patient_ref, triage_category, arrival_at], output: PatientTrackRecord, side_effects: ["status := TRACKED"] }
  - { method: GET, path: "/emergency/patient-records", description: "List patient records with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["incident_id?", "transfer_site_id?", "status?", "triage_category?", "limit?", "offset?"], output: "PatientTrackRecord[]", side_effects: [] }
  - { method: GET, path: "/emergency/patient-records/{id}", description: "Get one patient record", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: PatientTrackRecord, side_effects: [] }
  - { method: POST, path: "/emergency/patient-records/{id}/transfer", description: "Transfer a TRACKED patient to an ACTIVATED alternate care site serving the same incident with spare capacity", roles: [PlanningChief], code: 200, input: [site_id], output: PatientTrackRecord, side_effects: ["status TRACKED→TRANSFERRED; transfer_site_id, transferred_at set", "site current_census +1", "increments PatientTrackRecord.version by 1"] }
  - { method: POST, path: "/emergency/patient-records/{id}/discharge", description: "Discharge a TRACKED or TRANSFERRED patient", roles: [PlanningChief], code: 200, input: [], output: PatientTrackRecord, side_effects: ["status → DISCHARGED; discharged_at := now", "if TRANSFERRED: site current_census -1", "increments PatientTrackRecord.version by 1"] }
  - { method: POST, path: "/emergency/family-inquiries", description: "Open a family reunification inquiry on an ACTIVATED incident", roles: [PublicInformationOfficer], code: 201, input: [incident_id, inquirer_name, inquirer_phone, sought_patient_ref], output: FamilyInquiry, side_effects: ["status := OPEN"] }
  - { method: GET, path: "/emergency/family-inquiries", description: "List inquiries with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["incident_id?", "matched_patient_record_id?", "status?", "limit?", "offset?"], output: "FamilyInquiry[]", side_effects: [] }
  - { method: GET, path: "/emergency/family-inquiries/{id}", description: "Get one inquiry", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: FamilyInquiry, side_effects: [] }
  - { method: POST, path: "/emergency/family-inquiries/{id}/match", description: "Match an OPEN inquiry to a TRACKED patient record of the same incident with matching patient_ref", roles: [PublicInformationOfficer], code: 200, input: [patient_record_id], output: FamilyInquiry, side_effects: ["status OPEN→MATCHED; matched_patient_record_id, matched_at set", "increments FamilyInquiry.version by 1"] }
  - { method: POST, path: "/emergency/family-inquiries/{id}/reunite", description: "Mark a MATCHED inquiry reunified; flags the patient record reunified", roles: [PublicInformationOfficer], code: 200, input: [], output: FamilyInquiry, side_effects: ["status MATCHED→REUNITED; reunited_at := now", "matched PatientTrackRecord.reunified := true", "increments FamilyInquiry.version by 1"] }
  - { method: POST, path: "/emergency/family-inquiries/{id}/close-no-match", description: "Close an OPEN inquiry with no match", roles: [PublicInformationOfficer], code: 200, input: [], output: FamilyInquiry, side_effects: ["status OPEN→CLOSED_NO_MATCH", "increments FamilyInquiry.version by 1"] }

  # ---- coalition coordination & regulatory reporting ----
  - { method: POST, path: "/emergency/external-reports", description: "Draft a coalition/regulatory report; due_at computed from report_type offset", roles: [LiaisonOfficer], code: 201, input: [audience, report_type, period_start, period_end, body_summary, "incident_id?"], output: ExternalReport, side_effects: ["due_at := period_end + type offset", "created_by_id := X-User-ID"] }
  - { method: GET, path: "/emergency/external-reports", description: "List reports with optional filters; paginated", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: ["incident_id?", "audience?", "report_type?", "status?", "limit?", "offset?"], output: "ExternalReport[]", side_effects: [] }
  - { method: GET, path: "/emergency/external-reports/{id}", description: "Get one report", roles: [EmergencyManager, IncidentCommander, PlanningChief, LogisticsChief, PublicInformationOfficer, LiaisonOfficer, HospitalAdministrator, OnCallStaff, PlatformAdmin], code: 200, input: [], output: ExternalReport, side_effects: [] }
  - { method: POST, path: "/emergency/external-reports/{id}/submit", description: "Submit a DRAFT report (SoD: submitter != creator); late submissions accepted and flagged", roles: [LiaisonOfficer, HospitalAdministrator], code: 200, input: [], output: ExternalReport, side_effects: ["status DRAFT→SUBMITTED", "submitted_at := now; submitted_late and hours_late computed", "increments ExternalReport.version by 1"] }

  # ---- test-driving clock ----
  - { method: POST, path: "/emergency/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock sweeps: CallBackRequest PENDING→EXPIRED when new time > expires_at; ImprovementTask OPEN/IN_PROGRESS→OVERDUE when new time > due_date.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string, swept_callbacks: integer, swept_tasks: integer }", side_effects: ["logical clock advanced to to_iso8601", "callback expiry sweep", "improvement task overdue sweep"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, out-of-range integer, occurred_at in the future, or callback create carrying both/neither of staff_member_id and auto_select_count" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/submitter X-User-ID equals the resource's created_by_id" }
  - { id: ERR_NOT_CALLBACK_OWNER, http: 403, condition: "Callback respond by a user whose X-User-ID != request.staff_member_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_incident_version does not match IncidentEvent.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's current state does not permit the requested transition" }
  - { id: ERR_INCIDENT_NOT_ACTIVATED, http: 409, condition: "Operation requires the referenced incident to be ACTIVATED" }
  - { id: ERR_INCIDENT_ALREADY_ACTIVE, http: 409, condition: "Create/reactivate while another incident is ACTIVATED" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 422, condition: "Exercise start while referenced PlanRevision is not APPROVED" }
  - { id: ERR_OTHER_PLAN_APPROVED, http: 409, condition: "Approve while an unrelated PlanRevision (not the supersedes target) is APPROVED" }
  - { id: ERR_SUPERSEDE_TARGET_NOT_APPROVED, http: 422, condition: "supersedes_revision_id references a revision that is not APPROVED" }
  - { id: ERR_AAR_ALREADY_EXISTS, http: 409, condition: "An AfterActionReport already exists for (subject_type, subject_id)" }
  - { id: ERR_HVA_NO_ENTRIES, http: 422, condition: "Finalize a HazardAssessment with zero hazard entries" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "scheduled_end/window_end not strictly after scheduled_start/window_start" }
  - { id: ERR_EXERCISE_TIME_CONFLICT, http: 409, condition: "Half-open [start,end) overlap with an exercise in SCHEDULED or IN_PROGRESS; adjacency (end == start) is allowed" }
  - { id: ERR_SITE_WINDOW_CONFLICT, http: 409, condition: "ACS commitment collides with an existing commitment under buffered ±4h semantics: conflict iff new_start < existing.window_end + 4h AND new_end > existing.window_start - 4h" }
  - { id: ERR_OUTSIDE_COMMIT_WINDOW, http: 422, condition: "ACS activate when no commitment satisfies window_start <= now <= window_end" }
  - { id: ERR_SITE_NOT_ACTIVATED, http: 409, condition: "Patient transfer target site is not ACTIVATED" }
  - { id: ERR_PATIENTS_STILL_TRACKED, http: 409, condition: "Incident demobilize while any of its patient records is TRACKED" }
  - { id: ERR_PATIENTS_STILL_ON_SITE, http: 409, condition: "Demobilize while patients remain TRANSFERRED at (a) sites serving this incident, or (b) this site" }
  - { id: ERR_ACS_AT_CAPACITY, http: 422, condition: "Transfer when site.current_census >= site.bed_capacity" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "ISSUE quantity exceeds quantity_on_hand" }
  - { id: ERR_DUPLICATE_PATIENT_REF, http: 409, condition: "patient_ref already exists on the same incident" }
  - { id: ERR_PATIENT_ALREADY_MATCHED, http: 409, condition: "Patient record already referenced by another FamilyInquiry in MATCHED status" }
  - { id: ERR_PATIENT_REF_MISMATCH, http: 422, condition: "record.patient_ref != inquiry.sought_patient_ref on match" }
  - { id: ERR_PATIENT_NOT_TRACKED, http: 422, condition: "Match targets a patient record whose status is not TRACKED" }
  - { id: ERR_CROSS_INCIDENT_REFERENCE, http: 422, condition: "Transfer/match references a resource belonging to a different incident" }
  - { id: ERR_DUPLICATE_CALLBACK, http: 409, condition: "Explicit callback when the same staff member already has a PENDING or ACCEPTED request for this incident" }
  - { id: ERR_STAFF_NOT_CALLBACK_ELIGIBLE, http: 422, condition: "Explicit callback for staff with is_active == false or callback_eligible == false" }
  - { id: ERR_INSUFFICIENT_CALLBACK_POOL, http: 422, condition: "Auto-select pool smaller than requested auto_select_count; nothing created" }
  - { id: ERR_STAFF_NOT_QUALIFIED, http: 422, condition: "Command assignment where staff_member.role_qualifications lacks command_role" }
  - { id: ERR_BADGE_NUMBER_EXISTS, http: 409, condition: "Staff create with a badge_number already in use" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EmergencyManager
    description: "Hospital emergency management director; owns HVA cycles, plan drafts, exercises, AARs, improvement tasks"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create/patch/finalize hazard-assessments, create/submit plan-revisions, create/start/complete/cancel exercises, create/submit after-action-reports, create/patch improvement-tasks]
    shared_operations: [all GET reads]
  - name: IncidentCommander
    description: "ICS incident commander; activates/demobilizes/reactivates incidents, assigns command roles, commits/activates/demobilizes alternate care sites"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create/demobilize/reactivate incidents, create command-assignments, commit/activate/demobilize alternate-care-sites]
    shared_operations: [assess-surge (with PlanningChief), create/submit after-action-reports (with EmergencyManager), all GET reads]
  - name: PlanningChief
    description: "ICS planning chief; runs staffing call-back and patient tracking, co-owns surge assessment"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create/cancel callback-requests, create/transfer/discharge patient-records]
    shared_operations: [assess-surge (with IncidentCommander), all GET reads]
  - name: LogisticsChief
    description: "ICS logistics chief; owns supply/PPE cache and site registration"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create supply-items, create stock-transactions, create alternate-care-sites]
    shared_operations: [all GET reads]
  - name: PublicInformationOfficer
    description: "PIO; runs family reunification desk"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create/match/reunite/close-no-match family-inquiries]
    shared_operations: [all GET reads]
  - name: LiaisonOfficer
    description: "Coalition/external liaison; drafts regulatory and coalition reports"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create external-reports]
    shared_operations: [submit external-reports (with HospitalAdministrator; never own draft), all GET reads]
  - name: HospitalAdministrator
    description: "Executive approver; segregation-of-duties counterpart for plan/AAR approval and report submission; owns staff roster"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [create/patch staff-members, approve/reject plan-revisions, approve after-action-reports]
    shared_operations: [submit external-reports (with LiaisonOfficer; never own draft), all GET reads]
  - name: OnCallStaff
    description: "Any staff member responding to their own call-back request"
    identity: "entity_backed:StaffMember"
    exclusive_operations: [respond to own callback-requests]
    shared_operations: [all GET reads]
  - name: PlatformAdmin
    description: "Test harness operator for the logical clock"
    identity: "opaque"
    exclusive_operations: [set logical clock via /emergency/_clock/set_current_utc]
    shared_operations: [all GET reads]
