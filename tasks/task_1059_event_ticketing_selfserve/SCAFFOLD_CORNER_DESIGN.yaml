# =============================================================================
# task_1059 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7; §1.8 covers depth.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_create_event_returns_draft_with_version_one
        claim_type: creation
        grounds: [entities.Event.fields.status, entities.Event.fields.organizer_id]
        distinguishing_aspect: "POST /api/events with all required fields returns 201 with status DRAFT, version 1 and every submitted field echoed."
        test_recipe:
          setup:
            - "Organizer O and Venue V exist; the logical clock is at the default 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Corner Co", contact_email: "ops@corner.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Corner Hall", city: "Reno", seated_capacity: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Corner Night", starts_at: "2026-09-10T18:00:00Z", ends_at: "2026-09-10T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Event.${ev_id}.status == DRAFT"
            - "Event.${ev_id}.version == 1"
            - "Event.${ev_id}.gross_cents == 0"
            - "Event.${ev_id}.issued_count == 0"
            - "Event.${ev_id}.title == Corner Night"

      - name: corner_get_event_by_id_returns_stored_row
        claim_type: retrieval
        grounds: [entities.Event.fields.title, entities.Event.fields.fee_mode]
        distinguishing_aspect: "GET /api/events/{id} returns the same field values that POST /api/events persisted, including fee_mode ABSORB."
        test_recipe:
          setup:
            - "One DRAFT Event exists with fee_mode ABSORB and refund_policy FEE_INCLUDED."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Readback Co", contact_email: "ops@readback.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Readback Hall", city: "Boise", seated_capacity: 90 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Readback Night", starts_at: "2026-09-11T18:00:00Z", ends_at: "2026-09-11T22:00:00Z", fee_mode: "ABSORB", refund_policy: "FEE_INCLUDED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: Anonymous
          assert:
            - "HTTP status == 200"
            - "Event.${ev_id}.fee_mode == ABSORB"
            - "Event.${ev_id}.refund_policy == FEE_INCLUDED"
            - "Event.${ev_id}.venue_id == ${venue_id}"

      - name: corner_list_ticket_types_paginates_with_envelope_fields
        claim_type: listing
        grounds: [entities.TicketType.fields.tier_rank, response_envelope]
        distinguishing_aspect: "GET /api/ticket-types?event_id=...&limit=2&offset=0 returns response_type array with total_count 3, has_more true and exactly 2 rows."
        test_recipe:
          setup:
            - "One DRAFT Event with exactly three TicketTypes."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Pager Co", contact_email: "ops@pager.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Pager Hall", city: "Tulsa", seated_capacity: 90 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Pager Night", starts_at: "2026-09-12T18:00:00Z", ends_at: "2026-09-12T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Tier 1", tier_rank: 1, price_cents: 1000, quantity_total: 5, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Tier 2", tier_rank: 2, price_cents: 2000, quantity_total: 5, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Tier 3", tier_rank: 3, price_cents: 3000, quantity_total: 5, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /api/ticket-types"
              payload: { event_id: "${ev_id}", limit: 2, offset: 0 }
              as: Anonymous
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "meta contains api_request_id and api_request_timestamp"
            - "total_count == 3"
            - "has_more == true"
            - "len(data) == 2"

      - name: corner_get_event_not_found_returns_event_not_found
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]", "validations[priority=13]"]
        distinguishing_aspect: "GET /api/events/{id} with a well-formed but unknown UUID returns 404 ERR_EVENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Database contains no Event with id 11111111-2222-3333-4444-555555555555."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Void Co", contact_email: "ops@void.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /api/events/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_EVENT_NOT_FOUND"
            - "response_type == error"

      - name: corner_create_event_missing_required_title_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/events without the required title field returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "Organizer O and Venue V exist."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Missing Co", contact_email: "ops@missing.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Missing Hall", city: "Fargo", seated_capacity: 60 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", starts_at: "2026-09-13T18:00:00Z", ends_at: "2026-09-13T22:00:00Z" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /api/events?organizer_id=${org_id} returns total_count == 0"

      - name: corner_ticket_type_seating_mode_defaults_to_ga
        claim_type: defaults
        grounds: [entities.TicketType.fields.seating_mode, entities.Event.fields.fee_mode]
        distinguishing_aspect: "Omitting seating_mode on POST /api/ticket-types yields GA, and omitting fee_mode on POST /api/events yields PASS_ON."
        test_recipe:
          setup:
            - "Organizer O and Venue V exist."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Default Co", contact_email: "ops@default.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Default Hall", city: "Omaha", seated_capacity: 60 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Default Night", starts_at: "2026-09-14T18:00:00Z", ends_at: "2026-09-14T22:00:00Z" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10 }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
          assert:
            - "TicketType.${tt_id}.seating_mode == GA"
            - "TicketType.${tt_id}.sold_count == 0"
            - "TicketType.${tt_id}.held_count == 0"
            - "Event.${ev_id}.fee_mode == PASS_ON"
            - "Event.${ev_id}.refund_policy == FEE_RETAINED"

      - name: corner_seat_block_seats_total_is_computed_from_range
        claim_type: computed_fields
        grounds: [entities.SeatBlock.fields.seats_total, entities.SeatBlock.fields.seats_taken]
        distinguishing_aspect: "SeatBlock.seats_total is derived as seat_to - seat_from + 1 == 8 for seats 3..10, and seats_taken starts at 0."
        test_recipe:
          setup:
            - "A DRAFT Event with a RESERVED TicketType exists."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Seats Co", contact_email: "ops@seats.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Seats Hall", city: "Tucson", seated_capacity: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Seats Night", starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Orchestra", tier_rank: 2, price_cents: 5000, quantity_total: 8, seating_mode: "RESERVED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
          trigger:
            - call: "POST /api/seat-blocks"
              payload: { ticket_type_id: "${tt_id}", row_label: "A", seat_from: 3, seat_to: 10 }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { sb_id: $.data.id }
          assert:
            - "SeatBlock.${sb_id}.seats_total == 8"
            - "SeatBlock.${sb_id}.seats_taken == 0"

      - name: corner_client_supplied_system_fields_on_organizer_input_ignored
        claim_type: system_fields
        grounds: [entities.Organizer.fields.lifetime_gross_cents, entities.Organizer.fields.lifetime_refunds_cents]
        distinguishing_aspect: "POST /api/organizers ignores client-supplied id/version/lifetime_gross_cents: the server mints its own id, sets version 1 and lifetime_gross_cents 0."
        test_recipe:
          setup:
            - "Empty database except one Venue."
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Ignore Hall", city: "Mesa", seated_capacity: 50 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/organizers"
              payload: { display_name: "Ignore Co", contact_email: "ops@ignore.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
          assert:
            - "Organizer.${org_id}.version == 1"
            - "Organizer.${org_id}.lifetime_gross_cents == 0"
            - "Organizer.${org_id}.lifetime_refunds_cents == 0"
            - "Organizer.${org_id}.created_at is a server-stamped ISO 8601 UTC value with three fractional digits"

      - name: corner_promo_code_invalid_enum_kind_rejected
        claim_type: type_constraints
        grounds: [entities.PromoCode.fields.kind, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/promo-codes with kind 'BOGOF' (outside {PERCENT, FIXED}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A DRAFT Event exists."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Enum Co", contact_email: "ops@enum.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Enum Hall", city: "Akron", seated_capacity: 50 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Enum Night", starts_at: "2026-09-16T18:00:00Z", ends_at: "2026-09-16T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/promo-codes"
              payload: { event_id: "${ev_id}", code: "BAD", kind: "BOGOF", percent_bp: 500, amount_cents: 0, max_uses: 1, valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: corner_scan_record_is_append_only_event_log
        claim_type: immutability
        grounds: [entities.ScanRecord.fields.scanned_at, entities.ScanRecord.fields.scanned_by_user_id]
        distinguishing_aspect: "ScanRecord is declared common_fields false and §1.5 exposes only POST and GET for it: the created row carries scanned_at and scanned_by_user_id and no update endpoint exists."
        test_recipe:
          setup:
            - "ONSALE Event E starts 2026-08-01T18:00:00Z; Buyer B has one PAID Order producing one Attendee in status ISSUED."
            - "Logical clock at 2026-08-01T17:00:00Z, inside the check-in window that opens at 16:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Append Co", contact_email: "ops@append.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Append Hall", city: "Provo", seated_capacity: 60 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Append Night", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "vic@example.com", display_name: "Vic" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 1 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "GET /api/attendees"
              payload: { order_id: "${order_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { att_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T17:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/scans"
              payload: { attendee_id: "${att_id}", event_id: "${ev_id}", gate_code: "GATE-A" }
              as: GateStaff
              as_user_id: "gate-1"
              captures: { scan_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ScanRecord.${scan_id}.scanned_at == 2026-08-01T17:00:00.000Z"
            - "ScanRecord.${scan_id}.scanned_by_user_id == gate-1"
            - "ScanRecord.${scan_id}.gate_code == GATE-A"
            - "GET /api/scans?attendee_id=${att_id} returns total_count == 1"

      - name: corner_ticket_type_parent_event_missing_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.TicketType.fields.event_id, "errors[ERR_EVENT_NOT_FOUND]", "validations[priority=13]"]
        distinguishing_aspect: "POST /api/ticket-types with an unknown event_id returns 404 ERR_EVENT_NOT_FOUND instead of creating an orphan tier."
        test_recipe:
          setup:
            - "Organizer O exists; no Event has id 22222222-3333-4444-5555-666666666666."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Orphan Co", contact_email: "ops@orphan.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /api/ticket-types"
              payload: { event_id: "22222222-3333-4444-5555-666666666666", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_EVENT_NOT_FOUND"

      - name: corner_order_items_discoverable_only_via_filtered_list
        claim_type: creation
        grounds: [entities.OrderItem.fields.seat_block_id, entities.OrderItem.fields.per_ticket_fee_cents]
        distinguishing_aspect: "OrderItems are cascade-created by POST /api/orders and appear in no creation response; GET /api/order-items?seat_block_id=... is their only discovery channel and returns the line with per_ticket_fee_cents 364."
        test_recipe:
          setup:
            - "ONSALE Event E with RESERVED TicketType T (price 5000) and SeatBlock SB row A seats 1..10."
            - "Buyer B holds an unpaid Order for seats 5 and 6."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Reverse Co", contact_email: "ops@reverse.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Reverse Hall", city: "Spokane", seated_capacity: 100 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Reverse Night", starts_at: "2026-09-18T18:00:00Z", ends_at: "2026-09-18T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Orchestra", tier_rank: 2, price_cents: 5000, quantity_total: 10, seating_mode: "RESERVED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/seat-blocks"
              payload: { ticket_type_id: "${tt_id}", row_label: "A", seat_from: 1, seat_to: 10 }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "wes@example.com", display_name: "Wes" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", seat_block_id: "${sb_id}", quantity: 2, seat_numbers: [5, 6] }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /api/order-items"
              payload: { seat_block_id: "${sb_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { item_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "total_count == 1"
            - "OrderItem.${item_id}.order_id == ${order_id}"
            - "OrderItem.${item_id}.quantity == 2"
            - "OrderItem.${item_id}.unit_price_cents == 5000"
            - "OrderItem.${item_id}.per_ticket_fee_cents == 364"
            - "OrderItem.${item_id}.line_face_cents == 10000"
            - "OrderItem.${item_id}.line_fee_cents == 728"

  - section: state_machines
    instances:

      - name: corner_publish_without_ticket_type_returns_invalid_event_transition
        claim_type: precondition_enforcement
        grounds: [state_machines.Event.DRAFT_to_ONSALE, "validations[priority=41]", "errors[ERR_INVALID_EVENT_TRANSITION]"]
        distinguishing_aspect: "POST /api/events/{id}/publish on a DRAFT Event with zero TicketTypes returns 409 ERR_INVALID_EVENT_TRANSITION and leaves status DRAFT."
        test_recipe:
          setup:
            - "Event E is DRAFT and has no TicketType."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "NoTier Co", contact_email: "ops@notier.example" }
