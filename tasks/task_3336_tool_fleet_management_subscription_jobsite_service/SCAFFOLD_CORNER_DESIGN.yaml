      - name: theft_claim_auto_expires_on_clock_sweep
        claim_type: automatic_transition
        grounds: [state_machines.TheftClaim.REPORTED_to_EXPIRED]
        distinguishing_aspect: "Advancing the logical clock past reported_at + 48h without verification moves the claim to EXPIRED and decrements the agreement's theft_claim_count."
        test_recipe:
          setup: ["DEPLOYED asset with a REPORTED claim at 2026-09-01T00:00:00Z; agreement theft_claim_count == 1"]
          setup_api_calls:
