scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: branch_creation_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Branch.fields.surge_mode"
          - "entities.Branch.fields.status"
        distinguishing_aspect: "Creating a Branch without surge_mode/status applies defaults NORMAL and ACTIVE and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-E1", name: "Ent", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_e1: $.data.id }
          assert:
            - "Branch.${br_e1}.surge_mode == NORMAL"
            - "Branch.${br_e1}.status == ACTIVE"
            - "Branch.${br_e1}.version == 1"

      - name: product_requires_certified_installer_defaults_false
        claim_type: defaults
        grounds:
          - "entities.Product.fields.requires_certified_installer"
        distinguishing_aspect: "Omitting requires_certified_installer on product creation defaults it to false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /roofing/products"
              payload: { sku: "SH-E2", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_e2: $.data.id }
          assert:
            - "Product.${prod_e2}.requires_certified_installer == false"
            - "Product.${prod_e2}.status == ACTIVE"

      - name: inventory_lot_available_bundles_computed
        claim_type: computed_field
        grounds:
          - "entities.InventoryLot.fields.available_bundles"
        distinguishing_aspect: "available_bundles is read-only computed as on_hand - reserved; input for it is ignored."
        test_recipe:
          setup: ["branch + product exist"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-E3", name: "Ent3", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_e3: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-E3", manufacturer_name: "Acme", color_code: "GRY", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_e3: $.data.id }
          trigger:
            - call: "POST /roofing/branches/${br_e3}/inventory-lots"
              payload: { product_id: "${prod_e3}", lot_code: "LOT-E3", on_hand_bundles: 120 }
              as: WarehouseClerk
              captures: { lot_e3: $.data.id }
          assert:
            - "InventoryLot.${lot_e3}.available_bundles == 120"
            - "InventoryLot.${lot_e3}.reserved_bundles == 0"

      - name: warranty_registration_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.WarrantyRegistration"
        distinguishing_aspect: "WarrantyRegistration has common_fields: false — response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["delivered order for a non-cert product by a certified-agnostic contractor"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-E4", name: "Ent4", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_e4: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-E4", manufacturer_name: "Acme", color_code: "TAN", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_e4: $.data.id }
            - call: "POST /roofing/branches/${br_e4}/inventory-lots"
              payload: { product_id: "${prod_e4}", lot_code: "LOT-E4", on_hand_bundles: 100 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Warr Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_e4: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_e4}/job-accounts"
              payload: { job_name: "Job E4", site_address: "20 Elm St" }
              as: CreditAnalyst
              captures: { ja_e4: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_e4}/takeoffs"
              payload: { product_id: "${prod_e4}", roof_squares: 5.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_e4: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_e4}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_e4}/convert"
              payload: { branch_id: "${br_e4}" }
              as: Contractor
              as_user_id: "${ca_e4}"
              captures: { ord_e4: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_e4}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_e4_v: $.data.version }
            - call: "POST /roofing/orders/${ord_e4}/confirm"
              payload: { expected_contractor_account_version: "${ca_e4_v}" }
              as: Contractor
              as_user_id: "${ca_e4}"
            - call: "POST /roofing/branches/${br_e4}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_e4: $.data.id }
            - call: "POST /roofing/orders/${ord_e4}/deliveries"
              payload: { delivery_slot_id: "${slot_e4}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_e4: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_e4}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_e4}/complete"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /roofing/orders/${ord_e4}/warranty-registrations"
              payload: {}
              as: Contractor
              as_user_id: "${ca_e4}"
              captures: { wr_e4: $.data.id }
          assert:
            - "WarrantyRegistration response has id and created_at but no version field"
            - "WarrantyRegistration.${wr_e4}.certification_verified == true (product does not require certification)"
            - "WarrantyRegistration.${wr_e4}.registered_bundles == 15 (delivered 15, returned 0)"

      - name: get_nonexistent_order_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_ORDER_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET on a random UUID order id yields 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /roofing/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SalesRep
              captures: { err_e5: $.data.error_id }
          assert:
            - "Response status == 404 and error_id == ERR_ORDER_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: takeoff_starts_in_draft
        claim_type: initial_state
        grounds:
          - "state_machines.MaterialTakeoff"
        distinguishing_aspect: "A newly created MaterialTakeoff starts in DRAFT."
        test_recipe:
          setup: ["branch, product, contractor, job account exist"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM1", name: "SM1", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm1: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm1}/job-accounts"
              payload: { job_name: "Job SM1", site_address: "21 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm1: $.data.id }
          trigger:
            - call: "POST /roofing/job-accounts/${ja_sm1}/takeoffs"
              payload: { product_id: "${prod_sm1}", roof_squares: 8.0, waste_factor_pct: 5, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm1: $.data.id }
          assert:
            - "MaterialTakeoff.${tk_sm1}.status == DRAFT"

      - name: takeoff_convert_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.MaterialTakeoff.transitions"
          - "errors[ERR_TAKEOFF_NOT_QUOTED]"
        distinguishing_aspect: "Convert on a DRAFT takeoff fails with ERR_TAKEOFF_NOT_QUOTED; only QUOTED -> CONVERTED is valid."
        test_recipe:
          setup: ["DRAFT takeoff exists"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM2", name: "SM2", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm2: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM2 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm2: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm2}/job-accounts"
              payload: { job_name: "Job SM2", site_address: "22 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm2: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_sm2}/takeoffs"
              payload: { product_id: "${prod_sm2}", roof_squares: 8.0, waste_factor_pct: 5, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm2: $.data.id }
          trigger:
            - call: "POST /roofing/takeoffs/${tk_sm2}/convert"
              payload: { branch_id: "${br_sm2}" }
              as: Contractor
              as_user_id: "${ca_sm2}"
              captures: { err_sm2: $.data.error_id }
          assert:
            - "Convert rejected with ERR_TAKEOFF_NOT_QUOTED"

      - name: takeoff_revise_quote_cycle_returns_to_draft
        claim_type: valid_transition
        grounds:
          - "state_machines.MaterialTakeoff.QUOTED_to_DRAFT"
        distinguishing_aspect: "QUOTED takeoff can be revised back to DRAFT (cyclic revision loop), distinct from linear pipelines."
        test_recipe:
          setup: ["QUOTED takeoff"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM3", name: "SM3", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm3: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM3 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm3: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm3}/job-accounts"
              payload: { job_name: "Job SM3", site_address: "23 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm3: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_sm3}/takeoffs"
              payload: { product_id: "${prod_sm3}", roof_squares: 8.0, waste_factor_pct: 5, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm3: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_sm3}/quote"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /roofing/takeoffs/${tk_sm3}/revise"
              payload: {}
              as: SalesRep
          assert:
            - "MaterialTakeoff.${tk_sm3}.status == DRAFT after revise"

      - name: delivery_terminal_delivered_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Delivery"
          - "errors[ERR_DELIVERY_NOT_EN_ROUTE]"
        distinguishing_aspect: "After DELIVERED, dispatch/fail/reschedule are all rejected — terminal state accepts no further transitions."
        test_recipe:
          setup: ["delivery in DELIVERED"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM4", name: "SM4", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm4: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-SM4", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_sm4: $.data.id }
            - call: "POST /roofing/branches/${br_sm4}/inventory-lots"
              payload: { product_id: "${prod_sm4}", lot_code: "LOT-SM4", on_hand_bundles: 100 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM4 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm4: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm4}/job-accounts"
              payload: { job_name: "Job SM4", site_address: "24 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm4: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_sm4}/takeoffs"
              payload: { product_id: "${prod_sm4}", roof_squares: 5.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm4: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_sm4}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_sm4}/convert"
              payload: { branch_id: "${br_sm4}" }
              as: Contractor
              as_user_id: "${ca_sm4}"
              captures: { ord_sm4: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_sm4}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_sm4_v: $.data.version }
            - call: "POST /roofing/orders/${ord_sm4}/confirm"
              payload: { expected_contractor_account_version: "${ca_sm4_v}" }
              as: Contractor
              as_user_id: "${ca_sm4}"
            - call: "POST /roofing/branches/${br_sm4}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_sm4: $.data.id }
            - call: "POST /roofing/orders/${ord_sm4}/deliveries"
              payload: { delivery_slot_id: "${slot_sm4}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_sm4: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_sm4}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_sm4}/complete"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /roofing/deliveries/${dlv_sm4}/fail"
              payload: {}
              as: Dispatcher
              captures: { err_sm4: $.data.error_id }
          assert:
            - "fail on DELIVERED delivery rejected with ERR_DELIVERY_NOT_EN_ROUTE"

      - name: order_cancel_releases_lot_reservation
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Order.CONFIRMED_to_CANCELLED"
          - "entities.InventoryLot.fields.reserved_bundles"
        distinguishing_aspect: "Cancelling a CONFIRMED order decrements the reserved_bundles on every reserved lot and releases the credit hold."
        test_recipe:
          setup: ["CONFIRMED order for 30 bundles on lot with 100 on_hand; no deliveries scheduled"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM5", name: "SM5", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm5: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-SM5", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_sm5: $.data.id }
            - call: "POST /roofing/branches/${br_sm5}/inventory-lots"
              payload: { product_id: "${prod_sm5}", lot_code: "LOT-SM5", on_hand_bundles: 100 }
              as: WarehouseClerk
              captures: { lot_sm5: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM5 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm5: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm5}/job-accounts"
              payload: { job_name: "Job SM5", site_address: "25 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm5: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_sm5}/takeoffs"
              payload: { product_id: "${prod_sm5}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm5: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_sm5}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_sm5}/convert"
              payload: { branch_id: "${br_sm5}" }
              as: Contractor
              as_user_id: "${ca_sm5}"
              captures: { ord_sm5: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_sm5}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_sm5_v: $.data.version }
            - call: "POST /roofing/orders/${ord_sm5}/confirm"
              payload: { expected_contractor_account_version: "${ca_sm5_v}" }
              as: Contractor
              as_user_id: "${ca_sm5}"
          trigger:
            - call: "POST /roofing/orders/${ord_sm5}/cancel"
              payload: {}
              as: SalesRep
            - call: "GET /roofing/inventory-lots/${lot_sm5}"
              payload: {}
              as: WarehouseClerk
              captures: { lot_sm5_res: $.data.reserved_bundles }
          assert:
            - "Order.${ord_sm5}.status == CANCELLED"
            - "InventoryLot.${lot_sm5}.reserved_bundles == 0 after cancel"

      - name: order_close_blocked_by_open_return
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Order.CONFIRMED_to_CLOSED"
          - "errors[ERR_OPEN_RETURNS_EXIST]"
        distinguishing_aspect: "Close is rejected while a Return on the order is still REQUESTED — child non-terminal state gates the parent transition."
        test_recipe:
          setup: ["Delivered+invoiced+paid order with one REQUESTED return"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-SM6", name: "SM6", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_sm6: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-SM6", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_sm6: $.data.id }
            - call: "POST /roofing/branches/${br_sm6}/inventory-lots"
              payload: { product_id: "${prod_sm6}", lot_code: "LOT-SM6", on_hand_bundles: 100 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "SM6 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_sm6: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_sm6}/job-accounts"
              payload: { job_name: "Job SM6", site_address: "26 Oak St" }
              as: CreditAnalyst
              captures: { ja_sm6: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_sm6}/takeoffs"
              payload: { product_id: "${prod_sm6}", roof_squares: 5.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_sm6: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_sm6}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_sm6}/convert"
              payload: { branch_id: "${br_sm6}" }
              as: Contractor
              as_user_id: "${ca_sm6}"
              captures: { ord_sm6: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_sm6}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_sm6_v: $.data.version }
            - call: "POST /roofing/orders/${ord_sm6}/confirm"
              payload: { expected_contractor_account_version: "${ca_sm6_v}" }
              as: Contractor
              as_user_id: "${ca_sm6}"
            - call: "POST /roofing/branches/${br_sm6}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_sm6: $.data.id }
            - call: "POST /roofing/orders/${ord_sm6}/deliveries"
              payload: { delivery_slot_id: "${slot_sm6}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_sm6: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_sm6}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_sm6}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/orders/${ord_sm6}/invoice"
              payload: {}
              as: CreditAnalyst
            - call: "GET /roofing/orders/${ord_sm6}"
              payload: {}
              as: CreditAnalyst
              captures: { ord_sm6_total: $.data.total_cents }
            - call: "POST /roofing/contractor-accounts/${ca_sm6}/payments"
              payload: { amount_cents: 38500, job_account_id: "${ja_sm6}" }
              as: CreditAnalyst
            - call: "GET /roofing/orders/${ord_sm6}/lines"
              payload: {}
              as: WarehouseClerk
              captures: { line_sm6: "$.data[0].id" }
            - call: "POST /roofing/orders/${ord_sm6}/returns"
              payload: { order_line_id: "${line_sm6}", quantity_bundles: 2, opened_bundles: 0 }
              as: Contractor
              as_user_id: "${ca_sm6}"
          trigger:
            - call: "POST /roofing/orders/${ord_sm6}/close"
              payload: {}
              as: SalesRep
              captures: { err_sm6: $.data.error_id }
          assert:
            - "Close rejected with ERR_OPEN_RETURNS_EXIST"

      - name: payment_covers_invoice_flips_payment_status_paid
        claim_type: side_effect_execution
        grounds:
          - "endpoints.POST_/roofing/contractor-accounts/{accountId}/payments"
          - "entities.Order.fields.payment_status"
        distinguishing_aspect: "Posting a payment >= invoiced total flips the order's payment_status to PAID and reduces open_balance."
        test_recipe:
