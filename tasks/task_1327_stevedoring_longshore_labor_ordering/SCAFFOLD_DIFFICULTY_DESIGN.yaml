              payload: { vessel_name: "MV Full", voyage_number: "B-203", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
