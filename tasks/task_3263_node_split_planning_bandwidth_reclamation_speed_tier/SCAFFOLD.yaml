# =============================================================================
# SCAFFOLD — Node Split Planning, Bandwidth Reclamation & Speed Tier Provisioning
# Cable MSO capacity-engineering operations benchmark (harder-than-expert profile)
# =============================================================================

scenario: |
  Node Split Planning, Bandwidth Reclamation & Speed Tier Provisioning (Comcast):
  service group utilization monitoring with thresholds that trigger capacity actions,
  node split engineering to reduce the number of homes sharing capacity with
  construction scheduling, spectrum reclamation from legacy video services to expand
  data capacity with customer equipment migration, speed tier provisioning through
  configuration files with modem capability validation, upstream capacity constraints
  and mid-split or high-split upgrades with equipment requirements, customer premises
  equipment refresh campaigns to enable higher tiers, congestion complaint
  investigation distinguishing plant, in-home and destination causes, franchise
  obligations and construction permitting affecting build timelines

domain_name: node-split-planning-bandwidth-reclamation-speed-tier
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation          # finite downstream/upstream spectrum and homes competed for by service groups, tiers, and reclamation
  secondary_archetype: workflow orchestration    # node-split projects gated by municipal permitting and franchise blackouts
  complexity_layers:
    - rate_threshold_triggers                    # utilization thresholds auto-trigger capacity actions
    - cascading_side_effects                     # cutover / reclaim-completion cascades span 4+ entities
    - derived_field_reconciliation               # capacity, load, posture recomputed from blocks/samples
    - optimistic_concurrency                     # OCC on ServiceGroup / CustomerPremise / NodeSplitProject version
    - scheduled_deferred_actions                 # construction windows, migration-wave windows, franchise blackout dates
  entity_topology: hybrid                        # FA -> ON -> SG tree with cross-cutting SpeedTier references
  state_machine_shape: cyclic                    # revise/retry/reopen/refile loops + posture up/down cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # ProvisioningRequest -> SpeedTier; CustomerPremise -> SpeedTier
  role_model: peer_roles                         # planner / engineer / field ops / franchise admin / provisioning / care
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 10
  calculation_count: 8
  endpoint_count: 66
  error_code_count: 24
  role_count: 8

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FranchiseArea
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Franchise area display name" }
      - { name: region_code, type: string, source: input, description: "Municipal region code" }
      - { name: obligation_homes_required, type: integer, source: input, description: "Franchise build-out obligation: homes that must be serviceable by obligation_deadline" }
      - { name: obligation_deadline, type: datetime, source: input, description: "ISO8601 date by which obligation_homes_required must be serviceable" }
      - { name: blackout_windows, type: array, source: input, description: "Array of {start, end} ISO8601 closed intervals during which no construction window may be scheduled (moratorium dates)", default: [] }
      - { name: homes_built_progress, type: integer, source: computed, description: "Sum of homes_passed over all ServiceGroups with posture != SPLIT_RETIRED on OpticalNodes of this franchise area" }

  - name: OpticalNode
    parent: FranchiseArea
    common_fields: true
    fields:
      - { name: franchise_area_id, type: string, source: input, description: "FK -> FranchiseArea.id" }
      - { name: node_code, type: string, source: input, description: "Engineering node code, unique per franchise area" }
      - { name: homes_passed, type: integer, source: input, description: "Homes passed by this node" }
      - { name: downstream_spectrum_mhz, type: integer, source: input, description: "Total downstream spectrum in MHz; conserved across block creation and reclamation" }
      - { name: upstream_config, type: enum, source: system, description: "LEGACY | MID_SPLIT | HIGH_SPLIT; starts LEGACY unless given at creation; changed only by upgrade capacity-action completion", constraints: "enum LEGACY, MID_SPLIT, HIGH_SPLIT; input at creation, thereafter system-mutated" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SPLIT_RETIRED; SPLIT_RETIRED set by node-split cutover", constraints: "enum ACTIVE, SPLIT_RETIRED" }

  - name: SpectrumBlock
    parent: OpticalNode
    common_fields: true
    fields:
      - { name: optical_node_id, type: string, source: input, description: "FK -> OpticalNode.id" }
      - { name: block_type, type: enum, source: input, description: "LEGACY_VIDEO | DATA", constraints: "enum LEGACY_VIDEO, DATA" }
      - { name: mhz, type: integer, source: input, description: "Block width in MHz; sum over blocks of a node must never exceed downstream_spectrum_mhz" }
      - { name: status, type: enum, source: system, description: "VIDEO_ACTIVE | RECLAIM_PENDING | DATA_ACTIVE; DATA blocks start DATA_ACTIVE, LEGACY_VIDEO blocks start VIDEO_ACTIVE", constraints: "enum VIDEO_ACTIVE, RECLAIM_PENDING, DATA_ACTIVE" }
      - { name: channels, type: integer, source: computed, description: "floor(mhz / 6); per-block truncation, never computed from summed MHz" }
      - { name: capacity_mbps, type: integer, source: computed, description: "channels * 38 for DATA_ACTIVE blocks; 0 for VIDEO_ACTIVE and RECLAIM_PENDING blocks" }

  - name: ServiceGroup
    parent: OpticalNode
    common_fields: true
    fields:
      - { name: optical_node_id, type: string, source: input, description: "FK -> OpticalNode.id" }
      - { name: sg_code, type: string, source: input, description: "Service group code, unique per node" }
      - { name: homes_passed, type: integer, source: input, description: "Homes served by this service group; sum over a node's non-retired service groups must be <= node.homes_passed" }
      - { name: warn_threshold_pct, type: integer, source: input, description: "Utilization percent at or above which posture becomes ELEVATED" }
      - { name: critical_threshold_pct, type: integer, source: input, description: "Utilization percent at or above which posture becomes CRITICAL" }
      - { name: utilization_method, type: enum, source: input, description: "PEAK_PCT95 | SUSTAINED_AVG; selects the load aggregation variant", constraints: "enum PEAK_PCT95, SUSTAINED_AVG" }
      - { name: downstream_capacity_mbps, type: integer, source: computed, description: "Sum of capacity_mbps over DATA_ACTIVE SpectrumBlocks of the parent node" }
      - { name: upstream_capacity_mbps, type: integer, source: computed, description: "Lookup from node.upstream_config: LEGACY=27, MID_SPLIT=108, HIGH_SPLIT=204" }
      - { name: provisioned_downstream_mbps, type: integer, source: computed, description: "Sum of provisioned_downstream_mbps over CustomerPremises of this service group" }
      - { name: current_load_mbps, type: integer, source: computed, description: "Aggregated downstream load per calculations.sg_utilization over the trailing 7-day window" }
      - { name: current_utilization_pct, type: number, source: computed, description: "round_half_up(current_load_mbps * 100 / downstream_capacity_mbps, 1 decimal); 0.0 when capacity is 0" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | ELEVATED | CRITICAL | SPLIT_RETIRED; derived band of current_utilization_pct vs thresholds; SPLIT_RETIRED set by cutover", constraints: "enum NORMAL, ELEVATED, CRITICAL, SPLIT_RETIRED" }

  - name: UtilizationSample
    parent: ServiceGroup
    common_fields: false
    fields:
      - { name: service_group_id, type: string, source: input, description: "FK -> ServiceGroup.id" }
      - { name: measured_at, type: datetime, source: input, description: "ISO8601 measurement timestamp; only samples inside [now-7d, now] count toward load aggregation" }
      - { name: downstream_mbps, type: integer, source: input, description: "Measured downstream load in Mbps" }
      - { name: upstream_mbps, type: integer, source: input, description: "Measured upstream load in Mbps" }

  - name: CapacityAction
    parent: ServiceGroup
    common_fields: true
    fields:
      - { name: service_group_id, type: string, source: input, description: "FK -> ServiceGroup.id" }
      - { name: action_type, type: enum, source: input, description: "NODE_SPLIT | SPECTRUM_RECLAIM | MID_SPLIT_UPGRADE | HIGH_SPLIT_UPGRADE", constraints: "enum NODE_SPLIT, SPECTRUM_RECLAIM, MID_SPLIT_UPGRADE, HIGH_SPLIT_UPGRADE" }
      - { name: origin, type: enum, source: system, description: "SYSTEM when auto-created by a CRITICAL threshold breach, MANUAL when created via POST", constraints: "enum SYSTEM, MANUAL" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "enum PROPOSED, APPROVED, IN_PROGRESS, COMPLETED, CANCELLED" }
      - { name: target_block_ids, type: array, source: input, description: "For SPECTRUM_RECLAIM: SpectrumBlock ids to convert VIDEO_ACTIVE -> DATA_ACTIVE; at least one VIDEO_ACTIVE block must remain untargeted on the node" }
      - { name: target_upstream_config, type: enum, source: input, description: "For upgrades: must be exactly one step above node.upstream_config (LEGACY->MID_SPLIT, MID_SPLIT->HIGH_SPLIT)", constraints: "enum MID_SPLIT, HIGH_SPLIT" }
      - { name: superseded_by_id, type: string, source: system, description: "Set when a PROPOSED action is cancelled by a newer superseding action" }
      - { name: note, type: string, source: input, description: "Free-form planner note" }

  - name: NodeSplitProject
    parent: CapacityAction
    common_fields: true
    fields:
      - { name: capacity_action_id, type: string, source: input, description: "FK -> CapacityAction.id; parent action must have action_type NODE_SPLIT" }
      - { name: child_count, type: integer, source: input, description: "Number of child service groups created at cutover (2..4)" }
      - { name: min_homes_per_child, type: integer, source: input, description: "Minimum homes each child service group must receive" }
      - { name: max_homes_per_child, type: integer, source: input, description: "Maximum homes each child service group may receive" }
      - { name: status, type: enum, source: system, description: "PERMIT_REVIEW | PERMIT_GRANTED | PERMIT_DENIED | SCHEDULED | IN_CONSTRUCTION | COMPLETED | CANCELLED", constraints: "enum PERMIT_REVIEW, PERMIT_GRANTED, PERMIT_DENIED, SCHEDULED, IN_CONSTRUCTION, COMPLETED, CANCELLED" }
      - { name: window_start, type: datetime, source: input, description: "Construction window start (ISO8601); half-open interval [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Construction window end (ISO8601), exclusive" }
      - { name: child_allocations, type: array, source: system, description: "Homes per child computed at cutover by calculations.node_split_homes_allocation" }
      - { name: child_node_id, type: string, source: system, description: "New OpticalNode created at cutover; null until cutover" }
      - { name: child_service_group_ids, type: array, source: system, description: "New ServiceGroup ids created at cutover; empty until cutover" }

  - name: MigrationWave
    parent: CapacityAction
    common_fields: true
    fields:
      - { name: capacity_action_id, type: string, source: input, description: "FK -> CapacityAction.id; parent action must have action_type SPECTRUM_RECLAIM" }
      - { name: wave_code, type: string, source: input, description: "Wave identifier unique within the parent action" }
      - { name: window_start, type: datetime, source: input, description: "Wave execution window start (ISO8601)" }
      - { name: window_end, type: datetime, source: input, description: "Wave execution window end (ISO8601); windows of waves under the same action must be separated by >= 7 full days" }
      - { name: target_cpe_ids, type: array, source: input, description: "CustomerEquipment ids to migrate off legacy video in this wave" }
      - { name: migrated_count, type: integer, source: computed, description: "Count of target CPE flipped to video_legacy=false by execute" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | CANCELLED", constraints: "enum PLANNED, EXECUTED, CANCELLED" }

  - name: CustomerPremise
    parent: ServiceGroup
    common_fields: true
    fields:
      - { name: service_group_id, type: string, source: input, description: "FK -> ServiceGroup.id" }
      - { name: premise_ref, type: string, source: input, description: "External billing reference" }
      - { name: address, type: string, source: input, description: "Service address" }
      - { name: current_tier_id, type: string, source: system, description: "FK -> SpeedTier.id; nullable; set by ProvisioningRequest activation, cleared by cancellation" }
      - { name: provisioned_downstream_mbps, type: integer, source: computed, description: "Downstream Mbps of the currently ACTIVE provisioning request's tier; 0 when none" }

  - name: CustomerEquipment
    parent: CustomerPremise
    common_fields: true
    fields:
      - { name: customer_premise_id, type: string, source: input, description: "FK -> CustomerPremise.id" }
      - { name: model, type: string, source: input, description: "Modem/eMTA model string" }
      - { name: docsis_version, type: string, source: input, description: "DOCSIS version label, e.g. 3.0 / 3.1 / 4.0" }
      - { name: capability_class, type: enum, source: input, description: "D30 | D31 | D40; rank D30 < D31 < D40", constraints: "enum D30, D31, D40" }
      - { name: max_downstream_mbps, type: integer, source: input, description: "Hardware downstream ceiling in Mbps" }
      - { name: video_legacy, type: boolean, source: input, description: "True while the device still consumes legacy video QAM; flipped false by migration-wave execute" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED set by swap", constraints: "enum ACTIVE, RETIRED" }

  - name: SpeedTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: string, source: input, description: "Marketing tier code, unique" }
      - { name: downstream_mbps, type: integer, source: input, description: "Tier downstream rate" }
      - { name: upstream_mbps, type: integer, source: input, description: "Tier upstream rate" }
      - { name: min_capability_class, type: enum, source: input, description: "Minimum CPE capability_class required: D30 | D31 | D40", constraints: "enum D30, D31, D40" }
      - { name: min_upstream_config, type: enum, source: input, description: "Minimum node upstream_config required: LEGACY | MID_SPLIT | HIGH_SPLIT", constraints: "enum LEGACY, MID_SPLIT, HIGH_SPLIT" }
      - { name: status, type: enum, source: system, description: "PUBLISHED at creation; RETIRED via retire", constraints: "enum PUBLISHED, RETIRED" }

  - name: ProvisioningRequest
    parent: CustomerPremise
    common_fields: true
    fields:
      - { name: customer_premise_id, type: string, source: input, description: "FK -> CustomerPremise.id" }
      - { name: speed_tier_id, type: string, source: input, description: "FK -> SpeedTier.id" }
      - { name: status, type: enum, source: system, description: "PENDING | VALIDATED | FAILED | ACTIVE | CANCELLED", constraints: "enum PENDING, VALIDATED, FAILED, ACTIVE, CANCELLED" }
      - { name: config_file_content, type: string, source: computed, description: "Generated at successful validate: TIER=<tier_code>;DS=<downstream_mbps>;US=<upstream_mbps>;CPE=<capability_class>; null while PENDING/FAILED" }
      - { name: failure_reason, type: string, source: system, description: "Error id of the failing validation when status FAILED; null otherwise" }

  - name: RefreshCampaign
    parent: FranchiseArea
    common_fields: true
    fields:
      - { name: franchise_area_id, type: string, source: input, description: "FK -> FranchiseArea.id" }
      - { name: campaign_code, type: string, source: input, description: "Campaign identifier unique per franchise area" }
      - { name: target_capability_class, type: enum, source: input, description: "D31 | D40; campaign targets ACTIVE equipment whose capability_class ranks below this", constraints: "enum D31, D40" }
      - { name: status, type: enum, source: system, description: "DRAFT | LAUNCHED | CLOSED", constraints: "enum DRAFT, LAUNCHED, CLOSED" }
      - { name: targeted_count, type: integer, source: computed, description: "Computed at launch: count of ACTIVE CustomerEquipment in the franchise area below target_capability_class" }
      - { name: swapped_count, type: integer, source: computed, description: "Count of swaps executed with refresh_campaign_id = this campaign while LAUNCHED" }

  - name: CongestionComplaint
    parent: CustomerPremise
    common_fields: true
    fields:
      - { name: customer_premise_id, type: string, source: input, description: "FK -> CustomerPremise.id" }
      - { name: description, type: string, source: input, description: "Free-text complaint narrative" }
      - { name: plant_signal, type: integer, source: input, description: "0..100 plant-health signal strength from field diagnostics" }
      - { name: home_signal, type: integer, source: input, description: "0..100 in-home-wiring signal strength" }
      - { name: destination_signal, type: integer, source: input, description: "0..100 destination/network-peer signal strength" }
      - { name: scoring_variant_used, type: enum, source: system, description: "EVIDENCE_WEIGHTED | RECENCY_WEIGHTED; recorded at classify", constraints: "enum EVIDENCE_WEIGHTED, RECENCY_WEIGHTED" }
      - { name: score_plant, type: number, source: computed, description: "Plant cause score computed at classify per calculations.complaint_cause_scores; 1 decimal" }
      - { name: score_in_home, type: number, source: computed, description: "In-home cause score computed at classify; 1 decimal" }
      - { name: score_destination, type: number, source: computed, description: "Destination cause score computed at classify; 1 decimal" }
      - { name: cause_category, type: enum, source: input, description: "PLANT | IN_HOME | DESTINATION; must equal the computed argmax at classify", constraints: "enum PLANT, IN_HOME, DESTINATION; null until classify" }
      - { name: status, type: enum, source: system, description: "INVESTIGATING | CLASSIFIED | RESOLVED | CLOSED", constraints: "enum INVESTIGATING, CLASSIFIED, RESOLVED, CLOSED" }
      - { name: resolution_note, type: string, source: input, description: "Resolution summary recorded at resolve" }
      - { name: reopen_count, type: integer, source: system, description: "Number of times reopened from RESOLVED; starts 0", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceGroup
    field: posture
    initial_state: NORMAL
    terminal_states: [SPLIT_RETIRED]
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "system (sample ingest recompute: current_utilization_pct >= warn_threshold_pct and < critical_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [NORMAL, ELEVATED]
        to: CRITICAL
        trigger: "system (sample ingest recompute: current_utilization_pct >= critical_threshold_pct)"
        actor: system
        preconditions: []
        side_effects:
          - "If no CapacityAction of this ServiceGroup is in PROPOSED, APPROVED, or IN_PROGRESS, system creates one with origin=SYSTEM: SPECTRUM_RECLAIM if the node has >= 2 VIDEO_ACTIVE blocks, else MID_SPLIT_UPGRADE if node.upstream_config == LEGACY, else HIGH_SPLIT_UPGRADE if node.upstream_config == MID_SPLIT, else NODE_SPLIT"
      - from: [CRITICAL, ELEVATED]
        to: NORMAL
        trigger: "system (recompute after sample ingest or capacity change: current_utilization_pct < warn_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CRITICAL
        to: ELEVATED
        trigger: "system (recompute: warn_threshold_pct <= current_utilization_pct < critical_threshold_pct, e.g. after reclaim completion raises capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [NORMAL, ELEVATED, CRITICAL]
        to: SPLIT_RETIRED
        trigger: "system (node-split cutover completes on the parent node's last non-retired service group)"
        actor: system
        preconditions: []
        side_effects:
          - "homes_passed set to 0"
          - "current_load_mbps and current_utilization_pct frozen at 0 / 0.0"

  - entity: CapacityAction
    field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /capacity-actions/{id}/approve"
        actor: CapacityEngineer
        preconditions:
          - "ServiceGroup posture != SPLIT_RETIRED"
        side_effects: []
      - from: APPROVED
        to: PROPOSED
        trigger: "POST /capacity-actions/{id}/revise"
        actor: CapacityEngineer
        preconditions: []
        side_effects:
          - "Linked NodeSplitProject in PERMIT_REVIEW, PERMIT_GRANTED, PERMIT_DENIED, or SCHEDULED is set to CANCELLED"
          - "Linked MigrationWaves in PLANNED are set to CANCELLED"
        note: "Revision loop: an approved plan can be sent back for rework"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /capacity-actions/{id}/begin"
        actor: CapacityEngineer
        preconditions:
          - "For SPECTRUM_RECLAIM: every target block is VIDEO_ACTIVE on the action's node and at least one VIDEO_ACTIVE block on the node is NOT targeted"
          - "For MID_SPLIT_UPGRADE: node.upstream_config == LEGACY"
          - "For HIGH_SPLIT_UPGRADE: node.upstream_config == MID_SPLIT"
        side_effects:
          - "For SPECTRUM_RECLAIM: each target SpectrumBlock status -> RECLAIM_PENDING (its capacity_mbps stays 0)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /capacity-actions/{id}/complete (reclaim/upgrade) or system (node-split cutover)"
        actor: CapacityEngineer
        preconditions:
          - "For SPECTRUM_RECLAIM: every linked MigrationWave is EXECUTED or CANCELLED and at least one is EXECUTED"
          - "For upgrades: no precondition beyond IN_PROGRESS"
        side_effects:
          - "For SPECTRUM_RECLAIM: each target block status -> DATA_ACTIVE; ServiceGroup.downstream_capacity_mbps recomputed; posture recomputed (may de-escalate)"
          - "For upgrades: node.upstream_config := target_upstream_config; upstream_capacity_mbps recomputed on every non-retired ServiceGroup of the node"
      - from: [PROPOSED, APPROVED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /capacity-actions/{id}/cancel or system (superseded by a newer CapacityAction creation)"
        actor: CapacityEngineer
        preconditions:
          - "Manual cancel only from PROPOSED or APPROVED; IN_PROGRESS cancel allowed only while no linked NodeSplitProject is IN_CONSTRUCTION"
        side_effects:
          - "For SPECTRUM_RECLAIM: any target block in RECLAIM_PENDING returns to VIDEO_ACTIVE (spectrum conservation)"
          - "Linked NodeSplitProject in a non-terminal state -> CANCELLED"
          - "Linked MigrationWaves in PLANNED -> CANCELLED"

  - entity: NodeSplitProject
    field: status
    initial_state: PERMIT_REVIEW
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PERMIT_REVIEW
        to: PERMIT_GRANTED
        trigger: "POST /node-split-projects/{id}/adjudicate-permit with decision=GRANTED"
        actor: FranchiseAdmin
        preconditions: []
        side_effects: []
      - from: PERMIT_REVIEW
        to: PERMIT_DENIED
        trigger: "POST /node-split-projects/{id}/adjudicate-permit with decision=DENIED"
        actor: FranchiseAdmin
        preconditions: []
        side_effects: []
      - from: PERMIT_DENIED
        to: PERMIT_REVIEW
        trigger: "POST /node-split-projects/{id}/refile-permit"
        actor: FranchiseAdmin
        preconditions: []
        side_effects: []
        note: "Permit re-file cycle: denied applications can be refiled repeatedly"
      - from: PERMIT_GRANTED
        to: SCHEDULED
        trigger: "POST /node-split-projects/{id}/schedule"
        actor: NetworkPlanner
        preconditions:
          - "expected_node_split_project_version matches current version (OCC)"
          - "window_start < window_end"
          - "No other NodeSplitProject in SCHEDULED or IN_CONSTRUCTION under the same franchise area has a half-open window overlapping [window_start, window_end); touching endpoints (end == start) do not overlap"
          - "[window_start, window_end] does not intersect any franchise blackout_windows entry (blackout intervals are closed on both ends)"
        side_effects:
          - "increments NodeSplitProject.version by 1"
      - from: SCHEDULED
        to: IN_CONSTRUCTION
        trigger: "POST /node-split-projects/{id}/begin-construction"
        actor: FieldOpsCoordinator
        preconditions:
          - "Parent CapacityAction is IN_PROGRESS"
        side_effects: []
      - from: IN_CONSTRUCTION
        to: COMPLETED
        trigger: "POST /node-split-projects/{id}/cutover"
        actor: FieldOpsCoordinator
        preconditions:
          - "The split source node has exactly one ServiceGroup with posture != SPLIT_RETIRED"
          - "calculations.node_split_homes_allocation succeeds: the waterfall remainder lands inside [min_homes_per_child, max_homes_per_child] for the final child"
        side_effects:
          - "Creates child OpticalNode (node_code = parent code + '-S1', same spectrum and upstream_config, duplicated blocks as DATA_ACTIVE/VIDEO_ACTIVE copies)"
          - "Creates child_count child ServiceGroups under the child node with parent thresholds/method and homes per child_allocations"
          - "Parent ServiceGroup: homes_passed -> 0, posture -> SPLIT_RETIRED"
          - "Parent OpticalNode: status -> SPLIT_RETIRED"
          - "Parent CapacityAction: status -> COMPLETED (auto-completion cascade)"
      - from: [PERMIT_REVIEW, PERMIT_GRANTED, PERMIT_DENIED, SCHEDULED]
        to: CANCELLED
        trigger: "system (parent CapacityAction cancelled or revised)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MigrationWave
    field: status
    initial_state: PLANNED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /migration-waves/{id}/execute"
        actor: FieldOpsCoordinator
        preconditions:
          - "Parent CapacityAction is IN_PROGRESS"
          - "Every target CPE exists, is status ACTIVE, and has video_legacy == true"
        side_effects:
          - "Each target CustomerEquipment: video_legacy := false"
          - "migrated_count := count of target_cpe_ids"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /migration-waves/{id}/cancel or system (parent action cancelled/revised)"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects: []

  - entity: SpectrumBlock
    field: status
    initial_state: DATA_ACTIVE
    terminal_states: []
    transitions:
      - from: VIDEO_ACTIVE
        to: RECLAIM_PENDING
        trigger: "system (parent CapacityAction SPECTRUM_RECLAIM begins with this block targeted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECLAIM_PENDING
        to: DATA_ACTIVE
        trigger: "system (parent CapacityAction completes)"
        actor: system
        preconditions: []
        side_effects:
          - "ServiceGroup.downstream_capacity_mbps recomputed for every non-retired ServiceGroup of the node"
      - from: RECLAIM_PENDING
        to: VIDEO_ACTIVE
        trigger: "system (parent CapacityAction cancelled before completion)"
        actor: system
        preconditions: []
        side_effects: []
    note: "DATA blocks are created directly in DATA_ACTIVE; LEGACY_VIDEO blocks are created in VIDEO_ACTIVE (creation input selects initial state per block_type)"

  - entity: CustomerEquipment
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /equipment/{id}/swap"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "Creates replacement CustomerEquipment (ACTIVE, video_legacy copied from the retired unit, fields from request body)"
          - "If refresh_campaign_id given and that campaign is LAUNCHED: campaign.swapped_count += 1"

  - entity: SpeedTier
    field: status
    initial_state: PUBLISHED
    terminal_states: [RETIRED]
    transitions:
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /speed-tiers/{id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: ProvisioningRequest
    field: status
    initial_state: PENDING
    terminal_states: [ACTIVE, CANCELLED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /provisioning-requests/{id}/validate (all checks pass)"
        actor: ProvisioningAgent
        preconditions:
          - "SpeedTier is PUBLISHED"
          - "Premise has an ACTIVE CustomerEquipment with capability_class >= tier.min_capability_class and max_downstream_mbps >= tier.downstream_mbps"
          - "Node upstream_config ranks >= tier.min_upstream_config (LEGACY < MID_SPLIT < HIGH_SPLIT)"
          - "Capacity projection passes per calculations.tier_provisioning_projection"
        side_effects:
          - "config_file_content generated: TIER=<tier_code>;DS=<downstream_mbps>;US=<upstream_mbps>;CPE=<capability_class>"
      - from: PENDING
        to: FAILED
        trigger: "POST /provisioning-requests/{id}/validate (any check fails)"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "failure_reason := error id of the first failing check; response is that error (4xx)"
      - from: FAILED
        to: PENDING
        trigger: "POST /provisioning-requests/{id}/retry"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "failure_reason := null"
        note: "Retry cycle: FAILED requests return to PENDING after corrective action (e.g. equipment swap)"
      - from: VALIDATED
        to: ACTIVE
        trigger: "POST /provisioning-requests/{id}/activate"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "Any previously ACTIVE ProvisioningRequest of the same premise -> CANCELLED (superseded)"
          - "Premise.current_tier_id := speed_tier_id; premise.provisioned_downstream_mbps := tier.downstream_mbps"
          - "ServiceGroup.provisioned_downstream_mbps recomputed"
      - from: [PENDING, VALIDATED, FAILED, ACTIVE]
        to: CANCELLED
        trigger: "POST /provisioning-requests/{id}/cancel or system (superseded)"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "If the cancelled request was ACTIVE: premise.current_tier_id := null, premise.provisioned_downstream_mbps := 0, ServiceGroup.provisioned_downstream_mbps recomputed"

  - entity: RefreshCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LAUNCHED
        trigger: "POST /refresh-campaigns/{id}/launch"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "targeted_count computed: ACTIVE CustomerEquipment in the franchise area with capability_class ranked below target_capability_class"
      - from: LAUNCHED
        to: CLOSED
        trigger: "POST /refresh-campaigns/{id}/close"
        actor: ProvisioningAgent
        preconditions: []
        side_effects: []

  - entity: CongestionComplaint
    field: status
    initial_state: INVESTIGATING
    terminal_states: [CLOSED]
    transitions:
      - from: INVESTIGATING
        to: CLASSIFIED
        trigger: "POST /congestion-complaints/{id}/classify"
        actor: CustomerCare
        preconditions:
          - "cause_category in the request equals the computed argmax cause under the requested scoring_variant (calculations.complaint_cause_scores); otherwise the complaint stays INVESTIGATING and the call fails with ERR_CAUSE_MISMATCH"
        side_effects:
          - "score_plant / score_in_home / score_destination and scoring_variant_used recorded"
      - from: CLASSIFIED
        to: RESOLVED
        trigger: "POST /congestion-complaints/{id}/resolve"
        actor: CustomerCare
        preconditions: []
        side_effects:
          - "If cause_category == PLANT and no PROPOSED/APPROVED/IN_PROGRESS CapacityAction exists for the premise's service group, system creates one (origin=SYSTEM, NODE_SPLIT) linking the complaint's service group"
      - from: RESOLVED
        to: INVESTIGATING
        trigger: "POST /congestion-complaints/{id}/reopen"
        actor: CustomerCare
        preconditions: []
        side_effects:
          - "reopen_count += 1"
          - "cause_category := null; scores reset to null"
        note: "Reopen cycle: a resolved complaint can be reinvestigated"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /congestion-complaints/{id}/close"
        actor: CustomerCare
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: ca-create-stale-service-group
    parent_entity: ServiceGroup
    write_endpoint: "POST /service-groups/{id}/capacity-actions"
    occ_field: expected_service_group_version
    description: |
      Creating a CapacityAction against a ServiceGroup whose version has advanced
      since the client last observed it is rejected. A newer action may have
      legitimately superseded the client's plan (creation of an action cancels any
      existing PROPOSED action), so the stale writer's view of the service group's
      remediation pipeline is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pr-create-stale-premise
    parent_entity: CustomerPremise
    write_endpoint: "POST /customer-premises/{id}/provisioning-requests"
    occ_field: expected_customer_premise_version
    description: |
      Creating a ProvisioningRequest against a CustomerPremise whose version has
      advanced since the client last observed it is rejected. A newer request may
      have legitimately superseded the client's pending request, so the stale
      writer's view of the premise's provisioning pipeline is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: nsp-schedule-stale-project
    parent_entity: NodeSplitProject
    write_endpoint: "POST /node-split-projects/{id}/schedule"
    occ_field: expected_node_split_project_version
    description: |
      Scheduling a NodeSplitProject whose version has advanced since the client
      last observed it is rejected. A prior schedule call may have legitimately
      moved the construction window, so the stale writer's view of the build
      calendar is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sg_utilization
    trigger: "every POST /service-groups/{id}/utilization-samples; also re-run (without new sample) whenever downstream_capacity_mbps changes"
    algorithm: aggregation
    formula: |
      window := samples of this ServiceGroup with measured_at in [clock_now - 7 days, clock_now]
      if window empty: current_load_mbps := 0
      else per variant (ServiceGroup.utilization_method):
        PEAK_PCT95:    sort window by downstream_mbps ASC; rank := ceil(0.95 * N);
                       current_load_mbps := value at 1-indexed rank (nearest-rank method)
        SUSTAINED_AVG: eligible := samples with downstream_mbps >= 0.5 * downstream_capacity_mbps;
                       if eligible empty, eligible := all samples in window;
                       current_load_mbps := floor(mean(downstream_mbps over eligible))
      current_utilization_pct := round_half_up(current_load_mbps * 100 / downstream_capacity_mbps, 1)
      (0.0 when downstream_capacity_mbps == 0)
      posture := NORMAL if pct < warn_threshold_pct;
                 ELEVATED if warn_threshold_pct <= pct < critical_threshold_pct;
                 CRITICAL if pct >= critical_threshold_pct
    input_set: "UtilizationSamples of the ServiceGroup in the trailing 7-day window relative to the logical clock"
    constants:
      WINDOW_DAYS: 7
      P95_QUANTILE: 0.95
      SUSTAINED_FLOOR_RATIO: 0.5
    precision: "current_utilization_pct: 1 decimal, round_half_up; current_load_mbps: integer (floor for mean)"
    variants:
      - name: PEAK_PCT95
        when: "ServiceGroup.utilization_method == PEAK_PCT95"
        difference: "Nearest-rank 95th percentile; spikes dominate"
      - name: SUSTAINED_AVG
        when: "ServiceGroup.utilization_method == SUSTAINED_AVG"
        difference: "Mean of sustained (>=50% capacity) samples; spikes are diluted"

  - name: sg_downstream_capacity
    trigger: "SpectrumBlock creation; block status transitions VIDEO_ACTIVE/RECLAIM_PENDING/DATA_ACTIVE; node-split cutover"
    algorithm: aggregation
    formula: |
      per block: channels := floor(mhz / 6)   # per-block truncation; NEVER floor(sum(mhz)/6)
      per DATA_ACTIVE block: capacity_mbps := channels * 38
      ServiceGroup.downstream_capacity_mbps := sum(capacity_mbps over DATA_ACTIVE blocks of the parent node)
    input_set: "SpectrumBlocks of the parent OpticalNode with status DATA_ACTIVE"
    constants:
      QAM_CHANNEL_MHZ: 6
      DOCSIS_CHANNEL_MBPS: 38
    precision: "integer Mbps; rounding order is pinned: truncate channels per block first, then multiply, then sum"
    note: "Rounding order matters: blocks of 21 MHz and 15 MHz give 114 + 76 = 190 Mbps per-block, vs floor(36/6)*38 = 228 Mbps if MHz were summed first. The per-block order is authoritative."

  - name: node_split_homes_allocation
    trigger: "POST /node-split-projects/{id}/cutover"
    algorithm: waterfall_allocation
    formula: |
      H := parent ServiceGroup.homes_passed; k := child_count
      remaining := H
      for i in 1..k-1 (child order is creation order 1..k):
        base := floor(remaining / (k - i + 1))
        alloc_i := min(max(base, min_homes_per_child), max_homes_per_child)
        remaining := remaining - alloc_i
      alloc_k := remaining
      if alloc_k < min_homes_per_child or alloc_k > max_homes_per_child: fail ERR_ALLOCATION_INVALID
      child_allocations := [alloc_1, ..., alloc_k]
    input_set: "parent ServiceGroup homes_passed, NodeSplitProject child_count / min_homes_per_child / max_homes_per_child"
    precision: "integer homes; sum(child_allocations) == H exactly (homes are conserved)"
    note: "3+ inputs with non-linear clamp interaction: H=1000, k=3, min=200, max=400 yields 333/333/334; min=350, H=1050 yields 350/350/350; clamping an early child shifts the waterfall for all later children"

  - name: tier_provisioning_projection
    trigger: "POST /provisioning-requests/{id}/validate"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned (circular-looking dependency resolved):
      # posture gates creation; validation projects load against capacity.
      step 1: capacity := ServiceGroup.downstream_capacity_mbps   (from current DATA_ACTIVE blocks)
      step 2: load := ServiceGroup.current_load_mbps              (per sg_utilization variant)
      step 3: projected_load := load + SpeedTier.downstream_mbps
      step 4: REJECT with ERR_CAPACITY_EXCEEDED iff projected_load * 100 >= critical_threshold_pct * capacity
              (>= is deliberate: landing exactly on the critical line rejects)
      when capacity == 0: REJECT with ERR_CAPACITY_EXCEEDED
    input_set: "ProvisioningRequest's tier, premise's ServiceGroup current fields"
    precision: "pure integer comparison; no rounding"
    note: "The projected load depends on capacity while capacity itself depends on reclamation state; the pinned 4-step order makes the value well-defined at validate time"

  - name: complaint_cause_scores
    trigger: "POST /congestion-complaints/{id}/classify"
    algorithm: weighted_scoring
    formula: |
      per variant (request scoring_variant):
        EVIDENCE_WEIGHTED:
          score_plant := plant_signal; score_in_home := home_signal; score_destination := destination_signal
        RECENCY_WEIGHTED:
          prior := most recent complaint of the same premise with status in {RESOLVED, CLOSED} (by created_at, latest first)
          boost(cause) := 40 if prior exists and prior.cause_category == cause else 0
          score_plant := 0.6 * plant_signal + boost(PLANT)
          score_in_home := 0.6 * home_signal + boost(IN_HOME)
          score_destination := 0.6 * destination_signal + boost(DESTINATION)
      computed_cause := argmax over (PLANT, IN_HOME, DESTINATION) of scores
      tie-break: equal scores resolve by fixed priority PLANT > IN_HOME > DESTINATION
      request cause_category must equal computed_cause else ERR_CAUSE_MISMATCH
    input_set: "complaint's three signals; prior RESOLVED/CLOSED complaints of the same CustomerPremise"
    precision: "scores: 1 decimal, round_half_up"
    variants:
      - name: EVIDENCE_WEIGHTED
        when: "request scoring_variant == EVIDENCE_WEIGHTED"
        difference: "Raw signal argmax; history ignored"
      - name: RECENCY_WEIGHTED
        when: "request scoring_variant == RECENCY_WEIGHTED"
        difference: "0.6-weighted signals plus a flat +40 boost on the most recent resolved cause; can flip the argmax"

  - name: upstream_capacity_lookup
    trigger: "ServiceGroup creation; upgrade CapacityAction completion"
    algorithm: constraint_propagation
    formula: |
      node.upstream_config -> per-service-group upstream_capacity_mbps:
        LEGACY -> 27
        MID_SPLIT -> 108
        HIGH_SPLIT -> 204
      On upgrade completion, every non-retired ServiceGroup of the node adopts the new value.
    input_set: "OpticalNode.upstream_config"
    constants:
      UPSTREAM_LEGACY_MBPS: 27
      UPSTREAM_MID_SPLIT_MBPS: 108
      UPSTREAM_HIGH_SPLIT_MBPS: 204

  - name: wave_window_gap_check
    trigger: "POST /capacity-actions/{id}/migration-waves"
    algorithm: interval_merge
    formula: |
      For the new wave window [ws, we] against every other PLANNED or EXECUTED wave
      window [as, ae] under the same CapacityAction:
        gap_ok := (ws >= ae + 7 days) or (we <= as - 7 days)
      Reject with ERR_WAVE_GAP_VIOLATION unless gap_ok holds against all of them.
      A gap of exactly 7 full days is allowed (>= semantics); 6 days 23:59:59 rejects.
    input_set: "MigrationWaves of the parent CapacityAction with status PLANNED or EXECUTED"
    constants:
      WAVE_GAP_DAYS: 7
    precision: "second precision on ISO8601 datetimes"

  - name: franchise_obligation_progress
    trigger: "read of FranchiseArea; node-split cutover; ServiceGroup creation"
    algorithm: aggregation
    formula: |
      homes_built_progress := sum(homes_passed) over ServiceGroups with posture != SPLIT_RETIRED
                              on OpticalNodes (any status) of this FranchiseArea
      obligation_met := homes_built_progress >= obligation_homes_required (evaluated against obligation_deadline on read)
    input_set: "ServiceGroups under the FranchiseArea excluding posture == SPLIT_RETIRED"
    precision: "integer homes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role must be one of the endpoint's declared roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Request-body must parse; required fields present; enum values legal"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all mutating endpoints
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /service-groups/{id}/capacity-actions, POST /customer-premises/{id}/provisioning-requests, POST /node-split-projects/{id}/schedule"
  - priority: 6
    category: state
    check: "Target resource lifecycle state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action/transition endpoints
  - priority: 7
    category: state
    check: "Cross-entity state gates: ServiceGroup posture CRITICAL blocks provisioning-request creation; tier must be PUBLISHED; referenced CPE must be ACTIVE; parent CapacityAction must be IN_PROGRESS for wave execute and begin-construction"
    error_id: "ERR_SG_CONGESTED | ERR_TIER_RETIRED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "provisioning, wave execute, begin-construction"
  - priority: 8
    category: business_temporal
    check: "Construction window must not overlap another scheduled/in-construction window in the franchise area (half-open) nor intersect a blackout (closed); migration wave windows need >= 7-day gaps"
    error_id: "ERR_WINDOW_CONFLICT | ERR_WAVE_GAP_VIOLATION"
    http_status: 409
    applies_to: "POST /node-split-projects/{id}/schedule, POST /capacity-actions/{id}/migration-waves"
  - priority: 9
    category: business_referential
    check: "CPE capability_class >= tier.min_capability_class and max_downstream_mbps >= tier.downstream_mbps; node upstream_config rank >= tier.min_upstream_config; child-entity/action-type match (NodeSplitProject only under NODE_SPLIT, MigrationWave only under SPECTRUM_RECLAIM); upgrade path is single-step"
    error_id: "ERR_CAPABILITY_INSUFFICIENT | ERR_UPSTREAM_CONFIG_INSUFFICIENT | ERR_ACTION_TYPE_MISMATCH | ERR_UPGRADE_PATH_INVALID"
    http_status: 422
    applies_to: "provisioning validate, child creation under capacity actions, upgrade begin"
  - priority: 10
    category: business_constraint
    check: "Capacity/resource constraints: tier projection under critical ceiling; SG homes sum <= node homes; block MHz sum <= node spectrum; at least one VIDEO_ACTIVE block remains untargeted; wave target CPE eligible"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_HOMES_EXCEED_NODE | ERR_SPECTRUM_OVERALLOCATED | ERR_LAST_VIDEO_BLOCK | ERR_CPE_NOT_ELIGIBLE"
    http_status: 422
    applies_to: "validate, service-group/block/action/wave creation"
  - priority: 11
    category: business_fiscal
    check: "Allocation conservation: cutover waterfall remainder must land inside [min_homes_per_child, max_homes_per_child] so homes are conserved exactly"
    error_id: ERR_ALLOCATION_INVALID
    http_status: 422
    applies_to: "POST /node-split-projects/{id}/cutover"
  - priority: 12
    category: business_constraint
    check: "Classify: cause_category must equal computed argmax under the requested scoring variant"
    error_id: ERR_CAUSE_MISMATCH
    http_status: 422
    applies_to: "POST /congestion-complaints/{id}/classify"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Recomputes no entities; future window-based calculations use the new clock value"]

  # --- Franchise areas ---
  - method: POST
    path: "/franchise-areas"
    description: "Create a franchise area"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, obligation_homes_required, obligation_deadline, "blackout_windows?"]
    output: FranchiseArea
    side_effects: ["homes_built_progress = 0"]
  - method: GET
    path: "/franchise-areas/{id}"
    description: "Get a franchise area (includes computed homes_built_progress)"
    roles: [Any]
    code: 200
    input: []
    output: FranchiseArea
    side_effects: []
  - method: GET
    path: "/franchise-areas"
    description: "List franchise areas"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FranchiseArea[]"
    side_effects: []

  # --- Optical nodes ---
  - method: POST
    path: "/franchise-areas/{id}/optical-nodes"
    description: "Create an optical node under a franchise area"
    roles: [NetworkPlanner]
    code: 201
    input: [node_code, homes_passed, downstream_spectrum_mhz, upstream_config]
    output: OpticalNode
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/optical-nodes/{id}"
    description: "Get an optical node"
    roles: [Any]
    code: 200
    input: []
    output: OpticalNode
    side_effects: []
  - method: GET
    path: "/franchise-areas/{id}/optical-nodes"
    description: "List optical nodes of a franchise area"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OpticalNode[]"
    side_effects: []

  # --- Spectrum blocks ---
  - method: POST
    path: "/optical-nodes/{id}/spectrum-blocks"
    description: "Create a spectrum block on a node (initial status from block_type: DATA->DATA_ACTIVE, LEGACY_VIDEO->VIDEO_ACTIVE)"
    roles: [CapacityEngineer]
    code: 201
    input: [block_type, mhz]
    output: SpectrumBlock
    side_effects: ["Rejects with ERR_SPECTRUM_OVERALLOCATED if total block MHz would exceed node.downstream_spectrum_mhz", "DATA blocks immediately contribute capacity to the node's service groups"]
  - method: GET
    path: "/spectrum-blocks/{id}"
    description: "Get a spectrum block"
    roles: [Any]
    code: 200
    input: []
    output: SpectrumBlock
    side_effects: []
  - method: GET
    path: "/optical-nodes/{id}/spectrum-blocks"
    description: "List spectrum blocks of a node"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpectrumBlock[]"
    side_effects: []

  # --- Service groups ---
  - method: POST
    path: "/optical-nodes/{id}/service-groups"
    description: "Create a service group on a node"
    roles: [CapacityEngineer]
    code: 201
    input: [sg_code, homes_passed, warn_threshold_pct, critical_threshold_pct, utilization_method]
    output: ServiceGroup
    side_effects: ["posture=NORMAL", "Rejects with ERR_HOMES_EXCEED_NODE if the node's non-retired service-group homes would exceed node.homes_passed", "Rejects with ERR_NODE_RETIRED if the node is SPLIT_RETIRED"]
  - method: GET
    path: "/service-groups/{id}"
    description: "Get a service group (includes computed capacity, load, pct, posture)"
    roles: [Any]
    code: 200
    input: []
    output: ServiceGroup
    side_effects: []
  - method: GET
    path: "/optical-nodes/{id}/service-groups"
    description: "List service groups of a node"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceGroup[]"
    side_effects: []

  # --- Utilization samples ---
  - method: POST
    path: "/service-groups/{id}/utilization-samples"
    description: "Ingest a utilization sample; recomputes load/pct/posture and may auto-create a CapacityAction on CRITICAL"
    roles: [PlatformAdmin]
    code: 201
    input: [measured_at, downstream_mbps, upstream_mbps]
    output: UtilizationSample
    side_effects:
      - "Recompute ServiceGroup.current_load_mbps / current_utilization_pct / posture per calculations.sg_utilization"
      - "On transition into CRITICAL: auto-create CapacityAction (origin=SYSTEM) if none active"
  - method: GET
    path: "/service-groups/{id}/utilization-samples"
    description: "List utilization samples of a service group"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "UtilizationSample[]"
    side_effects: []

  # --- Capacity actions ---
  - method: POST
    path: "/service-groups/{id}/capacity-actions"
    description: "Manually propose a capacity action (OCC on service group version; supersedes any existing PROPOSED action)"
    roles: [NetworkPlanner]
    code: 201
    input: [action_type, expected_service_group_version, "target_block_ids?", "target_upstream_config?", "note?"]
    output: CapacityAction
    side_effects:
      - "status=PROPOSED, origin=MANUAL"
      - "Any existing PROPOSED CapacityAction of this service group -> CANCELLED with superseded_by_id set"
      - "increments ServiceGroup.version by 1"
      - "SPECTRUM_RECLAIM: every target block must be VIDEO_ACTIVE on this node's service-group node and at least one VIDEO_ACTIVE block must remain untargeted (else ERR_LAST_VIDEO_BLOCK)"
      - "Upgrade types: target_upstream_config must be exactly one step above node.upstream_config (else ERR_UPGRADE_PATH_INVALID)"
  - method: GET
    path: "/capacity-actions/{id}"
    description: "Get a capacity action"
    roles: [Any]
    code: 200
    input: []
    output: CapacityAction
    side_effects: []
  - method: GET
    path: "/service-groups/{id}/capacity-actions"
    description: "List capacity actions of a service group"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CapacityAction[]"
    side_effects: []
  - method: POST
    path: "/capacity-actions/{id}/approve"
    description: "Approve a proposed capacity action"
    roles: [CapacityEngineer]
    code: 200
    input: []
    output: CapacityAction
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/capacity-actions/{id}/revise"
    description: "Send an approved action back to PROPOSED for rework (cancels linked non-terminal projects/waves)"
    roles: [CapacityEngineer]
    code: 200
    input: [note]
    output: CapacityAction
    side_effects: ["status APPROVED -> PROPOSED", "linked NodeSplitProjects (non-terminal) -> CANCELLED", "linked PLANNED MigrationWaves -> CANCELLED"]
  - method: POST
    path: "/capacity-actions/{id}/begin"
    description: "Begin an approved action"
    roles: [CapacityEngineer]
    code: 200
    input: []
    output: CapacityAction
    side_effects: ["status -> IN_PROGRESS", "SPECTRUM_RECLAIM: target blocks -> RECLAIM_PENDING"]
  - method: POST
    path: "/capacity-actions/{id}/complete"
    description: "Complete a reclaim or upgrade action (node-split actions auto-complete at cutover)"
    roles: [CapacityEngineer]
    code: 200
    input: []
    output: CapacityAction
    side_effects:
      - "SPECTRUM_RECLAIM guard: every linked wave EXECUTED or CANCELLED, at least one EXECUTED"
      - "SPECTRUM_RECLAIM: target blocks -> DATA_ACTIVE, service-group capacity and posture recomputed"
      - "Upgrades: node.upstream_config := target_upstream_config; upstream capacity recomputed on the node's service groups"
  - method: POST
    path: "/capacity-actions/{id}/cancel"
    description: "Cancel an action (reverts RECLAIM_PENDING blocks; cancels linked children)"
    roles: [CapacityEngineer]
    code: 200
    input: [reason]
    output: CapacityAction
    side_effects: ["status -> CANCELLED", "RECLAIM_PENDING target blocks -> VIDEO_ACTIVE", "non-terminal NodeSplitProjects and PLANNED waves -> CANCELLED"]

  # --- Node split projects ---
  - method: POST
    path: "/capacity-actions/{id}/node-split-projects"
    description: "Create a node-split engineering project under a NODE_SPLIT action (files the construction permit application)"
    roles: [NetworkPlanner]
    code: 201
    input: [child_count, min_homes_per_child, max_homes_per_child]
    output: NodeSplitProject
    side_effects: ["status=PERMIT_REVIEW"]
  - method: GET
    path: "/node-split-projects/{id}"
    description: "Get a node-split project"
    roles: [Any]
    code: 200
    input: []
    output: NodeSplitProject
    side_effects: []
  - method: GET
    path: "/capacity-actions/{id}/node-split-projects"
    description: "List node-split projects of a capacity action"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "NodeSplitProject[]"
    side_effects: []
  - method: POST
    path: "/node-split-projects/{id}/adjudicate-permit"
    description: "Franchise authority grants or denies the construction permit"
    roles: [FranchiseAdmin]
    code: 200
    input: [decision]
    output: NodeSplitProject
    side_effects: ["PERMIT_REVIEW -> PERMIT_GRANTED (decision=GRANTED) or PERMIT_DENIED (decision=DENIED)"]
  - method: POST
    path: "/node-split-projects/{id}/refile-permit"
    description: "Refile a denied permit application"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: NodeSplitProject
    side_effects: ["PERMIT_DENIED -> PERMIT_REVIEW"]
  - method: POST
    path: "/node-split-projects/{id}/schedule"
    description: "Schedule the construction window (OCC on project version; half-open overlap + closed blackout checks)"
    roles: [NetworkPlanner]
    code: 200
    input: [window_start, window_end, expected_node_split_project_version]
    output: NodeSplitProject
    side_effects: ["PERMIT_GRANTED -> SCHEDULED", "increments NodeSplitProject.version by 1", "Rejects with ERR_PERMIT_NOT_GRANTED when the project is not in PERMIT_GRANTED (surfaced as the lifecycle guard alongside ERR_INVALID_STATE)"]
  - method: POST
    path: "/node-split-projects/{id}/begin-construction"
    description: "Begin construction (requires parent action IN_PROGRESS)"
    roles: [FieldOpsCoordinator]
    code: 200
    input: []
    output: NodeSplitProject
    side_effects: ["SCHEDULED -> IN_CONSTRUCTION"]
  - method: POST
    path: "/node-split-projects/{id}/cutover"
    description: "Execute the split cutover: create child node + child service groups, retire the parent, auto-complete the action"
    roles: [FieldOpsCoordinator]
    code: 200
    input: []
    output: NodeSplitProject
    side_effects:
      - "child_allocations computed per calculations.node_split_homes_allocation (ERR_ALLOCATION_INVALID if the final remainder falls outside [min, max])"
      - "child OpticalNode + child ServiceGroups created; parent ServiceGroup posture -> SPLIT_RETIRED with homes_passed 0; parent OpticalNode -> SPLIT_RETIRED"
      - "parent CapacityAction -> COMPLETED"

  # --- Migration waves ---
  - method: POST
    path: "/capacity-actions/{id}/migration-waves"
    description: "Plan a migration wave under a SPECTRUM_RECLAIM action (>= 7-day gap from sibling waves)"
    roles: [NetworkPlanner]
    code: 201
    input: [wave_code, window_start, window_end, target_cpe_ids]
    output: MigrationWave
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/migration-waves/{id}"
    description: "Get a migration wave"
    roles: [Any]
    code: 200
    input: []
    output: MigrationWave
    side_effects: []
  - method: GET
    path: "/capacity-actions/{id}/migration-waves"
    description: "List migration waves of a capacity action"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "MigrationWave[]"
    side_effects: []
  - method: POST
    path: "/migration-waves/{id}/execute"
    description: "Execute a wave: flip target CPE off legacy video (requires parent action IN_PROGRESS)"
    roles: [FieldOpsCoordinator]
    code: 200
    input: []
    output: MigrationWave
    side_effects: ["PLANNED -> EXECUTED", "each target CustomerEquipment video_legacy := false", "migrated_count := |target_cpe_ids|"]
  - method: POST
    path: "/migration-waves/{id}/cancel"
    description: "Cancel a planned wave"
    roles: [FieldOpsCoordinator]
    code: 200
    input: []
    output: MigrationWave
    side_effects: ["PLANNED -> CANCELLED"]

  # --- Customer premises ---
  - method: POST
    path: "/service-groups/{id}/customer-premises"
    description: "Create a customer premise on a service group"
    roles: [ProvisioningAgent]
    code: 201
    input: [premise_ref, address]
    output: CustomerPremise
    side_effects: ["provisioned_downstream_mbps = 0, current_tier_id = null"]
  - method: GET
    path: "/customer-premises/{id}"
    description: "Get a customer premise"
    roles: [Any]
    code: 200
    input: []
    output: CustomerPremise
    side_effects: []
  - method: GET
    path: "/service-groups/{id}/customer-premises"
    description: "List premises of a service group"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerPremise[]"
    side_effects: []
  - method: GET
    path: "/customer-premises"
    description: "List premises filtered by service group or current tier"
    roles: [Any]
    code: 200
    input: ["service_group_id?", "current_tier_id?", "limit?", "offset?"]
    output: "CustomerPremise[]"
    side_effects: []

  # --- Customer equipment ---
  - method: POST
    path: "/customer-premises/{id}/equipment"
    description: "Install customer premises equipment"
    roles: [ProvisioningAgent]
    code: 201
    input: [model, docsis_version, capability_class, max_downstream_mbps, video_legacy]
    output: CustomerEquipment
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/equipment/{id}"
    description: "Get a CPE record"
    roles: [Any]
    code: 200
    input: []
    output: CustomerEquipment
    side_effects: []
  - method: GET
    path: "/customer-premises/{id}/equipment"
    description: "List equipment of a premise"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerEquipment[]"
    side_effects: []
  - method: POST
    path: "/equipment/{id}/swap"
    description: "Swap CPE for a new unit (old unit RETIRED; optionally credits a LAUNCHED refresh campaign)"
    roles: [ProvisioningAgent]
    code: 201
    input: [model, docsis_version, capability_class, max_downstream_mbps, "refresh_campaign_id?"]
    output: CustomerEquipment
    side_effects: ["old unit -> RETIRED", "new unit ACTIVE with video_legacy copied from old unit", "if refresh_campaign_id given: campaign must be LAUNCHED (else ERR_CAMPAIGN_NOT_LAUNCHED); campaign.swapped_count += 1"]

  # --- Speed tiers ---
  - method: POST
    path: "/speed-tiers"
    description: "Publish a speed tier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier_code, downstream_mbps, upstream_mbps, min_capability_class, min_upstream_config]
    output: SpeedTier
    side_effects: ["status=PUBLISHED"]
  - method: GET
    path: "/speed-tiers/{id}"
    description: "Get a speed tier"
    roles: [Any]
    code: 200
    input: []
    output: SpeedTier
    side_effects: []
  - method: POST
    path: "/speed-tiers/{id}/retire"
    description: "Retire a speed tier"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SpeedTier
    side_effects: ["status -> RETIRED"]

  # --- Provisioning requests ---
  - method: POST
    path: "/customer-premises/{id}/provisioning-requests"
    description: "Create a provisioning request (OCC on premise version; supersedes existing PENDING/VALIDATED/FAILED requests; blocked while service group is CRITICAL)"
    roles: [ProvisioningAgent]
    code: 201
    input: [speed_tier_id, expected_customer_premise_version]
    output: ProvisioningRequest
    side_effects:
      - "status=PENDING"
      - "Existing PENDING/VALIDATED/FAILED ProvisioningRequests of the premise -> CANCELLED (superseded)"
      - "increments CustomerPremise.version by 1"
  - method: GET
    path: "/provisioning-requests/{id}"
    description: "Get a provisioning request"
    roles: [Any]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: []
  - method: GET
    path: "/provisioning-requests"
    description: "List provisioning requests filtered by premise, tier, or status"
    roles: [Any]
    code: 200
    input: ["customer_premise_id?", "speed_tier_id?", "status?", "limit?", "offset?"]
    output: "ProvisioningRequest[]"
    side_effects: []
  - method: POST
    path: "/provisioning-requests/{id}/validate"
    description: "Validate the request: tier published, CPE capability, upstream config, capacity projection; generates the config file on success"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["PENDING -> VALIDATED + config_file_content generated, or PENDING -> FAILED + failure_reason (response carries the failing error)"]
  - method: POST
    path: "/provisioning-requests/{id}/activate"
    description: "Activate a validated request (applies the tier, supersedes any ACTIVE request)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["VALIDATED -> ACTIVE", "premise.current_tier_id and provisioned_downstream_mbps updated", "service-group provisioned total recomputed"]
  - method: POST
    path: "/provisioning-requests/{id}/retry"
    description: "Retry a failed request after corrective action"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["FAILED -> PENDING", "failure_reason := null"]
  - method: POST
    path: "/provisioning-requests/{id}/cancel"
    description: "Cancel a request; cancelling an ACTIVE request deprovisions the tier"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["status -> CANCELLED", "if previously ACTIVE: premise tier cleared and service-group provisioned total recomputed"]

  # --- Refresh campaigns ---
  - method: POST
    path: "/franchise-areas/{id}/refresh-campaigns"
    description: "Create a CPE refresh campaign"
    roles: [ProvisioningAgent]
    code: 201
    input: [campaign_code, target_capability_class]
    output: RefreshCampaign
    side_effects: ["status=DRAFT, targeted_count=0, swapped_count=0"]
  - method: GET
    path: "/refresh-campaigns/{id}"
    description: "Get a refresh campaign"
    roles: [Any]
    code: 200
    input: []
    output: RefreshCampaign
    side_effects: []
  - method: GET
    path: "/franchise-areas/{id}/refresh-campaigns"
    description: "List refresh campaigns of a franchise area"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RefreshCampaign[]"
    side_effects: []
  - method: POST
    path: "/refresh-campaigns/{id}/launch"
    description: "Launch the campaign and compute targeted_count"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: RefreshCampaign
    side_effects: ["DRAFT -> LAUNCHED", "targeted_count := count of ACTIVE CPE in the franchise area below target_capability_class"]
  - method: POST
    path: "/refresh-campaigns/{id}/close"
    description: "Close the campaign"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: RefreshCampaign
    side_effects: ["LAUNCHED -> CLOSED"]

  # --- Congestion complaints ---
  - method: POST
    path: "/customer-premises/{id}/congestion-complaints"
    description: "File a congestion complaint with diagnostic signals"
    roles: [CustomerCare]
    code: 201
    input: [description, plant_signal, home_signal, destination_signal]
    output: CongestionComplaint
    side_effects: ["status=INVESTIGATING, reopen_count=0"]
  - method: GET
    path: "/congestion-complaints/{id}"
    description: "Get a complaint"
    roles: [Any]
    code: 200
    input: []
    output: CongestionComplaint
    side_effects: []
  - method: GET
    path: "/congestion-complaints"
    description: "List complaints filtered by premise or status"
    roles: [Any]
    code: 200
    input: ["customer_premise_id?", "status?", "limit?", "offset?"]
    output: "CongestionComplaint[]"
    side_effects: []
  - method: POST
    path: "/congestion-complaints/{id}/classify"
    description: "Classify the cause under a scoring variant; the asserted cause must match the computed argmax"
    roles: [CustomerCare]
    code: 200
    input: [scoring_variant, cause_category]
    output: CongestionComplaint
    side_effects: ["INVESTIGATING -> CLASSIFIED with computed scores recorded; ERR_CAUSE_MISMATCH leaves status INVESTIGATING"]
  - method: POST
    path: "/congestion-complaints/{id}/resolve"
    description: "Resolve a classified complaint (PLANT causes auto-propose a NODE_SPLIT capacity action when none is active)"
    roles: [CustomerCare]
    code: 200
    input: [resolution_note]
    output: CongestionComplaint
    side_effects: ["CLASSIFIED -> RESOLVED", "PLANT cause: system creates PROPOSED CapacityAction (origin=SYSTEM, NODE_SPLIT) if none active for the service group"]
  - method: POST
    path: "/congestion-complaints/{id}/reopen"
    description: "Reopen a resolved complaint for reinvestigation"
    roles: [CustomerCare]
    code: 200
    input: []
    output: CongestionComplaint
    side_effects: ["RESOLVED -> INVESTIGATING", "reopen_count += 1", "cause_category and scores reset"]
  - method: POST
    path: "/congestion-complaints/{id}/close"
    description: "Close a resolved complaint permanently"
    roles: [CustomerCare]
    code: 200
    input: []
    output: CongestionComplaint
    side_effects: ["RESOLVED -> CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's declared roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or illegal enum value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource lifecycle state does not permit this transition (includes parent-action not IN_PROGRESS, CPE not ACTIVE, project not in required permit state)" }
  - { id: ERR_SG_CONGESTED, http: 409, condition: "Service group posture is CRITICAL; new provisioning requests are blocked" }
  - { id: ERR_TIER_RETIRED, http: 409, condition: "Speed tier is RETIRED; new validation against it is rejected" }
  - { id: ERR_NODE_RETIRED, http: 409, condition: "Optical node is SPLIT_RETIRED; no new blocks, service groups, or actions against it" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Construction window overlaps another scheduled/in-construction window in the franchise area (half-open semantics) or intersects a blackout date (closed semantics)" }
  - { id: ERR_WAVE_GAP_VIOLATION, http: 409, condition: "Migration wave window violates the >= 7-day gap rule against a sibling PLANNED/EXECUTED wave" }
  - { id: ERR_PERMIT_NOT_GRANTED, http: 409, condition: "Node-split project permit is not GRANTED; scheduling blocked" }
  - { id: ERR_CAPABILITY_INSUFFICIENT, http: 422, condition: "CPE capability_class below tier minimum or max_downstream_mbps below tier downstream rate" }
  - { id: ERR_UPSTREAM_CONFIG_INSUFFICIENT, http: 422, condition: "Node upstream_config ranks below tier.min_upstream_config" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Projected load (current load + tier downstream) reaches or exceeds the service group's critical threshold" }
  - { id: ERR_LAST_VIDEO_BLOCK, http: 422, condition: "Reclaim would target every remaining VIDEO_ACTIVE block; at least one must remain" }
  - { id: ERR_HOMES_EXCEED_NODE, http: 422, condition: "Sum of non-retired service-group homes would exceed node.homes_passed" }
  - { id: ERR_SPECTRUM_OVERALLOCATED, http: 422, condition: "Sum of block MHz would exceed node.downstream_spectrum_mhz" }
  - { id: ERR_ALLOCATION_INVALID, http: 422, condition: "Cutover waterfall remainder falls outside [min_homes_per_child, max_homes_per_child]; homes would not be conserved" }
  - { id: ERR_CAUSE_MISMATCH, http: 422, condition: "Asserted cause_category differs from the computed argmax under the requested scoring variant" }
  - { id: ERR_ACTION_TYPE_MISMATCH, http: 422, condition: "Child entity created under a capacity action of the wrong action_type (NodeSplitProject needs NODE_SPLIT; MigrationWave needs SPECTRUM_RECLAIM)" }
  - { id: ERR_UPGRADE_PATH_INVALID, http: 422, condition: "Upgrade is not a single step (LEGACY->MID_SPLIT or MID_SPLIT->HIGH_SPLIT) or targets the wrong source config" }
  - { id: ERR_CPE_NOT_ELIGIBLE, http: 422, condition: "Wave target CPE missing, not ACTIVE, or already off legacy video" }
  - { id: ERR_CAMPAIGN_NOT_LAUNCHED, http: 409, condition: "Swap references a refresh campaign that is not LAUNCHED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns franchise-area setup, speed-tier catalog, telemetry ingest, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /franchise-areas"
      - "POST /speed-tiers and POST /speed-tiers/{id}/retire"
      - "POST /service-groups/{id}/utilization-samples"
    shared_operations: []
  - name: NetworkPlanner
    description: "Capacity planner; designs nodes, proposes capacity actions, node-split projects, and migration waves"
    identity: opaque
    exclusive_operations:
      - "POST /franchise-areas/{id}/optical-nodes"
      - "POST /service-groups/{id}/capacity-actions"
      - "POST /capacity-actions/{id}/node-split-projects"
      - "POST /capacity-actions/{id}/migration-waves"
      - "POST /node-split-projects/{id}/schedule"
    shared_operations: []
  - name: CapacityEngineer
    description: "Capacity engineer; owns spectrum blocks, service groups, and the capacity-action approval lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /optical-nodes/{id}/spectrum-blocks"
      - "POST /optical-nodes/{id}/service-groups"
      - "POST /capacity-actions/{id}/approve|revise|begin|complete|cancel"
    shared_operations: []
  - name: FieldOpsCoordinator
    description: "Field operations; runs construction and wave execution"
    identity: opaque
    exclusive_operations:
      - "POST /node-split-projects/{id}/begin-construction"
      - "POST /node-split-projects/{id}/cutover"
      - "POST /migration-waves/{id}/execute"
      - "POST /migration-waves/{id}/cancel"
    shared_operations: []
  - name: FranchiseAdmin
    description: "Municipal franchise authority; adjudicates construction permits"
    identity: opaque
    exclusive_operations:
      - "POST /node-split-projects/{id}/adjudicate-permit"
      - "POST /node-split-projects/{id}/refile-permit"
    shared_operations: []
  - name: ProvisioningAgent
    description: "Provisioning agent; owns premises, CPE, provisioning requests, and refresh campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /service-groups/{id}/customer-premises"
      - "POST /customer-premises/{id}/equipment and POST /equipment/{id}/swap"
      - "POST /customer-premises/{id}/provisioning-requests and validate/activate/retry/cancel"
      - "POST /franchise-areas/{id}/refresh-campaigns and launch/close"
    shared_operations: []
  - name: CustomerCare
    description: "Customer care; owns congestion complaint investigation"
    identity: opaque
    exclusive_operations:
      - "POST /customer-premises/{id}/congestion-complaints"
      - "POST /congestion-complaints/{id}/classify|resolve|reopen|close"
    shared_operations: []
  - name: Any
    description: "Any authenticated role; read-only shared surface"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
