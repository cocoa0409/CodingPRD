      - name: business_safety_precedes_business_fiscal_on_approve
        grounds: "validations priority 22 (category business_safety, ERR_BIAS_EVALUATION_FAILED, 422) and priority 41 (category business_fiscal, ERR_PORTFOLIO_REACH_CAP_EXCEEDED, 422) both guard POST /use-cases/{id}/approve. A single 300000-reach use case whose last BIAS run failed violates both at once."
        distinguishing_aspect: "a DIFFERENT category pair (business_safety vs business_fiscal) with the SAME http status on both sides, so the test cannot pass by accidentally matching a status code - only the error_id distinguishes them. The fiscal check is also the only validation that runs AFTER a calculation step (approval_finalization step 4), which makes the ordering non-obvious: the cheap safety flag must still be consulted before the portfolio arithmetic is allowed to speak."
