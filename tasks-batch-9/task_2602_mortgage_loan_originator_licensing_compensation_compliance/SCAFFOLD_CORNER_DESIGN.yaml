      - name: info_request_extends_response_deadline_by_fourteen_days
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExaminationInquiry.RESPONSE_SUBMITTED_to_INFO_REQUESTED
          - state_machines.ExaminationInquiry.INFO_REQUESTED_to_RESPONSE_SUBMITTED
          - entities.ExaminationInquiry.fields.response_round_count
        distinguishing_aspect: |
          The info-request side effect rewrites response_due_at to clock + 14 days:
          requested at 2026-08-06T00:00:00Z it becomes exactly 2026-08-20T00:00:00Z, and the
          cyclic re-entry raises response_round_count from 1 to 2 while escalation_reason
          stays null.
        test_recipe:
          setup:
            - "One ExaminationInquiry EX-2026-001 for CA opened at 2026-08-01 with
               response_due_at 2026-09-01T00:00:00Z."
            - "Round 1 response submitted at 2026-08-05T00:00:00Z (status RESPONSE_SUBMITTED,
               response_round_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
