              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id", preparer: "$.data.prepared_by_user_id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 1000000 }, { period_index: 2, amount_usd: 8500000 }], upfront_cost_usd: 100000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { recommended_alt: "$.data.recommended_alternative_id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "RECOMMENDED", selected_alternative_id: "${alt_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "WORKOUT_PLAN", workout_plan_id: "${plan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { consult_id: "$.data.id", consult_rights: "$.data.rights_type" }
            - call: "POST /special-servicing/consultations/${consult_id}/response"
              payload: { response: "CONSENTED", response_note: "proceed with the modification" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
              captures: { consult_status: "$.data.status" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { plan_status: "$.data.status", approver: "$.data.approved_by_user_id" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_version: "$.data.version" }
            - call: "POST /special-servicing/distribution-reports"
              payload: { trust_id: "${trust_id}", report_type: "SPECIAL_SERVICER_LOAN_FILE", period_end: "2026-07-31T00:00:00Z", expected_trust_version: "${trust_version}" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { report_id: "$.data.id" }
            - call: "POST /special-servicing/distribution-reports/${report_id}/status"
              payload: { to_status: "CERTIFIED" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { report_status: "$.data.status", certifier: "$.data.certified_by_user_id" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fee_id: "$.data.id", fee_amount: "$.data.amount_usd" }
            - call: "POST /special-servicing/fee-accruals/${fee_id}/status"
              payload: { to_status: "COLLECTED" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fee_status: "$.data.status" }
            - call: "POST /special-servicing/consultations/sweep"
              payload: { trust_id: "${trust_id}" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { swept: "$.data.swept_count" }
            - call: "POST /special-servicing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { clock_now: "$.data.current_utc" }
          assert:
            - "PlatformAdmin: POST /trusts 201, the trust-scoped sweep 200 with swept_count 0, and the clock set 200 — its three exclusive operations all succeed"
            - "MasterServicer: payment-status to DELINQUENT_60, servicing-status to SPECIAL_SERVICING off the auto-recorded MONETARY_DEFAULT_60D event, the 60,000.00 advance and the fee collection all succeed"
            - "SpecialServicerAssetManager: appraisal order, RECEIVED, plan creation, alternative creation, SCORED, RECOMMENDED and consultation issue all succeed; ordered_by_user_id is 'amgr-001' and prepared_by_user_id is 'amgr-001'"
            - "The ACCEPTED transition succeeds for the peer asset manager amgr-002 and cascade-creates the PROVISIONAL reduction of 1900000.00 (10,000,000.00 - 0.90 * 9,000,000.00)"
            - "SpecialServicingCommitteeOfficer: the reduction becomes EFFECTIVE and the plan becomes APPROVED with approved_by_user_id 'cmte-001'"
            - "ControllingClassRepresentative with X-User-ID == ${trust_id} records CONSENTED on a CONSENT_RIGHT consultation, and the plan reaches CONSENT_SATISFIED before the committee approval"
            - "Borrower with X-User-ID == ${loan_id} submits the 15,000.00 assumption request at the floor and withdraws it, reaching the terminal WITHDRAWN state"
            - "Trustee opens the report against the current trust version and certifies it with certified_by_user_id 'trustee-001'"
            - "Not one call in the sequence returned 401, 403 or 404: the matrix's positive half is fully exercised"

