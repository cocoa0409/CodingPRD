        grounds:
          - errors[ERR_ITEM_IN_OPEN_BATCH]
          - errors[ERR_ITEM_HAS_OPEN_REQUEST]
          - validations[priority=45]
          - validations[priority=46]
          - state_machines.ChargeItem
        distinguishing_aspect: "One error id with TWO different thresholds on two different actions: DEACTIVATE only refuses while a line of the item sits in a batch with status IN {INGESTED, RECONCILING}, whereas ARCHIVE refuses until the batch is CLOSED — so a RECONCILED batch permits deactivation and still blocks archival. Priority 46 then blocks archival of a clean item purely because an open ChangeRequest targets it, and WITHDRAW releases it."
