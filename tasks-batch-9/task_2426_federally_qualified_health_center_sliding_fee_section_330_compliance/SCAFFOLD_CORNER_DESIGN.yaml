          - endpoints[POST /health-centers/{id}/service-sites]
        distinguishing_aspect: >-
          Once the baseline is locked, in_initial_scope true is no longer an accepted shortcut into
          IN_SCOPE (ERR_SCOPE_BASELINE_LOCKED / 409) and the lock itself is not re-runnable; adding a
          site with in_initial_scope false still works, which proves the lock closes only the
          baseline door and not the change-in-scope door.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and the scope baseline is then locked"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "POST /health-centers/${chc_id}/lock-scope-baseline"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { clock_v: $.data.version }
          trigger:
            - call: "POST /health-centers/${chc_id}/service-sites"
              payload: { site_name: "Late Baseline Clinic", site_type: "SERVICE_DELIVERY", address_line: "9 Corner Ave", weekly_service_hours: 10, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_locked: $.data.error_id }
            - call: "POST /health-centers/${chc_id}/lock-scope-baseline"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_relock: $.data.error_id }
          assert:
            - "the first trigger returns HTTP 409 with data.error_id == \"ERR_SCOPE_BASELINE_LOCKED\""
            - "the second trigger returns HTTP 409 with data.error_id == \"ERR_SCOPE_BASELINE_LOCKED\""
            - "HealthCenter.${chc_id}.scope_baseline_locked == true and version == ${clock_v}"
            - "GET /health-centers/${chc_id}/service-sites returns total_count == 1"

      - name: uds_report_submit_before_compute_rejected
        claim_type: violation_to_error
        grounds:
