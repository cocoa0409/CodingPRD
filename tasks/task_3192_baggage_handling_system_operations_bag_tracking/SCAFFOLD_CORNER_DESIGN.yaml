              as: AcceptanceAgent
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${bag}", lane_id: "${lane}", start_utc: "2026-09-01T09:00:00Z" }
              as: Screener
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: SortationAgent
              captures: { bag_v_observed: $.data.version }
            - call: "PUT /baggage/bags/${bag}"
              payload: { expected_bag_version: "${bag_v_observed}", anomaly_note: "post-sortation recheck" }
              as: Screener
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: SortationAgent
              captures: { bag_v_now: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v_observed}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:12:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
              captures: { err: $.data.error_id }
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v_now}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:12:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
          assert:
            - "${bag_v_now} == ${bag_v_observed} + 1, because the anomaly note on the screening axis advanced the bag"
            - "the assignment carrying ${bag_v_observed} returns 412 with error_id ERR_STALE_VERSION"
            - "Bag.${bag}.custody_status is still SORTED after the refusal"
            - "the assignment carrying ${bag_v_now} returns 200 and Bag.${bag}.custody_status == IN_MAKEUP"
            - "MakeupArea.${ma}.occupied_slots == 1 after the accepted assignment"
            - "Bag.${bag}.screening_status is IN_LINE, because the anomaly note cycled the screening axis back"

      - name: bulk_assign_makeup_surfaces_per_item_failures
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_/baggage/bags/bulk-assign-makeup
          - entities.Bag.fields.duplicate_flag
          - errors[ERR_DUPLICATE_BAG_ON_FLIGHT]
        distinguishing_aspect: "Batch items are evaluated independently: a duplicate-flagged bag is reported in the rejected array with its own code while the other items in the same call are applied, so the batch neither rolls back nor aborts."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-9 of 6 slots and lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "two bags share passenger_ref PNR7X2Q on the same flight, so the later-accepted one carries duplicate_flag true; a third bag has a distinct reference"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-9", capacity_slots: 6, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_first: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 52, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_dup: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_third: $.data.id }
            - call: "POST /baggage/bags/${b_first}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { v_first: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${b_first}", lane_id: "${lane}", start_utc: "2026-09-01T09:00:00Z" }
              as: Screener
            - call: "POST /baggage/bags/${b_dup}/weigh"
              payload: { scale_weight_lb: 52.0 }
              as: AcceptanceAgent
              captures: { v_dup: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${b_dup}", lane_id: "${lane}", start_utc: "2026-09-01T09:40:00Z" }
              as: Screener
            - call: "POST /baggage/bags/${b_third}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { v_third: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${b_third}", lane_id: "${lane}", start_utc: "2026-09-01T10:20:00Z" }
              as: Screener
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /baggage/bags/bulk-assign-makeup"
              payload: { assignments: [{ bag_id: "${b_first}", expected_bag_version: "${v_first}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:00:00Z", makeup_interval_minutes: 120 }, { bag_id: "${b_dup}", expected_bag_version: "${v_dup}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:12:00Z", makeup_interval_minutes: 120 }, { bag_id: "${b_third}", expected_bag_version: "${v_third}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:24:00Z", makeup_interval_minutes: 120 }] }
              as: SortationAgent
          assert:
            - "the batch returns 200 with three per-item outcomes and does not roll back"
            - "the first and third items are accepted and the second is reported in the rejected array"
            - "Bag.${b_first}.custody_status == IN_MAKEUP and Bag.${b_third}.custody_status == IN_MAKEUP"
            - "Bag.${b_dup}.duplicate_flag == true and Bag.${b_dup}.custody_status == SORTED with its version unchanged at ${v_dup}"
            - "attempting to load Bag.${b_dup} is separately refused with 409 ERR_DUPLICATE_BAG_ON_FLIGHT"
            - "MakeupArea.${ma}.occupied_slots == 2, counting only the two accepted bags"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: computed_counters_are_visible_in_the_same_response_that_mutates_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.station_active_bag_count
          - calculations.makeup_area_occupancy
          - calculations.flight_loaded_bag_count
        distinguishing_aspect: "Every derived counter is already correct in the body of the mutating response itself — no follow-up read is needed to observe the recomputed station, area or flight figure, which is what pins the consistency model to immediate."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-3 of 2 slots and lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag B1 48 lb DOMESTIC cleanly screened and sorted for flight DL1423"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
