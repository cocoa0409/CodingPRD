  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: seat conservation across withdraw+promotion ---
      - name: seat_count_conserved_after_withdraw_and_promotion
        grounds:
          - calculations.enrolled_count_reconciliation
          - state_machines.Enrollment.WAITLISTED_to_ACTIVE
          - state_machines.Student.ACTIVE_to_WITHDRAWN
          - entities.ClassSession.fields.enrolled_count
        distinguishing_aspect: "Conserved quantity = seats. Invariant: ClassSession.enrolled_count == count(Enrollment in {ACTIVE} for that session) AND enrolled_count <= capacity at all times; after a withdraw frees the last seat and the waitlist promotion fills it, enrolled_count returns to exactly 1 with zero drift."
        test_recipe:
          setup:
            - "Capacity-1 session: S1 ACTIVE, S2 WAITLISTED. Withdraw S1's enrollment, which promotes S2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Solo", sequence_order: 1, min_age_months: 36, max_age_months: 200, max_students_per_instructor: 1, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl_id: $.data.id }
