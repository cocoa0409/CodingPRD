# =============================================================================
# SCAFFOLD_CORNER_DESIGN — task_3336 (§1.9 Coverage Index)
# Breadth probe: claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: account_creation_defaults_and_computed_fields
        claim_type: creation_defaults
        grounds: [entities.ContractorAccount]
        distinguishing_aspect: "Create returns 201 with status ACTIVE and outstanding_balance_cents 0; system fields id/created_at/version are server-minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Sierra LLC", tax_id: "EIN-E1", credit_limit_cents: 5000 }
              as: FleetAdmin
              captures: { st: $.data.status, bal: $.data.outstanding_balance_cents, ver: $.data.version }
          assert:
            - "st == ACTIVE"
            - "bal == 0"
            - "ver == 1"

      - name: agreement_end_date_computed_from_term
        claim_type: computed_field
        grounds: [entities.FleetAgreement.fields.end_date]
        distinguishing_aspect: "end_date is computed as start_date + term_months; the input carries no end_date and the stored value is exactly 3 months out."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Tango LLC", tax_id: "EIN-E2", credit_limit_cents: 5000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 3, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ed: $.data.end_date, st: $.data.status, fst: $.data.fleet_size_target }
          assert:
            - "ed == 2026-12-01T00:00:00Z"
            - "st == DRAFT and fst == 0"

      - name: usage_event_rejects_inverted_range_returns_validation
        claim_type: type_constraint
        grounds: [entities.UsageEvent.fields.ended_at, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "ended_at <= started_at is a request-shape violation -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["ACTIVE agreement with one DEPLOYED asset"]
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Uma LLC", tax_id: "EIN-E3", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-E3", tool_category: "DRILL", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-E3", category: "DRILL", replacement_value_cents: 80000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 12, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { asset: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "S-E3", address: "16 Way", capacity_assets: 5, geofence_radius_m: 300 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/assets/${asset}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
          trigger:
            - call: "POST /fleet/assets/${asset}/usage-events"
              payload: { started_at: "2026-09-02T00:00:00Z", ended_at: "2026-09-01T00:00:00Z" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: rate_card_inverted_effective_range_returns_validation
        claim_type: type_constraint
        grounds: [entities.RateCard.fields.effective_to, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "effective_to <= effective_from rejected at creation with 400 ERR_VALIDATION (distinct from overlap ERR_WINDOW_OVERLAP)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-E4", tool_category: "SAW", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 0, effective_from: "2027-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: duplicate_tax_id_rejected
        claim_type: uniqueness
        grounds: [entities.ContractorAccount.fields.tax_id, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second account with the same tax_id -> 409 ERR_DUPLICATE."
        test_recipe:
          setup: ["one account with tax_id EIN-DUP"]
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Victor A", tax_id: "EIN-DUP", credit_limit_cents: 1000 }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Victor B", tax_id: "EIN-DUP", credit_limit_cents: 2000 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"

