            - { call: "POST /wholesale/operators", payload: { name: "Op AC" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-AC", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
