              payload: { hub_id: "${hub_id}", bank_code: "BANK_A", scheduled_start_minutes: 1400, scheduled_end_minutes: 1520, hydraulic_crew_available: false }
              as: HubOpsManager
              captures: { bank_id: $.data.id }
            - call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N701UP", origin_station_code: "LAX", scheduled_arrival_minutes: 1395, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac1_id: $.data.id }
