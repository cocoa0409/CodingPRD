          Depth-3 chain from POST /complete: (1) Appointment.status->COMPLETED
          (2) which moves the reserved SupplyLot unit to units_consumed
          (3) which, because units_consumed+units_reserved == units_total (lot of 1),
          flips SupplyLot.status->EXHAUSTED. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS drip (no SO), LOUNGE; MYERS lot of EXACTLY 1 unit so consume exhausts it."
            - "Appointment scheduled (reserves the unit), dispatched to nurse nurse-A, started after start_at."
