            - "Season regular_due 20000 / late 30000, ACTIVE; club A funded 45000; players P1,P2 memberships PAID (20000 each); P3 membership WAIVED; tournament fee 1035 early-bird 10% (932 per entry); three entries (P1,P2,P3)"
