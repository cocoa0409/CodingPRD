            - "ServiceRequest.${sr_id}.status == CANCELLED"
            - "Assignment.${asg_id}.status == CANCELLED"
            - "Stakeout.${stk_id}.status == CANCELLED"
            - "the STAKEOUT InvoiceLine.voided == true"
            - "ServiceRequest.${sr_id}.final_fee_cents == 7575"

