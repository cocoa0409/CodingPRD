      - name: second_owner_cannot_operate_on_the_first_owners_listing
        claim_type: peer_roles
        grounds:
          - roles.Owner.identity
          - validations[priority 7]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: >-
          Owner is entity_backed, so authority is per-row rather than per-role: a
          second, equally valid Owner passes the role check at priority 3 and
          then fails at priority 7 with 403 ERR_NOT_RESOURCE_OWNER on
          submit-for-review, on document upload (ownership resolved via the
          document's listing) and on booking approval (ownership resolved via the
          booking's listing) — three different resolution paths, one error.
