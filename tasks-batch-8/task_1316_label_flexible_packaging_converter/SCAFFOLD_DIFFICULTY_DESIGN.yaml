  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_singleton_occupation_until_terminal
        grounds:
          - state_machines.LabelJob.RELEASED_to_ON_PRESS
          - state_machines.LabelJob.ON_PRESS_to_PRINTED
          - errors[ERR_PRESS_OCCUPIED]
        distinguishing_aspect: |
          Interval semantics: exclusive whole-entity occupation — the press is
          blocked for the entire [ON_PRESS, PRINTED) occupation window and the
          block lifts only when the occupying job leaves ON_PRESS via
          complete-press, not on any timestamp.
        test_recipe:
          setup:
            - "Customer C; approved 2-color artwork; substrate/ink/die; press P"
            - "J1 RELEASED then started (occupies P); J2 RELEASED against same P"
