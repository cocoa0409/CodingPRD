        excluded_because:
          difficulty_instance: "dual_variant_calc / dv_print_job_invoice_estimate_versus_final_rounding"
          rationale: "The §1.8 instance already reconciles the ESTIMATE and FINAL variants on one job (sum-then-round 105625 versus round-then-sum 105624 with the 1267-cent defect credit) and follows committed_print_cents through the +150625 / -1268 adjustment."
        distinguishing_aspect: "Two variants of the same money calculation must reconcile through a single running ledger field."

      - name: calc_qc_threshold_precision_covered_by_difficulty_design
        claim_type: precision
        grounds:
          - calculations.print_job_quality_inspection.constants
        excluded_because:
          difficulty_instance: "boundary_precision_check / bp_qc_defect_rate_exactly_at_hold_threshold"
          rationale: "The §1.8 instance already sits the cumulative defect rate exactly on QC_HOLD_THRESHOLD_BP (150) to hold the job and then dilutes it one basis point below to release it, which is the whole precision claim for this calculation."
        distinguishing_aspect: "An inclusive >= threshold on a rounded basis-point rate, exercised exactly at the boundary."

