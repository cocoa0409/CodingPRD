              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id", preparer: "$.data.prepared_by_user_id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 1000000 }, { period_index: 2, amount_usd: 8500000 }], upfront_cost_usd: 100000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "RECOMMENDED", selected_alternative_id: "${alt_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "WORKOUT_PLAN", workout_plan_id: "${plan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { consult_id: "$.data.id" }
            - call: "POST /special-servicing/consultations/${consult_id}/response"
              payload: { response: "CONSENTED" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "amgr-001"
              captures: { self_approve_error: "$.data.error_id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { peer_approve_status: "$.data.status", approver: "$.data.approved_by_user_id" }
          assert:
            - "amgr-001 accepting its own ordered appraisal returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES, and so does amgr-001 rejecting it — the guard covers both blessings, not just the favourable one"
            - "amgr-002 accepting the same appraisal succeeds: the appraisal reaches ACCEPTED and cascade-creates the 1900000.00 PROVISIONAL reduction"
            - "A committee officer presenting X-User-ID 'ms-001' — the fee's accrued_by_user_id — is refused with 403 ERR_SEGREGATION_OF_DUTIES even though the role is the correct one for WAIVED"
            - "cmte-001 waives the same accrual successfully, so the block is on the identity and not on the operation"
            - "A committee officer presenting X-User-ID 'amgr-001' — the plan's prepared_by_user_id — is refused with 403 ERR_SEGREGATION_OF_DUTIES on APPROVED"
            - "cmte-001 approves the same plan successfully with approved_by_user_id 'cmte-001', and prepared_by_user_id remains 'amgr-001' so the pair is auditable"
            - "Every refusal left the row's status and version untouched: the appraisal stayed RECEIVED, the accrual stayed ACCRUED and the plan stayed CONSENT_SATISFIED until the legitimate caller acted"

  - section: complexity_layers
    instances:
      - name: both_declared_version_gates_reject_a_stale_read
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - endpoints.POST_workout-plans
          - endpoints.POST_distribution-reports
          - errors.ERR_STALE_TRUST_VERSION
          - errors.ERR_STALE_LOAN_VERSION
        distinguishing_aspect: "Both declared concurrency rules are exercised on their own write endpoint and occ_field in one pass, and the interleaving is what makes them stale: a plain servicing transfer bumps the loan AND the trust, so a version captured before it is rejected on both endpoints afterwards. The same body then succeeds against the re-read version, and reads are shown not to bump either counter."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one trust, one loan in MASTER_SERVICING, no advances anywhere so nothing else can move a version."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V46", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", trust_version_0: "$.data.version" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V46", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id", loan_version_0: "$.data.version" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_version_read_a: "$.data.version" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_version_read_b: "$.data.version" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version_read_a: "$.data.version" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version_read_b: "$.data.version" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version_1: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 8.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version_0}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { stale_loan_error: "$.data.error_id" }
            - call: "POST /special-servicing/distribution-reports"
              payload: { trust_id: "${trust_id}", report_type: "DELINQUENT_LOAN_STATUS", period_end: "2026-07-31T00:00:00Z", expected_trust_version: "${trust_version_0}" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { stale_trust_error: "$.data.error_id" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { trust_version_1: "$.data.version", loans_in_special: "$.data.loans_in_special_servicing_count" }
            - call: "POST /special-servicing/distribution-reports"
              payload: { trust_id: "${trust_id}", report_type: "DELINQUENT_LOAN_STATUS", period_end: "2026-07-31T00:00:00Z", expected_trust_version: "${trust_version_1}" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { report_id: "$.data.id", report_snapshot_count: "$.data.loans_in_special_count" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 8.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version_1}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version_2: "$.data.version", loan_servicing_2: "$.data.servicing_status" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version_1}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { second_stale_error: "$.data.error_id" }
          assert:
            - "Two consecutive reads of the trust return the same version, and two consecutive reads of the loan return the same version: GET never bumps an occ_field"
            - "The plan creation carrying the pre-transfer loan version returns HTTP 412 with error_id ERR_STALE_LOAN_VERSION and creates no plan"
            - "The report creation carrying the pre-transfer trust version returns HTTP 412 with error_id ERR_STALE_TRUST_VERSION and creates no report — the transfer bumped the trust too, via loans_in_special_servicing_count"
            - "After re-reading, the identical report body succeeds at 201 with loans_in_special_count 1, and the identical plan body succeeds at 201"
            - "Creating the plan bumped the loan again (loan_version_2 == loan_version_1 + 1) because the loan moved SPECIAL_SERVICING -> IN_WORKOUT and active_workout_plan_id was written"
            - "Re-using loan_version_1 for a second plan therefore returns 412 ERR_STALE_LOAN_VERSION: a version is good for exactly one write"
            - "Every 412 is returned before any side effect: no plan is superseded, no report row exists and the loan's servicing_status is unchanged by the failed calls"

      - name: multi_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.REOAsset.UNDER_CONTRACT_to_SOLD
        excluded_because:
          difficulty_instance: transitive_cascade / reo_sale_four_link_waterfall_and_control_restoration_cascade
          rationale: "The §1.8 transitive-cascade instance already drives the deepest chain in the domain end to end — one SOLD transition writing the liquidation fee accrual, the advance reimbursements, the loan's principal recovery and realized loss, the trust's realized loss and advance ledgers, the reversal of the effective appraisal reduction and the re-run control test — and asserts the ordering sensitivity that makes a wrong sequence produce a different realized loss. A §1.9 instance could only restate the same chain with different literals."

      - name: both_variants_of_the_reduction_calculation_produce_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.appraisal_reduction_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / ara_gross_appraised_versus_net_liquidation_credit_basis
          rationale: "The §1.8 dual-variant instance already runs both appraisal-reduction variants over identical principal and value figures, pins the delta produced by deducting estimated liquidation expenses before the 90% credit, and asserts the variant selection rule that ties FULL_NARRATIVE to the net-liquidation basis. The remaining dual-variant surface — the fee basis convention — is covered by its own §1.8 instance."

      - name: control_test_threshold_evaluated_at_the_exact_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.controlling_class_control_test
        excluded_because:
          difficulty_instance: boundary_precision_check / control_termination_at_exact_twenty_five_percent_notional
          rationale: "The §1.8 boundary-precision instance already tests the instantaneous 25% control threshold at notional exactly equal to the threshold, one cent above it and one cent below it, including the inclusive comparison that keeps control alive at equality. Restating it here would only change the fixture balances."

