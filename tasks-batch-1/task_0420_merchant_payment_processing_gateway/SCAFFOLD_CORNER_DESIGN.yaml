              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /merchants/${m_id}/suspend"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/reinstate"
              payload: {}
              as: UnderwritingOfficer
          trigger:
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v_stale}" }
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_MERCHANT_VERSION"

      - name: corner_occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Merchant
          - state_machines.Merchant.APPROVED_to_SUSPENDED
          - endpoints.POST./merchants/{id}/suspend
        distinguishing_aspect: "Merchant.version is strictly monotonic across writes: approve bumps it once, then suspend bumps it again (version after suspend == version after approve + 1)."
        test_recipe:
          setup:
            - "A PENDING_REVIEW merchant."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Ver Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { v_approve: $.data.version }
          trigger:
            - call: "POST /merchants/${m_id}/suspend"
              payload: {}
              as: UnderwritingOfficer
              captures: { v_suspend: $.data.version }
          assert:
            - "${v_suspend} == ${v_approve} + 1"

      - name: corner_reserve_release_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.ReserveEntry.HELD_to_RELEASED
          - calculations.merchant_balance_recompute
          - endpoints.POST./merchants/{id}/reserve-releases
        distinguishing_aspect: "After a reserve release sweep past release_date, reserved_balance_cents drops to 0 and the released amount (500) moves into available_balance_cents — the derived balances reconcile to the ledger."
        test_recipe:
          setup:
            - "A MEDIUM merchant with a funded batch holding reserve 500; clock advanced past release_date."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "RR Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /merchants/${m_id}/reserve-releases"
              payload: {}
              as: PlatformOperator
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_post: $.data.available_balance_cents, reserved_post: $.data.reserved_balance_cents }
          assert:
            - "Merchant.${m_id}.reserved_balance_cents == 0 after release"
            - "Merchant.${m_id}.available_balance_cents == 9680 after release (9180 + 500 released)"

      - name: corner_ledger_filter_by_entry_type_pagination
        claim_type: pagination_with_filtering
        grounds:
          - entities.LedgerEntry.fields.entry_type
          - endpoints.GET./merchants/{id}/ledger-entries
        distinguishing_aspect: "GET /merchants/{id}/ledger-entries?entry_type=RESERVE_HOLD returns only RESERVE_HOLD entries; with one such entry, total_count=1 and has_more=false."
        test_recipe:
          setup:
            - "A MEDIUM merchant with a settled batch that produced a RESERVE_HOLD entry (and other entries)."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "LF Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
          trigger:
            - call: "GET /merchants/${m_id}/ledger-entries?entry_type=RESERVE_HOLD&limit=10"
              payload: {}
              as: PlatformOperator
          assert:
            - "response status == 200"
            - "every returned entry has entry_type == RESERVE_HOLD"
            - "meta/pagination total_count == 1"
            - "meta/pagination has_more == false"

      - name: corner_dual_variant_calc_excluded
        claim_type: dual_variant_calculation
        grounds:
          - calculations.processing_fee
        excluded_because:
          difficulty_instance: flat_vs_interchange_plus_fee_on_identical_capture
          rationale: "The dual_variant_calculation layer (FLAT vs INTERCHANGE_PLUS fee) is fully exercised by the §1.8 instance."

      - name: corner_cascading_side_effects_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SettlementBatch.OPEN_to_SETTLED
        excluded_because:
          difficulty_instance: settle_cascade_charge_reserve_ledger_depth3
          rationale: "The depth-3 settle cascade (charge SETTLED -> ReserveEntry HELD -> RESERVE_HOLD ledger -> reserved_balance) is fully exercised by the §1.8 instance."

  # =========================================================================
  - section: Consistency Model
    instances:
      - name: corner_immediate_capture_visible_in_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST./charges/{id}/capture
          - endpoints.GET./charges/{id}
        distinguishing_aspect: "Under the immediate consistency model, the captured_amount_cents and processing_fee_cents set by capture are visible both in the capture response AND in an immediate subsequent GET /charges/{id}, with identical values."
        test_recipe:
          setup:
            - "An APPROVED LOW merchant with an AUTHORIZED charge of 10000 on a FLAT plan (290bps+30)."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Imm Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { fee_in_capture: $.data.processing_fee_cents }
            - call: "GET /charges/${ch_id}"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { fee_in_get: $.data.processing_fee_cents }
          assert:
            - "${fee_in_capture} == 320"
            - "${fee_in_get} == 320"
            - "${fee_in_get} == ${fee_in_capture} (immediate consistency)"
