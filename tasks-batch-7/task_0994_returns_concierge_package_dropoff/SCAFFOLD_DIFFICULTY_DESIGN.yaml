            - "tote_units == 3 after adding O2 post-unseal (cycle allowed further membership change)"
            - "st_disc == DISCREPANCY after flag; st_rec == RECONCILED (audit loop completes)"
            - "ReturnOrder.${ro1}.status == INSPECTING and ReturnOrder.${ro2}.status == INSPECTING after arrive"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: exception_approve_damaged_depth4_cascade
        grounds:
          - state_machines.ExceptionCase.INVESTIGATING_to_RESOLVED_APPROVED
          - state_machines.ReturnOrder.EXCEPTION_PENDING_to_RESOLVED
          - state_machines.ReturnOrder.RESOLVED_to_REFUND_POSTED
        distinguishing_aspect: |
          Depth-4 chain from the resolve trigger: resolve -> linked item condition
          DAMAGED->DEFECTIVE (link 1) -> order re-evaluates EXCEPTION_PENDING ->
          RESOLVED (link 2) -> FINAL ledger entry appended, order REFUND_POSTED
          (link 3) -> covering BillingCycle.refunds_accrued_cents refreshed (link 4).
        test_recipe:
          setup:
            - "Plan free_returns=false, pickup true; merchant; OPEN cycle; shopper; zone"
            - "Order with items A (4000 declared NEW) and B (2500 declared NEW); fulfilled to INSPECTING; A inspected DAMAGED; DAMAGED_ITEM exception opened by agent-a (order EXCEPTION_PENDING); B inspected NEW while EXCEPTION_PENDING (last item, open exception -> stays EXCEPTION_PENDING)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-D4", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_id: $.data.id } }
            - { call: "POST /v1/shoppers", payload: { email: "s4@x.com", full_name: "S Four", postal_code: "10010" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "Z4", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "A4", quantity: 1, unit_price_cents: 4000, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 }, { sku: "B4", quantity: 1, unit_price_cents: 2500, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it_a: "$.data[0].id", it_b: "$.data[1].id" } }
            - { call: "POST /v1/return-items/${it_a}/inspect", payload: { condition: DAMAGED }, as: PlatformAdmin }
            - { call: "POST /v1/exception-cases", payload: { return_order_id: "${ro_id}", kind: DAMAGED_ITEM, note: "contest damage", return_item_id: "${it_a}" }, as: SupportAgent, as_user_id: "agent-a", captures: { ex_id: $.data.id } }
            - { call: "POST /v1/return-items/${it_b}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v: $.data.version } }
          trigger:
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, note: "merchant fault", expected_exception_case_version: "${ex_v}" }, as: SupportAgent, as_user_id: "agent-b" }
            - { call: "GET /v1/return-items/${it_a}", payload: {}, as: PlatformAdmin, captures: { it_a_cond: $.data.condition, it_a_ded: $.data.deduction_cents } }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: PlatformAdmin, captures: { ro_st: $.data.status, ro_fin: $.data.refund_final_cents } }
            - { call: "GET /v1/merchant-accounts/${m_id}/billing-cycles", payload: {}, as: PlatformAdmin, captures: { bc_accrued: "$.data[0].refunds_accrued_cents" } }
          assert:
            - "it_a_cond == DEFECTIVE and it_a_ded == 0 (link 1: condition flip on approval)"
            - "ro_st == REFUND_POSTED and ro_fin == 6500 (links 2-3: re-eval -> RESOLVED -> FINAL 4000 + 2500)"
            - "bc_accrued == 6500 (link 4: cycle accrual refreshed)"

      - name: reservation_consume_three_link_cascade
        grounds:
          - state_machines.SlotReservation.HELD_to_CONSUMED
          - state_machines.LockerSlot.RESERVED_to_OCCUPIED
          - state_machines.Label.ISSUED_to_CONSUMED
        distinguishing_aspect: |
          Depth-3 chain from consume (different trigger from the exception
          cascade): reservation CONSUMED -> slot RESERVED->OCCUPIED (link 1) ->
          order LABEL_ISSUED->DROPPED_OFF (link 2) -> bound label ISSUED->CONSUMED
          (link 3); location slot counters move in lockstep.
        test_recipe:
          setup:
            - "Plan boxless true; merchant; cycle; shopper; LOCKER location LO OPERATIONAL with XL slot SL"
            - "Order LOCKER_QR (item dim 40); reservation RS on SL -> HELD, QR label auto-issued, order LABEL_ISSUED"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Lck", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sl@x.com", full_name: "S Lock", postal_code: "10011" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-Lock", kind: LOCKER, postal_code: "20002" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "LK", quantity: 1, unit_price_cents: 1200, declared_condition: NEW, longest_side_cm: 40, weight_grams: 300 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res_id: $.data.id, res_label: $.data.label_id } }
          trigger:
            - { call: "POST /v1/slot-reservations/${res_id}/consume", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { res_st: $.data.status } }
            - { call: "GET /v1/locker-slots/${slot_id}", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { slot_st: $.data.status } }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { ro_st: $.data.status, ro_loc: $.data.dropoff_location_id } }
            - { call: "GET /v1/labels/${res_label}", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { lb_st: $.data.status } }
            - { call: "GET /v1/dropoff-locations/${loc_id}", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { loc_res: $.data.reserved_slot_count, loc_occ: $.data.occupied_slot_count } }
          assert:
            - "res_st == CONSUMED"
            - "slot_st == OCCUPIED (link 1)"
            - "ro_st == DROPPED_OFF and ro_loc == \"${loc_id}\" (link 2)"
            - "lb_st == CONSUMED (link 3)"
            - "loc_res == 0 and loc_occ == 1 (counters consistent with the chain)"

      - name: sweep_expiry_four_link_cascade
        grounds:
          - calculations.label_expiry
          - state_machines.Label.ISSUED_to_EXPIRED
          - state_machines.SlotReservation.HELD_to_EXPIRED
          - state_machines.LockerSlot.RESERVED_to_EMPTY
        distinguishing_aspect: |
          Depth-4 chain from a different trigger class (scheduled sweep): label
          EXPIRED (link 1) -> bound HELD reservation EXPIRED (link 2) -> slot
          RESERVED->EMPTY (link 3) -> location.reserved_slot_count recomputed to 0
          (link 4). Order itself survives LABEL_ISSUED for re-issue.
        test_recipe:
          setup:
            - "Plan boxless true; merchant; cycle; shopper; LOCKER location LS with XL slot"
            - "Order LOCKER_QR; reservation at default clock 2026-05-01T00:00:00Z (hold_until 2026-05-03T00:00:00Z; label expires 2026-05-11T00:00:00Z)"
            - "Clock advanced to 2026-05-12T00:00:00Z (past both deadlines)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Swp", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "ss@x.com", full_name: "S Sweep", postal_code: "10012" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-Swp", kind: LOCKER, postal_code: "20003" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "SW", quantity: 1, unit_price_cents: 900, declared_condition: NEW, longest_side_cm: 40, weight_grams: 300 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res_id: $.data.id, res_label: $.data.label_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/_maintenance/run_sweep", payload: {}, as: PlatformAdmin, captures: { n_lab: $.data.expired_label_count, n_res: $.data.expired_reservation_count } }
            - { call: "GET /v1/labels/${res_label}", payload: {}, as: PlatformAdmin, captures: { lb_st: $.data.status } }
            - { call: "GET /v1/slot-reservations/${res_id}", payload: {}, as: PlatformAdmin, captures: { res_st: $.data.status } }
            - { call: "GET /v1/locker-slots/${slot_id}", payload: {}, as: PlatformAdmin, captures: { slot_st: $.data.status } }
            - { call: "GET /v1/dropoff-locations/${loc_id}", payload: {}, as: PlatformAdmin, captures: { loc_res: $.data.reserved_slot_count } }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: PlatformAdmin, captures: { ro_st: $.data.status } }
          assert:
            - "n_lab == 1 and n_res == 1"
            - "lb_st == EXPIRED (link 1) and res_st == EXPIRED (link 2)"
            - "slot_st == EMPTY (link 3) and loc_res == 0 (link 4)"
            - "ro_st == LABEL_ISSUED (order survives; re-issue remains possible)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: create_order_referential_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair business_referential (P7) vs business_fiscal (P12): the merchant is
          SUSPENDED and the create would also breach the 2x overage hard cap;
          the higher-priority ERR_MERCHANT_SUSPENDED must win.
        test_recipe:
          setup:
            - "Plan included_returns=1, pickup true, fees trivial; merchant MG; OPEN cycle; shopper SG; zone"
            - "Two orders fulfilled to REFUND_POSTED (fulfilled_count == 2 == 2*included -> any further create breaches the fiscal cap: projected 3 > 2)"
            - "Merchant suspended before the third create"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 1, overage_fee_cents: 100, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Prio", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sp@x.com", full_name: "S Prio", postal_code: "10013" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZP", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "P1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro1}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap1: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap1}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap1}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro1}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro1}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "P2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro2}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap2: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap2}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap2}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro2}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro2}/items", payload: {}, as: PlatformAdmin, captures: { it2: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it2}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts/${m_id}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "P3", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MERCHANT_SUSPENDED (P7 referential beats P12 fiscal ERR_OVERAGE_LIMIT_EXCEEDED even though both hold)"

      - name: create_order_safety_beats_plan_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair business_safety (P8) vs business_constraint (P9): a LOCKER_QR order
          with a 200 cm item violates the dimension cap AND the plan's missing
          boxless_enabled gate; ERR_DIM_EXCEEDS_XL must win.
        test_recipe:
          setup:
            - "Plan boxless_enabled=false, oversize_enabled=true, pickup false; merchant; OPEN cycle; shopper"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: false, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Safe", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sf@x.com", full_name: "S Safe", postal_code: "10014" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "BIG", quantity: 1, unit_price_cents: 5000, declared_condition: NEW, longest_side_cm: 200, weight_grams: 9000 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DIM_EXCEEDS_XL (P8 safety beats P9 feature-gate ERR_FEATURE_NOT_INCLUDED even though boxless_enabled=false also blocks LOCKER_QR)"

      - name: pickup_create_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair state (P6) vs business_temporal (P10): the order is CANCELLED and
          the requested window is in the past; ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Plan pickup true; merchant; cycle; shopper; zone; HOME_PICKUP order created then cancelled while INITIATED"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Temp", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "stm@x.com", full_name: "S Temp", postal_code: "10015" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZTM", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "TP", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/return-orders/${ro_id}/cancel", payload: {}, as: Shopper, as_user_id: "${sh_id}" }
          trigger:
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (P6 state beats P10 ERR_PICKUP_WINDOW_PAST even though the window is also in the past)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: locker_xl_dim_boundary_150_accepted_151_rejected
        grounds:
          - validations[priority=8]
          - entities.ReturnItem.fields.longest_side_cm
        distinguishing_aspect: |
          Metric longest_side_cm on POST /v1/return-orders: exactly 150 cm passes
          the locker gate (> 150 rejects); 150.01 is rejected with
          ERR_DIM_EXCEEDS_XL. Boundary is strict-greater, not greater-or-equal.
        test_recipe:
          setup:
            - "Plan boxless true, oversize true; merchant; cycle; shopper; LOCKER location with XL slot"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-XL", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sx@x.com", full_name: "S XL", postal_code: "10016" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-XL", kind: LOCKER, postal_code: "20004" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
