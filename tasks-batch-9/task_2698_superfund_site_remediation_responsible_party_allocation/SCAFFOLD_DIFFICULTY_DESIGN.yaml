  - rule_id: resource_temporal_overlap
    instances:

      - name: chain_of_title_half_open_adjacency_and_open_ended_period_conflict
        grounds:
          - calculations.ownership_period_days
          - validations[priority=29]
          - errors[ERR_OWNERSHIP_PERIOD_OVERLAP]
          - endpoints[POST /sites/{id}/ownership-periods]
          - entities.OwnershipPeriod.fields.ownership_days
          - entities.PotentiallyResponsibleParty.fields.ownership_days_total
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN CALENDAR DATE intervals [start_date, end_date) with a null
          end_date meaning 9999-12-31, compared across ALL parties of the site because the chain of
          title must partition time. Adjacency at a shared endpoint is legal, a zero-length period is
          legal, and an open-ended period conflicts with everything after its start.
        test_recipe:
          setup:
            - "Site listed with two identified parties, A and B, and no ownership periods yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Mill Race Coke Works", epa_region: 3, hrs_score: 55.40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-MRC-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Mill Race Coke Co", party_type: "OWNER_OPERATOR", viability_score: 70 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Race Street Holdings LP", party_type: "OWNER_OPERATOR", viability_score: 64 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_b: $.data.id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_a}", start_date: "1962-03-01", end_date: "1978-06-01", acquisition_type: "PURCHASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { op1: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_b}", start_date: "1978-06-01", end_date: "1995-01-01", acquisition_type: "MERGER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { op2: $.data.id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_a}", start_date: "1995-01-01", end_date: "1995-01-01", acquisition_type: "LEASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { op3: $.data.id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_b}", start_date: "1978-05-31", end_date: "1978-06-02", acquisition_type: "FORECLOSURE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err1: $.data.error_id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_b}", start_date: "1995-01-01", end_date: null, acquisition_type: "PURCHASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { op5: $.data.id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_a}", start_date: "2000-01-01", end_date: "2001-01-01", acquisition_type: "PURCHASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err2: $.data.error_id }
          assert:
            - "OwnershipPeriod.${op1}.ownership_days == 5936 (1962-03-01 to 1978-06-01 on the half-open interval)"
            - "the adjacent period is accepted with HTTP 201: OwnershipPeriod.${op2}.ownership_days == 6058, because op1 ends on exactly the day op2 starts and touching endpoints do not conflict"
            - "the zero-length period is accepted with HTTP 201: OwnershipPeriod.${op3}.ownership_days == 0 (start_date == end_date conflicts with nothing)"
            - "the 1978-05-31 .. 1978-06-02 period returns HTTP 409 with $.data.error_id == ERR_OWNERSHIP_PERIOD_OVERLAP - it straddles op1's end by one day, and the overlap test spans parties (A's period blocks B's)"
            - "the open-ended period is accepted with HTTP 201 and OwnershipPeriod.${op5}.ownership_days == 2923765 (null end_date evaluated as 9999-12-31)"
            - "the 2000-01-01 .. 2001-01-01 period returns HTTP 409 with $.data.error_id == ERR_OWNERSHIP_PERIOD_OVERLAP - it falls inside the open-ended op5"
            - "PotentiallyResponsibleParty.${prp_a}.ownership_days_total == 5936 (5936 + 0; neither rejected create contributed)"
            - "PotentiallyResponsibleParty.${prp_b}.ownership_days_total == 2929823 (6058 + 2923765)"
            - "GET /sites/${site_id}/ownership-periods returns total_count == 4 - exactly the four accepted rows"

      - name: work_window_buffered_capacity_counts_windows_six_hours_apart
        grounds:
          - calculations.work_window_capacity
          - validations[priority=30]
          - errors[ERR_WORK_WINDOW_CAPACITY_EXCEEDED]
          - endpoints[POST /remediation-contracts/{id}/work-windows]
          - entities.RemediationContract.fields.max_concurrent_windows
          - entities.RemediationContract.fields.work_window_count
        distinguishing_aspect: |
          Completely different interval semantics from the chain-of-title instance: TIMESTAMP intervals
          PADDED by a 4-hour mobilization buffer on both ends, scoped to a single contract, and the
          question is not "do two intervals collide" but "does the buffered concurrency count exceed
          max_concurrent_windows". Two windows six raw hours apart do overlap once padded, and buffered
          adjacency (one buffered_end_at exactly equal to another's buffered_start_at) does not.
        test_recipe:
          setup:
            - "Site through to construction: RI approved, ROD signed with one public comment on file, contract awarded with max_concurrent_windows 2."
