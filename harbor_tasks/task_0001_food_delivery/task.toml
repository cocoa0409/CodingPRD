version = "1.0.0"

[task]
name = "task_0001_food_delivery"

[metadata]
# Path (relative to repo root) of the original prd-bench task this Harbor task
# wraps. Read by harbor_tasks/_lib/prepare.sh.
source_task = "tasks/task_0001_food_delivery_for_harbor"

# Verifier runs in the same container as the agent (default = "shared"). The
# default timeout (~600s) is too short for our 100+ pytest suite — bump it.
[verifier]
timeout_sec = 900

# Default agent timeout is too short for writing an entire service from scratch.
[agent]
timeout_sec = 3600
