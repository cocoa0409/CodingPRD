        distinguishing_aspect: "Escalation is the second exit from OPEN: it moves the hold to ESCALATED and drops open_hold_count to 0, so a ship that was previously refused by ERR_HOLD_OPEN_BLOCKS_ACTION now succeeds without anyone releasing the hold."
