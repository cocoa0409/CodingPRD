      - name: parallel_status_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.OperatingAuthority.authority_status
          - state_machines.OperatingAuthority.insurance_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / authority_status_and_insurance_status_dimensions_advance_independently
          rationale: "The §1.8 instance walks both dimensions through PENDING/NOT_FILED, PENDING/PARTIAL, PENDING/FILED and ACTIVE/LAPSED, asserting each pair; nothing is left for a breadth instance."

      - name: filing_cancel_cascades_down_to_contracts_and_shipments
        claim_type: cascade_down
        grounds:
          - state_machines.OperatingAuthority.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / filing_cancel_cascades_four_hops_and_mints_a_proceeding
          rationale: "The §1.8 instance asserts all four hops of the SUSPEND macro plus the minted proceeding, including the conditional-cascade exclusions."
      - name: only_non_terminal_children_are_touched_by_the_cascade
        claim_type: conditional_cascade
        grounds:
          - state_machines.OperatingAuthority.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / designation_revoke_cascades_three_hops_without_a_proceeding
          rationale: "That instance pins the DELIVERED-shipment and TERMINATED-contract exclusions as its distinguishing aspect."
      - name: cure_reverses_every_suspension_side_effect
        claim_type: compensation
        grounds:
          - state_machines.RevocationProceeding.NOTICE_ISSUED_to_CURED
        excluded_because:
          difficulty_instance: compensating_invariant / suspension_and_cure_conserve_the_contract_and_shipment_population
          rationale: "The §1.8 instance asserts the full RESTORE round trip with zero population drift."
      - name: fee_ledger_stays_in_sync_with_the_carrier_totals
