scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_fee_front_vs_back_end
        grounds:
          - calculations.subscription_fee
          - entities.Fund.fields.back_end_load_enabled
          - state_machines.Order.ACCEPTED_to_CONFIRMED
        distinguishing_aspect: |
          Two valid algorithms on the SUBSCRIBE Order: front-end deducts the tiered subscription fee
          from gross before share minting (1500 cents fee, 9_850_000 shares for 100_000 cents @ NAV=1.0,
          150bps), while back-end mints from full gross (0 fee, 10_000_000 shares) and defers fee to
          redemption — same gross_amount and NAV produce different confirmed_shares (delta = 150_000
          1e-4-share units). Operates on Order entity domain.
        test_recipe:
          setup:
            - "POST /investors → investor_a country_code=CN, risk_tolerance=C5, tax=DOMESTIC, kyc APPROVED, cash 200_000 cents"
            - "POST /investors → investor_b same profile, cash 200_000 cents"
            - "POST /funds → fund_front: fund_type=BOND, risk_rating=R3, allowed=[CN], subscription_fee_tiers=[{min:0, max:null, rate_bps:150}], back_end_load_enabled=false, NAV inputs sized so nav_micros=1_000_000"
            - "POST /funds → fund_back: identical except back_end_load_enabled=true"
            - "POST /funds/{fund_front}/submit-for-review and approve-shelf (different actor)"
            - "POST /funds/{fund_back}/submit-for-review and approve-shelf (different actor)"
            - "POST /_clock/advance to 2026-05-04T10:00:00Z (pre-cutoff)"
          trigger:
            - "POST /orders {investor_a, fund_front, SUBSCRIBE, gross_amount_cents=100000}"
            - "POST /orders {investor_b, fund_back, SUBSCRIBE, gross_amount_cents=100000}"
            - "POST /_clock/advance to 2026-05-05T00:00:01Z"
            - "POST /funds/{fund_front}/nav/publish nav_date=2026-05-04, gross_assets sized for nav_micros=1_000_000"
            - "POST /funds/{fund_back}/nav/publish similar"
          assert:
            - "Order_front.subscription_fee_cents == 1500"
            - "Order_front.confirmed_shares == 9850000"
            - "Order_back.subscription_fee_cents == 0"
            - "Order_back.confirmed_shares == 10000000"
            - "Order_back.confirmed_shares - Order_front.confirmed_shares == 150000"

      - name: nav_publish_initial_vs_steady_state
        grounds:
          - calculations.nav_per_share
          - entities.NavSnapshot.fields.shares_outstanding_at_nav
          - state_machines.NavSnapshot.PROVISIONAL_to_PUBLISHED
        distinguishing_aspect: |
          Two valid algorithms for nav_per_share on the NavSnapshot/Fund entity (DIFFERENT entity
          domain from Rule 1 instance 1): when shares_outstanding_at_nav == 0 the constant
          INITIAL_NAV_MICROS=1_000_000 is used (ignoring asset valuation entirely); once shares > 0
          the divisor formula nav_micros = round_half_up(net_assets * 1e8 / shares_outstanding) is
          used. Same Fund.portfolio_market_value and fees produce wildly different nav_micros across
          the two regimes (1_000_000 vs computed value).
        test_recipe:
          setup:
            - "POST /funds → fund_x: BOND, all fees 0 bps, allowed=[CN], R3"
            - "Submit-for-review and approve-shelf (different actor)"
            - "POST /_clock/advance to 2026-05-05T00:00:01Z"
          trigger:
            - "POST /funds/{fund_x}/nav/publish nav_date=2026-05-04, portfolio_market_value_cents=500000, portfolio_accrued_income_cents=0"
            - "Then with shares=100_000_000 in another fund_y created identically: gross_assets_cents=1_000_000, fees=0, shares_out=100_000_000"
          assert:
            - "NavSnapshot(fund_x, 2026-05-04).nav_per_share_micros == 1000000  # INITIAL constant path"
            - "NavSnapshot(fund_y, 2026-05-04).nav_per_share_micros == 1000000  # divisor path with ga=1M cents, so=1e8 -> 1e6 micros"
            - "NavSnapshot.shares_outstanding_at_nav == 0 for fund_x and == 100000000 for fund_y"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: nav_fee_deduction_nested_rounding_order_a_then_b
        grounds:
          - calculations.nav_per_share
          - entities.Fund.fields.management_fee_bps_annual
          - entities.Fund.fields.custodian_fee_bps_annual
          - entities.Fund.fields.sales_service_fee_bps_annual
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Each daily fee is rounded HALF_UP at cents
          INDIVIDUALLY before subtraction (mgmt=100, cust=100, sales=100 → net=999_700) and then
          nav_micros divides on the post-subtraction integer. The alternative — sum_then_round —
          would yield mgmt+cust+sales = round(300.0)=300 (same here) but with non-integer daily
          accruals (e.g., 300 bps with non-365 day base) would diverge by 1 cent. The scaffold pins
          per-fee-then-sum.
        test_recipe:
          setup:
            - "POST /funds → fund_z: BOND, mgmt 365 bps, cust 365 bps, sales 365 bps, R3, allowed=[CN]"
            - "Submit-for-review, approve-shelf (different actor)"
            - "Pre-load total_outstanding_shares=100_000_000 by confirming an earlier subscribe order at NAV=1.0"
            - "POST /_clock/advance past T+1"
          trigger:
            - "POST /funds/{fund_z}/nav/publish nav_date=T, portfolio_market_value_cents=1_000_000, portfolio_accrued_income_cents=0"
          assert:
            - "NavSnapshot.management_fee_accrued_cents == 100"
            - "NavSnapshot.custodian_fee_accrued_cents == 100"
            - "NavSnapshot.sales_service_fee_accrued_cents == 100"
            - "NavSnapshot.net_assets_cents == 999700"
            - "NavSnapshot.nav_per_share_micros == 999700"

      - name: redemption_fee_circular_dependency_pinned
        grounds:
          - calculations.redemption_fee_with_holding_period
          - entities.Fund.fields.back_end_load_enabled
          - entities.Fund.fields.subscription_fee_tiers
          - entities.LotEntry.fields.cost_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. confirmed_amount_cents depends on
          back_end_load_fee_cents which depends on lot.cost_cents which itself was set when the lot
          was minted from a SUBSCRIBE whose subscription_fee_cents was zero (back-end model). The
          scaffold pins evaluation order: (1) FIFO-locate lots, (2) per-lot redemption fee using
          holding-period tier, (3) per-lot back-end load using ORIGINAL cost_cents (NOT current
          NAV), (4) sum, (5) confirmed_amount = gross_redeem − redemption_fee − back_end_load.
          Different mode from instance 1 (which is pinned per-line-item rounding).
        test_recipe:
          setup:
            - "Fund back_end_load_enabled=true, subscription_fee_tiers=[{0..null, 150bps}], redemption_fee_tiers=[{0..30 days, 50bps}, {30..null, 25bps}]"
            - "Investor cash 200_000 cents, kyc APPROVED, R3 suitable"
            - "POST /orders SUBSCRIBE 100_000 cents at NAV=1.0 → confirmed_shares=10_000_000, lot.cost_cents=100_000"
            - "POST /_clock/advance 5 days"
          trigger:
            - "POST /orders REDEEM requested_shares=10_000_000"
            - "POST /_clock/advance and POST nav/publish to confirm"
          assert:
            - "Order.redemption_fee_cents == 500  # 100_000 * 50/10000"
            - "Order.back_end_load_fee_cents == 1500  # cost_cents=100_000 * 150/10000"
            - "Order.confirmed_amount_cents == 100_000 - 500 - 1500 == 98000"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fund_shelf_revision_cycle
        grounds:
          - state_machines.Fund.UNDER_REVIEW_to_DRAFT
          - state_machines.Fund.DRAFT_to_UNDER_REVIEW
          - state_machines.Fund.ON_SHELF_to_SUSPENDED
          - state_machines.Fund.SUSPENDED_to_ON_SHELF
        distinguishing_aspect: |
          Cycle on Fund: DRAFT→UNDER_REVIEW→DRAFT (revision loop) and ON_SHELF→SUSPENDED→ON_SHELF
          (suspend loop) — both A→B→A patterns on the SAME entity. Not a linear pipeline.
        test_recipe:
          setup:
            - "POST /funds → fund_q in DRAFT"
          trigger:
            - "POST /funds/{fund_q}/submit-for-review (now UNDER_REVIEW)"
            - "POST /funds/{fund_q}/reject-shelf with different reviewer (back to DRAFT)"
            - "POST /funds/{fund_q}/submit-for-review (UNDER_REVIEW again)"
            - "POST /funds/{fund_q}/approve-shelf (different reviewer, ON_SHELF)"
            - "POST /funds/{fund_q}/suspend (SUSPENDED)"
            - "POST /funds/{fund_q}/resume (ON_SHELF again)"
          assert:
            - "Fund.status final value == 'ON_SHELF'"
            - "Fund.shelf_creator_actor_id reset to null after first reject (then re-set on second submit)"
            - "AuditLog count for FUND_SHELF_CHANGE on fund_q == 6"

      - name: order_redemption_branching_with_deferral_loop
        grounds:
          - state_machines.Order.ACCEPTED_to_LARGE_REDEMPTION_DEFERRED
          - state_machines.Order.LARGE_REDEMPTION_DEFERRED_to_CONFIRMED
          - state_machines.Order.ACCEPTED_to_CONFIRMED
        distinguishing_aspect: |
          Branching fork on Order (DIFFERENT entity from Fund instance 1): from ACCEPTED, system
          chooses between → CONFIRMED (normal NAV publication path) OR → LARGE_REDEMPTION_DEFERRED
          → CONFIRMED (deferred path, +1 day confirm_date) based on
          large_redemption_pct_bps vs Fund.large_redemption_threshold_pct_bps. Two branches with
          divergent side-effect timing converge at CONFIRMED.
        test_recipe:
          setup:
            - "Fund total_outstanding_shares=100_000_000, threshold_bps=1000, on shelf"
            - "Investor holds 10_000_000 shares from prior subscribe"
          trigger:
            - "POST /orders REDEEM requested_shares=10_000_000 (= exactly 1000 bps = 10%)"
            - "POST /_clock/advance to T+1, POST nav/publish"
            - "POST /_clock/advance to T+2, POST nav/publish (deferred confirm)"
          assert:
            - "Between first and second NAV publish: Order.status == 'LARGE_REDEMPTION_DEFERRED'"
            - "Order.large_redemption_pct_bps == 1000"
            - "After second NAV publish: Order.status == 'CONFIRMED'"
            - "Order.confirm_date == original_confirm_date + 1 day"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: subscribe_confirm_three_hop_cascade
        grounds:
          - state_machines.Order.ACCEPTED_to_CONFIRMED
          - entities.LotEntry
          - entities.Holding.fields.shares
          - entities.Fund.fields.total_outstanding_shares
          - entities.Investor.fields.cash_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from NAV publication: hop 1 — Order ACCEPTED→CONFIRMED creates
          a new LotEntry; hop 2 — that LotEntry's shares aggregate into Holding.shares (caused BY
          the new lot); hop 3 — Holding.shares aggregate into Fund.total_outstanding_shares (caused
          BY the holding mutation). Each hop is causally chained from the previous hop, not fan-out.
        test_recipe:
          setup:
            - "Fund on shelf with total_outstanding_shares=0; investor with cash 200_000"
            - "POST /orders SUBSCRIBE 100_000 cents (ACCEPTED)"
            - "POST /_clock/advance past T+1"
          trigger:
            - "POST /funds/{id}/nav/publish (causes confirmation pass)"
          assert:
            - "LotEntry count for (investor, fund) == 1 with cost_cents == 98500 (front-end model assumed) and shares == 9850000"
            - "Holding.shares == 9850000  # hop 2 from new lot"
            - "Fund.total_outstanding_shares == 9850000  # hop 3 from holding mutation"
            - "Investor.cash_balance_cents == 100000  # 200000 - 100000 gross"

      - name: dividend_reinvest_three_hop_cascade
        grounds:
          - state_machines.DividendPlan.EX_DIVIDEND_to_PAID
          - entities.DividendDistribution.fields.reinvested_shares
          - entities.LotEntry
          - entities.Holding.fields.shares
          - entities.Fund.fields.total_outstanding_shares
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (DividendPlan EX_DIVIDEND→PAID, not Order
          confirm): hop 1 — distribution computes reinvested_shares and creates a LotEntry; hop 2 —
          new LotEntry's shares aggregate into Holding.shares (caused BY new lot); hop 3 —
          Holding.shares aggregate into Fund.total_outstanding_shares (caused BY holding mutation).
          Different trigger from instance 1.
        test_recipe:
          setup:
            - "Investor holds 100_000_000 shares (10000 full) from prior subscribe; option=REINVEST"
            - "Fund on shelf, NAV=0.999700 (999700 micros) at ex_dividend_date"
            - "DividendPlan announced, mark-ex-dividend done; DPSM=50_000 micros (0.05 CNY/share); domestic tax=1000bps"
          trigger:
            - "POST /_clock/advance to >= payment_date"
            - "POST /dividend-plans/{id}/execute-payment"
          assert:
            - "DividendDistribution.gross_dividend_cents == 50000  # 1e8*5e4/1e8"
            - "DividendDistribution.tax_withheld_cents == 5000"
            - "DividendDistribution.net_dividend_cents == 45000"
            - "DividendDistribution.reinvested_shares == 4501350  # round_half_down(45000*1e8/999700)"
            - "Holding.shares == 100000000 + 4501350 == 104501350  # hop 2"
            - "Fund.total_outstanding_shares == 104501350  # hop 3"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_kyc
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair = (state @ priority 5, business_safety @ priority 9). Investor with kyc_status=PENDING
          submits an order to a Fund.status=DRAFT. Both ERR_INVALID_STATE and ERR_KYC_NOT_APPROVED
          would apply; the scaffold returns ERR_INVALID_STATE because state-precondition runs first.
        test_recipe:
          setup:
            - "POST /investors (kyc PENDING)"
            - "POST /funds (DRAFT — never approved)"
          trigger:
            - "POST /orders {investor, fund, SUBSCRIBE, gross_amount_cents=100000, idempotency_key=k1}"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'  # state wins over kyc"
            - "Response status == 409"

      - name: business_safety_suitability_vs_business_constraint_amount
        grounds:
          - validations[priority=10]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair = (business_safety @ priority 10, business_constraint @ priority 16). Investor with
          risk_tolerance=C2 attempts SUBSCRIBE on Fund.risk_rating=R5 with gross_amount_cents BELOW
          fund.min_subscription_amount_cents. ERR_SUITABILITY_MISMATCH wins over
          ERR_ORDER_LIMIT_VIOLATED because suitability is higher priority.
        test_recipe:
          setup:
            - "Investor C2, kyc APPROVED, country=CN, cash 200_000"
            - "Fund R5, ON_SHELF, allowed=[CN], min_subscription_amount_cents=50_000"
          trigger:
            - "POST /orders SUBSCRIBE gross_amount_cents=10_000 (below min AND suitability fails)"
          assert:
            - "Response error_id == 'ERR_SUITABILITY_MISMATCH'  # safety beats constraint"
            - "Response status == 422"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: large_redemption_threshold_inclusive
        grounds:
          - calculations.large_redemption_pct
          - entities.Fund.fields.large_redemption_threshold_pct_bps
          - state_machines.Order.ACCEPTED_to_LARGE_REDEMPTION_DEFERRED
        distinguishing_aspect: |
          Numeric metric: large_redemption_pct_bps. Boundary semantics is >= (inclusive) on
          large_redemption_threshold_pct_bps=1000. Order with requested_shares producing pct_bps==1000
          is deferred; pct_bps==999 is NOT deferred. Endpoint: POST /funds/{id}/nav/publish triggers
          evaluation.
        test_recipe:
          setup:
            - "Fund on shelf, total_outstanding_shares=100_000_000, threshold=1000 bps"
            - "Investor A holds 10_000_000 shares; Investor B holds 9_990_000 shares"
            - "POST /orders A REDEEM 10_000_000 (= exactly 1000 bps)"
            - "POST /orders B REDEEM 9_990_000 (= 999 bps)"
            - "POST /_clock/advance past T+1"
          trigger:
            - "POST /funds/{id}/nav/publish"
          assert:
            - "Order_A.status == 'LARGE_REDEMPTION_DEFERRED'  # 1000 >= threshold"
            - "Order_B.status == 'CONFIRMED'  # 999 < threshold"
            - "Order_A.large_redemption_pct_bps == 1000"
            - "Order_B.large_redemption_pct_bps == 999"

      - name: empty_external_records_match_skipped
        grounds:
          - state_machines.ReconciliationRun.OPEN_to_EXCEPTIONS_FOUND
          - validations[priority=5]
          - entities.ReconciliationRun.fields.external_records
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric (count) and a DIFFERENT endpoint
          (POST /reconciliations/{id}/run-match): when external_records.length == 0 the run-match
          transition's precondition fails, returning ERR_INVALID_STATE rather than transitioning to
          OPEN→RESOLVED with vacuous match. Tests the empty-set boundary.
        test_recipe:
          setup:
            - "POST /reconciliations as_of_date=2026-05-04, scope=TA_VS_CUSTODIAN, external_records=[]"
          trigger:
            - "POST /reconciliations/{id}/run-match"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Response status == 409"
            - "ReconciliationRun.status remains 'OPEN'"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_acceptance_requires_fund_on_shelf_and_investor_kyc
        grounds:
          - state_machines.Order.SUBMITTED_to_ACCEPTED
          - entities.Fund.fields.status
          - entities.Investor.fields.kyc_status
        distinguishing_aspect: |
          Pair = (Order, Fund) AND (Order, Investor). Order's SUBMITTED→ACCEPTED transition is
          gated by Fund.status==ON_SHELF AND Investor.kyc_status==APPROVED. Two cross-entity
          checks on different counterparties.
        test_recipe:
          setup:
            - "Investor A kyc APPROVED, Investor B kyc PENDING"
            - "Fund on ON_SHELF"
          trigger:
            - "POST /orders {A, fund, SUBSCRIBE} → ACCEPTED"
            - "POST /orders {B, fund, SUBSCRIBE} → REJECTED"
            - "POST /funds/{id}/suspend; then POST /orders {A, fund, SUBSCRIBE} → REJECTED"
          assert:
            - "First order.status == 'ACCEPTED'"
            - "Second order error_id == 'ERR_KYC_NOT_APPROVED'"
            - "Third order error_id == 'ERR_INVALID_STATE'  # fund SUSPENDED"

      - name: dividend_payment_requires_nav_published_for_ex_div_date
        grounds:
          - state_machines.DividendPlan.EX_DIVIDEND_to_PAID
          - state_machines.NavSnapshot.PROVISIONAL_to_PUBLISHED
          - entities.NavSnapshot.fields.status
        distinguishing_aspect: |
          DIFFERENT entity pair = (DividendPlan, NavSnapshot). DividendPlan's EX_DIVIDEND→PAID
          transition is gated on NavSnapshot for ex_dividend_date being in PUBLISHED state. If NAV
          for that date is still PROVISIONAL, payment is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Fund ON_SHELF; investors with holdings; DividendPlan ANNOUNCED"
            - "POST /_clock/advance to ex_dividend_date+1"
            - "POST /dividend-plans/{id}/mark-ex-dividend (now EX_DIVIDEND)"
            - "POST /_clock/advance past payment_date but DO NOT publish NAV for ex_dividend_date"
          trigger:
            - "POST /dividend-plans/{id}/execute-payment"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "DividendPlan.status remains 'EX_DIVIDEND'"
            - "After publishing NAV for ex_dividend_date, retry succeeds → status=='PAID'"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nav_snapshot_one_per_fund_per_nav_date
        grounds:
          - concurrency_rules[NavOperators simultaneously POST publish]
          - entities.NavSnapshot.fields.nav_date
          - errors.ERR_NAV_ALREADY_PUBLISHED
        distinguishing_aspect: |
          Interval semantics: point-time uniqueness on (fund_id, nav_date). Adjacent dates
          (2026-05-04, 2026-05-05) DO NOT collide; same date does. Boundary is "calendar-day match"
          — a half-open or closed interval discussion does not arise; it is exact equality on the
          discrete `nav_date` key. Resource entity = NavSnapshot.
        test_recipe:
          setup:
            - "Fund ON_SHELF; POST /_clock/advance to 2026-05-05T00:00:01Z"
            - "POST /funds/{id}/nav/publish nav_date=2026-05-04 (first time → 201)"
          trigger:
            - "POST /funds/{id}/nav/publish nav_date=2026-05-04 (second time)"
            - "POST /funds/{id}/nav/publish nav_date=2026-05-05 (different date, after advancing clock)"
          assert:
            - "Second call (same date) error_id == 'ERR_NAV_ALREADY_PUBLISHED', status 409"
            - "Third call (different date) succeeds with 201"

      - name: dividend_plan_dates_must_be_buffered
        grounds:
          - validations[priority=15]
          - entities.DividendPlan.fields.record_date
          - entities.DividendPlan.fields.ex_dividend_date
          - entities.DividendPlan.fields.payment_date
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (DividendPlan): explicit aggregate
          buffer rule — record_date >= announcement_date AND ex_dividend_date == record_date+1
          (exact one-day offset, NOT inclusive overlap) AND payment_date >= ex_dividend_date.
          Buffer arithmetic, not point uniqueness. Violation triggers ERR_DIVIDEND_DATE_INVALID.
        test_recipe:
          setup:
            - "Fund ON_SHELF; clock at 2026-05-01"
          trigger:
            - "POST /funds/{id}/dividend-plans announcement=2026-05-01, record=2026-05-10, ex_div=2026-05-12 (off by one — should be 2026-05-11), payment=2026-05-15"
          assert:
            - "Response error_id == 'ERR_DIVIDEND_DATE_INVALID', status 422"
            - "Subsequent call with ex_div=2026-05-11 succeeds (201)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: subscribe_then_full_redeem_share_conservation
        grounds:
          - state_machines.Order.ACCEPTED_to_CONFIRMED
          - calculations.subscription_fee
          - calculations.redemption_fee_with_holding_period
          - entities.Fund.fields.total_outstanding_shares
        distinguishing_aspect: |
          Conserved quantity = Fund.total_outstanding_shares. After SUBSCRIBE confirm + later
          full-REDEEM confirm by the same investor (no other activity), Fund.total_outstanding_shares
          MUST return to its pre-subscribe value. Formula:
          shares_post_redeem == shares_pre_subscribe (exact integer equality, no drift).
        test_recipe:
          setup:
            - "Fund ON_SHELF, total_outstanding_shares=0 initial"
            - "Investor cash 200_000, kyc APPROVED, suitable, country allowed"
          trigger:
            - "POST /orders SUBSCRIBE 100_000 cents → confirmed via NAV publish (assume front-end fee)"
            - "Verify Fund.total_outstanding_shares == 9850000"
            - "POST /orders REDEEM all 9850000 shares → confirmed via next NAV publish"
          assert:
            - "Fund.total_outstanding_shares == 0  # restored exactly to pre-subscribe"
            - "sum(LotEntry.shares for status=OPEN) == 0"
            - "Holding.shares == 0"

      - name: reconciliation_adjust_net_break_invariant
        grounds:
          - calculations.reconciliation_invariant
          - state_machines.ReconciliationRun.EXCEPTIONS_FOUND_to_RESOLVED
          - state_machines.ReconciliationException.OPEN_to_ADJUSTED
          - entities.ReconciliationRun.fields.net_break_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity = ReconciliationRun.net_break_cents. The forward action is
          opening a run with a non-zero break; the compensating action is recording ADJUSTED
          exceptions whose adjustment_amount_cents sum back to original_net_break. The pinned
          invariant: original_net_break - sum(adjustments) == 0 at finalize, else
          ERR_RECONCILIATION_INVARIANT_BROKEN. WAIVED exceptions do NOT contribute, so a single
          WAIVED AMOUNT_MISMATCH would break the invariant — and is itself rejected by
          ERR_WAIVE_NOT_ALLOWED, hardening the conservation.
        test_recipe:
          setup:
            - "Internal SETTLED ledger has Order O1 amount=100000 cents on 2026-05-04"
            - "POST /reconciliations as_of_date=2026-05-04, scope=TA_VS_CUSTODIAN, external_records=[{ref=O1, amount=99500, side=DEBIT}]"
            - "POST /reconciliations/{id}/run-match → EXCEPTIONS_FOUND, net_break_cents=500, one AMOUNT_MISMATCH exception"
          trigger:
            - "Attempt 1: POST /reconciliations/{id}/finalize WITHOUT adjusting → expect ERR_RECONCILIATION_INVARIANT_BROKEN"
            - "POST /reconciliations/{id}/exceptions/{eid}/adjust adjustment_amount_cents=500"
            - "POST /reconciliations/{id}/finalize → succeeds"
          assert:
            - "First finalize error_id == 'ERR_RECONCILIATION_INVARIANT_BROKEN', status 409"
            - "After adjust, ReconciliationRun.net_break_cents == 0"
            - "ReconciliationRun.status == 'RESOLVED'"
            - "Attempt to waive the AMOUNT_MISMATCH instead returns ERR_WAIVE_NOT_ALLOWED, status 422"
