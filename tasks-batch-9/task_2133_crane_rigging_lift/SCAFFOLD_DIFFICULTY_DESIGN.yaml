              as: BillingClerk
              captures: { ar_before: $.data.open_receivable_cents, count_before: $.data.invoice_count }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
              captures: { st_issued: $.data.status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { ar_mid: $.data.open_receivable_cents }
            - call: "POST /invoices/${inv_id}/void"
              payload: { reason: "billed against the wrong purchase order" }
              as: BillingClerk
              captures: { st_voided: $.data.status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { ar_after: $.data.open_receivable_cents, count_after: $.data.invoice_count }
          assert:
            - "${inv_total} == 1011734"
            - "${ar_before} == 0 and ${count_before} == 1   (a DRAFT invoice is counted but not open)"
            - "${st_issued} == ISSUED and ${ar_mid} == 1011734"
            - "${st_voided} == VOIDED"
            - "${ar_after} == 0   (exactly the pre-issue value)"
            - "${count_after} == 1   (voiding never removes the invoice from invoice_count)"
