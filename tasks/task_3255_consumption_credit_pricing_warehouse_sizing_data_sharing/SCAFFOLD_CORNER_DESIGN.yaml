      - name: error_share_self_consumption_on_consumer_list
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHARE_SELF_CONSUMPTION]
          - validations[priority=10]
        distinguishing_aspect: "Naming the provider itself in the consumer list is a safety violation at share creation, so it is refused before any publish or attribution can occur."
