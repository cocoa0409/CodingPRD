# =============================================================================
# PRD Benchmark Scaffold — Planned Giving & Bequest Administration
# University planned giving office: CGA/CRT/bequest modeling & illustration,
# beneficiary documentation, annuity payment & reserve compliance, matured
# estate probate monitoring, asset receipt & liquidation, donor-intent fund
# creation, actuarial revaluation, legacy society stewardship.
# =============================================================================

scenario: |
  Planned Giving & Bequest Administration (university planned giving office):
  gift vehicle modeling (CGA/CRT/bequest) & illustration, documentation &
  beneficiary designation tracking, annuity payment schedule & reserve
  compliance, matured estate notification & probate monitoring, asset receipt
  (real estate/securities) & liquidation, donor intent restriction & fund
  creation, actuarial revaluation & reporting, legacy society stewardship

domain_name: planned-giving-bequest
api_prefix: /giving

complexity_profile:
  primary_archetype: compliance_audit        # state annuity reserves, IRS remainder/exhaustion tests, SoD, probate deadlines
  secondary_archetype: ledger_reconciliation # booked vs projected reserve coverage; illustrated vs booked deduction
  complexity_layers:
    - rate_threshold_triggers        # payout bounds, 10% remainder test, coverage 10000bps gate, fund minimum
    - scheduled_actions              # payment due/defer sweep, milestone overdue sweep, valuation-date revaluation
    - optimistic_concurrency         # OCC on GiftAgreement.version (amend) and ReserveFund.version (adjustments)
    - derived_field_reconciliation   # received_value / totals / coverage recomputed on every cascade hop
  entity_topology: flat              # peer resources joined by FK references; no nested URL ownership
  state_machine_shape: cyclic        # ACTIVE<->SUSPENDED, PROBATE_OPEN<->CONTESTED, DUE<->DEFERRED, REJECTED->SUBMITTED, FROZEN->ACTIVE
  relationship_patterns:
    - one_to_many                    # Donor->GiftAgreement, GiftAgreement->AnnuityPayment, Estate->ProbateMilestone
    - cross_aggregate                # GiftAsset links to GiftAgreement XOR Estate; Fund links back to GiftAgreement
    - self_referential               # Illustration.supersedes_illustration_id
    - polymorphic                    # GiftAsset parentage is agreement OR estate
  role_model: segregation_of_duties  # drafter != executor; valuation creator != poster; estate recorder != distribution approver
  consistency_model: immediate       # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Donor legal full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Donor birth date (ISO 8601 date)" }
      - { name: contact_email, type: string, source: input, required: false, description: "Primary contact email" }
      - { name: vital_status, type: enum, source: system, default: LIVING, description: "LIVING | DECEASED — parallel state axis 1" }
      - { name: deceased_on, type: datetime, source: system, required: false, description: "Date of death recorded by record-death; null while LIVING" }
      - { name: legacy_society_status, type: enum, source: system, default: NONE, description: "NONE | ENROLLED | RECOGNIZED | REVOKED — parallel state axis 2" }
      - { name: documented_gift_total_cents, type: integer, source: computed, description: "Sum of gift_amount_cents over this donor's GiftAgreements with status IN {EXECUTED, FUNDED, ACTIVE, SUSPENDED, MATURED, SETTLED}; drives legacy recognition threshold" }

  - name: RateTable
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. 'IRS 7520 2026-H1'" }
      - { name: discount_rate_bps, type: integer, source: input, description: "Section-7520-style discount rate in basis points (500 = 5.00%)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, INCLUSIVE (half-open interval)" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "Window end, EXCLUSIVE (half-open interval); null = open-ended" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Illustration
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; modeled donor" }
      - { name: vehicle_type, type: enum, source: input, description: "CGA | CRT_UNITRUST | CRT_ANNUITY | BEQUEST" }
      - { name: gift_amount_cents, type: integer, source: input, description: "Modeled gift principal" }
      - { name: payout_rate_bps, type: integer, source: input, required: false, description: "Annuity/unitrust payout rate in bps; REQUIRED unless vehicle_type=BEQUEST, FORBIDDEN when BEQUEST" }
      - { name: payment_frequency, type: enum, source: input, default: QUARTERLY, description: "ANNUAL | SEMIANNUAL | QUARTERLY | MONTHLY" }
      - { name: lives, type: integer, source: input, default: 1, description: "1 or 2 annuitants" }
      - { name: annuitant_1_age, type: integer, source: input, description: "Annuitant 1 age at assumed funding" }
      - { name: annuitant_2_age, type: integer, source: input, required: false, description: "Annuitant 2 age; required iff lives=2" }
      - { name: funding_month, type: string, source: input, description: "Assumed execution month, format YYYY-MM" }
      - { name: rate_table_id, type: string, source: system, description: "FK -> RateTable.id; pinned at creation to the ACTIVE table whose half-open window covers funding_month" }
      - { name: illustrated_annual_annuity_cents, type: integer, source: computed, required: false, description: "Provisional annual annuity (null for BEQUEST)" }
      - { name: illustrated_deduction_cents, type: integer, source: computed, description: "Provisional charitable deduction under pinned table" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | BOOKED | SUPERSEDED" }
      - { name: supersedes_illustration_id, type: string, source: input, required: false, description: "FK -> Illustration.id; when set and that illustration is OPEN, it flips to SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating GiftOfficer; SoD anchor for execute" }

  - name: GiftAgreement
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: illustration_id, type: string, source: system, required: false, description: "FK -> Illustration.id; set when created by book" }
      - { name: vehicle_type, type: enum, source: input, description: "CGA | CRT_UNITRUST | CRT_ANNUITY | BEQUEST" }
      - { name: gift_amount_cents, type: integer, source: input, description: "Committed gift principal" }
      - { name: payout_rate_bps, type: integer, source: input, required: false, description: "REQUIRED unless BEQUEST; FORBIDDEN for BEQUEST; range [500, 5000]" }
      - { name: payment_frequency, type: enum, source: input, default: QUARTERLY, description: "ANNUAL | SEMIANNUAL | QUARTERLY | MONTHLY" }
      - { name: lives, type: integer, source: input, default: 1, description: "1 or 2" }
      - { name: annuitant_1_age, type: integer, source: input, description: "Annuitant 1 age at funding" }
      - { name: annuitant_2_age, type: integer, source: input, required: false, description: "Required iff lives=2" }
      - { name: funding_month, type: string, source: input, description: "YYYY-MM execution month used for rate-table pin and actuarial lookup" }
      - { name: rate_table_id, type: string, source: system, description: "FK -> RateTable.id; pinned at creation (book copies illustration pin; direct create resolves ACTIVE table covering funding_month)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | EXECUTED | FUNDED | ACTIVE | SUSPENDED | MATURED | SETTLED | WITHDRAWN | RESCINDED | TERMINATED" }
      - { name: executed_at, type: datetime, source: system, required: false, description: "Set on EXECUTE" }
      - { name: executed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of executing GiftAdministrator; SoD anchor" }
      - { name: annual_annuity_cents, type: integer, source: computed, required: false, description: "Annual annuity; FIXED_AT_FUNDING for CGA/CRT_ANNUITY, revalued for CRT_UNITRUST; null for BEQUEST" }
      - { name: booked_deduction_cents, type: integer, source: computed, required: false, description: "Final charitable deduction computed at EXECUTE under pinned rate table; null until then" }
      - { name: corpus_value_cents, type: integer, source: computed, required: false, description: "Trust corpus; initialized to gift_amount_cents at EXECUTE; mutated only by ValuationRun corpus_updates (CRT_UNITRUST)" }
      - { name: received_value_cents, type: integer, source: computed, description: "Sum of linked GiftAsset values with asset status IN {RECEIVED, APPRAISED, LIQUIDATED, DISTRIBUTED}: CASH=pledged_value_cents, SECURITIES=fmv_cents, REAL_ESTATE=appraised_value_cents (0 until appraised)" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of amount_cents over linked AnnuityPayments with status=PAID" }
      - { name: total_scheduled_cents, type: integer, source: computed, description: "Sum of amount_cents over ALL linked AnnuityPayments regardless of status" }
      - { name: liability_released_cents, type: integer, source: computed, description: "Sum of amount_cents over linked AnnuityPayments with status=LAPSED" }
      - { name: actuarial_liability_cents, type: integer, source: computed, required: false, description: "PV of future annuity obligation; set at EXECUTE, refreshed by ValuationRun posting" }
      - { name: remainder_value_cents, type: integer, source: computed, required: false, description: "max(0, corpus_value_cents - actuarial_liability_cents)" }
      - { name: reserve_requirement_cents, type: integer, source: computed, description: "CGA only: statutory reserve requirement; 0 for non-CGA vehicles" }
      - { name: surrender_value_cents, type: integer, source: computed, required: false, description: "At TERMINATE: max(0, received_value_cents - total_paid_cents); debited from ReserveFund for CGA" }
      - { name: fund_id, type: string, source: input, required: false, description: "FK -> Fund.id; remainder destination; attachable via amend while DRAFT or at create" }
      - { name: restriction_type, type: enum, source: input, default: UNRESTRICTED, description: "UNRESTRICTED | SCHOLARSHIP | FACULTY_SUPPORT | RESEARCH | CAPITAL — donor intent" }
      - { name: restriction_text, type: string, source: input, required: false, description: "Free-text donor intent language" }

  - name: BeneficiaryDesignation
    parent: null
    common_fields: true
    fields:
      - { name: gift_agreement_id, type: string, source: input, description: "FK -> GiftAgreement.id" }
      - { name: slot, type: enum, source: input, description: "PRIMARY_1 | PRIMARY_2 | CONTINGENT" }
      - { name: beneficiary_name, type: string, source: input, description: "Designated beneficiary name" }
      - { name: document_received, type: boolean, source: input, default: false, description: "Wet-ink designation document on file; VERIFY requires true" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | VERIFIED | REJECTED | SUPERSEDED | REVOKED" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Set on REJECT" }

  - name: GiftAsset
    parent: null
    common_fields: true
    fields:
      - { name: gift_agreement_id, type: string, source: input, required: false, description: "FK -> GiftAgreement.id; exactly one of gift_agreement_id / estate_id required" }
      - { name: estate_id, type: string, source: input, required: false, description: "FK -> Estate.id; exactly one of gift_agreement_id / estate_id required" }
      - { name: asset_kind, type: enum, source: input, description: "CASH | SECURITIES | REAL_ESTATE" }
      - { name: description, type: string, source: input, required: false, description: "Free text" }
      - { name: pledged_value_cents, type: integer, source: input, description: "Expected value; for CASH this IS the funding value" }
      - { name: status, type: enum, source: system, default: PLEDGED, description: "PLEDGED | RECEIVED | APPRAISED | LIQUIDATED | DISTRIBUTED | RETURNED" }
      - { name: dod_high_price_cents, type: integer, source: input, required: false, description: "SECURITIES: high price on date-of-death (estate) or receipt date (lifetime gift); supplied at RECEIVE" }
      - { name: dod_low_price_cents, type: integer, source: input, required: false, description: "SECURITIES: low price on same date; supplied at RECEIVE" }
      - { name: alt_high_price_cents, type: integer, source: input, required: false, description: "SECURITIES: high price on alternate valuation date (DoD + 6 months); estate assets only" }
      - { name: alt_low_price_cents, type: integer, source: input, required: false, description: "SECURITIES: low price on alternate valuation date" }
      - { name: fmv_cents, type: integer, source: computed, required: false, description: "SECURITIES fair market value = round_half_up((high+low)/2) over the basis pair selected by the parent estate's alternate_valuation_elected (agreement-linked assets always use the DOD pair); null until RECEIVE" }
      - { name: appraised_value_cents, type: integer, source: input, required: false, description: "REAL_ESTATE qualified appraisal; supplied at APPRAISE; required before LIQUIDATE" }
      - { name: gross_proceeds_cents, type: integer, source: input, required: false, description: "Supplied at LIQUIDATE" }
      - { name: liquidation_costs_cents, type: integer, source: input, required: false, default: 0, description: "Supplied at LIQUIDATE; selling costs" }
      - { name: net_proceeds_cents, type: integer, source: computed, required: false, description: "gross_proceeds_cents - liquidation_costs_cents, computed per asset at LIQUIDATE (per-asset step of the estate waterfall rounding order)" }

  - name: AnnuityPayment
    parent: null
    common_fields: true
    fields:
      - { name: gift_agreement_id, type: string, source: system, description: "FK -> GiftAgreement.id; set by generate-payment-schedule" }
      - { name: period_index, type: integer, source: system, description: "1-based chronological index within the schedule" }
      - { name: due_date, type: datetime, source: system, description: "first payment due one frequency-period after funding; subsequent payments advance by one period" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(annual_annuity_cents / frequency_divisor) per payment; NO cumulative true-up (pinned rounding order)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DUE | PAID | DEFERRED | LAPSED" }
      - { name: paid_at, type: datetime, source: system, required: false, description: "Set on PAY" }
      - { name: defer_until, type: datetime, source: input, required: false, description: "Supplied at DEFER; payment returns to DUE when clock reaches it" }
      - { name: lapse_reason, type: enum, source: system, required: false, description: "DONOR_DEATH | TERMINATION | MATURITY | MANUAL" }

  - name: ReserveFund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: system, default: CGA_RESERVE, description: "Singleton ledger for the charitable gift annuity reserve pool; instantiated at server startup with balance_cents=0, posture=SOLVENT" }
      - { name: balance_cents, type: integer, source: system, description: "Cash actually held in reserve; mutated by adjustments, CGA asset liquidation credits, and termination surrender debits" }
      - { name: booked_target_cents, type: integer, source: computed, description: "Sum of reserve_requirement_cents over GiftAgreements with vehicle_type=CGA AND status IN {FUNDED, ACTIVE, SUSPENDED} (statutory basis)" }
      - { name: projected_target_cents, type: integer, source: computed, description: "booked_target_cents + sum of reserve_requirement_cents over CGA agreements with status=EXECUTED (forward-looking basis)" }
      - { name: booked_coverage_bps, type: integer, source: computed, required: false, description: "floor(balance_cents * 10000 / booked_target_cents); null when booked_target_cents=0; floor is deliberate — a deficient ratio never rounds up into compliance" }
      - { name: posture, type: enum, source: computed, default: SOLVENT, description: "SOLVENT | RESERVE_DEFICIENT — derived posture gate; SOLVENT iff booked_target_cents=0 OR booked_coverage_bps >= 10000" }

  - name: Estate
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; donor MUST be DECEASED" }
      - { name: gift_agreement_id, type: string, source: input, required: false, description: "FK -> GiftAgreement.id; the matured BEQUEST agreement when applicable (set automatically on death cascade)" }
      - { name: status, type: enum, source: system, default: NOTIFIED, description: "NOTIFIED | PROBATE_OPEN | CONTESTED | DISTRIBUTION_PENDING | DISTRIBUTED | CLOSED" }
      - { name: notified_on, type: datetime, source: input, description: "Date the office learned of the death" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of creating EstateManager; SoD anchor for BEGIN_DISTRIBUTION" }
      - { name: alternate_valuation_elected, type: boolean, source: input, default: false, description: "Estate election to use alternate (DoD+6mo) securities basis; flips fmv_cents basis for all linked SECURITIES assets" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "Sum of net_proceeds_cents over linked GiftAssets with status IN {LIQUIDATED, DISTRIBUTED}" }
      - { name: administration_costs_cents, type: integer, source: input, default: 0, description: "Supplied at BEGIN_DISTRIBUTION" }
      - { name: specific_bequests_cents, type: integer, source: input, default: 0, description: "Supplied at BEGIN_DISTRIBUTION; specific bequests to other heirs paid before the charitable residue" }
      - { name: residual_to_university_cents, type: integer, source: computed, required: false, description: "gross_proceeds_cents - administration_costs_cents - specific_bequests_cents, computed at BEGIN_DISTRIBUTION; credited to the bequest agreement's Fund" }
      - { name: distributed_on, type: datetime, source: system, required: false, description: "Set on MARK_DISTRIBUTED" }

  - name: ProbateMilestone
    parent: null
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: input, description: "FK -> Estate.id" }
      - { name: kind, type: enum, source: input, description: "PETITION | NOTICE_TO_CREDITORS | INVENTORY | APPRAISAL | FINAL_ACCOUNTING | COURT_ORDER" }
      - { name: due_date, type: datetime, source: input, description: "Court deadline; clock sweep flips PENDING/FILED milestones past due_date to OVERDUE" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | FILED | OVERDUE | CLOSED" }
      - { name: filed_on, type: datetime, source: system, required: false, description: "Set on FILE" }

  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fund name (e.g. 'Smith Family Scholarship Fund')" }
      - { name: restriction_type, type: enum, source: input, description: "UNRESTRICTED | SCHOLARSHIP | FACULTY_SUPPORT | RESEARCH | CAPITAL" }
      - { name: minimum_endowment_cents, type: integer, source: input, default: 2500000, description: "Minimum balance to endow; activation boundary is >= (inclusive)" }
      - { name: gift_agreement_id, type: string, source: input, description: "FK -> GiftAgreement.id; source agreement whose remainder feeds this fund" }
      - { name: balance_cents, type: integer, source: system, description: "Credited by agreement SETTLE (remainder_value_cents) and estate BEGIN_DISTRIBUTION (residual_to_university_cents)" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ENDOWED | ACTIVE | FROZEN | CLOSED" }

  - name: ValuationRun
    parent: null
    common_fields: true
    fields:
      - { name: coverage_start, type: datetime, source: input, description: "Fiscal coverage window start, INCLUSIVE (closed interval)" }
      - { name: coverage_end, type: datetime, source: input, description: "Fiscal coverage window end, INCLUSIVE (closed interval — a shared single date IS an overlap)" }
      - { name: valuation_date, type: datetime, source: input, description: "Measurement date; MUST satisfy coverage_start <= valuation_date <= coverage_end" }
      - { name: corpus_updates, type: array, source: input, required: false, description: "Optional [{agreement_id, new_corpus_cents}] applied to CRT_UNITRUST agreements before revaluation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | POSTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating ComplianceOfficer; SoD anchor for post" }
      - { name: posted_by_user_id, type: string, source: system, required: false, description: "X-User-ID of poster; MUST differ from created_by_user_id" }
      - { name: agreements_revalued_count, type: integer, source: computed, required: false, description: "Count of agreements revalued at POST" }
      - { name: total_liability_cents, type: integer, source: computed, required: false, description: "Sum of actuarial_liability_cents across revalued agreements after POST" }
      - { name: total_remainder_cents, type: integer, source: computed, required: false, description: "Sum of remainder_value_cents across revalued agreements after POST" }
      - { name: posted_at, type: datetime, source: system, required: false, description: "Set on POST" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Donor
    initial_state: "vital_status=LIVING, legacy_society_status=NONE (two parallel state axes on one row)"
    terminal_states: ["vital_status=DECEASED (vital axis terminal)"]
    transitions:
      - from: "vital_status=LIVING"
        to: "vital_status=DECEASED"
        trigger: "POST /giving/donors/{donor_id}/record-death"
        actor: EstateManager
        preconditions:
          - "donor.vital_status == LIVING"
        side_effects:
          - "donor.deceased_on := payload.deceased_on"
          - "HOP 1 (per GiftAgreement of this donor, processed in created_at ASC order): if agreement.status IN {EXECUTED, FUNDED, ACTIVE, SUSPENDED} and vehicle_type IN {CGA, CRT_ANNUITY, CRT_UNITRUST} -> agreement.status := MATURED (house rule: annuity vehicles mature on the donor's death regardless of lives)"
          - "HOP 2 (per agreement matured in HOP 1): every linked AnnuityPayment with status IN {SCHEDULED, DUE, DEFERRED} -> LAPSED with lapse_reason=DONOR_DEATH; agreement.liability_released_cents and total_* derived fields recomputed"
          - "HOP 1b: if vehicle_type == BEQUEST and agreement.status IN {EXECUTED, FUNDED} -> agreement.status := MATURED and a new Estate is auto-created { donor_id=this donor, gift_agreement_id=agreement.id, status=NOTIFIED, notified_on=payload.deceased_on, recorded_by_user_id=actor X-User-ID }"
          - "HOP 3: ReserveFund.booked_target_cents recomputed (MATURED CGA agreements leave the {FUNDED, ACTIVE, SUSPENDED} inclusion set)"
          - "HOP 4: ReserveFund.booked_coverage_bps and posture recomputed from the new booked_target_cents (posture may flip RESERVE_DEFICIENT -> SOLVENT)"
          - "donor.version += 1; donor.updated_at refreshed; every mutated agreement/payment version += 1 and updated_at refreshed"
      - from: "legacy_society_status=NONE"
        to: "legacy_society_status=ENROLLED"
        trigger: "POST /giving/donors/{donor_id}/legacy-society-transition {action: ENROLL}"
        actor: GiftOfficer
        preconditions:
          - "donor.vital_status == LIVING"
          - "donor.legacy_society_status == NONE"
          - "donor has >= 1 GiftAgreement with status IN {EXECUTED, FUNDED, ACTIVE, SUSPENDED, MATURED, SETTLED} (documented planned gift) else ERR_LEGACY_SOCIETY_INELIGIBLE"
        side_effects: ["donor.version += 1"]
      - from: "legacy_society_status=ENROLLED"
        to: "legacy_society_status=RECOGNIZED"
        trigger: "POST /giving/donors/{donor_id}/legacy-society-transition {action: RECOGNIZE}"
        actor: GiftOfficer
        preconditions:
          - "donor.legacy_society_status == ENROLLED"
          - "donor.documented_gift_total_cents >= LEGACY_THRESHOLD_CENTS (10000000) else ERR_LEGACY_SOCIETY_INELIGIBLE — boundary is inclusive"
        side_effects: ["donor.version += 1"]
      - from: "legacy_society_status=ENROLLED"
        to: "legacy_society_status=REVOKED"
        trigger: "POST /giving/donors/{donor_id}/legacy-society-transition {action: REVOKE}"
        actor: GiftOfficer
        preconditions: ["donor.legacy_society_status IN {ENROLLED, RECOGNIZED}"]
        side_effects: ["donor.version += 1"]
      - from: "legacy_society_status=RECOGNIZED"
        to: "legacy_society_status=REVOKED"
        trigger: "POST /giving/donors/{donor_id}/legacy-society-transition {action: REVOKE}"
        actor: GiftOfficer
        preconditions: ["donor.legacy_society_status IN {ENROLLED, RECOGNIZED}"]
        side_effects: ["donor.version += 1"]
      - from: "legacy_society_status=REVOKED"
        to: "legacy_society_status=ENROLLED"
        trigger: "POST /giving/donors/{donor_id}/legacy-society-transition {action: ENROLL}"
        actor: GiftOfficer
        preconditions:
          - "donor.vital_status == LIVING"
          - "donor.legacy_society_status == REVOKED (re-enrollment cycle)"
          - "documented planned gift exists (same rule as initial ENROLL)"
        side_effects: ["donor.version += 1"]

  - entity: RateTable
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /giving/rate-tables/{rate_table_id}/transition {action: ACTIVATE}"
        actor: ComplianceOfficer
        preconditions:
          - "rate_table.status == DRAFT"
          - "half-open window [effective_from, effective_to) does not intersect the window of any OTHER RateTable with status IN {DRAFT, ACTIVE}; adjacency (this.effective_from == other.effective_to) is NOT an overlap; null effective_to reads as +infinity"
        side_effects: ["rate_table.version += 1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /giving/rate-tables/{rate_table_id}/transition {action: RETIRE}"
        actor: ComplianceOfficer
        preconditions: ["rate_table.status IN {DRAFT, ACTIVE}"]
        side_effects: ["rate_table.version += 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /giving/rate-tables/{rate_table_id}/transition {action: RETIRE}"
        actor: ComplianceOfficer
        preconditions: ["rate_table.status IN {DRAFT, ACTIVE}"]
        side_effects:
          - "rate_table.version += 1"
          - "agreements already pinning this table are unaffected until EXECUTE; EXECUTE validates the pinned table is still ACTIVE"

  - entity: Illustration
    initial_state: OPEN
    terminal_states: [BOOKED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /giving/illustrations/{illustration_id}/book"
        actor: GiftOfficer
        preconditions:
          - "illustration.status == OPEN"
          - "donor.vital_status == LIVING else ERR_DONOR_STATE_MISMATCH"
        side_effects:
          - "creates GiftAgreement in DRAFT copying donor_id, vehicle_type, gift_amount_cents, payout_rate_bps, payment_frequency, lives, annuitant ages, funding_month, and the pinned rate_table_id; agreement.illustration_id := illustration.id"
          - "illustration.version += 1"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /giving/illustrations with supersedes_illustration_id = this illustration's id"
        actor: GiftOfficer
        preconditions: ["this illustration.status == OPEN"]
        side_effects: ["this illustration.status := SUPERSEDED as a side effect of creating the successor; this illustration.version += 1"]

  - entity: GiftAgreement
    initial_state: DRAFT
    terminal_states: [SETTLED, WITHDRAWN, RESCINDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /giving/gift-agreements/{agreement_id}/amend (in-place amendment; OCC-guarded)"
        actor: GiftAdministrator
        preconditions:
          - "agreement.status == DRAFT"
          - "payload.expected_gift_agreement_version == agreement.version else ERR_STALE_VERSION (412)"
          - "if payout_rate_bps supplied: within [500, 5000] for annuity vehicles"
        side_effects:
          - "applies supplied field changes (payout_rate_bps, payment_frequency, gift_amount_cents, restriction_type, restriction_text, fund_id)"
          - "recomputes illustrated-side economics if gift_amount_cents or payout_rate_bps changed (annual_annuity_cents preview stays null until EXECUTE; recomputation deferred to EXECUTE)"
          - "agreement.version += 1"
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /giving/gift-agreements/{agreement_id}/execute"
        actor: GiftAdministrator
        preconditions:
          - "agreement.status == DRAFT"
          - "SoD: actor X-User-ID != illustration.created_by_user_id when agreement.illustration_id is set (ERR_SEGREGATION_OF_DUTIES)"
          - "donor.vital_status == LIVING (ERR_DONOR_STATE_MISMATCH)"
          - "a VERIFIED BeneficiaryDesignation with slot=PRIMARY_1 exists for this agreement (ERR_DESIGNATION_NOT_VERIFIED)"
          - "vehicle-specific fields consistent (BEQUEST carries no payout_rate_bps; ERR_BEQUEST_VEHICLE_MISMATCH)"
          - "for annuity vehicles: booked deduction passes the 10% remainder test (ERR_REMAINDER_TEST_FAILED)"
          - "for CRT_ANNUITY additionally: PV of annuity <= 85% of gift (ERR_EXHAUSTION_TEST_FAILED) — deliberately tighter than the 90% remainder ceiling so the band (85%, 90%] exercises each test independently"
          - "pinned rate_table.status == ACTIVE and its window covers agreement.funding_month (ERR_RATE_TABLE_NOT_ACTIVE)"
          - "for CGA: reserve gate — ReserveFund.balance_cents >= ReserveFund.booked_target_cents + sum(reserve_requirement_cents over other EXECUTED CGAs) + this agreement's reserve_requirement_cents (ERR_RESERVE_DEFICIENT)"
        side_effects:
          - "computes and stores annual_annuity_cents, booked_deduction_cents, actuarial_liability_cents, remainder_value_cents, reserve_requirement_cents, corpus_value_cents := gift_amount_cents"
          - "executed_at := logical clock now; executed_by_user_id := actor"
          - "ReserveFund.projected_target_cents recomputed (EXECUTED CGA joins the projected set)"
          - "donor.documented_gift_total_cents recomputed"
          - "agreement.version += 1"
      - from: EXECUTED
        to: FUNDED
        trigger: "system auto-transition evaluated at the end of every GiftAsset RECEIVE / APPRAISE transition for assets linked to this agreement"
        actor: system
        preconditions:
          - "vehicle_type != BEQUEST (bequests are unfunded by definition; they mature on death)"
          - "agreement.received_value_cents >= agreement.gift_amount_cents — boundary is INCLUSIVE"
        side_effects:
          - "ReserveFund.booked_target_cents and coverage/posture recomputed (CGA requirement joins booked set; EXECUTED leaves projected-only)"
          - "agreement.version += 1"
      - from: FUNDED
        to: ACTIVE
        trigger: "POST /giving/gift-agreements/{agreement_id}/generate-payment-schedule"
        actor: GiftAdministrator
        preconditions:
          - "agreement.status == FUNDED"
          - "vehicle_type != BEQUEST (ERR_BEQUEST_VEHICLE_MISMATCH)"
        side_effects:
          - "creates N AnnuityPayments (N = frequency_divisor * max(1, 100 - max_annuitant_age); first due_date = funding date + one period, advancing one period each, period_index 1..N)"
          - "agreement.total_scheduled_cents := sum of created payment amounts (per-payment rounding; no true-up)"
          - "agreement.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /giving/gift-agreements/{agreement_id}/transition {action: SUSPEND}"
        actor: ComplianceOfficer
        preconditions: ["agreement.status == ACTIVE"]
        side_effects:
          - "payment PAY transitions on this agreement's payments become blocked (ERR_AGREEMENT_SUSPENDED) while SUSPENDED"
          - "agreement.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /giving/gift-agreements/{agreement_id}/transition {action: RESUME}"
        actor: ComplianceOfficer
        preconditions: ["agreement.status == SUSPENDED"]
        side_effects: ["agreement.version += 1"]
      - from: "EXECUTED | FUNDED | ACTIVE | SUSPENDED"
        to: TERMINATED
        trigger: "POST /giving/gift-agreements/{agreement_id}/terminate"
        actor: GiftAdministrator
        preconditions: ["agreement.status IN {EXECUTED, FUNDED, ACTIVE, SUSPENDED}"]
        side_effects:
          - "surrender_value_cents := max(0, received_value_cents - total_paid_cents)"
          - "for CGA: ReserveFund.balance_cents -= surrender_value_cents (floor at 0 is NOT applied; insufficient balance -> ERR_INSUFFICIENT_RESERVE_BALANCE, 422)"
          - "all linked AnnuityPayments with status IN {SCHEDULED, DUE, DEFERRED} -> LAPSED with lapse_reason=TERMINATION"
          - "ReserveFund booked/projected targets, coverage, posture recomputed"
          - "agreement.version += 1"
      - from: MATURED
        to: SETTLED
        trigger: "POST /giving/gift-agreements/{agreement_id}/settle"
        actor: FinanceSteward
        preconditions:
          - "agreement.status == MATURED"
          - "agreement.fund_id references an existing Fund with status != CLOSED (ERR_NOT_FOUND / ERR_INVALID_STATE)"
        side_effects:
          - "Fund.balance_cents += agreement.remainder_value_cents (0 for BEQUEST — bequest value arrives via estate residual)"
          - "if Fund.balance_cents >= Fund.minimum_endowment_cents and Fund.status == PROPOSED -> Fund.status := ENDOWED (inclusive boundary)"
          - "fund.version += 1; agreement.version += 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /giving/gift-agreements/{agreement_id}/transition {action: WITHDRAW}"
        actor: GiftAdministrator
        preconditions: ["agreement.status == DRAFT"]
        side_effects: ["agreement.version += 1"]
      - from: EXECUTED
        to: RESCINDED
        trigger: "POST /giving/gift-agreements/{agreement_id}/transition {action: RESCIND}"
        actor: GiftAdministrator
        preconditions:
          - "agreement.status == EXECUTED"
          - "no linked GiftAsset has status IN {RECEIVED, APPRAISED, LIQUIDATED, DISTRIBUTED} (nothing received yet) else ERR_INVALID_STATE"
        side_effects:
          - "ReserveFund.projected_target_cents recomputed (CGA leaves projected set)"
          - "donor.documented_gift_total_cents recomputed"
          - "agreement.version += 1"

  - entity: BeneficiaryDesignation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /giving/beneficiary-designations/{designation_id}/transition {action: SUBMIT}"
        actor: GiftOfficer
        preconditions:
          - "designation.status IN {DRAFT, REJECTED} (REJECTED -> SUBMITTED is the revise-and-resubmit loop)"
          - "no OTHER designation for the same (gift_agreement_id, slot) currently has status == SUBMITTED (ERR_SLOT_OCCUPIED)"
        side_effects: ["designation.version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /giving/beneficiary-designations/{designation_id}/transition {action: SUBMIT}"
        actor: GiftOfficer
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects: ["designation.version += 1; rejection_reason cleared"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /giving/beneficiary-designations/{designation_id}/transition {action: VERIFY}"
        actor: GiftAdministrator
        preconditions:
          - "designation.status == SUBMITTED"
          - "designation.document_received == true (ERR_DOCUMENT_NOT_RECEIVED)"
        side_effects:
          - "any OTHER designation for the same (gift_agreement_id, slot) with status == VERIFIED -> SUPERSEDED (its version += 1)"
          - "designation.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /giving/beneficiary-designations/{designation_id}/transition {action: REJECT, payload.rejection_reason}"
        actor: GiftAdministrator
        preconditions: ["designation.status == SUBMITTED"]
        side_effects: ["designation.rejection_reason := payload.rejection_reason; designation.version += 1"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /giving/beneficiary-designations/{designation_id}/transition {action: REVOKE}"
        actor: GiftAdministrator
        preconditions:
          - "designation.status == VERIFIED"
          - "parent agreement.status IN {DRAFT, EXECUTED} (designation paperwork is frozen once funded) else ERR_INVALID_STATE"
        side_effects: ["designation.version += 1"]

  - entity: GiftAsset
    initial_state: PLEDGED
    terminal_states: [DISTRIBUTED, RETURNED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /giving/gift-assets/{asset_id}/transition {action: RECEIVE}"
        actor: EstateManager
        preconditions:
          - "asset.status == PLEDGED"
          - "for SECURITIES: payload carries dod_high_price_cents and dod_low_price_cents (alt pair optional, estate-linked only)"
        side_effects:
          - "fmv_cents computed for SECURITIES (basis-selected mean)"
          - "parent agreement.received_value_cents recomputed; EXECUTED -> FUNDED auto-transition evaluated (inclusive >= boundary)"
          - "asset.version += 1"
      - from: RECEIVED
        to: APPRAISED
        trigger: "POST /giving/gift-assets/{asset_id}/transition {action: APPRAISE, payload.appraised_value_cents}"
        actor: EstateManager
        preconditions:
          - "asset.status == RECEIVED"
          - "asset_kind == REAL_ESTATE (appraisal step exists only for real estate; other kinds -> ERR_INVALID_STATE)"
        side_effects:
          - "parent agreement.received_value_cents recomputed with appraised_value_cents; EXECUTED -> FUNDED auto-transition re-evaluated"
          - "asset.version += 1"
      - from: "RECEIVED | APPRAISED"
        to: LIQUIDATED
        trigger: "POST /giving/gift-assets/{asset_id}/transition {action: LIQUIDATE, payload.gross_proceeds_cents, payload.liquidation_costs_cents}"
        actor: EstateManager
        preconditions:
          - "asset.status IN {RECEIVED, APPRAISED}"
          - "if asset_kind == REAL_ESTATE then status must be APPRAISED (ERR_ASSET_KIND_REQUIRES_APPRAISAL)"
        side_effects:
          - "net_proceeds_cents := gross_proceeds_cents - liquidation_costs_cents (per-asset rounding step)"
          - "HOP 1: if asset is linked to an agreement whose vehicle_type == CGA -> ReserveFund.balance_cents += net_proceeds_cents"
          - "HOP 1b: if asset is estate-linked -> estate.gross_proceeds_cents recomputed"
          - "HOP 2 (CGA-linked): ReserveFund booked_coverage_bps recomputed from new balance"
          - "HOP 3 (CGA-linked): ReserveFund.posture recomputed (may flip RESERVE_DEFICIENT -> SOLVENT)"
          - "asset.version += 1"
      - from: LIQUIDATED
        to: DISTRIBUTED
        trigger: "POST /giving/gift-assets/{asset_id}/transition {action: DISTRIBUTE}"
        actor: EstateManager
        preconditions:
          - "asset.status == LIQUIDATED"
          - "if estate-linked: estate.status IN {DISTRIBUTION_PENDING, DISTRIBUTED} else ERR_INVALID_STATE"
        side_effects: ["asset.version += 1"]
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /giving/gift-assets/{asset_id}/transition {action: RETURN}"
        actor: EstateManager
        preconditions:
          - "asset.status == RECEIVED"
          - "if agreement-linked: parent agreement.status IN {EXECUTED, RESCINDED} (cannot return assets of a funded/active agreement) else ERR_INVALID_STATE"
        side_effects:
          - "parent agreement.received_value_cents recomputed (asset leaves the inclusion set)"
          - "asset.version += 1"

  - entity: AnnuityPayment
    initial_state: SCHEDULED
    terminal_states: [PAID, LAPSED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system auto-transition: clock sweep on POST /giving/_clock/set_current_utc flips payments with due_date <= now (also applied lazily on any read of the payment)"
        actor: system
        preconditions: ["payment.status == SCHEDULED AND payment.due_date <= logical clock now"]
        side_effects: ["payment.version += 1"]
      - from: DUE
        to: PAID
        trigger: "POST /giving/annuity-payments/{payment_id}/transition {action: PAY}"
        actor: GiftAdministrator
        preconditions:
          - "payment.status == DUE (else ERR_PAYMENT_NOT_DUE)"
          - "parent agreement.status == ACTIVE (SUSPENDED -> ERR_AGREEMENT_SUSPENDED; any other status -> ERR_INVALID_STATE — note MATURED/TERMINATED agreements have no non-LAPSED payments, so this is only reachable via crafted states)"
        side_effects:
          - "paid_at := logical clock now"
          - "parent agreement.total_paid_cents recomputed"
          - "payment.version += 1; agreement.version += 1"
      - from: DUE
        to: DEFERRED
        trigger: "POST /giving/annuity-payments/{payment_id}/transition {action: DEFER, payload.defer_until}"
        actor: GiftAdministrator
        preconditions:
          - "payment.status == DUE (else ERR_PAYMENT_NOT_DUE)"
          - "payload.defer_until > logical clock now (ERR_INVALID_REQUEST)"
        side_effects: ["payment.version += 1"]
      - from: DEFERRED
        to: DUE
        trigger: "system auto-transition: clock sweep flips DEFERRED payments with defer_until <= now back to DUE"
        actor: system
        preconditions: ["payment.status == DEFERRED AND payment.defer_until <= logical clock now"]
        side_effects: ["payment.version += 1"]
      - from: "SCHEDULED | DUE | DEFERRED"
        to: LAPSED
        trigger: "POST /giving/annuity-payments/{payment_id}/transition {action: LAPSE} OR cascades (donor death / agreement terminate / agreement settle)"
        actor: GiftAdministrator | system
        preconditions: ["payment.status IN {SCHEDULED, DUE, DEFERRED}"]
        side_effects:
          - "lapse_reason := MANUAL for the direct endpoint; DONOR_DEATH / TERMINATION / MATURITY for cascades"
          - "parent agreement.liability_released_cents recomputed"
          - "payment.version += 1; agreement.version += 1"

  - entity: ReserveFund
    initial_state: SOLVENT
    terminal_states: []
    transitions:
      - from: SOLVENT
        to: RESERVE_DEFICIENT
        trigger: "system auto-transition on any recompute where booked_target_cents > 0 AND booked_coverage_bps < 10000"
        actor: system
        preconditions: ["booked_target_cents > 0 AND floor(balance_cents * 10000 / booked_target_cents) < 10000"]
        side_effects: ["while RESERVE_DEFICIENT: CGA execution gate blocks new CGA EXECUTE (ERR_RESERVE_DEFICIENT); CRT/bequest unaffected"]
      - from: RESERVE_DEFICIENT
        to: SOLVENT
        trigger: "system auto-transition on any recompute where booked_target_cents == 0 OR booked_coverage_bps >= 10000"
        actor: system
        preconditions: ["booked_target_cents == 0 OR booked_coverage_bps >= 10000"]
        side_effects: ["reserve fund version += 1 on every balance/target/posture mutation"]

  - entity: Estate
    initial_state: NOTIFIED
    terminal_states: [CLOSED]
    transitions:
      - from: NOTIFIED
        to: PROBATE_OPEN
        trigger: "POST /giving/estates/{estate_id}/transition {action: OPEN_PROBATE}"
        actor: EstateManager
        preconditions: ["estate.status == NOTIFIED"]
        side_effects: ["estate.version += 1"]
      - from: PROBATE_OPEN
        to: CONTESTED
        trigger: "POST /giving/estates/{estate_id}/transition {action: CONTEST}"
        actor: EstateManager
        preconditions: ["estate.status == PROBATE_OPEN"]
        side_effects: ["estate.version += 1"]
      - from: CONTESTED
        to: PROBATE_OPEN
        trigger: "POST /giving/estates/{estate_id}/transition {action: RESOLVE_CONTEST}"
        actor: EstateManager
        preconditions: ["estate.status == CONTESTED"]
        side_effects: ["estate.version += 1"]
      - from: "NOTIFIED | PROBATE_OPEN"
        to: "NOTIFIED | PROBATE_OPEN (no status change; basis election)"
        trigger: "POST /giving/estates/{estate_id}/transition {action: ELECT_ALTERNATE_VALUATION}"
        actor: EstateManager
        preconditions:
          - "estate.status IN {NOTIFIED, PROBATE_OPEN}"
          - "estate.alternate_valuation_elected == false (one-way election)"
        side_effects:
          - "estate.alternate_valuation_elected := true"
          - "every linked SECURITIES GiftAsset in status != PLEDGED has fmv_cents recomputed on the ALT price pair (round_half_up((alt_high+alt_low)/2)); assets missing the alt pair keep the DOD basis"
          - "estate.version += 1"
      - from: PROBATE_OPEN
        to: DISTRIBUTION_PENDING
        trigger: "POST /giving/estates/{estate_id}/transition {action: BEGIN_DISTRIBUTION, payload.administration_costs_cents, payload.specific_bequests_cents}"
        actor: EstateManager
        preconditions:
          - "estate.status == PROBATE_OPEN"
          - "SoD: actor X-User-ID != estate.recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "every linked ProbateMilestone has status == CLOSED (ERR_MILESTONES_OPEN)"
          - "every linked GiftAsset has status IN {LIQUIDATED, DISTRIBUTED, RETURNED} (ERR_ASSETS_NOT_LIQUIDATED)"
          - "residual = gross_proceeds_cents - administration_costs_cents - specific_bequests_cents >= 0 (ERR_DISTRIBUTION_OVERFLOW)"
        side_effects:
          - "estate.residual_to_university_cents := residual; administration_costs_cents and specific_bequests_cents stored from payload"
          - "HOP 1: if estate.gift_agreement_id set and that agreement.fund_id set -> Fund.balance_cents += residual"
          - "HOP 2: if that Fund.status == PROPOSED AND Fund.balance_cents >= Fund.minimum_endowment_cents -> Fund.status := ENDOWED (inclusive boundary)"
          - "estate.version += 1; fund.version += 1 when credited"
      - from: DISTRIBUTION_PENDING
        to: DISTRIBUTED
        trigger: "POST /giving/estates/{estate_id}/transition {action: MARK_DISTRIBUTED}"
        actor: EstateManager
        preconditions: ["estate.status == DISTRIBUTION_PENDING"]
        side_effects: ["estate.distributed_on := logical clock now; estate.version += 1"]
      - from: DISTRIBUTED
        to: CLOSED
        trigger: "POST /giving/estates/{estate_id}/transition {action: CLOSE}"
        actor: EstateManager
        preconditions: ["estate.status == DISTRIBUTED"]
        side_effects:
          - "if estate.gift_agreement_id set and that agreement.status == MATURED -> agreement remains MATURED until FinanceSteward SETTLEs it (estate close does not settle the agreement)"
          - "estate.version += 1"

  - entity: ProbateMilestone
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /giving/probate-milestones/{milestone_id}/transition {action: FILE}"
        actor: EstateManager
        preconditions: ["milestone.status IN {PENDING, OVERDUE}"]
        side_effects: ["milestone.filed_on := logical clock now; milestone.version += 1"]
      - from: OVERDUE
        to: FILED
        trigger: "POST /giving/probate-milestones/{milestone_id}/transition {action: FILE} (late cure)"
        actor: EstateManager
        preconditions: ["milestone.status IN {PENDING, OVERDUE}"]
        side_effects: ["milestone.filed_on := logical clock now; milestone.version += 1"]
      - from: FILED
        to: CLOSED
        trigger: "POST /giving/probate-milestones/{milestone_id}/transition {action: CLOSE}"
        actor: EstateManager
        preconditions: ["milestone.status == FILED"]
        side_effects: ["milestone.version += 1"]
      - from: "PENDING | FILED"
        to: OVERDUE
        trigger: "system auto-transition: clock sweep flips milestones with due_date < now to OVERDUE"
        actor: system
        preconditions: ["milestone.status IN {PENDING, FILED} AND milestone.due_date < logical clock now"]
        side_effects: ["milestone.version += 1"]

  - entity: Fund
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    transitions:
      - from: PROPOSED
        to: ENDOWED
        trigger: "system auto-transition on any credit where balance_cents >= minimum_endowment_cents (inclusive)"
        actor: system
        preconditions: ["fund.status == PROPOSED AND fund.balance_cents >= fund.minimum_endowment_cents"]
        side_effects: ["fund.version += 1"]
      - from: "PROPOSED | ENDOWED"
        to: ACTIVE
        trigger: "POST /giving/funds/{fund_id}/transition {action: ACTIVATE}"
        actor: FinanceSteward
        preconditions:
          - "fund.status IN {PROPOSED, ENDOWED}"
          - "fund.balance_cents >= fund.minimum_endowment_cents (ERR_FUND_MINIMUM_NOT_MET)"
        side_effects: ["fund.version += 1"]
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /giving/funds/{fund_id}/transition {action: FREEZE}"
        actor: FinanceSteward
        preconditions: ["fund.status == ACTIVE"]
        side_effects: ["fund.version += 1"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /giving/funds/{fund_id}/transition {action: UNFREEZE}"
        actor: FinanceSteward
        preconditions: ["fund.status == FROZEN"]
        side_effects: ["fund.version += 1"]
      - from: PROPOSED
        to: CLOSED
        trigger: "POST /giving/funds/{fund_id}/transition {action: CLOSE}"
        actor: FinanceSteward
        preconditions: ["fund.status == PROPOSED"]
        side_effects: ["fund.version += 1"]

  - entity: ValuationRun
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /giving/valuation-runs/{valuation_run_id}/post"
        actor: ComplianceOfficer
        preconditions:
          - "run.status == DRAFT (else ERR_VALUATION_ALREADY_POSTED)"
          - "SoD: actor X-User-ID != run.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "closed window [coverage_start, coverage_end] does not intersect the closed window of any OTHER POSTED ValuationRun (ERR_VALUATION_WINDOW_OVERLAP); sharing a single boundary date IS an overlap"
          - "an ACTIVE RateTable whose window covers valuation_date exists (ERR_NO_ACTIVE_RATE_TABLE)"
        side_effects:
          - "HOP 1 (per GiftAgreement with status IN {FUNDED, ACTIVE, SUSPENDED} and vehicle_type != BEQUEST, processed in created_at ASC order): apply corpus_updates entry if present (CRT_UNITRUST only); ages advanced by whole years from funding_month to valuation_date; actuarial_liability_cents recomputed at the valuation-date discount rate; remainder_value_cents recomputed; for CRT_UNITRUST annual_annuity_cents := round_half_up(new corpus_value_cents * payout_rate_bps / 10000); for CGA reserve_requirement_cents recomputed at the advanced age"
          - "HOP 2 (per CRT_UNITRUST agreement revalued in HOP 1): its SCHEDULED AnnuityPayments' amount_cents recomputed as round_half_up(new annual_annuity_cents / frequency_divisor)"
          - "HOP 3 (per such agreement): total_scheduled_cents recomputed as the sum of payment amounts"
          - "HOP 4: ReserveFund booked/projected targets recomputed from new CGA requirements; coverage and posture recomputed"
          - "run.agreements_revalued_count / total_liability_cents / total_remainder_cents computed; posted_at and posted_by_user_id set"
          - "run.version += 1; every mutated agreement/payment version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: GiftAgreement
    write_endpoint: "POST /giving/gift-agreements/{agreement_id}/amend"
    occ_field: "expected_gift_agreement_version"
    description: |
      Amending a DRAFT GiftAgreement whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. A DRAFT->DRAFT
      amendment changes no state field, so a second sequential amendment
      carrying a previously-observed version would otherwise silently apply on
      top of an intervening amendment (or an intervening EXECUTE's side
      effects) — the stale-version check is the only guard.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reserve-adjust-stale-version
    parent_entity: ReserveFund
    write_endpoint: "POST /giving/reserve-fund/adjustments"
    occ_field: "expected_reserve_fund_version"
    description: |
      Posting a reserve adjustment against a ReserveFund whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Adjustments legitimately stack (a contribution and a
      withdrawal both succeed in sequence), so the client MUST base each
      adjustment on the current version; a stale version proves the client
      computed its amount from a superseded balance/coverage snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annuity_payment_amount
    trigger: "GiftAgreement EXECUTE (initial), ValuationRun POST (CRT_UNITRUST revaluation), generate-payment-schedule (per-payment split)"
    algorithm: tiered_pricing
    formula: |
      FREQUENCY_DIVISOR = {ANNUAL: 1, SEMIANNUAL: 2, QUARTERLY: 4, MONTHLY: 12}
      annual_annuity_cents =
        CGA | CRT_ANNUITY : round_half_up(gift_amount_cents * payout_rate_bps / 10000)   # FIXED_AT_FUNDING: computed once at EXECUTE, never changes
        CRT_UNITRUST      : round_half_up(corpus_value_cents * payout_rate_bps / 10000)  # ANNUALLY_REVALUED: recomputed whenever corpus_value_cents changes
        BEQUEST           : null (no payments)
      per_payment amount_cents = round_half_up(annual_annuity_cents / FREQUENCY_DIVISOR[payment_frequency])
      Every payment in a schedule uses the SAME independently-rounded amount; there is NO
      cumulative true-up on the final payment, so sum(payments) may differ from
      annual_annuity_cents * years by a few cents (pinned rounding order: per-line first).
    input_set: "The single GiftAgreement being executed/revalued/scheduled"
    constants:
      FREQUENCY_DIVISOR_ANNUAL: 1
      FREQUENCY_DIVISOR_SEMIANNUAL: 2
      FREQUENCY_DIVISOR_QUARTERLY: 4
      FREQUENCY_DIVISOR_MONTHLY: 12
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: FIXED_AT_FUNDING
        when: "vehicle_type IN {CGA, CRT_ANNUITY}"
        difference: "annual annuity is a function of the ORIGINAL gift_amount_cents only; corpus changes never alter payments"
      - name: ANNUALLY_REVALUED
        when: "vehicle_type == CRT_UNITRUST"
        difference: "annual annuity is a function of CURRENT corpus_value_cents; a ValuationRun corpus update changes all future SCHEDULED payment amounts"

  - name: charitable_deduction
    trigger: "Illustration create (provisional, illustrated_deduction_cents) and GiftAgreement EXECUTE (final, booked_deduction_cents)"
    algorithm: constraint_propagation
    formula: |
      r = pinned_rate_table.discount_rate_bps / 10000; v = 1 / (1 + r)
      n(age) = max(1, MORTALITY_TERMINAL_AGE - age)                       # age floor: n >= 1
      a(n) = (1 - v^n) / r                                                # whole-life annuity-immediate factor, full precision (no intermediate rounding)
      lives=1 : factor = a(n(annuitant_1_age))
      lives=2 : factor = a(n(annuitant_1_age)) + a(n(annuitant_2_age)) - a(n(max(annuitant_1_age, annuitant_2_age)))
      pv_of_annuity_cents = round_half_up(annual_annuity_cents * factor)
      deduction_cents = max(0, gift_amount_cents - pv_of_annuity_cents)   # floor at zero — non-linear branch
      BEQUEST: deduction_cents = gift_amount_cents (full; no annuity offsets)
      REMAINDER TEST (CGA/CRT_*): deduction_cents * 10 >= gift_amount_cents (inclusive 10% boundary)
      EXHAUSTION TEST (CRT_ANNUITY only): pv_of_annuity_cents <= round_half_up(gift_amount_cents * EXHAUSTION_LIMIT_BPS / 10000)
    input_set: "The Illustration (provisional) or GiftAgreement (final) plus its pinned RateTable"
    constants:
      MORTALITY_TERMINAL_AGE: 100
      EXHAUSTION_LIMIT_BPS: 8500
    precision: "factor in full float precision; pv rounded half-up to integer cents; deduction integer cents"
    variants:
      - name: PROVISIONAL
        when: "Illustration creation"
        difference: "computed under the rate table ACTIVE for funding_month AT ILLUSTRATION TIME; purely informational"
      - name: FINAL
        when: "GiftAgreement EXECUTE"
        difference: "recomputed under the agreement's pinned rate table; if the pinned table was superseded by a newer ACTIVE table for a DIFFERENT funding month (or funding_month amended), the final deduction diverges from the illustrated one; the FINAL value gates the 10%/exhaustion tests"

  - name: reserve_requirement
    trigger: "GiftAgreement EXECUTE (CGA only); recomputed by ValuationRun POST at advanced ages"
    algorithm: constraint_propagation
    formula: |
      vehicle_type == CGA:
        n = max(1, MORTALITY_TERMINAL_AGE - oldest_annuitant_age)         # single-life: annuitant_1_age; joint: max(age1, age2)
        f = a(n) at r = RESERVE_DISCOUNT_RATE_BPS / 10000
        reserve_requirement_cents = round_half_up(annual_annuity_cents * f * RESERVE_MULTIPLIER_BPS / 10000)
      other vehicles: reserve_requirement_cents = 0
    input_set: "The single CGA GiftAgreement"
    constants:
      RESERVE_DISCOUNT_RATE_BPS: 600
      RESERVE_MULTIPLIER_BPS: 11000
      MORTALITY_TERMINAL_AGE: 100
    precision: "integer cents, round_half_up"

  - name: reserve_coverage_posture
    trigger: "Any mutation to ReserveFund.balance_cents or to any CGA GiftAgreement's status/reserve_requirement_cents"
    algorithm: threshold
    formula: |
      PINNED EVALUATION ORDER (breaks the circular "posture depends on target depends on what posture allows" loop):
        (1) booked_target_cents   = sum(reserve_requirement_cents) over GiftAgreement where vehicle_type=CGA AND status IN {FUNDED, ACTIVE, SUSPENDED}
        (2) projected_target_cents = booked_target_cents + sum(reserve_requirement_cents) over GiftAgreement where vehicle_type=CGA AND status == EXECUTED
        (3) booked_coverage_bps   = booked_target_cents == 0 ? null : floor(balance_cents * 10000 / booked_target_cents)
        (4) posture               = (booked_target_cents == 0 OR booked_coverage_bps >= 10000) ? SOLVENT : RESERVE_DEFICIENT
        (5) CGA EXECUTE gate (evaluated BEFORE the transition, candidate included):
            balance_cents >= booked_target_cents + sum(other EXECUTED CGA requirements) + candidate_requirement_cents
      Boundary: coverage of exactly 10000 bps is SOLVENT (inclusive); floor rounding means
      balance one cent below target yields 9999 bps, RESERVE_DEFICIENT.
    input_set: "ReserveFund singleton + all CGA GiftAgreements in the status-filtered sets above"
    constants:
      COVERAGE_SOLVENT_BPS: 10000
    precision: "coverage floored to integer bps (never rounded up into compliance)"
    variants:
      - name: BOOKED_STATUTORY
        when: "posture reporting and the POSTURE field"
        difference: "counts only FUNDED/ACTIVE/SUSPENDED CGA agreements"
      - name: PROJECTED_FORWARD_LOOKING
        when: "the CGA EXECUTE gate and projected_target_cents reporting"
        difference: "additionally counts EXECUTED (not yet funded) CGA agreements AND the candidate agreement; identical pool state produces a lower coverage than BOOKED whenever any EXECUTED CGA exists"

  - name: securities_fmv
    trigger: "GiftAsset RECEIVE (SECURITIES) and Estate ELECT_ALTERNATE_VALUATION (basis flip)"
    algorithm: aggregation
    formula: |
      fmv_cents = round_half_up((high + low) / 2) over the selected price pair
      basis selection (estate-linked assets): alternate_valuation_elected == true -> ALT pair, else DOD pair
      basis selection (agreement-linked assets): always the DOD pair (prices on receipt date)
      Assets missing the ALT pair keep the DOD basis even after election.
    input_set: "The single SECURITIES GiftAsset"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: DATE_OF_DEATH
        when: "default basis (or agreement-linked asset)"
        difference: "uses dod_high_price_cents / dod_low_price_cents"
      - name: ALTERNATE_VALUATION
        when: "estate-linked asset whose estate elected alternate valuation"
        difference: "uses alt_high_price_cents / alt_low_price_cents captured at DoD+6 months; identical DoD inputs yield a different fmv_cents"

  - name: estate_distribution_waterfall
    trigger: "Estate BEGIN_DISTRIBUTION"
    algorithm: waterfall_allocation
    formula: |
      gross_proceeds_cents = sum(net_proceeds_cents) over linked GiftAssets with status IN {LIQUIDATED, DISTRIBUTED}
        (net_proceeds_cents was itself rounded per-asset at LIQUIDATE — rounding order pinned: per-asset first, then sum)
      residual_to_university_cents = gross_proceeds_cents - administration_costs_cents - specific_bequests_cents
      Reject (ERR_DISTRIBUTION_OVERFLOW) when residual < 0, i.e. costs + bequests exceed gross proceeds.
      Conservation: administration_costs_cents + specific_bequests_cents + residual_to_university_cents == gross_proceeds_cents exactly.
    input_set: "The Estate and its linked GiftAssets"
    constants: {}
    precision: "integer cents; subtraction is exact (no rounding drift inside the waterfall)"

  - name: actuarial_liability_revaluation
    trigger: "ValuationRun POST"
    algorithm: projection
    formula: |
      For each GiftAgreement with status IN {FUNDED, ACTIVE, SUSPENDED} and vehicle_type != BEQUEST, in created_at ASC order:
        age_now(i) = annuitant_i_age + whole_years_between(funding_month, valuation_date)
        n_now = max(1, MORTALITY_TERMINAL_AGE - oldest age_now)
        r_now = discount_rate_bps of the ACTIVE RateTable covering valuation_date
        apply corpus_updates entry first when vehicle_type == CRT_UNITRUST (corpus_value_cents := new_corpus_cents)
        actuarial_liability_cents = round_half_up(annual_annuity_cents_new * a(n_now) at r_now)
          where annual_annuity_cents_new = (CRT_UNITRUST ? round_half_up(new corpus * payout_rate_bps / 10000) : annual_annuity_cents)
        remainder_value_cents = max(0, corpus_value_cents - actuarial_liability_cents)
        CGA: reserve_requirement_cents recomputed per reserve_requirement rule at n_now
      Run aggregates: agreements_revalued_count = count processed; total_liability_cents = sum of liabilities; total_remainder_cents = sum of remainders.
    input_set: "GiftAgreements with status IN {FUNDED, ACTIVE, SUSPENDED}, vehicle_type != BEQUEST; run's corpus_updates; ACTIVE rate table at valuation_date"
    constants:
      MORTALITY_TERMINAL_AGE: 100
    precision: "integer cents, round_half_up per agreement"

  - name: legacy_recognition_threshold
    trigger: "Donor legacy-society-transition RECOGNIZE"
    algorithm: threshold
    formula: |
      documented_gift_total_cents = sum(gift_amount_cents) over the donor's GiftAgreements
        with status IN {EXECUTED, FUNDED, ACTIVE, SUSPENDED, MATURED, SETTLED}
        (DRAFT, WITHDRAWN, RESCINDED, TERMINATED are EXCLUDED)
      eligible = documented_gift_total_cents >= LEGACY_THRESHOLD_CENTS   (inclusive boundary)
    input_set: "The Donor's GiftAgreements filtered by the status set above"
    constants:
      LEGACY_THRESHOLD_CENTS: 10000000
    precision: "integer cents, exact comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties: (a) execute — actor X-User-ID != created_by_user_id of the source Illustration; (b) valuation-run post — actor != run.created_by_user_id; (c) estate BEGIN_DISTRIBUTION — actor != estate.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /giving/gift-agreements/{agreement_id}/execute; POST /giving/valuation-runs/{valuation_run_id}/post; POST /giving/estates/{estate_id}/transition"
  - priority: 4
    category: existence
    check: "Every path id and every FK-valued body field resolves to an existing resource, validated left-to-right (path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "OCC: expected_gift_agreement_version == agreement.version (amend); expected_reserve_fund_version == reserve_fund.version (adjustments)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /giving/gift-agreements/{agreement_id}/amend; POST /giving/reserve-fund/adjustments"
  - priority: 6
    category: state
    check: "Target resource is in a from-state of the requested transition per §1.2 (covers terminal-state lockdown, ERR_VALUATION_ALREADY_POSTED on re-post, ERR_PAYMENT_NOT_DUE on PAY of non-DUE payment, ERR_AGREEMENT_SUSPENDED on PAY under SUSPENDED agreement)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 7
    category: state
    check: "Related-donor state: donor.vital_status == LIVING for illustration create, agreement create/book, execute, ENROLL; donor.vital_status == DECEASED for estate create"
    error_id: ERR_DONOR_STATE_MISMATCH
    http_status: 409
    applies_to: "POST /giving/illustrations; POST /giving/gift-agreements; POST /giving/illustrations/{id}/book; POST /giving/gift-agreements/{id}/execute; POST /giving/donors/{id}/legacy-society-transition; POST /giving/estates"
  - priority: 8
    category: business_safety
    check: "Regulatory remainder test: for annuity vehicles, booked deduction_cents * 10 >= gift_amount_cents (inclusive 10%)"
    error_id: ERR_REMAINDER_TEST_FAILED
    http_status: 422
    applies_to: "POST /giving/gift-agreements/{agreement_id}/execute"
  - priority: 9
    category: business_safety
    check: "Regulatory exhaustion test (CRT_ANNUITY only): pv_of_annuity_cents <= round_half_up(gift_amount_cents * 8500 / 10000) — tighter than the remainder ceiling by design"
    error_id: ERR_EXHAUSTION_TEST_FAILED
    http_status: 422
    applies_to: "POST /giving/gift-agreements/{agreement_id}/execute"
  - priority: 10
    category: business_safety
    check: "Documentation completeness: a VERIFIED BeneficiaryDesignation with slot=PRIMARY_1 exists for the agreement"
    error_id: ERR_DESIGNATION_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /giving/gift-agreements/{agreement_id}/execute"
  - priority: 11
    category: business_safety
    check: "Designation document on file: VERIFY requires document_received == true"
    error_id: ERR_DOCUMENT_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /giving/beneficiary-designations/{designation_id}/transition (VERIFY)"
  - priority: 12
    category: business_constraint
    check: "Vehicle/field consistency: BEQUEST must NOT carry payout_rate_bps or payment schedule; annuity vehicles MUST carry payout_rate_bps AND annuitant_1_age; lives=2 requires annuitant_2_age"
    error_id: ERR_BEQUEST_VEHICLE_MISMATCH
    http_status: 422
    applies_to: "POST /giving/illustrations; POST /giving/gift-agreements; POST /giving/gift-agreements/{id}/amend; POST /giving/gift-agreements/{id}/generate-payment-schedule"
  - priority: 13
    category: business_constraint
    check: "payout_rate_bps within [500, 5000] inclusive for annuity vehicles (500 accepted, 499 rejected; 5000 accepted, 5001 rejected)"
    error_id: ERR_PAYOUT_RATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /giving/illustrations; POST /giving/gift-agreements; POST /giving/gift-agreements/{id}/amend"
  - priority: 14
    category: business_constraint
    check: "Slot occupancy: at most one SUBMITTED BeneficiaryDesignation per (gift_agreement_id, slot)"
    error_id: ERR_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /giving/beneficiary-designations; POST /giving/beneficiary-designations/{id}/transition (SUBMIT)"
  - priority: 15
    category: business_constraint
    check: "Legacy society gates: ENROLL requires a documented planned gift; RECOGNIZE requires documented_gift_total_cents >= 10000000"
    error_id: ERR_LEGACY_SOCIETY_INELIGIBLE
    http_status: 422
    applies_to: "POST /giving/donors/{donor_id}/legacy-society-transition"
  - priority: 16
    category: business_constraint
    check: "Fund uniqueness per agreement: at most one Fund with status != CLOSED per gift_agreement_id"
    error_id: ERR_FUND_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /giving/funds"
  - priority: 17
    category: business_temporal
    check: "Rate-table half-open window overlap: among status IN {DRAFT, ACTIVE}, [effective_from, effective_to) must not intersect; adjacency permitted; null effective_to = +infinity"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /giving/rate-tables; POST /giving/rate-tables/{id}/transition (ACTIVATE)"
  - priority: 18
    category: business_temporal
    check: "Rate-table coverage: an ACTIVE rate table whose window covers funding_month must exist (creation pin); pinned table must still be ACTIVE at EXECUTE"
    error_id: ERR_RATE_TABLE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /giving/illustrations; POST /giving/gift-agreements; POST /giving/gift-agreements/{id}/execute"
  - priority: 19
    category: business_temporal
    check: "Valuation closed-window overlap: posting run's [coverage_start, coverage_end] must not intersect any other POSTED run's closed window (a shared boundary date IS an overlap); valuation_date must lie within its own coverage window (violation -> ERR_INVALID_REQUEST)"
    error_id: ERR_VALUATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /giving/valuation-runs/{valuation_run_id}/post"
  - priority: 20
    category: business_temporal
    check: "Valuation-date rate coverage: an ACTIVE rate table covering valuation_date must exist at POST"
    error_id: ERR_NO_ACTIVE_RATE_TABLE
    http_status: 422
    applies_to: "POST /giving/valuation-runs/{valuation_run_id}/post"
  - priority: 21
    category: business_referential
    check: "GiftAsset parentage: exactly one of gift_agreement_id / estate_id present and resolving"
    error_id: ERR_ASSET_ORPHAN
    http_status: 422
    applies_to: "POST /giving/gift-assets"
  - priority: 22
    category: business_referential
    check: "Estate distribution gates: all linked ProbateMilestones CLOSED; all linked GiftAssets in {LIQUIDATED, DISTRIBUTED, RETURNED}"
    error_id: ERR_MILESTONES_OPEN
    http_status: 409
    applies_to: "POST /giving/estates/{estate_id}/transition (BEGIN_DISTRIBUTION)"
  - priority: 23
    category: business_referential
    check: "Estate assets fully liquidated (second referential gate, evaluated after milestones)"
    error_id: ERR_ASSETS_NOT_LIQUIDATED
    http_status: 409
    applies_to: "POST /giving/estates/{estate_id}/transition (BEGIN_DISTRIBUTION)"
  - priority: 24
    category: business_referential
    check: "Appraisal prerequisite: REAL_ESTATE must be APPRAISED before LIQUIDATE"
    error_id: ERR_ASSET_KIND_REQUIRES_APPRAISAL
    http_status: 409
    applies_to: "POST /giving/gift-assets/{asset_id}/transition (LIQUIDATE)"
  - priority: 25
    category: business_fiscal
    check: "CGA reserve gate at EXECUTE: balance_cents >= booked_target + sum(other EXECUTED CGA requirements) + candidate requirement"
    error_id: ERR_RESERVE_DEFICIENT
    http_status: 409
    applies_to: "POST /giving/gift-agreements/{agreement_id}/execute"
  - priority: 26
    category: business_fiscal
    check: "Withdrawal / surrender solvency: WITHDRAWAL amount <= balance_cents; CGA termination surrender_value_cents <= balance_cents"
    error_id: ERR_INSUFFICIENT_RESERVE_BALANCE
    http_status: 422
    applies_to: "POST /giving/reserve-fund/adjustments; POST /giving/gift-agreements/{id}/terminate"
  - priority: 27
    category: business_fiscal
    check: "Estate waterfall solvency: administration_costs_cents + specific_bequests_cents <= gross_proceeds_cents"
    error_id: ERR_DISTRIBUTION_OVERFLOW
    http_status: 422
    applies_to: "POST /giving/estates/{estate_id}/transition (BEGIN_DISTRIBUTION)"
  - priority: 28
    category: business_fiscal
    check: "Fund activation minimum: balance_cents >= minimum_endowment_cents"
    error_id: ERR_FUND_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /giving/funds/{fund_id}/transition (ACTIVATE)"
  - priority: 29
    category: business_constraint
    check: "Envelope/schema: unknown fields, malformed types, invalid enum members, missing required fields, valuation_date outside coverage window"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/giving/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and NEVER falls back to wall-clock time. Side effects: sweeps AnnuityPayments (SCHEDULED->DUE when due_date<=now; DEFERRED->DUE when defer_until<=now) and ProbateMilestones (PENDING/FILED->OVERDUE when due_date<now)."
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["payment due/defer sweep", "milestone overdue sweep"]

  # ---- donors ----
  - method: POST
    path: "/giving/donors"
    description: "Register a donor"
    roles: [GiftOfficer]
    code: 201
    input: [full_name, date_of_birth, "contact_email?"]
    output: Donor
    side_effects: []
  - method: GET
    path: "/giving/donors"
    description: "List donors; filters vital_status, legacy_society_status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "vital_status?", "legacy_society_status?"]
    output: Donor[]
    side_effects: []
  - method: GET
    path: "/giving/donors/{donor_id}"
    description: "Read one donor (documented_gift_total_cents is live-computed)"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: POST
    path: "/giving/donors/{donor_id}/record-death"
    description: "Record donor death; fires the maturity cascade (agreements MATURED, payments LAPSED, bequest Estate auto-created, reserve recompute)"
    roles: [EstateManager]
    code: 200
    input: [deceased_on]
    output: Donor
    side_effects: ["Donor vital_status := DECEASED", "agreement maturity cascade (see Donor state machine HOP 1-4)", "donor.version += 1"]
  - method: POST
    path: "/giving/donors/{donor_id}/legacy-society-transition"
    description: "Legacy society stewardship transitions"
    roles: [GiftOfficer]
    code: 200
    input: [action]
    output: Donor
    side_effects: ["legacy_society_status transition per Donor state machine", "donor.version += 1"]

  # ---- rate tables ----
  - method: POST
    path: "/giving/rate-tables"
    description: "Create a discount-rate table in DRAFT; half-open window overlap with existing DRAFT/ACTIVE tables rejected (ERR_RATE_WINDOW_OVERLAP)"
    roles: [ComplianceOfficer]
    code: 201
    input: [label, discount_rate_bps, effective_from, "effective_to?"]
    output: RateTable
    side_effects: []
  - method: GET
    path: "/giving/rate-tables/{rate_table_id}"
    description: "Read one rate table"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: RateTable
    side_effects: []
  - method: POST
    path: "/giving/rate-tables/{rate_table_id}/transition"
    description: "ACTIVATE (DRAFT->ACTIVE, window overlap re-checked) or RETIRE (DRAFT/ACTIVE->RETIRED, terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: RateTable
    side_effects: ["rate_table.version += 1"]

  # ---- illustrations ----
  - method: POST
    path: "/giving/illustrations"
    description: "Create a gift illustration; pins the ACTIVE rate table covering funding_month (ERR_NO_ACTIVE_RATE_TABLE if none); if supersedes_illustration_id given and that illustration is OPEN, it flips to SUPERSEDED"
    roles: [GiftOfficer]
    code: 201
    input: [donor_id, vehicle_type, gift_amount_cents, "payout_rate_bps?", "payment_frequency?", "lives?", "annuitant_1_age?", "annuitant_2_age?", funding_month, "supersedes_illustration_id?"]
    output: Illustration
    side_effects: ["computed illustrated_annual_annuity_cents / illustrated_deduction_cents", "superseded illustration flips OPEN->SUPERSEDED", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/giving/illustrations"
    description: "List illustrations; filters donor_id, rate_table_id, supersedes_illustration_id, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "rate_table_id?", "supersedes_illustration_id?", "status?"]
    output: Illustration[]
    side_effects: []
  - method: GET
    path: "/giving/illustrations/{illustration_id}"
    description: "Read one illustration"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: Illustration
    side_effects: []
  - method: POST
    path: "/giving/illustrations/{illustration_id}/book"
    description: "Book an OPEN illustration: creates a DRAFT GiftAgreement prefilled from the illustration (rate-table pin copied)"
    roles: [GiftOfficer]
    code: 201
    input: []
    output: GiftAgreement
    side_effects: ["illustration.status := BOOKED", "GiftAgreement DRAFT created", "illustration.version += 1"]

  # ---- gift agreements ----
  - method: POST
    path: "/giving/gift-agreements"
    description: "Create a DRAFT agreement directly (no illustration); pins ACTIVE rate table covering funding_month"
    roles: [GiftOfficer]
    code: 201
    input: [donor_id, vehicle_type, gift_amount_cents, "payout_rate_bps?", "payment_frequency?", "lives?", "annuitant_1_age?", "annuitant_2_age?", funding_month, "restriction_type?", "restriction_text?", "fund_id?"]
    output: GiftAgreement
    side_effects: ["rate_table_id pinned"]
  - method: GET
    path: "/giving/gift-agreements"
    description: "List agreements; filters donor_id, fund_id, illustration_id, status, vehicle_type"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "fund_id?", "illustration_id?", "rate_table_id?", "status?", "vehicle_type?"]
    output: GiftAgreement[]
    side_effects: []
  - method: GET
    path: "/giving/gift-agreements/{agreement_id}"
    description: "Read one agreement (all computed fields current)"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: []
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/amend"
    description: "Amend a DRAFT agreement in place (OCC-guarded). DRAFT->DRAFT changes no status field, so stale versions are the only protection against lost updates"
    roles: [GiftAdministrator]
    code: 200
    input: [expected_gift_agreement_version, "gift_amount_cents?", "payout_rate_bps?", "payment_frequency?", "restriction_type?", "restriction_text?", "fund_id?"]
    output: GiftAgreement
    side_effects: ["applies field changes", "agreement.version += 1"]
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/execute"
    description: "Execute a DRAFT agreement: runs deduction/remainder/exhaustion gates, SoD check, reserve gate (CGA), pins booked economics"
    roles: [GiftAdministrator]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["status DRAFT->EXECUTED", "booked_deduction_cents/annual_annuity_cents/actuarial_liability_cents/remainder_value_cents/reserve_requirement_cents computed", "corpus_value_cents := gift_amount_cents", "ReserveFund.projected_target_cents recomputed", "donor.documented_gift_total_cents recomputed", "agreement.version += 1"]
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/transition"
    description: "Lifecycle transitions: SUSPEND (ACTIVE->SUSPENDED), RESUME (SUSPENDED->ACTIVE) [ComplianceOfficer]; WITHDRAW (DRAFT->WITHDRAWN), RESCIND (EXECUTED->RESCINDED) [GiftAdministrator]"
    roles: [GiftAdministrator, ComplianceOfficer]
    code: 200
    input: [action]
    output: GiftAgreement
    side_effects: ["per GiftAgreement state machine", "agreement.version += 1"]
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/terminate"
    description: "Early termination from EXECUTED/FUNDED/ACTIVE/SUSPENDED: surrenders value (CGA debits ReserveFund), lapses open payments"
    roles: [GiftAdministrator]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["surrender_value_cents computed", "CGA: ReserveFund.balance_cents -= surrender_value_cents", "open payments -> LAPSED (TERMINATION)", "reserve targets/coverage/posture recomputed", "agreement.version += 1"]
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/settle"
    description: "Settle a MATURED agreement: credits remainder_value_cents to its Fund; fund auto-endows at threshold"
    roles: [FinanceSteward]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["Fund.balance_cents += remainder_value_cents", "Fund PROPOSED->ENDOWED when balance >= minimum_endowment_cents", "agreement.version += 1; fund.version += 1"]
  - method: POST
    path: "/giving/gift-agreements/{agreement_id}/generate-payment-schedule"
    description: "FUNDED->ACTIVE; creates the full annuity payment schedule (N = divisor * max(1, 100 - oldest age), first due one period after funding)"
    roles: [GiftAdministrator]
    code: 201
    input: []
    output: AnnuityPayment[]
    side_effects: ["creates N AnnuityPayments (SCHEDULED)", "agreement.status := ACTIVE", "agreement.total_scheduled_cents := sum(payments)", "agreement.version += 1"]

  # ---- beneficiary designations ----
  - method: POST
    path: "/giving/beneficiary-designations"
    description: "Create a designation (DRAFT); rejects when another SUBMITTED designation exists for the same (agreement, slot)"
    roles: [GiftOfficer]
    code: 201
    input: [gift_agreement_id, slot, beneficiary_name, "document_received?"]
    output: BeneficiaryDesignation
    side_effects: []
  - method: GET
    path: "/giving/beneficiary-designations"
    description: "List designations; filters gift_agreement_id, slot, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "gift_agreement_id?", "slot?", "status?"]
    output: BeneficiaryDesignation[]
    side_effects: []
  - method: GET
    path: "/giving/beneficiary-designations/{designation_id}"
    description: "Read one designation"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: []
  - method: POST
    path: "/giving/beneficiary-designations/{designation_id}/transition"
    description: "SUBMIT (DRAFT/REJECTED->SUBMITTED [GiftOfficer]); VERIFY / REJECT / REVOKE [GiftAdministrator]; VERIFY auto-supersedes any other VERIFIED designation on the same (agreement, slot)"
    roles: [GiftOfficer, GiftAdministrator]
    code: 200
    input: [action, "rejection_reason?"]
    output: BeneficiaryDesignation
    side_effects: ["per BeneficiaryDesignation state machine", "designation.version += 1"]

  # ---- gift assets ----
  - method: POST
    path: "/giving/gift-assets"
    description: "Pledge an asset against an agreement XOR an estate (exactly one FK; ERR_ASSET_ORPHAN)"
    roles: [EstateManager]
    code: 201
    input: [asset_kind, pledged_value_cents, "gift_agreement_id?", "estate_id?", "description?"]
    output: GiftAsset
    side_effects: []
  - method: GET
    path: "/giving/gift-assets"
    description: "List assets; filters gift_agreement_id, estate_id, asset_kind, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "gift_agreement_id?", "estate_id?", "asset_kind?", "status?"]
    output: GiftAsset[]
    side_effects: []
  - method: GET
    path: "/giving/gift-assets/{asset_id}"
    description: "Read one gift asset"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: GiftAsset
    side_effects: []
  - method: POST
    path: "/giving/gift-assets/{asset_id}/transition"
    description: "RECEIVE (records price pairs, computes fmv, evaluates EXECUTED->FUNDED) / APPRAISE (REAL_ESTATE) / LIQUIDATE (computes net proceeds; CGA-linked credits ReserveFund; estate-linked recomputes gross) / RETURN / DISTRIBUTE"
    roles: [EstateManager]
    code: 200
    input: [action, "dod_high_price_cents?", "dod_low_price_cents?", "alt_high_price_cents?", "alt_low_price_cents?", "appraised_value_cents?", "gross_proceeds_cents?", "liquidation_costs_cents?"]
    output: GiftAsset
    side_effects: ["per GiftAsset state machine incl. ReserveFund and funding-threshold cascades", "asset.version += 1"]

  # ---- annuity payments ----
  - method: GET
    path: "/giving/annuity-payments"
    description: "List payments; filters gift_agreement_id, status; lazy clock sweep applied to listed rows; deterministic sort period_index ASC within an agreement"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "gift_agreement_id?", "status?"]
    output: AnnuityPayment[]
    side_effects: ["lazy SCHEDULED->DUE / DEFERRED->DUE sweep on read"]
  - method: GET
    path: "/giving/annuity-payments/{payment_id}"
    description: "Read one annuity payment (lazy clock sweep applied)"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: AnnuityPayment
    side_effects: ["lazy SCHEDULED->DUE / DEFERRED->DUE sweep on read"]
  - method: POST
    path: "/giving/annuity-payments/{payment_id}/transition"
    description: "PAY (DUE->PAID; blocked when agreement SUSPENDED) / DEFER (DUE->DEFERRED with defer_until) / LAPSE (SCHEDULED/DUE/DEFERRED->LAPSED, reason MANUAL)"
    roles: [GiftAdministrator]
    code: 200
    input: [action, "defer_until?"]
    output: AnnuityPayment
    side_effects: ["per AnnuityPayment state machine", "parent agreement total_paid_cents / liability_released_cents recomputed", "payment.version += 1"]

  # ---- reserve fund (singleton) ----
  - method: GET
    path: "/giving/reserve-fund"
    description: "Read the reserve pool: balance, booked/projected targets, booked_coverage_bps, posture"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: ReserveFund
    side_effects: []
  - method: POST
    path: "/giving/reserve-fund/adjustments"
    description: "Manual reserve adjustment (OCC-guarded): CONTRIBUTION adds, WITHDRAWAL subtracts amount_cents; coverage/posture recomputed"
    roles: [ComplianceOfficer]
    code: 200
    input: [direction, amount_cents, expected_reserve_fund_version]
    output: ReserveFund
    side_effects: ["balance_cents +=/-= amount_cents", "coverage/posture recomputed", "reserve_fund.version += 1"]

  # ---- estates & probate ----
  - method: POST
    path: "/giving/estates"
    description: "Open an estate file for a DECEASED donor (manual notification path; the death cascade also auto-creates estates for matured bequests)"
    roles: [EstateManager]
    code: 201
    input: [donor_id, notified_on, "gift_agreement_id?"]
    output: Estate
    side_effects: ["recorded_by_user_id := X-User-ID"]
  - method: GET
    path: "/giving/estates"
    description: "List estates; filters donor_id, gift_agreement_id, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "gift_agreement_id?", "status?"]
    output: Estate[]
    side_effects: []
  - method: GET
    path: "/giving/estates/{estate_id}"
    description: "Read one estate"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: Estate
    side_effects: []
  - method: POST
    path: "/giving/estates/{estate_id}/transition"
    description: "OPEN_PROBATE / CONTEST / RESOLVE_CONTEST / ELECT_ALTERNATE_VALUATION / BEGIN_DISTRIBUTION (waterfall + fund credit + SoD) / MARK_DISTRIBUTED / CLOSE"
    roles: [EstateManager]
    code: 200
    input: [action, "administration_costs_cents?", "specific_bequests_cents?"]
    output: Estate
    side_effects: ["per Estate state machine incl. fund credit and ENDOWED auto-transition", "estate.version += 1"]
  - method: POST
    path: "/giving/probate-milestones"
    description: "Add a probate milestone to an estate"
    roles: [EstateManager]
    code: 201
    input: [estate_id, kind, due_date]
    output: ProbateMilestone
    side_effects: []
  - method: GET
    path: "/giving/probate-milestones"
    description: "List milestones; filters estate_id, kind, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "estate_id?", "kind?", "status?"]
    output: ProbateMilestone[]
    side_effects: []
  - method: GET
    path: "/giving/probate-milestones/{milestone_id}"
    description: "Read one probate milestone"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: ProbateMilestone
    side_effects: []
  - method: POST
    path: "/giving/probate-milestones/{milestone_id}/transition"
    description: "FILE (PENDING/OVERDUE->FILED) / CLOSE (FILED->CLOSED)"
    roles: [EstateManager]
    code: 200
    input: [action]
    output: ProbateMilestone
    side_effects: ["milestone.version += 1"]

  # ---- funds ----
  - method: POST
    path: "/giving/funds"
    description: "Create a donor-restricted fund (PROPOSED, balance 0); at most one non-CLOSED fund per agreement (ERR_FUND_ALREADY_EXISTS)"
    roles: [FinanceSteward]
    code: 201
    input: [name, restriction_type, gift_agreement_id, "minimum_endowment_cents?"]
    output: Fund
    side_effects: []
  - method: GET
    path: "/giving/funds"
    description: "List funds; filters gift_agreement_id, restriction_type, status"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: ["limit?", "offset?", "gift_agreement_id?", "restriction_type?", "status?"]
    output: Fund[]
    side_effects: []
  - method: GET
    path: "/giving/funds/{fund_id}"
    description: "Read one fund"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: Fund
    side_effects: []
  - method: POST
    path: "/giving/funds/{fund_id}/transition"
    description: "ACTIVATE (PROPOSED/ENDOWED->ACTIVE, minimum gate) / FREEZE (ACTIVE->FROZEN) / UNFREEZE (FROZEN->ACTIVE) / CLOSE (PROPOSED->CLOSED)"
    roles: [FinanceSteward]
    code: 200
    input: [action]
    output: Fund
    side_effects: ["fund.version += 1"]

  # ---- valuation runs ----
  - method: POST
    path: "/giving/valuation-runs"
    description: "Create a DRAFT actuarial valuation run (coverage window + valuation date + optional corpus_updates)"
    roles: [ComplianceOfficer]
    code: 201
    input: [coverage_start, coverage_end, valuation_date, "corpus_updates?"]
    output: ValuationRun
    side_effects: ["created_by_user_id := X-User-ID"]
  - method: GET
    path: "/giving/valuation-runs/{valuation_run_id}"
    description: "Read one valuation run (totals populated after POST)"
    roles: [GiftOfficer, GiftAdministrator, ComplianceOfficer, EstateManager, FinanceSteward]
    code: 200
    input: []
    output: ValuationRun
    side_effects: []
  - method: POST
    path: "/giving/valuation-runs/{valuation_run_id}/post"
    description: "Post a DRAFT run: SoD gate, closed-window overlap check vs POSTED runs, revalues all in-scope agreements (HOP 1-4 per ValuationRun state machine)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ValuationRun
    side_effects: ["agreement revaluation cascade (liability/remainder/CRUT annuity/payment amounts/schedule totals)", "ReserveFund targets/coverage/posture recomputed", "run.version += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers, or X-User-Role not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role authenticated but not listed in the endpoint's roles (incl. per-action role restrictions on transition endpoints)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor X-User-ID equals the SoD anchor: execute by illustration creator; valuation post by run creator; BEGIN_DISTRIBUTION by estate recorder" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body field does not resolve (left-to-right: path before body)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, unknown field, bad type, invalid enum member, valuation_date outside its coverage window, defer_until not in the future" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version != current parent version on amend / reserve adjustments" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from the resource's current state per §1.2 (covers terminal lockdown, skip-ahead, RESCIND after assets received, RETURN of funded assets)" }
  - { id: ERR_VALUATION_ALREADY_POSTED, http: 409, condition: "POST on a ValuationRun already POSTED" }
  - { id: ERR_PAYMENT_NOT_DUE, http: 409, condition: "PAY/DEFER on a payment not in DUE status" }
  - { id: ERR_AGREEMENT_SUSPENDED, http: 409, condition: "PAY attempted while parent agreement is SUSPENDED" }
  - { id: ERR_DONOR_STATE_MISMATCH, http: 409, condition: "Donor vital_status incompatible: creating illustration/agreement/booking/executing/enrolling for a DECEASED donor, or opening an estate for a LIVING donor" }
  - { id: ERR_REMAINDER_TEST_FAILED, http: 422, condition: "Execute: booked charitable deduction < 10% of gift_amount_cents (deduction*10 < gift)" }
  - { id: ERR_EXHAUSTION_TEST_FAILED, http: 422, condition: "Execute (CRT_ANNUITY): pv_of_annuity_cents > 85% of gift_amount_cents (reachable band: pv in (85%, 90%] passes remainder but fails exhaustion)" }
  - { id: ERR_DESIGNATION_NOT_VERIFIED, http: 409, condition: "Execute: no VERIFIED PRIMARY_1 BeneficiaryDesignation on file" }
  - { id: ERR_DOCUMENT_NOT_RECEIVED, http: 409, condition: "VERIFY attempted with document_received == false" }
  - { id: ERR_BEQUEST_VEHICLE_MISMATCH, http: 422, condition: "Vehicle/field inconsistency: BEQUEST carrying payout_rate_bps or payment schedule; annuity vehicle missing payout_rate_bps; lives=2 without annuitant_2_age" }
  - { id: ERR_PAYOUT_RATE_OUT_OF_RANGE, http: 422, condition: "payout_rate_bps outside [500, 5000] for annuity vehicles" }
  - { id: ERR_SLOT_OCCUPIED, http: 409, condition: "Second SUBMITTED BeneficiaryDesignation for the same (gift_agreement_id, slot)" }
  - { id: ERR_LEGACY_SOCIETY_INELIGIBLE, http: 422, condition: "ENROLL without a documented planned gift, or RECOGNIZE below LEGACY_THRESHOLD_CENTS" }
  - { id: ERR_FUND_ALREADY_EXISTS, http: 409, condition: "Second non-CLOSED Fund for the same gift_agreement_id" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "Rate-table half-open window intersects another DRAFT/ACTIVE table's window (adjacency allowed)" }
  - { id: ERR_RATE_TABLE_NOT_ACTIVE, http: 409, condition: "No ACTIVE rate table covers funding_month at creation/book, or the pinned table is not ACTIVE at EXECUTE" }
  - { id: ERR_VALUATION_WINDOW_OVERLAP, http: 409, condition: "Posting a ValuationRun whose closed coverage window intersects another POSTED run's closed window (shared boundary date counts)" }
  - { id: ERR_NO_ACTIVE_RATE_TABLE, http: 422, condition: "ValuationRun POST: no ACTIVE rate table covers valuation_date" }
  - { id: ERR_ASSET_ORPHAN, http: 422, condition: "GiftAsset created with neither or both of gift_agreement_id / estate_id" }
  - { id: ERR_MILESTONES_OPEN, http: 409, condition: "BEGIN_DISTRIBUTION while any linked ProbateMilestone is not CLOSED" }
  - { id: ERR_ASSETS_NOT_LIQUIDATED, http: 409, condition: "BEGIN_DISTRIBUTION while any linked GiftAsset is in PLEDGED/RECEIVED/APPRAISED" }
  - { id: ERR_ASSET_KIND_REQUIRES_APPRAISAL, http: 409, condition: "LIQUIDATE on REAL_ESTATE that has not been APPRAISED" }
  - { id: ERR_RESERVE_DEFICIENT, http: 409, condition: "CGA EXECUTE would push projected reserve requirement above balance" }
  - { id: ERR_INSUFFICIENT_RESERVE_BALANCE, http: 422, condition: "WITHDRAWAL or CGA termination surrender exceeds ReserveFund.balance_cents" }
  - { id: ERR_DISTRIBUTION_OVERFLOW, http: 422, condition: "BEGIN_DISTRIBUTION: administration_costs_cents + specific_bequests_cents > gross_proceeds_cents" }
  - { id: ERR_FUND_MINIMUM_NOT_MET, http: 409, condition: "Fund ACTIVATE with balance_cents < minimum_endowment_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GiftOfficer
    description: "Front-line gift planner: models illustrations, drafts agreements, tracks designation paperwork, stewards legacy society"
    identity: opaque
    exclusive_operations:
      - "POST /giving/donors"
      - "POST /giving/donors/{id}/legacy-society-transition"
      - "POST /giving/illustrations (+book)"
      - "POST /giving/gift-agreements"
      - "POST /giving/beneficiary-designations (+SUBMIT)"
    shared_operations: ["all GET list/read endpoints", "POST /giving/_clock/set_current_utc"]
  - name: GiftAdministrator
    description: "Gift administration: executes/amends/terminates agreements, verifies designations, generates schedules, disburses payments"
    identity: opaque
    exclusive_operations:
      - "POST /giving/gift-agreements/{id}/amend|execute|terminate"
      - "POST /giving/gift-agreements/{id}/transition WITHDRAW|RESCIND"
      - "POST /giving/gift-agreements/{id}/generate-payment-schedule"
      - "POST /giving/beneficiary-designations/{id}/transition VERIFY|REJECT|REVOKE"
      - "POST /giving/annuity-payments/{id}/transition"
    shared_operations: ["all GET list/read endpoints", "POST /giving/_clock/set_current_utc"]
  - name: ComplianceOfficer
    description: "Compliance & actuarial: rate tables, valuation runs, reserve adjustments, agreement suspension"
    identity: opaque
    exclusive_operations:
      - "POST /giving/rate-tables (+transition)"
      - "POST /giving/valuation-runs (+post)"
      - "POST /giving/reserve-fund/adjustments"
      - "POST /giving/gift-agreements/{id}/transition SUSPEND|RESUME"
    shared_operations: ["all GET list/read endpoints", "POST /giving/_clock/set_current_utc"]
  - name: EstateManager
    description: "Gift administration operations: death recording, estates, probate milestones, asset receipt/liquidation"
    identity: opaque
    exclusive_operations:
      - "POST /giving/donors/{id}/record-death"
      - "POST /giving/estates (+transition)"
