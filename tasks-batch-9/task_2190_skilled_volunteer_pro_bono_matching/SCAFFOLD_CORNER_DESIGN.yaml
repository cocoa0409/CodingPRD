            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /scope-definitions/scope-nope/deliverables", as: ScopingSpecialist, as_user_id: "spec-1", payload: {title: "Phantom deliverable", sequence_no: 1, weight_pct: 250.00, hours_estimate: 10.00, acceptance_criteria: "n/a"}, captures: {err: "$.data.error_id"}}
          assert:
