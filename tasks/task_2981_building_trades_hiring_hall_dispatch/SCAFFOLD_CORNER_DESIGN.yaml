            - "HTTP 409 with ${err_no_dispatch} == ERR_REMEDY_NOT_APPLICABLE — there is no Dispatch to make whole against"
            - "HTTP 409 with ${err_denied_remedy} == ERR_REMEDY_NOT_APPLICABLE — a denial cannot carry NEXT_AVAILABLE_PRIORITY"
            - "The third call returns 200 with ${ok_status} == DENIED, ${ok_remedy} == NONE, ${ok_variant} == NOT_APPLICABLE, ${ok_hours} == 0, ${ok_cents} == 0 and ${ok_decided_by} == bm-09"
      - name: second_active_registration_is_refused_on_every_list
