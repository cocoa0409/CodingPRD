            - call: "POST /warewashing/machine-placements/${pl_1}/retrieval-order"
              payload: {}
              as: AccountManager
              captures: { st_1: $.data.placement_status, op_1: $.data.operational_status }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v2: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v2}" }
              as: AccountManager
