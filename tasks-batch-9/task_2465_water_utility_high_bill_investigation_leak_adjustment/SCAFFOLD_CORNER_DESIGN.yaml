        claim_type: parallel
        grounds:
          - state_machines.ServiceAccount
        excluded_because:
          difficulty_instance: non_linear_parallel_service_and_credit_dimensions_move_independently
          rationale: |
            That difficulty instance walks the service_status and credit_status dimensions of
            ServiceAccount through a sequence where each moves while the other holds, and asserts
            every intermediate combined state, which is exactly the parallel-shape claim.

      - name: corner_state_branching_bench_result_forks
        claim_type: branching
        grounds:
          - state_machines.MeterTestRequest
        excluded_because:
          difficulty_instance: non_linear_branching_bench_result_three_terminals_diverge
          rationale: |
            That difficulty instance runs the same bench-test fork into all three terminals
            CLOSED_PASS, CLOSED_SLOW and CLOSED_FAST on parallel fixtures and contrasts their
            divergent side-effect sets, covering the fork-paths claim for this shape.

      - name: corner_state_guarded_transition_determine_requires_closed_meter_test
        claim_type: guarded transitions
        grounds:
          - state_machines.HighBillInvestigation
        excluded_because:
          difficulty_instance: cross_entity_investigation_meter_error_determination_gated_by_test_closure
          rationale: |
            That difficulty instance shows determine with METER_ERROR refused while the
            MeterTestRequest is still BENCH_TEST_PENDING and accepted once it reaches CLOSED_FAST,
            which is the "A->B only if entity C in state X" guarded-transition claim.

      - name: corner_state_cascade_down_adjustment_approval_chain
        claim_type: cascade down
        grounds:
          - state_machines.LeakAdjustment
        excluded_because:
          difficulty_instance: transitive_cascade_approve_adjustment_ledger_to_balance_to_credit_to_service
          rationale: |
            That difficulty instance verifies the four-level chain from adjustment approval down
            through ledger, balance, credit_status and service_status, asserting every level, which
            subsumes the cascade-down claim.

      - name: corner_state_compensation_adjustment_reversal_undoes_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.LeakAdjustment
        excluded_because:
          difficulty_instance: compensating_invariant_receivable_balance_restored_after_adjustment_reversal
          rationale: |
            That difficulty instance reverses a POSTED adjustment and asserts that the credit and
            the admin fee are both undone with the balance restored to its pre-approval value and no
            drift, which is precisely the compensation claim.

  # ===========================================================================
  # Guide section 3 — Calculations
