  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_matrix
        claim_type: violation_to_error
        grounds: ["errors[ERR_CARRIER_NOT_FOUND]", "errors[ERR_JOB_NOT_FOUND]", "errors[ERR_LEG_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_SURVEY_NOT_FOUND]", "errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_DELAY_EVENT_NOT_FOUND]", "errors[ERR_INCIDENT_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_ESCORT_NOT_FOUND]"]
        distinguishing_aspect: "Every 404 in the catalog is triggerable: path ids are validated left-to-right, and body-referenced FKs (carrier_id on job create, escort_id on assignment create) 404 identically."
        test_recipe:
          setup: ["Carrier + booked TX job with a DETERMINED leg (for the body-FK escort lookup)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "NF Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
