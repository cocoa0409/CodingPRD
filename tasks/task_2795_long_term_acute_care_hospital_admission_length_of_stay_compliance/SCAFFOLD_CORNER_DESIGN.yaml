            - "det2_reason is the supplied text and det1_status2 == VOIDED with det1_void == SUPERSEDED"
            - "stay513_pct2 == 100.00 and stay513_v2 > stay513_v1 - the stay tracks the newest DRAFT"
            - "The override-free re-price falls back to the referral's rate: det3_code == 207, det3_sso == true, det3_total == 1512000 and det3_pct == 25.20"
            - "det2_status2 == VOIDED with det2_void == SUPERSEDED, so exactly one DRAFT determination exists at every point (GET with status DRAFT returns 1 item)"

  - section: errors
    instances:
      - name: every_path_id_not_found_code_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations.priority_3
          - errors.ERR_HOSPITAL_NOT_FOUND
          - errors.ERR_PATIENT_NOT_FOUND
          - errors.ERR_CRITERIA_SET_NOT_FOUND
          - errors.ERR_PERIOD_NOT_FOUND
          - errors.ERR_REFERRAL_NOT_FOUND
          - errors.ERR_STAY_NOT_FOUND
          - errors.ERR_WEANING_PLAN_NOT_FOUND
          - errors.ERR_INTERRUPTION_NOT_FOUND
          - errors.ERR_DETERMINATION_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_QUERY_NOT_FOUND
          - errors.ERR_PHYSICIAN_NOT_FOUND
        distinguishing_aspect: "Twelve entity-specific 404 codes must be distinguishable from each other: the same syntactically valid but unknown UUID is fed to one endpoint per entity and each must answer with its own code, never a generic ERR_VALIDATION or a bare 500. Physician has no GET, so its code is reached through the credential-status action."
        test_recipe:
          setup:
            - "A clean system at the default clock 2026-08-01T00:00:00Z; no rows of any kind are created."
            - "The probe id 00000000-0000-4000-8000-0000000000ff is a well-formed UUID that belongs to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /ltch/referring-hospitals/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_hospital: $.data.error_id }
            - call: "GET /ltch/patients/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_patient: $.data.error_id }
            - call: "GET /ltch/admission-criteria-sets/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_criteria: $.data.error_id }
            - call: "GET /ltch/cost-reporting-periods/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_period: $.data.error_id }
            - call: "GET /ltch/referrals/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_referral: $.data.error_id }
            - call: "GET /ltch/stays/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: UtilizationReviewNurse
              captures: { e_stay: $.data.error_id }
            - call: "GET /ltch/weaning-plans/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: UtilizationReviewNurse
              captures: { e_plan: $.data.error_id }
            - call: "POST /ltch/interruptions/00000000-0000-4000-8000-0000000000ff/return"
              payload: {}
              as: UtilizationReviewNurse
              captures: { e_interruption: $.data.error_id }
            - call: "GET /ltch/payment-determinations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_determination: $.data.error_id }
            - call: "GET /ltch/denial-risk-reviews/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_review: $.data.error_id }
            - call: "GET /ltch/documentation-queries/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_query: $.data.error_id }
            - call: "POST /ltch/physicians/00000000-0000-4000-8000-0000000000ff/credential-status"
              payload: { credential_status: "SUSPENDED" }
              as: ComplianceOfficer
              captures: { e_physician: $.data.error_id }
          assert:
            - "e_hospital == ERR_HOSPITAL_NOT_FOUND, e_patient == ERR_PATIENT_NOT_FOUND, e_criteria == ERR_CRITERIA_SET_NOT_FOUND, e_period == ERR_PERIOD_NOT_FOUND"
            - "e_referral == ERR_REFERRAL_NOT_FOUND, e_stay == ERR_STAY_NOT_FOUND, e_plan == ERR_WEANING_PLAN_NOT_FOUND, e_interruption == ERR_INTERRUPTION_NOT_FOUND"
            - "e_determination == ERR_DETERMINATION_NOT_FOUND, e_review == ERR_REVIEW_NOT_FOUND, e_query == ERR_QUERY_NOT_FOUND, e_physician == ERR_PHYSICIAN_NOT_FOUND"
            - "Every one of the twelve responses carries HTTP 404 and a non-empty message"
            - "All twelve codes are distinct - no endpoint borrows another entity's code"

      - name: body_foreign_keys_report_their_own_not_found_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_4
          - errors.ERR_PATIENT_NOT_FOUND
          - errors.ERR_HOSPITAL_NOT_FOUND
          - errors.ERR_DRG_RATE_NOT_FOUND
        distinguishing_aspect: "Foreign keys carried in the body get the same treatment as path ids and are checked before the optimistic-concurrency comparison, so a referral naming an unknown patient returns ERR_PATIENT_NOT_FOUND even though the accompanying expected_patient_version belongs to a different (real) patient - and the override_drg_rate_id on a re-price is checked the same way."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207, hospital Metro General, patient Dot Fk."
            - "Dot Fk is admitted 2026-08-01 and discharged HOME at clock 2026-08-15 with estimated_cost_cents 1,000,000, so a DRAFT determination exists and the stay version can be read."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-520", full_name: "Dot Fk", birth_date: "1979-12-11", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat520_id: $.data.id, pat520_v0: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat520_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat520_v0}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref520_id: $.data.id }
            - call: "POST /ltch/referrals/${ref520_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref520_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay520_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ltch/stays/${stay520_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 1000000 }
              as: UtilizationReviewNurse
              captures: { stay520_v: $.data.version }
            - call: "GET /ltch/patients/${pat520_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { pat520_v1: $.data.version }
          trigger:
            - call: "POST /ltch/referrals"
              payload: { patient_id: "00000000-0000-4000-8000-0000000000ff", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat520_v1}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { e_patient: $.data.error_id }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat520_id}", referring_hospital_id: "00000000-0000-4000-8000-0000000000ff", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat520_v1}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { e_hospital: $.data.error_id }
            - call: "POST /ltch/stays/${stay520_id}/payment-determinations"
              payload: { expected_stay_version: "${stay520_v}", recalculation_reason: "Coding audit.", override_drg_rate_id: "00000000-0000-4000-8000-0000000000ff" }
              as: RevenueIntegrityAnalyst
              captures: { e_drg: $.data.error_id }
          assert:
