            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - { call: "POST /api/cure-tests/${t1}/accept", payload: {}, as: QAManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot_id}/release", payload: {}, as: BatchOperator, captures: { err: $.data.error_id } }
          assert:
            - "http 403; ${err} == ERR_INSUFFICIENT_PERMISSIONS"
            - "ProductionLot.${lot_id}.qa_status == UNDER_REVIEW (unchanged)"

      - name: qa_technician_cannot_accept_test
