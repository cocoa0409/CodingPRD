              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/injury-reports"
              payload: { injury_type: "SPLASH", injury_datetime: "2026-07-30T10:00:00Z", exposure_case_id: "${case_id}" }
              as: SafetyOfficer
              captures: { inj_id: $.data.id, rec_before: $.data.osha_recordable }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
          trigger:
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-01T12:00:00Z" }
              as: EmployeeHealthPhysician
            - call: "GET /employee-health/injury-reports/${inj_id}"
              as: SafetyOfficer
              captures: { rec_after: $.data.osha_recordable }
          assert:
            - "${rec_before} == false (SPLASH, MEDIUM case, no PEP started)"
            - "${rec_after} == true (recomputed on PEP STARTED linkage event)"

