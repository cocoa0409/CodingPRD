      - name: redundant_promotion_on_a_recurring_order_returns_the_stacking_error
        claim_type: Violation to Error
        grounds:
          - errors.ERR_PROMO_STACKING_NOT_ALLOWED
          - validations[priority=23]
          - calculations.autoship_promo_reconciliation
        distinguishing_aspect: "Supplying a promotion against an item that already carries a nonzero autoship discount is refused by name rather than silently ignored, so the reconciliation guard is observable through its own error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan whose first order already composed, leaving a nonzero recurring discount on the next one."
