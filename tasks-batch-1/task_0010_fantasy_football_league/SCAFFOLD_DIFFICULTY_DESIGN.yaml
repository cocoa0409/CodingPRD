  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: waiver_won_drains_faab_invalidates_pending_claims_depth3
        grounds:
          - state_machines.WaiverClaim.SUBMITTED_to_WON
          - state_machines.WaiverClaim.SUBMITTED_to_INVALID
          - state_machines.League.IN_SEASON_to_IN_SEASON
          - calculations.waiver_priority_resolution
          - entities.Team.fields.faab_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /leagues/{id}/advance-week:
          (link 1) batch starts → highest-bid claim on player_X transitions SUBMITTED→WON →
          (link 2) Team_A.faab_balance_cents debited by bid_cents, reaches 0 (caused by link 1) →
          (link 3) all OTHER same-team SUBMITTED claims for this team in the same processing_week
          auto-INVALIDATE (caused by link 2's balance==0). Each link is caused by the previous one,
          not by advance-week directly. Different originating trigger from Rule-4 instance B.
