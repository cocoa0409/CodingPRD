scaffold_corner_design:

  # =======================================================================
  # ENTITIES
  # =======================================================================
  - section: entities
    instances:

      - name: client_creation_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Client.fields.client_type
          - entities.Client.fields.status
          - entities.Client.fields.account_credit_cents
        distinguishing_aspect: "POST /clients without client_type yields client_type INDIVIDUAL, status ACTIVE, account_credit_cents 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { display_name: "Minimal Client", email: "min@example.com", phone: "555-0300", home_zone_code: "ZONE_C" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Client.${cl_id}.client_type == INDIVIDUAL"
            - "Client.${cl_id}.status == ACTIVE"
            - "Client.${cl_id}.account_credit_cents == 0"
            - "Client.${cl_id}.version == 1"
            - "Client.${cl_id}.id is a bare UUID with no type prefix"

      - name: instrument_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_INSTRUMENT_NOT_FOUND]
          - validations[priority=11]
        distinguishing_aspect: "GET /instruments/{id} with a well-formed but unknown UUID returns 404 ERR_INSTRUMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /instruments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_INSTRUMENT_NOT_FOUND"

      - name: location_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[POST /locations]
        distinguishing_aspect: "POST /locations without zone_code returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["One client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Req Client", email: "req@example.com", phone: "555-0301", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "No Zone", address_key: "no-zone", distance_miles_from_shop: 5.0 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
            - "GET /locations with client_id=${cl_id} returns 0 rows"

      - name: location_create_with_invalid_zone_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "zone_code ZONE_Z is not a declared member, so POST /locations returns 400 ERR_INVALID_ENUM rather than ERR_VALIDATION."
        test_recipe:
          setup: ["One client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Enum Client", email: "enum@example.com", phone: "555-0302", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Bad Zone", zone_code: "ZONE_Z", address_key: "bad-zone", distance_miles_from_shop: 5.0 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_ENUM"

      - name: location_stair_flights_above_eight_returns_value_out_of_range
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_VALUE_OUT_OF_RANGE]
          - entities.Location.fields.stair_flights
        distinguishing_aspect: "stair_flights 9 exceeds MAX_STAIR_FLIGHTS_PER_LOCATION (8), so POST /locations returns 400 ERR_VALUE_OUT_OF_RANGE; 8 itself is accepted."
        test_recipe:
          setup: ["One client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Range Client", email: "range@example.com", phone: "555-0303", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Too Many Stairs", zone_code: "ZONE_A", address_key: "tall-tower", distance_miles_from_shop: 5.0, stair_flights: 9 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_VALUE_OUT_OF_RANGE"
            - "the same call with stair_flights 8 succeeds with HTTP 201"

      - name: instrument_duplicate_serial_number_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_SERIAL_NUMBER]
          - entities.Instrument.fields.serial_number
        distinguishing_aspect: "A second instrument carrying an existing serial_number returns 409 ERR_DUPLICATE_SERIAL_NUMBER."
        test_recipe:
          setup: ["One client with one location and one instrument with serial_number SN-C6-0001."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Dup Client", email: "dup@example.com", phone: "555-0304", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Home", zone_code: "ZONE_A", address_key: "dup-home", distance_miles_from_shop: 5.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C6-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C6-0001", instrument_class: "CONSOLE", usage_tier: "HOME" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_SERIAL_NUMBER"
            - "GET /instruments with client_id=${cl_id} still returns exactly 1 row"

      - name: instrument_at_another_clients_location_returns_ownership_mismatch
        claim_type: Parent Relationships
        grounds:
          - validations[priority=17]
          - errors[ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "An instrument may not be sited at a Location whose client_id differs from the instrument's client_id."
        test_recipe:
          setup: ["Two clients, each with their own ZONE_A location."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Owner One", email: "own1@example.com", phone: "555-0305", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl1: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Owner Two", email: "own2@example.com", phone: "555-0306", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl2: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl2}", label: "Two Home", zone_code: "ZONE_A", address_key: "two-home", distance_miles_from_shop: 5.0 }
              as: ShopManager
              captures: { loc2: "$.data.id" }
          trigger:
            - call: "POST /instruments"
              payload: { client_id: "${cl1}", current_location_id: "${loc2}", make: "Kawai", model: "K200", serial_number: "SN-C7-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_OWNERSHIP_MISMATCH"

      - name: route_day_capacity_defaults_from_technician
        claim_type: Defaults
        grounds:
          - entities.RouteDay.fields.capacity_minutes
          - entities.Technician.fields.daily_capacity_minutes
          - endpoints[POST /route-days]
        distinguishing_aspect: "Omitting capacity_minutes copies the technician's daily_capacity_minutes (600 here), not the global 480 default."
        test_recipe:
          setup: ["One technician with daily_capacity_minutes 600."]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { display_name: "Long Day", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"], daily_capacity_minutes: 600 }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
          trigger:
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-12" }
              as: ShopManager
              captures: { rd_id: "$.data.id" }
          assert:
            - "RouteDay.${rd_id}.capacity_minutes == 600"
            - "RouteDay.${rd_id}.committed_minutes == 0 and stop_count == 0"
            - "RouteDay.${rd_id}.status == OPEN"

      - name: climate_reading_is_append_only_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ClimateReading.common_fields
          - entities.ClimateReading.fields.in_band
        distinguishing_aspect: "ClimateReading declares common_fields false, so its response carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["One client with one location."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Imm Client", email: "imm@example.com", phone: "555-0307", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "imm-room", distance_miles_from_shop: 2.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
          trigger:
            - call: "POST /climate-readings"
              payload: { location_id: "${loc_id}", recorded_at_utc: "2026-04-10T08:00:00Z", relative_humidity_pct: 35.0, temperature_f: 66.0 }
              as: ShopManager
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "the response data carries id and created_at but neither version nor updated_at"
            - "ClimateReading.${r_id}.in_band == true because 35.0 sits exactly on the inclusive lower band bound"
            - "Location.${loc_id}.out_of_band_flag == false because only 1 reading is in the window, below CLIMATE_MIN_READINGS_FOR_EVALUATION"

      - name: instrument_list_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /instruments]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /instruments with limit 2 and offset 0 over 3 instruments returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup: ["One client with one location and three instruments."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Page Client", email: "page@example.com", phone: "555-0308", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "page-room", distance_miles_from_shop: 2.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "A", model: "1", serial_number: "SN-C10-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "B", model: "2", serial_number: "SN-C10-0002", instrument_class: "CONSOLE", usage_tier: "HOME" }
              as: ShopManager
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "C", model: "3", serial_number: "SN-C10-0003", instrument_class: "GRAND", usage_tier: "HOME" }
              as: ShopManager
          trigger:
            - call: "GET /instruments"
              payload: { client_id: "${cl_id}", limit: 2, offset: 0 }
              as: ShopManager
          assert:
            - "the response returns exactly 2 rows"
            - "meta pagination reports total_count 3 and has_more true"
            - "the same call with offset 2 returns 1 row and has_more false"

      - name: pagination_limit_above_hundred_returns_invalid_pagination
        claim_type: Listing
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100, so GET /clients returns 400 ERR_INVALID_PAGINATION; limit 100 is accepted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients"
              payload: { limit: 101, offset: 0 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "the same call with limit 100 returns HTTP 200"

  # =======================================================================
  # STATE MACHINES
  # =======================================================================
  - section: state_machines
    instances:

      - name: quote_decline_twice_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Quote.status.ISSUED_to_DECLINED
          - validations[priority=21]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "DECLINED is terminal for Quote, so a second decline returns 409 ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE."
        test_recipe:
          setup: ["One client, one location, one UPRIGHT instrument assessed at TIER_0, one ISSUED TUNE quote that has been declined once."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Decline Client", email: "dec@example.com", phone: "555-0310", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "dec-room", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C11-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/decline"
              payload: { reason: "too expensive" }
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /quotes/${q_id}/decline"
              payload: { reason: "again" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_ALREADY_TERMINAL"
            - "Quote.${q_id}.status == DECLINED"

      - name: tuning_recall_notify_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.TuningRecall.status.PENDING_to_NOTIFIED
          - validations[priority=23]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "NOTIFIED is not terminal, so a repeat notify returns ERR_INVALID_STATE (409), distinguishing it from the ERR_ALREADY_TERMINAL path."
        test_recipe:
          setup: ["One HOME-tier UPRIGHT instrument at an uncontrolled ZONE_A location with one PENDING recall that has already been notified once."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Recall Client", email: "rec@example.com", phone: "555-0311", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "rec-room", distance_miles_from_shop: 3.0, climate_controlled: false }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C12-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /tuning-recalls"
              payload: { instrument_id: "${inst_id}", cycle_start_date: "2026-01-15" }
              as: ShopManager
              captures: { tr_id: "$.data.id" }
            - call: "POST /tuning-recalls/${tr_id}/notify"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /tuning-recalls/${tr_id}/notify"
              payload: {}
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "TuningRecall.${tr_id}.status == NOTIFIED"
            - "TuningRecall.${tr_id}.interval_days == 136 (floor(182 * 0.75) with a 0 class adjustment for UPRIGHT)"
            - "TuningRecall.${tr_id}.due_date == 2026-05-31"

      - name: route_day_unlock_returns_it_to_open_for_booking
        claim_type: cyclic
        grounds:
          - state_machines.RouteDay.status.OPEN_to_LOCKED
          - state_machines.RouteDay.status.LOCKED_to_OPEN
        distinguishing_aspect: "LOCKED returns to OPEN on a second status transition, so the route-day axis is genuinely cyclic and the version advances on every hop."
        test_recipe:
          setup: ["The clock has been moved to 2026-05-03T14:00:00Z so the 2026-05-04 route day is inside the 12-hour lock lead."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { display_name: "Tech C13", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04" }
              as: ShopManager
              captures: { rd_id: "$.data.id" }
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "LOCKED" }
              as: ShopManager
          trigger:
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "OPEN" }
              as: ShopManager
          assert:
            - "RouteDay.${rd_id}.status == OPEN"
            - "RouteDay.${rd_id}.version is 3 after create, lock and unlock"

      - name: service_order_complete_with_unaccepted_milestone_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=26]
          - state_machines.ServiceOrder.status.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A two-milestone VOICE order whose second milestone is still READY cannot be completed; the order stays IN_PROGRESS and no Warranty row appears."
        test_recipe:
          setup:
            - "One funded client, one UPRIGHT instrument at SERVICEABLE, a VOICE order IN_PROGRESS with milestone 1 ACCEPTED and milestone 2 still READY."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Halfway Hall", email: "half@example.com", phone: "555-0313", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "half-room", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U3", serial_number: "SN-C14-0001", instrument_class: "UPRIGHT", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech J14c", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 200000, memo: "funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "ok" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id", ms2_id: "$.data[1].id" }
            - call: "POST /milestones/${ms1_id}/release"
              payload: {}
              as: ShopManager
              as_user_id: "mgr-c14"
            - call: "POST /milestones/${ms1_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /service-orders/${so_id}/complete"
              payload: {}
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE"
            - "ServiceOrder.${so_id}.status == IN_PROGRESS"
            - "ServiceOrder.${so_id}.billed_cents == 21000 and unbilled_cents == 21000"
            - "ServiceOrder.${so_id}.deposit_applied_cents == 21000 (the 25000 deposit covered the whole milestone, so no MILESTONE_CHARGE row was appended)"
            - "GET /warranties with service_order_id=${so_id} returns 0 rows"

      - name: quote_reissue_mints_a_new_row_and_supersedes_the_original
        claim_type: Valid Transition
        grounds:
          - state_machines.Quote.status.ISSUED_to_SUPERSEDED
          - entities.Quote.fields.version_number
          - entities.Quote.fields.supersedes_quote_id
          - endpoints[POST /quotes/{id}/reissue]
        distinguishing_aspect: "Re-issue never mutates the original back to ISSUED: the original becomes SUPERSEDED and a NEW DRAFT row appears with version_number 2 and supersedes_quote_id pointing at it."
