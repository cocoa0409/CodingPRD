          - endpoints[POST /cpc-reports/{cpc_report_id}/audit-decision]
        distinguishing_aspect: "The reviewer who drew the sample is refused the decision on a report of that sample with 403 ERR_SEGREGATION_OF_DUTIES, while a second BoardReviewer decides it successfully and the bubble-up closes the cycle in that same response."
