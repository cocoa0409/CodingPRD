# =============================================================================
# Scaffold: task_0462_climbing_gym_belay
# Climbing Gym Membership & Belay Certification
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  462. Climbing Gym Membership & Belay Certification: membership/day-pass & waiver,
  belay/lead certification test & badge, route-setting & grade log, capacity/check-in,
  youth team & clinic, gear rental, recurring billing & freeze, incident/injury report

domain_name: climbing-gym-belay
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # waiver + certification gating, incident audit trail
  secondary_archetype: quota_allocation        # gym-floor live capacity at check-in
  complexity_layers:
    - optimistic_concurrency                   # OCC on Facility.version at check-in (true CREATE-with-supersede race)
    - cascading_side_effects                   # incident/expiry/freeze cascades across 3+ entities
    - dual_variant_calculation                 # provisional vs final deposit settlement; prorate vs full
    - rate_threshold_triggers                  # past-due grace window, certification expiry, late-fee tiers

  entity_topology: flat                        # peer entities linked by FK; no nested URL ownership chains
  state_machine_shape: parallel                # Membership carries billing_status × access_status; plus cyclic + branching machines
  relationship_patterns:
    - one_to_many                              # Member -> Membership/CheckIn/Rental/Incident; Facility -> CheckIn/Route
    - cross_aggregate                          # CheckIn references Member + Facility + Waiver + Certification

  role_model: peer_roles                       # FrontDesk / Examiner / RouteSetter / GymAdmin own distinct surfaces; Member is entity-backed
  consistency_model: immediate                 # all changes atomic within a single request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Member" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date; drives is_youth derivation" }
      - { name: is_youth, type: boolean, source: computed, description: "True when age < 18 at created_at (age in completed years vs created_at date)" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Non-negative store credit from freeze proration and deposit refunds; spent before card on next charge", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACTIVATED", default: "ACTIVE", constraints: "ACTIVE, DEACTIVATED" }

  # ---------------------------------------------------------------------------
  - name: Waiver
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the signer" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant at signing" }
      - { name: expires_at, type: datetime, source: computed, description: "signed_at + WAIVER_VALID_DAYS (365); waiver invalid once clock >= expires_at" }
      - { name: minor_guardian_name, type: string, source: input, description: "Guardian name; required when signer is_youth, else must be omitted/null" }
      - { name: status, type: enum, source: computed, description: "VALID while clock < expires_at, else EXPIRED", constraints: "VALID, EXPIRED" }

  # ---------------------------------------------------------------------------
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of this membership" }
      - { name: plan_tier, type: enum, source: input, description: "BASIC | YOUTH_TEAM; sets monthly_fee_cents", constraints: "BASIC, YOUTH_TEAM" }
      - { name: monthly_fee_cents, type: integer, source: system, description: "Plan fee: BASIC=9000, YOUTH_TEAM=6000; set at create from plan_tier" }
      - { name: cycle_start, type: datetime, source: system, description: "Start instant of the current billing cycle" }
      - { name: cycle_end, type: datetime, source: computed, description: "cycle_start + CYCLE_DAYS (30); next charge due at this instant" }
      - { name: billing_status, type: enum, source: system, description: "Independent billing axis", default: "CURRENT", constraints: "CURRENT, PAST_DUE, CANCELLED" }
      - { name: access_status, type: enum, source: system, description: "Independent access axis", default: "ACTIVE", constraints: "ACTIVE, FROZEN, SUSPENDED, TERMINATED" }
      - { name: past_due_since, type: datetime, source: system, description: "Clock instant the membership entered PAST_DUE; null when CURRENT" }
      - { name: frozen_at, type: datetime, source: system, description: "Clock instant the membership was frozen; null when not FROZEN" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the candidate" }
      - { name: discipline, type: enum, source: input, description: "BELAY | LEAD; LEAD requires an active BELAY cert on same member", constraints: "BELAY, LEAD" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the badge", default: "REGISTERED", constraints: "REGISTERED, PASSED, FAILED, EXPIRED, REVOKED" }
      - { name: weighted_score, type: number, source: computed, description: "Weighted station score from the grading; null until graded" }
      - { name: min_station_score, type: integer, source: computed, description: "Lowest single station score from the grading; null until graded" }
      - { name: passed_at, type: datetime, source: system, description: "Clock instant the badge was awarded; null unless PASSED" }
      - { name: expires_at, type: datetime, source: computed, description: "passed_at + CERT_VALID_DAYS (365); badge EXPIRED once clock >= expires_at" }
      - { name: examiner_user_id, type: string, source: system, description: "Opaque X-User-ID of the Examiner who graded; null until graded" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Bouldering area / wall name" }
      - { name: floor_capacity, type: integer, source: input, description: "Maximum simultaneous climbers on the floor", constraints: ">= 1" }
      - { name: occupancy, type: integer, source: computed, description: "Count of CheckIn rows on this facility with status=ON_FLOOR" }
      - { name: requires_belay_cert, type: boolean, source: input, description: "When true, check-in requires an active BELAY (or LEAD) certification", default: false }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1; bumped on every check-in/check-out" }

  # ---------------------------------------------------------------------------
  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; wall this route lives on" }
      - { name: setter_user_id, type: string, source: input, description: "Opaque X-User-ID of the RouteSetter who set it" }
      - { name: grade, type: integer, source: input, description: "V-scale grade 0..10", constraints: "0 <= grade <= 10" }
      - { name: style, type: enum, source: input, description: "SLAB | OVERHANG | ROOF; sets style_multiplier", constraints: "SLAB, OVERHANG, ROOF" }
      - { name: difficulty_points, type: integer, source: computed, description: "round_half_up((100 + grade*50) * style_multiplier)" }
      - { name: status, type: enum, source: system, description: "OPEN climbable, STRIPPED retired", default: "OPEN", constraints: "OPEN, STRIPPED" }
      - { name: set_on, type: datetime, source: system, description: "Clock instant the route was logged; drives monthly setter aggregation window" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: CheckIn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; climber checking in" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; wall being entered" }
      - { name: entry_kind, type: enum, source: input, description: "MEMBERSHIP uses an ACTIVE membership; DAY_PASS pays a one-off fee", constraints: "MEMBERSHIP, DAY_PASS" }
      - { name: gear_bundle, type: boolean, source: input, description: "DAY_PASS only: bundle harness+shoes for GEAR_BUNDLE_CENTS", default: false }
      - { name: price_cents, type: integer, source: computed, description: "0 for MEMBERSHIP; day-pass price for DAY_PASS (see day_pass_price calc)" }
      - { name: status, type: enum, source: system, description: "ON_FLOOR while climbing, CHECKED_OUT when departed", default: "ON_FLOOR", constraints: "ON_FLOOR, CHECKED_OUT" }
      - { name: checked_in_at, type: datetime, source: system, description: "Clock instant of entry" }
      - { name: checked_out_at, type: datetime, source: system, description: "Clock instant of departure; null while ON_FLOOR" }

  # ---------------------------------------------------------------------------
  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: title, type: string, source: input, description: "Youth team / skills clinic name" }
      - { name: starts_at, type: datetime, source: input, description: "Session start instant" }
      - { name: ends_at, type: datetime, source: input, description: "Session end instant; must be > starts_at" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum enrolments", constraints: ">= 1" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollment rows with status=ENROLLED on this clinic" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED, CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1; bumped on enroll/cancel-enroll" }

  # ---------------------------------------------------------------------------
  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; session enrolled into" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrollee" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WITHDRAWN", default: "ENROLLED", constraints: "ENROLLED, WITHDRAWN" }

  # ---------------------------------------------------------------------------
  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; renter" }
      - { name: item_kind, type: enum, source: input, description: "HARNESS | SHOES | ROPE; informational", constraints: "HARNESS, SHOES, ROPE" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable deposit collected at checkout", constraints: ">= 0" }
      - { name: rented_at, type: datetime, source: system, description: "Clock instant of checkout" }
      - { name: due_at, type: datetime, source: computed, description: "rented_at + RENTAL_DUE_HOURS (24)" }
      - { name: returned_at, type: datetime, source: system, description: "Clock instant of return; null while OUT" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Computed at return from hours-late tiers, capped at deposit_cents; 0 until returned" }
      - { name: refund_cents, type: integer, source: computed, description: "deposit_cents - late_fee_cents at return; 0 until returned" }
      - { name: status, type: enum, source: system, description: "OUT | RETURNED | LOST", default: "OUT", constraints: "OUT, RETURNED, LOST" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; injured/involved party" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; where it occurred" }
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id; belay cert implicated (null when none)" }
      - { name: severity, type: enum, source: input, description: "MINOR | SERIOUS; SERIOUS triggers cert revoke + membership suspend cascade", constraints: "MINOR, SERIOUS" }
      - { name: description, type: string, source: input, description: "Free-text report body" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED", default: "OPEN", constraints: "OPEN, RESOLVED" }
      - { name: reported_at, type: datetime, source: system, description: "Clock instant the report was filed" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------- Membership: PARALLEL dimensions (billing_status × access_status) ----------
  - entity: Membership
    field: billing_status
    initial_state: CURRENT
    terminal_states: [CANCELLED]
    note: "Billing axis evolves independently of the access axis on the same row (Rule 3: parallel dimensions)."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /memberships/{id}/run-billing with outcome=FAILED (charge attempt failed)"
        actor: FrontDesk
        preconditions:
          - "Membership.billing_status == CURRENT"
          - "clock >= cycle_end (cycle is due)"
        side_effects:
          - "Sets past_due_since = clock"
          - "Does NOT change access_status (still ACTIVE during grace)"
          - "Increments Membership.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /memberships/{id}/run-billing with outcome=SUCCEEDED (back-payment)"
        actor: FrontDesk
        preconditions:
          - "Membership.billing_status == PAST_DUE"
        side_effects:
          - "Clears past_due_since to null"
          - "Advances cycle_start = clock; recomputes cycle_end (Rule 3: cyclic billing loop CURRENT->PAST_DUE->CURRENT)"
          - "If access_status == SUSPENDED, restores access_status = ACTIVE (cross-axis side effect)"
          - "Increments Membership.version by 1"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /memberships/{id}/run-billing with outcome=SUCCEEDED (on-time renewal)"
        actor: FrontDesk
        preconditions:
          - "Membership.billing_status == CURRENT"
          - "clock >= cycle_end"
          - "Membership.access_status != FROZEN (a FROZEN membership is not billed; ERR_MEMBERSHIP_FROZEN)"
        side_effects:
          - "Advances cycle_start = clock; recomputes cycle_end"
          - "wallet_credit_cents applied first, remainder charged to card (renewal_charge calc)"
          - "Increments Membership.version by 1"
      - from: [CURRENT, PAST_DUE]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "Membership.billing_status IN {CURRENT, PAST_DUE}"
        side_effects:
          - "Sets access_status = TERMINATED (cross-axis cascade)"
          - "Active Enrollment rows for this member -> WITHDRAWN (cascade hop, Clinic.enrolled_count recomputed, Clinic.version bumped)"
          - "Increments Membership.version by 1"

  - entity: Membership
    field: access_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Access axis; FROZEN<->ACTIVE is a cycle (Rule 3). SUSPENDED reached via grace-threshold sweep or SERIOUS incident."
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /memberships/{id}/freeze"
        actor: Member
        preconditions:
          - "Membership.access_status == ACTIVE"
          - "Membership.billing_status != CANCELLED"
        side_effects:
          - "Sets frozen_at = clock"
          - "Credits unused-days proration to Member.wallet_credit_cents (freeze_credit calc) — conserved-quantity invariant: fee owed for unused days converts 1:1 into wallet credit"
          - "Increments Membership.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/resume"
        actor: Member
        preconditions:
          - "Membership.access_status == FROZEN"
        side_effects:
          - "Clears frozen_at to null"
          - "Advances cycle_start = clock; recomputes cycle_end (frozen days do not consume cycle; Rule 3 cycle ACTIVE->FROZEN->ACTIVE)"
          - "Increments Membership.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{id}/run-billing with outcome=SWEEP (grace sweep) when days past_due >= GRACE_DAYS"
        actor: FrontDesk
        preconditions:
          - "Membership.billing_status == PAST_DUE"
          - "floor((clock - past_due_since)/day) >= GRACE_DAYS (7) — boundary check"
        side_effects:
          - "Sets access_status = SUSPENDED (blocks MEMBERSHIP check-ins)"
          - "ON_FLOOR CheckIn rows for this member on the membership path -> CHECKED_OUT (cascade hop; Facility.occupancy recomputed, Facility.version bumped)"
          - "Increments Membership.version by 1"
      - from: [ACTIVE, FROZEN, SUSPENDED]
        to: TERMINATED
        trigger: "system (Membership cancelled via billing axis) or SERIOUS Incident cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Terminal; no further access transitions"

  # ---------- Certification: BRANCHING (grade pass/fail) + cyclic recert ----------
  - entity: Certification
    field: status
    initial_state: REGISTERED
    terminal_states: []
    note: "BRANCHING fork at grading (Rule 3 alt-entity): REGISTERED -> {PASSED, FAILED} with divergent side effects."
    transitions:
      - from: REGISTERED
        to: PASSED
        trigger: "POST /certifications/{id}/grade with station scores meeting pass rule"
        actor: Examiner
        preconditions:
          - "Certification.status == REGISTERED"
          - "weighted_score >= CERT_PASS_THRESHOLD (80) AND min_station_score >= CERT_STATION_FLOOR (60)"
          - "If discipline == LEAD: member has a Certification with discipline==BELAY in status PASSED and not EXPIRED (cross-entity dependency)"
        side_effects:
          - "Sets weighted_score, min_station_score, examiner_user_id, passed_at = clock, expires_at = passed_at + CERT_VALID_DAYS"
          - "Increments Certification.version by 1"
      - from: REGISTERED
        to: FAILED
        trigger: "POST /certifications/{id}/grade with station scores NOT meeting pass rule"
        actor: Examiner
        preconditions:
          - "Certification.status == REGISTERED"
          - "weighted_score < CERT_PASS_THRESHOLD (80) OR min_station_score < CERT_STATION_FLOOR (60)"
        side_effects:
          - "Sets weighted_score, min_station_score, examiner_user_id; passed_at and expires_at remain null"
          - "Increments Certification.version by 1"
      - from: PASSED
        to: EXPIRED
        trigger: "POST /certifications/{id}/refresh-status when clock >= expires_at"
        actor: FrontDesk
        preconditions:
          - "Certification.status == PASSED"
          - "clock >= expires_at (boundary check)"
        side_effects:
          - "Increments Certification.version by 1"
      - from: [PASSED, EXPIRED]
        to: REVOKED
        trigger: "system (SERIOUS Incident referencing this certification)"
        actor: system
        preconditions: []
        side_effects:
          - "Terminal-for-this-badge; member must register a fresh Certification to recertify (Rule 3 cyclic recert loop is realized by creating a new REGISTERED row)"
          - "Increments Certification.version by 1"

  # ---------- CheckIn: linear with capacity guard + auto check-out cascade target ----------
  - entity: CheckIn
    field: status
    initial_state: ON_FLOOR
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: ON_FLOOR
        to: CHECKED_OUT
        trigger: "POST /check-ins/{id}/check-out, or system (membership SUSPENDED / Facility STRIPPED-less cascade)"
        actor: "FrontDesk or system"
        preconditions:
          - "CheckIn.status == ON_FLOOR"
        side_effects:
          - "Sets checked_out_at = clock"
          - "Recomputes Facility.occupancy; bumps Facility.version by 1"

  # ---------- Route: linear strip ----------
  - entity: Route
    field: status
    initial_state: OPEN
    terminal_states: [STRIPPED]
    transitions:
      - from: OPEN
        to: STRIPPED
        trigger: "POST /routes/{id}/strip"
        actor: RouteSetter
        preconditions:
          - "Route.status == OPEN"
        side_effects:
          - "Route no longer counts toward open-route listings; difficulty_points retained for historical setter aggregation"
          - "Increments Route.version by 1"

  # ---------- Rental: branching return vs lost ----------
  - entity: Rental
    field: status
    initial_state: OUT
    terminal_states: [RETURNED, LOST]
    note: "BRANCH at OUT -> {RETURNED, LOST} with divergent deposit settlement."
    transitions:
      - from: OUT
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: FrontDesk
        preconditions:
          - "Rental.status == OUT"
        side_effects:
          - "Computes late_fee_cents from hours-late tiers capped at deposit_cents (rental_late_fee calc)"
          - "refund_cents = deposit_cents - late_fee_cents; credits refund_cents to Member.wallet_credit_cents (conserved-quantity invariant: deposit_cents == late_fee_cents + refund_cents)"
          - "Sets returned_at = clock; Increments Rental.version by 1"
      - from: OUT
        to: LOST
        trigger: "POST /rentals/{id}/report-lost"
        actor: FrontDesk
        preconditions:
          - "Rental.status == OUT"
        side_effects:
          - "late_fee_cents = deposit_cents (deposit forfeited); refund_cents = 0 (no wallet credit)"
          - "Increments Rental.version by 1"

  # ---------- Clinic: scheduled -> cancelled with enrollment cascade ----------
  - entity: Clinic
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinics/{id}/cancel"
        actor: GymAdmin
        preconditions:
          - "Clinic.status == SCHEDULED"
        side_effects:
          - "All ENROLLED Enrollment rows -> WITHDRAWN (cascade; enrolled_count recomputed to 0)"
          - "Increments Clinic.version by 1"

  # ---------- Enrollment: enrolled -> withdrawn ----------
  - entity: Enrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw, or system (clinic cancel / membership cancel cascade)"
        actor: "Member or system"
        preconditions:
          - "Enrollment.status == ENROLLED"
        side_effects:
          - "Recomputes Clinic.enrolled_count; bumps Clinic.version by 1"

  # ---------- Incident: OPEN -> RESOLVED, SERIOUS fires the cascade on create ----------
  - entity: Incident
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "SERIOUS incidents fire a 3-hop cascade at creation (see endpoint side_effects); status itself is a simple OPEN->RESOLVED close."
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: GymAdmin
        preconditions:
          - "Incident.status == OPEN"
        side_effects:
          - "Increments Incident.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: checkin-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /check-ins"
    occ_field: "expected_facility_version"
    description: |
      Creating a CheckIn against a Facility whose version has advanced since the
      client last observed it is rejected. A CheckIn legitimately supersedes the
      prior occupancy snapshot — the new row consumes one unit of the finite
      floor_capacity — so a second create that still carries the pre-occupancy
      version is operating on a stale view of remaining capacity and is refused.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

  - rule_id: enroll-create-stale-clinic
    parent_entity: Clinic
    write_endpoint: "POST /enrollments"
    occ_field: "expected_clinic_version"
    description: |
      Creating an Enrollment against a Clinic whose version has advanced since the
      client last observed it is rejected. Each new Enrollment supersedes the prior
      seat snapshot by consuming one unit of finite seat_capacity, so an enroll that
      still carries the pre-enrollment version is acting on a stale seat count.
    error_id: ERR_STALE_CLINIC_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (1) Dual-variant calc #1: deposit settlement on Rental (cost accounting) ----
  - name: rental_late_fee
    trigger: "Rental OUT->RETURNED (POST /rentals/{id}/return) or OUT->LOST (POST /rentals/{id}/report-lost)"
    algorithm: tiered_pricing
    formula: |
      hours_late = max(0, hours_between(due_at, clock))           # clock at return; 0 if returned by due_at
      days_late  = ceil(hours_late / 24)                          # 0 if on time; 1 for 1..24h; 2 for 25..48h ...
      raw_fee    = LATE_FEE_PER_DAY_CENTS * days_late
      late_fee_cents = min(raw_fee, deposit_cents)                # capped at deposit
      refund_cents   = deposit_cents - late_fee_cents
    input_set: "Single Rental at return time; due_at = rented_at + RENTAL_DUE_HOURS."
    constants:
      LATE_FEE_PER_DAY_CENTS: 800
      RENTAL_DUE_HOURS: 24
    precision: "integer cents, ceil on day count, no fractional cents"
    variants:
      - name: returned_variant
        when: "OUT->RETURNED transition"
        difference: "late_fee computed from hours-late tiers (may be 0); refund_cents credited to wallet."
      - name: lost_variant
        when: "OUT->LOST transition"
        difference: "late_fee_cents = full deposit_cents regardless of time; refund_cents = 0 (deposit forfeited)."

  # ---- (2) Dual-variant calc #2: membership freeze proration on Member (different entity domain) ----
  - name: freeze_credit
    trigger: "Membership ACTIVE->FROZEN (POST /memberships/{id}/freeze)"
    algorithm: forward_looking
    formula: |
      days_in_cycle = CYCLE_DAYS                                  # 30
      unused_days   = max(0, ceil_days_between(clock, cycle_end)) # whole days from freeze instant to cycle_end, exclusive of today
      freeze_credit_cents = round_half_up(monthly_fee_cents * unused_days / days_in_cycle)
      Member.wallet_credit_cents += freeze_credit_cents
    input_set: "Single Membership at freeze instant; uses monthly_fee_cents and remaining whole days to cycle_end."
    constants:
      CYCLE_DAYS: 30
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional_estimate
        when: "GET /memberships/{id}/freeze-quote (what-if, no mutation)"
        difference: "Computes the same formula against the current clock but does NOT mutate wallet or membership; quote can diverge from the committed credit if the clock advances between quote and freeze."
      - name: committed_credit
        when: "POST /memberships/{id}/freeze (mutation)"
        difference: "Same formula, evaluated at the freeze instant, and persisted to wallet_credit_cents; this is the authoritative value."

  # ---- (3) Combinatorial mode (a): day-pass price (>=3 inputs, nested min/floor, branch on youth) ----
  - name: day_pass_price
    trigger: "CheckIn create with entry_kind=DAY_PASS (POST /check-ins)"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = DAY_PASS_BASE_CENTS + (GEAR_BUNDLE_CENTS if gear_bundle else 0)
      youth_discount_cents = floor(subtotal_cents * YOUTH_DISCOUNT_RATE) if Member.is_youth else 0
      price_cents = subtotal_cents - youth_discount_cents
    input_set: "Single CheckIn: Member.is_youth flag + gear_bundle flag + base/bundle constants."
    constants:
      DAY_PASS_BASE_CENTS: 2500
      GEAR_BUNDLE_CENTS: 1200
      YOUTH_DISCOUNT_RATE: 0.20
    precision: "floor on discount cents (round toward zero), integer result"

  # ---- (4) Combinatorial mode (c): renewal charge with explicit eval order (wallet-then-card) ----
  - name: renewal_charge
    trigger: "Membership run-billing SUCCEEDED on a due cycle (POST /memberships/{id}/run-billing)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED — wallet is applied BEFORE the card charge is derived,
      # because the card amount is keyed on the post-wallet remainder (mode (c): the card
      # amount depends on the wallet draw, which itself depends on monthly_fee_cents).
      gross_cents       = monthly_fee_cents
      wallet_applied     = min(Member.wallet_credit_cents, gross_cents)
      card_charge_cents  = gross_cents - wallet_applied
      Member.wallet_credit_cents -= wallet_applied               # never below 0 by construction
    input_set: "Single Membership renewal: monthly_fee_cents and the member's current wallet_credit_cents."
    constants: {}
    precision: "integer cents; no rounding (all integer)"

  # ---- (5) Combinatorial mode (b): belay weighted score with PINNED round order ----
  - name: belay_weighted_score
    trigger: "Certification grade (POST /certifications/{id}/grade)"
    algorithm: weighted_scoring
    formula: |
      # Stations: KNOT(0.30), COMMANDS(0.20), CATCH(0.30), LOWER(0.20). Each score 0..100.
      # PINNED rounding order: sum the weighted contributions in FULL precision first,
      # THEN round_half_up the single total — NOT round each weighted term then sum.
      raw = 0.30*knot + 0.20*commands + 0.30*catch + 0.20*lower      # full precision
      weighted_score    = round_half_up(raw)                          # round once, at the end
      min_station_score = min(knot, commands, catch, lower)
      passes = (weighted_score >= CERT_PASS_THRESHOLD) and (min_station_score >= CERT_STATION_FLOOR)
    input_set: "Four station scores supplied in the grade request body."
    constants:
      CERT_PASS_THRESHOLD: 80
      CERT_STATION_FLOOR: 60
    precision: "round_half_up to integer for weighted_score; min taken on raw integer station scores"

  # ---- (6) Aggregation: setter monthly difficulty-points (route grade log) ----
  - name: setter_monthly_points
    trigger: "GET /facilities/{id}/setter-report?setter_user_id=&month= (computed read)"
    algorithm: aggregation
    formula: |
      base_points     = 100 + grade*50
      style_multiplier = {SLAB:1.0, OVERHANG:1.25, ROOF:1.50}[style]
      difficulty_points = round_half_up(base_points * style_multiplier)     # per Route, at create
      # Report total: sum difficulty_points over Routes on this facility where
      #   setter_user_id == requested setter
      #   AND set_on in [month_start, next_month_start)   (half-open window)
      #   AND status IN {OPEN, STRIPPED}   (stripped routes still count historically)
      # Order-independent sum; ties impossible (pure sum).
    input_set: "Routes on one facility, filtered by setter_user_id and set_on month window; both OPEN and STRIPPED included."
    constants:
      SLAB_MULT: 1.0
      OVERHANG_MULT: 1.25
      ROOF_MULT: 1.50
    precision: "round_half_up to integer per-route; integer sum for report"

  # ---- (7) Threshold: past-due grace sweep ----
  - name: grace_sweep
    trigger: "Membership run-billing with outcome=SWEEP (POST /memberships/{id}/run-billing)"
    algorithm: threshold
    formula: |
      days_overdue = floor( (clock - past_due_since) / 86400_seconds )
      if billing_status == PAST_DUE and days_overdue >= GRACE_DAYS:
        access_status -> SUSPENDED   (boundary: 6 days no-op, 7 days suspends)
    input_set: "Single PAST_DUE membership; days measured from past_due_since to clock."
    constants:
      GRACE_DAYS: 7
    precision: "floor on whole days; >= comparison at the boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources exist (validated left-to-right; body FKs after path ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Member acting on own resource: X-User-ID equals the resource's member_id (Member role only)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-role mutations on Membership/Enrollment owned resources"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges (grade 0..10, scores 0..100, capacity >= 1, ends_at > starts_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/grade endpoints"

  - priority: 7
    category: business_safety
    check: "Check-in waiver gate: member has a Waiver with status VALID (clock < expires_at)"
    error_id: ERR_WAIVER_INVALID
    http_status: 422
    applies_to: "POST /check-ins"

  - priority: 8
    category: business_safety
    check: "Belay gate: when Facility.requires_belay_cert, member has a Certification (BELAY or LEAD) status PASSED and not EXPIRED"
    error_id: ERR_BELAY_CERT_REQUIRED
    http_status: 422
    applies_to: "POST /check-ins"

  - priority: 9
    category: business_safety
    check: "LEAD cert prerequisite: grading a LEAD certification to PASSED requires an existing PASSED non-expired BELAY cert on the same member"
    error_id: ERR_BELAY_PREREQUISITE_MISSING
    http_status: 422
    applies_to: "POST /certifications/{id}/grade"

  - priority: 10
    category: business_referential
    check: "MEMBERSHIP check-in requires the member to hold a Membership with access_status ACTIVE (not FROZEN/SUSPENDED/TERMINATED)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /check-ins with entry_kind=MEMBERSHIP"

  - priority: 11
    category: business_temporal
    check: "Clinic enrollment window: clock < Clinic.starts_at (cannot enroll into an already-started or cancelled session)"
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 12
    category: business_constraint
    check: "OCC version match: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /check-ins, POST /enrollments (see §1.2.1)"

  - priority: 13
    category: business_fiscal
    check: "Capacity: Facility.occupancy < floor_capacity at check-in; Clinic.enrolled_count < seat_capacity at enroll (>= boundary rejects)"
    error_id: ERR_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /check-ins, POST /enrollments"

