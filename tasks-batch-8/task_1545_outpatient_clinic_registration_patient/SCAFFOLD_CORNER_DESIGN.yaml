              payload: { first_name: "Date", last_name: "Range", date_of_birth: "1985-05-25", sex_at_birth: "M", primary_phone: "+15551400006" }
              as: Registrar
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MDR", plan_type: "PPO", effective_start: "2026-06-01", effective_end: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_DATE_RANGE"

      - name: deposit_shortfall_blocks_mark_ready
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_DEPOSIT_SHORTFALL]
        distinguishing_aspect: "mark-ready with partial payment below deposit_required_cents returns ERR_DEPOSIT_SHORTFALL / 402; topping up to the exact deposit then succeeds."
        test_recipe:
          setup: ["PRE_CHECKED ESTABLISHED appointment, estimate 44000 / deposit 11000, 10000 collected"]
          setup_api_calls:
