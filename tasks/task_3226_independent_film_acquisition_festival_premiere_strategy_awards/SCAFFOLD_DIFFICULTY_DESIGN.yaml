# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3226_independent_film_acquisition_festival_premiere_strategy_awards
#
# Depth probe: 9 difficulty rules × ≥2 instances each = ≥18 instances total.
# Every test_recipe drives empty-DB -> precondition state via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations on different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: statement_gross_vs_net_waterfall_diverges_on_same_inputs
        grounds:
          - calculations.participation_waterfall
          - entities.FilmmakerStatement.fields.basis
          - entities.FilmmakerStatement.fields.filmmaker_participation_cents
        distinguishing_aspect: |
          Same film, same deal, same gross_receipts_cents produce different
          filmmaker_participation_cents depending on basis: GROSS_RECEIPTS takes a
          15% fee and pays off the top with no recoupment; NET_PROFITS takes a 30%
          fee and recoups acquisition + production + P&A + eligible campaign spend
          before participation. Two distinct entity domains (statement vs deal/film/
          campaign aggregation) exercise the variants.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Film F with production_budget_cents=2000000; offer accepted producing AcquisitionDeal D with upfront_price_cents=5000000, backend_participation_pct=0.10, prints_advertising_commit_cents=8000000."
            - "DistributionExec reports theatrical spend 3000000 on the deal (deal.pa_spent_theatrical_cents = 3000000)."
            - "No awards campaign exists; awards_eligible_total in NET_PROFITS waterfall = 0."
            - "NET_PROFITS recoupable = upfront(5000000) + production(2000000) + pa_theatrical(3000000) + 0 = 10000000."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL", "STREAMING"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/report-theatrical-spend"
              payload: { amount_cents: 3000000 }
              as: DistributionExec
          trigger:
            - call: "POST /films/${film_id}/statements"
              payload: { deal_id: "${deal_id}", period_label: "Q1-2027", basis: "GROSS_RECEIPTS", gross_receipts_cents: 20000000 }
              as: ParticipationAccountant
              captures: { st_gross_id: $.data.id }
            - call: "POST /films/${film_id}/statements"
              payload: { deal_id: "${deal_id}", period_label: "Q1-2027", basis: "NET_PROFITS", gross_receipts_cents: 20000000 }
              as: ParticipationAccountant
              captures: { st_net_id: $.data.id }
          assert:
            - "FilmmakerStatement.${st_gross_id}.distribution_fee_cents == 3000000"
            - "FilmmakerStatement.${st_gross_id}.recoupable_costs_cents == 0"
            - "FilmmakerStatement.${st_gross_id}.filmmaker_participation_cents == 1700000"
            - "FilmmakerStatement.${st_net_id}.distribution_fee_cents == 6000000"
            - "FilmmakerStatement.${st_net_id}.recoupable_costs_cents == 10000000"
            - "FilmmakerStatement.${st_net_id}.filmmaker_participation_cents == 400000"
            - "FilmmakerStatement.${st_gross_id}.filmmaker_participation_cents != FilmmakerStatement.${st_net_id}.filmmaker_participation_cents"

      - name: premiere_cachet_provisional_recomputes_locked_freezes
        grounds:
          - calculations.premiere_cachet
          - entities.PremiereSlot.fields.cachet_score
          - state_machines.PremiereSlot.HELD_to_BOOKED
        distinguishing_aspect: |
          premiere_cachet has a provisional variant (recomputed on festival edits
          while HELD) and a locked variant (frozen at book time). Same slot,
          different lifecycle phase → different recomputation semantics; the entity
          domain (PremiereSlot + Festival) is disjoint from Rule 1 instance 1's
          FilmmakerStatement/AcquisitionDeal domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Festival SUNDANCE A_LIST with start 2027-01-21T00:00:00Z, end 2027-01-31T00:00:00Z, default_review_embargo_hours=24."
            - "Territory US (is_home_ent_eligible=true)."
            - "Film F acquired via an accepted offer ( Theatre+Streaming US )."
            - "PremiereSlot S on SUNDANCE, section COMPETITION, screening 2027-01-22T20:00:00Z to 2027-01-22T22:00:00Z, embargo lifts 2027-01-23T08:00:00Z (10-hour delay → multiplier 1.25)."
            - "Slot HELD for film F; cachet provisional = round_half_up((100 + 40) * 1.25) = 175."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance Film Festival", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
          trigger:
            - call: "GET /festivals/${fest_id}/premiere-slots/${slot_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { cachet_held: $.data.cachet_score }
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v3: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v3}" }
              as: FestivalProgrammer
            - call: "GET /festivals/${fest_id}/premiere-slots/${slot_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { cachet_booked: $.data.cachet_score }
          assert:
            - "PremiereSlot.${slot_id}.cachet_score while HELD == 175"
            - "PremiereSlot.${slot_id}.cachet_score after BOOKED == 175 (locked variant freezes the same numeric result here, but the SEMANTICS differ — the field is now frozen)"
            - "PremiereSlot.${slot_id}.status == BOOKED"
            - "Film.${film_id}.release_posture == PREMIERE_LOCKED"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: premiere_cachet_multi_input_tiered_embargo
        grounds:
          - calculations.premiere_cachet
          - entities.PremiereSlot.fields.cachet_score
        distinguishing_aspect: |
          Mode (a) combinatorial — ≥3 inputs (prestige_tier, section, embargo
          delay hours) interacting through a tiered multiplier selected by
          conditional branch (<=12 vs <=48 vs >48 hours) and combined
          multiplicatively then rounded.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Three festivals: A_LIST, B_LIST, REGIONAL. Three sections COMPETITION/PREMIERES/NEXT with three embargo delays 6h / 24h / 96h covering all three multiplier tiers."
            - "Slots held (not booked) for nine combinations."
          setup_api_calls:
            - call: "POST /festivals"
              payload: { code: "CANNES", name: "Cannes", start_date: "2027-05-12T00:00:00Z", end_date: "2027-05-23T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_a: $.data.id }
            - call: "POST /festivals"
              payload: { code: "TIFF", name: "Toronto", start_date: "2027-09-09T00:00:00Z", end_date: "2027-09-19T00:00:00Z", prestige_tier: "B_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_b: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SXSW", name: "South By Southwest", start_date: "2027-03-12T00:00:00Z", end_date: "2027-03-20T00:00:00Z", prestige_tier: "REGIONAL", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_r: $.data.id }
            # Slots
            - call: "POST /festivals/${fest_a}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-05-15T20:00:00Z", screening_ends_at: "2027-05-15T22:00:00Z", review_embargo_lifts_at: "2027-05-16T04:00:00Z" }
              as: FestivalProgrammer
              captures: { s_a_comp_6h: $.data.id }
            - call: "POST /festivals/${fest_a}/premiere-slots"
              payload: { section: "PREMIERES", screening_starts_at: "2027-05-16T20:00:00Z", screening_ends_at: "2027-05-16T22:00:00Z", review_embargo_lifts_at: "2027-05-17T22:00:00Z" }
              as: FestivalProgrammer
              captures: { s_a_prem_24h: $.data.id }
            - call: "POST /festivals/${fest_b}/premiere-slots"
              payload: { section: "MIDNIGHT", screening_starts_at: "2027-09-12T23:00:00Z", screening_ends_at: "2027-09-13T01:00:00Z", review_embargo_lifts_at: "2027-09-17T01:00:00Z" }
              as: FestivalProgrammer
              captures: { s_b_mid_96h: $.data.id }
            - call: "POST /festivals/${fest_r}/premiere-slots"
              payload: { section: "NEXT", screening_starts_at: "2027-03-14T20:00:00Z", screening_ends_at: "2027-03-14T22:00:00Z", review_embargo_lifts_at: "2027-03-15T04:00:00Z" }
              as: FestivalProgrammer
              captures: { s_r_next_6h: $.data.id }
            # Hold each slot for a film (film must exist; use one film for all)
            - call: "POST /films"
              payload: { title: "Combinatorics", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 100, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /festivals/${fest_a}/premiere-slots/${s_a_comp_6h}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "POST /festivals/${fest_a}/premiere-slots/${s_a_prem_24h}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "POST /festivals/${fest_b}/premiere-slots/${s_b_mid_96h}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "POST /festivals/${fest_r}/premiere-slots/${s_r_next_6h}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
          trigger:
            - call: "GET /festivals/${fest_a}/premiere-slots/${s_a_comp_6h}"
              payload: {}
              as: FestivalProgrammer
              captures: { c1: $.data.cachet_score }
            - call: "GET /festivals/${fest_a}/premiere-slots/${s_a_prem_24h}"
              payload: {}
              as: FestivalProgrammer
              captures: { c2: $.data.cachet_score }
            - call: "GET /festivals/${fest_b}/premiere-slots/${s_b_mid_96h}"
              payload: {}
              as: FestivalProgrammer
              captures: { c3: $.data.cachet_score }
            - call: "GET /festivals/${fest_r}/premiere-slots/${s_r_next_6h}"
              payload: {}
              as: FestivalProgrammer
              captures: { c4: $.data.cachet_score }
          assert:
            - "PremiereSlot.${s_a_comp_6h}.cachet_score == 175"
            - "PremiereSlot.${s_a_prem_24h}.cachet_score == 125"
            - "PremiereSlot.${s_b_mid_96h}.cachet_score == 56"
            - "PremiereSlot.${s_r_next_6h}.cachet_score == 50"

      - name: campaign_eligible_spend_cap_constraint_propagation
        grounds:
          - calculations.campaign_eligible_spend
          - entities.CampaignSpend.fields.eligible_amount_cents
        distinguishing_aspect: |
          Mode (c) — the eligible amount depends on prior spend on the same
          campaign (circular-looking: spend eligible depends on prior eligible
          totals), with the evaluation order pinned to created_at ASC and an
          explicit cap derived from budget_total_cents.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Film F acquired; awards campaign OSCARS with budget_total_cents=2000000, target_categories=[BEST_PICTURE]; film released to PREMIERE_LOCKED so campaign can activate."
            - "PUBLICITY cap = round_half_up(2000000 * 0.30) = 600000."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v3: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v3}" }
              as: FestivalProgrammer
            - call: "POST /films/${film_id}/awards-campaigns"
              payload: { deal_id: "${deal_id}", awards_body: "OSCARS", target_categories: ["BEST_PICTURE"], budget_total_cents: 2000000 }
              as: AwardsStrategist
              captures: { campaign_id: $.data.id }
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/activate"
              payload: {}
              as: AwardsStrategist
          trigger:
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 500000, incurred_at: "2026-10-01T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
              captures: { spend_1: $.data.id, elig_1: $.data.eligible_amount_cents }
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 200000, incurred_at: "2026-10-05T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
              captures: { spend_2: $.data.id, elig_2: $.data.eligible_amount_cents }
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 100000, incurred_at: "2026-10-10T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
              captures: { spend_3: $.data.id, elig_3: $.data.eligible_amount_cents }
          assert:
            - "CampaignSpend.${spend_1}.eligible_amount_cents == 500000"
            - "CampaignSpend.${spend_2}.eligible_amount_cents == 100000"
            - "CampaignSpend.${spend_3}.eligible_amount_cents == 0"
            - "AwardsCampaign.${campaign_id}.budget_publicity_cents == 800000"
            - "AwardsCampaign.${campaign_id}.budget_remaining_cents == 1200000"

  # ===========================================================================
  # Rule 3 — Non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: offer_negotiation_cycle_open_countered_open
        grounds:
          - state_machines.AcquisitionOffer.OPEN_to_COUNTERED
          - state_machines.Film.acquisition_status_UNDER_NEGOTIATION_to_UNDER_NEGOTIATION
        distinguishing_aspect: |
          AcquisitionOffer.status is cyclic at the negotiation level: each counter
          consumes the OPEN offer (→ COUNTERED) and mints a new OPEN offer with
          round_number + 1. The Film.acquisition_status stays UNDER_NEGOTIATION
          across the cycle; withdrawing the final OPEN offer reverts the film to
          SHOPPING. The cyclic shape lives on AcquisitionOffer/Film.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Territory US exists. Film F registered, acquisition_status=SHOPPING."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_1: $.data.id, round_1: $.data.round_number }
          trigger:
            - call: "POST /films/${film_id}/offers/${offer_1}/counter"
              payload: { buyer_code: "A24", upfront_price_cents: 6500000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_2: $.data.id, round_2: $.data.round_number }
            - call: "POST /films/${film_id}/offers/${offer_2}/counter"
              payload: { buyer_code: "A24", upfront_price_cents: 7500000, backend_participation_pct: 0.12, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_3: $.data.id, round_3: $.data.round_number }
            - call: "POST /films/${film_id}/offers/${offer_3}/withdraw"
              payload: {}
              as: AcquisitionExec
          assert:
            - "AcquisitionOffer.${offer_1}.status == COUNTERED and round_number == 1"
            - "AcquisitionOffer.${offer_2}.status == COUNTERED and round_number == 2"
            - "AcquisitionOffer.${offer_3}.status == WITHDRAWN and round_number == 3"
            - "Film.${film_id}.acquisition_status == SHOPPING (revert after last OPEN offer withdrawn, no deal)"

      - name: premiere_slot_hold_release_hold_cycle
        grounds:
          - state_machines.PremiereSlot.OPEN_to_HELD
          - state_machines.PremiereSlot.HELD_to_OPEN
        distinguishing_aspect: |
          PremiereSlot exhibits a cyclic shape distinct from AcquisitionOffer's:
          OPEN -> HELD -> OPEN -> HELD again (release-hold returns the slot to
          OPEN, allowing a different film to hold it). Different entity, different
          cycle (no version increments on Film; cachet_score resets to 0 on
          release-hold).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Festival SUNDANCE. Two films F1 and F2 (both registered, neither acquired)."
            - "One OPEN premiere slot S."
          setup_api_calls:
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F1", director_name: "D1", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F2", director_name: "D2", principal_cast: ["Y"], genre: "COMEDY", runtime_minutes: 95, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${f1_id}" }
              as: FestivalProgrammer
          trigger:
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/release-hold"
              payload: {}
              as: FestivalProgrammer
