          setup:
            - "A CERTIFIED PointRecalculation for cycle 2026 with one eligible zero-point donor."
            - "EV1 over 2026-09-01T00:00:00.000Z to 2026-09-05T00:00:00.000Z, slot_minutes 2880, published and gated OPEN."
            - "EV2 over 2026-09-05T00:00:00.000Z to 2026-09-09T00:00:00.000Z, slot_minutes 2880, published but not yet gated; its window_start equals EV1's window_end exactly."
