      - name: corner_loss_date_must_lie_inside_policy_term
        claim_type: Violation → Error
        grounds:
          - validations[priority=55]
          - errors[ERR_LOSS_DATE_OUTSIDE_TERM]
          - calculations.claim_loss_valuation
          - endpoints[POST /inland-marine/policies/{id}/claims]
