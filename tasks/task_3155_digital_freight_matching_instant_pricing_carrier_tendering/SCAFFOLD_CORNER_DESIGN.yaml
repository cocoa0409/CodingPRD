      - GET /v1/carrier-settlements?load_id=${load_id} returns exactly 1 row and not 2
      - Shipper.${shipper_id}.credit_used_cents == 0
- section: consistency_model
  instances:
  - name: claim_approval_recomputes_the_ready_settlement_in_the_same_request_window
    claim_type: Immediate visibility
    grounds:
    - calculations.settlement_net_payable
    - state_machines.ClaimsCase.UNDER_REVIEW_to_APPROVED
    - complexity_profile.consistency_model
    distinguishing_aspect: The consistency model is immediate, so the settlement's deduction, gross, discount and net are
      all restruck by the approval call itself and a read of the settlement in the very next request already shows 170000,
      with no eventual-consistency lag.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One delivered and invoiced load whose settlement is READY, plus a reviewed
        claim on the same load.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
          state_code: CA
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          destination_facility_id: $.data.id
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: DRY_VAN
          unit_number: TR-9001
          driver_name: D. Okafor
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equipment_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          certificate_reference: COI-2026-100001
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/verify-safety
        payload:
          safety_score: 72.0
        as: ComplianceReviewer
        captures:
          carrier_id_v: $.data.version
      - call: POST /v1/loads
        payload:
          shipper_id: ${shipper_id}
          origin_facility_id: ${origin_facility_id}
          destination_facility_id: ${destination_facility_id}
          pricing_mode: SPOT
          equipment_type: DRY_VAN
          commodity: GENERAL
          weight_lbs: 40000
          declared_cargo_value_cents: 5000000
          distance_miles: 1200
          pickup_window_start: '2026-10-05T08:00:00Z'
          pickup_window_end: '2026-10-05T12:00:00Z'
          delivery_deadline: '2026-10-07T18:00:00Z'
          market_band: BALANCED
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_id: $.data.id
      - call: POST /v1/loads/${load_id}/post
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          load_id_v: $.data.version
      - call: GET /v1/loads/${load_id}/rate-quotes
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          quote_id: $.data[0].id
          quote_id_v: $.data[0].version
      - call: POST /v1/bookings
        payload:
          load_id: ${load_id}
          carrier_id: ${carrier_id}
          rate_quote_id: ${quote_id}
          equipment_id: ${equipment_id}
          expected_load_version: ${load_id_v}
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          booking_id: $.data.id
          booking_id_v: $.data.version
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-05T07:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 1
          reported_status: EN_ROUTE_PICKUP
          location_code: 9vg81
          eta_utc: '2026-10-07T18:00:00Z'
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-05T08:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 2
          reported_status: AT_PICKUP
          location_code: 9vg82
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-05T11:35:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 3
          reported_status: IN_TRANSIT
          location_code: 9vg83
          eta_utc: '2026-10-07T18:00:00Z'
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-06T09:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 4
          reported_status: AT_DELIVERY
          location_code: 9vg84
          eta_utc: '2026-10-07T18:00:00Z'
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-06T11:25:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 5
          reported_status: DELIVERED
          location_code: 9vg8e5
          eta_utc: '2026-10-07T18:00:00Z'
        as: Carrier
        as_user_id: ${carrier_id}
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-06T20:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/bookings/${booking_id}/invoice
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          settlement_id: $.data.id
      - call: POST /v1/claims
        payload:
          load_id: ${load_id}
          carrier_id: ${carrier_id}
          claimed_amount_cents: 150000
          damage_description: Crushed corner
          filed_by_role: SHIPPER
          expected_carrier_version: ${carrier_id_v}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          claim_id: $.data.id
          claim_carrier_v: $.data.version
      - call: POST /v1/claims/${claim_id}/review
        payload: {}
        as: ClaimsAdjuster
      trigger:
      - call: GET /v1/carrier-settlements/${settlement_id}
        payload: {}
        as: PlatformAdmin
        captures:
          gross_before: $.data.gross_payable_cents
      - call: POST /v1/claims/${claim_id}/approve
        payload: {}
        as: ClaimsAdjuster
      - call: GET /v1/carrier-settlements/${settlement_id}
        payload: {}
        as: PlatformAdmin
      assert:
      - before the approval gross_payable_cents == 41580 and claims_deduction_cents == 0
      - after the approval claims_deduction_cents == 150000
      - after the approval gross_payable_cents == 26580
      - the recompute is visible in the read that immediately follows the approval, with no sweep required
      - CarrierSettlement.${settlement_id}.settlement_status is still READY
