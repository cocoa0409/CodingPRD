# =============================================================================
# Task 1822: Railcar Leasing & Fleet Management — Seed Tables (SCAFFOLD)
# =============================================================================

scenario: |
  1822. Railcar Leasing & Fleet Management (GATX/Trinity railcar lessor): lease type
  (full service vs net) & rate, car assignment to lessee & fleet utilization,
  maintenance responsibility split & repair authorization, mileage credit & car hire
  revenue, regulatory tank car compliance & retrofit deadlines, car cleaning & prior
  commodity, lease return condition & damage billing, fleet age/retirement &
  reinvestment

domain_name: railcar-leasing-fleet-management
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation      # provisional vs final car-hire / mileage-credit ledgers
  secondary_archetype: compliance_audit         # tank-car directives, retrofit deadlines, SoD
  complexity_layers:
    - optimistic_concurrency                    # OCC on LeaseAgreement / TariffRate / CapitalPool versions
    - cascading_side_effects                    # directive promote and statement finalize cascades
    - dual_variant_calculation                  # provisional vs final settlement; accrued vs assessed penalty
    - rate_threshold_triggers                   # high-mileage tier, credit cap, age limit
  entity_topology: flat                         # peer entities joined by foreign keys, no URL nesting except pool commitments
  state_machine_shape: cyclic                   # multiple revision/dispute/shop cycles plus branching approvals
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties             # proposer != approver on retirement; peer role ownership elsewhere
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lessee
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Lessee company name" }
      - { name: credit_tier, type: enum, source: input, description: "TIER_A | TIER_B | TIER_C", constraints: "one of TIER_A, TIER_B, TIER_C" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum tolerated outstanding balance in cents", constraints: ">= 0" }
      - { name: security_deposit_cents, type: integer, source: input, description: "Security deposit held, cents", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Open receivables: statements finalized, repair lessee shares, certified cleaning, damage invoices, settle rent/fees; reduced by settlements/payments" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; auto-SUSPENDED when outstanding_balance_cents > credit_limit_cents" }

  - name: Railcar
    parent: null
    common_fields: true
    fields:
      - { name: car_mark, type: string, source: input, description: "Reporting mark, e.g. GATX1001", constraints: "unique across all railcars" }
      - { name: car_type, type: enum, source: input, description: "BOX | COVERED_HOPPER | GONDOLA | FLAT | TANK_GENERAL | TANK_PRESSURE" }
      - { name: built_year, type: integer, source: input, description: "Year built (YYYY)", constraints: "1900..2100" }
      - { name: car_age_years, type: integer, source: computed, description: "calendar year of logical clock minus built_year" }
      - { name: cumulative_miles, type: integer, source: computed, default: 0, description: "Sum of validated (loaded+empty) miles across all VALIDATED MileageReports; adjusted on revalidation" }
      - { name: last_commodity, type: enum, source: system, default: NONE, description: "NONE | GRAIN | COAL | PLASTIC_PELLETS | CEMENT | LUMBER | CRUDE_OIL | GASOLINE | ETHANOL | CORN_SYRUP | CHEMICAL_SOLVENT; set to assignment.planned_commodity on return" }
      - { name: compliance_posture, type: enum, source: computed, default: COMPLIANT, description: "COMPLIANT | RETROFIT_DUE | NON_COMPLIANT; derived from directives + retrofit certification" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_LEASE | IN_SHOP | RETIREMENT_PENDING | RETIRED" }
      - { name: status_before_shop, type: enum, source: system, description: "AVAILABLE | ON_LEASE | null; saved when entering IN_SHOP, restored on last shop repair completion" }
      - { name: open_shop_repair_count, type: integer, source: computed, default: 0, description: "Repairs with requires_shop=true currently IN_PROGRESS on this car" }
      - { name: retired_at, type: datetime, source: system, description: "Set on RETIRED; null otherwise" }

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: lessee_id, type: string, source: input, description: "FK -> Lessee.id" }
      - { name: lease_type, type: enum, source: input, description: "FULL_SERVICE | NET; drives maintenance responsibility split" }
      - { name: base_daily_rate_cents, type: integer, source: input, description: "Rent per billable day per car, cents", constraints: "> 0" }
      - { name: car_hire_lessor_share_pct, type: integer, source: input, description: "Lessor percentage of gross car hire, 0..100" }
      - { name: authorized_repair_cap_cents, type: integer, source: input, description: "Lessee-responsible repair share above which lessee pre-authorization is required", constraints: ">= 0" }
      - { name: start_date, type: string, source: input, description: "ISO date lease term starts" }
      - { name: end_date, type: string, source: input, description: "ISO date lease term ends (inclusive)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted for approval" }
      - { name: early_termination_fee_cents, type: integer, source: computed, description: "min(remaining_days, 90) * base_daily_rate_cents * 50% computed at terminate; null until terminated" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | ACTIVE | EXPIRED | TERMINATED" }

  - name: TariffRate
    parent: null
    common_fields: true
    fields:
      - { name: car_type, type: enum, source: input, description: "Car type this rate applies to (same enum as Railcar.car_type)" }
      - { name: rate_kind, type: enum, source: input, description: "CAR_HIRE_BASE (cents/day) | MILEAGE_CREDIT (cents/loaded mile)" }
      - { name: effective_from, type: string, source: input, description: "ISO date, half-open window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date, half-open window end (exclusive)" }
      - { name: unit_rate_cents, type: integer, source: input, description: "Rate in cents", constraints: "> 0" }

  - name: LeaseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id" }
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: planned_commodity, type: enum, source: input, description: "Commodity to be loaded; same enum as Railcar.last_commodity excluding NONE" }
      - { name: scheduled_start, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: scheduled_end, type: string, source: input, description: "ISO date, inclusive window end" }
      - { name: actual_on_lease_date, type: string, source: system, description: "ISO date delivered; null until ON_LEASE" }
      - { name: actual_off_lease_date, type: string, source: system, description: "ISO date returned; null until RETURNED" }
      - { name: pinned_car_hire_daily_cents, type: integer, source: computed, description: "CAR_HIRE_BASE tariff effective at scheduled_start, snapshotted at creation" }
      - { name: pinned_mileage_credit_cents, type: integer, source: computed, description: "MILEAGE_CREDIT tariff effective at scheduled_start, snapshotted at creation" }
      - { name: billable_days, type: integer, source: computed, description: "Set at settle per calc_lease_proration; null until SETTLED" }
      - { name: final_rent_cents, type: integer, source: computed, description: "Set at settle; null until SETTLED" }
      - { name: termination_fee_cents, type: integer, source: computed, description: "Lease early-termination fee attributed at settle; null until SETTLED" }
      - { name: cancellation_reason, type: enum, source: system, description: "LESSEE_REQUEST | DIRECTIVE_EFFECTIVE | LEASE_TERMINATED; null unless CANCELLED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_LEASE | RETURNED | SETTLED | CANCELLED" }

  - name: MileageReport
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: lease_assignment_id, type: string, source: input, description: "FK -> LeaseAssignment.id" }
      - { name: report_month, type: string, source: input, description: "YYYY-MM being reported", constraints: "unique per railcar among reports with status != DISPUTED-resubmitted superseded; one non-rejected report per (railcar_id, report_month)" }
      - { name: loaded_miles, type: integer, source: input, description: "Reported loaded miles", constraints: ">= 0" }
      - { name: empty_miles, type: integer, source: input, description: "Reported empty miles", constraints: ">= 0" }
      - { name: validated_loaded_miles, type: integer, source: system, description: "Billing-authoritative loaded miles after validation; null until VALIDATED" }
      - { name: validated_empty_miles, type: integer, source: system, description: "Validated empty miles; null until VALIDATED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | DISPUTED" }

  - name: CarHireStatement
    parent: null
    common_fields: true
    fields:
      - { name: lease_assignment_id, type: string, source: system, description: "FK -> LeaseAssignment.id" }
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id" }
      - { name: lessee_id, type: string, source: system, description: "FK -> Lessee.id (via assignment's lease)" }
      - { name: statement_month, type: string, source: system, description: "YYYY-MM of this statement" }
      - { name: days_on_lease, type: integer, source: computed, description: "On-lease days inside statement_month" }
      - { name: gross_car_hire_cents, type: integer, source: computed, description: "days_on_lease * daily rate (variant-dependent source)" }
      - { name: loaded_miles_used, type: integer, source: computed, description: "Reported loaded miles (provisional) or validated loaded miles (final)" }
      - { name: tier_excess_miles, type: integer, source: computed, description: "Loaded miles beyond HIGH_MILEAGE_THRESHOLD for this lease-year" }
      - { name: mileage_credit_cents, type: integer, source: computed, description: "Tiered mileage credit after 80%-of-gross cap" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "lessor share - credit, current-tariff variant" }
      - { name: final_net_cents, type: integer, source: computed, description: "lessor share - credit, pinned-tariff + validated-miles variant; null until FINALIZED" }
      - { name: tariff_source, type: enum, source: computed, description: "CURRENT while PROVISIONAL/DISPUTED | PINNED once FINALIZED" }
      - { name: dispute_reason, type: string, source: input, description: "Required on dispute; null otherwise" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | DISPUTED | FINALIZED | SETTLED" }

  - name: RepairAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: lease_assignment_id, type: string, source: input, description: "FK -> LeaseAssignment.id; optional - the ON_LEASE assignment for this car, if any" }
      - { name: defect_description, type: string, source: input, description: "Free-text defect description" }
      - { name: defect_cause, type: enum, source: input, description: "WEAR_AND_TEAR | LESSEE_DAMAGE | PRE_EXISTING" }
      - { name: estimate_cents, type: integer, source: input, description: "Shop estimate in cents", constraints: "> 0" }
      - { name: requires_shop, type: boolean, source: input, description: "True if car must enter shop (drives IN_SHOP)" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Set at approve; null until APPROVED" }
      - { name: final_cost_cents, type: integer, source: system, description: "Set at complete; null until COMPLETED" }
      - { name: lessee_share_cents, type: integer, source: computed, description: "Per calc_repair_responsibility_split; recomputed on revise and complete" }
      - { name: lessor_share_cents, type: integer, source: computed, description: "cost - lessee_share_cents" }
      - { name: lessee_preauth_required, type: boolean, source: computed, description: "lessee_share_cents > lease.authorized_repair_cap_cents" }
      - { name: lessee_preauthorized, type: boolean, source: system, default: false, description: "Set by LesseeRep preauthorize" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of revision cycles" }
      - { name: shop_entry_date, type: string, source: system, description: "Date start-work executed with requires_shop; null otherwise" }
      - { name: completion_date, type: string, source: system, description: "Date completed; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | REVISION_REQUESTED | APPROVED | IN_PROGRESS | COMPLETED | REJECTED" }

  - name: CleaningRecord
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: prior_commodity, type: enum, source: input, description: "Commodity being cleaned out (same enum, excluding NONE)" }
      - { name: next_commodity, type: enum, source: input, description: "Commodity the car is being prepared for (same enum, excluding NONE)" }
      - { name: cleaning_grade_required, type: enum, source: computed, description: "WASH | STEAM_CLEAN; STEAM_CLEAN when prior_commodity in {CRUDE_OIL, GASOLINE, CHEMICAL_SOLVENT}, else WASH" }
      - { name: cleaning_grade_performed, type: enum, source: input, description: "WASH | STEAM_CLEAN; supplied at complete; must be >= required (STEAM_CLEAN satisfies WASH)" }
      - { name: planned_date, type: string, source: input, description: "ISO date cleaning planned" }
      - { name: cost_cents, type: integer, source: input, description: "Supplied at complete", constraints: ">= 0" }
      - { name: attributable_to_lessee, type: boolean, source: input, default: false, description: "True when contamination is attributable to last lessee; drives bill_to" }
      - { name: bill_to, type: enum, source: computed, description: "LESSEE when attributable_to_lessee else LESSOR" }
      - { name: certificate_ref, type: string, source: system, description: "Set at certify; null until CERTIFIED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CERTIFIED | FAILED" }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: lease_assignment_id, type: string, source: input, description: "FK -> LeaseAssignment.id" }
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: line_items, type: array, source: input, description: "Array of {component, severity: MINOR|MODERATE|SEVERE, cause: LESSEE_DAMAGE|WEAR_AND_TEAR|PRE_EXISTING, parts_cents, labor_hours, replaced: boolean}; supplied at submit/resubmit" }
      - { name: total_assessed_cents, type: integer, source: computed, description: "Sum of per-line rounded costs; set at finalize" }
      - { name: lessee_liable_cents, type: integer, source: computed, description: "Sum over LESSEE_DAMAGE lines of per-line rounded post-betterment amounts; set at finalize" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | FINALIZED | INVOICED | PAID" }

  - name: ComplianceDirective
    parent: null
    common_fields: true
    fields:
      - { name: directive_code, type: string, source: input, description: "e.g. DOT-117R", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: applies_to_car_types, type: array, source: input, description: "Non-empty array of Railcar.car_type enum values" }
      - { name: retrofit_deadline, type: string, source: input, description: "ISO date; retrofit scheduling must be on/before this date" }
      - { name: grace_days, type: integer, source: input, default: 30, description: "Days after effective_date before penalties are assessed" }
      - { name: daily_penalty_cents, type: integer, source: input, description: "Penalty per non-compliant car per day", constraints: "> 0" }
      - { name: penalty_cap_cents, type: integer, source: input, description: "Max assessed penalty per car per directive", constraints: "> 0" }
      - { name: effective_date, type: string, source: system, description: "ISO date of promote; null until EFFECTIVE" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | EFFECTIVE" }

  - name: RetrofitOrder
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: directive_id, type: string, source: input, description: "FK -> ComplianceDirective.id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of planned shop work; must be <= directive.retrofit_deadline" }
      - { name: completed_date, type: string, source: system, description: "Set at complete; null until COMPLETED" }
      - { name: certification_ref, type: string, source: system, description: "Set at certify; null until CERTIFIED" }
      - { name: deferral_count, type: integer, source: system, default: 0, description: "Number of deferrals" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DEFERRED | IN_PROGRESS | COMPLETED | CERTIFIED | CANCELLED" }

  - name: RetirementCase
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id" }
      - { name: reason, type: enum, source: input, description: "AGE_LIMIT | DAMAGE_BEYOND_REPAIR | OBSOLESCENCE | DIRECTIVE_ECONOMIC" }
      - { name: proposer_user_id, type: string, source: system, description: "X-User-ID of creating FleetPlanner; approval by same id is forbidden (SoD)" }
      - { name: salvage_value_cents, type: integer, source: input, description: "Supplied at appraise", constraints: ">= 0" }
      - { name: book_value_cents, type: integer, source: input, description: "Supplied at appraise", constraints: ">= 0" }
      - { name: impairment_loss_cents, type: integer, source: computed, description: "max(0, book_value_cents - salvage_value_cents); set at appraise" }
      - { name: reinvestment_credit_cents, type: integer, source: computed, description: "= salvage_value_cents; credited to the open CapitalPool of the execution year at execute" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPRAISED | APPROVED | EXECUTED | CANCELLED" }

  - name: CapitalPool
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Budget year (YYYY)", constraints: "unique" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Opening reinvestment budget", constraints: ">= 0" }
      - { name: replenishment_cents, type: integer, source: computed, default: 0, description: "Sum of reinvestment_credit_cents from retirements EXECUTED in this fiscal year" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of unit_cost_cents of COMMITTED PurchaseCommitments" }
      - { name: delivered_spend_cents, type: integer, source: computed, default: 0, description: "Sum of unit_cost_cents of DELIVERED PurchaseCommitments" }
      - { name: available_cents, type: integer, source: computed, description: "opening_balance_cents + replenishment_cents - committed_cents - delivered_spend_cents" }

  - name: PurchaseCommitment
    parent: CapitalPool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> CapitalPool.id" }
      - { name: car_type, type: enum, source: input, description: "Car type to purchase (same enum as Railcar.car_type)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Committed cost", constraints: "> 0" }
      - { name: delivered_car_mark, type: string, source: system, description: "car_mark of the Railcar created at deliver; null until DELIVERED" }
      - { name: status, type: enum, source: system, description: "COMMITTED | DELIVERED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lessee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: automatic whenever outstanding_balance_cents > credit_limit_cents after any balance mutation"
        actor: system
        preconditions: ["outstanding_balance_cents > credit_limit_cents"]
        side_effects: ["status = SUSPENDED; new lease submits and new assignments for this lessee become blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lessees/{id}/reinstate"
        actor: LeaseAdmin
        preconditions: ["outstanding_balance_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"]
        side_effects: ["status = ACTIVE"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lessees/{id}/terminate"
        actor: LeaseAdmin
        preconditions: ["no LeaseAgreement for this lessee in DRAFT, PENDING_APPROVAL, or ACTIVE (ERR_LESSEE_HAS_OPEN_LEASES)"]
        side_effects: ["status = TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /lessees/{id}/terminate"
        actor: LeaseAdmin
        preconditions: ["no LeaseAgreement for this lessee in DRAFT, PENDING_APPROVAL, or ACTIVE (ERR_LESSEE_HAS_OPEN_LEASES)"]
        side_effects: ["status = TERMINATED"]

  - entity: Railcar
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ON_LEASE
        trigger: "system: POST /lease-assignments/{id}/deliver"
        actor: system
        preconditions: ["assignment SCHEDULED", "railcar AVAILABLE (overlapping future windows are blocked at assignment creation by ERR_ASSIGNMENT_OVERLAP, not by car state)"]
        side_effects: ["status = ON_LEASE"]
      - from: ON_LEASE
        to: IN_SHOP
        trigger: "system: POST /repair-authorizations/{id}/start-work with requires_shop=true"
        actor: system
        preconditions: ["repair APPROVED"]
        side_effects: ["status_before_shop = ON_LEASE", "status = IN_SHOP", "open_shop_repair_count += 1"]
      - from: AVAILABLE
        to: IN_SHOP
        trigger: "system: POST /repair-authorizations/{id}/start-work with requires_shop=true"
        actor: system
        preconditions: ["repair APPROVED"]
        side_effects: ["status_before_shop = AVAILABLE", "status = IN_SHOP", "open_shop_repair_count += 1"]
      - from: IN_SHOP
        to: AVAILABLE
        trigger: "system: POST /repair-authorizations/{id}/complete when open_shop_repair_count becomes 0 and status_before_shop == AVAILABLE"
        actor: system
        preconditions: []
        side_effects: ["open_shop_repair_count -= 1", "status = AVAILABLE", "status_before_shop = null"]
      - from: IN_SHOP
        to: ON_LEASE
        trigger: "system: POST /repair-authorizations/{id}/complete when open_shop_repair_count becomes 0 and status_before_shop == ON_LEASE"
        actor: system
        preconditions: []
        side_effects: ["open_shop_repair_count -= 1", "status = ON_LEASE", "status_before_shop = null"]
      - from: ON_LEASE
        to: AVAILABLE
        trigger: "system: POST /lease-assignments/{id}/return"
        actor: system
        preconditions: []
        side_effects: ["status = AVAILABLE", "last_commodity = assignment.planned_commodity"]
      - from: AVAILABLE
        to: RETIREMENT_PENDING
        trigger: "system: POST /retirement-cases/{id}/approve"
        actor: system
        preconditions: ["retirement case APPRAISED", "car AVAILABLE"]
        side_effects: ["status = RETIREMENT_PENDING"]
      - from: RETIREMENT_PENDING
        to: AVAILABLE
        trigger: "system: POST /retirement-cases/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: ["status = AVAILABLE"]
      - from: RETIREMENT_PENDING
        to: RETIRED
        trigger: "system: POST /retirement-cases/{id}/execute"
        actor: system
        preconditions: ["open CapitalPool exists for current fiscal year"]
        side_effects: ["status = RETIRED", "retired_at = current logical timestamp"]

  - entity: LeaseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /lease-agreements/{id}/submit"
        actor: LeaseAdmin
        preconditions: ["lessee.status == ACTIVE (ERR_LESSEE_NOT_ACTIVE)"]
        side_effects: ["submitted_by_user_id = X-User-ID"]
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /lease-agreements/{id}/approve"
        actor: ComplianceOfficer
        preconditions: ["end_date > start_date (ERR_INVALID_DATE_RANGE)", "lessee.status == ACTIVE (ERR_LESSEE_NOT_ACTIVE)"]
        side_effects: ["status = ACTIVE"]
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /lease-agreements/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["status = DRAFT (revision loop)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lease-agreements/{id}/terminate"
        actor: LeaseAdmin
        preconditions: []
        side_effects:
          - "early_termination_fee_cents = min(max(0, end_date - current_date in days), 90) * base_daily_rate_cents * 50% (round_half_up)"
          - "all SCHEDULED LeaseAssignments of this lease -> CANCELLED (reason LEASE_TERMINATED)"
          - "Lessee.outstanding_balance_cents += early_termination_fee_cents; Lessee auto-suspension re-evaluated"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock date > end_date (evaluated lazily whenever this lease is read or mutated)"
        actor: system
        preconditions: ["current logical date > end_date"]
        side_effects: ["status = EXPIRED; ON_LEASE assignments continue until returned"]

  - entity: LeaseAssignment
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_LEASE
        trigger: "POST /lease-assignments/{id}/deliver"
        actor: FleetPlanner
        preconditions: ["railcar.status == AVAILABLE (ERR_RAILCAR_NOT_AVAILABLE)"]
        side_effects: ["actual_on_lease_date = current logical date", "Railcar RESERVED -> ON_LEASE"]
      - from: ON_LEASE
        to: RETURNED
        trigger: "POST /lease-assignments/{id}/return"
        actor: FleetPlanner
        preconditions: ["railcar.status == ON_LEASE (ERR_RAILCAR_NOT_AVAILABLE - car still IN_SHOP)"]
        side_effects:
          - "actual_off_lease_date = current logical date"
          - "Railcar ON_LEASE -> AVAILABLE; Railcar.last_commodity = planned_commodity"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /lease-assignments/{id}/settle"
        actor: BillingAnalyst
        preconditions:
          - "assignment.status == RETURNED (ERR_ASSIGNMENT_NOT_RETURNED)"
          - "no RepairAuthorization for this assignment in UNDER_REVIEW, REVISION_REQUESTED, APPROVED, or IN_PROGRESS (ERR_OPEN_REPAIR_ORDERS)"
          - "every DamageAssessment for this assignment in FINALIZED, INVOICED, or PAID (ERR_DAMAGE_ASSESSMENT_OPEN)"
          - "no DamageAssessment for this assignment in INVOICED-but-unpaid (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "run calc_lease_proration -> billable_days, final_rent_cents, termination_fee_cents"
          - "Lessee.outstanding_balance_cents += final_rent_cents + termination_fee_cents; Lessee auto-suspension re-evaluated"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lease-assignments/{id}/cancel OR system cascade (directive promote / lease terminate)"
        actor: FleetPlanner
        preconditions: []
        side_effects: ["cancellation_reason set (LESSEE_REQUEST | DIRECTIVE_EFFECTIVE | LEASE_TERMINATED)"]

  - entity: MileageReport
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /mileage-reports/{id}/validate"
        actor: BillingAnalyst
        preconditions: []
        side_effects:
          - "validated_loaded_miles / validated_empty_miles = corrected values when supplied, else reported values"
          - "Railcar.cumulative_miles += (validated_loaded + validated_empty) - miles previously counted for this report (0 on first validation) per calc_cumulative_miles_conservation"
          - "recompute every PROVISIONAL CarHireStatement for (lease_assignment_id, report_month) per calc_car_hire_settlement (current-tariff variant, validated miles)"
      - from: VALIDATED
        to: DISPUTED
        trigger: "POST /mileage-reports/{id}/dispute"
        actor: BillingAnalyst
        preconditions: []
        side_effects: ["miles remain counted until resubmit + revalidation"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /mileage-reports/{id}/resubmit"
        actor: LesseeRep
        preconditions: ["X-User-ID == lease.lessee_id of the report's assignment (ERR_FORBIDDEN_ROLE)"]
        side_effects: ["loaded_miles/empty_miles replaced by resubmitted values; validated_* retained from last validation until revalidated"]

  - entity: CarHireStatement
    initial_state: PROVISIONAL
    terminal_states: [SETTLED]
    transitions:
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /car-hire-statements/{id}/dispute"
        actor: LesseeRep
        preconditions: ["X-User-ID == statement.lessee_id (ERR_FORBIDDEN_ROLE)"]
        side_effects: ["dispute_reason recorded"]
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /car-hire-statements/{id}/recompute"
        actor: BillingAnalyst
        preconditions: []
        side_effects: ["recompute per calc_car_hire_settlement (current-tariff variant, latest miles)"]
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /car-hire-statements/{id}/finalize"
        actor: BillingAnalyst
        preconditions: ["MileageReport for (lease_assignment_id, statement_month) exists and is VALIDATED (ERR_REPORT_NOT_VALIDATED)"]
        side_effects:
          - "final recompute per calc_car_hire_settlement (pinned-tariff variant, validated miles) -> final_net_cents, tariff_source = PINNED"
          - "Lessee.outstanding_balance_cents += final_net_cents"
          - "Lessee auto-suspension re-evaluated (balance > credit_limit -> SUSPENDED)"
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /car-hire-statements/{id}/settle"
        actor: BillingAnalyst
        preconditions: ["amount_cents == final_net_cents (ERR_PAYMENT_MISMATCH)"]
        side_effects: ["Lessee.outstanding_balance_cents -= amount_cents; Lessee auto-suspension re-evaluated"]

  - entity: RepairAuthorization
    initial_state: UNDER_REVIEW
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /repair-authorizations/{id}/approve"
        actor: MaintenanceController
        preconditions: ["if lessee_preauth_required then lessee_preauthorized == true (ERR_REPAIR_PREAUTH_REQUIRED)", "approved_amount_cents > 0 (ERR_VALIDATION)"]
        side_effects: ["approved_amount_cents set"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /repair-authorizations/{id}/request-revision"
        actor: MaintenanceController
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /repair-authorizations/{id}/revise"
        actor: MaintenanceController
        preconditions: ["estimate_cents > 0 (ERR_VALIDATION)"]
        side_effects: ["estimate_cents replaced", "revision_count += 1", "lessee/lessor share recomputed per calc_repair_responsibility_split", "lessee_preauth_required recomputed", "lessee_preauthorized reset to false"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /repair-authorizations/{id}/reject"
        actor: MaintenanceController
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /repair-authorizations/{id}/start-work"
        actor: MaintenanceController
        preconditions: ["if requires_shop: railcar.status in {AVAILABLE, ON_LEASE} (ERR_RAILCAR_NOT_AVAILABLE)"]
        side_effects: ["if requires_shop: Railcar -> IN_SHOP (status_before_shop saved, open_shop_repair_count += 1), shop_entry_date = current date"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /repair-authorizations/{id}/complete"
        actor: MaintenanceController
        preconditions: ["final_cost_cents > 0 (ERR_VALIDATION)"]
        side_effects:
          - "final_cost_cents set; lessee/lessor shares recomputed on final_cost_cents per calc_repair_responsibility_split"
          - "if lease_assignment_id present and lessee_share_cents > 0: Lessee.outstanding_balance_cents += lessee_share_cents; auto-suspension re-evaluated"
          - "if requires_shop: open_shop_repair_count -= 1; when count reaches 0 Railcar restores status_before_shop"
          - "completion_date = current date"

  - entity: CleaningRecord
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cleaning-records/{id}/complete"
        actor: MaintenanceController
        preconditions: ["cleaning_grade_performed satisfies cleaning_grade_required: STEAM_CLEAN satisfies both, WASH satisfies only WASH (ERR_VALIDATION)"]
        side_effects: ["cost_cents recorded"]
      - from: FAILED
        to: COMPLETED
        trigger: "POST /cleaning-records/{id}/complete"
        actor: MaintenanceController
        preconditions: ["cleaning_grade_performed satisfies cleaning_grade_required (ERR_VALIDATION)"]
        side_effects: ["cost_cents replaced (re-clean cycle)"]
      - from: COMPLETED
        to: CERTIFIED
        trigger: "POST /cleaning-records/{id}/certify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["certificate_ref set", "if bill_to == LESSEE: outstanding_balance_cents of the lessee on the car's most recent RETURNED/SETTLED assignment += cost_cents; auto-suspension re-evaluated"]
      - from: COMPLETED
        to: FAILED
        trigger: "POST /cleaning-records/{id}/fail"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: DamageAssessment
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /damage-assessments/{id}/submit"
        actor: MaintenanceController
        preconditions: ["line_items non-empty (ERR_VALIDATION)"]
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /damage-assessments/{id}/dispute"
        actor: LesseeRep
        preconditions: ["X-User-ID == lease.lessee_id of the assessment's assignment (ERR_FORBIDDEN_ROLE)"]
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /damage-assessments/{id}/resubmit"
        actor: MaintenanceController
        preconditions: ["line_items non-empty (ERR_VALIDATION)"]
        side_effects: ["line_items replaced (revision loop)"]
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /damage-assessments/{id}/finalize"
        actor: MaintenanceController
        preconditions: []
        side_effects: ["compute total_assessed_cents and lessee_liable_cents per calc_damage_billing_schedule (per-line rounding)"]
      - from: FINALIZED
        to: INVOICED
        trigger: "POST /damage-assessments/{id}/invoice"
        actor: BillingAnalyst
        preconditions: []
        side_effects: ["Lessee.outstanding_balance_cents += lessee_liable_cents; auto-suspension re-evaluated"]
      - from: INVOICED
        to: PAID
        trigger: "POST /damage-assessments/{id}/record-payment"
        actor: BillingAnalyst
        preconditions: ["amount_cents == lessee_liable_cents (ERR_PAYMENT_MISMATCH)"]
        side_effects: ["Lessee.outstanding_balance_cents -= amount_cents; auto-suspension re-evaluated"]

  - entity: ComplianceDirective
    initial_state: ANNOUNCED
    terminal_states: [EFFECTIVE]
    transitions:
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /compliance-directives/{id}/promote"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "effective_date = current logical date"
          - "hop 1: every Railcar with car_type in applies_to_car_types and no CERTIFIED RetrofitOrder for this directive -> compliance_posture NON_COMPLIANT"
          - "hop 2: every SCHEDULED LeaseAssignment on each such railcar -> CANCELLED (reason DIRECTIVE_EFFECTIVE)"

  - entity: RetrofitOrder
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEFERRED
        trigger: "POST /retrofit-orders/{id}/defer"
        actor: MaintenanceController
        preconditions: []
        side_effects: ["deferral_count += 1"]
      - from: DEFERRED
        to: SCHEDULED
        trigger: "POST /retrofit-orders/{id}/reschedule"
        actor: MaintenanceController
        preconditions: ["scheduled_date <= directive.retrofit_deadline (ERR_RETROFIT_DEADLINE_PASSED)"]
        side_effects: ["scheduled_date replaced (deferral cycle)"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /retrofit-orders/{id}/start"
        actor: MaintenanceController
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /retrofit-orders/{id}/complete"
        actor: MaintenanceController
        preconditions: []
        side_effects: ["completed_date = current date"]
      - from: COMPLETED
        to: CERTIFIED
        trigger: "POST /retrofit-orders/{id}/certify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["certification_ref set", "Railcar.compliance_posture recomputed: COMPLIANT when every EFFECTIVE directive covering the car type has a CERTIFIED retrofit for this car"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /retrofit-orders/{id}/cancel"
        actor: MaintenanceController
        preconditions: []
        side_effects: []
      - from: DEFERRED
        to: CANCELLED
        trigger: "POST /retrofit-orders/{id}/cancel"
        actor: MaintenanceController
        preconditions: []
        side_effects: []

  - entity: RetirementCase
    initial_state: PROPOSED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPRAISED
        trigger: "POST /retirement-cases/{id}/appraise"
        actor: FleetPlanner
        preconditions: []
        side_effects: ["impairment_loss_cents = max(0, book_value_cents - salvage_value_cents)", "reinvestment_credit_cents = salvage_value_cents"]
      - from: APPRAISED
        to: APPROVED
        trigger: "POST /retirement-cases/{id}/approve"
        actor: ComplianceOfficer
        preconditions: ["X-User-ID != proposer_user_id (ERR_SOD_VIOLATION)", "railcar.status == AVAILABLE (ERR_RETIREMENT_BLOCKED)"]
        side_effects: ["Railcar AVAILABLE -> RETIREMENT_PENDING"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /retirement-cases/{id}/execute"
        actor: FleetPlanner
        preconditions: ["CapitalPool with fiscal_year == current logical year exists (ERR_POOL_NOT_FOUND)"]
        side_effects:
          - "Railcar RETIREMENT_PENDING -> RETIRED; retired_at set"
          - "CapitalPool.replenishment_cents += reinvestment_credit_cents; available_cents recomputed per calc_capital_pool_available"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /retirement-cases/{id}/cancel"
        actor: FleetPlanner
        preconditions: []
        side_effects: []
      - from: APPRAISED
        to: CANCELLED
        trigger: "POST /retirement-cases/{id}/cancel"
        actor: FleetPlanner
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /retirement-cases/{id}/cancel"
        actor: FleetPlanner
        preconditions: []
        side_effects: ["Railcar RETIREMENT_PENDING -> AVAILABLE (compensation)"]

  - entity: PurchaseCommitment
    initial_state: COMMITTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: COMMITTED
        to: DELIVERED
        trigger: "POST /capital-pools/{poolId}/commitments/{id}/deliver"
        actor: FleetPlanner
        preconditions: []
        side_effects:
          - "CapitalPool.committed_cents -= unit_cost_cents; delivered_spend_cents += unit_cost_cents; available_cents recomputed"
          - "cascade-create Railcar(car_mark = delivered_car_mark input, car_type = commitment.car_type, built_year input) in AVAILABLE; delivered_car_mark recorded"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /capital-pools/{poolId}/commitments/{id}/cancel"
        actor: FleetPlanner
        preconditions: []
        side_effects: ["CapitalPool.committed_cents -= unit_cost_cents; available_cents recomputed (compensation)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: lease-amend-stale-version
    parent_entity: LeaseAgreement
    write_endpoint: "PATCH /lease-agreements/{id}"
    occ_field: "expected_lease_version"
    description: |
      Amending a LeaseAgreement whose version has advanced since the client last
      observed it is rejected. A lease in DRAFT or ACTIVE remains legitimately
      amendable, so a stale expected_lease_version is the only signal that another
      writer has already changed the terms the client based its amendment on.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tariff-amend-stale-version
    parent_entity: TariffRate
    write_endpoint: "PUT /tariff-rates/{id}"
    occ_field: "expected_tariff_version"
    description: |
      Amending a TariffRate window or rate whose version has advanced since the
      client last observed it is rejected; the client's view of the rate grid is
      stale even though the tariff remains editable.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pool-commit-stale-version
    parent_entity: CapitalPool
    write_endpoint: "POST /capital-pools/{id}/commitments"
    occ_field: "expected_pool_version"
    description: |
      Creating a PurchaseCommitment against a CapitalPool whose version has
      advanced since the client last observed available_cents is rejected; the
      affordability check must run against the client's observed pool version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All monetary math in integer cents; round_half_up at every pinned rounding step.
# =============================================================================
calculations:
  - name: calc_mileage_credit
    trigger: "invoked by calc_car_hire_settlement (provisional and final variants)"
    algorithm: tiered_pricing
    formula: |
      inputs: m (loaded miles used), M_prev (cumulative VALIDATED loaded miles on this
              lease in the calendar year of statement_month, excluding this statement),
              r (mileage credit rate cents/loaded-mile, variant-dependent source)
      full_miles  = min(m, max(0, HIGH_MILEAGE_THRESHOLD - M_prev))
      excess_miles = m - full_miles
      tier_excess_miles = excess_miles   # persisted on the statement
      uncapped_credit = full_miles * r + round_half_up(excess_miles * r * EXCESS_RATE_PCT / 100)
      return uncapped_credit
      Boundary: when M_prev + m == HIGH_MILEAGE_THRESHOLD exactly, excess_miles == 0
      (threshold is "miles BEYOND 120000", i.e. excess uses strict greater-than).
    input_set: "loaded miles only; empty miles never earn credit"
    constants:
      HIGH_MILEAGE_THRESHOLD: 120000
      EXCESS_RATE_PCT: 80
    precision: "integer cents, round_half_up at the excess-miles multiplication"

  - name: calc_car_hire_settlement
    trigger: "POST /car-hire-statements/generate (provisional), POST /mileage-reports/{id}/validate (provisional recompute), POST /car-hire-statements/{id}/recompute (provisional), POST /car-hire-statements/{id}/finalize (final variant)"
    algorithm: aggregation
    formula: |
      days_on_lease = count of calendar days of statement_month on which the assignment
        was on lease: from max(actual_on_lease_date, month_first) through
        min(actual_off_lease_date exclusive, month_last) inclusive; a car on lease the
        whole month of August contributes 31.
      daily_rate = variant tariff CAR_HIRE_BASE for railcar.car_type
      gross_car_hire_cents = days_on_lease * daily_rate                      # integer
      lessor_share_cents = round_half_up(gross_car_hire_cents * lease.car_hire_lessor_share_pct / 100)
      credit_raw = calc_mileage_credit(m, M_prev, r)                         # variant inputs below
      credit_cap_cents = round_half_up(gross_car_hire_cents * CREDIT_CAP_PCT / 100)
      mileage_credit_cents = min(credit_raw, credit_cap_cents)
      net = lessor_share_cents - mileage_credit_cents
      Statement fields: provisional variant writes days_on_lease, gross_car_hire_cents,
      loaded_miles_used, tier_excess_miles, mileage_credit_cents, provisional_net_cents
      with tariff_source CURRENT; final variant rewrites the same measured fields and
      writes final_net_cents with tariff_source PINNED.
    input_set: "assignments with status ON_LEASE, RETURNED, or SETTLED overlapping statement_month; exactly one statement per (lease_assignment_id, statement_month)"
    constants:
      CREDIT_CAP_PCT: 80
    precision: "integer cents, round_half_up at each multiplication step in the pinned order above"
    variants:
      - name: provisional
        when: "generation, validation-triggered recompute, and dispute recompute"
        difference: "daily_rate and r come from the TariffRate effective on the FIRST DAY of statement_month at compute time (CURRENT); m = latest reported loaded miles (validated loaded miles once the report is VALIDATED)"
      - name: final
        when: "finalize"
        difference: "daily_rate and r come from the assignment's pinned_car_hire_daily_cents / pinned_mileage_credit_cents snapshotted at assignment creation (PINNED); m = validated_loaded_miles (finalize requires VALIDATED report)"

  - name: calc_repair_responsibility_split
    trigger: "RepairAuthorization creation, revise, and complete (on estimate_cents or final_cost_cents respectively)"
    algorithm: constraint_propagation
    formula: |
      inputs: lease_type (of linked assignment's lease; if no lease_assignment_id, treat as FULL_SERVICE),
              defect_cause, cost_cents
      if defect_cause == LESSEE_DAMAGE:            lessee_share = cost_cents
      elif lease_type == NET:                      lessee_share = cost_cents
      elif defect_cause == PRE_EXISTING:           lessee_share = 0
      else:  # FULL_SERVICE + WEAR_AND_TEAR
        excess = max(0, cost_cents - WEAR_ALLOWANCE_CENTS)
        lessee_share = round_half_up(excess * WEAR_EXCESS_LESSEE_PCT / 100)
      lessor_share = cost_cents - lessee_share
      lessee_preauth_required = (lease_assignment_id present) and (lessee_share > lease.authorized_repair_cap_cents)
    input_set: "single repair authorization"
    constants:
      WEAR_ALLOWANCE_CENTS: 25000
      WEAR_EXCESS_LESSEE_PCT: 40
    precision: "integer cents, round_half_up on the excess-share multiplication"

  - name: calc_damage_billing_schedule
    trigger: "POST /damage-assessments/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      LABOR_RATE_CENTS = 14500 per hour; severity multipliers: MINOR 1.00, MODERATE 1.25, SEVERE 1.50
      PINNED ROUNDING ORDER (per-line, then sum — sum-then-round is WRONG):
      for each line:
        line_raw_cents = parts_cents + labor_hours * LABOR_RATE_CENTS * severity_multiplier
        line_cost_cents = round_half_up(line_raw_cents)
        if cause == LESSEE_DAMAGE and replaced == true and railcar.car_age_years >= BETTERMENT_AGE_YEARS:
          line_lessee_cents = round_half_up(line_cost_cents * (100 - BETTERMENT_PCT) / 100)
        elif cause == LESSEE_DAMAGE:
          line_lessee_cents = line_cost_cents
        else:
          line_lessee_cents = 0
      total_assessed_cents = sum(line_cost_cents over all lines)
      lessee_liable_cents = sum(line_lessee_cents over all lines)
    input_set: "all line_items of the assessment at finalize time"
    constants:
      LABOR_RATE_CENTS: 14500
      BETTERMENT_AGE_YEARS: 30
      BETTERMENT_PCT: 25
    precision: "integer cents; round_half_up PER LINE at both rounding steps, then sum rounded lines"

  - name: calc_lease_proration
    trigger: "POST /lease-assignments/{id}/settle"
    algorithm: chronological
    formula: |
      PINNED EVALUATION ORDER (breaks the apparent circle: responsibility must be known
      before excluded days, excluded days before billable days, billable days before rent;
      termination fee last, independent of rent):
      (1) for every COMPLETED RepairAuthorization on this assignment with requires_shop,
          determine responsibility per calc_repair_responsibility_split on final_cost_cents;
      (2) excluded_days = sum over those repairs where lessor_share_cents > 0 of
          days in [shop_entry_date, completion_date) clipped to the on-lease window;
      (3) raw_days = (actual_off_lease_date - actual_on_lease_date) in days
          (on-lease date inclusive, off-lease date exclusive);
      (4) billable_days = raw_days - excluded_days;
      (5) final_rent_cents = billable_days * lease.base_daily_rate_cents;
      (6) termination_fee_cents = lease.early_termination_fee_cents if lease.status == TERMINATED else 0.
    input_set: "the assignment being settled, its COMPLETED shop repairs, its lease"
    constants: {}
    precision: "integer days and cents; no rounding until step (5)"

  - name: calc_retrofit_penalty
    trigger: "GET /railcars/{id}/compliance (both variants computed on read against the logical clock)"
    algorithm: chronological
    formula: |
      For a railcar and an EFFECTIVE directive covering its car type with no CERTIFIED
      retrofit order for (railcar, directive):
        days_since_effective = (current_date - directive.effective_date) in days, floor 0
        ACCRUED (exposure variant):  accrued = days_since_effective * daily_penalty_cents
          (no grace, no cap — forward-looking exposure)
        ASSESSED (billing variant):  days_beyond_grace = max(0, days_since_effective - grace_days)
          assessed = min(days_beyond_grace * daily_penalty_cents, penalty_cap_cents)
      Railcar-level rollup sums over all such directives; COMPLIANT cars accrue 0.
    input_set: "EFFECTIVE directives whose applies_to_car_types contains the railcar's car_type and which lack a CERTIFIED RetrofitOrder for this railcar"
    constants: {}
    precision: "integer cents"
    variants:
      - name: accrued
        when: "exposure reporting"
        difference: "ignores grace_days and penalty_cap_cents; counts from effective_date"
      - name: assessed
        when: "penalty billing basis"
        difference: "counts only days beyond grace_days and is capped at penalty_cap_cents; a car certified within grace assesses 0"

  - name: calc_fleet_utilization
    trigger: "GET /fleet/utilization?month=YYYY-MM"
    algorithm: aggregation
    formula: |
      days_in_month = calendar days of month
      eligible_car_days = sum over railcars of days in month where the car was not yet
        RETIRED: cars with status != RETIRED contribute all days; RETIRED cars contribute
        days before retired_at's date; cars created mid-month contribute from created_at's date.
      on_lease_car_days = sum over LeaseAssignments with status ON_LEASE, RETURNED, or
        SETTLED of overlap days between [actual_on_lease_date, actual_off_lease_date or
        month end] and the month (on-lease date inclusive, off-lease date exclusive).
      utilization_pct = on_lease_car_days == 0 and eligible_car_days == 0 ? 0.0 :
        round_half_up(100 * on_lease_car_days / eligible_car_days, 2 decimals)
      EMPTY FLEET / zero eligible days -> utilization_pct = 0.0 (no division error).
    input_set: "all railcars and assignments"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: calc_capital_pool_available
    trigger: "commitment create / deliver / cancel; retirement execute; pool read"
    algorithm: waterfall_allocation
    formula: |
      available_cents = opening_balance_cents + replenishment_cents - committed_cents - delivered_spend_cents
      where committed_cents   = sum(unit_cost_cents) over PurchaseCommitments with status COMMITTED
            delivered_spend_cents = sum(unit_cost_cents) over status DELIVERED
            replenishment_cents   = sum(reinvestment_credit_cents) over RetirementCases EXECUTED
                                    in this pool's fiscal_year
      Commitment creation requires unit_cost_cents <= available_cents at the observed pool version.
      Invariant: commit(x) followed by cancel(x) restores available_cents exactly.
    input_set: "the pool, its commitments, retirements executed in its fiscal year"
    constants: {}
    precision: "integer cents"

  - name: calc_cumulative_miles_conservation
    trigger: "mileage validate (first time and after each resubmit)"
    algorithm: aggregation
    formula: |
      Railcar.cumulative_miles is the exact sum of (validated_loaded_miles +
      validated_empty_miles) over all VALIDATED or DISPUTED MileageReports of the car
      (DISPUTED reports keep their last validated miles until revalidation).
      Revalidation after resubmit contributes only the DELTA:
        cumulative_miles += (new_validated_total) - (previous_validated_total)
      Conservation invariant: a validate -> dispute -> resubmit -> validate round trip
      leaves cumulative_miles equal to the sum over current validated values, with no
      double counting.
    input_set: "all MileageReports of the railcar with a non-null validated mile pair"
    constants: {}
    precision: "integer miles"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: LesseeRep's X-User-ID equals the lessee_id owning the target resource (statement.lessee_id, or lease.lessee_id via assignment) ; SoD: retirement approver X-User-ID != proposer_user_id", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "LesseeRep-scoped endpoints; ERR_SOD_VIOLATION (403) applies to POST /retirement-cases/{id}/approve instead", }
  - { priority: 4, category: existence, check: "path identifiers resolve left-to-right (lessee, railcar, lease, assignment, report, statement, repair, cleaning, assessment, directive, retrofit, retirement, pool, commitment)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids; domain variants ERR_LESSEE_NOT_FOUND, ERR_RAILCAR_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND, ERR_REPAIR_NOT_FOUND, ERR_CLEANING_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_DIRECTIVE_NOT_FOUND, ERR_RETROFIT_NOT_FOUND, ERR_RETIREMENT_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND name the failing segment" }
  - { priority: 5, category: existence, check: "request body shape: required fields present, types correct, enum membership valid, numeric ranges respected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 6, category: state, check: "target entity in a state from which the requested transition exists", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "cross-entity state gates: lease ACTIVE for new assignments (ERR_LEASE_NOT_ACTIVE); railcar AVAILABLE for new assignments and for deliver, ON_LEASE for return (ERR_RAILCAR_NOT_AVAILABLE); lessee ACTIVE for lease submit/approve and new assignments (ERR_LESSEE_NOT_ACTIVE); assignment RETURNED for settle (ERR_ASSIGNMENT_NOT_RETURNED); statement PROVISIONAL for finalize (ERR_STATEMENT_NOT_PROVISIONAL); report VALIDATED before statement finalize (ERR_REPORT_NOT_VALIDATED); assessments finalized+ and repairs closed before settle (ERR_DAMAGE_ASSESSMENT_OPEN / ERR_OPEN_REPAIR_ORDERS); railcar AVAILABLE for retirement approval (ERR_RETIREMENT_BLOCKED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state-gated action endpoints" }
  - { priority: 8, category: business_safety, check: "fleet safety on assignment creation: railcar.car_age_years >= 50 rejected (ERR_AGE_LIMIT_EXCEEDED, >= is the trigger); railcar.compliance_posture == NON_COMPLIANT rejected (ERR_TANK_CAR_NONCOMPLIANT); planned_commodity differs from railcar.last_commodity (not NONE) without a CERTIFIED CleaningRecord created after the car's last return rejected (ERR_COMMODITY_INCOMPATIBLE)", error_id: ERR_AGE_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /lease-assignments" }
  - { priority: 9, category: business_referential, check: "tariff coverage: CAR_HIRE_BASE and MILEAGE_CREDIT TariffRates covering scheduled_start exist for the car type, snapshotted onto the assignment (ERR_TARIFF_NOT_FOUND)", error_id: ERR_TARIFF_NOT_FOUND, http_status: 422, applies_to: "POST /lease-assignments" }
  - { priority: 10, category: business_temporal, check: "date sanity: end >= start for leases (end > start), tariffs (to > from), assignments (end >= start) (ERR_INVALID_DATE_RANGE); assignment window inside lease term (ERR_OUTSIDE_LEASE_TERM); assignment inclusive-window overlap on same railcar among SCHEDULED/ON_LEASE/RETURNED (ERR_ASSIGNMENT_OVERLAP); commodity-change turnaround buffer: planned_commodity != railcar.last_commodity (not NONE) requires scheduled_start >= previous assignment scheduled_end + 3 days even when cleaning is CERTIFIED (ERR_CLEANING_BUFFER_VIOLATION); tariff half-open window overlap per (car_type, rate_kind), adjacency allowed (ERR_TARIFF_WINDOW_OVERLAP); report_month must be a month the assignment was on lease (ERR_REPORT_MONTH_MISMATCH); retrofit scheduled_date <= directive.retrofit_deadline (ERR_RETROFIT_DEADLINE_PASSED)", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "date-bearing endpoints" }
  - { priority: 11, category: business_constraint, check: "uniqueness: railcar car_mark (ERR_DUPLICATE_CAR_MARK), directive_code (ERR_DUPLICATE_DIRECTIVE_CODE), pool fiscal_year (ERR_DUPLICATE_POOL_YEAR), one non-DISPUTED mileage report per (railcar_id, report_month) (ERR_DUPLICATE_REPORT_MONTH); retirement approver != proposer (ERR_SOD_VIOLATION)", error_id: ERR_DUPLICATE_CAR_MARK, http_status: 409, applies_to: "creation endpoints and retirement approve" }
  - { priority: 12, category: business_fiscal, check: "lessee.outstanding_balance_cents <= credit_limit_cents to create an assignment (ERR_CREDIT_LIMIT_EXCEEDED); commitment unit_cost_cents <= pool.available_cents at observed version (ERR_CAPITAL_POOL_INSUFFICIENT); repair approve requires lessee preauthorization when lessee_preauth_required (ERR_REPAIR_PREAUTH_REQUIRED); settle requires no INVOICED-unpaid assessment on the assignment (ERR_OUTSTANDING_BALANCE); reinstate requires balance <= credit limit (ERR_CREDIT_LIMIT_EXCEEDED); payment amounts must match exactly (ERR_PAYMENT_MISMATCH)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "fiscally-gated endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z before first set) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Advance the logical clock; before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lease EXPIRED lazy evaluation armed"] }

  # --- Lessee ---
  - { method: POST, path: "/lessees", description: "Register a lessee", roles: [LeaseAdmin], code: 201, input: [company_name, credit_tier, credit_limit_cents, security_deposit_cents], output: Lessee, side_effects: ["status = ACTIVE", "outstanding_balance_cents = 0"] }
  - { method: GET, path: "/lessees/{id}", description: "Get a lessee", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: Lessee, side_effects: [] }
  - { method: POST, path: "/lessees/{id}/reinstate", description: "Reinstate a suspended lessee", roles: [LeaseAdmin], code: 200, input: [], output: Lessee, side_effects: ["SUSPENDED -> ACTIVE when balance <= credit limit"] }
  - { method: POST, path: "/lessees/{id}/terminate", description: "Terminate a lessee with no open leases", roles: [LeaseAdmin], code: 200, input: [], output: Lessee, side_effects: ["-> TERMINATED"] }

  # --- Railcar ---
  - { method: POST, path: "/railcars", description: "Register a railcar", roles: [FleetPlanner], code: 201, input: [car_mark, car_type, built_year], output: Railcar, side_effects: ["status = AVAILABLE", "compliance_posture = COMPLIANT"] }
  - { method: GET, path: "/railcars", description: "List railcars with filters and pagination", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer], code: 200, input: ["status?", "car_type?", "compliance_posture?", "limit?", "offset?"], output: "Railcar[]", side_effects: [] }
  - { method: GET, path: "/railcars/{id}", description: "Get a railcar", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: Railcar, side_effects: [] }
  - { method: GET, path: "/railcars/{id}/compliance", description: "Computed compliance view incl. both penalty variants", roles: [SystemAdmin, FleetPlanner, MaintenanceController, ComplianceOfficer, BillingAnalyst], code: 200, input: [], output: { car_id: string, posture: string, open_directive_ids: "string[]", days_since_oldest_effective: integer, accrued_penalty_cents: integer, assessed_penalty_cents: integer }, side_effects: ["runs calc_retrofit_penalty (both variants)"] }
  - { method: GET, path: "/fleet/utilization", description: "Fleet utilization for a month per calc_fleet_utilization", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst], code: 200, input: [month], output: { month: string, on_lease_car_days: integer, eligible_car_days: integer, utilization_pct: number }, side_effects: [] }

  # --- TariffRate ---
  - { method: POST, path: "/tariff-rates", description: "Create a tariff window (half-open [effective_from, effective_to))", roles: [LeaseAdmin], code: 201, input: [car_type, rate_kind, effective_from, effective_to, unit_rate_cents], output: TariffRate, side_effects: ["overlap with existing window of same (car_type, rate_kind) rejected"] }
  - { method: GET, path: "/tariff-rates", description: "List tariffs", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer], code: 200, input: ["car_type?", "rate_kind?", "limit?", "offset?"], output: "TariffRate[]", side_effects: [] }
  - { method: GET, path: "/tariff-rates/{id}", description: "Get a tariff", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer], code: 200, input: [], output: TariffRate, side_effects: [] }
  - { method: PUT, path: "/tariff-rates/{id}", description: "Amend a tariff window/rate (OCC on version)", roles: [LeaseAdmin], code: 200, input: ["unit_rate_cents?", "effective_from?", "effective_to?", expected_tariff_version], output: TariffRate, side_effects: ["increments TariffRate.version by 1", "overlap re-validated on amended window"] }

  # --- LeaseAgreement ---
  - { method: POST, path: "/lease-agreements", description: "Create a lease in DRAFT", roles: [LeaseAdmin], code: 201, input: [lessee_id, lease_type, base_daily_rate_cents, car_hire_lessor_share_pct, authorized_repair_cap_cents, start_date, end_date], output: LeaseAgreement, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/lease-agreements", description: "List leases (filtered)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer], code: 200, input: ["lessee_id?", "status?", "limit?", "offset?"], output: "LeaseAgreement[]", side_effects: [] }
  - { method: GET, path: "/lease-agreements/{id}", description: "Get a lease (lazy EXPIRED evaluation)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: LeaseAgreement, side_effects: ["ACTIVE -> EXPIRED when current date > end_date"] }
  - { method: POST, path: "/lease-agreements/{id}/submit", description: "Submit lease for approval", roles: [LeaseAdmin], code: 200, input: [], output: LeaseAgreement, side_effects: ["DRAFT -> PENDING_APPROVAL"] }
  - { method: POST, path: "/lease-agreements/{id}/approve", description: "Approve lease", roles: [ComplianceOfficer], code: 200, input: [], output: LeaseAgreement, side_effects: ["PENDING_APPROVAL -> ACTIVE"] }
  - { method: POST, path: "/lease-agreements/{id}/reject", description: "Reject lease back to DRAFT", roles: [ComplianceOfficer], code: 200, input: [], output: LeaseAgreement, side_effects: ["PENDING_APPROVAL -> DRAFT"] }
  - { method: PATCH, path: "/lease-agreements/{id}", description: "Amend lease terms (OCC on version); allowed in DRAFT or ACTIVE", roles: [LeaseAdmin], code: 200, input: ["base_daily_rate_cents?", "car_hire_lessor_share_pct?", "authorized_repair_cap_cents?", "end_date?", expected_lease_version], output: LeaseAgreement, side_effects: ["increments LeaseAgreement.version by 1", "amendments do not alter already-pinned assignment snapshots"] }
  - { method: POST, path: "/lease-agreements/{id}/terminate", description: "Early-terminate an ACTIVE lease", roles: [LeaseAdmin], code: 200, input: [], output: LeaseAgreement, side_effects: ["ACTIVE -> TERMINATED", "termination fee computed and billed", "SCHEDULED assignments cancelled"] }
  - { method: GET, path: "/lease-agreements/{id}/assignments", description: "Assignments of a lease", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "LeaseAssignment[]", side_effects: [] }

  # --- LeaseAssignment ---
  - { method: POST, path: "/lease-assignments", description: "Assign a railcar to a lease (full §1.4 validation chain; pins tariff snapshot)", roles: [FleetPlanner], code: 201, input: [lease_id, railcar_id, planned_commodity, scheduled_start, scheduled_end], output: LeaseAssignment, side_effects: ["status = SCHEDULED", "pinned_car_hire_daily_cents / pinned_mileage_credit_cents snapshotted from tariffs effective at scheduled_start"] }
  - { method: GET, path: "/lease-assignments", description: "List assignments (filtered; FK reverse for lease_id and railcar_id)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer], code: 200, input: ["lease_id?", "railcar_id?", "status?", "limit?", "offset?"], output: "LeaseAssignment[]", side_effects: [] }
  - { method: GET, path: "/lease-assignments/{id}", description: "Get an assignment", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: LeaseAssignment, side_effects: [] }
  - { method: POST, path: "/lease-assignments/{id}/deliver", description: "Deliver car to lessee", roles: [FleetPlanner], code: 200, input: [], output: LeaseAssignment, side_effects: ["SCHEDULED -> ON_LEASE", "Railcar RESERVED -> ON_LEASE", "actual_on_lease_date set"] }
  - { method: POST, path: "/lease-assignments/{id}/return", description: "Take car off lease; opens damage inspection", roles: [FleetPlanner], code: 200, input: [], output: LeaseAssignment, side_effects: ["ON_LEASE -> RETURNED", "Railcar ON_LEASE -> AVAILABLE + last_commodity updated", "DamageAssessment DRAFT cascade-created"] }
  - { method: POST, path: "/lease-assignments/{id}/settle", description: "Close billing on a returned assignment", roles: [BillingAnalyst], code: 200, input: [], output: LeaseAssignment, side_effects: ["RETURNED -> SETTLED", "calc_lease_proration", "rent + termination fee billed to lessee balance"] }
  - { method: POST, path: "/lease-assignments/{id}/cancel", description: "Cancel a scheduled assignment", roles: [FleetPlanner], code: 200, input: [], output: LeaseAssignment, side_effects: ["SCHEDULED -> CANCELLED (LESSEE_REQUEST)", "Railcar RESERVED -> AVAILABLE"] }

  # --- MileageReport ---
  - { method: POST, path: "/mileage-reports", description: "Lessee submits monthly mileage", roles: [LesseeRep], code: 201, input: [railcar_id, lease_assignment_id, report_month, loaded_miles, empty_miles], output: MileageReport, side_effects: ["status = SUBMITTED"] }
  - { method: GET, path: "/mileage-reports", description: "List mileage reports (filtered; FK reverse)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: ["railcar_id?", "lease_assignment_id?", "report_month?", "status?", "limit?", "offset?"], output: "MileageReport[]", side_effects: [] }
  - { method: GET, path: "/mileage-reports/{id}", description: "Get a mileage report", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: MileageReport, side_effects: [] }
  - { method: POST, path: "/mileage-reports/{id}/validate", description: "Validate (optionally correcting) reported miles", roles: [BillingAnalyst], code: 200, input: ["validated_loaded_miles?", "validated_empty_miles?"], output: MileageReport, side_effects: ["SUBMITTED -> VALIDATED", "calc_cumulative_miles_conservation", "PROVISIONAL statement recompute"] }
  - { method: POST, path: "/mileage-reports/{id}/dispute", description: "Billing disputes a validated report", roles: [BillingAnalyst], code: 200, input: [reason], output: MileageReport, side_effects: ["VALIDATED -> DISPUTED"] }
  - { method: POST, path: "/mileage-reports/{id}/resubmit", description: "Lessee resubmits corrected miles", roles: [LesseeRep], code: 200, input: [loaded_miles, empty_miles], output: MileageReport, side_effects: ["DISPUTED -> SUBMITTED"] }

  # --- CarHireStatement ---
  - { method: POST, path: "/car-hire-statements/generate", description: "Generate provisional statements for a month, one per on-lease assignment, ordered by assignment created_at ASC; existing statements for the same (assignment, month) are skipped", roles: [BillingAnalyst], code: 201, input: [statement_month], output: "CarHireStatement[]", side_effects: ["calc_car_hire_settlement provisional variant per new statement"] }
  - { method: GET, path: "/car-hire-statements", description: "List statements (filtered; FK reverse for assignment, railcar, lessee)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: ["lease_assignment_id?", "railcar_id?", "lessee_id?", "statement_month?", "status?", "limit?", "offset?"], output: "CarHireStatement[]", side_effects: [] }
  - { method: GET, path: "/car-hire-statements/{id}", description: "Get a statement", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: CarHireStatement, side_effects: [] }
  - { method: POST, path: "/car-hire-statements/{id}/finalize", description: "Finalize with pinned tariffs and validated miles", roles: [BillingAnalyst], code: 200, input: [], output: CarHireStatement, side_effects: ["PROVISIONAL -> FINALIZED", "calc_car_hire_settlement final variant", "lessee balance += final_net_cents; suspension re-evaluated"] }
  - { method: POST, path: "/car-hire-statements/{id}/dispute", description: "Lessee disputes a provisional statement", roles: [LesseeRep], code: 200, input: [dispute_reason], output: CarHireStatement, side_effects: ["PROVISIONAL -> DISPUTED"] }
  - { method: POST, path: "/car-hire-statements/{id}/recompute", description: "Recompute a disputed statement back to PROVISIONAL", roles: [BillingAnalyst], code: 200, input: [], output: CarHireStatement, side_effects: ["DISPUTED -> PROVISIONAL", "calc_car_hire_settlement provisional variant"] }
  - { method: POST, path: "/car-hire-statements/{id}/settle", description: "Record exact payment of a finalized statement", roles: [BillingAnalyst], code: 200, input: [amount_cents], output: CarHireStatement, side_effects: ["FINALIZED -> SETTLED", "lessee balance -= amount_cents; suspension re-evaluated"] }

  # --- RepairAuthorization ---
  - { method: POST, path: "/repair-authorizations", description: "Open a repair authorization (enters UNDER_REVIEW)", roles: [MaintenanceController], code: 201, input: [railcar_id, "lease_assignment_id?", defect_description, defect_cause, estimate_cents, requires_shop], output: RepairAuthorization, side_effects: ["calc_repair_responsibility_split on estimate", "lessee_preauth_required computed"] }
  - { method: GET, path: "/repair-authorizations", description: "List repairs (filtered; FK reverse)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: ["railcar_id?", "lease_assignment_id?", "status?", "limit?", "offset?"], output: "RepairAuthorization[]", side_effects: [] }
  - { method: GET, path: "/repair-authorizations/{id}", description: "Get a repair", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: RepairAuthorization, side_effects: [] }
  - { method: POST, path: "/repair-authorizations/{id}/preauthorize", description: "Lessee pre-authorizes its share above the cap", roles: [LesseeRep], code: 200, input: [], output: RepairAuthorization, side_effects: ["lessee_preauthorized = true"] }
  - { method: POST, path: "/repair-authorizations/{id}/approve", description: "Approve estimate", roles: [MaintenanceController], code: 200, input: [approved_amount_cents], output: RepairAuthorization, side_effects: ["UNDER_REVIEW -> APPROVED"] }
  - { method: POST, path: "/repair-authorizations/{id}/request-revision", description: "Send estimate back for revision", roles: [MaintenanceController], code: 200, input: [notes], output: RepairAuthorization, side_effects: ["UNDER_REVIEW -> REVISION_REQUESTED"] }
  - { method: POST, path: "/repair-authorizations/{id}/revise", description: "Submit revised estimate", roles: [MaintenanceController], code: 200, input: [estimate_cents], output: RepairAuthorization, side_effects: ["REVISION_REQUESTED -> UNDER_REVIEW", "revision_count += 1", "split recomputed", "preauthorization reset"] }
  - { method: POST, path: "/repair-authorizations/{id}/reject", description: "Reject the repair", roles: [MaintenanceController], code: 200, input: [reason], output: RepairAuthorization, side_effects: ["UNDER_REVIEW -> REJECTED"] }
  - { method: POST, path: "/repair-authorizations/{id}/start-work", description: "Begin work; shops the car when requires_shop", roles: [MaintenanceController], code: 200, input: [], output: RepairAuthorization, side_effects: ["APPROVED -> IN_PROGRESS", "Railcar -> IN_SHOP when requires_shop"] }
  - { method: POST, path: "/repair-authorizations/{id}/complete", description: "Complete work at final cost", roles: [MaintenanceController], code: 200, input: [final_cost_cents], output: RepairAuthorization, side_effects: ["IN_PROGRESS -> COMPLETED", "split recomputed on final cost", "lessee share billed to balance", "railcar released from shop when count hits 0"] }

  # --- CleaningRecord ---
  - { method: POST, path: "/cleaning-records", description: "Schedule a cleaning event", roles: [MaintenanceController], code: 201, input: [railcar_id, prior_commodity, next_commodity, planned_date, "attributable_to_lessee?"], output: CleaningRecord, side_effects: ["status = SCHEDULED", "cleaning_grade_required and bill_to computed"] }
  - { method: GET, path: "/cleaning-records", description: "List cleaning records (filtered; FK reverse)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, ComplianceOfficer], code: 200, input: ["railcar_id?", "status?", "limit?", "offset?"], output: "CleaningRecord[]", side_effects: [] }
  - { method: GET, path: "/cleaning-records/{id}", description: "Get a cleaning record", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, ComplianceOfficer], code: 200, input: [], output: CleaningRecord, side_effects: [] }
  - { method: POST, path: "/cleaning-records/{id}/complete", description: "Record performed cleaning (from SCHEDULED or FAILED)", roles: [MaintenanceController], code: 200, input: [cleaning_grade_performed, cost_cents], output: CleaningRecord, side_effects: ["-> COMPLETED"] }
  - { method: POST, path: "/cleaning-records/{id}/certify", description: "Certify a completed cleaning", roles: [ComplianceOfficer], code: 200, input: [certificate_ref], output: CleaningRecord, side_effects: ["COMPLETED -> CERTIFIED", "lessee billed when bill_to == LESSEE"] }
  - { method: POST, path: "/cleaning-records/{id}/fail", description: "Fail inspection of a completed cleaning", roles: [ComplianceOfficer], code: 200, input: [reason], output: CleaningRecord, side_effects: ["COMPLETED -> FAILED"] }

  # --- DamageAssessment ---
  - { method: POST, path: "/damage-assessments", description: "Create a damage assessment in DRAFT", roles: [MaintenanceController], code: 201, input: [lease_assignment_id, railcar_id], output: DamageAssessment, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/damage-assessments", description: "List assessments (filtered; FK reverse)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: ["lease_assignment_id?", "railcar_id?", "status?", "limit?", "offset?"], output: "DamageAssessment[]", side_effects: [] }
  - { method: GET, path: "/damage-assessments/{id}", description: "Get an assessment", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer, LesseeRep], code: 200, input: [], output: DamageAssessment, side_effects: [] }
  - { method: POST, path: "/damage-assessments/{id}/submit", description: "Submit line items", roles: [MaintenanceController], code: 200, input: [line_items], output: DamageAssessment, side_effects: ["DRAFT -> SUBMITTED"] }
  - { method: POST, path: "/damage-assessments/{id}/dispute", description: "Lessee disputes submitted assessment", roles: [LesseeRep], code: 200, input: [reason], output: DamageAssessment, side_effects: ["SUBMITTED -> DISPUTED"] }
  - { method: POST, path: "/damage-assessments/{id}/resubmit", description: "Submit revised line items after dispute", roles: [MaintenanceController], code: 200, input: [line_items], output: DamageAssessment, side_effects: ["DISPUTED -> SUBMITTED"] }
  - { method: POST, path: "/damage-assessments/{id}/finalize", description: "Freeze totals (per-line rounding)", roles: [MaintenanceController], code: 200, input: [], output: DamageAssessment, side_effects: ["SUBMITTED -> FINALIZED", "calc_damage_billing_schedule"] }
  - { method: POST, path: "/damage-assessments/{id}/invoice", description: "Invoice the lessee share", roles: [BillingAnalyst], code: 200, input: [], output: DamageAssessment, side_effects: ["FINALIZED -> INVOICED", "lessee balance += lessee_liable_cents"] }
  - { method: POST, path: "/damage-assessments/{id}/record-payment", description: "Record exact payment", roles: [BillingAnalyst], code: 200, input: [amount_cents], output: DamageAssessment, side_effects: ["INVOICED -> PAID", "lessee balance -= amount_cents"] }

  # --- ComplianceDirective / RetrofitOrder ---
  - { method: POST, path: "/compliance-directives", description: "Announce a regulatory directive", roles: [ComplianceOfficer], code: 201, input: [directive_code, description, applies_to_car_types, retrofit_deadline, "grace_days?", daily_penalty_cents, penalty_cap_cents], output: ComplianceDirective, side_effects: ["status = ANNOUNCED", "matching railcars without CERTIFIED retrofit -> RETROFIT_DUE"] }
  - { method: GET, path: "/compliance-directives", description: "List directives", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "ComplianceDirective[]", side_effects: [] }
  - { method: GET, path: "/compliance-directives/{id}", description: "Get a directive", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, MaintenanceController, BillingAnalyst, ComplianceOfficer], code: 200, input: [], output: ComplianceDirective, side_effects: [] }
  - { method: POST, path: "/compliance-directives/{id}/promote", description: "Make directive effective (3-hop cascade)", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceDirective, side_effects: ["ANNOUNCED -> EFFECTIVE", "posture recompute", "SCHEDULED assignments on non-compliant cars cancelled"] }
  - { method: POST, path: "/retrofit-orders", description: "Schedule a retrofit for a car under a directive", roles: [MaintenanceController], code: 201, input: [railcar_id, directive_id, scheduled_date], output: RetrofitOrder, side_effects: ["status = SCHEDULED"] }
  - { method: GET, path: "/retrofit-orders", description: "List retrofit orders (filtered; FK reverse)", roles: [SystemAdmin, FleetPlanner, MaintenanceController, ComplianceOfficer], code: 200, input: ["railcar_id?", "directive_id?", "status?", "limit?", "offset?"], output: "RetrofitOrder[]", side_effects: [] }
  - { method: GET, path: "/retrofit-orders/{id}", description: "Get a retrofit order", roles: [SystemAdmin, FleetPlanner, MaintenanceController, ComplianceOfficer], code: 200, input: [], output: RetrofitOrder, side_effects: [] }
  - { method: POST, path: "/retrofit-orders/{id}/defer", description: "Defer a scheduled retrofit", roles: [MaintenanceController], code: 200, input: [reason], output: RetrofitOrder, side_effects: ["SCHEDULED -> DEFERRED", "deferral_count += 1"] }
  - { method: POST, path: "/retrofit-orders/{id}/reschedule", description: "Reschedule a deferred retrofit", roles: [MaintenanceController], code: 200, input: [scheduled_date], output: RetrofitOrder, side_effects: ["DEFERRED -> SCHEDULED"] }
  - { method: POST, path: "/retrofit-orders/{id}/start", description: "Start retrofit work", roles: [MaintenanceController], code: 200, input: [], output: RetrofitOrder, side_effects: ["SCHEDULED -> IN_PROGRESS"] }
  - { method: POST, path: "/retrofit-orders/{id}/complete", description: "Complete retrofit work", roles: [MaintenanceController], code: 200, input: [], output: RetrofitOrder, side_effects: ["IN_PROGRESS -> COMPLETED"] }
  - { method: POST, path: "/retrofit-orders/{id}/certify", description: "Certify completed retrofit", roles: [ComplianceOfficer], code: 200, input: [certification_ref], output: RetrofitOrder, side_effects: ["COMPLETED -> CERTIFIED", "railcar posture recomputed"] }
  - { method: POST, path: "/retrofit-orders/{id}/cancel", description: "Cancel a scheduled/deferred retrofit", roles: [MaintenanceController], code: 200, input: [], output: RetrofitOrder, side_effects: ["-> CANCELLED"] }

  # --- RetirementCase / CapitalPool / PurchaseCommitment ---
  - { method: POST, path: "/retirement-cases", description: "Propose retiring a railcar", roles: [FleetPlanner], code: 201, input: [railcar_id, reason], output: RetirementCase, side_effects: ["status = PROPOSED", "proposer_user_id = X-User-ID"] }
  - { method: GET, path: "/retirement-cases", description: "List retirement cases (filtered; FK reverse)", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, ComplianceOfficer], code: 200, input: ["railcar_id?", "status?", "limit?", "offset?"], output: "RetirementCase[]", side_effects: [] }
  - { method: GET, path: "/retirement-cases/{id}", description: "Get a retirement case", roles: [SystemAdmin, LeaseAdmin, FleetPlanner, ComplianceOfficer], code: 200, input: [], output: RetirementCase, side_effects: [] }
  - { method: POST, path: "/retirement-cases/{id}/appraise", description: "Record salvage and book values", roles: [FleetPlanner], code: 200, input: [salvage_value_cents, book_value_cents], output: RetirementCase, side_effects: ["PROPOSED -> APPRAISED", "impairment_loss_cents and reinvestment_credit_cents computed"] }
  - { method: POST, path: "/retirement-cases/{id}/approve", description: "Approve retirement (SoD: approver != proposer)", roles: [ComplianceOfficer], code: 200, input: [], output: RetirementCase, side_effects: ["APPRAISED -> APPROVED", "Railcar -> RETIREMENT_PENDING"] }
  - { method: POST, path: "/retirement-cases/{id}/execute", description: "Execute retirement; replenishes capital pool", roles: [FleetPlanner], code: 200, input: [], output: RetirementCase, side_effects: ["APPROVED -> EXECUTED", "Railcar -> RETIRED", "pool replenishment"] }
  - { method: POST, path: "/retirement-cases/{id}/cancel", description: "Cancel a non-executed retirement", roles: [FleetPlanner], code: 200, input: [], output: RetirementCase, side_effects: ["-> CANCELLED", "railcar released from RETIREMENT_PENDING when APPROVED"] }
  - { method: POST, path: "/capital-pools", description: "Open a reinvestment capital pool for a fiscal year", roles: [SystemAdmin], code: 201, input: [fiscal_year, opening_balance_cents], output: CapitalPool, side_effects: ["available_cents = opening_balance_cents"] }
  - { method: GET, path: "/capital-pools/{id}", description: "Get a capital pool", roles: [SystemAdmin, FleetPlanner, ComplianceOfficer, BillingAnalyst], code: 200, input: [], output: CapitalPool, side_effects: [] }
  - { method: POST, path: "/capital-pools/{id}/commitments", description: "Commit pool funds to a replacement car (OCC on pool version)", roles: [FleetPlanner], code: 201, input: [car_type, unit_cost_cents, expected_pool_version], output: PurchaseCommitment, side_effects: ["increments CapitalPool.version by 1", "committed_cents += unit_cost_cents", "available_cents recomputed"] }
  - { method: GET, path: "/capital-pools/{id}/commitments", description: "List commitments of a pool", roles: [SystemAdmin, FleetPlanner, ComplianceOfficer, BillingAnalyst], code: 200, input: ["status?", "limit?", "offset?"], output: "PurchaseCommitment[]", side_effects: [] }
  - { method: GET, path: "/capital-pools/{poolId}/commitments/{id}", description: "Get a commitment", roles: [SystemAdmin, FleetPlanner, ComplianceOfficer, BillingAnalyst], code: 200, input: [], output: PurchaseCommitment, side_effects: [] }
  - { method: POST, path: "/capital-pools/{poolId}/commitments/{id}/deliver", description: "Deliver the replacement car", roles: [FleetPlanner], code: 200, input: [car_mark, built_year], output: PurchaseCommitment, side_effects: ["COMMITTED -> DELIVERED", "committed -> delivered_spend", "new Railcar created AVAILABLE"] }
  - { method: POST, path: "/capital-pools/{poolId}/commitments/{id}/cancel", description: "Cancel a commitment (funds restored)", roles: [FleetPlanner], code: 200, input: [], output: PurchaseCommitment, side_effects: ["COMMITTED -> CANCELLED", "committed_cents -= unit_cost_cents"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for endpoint, or LesseeRep acting on a resource owned by another lessee" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Retirement approver X-User-ID equals proposer_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic path identifier miss" }
  - { id: ERR_LESSEE_NOT_FOUND, http: 404, condition: "lessee id does not resolve" }
  - { id: ERR_RAILCAR_NOT_FOUND, http: 404, condition: "railcar id does not resolve" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "lease id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not resolve" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "mileage report id does not resolve" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "statement id does not resolve" }
  - { id: ERR_REPAIR_NOT_FOUND, http: 404, condition: "repair authorization id does not resolve" }
  - { id: ERR_CLEANING_NOT_FOUND, http: 404, condition: "cleaning record id does not resolve" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "damage assessment id does not resolve" }
  - { id: ERR_DIRECTIVE_NOT_FOUND, http: 404, condition: "directive id does not resolve" }
  - { id: ERR_RETROFIT_NOT_FOUND, http: 404, condition: "retrofit order id does not resolve" }
  - { id: ERR_RETIREMENT_NOT_FOUND, http: 404, condition: "retirement case id does not resolve" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "capital pool id does not resolve (or no pool for execution fiscal year)" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "commitment id does not resolve within the pool" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, invalid enum member, or violated numeric range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state from which the requested transition exists" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Assignment creation requires lease.status == ACTIVE" }
  - { id: ERR_RAILCAR_NOT_AVAILABLE, http: 409, condition: "Railcar not AVAILABLE (assignment), not RESERVED (deliver), not ON_LEASE (return), or shop entry blocked" }
  - { id: ERR_LESSEE_NOT_ACTIVE, http: 409, condition: "Lessee SUSPENDED/TERMINATED blocks lease submit/approve and new assignments" }
  - { id: ERR_ASSIGNMENT_NOT_RETURNED, http: 409, condition: "Settle requires assignment status RETURNED" }
  - { id: ERR_STATEMENT_NOT_PROVISIONAL, http: 409, condition: "Finalize requires statement PROVISIONAL" }
  - { id: ERR_REPORT_NOT_VALIDATED, http: 409, condition: "Statement finalize requires the month's mileage report VALIDATED" }
  - { id: ERR_DAMAGE_ASSESSMENT_OPEN, http: 409, condition: "Settle blocked: a damage assessment is still DRAFT, SUBMITTED, or DISPUTED" }
  - { id: ERR_OPEN_REPAIR_ORDERS, http: 409, condition: "Settle blocked: a repair is UNDER_REVIEW, REVISION_REQUESTED, APPROVED, or IN_PROGRESS" }
  - { id: ERR_RETIREMENT_BLOCKED, http: 409, condition: "Retirement approval requires railcar AVAILABLE" }
  - { id: ERR_AGE_LIMIT_EXCEEDED, http: 422, condition: "car_age_years >= 50 at assignment creation (interchange age limit, >= triggers)" }
  - { id: ERR_TANK_CAR_NONCOMPLIANT, http: 422, condition: "Assignment of a car whose compliance_posture is NON_COMPLIANT" }
  - { id: ERR_COMMODITY_INCOMPATIBLE, http: 422, condition: "Commodity change without a CERTIFIED cleaning record since last return" }
  - { id: ERR_TARIFF_NOT_FOUND, http: 422, condition: "No CAR_HIRE_BASE or MILEAGE_CREDIT tariff covering scheduled_start for the car type" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end/start ordering violated (lease end > start, tariff to > from, assignment end >= start)" }
  - { id: ERR_OUTSIDE_LEASE_TERM, http: 422, condition: "Assignment window falls outside [lease.start_date, lease.end_date]" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 422, condition: "Inclusive-window overlap with another SCHEDULED/ON_LEASE/RETURNED assignment on the same railcar" }
  - { id: ERR_CLEANING_BUFFER_VIOLATION, http: 422, condition: "Commodity change requires scheduled_start >= previous assignment scheduled_end + 3 days even with CERTIFIED cleaning" }
  - { id: ERR_TARIFF_WINDOW_OVERLAP, http: 422, condition: "Half-open tariff window overlap for same (car_type, rate_kind); adjacency is allowed" }
  - { id: ERR_REPORT_MONTH_MISMATCH, http: 422, condition: "report_month is not a month the assignment was on lease" }
  - { id: ERR_RETROFIT_DEADLINE_PASSED, http: 422, condition: "Retrofit scheduled_date after directive.retrofit_deadline" }
  - { id: ERR_DUPLICATE_CAR_MARK, http: 409, condition: "car_mark already registered" }
  - { id: ERR_DUPLICATE_DIRECTIVE_CODE, http: 409, condition: "directive_code already exists" }
  - { id: ERR_DUPLICATE_POOL_YEAR, http: 409, condition: "CapitalPool for fiscal_year already exists" }
  - { id: ERR_DUPLICATE_REPORT_MONTH, http: 409, condition: "A non-DISPUTED mileage report already exists for (railcar_id, report_month)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Assignment would be created for a lessee whose outstanding balance exceeds its credit limit; or reinstate while balance > limit" }
  - { id: ERR_CAPITAL_POOL_INSUFFICIENT, http: 422, condition: "Commitment unit_cost_cents exceeds pool available_cents at observed version" }
  - { id: ERR_REPAIR_PREAUTH_REQUIRED, http: 422, condition: "Approve blocked: lessee share exceeds authorized_repair_cap_cents and no preauthorization" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 422, condition: "Settle blocked by an INVOICED-but-unpaid damage assessment on the assignment" }
  - { id: ERR_PAYMENT_MISMATCH, http: 422, condition: "Payment amount does not equal the finalized/invoiced amount exactly" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; drives the logical clock and capital pool setup"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /capital-pools"]
    shared_operations: ["read endpoints"]
  - name: LeaseAdmin
    description: "Commercial contracts administrator: lessees, tariffs, lease drafting and termination"
    identity: opaque
    exclusive_operations: ["lessee create/reinstate/terminate", "tariff create/amend", "lease create/submit/amend/terminate"]
    shared_operations: ["read endpoints"]
  - name: FleetPlanner
    description: "Fleet assignment and retirement planning"
    identity: opaque
    exclusive_operations: ["railcar register", "assignment create/deliver/return/cancel", "retirement propose/appraise/execute/cancel", "pool commitment create/deliver/cancel"]
    shared_operations: ["read endpoints"]
  - name: MaintenanceController
    description: "Shop-side controller for repairs, cleaning, retrofits, damage line items"
    identity: opaque
    exclusive_operations: ["repair create/approve/request-revision/revise/reject/start-work/complete", "cleaning schedule/complete", "retrofit schedule/defer/reschedule/start/complete/cancel", "damage assessment create/submit/resubmit/finalize"]
    shared_operations: ["read endpoints"]
  - name: BillingAnalyst
    description: "Car-hire billing, mileage validation, settlement and payment application"
    identity: opaque
    exclusive_operations: ["mileage validate/dispute", "statement generate/finalize/recompute/settle", "damage invoice/record-payment", "assignment settle"]
    shared_operations: ["read endpoints"]
  - name: ComplianceOfficer
    description: "Regulatory gatekeeper; approval authority segregated from proposers"
    identity: opaque
    exclusive_operations: ["lease approve/reject", "directive create/promote", "retrofit certify", "cleaning certify/fail", "retirement approve"]
    shared_operations: ["read endpoints"]
  - name: LesseeRep
    description: "Lessee-side representative; acts only on resources owned by its Lessee (X-User-ID == Lessee.id)"
    identity: "entity_backed:Lessee"
    exclusive_operations: ["mileage report submit/resubmit", "statement dispute", "damage dispute", "repair preauthorize"]
    shared_operations: ["read endpoints scoped to own resources"]
