            - call: "GET /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_id}" }
              as: InsuranceUnderwriter
          assert:
            - "trigger[0].status == 409"
            - "trigger[0].data.error_id == ERR_INSURANCE_PERIOD_OVERLAP"
            - "trigger[1].status == 201"
            - "trigger[1].data.status == ACTIVE"
            - "trigger[2].data length == 2 (COI-88002 was never persisted)"
            - "InsuranceCertificate.${cert1_id}.status == ACTIVE (the lease is ACTIVE, so no SUPERSEDED derivation occurs)"
            - "LeaseAgreement.${lease_id}.status == ACTIVE and suspension_reason == null"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: outstanding_balance_restored_when_issued_invoice_voided
        grounds:
          - calculations.lessee_outstanding_balance
          - state_machines.SettlementInvoice[ISSUED -> VOID]
          - state_machines.UtilizationPeriod[SETTLED -> PENDING_SETTLEMENT]
          - state_machines.FlightLeg[PROVISIONALLY_BILLED -> FINALIZED]
          - entities.Lessee.fields.outstanding_balance_usd_cents
          - entities.LeaseAgreement.fields.lifetime_credited_block_minutes
          - endpoints[POST /wetlease/settlement-invoices/{invoiceId}/void]
        distinguishing_aspect: |
          Named conserved quantity: Lessee.outstanding_balance_usd_cents must equal the sum of
          ISSUED invoice amounts at every observable point. Voiding the ISSUED FINAL invoice must
          walk back all four of the issue's effects at once - balance 2,400,000 -> 0, period
          SETTLED -> PENDING_SETTLEMENT, leg billing_state FINALIZED -> UNBILLED (it was never
          provisionally invoiced) and lifetime_credited_block_minutes 100 -> 0 - leaving no drift.
          An implementation that only flags the invoice VOID leaves the balance and the ledger
          inflated.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI: rate 480000, mgh 5, term 2026-09-01..2026-12-31; one REVENUE leg on 2026-09-10 completed with 100 block minutes."
            - "Period 2026-09 closed at final_charge_cents 2400000, ReliabilityReport ACCEPTED."
            - "A FINAL invoice prepared by billing-clerk-01, approved by billing-supervisor-02 and ISSUED, so outstanding_balance_usd_cents is 2400000, the period is SETTLED, the leg is FINALIZED and lifetime_credited_block_minutes is 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "A Hallam", employee_no: "EMP-1001", crew_role: "CAPTAIN", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { cap_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "B Nkosi", employee_no: "EMP-1002", crew_role: "FIRST_OFFICER", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { fo_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_id}/decision"
              payload: { determination: "APPROVED" }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_id}", certificate_no: "COI-88001", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
              as: InsuranceUnderwriter
            - call: "POST /wetlease/leases/${lease_id}/activate"
              payload: {}
              as: LessorOpsController
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${cap_id}", lease_id: "${lease_id}" }
              as: LessorOpsController
              captures: { q_cap_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_cap_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${fo_id}", lease_id: "${lease_id}" }
              as: LessorOpsController
              captures: { q_fo_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_fo_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/flight-legs"
              payload: { lease_id: "${lease_id}", aircraft_id: "${ac1_id}", captain_id: "${cap_id}", first_officer_id: "${fo_id}", origin_icao: "EGSS", dest_icao: "LEPA", leg_class: "REVENUE", scheduled_out: "2026-09-10T06:00:00Z", scheduled_in: "2026-09-10T07:40:00Z" }
              as: LessorOpsController
              captures: { v_leg_id: $.data.id }
            - call: "POST /wetlease/flight-legs/${v_leg_id}/dispatch"
              payload: { actual_out: "2026-09-10T06:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/flight-legs/${v_leg_id}/complete"
              payload: { actual_in: "2026-09-10T07:40:00Z", technical_delay_minutes: 0 }
              as: LessorOpsController
            - call: "GET /wetlease/utilization-periods"
              payload: { lease_id: "${lease_id}" }
              as: BillingAdmin
              captures: { period_id: "$.data[0].id" }
            - call: "POST /wetlease/utilization-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
            - call: "POST /wetlease/reliability-reports"
              payload: { lease_id: "${lease_id}", aircraft_id: "${ac1_id}", period_month: "2026-09" }
              as: MaintenanceController
              captures: { report_id: $.data.id }
            - call: "POST /wetlease/reliability-reports/${report_id}/review"
              payload: { decision: "ACCEPT" }
              as: Lessee
              as_user_id: "${lessee_id}"
            - call: "GET /wetlease/utilization-periods/${period_id}"
              payload: {}
              as: BillingAdmin
              captures: { pv1: $.data.version }
            - call: "POST /wetlease/settlement-invoices"
              payload: { period_id: "${period_id}", expected_period_version: "${pv1}", due_on: "2026-10-15", variant: "FINAL" }
              as: BillingAdmin
              as_user_id: "billing-clerk-01"
              captures: { inv_id: $.data.id }
            - call: "POST /wetlease/settlement-invoices/${inv_id}/approve"
              payload: {}
              as: BillingAdmin
              as_user_id: "billing-supervisor-02"
            - call: "POST /wetlease/settlement-invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              as_user_id: "billing-supervisor-02"
            - call: "GET /wetlease/lessees/${lessee_id}"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /wetlease/settlement-invoices/${inv_id}/void"
              payload: { void_reason: "LESSEE_RECONCILIATION_AGREED" }
              as: BillingAdmin
              as_user_id: "billing-supervisor-02"
            - call: "GET /wetlease/lessees/${lessee_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "before trigger: Lessee.${lessee_id}.outstanding_balance_usd_cents == 2400000"
            - "before trigger: UtilizationPeriod.${period_id}.status == SETTLED"
            - "before trigger: FlightLeg.${v_leg_id}.billing_state == FINALIZED"
            - "before trigger: LeaseAgreement.${lease_id}.lifetime_credited_block_minutes == 100"
            - "trigger[0].status == 200"
            - "trigger[0].data.status == VOID"
            - "trigger[0].data.void_reason == LESSEE_RECONCILIATION_AGREED"
            - "trigger[0].data.amount_cents == 2400000 (the voided figure is preserved for audit)"
            - "trigger[1].data.outstanding_balance_usd_cents == 0"
            - "UtilizationPeriod.${period_id}.status == PENDING_SETTLEMENT"
            - "UtilizationPeriod.${period_id}.final_charge_cents == 2400000 (unchanged by the void)"
            - "FlightLeg.${v_leg_id}.billing_state == UNBILLED"
            - "FlightLeg.${v_leg_id}.status == COMPLETED"
            - "LeaseAgreement.${lease_id}.lifetime_credited_block_minutes == 0"

      - name: crew_duty_exposure_restored_when_scheduled_leg_cancelled
        grounds:
          - calculations.crew_duty_and_block_exposure
          - calculations.monthly_utilization_charge
          - state_machines.FlightLeg[SCHEDULED -> CANCELLED_LESSEE]
          - entities.CrewMember.fields.rolling_duty_minutes_7d
          - entities.CrewMember.fields.rolling_block_minutes_28d
          - endpoints[POST /wetlease/flight-legs/{legId}/cancel]
        distinguishing_aspect: |
          Cancellation is the compensating action for rostering: with the clock at
          2026-09-04T00:00:00Z the single 330-minute leg contributes 435 duty minutes and 330
          block minutes to BOTH crew members, and cancelling it must drive both counters for both
          people back to exactly 0 while the period recomputes to a full 5.0000-hour shortfall
          with no credit (the lessee cancelled, so lessor_attributable_shortfall_hours stays
          0.0000 and gross_charge_cents stays at the 2,400,000 base). Deriving the counters only
          on creation, or crediting a lessee cancellation as lessor-attributable, fails.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI: rate 480000, mgh 5, shortfall_credit_pct 0.60, term 2026-09-01..2026-12-31."
            - "One SCHEDULED REVENUE leg 2026-09-03T06:00:00Z-11:30:00Z (330 scheduled block minutes, duty 435)."
            - "The clock is advanced to 2026-09-04T00:00:00Z so the leg sits inside the half-open [clock_now - 168h, clock_now) duty window."
