- rule_id: transitive_cascade
  instances:
  - name: transitive_cascade_production_suspension_depth_four
    grounds:
    - state_machines.Production.ACTIVE_to_SUSPENDED
    - state_machines.RushAllocation.RELEASED_to_SUSPENDED
    - state_machines.QueuePosition.WAITING_to_ABANDONED
    - state_machines.SeatHold.HELD_to_ORPHANED
    distinguishing_aspect: 'Suspending a production propagates four hops, each caused by the previous one: Production to SUSPENDED moves its RELEASED allocations to SUSPENDED, that allocation-level change abandons the performance''s WAITING queue positions, and that abandonment is what leaves the allocation''s holds unreachable so the orphan sweep ORPHANS them.'
