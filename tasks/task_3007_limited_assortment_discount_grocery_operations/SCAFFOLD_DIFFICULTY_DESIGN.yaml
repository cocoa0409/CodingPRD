scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc — two calculations, different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: scan_rate_provisional_vs_final_diverge
        grounds:
          - calculations.scan_rate
          - entities.RegisterShift.fields.provisional_scan_rate
          - entities.RegisterShift.fields.final_scan_rate
        distinguishing_aspect: |
          RegisterShift domain: identical scan data (500 items, 10 voids, 1800s)
          yields provisional 1000.0 (voids ignored) but final 960.0 (void penalty
          2/void deducted) — two valid algorithms, different results.
        test_recipe:
          setup:
            - "Store S1 exists; cashier employee E1 in S1; logical clock at 2026-09-01T08:00:00Z; shift opened at 08:00"
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/stores/${store}/employees"
              payload: { name: "Cash One", role: "CASHIER" }
              as: StoreManager
              as_user_id: ${store}
              captures: { emp: $.data.id }
            - call: "POST /v1/stores/${store}/register-shifts"
              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store}
              captures: { shift: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:30:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /v1/register-shifts/${shift}/scan"
              payload: { items_count: 500, voids_count: 10 }
              as: Cashier
              as_user_id: ${emp}
              captures: { prov_rate: $.data.provisional_scan_rate }
            - call: "POST /v1/register-shifts/${shift}/close"
              as: StoreManager
              as_user_id: ${store}
              captures: { final_rate: $.data.final_scan_rate, compliance: $.data.compliance }
          assert:
            - "provisional_scan_rate == 1000.0 (500*3600/1800, voids ignored)"
            - "final_scan_rate == 960.0 ((500 - 2*10)*3600/1800)"
            - "compliance == BELOW_STANDARD"
            - "provisional_scan_rate != final_scan_rate for identical scan data"

      - name: double_refund_standard_vs_guarantee_diverge
        grounds:
          - calculations.double_refund
          - entities.QualityClaim.fields.refund_amount_cents
        distinguishing_aspect: |
          QualityClaim domain (different entity domain from RegisterShift):
          identical inputs (349 cents x 3 units) yield refund 1047 under the
          standard variant (DAMAGED) and 2094 under the guarantee variant
          (QUALITY_DEFECT) — exactly 2x.
        test_recipe:
          setup:
            - "Category C1, Product P1 (PROPOSED is fine for claims), Store S1 exist; logical clock at default 2026-09-01"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 3, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "DAMAGED" }
              as: CustomerServiceAgent
              captures: { cl_std: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 3, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "QUALITY_DEFECT" }
              as: CustomerServiceAgent
              captures: { cl_dbl: $.data.id }
            - call: "POST /v1/claims/${cl_std}/review"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl_dbl}/review"
              as: CustomerServiceAgent
          trigger:
            - call: "POST /v1/claims/${cl_std}/approve"
              as: CustomerServiceAgent
              captures: { ref_std: $.data.refund_amount_cents }
            - call: "POST /v1/claims/${cl_dbl}/approve"
              as: CustomerServiceAgent
              captures: { ref_dbl: $.data.refund_amount_cents }
          assert:
            - "QualityClaim.${cl_std}.refund_amount_cents == 1047 (349*3*1.0)"
            - "QualityClaim.${cl_dbl}.refund_amount_cents == 2094 (349*3*2.0)"
            - "guarantee refund == exactly 2x standard refund for identical inputs"

  # =====================================================================
  # Rule 2: combinatorial_formula — instances in different modes (a),(b),(c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tender_award_score_weighted_disqualify_branch
        grounds:
          - calculations.tender_award_score
          - entities.TenderBid.fields.award_score
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (panel score, price score, supplier
          quality) and a conditional disqualify branch — bid C is cheapest (100
          cents) yet DISQUALIFIED with award_score -1.0 because panel 55 < 60.
        test_recipe:
          setup:
            - "Category, CORE product, suppliers A/B/C, tender (ceiling 1000) OPEN with three bids and scored panels A=80 B=70 C=55"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup C", contact_email: "c@x.com" }
              as: ProcurementLead
              captures: { sup_c: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_c}", unit_cost_cents: 100 }
              as: SupplierRep
              as_user_id: ${sup_c}
              captures: { bid_c: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_c}/panels"
              payload: { sample_code: "BLIND-C1" }
              as: QualityAssuranceLead
              captures: { pan_c: $.data.id }
            - call: "POST /v1/panels/${pan_c}/score"
              payload: { score: 55 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "GET /v1/bids/${bid_a}"
              as: ProcurementLead
              captures: { score_a: $.data.award_score }
            - call: "GET /v1/bids/${bid_b}"
              as: ProcurementLead
              captures: { score_b: $.data.award_score }
            - call: "GET /v1/bids/${bid_c}"
              as: ProcurementLead
              captures: { score_c: $.data.award_score, status_c: $.data.status }
          assert:
            - "TenderBid.${bid_a}.award_score == 65.0 (0.5*80 + 0.3*30 + 0.2*80)"
            - "TenderBid.${bid_b}.award_score == 57.0 (0.5*70 + 0.3*20 + 0.2*80)"
            - "TenderBid.${bid_c}.award_score == -1.0 and status == DISQUALIFIED despite lowest cost 100 (panel 55 < 60 branch)"

      - name: clearance_markdown_per_unit_rounding_order
        grounds:
          - calculations.clearance_markdown_value
          - entities.FindsAllocation.fields.clearance_value_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned per-unit-first
          rounding gives round_half_up(199*0.7)=139 x3 = 417, while the forbidden
          sum-then-round order would give round_half_up(199*0.7*3)=418.
        test_recipe:
          setup:
            - "ACTIVE FINDS product (price 199) via full tender award; store S1; buy of 3 units for week 2026-09-07..2026-09-13 allocated and ON_SALE; allocation has 3 remaining"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 3 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
            - call: "POST /v1/finds-buys/${buy}/activate"
              as: CategoryManager
            - call: "GET /v1/finds-buys/${buy}/allocations"
              as: CategoryManager
              captures: { alloc: "$.data[0].id" }
          trigger:
            - call: "POST /v1/allocations/${alloc}/clearance"
              payload: { clearance_markdown_pct: 0.30, clearance_start_date: "2026-09-14", clearance_end_date: "2026-09-20" }
              as: StoreManager
              as_user_id: ${store}
              captures: { cv: $.data.clearance_value_cents }
          assert:
            - "FindsAllocation.${alloc}.clearance_value_cents == 417 (139 per unit x 3)"
            - "clearance_value_cents != 418 (the sum-then-round alternative)"
            - "FindsAllocation.${alloc}.status == CLEARANCE"

      - name: finds_waterfall_tier_leftover_order
        grounds:
          - calculations.finds_allocation_waterfall
          - entities.FindsBuy.fields.allocated_quantity
        distinguishing_aspect: |
          Mode (c): evaluation-order-pinned waterfall — tier pools, per-store
          floor quotas, then leftover units distributed in (tier priority,
          created_at ASC) order; 101 units over 1 HIGH_VOLUME + 2 STANDARD
          stores yields exactly 61/20/20 and conserves the total.
        test_recipe:
          setup:
            - "ACTIVE FINDS product; stores HV1 (HIGH_VOLUME, created first), ST1 and ST2 (STANDARD); buy total_quantity 101"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "HV1", name: "Big Store", tier: "HIGH_VOLUME", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { hv: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "ST1", name: "Std One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { st1: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "ST2", name: "Std Two", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { st2: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 101 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
          trigger:
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
            - call: "GET /v1/stores/${hv}/finds-allocations"
              as: CategoryManager
              captures: { hv_qty: "$.data[0].allocated_quantity" }
            - call: "GET /v1/stores/${st1}/finds-allocations"
              as: CategoryManager
              captures: { st1_qty: "$.data[0].allocated_quantity" }
            - call: "GET /v1/stores/${st2}/finds-allocations"
              as: CategoryManager
              captures: { st2_qty: "$.data[0].allocated_quantity" }
          assert:
            - "HV1 allocation == 61 (floor(101*0.6/1)=60 plus 1 leftover unit, tier priority first)"
            - "ST1 allocation == 20 (floor(floor(101*0.4)/2))"
            - "ST2 allocation == 20"
            - "sum of allocations == 101 == FindsBuy.total_quantity (waterfall conservation)"
            - "FindsBuy.${buy}.allocated_quantity == 101"

  # =====================================================================
  # Rule 3: non_linear_state_machine — cycles on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tender_retender_cycle_restores_open
        grounds:
          - state_machines.SupplierTender.EVALUATING_to_OPEN
          - state_machines.TenderBid.ELIGIBLE_to_SUBMITTED
          - state_machines.BlindQualityPanel.LOCKED_to_SCORED
        distinguishing_aspect: |
          SupplierTender cyclic loop EVALUATING -> OPEN -> CLOSED -> EVALUATING:
          retender after insufficient dual-source eligibility reverts bids to
          SUBMITTED (award_score null) and panels LOCKED -> SCORED, then a second
          evaluate/award succeeds.
        test_recipe:
          setup:
            - "Tender for CORE product with bids A(700,panel 80) and B(800,panel 50); after evaluate only A is ELIGIBLE (1 distinct supplier < min_sources 2)"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup C", contact_email: "c@x.com" }
              as: ProcurementLead
              captures: { sup_c: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 50 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/tenders/${tend}/retender"
              as: ProcurementLead
              captures: { tend_status: $.data.status }
            - call: "GET /v1/bids/${bid_a}"
              as: ProcurementLead
              captures: { bid_a_status: $.data.status, bid_a_score: $.data.award_score }
            - call: "GET /v1/panels/${pan_a}"
              as: QualityAssuranceLead
              captures: { pan_a_status: $.data.status }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_c}", unit_cost_cents: 750 }
              as: SupplierRep
              as_user_id: ${sup_c}
              captures: { bid_c: $.data.id }
            - call: "POST /v1/bids/${bid_c}/panels"
              payload: { sample_code: "BLIND-C1" }
              as: QualityAssuranceLead
              captures: { pan_c: $.data.id }
            - call: "POST /v1/panels/${pan_c}/score"
              payload: { score: 75 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_c}" }
              as: ProcurementLead
              captures: { final_status: $.data.status }
          assert:
            - "after retender: SupplierTender.status == OPEN (cycle EVALUATING -> OPEN)"
            - "after retender: TenderBid.${bid_a}.status == SUBMITTED and award_score == null"
            - "after retender: BlindQualityPanel.${pan_a}.status == SCORED (reverted from LOCKED)"
            - "after second cycle: SupplierTender.status == AWARDED; TenderBid.${bid_c}.award_score == 61.0 (0.5*75 + 0.3*25 + 0.2*80)"

      - name: claim_dispute_review_cycle
        grounds:
          - state_machines.QualityClaim.UNDER_REVIEW_to_DISPUTED
          - state_machines.QualityClaim.DISPUTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          QualityClaim cyclic loop UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW on a
          different entity than SupplierTender; the claim survives the loop and
          is later APPROVED with the correct double refund.
        test_recipe:
          setup:
            - "Category, product, store exist; QUALITY_DEFECT claim (349 cents x 1) FILED"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 100, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/claims"
              payload: { product_id: "${prod}", store_id: "${store}", quantity: 1, unit_price_cents: 349, purchase_date: "2026-08-20", reason: "QUALITY_DEFECT" }
              as: CustomerServiceAgent
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
            - call: "POST /v1/claims/${cl}/dispute"
              as: CustomerServiceAgent
              captures: { st_disputed: $.data.status }
            - call: "POST /v1/claims/${cl}/review"
              as: CustomerServiceAgent
              captures: { st_back: $.data.status }
            - call: "POST /v1/claims/${cl}/approve"
              as: CustomerServiceAgent
              captures: { refund: $.data.refund_amount_cents, ver: $.data.version }
          assert:
            - "status after dispute == DISPUTED"
            - "status after re-review == UNDER_REVIEW (cycle closed)"
            - "refund_amount_cents == 698 after approve"
            - "QualityClaim.${cl}.version == 5 (create + 4 transitions)"

  # =====================================================================
  # Rule 4: transitive_cascade — different triggers, depths >= 3 and >= 2
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: award_cascades_product_activation_category_lock
        grounds:
          - state_machines.SupplierTender.EVALUATING_to_AWARDED
          - state_machines.Product.PROPOSED_to_ACTIVE
          - state_machines.Category.OPEN_to_LOCKED
          - calculations.category_sku_count
        distinguishing_aspect: |
          Depth-3 cascade from tender award: award (A) mutates Product
          PROPOSED->ACTIVE (B); that activation recomputes
          Category.active_sku_count 1->2 (C); reaching the cap auto-transitions
          the Category OPEN->LOCKED (D) — each hop caused by the previous one.
        test_recipe:
          setup:
            - "Category cap 2 with one ACTIVE CORE product (awarded); second PROPOSED CORE product with tender EVALUATING and two ELIGIBLE bids (700/800, panels 80/70)"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
