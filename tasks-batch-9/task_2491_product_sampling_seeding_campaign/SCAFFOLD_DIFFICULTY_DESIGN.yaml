  - rule_id: transitive_cascade
    instances:

      - name: substantiation_bans_panelist_revokes_enrollment_retracts_review_requests_takedown
        chain_depth: 4
        grounds:
          - state_machines.DiversionCase.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Enrollment.SCREEN_PASSED_to_SCREEN_REVOKED
          - state_machines.ReviewSubmission.APPROVED_to_RETRACTED
          - state_machines.SyndicationRecord.SYNDICATED_to_TAKEDOWN_REQUESTED
          - calculations.campaign_compliance_posture
        distinguishing_aspect: |
          A strictly TRANSITIVE compliance chain of depth 4 across four different entities:
          DiversionCase -> Panelist (hop 1 bans) -> Enrollment (hop 2 revokes BECAUSE the panelist became
          BANNED) -> ReviewSubmission (hop 3 retracts BECAUSE the enrollment became SCREEN_REVOKED) ->
          SyndicationRecord (hop 4 requests takedown BECAUSE the review became RETRACTED). No hop is a
          fan-out from the trigger: hop 4 is unreachable unless hop 3 fired, and hop 3 unreachable unless
          hop 2 fired. The chain is direction-locked by the obligation axis staying REVIEW_FULFILLED
          (proving hop 2 respected its "unless already REVIEW_FULFILLED" guard rather than blanket-writing
          FORFEITED).
        test_recipe:
          setup:
            - "One retailer registered in the campaign's syndication_retailer_ids."
            - "One campaign in SAMPLING_ACTIVE with a single kit line, one screened enrollment, one DELIVERED shipment."
            - "One review APPROVED by moderator MOD_A and one SyndicationRecord already dispatched to SYNDICATED, so Campaign.approved_review_count is 1 and Campaign.syndicated_review_count is 1."
            - "One diversion case against that panelist, opened by MOD_A and moved to INVESTIGATING by MOD_A (audit score 15.0, below the 55.0 flag threshold, so integrity_status is still CLEAR at trigger time)."
