            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            # invariant check point A: reserved 2/4, on_hand unchanged
            - call: "GET /evs/supply-items/${sd}"
              payload: {}
              as: Any
              captures: { d_on_mid: $.data.on_hand_quantity, d_rs_mid: $.data.reserved_quantity }
          trigger:
            - call: "POST /evs/clean-requests/${r1}/cancel"
              payload: {}
              as: EVSDispatcher
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
