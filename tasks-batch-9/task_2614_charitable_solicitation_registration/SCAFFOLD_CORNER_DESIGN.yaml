  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:

      - name: stale_organization_version_blocks_a_second_statement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[restatement-supersede-stale-organization]
          - errors[ERR_STALE_ORGANIZATION_VERSION]
          - endpoints[POST /financial-statements].input
        distinguishing_aspect: "The organization version the preparer read before the first filing is already spent: reusing it on the next statement is 412, and because the create is rejected the second fiscal year never gets a statement at all."
        test_recipe:
          setup:
            - "StateProfile CA; an Organization read once at version 1; one FY2025 statement filed with that token so the organization is now at version 2."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 18000000, contributions_cents: 15000000, program_expense_cents: 12000000, fundraising_expense_cents: 3000000, management_expense_cents: 1500000, expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs2025_id: $.data.id, fs2025_status: $.data.statement_status }
          trigger:
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 412"
            - "${err_id} == ERR_STALE_ORGANIZATION_VERSION"
            - "${org_v} == 1"
            - "Organization.${org_id}.version == 2"
            - "${fs2025_status} == CURRENT"
            - "FinancialStatement.${fs2025_id}.statement_status == CURRENT"

      - name: stale_registration_version_blocks_the_superseding_extension
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[extension-supersede-stale-registration]
          - errors[ERR_STALE_REGISTRATION_VERSION]
          - state_machines.ExtensionRequest.transitions[PENDING -> SUPERSEDED]
        distinguishing_aspect: "This create can never be refused by a state precondition because a new request legitimately supersedes the standing one, so the version token is the only guard: the stale call is 412 at priority 7 and the earlier request is left PENDING rather than being superseded by a caller working from an old deadline picture."
        test_recipe:
          setup:
            - "StateProfile CA allowing extensions; a DRAFT CA FY2026 filing read once at version 1; one PENDING extension request created with that token, which advanced the filing to version 2."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, extension_allowed: true, extension_max_days: 90 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /extension-requests"
              payload: { registration_id: "${reg_id}", basis: "STATE_HARDSHIP", requested_days: 45, expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { ext1_id: $.data.id }
          trigger:
            - call: "POST /extension-requests"
              payload: { registration_id: "${reg_id}", basis: "IRS_990_EXTENSION", requested_days: 180, expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 412"
            - "${err_id} == ERR_STALE_REGISTRATION_VERSION"
            - "${reg_v} == 1"
            - "StateRegistration.${reg_id}.version == 2"
            - "ExtensionRequest.${ext1_id}.status == PENDING"
            - "StateRegistration.${reg_id}.extended_due_date == null"

      - name: organization_version_advances_on_every_write_that_touches_it
        claim_type: optimistic_concurrency
        grounds:
          - endpoints[PATCH /organizations/{id}].side_effects
          - endpoints[POST /financial-statements].side_effects
          - entities.Organization.common_fields
        distinguishing_aspect: "The counter advances for a direct amendment and for a child write that only recomputes the parent's derived fields, so a caller must re-read after either kind of operation; the token observed at create is stale after both."
        test_recipe:
          setup:
            - "StateProfile CA; a freshly created Organization at version 1."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, v1: $.data.version }
            - call: "PATCH /organizations/${org_id}"
              payload: { legal_name: "Harbor Light Foundation Inc" }
              as: ComplianceOfficer
              captures: { v2: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${v2}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { v3: $.data.version }
          assert:
            - "response.http_status == 200"
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "response.data.legal_name == Harbor Light Foundation Inc"
            - "FinancialStatement.${fs_id}.statement_status == CURRENT"

      - name: registration_triggers_are_inclusive_at_every_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.registration_trigger_evaluation
          - entities.StateProfile.fields.donor_count_trigger
          - entities.SolicitationActivity.fields.trigger_reasons
        distinguishing_aspect: "One donor and one cent below the seeded triggers with an untargeted channel produces an empty reason list, while landing exactly on both triggers with a targeted web channel fires all three clauses in canonical order — the comparison is >= on both metrics, not >."
        test_recipe:
          setup:
            - "StateProfile CA seeded with the default donor_count_trigger 25 and contribution_trigger_cents 2500000 and with online_presence_counts true; one Organization; one activity row parked just under both triggers on a mail-only channel."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true }
              as: SystemAdmin
              captures: { dct: $.data.donor_count_trigger, ctc: $.data.contribution_trigger_cents }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /solicitation-activities"
              payload: { organization_id: "${org_id}", state_code: "CA", fiscal_year: 2026, donor_count: 24, contributions_cents: 2499999, channels: ["MAIL"] }
              as: ComplianceOfficer
              captures: { under_id: $.data.id, under_flag: $.data.triggers_registration }
          trigger:
            - call: "POST /solicitation-activities"
              payload: { organization_id: "${org_id}", state_code: "CA", fiscal_year: 2026, donor_count: 25, contributions_cents: 2500000, channels: ["MAIL", "WEB_TARGETED"] }
              as: ComplianceOfficer
              captures: { at_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "${dct} == 25"
            - "${ctc} == 2500000"
            - "${under_flag} == false"
            - "SolicitationActivity.${under_id}.triggers_registration == false"
            - "SolicitationActivity.${under_id}.trigger_reasons == []"
            - "response.data.triggers_registration == true"
            - "response.data.trigger_reasons == [DONOR_COUNT, CONTRIBUTION_TOTAL, TARGETED_ONLINE_PRESENCE]"

      - name: three_level_cascade_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /financial-statements].side_effects
          - state_machines.StateRegistration.transitions[SUBMITTED -> DEFICIENT]
        excluded_because:
          difficulty_instance: restatement_cascade_r1_r2_r3_deficients_submitted_filing
          rationale: "That instance already drives the full R1/R2/R3 chain from a single restatement and asserts every level — the superseded predecessor, the repointed and re-derived open filing, and the SUBMITTED filing knocked back to DEFICIENT — so a separate layer-level cascade test would duplicate it."

      - name: variant_switch_delta_lands_on_the_ledger
        claim_type: dual_variant_calculation
        grounds:
          - calculations.coventure_benefit_determination.variants
          - state_machines.CoventurePromotion.transitions[ACTIVE -> SETTLED]
        excluded_because:
          difficulty_instance: coventure_projected_vs_actual_benefit_divergence
          rationale: "The projected variant is asserted at filing time and the final variant at settlement in the same instance, including the shortfall delta the switch produces, which is exactly the delta-on-switch claim this layer asks for."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: approval_counters_are_readable_with_no_lag
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.StateRegistration.transitions[SUBMITTED -> REGISTERED]
          - endpoints[GET /organizations/{id}/compliance-calendar]
        distinguishing_aspect: "The approval response itself already carries REGISTERED and the clock stamp, and the reads that follow it without any intervening write already show the recomputed organization counter and the calendar entry — nothing about this model permits a denormalized field to lag by one request."
        test_recipe:
          setup:
            - "StateProfile CA; an Organization with FYE 6; a complete SUBMITTED CA FY2026 packet; the clock left at its default of 2026-08-01."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, base_filing_fee_cents: 2500, filing_fee_cap_cents: 30000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
              captures: { doc_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "REVIEW_REPORT", prepared_by_officer_id: "${prep_id}", page_count: 4 }
              as: ComplianceOfficer
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
          trigger:
            - call: "POST /state-registrations/${reg_id}/review"
              payload: { decision: "APPROVE" }
              as: StateRegulator
              captures: { st: $.data.status, reg_at: $.data.registered_at }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rsc: $.data.registered_state_count, posture: $.data.filing_posture }
            - call: "GET /organizations/${org_id}/compliance-calendar"
              payload: {}
              as: ComplianceOfficer
              captures: { cal_status: "$.data.entries[0].status", cal_due: "$.data.entries[0].effective_due_date" }
          assert:
            - "response.http_status == 200"
            - "${st} == REGISTERED"
            - "${reg_at} == 2026-08-01T00:00:00Z"
            - "${rsc} == 1"
            - "${posture} == CURRENT"
            - "${cal_status} == REGISTERED"
            - "${cal_due} == 2026-11-14T00:00:00Z"
            - "RegistrationDocument.${doc_id}.review_status == ACCEPTED"

      - name: no_stale_read_survives_a_restatement
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /financial-statements].side_effects
          - calculations.assurance_requirement_derivation
        distinguishing_aspect: "A restatement rewrites three rows the caller never named, and the very next read of each one already shows the new value: the predecessor SUPERSEDED, the open filing repointed with a raised attestation, and its status knocked back to DEFICIENT with no re-poll."
        test_recipe:
          setup:
            - "StateProfile CA on the GROSS_REVENUE basis with review at 20000000 and audit at 200000000; a SUBMITTED CA FY2026 filing backed by a REVIEW statement of 26000000."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs1_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs1_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "REVIEW_REPORT", prepared_by_officer_id: "${prep_id}", page_count: 4 }
              as: ComplianceOfficer
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { org_v2: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 250000000, contributions_cents: 210000000, program_expense_cents: 180000000, fundraising_expense_cents: 40000000, management_expense_cents: 20000000, assurance_level: "REVIEW", expected_organization_version: "${org_v2}" }
              as: ComplianceOfficer
              captures: { fs2_id: $.data.id }
          trigger:
            - call: "GET /state-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status, linked_fs: $.data.financial_statement_id, att: $.data.required_financial_attestation }
          assert:
            - "response.http_status == 200"
            - "${st} == DEFICIENT"
            - "${linked_fs} == ${fs2_id}"
            - "${att} == AUDIT"
            - "FinancialStatement.${fs1_id}.statement_status == SUPERSEDED"
            - "FinancialStatement.${fs2_id}.statement_status == CURRENT"
            - "FinancialStatement.${fs2_id}.assurance_level == REVIEW"
