    roles: [MLCAdministrator]
    code: 201
    input: []
    output: MatchRun
    side_effects: ["Lines re-evaluated per deterministic_matching", "UNMATCHED lines that now match: line -> MATCHED and accrual -> RELEASED", "matched works: match_run_count incremented", "match_rate_bps computed"]

  - method: GET
    path: "/mlc/match-runs"
    description: "List match runs (match-rate time series)"
    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "MatchRun[]"
    side_effects: []

  - method: GET
    path: "/mlc/match-runs/{id}"
    description: "Get one match run"
    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
