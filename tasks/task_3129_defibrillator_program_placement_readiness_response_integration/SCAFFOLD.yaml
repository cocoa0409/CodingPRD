  - method: POST
    path: "/api/devices/{deviceId}/return_to_service"
    description: "Return from maintenance (MAINTENANCE → INSTALLED) — requires PASS inspection within 30 days and READY posture"
    roles: [Inspector]
    code: 200
    input: []
    output: Device
    side_effects: ["Device.status → INSTALLED", "Recompute campus posture"]

  - method: POST
