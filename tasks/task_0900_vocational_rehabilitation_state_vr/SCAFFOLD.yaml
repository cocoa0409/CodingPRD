# =============================================================================
# PRD-bench scaffold — Vocational Rehabilitation (State VR)
# Difficulty: Expert
# =============================================================================

scenario: |
  Vocational Rehabilitation (State VR): referral & disability/eligibility, IPE
  (individualized plan) & goal, service authorization (training/assistive-tech),
  vendor & provider payment, job placement & supported employment, progress &
  90-day closure, order-of-selection waitlist, RSA-911 reporting

domain_name: vocational-rehabilitation-state-vr
api_prefix: /vr

complexity_profile:
  primary_archetype: workflow orchestration
  secondary_archetype: quota / allocation
  complexity_layers:
    - cascading side effects
    - optimistic concurrency
    - dual-variant calculation
    - derived field reconciliation
  entity_topology: flat            # peer entities linked by FK references
  state_machine_shape: cyclic      # IPE amendment loop + Placement destabilize/resume loop; Case branches
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain       # Counselor requests -> Supervisor approves -> FiscalOfficer pays; Provider peer
  consistency_model: immediate
  notes: |
    Order-of-selection waitlist uses a selector policy (eligibility filter =
    Cases WAITLISTED in the category; ranking = waitlisted_at ASC; tie-break =
    created_at ASC; empty-pool fallback = ERR_NO_WAITLISTED_CASE). A logical
    clock (POST /vr/_clock/set_current_utc) makes 90-day stabilization and
    service-period rules deterministic; default startup time 2026-05-01T00:00:00Z.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Counselor
    parent: null
    common_fields: false            # id, created_at only
    fields:
      - { name: name, type: string, source: input, description: "Counselor full name" }
      - { name: email, type: string, source: input, description: "Counselor email" }
      - { name: unit, type: string, source: input, description: "VR field-office unit code" }

  - name: Supervisor
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Supervisor full name" }
      - { name: email, type: string, source: input, description: "Supervisor email" }

  - name: Provider
    parent: null
    common_fields: true             # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Vendor / service provider name" }
      - { name: service_categories, type: array, source: input, description: "Service categories this provider is approved for; subset of {TRAINING, ASSISTIVE_TECH, ASSESSMENT, SUPPORTED_EMPLOYMENT}" }
      - { name: max_concurrent_authorizations, type: integer, source: input, description: "Maximum number of the provider's APPROVED authorizations whose service periods may overlap at once" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED (suppliable at creation for onboarding state)" }
      - { name: pending_disbursement_cents, type: integer, source: computed, description: "Sum of amount_cents of this provider's Payments in status PENDING" }
      - { name: ledger_paid_cents, type: integer, source: computed, description: "Sum of amount_cents of this provider's Payments in status ISSUED" }

  - name: PriorityCategory
    parent: null
    common_fields: true
    fields:
      - { name: rank, type: integer, source: input, description: "Order-of-selection rank; 1=MSD (highest priority), 2=SD, 3=NSD. One category per rank." }
      - { name: label, type: string, source: input, description: "MSD | SD | NSD" }
      - { name: status, type: enum, source: input, default: OPEN, description: "OPEN | CLOSED — closed categories admit no new served cases (eligible cases are waitlisted)" }
      - { name: slot_capacity, type: integer, source: input, description: "Number of served slots funded for this category" }
      - { name: slots_used, type: integer, source: computed, description: "Count of Cases with this priority_category_id whose status IN {PLAN_DEVELOPMENT, SERVICES_ACTIVE, EMPLOYED}" }
      - { name: available_slots, type: integer, source: computed, description: "slot_capacity - slots_used (never negative; reservation blocked at 0)" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; set from X-User-ID of the creating Counselor" }
      - { name: priority_category_id, type: string, source: system, description: "FK -> PriorityCategory.id; assigned at eligibility from disability_significance rank; null before eligibility" }
      - { name: consumer_full_name, type: string, source: input, description: "Consumer (person with disability) full name" }
      - { name: consumer_dob, type: string, source: input, description: "Consumer date of birth (YYYY-MM-DD)" }
      - { name: disability_type, type: enum, source: input, description: "PHYSICAL | COGNITIVE | PSYCHIATRIC | SENSORY" }
      - { name: disability_significance, type: enum, source: system, description: "MSD | SD | NSD — set at eligibility; null before" }
      - { name: referral_source, type: string, source: input, description: "Referral source label" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Consumer monthly income in cents; drives cost-share participation tier" }
      - { name: budget_allocated_cents, type: integer, source: input, default: 0, description: "Total VR service budget allocated to this case in cents" }
      - { name: funds_committed_cents, type: integer, source: computed, description: "Obligated-but-unpaid: sum over APPROVED authorizations of (agency_share_cents - amount_paid_cents)" }
      - { name: funds_paid_cents, type: integer, source: computed, description: "Sum of amount_cents of ISSUED Payments across the case's authorizations" }
      - { name: funds_available_cents, type: integer, source: computed, description: "budget_allocated_cents - funds_committed_cents - funds_paid_cents" }
      - { name: status, type: enum, source: system, description: "REFERRED | APPLICATION | WAITLISTED | PLAN_DEVELOPMENT | SERVICES_ACTIVE | EMPLOYED | INELIGIBLE | CLOSED_REHABILITATED | CLOSED_OTHER" }
      - { name: waitlisted_at, type: datetime, source: computed, description: "Logical-clock instant the case entered WAITLISTED; null otherwise" }
      - { name: closure_type, type: enum, source: system, description: "REHABILITATED | OTHER — set at closure; null before" }
      - { name: closure_reason, type: string, source: system, description: "Free-text closure reason; null before closure" }

  - name: IPE
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: employment_goal, type: string, source: input, description: "Employment goal (SOC occupation title/code)" }
      - { name: goal_wage_target_cents, type: integer, source: input, description: "Target weekly wage for the employment goal in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | AMENDING | CLOSED" }
      - { name: approved_by_supervisor_id, type: string, source: system, description: "X-User-ID of the Supervisor who approved (audit); null before approval" }
      - { name: approved_plan_version, type: integer, source: computed, description: "IPE.version pinned at the moment of approval; null before first approval" }

  - name: ServiceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: ipe_id, type: string, source: input, description: "FK -> IPE.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: service_category, type: enum, source: input, description: "TRAINING | ASSISTIVE_TECH | ASSESSMENT | SUPPORTED_EMPLOYMENT" }
      - { name: authorized_amount_cents, type: integer, source: input, description: "Gross authorized service cost in cents" }
      - { name: comparable_benefit_cents, type: integer, source: input, default: 0, description: "Comparable-benefits offset applied before cost share" }
      - { name: consumer_share_cents, type: integer, source: computed, description: "Consumer participation amount (service_cost_share calc)" }
      - { name: agency_share_cents, type: integer, source: computed, description: "VR agency obligation = net_cost - consumer_share_cents" }
      - { name: service_period_start, type: string, source: input, description: "Service period start date (YYYY-MM-DD)" }
      - { name: service_period_end, type: string, source: input, description: "Service period end date (YYYY-MM-DD); must be >= service_period_start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | COMPLETED | CANCELLED" }
      - { name: requested_by_counselor_id, type: string, source: system, description: "X-User-ID of the requesting Counselor (audit)" }
      - { name: approved_by_supervisor_id, type: string, source: system, description: "X-User-ID of the approving Supervisor (audit); null before approval" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of amount_cents of this authorization's ISSUED Payments" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> ServiceAuthorization.id" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the authorization at creation" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | VOIDED" }
      - { name: federal_share_cents, type: integer, source: computed, description: "Federal reimbursement share (payment_federal_state_split); null before issue" }
      - { name: state_share_cents, type: integer, source: computed, description: "amount_cents - federal_share_cents; null before issue" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of the FiscalOfficer who issued (audit); null before issue" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: ipe_id, type: string, source: input, description: "FK -> IPE.id" }
      - { name: employer_name, type: string, source: input, description: "Employer name" }
      - { name: placement_date, type: string, source: input, description: "Placement (hire) date (YYYY-MM-DD)" }
      - { name: weekly_wage_cents, type: integer, source: input, description: "Projected weekly wage at placement in cents" }
      - { name: hours_per_week, type: integer, source: input, description: "Scheduled hours per week" }
      - { name: employment_type, type: enum, source: input, description: "COMPETITIVE_INTEGRATED | SUPPORTED | SELF_EMPLOYMENT" }
      - { name: status, type: enum, source: system, description: "PLACED | STABILIZING | DESTABILIZED | STABLE | CLOSED" }
      - { name: stabilization_start_date, type: string, source: computed, description: "Logical-clock date stabilization began; set at begin-stabilization, reset at resume; null before" }
      - { name: verified_avg_weekly_wage_cents, type: integer, source: computed, description: "Average reported wage over the stabilization window (verified_average_weekly_wage calc); null until verify-stability" }
      - { name: days_stable, type: integer, source: computed, description: "Whole days from stabilization_start_date to current logical clock; 0 when not stabilizing" }

  - name: ProgressReview
    parent: null
    common_fields: false            # append-only event log; id, created_at only
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id" }
      - { name: review_date, type: string, source: input, description: "Date of the progress review (YYYY-MM-DD)" }
      - { name: reported_weekly_wage_cents, type: integer, source: input, description: "Weekly wage reported at this review in cents" }
      - { name: status_ok, type: boolean, source: input, default: true, description: "Whether the placement was stable/satisfactory at this review" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: REFERRED
    terminal_states: [INELIGIBLE, CLOSED_REHABILITATED, CLOSED_OTHER]
    transitions:
      - from: REFERRED
        to: APPLICATION
        trigger: "POST /vr/cases/{case_id}/application"
        actor: Counselor
        preconditions:
          - "case.status == REFERRED"
          - "acting Counselor owns the case (case.counselor_id == X-User-ID) else ERR_FORBIDDEN"
        side_effects:
          - "status -> APPLICATION"
          - "increments Case.version by 1"

      - from: APPLICATION
        to: INELIGIBLE
        trigger: "POST /vr/cases/{case_id}/eligibility (decision=INELIGIBLE)"
        actor: Counselor
        preconditions:
          - "case.status == APPLICATION"
        side_effects:
          - "status -> INELIGIBLE (terminal); disability_significance recorded"
          - "increments Case.version by 1"

      - from: APPLICATION
        to: PLAN_DEVELOPMENT
        trigger: "POST /vr/cases/{case_id}/eligibility (decision=ELIGIBLE, category OPEN with available_slots > 0)"
        actor: Counselor
        preconditions:
          - "case.status == APPLICATION"
          - "a PriorityCategory exists with rank == rank_of(disability_significance) else ERR_CATEGORY_NOT_FOUND"
          - "that category.status == OPEN AND category.available_slots > 0"
        side_effects:
          - "status -> PLAN_DEVELOPMENT; priority_category_id assigned; disability_significance recorded"
          - "reserve slot: PriorityCategory.slots_used += 1, available_slots -= 1, category.version += 1"
          - "increments Case.version by 1"

      - from: APPLICATION
        to: WAITLISTED
        trigger: "POST /vr/cases/{case_id}/eligibility (decision=ELIGIBLE, category CLOSED or available_slots == 0)"
        actor: Counselor
        preconditions:
          - "case.status == APPLICATION"
          - "a PriorityCategory exists with rank == rank_of(disability_significance) else ERR_CATEGORY_NOT_FOUND"
          - "that category.status == CLOSED OR category.available_slots == 0"
        side_effects:
          - "status -> WAITLISTED; priority_category_id assigned; waitlisted_at = current logical clock; no slot reserved"
          - "increments Case.version by 1"

      - from: WAITLISTED
        to: PLAN_DEVELOPMENT
        trigger: "POST /vr/priority-categories/{category_id}/promote-next (selector chooses this case)"
        actor: system
        preconditions:
          - "category.available_slots > 0 else ERR_NO_SLOT_AVAILABLE"
          - "this case is the WAITLISTED case in the category with least waitlisted_at (tie-break least created_at)"
        side_effects:
          - "status -> PLAN_DEVELOPMENT; waitlisted_at cleared"
          - "reserve slot: PriorityCategory.slots_used += 1, available_slots -= 1, category.version += 1"
          - "increments Case.version by 1"

      - from: PLAN_DEVELOPMENT
        to: SERVICES_ACTIVE
        trigger: "system, on IPE approval (SUBMITTED -> APPROVED)"
        actor: system
        preconditions:
          - "the case's IPE transitioned to APPROVED"
        side_effects:
          - "status -> SERVICES_ACTIVE"
          - "increments Case.version by 1"

      - from: SERVICES_ACTIVE
        to: EMPLOYED
        trigger: "system, on Placement creation (POST /vr/placements)"
        actor: system
        preconditions:
          - "case.status == SERVICES_ACTIVE"
        side_effects:
          - "status -> EMPLOYED"
          - "increments Case.version by 1"

      - from: EMPLOYED
        to: CLOSED_REHABILITATED
        trigger: "system, on Placement verify-stability (STABILIZING -> STABLE)"
        actor: system
        preconditions:
          - "the case's Placement reached STABLE (days_stable >= 90)"
        side_effects:
          - "status -> CLOSED_REHABILITATED; closure_type = REHABILITATED"
          - "CASCADE L2 (from Placement verify-stability L1): PriorityCategory.slots_used -= 1, available_slots += 1, category.version += 1"
          - "every ServiceAuthorization for this case in {REQUESTED, APPROVED} -> CANCELLED (release funds; void PENDING payments)"
          - "any IPE in {APPROVED, AMENDING} -> CLOSED"
          - "increments Case.version by 1"

      - from: WAITLISTED
        to: CLOSED_OTHER
        trigger: "POST /vr/cases/{case_id}/close"
        actor: Counselor
        preconditions:
          - "case.status NOT IN {INELIGIBLE, CLOSED_REHABILITATED, CLOSED_OTHER}"
          - "acting Counselor owns the case else ERR_FORBIDDEN"
        side_effects:
          - "status -> CLOSED_OTHER; closure_type = OTHER; closure_reason recorded"
          - "no slot to release (waitlisted cases hold no slot)"
          - "increments Case.version by 1"
        note: "close is valid from any non-terminal status; slot release and cascades apply only when a slot/authorizations exist."

      - from: PLAN_DEVELOPMENT
        to: CLOSED_OTHER
        trigger: "POST /vr/cases/{case_id}/close"
        actor: Counselor
        preconditions:
          - "case.status == PLAN_DEVELOPMENT"
          - "acting Counselor owns the case else ERR_FORBIDDEN"
        side_effects:
          - "status -> CLOSED_OTHER; closure_type = OTHER; closure_reason recorded"
          - "release slot: PriorityCategory.slots_used -= 1, available_slots += 1, category.version += 1"
          - "increments Case.version by 1"

      - from: SERVICES_ACTIVE
        to: CLOSED_OTHER
        trigger: "POST /vr/cases/{case_id}/close"
        actor: Counselor
        preconditions:
          - "case.status == SERVICES_ACTIVE"
          - "acting Counselor owns the case else ERR_FORBIDDEN"
        side_effects:
          - "status -> CLOSED_OTHER; closure_type = OTHER; closure_reason recorded"
          - "CASCADE L1: every ServiceAuthorization for this case in {REQUESTED, APPROVED} -> CANCELLED (which itself releases committed funds and VOIDs PENDING payments — see ServiceAuthorization cancel)"
          - "release slot: PriorityCategory.slots_used -= 1, available_slots += 1, category.version += 1"
          - "any IPE in {APPROVED, AMENDING, SUBMITTED, DRAFT} -> CLOSED"
          - "increments Case.version by 1"

      - from: EMPLOYED
        to: CLOSED_OTHER
        trigger: "POST /vr/cases/{case_id}/close"
        actor: Counselor
        preconditions:
          - "case.status == EMPLOYED"
          - "acting Counselor owns the case else ERR_FORBIDDEN"
        side_effects:
          - "status -> CLOSED_OTHER; closure_type = OTHER; closure_reason recorded"
          - "CASCADE L1: every ServiceAuthorization for this case in {REQUESTED, APPROVED} -> CANCELLED (see ServiceAuthorization cancel for L2 fund release / L3 payment void / L4 provider ledger decrement)"
          - "release slot: PriorityCategory.slots_used -= 1, available_slots += 1, category.version += 1"
          - "any non-CLOSED IPE -> CLOSED; any non-terminal Placement -> CLOSED"
          - "increments Case.version by 1"

  - entity: IPE
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vr/ipes/{ipe_id}/submit"
        actor: Counselor
        preconditions:
          - "ipe.status == DRAFT"
          - "the IPE's Case.status == PLAN_DEVELOPMENT"
        side_effects:
          - "status -> SUBMITTED"
          - "increments IPE.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vr/ipes/{ipe_id}/approve"
        actor: Supervisor
        preconditions:
          - "ipe.status == SUBMITTED"
        side_effects:
          - "status -> APPROVED; approved_by_supervisor_id set; approved_plan_version = IPE.version after increment"
          - "CROSS-ENTITY: Case PLAN_DEVELOPMENT -> SERVICES_ACTIVE (Case.version += 1)"
          - "increments IPE.version by 1"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /vr/ipes/{ipe_id}/return"
        actor: Supervisor
        preconditions:
          - "ipe.status == SUBMITTED"
        side_effects:
          - "status -> DRAFT (returned for revision)"
          - "increments IPE.version by 1"

      - from: APPROVED
        to: AMENDING
        trigger: "POST /vr/ipes/{ipe_id}/amend"
        actor: Counselor
        preconditions:
          - "ipe.status == APPROVED"
        side_effects:
          - "status -> AMENDING"
          - "increments IPE.version by 1"

      - from: AMENDING
        to: APPROVED
        trigger: "POST /vr/ipes/{ipe_id}/approve"
        actor: Supervisor
        preconditions:
          - "ipe.status == AMENDING"
        side_effects:
          - "status -> APPROVED (re-approval closes the amendment loop); approved_by_supervisor_id set; approved_plan_version = IPE.version after increment"
          - "Case status unchanged (already SERVICES_ACTIVE or later)"
          - "increments IPE.version by 1"
        note: "APPROVED -> AMENDING -> APPROVED is the cyclic amendment loop (non-linear)."

  - entity: ServiceAuthorization
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /vr/authorizations/{authorization_id}/approve"
        actor: Supervisor
        preconditions:
          - "OCC: expected_case_version == Case.version else ERR_STALE_VERSION"
          - "authorization.status == REQUESTED else ERR_INVALID_STATE"
          - "the case's most recent IPE.status == APPROVED else ERR_IPE_NOT_APPROVED"
          - "provider.status == ACTIVE AND service_category IN provider.service_categories else ERR_PROVIDER_INELIGIBLE"
          - "no other APPROVED authorization on the same case + same service_category has a service period overlapping [service_period_start, service_period_end] (closed interval; touching endpoints conflict) else ERR_AUTHORIZATION_PERIOD_OVERLAP"
          - "the provider would not exceed max_concurrent_authorizations overlapping APPROVED authorizations on half-open [start, end) else ERR_PROVIDER_CAPACITY_EXCEEDED"
          - "agency_share_cents <= Case.funds_available_cents else ERR_BUDGET_EXCEEDED"
        side_effects:
          - "status -> APPROVED; approved_by_supervisor_id set"
          - "commit funds: Case.funds_committed_cents += agency_share_cents; Case.funds_available_cents -= agency_share_cents"
          - "increments Case.version by 1"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /vr/authorizations/{authorization_id}/complete"
        actor: Provider
        preconditions:
          - "authorization.status == APPROVED else ERR_INVALID_STATE"
          - "acting Provider is the authorization's provider (authorization.provider_id == X-User-ID) else ERR_FORBIDDEN"
        side_effects:
          - "status -> COMPLETED (service delivery reported; committed funds remain until paid)"
          - "increments ServiceAuthorization.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /vr/authorizations/{authorization_id}/cancel"
        actor: Counselor
        preconditions:
          - "authorization.status == REQUESTED"
        side_effects:
          - "status -> CANCELLED (no funds were committed at REQUESTED)"
          - "increments ServiceAuthorization.version by 1"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /vr/authorizations/{authorization_id}/cancel (also fired as CASCADE L1 from Case close / rehab closure)"
        actor: Counselor
        preconditions:
          - "authorization.status == APPROVED"
        side_effects:
          - "status -> CANCELLED"
          - "CASCADE L2: release committed funds: Case.funds_committed_cents -= (agency_share_cents - amount_paid_cents); Case.funds_available_cents += (agency_share_cents - amount_paid_cents); Case.version += 1"
          - "CASCADE L3: every Payment on this authorization in {PENDING} -> VOIDED (see Payment void), which itself (L4) decrements Provider.pending_disbursement_cents"
          - "increments ServiceAuthorization.version by 1"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /vr/payments/{payment_id}/issue"
        actor: FiscalOfficer
        preconditions:
          - "payment.status == PENDING else ERR_INVALID_STATE"
          - "the authorization.status IN {APPROVED, COMPLETED}"
        side_effects:
          - "status -> ISSUED; issued_by set; compute federal_share_cents, state_share_cents (payment_federal_state_split)"
          - "Case.funds_committed_cents -= amount_cents; Case.funds_paid_cents += amount_cents; Case.version += 1"
          - "Provider.pending_disbursement_cents -= amount_cents; Provider.ledger_paid_cents += amount_cents; Provider.version += 1"
          - "ServiceAuthorization.amount_paid_cents += amount_cents"
          - "increments Payment.version by 1"

      - from: PENDING
        to: VOIDED
        trigger: "POST /vr/payments/{payment_id}/void (also fired as CASCADE L3 from ServiceAuthorization cancel)"
        actor: FiscalOfficer
        preconditions:
          - "payment.status == PENDING else ERR_INVALID_STATE"
        side_effects:
          - "status -> VOIDED"
          - "CASCADE L4: Provider.pending_disbursement_cents -= amount_cents; Provider.version += 1"
          - "increments Payment.version by 1"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /vr/payments/{payment_id}/void"
        actor: FiscalOfficer
        preconditions:
          - "payment.status == ISSUED else ERR_INVALID_STATE"
        side_effects:
          - "status -> VOIDED (compensating reversal of issue)"
          - "Case.funds_paid_cents -= amount_cents; Case.funds_committed_cents += amount_cents; Case.version += 1"
          - "Provider.ledger_paid_cents -= amount_cents; Provider.version += 1"
          - "ServiceAuthorization.amount_paid_cents -= amount_cents"
          - "increments Payment.version by 1"

  - entity: Placement
    initial_state: PLACED
    terminal_states: [CLOSED]
    transitions:
      - from: PLACED
        to: STABILIZING
        trigger: "POST /vr/placements/{placement_id}/begin-stabilization"
        actor: Counselor
        preconditions:
          - "placement.status == PLACED else ERR_INVALID_STATE"
          - "employment_type IN {COMPETITIVE_INTEGRATED, SUPPORTED} else ERR_PLACEMENT_TYPE_INVALID"
        side_effects:
          - "status -> STABILIZING; stabilization_start_date = current logical clock date"
          - "increments Placement.version by 1"

      - from: STABILIZING
        to: DESTABILIZED
        trigger: "POST /vr/placements/{placement_id}/report-loss"
        actor: Counselor
        preconditions:
          - "placement.status == STABILIZING else ERR_INVALID_STATE"
        side_effects:
          - "status -> DESTABILIZED (job loss during stabilization)"
          - "increments Placement.version by 1"

      - from: DESTABILIZED
        to: STABILIZING
        trigger: "POST /vr/placements/{placement_id}/resume"
        actor: Counselor
        preconditions:
          - "placement.status == DESTABILIZED else ERR_INVALID_STATE"
        side_effects:
          - "status -> STABILIZING; stabilization_start_date RESET to current logical clock date (90-day clock restarts)"
          - "increments Placement.version by 1"
        note: "STABILIZING -> DESTABILIZED -> STABILIZING is the cyclic destabilize/resume loop (non-linear)."

      - from: STABILIZING
        to: STABLE
        trigger: "POST /vr/placements/{placement_id}/verify-stability"
        actor: Counselor
        preconditions:
          - "placement.status == STABILIZING else ERR_INVALID_STATE"
          - "days_stable >= 90 else ERR_STABILIZATION_NOT_MET"
        side_effects:
          - "status -> STABLE; compute verified_avg_weekly_wage_cents (verified_average_weekly_wage)"
          - "CASCADE L1: Case EMPLOYED -> CLOSED_REHABILITATED (which triggers L2 slot release — see Case)"
          - "increments Placement.version by 1"

  - entity: PriorityCategory
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /vr/priority-categories/{category_id} (status=CLOSED)"
        actor: VRAdmin
        preconditions: []
        side_effects:
          - "status -> CLOSED; new eligible cases in this rank are WAITLISTED"
          - "increments PriorityCategory.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "PATCH /vr/priority-categories/{category_id} (status=OPEN)"
        actor: VRAdmin
        preconditions: []
        side_effects:
          - "status -> OPEN (waitlisted cases may then be promoted via promote-next)"
          - "increments PriorityCategory.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: authorization-approve-stale-case
    parent_entity: Case
    write_endpoint: "POST /vr/authorizations/{authorization_id}/approve"
    occ_field: "expected_case_version"
    description: |
      Approving a ServiceAuthorization commits agency_share_cents against the
      Case budget and advances Case.version. A second approval that still carries
      the Case version the client observed before an earlier approval committed
      funds is rejected as stale: its view of funds_available_cents no longer
      reflects the committed obligation. This is the CREATE/commit-with-
      contention race where a prior approval legitimately reduced the shared
      budget and the current approver's Case snapshot is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_fund_ledger
    trigger: "authorization approve (commit), authorization cancel (release), payment issue, payment void"
    algorithm: aggregation
    formula: |
      funds_committed_cents = SUM over ServiceAuthorization where status == APPROVED of
                                (agency_share_cents - amount_paid_cents)
      funds_paid_cents      = SUM over Payment where status == ISSUED (across the case's authorizations) of amount_cents
      funds_available_cents = budget_allocated_cents - funds_committed_cents - funds_paid_cents
    input_set: "APPROVED authorizations contribute to committed; ISSUED payments contribute to paid; REQUESTED/CANCELLED/COMPLETED-unpaid excluded"
    precision: "integer cents (no rounding; all inputs are whole cents)"
    variants:
      - name: total_obligation
        when: "budget-exposure / encumbrance view"
        difference: "obligation = funds_committed_cents + funds_paid_cents (money still owed plus money spent)"
      - name: total_expenditure
        when: "cash-out / RSA-911 expenditure view"
        difference: "expenditure = funds_paid_cents only; excludes still-committed obligations, so it diverges from total_obligation whenever committed > 0"

  - name: service_cost_share
    trigger: "authorization creation (POST /vr/authorizations)"
    algorithm: tiered_pricing
    formula: |
      net_cost = max(0, authorized_amount_cents - comparable_benefit_cents)   # comparable-benefits offset first
      # participation tier on the Case's monthly_income_cents:
      if monthly_income_cents <= 200000:        rate = 0.00
      elif monthly_income_cents <= 400000:      rate = 0.10
      else:                                     rate = 0.20
      consumer_share_cents = min(net_cost, round_half_up(net_cost * rate))
      agency_share_cents   = net_cost - consumer_share_cents
    input_set: "single authorization; reads Case.monthly_income_cents"
    constants:
      TIER1_INCOME_CENTS: 200000
      TIER2_INCOME_CENTS: 400000
      TIER1_RATE: 0.00
      TIER2_RATE: 0.10
      TIER3_RATE: 0.20
    precision: "round_half_up to whole cents on the multiplication; min() clamp applied after rounding"
    note: "combinatorial mode (a): >=3 inputs (authorized_amount, comparable_benefit, monthly_income) with nested max/min and a tiered branch."

  - name: payment_federal_state_split
    trigger: "payment issue (PENDING -> ISSUED); RSA-911 expenditure aggregation"
    algorithm: aggregation
    formula: |
      # Per-payment split, computed and STORED at issue time:
      federal_share_cents = round_half_up(amount_cents * FEDERAL_MATCH_RATE)
      state_share_cents   = amount_cents - federal_share_cents
      # RSA-911 totals PIN the rounding order as round-per-payment-then-sum:
      total_federal_expenditure_cents = SUM of federal_share_cents over the case's ISSUED payments
      total_state_expenditure_cents   = SUM of state_share_cents   over the case's ISSUED payments
      # This is NOT round_half_up(total_paid * FEDERAL_MATCH_RATE) — the pinned order is per-line then sum.
    input_set: "each ISSUED payment individually; RSA-911 sums the already-rounded per-payment shares"
    constants:
      FEDERAL_MATCH_RATE: 0.787
    precision: "round_half_up to whole cents per payment; totals are exact sums of the rounded per-payment shares"
    note: "combinatorial mode (b): rounding order is pinned (round per line item, then sum) and differs from sum-then-round."

  - name: verified_average_weekly_wage
    trigger: "placement verify-stability (STABILIZING -> STABLE)"
    algorithm: aggregation
    formula: |
      window = ProgressReview where placement_id == placement.id
               AND review_date >= placement.stabilization_start_date
               AND review_date <= current_logical_clock_date
      n = count(window)
      if n == 0: verified_avg_weekly_wage_cents = null
      else:      verified_avg_weekly_wage_cents = round_half_up( SUM(reported_weekly_wage_cents over window) / n )
    input_set: "ProgressReviews within [stabilization_start_date, now]; reviews dated before the current stabilization_start_date (e.g. from a pre-resume window) are excluded"
    precision: "round_half_up to whole cents on the division"
    variants:
      - name: projected_weekly_wage
        when: "at placement time / plan projection"
        difference: "uses Placement.weekly_wage_cents supplied at hire; a single forward-looking estimate"
      - name: verified_weekly_wage
        when: "at 90-day closure"
        difference: "uses the average of ProgressReview.reported_weekly_wage_cents over the stabilization window; diverges from projected whenever reported wages differ from the hire estimate"

  - name: priority_category_slots
    trigger: "eligibility reserve, promote-next reserve, case closure release"
    algorithm: aggregation
    formula: |
      slots_used      = COUNT of Case where priority_category_id == category.id AND status IN {PLAN_DEVELOPMENT, SERVICES_ACTIVE, EMPLOYED}
      available_slots = slot_capacity - slots_used
    input_set: "Cases actively holding a slot (WAITLISTED and terminal cases excluded)"
    precision: "integer counts; available_slots is never allowed below 0 (reservation blocked at 0)"

  - name: promote_next_selector
    trigger: "POST /vr/priority-categories/{category_id}/promote-next"
    algorithm: chronological
    formula: |
      candidates = Case where priority_category_id == category.id AND status == WAITLISTED
      if candidates empty: ERR_NO_WAITLISTED_CASE
      if category.available_slots == 0: ERR_NO_SLOT_AVAILABLE
      chosen = candidate minimizing waitlisted_at; tie-break minimizing created_at
      -> promote chosen (WAITLISTED -> PLAN_DEVELOPMENT)
    input_set: "WAITLISTED cases in the category"
    precision: "deterministic ordering by waitlisted_at ASC then created_at ASC (never by id)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation; entity_backed roles must own the target resource (Counselor owns case; Provider owns authorization)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types correct, enums in range, dates parseable, service_period_start <= service_period_end"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "Monetary amount fields (payment amount_cents, authorized_amount_cents) must be > 0"
    error_id: ERR_AMOUNT_NOT_POSITIVE
    http_status: 422
    applies_to: "POST /vr/payments, POST /vr/authorizations"

  - priority: 6
    category: business_constraint
    check: "Eligibility ELIGIBLE requires a PriorityCategory with the rank of the disability_significance"
    error_id: ERR_CATEGORY_NOT_FOUND
    http_status: 422
    applies_to: "POST /vr/cases/{case_id}/eligibility"

  - priority: 7
    category: state
    check: "OCC: expected_case_version matches current Case.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vr/authorizations/{authorization_id}/approve"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_constraint
    check: "IPE existence/uniqueness: only one active IPE (DRAFT/SUBMITTED/APPROVED/AMENDING) per case"
    error_id: ERR_ACTIVE_IPE_EXISTS
    http_status: 409
    applies_to: "POST /vr/ipes"

  - priority: 10
    category: state
    check: "Authorization approval requires the case's IPE to be APPROVED"
    error_id: ERR_IPE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /vr/authorizations/{authorization_id}/approve, POST /vr/placements"

  - priority: 11
    category: business_referential
    check: "Authorization approval: provider ACTIVE and approved for the service_category"
    error_id: ERR_PROVIDER_INELIGIBLE
    http_status: 422
    applies_to: "POST /vr/authorizations/{authorization_id}/approve"

  - priority: 12
    category: business_temporal
    check: "Authorization approval: no overlapping APPROVED authorization on the same case + service_category (closed interval; adjacency conflicts)"
    error_id: ERR_AUTHORIZATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /vr/authorizations/{authorization_id}/approve"

  - priority: 13
    category: business_temporal
    check: "Authorization approval: provider's overlapping APPROVED authorizations (half-open [start,end)) would not exceed max_concurrent_authorizations"
    error_id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /vr/authorizations/{authorization_id}/approve"

  - priority: 14
    category: business_temporal
    check: "Placement verify-stability: days_stable >= 90"
    error_id: ERR_STABILIZATION_NOT_MET
    http_status: 409
    applies_to: "POST /vr/placements/{placement_id}/verify-stability"

  - priority: 15
    category: business_constraint
    check: "begin-stabilization requires employment_type IN {COMPETITIVE_INTEGRATED, SUPPORTED}"
    error_id: ERR_PLACEMENT_TYPE_INVALID
    http_status: 409
    applies_to: "POST /vr/placements/{placement_id}/begin-stabilization"

  - priority: 16
    category: business_fiscal
    check: "Payment amount must not exceed the authorization's remaining obligation (agency_share_cents - amount_paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_AUTHORIZATION
    http_status: 409
    applies_to: "POST /vr/payments"

  - priority: 17
    category: business_fiscal
    check: "Authorization approval: agency_share_cents must not exceed Case.funds_available_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /vr/authorizations/{authorization_id}/approve"

  - priority: 18
    category: business_constraint
    check: "promote-next: category has an available slot"
    error_id: ERR_NO_SLOT_AVAILABLE
    http_status: 409
    applies_to: "POST /vr/priority-categories/{category_id}/promote-next"

  - priority: 19
    category: business_constraint
    check: "promote-next: at least one WAITLISTED case exists in the category"
    error_id: ERR_NO_WAITLISTED_CASE
    http_status: 409
    applies_to: "POST /vr/priority-categories/{category_id}/promote-next"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Actors / config (VRAdmin) ----
  - method: POST
    path: "/vr/counselors"
    description: "Register a VR counselor"
    roles: [VRAdmin]
    code: 201
    input: [name, email, unit]
    output: Counselor
    side_effects: []

  - method: POST
    path: "/vr/supervisors"
    description: "Register a VR supervisor"
    roles: [VRAdmin]
    code: 201
    input: [name, email]
    output: Supervisor
    side_effects: []

  - method: POST
    path: "/vr/providers"
    description: "Onboard a service provider / vendor"
    roles: [VRAdmin]
    code: 201
    input: [name, service_categories, max_concurrent_authorizations, "status?"]
    output: Provider
    side_effects: ["status defaults to ACTIVE; ledger fields initialized to 0"]

  - method: GET
    path: "/vr/providers/{provider_id}"
    description: "Get a provider (including ledger fields)"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/vr/priority-categories"
    description: "Create an order-of-selection priority category"
    roles: [VRAdmin]
    code: 201
    input: [rank, label, slot_capacity, "status?"]
    output: PriorityCategory
    side_effects: ["slots_used=0, available_slots=slot_capacity"]

  - method: GET
    path: "/vr/priority-categories/{category_id}"
    description: "Get a priority category (with slot counts)"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: PriorityCategory
    side_effects: []

  - method: GET
    path: "/vr/priority-categories"
    description: "List priority categories"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["rank?", "status?", "limit?", "offset?"]
    output: PriorityCategory[]
    side_effects: []

  - method: PATCH
    path: "/vr/priority-categories/{category_id}"
    description: "Open/close a category or adjust slot capacity"
    roles: [VRAdmin]
    code: 200
    input: ["status?", "slot_capacity?"]
    output: PriorityCategory
    side_effects: ["recompute available_slots; increments PriorityCategory.version by 1"]

  - method: POST
    path: "/vr/priority-categories/{category_id}/promote-next"
    description: "Promote the next waitlisted case in this category into PLAN_DEVELOPMENT"
    roles: [VRAdmin]
    code: 200
    input: []
    output: Case
    side_effects:
      - "selector picks WAITLISTED case min(waitlisted_at) tie-break min(created_at)"
      - "chosen Case WAITLISTED -> PLAN_DEVELOPMENT; reserve slot; Case.version++, PriorityCategory.version++"

  - method: POST
    path: "/vr/_clock/set_current_utc"
    description: "Test-driving: set the logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Case ----
  - method: POST
    path: "/vr/cases"
    description: "Create a referral (opens a Case in REFERRED). counselor_id set from X-User-ID."
    roles: [Counselor]
    code: 201
    input: [consumer_full_name, consumer_dob, disability_type, referral_source, monthly_income_cents, "budget_allocated_cents?"]
    output: Case
    side_effects: ["status=REFERRED; counselor_id=X-User-ID; fund fields initialized"]

  - method: GET
    path: "/vr/cases/{case_id}"
    description: "Get a case (with fund fields)"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/vr/cases"
    description: "List cases (filterable) — reverse lookup for Case.counselor_id and Case.priority_category_id"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["status?", "counselor_id?", "priority_category_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/vr/cases/{case_id}/application"
    description: "Record signed application (REFERRED -> APPLICATION)"
    roles: [Counselor]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> APPLICATION"]

  - method: POST
    path: "/vr/cases/{case_id}/eligibility"
    description: "Record eligibility determination (APPLICATION -> ELIGIBLE branch or INELIGIBLE)"
    roles: [Counselor]
    code: 200
    input: [decision, disability_significance]
    output: Case
    side_effects:
      - "decision=INELIGIBLE -> status INELIGIBLE"
      - "decision=ELIGIBLE -> assign priority_category_id by rank; reserve slot -> PLAN_DEVELOPMENT, or no slot -> WAITLISTED"

  - method: POST
    path: "/vr/cases/{case_id}/close"
    description: "Close a case for a non-rehabilitated reason (any non-terminal -> CLOSED_OTHER)"
    roles: [Counselor]
    code: 200
    input: [closure_reason]
    output: Case
    side_effects:
      - "status -> CLOSED_OTHER; cascade cancel open authorizations; release slot if held"

  - method: GET
    path: "/vr/cases/{case_id}/rsa911"
    description: "Computed RSA-911 closure/expenditure record for the case"
    roles: [VRAdmin, Counselor, Supervisor]
    code: 200
    input: []
    output: { case_id: string, disability_type: string, disability_significance: string, employment_outcome: string, competitive_integrated: boolean, verified_weekly_wage_cents: integer, total_federal_expenditure_cents: integer, total_state_expenditure_cents: integer, closure_type: string, closure_reason: string }
    side_effects: []

  # ---- IPE ----
  - method: POST
    path: "/vr/ipes"
    description: "Create an IPE draft for a case in PLAN_DEVELOPMENT"
    roles: [Counselor]
    code: 201
    input: [case_id, employment_goal, goal_wage_target_cents]
    output: IPE
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/vr/ipes/{ipe_id}"
    description: "Get an IPE"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: IPE
    side_effects: []

  - method: GET
    path: "/vr/ipes"
    description: "List IPEs — reverse lookup for IPE.case_id"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: IPE[]
    side_effects: []

  - method: POST
    path: "/vr/ipes/{ipe_id}/submit"
    description: "Submit IPE for approval (DRAFT -> SUBMITTED)"
    roles: [Counselor]
    code: 200
    input: []
    output: IPE
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/vr/ipes/{ipe_id}/approve"
    description: "Approve an IPE (SUBMITTED or AMENDING -> APPROVED)"
    roles: [Supervisor]
    code: 200
    input: []
    output: IPE
    side_effects: ["status -> APPROVED; on first approval Case PLAN_DEVELOPMENT -> SERVICES_ACTIVE"]

  - method: POST
    path: "/vr/ipes/{ipe_id}/return"
    description: "Return a submitted IPE for revision (SUBMITTED -> DRAFT)"
    roles: [Supervisor]
    code: 200
    input: []
    output: IPE
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/vr/ipes/{ipe_id}/amend"
    description: "Open an approved IPE for amendment (APPROVED -> AMENDING)"
    roles: [Counselor]
    code: 200
    input: []
    output: IPE
    side_effects: ["status -> AMENDING"]

  # ---- ServiceAuthorization ----
  - method: POST
    path: "/vr/authorizations"
    description: "Request a service authorization; computes consumer/agency cost share"
    roles: [Counselor]
    code: 201
    input: [case_id, ipe_id, provider_id, service_category, authorized_amount_cents, service_period_start, service_period_end, "comparable_benefit_cents?"]
    output: ServiceAuthorization
    side_effects: ["status=REQUESTED; compute consumer_share_cents, agency_share_cents (service_cost_share); requested_by set"]

  - method: GET
    path: "/vr/authorizations/{authorization_id}"
    description: "Get a service authorization"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: ServiceAuthorization
    side_effects: []

  - method: GET
    path: "/vr/authorizations"
    description: "List authorizations — reverse lookup for case_id, ipe_id, provider_id"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["case_id?", "ipe_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: ServiceAuthorization[]
    side_effects: []

  - method: POST
    path: "/vr/authorizations/{authorization_id}/approve"
    description: "Approve an authorization; commits funds (OCC-guarded on the Case)"
    roles: [Supervisor]
    code: 200
    input: [expected_case_version]
    output: ServiceAuthorization
    side_effects:
      - "status -> APPROVED; commit agency_share_cents to Case funds"
      - "increments Case.version by 1"

  - method: POST
    path: "/vr/authorizations/{authorization_id}/complete"
    description: "Provider reports service delivery (APPROVED -> COMPLETED)"
    roles: [Provider]
    code: 200
    input: []
    output: ServiceAuthorization
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/vr/authorizations/{authorization_id}/cancel"
    description: "Cancel an authorization (REQUESTED or APPROVED -> CANCELLED); releases funds, voids pending payments"
    roles: [Counselor]
    code: 200
    input: []
    output: ServiceAuthorization
    side_effects: ["status -> CANCELLED; release committed funds; cascade void PENDING payments"]

  # ---- Payment ----
  - method: POST
    path: "/vr/payments"
    description: "Create a pending payment against an approved/completed authorization"
    roles: [FiscalOfficer]
    code: 201
    input: [authorization_id, amount_cents]
    output: Payment
    side_effects: ["status=PENDING; provider_id copied from authorization; Provider.pending_disbursement_cents += amount_cents"]

  - method: GET
    path: "/vr/payments/{payment_id}"
    description: "Get a payment"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/vr/payments"
    description: "List payments — reverse lookup for authorization_id, provider_id"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["authorization_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/vr/payments/{payment_id}/issue"
    description: "Issue a pending payment (PENDING -> ISSUED); computes federal/state split"
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> ISSUED; move committed->paid; update provider ledger; compute federal/state split"]

  - method: POST
    path: "/vr/payments/{payment_id}/void"
    description: "Void a payment (PENDING or ISSUED -> VOIDED); compensating reversal"
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> VOIDED; reverse ledger effects"]

  # ---- Placement ----
  - method: POST
    path: "/vr/placements"
    description: "Record a job placement (case SERVICES_ACTIVE -> EMPLOYED)"
    roles: [Counselor]
    code: 201
    input: [case_id, ipe_id, employer_name, placement_date, weekly_wage_cents, hours_per_week, employment_type]
    output: Placement
    side_effects: ["status=PLACED; Case -> EMPLOYED"]

  - method: GET
    path: "/vr/placements/{placement_id}"
    description: "Get a placement"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/vr/placements"
    description: "List placements — reverse lookup for case_id, ipe_id"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["case_id?", "ipe_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/vr/placements/{placement_id}/begin-stabilization"
    description: "Begin the 90-day stabilization window (PLACED -> STABILIZING)"
    roles: [Counselor]
    code: 200
    input: []
    output: Placement
    side_effects: ["status -> STABILIZING; stabilization_start_date = clock date"]

  - method: POST
    path: "/vr/placements/{placement_id}/report-loss"
    description: "Report job loss during stabilization (STABILIZING -> DESTABILIZED)"
    roles: [Counselor]
    code: 200
    input: []
    output: Placement
    side_effects: ["status -> DESTABILIZED"]

  - method: POST
    path: "/vr/placements/{placement_id}/resume"
    description: "Resume stabilization after re-employment (DESTABILIZED -> STABILIZING); resets the 90-day clock"
    roles: [Counselor]
    code: 200
    input: []
    output: Placement
    side_effects: ["status -> STABILIZING; stabilization_start_date reset to clock date"]

  - method: POST
    path: "/vr/placements/{placement_id}/verify-stability"
    description: "Verify 90-day stabilization (STABILIZING -> STABLE); auto-closes the case as rehabilitated"
    roles: [Counselor]
    code: 200
    input: []
    output: Placement
    side_effects: ["status -> STABLE; compute verified_avg_weekly_wage_cents; Case -> CLOSED_REHABILITATED"]

  # ---- ProgressReview (sub-resource of Placement) ----
  - method: POST
    path: "/vr/progress-reviews"
    description: "Append a progress review to a placement"
    roles: [Counselor]
    code: 201
    input: [placement_id, review_date, reported_weekly_wage_cents, "status_ok?"]
    output: ProgressReview
    side_effects: []

  - method: GET
    path: "/vr/placements/{id}/progress-reviews"
    description: "List progress reviews for a placement (reverse lookup for ProgressReview.placement_id)"
    roles: [VRAdmin, Counselor, Supervisor, FiscalOfficer, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: ProgressReview[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed role does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad type, invalid enum, unparseable date, or service_period_start > service_period_end" }
  - { id: ERR_AMOUNT_NOT_POSITIVE, http: 422, condition: "A monetary amount (payment amount_cents or authorized_amount_cents) is <= 0" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 422, condition: "No PriorityCategory exists with the rank of the case's disability_significance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_ACTIVE_IPE_EXISTS, http: 409, condition: "The case already has an active IPE (DRAFT/SUBMITTED/APPROVED/AMENDING)" }
  - { id: ERR_IPE_NOT_APPROVED, http: 409, condition: "Operation requires the case's IPE to be APPROVED" }
  - { id: ERR_PROVIDER_INELIGIBLE, http: 422, condition: "Provider is SUSPENDED or not approved for the authorization's service_category" }
  - { id: ERR_AUTHORIZATION_PERIOD_OVERLAP, http: 409, condition: "Another APPROVED authorization on the same case + service_category has an overlapping (closed-interval) service period" }
  - { id: ERR_PROVIDER_CAPACITY_EXCEEDED, http: 409, condition: "Approving would exceed the provider's max_concurrent_authorizations overlapping (half-open) APPROVED authorizations" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "agency_share_cents exceeds Case.funds_available_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_AUTHORIZATION, http: 409, condition: "Payment amount exceeds the authorization's remaining obligation (agency_share_cents - amount_paid_cents)" }
  - { id: ERR_STABILIZATION_NOT_MET, http: 409, condition: "Placement days_stable < 90 at verify-stability" }
  - { id: ERR_PLACEMENT_TYPE_INVALID, http: 409, condition: "begin-stabilization on a placement whose employment_type is not COMPETITIVE_INTEGRATED or SUPPORTED" }
  - { id: ERR_NO_SLOT_AVAILABLE, http: 409, condition: "promote-next when the category has no available slot" }
  - { id: ERR_NO_WAITLISTED_CASE, http: 409, condition: "promote-next when no WAITLISTED case exists in the category" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VRAdmin
    description: "Operational/administrative role: onboards counselors, supervisors, providers, priority categories; opens/closes categories; promotes waitlisted cases; sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /vr/counselors"
      - "POST /vr/supervisors"
      - "POST /vr/providers"
      - "POST /vr/priority-categories"
      - "PATCH /vr/priority-categories/{category_id}"
      - "POST /vr/priority-categories/{category_id}/promote-next"
    shared_operations:
      - "POST /vr/_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: Counselor
    description: "Owns cases: referral, application, eligibility, IPE authoring, authorization requests, placements, progress reviews, closure. Must own the case being acted on."
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /vr/cases"
      - "POST /vr/cases/{case_id}/application"
      - "POST /vr/cases/{case_id}/eligibility"
      - "POST /vr/cases/{case_id}/close"
      - "POST /vr/ipes and /vr/ipes/{ipe_id}/submit, /amend"
      - "POST /vr/authorizations and /vr/authorizations/{authorization_id}/cancel"
      - "POST /vr/placements and all placement stabilization transitions"
      - "POST /vr/progress-reviews"
    shared_operations:
      - "POST /vr/_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: Supervisor
    description: "Approval authority: approves/returns IPEs, approves authorizations (commits funds). Cannot perform the Counselor's request steps."
    identity: "entity_backed:Supervisor"
    exclusive_operations:
      - "POST /vr/ipes/{ipe_id}/approve"
      - "POST /vr/ipes/{ipe_id}/return"
      - "POST /vr/authorizations/{authorization_id}/approve"
    shared_operations:
      - "POST /vr/_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: FiscalOfficer
    description: "Fiscal role: creates, issues, and voids provider payments. Segregated from authorization request/approval."
    identity: opaque
    exclusive_operations:
      - "POST /vr/payments"
      - "POST /vr/payments/{payment_id}/issue"
      - "POST /vr/payments/{payment_id}/void"
    shared_operations:
      - "POST /vr/_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: Provider
    description: "Vendor: reports service delivery on its own authorizations. Must own the authorization (authorization.provider_id == X-User-ID)."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /vr/authorizations/{authorization_id}/complete"
    shared_operations:
      - "POST /vr/_clock/set_current_utc"
      - "GET (all read endpoints)"
