# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1156 — Cabinet Manufacturing Plant (KCMA)
# Breadth probe across the claim-extraction-guide taxonomy. Instances already
# exercised by §1.8 appear as excluded_because stubs. Logical clock default:
# 2026-05-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: dealer_create_returns_full_entity
        claim_type: creation
        grounds: [entities.Dealer, "endpoints[POST /kcma/dealers]"]
        distinguishing_aspect: "POST /dealers with all required fields returns 201 with the input fields echoed and system fields initialized."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/dealers"
              payload: { name: "Acme Cabinets", dealer_code: "ACME", price_level: "L2", credit_limit_cents: 5000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id, d_level: $.data.price_level, d_v: $.data.version }
          assert:
            - "response 201; Dealer.price_level == L2; credit_limit_cents == 5000000; version == 1; id is a server-minted UUID"

      - name: finish_spec_default_tolerance_applied
        claim_type: defaults
        grounds: [entities.FinishSpec.fields.delta_e_tolerance]
        distinguishing_aspect: "Omitting delta_e_tolerance applies the declared default 1.5."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-D", color_name: "Maple", sheen: "MATTE", upcharge_pct: 0.05 }
              as: PlantAdmin
              captures: { fs_tol: $.data.delta_e_tolerance, fs_active: $.data.active }
          assert:
            - "FinishSpec.delta_e_tolerance == 1.5"
            - "FinishSpec.active == true (default)"

      - name: order_create_initial_compound_state
        claim_type: creation
        grounds: [entities.Order, state_machines.Order]
        distinguishing_aspect: "New order starts DRAFT with hold_status NONE, cube_ft 0, and price_level_snapshot copied from the creating dealer (L3), proving the snapshot is immune to later dealer edits."
        test_recipe:
          setup: ["Dealer D at L3"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_status: $.data.status, o_hold: $.data.hold_status, o_cube: $.data.cube_ft, o_snap: $.data.price_level_snapshot, o_dealer: $.data.dealer_id }
            - call: "PUT /kcma/dealers/${d_id}"
              payload: { price_level: "L5" }
              as: PlantAdmin
            - call: "GET /kcma/orders/${o_dealer}"
              as: PlantAdmin
          assert:
            - "Order.status == DRAFT, hold_status == NONE, cube_ft == 0"
            - "Order.price_level_snapshot == L3"
            - "Order.dealer_id == ${d_id} (taken from X-User-ID)"
            - "after dealer price_level -> L5, existing order snapshot remains L3"

      - name: order_line_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.OrderLine.fields.line_list_cents, entities.OrderLine.fields.finish_upcharge_cents, calculations.order_line_pricing]
        distinguishing_aspect: "line_list_cents and finish_upcharge_cents are computed at creation from the finish snapshot: unit 40,000 x qty 3 = 120,000; upcharge round(120,000 x 0.10) = 12,000."
        test_recipe:
          setup: ["Dealer L3; active FinishSpec FS upcharge 0.10; DRAFT order O"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-10", color_name: "Oak", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 3, unit_list_price_cents: 40000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { l_list: $.data.line_list_cents, l_up: $.data.finish_upcharge_cents, l_snap: $.data.finish_upcharge_pct_snapshot, l_status: $.data.status }
          assert:
            - "OrderLine.line_list_cents == 120000"
            - "OrderLine.finish_upcharge_cents == 12000"
            - "OrderLine.finish_upcharge_pct_snapshot == 0.10"
            - "OrderLine.status == PENDING (initial state)"

      - name: order_line_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.OrderLine]
        distinguishing_aspect: "Client-supplied id/created_at in the create payload are ignored; the server mints its own id."
        test_recipe:
          setup: ["Dealer L3; active finish; DRAFT order"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-10", color_name: "Oak", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 40000, id: "client-forged-id", created_at: "1999-01-01T00:00:00Z" }
              as: Dealer
              as_user_id: ${d_id}
              captures: { l_id: $.data.id, l_created: $.data.created_at }
          assert:
            - "OrderLine.id != 'client-forged-id' (server-minted)"
            - "OrderLine.created_at != 1999-01-01T00:00:00Z"

      - name: part_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Part]
        distinguishing_aspect: "Part declares common_fields: false — its GET representation carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Dealer L3; DoorStyle; FinishSpec upcharge 0.0; Component SHEET_GOODS 96x48 on_hand 100"
            - "SUBMITTED door order (line 15x30 qty 2); station ST changeover 0; run released so parts exist"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SLAB", name: "Slab", construction: "SLAB", base_list_price_cents: 15000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/components"
              payload: { sku: "PLY-48X96", description: "Plywood sheet", kind: "SHEET_GOODS", sheet_width_in: 96, sheet_height_in: 48, on_hand_qty: 100 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 2, unit_list_price_cents: 10000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/nesting-stations"
              payload: { station_code: "ST-1", changeover_minutes: 0 }
              as: PlantAdmin
              captures: { st_id: $.data.id }
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${ol_id}"], scheduled_date: "2026-05-02", start_minute: 60, end_minute: 240 }
              as: ProductionPlanner
              captures: { nr_id: $.data.id }
            - call: "POST /kcma/nesting-runs/${nr_id}/release"
              as: ProductionPlanner
          trigger:
            - call: "GET /kcma/parts?nesting_run_id=${nr_id}"
              as: ProductionPlanner
              captures: { p_id: "$.data[0].id" }
          assert:
            - "Part has id and created_at but no version and no updated_at keys"
            - "Part.part_kind == DOOR_BLANK; width_in == 15; height_in == 30; qty == 2"

      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /kcma/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND, http 404"

      - name: hold_release_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_HOLD_NOT_FOUND]"]
        distinguishing_aspect: "Releasing a non-existent hold id returns 404 ERR_HOLD_NOT_FOUND (existence checked before state)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/order-holds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/release"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOLD_NOT_FOUND, http 404"

      - name: finish_list_pagination_defaults_and_limit
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /kcma/finish-specs]"]
        distinguishing_aspect: "With 3 finishes, GET ?limit=2 returns 2 rows with total_count 3 and has_more true; the default GET returns all 3 (default limit 10)."
        test_recipe:
          setup: ["three finish specs created"]
          setup_api_calls:
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-P1", color_name: "C1", sheen: "MATTE", upcharge_pct: 0.0 }
              as: PlantAdmin
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-P2", color_name: "C2", sheen: "SATIN", upcharge_pct: 0.0 }
              as: PlantAdmin
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-P3", color_name: "C3", sheen: "SEMI_GLOSS", upcharge_pct: 0.0 }
              as: PlantAdmin
          trigger:
            - call: "GET /kcma/finish-specs?limit=2"
              as: PlantAdmin
            - call: "GET /kcma/finish-specs"
              as: PlantAdmin
          assert:
            - "?limit=2: len(data) == 2, total_count == 3, has_more == true"
            - "default: len(data) == 3, total_count == 3, has_more == false"

      - name: dealer_duplicate_code_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_CODE]", entities.Dealer.fields.dealer_code]
        distinguishing_aspect: "Second dealer with the same dealer_code is rejected with ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["Dealer ACME exists"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Acme", dealer_code: "ACME", price_level: "L1", credit_limit_cents: 1000 }
              as: PlantAdmin
          trigger:
            - call: "POST /kcma/dealers"
              payload: { name: "Acme Clone", dealer_code: "ACME", price_level: "L2", credit_limit_cents: 2000 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CODE, http 400"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_already_submitted_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.Order.SUBMITTED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_double_submit
          rationale: "The second submit in that §1.8 recipe is exactly the SUBMITTED->submit invalid transition; asserted via ERR_ORDER_NOT_SUBMITTABLE."

      - name: cancel_shipped_order_rejected_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Order, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "SHIPPED is terminal for cancel: a fully shipped door order rejects cancel with ERR_ORDER_NOT_CANCELLABLE and no compensation cascade fires (batch count and line status untouched)."
        test_recipe:
          setup:
            - "Dealer L4 credit high; DoorStyle DS; FinishSpec FS upcharge 0.10 tol 1.5"
            - "Door order O (line qty 4) fully shipped via batch release + route dispatch"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L4", dealer_code: "DL4", price_level: "L4", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SHK", name: "Shaker", construction: "SHAKER", base_list_price_cents: 30000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 4, unit_list_price_cents: 30000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.0 }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-T", route_date: "2026-05-04", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
          trigger:
            - call: "POST /kcma/orders/${o_id}/cancel"
              as: Dealer
              as_user_id: ${d_id}
              captures: { err: $.data.error_id }
            - call: "GET /kcma/order-lines/${ol_id}"
              as: PlantAdmin
              captures: { l_status: $.data.status }
          assert:
            - "error_id == ERR_ORDER_NOT_CANCELLABLE, http 409"
            - "OrderLine.${ol_id}.status remains SHIPPED (no compensation fired)"

      - name: review_already_approved_mod_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.ModificationRequest, "errors[ERR_MOD_NOT_REVIEWABLE]"]
        distinguishing_aspect: "APPROVED is terminal: a second review returns ERR_MOD_NOT_REVIEWABLE."
        test_recipe:
          setup: ["Dealer L3; finish; DRAFT order with BOX line; mod UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "TOE_KICK_NOTCH", new_dimension_in: 4 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { mod_id: $.data.id }
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "APPROVE" }
              as: Engineer
          trigger:
            - call: "POST /kcma/modifications/${mod_id}/review"
              payload: { decision: "REJECT", note: "changed mind" }
              as: Engineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MOD_NOT_REVIEWABLE, http 409; mod remains APPROVED"

      - name: resubmit_under_review_mod_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ModificationRequest, "errors[ERR_MOD_NOT_RESUBMITTABLE]"]
        distinguishing_aspect: "resubmit is legal only from CHANGES_REQUESTED; from UNDER_REVIEW it returns ERR_MOD_NOT_RESUBMITTABLE."
        test_recipe:
          setup: ["Dealer L3; finish; DRAFT order with BOX line; mod UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/order-lines/${ol_id}/modifications"
              payload: { mod_code: "CUSTOM_BORE", new_dimension_in: 3 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /kcma/modifications/${mod_id}/resubmit"
              payload: { new_dimension_in: 4 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MOD_NOT_RESUBMITTABLE, http 409; revision stays 1"

      - name: release_run_twice_rejected_idempotent_guard
        claim_type: invalid_transition
        grounds: [state_machines.NestingRun, "errors[ERR_RUN_NOT_RELEASABLE]"]
        distinguishing_aspect: "RELEASED is terminal: a second release returns ERR_RUN_NOT_RELEASABLE and does not double-reserve sheets (reserved_qty stays 1)."
        test_recipe:
          setup:
            - "Dealer L3; style; finish upcharge 0; component 96x48 on_hand 100; SUBMITTED door order line 15x30 qty 1"
            - "station ST changeover 0; run over the line released once (area 450 in2 -> sheets = ceil(450*1.12/4608) = 1)"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SLAB", name: "Slab", construction: "SLAB", base_list_price_cents: 15000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/components"
              payload: { sku: "PLY-48X96", description: "Plywood sheet", kind: "SHEET_GOODS", sheet_width_in: 96, sheet_height_in: 48, on_hand_qty: 100 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 1, unit_list_price_cents: 10000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/nesting-stations"
              payload: { station_code: "ST-1", changeover_minutes: 0 }
              as: PlantAdmin
              captures: { st_id: $.data.id }
            - call: "POST /kcma/nesting-runs"
