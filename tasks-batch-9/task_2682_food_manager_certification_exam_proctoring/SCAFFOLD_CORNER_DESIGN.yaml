      - name: accommodation_review_open_then_approve_records_multiplier_and_reviewer
        claim_type: valid_transition
        grounds:
          - state_machines.AccommodationRequest.REQUESTED_to_UNDER_REVIEW
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_APPROVED
          - endpoints[POST /accommodation-requests/{id}/review]
        distinguishing_aspect: |
          The two-step adjudication is the happy path of the AccommodationRequest machine: review-open
          moves REQUESTED -> UNDER_REVIEW without deciding anything (approved_multiplier still null), and
          only the review call writes approved_multiplier 1.5, reviewed_by_user_id and the terminal
          APPROVED state. The approved multiplier is what the review supplies, not the candidate's
          requested 1.75 — a decision may grant less than was asked for.
        test_recipe:
          setup:
            - "Baseline jurisdiction / provider / one candidate."
            - "One AccommodationRequest of type EXTRA_TIME with requested_multiplier 1.75, still in REQUESTED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_id}", accommodation_type: "EXTRA_TIME", requested_multiplier: 1.75, documentation_ref: "DOC-ADA-118" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { acc_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /accommodation-requests/${acc_id}/review-open"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-access-4"
              captures: { st1: $.data.status, mult_mid: $.data.approved_multiplier }
            - call: "POST /accommodation-requests/${acc_id}/review"
              payload: { decision: "APPROVE", approved_multiplier: 1.5, decision_reason: "Documentation supports 1.5x only" }
              as: PlatformAdmin
              as_user_id: "admin-access-4"
              captures: { st2: $.data.status, mult_final: $.data.approved_multiplier, reviewer: $.data.reviewed_by_user_id }
          assert:
            - "at creation status == REQUESTED with approved_multiplier == null and reviewed_by_user_id == null"
            - "after review-open status == UNDER_REVIEW and approved_multiplier is STILL null — opening a review decides nothing"
            - "after review status == APPROVED, approved_multiplier == 1.5 (not the requested 1.75), reviewed_by_user_id == \"admin-access-4\", decision_reason == \"Documentation supports 1.5x only\""
            - "requested_multiplier is unchanged at 1.75 — the request record keeps what was asked for"
