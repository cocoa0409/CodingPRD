            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH T32-5101", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00, requires_mentoring_plan: true, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_51"
