              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "119 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB18" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 48000000, actor_agent_id: "${ba_id}" }
              as: BuyerAgent
