scenario: |
  Generate task harder than expert level!

  2702. Renewable Diesel Plant & Feedstock Sourcing (renewable fuels production facility): feedstock procurement across used cooking oil, tallow, distillers corn oil and vegetable oils with carbon intensity differentials, feedstock quality testing for free fatty acids, moisture and contaminants with pretreatment requirements, supplier due diligence and traceability documentation required for credit programs, hydrotreating unit operation with hydrogen supply, catalyst life and yield optimization, product distribution across renewable diesel and sustainable aviation fuel with certification requirements, credit generation under renewable fuel and low carbon fuel programs with pathway registration and verification, feedstock and credit price volatility management with hedging, plant turnaround planning and catalyst change scheduling

domain_name: renewable-diesel-feedstock-sourcing

# Flat topology: every entity collection is a root-level path segment
# (`/suppliers`, `/feedstock-lots`, `/processing-runs`, ...). There is no single
# owning aggregate root in the URL, so the api_prefix is the server root.
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nesting in URL paths.
  # `FeedstockLot.source_lot_id` makes the lot table self-referential
  # (raw lot -> pretreated child lot), and `FeedstockAllocation` is a
  # many-to-many junction between FeedstockLot and ProcessingRun.

  state_machine_shape: cyclic
  # PathwayRegistration cycles SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO ->
  # SUBMITTED with a bounded revision counter; ProductBatch carries two
  # independent state dimensions (cert_status x distribution_status);
  # ProcessingRun can be auto-downgraded HYDROGEN_SECURED -> PLANNED by a
  # cascade, which is itself a loop back onto an earlier state.

  relationship_patterns:
    - one_to_many          # Supplier -> FeedstockLot, HydrotreatingUnit -> CatalystCharge
    - many_to_many         # FeedstockLot <-> ProcessingRun via FeedstockAllocation
    - self_referential     # FeedstockLot.source_lot_id -> FeedstockLot.id
    - cross_aggregate      # CreditBlock references both ProductBatch and PathwayRegistration

  role_model: segregation_of_duties
  # The ComplianceOfficer who registered a pathway may not sign off the credit
  # blocks minted against it; verification decisions belong exclusively to the
  # IndependentVerifier; quality dispositions belong exclusively to the
  # QualityAnalyst.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the feedstock supplier.
        constraints: 1..120 chars, non-blank
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the collection/origin point.
        constraints: exactly 2 uppercase letters
      - name: feedstock_types
        type: array
        source: input
        description: Feedstock types this supplier is approved to deliver.
        constraints: "non-empty array; each member IN {UCO, TALLOW, DCO, SOYBEAN_OIL, CANOLA_OIL}"
      - name: is_high_risk_origin
        type: boolean
        source: input
        description: Origin flagged high-risk for fraud/indirect land-use, raising the traceability document bar.
        default: false
      - name: dd_status
        type: enum
        source: computed
        description: Due-diligence posture derived from verification and suspension actions.
        default: PENDING
        constraints: "IN {PENDING, VERIFIED, SUSPENDED}"
      - name: dd_verified_at
        type: datetime
        source: system
        description: Logical-clock instant at which due diligence was last verified; null while PENDING.
        default: null
      - name: dd_expires_at
        type: datetime
        source: system
        description: Logical-clock instant at which the due-diligence verification lapses; null while PENDING.
        default: null
      - name: dd_document_type_count
        type: integer
        source: computed
        description: Count of DISTINCT doc_type values among this supplier's TraceabilityDocument rows whose valid_until is strictly after the current logical clock.
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Free-text reason captured when dd_status became SUSPENDED; null otherwise.
        default: null

  - name: TraceabilityDocument
    parent: Supplier
    common_fields: false
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; owning supplier of this document.
      - name: doc_type
        type: enum
        source: input
        description: Traceability artifact class required by the credit programs.
        constraints: "IN {ORIGIN_ATTESTATION, CHAIN_OF_CUSTODY, MASS_BALANCE_STATEMENT, THIRD_PARTY_AUDIT}"
      - name: issued_at
        type: datetime
        source: input
        description: Issue instant printed on the document.
      - name: valid_until
        type: datetime
        source: input
        description: Expiry instant of the document; must be strictly after issued_at.
      - name: doc_hash
        type: string
        source: input
        description: Tamper-evident content hash of the uploaded artifact.
        constraints: 8..128 chars, unique per supplier_id + doc_type

  - name: FeedstockLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; supplier that delivered (or, for a pretreated child lot, originally delivered) the material.
      - name: source_lot_id
        type: string
        source: input
        description: FK -> FeedstockLot.id; set only on a pretreated child lot, pointing at the raw lot it was produced from. Null for delivered lots.
        default: null
      - name: feedstock_type
        type: enum
        source: input
        description: Feedstock class; drives carbon-intensity, hydrogen demand and yield constants.
        constraints: "IN {UCO, TALLOW, DCO, SOYBEAN_OIL, CANOLA_OIL}"
      - name: mass_mt
        type: number
        source: input
        description: Delivered (or pretreated-output) mass in metric tonnes.
        constraints: "> 0, <= 20000, 3 decimal places"
      - name: attested_ci_gco2e_per_mj
        type: number
        source: input
        description: Supplier-attested carbon intensity of the feedstock in gCO2e/MJ.
        constraints: ">= 0, <= 120, 2 decimal places"
      - name: purchase_price_usd_per_mt
        type: number
        source: input
        description: Contracted purchase price per metric tonne, used by feedstock settlement.
        constraints: "> 0, <= 5000, 2 decimal places"
      - name: received_at
        type: datetime
        source: input
        description: Logical-clock instant the material was received at the plant gate.
      - name: status
        type: enum
        source: computed
        description: Lot lifecycle state.
        default: RECEIVED
        constraints: "IN {RECEIVED, TESTED, PRETREAT_REQUIRED, PRETREATED, ACCEPTED, REJECTED, CHARGED, QUARANTINED}"
      - name: pretreatment_tier
        type: enum
        source: computed
        description: Pretreatment severity derived by the pretreatment_tier_and_fee calculation from the governing quality test; NONE until a test exists.
        default: NONE
        constraints: "IN {NONE, LIGHT, HEAVY}"
      - name: pretreatment_fee_usd
        type: number
        source: computed
        description: Pretreatment fee quoted by the pretreatment_tier_and_fee calculation for this lot; 0.00 when pretreatment_tier is NONE.
        default: 0.00
      - name: pretreatment_loss_mt
        type: number
        source: computed
        description: For a pretreated child lot, source_lot.mass_mt minus this lot's mass_mt. 0.000 on delivered lots.
        default: 0.000
      - name: pretreatment_consumed_mt
        type: number
        source: computed
        description: Mass of THIS lot consumed by producing a pretreated child lot; set to mass_mt when status becomes PRETREATED, else 0.000.
        default: 0.000
      - name: allocated_mass_mt
        type: number
        source: computed
        description: "Sum of FeedstockAllocation.mass_mt over allocations with lot_id == this lot and status IN {RESERVED, CONSUMED}."
        default: 0.000
      - name: remaining_mass_mt
        type: number
        source: computed
        description: mass_mt - allocated_mass_mt - pretreatment_consumed_mt, rounded to 3 decimals.
        default: 0.000

  - name: QualityTest
    parent: FeedstockLot
    common_fields: false
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> FeedstockLot.id; lot the sample was drawn from.
      - name: ffa_pct
        type: number
        source: input
        description: Free fatty acid content, weight percent.
        constraints: ">= 0, <= 100, 2 decimal places"
      - name: moisture_pct
        type: number
        source: input
        description: Water content, weight percent.
        constraints: ">= 0, <= 20, 2 decimal places"
      - name: insolubles_ppm
        type: integer
        source: input
        description: Total insoluble impurities in parts per million.
        constraints: ">= 0, <= 50000"
      - name: phosphorus_ppm
        type: integer
        source: input
        description: Phosphorus (gum/phospholipid proxy) in parts per million.
        constraints: ">= 0, <= 2000"
      - name: sampled_at
        type: datetime
        source: input
        description: Logical-clock instant the sample was drawn; governs which test is the governing test for the lot.
      - name: ffa_tier_index
        type: integer
        source: computed
        description: 0/1/2 sub-tier contributed by ffa_pct per the pretreatment_tier_and_fee thresholds.
      - name: moisture_tier_index
        type: integer
        source: computed
        description: 0/1/2 sub-tier contributed by moisture_pct.
      - name: insolubles_tier_index
        type: integer
        source: computed
        description: 0/1/2 sub-tier contributed by insolubles_ppm.
      - name: phosphorus_tier_index
        type: integer
        source: computed
        description: 0/1/2 sub-tier contributed by phosphorus_ppm.
      - name: tier
        type: enum
        source: computed
        description: Pretreatment tier this test implies, after the waste-feedstock escalation branch.
        constraints: "IN {NONE, LIGHT, HEAVY}"
      - name: disposition
        type: enum
        source: computed
        description: Test verdict that drives the lot's status side effect.
        constraints: "IN {PASS, PRETREAT, REJECT}"

  - name: HydrotreatingUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Unit tag (e.g. "HDT-1").
        constraints: 1..40 chars, unique
      - name: nameplate_capacity_mt_per_day
        type: number
        source: input
        description: Maximum feed rate in metric tonnes per day.
        constraints: "> 0, <= 6000, 3 decimal places"
      - name: max_saf_share_pct
        type: number
        source: input
        description: Maximum share of product mass this unit may route to SAF.
        constraints: ">= 0, <= 60, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: Operating posture of the unit.
        default: IDLE
        constraints: "IN {IDLE, RUNNING, DOWN_TURNAROUND}"
      - name: active_catalyst_charge_id
        type: string
        source: computed
        description: "FK -> CatalystCharge.id; the charge currently loaded in the unit (status IN {ACTIVE, DERATED}); null when no charge is loaded."
        default: null
      - name: requires_turnaround
        type: boolean
        source: computed
        description: Set true when the loaded charge is DERATED or SPENT, signalling that a catalyst-change turnaround must be scheduled.
        default: false

  - name: CatalystCharge
    parent: HydrotreatingUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> HydrotreatingUnit.id; unit this charge is loaded into.
      - name: design_throughput_mt
        type: number
        source: input
        description: End-of-run design cumulative feed throughput for the charge, in metric tonnes.
        constraints: "> 0, <= 2000000, 3 decimal places"
      - name: installed_at
        type: datetime
        source: input
        description: Logical-clock instant the charge was loaded; must fall inside an APPROVED or IN_PROGRESS CATALYST_CHANGE turnaround window on the unit.
      - name: cumulative_throughput_mt
        type: number
        source: computed
        description: "Sum of ProcessingRun.consumed_mass_mt over runs with catalyst_charge_id == this charge and status IN {COMPLETED, RECONCILED}."
        default: 0.000
      - name: activity_index
        type: number
        source: computed
        description: Catalyst activity multiplier from the catalyst_activity_decay calculation; 4 decimal places, floored at 0.6000.
        default: 1.0000
      - name: status
        type: enum
        source: computed
        description: Charge lifecycle state.
        default: ACTIVE
        constraints: "IN {ACTIVE, DERATED, SPENT, REMOVED}"

  - name: TurnaroundWindow
    parent: HydrotreatingUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> HydrotreatingUnit.id; unit taken down by this window.
      - name: scope
        type: enum
        source: input
        description: Work scope of the outage.
        constraints: "IN {CATALYST_CHANGE, INSPECTION, MAJOR}"
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the outage interval.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the outage interval; must be strictly after start_at.
      - name: status
        type: enum
        source: computed
        description: Window lifecycle state.
        default: PLANNED
        constraints: "IN {PLANNED, APPROVED, IN_PROGRESS, COMPLETED, CANCELLED}"

  - name: HydrogenSupplyContract
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: Industrial-gas vendor legal name.
        constraints: 1..120 chars
      - name: daily_capacity_kg
        type: number
        source: input
        description: Maximum kilograms of hydrogen the vendor will deliver on any single calendar day.
        constraints: "> 0, <= 500000, 1 decimal place"
      - name: price_usd_per_kg
        type: number
        source: input
        description: Contracted hydrogen price per kilogram.
        constraints: "> 0, <= 50, 2 decimal places"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive first instant the contract can be nominated against.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive last instant the contract can be nominated against.
      - name: hydrogen_ci_gco2e_per_mj
        type: number
        source: input
        description: Carbon intensity of the delivered hydrogen in gCO2e/MJ.
        constraints: ">= 0, <= 200, 2 decimal places"
      - name: peak_committed_kg_per_day
        type: number
        source: computed
        description: "Maximum, over every calendar day D in [window_start, window_end], of the sum of HydrogenNomination.kg_per_day for CONFIRMED nominations on this contract whose [start_at, end_at] closed interval contains D."
        default: 0.0

  - name: HydrogenNomination
    parent: HydrogenSupplyContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HydrogenSupplyContract.id; contract the volume is nominated against.
      - name: run_id
        type: string
        source: input
        description: FK -> ProcessingRun.id; processing run this nomination supplies.
      - name: start_at
        type: datetime
        source: input
        description: Inclusive first instant of the nominated delivery interval.
      - name: end_at
        type: datetime
        source: input
        description: Inclusive last instant of the nominated delivery interval; must be >= start_at.
      - name: kg_per_day
        type: number
        source: input
        description: Kilograms per calendar day nominated across the interval.
        constraints: "> 0, <= 500000, 1 decimal place"
      - name: status
        type: enum
        source: computed
        description: Nomination state.
        default: CONFIRMED
        constraints: "IN {CONFIRMED, CANCELLED}"

  - name: ProcessingRun
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> HydrotreatingUnit.id; unit the campaign runs on.
      - name: catalyst_charge_id
        type: string
        source: input
        description: FK -> CatalystCharge.id; charge the campaign runs on.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the campaign interval; must be at 00:00:00.000Z.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the campaign interval; must be at 00:00:00.000Z and a whole number of days after window_start.
      - name: target_saf_share_pct
        type: number
        source: input
        description: Planned share of product mass routed to SAF.
        constraints: ">= 0, <= 60, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: Campaign lifecycle state.
        default: PLANNED
        constraints: "IN {PLANNED, HYDROGEN_SECURED, RUNNING, COMPLETED, RECONCILED, ABORTED}"
      - name: run_days
        type: integer
        source: computed
        description: (window_end - window_start) expressed in whole days.
      - name: reserved_mass_mt
        type: number
        source: computed
        description: "Sum of FeedstockAllocation.mass_mt over allocations with run_id == this run and status == RESERVED."
        default: 0.000
      - name: consumed_mass_mt
        type: number
        source: computed
        description: "Sum of FeedstockAllocation.mass_mt over allocations with run_id == this run and status == CONSUMED."
        default: 0.000
      - name: blend_ci_gco2e_per_mj
        type: number
        source: computed
        description: Mass-weighted blend carbon intensity from the blend_carbon_intensity calculation.
        default: 0.00
      - name: required_h2_kg_per_day
        type: number
        source: computed
        description: Hydrogen demand from the hydrogen_requirement calculation.
        default: 0.0
      - name: provisional_yield_pct
        type: number
        source: computed
        description: PROVISIONAL variant output of run_yield_split, stamped when the run reaches HYDROGEN_SECURED.
        default: 0.000
      - name: planned_total_product_mt
        type: number
        source: computed
        description: PROVISIONAL variant planned total product mass.
        default: 0.000
      - name: planned_rd_mt
        type: number
        source: computed
        description: PROVISIONAL variant planned renewable-diesel mass.
        default: 0.000
      - name: planned_saf_mt
        type: number
        source: computed
        description: PROVISIONAL variant planned SAF mass.
        default: 0.000
      - name: measured_rd_mt
        type: number
        source: input
        description: Measured renewable-diesel product mass reported at completion.
        default: 0.000
      - name: measured_saf_mt
        type: number
        source: input
        description: Measured SAF product mass reported at completion.
        default: 0.000
      - name: final_yield_pct
        type: number
        source: computed
        description: FINAL variant output of run_yield_split, stamped at COMPLETED.
        default: 0.000
      - name: yield_variance_pct
        type: number
        source: computed
        description: final_yield_pct - provisional_yield_pct, rounded to 3 decimals.
        default: 0.000
      - name: yield_variance_flag
        type: boolean
        source: computed
        description: True when abs(yield_variance_pct) > YIELD_VARIANCE_TOLERANCE_PCT at completion.
        default: false
      - name: feedstock_cost_usd
        type: number
        source: computed
        description: Settled feedstock cost from the feedstock_settlement_cost calculation, stamped at RECONCILED.
        default: 0.00
      - name: abort_reason
        type: string
        source: system
        description: Reason captured when the run was ABORTED; null otherwise.
        default: null

  - name: FeedstockAllocation
    parent: ProcessingRun
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: FK -> ProcessingRun.id; run the material is committed to.
      - name: lot_id
        type: string
        source: input
        description: FK -> FeedstockLot.id; lot the material is drawn from.
      - name: mass_mt
        type: number
        source: input
        description: Mass committed from the lot to the run, in metric tonnes.
        constraints: "> 0, <= 20000, 3 decimal places"
      - name: line_cost_usd
        type: number
        source: computed
        description: Per-line settled cost from feedstock_settlement_cost; 0.00 until the run reaches RECONCILED.
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Allocation state.
        default: RESERVED
        constraints: "IN {RESERVED, CONSUMED, RELEASED}"
      - name: release_reason
        type: enum
        source: system
        description: Why the allocation was released; null while RESERVED or CONSUMED.
        default: null
        constraints: "IN {MANUAL, SUPPLIER_SUSPENDED, RUN_ABORTED}"

  - name: ProductBatch
    parent: ProcessingRun
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: FK -> ProcessingRun.id; run that produced the batch.
      - name: product_type
        type: enum
        source: system
        description: Finished-fuel class of the batch.
        constraints: "IN {RENEWABLE_DIESEL, SAF}"
      - name: mass_mt
        type: number
        source: system
        description: Measured product mass carried into this batch, in metric tonnes.
      - name: volume_gal
        type: number
        source: computed
        description: mass_mt * GAL_PER_MT[product_type], rounded to 1 decimal.
      - name: cert_status
        type: enum
        source: computed
        description: Certification dimension; evolves independently of distribution_status.
        default: UNCERTIFIED
        constraints: "IN {UNCERTIFIED, CERT_PENDING, CERTIFIED, CERT_REJECTED}"
      - name: distribution_status
        type: enum
        source: computed
        description: Distribution dimension; evolves independently of cert_status.
        default: IN_TANK
        constraints: "IN {IN_TANK, RESERVED, SHIPPED}"
      - name: astm_annex
        type: enum
        source: input
        description: ASTM D7566 annex claimed on the certification request; null until a request is filed.
        default: null
        constraints: "IN {A2_HEFA, A5_HC_HEFA}"
      - name: freeze_point_c
        type: number
        source: input
        description: Measured freeze point in degrees Celsius, submitted with the certification request; null until a request is filed.
        default: null
        constraints: ">= -80, <= 0, 1 decimal place"
      - name: cert_reject_reason
        type: string
        source: system
        description: Verifier note captured when cert_status became CERT_REJECTED; null otherwise.
        default: null
      - name: offtaker_name
        type: string
        source: input
        description: Counterparty the batch is reserved/shipped to; null while IN_TANK.
        default: null

  - name: PathwayRegistration
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> HydrotreatingUnit.id; production unit the pathway is registered for.
      - name: program
        type: enum
        source: input
        description: Credit program the pathway is registered under.
        constraints: "IN {RFS, LCFS}"
      - name: feedstock_type
        type: enum
        source: input
        description: Feedstock class the pathway covers; a credit block may only cite a pathway whose feedstock_type equals the dominant feedstock of the producing run.
        constraints: "IN {UCO, TALLOW, DCO, SOYBEAN_OIL, CANOLA_OIL}"
      - name: proposed_ci_gco2e_per_mj
        type: number
        source: input
        description: Applicant-proposed pathway carbon intensity in gCO2e/MJ.
        constraints: ">= 0, <= 120, 2 decimal places"
      - name: certified_ci_gco2e_per_mj
        type: number
        source: system
        description: Carbon intensity fixed by the regulator at REGISTERED; null until then.
        default: null
      - name: status
        type: enum
        source: computed
        description: Registration lifecycle state; cycles between SUBMITTED, UNDER_REVIEW and RETURNED_FOR_INFO.
        default: DRAFT
        constraints: "IN {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, REGISTERED, DENIED, SUSPENDED}"
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this registration has been re-submitted after a RETURNED_FOR_INFO decision. Starts at 0.
        default: 0
      - name: info_request
        type: string
        source: system
        description: Regulator's outstanding information request captured on a RETURN decision; null otherwise.
        default: null
      - name: registered_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who created the registration; used by the segregation-of-duties check on credit-block internal sign-off.
      - name: variance_strikes
        type: integer
        source: computed
        description: Count of verification decisions on this pathway's credit blocks whose verified credits diverged from provisional credits by more than VERIFICATION_VARIANCE_TOLERANCE.
        default: 0
      - name: credits_outstanding_mtco2e
        type: number
        source: computed
        description: "Sum of CreditBlock.verified_credits_mtco2e minus CreditBlock.retired_credits_mtco2e over blocks with pathway_id == this pathway and status IN {VERIFIED, ADJUSTED, RETIRED}."
        default: 0.000

  - name: CreditBlock
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: FK -> ProductBatch.id; finished-fuel batch the credits are minted from.
      - name: pathway_id
        type: string
        source: input
        description: FK -> PathwayRegistration.id; registered pathway the credits are claimed under.
      - name: program
        type: enum
        source: computed
        description: Copied from the cited pathway at creation.
        constraints: "IN {RFS, LCFS}"
      - name: provisional_ci_gco2e_per_mj
        type: number
        source: computed
        description: run.blend_ci_gco2e_per_mj + PROCESS_CI_ADDER, stamped at block creation.
        default: 0.00
      - name: verified_ci_gco2e_per_mj
        type: number
        source: input
        description: Carbon intensity substituted by the verifier on the verification decision; null until decided.
        default: null
      - name: provisional_rin_credits
        type: integer
        source: computed
        description: PROVISIONAL RIN quantity from rin_credit_quantity; 0 for LCFS blocks.
        default: 0
      - name: provisional_credits_mtco2e
        type: number
        source: computed
        description: PROVISIONAL variant output of lcfs_credit_quantity; 0.000 for RFS blocks.
        default: 0.000
      - name: verified_credits_mtco2e
        type: number
        source: computed
        description: VERIFIED variant output of lcfs_credit_quantity, stamped on the verification decision; 0.000 for RFS blocks and until decided.
        default: 0.000
      - name: verified_rin_credits
        type: integer
        source: computed
        description: VERIFIED RIN quantity, stamped on the verification decision; 0 for LCFS blocks and until decided.
        default: 0
      - name: retired_credits_mtco2e
        type: number
        source: computed
        description: Credits retired out of this block against compliance obligations.
        default: 0.000
      - name: verification_outcome
        type: enum
        source: computed
        description: Outcome recorded by the verifier; used to restore status when a retirement is reversed.
        default: NONE
        constraints: "IN {NONE, VERIFIED, ADJUSTED, REJECTED}"
      - name: verification_findings
        type: string
        source: system
        description: Verifier findings note; null until decided.
        default: null
      - name: signed_off_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who performed internal sign-off; null until signed off.
        default: null
      - name: status
        type: enum
        source: computed
        description: Credit block lifecycle state.
        default: DRAFT
        constraints: "IN {DRAFT, INTERNAL_SIGNED_OFF, SUBMITTED_FOR_VERIFICATION, VERIFIED, ADJUSTED, VERIFICATION_REJECTED, RETIRED, BLOCKED}"

  - name: HedgePosition
    parent: null
    common_fields: true
    fields:
      - name: instrument
        type: enum
        source: input
        description: Hedging instrument class; selects the base margin rate.
        constraints: "IN {FEEDSTOCK_SWAP, RIN_FORWARD, LCFS_FORWARD}"
      - name: notional_units
        type: number
        source: input
        description: Notional size in metric tonnes (FEEDSTOCK_SWAP), RINs (RIN_FORWARD) or MT CO2e (LCFS_FORWARD).
        constraints: "> 0, <= 1000000, 3 decimal places"
      - name: strike_price_usd
        type: number
        source: input
        description: Strike price per notional unit.
        constraints: "> 0, <= 10000, 2 decimal places"
      - name: maturity_at
        type: datetime
        source: input
        description: Contractual maturity instant; must be strictly after the current logical clock at creation.
      - name: gross_notional_usd
        type: number
        source: computed
        description: notional_units * strike_price_usd, rounded to 2 decimals.
        default: 0.00
      - name: base_margin_usd
        type: number
        source: computed
        description: Step 1 of hedge_margin_requirement.
        default: 0.00
      - name: volatility_tier
        type: enum
        source: computed
        description: Volatility tier selected from base_margin_usd (never from total_margin_usd).
        default: T1
        constraints: "IN {T1, T2, T3}"
      - name: volatility_adder_usd
        type: number
        source: computed
        description: Step 3 of hedge_margin_requirement.
        default: 0.00
      - name: total_margin_usd
        type: number
        source: computed
        description: base_margin_usd + volatility_adder_usd, rounded to 2 decimals.
        default: 0.00
      - name: settlement_price_usd
        type: number
        source: input
        description: Settlement price per unit supplied at unwind; null while OPEN.
        default: null
      - name: realized_pnl_usd
        type: number
        source: computed
        description: Realized profit/loss stamped at unwind; 0.00 while OPEN.
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Position state.
        default: OPEN
        constraints: "IN {OPEN, UNWOUND}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Supplier
    dimension: dd_status
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /suppliers/{id}/due-diligence-verifications"
        actor: ComplianceOfficer
        preconditions:
          - "supplier.dd_status == PENDING"
          - "supplier.dd_document_type_count >= 2 when supplier.is_high_risk_origin == false"
          - "supplier.dd_document_type_count >= 3 AND at least one TraceabilityDocument with doc_type == THIRD_PARTY_AUDIT and valid_until > now, when supplier.is_high_risk_origin == true"
        side_effects:
          - "supplier.dd_verified_at = current logical clock"
          - "supplier.dd_expires_at = current logical clock + valid_months * 30 days (exact 30-day months)"
          - "supplier.version += 1"
        note: "Document expiry is evaluated against the logical clock at verification time, so an expired document does not count toward dd_document_type_count."
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/suspensions"
        actor: ComplianceOfficer
        preconditions:
          - "supplier.dd_status IN {PENDING, VERIFIED}"
        side_effects:
          - "L1: supplier.dd_status = SUSPENDED; supplier.suspension_reason = reason; supplier.version += 1"
          - "L2 (caused by L1): every FeedstockLot with supplier_id == supplier.id and status IN {RECEIVED, TESTED, PRETREAT_REQUIRED, PRETREATED, ACCEPTED} transitions to QUARANTINED, processed in created_at ASC order"
          - "L3 (caused by L2): for each lot quarantined in L2, every FeedstockAllocation with lot_id == that lot and status == RESERVED transitions to RELEASED with release_reason = SUPPLIER_SUSPENDED; the lot's allocated_mass_mt and remaining_mass_mt are recomputed"
          - "L4 (caused by L3): for each ProcessingRun that lost reserved mass in L3, processed in created_at ASC order, reserved_mass_mt, blend_ci_gco2e_per_mj and required_h2_kg_per_day are recomputed; if that run's status == HYDROGEN_SECURED and its recomputed reserved_mass_mt < MIN_CHARGE_MT the run transitions HYDROGEN_SECURED -> PLANNED and provisional_yield_pct, planned_total_product_mt, planned_rd_mt and planned_saf_mt are reset to 0.000"
          - "L5 (caused by L4): for each run downgraded to PLANNED in L4, every HydrogenNomination with run_id == that run and status == CONFIRMED transitions to CANCELLED; each affected HydrogenSupplyContract.peak_committed_kg_per_day is recomputed"
      - from: PENDING
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/suspensions"
        actor: ComplianceOfficer
        preconditions:
          - "supplier.dd_status IN {PENDING, VERIFIED}"
        side_effects:
          - "Identical L1..L5 chain as the VERIFIED -> SUSPENDED transition"
        note: "A never-verified supplier can still be suspended; its lots are quarantined the same way."

  - entity: FeedstockLot
    dimension: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, CHARGED, QUARANTINED]
    transitions:
      - from: RECEIVED
        to: TESTED
        trigger: "POST /feedstock-lots/{id}/quality-tests with a test whose disposition == PASS"
        actor: QualityAnalyst
        preconditions:
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED}"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "A QualityTest row is appended; lot.pretreatment_tier = test.tier (NONE); lot.pretreatment_fee_usd = 0.00; lot.version += 1"
      - from: RECEIVED
        to: PRETREAT_REQUIRED
        trigger: "POST /feedstock-lots/{id}/quality-tests with a test whose disposition == PRETREAT"
        actor: QualityAnalyst
        preconditions:
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED}"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "A QualityTest row is appended; lot.pretreatment_tier = test.tier (LIGHT or HEAVY); lot.pretreatment_fee_usd = pretreatment_tier_and_fee.fee; lot.version += 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /feedstock-lots/{id}/quality-tests with a test whose disposition == REJECT"
        actor: QualityAnalyst
        preconditions:
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED}"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "A QualityTest row is appended; lot.pretreatment_tier = HEAVY; lot.pretreatment_fee_usd = 0.00; lot.version += 1"
        note: "REJECTED is terminal: the lot can never be allocated, pretreated or accepted."
      - from: TESTED
        to: PRETREAT_REQUIRED
        trigger: "POST /feedstock-lots/{id}/quality-tests (retest whose disposition == PRETREAT supersedes the earlier governing test)"
        actor: QualityAnalyst
        preconditions:
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED}"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "The new test becomes the governing test (max sampled_at, tie-broken by max created_at); lot.pretreatment_tier and lot.pretreatment_fee_usd are recomputed from it; lot.version += 1"
      - from: PRETREAT_REQUIRED
        to: TESTED
        trigger: "POST /feedstock-lots/{id}/quality-tests (retest whose disposition == PASS supersedes the earlier governing test)"
        actor: QualityAnalyst
        preconditions:
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED}"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "The new test becomes the governing test; lot.pretreatment_tier = NONE; lot.pretreatment_fee_usd = 0.00; lot.version += 1"
      - from: TESTED
        to: ACCEPTED
        trigger: "POST /feedstock-lots/{id}/acceptances"
        actor: QualityAnalyst
        preconditions:
          - "lot.status == TESTED"
          - "lot.pretreatment_tier == NONE"
        side_effects:
          - "lot.version += 1"
      - from: PRETREAT_REQUIRED
        to: PRETREATED
        trigger: "POST /feedstock-lots/{id}/pretreatments"
        actor: QualityAnalyst
        preconditions:
          - "lot.status == PRETREAT_REQUIRED"
          - "lot.pretreatment_tier IN {LIGHT, HEAVY}"
          - "0 < payload output_mass_mt <= lot.mass_mt"
        side_effects:
          - "lot.pretreatment_consumed_mt = lot.mass_mt; lot.remaining_mass_mt = 0.000; lot.version += 1"
          - "A child FeedstockLot is created with source_lot_id = lot.id, supplier_id = lot.supplier_id, feedstock_type = lot.feedstock_type, mass_mt = output_mass_mt, attested_ci_gco2e_per_mj = lot.attested_ci_gco2e_per_mj + PRETREAT_CI_ADDER[lot.pretreatment_tier], purchase_price_usd_per_mt = round(((lot.mass_mt * lot.purchase_price_usd_per_mt) + lot.pretreatment_fee_usd) / output_mass_mt, 2), received_at = lot.received_at, status = ACCEPTED, pretreatment_tier = NONE, pretreatment_loss_mt = round(lot.mass_mt - output_mass_mt, 3)"
        note: "Conservation invariant: child.mass_mt + child.pretreatment_loss_mt == source_lot.pretreatment_consumed_mt."
      - from: ACCEPTED
        to: CHARGED
        trigger: "POST /processing-runs/{id}/starts (run start consumes the lot's last remaining tonne)"
        actor: PlantOperator
        preconditions:
          - "lot.status == ACCEPTED"
          - "the lot has at least one FeedstockAllocation with status RESERVED on the starting run"
        side_effects:
          - "Each RESERVED allocation on the run transitions to CONSUMED; the lot's allocated_mass_mt is unchanged (RESERVED and CONSUMED both count) and remaining_mass_mt is unchanged"
          - "lot.status becomes CHARGED only when lot.remaining_mass_mt == 0.000 after the run's allocations are consumed; otherwise the lot stays ACCEPTED"
          - "lot.version += 1"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "system cascade L2 of POST /suppliers/{id}/suspensions"
        actor: system
        preconditions:
          - "lot.supplier_id == suspended supplier"
          - "lot.status IN {RECEIVED, TESTED, PRETREAT_REQUIRED, PRETREATED, ACCEPTED}"
        side_effects:
          - "lot.version += 1; triggers cascade L3 on the lot's RESERVED allocations"
        note: "Lots already CHARGED, REJECTED or QUARANTINED are skipped — conditional cascade."

  - entity: HydrotreatingUnit
    dimension: status
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: RUNNING
        trigger: "POST /processing-runs/{id}/starts"
        actor: PlantOperator
        preconditions:
          - "unit.status == IDLE"
        side_effects:
          - "unit.version += 1"
      - from: RUNNING
        to: IDLE
        trigger: "POST /processing-runs/{id}/completions"
        actor: PlantOperator
        preconditions:
          - "unit.status == RUNNING"
        side_effects:
          - "unit.version += 1"
      - from: RUNNING
        to: IDLE
        trigger: "POST /processing-runs/{id}/aborts on a RUNNING run"
        actor: PlantOperator
        preconditions:
          - "unit.status == RUNNING"
        side_effects:
          - "unit.version += 1"
      - from: IDLE
        to: DOWN_TURNAROUND
        trigger: "POST /turnaround-windows/{id}/starts"
        actor: PlantOperator
        preconditions:
          - "unit.status == IDLE"
          - "window.status == APPROVED"
          - "window.start_at <= now < window.end_at"
        side_effects:
          - "window.status = IN_PROGRESS; unit.version += 1"
      - from: DOWN_TURNAROUND
        to: IDLE
        trigger: "POST /turnaround-windows/{id}/completions"
        actor: PlantOperator
        preconditions:
          - "unit.status == DOWN_TURNAROUND"
          - "window.status == IN_PROGRESS"
        side_effects:
          - "window.status = COMPLETED"
          - "unit.requires_turnaround = false when the unit's active_catalyst_charge_id points at a charge with status == ACTIVE, otherwise unchanged"
          - "unit.version += 1"

  - entity: CatalystCharge
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: DERATED
        trigger: "system cascade L2 of POST /processing-runs/{id}/completions when the run's yield variance breaches tolerance"
        actor: system
        preconditions:
          - "charge.status == ACTIVE after the cumulative-throughput side effect of the same completion has been applied"
          - "abs(run.yield_variance_pct) > YIELD_VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "charge.version += 1"
          - "L3 (caused by L2): the owning HydrotreatingUnit.requires_turnaround = true and unit.version += 1"
        note: "If the throughput side effect already moved the charge to SPENT, this variance side effect does not apply — SPENT is not downgraded to DERATED."
      - from: ACTIVE
        to: SPENT
        trigger: "POST /processing-runs/{id}/completions (cumulative throughput reaches design)"
        actor: system
        preconditions:
          - "charge.cumulative_throughput_mt + run.consumed_mass_mt >= charge.design_throughput_mt"
        side_effects:
          - "charge.cumulative_throughput_mt is recomputed; charge.activity_index is recomputed; the owning HydrotreatingUnit.requires_turnaround = true; charge.version += 1"
      - from: DERATED
        to: SPENT
        trigger: "POST /processing-runs/{id}/completions (cumulative throughput reaches design on a derated charge)"
        actor: system
        preconditions:
          - "charge.cumulative_throughput_mt + run.consumed_mass_mt >= charge.design_throughput_mt"
        side_effects:
          - "charge.cumulative_throughput_mt and activity_index recomputed; unit.requires_turnaround = true; charge.version += 1"
      - from: SPENT
        to: REMOVED
        trigger: "POST /hydrotreating-units/{id}/catalyst-charges (installing the successor charge)"
        actor: PlantOperator
        preconditions:
          - "unit.status == DOWN_TURNAROUND"
          - "the outgoing charge is the unit's active_catalyst_charge_id"
        side_effects:
          - "outgoing charge.status = REMOVED; unit.active_catalyst_charge_id = new charge id; unit.requires_turnaround = false; new charge.status = ACTIVE with activity_index 1.0000; outgoing charge.version += 1; unit.version += 1"
      - from: DERATED
        to: REMOVED
        trigger: "POST /hydrotreating-units/{id}/catalyst-charges (installing the successor charge)"
        actor: PlantOperator
        preconditions:
          - "unit.status == DOWN_TURNAROUND"
          - "the outgoing charge is the unit's active_catalyst_charge_id"
        side_effects:
          - "Identical to the SPENT -> REMOVED transition"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /hydrotreating-units/{id}/catalyst-charges (early change of a healthy charge)"
        actor: PlantOperator
        preconditions:
          - "unit.status == DOWN_TURNAROUND"
          - "the outgoing charge is the unit's active_catalyst_charge_id"
        side_effects:
          - "Identical to the SPENT -> REMOVED transition"

  - entity: TurnaroundWindow
    dimension: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /turnaround-windows/{id}/approvals"
        actor: PlantOperator
        preconditions:
          - "window.status == PLANNED"
          - "no ProcessingRun on window.unit_id with status IN {PLANNED, HYDROGEN_SECURED, RUNNING} whose [window_start, window_end) half-open interval intersects [window.start_at, window.end_at)"
        side_effects:
          - "window.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /turnaround-windows/{id}/cancellations"
        actor: PlantOperator
        preconditions:
          - "window.status IN {PLANNED, APPROVED}"
        side_effects:
          - "window.version += 1; the window stops participating in the 72-hour buffer test for future windows"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /turnaround-windows/{id}/cancellations"
        actor: PlantOperator
        preconditions:
          - "window.status IN {PLANNED, APPROVED}"
        side_effects:
          - "window.version += 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /turnaround-windows/{id}/starts"
        actor: PlantOperator
        preconditions:
          - "window.status == APPROVED"
          - "window.start_at <= now < window.end_at"
          - "unit.status == IDLE"
        side_effects:
          - "unit.status = DOWN_TURNAROUND; unit.version += 1; window.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /turnaround-windows/{id}/completions"
        actor: PlantOperator
        preconditions:
          - "window.status == IN_PROGRESS"
        side_effects:
          - "unit.status = IDLE; unit.version += 1; window.version += 1"

  - entity: HydrogenNomination
    dimension: status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /hydrogen-nominations/{id}/cancellations"
        actor: PlantOperator
        preconditions:
          - "nomination.status == CONFIRMED"
          - "the nominated run's status IN {PLANNED, HYDROGEN_SECURED}"
        side_effects:
          - "contract.peak_committed_kg_per_day is recomputed over the remaining CONFIRMED nominations; nomination.version += 1; contract.version += 1"
          - "if the nominated run's status == HYDROGEN_SECURED and the remaining CONFIRMED nominations no longer cover every day of the run window at required_h2_kg_per_day, the run transitions HYDROGEN_SECURED -> PLANNED and its planned_* fields reset to 0.000"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade L5 of POST /suppliers/{id}/suspensions, or POST /processing-runs/{id}/aborts"
        actor: system
        preconditions:
          - "nomination.status == CONFIRMED"
          - "nomination.run_id == the downgraded or aborted run"
        side_effects:
          - "contract.peak_committed_kg_per_day recomputed; nomination.version += 1; contract.version += 1"

  - entity: ProcessingRun
    dimension: status
    initial_state: PLANNED
    terminal_states: [RECONCILED, ABORTED]
    transitions:
      - from: PLANNED
        to: HYDROGEN_SECURED
        trigger: "POST /processing-runs/{id}/hydrogen-securements"
        actor: PlantOperator
        preconditions:
          - "run.status == PLANNED"
          - "run has at least one FeedstockAllocation with status == RESERVED"
          - "run.reserved_mass_mt >= MIN_CHARGE_MT"
          - "round(run.reserved_mass_mt / run.run_days, 3) <= unit.nameplate_capacity_mt_per_day"
          - "run.target_saf_share_pct <= unit.max_saf_share_pct"
          - "the CatalystCharge referenced by run.catalyst_charge_id has status == ACTIVE"
          - "for every calendar day D in [window_start, window_end), the sum of kg_per_day over CONFIRMED HydrogenNominations with run_id == run.id whose closed interval [start_at, end_at] contains D is >= run.required_h2_kg_per_day"
        side_effects:
          - "run.blend_ci_gco2e_per_mj, run.required_h2_kg_per_day recomputed"
          - "run.provisional_yield_pct, planned_total_product_mt, planned_rd_mt, planned_saf_mt stamped by the PROVISIONAL variant of run_yield_split using charge.activity_index as of this instant"
          - "run.version += 1"
      - from: HYDROGEN_SECURED
        to: PLANNED
        trigger: "system cascade L4 of POST /suppliers/{id}/suspensions, or side effect of POST /feedstock-allocations/{id}/releases, or side effect of POST /hydrogen-nominations/{id}/cancellations"
        actor: system
        preconditions:
          - "run.status == HYDROGEN_SECURED"
          - "after the recompute, either run.reserved_mass_mt < MIN_CHARGE_MT or the remaining CONFIRMED nominations no longer cover every day of the run window at run.required_h2_kg_per_day"
        side_effects:
          - "run.provisional_yield_pct, planned_total_product_mt, planned_rd_mt, planned_saf_mt reset to 0.000; run.version += 1"
          - "L5 (caused by this downgrade, only for the supplier-suspension and allocation-release paths): every CONFIRMED HydrogenNomination with run_id == run.id transitions to CANCELLED and each affected contract's peak_committed_kg_per_day is recomputed"
        note: "This back-edge makes the ProcessingRun machine cyclic: PLANNED -> HYDROGEN_SECURED -> PLANNED."
      - from: HYDROGEN_SECURED
        to: RUNNING
        trigger: "POST /processing-runs/{id}/starts"
        actor: PlantOperator
        preconditions:
          - "run.status == HYDROGEN_SECURED"
          - "unit.status == IDLE"
          - "the CatalystCharge referenced by run.catalyst_charge_id has status == ACTIVE"
          - "current logical clock >= run.window_start"
          - "no TurnaroundWindow on run.unit_id with status == IN_PROGRESS"
        side_effects:
          - "every FeedstockAllocation on the run with status == RESERVED transitions to CONSUMED, processed in created_at ASC order; run.reserved_mass_mt = 0.000; run.consumed_mass_mt recomputed"
          - "for each affected FeedstockLot, status becomes CHARGED when its remaining_mass_mt == 0.000, else it stays ACCEPTED; lot.version += 1"
          - "unit.status = RUNNING; unit.version += 1; run.version += 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /processing-runs/{id}/completions"
        actor: PlantOperator
        preconditions:
          - "run.status == RUNNING"
          - "current logical clock >= run.window_end"
          - "round(measured_rd_mt + measured_saf_mt, 3) <= run.consumed_mass_mt"
          - "when measured_rd_mt + measured_saf_mt > 0: round(measured_saf_mt / (measured_rd_mt + measured_saf_mt) * 100, 2) <= unit.max_saf_share_pct"
        side_effects:
          - "run.measured_rd_mt, run.measured_saf_mt stored; run.final_yield_pct, run.yield_variance_pct stamped by the FINAL variant of run_yield_split; run.yield_variance_flag set"
          - "charge.cumulative_throughput_mt recomputed; charge.activity_index recomputed by catalyst_activity_decay; if cumulative_throughput_mt >= charge.design_throughput_mt the charge transitions to SPENT and unit.requires_turnaround = true"
          - "L2 (caused by yield_variance_flag == true and only when the charge is still ACTIVE): charge.status = DERATED"
          - "L3 (caused by L2): unit.requires_turnaround = true"
          - "one ProductBatch with product_type == RENEWABLE_DIESEL is created when measured_rd_mt > 0, and one with product_type == SAF when measured_saf_mt > 0; both start at cert_status UNCERTIFIED and distribution_status IN_TANK"
          - "unit.status = IDLE; unit.version += 1; run.version += 1"
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /processing-runs/{id}/reconciliations"
        actor: ComplianceOfficer
        preconditions:
          - "run.status == COMPLETED"
        side_effects:
          - "every CONSUMED FeedstockAllocation on the run gets line_cost_usd stamped by feedstock_settlement_cost; run.feedstock_cost_usd = the pinned round-then-sum total; allocation.version += 1 for each line; run.version += 1"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /processing-runs/{id}/aborts"
        actor: PlantOperator
        preconditions:
          - "run.status IN {PLANNED, HYDROGEN_SECURED, RUNNING}"
        side_effects:
          - "run.abort_reason = reason; every RESERVED allocation transitions to RELEASED with release_reason = RUN_ABORTED and its lot's allocated_mass_mt/remaining_mass_mt are recomputed; every CONFIRMED nomination with run_id == run.id transitions to CANCELLED and its contract's peak_committed_kg_per_day is recomputed; run.version += 1"
      - from: HYDROGEN_SECURED
        to: ABORTED
        trigger: "POST /processing-runs/{id}/aborts"
        actor: PlantOperator
        preconditions:
          - "run.status IN {PLANNED, HYDROGEN_SECURED, RUNNING}"
        side_effects:
          - "Identical to the PLANNED -> ABORTED transition"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /processing-runs/{id}/aborts"
        actor: PlantOperator
        preconditions:
          - "run.status IN {PLANNED, HYDROGEN_SECURED, RUNNING}"
        side_effects:
          - "As the PLANNED -> ABORTED transition, plus unit.status = IDLE and unit.version += 1. CONSUMED allocations are NOT released — that material is already in the reactor."

  - entity: FeedstockAllocation
    dimension: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /processing-runs/{id}/starts"
        actor: PlantOperator
        preconditions:
          - "allocation.status == RESERVED"
          - "run.status == HYDROGEN_SECURED"
        side_effects:
          - "run.consumed_mass_mt recomputed; the owning lot may transition ACCEPTED -> CHARGED; allocation.version += 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /feedstock-allocations/{id}/releases"
        actor: FeedstockTrader
        preconditions:
          - "allocation.status == RESERVED"
          - "run.status IN {PLANNED, HYDROGEN_SECURED}"
        side_effects:
          - "allocation.release_reason = MANUAL; lot.allocated_mass_mt and lot.remaining_mass_mt recomputed; run.reserved_mass_mt, run.blend_ci_gco2e_per_mj and run.required_h2_kg_per_day recomputed; allocation.version += 1; lot.version += 1; run.version += 1"
          - "if run.status == HYDROGEN_SECURED and the recomputed run.reserved_mass_mt < MIN_CHARGE_MT, the run transitions HYDROGEN_SECURED -> PLANNED and its CONFIRMED nominations transition to CANCELLED"
      - from: RESERVED
        to: RELEASED
        trigger: "system cascade L3 of POST /suppliers/{id}/suspensions"
        actor: system
        preconditions:
          - "allocation.status == RESERVED"
          - "the allocation's lot was quarantined by cascade L2"
        side_effects:
          - "allocation.release_reason = SUPPLIER_SUSPENDED; the recomputes and downstream cascade L4/L5 described on the Supplier transition"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /processing-runs/{id}/aborts"
        actor: PlantOperator
        preconditions:
          - "allocation.status == RESERVED"
        side_effects:
          - "allocation.release_reason = RUN_ABORTED; lot and run mass fields recomputed"

  - entity: ProductBatch
    dimension: cert_status
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: CERT_PENDING
        trigger: "POST /product-batches/{id}/certification-requests"
        actor: ComplianceOfficer
        preconditions:
          - "batch.cert_status IN {UNCERTIFIED, CERT_REJECTED}"
          - "the producing run's status IN {COMPLETED, RECONCILED}"
        side_effects:
          - "batch.astm_annex and batch.freeze_point_c stored from the request; batch.cert_reject_reason reset to null; batch.version += 1"
        note: "distribution_status is untouched — the two dimensions evolve independently."
      - from: CERT_PENDING
        to: CERTIFIED
        trigger: "POST /product-batches/{id}/certification-decisions with decision == CERTIFY"
        actor: IndependentVerifier
        preconditions:
          - "batch.cert_status == CERT_PENDING"
          - "when batch.product_type == SAF: batch.freeze_point_c <= SAF_MAX_FREEZE_POINT_C"
          - "when batch.product_type == SAF: batch.astm_annex is not null"
        side_effects:
          - "batch.version += 1"
      - from: CERT_PENDING
        to: CERT_REJECTED
        trigger: "POST /product-batches/{id}/certification-decisions with decision == REJECT"
        actor: IndependentVerifier
        preconditions:
          - "batch.cert_status == CERT_PENDING"
        side_effects:
          - "batch.cert_reject_reason = note; batch.version += 1"
      - from: CERT_REJECTED
        to: CERT_PENDING
        trigger: "POST /product-batches/{id}/certification-requests (re-file with corrected properties)"
        actor: ComplianceOfficer
        preconditions:
          - "batch.cert_status IN {UNCERTIFIED, CERT_REJECTED}"
        side_effects:
          - "batch.astm_annex and batch.freeze_point_c overwritten; batch.cert_reject_reason reset to null; batch.version += 1"
        note: "Makes the certification dimension cyclic: CERT_PENDING -> CERT_REJECTED -> CERT_PENDING."

  - entity: ProductBatch
    dimension: distribution_status
    initial_state: IN_TANK
    terminal_states: [SHIPPED]
    transitions:
      - from: IN_TANK
        to: RESERVED
        trigger: "POST /product-batches/{id}/reservations"
        actor: ComplianceOfficer
        preconditions:
          - "batch.distribution_status == IN_TANK"
        side_effects:
          - "batch.offtaker_name stored; batch.version += 1"
        note: "Permitted at any cert_status — reserving uncertified SAF is legal, shipping it is not."
      - from: RESERVED
        to: IN_TANK
        trigger: "POST /product-batches/{id}/reservation-releases"
        actor: ComplianceOfficer
        preconditions:
          - "batch.distribution_status == RESERVED"
        side_effects:
          - "batch.offtaker_name = null; batch.version += 1"
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /product-batches/{id}/shipments"
        actor: ComplianceOfficer
        preconditions:
          - "batch.distribution_status == RESERVED"
          - "when batch.product_type == SAF: batch.cert_status == CERTIFIED"
        side_effects:
          - "batch.version += 1"
        note: "Cross-dimension guard: the certification dimension gates only this one edge, and only for SAF."

  - entity: PathwayRegistration
    dimension: status
    initial_state: DRAFT
    terminal_states: [DENIED, SUSPENDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pathway-registrations/{id}/submissions"
        actor: ComplianceOfficer
        preconditions:
          - "pathway.status IN {DRAFT, RETURNED_FOR_INFO}"
          - "at least one Supplier exists with dd_status == VERIFIED, dd_expires_at > now, and feedstock_types containing pathway.feedstock_type"
        side_effects:
          - "pathway.info_request = null; pathway.version += 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /pathway-registrations/{id}/submissions (re-submission after an information request)"
        actor: ComplianceOfficer
        preconditions:
          - "pathway.status IN {DRAFT, RETURNED_FOR_INFO}"
          - "pathway.revision_round < MAX_REVISION_ROUNDS"
          - "at least one Supplier exists with dd_status == VERIFIED, dd_expires_at > now, and feedstock_types containing pathway.feedstock_type"
        side_effects:
          - "pathway.revision_round += 1; pathway.info_request = null; pathway.version += 1"
        note: "Closes the cycle SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED. The bound is on revision_round, so the fourth submission is refused while the registration stays RETURNED_FOR_INFO."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pathway-registrations/{id}/review-starts"
        actor: IndependentVerifier
        preconditions:
          - "pathway.status == SUBMITTED"
        side_effects:
          - "pathway.version += 1"
      - from: UNDER_REVIEW
        to: REGISTERED
        trigger: "POST /pathway-registrations/{id}/review-decisions with decision == REGISTER"
        actor: IndependentVerifier
        preconditions:
          - "pathway.status == UNDER_REVIEW"
          - "payload certified_ci is present and >= 0"
        side_effects:
          - "pathway.certified_ci_gco2e_per_mj = payload certified_ci; pathway.version += 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /pathway-registrations/{id}/review-decisions with decision == RETURN"
        actor: IndependentVerifier
        preconditions:
          - "pathway.status == UNDER_REVIEW"
          - "payload info_request is present and non-blank"
        side_effects:
          - "pathway.info_request = payload info_request; pathway.version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /pathway-registrations/{id}/review-decisions with decision == DENY"
        actor: IndependentVerifier
        preconditions:
          - "pathway.status == UNDER_REVIEW"
        side_effects:
          - "pathway.version += 1"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "system cascade L3 of POST /credit-blocks/{id}/verification-decisions"
        actor: system
        preconditions:
          - "pathway.status == REGISTERED"
          - "pathway.variance_strikes >= PATHWAY_SUSPENSION_STRIKES after the L2 increment"
        side_effects:
          - "pathway.version += 1"
          - "L4 (caused by L3): every other CreditBlock with pathway_id == pathway.id and status IN {DRAFT, INTERNAL_SIGNED_OFF} transitions to BLOCKED, processed in created_at ASC order"

  - entity: CreditBlock
    dimension: status
    initial_state: DRAFT
    terminal_states: [VERIFICATION_REJECTED, BLOCKED]
    transitions:
      - from: DRAFT
        to: INTERNAL_SIGNED_OFF
        trigger: "POST /credit-blocks/{id}/internal-signoffs"
        actor: ComplianceOfficer
        preconditions:
          - "block.status == DRAFT"
          - "X-User-ID != the cited PathwayRegistration.registered_by_user_id"
          - "the cited pathway's status == REGISTERED"
        side_effects:
          - "block.signed_off_by_user_id = X-User-ID; block.version += 1"
      - from: INTERNAL_SIGNED_OFF
        to: SUBMITTED_FOR_VERIFICATION
        trigger: "POST /credit-blocks/{id}/verification-submissions"
        actor: ComplianceOfficer
        preconditions:
          - "block.status == INTERNAL_SIGNED_OFF"
          - "the producing ProcessingRun's status == RECONCILED"
        side_effects:
          - "block.version += 1"
      - from: SUBMITTED_FOR_VERIFICATION
        to: VERIFIED
        trigger: "POST /credit-blocks/{id}/verification-decisions with decision == VERIFY"
        actor: IndependentVerifier
        preconditions:
          - "block.status == SUBMITTED_FOR_VERIFICATION"
          - "payload verified_ci is present and >= 0"
        side_effects:
          - "block.verified_ci_gco2e_per_mj stored; block.verified_credits_mtco2e / block.verified_rin_credits stamped by the VERIFIED variants of lcfs_credit_quantity and rin_credit_quantity; block.verification_outcome = VERIFIED; pathway.credits_outstanding_mtco2e recomputed; block.version += 1; pathway.version += 1"
      - from: SUBMITTED_FOR_VERIFICATION
        to: ADJUSTED
        trigger: "POST /credit-blocks/{id}/verification-decisions with decision == VERIFY where the verified quantity diverges beyond tolerance"
        actor: IndependentVerifier
        preconditions:
          - "block.status == SUBMITTED_FOR_VERIFICATION"
          - "payload verified_ci is present and >= 0"
          - "L1: abs(verified_quantity - provisional_quantity) / provisional_quantity > VERIFICATION_VARIANCE_TOLERANCE, where quantity is verified_credits_mtco2e for LCFS blocks and verified_rin_credits for RFS blocks"
        side_effects:
          - "L1: block.verified_* stamped as in the VERIFIED transition; block.verification_outcome = ADJUSTED; pathway.credits_outstanding_mtco2e recomputed; block.version += 1"
          - "L2 (caused by L1): the cited PathwayRegistration.variance_strikes += 1 and pathway.version += 1"
          - "L3 (caused by L2): if pathway.variance_strikes >= PATHWAY_SUSPENSION_STRIKES the pathway transitions REGISTERED -> SUSPENDED"
          - "L4 (caused by L3): every other CreditBlock on that pathway with status IN {DRAFT, INTERNAL_SIGNED_OFF} transitions to BLOCKED"
        note: "ADJUSTED is not requested by the verifier — it is derived from the variance test, so the same request body yields VERIFIED or ADJUSTED depending on arithmetic."
      - from: SUBMITTED_FOR_VERIFICATION
        to: VERIFICATION_REJECTED
        trigger: "POST /credit-blocks/{id}/verification-decisions with decision == REJECT"
        actor: IndependentVerifier
        preconditions:
          - "block.status == SUBMITTED_FOR_VERIFICATION"
          - "payload findings is present and non-blank"
        side_effects:
          - "block.verification_findings = findings; block.verification_outcome = REJECTED; block.verified_credits_mtco2e stays 0.000; block.verified_rin_credits stays 0; block.version += 1"
      - from: VERIFIED
        to: RETIRED
        trigger: "POST /credit-blocks/{id}/retirements retiring the full remaining balance"
        actor: ComplianceOfficer
        preconditions:
          - "block.status IN {VERIFIED, ADJUSTED}"
          - "0 < payload credits <= block.verified_credits_mtco2e - block.retired_credits_mtco2e"
        side_effects:
          - "block.retired_credits_mtco2e += payload credits; pathway.credits_outstanding_mtco2e recomputed; block.status becomes RETIRED only when retired_credits_mtco2e == verified_credits_mtco2e; block.version += 1; pathway.version += 1"
      - from: ADJUSTED
        to: RETIRED
        trigger: "POST /credit-blocks/{id}/retirements retiring the full remaining balance"
        actor: ComplianceOfficer
        preconditions:
          - "block.status IN {VERIFIED, ADJUSTED}"
          - "0 < payload credits <= block.verified_credits_mtco2e - block.retired_credits_mtco2e"
        side_effects:
          - "Identical to the VERIFIED -> RETIRED transition"
      - from: RETIRED
        to: VERIFIED
        trigger: "POST /credit-blocks/{id}/retirement-reversals on a block whose verification_outcome == VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "block.status IN {VERIFIED, ADJUSTED, RETIRED}"
          - "block.retired_credits_mtco2e > 0.000"
        side_effects:
          - "block.retired_credits_mtco2e = 0.000; block.status = block.verification_outcome; pathway.credits_outstanding_mtco2e recomputed; block.version += 1; pathway.version += 1"
        note: "Compensating action for retirement: pathway.credits_outstanding_mtco2e returns to exactly its pre-retirement value."
      - from: RETIRED
        to: ADJUSTED
        trigger: "POST /credit-blocks/{id}/retirement-reversals on a block whose verification_outcome == ADJUSTED"
        actor: ComplianceOfficer
        preconditions:
          - "block.status IN {VERIFIED, ADJUSTED, RETIRED}"
          - "block.retired_credits_mtco2e > 0.000"
        side_effects:
          - "Identical to the RETIRED -> VERIFIED transition"
      - from: DRAFT
        to: BLOCKED
        trigger: "system cascade L4 of POST /credit-blocks/{id}/verification-decisions on a sibling block"
        actor: system
        preconditions:
          - "block.status IN {DRAFT, INTERNAL_SIGNED_OFF}"
          - "the cited pathway transitioned to SUSPENDED in cascade L3"
        side_effects:
          - "block.version += 1"
      - from: INTERNAL_SIGNED_OFF
        to: BLOCKED
        trigger: "system cascade L4 of POST /credit-blocks/{id}/verification-decisions on a sibling block"
        actor: system
        preconditions:
          - "block.status IN {DRAFT, INTERNAL_SIGNED_OFF}"
          - "the cited pathway transitioned to SUSPENDED in cascade L3"
        side_effects:
          - "block.version += 1"

  - entity: HedgePosition
    dimension: status
    initial_state: OPEN
    terminal_states: [UNWOUND]
    transitions:
      - from: OPEN
        to: UNWOUND
        trigger: "POST /hedge-positions/{id}/unwinds"
        actor: FeedstockTrader
        preconditions:
          - "position.status == OPEN"
        side_effects:
          - "position.settlement_price_usd stored; position.realized_pnl_usd = round((settlement_price_usd - strike_price_usd) * notional_units, 2); position.total_margin_usd, base_margin_usd and volatility_adder_usd are reset to 0.00 and volatility_tier to T1 (margin is returned on unwind); position.version += 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quality-test-stale-lot
    parent_entity: FeedstockLot
    write_endpoint: "POST /feedstock-lots/{id}/quality-tests"
    occ_field: "expected_lot_version"
    description: |
      Appending a QualityTest to a FeedstockLot whose version has advanced since
      the client last read it is rejected. Retesting is legitimate and repeatable
      — a later sample supersedes the earlier governing test and can rewrite
      pretreatment_tier, pretreatment_fee_usd and the lot's status — so the write
      cannot be resolved by a state precondition. The stale-version check is the
      only thing that stops a client from overwriting a disposition it never saw.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-run
    parent_entity: ProcessingRun
    write_endpoint: "POST /processing-runs/{id}/allocations"
    occ_field: "expected_run_version"
    description: |
      Creating a FeedstockAllocation against a ProcessingRun whose version has
      advanced since the client last read it is rejected. Adding further
      allocations to a PLANNED run is legitimate and repeatable, and each one
      rewrites the run's reserved_mass_mt, blend_ci_gco2e_per_mj and
      required_h2_kg_per_day, so a client working from a stale blend picture
      would silently change the carbon intensity another writer just established.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: pretreatment_tier_and_fee
    trigger: "POST /feedstock-lots/{id}/quality-tests — evaluated on the appended QualityTest, then written onto FeedstockLot.pretreatment_tier and FeedstockLot.pretreatment_fee_usd"
    algorithm: threshold
    formula: |
      # Step 1 — four independent sub-tiers (all thresholds are >=, never >)
      ffa_tier_index        = 2 if ffa_pct        >= 5.00 else (1 if ffa_pct        >= 2.00 else 0)
      moisture_tier_index   = 2 if moisture_pct   >= 1.00 else (1 if moisture_pct   >= 0.50 else 0)
      insolubles_tier_index = 2 if insolubles_ppm >= 1500 else (1 if insolubles_ppm >= 500  else 0)
      phosphorus_tier_index = 2 if phosphorus_ppm >= 20   else (1 if phosphorus_ppm >= 10   else 0)

      # Step 2 — outright rejection dominates everything else
      if ffa_pct > 15.00 or moisture_pct > 3.00 or insolubles_ppm > 5000 or phosphorus_ppm > 500:
          disposition = "REJECT"; tier = "HEAVY"; fee = 0.00; stop

      # Step 3 — worst sub-tier governs
      tier_index = max(ffa_tier_index, moisture_tier_index,
                       insolubles_tier_index, phosphorus_tier_index)

      # Step 4 — waste-feedstock escalation branch (conditional on lot.feedstock_type)
      if lot.feedstock_type in WASTE_TYPES and phosphorus_ppm >= 10:
          tier_index = min(2, tier_index + 1)

      tier = ["NONE", "LIGHT", "HEAVY"][tier_index]
      disposition = "PASS" if tier_index == 0 else "PRETREAT"

      # Step 5 — fee with a floor and a cap around the linear term
      if tier_index == 0:
          fee = 0.00
      else:
          fee = round(min(FEE_CAP_USD,
                          max(FEE_FLOOR_USD,
                              BASE_FEE_PER_MT[tier] * lot.mass_mt * TYPE_MULT[lot.feedstock_type])), 2)
    input_set: "The single QualityTest being appended, plus the owning lot's feedstock_type and mass_mt. Prior tests are ignored by this calculation; which test governs the lot is decided by governing_quality_test."
    constants:
      WASTE_TYPES: [UCO, TALLOW, DCO]
      BASE_FEE_PER_MT: { NONE: 0.00, LIGHT: 18.50, HEAVY: 42.75 }
      TYPE_MULT: { UCO: 1.20, TALLOW: 1.35, DCO: 1.10, SOYBEAN_OIL: 1.00, CANOLA_OIL: 1.00 }
      FEE_FLOOR_USD: 250.00
      FEE_CAP_USD: 45000.00
    precision: "fee: 2 decimal places, round_half_up. Tier indices are integers."
    variants: []

  - name: governing_quality_test
    trigger: "Any read or recompute of FeedstockLot.pretreatment_tier / pretreatment_fee_usd, and every quality-test append"
    algorithm: chronological
    formula: |
      candidates = [t for t in QualityTest if t.lot_id == lot.id]
      if candidates is empty: governing = null   # lot.pretreatment_tier stays NONE
      else: governing = the candidate with the greatest sampled_at;
            if two or more candidates tie on sampled_at, the one with the
            greatest created_at wins; if they still tie, the one appended
            last in the request stream wins (created_at is monotonic per lot,
            so this third clause is unreachable in practice).
    input_set: "All QualityTest rows for the lot; none are excluded — an earlier sampled_at never governs even if appended later."
    constants: {}
    precision: "n/a"
    variants: []

  - name: blend_carbon_intensity
    trigger: "POST /processing-runs/{id}/allocations, POST /feedstock-allocations/{id}/releases, cascade L4 of POST /suppliers/{id}/suspensions, and POST /processing-runs/{id}/hydrogen-securements — written onto ProcessingRun.blend_ci_gco2e_per_mj"
    algorithm: aggregation
    formula: |
      lines = [a for a in FeedstockAllocation
               if a.run_id == run.id and a.status in {"RESERVED", "CONSUMED"}]
      if lines is empty: blend_ci = null      # not 0.00 — an unallocated run has no blend
      else:
        numerator   = sum(a.mass_mt * (lot(a).attested_ci_gco2e_per_mj
                                       + PRETREAT_CI_ADDER[lot(a).pretreatment_tier])
                          for a in lines)          # no intermediate rounding
        denominator = sum(a.mass_mt for a in lines)
        blend_ci    = round(numerator / denominator, 2)
    input_set: "Allocations on the run whose status is RESERVED or CONSUMED. RELEASED allocations are excluded, so a release changes the blend."
    constants:
      PRETREAT_CI_ADDER: { NONE: 0.00, LIGHT: 1.50, HEAVY: 4.00 }
    precision: "2 decimal places, round_half_up; the weighted sum is computed unrounded and rounded once at the end."
    variants: []

  - name: hydrogen_requirement
    trigger: "POST /processing-runs/{id}/allocations, POST /feedstock-allocations/{id}/releases, and POST /processing-runs/{id}/hydrogen-securements — written onto ProcessingRun.required_h2_kg_per_day"
    algorithm: aggregation
    formula: |
      lines = [a for a in FeedstockAllocation
               if a.run_id == run.id and a.status in {"RESERVED", "CONSUMED"}]
      if lines is empty: required_h2_kg_per_day = null   # not 0.0 — nothing is being fed
      else:
        total_mass    = sum(a.mass_mt for a in lines)
        weighted_h2   = sum(a.mass_mt * H2_KG_PER_MT[lot(a).feedstock_type]
                            for a in lines) / total_mass        # unrounded
        daily_feed_mt = round(total_mass / run.run_days, 3)       # ROUNDED FIRST
        required_h2_kg_per_day = round(daily_feed_mt * weighted_h2
                                       * (1 + SAF_SEVERITY_FACTOR
                                              * run.target_saf_share_pct / 100), 1)
    input_set: "RESERVED + CONSUMED allocations on the run."
    constants:
      H2_KG_PER_MT: { UCO: 32.0, TALLOW: 30.0, DCO: 34.0, SOYBEAN_OIL: 38.0, CANOLA_OIL: 36.0 }
      SAF_SEVERITY_FACTOR: 0.12
    precision: "Rounding order is pinned: daily_feed_mt is rounded to 3 decimals BEFORE being multiplied; the final result is rounded to 1 decimal, round_half_up. Rounding only at the end yields a different kilogram figure."
    variants: []

  - name: catalyst_activity_decay
    trigger: "POST /hydrotreating-units/{id}/catalyst-charges (initial 1.0000) and POST /processing-runs/{id}/completions — written onto CatalystCharge.activity_index"
    algorithm: decay_function
    formula: |
      cumulative_throughput_mt = sum(r.consumed_mass_mt for r in ProcessingRun
                                     if r.catalyst_charge_id == charge.id
                                     and r.status in {"COMPLETED", "RECONCILED"})
      activity_index = round(max(ACTIVITY_FLOOR,
                                 1.0000 - DECAY_PER_KMT * (cumulative_throughput_mt / 1000.0)), 4)
    input_set: "Runs on this charge with status COMPLETED or RECONCILED. RUNNING, PLANNED, HYDROGEN_SECURED and ABORTED runs contribute nothing."
    constants:
      DECAY_PER_KMT: 0.0125
      ACTIVITY_FLOOR: 0.6000
    precision: "4 decimal places, round_half_up, floored at 0.6000."
    variants: []

  - name: run_yield_split
    trigger: "PROVISIONAL at POST /processing-runs/{id}/hydrogen-securements; FINAL at POST /processing-runs/{id}/completions"
    algorithm: forward_looking
    formula: |
      # shared blend term (unrounded)
      blend_yield_pct = sum(a.mass_mt * YIELD_MASS_PCT[lot(a).feedstock_type]
                            for a in lines) / sum(a.mass_mt for a in lines)

      # PROVISIONAL (lines = RESERVED allocations, activity taken at securement)
      provisional_yield_pct   = round(blend_yield_pct * charge.activity_index, 3)
      planned_total_product_mt = round(run.reserved_mass_mt * provisional_yield_pct / 100, 3)
      planned_saf_mt          = round(planned_total_product_mt
                                      * (run.target_saf_share_pct / 100)
                                      * SAF_CONVERSION_PENALTY, 3)
      planned_rd_mt           = round(planned_total_product_mt - planned_saf_mt, 3)

      # FINAL (lines = CONSUMED allocations, measured masses reported at completion)
      final_yield_pct   = round((run.measured_rd_mt + run.measured_saf_mt)
                                / run.consumed_mass_mt * 100, 3)
      yield_variance_pct = round(final_yield_pct - provisional_yield_pct, 3)
      yield_variance_flag = abs(yield_variance_pct) > YIELD_VARIANCE_TOLERANCE_PCT
    input_set: "PROVISIONAL uses allocations with status == RESERVED and the catalyst activity_index as of the securement instant. FINAL uses allocations with status == CONSUMED (allocations released before start are excluded from the denominator) and the operator-reported measured masses."
    constants:
      YIELD_MASS_PCT: { UCO: 82.0, TALLOW: 80.0, DCO: 83.0, SOYBEAN_OIL: 85.0, CANOLA_OIL: 84.0 }
      SAF_CONVERSION_PENALTY: 0.94
      YIELD_VARIANCE_TOLERANCE_PCT: 2.000
    precision: "yield percentages 3 decimal places, masses 3 decimal places, round_half_up."
    variants:
      - name: PROVISIONAL
        when: "Stamped when the run leaves PLANNED for HYDROGEN_SECURED; it is a forward-looking estimate over RESERVED mass at the catalyst's activity at that instant."
        difference: "Multiplies the blend yield by the catalyst activity_index and applies SAF_CONVERSION_PENALTY to the planned SAF cut. It never reads a measured mass."
      - name: FINAL
        when: "Stamped when the run leaves RUNNING for COMPLETED."
        difference: "Ignores the catalyst activity_index and the SAF penalty entirely: it divides the operator-measured product masses by CONSUMED mass. For identical feedstock the two variants disagree whenever activity_index != measured performance, and their difference is the variance that derates the charge."

  - name: feedstock_settlement_cost
    trigger: "POST /processing-runs/{id}/reconciliations — written onto FeedstockAllocation.line_cost_usd per line and ProcessingRun.feedstock_cost_usd"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round every line to cents FIRST, then sum the rounded lines.
      for a in [x for x in FeedstockAllocation
                if x.run_id == run.id and x.status == "CONSUMED"]  # created_at ASC
          a.line_cost_usd = round(a.mass_mt * lot(a).purchase_price_usd_per_mt
                                  * (1 + FREIGHT_PCT), 2)
      run.feedstock_cost_usd = round(sum(a.line_cost_usd for a in those lines), 2)
    input_set: "CONSUMED allocations on the run only; RELEASED lines never settle. Lines are processed in created_at ASC order."
    constants:
      FREIGHT_PCT: 0.035
    precision: "Round-per-line-then-sum is normative. Summing the unrounded line products and rounding once at the end is the forbidden alternative and produces a different cent figure on the fixture in the difficulty design."
    variants: []

  - name: hedge_margin_requirement
    trigger: "POST /hedge-positions — written onto HedgePosition.gross_notional_usd, base_margin_usd, volatility_tier, volatility_adder_usd, total_margin_usd"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned and is NOT negotiable:
      #   1. gross_notional_usd
      #   2. base_margin_usd
      #   3. volatility_tier  <- selected from base_margin_usd, NEVER from total_margin_usd
      #   4. volatility_adder_usd
      #   5. total_margin_usd
      gross_notional_usd  = round(notional_units * strike_price_usd, 2)
      base_margin_usd     = round(gross_notional_usd * BASE_MARGIN_PCT[instrument], 2)
      volatility_tier     = "T3" if base_margin_usd >= 250000.00 else (
                            "T2" if base_margin_usd >=  50000.00 else "T1")
      volatility_adder_usd = round(base_margin_usd * VOL_ADDER_PCT[volatility_tier], 2)
      total_margin_usd     = round(base_margin_usd + volatility_adder_usd, 2)
    input_set: "The single HedgePosition being created."
    constants:
      BASE_MARGIN_PCT: { FEEDSTOCK_SWAP: 0.08, RIN_FORWARD: 0.12, LCFS_FORWARD: 0.15 }
      VOL_ADDER_PCT: { T1: 0.010, T2: 0.025, T3: 0.040 }
      TIER_T2_FLOOR_USD: 50000.00
      TIER_T3_FLOOR_USD: 250000.00
    precision: "All money 2 decimal places, round_half_up. Tier boundaries are >= (a base margin of exactly 50000.00 is T2, exactly 250000.00 is T3)."
    variants: []

  - name: product_volume_conversion
    trigger: "ProductBatch creation inside POST /processing-runs/{id}/completions — written onto ProductBatch.volume_gal"
    algorithm: aggregation
    formula: |
      volume_gal = round(mass_mt * GAL_PER_MT[product_type], 1)
    input_set: "The measured mass routed into this batch (measured_rd_mt or measured_saf_mt)."
    constants:
      GAL_PER_MT: { RENEWABLE_DIESEL: 308.0, SAF: 322.0 }
    precision: "1 decimal place, round_half_up."
    variants: []

  - name: rin_credit_quantity
    trigger: "PROVISIONAL at POST /credit-blocks (program == RFS); VERIFIED at POST /credit-blocks/{id}/verification-decisions"
    algorithm: threshold
    formula: |
      # PROVISIONAL
      provisional_rin_credits = floor(batch.volume_gal * RIN_EQUIVALENCE[batch.product_type])

      # VERIFIED — the verifier's CI substitution invalidates a proportional slice
      ci_drift = round((verified_ci - block.provisional_ci_gco2e_per_mj)
                       / block.provisional_ci_gco2e_per_mj, 4)
      invalid_rate = min(RIN_INVALID_RATE_CAP, max(0.0000, ci_drift))
      verified_rin_credits = floor(batch.volume_gal * RIN_EQUIVALENCE[batch.product_type]
                                   * (1 - invalid_rate))
    input_set: "The cited ProductBatch's volume_gal and product_type. Applies only when block.program == RFS; LCFS blocks keep 0."
    constants:
      RIN_EQUIVALENCE: { RENEWABLE_DIESEL: 1.7, SAF: 1.6 }
      RIN_INVALID_RATE_CAP: 0.1000
    precision: "RIN counts are integers produced by floor(), never round(). ci_drift is 4 decimal places."
    variants:
      - name: PROVISIONAL
        when: "Stamped at credit-block creation."
        difference: "Pure volume x equivalence; no CI term at all."
      - name: VERIFIED
        when: "Stamped on the verification decision."
        difference: "Applies a floor/cap-bounded invalidation rate derived from the verifier's CI substitution, so a worse verified CI destroys RINs even though RIN quantity is nominally volumetric."

  - name: lcfs_credit_quantity
    trigger: "PROVISIONAL at POST /credit-blocks (program == LCFS); VERIFIED at POST /credit-blocks/{id}/verification-decisions"
    algorithm: weighted_scoring
    formula: |
      # PROVISIONAL
      provisional_ci = round(run.blend_ci_gco2e_per_mj + PROCESS_CI_ADDER, 2)
      provisional_credits_mtco2e = max(0.000,
          round((LCFS_BENCHMARK_CI[batch.product_type] - provisional_ci)
                * EER[batch.product_type]
                * ENERGY_DENSITY_MJ_PER_GAL[batch.product_type]
                * batch.volume_gal / 1000000, 3))

      # VERIFIED
      verified_credits_mtco2e = max(0.000,
          round((LCFS_BENCHMARK_CI[batch.product_type] - verified_ci)
                * EER[batch.product_type]
                * ENERGY_DENSITY_MJ_PER_GAL[batch.product_type]
                * batch.volume_gal / 1000000 * VERIFICATION_DISCOUNT, 3))
    input_set: "The cited ProductBatch (volume_gal, product_type) and the producing run's blend_ci_gco2e_per_mj as frozen into block.provisional_ci_gco2e_per_mj at creation. Applies only when block.program == LCFS; RFS blocks keep 0.000."
    constants:
      LCFS_BENCHMARK_CI: { RENEWABLE_DIESEL: 88.50, SAF: 89.37 }
      ENERGY_DENSITY_MJ_PER_GAL: { RENEWABLE_DIESEL: 129.65, SAF: 126.60 }
      EER: { RENEWABLE_DIESEL: 1.00, SAF: 1.00 }
      PROCESS_CI_ADDER: 8.75
      VERIFICATION_DISCOUNT: 0.98
    precision: "3 decimal places, round_half_up, floored at 0.000."
    variants:
      - name: PROVISIONAL
        when: "Stamped at credit-block creation from the plant's own attested blend CI."
        difference: "Uses run.blend_ci + PROCESS_CI_ADDER and applies no verification discount."
      - name: VERIFIED
        when: "Stamped on the verification decision."
        difference: "Substitutes the verifier's CI for the attested CI and multiplies the whole quantity by VERIFICATION_DISCOUNT, so the two variants differ even when verified_ci equals provisional_ci."

  - name: pathway_credits_outstanding
    trigger: "Every verification decision, retirement and retirement reversal — written onto PathwayRegistration.credits_outstanding_mtco2e"
    algorithm: aggregation
    formula: |
      credits_outstanding_mtco2e = round(
          sum(b.verified_credits_mtco2e - b.retired_credits_mtco2e
              for b in CreditBlock
              if b.pathway_id == pathway.id
              and b.status in {"VERIFIED", "ADJUSTED", "RETIRED"}), 3)
    input_set: "Blocks on the pathway with status VERIFIED, ADJUSTED or RETIRED. DRAFT, INTERNAL_SIGNED_OFF, SUBMITTED_FOR_VERIFICATION, VERIFICATION_REJECTED and BLOCKED blocks contribute nothing."
    constants: {}
    precision: "3 decimal places, round_half_up."
    variants: []

  - name: hydrogen_committed_capacity
    trigger: "POST /hydrogen-contracts/{id}/nominations, POST /hydrogen-nominations/{id}/cancellations, and every cascade that cancels nominations — written onto HydrogenSupplyContract.peak_committed_kg_per_day"
    algorithm: interval_merge
    formula: |
      # A nomination covers calendar day D (a UTC date) iff its CLOSED interval
      # touches that day: nom.start_at <= end_of_day(D) AND nom.end_at >= start_of_day(D).
      # Both endpoints are inclusive, so a nomination ending 2026-09-10T00:00:00Z
      # still covers 2026-09-10 and collides with one starting that same instant.
      def committed(D) = sum(n.kg_per_day for n in HydrogenNomination
                             if n.contract_id == contract.id
                             and n.status == "CONFIRMED"
                             and covers(n, D))
      peak_committed_kg_per_day = round(max(committed(D)
                                            for D in days(contract.window_start,
                                                          contract.window_end)), 1)
      # 0.0 when the contract has no CONFIRMED nomination.
      # Admission test for a proposed nomination P:
      #   for every day D in days(P.start_at, P.end_at):
      #       committed(D) + P.kg_per_day <= contract.daily_capacity_kg
    input_set: "CONFIRMED nominations on the contract; CANCELLED nominations are excluded, which is what makes cancellation restore capacity exactly."
    constants: {}
    precision: "1 decimal place, round_half_up. Day granularity is the UTC calendar date."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first failing row decides the response, so two simultaneous violations
# always surface the lower-priority-number error)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource named by a path segment exists, validated left to right"
    error_id: "ERR_SUPPLIER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_TURNAROUND_WINDOW_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_NOMINATION_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_PATHWAY_NOT_FOUND | ERR_CREDIT_BLOCK_NOT_FOUND | ERR_HEDGE_POSITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (supplier_id, lot_id, unit_id, catalyst_charge_id, run_id, batch_id, pathway_id)"
    error_id: "ERR_SUPPLIER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_CATALYST_CHARGE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_PATHWAY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /feedstock-lots, POST /processing-runs, POST /processing-runs/{id}/allocations, POST /hydrogen-contracts/{id}/nominations, POST /pathway-registrations, POST /credit-blocks"

  - priority: 5
    category: auth
    check: "When the acting role is Supplier, X-User-ID equals the supplier_id in the path"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /suppliers/{id}/traceability-documents, GET /suppliers/{id}, GET /suppliers/{id}/traceability-documents"

  - priority: 6
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum members declared, numeric ranges and decimal-place limits honored, and pagination limit within 1..100. Inside this same band, POST /feedstock-lots additionally requires the cited supplier to list the requested feedstock_type in its feedstock_types, which fails with ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED after the schema and enum checks have passed"
    error_id: "ERR_INVALID_REQUEST | ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED"
    http_status: 422
    applies_to: all

  - priority: 7
    category: state
    check: "expected_lot_version equals FeedstockLot.version / expected_run_version equals ProcessingRun.version (OCC per §1.2.1)"
    error_id: "ERR_STALE_LOT_VERSION | ERR_STALE_RUN_VERSION"
    http_status: 412
    applies_to: "POST /feedstock-lots/{id}/quality-tests, POST /processing-runs/{id}/allocations"

  - priority: 8
    category: state
    check: "The target resource named in the path is in a state that permits this transition per §1.2"
    error_id: "ERR_INVALID_SUPPLIER_STATE | ERR_INVALID_LOT_STATE | ERR_INVALID_UNIT_STATE | ERR_INVALID_WINDOW_STATE | ERR_INVALID_NOMINATION_STATE | ERR_INVALID_RUN_STATE | ERR_INVALID_ALLOCATION_STATE | ERR_INVALID_BATCH_CERT_STATE | ERR_INVALID_BATCH_DISTRIBUTION_STATE | ERR_INVALID_PATHWAY_STATE | ERR_INVALID_CREDIT_BLOCK_STATE | ERR_INVALID_HEDGE_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "The supplier behind the cited lot has dd_status == VERIFIED (a PENDING or SUSPENDED supplier may not feed the reactor)"
    error_id: ERR_SUPPLIER_DUE_DILIGENCE_INCOMPLETE
    http_status: 409
    applies_to: "POST /processing-runs/{id}/allocations"

  - priority: 10
    category: business_temporal
    check: "The supplier behind the cited lot has dd_expires_at strictly after the current logical clock"
    error_id: ERR_SUPPLIER_DUE_DILIGENCE_EXPIRED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/allocations"

  - priority: 11
    category: business_safety
    check: "The cited lot is not awaiting pretreatment (lot.status != PRETREAT_REQUIRED)"
    error_id: ERR_PRETREATMENT_REQUIRED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/allocations"

  - priority: 12
    category: business_safety
    check: "The cited lot's status == ACCEPTED (RECEIVED, TESTED, PRETREATED, REJECTED, CHARGED and QUARANTINED lots cannot be allocated)"
    error_id: ERR_LOT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/allocations"

  - priority: 13
    category: business_safety
    check: "The CatalystCharge cited by the run has status == ACTIVE"
    error_id: ERR_CATALYST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /processing-runs, POST /processing-runs/{id}/hydrogen-securements, POST /processing-runs/{id}/starts"

  - priority: 14
    category: business_safety
    check: "SAF certification spec on a CERTIFY decision: when product_type == SAF the batch's recorded freeze_point_c is <= SAF_MAX_FREEZE_POINT_C (-40.0) and astm_annex is present"
    error_id: ERR_SAF_SPEC_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /product-batches/{id}/certification-decisions"

  - priority: 15
    category: business_safety
    check: "A SAF batch may only ship once cert_status == CERTIFIED"
    error_id: ERR_SAF_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /product-batches/{id}/shipments"

  - priority: 16
    category: business_referential
    check: "The cited pathway's unit_id equals the producing run's unit_id and the pathway's feedstock_type equals the dominant feedstock type of the run (the feedstock_type with the greatest CONSUMED mass; ties broken by the allocation with the earliest created_at)"
    error_id: ERR_PATHWAY_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /credit-blocks"

  - priority: 17
    category: business_referential
    check: "The cited ProductBatch has distribution_status == SHIPPED (credits are minted on transfer, not in tank)"
    error_id: ERR_BATCH_NOT_SHIPPED
    http_status: 409
    applies_to: "POST /credit-blocks"

  - priority: 18
    category: business_referential
    check: "At least one Supplier exists with dd_status == VERIFIED, dd_expires_at > now and feedstock_types containing the pathway's feedstock_type"
    error_id: ERR_NO_VERIFIED_SUPPLIER
    http_status: 409
    applies_to: "POST /pathway-registrations/{id}/submissions"

  - priority: 19
    category: business_constraint
    check: "Segregation of duties: the acting X-User-ID differs from the cited pathway's registered_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credit-blocks/{id}/internal-signoffs"

  - priority: 20
    category: business_constraint
    check: "PathwayRegistration.revision_round < MAX_REVISION_ROUNDS (3) when re-submitting from RETURNED_FOR_INFO"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /pathway-registrations/{id}/submissions"

  - priority: 21
    category: business_constraint
    check: "TraceabilityDocument uniqueness: no existing document on this supplier shares the same doc_type, and no existing document anywhere shares the same doc_hash"
    error_id: ERR_DUPLICATE_DOCUMENT
    http_status: 409
    applies_to: "POST /suppliers/{id}/traceability-documents"

  - priority: 22
    category: business_constraint
    check: "Due-diligence document sufficiency: dd_document_type_count >= 2, or >= 3 including a THIRD_PARTY_AUDIT when is_high_risk_origin == true; documents whose valid_until <= now do not count"
    error_id: ERR_DUE_DILIGENCE_DOCS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /suppliers/{id}/due-diligence-verifications"

  - priority: 23
    category: business_temporal
    check: "Turnaround adjacency: on the same unit, the proposed [start_at, end_at) half-open interval must be separated from every non-CANCELLED, non-COMPLETED window by at least TURNAROUND_BUFFER_HOURS (72) of clear time on both sides"
    error_id: ERR_TURNAROUND_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /hydrotreating-units/{id}/turnaround-windows"

  - priority: 24
    category: business_temporal
    check: "Unit window exclusivity: a run's [window_start, window_end) half-open interval must not intersect any other run on the same unit with status IN {PLANNED, HYDROGEN_SECURED, RUNNING}, nor any TurnaroundWindow on that unit with status IN {PLANNED, APPROVED, IN_PROGRESS}. Touching endpoints (one interval's end equal to the other's start) do NOT intersect and are allowed — there is no buffer here."
    error_id: ERR_UNIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /processing-runs"

  - priority: 25
    category: business_temporal
    check: "A catalyst charge's installed_at falls inside an APPROVED or IN_PROGRESS TurnaroundWindow on that unit whose scope == CATALYST_CHANGE, using the half-open interval [start_at, end_at)"
    error_id: ERR_CATALYST_CHANGE_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /hydrotreating-units/{id}/catalyst-charges"

  - priority: 26
    category: business_temporal
    check: "A nomination's closed interval [start_at, end_at] lies inside the contract's closed window [window_start, window_end] and end_at >= start_at"
    error_id: ERR_NOMINATION_OUTSIDE_CONTRACT_WINDOW
    http_status: 422
    applies_to: "POST /hydrogen-contracts/{id}/nominations"

  - priority: 27
    category: business_temporal
    check: "Run window shape: window_start and window_end are both exactly midnight UTC, window_end > window_start, and their difference is a whole number of days"
    error_id: ERR_INVALID_RUN_WINDOW
    http_status: 422
    applies_to: "POST /processing-runs"

  - priority: 28
    category: business_temporal
    check: "The current logical clock is >= run.window_end before a run may be completed"
    error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/completions"

  - priority: 29
    category: business_temporal
    check: "HedgePosition.maturity_at is strictly after the current logical clock"
    error_id: ERR_MATURITY_IN_PAST
    http_status: 422
    applies_to: "POST /hedge-positions"

  - priority: 30
    category: business_constraint
    check: "The run has at least one FeedstockAllocation with status == RESERVED (zero-cardinality guard, checked before any mass threshold)"
    error_id: ERR_NO_FEEDSTOCK_ALLOCATED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/hydrogen-securements"

  - priority: 31
    category: business_constraint
    check: "Pretreatment output mass: 0 < output_mass_mt <= source lot.mass_mt"
    error_id: ERR_PRETREATMENT_MASS_EXCEEDED
    http_status: 422
    applies_to: "POST /feedstock-lots/{id}/pretreatments"

  - priority: 32
    category: business_fiscal
    check: "Allocation mass fits the lot: mass_mt <= lot.remaining_mass_mt"
    error_id: ERR_LOT_MASS_EXCEEDED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/allocations"

  - priority: 33
    category: business_fiscal
    check: "run.reserved_mass_mt >= MIN_CHARGE_MT (100.0) at securement"
    error_id: ERR_MIN_CHARGE_NOT_MET
    http_status: 409
    applies_to: "POST /processing-runs/{id}/hydrogen-securements"

  - priority: 34
    category: business_fiscal
    check: "round(run.reserved_mass_mt / run.run_days, 3) <= unit.nameplate_capacity_mt_per_day"
    error_id: ERR_UNIT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /processing-runs/{id}/hydrogen-securements"

  - priority: 35
    category: business_fiscal
    check: "run.target_saf_share_pct <= unit.max_saf_share_pct at run creation, and the measured SAF share <= unit.max_saf_share_pct at completion"
    error_id: ERR_SAF_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /processing-runs, POST /processing-runs/{id}/completions"

  - priority: 36
    category: business_fiscal
    check: "Hydrogen coverage: for every calendar day in the run window, the sum of CONFIRMED nomination kg_per_day for that run covers run.required_h2_kg_per_day"
    error_id: ERR_HYDROGEN_COVERAGE_SHORTFALL
    http_status: 409
    applies_to: "POST /processing-runs/{id}/hydrogen-securements"

  - priority: 37
    category: business_fiscal
    check: "Contract aggregate capacity: for every calendar day the proposed nomination touches, committed(D) + kg_per_day <= contract.daily_capacity_kg"
    error_id: ERR_HYDROGEN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hydrogen-contracts/{id}/nominations"

  - priority: 38
    category: business_fiscal
    check: "Mass balance: round(measured_rd_mt + measured_saf_mt, 3) <= run.consumed_mass_mt"
    error_id: ERR_MASS_BALANCE_VIOLATION
    http_status: 422
    applies_to: "POST /processing-runs/{id}/completions"

  - priority: 39
    category: business_fiscal
    check: "Retirement size: 0 < credits <= block.verified_credits_mtco2e - block.retired_credits_mtco2e"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 409
    applies_to: "POST /credit-blocks/{id}/retirements"

  - priority: 40
    category: business_fiscal
    check: "Retirement reversal requires a non-zero retired balance: block.retired_credits_mtco2e > 0.000"
    error_id: ERR_NOTHING_TO_REVERSE
    http_status: 409
    applies_to: "POST /credit-blocks/{id}/retirement-reversals"

# ---------------------------------------------------------------------------
# §1.5 Endpoint Table
# Path convention: api_prefix is "/", so every collection is a flat root-level
# segment and every templated path parameter is written literally as `{id}`.
# ---------------------------------------------------------------------------
endpoints:
  # ---- Supplier & traceability -------------------------------------------
  - method: POST
    path: "/suppliers"
    roles: [FeedstockTrader]
    input: [legal_name, country_code, feedstock_types, "is_high_risk_origin?"]
    output: Supplier
    success_status: 201
    side_effects: "Creates the supplier with dd_status = PENDING, dd_document_type_count = 0, dd_verified_at = null, dd_expires_at = null, suspension_reason = null. is_high_risk_origin defaults to false."

  - method: GET
    path: "/suppliers/{id}"
    roles: [FeedstockTrader, QualityAnalyst, ComplianceOfficer, Supplier]
    input: []
    output: Supplier
    success_status: 200
    side_effects: "None. A Supplier caller may read only its own row (§1.4 priority 5)."

  - method: POST
    path: "/suppliers/{id}/traceability-documents"
    roles: [Supplier, FeedstockTrader]
    input: [doc_type, issued_at, valid_until, doc_hash]
    output: TraceabilityDocument
    success_status: 201
    side_effects: "Appends an immutable document row. Recomputes supplier.dd_document_type_count as the number of distinct doc_type values on documents whose valid_until > now, and increments supplier.version."

  - method: GET
    path: "/suppliers/{id}/traceability-documents"
    roles: [ComplianceOfficer, FeedstockTrader, Supplier]
    input: ["doc_type?", "limit?", "offset?"]
    output: TraceabilityDocument[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/suppliers/{id}/due-diligence-verifications"
    roles: [ComplianceOfficer]
    input: [valid_months]
    output: Supplier
    success_status: 200
    side_effects: "PENDING -> VERIFIED. Sets dd_verified_at = now, dd_expires_at = now plus valid_months * 30 days (exact 30-day months, per §1.2), clears suspension_reason, increments version."

  - method: POST
    path: "/suppliers/{id}/suspensions"
    roles: [ComplianceOfficer]
    input: [reason]
    output: Supplier
    success_status: 200
    side_effects: "VERIFIED -> SUSPENDED and fires Cascade A (§1.2, five levels): quarantines the supplier's non-terminal lots, releases their RESERVED allocations with release_reason = SUPPLIER_SUSPENDED, demotes affected HYDROGEN_SECURED runs back to PLANNED when reserved_mass_mt falls below MIN_CHARGE_MT, cancels those runs' CONFIRMED hydrogen nominations, and recomputes each touched contract's peak_committed_kg_per_day."

  # ---- Feedstock lots, testing, pretreatment ------------------------------
  - method: POST
    path: "/feedstock-lots"
    roles: [FeedstockTrader]
    input: [supplier_id, feedstock_type, mass_mt, attested_ci_gco2e_per_mj, purchase_price_usd_per_mt, received_at]
    output: FeedstockLot
    success_status: 201
    side_effects: "Creates the lot with status = RECEIVED, pretreatment_tier = NONE, pretreatment_fee_usd = 0.00, pretreatment_loss_mt = 0.000, pretreatment_consumed_mt = 0.000, allocated_mass_mt = 0.000, remaining_mass_mt = mass_mt, source_lot_id = null. feedstock_type must appear in the supplier's feedstock_types."

  - method: GET
    path: "/feedstock-lots/{id}"
    roles: [FeedstockTrader, QualityAnalyst, ComplianceOfficer, PlantOperator]
    input: []
    output: FeedstockLot
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/feedstock-lots"
    roles: [FeedstockTrader, QualityAnalyst, ComplianceOfficer, PlantOperator]
    input: ["supplier_id?", "source_lot_id?", "feedstock_type?", "status?", "limit?", "offset?"]
    output: FeedstockLot[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC. supplier_id filters parentage; source_lot_id lists the pretreated child lots derived from a given source lot."

  - method: POST
    path: "/feedstock-lots/{id}/quality-tests"
    roles: [QualityAnalyst]
    input: [ffa_pct, moisture_pct, insolubles_ppm, phosphorus_ppm, sampled_at, expected_lot_version]
    output: QualityTest
    success_status: 201
    side_effects: "Runs `pretreatment_tier_and_fee` (§1.3). Records the four tier indices, tier and disposition on the test row. Sets lot.pretreatment_tier, lot.pretreatment_fee_usd and lot.status (PASS -> TESTED, PRETREAT -> PRETREAT_REQUIRED, REJECT -> REJECTED, which also zeroes remaining_mass_mt) and increments lot.version. Guarded by expected_lot_version (§1.2.1)."

  - method: GET
    path: "/feedstock-lots/{id}/quality-tests"
    roles: [QualityAnalyst, ComplianceOfficer]
    input: ["disposition?", "limit?", "offset?"]
    output: QualityTest[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC; `governing_quality_test` (§1.3) is the latest by sampled_at, ties broken by created_at ASC."

  - method: POST
    path: "/feedstock-lots/{id}/pretreatments"
    roles: [QualityAnalyst]
    input: [output_mass_mt]
    output: FeedstockLot
    success_status: 201
    side_effects: "Source lot PRETREAT_REQUIRED -> PRETREATED: sets source.pretreatment_consumed_mt = source.mass_mt, source.pretreatment_loss_mt = round(source.mass_mt - output_mass_mt, 3), source.remaining_mass_mt = 0.000, increments source.version. Emits a new child FeedstockLot with source_lot_id = the source lot, status = ACCEPTED (already fit to charge), mass_mt = remaining_mass_mt = output_mass_mt, pretreatment_tier = NONE, pretreatment_fee_usd = 0.00, attested_ci_gco2e_per_mj = source.attested_ci_gco2e_per_mj + PRETREAT_CI_ADDER[source.pretreatment_tier] (so `blend_carbon_intensity` adds no second adder for the child, whose tier is NONE), and purchase_price_usd_per_mt = round((source.mass_mt * source.purchase_price_usd_per_mt + source.pretreatment_fee_usd) / output_mass_mt, 2). Returns the child lot."

  - method: POST
    path: "/feedstock-lots/{id}/acceptances"
    roles: [QualityAnalyst]
    input: []
    output: FeedstockLot
    success_status: 200
    side_effects: "TESTED -> ACCEPTED. Increments lot.version. Only an ACCEPTED lot may be allocated to a run."

  - method: GET
    path: "/feedstock-lots/{id}/allocations"
    roles: [FeedstockTrader, PlantOperator, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: FeedstockAllocation[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  # ---- Hydrotreating units, catalyst, turnarounds --------------------------
  - method: POST
    path: "/hydrotreating-units"
    roles: [PlantOperator]
    input: [name, nameplate_capacity_mt_per_day, max_saf_share_pct]
    output: HydrotreatingUnit
    success_status: 201
    side_effects: "Creates the unit with status = IDLE, active_catalyst_charge_id = null, requires_turnaround = false."

  - method: GET
    path: "/hydrotreating-units/{id}"
    roles: [PlantOperator, ComplianceOfficer]
    input: []
    output: HydrotreatingUnit
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/hydrotreating-units"
    roles: [PlantOperator, ComplianceOfficer]
    input: ["status?", "active_catalyst_charge_id?", "requires_turnaround?", "limit?", "offset?"]
    output: HydrotreatingUnit[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC. active_catalyst_charge_id resolves a catalyst charge back to the unit currently running it."

  - method: POST
    path: "/hydrotreating-units/{id}/catalyst-charges"
    roles: [PlantOperator]
    input: [design_throughput_mt, installed_at]
    output: CatalystCharge
    success_status: 201
    side_effects: "Creates the charge with status = ACTIVE, cumulative_throughput_mt = 0.000, activity_index = 1.0000. When the unit already carries an ACTIVE, DERATED or SPENT charge, that charge moves to REMOVED and the unit must be DOWN_TURNAROUND (§1.2); the first charge on a fresh unit needs only the approved window. Sets unit.active_catalyst_charge_id to the new charge, sets unit.requires_turnaround = false, and increments unit.version. Requires an APPROVED or IN_PROGRESS CATALYST_CHANGE window covering installed_at (§1.4 priority 25)."

  - method: GET
    path: "/hydrotreating-units/{id}/catalyst-charges"
    roles: [PlantOperator, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: CatalystCharge[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/hydrotreating-units/{id}/turnaround-windows"
    roles: [PlantOperator]
    input: [scope, start_at, end_at]
    output: TurnaroundWindow
    success_status: 201
    side_effects: "Creates the window with status = PLANNED after the 72-hour buffer test of §1.4 priority 23 over the half-open interval [start_at, end_at)."

  - method: GET
    path: "/hydrotreating-units/{id}/turnaround-windows"
    roles: [PlantOperator, ComplianceOfficer]
    input: ["status?", "scope?", "limit?", "offset?"]
    output: TurnaroundWindow[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/turnaround-windows/{id}/approvals"
    roles: [PlantOperator]
    input: []
    output: TurnaroundWindow
    success_status: 200
    side_effects: "PLANNED -> APPROVED. Increments window.version."

  - method: POST
    path: "/turnaround-windows/{id}/starts"
    roles: [PlantOperator]
    input: []
    output: TurnaroundWindow
    success_status: 200
    side_effects: "APPROVED -> IN_PROGRESS and the unit moves IDLE -> DOWN_TURNAROUND (a unit with a RUNNING run cannot be taken down). Increments both versions."

  - method: POST
    path: "/turnaround-windows/{id}/completions"
    roles: [PlantOperator]
    input: []
    output: TurnaroundWindow
    success_status: 200
    side_effects: "IN_PROGRESS -> COMPLETED and the unit returns DOWN_TURNAROUND -> IDLE. Increments both versions."

  - method: POST
    path: "/turnaround-windows/{id}/cancellations"
    roles: [PlantOperator]
    input: [reason]
    output: TurnaroundWindow
    success_status: 200
    side_effects: "PLANNED or APPROVED -> CANCELLED. A CANCELLED window no longer participates in the 72-hour buffer test or in run-window exclusivity, and no longer authorizes a catalyst change."

  # ---- Hydrogen supply -----------------------------------------------------
  - method: POST
    path: "/hydrogen-contracts"
    roles: [FeedstockTrader]
    input: [vendor_name, daily_capacity_kg, price_usd_per_kg, window_start, window_end, hydrogen_ci_gco2e_per_mj]
    output: HydrogenSupplyContract
    success_status: 201
    side_effects: "Creates the contract with peak_committed_kg_per_day = 0.000. window_start and window_end are inclusive calendar-day bounds."

  - method: GET
    path: "/hydrogen-contracts/{id}"
    roles: [FeedstockTrader, PlantOperator, ComplianceOfficer]
    input: []
    output: HydrogenSupplyContract
    success_status: 200
    side_effects: "None."

  - method: POST
    path: "/hydrogen-contracts/{id}/nominations"
    roles: [PlantOperator]
    input: [run_id, start_at, end_at, kg_per_day]
    output: HydrogenNomination
    success_status: 201
    side_effects: "Creates the nomination with status = CONFIRMED over the closed day interval [start_at, end_at] after the per-day aggregate capacity test of §1.4 priority 37, then recomputes contract.peak_committed_kg_per_day via `hydrogen_committed_capacity` (§1.3) and increments contract.version."

  - method: GET
    path: "/hydrogen-contracts/{id}/nominations"
    roles: [PlantOperator, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: HydrogenNomination[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: GET
    path: "/processing-runs/{id}/hydrogen-nominations"
    roles: [PlantOperator, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: HydrogenNomination[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC. Resolves a run to the nominations booked against it."

  - method: POST
    path: "/hydrogen-nominations/{id}/cancellations"
    roles: [PlantOperator]
    input: []
    output: HydrogenNomination
    success_status: 200
    side_effects: "CONFIRMED -> CANCELLED, then recomputes the parent contract's peak_committed_kg_per_day and increments contract.version — the compensating restoration of booked capacity."

  # ---- Processing runs and feedstock allocation -----------------------------
  - method: POST
    path: "/processing-runs"
    roles: [PlantOperator]
    input: [unit_id, catalyst_charge_id, window_start, window_end, target_saf_share_pct]
    output: ProcessingRun
    success_status: 201
    side_effects: "Creates the run with status = PLANNED, run_days = whole days between window_start and window_end, reserved_mass_mt = 0.000, consumed_mass_mt = 0.000, blend_ci_gco2e_per_mj = null, required_h2_kg_per_day = null, all yield and cost fields null, abort_reason = null. Enforces window exclusivity against other runs and non-cancelled turnaround windows on the unit (§1.4 priority 24)."

  - method: GET
    path: "/processing-runs/{id}"
    roles: [PlantOperator, ComplianceOfficer, FeedstockTrader]
    input: []
    output: ProcessingRun
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/processing-runs"
    roles: [PlantOperator, ComplianceOfficer, FeedstockTrader]
    input: ["unit_id?", "catalyst_charge_id?", "status?", "limit?", "offset?"]
    output: ProcessingRun[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/processing-runs/{id}/allocations"
    roles: [FeedstockTrader]
    input: [lot_id, mass_mt, expected_run_version]
    output: FeedstockAllocation
    success_status: 201
    side_effects: "Creates the allocation with status = RESERVED and line_cost_usd = null (line settlement happens at reconciliation via `feedstock_settlement_cost`, §1.3). Adds mass_mt to lot.allocated_mass_mt, subtracts it from lot.remaining_mass_mt (increments lot.version), adds it to run.reserved_mass_mt, and recomputes run.blend_ci_gco2e_per_mj and run.required_h2_kg_per_day across all RESERVED allocations. Increments run.version. Guarded by expected_run_version (§1.2.1)."

  - method: GET
    path: "/processing-runs/{id}/allocations"
    roles: [FeedstockTrader, PlantOperator, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: FeedstockAllocation[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/feedstock-allocations/{id}/releases"
    roles: [FeedstockTrader]
    input: []
    output: FeedstockAllocation
    success_status: 200
    side_effects: "RESERVED -> RELEASED with release_reason = MANUAL. Restores the mass to the lot (allocated_mass_mt down, remaining_mass_mt up), lowers run.reserved_mass_mt, recomputes run.blend_ci_gco2e_per_mj and run.required_h2_kg_per_day over the remaining RESERVED allocations (both become null when none remain), and increments both versions. This is the compensating half of the feedstock mass invariant (§1.2)."

  - method: POST
    path: "/processing-runs/{id}/hydrogen-securements"
    roles: [PlantOperator]
    input: []
    output: ProcessingRun
    success_status: 200
    side_effects: "PLANNED -> HYDROGEN_SECURED once the run has at least one RESERVED allocation, clears MIN_CHARGE_MT, fits the unit's daily nameplate, and every calendar day of the window is covered by CONFIRMED nominations of at least required_h2_kg_per_day (§1.4 priorities 30, 33, 34, 36). Increments run.version."

  - method: POST
    path: "/processing-runs/{id}/starts"
    roles: [PlantOperator]
    input: []
    output: ProcessingRun
    success_status: 200
    side_effects: "HYDROGEN_SECURED -> RUNNING; requires unit.status == IDLE and moves the unit to RUNNING. Flips every RESERVED allocation to CONSUMED, sets run.consumed_mass_mt = run.reserved_mass_mt, moves each cited lot to CHARGED, and computes run.provisional_yield_pct, run.planned_total_product_mt, run.planned_rd_mt, run.planned_saf_mt and run.feedstock_cost_usd via the PROVISIONAL variant of `run_yield_split` (§1.3). Increments the run, unit and lot versions."

  - method: POST
    path: "/processing-runs/{id}/completions"
    roles: [PlantOperator]
    input: [measured_rd_mt, measured_saf_mt]
    output: ProcessingRun
    success_status: 200
    side_effects: "RUNNING -> COMPLETED after the mass-balance and SAF-share checks (§1.4 priorities 35, 38) and once the clock has passed window_end. Computes final_yield_pct, yield_variance_pct and yield_variance_flag via the FINAL variant of `run_yield_split`, releases the unit RUNNING -> IDLE, advances the catalyst charge's cumulative_throughput_mt and activity_index via `catalyst_activity_decay` (§1.3, which may drive the charge ACTIVE -> DERATED -> SPENT and set unit.requires_turnaround), and emits one ProductBatch per non-zero measured product with cert_status = UNCERTIFIED, distribution_status = IN_TANK and volume_gal from `product_volume_conversion`."

  - method: POST
    path: "/processing-runs/{id}/reconciliations"
    roles: [ComplianceOfficer]
    input: []
    output: ProcessingRun
    success_status: 200
    side_effects: "COMPLETED -> RECONCILED, the terminal accounting state that freezes the run's yield and cost figures for credit generation. Increments run.version."

  - method: POST
    path: "/processing-runs/{id}/aborts"
    roles: [PlantOperator]
    input: [reason]
    output: ProcessingRun
    success_status: 200
    side_effects: "PLANNED, HYDROGEN_SECURED or RUNNING -> ABORTED with abort_reason. Releases every RESERVED allocation with release_reason = RUN_ABORTED and restores the lot masses, cancels the run's CONFIRMED nominations and recomputes the affected contracts' peak_committed_kg_per_day, and returns a RUNNING unit to IDLE. CONSUMED allocations are not restored."

  # ---- Product batches, certification, distribution ------------------------
  - method: GET
    path: "/product-batches/{id}"
    roles: [PlantOperator, ComplianceOfficer, IndependentVerifier]
    input: []
    output: ProductBatch
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/product-batches"
    roles: [PlantOperator, ComplianceOfficer, IndependentVerifier]
    input: ["run_id?", "product_type?", "cert_status?", "distribution_status?", "limit?", "offset?"]
    output: ProductBatch[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/product-batches/{id}/certification-requests"
    roles: [ComplianceOfficer]
    input: [astm_annex, freeze_point_c]
    output: ProductBatch
    success_status: 200
    side_effects: "cert_status UNCERTIFIED or CERT_REJECTED -> CERT_PENDING, recording astm_annex and freeze_point_c and clearing cert_reject_reason. Increments batch.version. The cert_status dimension is independent of distribution_status."

  - method: POST
    path: "/product-batches/{id}/certification-decisions"
    roles: [IndependentVerifier]
    input: [decision, "note?"]
    output: ProductBatch
    success_status: 200
    side_effects: "decision CERTIFY moves CERT_PENDING -> CERTIFIED; decision REJECT moves CERT_PENDING -> CERT_REJECTED and stores note in cert_reject_reason. decision IN {CERTIFY, REJECT}. A CERTIFY on a SAF batch whose freeze_point_c exceeds SAF_MAX_FREEZE_POINT_C (-40.0) is refused (§1.4 priority 14)."

  - method: POST
    path: "/product-batches/{id}/reservations"
    roles: [ComplianceOfficer]
    input: [offtaker_name]
    output: ProductBatch
    success_status: 200
    side_effects: "distribution_status IN_TANK -> RESERVED, recording offtaker_name. Independent of cert_status."

  - method: POST
    path: "/product-batches/{id}/reservation-releases"
    roles: [ComplianceOfficer]
    input: []
    output: ProductBatch
    success_status: 200
    side_effects: "distribution_status RESERVED -> IN_TANK, clearing offtaker_name."

  - method: POST
    path: "/product-batches/{id}/shipments"
    roles: [ComplianceOfficer]
    input: []
    output: ProductBatch
    success_status: 200
    side_effects: "distribution_status RESERVED -> SHIPPED. A SAF batch must be CERTIFIED first (§1.4 priority 15); renewable diesel may ship uncertified. SHIPPED is the precondition for minting a CreditBlock."

  # ---- Pathway registration ------------------------------------------------
  - method: POST
    path: "/pathway-registrations"
    roles: [ComplianceOfficer]
    input: [unit_id, program, feedstock_type, proposed_ci_gco2e_per_mj]
    output: PathwayRegistration
    success_status: 201
    side_effects: "Creates the registration with status = DRAFT, revision_round = 0, variance_strikes = 0, credits_outstanding_mtco2e = 0.000, certified_ci_gco2e_per_mj = null, info_request = null, and registered_by_user_id = the acting X-User-ID (the anchor of the segregation-of-duties rule)."

  - method: GET
    path: "/pathway-registrations/{id}"
    roles: [ComplianceOfficer, IndependentVerifier]
    input: []
    output: PathwayRegistration
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/pathway-registrations"
    roles: [ComplianceOfficer, IndependentVerifier]
    input: ["unit_id?", "program?", "feedstock_type?", "status?", "limit?", "offset?"]
    output: PathwayRegistration[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/pathway-registrations/{id}/submissions"
    roles: [ComplianceOfficer]
    input: []
    output: PathwayRegistration
    success_status: 200
    side_effects: "DRAFT -> SUBMITTED, or RETURNED_FOR_INFO -> SUBMITTED with revision_round incremented and info_request cleared. Re-submission is refused once revision_round has reached MAX_REVISION_ROUNDS (3) (§1.4 priority 20). Requires at least one verified, unexpired supplier for the pathway's feedstock_type (§1.4 priority 18)."

  - method: POST
    path: "/pathway-registrations/{id}/review-starts"
    roles: [IndependentVerifier]
    input: []
    output: PathwayRegistration
    success_status: 200
    side_effects: "SUBMITTED -> UNDER_REVIEW. Increments pathway.version."

  - method: POST
    path: "/pathway-registrations/{id}/review-decisions"
    roles: [IndependentVerifier]
    input: [decision, "certified_ci?", "info_request?"]
    output: PathwayRegistration
    success_status: 200
    side_effects: "From UNDER_REVIEW: decision REGISTER requires certified_ci (stored into certified_ci_gco2e_per_mj) and moves to REGISTERED; decision RETURN requires info_request and moves to RETURNED_FOR_INFO (re-entering the SUBMITTED cycle); decision DENY moves to DENIED, a terminal state. Increments pathway.version."

  # ---- Credit blocks: generation, verification, retirement ------------------
  - method: POST
    path: "/credit-blocks"
    roles: [ComplianceOfficer]
    input: [batch_id, pathway_id]
    output: CreditBlock
    success_status: 201
    side_effects: "Creates the block with status = DRAFT, program copied from the pathway, provisional_ci_gco2e_per_mj = round(run.blend_ci_gco2e_per_mj + PROCESS_CI_ADDER, 2) per §1.3, and the provisional quantities from `rin_credit_quantity` or `lcfs_credit_quantity` (PROVISIONAL variant, §1.3). Requires a REGISTERED pathway whose unit and dominant feedstock match the producing run, and a SHIPPED batch (§1.4 priorities 16, 17). Verified fields, retired_credits_mtco2e = 0.000, verification_outcome = NONE, signed_off_by_user_id = null."

  - method: GET
    path: "/credit-blocks/{id}"
    roles: [ComplianceOfficer, IndependentVerifier]
    input: []
    output: CreditBlock
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/credit-blocks"
    roles: [ComplianceOfficer, IndependentVerifier]
    input: ["batch_id?", "pathway_id?", "program?", "status?", "limit?", "offset?"]
    output: CreditBlock[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/credit-blocks/{id}/internal-signoffs"
    roles: [ComplianceOfficer]
    input: []
    output: CreditBlock
    success_status: 200
    side_effects: "DRAFT -> INTERNAL_SIGNED_OFF, recording signed_off_by_user_id = the acting X-User-ID. Refused when the acting user is the pathway's registered_by_user_id (§1.4 priority 19)."

  - method: POST
    path: "/credit-blocks/{id}/verification-submissions"
    roles: [ComplianceOfficer]
    input: []
    output: CreditBlock
    success_status: 200
    side_effects: "INTERNAL_SIGNED_OFF -> SUBMITTED_FOR_VERIFICATION. Increments block.version."

  - method: POST
    path: "/credit-blocks/{id}/verification-decisions"
    roles: [IndependentVerifier]
    input: [decision, "verified_ci?", "findings?"]
    output: CreditBlock
    success_status: 200
    side_effects: "From SUBMITTED_FOR_VERIFICATION with decision IN {VERIFY, REJECT}. decision VERIFY requires verified_ci and always recomputes the verified quantities with the VERIFIED variant at that CI; the landing state is then DERIVED from arithmetic, not requested: VERIFIED when the relative divergence from the provisional quantity is within VERIFICATION_VARIANCE_TOLERANCE (0.05), otherwise ADJUSTED, which fires Cascade C (§1.2, four levels): the pathway's variance_strikes increments, at PATHWAY_SUSPENSION_STRIKES (2) the pathway moves REGISTERED -> SUSPENDED, and every sibling block on that pathway still in DRAFT or INTERNAL_SIGNED_OFF moves to BLOCKED. decision REJECT requires findings and moves to VERIFICATION_REJECTED with zeroed verified quantities. Both VERIFIED and ADJUSTED add the verified credits to pathway.credits_outstanding_mtco2e."

  - method: POST
    path: "/credit-blocks/{id}/retirements"
    roles: [ComplianceOfficer]
    input: [credits]
    output: CreditBlock
    success_status: 200
    side_effects: "From VERIFIED or ADJUSTED: adds credits to retired_credits_mtco2e, subtracts them from pathway.credits_outstanding_mtco2e, and moves the block to RETIRED once retired_credits_mtco2e equals verified_credits_mtco2e. Increments both versions."

  - method: POST
    path: "/credit-blocks/{id}/retirement-reversals"
    roles: [ComplianceOfficer]
    input: [reason]
    output: CreditBlock
    success_status: 200
    side_effects: "Reverses the whole retired balance: sets retired_credits_mtco2e = 0.000, adds that amount back to pathway.credits_outstanding_mtco2e, records reason in verification_findings, and returns a RETIRED block to VERIFIED or ADJUSTED according to its verification_outcome. This is the compensating half of the credit-conservation invariant (§1.2)."

  # ---- Hedging -------------------------------------------------------------
  - method: POST
    path: "/hedge-positions"
    roles: [FeedstockTrader]
    input: [instrument, notional_units, strike_price_usd, maturity_at, "volatility_tier?"]
    output: HedgePosition
    success_status: 201
    side_effects: "Creates the position with status = OPEN and runs `hedge_margin_requirement` (§1.3) in the pinned order gross_notional_usd -> base_margin_usd -> volatility_tier -> volatility_adder_usd -> total_margin_usd. When volatility_tier is omitted it is derived from base_margin_usd against TIER_T2_FLOOR_USD and TIER_T3_FLOOR_USD; when supplied it overrides the derivation and the adder follows the supplied tier."

  - method: GET
    path: "/hedge-positions/{id}"
    roles: [FeedstockTrader, ComplianceOfficer]
    input: []
    output: HedgePosition
    success_status: 200
    side_effects: "None."

  - method: GET
    path: "/hedge-positions"
    roles: [FeedstockTrader, ComplianceOfficer]
    input: ["instrument?", "volatility_tier?", "status?", "limit?", "offset?"]
    output: HedgePosition[]
    success_status: 200
    side_effects: "None. Ordered by created_at ASC."

  - method: POST
    path: "/hedge-positions/{id}/unwinds"
    roles: [FeedstockTrader]
    input: [settlement_price_usd]
    output: HedgePosition
    success_status: 200
    side_effects: "OPEN -> UNWOUND, recording settlement_price_usd and realized_pnl_usd = round((settlement_price_usd - strike_price_usd) * notional_units, 2). Margin is returned: base_margin_usd, volatility_adder_usd and total_margin_usd reset to 0.00 and volatility_tier to T1. Increments position.version."

  # ---- Test-driving clock --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    roles: [PlantOperator, FeedstockTrader, QualityAnalyst, ComplianceOfficer, IndependentVerifier]
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    success_status: 200
    side_effects: "Sets the logical clock used by every temporal rule and by created_at/updated_at. The clock starts at 2026-08-01T00:00:00Z on a fresh process, so a recipe that never calls this endpoint still observes 2026-08-01T00:00:00Z. Time may be moved forward or backward; no business state changes."

# ---------------------------------------------------------------------------
# §1.6 Error Catalog — every code below is reachable through the API surface
# declared in §1.5 by the trigger described in `triggered_by`.
# ---------------------------------------------------------------------------
errors:
  # ---- Authentication / authorization --------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unrecognized identity headers"
    triggered_by: "Call any endpoint without X-User-Role, without X-User-ID, or with a role outside the six declared in §1.7."

  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message: "Role {role} may not call {method} {path}"
    triggered_by: "POST /processing-runs/{id}/starts as QualityAnalyst, or POST /credit-blocks/{id}/verification-decisions as ComplianceOfficer."

  - error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    message: "Supplier {actor_id} may not act on supplier {supplier_id}"
    triggered_by: "POST /suppliers/{id}/traceability-documents as role Supplier with X-User-ID set to a different supplier's id."

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "User {user_id} registered pathway {pathway_id} and may not sign off block {block_id}"
    triggered_by: "POST /credit-blocks/{id}/internal-signoffs as the same ComplianceOfficer X-User-ID that created the pathway."

  # ---- Existence ------------------------------------------------------------
  - error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    message: "Supplier {id} not found"
    triggered_by: "GET /suppliers/{id} with an unknown id, or POST /feedstock-lots citing an unknown supplier_id."

  - error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    message: "Feedstock lot {id} not found"
    triggered_by: "GET /feedstock-lots/{id} with an unknown id, or POST /processing-runs/{id}/allocations citing an unknown lot_id."

  - error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    message: "Hydrotreating unit {id} not found"
    triggered_by: "GET /hydrotreating-units/{id} with an unknown id, or POST /processing-runs citing an unknown unit_id."

  - error_id: ERR_CATALYST_CHARGE_NOT_FOUND
    http_status: 404
    message: "Catalyst charge {id} not found"
    triggered_by: "POST /processing-runs citing an unknown catalyst_charge_id."

  - error_id: ERR_TURNAROUND_WINDOW_NOT_FOUND
    http_status: 404
    message: "Turnaround window {id} not found"
    triggered_by: "POST /turnaround-windows/{id}/approvals with an unknown id."

  - error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    message: "Hydrogen supply contract {id} not found"
    triggered_by: "GET /hydrogen-contracts/{id} with an unknown id."

  - error_id: ERR_NOMINATION_NOT_FOUND
    http_status: 404
    message: "Hydrogen nomination {id} not found"
    triggered_by: "POST /hydrogen-nominations/{id}/cancellations with an unknown id."

  - error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    message: "Processing run {id} not found"
    triggered_by: "GET /processing-runs/{id} with an unknown id, or POST /hydrogen-contracts/{id}/nominations citing an unknown run_id."

  - error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    message: "Feedstock allocation {id} not found"
    triggered_by: "POST /feedstock-allocations/{id}/releases with an unknown id."

  - error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    message: "Product batch {id} not found"
    triggered_by: "GET /product-batches/{id} with an unknown id, or POST /credit-blocks citing an unknown batch_id."

  - error_id: ERR_PATHWAY_NOT_FOUND
    http_status: 404
    message: "Pathway registration {id} not found"
    triggered_by: "GET /pathway-registrations/{id} with an unknown id, or POST /credit-blocks citing an unknown pathway_id."

  - error_id: ERR_CREDIT_BLOCK_NOT_FOUND
    http_status: 404
    message: "Credit block {id} not found"
    triggered_by: "POST /credit-blocks/{id}/retirements with an unknown id."

  - error_id: ERR_HEDGE_POSITION_NOT_FOUND
    http_status: 404
    message: "Hedge position {id} not found"
    triggered_by: "POST /hedge-positions/{id}/unwinds with an unknown id."

  # ---- Request shape --------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    message: "Request body failed validation: {details}"
    triggered_by: "POST /feedstock-lots without mass_mt, POST /hedge-positions with instrument = 'CRUDE_SWAP', or any list endpoint with limit = 0."

  - error_id: ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED
    http_status: 422
    message: "Supplier {supplier_id} does not supply {feedstock_type}"
    triggered_by: "POST /feedstock-lots with a feedstock_type absent from the supplier's feedstock_types list. Evaluated inside the §1.4 priority 6 band, after schema and enum checks."

  # ---- Optimistic concurrency ----------------------------------------------
  - error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    message: "Lot {id} version is {actual}, request carried {expected}"
    triggered_by: "POST /feedstock-lots/{id}/quality-tests with expected_lot_version captured before an intervening test or acceptance bumped the lot."

  - error_id: ERR_STALE_RUN_VERSION
    http_status: 412
    message: "Run {id} version is {actual}, request carried {expected}"
    triggered_by: "POST /processing-runs/{id}/allocations with expected_run_version captured before an earlier allocation bumped the run."

  # ---- State transitions ----------------------------------------------------
  - error_id: ERR_INVALID_SUPPLIER_STATE
    http_status: 409
    message: "Supplier {id} is {state}; transition not allowed"
    triggered_by: "POST /suppliers/{id}/due-diligence-verifications on a SUSPENDED supplier, or POST /suppliers/{id}/suspensions on an already SUSPENDED supplier."

  - error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    message: "Feedstock lot {id} is {state}; transition not allowed"
    triggered_by: "POST /feedstock-lots/{id}/acceptances on a RECEIVED lot, or POST /feedstock-lots/{id}/pretreatments on a TESTED lot."

  - error_id: ERR_INVALID_UNIT_STATE
    http_status: 409
    message: "Hydrotreating unit {id} is {state}; transition not allowed"
    triggered_by: "POST /processing-runs/{id}/starts while the unit is DOWN_TURNAROUND, or POST /turnaround-windows/{id}/starts while the unit is RUNNING."

  - error_id: ERR_INVALID_WINDOW_STATE
    http_status: 409
    message: "Turnaround window {id} is {state}; transition not allowed"
    triggered_by: "POST /turnaround-windows/{id}/starts on a PLANNED window, or POST /turnaround-windows/{id}/cancellations on a COMPLETED window."

  - error_id: ERR_INVALID_NOMINATION_STATE
    http_status: 409
    message: "Hydrogen nomination {id} is already CANCELLED"
    triggered_by: "POST /hydrogen-nominations/{id}/cancellations twice on the same nomination."

  - error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    message: "Processing run {id} is {state}; transition not allowed"
    triggered_by: "POST /processing-runs/{id}/allocations on a RUNNING run, POST /processing-runs/{id}/starts on a PLANNED run, or POST /processing-runs/{id}/reconciliations on a RUNNING run."

  - error_id: ERR_INVALID_ALLOCATION_STATE
    http_status: 409
    message: "Feedstock allocation {id} is {state}; release not allowed"
    triggered_by: "POST /feedstock-allocations/{id}/releases on a CONSUMED allocation (after the run started) or on an already RELEASED one."

  - error_id: ERR_INVALID_BATCH_CERT_STATE
    http_status: 409
    message: "Product batch {id} certification status is {state}; transition not allowed"
    triggered_by: "POST /product-batches/{id}/certification-decisions on an UNCERTIFIED batch, or POST /product-batches/{id}/certification-requests on a CERTIFIED batch."

  - error_id: ERR_INVALID_BATCH_DISTRIBUTION_STATE
    http_status: 409
    message: "Product batch {id} distribution status is {state}; transition not allowed"
    triggered_by: "POST /product-batches/{id}/shipments on an IN_TANK batch, or POST /product-batches/{id}/reservations on a SHIPPED batch."

  - error_id: ERR_INVALID_PATHWAY_STATE
    http_status: 409
    message: "Pathway registration {id} is {state}; transition not allowed"
    triggered_by: "POST /pathway-registrations/{id}/review-starts on a DRAFT pathway, or POST /pathway-registrations/{id}/submissions on a DENIED pathway."

  - error_id: ERR_INVALID_CREDIT_BLOCK_STATE
    http_status: 409
    message: "Credit block {id} is {state}; transition not allowed"
    triggered_by: "POST /credit-blocks/{id}/verification-submissions on a DRAFT block, or POST /credit-blocks/{id}/retirements on a BLOCKED block."

  - error_id: ERR_INVALID_HEDGE_STATE
    http_status: 409
    message: "Hedge position {id} is already UNWOUND"
    triggered_by: "POST /hedge-positions/{id}/unwinds twice on the same position."

  # ---- Supplier due diligence & traceability --------------------------------
  - error_id: ERR_SUPPLIER_DUE_DILIGENCE_INCOMPLETE
    http_status: 409
    message: "Supplier {supplier_id} due diligence is {dd_status}"
    triggered_by: "POST /processing-runs/{id}/allocations citing a lot from a PENDING or SUSPENDED supplier."

  - error_id: ERR_SUPPLIER_DUE_DILIGENCE_EXPIRED
    http_status: 409
    message: "Supplier {supplier_id} due diligence expired at {dd_expires_at}"
    triggered_by: "Advance the clock past dd_expires_at with POST /_clock/set_current_utc, then POST /processing-runs/{id}/allocations citing that supplier's lot."

  - error_id: ERR_DUPLICATE_DOCUMENT
    http_status: 409
    message: "Document conflict: {conflict}"
    triggered_by: "POST /suppliers/{id}/traceability-documents twice with the same doc_type, or with a doc_hash already recorded for another supplier."

  - error_id: ERR_DUE_DILIGENCE_DOCS_INSUFFICIENT
    http_status: 409
    message: "Supplier {supplier_id} has {count} valid document types; {required} required"
    triggered_by: "POST /suppliers/{id}/due-diligence-verifications on a supplier with only one document type, or on a high-risk-origin supplier holding three types none of which is THIRD_PARTY_AUDIT."

  - error_id: ERR_NO_VERIFIED_SUPPLIER
    http_status: 409
    message: "No verified supplier of {feedstock_type} exists"
    triggered_by: "POST /pathway-registrations/{id}/submissions for a feedstock_type whose only suppliers are PENDING, SUSPENDED, or expired."

  # ---- Feedstock quality, mass, and pretreatment ----------------------------
  - error_id: ERR_PRETREATMENT_REQUIRED
    http_status: 409
    message: "Lot {lot_id} requires {tier} pretreatment before charging"
    triggered_by: "POST /processing-runs/{id}/allocations citing a lot whose governing quality test returned disposition PRETREAT (status PRETREAT_REQUIRED)."

  - error_id: ERR_LOT_NOT_ACCEPTED
    http_status: 409
    message: "Lot {lot_id} is {state} and has not been accepted"
    triggered_by: "POST /processing-runs/{id}/allocations citing an untested (RECEIVED), tested-but-unaccepted (TESTED), REJECTED, CHARGED or QUARANTINED lot."

  - error_id: ERR_PRETREATMENT_MASS_EXCEEDED
    http_status: 422
    message: "Pretreatment output {output_mass_mt} exceeds source mass {mass_mt}"
    triggered_by: "POST /feedstock-lots/{id}/pretreatments with output_mass_mt greater than the source lot's mass_mt, or with zero."

  - error_id: ERR_LOT_MASS_EXCEEDED
    http_status: 409
    message: "Lot {lot_id} has {remaining_mass_mt} MT remaining; {mass_mt} requested"
    triggered_by: "POST /processing-runs/{id}/allocations for more mass than lot.remaining_mass_mt, including a second allocation that overdraws the leftover."

  # ---- Catalyst, unit capacity, and windows ---------------------------------
  - error_id: ERR_CATALYST_NOT_ACTIVE
    http_status: 409
    message: "Catalyst charge {charge_id} is {state}"
    triggered_by: "POST /processing-runs citing a REMOVED charge, or POST /processing-runs/{id}/starts after the cited charge decayed to SPENT."

  - error_id: ERR_CATALYST_CHANGE_OUTSIDE_WINDOW
    http_status: 409
    message: "installed_at {installed_at} is not inside an approved CATALYST_CHANGE window on unit {unit_id}"
    triggered_by: "POST /hydrotreating-units/{id}/catalyst-charges with installed_at outside every APPROVED or IN_PROGRESS CATALYST_CHANGE window, or exactly at such a window's end_at (the interval is half-open)."

  - error_id: ERR_TURNAROUND_BUFFER_VIOLATION
    http_status: 409
    message: "Window [{start_at}, {end_at}) is within {buffer_hours} hours of window {other_id}"
    triggered_by: "POST /hydrotreating-units/{id}/turnaround-windows with a start_at exactly at an existing window's end_at (zero hours of clearance) or anywhere inside the 72-hour buffer on either side."

  - error_id: ERR_UNIT_WINDOW_CONFLICT
    http_status: 409
    message: "Run window [{window_start}, {window_end}) intersects {conflict_kind} {conflict_id} on unit {unit_id}"
    triggered_by: "POST /processing-runs whose half-open window overlaps another PLANNED/HYDROGEN_SECURED/RUNNING run or a PLANNED/APPROVED/IN_PROGRESS turnaround window on the same unit."

  - error_id: ERR_INVALID_RUN_WINDOW
    http_status: 422
    message: "Run window must be whole midnight-aligned days"
    triggered_by: "POST /processing-runs with window_start at 06:00:00Z, or with window_end equal to window_start."

  - error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    http_status: 409
    message: "Run {run_id} window ends at {window_end}; clock is {now}"
    triggered_by: "POST /processing-runs/{id}/completions before advancing the clock to window_end."

  - error_id: ERR_UNIT_CAPACITY_EXCEEDED
    http_status: 409
    message: "Daily feed {daily_rate} MT/day exceeds nameplate {nameplate_capacity_mt_per_day}"
    triggered_by: "POST /processing-runs/{id}/hydrogen-securements after reserving more mass than run_days times the unit's nameplate."

  - error_id: ERR_SAF_SHARE_EXCEEDED
    http_status: 422
    message: "SAF share {saf_share_pct} exceeds unit maximum {max_saf_share_pct}"
    triggered_by: "POST /processing-runs with target_saf_share_pct above the unit's max_saf_share_pct, or POST /processing-runs/{id}/completions with a measured SAF share above it."

  - error_id: ERR_NO_FEEDSTOCK_ALLOCATED
    http_status: 409
    message: "Run {id} has no reserved feedstock allocation"
    triggered_by: "POST /processing-runs/{id}/hydrogen-securements on a run whose allocations are all absent or RELEASED (checked at §1.4 priority 30, ahead of the MIN_CHARGE_MT threshold)."

  - error_id: ERR_MIN_CHARGE_NOT_MET
    http_status: 409
    message: "Run {id} has {reserved_mass_mt} MT reserved against a minimum charge of {min_charge_mt} MT"
    triggered_by: "POST /processing-runs/{id}/hydrogen-securements on a run holding a single allocation of 99.999 MT against MIN_CHARGE_MT of 100.0."

  - error_id: ERR_MASS_BALANCE_VIOLATION
    http_status: 422
    message: "Measured product {measured_total_mt} MT exceeds consumed feedstock {consumed_mass_mt} MT"
    triggered_by: "POST /processing-runs/{id}/completions reporting measured_rd_mt + measured_saf_mt above the run's consumed_mass_mt."

  # ---- Hydrogen supply -------------------------------------------------------
  - error_id: ERR_NOMINATION_OUTSIDE_CONTRACT_WINDOW
    http_status: 422
    message: "Nomination [{start_at}, {end_at}] falls outside contract window [{window_start}, {window_end}]"
    triggered_by: "POST /hydrogen-contracts/{id}/nominations with start_at one day before the contract's window_start, or end_at before start_at."

  - error_id: ERR_HYDROGEN_CAPACITY_EXCEEDED
    http_status: 409
    message: "Day {day} committed {committed} kg plus {kg_per_day} kg exceeds capacity {daily_capacity_kg}"
    triggered_by: "POST /hydrogen-contracts/{id}/nominations for a day range that already carries commitments, where one shared day would exceed daily_capacity_kg."

  - error_id: ERR_HYDROGEN_COVERAGE_SHORTFALL
    http_status: 409
    message: "Day {day} is covered by {covered} kg against required {required_h2_kg_per_day} kg"
    triggered_by: "POST /processing-runs/{id}/hydrogen-securements when a nomination covers only part of the run window, or covers every day at a kg_per_day below the requirement."

  # ---- Certification and distribution ---------------------------------------
  - error_id: ERR_SAF_SPEC_OUT_OF_RANGE
    http_status: 422
    message: "SAF freeze point {freeze_point_c} C exceeds the {limit} C maximum"
    triggered_by: "POST /product-batches/{id}/certification-decisions with decision CERTIFY on a SAF batch whose recorded freeze_point_c is -39.9 (a warmer value than the -40.0 limit)."

  - error_id: ERR_SAF_CERTIFICATION_REQUIRED
    http_status: 409
    message: "SAF batch {batch_id} is {cert_status} and cannot ship"
    triggered_by: "POST /product-batches/{id}/shipments on a RESERVED SAF batch that is UNCERTIFIED or CERT_REJECTED."

  # ---- Pathway and credit accounting ----------------------------------------
  - error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    message: "Pathway {pathway_id} has exhausted its {max_rounds} revision rounds"
    triggered_by: "Cycle SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED three times, then POST /pathway-registrations/{id}/submissions a fourth time."

  - error_id: ERR_PATHWAY_SCOPE_MISMATCH
    http_status: 409
    message: "Pathway {pathway_id} covers unit {pathway_unit_id}/{pathway_feedstock_type}; batch came from unit {run_unit_id}/{run_feedstock_type}"
    triggered_by: "POST /credit-blocks pairing a batch with a REGISTERED pathway belonging to another unit, or to a different feedstock type than the run's dominant consumed feedstock."

  - error_id: ERR_BATCH_NOT_SHIPPED
    http_status: 409
    message: "Product batch {batch_id} distribution status is {distribution_status}"
    triggered_by: "POST /credit-blocks for a batch still IN_TANK or RESERVED."

  - error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 409
    message: "Block {block_id} has {available} MTCO2e available; {credits} requested"
    triggered_by: "POST /credit-blocks/{id}/retirements for more than verified_credits_mtco2e minus retired_credits_mtco2e, or for zero credits."

  - error_id: ERR_NOTHING_TO_REVERSE
    http_status: 409
    message: "Block {block_id} has no retired credits to reverse"
    triggered_by: "POST /credit-blocks/{id}/retirement-reversals on a VERIFIED block that has never been retired."

  # ---- Hedging ---------------------------------------------------------------
  - error_id: ERR_MATURITY_IN_PAST
    http_status: 422
    message: "maturity_at {maturity_at} is not after the current clock {now}"
    triggered_by: "POST /hedge-positions with maturity_at equal to the current logical clock."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — six roles, segregation of duties between the compliance
# desk that registers pathways and the verifier that certifies output.
# ---------------------------------------------------------------------------
roles:
  - role: PlantOperator
    identity: opaque
    description: "Runs the plant floor: units, catalyst charges, turnaround windows, hydrogen nominations, and the whole ProcessingRun lifecycle up to completion. Cannot touch feedstock commercial terms, quality dispositions, certification, pathways, or credits."
    can:
      - "POST /hydrotreating-units and all catalyst-charge and turnaround-window endpoints"
      - "POST /hydrogen-contracts/{id}/nominations, POST /hydrogen-nominations/{id}/cancellations"
      - "POST /processing-runs and its securement, start, completion and abort transitions"
      - "read units, runs, lots, batches, contracts and nominations"
      - "POST /_clock/set_current_utc"
    cannot:
      - "POST /suppliers or POST /feedstock-lots (commercial)"
      - "POST /feedstock-lots/{id}/quality-tests, /pretreatments, /acceptances (quality)"
      - "POST /processing-runs/{id}/allocations (trading desk owns the charge composition)"
      - "POST /processing-runs/{id}/reconciliations (accounting closes the run)"
      - "anything under /pathway-registrations, /credit-blocks, /hedge-positions"

  - role: FeedstockTrader
    identity: opaque
    description: "The buying desk: onboards suppliers, books lots, allocates and releases feedstock against runs, buys hydrogen contracts, and manages hedges. Never adjudicates quality and never signs compliance paperwork."
    can:
      - "POST /suppliers, POST /suppliers/{id}/traceability-documents, POST /feedstock-lots"
      - "POST /processing-runs/{id}/allocations, POST /feedstock-allocations/{id}/releases"
      - "POST /hydrogen-contracts, all /hedge-positions endpoints"
      - "read suppliers, lots, allocations, runs, contracts and hedge positions"
      - "POST /_clock/set_current_utc"
    cannot:
      - "POST /suppliers/{id}/due-diligence-verifications or /suspensions (compliance decides)"
      - "POST /feedstock-lots/{id}/quality-tests, /pretreatments, /acceptances"
      - "any run state transition, any certification, pathway or credit endpoint"

  - role: QualityAnalyst
    identity: opaque
    description: "The lab: samples lots, records FFA, moisture, insolubles and phosphorus, orders pretreatment, and accepts lots for charging. Holds the OCC-guarded write on FeedstockLot."
    can:
      - "POST /feedstock-lots/{id}/quality-tests, /pretreatments, /acceptances"
      - "read lots, quality tests and suppliers"
      - "POST /_clock/set_current_utc"
    cannot:
      - "POST /feedstock-lots or POST /suppliers"
      - "POST /processing-runs/{id}/allocations or any run transition"
      - "any certification, pathway, credit or hedging endpoint"

  - role: ComplianceOfficer
    identity: opaque
    description: "The compliance and accounting desk: verifies and suspends suppliers, reconciles runs, requests certification, moves product to offtakers, registers pathways, mints credit blocks, signs them off internally, and retires credits. Subject to segregation of duties: the officer whose X-User-ID registered a pathway may not internally sign off a credit block on that pathway (§1.4 priority 19)."
    can:
      - "POST /suppliers/{id}/due-diligence-verifications, POST /suppliers/{id}/suspensions"
      - "POST /processing-runs/{id}/reconciliations"
      - "POST /product-batches/{id}/certification-requests, /reservations, /reservation-releases, /shipments"
      - "POST /pathway-registrations and /submissions"
      - "POST /credit-blocks, /internal-signoffs, /verification-submissions, /retirements, /retirement-reversals"
      - "read every entity except quality-test detail is shared with the lab"
      - "POST /_clock/set_current_utc"
    cannot:
      - "POST /product-batches/{id}/certification-decisions (the verifier certifies)"
      - "POST /pathway-registrations/{id}/review-starts or /review-decisions"
      - "POST /credit-blocks/{id}/verification-decisions"
      - "POST /credit-blocks/{id}/internal-signoffs on a pathway it registered itself"
      - "any plant-floor or trading endpoint"

  - role: IndependentVerifier
    identity: opaque
    description: "The third-party verification body: reviews pathway registrations, certifies product batches against ASTM specification, and confirms, adjusts or rejects credit blocks. Read-only everywhere else and never creates business objects."
    can:
      - "POST /pathway-registrations/{id}/review-starts and /review-decisions"
      - "POST /product-batches/{id}/certification-decisions"
      - "POST /credit-blocks/{id}/verification-decisions"
      - "read pathway registrations, credit blocks and product batches"
    cannot:
      - "POST /credit-blocks or /internal-signoffs or /retirements"
      - "POST /pathway-registrations or /submissions"
      - "anything under /suppliers, /feedstock-lots, /processing-runs, /hedge-positions"

  - role: Supplier
    identity: "entity_backed:Supplier"
    description: "An external feedstock supplier authenticated as its own Supplier row: X-User-ID is the supplier id. May upload its own traceability documents and read its own record and documents, nothing else. Cross-supplier access is refused by §1.4 priority 5 before existence checks on nested resources."
    can:
      - "POST /suppliers/{id}/traceability-documents where {id} == X-User-ID"
      - "GET /suppliers/{id} and GET /suppliers/{id}/traceability-documents for itself"
    cannot:
      - "read or write another supplier's record or documents"
      - "POST /feedstock-lots or any quality, plant, certification, pathway, credit or hedging endpoint"
      - "POST /_clock/set_current_utc"
