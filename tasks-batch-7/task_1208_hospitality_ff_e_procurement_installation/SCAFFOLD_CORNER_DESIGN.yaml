        claim_type: conditional_validation
        grounds: [calculations.procurement_posture_derivation, "errors[ERR_PROJECT_BUDGET_FROZEN]"]
        distinguishing_aspect: "Committed 120000c > total_budget 100000c derives posture FROZEN; the next line add is rejected with ERR_PROJECT_BUDGET_FROZEN even though the category budget line (200000c) would have had headroom."
        test_recipe:
          setup:
            - "Project total_budget 100000c in PROCUREMENT; FURNITURE budget line budgeted 200000c"
            - "Spec1 (2 total x 60000c) and spec2 (1 x 1000c) both approved and awarded to VENDA while posture is OPEN"
            - "PO VENDA with line1 2 x 60000c = 120000c committed -> committed (120000) > total (100000)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-V4", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
