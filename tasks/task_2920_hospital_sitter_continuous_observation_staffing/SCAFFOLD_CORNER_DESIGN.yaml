              as: StaffingCoordinator
              captures: { osa: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u47}", full_name: "Owner Sitter B", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { osb: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u47}", full_name: "Owner Observer One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2200, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { oo1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u47}", full_name: "Owner Observer Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2200, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { oo2: $.data.id }
            - call: "POST /observation/orders"
