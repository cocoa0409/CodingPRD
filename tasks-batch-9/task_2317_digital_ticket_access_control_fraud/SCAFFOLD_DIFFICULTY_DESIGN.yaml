      - name: settlement_pool_plus_patron_credits_is_conserved_by_remediation
        grounds:
          - calculations.denied_entry_remediation_credit
          - validations[priority=36]
          - entities.Event.fields.settlement_pool_cents
          - entities.Patron.fields.remediation_credit_cents
          - state_machines.DeniedEntryIncident.UNDER_REVIEW_to_REMEDIATED
          - errors.ERR_SETTLEMENT_POOL_INSUFFICIENT
        distinguishing_aspect: |
          Remediation moves money, it does not create it: the sum
          Event.settlement_pool_cents + every Patron.remediation_credit_cents must be
          invariant at 26000 across the payout. The credit is 15600 (base 14000, tier 0.15
          because the tier is keyed on the base BEFORE goodwill, goodwill 2100, one strike
          penalty 500), so the pool must land on exactly 10400. The strike itself is NOT
          compensated away — it stays at 1 and keeps the adjudicated score at 23.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1 (fire_code_capacity 200); Gate G1; ONLINE ScanSession open at 2026-09-12T18:10:00Z."
            - "Ada verified with a PAID 14000-cent ticket bound to DEV-ADA; Ben verified with a PAID 12000-cent ticket; Event.settlement_pool_cents == 26000."
            - "A device-mismatch scan on Ada's ticket opened one incident, which is then moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 14000 }
              as: BoxOfficeAgent
