            - "after revocation, terminate succeeds and agreement_status == TERMINATED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_error_shape
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every error response carries meta.api_request_id, meta.api_request_timestamp, response_type error, and data.error_id + data.message."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /research/fund-companies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ResearchOps
              captures: { e_env: $.data.error_id }
          assert:
            - "response_type == error and e_env == ERR_NOT_FOUND"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "data.message is a non-empty string"

      - name: occ_stale_version_on_seat_grant
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[seat-grant-stale-agreement]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A seat grant carrying an expected_agreement_version captured BEFORE another grant succeeded is rejected with 412 ERR_STALE_VERSION; each successful grant increments LicenseAgreement.version by 1."
        test_recipe:
          setup:
            - "Licensee LOCC ACTIVE; agreement AGOCC (seat_limit 5) ACTIVE; client captured version V0."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/licensees"
              payload: { licensee_name: "OCC Seats" }
              as: LicenseAdmin
              captures: { locc_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${locc_id}", tier: "DISPLAY", seat_limit: 5, effective_from: "2026-01-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { agocc_id: $.data.id }
            - call: "POST /research/license-agreements/${agocc_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "GET /research/license-agreements/${agocc_id}"
              payload: {}
              as: LicenseAdmin
              captures: { agocc_v0: $.data.version }
          trigger:
            - call: "POST /research/license-agreements/${agocc_id}/seats"
              payload: { workstation_user_id: "occ-1", expected_agreement_version: "${agocc_v0}" }
              as: LicenseAdmin
            - call: "POST /research/license-agreements/${agocc_id}/seats"
              payload: { workstation_user_id: "occ-2", expected_agreement_version: "${agocc_v0}" }
              as: LicenseAdmin
              captures: { e_occ: $.data.error_id }
          assert:
            - "first grant succeeds (201) and advances LicenseAgreement.version"
            - "second grant with the same stale expected_agreement_version fails with 412 and e_occ == ERR_STALE_VERSION"
            - "LicenseAgreement.${agocc_id}.seats_in_use == 1"

      - name: occ_stale_version_on_methodology_change_proposal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[methodology-change-stale-methodology]
        distinguishing_aspect: "A second change proposal carrying the pre-first-proposal methodology version fails with 412; the version moved because proposing a change increments Methodology.version."
        test_recipe:
          setup:
            - "Methodology MOCC EFFECTIVE; client captured version MV0."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/methodologies"
              payload: { methodology_code: "MOCC", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { mocc_id: $.data.id }
            - call: "POST /research/methodologies/${mocc_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "GET /research/methodologies/${mocc_id}"
              payload: {}
              as: ResearchOps
              captures: { mocc_v0: $.data.version }
          trigger:
            - call: "POST /research/methodologies/${mocc_id}/changes"
              payload: { restatement_required: false, effective_date: "2026-09-01", expected_methodology_version: "${mocc_v0}" }
              as: ResearchOps
            - call: "POST /research/methodologies/${mocc_id}/changes"
              payload: { restatement_required: false, effective_date: "2026-09-01", expected_methodology_version: "${mocc_v0}" }
              as: ResearchOps
              captures: { e_mocc: $.data.error_id }
          assert:
            - "first proposal succeeds (201)"
            - "second proposal with the stale version fails with 412 and e_mocc == ERR_STALE_VERSION"

      - name: fee_quote_endpoint_is_side_effect_free
        claim_type: Computed read
        grounds:
          - endpoints.POST_/research/license-agreements/fee-quote
          - calculations.license_fee_quote
        distinguishing_aspect: "fee-quote persists nothing: repeated calls return identical values and no LicenseAgreement row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /research/license-agreements/fee-quote"
              payload: { tier: "REDISTRIBUTION", seat_limit: 51, base_fee_cents: 500000 }
              as: LicenseAdmin
              captures: { fq1: $.data.total_fee_cents }
            - call: "POST /research/license-agreements/fee-quote"
              payload: { tier: "REDISTRIBUTION", seat_limit: 51, base_fee_cents: 500000 }
              as: LicenseAdmin
              captures: { fq2: $.data.total_fee_cents }
          assert:
            - "fq1 == fq2 == 10700000 (250000*51=12750000, -20% = 10200000, +500000 = 10700000, no surcharge)"
            - "GET /research/licensees shows no side effects; no agreement rows exist for the quoted inputs"

