  # ===================================================================
  # RULE 8 — Resource/temporal overlap (different interval semantics,
  #          different resource entities)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: retread_line_half_open_slots_with_asymmetric_cooldown_buffer
        grounds:
          - calculations.retread_slot_feasibility
          - entities.RetreadLine.fields.cure_cooldown_minutes
          - errors.ERR_RETREAD_SLOT_CONFLICT
          - endpoints.POST_/retread-jobs
        distinguishing_aspect: |
          RESOURCE: RetreadLine. INTERVAL SEMANTICS: HALF-OPEN TIMESTAMP intervals where the
          buffer is ASYMMETRIC — the incumbent occupies [start, end + cooldown) but the
          candidate occupies only [start, end). Consequence: a candidate that ends exactly at
          the incumbent's start is accepted (its own cooldown lands inside the incumbent, and
          is deliberately not considered), while a candidate contained inside the incumbent's
          buffered span is rejected. The same rejected interval on a second line is accepted,
          proving the resource is the line and not the plant.
        test_recipe:
          setup:
            - "two lines at the same plant, both with cure_cooldown_minutes 30"
            - "line A carries one SCHEDULED job across 2026-09-01T08:00..12:00Z, so it occupies [08:00, 12:30)"
            - "three casings collected and graded A so each candidate has an eligible casing"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Interval Plant", location_code: "IVP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-2626", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
