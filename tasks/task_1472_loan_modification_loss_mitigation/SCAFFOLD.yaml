scenario: |
  Loan Modification & Loss Mitigation Servicing (mortgage servicer loss mitigation): borrower application & complete-package determination, evaluation waterfall across program options, income/hardship verification & affordability calculation (target payment ratio), trial payment plan & performance tracking, permanent modification documentation & recording, denial notice & appeal rights, dual-tracking prohibition compliance, escrow re-analysis after modification

domain_name: loan-modification-loss-mitigation
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Borrower legal full name" }
      - { name: email, type: string, source: input, description: "Borrower contact email" }
      - { name: mailing_address, type: string, source: input, default: null, description: "Mailing address for notices" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value; borrower deactivation is out of scope)" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; borrower who owns this loan" }
      - { name: loan_number, type: string, source: input, description: "Servicer loan number; unique" }
      - { name: property_state_code, type: string, source: input, description: "Two-letter state code of the secured property" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "UPB at boarding; later mutated by modification record/rescind and by trial-suspense overflow" }
      - { name: interest_rate_bp, type: integer, source: input, description: "Annual note rate in basis points; later mutated by modification record/rescind" }
      - { name: remaining_term_months, type: integer, source: input, description: "Remaining term in months; later mutated by modification record/rescind" }
      - { name: arrears_cents, type: integer, source: input, default: 0, description: "Accrued delinquent arrears (P&I + escrow + fees) at boarding; reduced by trial-suspense application; zeroed by capitalization at modification record; restored on rescind" }
      - { name: suspense_cents, type: integer, source: system, default: 0, description: "Unapplied trial payments held in suspense; applied to arrears (overflow to principal) when a trial plan reaches a terminal COMPLETED/FAILED state" }
      - { name: deferred_principal_cents, type: integer, source: system, default: 0, description: "Non-interest-bearing forborne principal created by modification record; reset to 0 on rescind" }
      - { name: escrow_balance_cents, type: integer, source: input, default: 0, description: "Current escrow account balance; mutated by escrow analysis apply/void" }
      - { name: escrow_monthly_cents, type: integer, source: input, default: 0, description: "Current monthly escrow collection; recomputed by escrow analysis apply" }
      - { name: current_pi_cents, type: integer, source: computed, description: "Amortized monthly P&I from unpaid_principal_balance_cents, interest_rate_bp, remaining_term_months (standard annuity, round-half-up cents)" }
      - { name: delinquency_days, type: integer, source: input, default: 0, description: "Days delinquent at boarding; static thereafter (fixture input)" }
      - { name: workout_status, type: enum, source: system, description: "PERFORMING | DELINQUENT | LOSS_MIT_REVIEW | TRIAL | MOD_PENDING | PERMANENTLY_MODIFIED; initial DELINQUENT when delinquency_days > 0 else PERFORMING" }
      - { name: foreclosure_status, type: enum, source: computed, description: "NONE | REFERRED | SALE_SCHEDULED | SALE_HOLD | SALE_COMPLETED; mirror of the loan's latest non-CANCELLED ForeclosureCase status, NONE when no active case" }

  - name: LossMitApplication
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan this application seeks relief for" }
      - { name: hardship_type, type: enum, source: input, description: "UNEMPLOYMENT | INCOME_REDUCTION | MEDICAL | DIVORCE | DISASTER | OTHER" }
      - { name: stated_monthly_income_cents, type: integer, source: input, description: "Borrower-stated gross monthly income (provisional affordability basis)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACKNOWLEDGED | COMPLETE_PACKAGE | EVALUATED_OFFER | EVALUATED_DENIAL | APPEAL_REVIEW | TRIAL_ACTIVE | TRIAL_PASSED | APPROVED | CLOSED_DENIED | WITHDRAWN" }
      - { name: verified_monthly_income_cents, type: integer, source: computed, default: 0, description: "Verified gross monthly income per verified_gross_monthly_income; recomputed on every document accept/supersede" }
      - { name: outstanding_doc_categories, type: array, source: computed, description: "Subset of {INCOME_PROOF, HARDSHIP_AFFIDAVIT, BANK_STATEMENT} lacking an ACCEPTED non-SUPERSEDED document" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Timestamp when the package FIRST became complete; never cleared once set (anchors 37-day / 90-day rules)" }
      - { name: acknowledgement_due_at, type: datetime, source: computed, description: "created_at + ACK_SLA_DAYS (5 days)" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Set on acknowledge transition" }
      - { name: evaluation_deadline, type: datetime, source: computed, default: null, description: "completed_at + EVAL_SLA_DAYS (30 days)" }
      - { name: active_evaluation_id, type: string, source: system, default: null, description: "FK -> WaterfallEvaluation.id; most recent non-SUPERSEDED evaluation, null when none" }
      - { name: superseded_by_application_id, type: string, source: system, default: null, description: "FK -> LossMitApplication.id; set on the auto-WITHDRAWN application when a newer application supersedes it" }

  - name: PackageDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> LossMitApplication.id" }
      - { name: doc_type, type: enum, source: input, description: "PAYSTUB | TAX_RETURN | PROFIT_LOSS | BANK_STATEMENT | HARDSHIP_AFFIDAVIT" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: gross_per_period_cents, type: integer, source: input, default: null, description: "PAYSTUB: gross pay per pay period" }
      - { name: pay_frequency, type: enum, source: input, default: null, description: "PAYSTUB: WEEKLY | BIWEEKLY | SEMIMONTHLY | MONTHLY" }
      - { name: pay_period_end_date, type: string, source: input, default: null, description: "PAYSTUB: ISO date of pay period end; selects the income-winning paystub" }
      - { name: annual_gross_cents, type: integer, source: input, default: null, description: "TAX_RETURN: annual gross income" }
      - { name: ytd_net_income_cents, type: integer, source: input, default: null, description: "PROFIT_LOSS: year-to-date net self-employment income" }
      - { name: ytd_months, type: integer, source: input, default: null, description: "PROFIT_LOSS: months covered by the P&L statement" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required on reject" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }

  - name: ProgramOption
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Program code; unique (e.g., STD_MOD)" }
      - { name: waterfall_rank, type: integer, source: input, description: "Evaluation order; unique across all ProgramOptions (ERR_PROGRAM_RANK_DUPLICATE)" }
      - { name: target_dti_bp, type: integer, source: input, description: "Target front-end payment-to-income ratio in basis points (e.g., 3100 = 31%)" }
      - { name: rate_floor_bp, type: integer, source: input, description: "Lowest rate the waterfall may set" }
      - { name: rate_step_bp, type: integer, source: input, description: "Rate reduction increment per waterfall step" }
      - { name: max_term_months, type: integer, source: input, description: "Maximum extended term" }
      - { name: max_forbearance_pct_bp, type: integer, source: input, description: "Max principal forbearance as basis points of the capitalized base" }
      - { name: min_delinquency_days, type: integer, source: input, description: "Eligibility band lower bound, inclusive" }
      - { name: max_delinquency_days, type: integer, source: input, description: "Eligibility band upper bound, inclusive" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; only ACTIVE programs are waterfall candidates" }

  - name: WaterfallEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> LossMitApplication.id" }
      - { name: underwriter_user_id, type: string, source: system, description: "X-User-ID of the Underwriter who ran the evaluation; 'system' when cascade-generated" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp of the evaluation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED (a newer evaluation for the same application supersedes)" }
      - { name: result, type: enum, source: system, description: "OFFER | DENIAL" }
      - { name: selected_program_id, type: string, source: system, default: null, description: "FK -> ProgramOption.id; null on DENIAL" }
      - { name: denial_reasons, type: array, source: system, default: [], description: "Subset of {NO_ELIGIBLE_PROGRAM, TARGET_NOT_ACHIEVABLE, INCOME_UNVERIFIABLE}; non-empty iff DENIAL" }
      - { name: eval_base_cents, type: integer, source: system, default: null, description: "Provisional capitalized base: UPB + arrears at evaluation time" }
      - { name: target_payment_cents, type: integer, source: system, default: null, description: "Target affordable payment used (verified income basis)" }
      - { name: offered_rate_bp, type: integer, source: system, default: null, description: "Provisional modified rate (OFFER only)" }
      - { name: offered_term_months, type: integer, source: system, default: null, description: "Provisional modified term (OFFER only)" }
      - { name: offered_forbearance_cents, type: integer, source: system, default: null, description: "Provisional principal forbearance (OFFER only)" }
      - { name: offered_pi_cents, type: integer, source: system, default: null, description: "Provisional modified monthly P&I (OFFER only)" }

  - name: EvaluationStepResult
    parent: null
    common_fields: false
    fields:
      - { name: evaluation_id, type: string, source: system, description: "FK -> WaterfallEvaluation.id" }
      - { name: program_code, type: string, source: system, description: "Snapshot of ProgramOption.code evaluated at this step (survives program retirement)" }
      - { name: step_rank, type: integer, source: system, description: "Snapshot of ProgramOption.waterfall_rank at evaluation time" }
      - { name: eligible, type: boolean, source: system, description: "Whether the program's eligibility band admitted the loan" }
      - { name: achieved_pi_cents, type: integer, source: system, default: null, description: "Best P&I the waterfall achieved under this program (eligible programs only)" }
      - { name: met_target, type: boolean, source: system, default: null, description: "achieved_pi_cents <= target_payment_cents (eligible programs only)" }
      - { name: selected, type: boolean, source: system, description: "True on exactly one step: the first eligible program that met target (waterfall stops there)" }

  - name: TrialPaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LossMitApplication.id" }
      - { name: evaluation_id, type: string, source: system, description: "FK -> WaterfallEvaluation.id whose OFFER created this plan" }
      - { name: program_code, type: string, source: system, description: "Snapshot of the selected program code" }
      - { name: trial_payment_cents, type: integer, source: computed, description: "offered_pi_cents + escrow_monthly_cents snapshot at offer time" }
      - { name: periods, type: integer, source: system, default: 3, description: "Trial length (TRIAL_PERIODS = 3)" }
      - { name: first_due_date, type: string, source: computed, description: "Plan creation date + TRIAL_INTERVAL_DAYS (30 days)" }
      - { name: offer_deadline, type: datetime, source: computed, description: "Plan creation + OFFER_VALIDITY_DAYS (30 days); acceptance at or before this instant only" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Set on borrower acceptance" }
      - { name: suspense_total_cents, type: integer, source: computed, default: 0, description: "Sum of received_amount_cents over resolved payments" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACTIVE | COMPLETED | FAILED | CANCELLED" }

  - name: TrialPayment
    parent: null
    common_fields: true
    fields:
      - { name: trial_plan_id, type: string, source: system, description: "FK -> TrialPaymentPlan.id" }
      - { name: period_index, type: integer, source: system, description: "1..3" }
      - { name: due_date, type: string, source: computed, description: "first_due_date + (period_index - 1) * TRIAL_INTERVAL_DAYS" }
      - { name: scheduled_amount_cents, type: integer, source: computed, description: "Equals plan.trial_payment_cents" }
      - { name: received_amount_cents, type: integer, source: system, default: null, description: "Amount actually received" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of receipt" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAID_ON_TIME | PAID_LATE | PAID_INSUFFICIENT | MISSED" }

  - name: PermanentModification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LossMitApplication.id" }
      - { name: trial_plan_id, type: string, source: input, description: "FK -> TrialPaymentPlan.id; must be COMPLETED" }
      - { name: final_base_cents, type: integer, source: computed, description: "UPB + arrears at creation (final variant base; arrears already reduced by trial suspense)" }
      - { name: final_rate_bp, type: integer, source: computed, description: "Final modified rate per waterfall_modified_payment final variant" }
      - { name: final_term_months, type: integer, source: computed, description: "Final modified term" }
      - { name: final_forbearance_cents, type: integer, source: computed, description: "Final principal forbearance (becomes Loan.deferred_principal_cents at record)" }
      - { name: final_pi_cents, type: integer, source: computed, description: "Final modified monthly P&I" }
      - { name: capitalized_arrears_cents, type: integer, source: computed, description: "Arrears folded into the base at record" }
      - { name: prior_terms_snapshot, type: object, source: system, description: "{upb_cents, rate_bp, term_months, arrears_cents} captured at record; restored on rescind" }
      - { name: status, type: enum, source: system, description: "DRAFT | DOCS_SENT | SIGNED | RECORDED | RESCINDED" }
      - { name: recorded_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of recording" }
      - { name: rescission_deadline, type: datetime, source: computed, default: null, description: "recorded_at + RESCISSION_WINDOW_DAYS (3 days), inclusive" }

  - name: DenialNotice
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LossMitApplication.id" }
      - { name: evaluation_id, type: string, source: system, default: null, description: "FK -> WaterfallEvaluation.id; null when cascade-issued (trial failure)" }
      - { name: underwriter_user_id, type: string, source: system, description: "Underwriter who issued the denial; 'system' for trial-failure notices" }
      - { name: reasons, type: array, source: system, description: "Denial reason codes (NO_ELIGIBLE_PROGRAM | TARGET_NOT_ACHIEVABLE | INCOME_UNVERIFIABLE | TRIAL_PLAN_FAILED)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issuance timestamp" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "issued_at + APPEAL_WINDOW_DAYS (14 days), inclusive" }
      - { name: appeal_eligible, type: boolean, source: computed, description: "True iff no SALE_SCHEDULED/SALE_HOLD foreclosure case exists for the loan, or application.completed_at <= sale_date - APPEAL_ELIGIBILITY_MIN_DAYS (90 days)" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPEALED | SUPERSEDED | AFFIRMED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: denial_notice_id, type: string, source: input, description: "FK -> DenialNotice.id" }
      - { name: grounds, type: string, source: input, description: "Borrower statement of appeal grounds" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock submission timestamp" }
      - { name: reviewer_user_id, type: string, source: system, default: null, description: "X-User-ID of the deciding AppealReviewer" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Set on decision" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AFFIRMED | OVERTURNED" }

  - name: ForeclosureCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: county, type: string, source: input, description: "County of jurisdiction" }
      - { name: docket_number, type: string, source: input, description: "Court docket number" }
      - { name: referred_at, type: datetime, source: system, description: "Logical-clock referral timestamp" }
      - { name: sale_date, type: string, source: input, default: null, description: "Scheduled foreclosure sale date (ISO date)" }
      - { name: status, type: enum, source: system, description: "REFERRED | SALE_SCHEDULED | SALE_HOLD | SALE_COMPLETED | CANCELLED" }

  - name: EscrowAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: modification_id, type: string, source: system, default: null, description: "FK -> PermanentModification.id; set on the auto-created POST_MODIFICATION analysis, null otherwise" }
      - { name: analysis_type, type: enum, source: input, description: "STANDARD_ANNUAL | POST_MODIFICATION" }
      - { name: comp_year_start_month, type: string, source: input, description: "First month of the computation year, YYYY-MM" }
      - { name: comp_year_months, type: integer, source: input, description: "Length of computation window in months; must be 12 for STANDARD_ANNUAL, 1..12 for POST_MODIFICATION (ERR_INVALID_COMP_MONTHS)" }
      - { name: projected_annual_disbursements_cents, type: integer, source: input, description: "Projected tax + insurance disbursements over the computation year" }
      - { name: cushion_cents, type: integer, source: computed, description: "RESPA cushion: projected_annual_disbursements_cents * 2 / 12, round-half-up" }
      - { name: balance_at_analysis_cents, type: integer, source: system, description: "Loan.escrow_balance_cents snapshot at creation" }
      - { name: shortage_cents, type: integer, source: computed, description: "max(0, cushion - balance_at_analysis)" }
      - { name: surplus_cents, type: integer, source: computed, description: "max(0, balance_at_analysis - cushion)" }
      - { name: monthly_spread_cents, type: integer, source: computed, description: "round_half_up(shortage / comp_year_months); months 1..n-1 collect this" }
      - { name: spread_last_month_cents, type: integer, source: computed, description: "shortage - monthly_spread * (comp_year_months - 1); remainder lands in the LAST month (pinned rounding order)" }
      - { name: new_monthly_escrow_cents, type: integer, source: computed, description: "round_half_up(disbursements / 12) + monthly_spread" }
      - { name: refund_cents, type: integer, source: computed, description: "surplus when surplus >= SURPLUS_REFUND_MIN_CENTS (5000), else 0" }
      - { name: credit_cents, type: integer, source: computed, description: "surplus when 0 < surplus < 5000 (stays in account), else 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPLIED | VOIDED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LossMitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, CLOSED_DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /applications/{id}/acknowledge"
        actor: LossMitAgent
        preconditions: ["status == SUBMITTED (else ERR_APPLICATION_STATE_INVALID)"]
        side_effects: ["acknowledged_at := now"]
      - from: ACKNOWLEDGED
        to: COMPLETE_PACKAGE
        trigger: "system (automatic when POST /documents/{id}/accept empties outstanding_doc_categories)"
        actor: system
        preconditions: ["outstanding_doc_categories becomes empty"]
        side_effects:
          - "completed_at := now when null (first completion only; never cleared afterwards)"
          - "evaluation_deadline := completed_at + 30 days"
      - from: COMPLETE_PACKAGE
        to: ACKNOWLEDGED
        trigger: "system (automatic when a new PackageDocument submission supersedes the only ACCEPTED document of an income category, re-opening a gap)"
        actor: system
        preconditions: ["outstanding_doc_categories becomes non-empty via supersession"]
        side_effects: ["completed_at retained (first-completion anchor)"]
      - from: COMPLETE_PACKAGE
        to: EVALUATED_OFFER
        trigger: "POST /applications/{id}/evaluations with result OFFER"
        actor: Underwriter
        preconditions: ["status == COMPLETE_PACKAGE (else ERR_APPLICATION_NOT_COMPLETE)", "expected_application_version matches (else ERR_STALE_APPLICATION_VERSION)"]
        side_effects:
          - "WaterfallEvaluation created (status ACTIVE); prior ACTIVE evaluation -> SUPERSEDED"
          - "TrialPaymentPlan created (OFFERED) with 3 SCHEDULED TrialPayments"
          - "application.version increments"
      - from: COMPLETE_PACKAGE
        to: EVALUATED_DENIAL
        trigger: "POST /applications/{id}/evaluations with result DENIAL"
        actor: Underwriter
        preconditions: ["status == COMPLETE_PACKAGE", "expected_application_version matches"]
        side_effects:
          - "WaterfallEvaluation created (ACTIVE); prior ACTIVE evaluation -> SUPERSEDED"
          - "DenialNotice created (ISSUED) with underwriter_user_id := caller, appeal_deadline := now + 14d, appeal_eligible per 90-day rule"
      - from: EVALUATED_DENIAL
        to: APPEAL_REVIEW
        trigger: "POST /denial-notices/{id}/appeals"
        actor: Borrower
        preconditions: ["notice ISSUED", "now <= appeal_deadline", "appeal_eligible == true"]
        side_effects: ["DenialNotice ISSUED -> APPEALED", "Appeal created (SUBMITTED)"]
      - from: APPEAL_REVIEW
        to: CLOSED_DENIED
        trigger: "POST /appeals/{id}/decision outcome=AFFIRMED"
        actor: AppealReviewer
        preconditions: ["appeal SUBMITTED", "reviewer_user_id != notice.underwriter_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Appeal -> AFFIRMED; DenialNotice APPEALED -> AFFIRMED"
          - "Loan.workout_status LOSS_MIT_REVIEW -> DELINQUENT (link caused by application reaching terminal CLOSED_DENIED)"
      - from: APPEAL_REVIEW
        to: COMPLETE_PACKAGE
        trigger: "POST /appeals/{id}/decision outcome=OVERTURNED"
        actor: AppealReviewer
        preconditions: ["appeal SUBMITTED", "segregation of duties"]
        side_effects:
          - "L1: DenialNotice APPEALED -> SUPERSEDED (caused by the overturn)"
          - "L2: Application APPEAL_REVIEW -> COMPLETE_PACKAGE (caused by the notice supersession; re-evaluation required)"
          - "L3: ForeclosureCase SALE_SCHEDULED -> SALE_HOLD for the loan's active case (caused by the application re-entering the blocking state COMPLETE_PACKAGE)"
      - from: EVALUATED_OFFER
        to: TRIAL_ACTIVE
        trigger: "POST /trial-plans/{id}/accept"
        actor: Borrower
        preconditions: ["plan OFFERED", "loan.foreclosure_status != SALE_COMPLETED (ERR_LOAN_FORECLOSURE_COMPLETED)"]
        side_effects: ["Loan.workout_status LOSS_MIT_REVIEW -> TRIAL"]
      - from: TRIAL_ACTIVE
        to: TRIAL_PASSED
        trigger: "system (automatic when TrialPaymentPlan -> COMPLETED)"
        actor: system
        preconditions: ["plan COMPLETED"]
        side_effects: ["Loan.workout_status TRIAL -> MOD_PENDING (caused by plan completion)"]
      - from: TRIAL_ACTIVE
        to: EVALUATED_DENIAL
        trigger: "system (automatic when TrialPaymentPlan -> FAILED)"
        actor: system
        preconditions: ["plan FAILED"]
        side_effects:
          - "new DenialNotice ISSUED with reasons [TRIAL_PLAN_FAILED], underwriter_user_id 'system'"
          - "Loan.workout_status TRIAL -> LOSS_MIT_REVIEW"
      - from: TRIAL_PASSED
        to: APPROVED
        trigger: "system (automatic when Loan.workout_status -> PERMANENTLY_MODIFIED via POST /modifications/{id}/record)"
        actor: system
        preconditions: ["modification RECORDED"]
        side_effects:
          - "system creates EscrowAnalysis (POST_MODIFICATION, DRAFT, modification_id set, comp_year_start_month := month(recorded_at), comp_year_months := 13 - month(recorded_at), projected_annual_disbursements_cents := escrow_monthly_cents * 12) — caused by the application reaching APPROVED"
      - from: APPROVED
        to: TRIAL_PASSED
        trigger: "system (automatic on POST /modifications/{id}/rescind)"
        actor: system
        preconditions: ["modification RESCINDED"]
        side_effects: ["the auto-created EscrowAnalysis, if still DRAFT, -> CANCELLED"]
      - from: [SUBMITTED, ACKNOWLEDGED, COMPLETE_PACKAGE, EVALUATED_OFFER, EVALUATED_DENIAL, APPEAL_REVIEW]
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw OR system supersession by a newer application"
        actor: Borrower | system
        preconditions: ["status not in {TRIAL_ACTIVE, TRIAL_PASSED} and not terminal (else ERR_APPLICATION_STATE_INVALID)", "system supersession path: application CREATE is rejected with ERR_APPLICATION_STATE_INVALID when the existing non-terminal application is TRIAL_ACTIVE/TRIAL_PASSED"]
        side_effects:
          - "OFFERED plan, if any, -> CANCELLED"
          - "supersession sets superseded_by_application_id on the withdrawn application"
          - "Loan.workout_status LOSS_MIT_REVIEW -> DELINQUENT when no other non-terminal application remains for the loan"

  - entity: Loan
    initial_state: "workout_status: PERFORMING or DELINQUENT (by delinquency_days); foreclosure_status: NONE"
    terminal_states: ["workout_status: PERMANENTLY_MODIFIED", "foreclosure_status: SALE_COMPLETED"]
    note: "Two parallel state dimensions on one row. workout_status is system-driven (see LossMitApplication/TrialPaymentPlan/PermanentModification cascades); foreclosure_status is a computed mirror of the loan's latest non-CANCELLED ForeclosureCase. The dimensions evolve independently except dual-tracking gates: foreclosure transitions consult application state, and trial acceptance consults foreclosure_status."
    transitions:
      - from: "foreclosure_status NONE"
        to: REFERRED
        trigger: "POST /loans/{id}/foreclosure-cases"
        actor: ForeclosureCounsel
        preconditions:
          - "delinquency_days > 120 (strictly; 120 fails with ERR_REFERRAL_TOO_EARLY)"
          - "no LossMitApplication in {COMPLETE_PACKAGE, EVALUATED_OFFER, APPEAL_REVIEW, TRIAL_ACTIVE, TRIAL_PASSED} for the loan (ERR_DUAL_TRACKING_BLOCKED)"
          - "no non-terminal ForeclosureCase already exists for the loan (ERR_FORECLOSURE_CASE_ACTIVE)"
        side_effects: ["Loan.version increments"]
      - from: "foreclosure_status REFERRED or SALE_HOLD"
        to: SALE_SCHEDULED
        trigger: "POST /foreclosure-cases/{id}/schedule-sale"
        actor: ForeclosureCounsel
        preconditions:
          - "sale_date >= referred_at + MIN_SALE_NOTICE_DAYS (14 days) (ERR_SALE_MIN_NOTICE)"
          - "sale_date not within [issued_at, appeal_deadline] (closed interval) of any ISSUED or APPEALED DenialNotice for the loan (ERR_SALE_WITHIN_APPEAL_WINDOW)"
          - "no blocking application with completed_at <= sale_date - 37 days (ERR_DUAL_TRACKING_BLOCKED)"
        side_effects: ["ForeclosureCase.status := SALE_SCHEDULED; Loan.foreclosure_status mirrors"]
      - from: "foreclosure_status SALE_SCHEDULED"
        to: SALE_HOLD
        trigger: "system (automatic when an application re-enters COMPLETE_PACKAGE via appeal overturn)"
        actor: system
        preconditions: ["blocking application state appears"]
        side_effects: []
      - from: "foreclosure_status SALE_SCHEDULED"
        to: SALE_COMPLETED
        trigger: "POST /foreclosure-cases/{id}/complete-sale"
        actor: ForeclosureCounsel
        preconditions: ["status == SALE_SCHEDULED (ERR_FORECLOSURE_STATE_INVALID)"]
        side_effects: ["Loan.workout_status any -> terminal-locked; subsequent workout transitions rejected (ERR_LOAN_FORECLOSURE_COMPLETED)"]

  - entity: PackageDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /documents/{id}/accept"
        actor: LossMitAgent
        preconditions: ["status == SUBMITTED (else ERR_DOCUMENT_ALREADY_RESOLVED)", "application not terminal"]
        side_effects:
          - "recompute application.verified_monthly_income_cents (verified_gross_monthly_income)"
          - "recompute outstanding_doc_categories; if empty and application ACKNOWLEDGED -> COMPLETE_PACKAGE (completed_at set on first completion)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /documents/{id}/reject"
        actor: LossMitAgent
        preconditions: ["status == SUBMITTED", "rejection_reason present"]
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when a new PackageDocument of the same doc_type is submitted to the same application)"
        actor: system
        preconditions: ["new same-type document submitted"]
        side_effects:
          - "recompute verified_monthly_income_cents and outstanding_doc_categories"
          - "if a required category lost its last ACCEPTED document and application was COMPLETE_PACKAGE -> ACKNOWLEDGED (cycle re-opens)"

  - entity: TrialPaymentPlan
    initial_state: OFFERED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /trial-plans/{id}/accept"
        actor: Borrower
        preconditions: ["status == OFFERED (else ERR_TRIAL_PLAN_NOT_OFFERED)", "loan.foreclosure_status != SALE_COMPLETED", "no other ACTIVE/OFFERED plan for the loan"]
        side_effects: ["accepted_at := now", "Application EVALUATED_OFFER -> TRIAL_ACTIVE", "Loan.workout_status -> TRIAL"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when the 3rd payment resolves PAID_ON_TIME) or POST /trial-plans/{id}/finalize"
        actor: system | ServicingOps
        preconditions: ["all 3 payments PAID_ON_TIME"]
        side_effects:
          - "Loan.suspense applied: arrears_cents := max(0, arrears - suspense_total); overflow (suspense_total - arrears, when positive) reduces unpaid_principal_balance_cents; suspense_cents := 0"
          - "Application TRIAL_ACTIVE -> TRIAL_PASSED (caused by plan completion)"
          - "Loan.workout_status TRIAL -> MOD_PENDING (caused by plan completion)"
      - from: ACTIVE
        to: FAILED
        trigger: "system (automatic on any PAID_LATE or PAID_INSUFFICIENT payment) or POST /trial-plans/{id}/finalize with any MISSED payment"
        actor: system | ServicingOps
        preconditions: ["a payment resolved PAID_LATE/PAID_INSUFFICIENT, or finalize marks a SCHEDULED payment with due_date < today as MISSED"]
        side_effects:
          - "Loan.suspense applied to arrears identically to COMPLETED (partial payments still credit); suspense_cents := 0"
          - "Application TRIAL_ACTIVE -> EVALUATED_DENIAL; new DenialNotice (TRIAL_PLAN_FAILED) issued (caused by plan failure)"
          - "Loan.workout_status TRIAL -> LOSS_MIT_REVIEW"
      - from: OFFERED
        to: CANCELLED
        trigger: "system (application withdrawn/superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrialPayment
    initial_state: SCHEDULED
    terminal_states: [PAID_ON_TIME, PAID_LATE, PAID_INSUFFICIENT, MISSED]
    transitions:
      - from: SCHEDULED
        to: PAID_ON_TIME
        trigger: "POST /trial-payments/{id}/pay"
        actor: Borrower
        preconditions: ["plan ACTIVE (else ERR_TRIAL_PLAN_NOT_ACTIVE)", "payment SCHEDULED (else ERR_TRIAL_PAYMENT_RESOLVED)", "amount_cents > 0 (ERR_PAYMENT_AMOUNT_INVALID)"]
        side_effects:
          - "paid_at := now; received_amount_cents := amount_cents"
          - "plan.suspense_total_cents += amount_cents; Loan.suspense_cents += amount_cents"
          - "when this is the 3rd PAID_ON_TIME, TrialPaymentPlan -> COMPLETED cascade fires"
      - from: SCHEDULED
        to: PAID_LATE
        trigger: "POST /trial-payments/{id}/pay when date(now) > due_date"
        actor: Borrower
        preconditions: ["same as PAID_ON_TIME"]
        side_effects: ["suspense accrues identically", "TrialPaymentPlan -> FAILED cascade fires"]
      - from: SCHEDULED
        to: PAID_INSUFFICIENT
        trigger: "POST /trial-payments/{id}/pay when amount_cents < scheduled_amount_cents"
        actor: Borrower
        preconditions: ["same as PAID_ON_TIME"]
        side_effects: ["suspense accrues identically", "TrialPaymentPlan -> FAILED cascade fires"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /trial-plans/{id}/finalize when due_date < today and still SCHEDULED"
        actor: ServicingOps
        preconditions: ["plan ACTIVE"]
        side_effects: ["TrialPaymentPlan -> FAILED cascade fires"]

  - entity: PermanentModification
    initial_state: DRAFT
    terminal_states: [RECORDED, RESCINDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /loans/{id}/modifications"
        actor: ServicingOps
        preconditions: ["trial_plan COMPLETED (else ERR_TRIAL_PLAN_NOT_COMPLETED)", "application TRIAL_PASSED", "loan.workout_status == MOD_PENDING"]
        side_effects: ["final terms computed per waterfall_modified_payment FINAL variant (base := UPB + arrears after suspense application)"]
      - from: DRAFT
        to: DOCS_SENT
        trigger: "POST /modifications/{id}/send-docs"
        actor: ServicingOps
        preconditions: ["status == DRAFT (else ERR_MODIFICATION_STATE_INVALID)"]
        side_effects: []
      - from: DOCS_SENT
        to: SIGNED
        trigger: "POST /modifications/{id}/sign"
        actor: Borrower
        preconditions: ["status == DOCS_SENT"]
        side_effects: []
      - from: SIGNED
        to: RECORDED
        trigger: "POST /modifications/{id}/record"
        actor: ServicingOps
        preconditions: ["status == SIGNED"]
        side_effects:
          - "L1: Loan terms updated: unpaid_principal_balance_cents := final_base_cents - final_forbearance_cents; deferred_principal_cents := final_forbearance_cents; interest_rate_bp := final_rate_bp; remaining_term_months := final_term_months; arrears_cents := 0; current_pi_cents recomputed; workout_status -> PERMANENTLY_MODIFIED"
          - "L2: Application TRIAL_PASSED -> APPROVED (caused by workout_status reaching PERMANENTLY_MODIFIED)"
          - "L3: EscrowAnalysis (POST_MODIFICATION, DRAFT) auto-created (caused by the application reaching APPROVED)"
          - "recorded_at := now; rescission_deadline := now + 3 days"
      - from: RECORDED
        to: RESCINDED
        trigger: "POST /modifications/{id}/rescind"
        actor: ServicingOps
        preconditions: ["status == RECORDED", "now <= rescission_deadline (else ERR_RESCISSION_WINDOW_EXPIRED)"]
        side_effects:
          - "Loan terms restored from prior_terms_snapshot (upb, rate, term, arrears); deferred_principal_cents := 0; workout_status -> MOD_PENDING"
          - "Application APPROVED -> TRIAL_PASSED; auto-created DRAFT EscrowAnalysis -> CANCELLED"

  - entity: DenialNotice
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, AFFIRMED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /denial-notices/{id}/appeals"
        actor: Borrower
        preconditions:
          - "status == ISSUED (APPEALED -> ERR_NOTICE_ALREADY_APPEALED; other -> ERR_NOTICE_NOT_APPEALABLE_STATE)"
          - "now <= appeal_deadline (else ERR_APPEAL_WINDOW_EXPIRED)"
          - "appeal_eligible == true (else ERR_APPEAL_NOT_AVAILABLE)"
        side_effects: ["Application EVALUATED_DENIAL -> APPEAL_REVIEW", "Appeal created (SUBMITTED)"]
      - from: APPEALED
        to: AFFIRMED
        trigger: "POST /appeals/{id}/decision outcome=AFFIRMED"
        actor: AppealReviewer
        preconditions: ["appeal SUBMITTED"]
        side_effects: ["Application APPEAL_REVIEW -> CLOSED_DENIED"]
      - from: APPEALED
        to: SUPERSEDED
        trigger: "POST /appeals/{id}/decision outcome=OVERTURNED"
        actor: AppealReviewer
        preconditions: ["appeal SUBMITTED"]
        side_effects: ["Application APPEAL_REVIEW -> COMPLETE_PACKAGE (L2), which re-blocks foreclosure (L3)"]

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [AFFIRMED, OVERTURNED]
    transitions:
      - from: SUBMITTED
        to: AFFIRMED
        trigger: "POST /appeals/{id}/decision outcome=AFFIRMED"
        actor: AppealReviewer
        preconditions: ["status == SUBMITTED (else ERR_APPEAL_ALREADY_DECIDED)", "X-User-ID != notice.underwriter_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["reviewer_user_id := caller; decided_at := now"]
      - from: SUBMITTED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decision outcome=OVERTURNED"
        actor: AppealReviewer
        preconditions: ["same as AFFIRMED"]
        side_effects: ["overturn cascade (see LossMitApplication)"]

  - entity: ForeclosureCase
    initial_state: REFERRED
    terminal_states: [SALE_COMPLETED, CANCELLED]
    transitions:
      - from: REFERRED
        to: SALE_SCHEDULED
        trigger: "POST /foreclosure-cases/{id}/schedule-sale"
        actor: ForeclosureCounsel
        preconditions: ["min-notice, appeal-window, and dual-tracking rules (see Loan machine)"]
        side_effects: ["Loan.foreclosure_status mirror -> SALE_SCHEDULED"]
      - from: SALE_SCHEDULED
        to: SALE_HOLD
        trigger: "system (appeal overturn re-blocks)"
        actor: system
        preconditions: []
        side_effects: ["Loan.foreclosure_status mirror -> SALE_HOLD"]
      - from: SALE_HOLD
        to: SALE_SCHEDULED
        trigger: "POST /foreclosure-cases/{id}/schedule-sale (re-schedule)"
        actor: ForeclosureCounsel
        preconditions: ["same gates as initial scheduling"]
        side_effects: []
      - from: SALE_SCHEDULED
        to: SALE_COMPLETED
        trigger: "POST /foreclosure-cases/{id}/complete-sale"
        actor: ForeclosureCounsel
        preconditions: ["status == SALE_SCHEDULED (ERR_FORECLOSURE_STATE_INVALID)"]
        side_effects: ["Loan.foreclosure_status -> SALE_COMPLETED (terminal-locks workout dimension)"]
      - from: [REFERRED, SALE_SCHEDULED, SALE_HOLD]
        to: CANCELLED
        trigger: "POST /foreclosure-cases/{id}/cancel"
        actor: ForeclosureCounsel
        preconditions: ["non-terminal status"]
        side_effects: ["Loan.foreclosure_status mirror -> NONE"]

  - entity: EscrowAnalysis
    initial_state: DRAFT
    terminal_states: [VOIDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /escrow-analyses/{id}/apply"
        actor: ServicingOps
        preconditions: ["status == DRAFT (else ERR_ANALYSIS_NOT_DRAFT)"]
        side_effects:
          - "Loan.escrow_monthly_cents := new_monthly_escrow_cents"
          - "when refund_cents > 0: Loan.escrow_balance_cents -= refund_cents (conservation: balance_before == balance_after + refund)"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /escrow-analyses/{id}/void"
        actor: ServicingOps
        preconditions: ["status == APPLIED", "no later non-VOIDED APPLIED analysis exists for the loan (ERR_ANALYSIS_VOID_BLOCKED)"]
        side_effects:
          - "Loan.escrow_monthly_cents restored to the value before apply"
          - "when refund_cents > 0: Loan.escrow_balance_cents += refund_cents (refund clawed back; conservation holds)"
      - from: DRAFT
        to: CANCELLED
        trigger: "system (modification rescinded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WaterfallEvaluation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer POST /applications/{id}/evaluations succeeds for the same application)"
        actor: system
        preconditions: []
        side_effects: ["application.active_evaluation_id updated to the newer evaluation"]

  - entity: ProgramOption
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /program-options/{id}/retire"
        actor: ServicingAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["RETIRED programs are excluded from subsequent waterfall eligibility"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: application-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /loans/{loanId}/applications"
    occ_field: expected_loan_version
    description: |
      Creating a LossMitApplication against a Loan whose version has advanced
      since the client last observed it is rejected. Product semantics allow a
      new application to legitimately supersede an existing non-terminal one
      (the old one auto-WITHDRAWs), so a writer working from a stale loan view
      must be refused rather than silently superseding.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
  - rule_id: evaluation-rerun-stale-application
    parent_entity: LossMitApplication
    write_endpoint: "POST /applications/{id}/evaluations"
    occ_field: expected_application_version
    description: |
      Running a waterfall evaluation against an application whose version has
      advanced since the underwriter last read it is rejected. A successful
      evaluation supersedes the prior ACTIVE evaluation, so the version check
      is the only guard against evaluating from a stale package view.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: verified_gross_monthly_income
    trigger: "on PackageDocument ACCEPTED or SUPERSEDED side effects; read at evaluation"
    algorithm: aggregation
    input_set: "PackageDocuments of the application with status ACCEPTED (SUPERSEDED and REJECTED excluded). Income-bearing types only: PAYSTUB, TAX_RETURN, PROFIT_LOSS. BANK_STATEMENT and HARDSHIP_AFFIDAVIT contribute nothing to income."
    formula: |
      paystub = the ACCEPTED PAYSTUB with the latest pay_period_end_date
                (tie-break: latest received_at); 0 if none
      monthly_paystub = round_half_up(gross_per_period_cents * FREQ[pay_frequency])
                        FREQ = {WEEKLY: 52/12, BIWEEKLY: 26/12, SEMIMONTHLY: 2, MONTHLY: 1}
      monthly_tax     = round_half_up(annual_gross_cents / 12) for each ACCEPTED TAX_RETURN
      monthly_pl      = round_half_up(ytd_net_income_cents / ytd_months) for each ACCEPTED PROFIT_LOSS
      verified = monthly_paystub + sum(monthly_tax) + sum(monthly_pl)
    constants:
      WEEKLY_DIVISOR: "52/12"
      BIWEEKLY_DIVISOR: "26/12"
      SEMIMONTHLY_MULT: 2
      MONTHLY_MULT: 1
    precision: "per-source monthly amounts rounded half-up to whole cents first, then summed (pinned order)"

  - name: target_affordable_payment
    trigger: "during waterfall evaluation (and at modification creation for the final variant)"
    algorithm: threshold
    input_set: "application.verified_monthly_income_cents and the candidate program's target_dti_bp"
    formula: |
      if verified_monthly_income_cents == 0: evaluation short-circuits to DENIAL with
          reason INCOME_UNVERIFIABLE (no waterfall steps are produced)
      target = round_half_up(verified_monthly_income_cents * target_dti_bp / 10000)
      A program QUALIFIES iff achieved_pi_cents <= target (inclusive boundary:
      payment exactly equal to target qualifies).
    constants:
      BOUNDARY: "inclusive <="
    precision: "whole cents, round_half_up"

  - name: waterfall_modified_payment
    trigger: "POST /applications/{id}/evaluations (provisional variant) and POST /loans/{id}/modifications (final variant)"
    algorithm: constraint_propagation
    input_set: "Loan terms, application verified income, one eligible ProgramOption"
    formula: |
      base    = unpaid_principal_balance_cents + arrears_cents      # arrears as of evaluation (provisional) or as of modification creation (final)
      rate    = loan.interest_rate_bp; term = loan.remaining_term_months
      target  = target_affordable_payment(program)
      annuity(P, r_bp, n) = P * r / (1 - (1+r)^(-n)) with r = r_bp/10000/12, double precision,
                            final round_half_up to cents; r==0 -> P/n
      # Step 1 - rate reduction (iterate before stepping; stop at floor):
      while rate > program.rate_floor_bp and annuity(base, rate, term) > target:
          rate = max(program.rate_floor_bp, rate - program.rate_step_bp)
      # Step 2 - term extension (single jump to max):
      if annuity(base, rate, term) > target: term = program.max_term_months
      # Step 3 - principal forbearance:
      forborne = 0
      if annuity(base, rate, term) > target:
          cap    = round_half_up(base * program.max_forbearance_pct_bp / 10000)
          needed = round_half_up(base - target * (1 - (1+r)^(-term)) / r)
          forborne = min(cap, needed)
      final_pi = annuity(base - forborne, rate, term)
      qualifies = final_pi <= target
    constants:
      ANNUITY_PRECISION: "IEEE double intermediate; round_half_up cents on outputs"
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "evaluation time (WaterfallEvaluation)"
        difference: "base uses arrears BEFORE any trial-suspense application; outputs frozen on WaterfallEvaluation.offered_* fields"
      - name: final
        when: "modification creation (PermanentModification)"
        difference: "base uses arrears AFTER trial-suspense application (arrears reduced by suspense_total, so base - and therefore final_pi_cents and forbearance - diverge from provisional for identical program/income)"

  - name: trial_performance_evaluation
    trigger: "on each POST /trial-payments/{id}/pay and on POST /trial-plans/{id}/finalize"
    algorithm: threshold
    input_set: "the plan's 3 TrialPayments"
    formula: |
      on pay(payment, amount):
          if amount <= 0 -> ERR_PAYMENT_AMOUNT_INVALID
          elif amount < scheduled_amount_cents -> PAID_INSUFFICIENT (plan FAILED)
          elif date(now) > due_date            -> PAID_LATE (plan FAILED)
          else                                 -> PAID_ON_TIME
      plan COMPLETED iff all 3 payments == PAID_ON_TIME (count equality boundary:
      the 3rd on-time payment completes the plan; a plan with 2 on-time payments
      remains ACTIVE)
      finalize: any SCHEDULED payment with due_date < today -> MISSED (plan FAILED)
    constants:
      TRIAL_PERIODS: 3
      TRIAL_INTERVAL_DAYS: 30
      ON_TIME_RULE: "date(paid_at) <= due_date (inclusive: paying exactly on the due date is on time)"
    precision: "date granularity"

  - name: escrow_reanalysis
    trigger: "POST /loans/{id}/escrow-analyses (manual) and modification record (auto-create DRAFT); POST /escrow-analyses/{id}/apply applies"
    algorithm: projection
    input_set: "projected_annual_disbursements_cents (input), Loan.escrow_balance_cents snapshot at creation, comp_year_months"
    formula: |
      cushion        = round_half_up(disbursements * 2 / 12)        # RESPA 2-month cushion
      base_monthly   = round_half_up(disbursements / 12)
      shortage       = max(0, cushion - balance)
      surplus        = max(0, balance - cushion)
      # shortage spread - pinned rounding order: per-month round first,
      # remainder reconciled in the LAST month (never the first):
      monthly_spread = round_half_up(shortage / comp_year_months)
      last_month     = shortage - monthly_spread * (comp_year_months - 1)
      new_monthly    = base_monthly + monthly_spread
      # surplus disposition boundary (RESPA): >= 5000 cents -> refund; < 5000 -> credit
      refund = surplus if surplus >= 5000 else 0
      credit = surplus if 0 < surplus < 5000 else 0
    constants:
      CUSHION_MONTHS: 2
      SURPLUS_REFUND_MIN_CENTS: 5000
      SPREAD_REMAINDER: "LAST month absorbs rounding remainder"
    precision: "whole cents, round_half_up; division rounding pinned per formula order"
    variants:
      - name: standard_annual
        when: "analysis_type STANDARD_ANNUAL; comp_year_months must equal 12"
        difference: "shortage spread over 12 months"
      - name: post_modification
        when: "analysis_type POST_MODIFICATION; comp_year_months 1..12 (auto-created value: 13 - month(recorded_at))"
        difference: "identical shortage spread over the remaining computation-year months only, so monthly_spread and new_monthly diverge from standard_annual for identical balance/disbursements"

  - name: sale_eligibility_window
    trigger: "POST /foreclosure-cases/{id}/schedule-sale and POST /loans/{id}/foreclosure-cases"
    algorithm: threshold
    input_set: "loan applications in blocking states {COMPLETE_PACKAGE, EVALUATED_OFFER, APPEAL_REVIEW, TRIAL_ACTIVE, TRIAL_PASSED} with completed_at set; case sale_date; DenialNotices in {ISSUED, APPEALED}"
    formula: |
      dual_tracking_block(sale_date) =
          exists blocking application with (sale_date - date(completed_at)).days >= 37
      appeal_window_block(sale_date) =
          exists notice with date(issued_at) <= sale_date <= date(appeal_deadline)   # CLOSED interval
      referral_block = exists blocking application (any completed_at)
      referral requires loan.delinquency_days > 120 strictly (day 120 fails, day 121 passes)
      min_notice requires sale_date >= date(referred_at) + 14 days
    constants:
      SALE_BLOCK_MIN_DAYS: 37
      APPEAL_ELIGIBILITY_MIN_DAYS: 90
      REFERRAL_MIN_DELINQUENCY_DAYS: 120
      MIN_SALE_NOTICE_DAYS: 14
      APPEAL_WINDOW_DAYS: 14
    precision: "whole-day comparison on ISO dates"

  - name: appeal_eligibility
    trigger: "DenialNotice creation (computes appeal_eligible) and POST /denial-notices/{id}/appeals (enforces)"
    algorithm: threshold
    input_set: "notice.issued_at, application.completed_at, loan's active foreclosure case sale_date"
    formula: |
      appeal_deadline = issued_at + 14 days (submission accepted while now <= appeal_deadline, inclusive)
      appeal_eligible = (no SALE_SCHEDULED/SALE_HOLD case for the loan)
                        OR (date(completed_at) <= sale_date - 90 days)
      window check and eligibility check are independent: expired window -> ERR_APPEAL_WINDOW_EXPIRED;
      ineligible -> ERR_APPEAL_NOT_AVAILABLE
    constants:
      APPEAL_WINDOW_DAYS: 14
      APPEAL_ELIGIBILITY_MIN_DAYS: 90
    precision: "deadline comparison on datetimes; 90-day rule on whole dates"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, enum members valid, integers well-typed", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: existence, check: "Path-template resources exist, validated left-to-right (loan, then application/document/plan/payment/modification/notice/appeal/case/analysis)", error_id: "ERR_LOAN_NOT_FOUND | ERR_BORROWER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_PROGRAM_OPTION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_TRIAL_PLAN_NOT_FOUND | ERR_TRIAL_PAYMENT_NOT_FOUND | ERR_MODIFICATION_NOT_FOUND | ERR_DENIAL_NOTICE_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_FORECLOSURE_CASE_NOT_FOUND | ERR_ESCROW_ANALYSIS_NOT_FOUND", http_status: 404, applies_to: "all parameterized endpoints" }
  - { priority: 5, category: auth, check: "Borrower-role caller owns the resource chain (X-User-ID == loan.borrower_id via application/notice/plan/payment)", error_id: ERR_BORROWER_OWNERSHIP, http_status: 403, applies_to: "Borrower endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_loan_version == Loan.version / expected_application_version == LossMitApplication.version", error_id: "ERR_STALE_LOAN_VERSION | ERR_STALE_APPLICATION_VERSION", http_status: 412, applies_to: "POST /loans/{loanId}/applications, POST /applications/{id}/evaluations" }
  - { priority: 7, category: state, check: "Entity state preconditions per state machine (application COMPLETE_PACKAGE for evaluation, document SUBMITTED for accept/reject, plan OFFERED for accept / ACTIVE for pay & finalize, payment SCHEDULED for pay, notice ISSUED for appeal, appeal SUBMITTED for decision, modification DRAFT/DOCS_SENT/SIGNED/RECORDED per action, analysis DRAFT for apply / APPLIED for void, program ACTIVE for retire, case non-terminal for actions)", error_id: "ERR_APPLICATION_NOT_COMPLETE | ERR_APPLICATION_STATE_INVALID | ERR_DOCUMENT_ALREADY_RESOLVED | ERR_TRIAL_PLAN_NOT_OFFERED | ERR_TRIAL_PLAN_NOT_ACTIVE | ERR_TRIAL_PAYMENT_RESOLVED | ERR_NOTICE_ALREADY_APPEALED | ERR_NOTICE_NOT_APPEALABLE_STATE | ERR_APPEAL_ALREADY_DECIDED | ERR_MODIFICATION_STATE_INVALID | ERR_ANALYSIS_NOT_DRAFT | ERR_FORECLOSURE_STATE_INVALID | ERR_LOAN_FORECLOSURE_COMPLETED | ERR_TRIAL_PLAN_NOT_COMPLETED", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Compliance gates: referral requires delinquency_days > 120; referral/schedule blocked by blocking-state applications (dual tracking); sale_date outside denial appeal windows; appeal reviewer != notice underwriter", error_id: "ERR_REFERRAL_TOO_EARLY | ERR_DUAL_TRACKING_BLOCKED | ERR_SALE_WITHIN_APPEAL_WINDOW | ERR_SEGREGATION_OF_DUTIES", http_status: "422 | 422 | 422 | 403", applies_to: "foreclosure-case create/schedule-sale, appeals decision" }
  - { priority: 9, category: business_temporal, check: "Time gates: appeal window inclusive deadline; 90-day appeal eligibility; sale min-notice 14 days; rescission within 3 days", error_id: "ERR_APPEAL_WINDOW_EXPIRED | ERR_APPEAL_NOT_AVAILABLE | ERR_SALE_MIN_NOTICE | ERR_RESCISSION_WINDOW_EXPIRED", http_status: 422, applies_to: "appeals create, schedule-sale, rescind" }
  - { priority: 10, category: business_constraint, check: "Structural uniqueness: program waterfall_rank unique; one non-terminal foreclosure case per loan; escrow computation windows [start_month, start_month+months) half-open non-overlapping per loan (adjacent allowed); void blocked when later APPLIED analysis exists; comp_year_months == 12 for STANDARD_ANNUAL and 1..12 for POST_MODIFICATION", error_id: "ERR_PROGRAM_RANK_DUPLICATE | ERR_FORECLOSURE_CASE_ACTIVE | ERR_ESCROW_YEAR_OVERLAP | ERR_ANALYSIS_VOID_BLOCKED | ERR_INVALID_COMP_MONTHS", http_status: "409 | 409 | 409 | 409 | 409 | 422", applies_to: "program-options create, foreclosure create, escrow create/void, trial accept" }
  - { priority: 11, category: business_fiscal, check: "Payment amount must be > 0", error_id: ERR_PAYMENT_AMOUNT_INVALID, http_status: 422, applies_to: "POST /trial-payments/{id}/pay" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- borrowers / loans (seeding surface) ---
  - { method: POST, path: "/borrowers", description: "Create a borrower", roles: [ServicingAdmin], code: 201, input: [full_name, email, "mailing_address?"], output: Borrower, side_effects: [] }
  - { method: GET, path: "/borrowers/{id}", description: "Fetch a borrower", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: Borrower, side_effects: [] }
  - { method: POST, path: "/loans", description: "Board a loan; computes current_pi_cents; workout_status DELINQUENT iff delinquency_days > 0", roles: [ServicingAdmin], code: 201, input: [borrower_id, loan_number, property_state_code, unpaid_principal_balance_cents, interest_rate_bp, remaining_term_months, "arrears_cents?", "escrow_balance_cents?", "escrow_monthly_cents?", "delinquency_days?"], output: Loan, side_effects: ["current_pi_cents computed", "workout_status initialized"] }
  - { method: GET, path: "/loans/{id}", description: "Fetch a loan (includes computed fields)", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: GET, path: "/loans", description: "List loans with pagination", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: ["borrower_id?", "workout_status?", "limit?", "offset?"], output: "Loan[]", side_effects: [] }

  # --- applications ---
  - { method: POST, path: "/loans/{id}/applications", description: "Borrower submits a loss-mitigation application; supersedes any non-terminal application (which auto-WITHDRAWs with superseded_by_application_id set); rejected with ERR_APPLICATION_STATE_INVALID when the existing non-terminal application is in TRIAL_ACTIVE or TRIAL_PASSED; OCC-guarded", roles: [Borrower], code: 201, input: [expected_loan_version, hardship_type, stated_monthly_income_cents], output: LossMitApplication, side_effects: ["prior non-terminal application -> WITHDRAWN (superseded)", "Loan.workout_status DELINQUENT -> LOSS_MIT_REVIEW", "increments Loan.version by 1"] }
  - { method: GET, path: "/applications/{id}", description: "Fetch an application (includes computed income/outstanding docs)", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: LossMitApplication, side_effects: [] }
  - { method: GET, path: "/loans/{id}/applications", description: "List applications for a loan", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: ["limit?", "offset?"], output: "LossMitApplication[]", side_effects: [] }
  - { method: GET, path: "/applications", description: "List applications with filters", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: ["loan_id?", "status?", "active_evaluation_id?", "superseded_by_application_id?", "limit?", "offset?"], output: "LossMitApplication[]", side_effects: [] }
  - { method: POST, path: "/applications/{id}/acknowledge", description: "Acknowledge receipt (Reg X 5-day acknowledgment)", roles: [LossMitAgent], code: 200, input: [], output: LossMitApplication, side_effects: ["SUBMITTED -> ACKNOWLEDGED", "acknowledged_at := now"] }
  - { method: POST, path: "/applications/{id}/withdraw", description: "Borrower withdraws a non-terminal application (not from TRIAL_ACTIVE/TRIAL_PASSED)", roles: [Borrower], code: 200, input: [], output: LossMitApplication, side_effects: ["-> WITHDRAWN", "OFFERED plan -> CANCELLED", "workout reverts to DELINQUENT when no other non-terminal application"] }

  # --- documents ---
  - { method: POST, path: "/applications/{id}/documents", description: "Borrower submits a package document; supersedes the ACCEPTED same-type document if one exists (which may re-open completeness)", roles: [Borrower], code: 201, input: [doc_type, "gross_per_period_cents?", "pay_frequency?", "pay_period_end_date?", "annual_gross_cents?", "ytd_net_income_cents?", "ytd_months?"], output: PackageDocument, side_effects: ["existing ACCEPTED same-type document -> SUPERSEDED", "completeness recompute (COMPLETE_PACKAGE may revert to ACKNOWLEDGED)"] }
  - { method: GET, path: "/applications/{id}/documents", description: "List documents of an application", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: ["doc_type?", "status?", "limit?", "offset?"], output: "PackageDocument[]", side_effects: [] }
  - { method: POST, path: "/documents/{id}/accept", description: "Accept a SUBMITTED document; recomputes verified income; may complete the package", roles: [LossMitAgent], code: 200, input: [], output: PackageDocument, side_effects: ["verified_gross_monthly_income recompute", "ACKNOWLEDGED -> COMPLETE_PACKAGE when outstanding set empties (completed_at anchored)"] }
  - { method: POST, path: "/documents/{id}/reject", description: "Reject a SUBMITTED document with a reason", roles: [LossMitAgent], code: 200, input: [rejection_reason], output: PackageDocument, side_effects: [] }

  # --- program options (waterfall configuration) ---
  - { method: POST, path: "/program-options", description: "Create a waterfall program option", roles: [ServicingAdmin], code: 201, input: [code, waterfall_rank, target_dti_bp, rate_floor_bp, rate_step_bp, max_term_months, max_forbearance_pct_bp, min_delinquency_days, max_delinquency_days], output: ProgramOption, side_effects: [] }
  - { method: GET, path: "/program-options", description: "List program options", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["status?", "limit?", "offset?"], output: "ProgramOption[]", side_effects: [] }
  - { method: GET, path: "/program-options/{id}", description: "Fetch a program option", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: [], output: ProgramOption, side_effects: [] }
  - { method: POST, path: "/program-options/{id}/retire", description: "Retire a program (excluded from future waterfalls)", roles: [ServicingAdmin], code: 200, input: [], output: ProgramOption, side_effects: ["ACTIVE -> RETIRED"] }

  # --- evaluations ---
  - { method: POST, path: "/applications/{id}/evaluations", description: "Run the evaluation waterfall: eligible ACTIVE programs (delinquency within [min,max] inclusive) in waterfall_rank ASC (tie-break created_at ASC), stop at first qualifying program; OFFER creates trial plan, DENIAL issues denial notice; OCC-guarded", roles: [Underwriter], code: 201, input: [expected_application_version], output: WaterfallEvaluation, side_effects: ["prior ACTIVE evaluation -> SUPERSEDED", "OFFER: TrialPaymentPlan(OFFERED) + 3 TrialPayments created, app -> EVALUATED_OFFER", "DENIAL: DenialNotice(ISSUED) created, app -> EVALUATED_DENIAL", "increments LossMitApplication.version by 1"] }
  - { method: GET, path: "/evaluations/{id}", description: "Fetch an evaluation", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: WaterfallEvaluation, side_effects: [] }
  - { method: GET, path: "/evaluations", description: "List evaluations", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["application_id?", "selected_program_id?", "limit?", "offset?"], output: "WaterfallEvaluation[]", side_effects: [] }
  - { method: GET, path: "/applications/{id}/evaluations", description: "List evaluations of an application", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: ["limit?", "offset?"], output: "WaterfallEvaluation[]", side_effects: [] }
  - { method: GET, path: "/evaluations/{id}/steps", description: "List per-program waterfall step results (only programs actually evaluated before the waterfall stopped)", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "EvaluationStepResult[]", side_effects: [] }

  # --- trial plans & payments ---
  - { method: POST, path: "/trial-plans/{id}/accept", description: "Borrower accepts a trial plan offer", roles: [Borrower], code: 200, input: [], output: TrialPaymentPlan, side_effects: ["OFFERED -> ACTIVE", "Application -> TRIAL_ACTIVE", "Loan.workout_status -> TRIAL"] }
  - { method: GET, path: "/trial-plans/{id}", description: "Fetch a trial plan", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: TrialPaymentPlan, side_effects: [] }
  - { method: GET, path: "/trial-plans", description: "List trial plans", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["application_id?", "evaluation_id?", "status?", "limit?", "offset?"], output: "TrialPaymentPlan[]", side_effects: [] }
  - { method: GET, path: "/trial-plans/{id}/payments", description: "List the plan's 3 trial payments", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "TrialPayment[]", side_effects: [] }
  - { method: POST, path: "/trial-payments/{id}/pay", description: "Borrower makes a trial payment; resolves the payment and may complete/fail the plan", roles: [Borrower], code: 200, input: [amount_cents], output: TrialPayment, side_effects: ["payment resolution per trial_performance_evaluation", "suspense accrual", "plan COMPLETED/FAILED cascades"] }
  - { method: POST, path: "/trial-plans/{id}/finalize", description: "Ops sweep: SCHEDULED payments past due become MISSED (plan FAILED); all-on-time plans become COMPLETED", roles: [ServicingOps], code: 200, input: [], output: TrialPaymentPlan, side_effects: ["MISSED marking", "plan terminal cascades"] }

  # --- permanent modification ---
  - { method: POST, path: "/loans/{id}/modifications", description: "Create a permanent modification (DRAFT) from a COMPLETED trial plan; computes final waterfall variant", roles: [ServicingOps], code: 201, input: [trial_plan_id], output: PermanentModification, side_effects: ["final terms computed (final variant)"] }
  - { method: GET, path: "/modifications/{id}", description: "Fetch a modification", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: PermanentModification, side_effects: [] }
  - { method: GET, path: "/modifications", description: "List modifications", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["application_id?", "trial_plan_id?", "limit?", "offset?"], output: "PermanentModification[]", side_effects: [] }
  - { method: POST, path: "/modifications/{id}/send-docs", description: "Send modification documents to the borrower", roles: [ServicingOps], code: 200, input: [], output: PermanentModification, side_effects: ["DRAFT -> DOCS_SENT"] }
  - { method: POST, path: "/modifications/{id}/sign", description: "Borrower signs the modification agreement", roles: [Borrower], code: 200, input: [], output: PermanentModification, side_effects: ["DOCS_SENT -> SIGNED"] }
  - { method: POST, path: "/modifications/{id}/record", description: "Record the signed modification; applies final terms to the loan (3-level cascade: loan terms -> application APPROVED -> escrow analysis auto-created)", roles: [ServicingOps], code: 200, input: [], output: PermanentModification, side_effects: ["loan terms + workout_status", "application APPROVED", "EscrowAnalysis POST_MODIFICATION DRAFT auto-created", "prior_terms_snapshot captured"] }
  - { method: POST, path: "/modifications/{id}/rescind", description: "Rescind a recorded modification within the 3-day rescission window; restores prior loan terms", roles: [ServicingOps], code: 200, input: [], output: PermanentModification, side_effects: ["loan terms restored", "application back to TRIAL_PASSED", "auto-created DRAFT escrow analysis CANCELLED"] }

  # --- denial notices & appeals ---
  - { method: GET, path: "/denial-notices/{id}", description: "Fetch a denial notice", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: DenialNotice, side_effects: [] }
  - { method: GET, path: "/denial-notices", description: "List denial notices", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["application_id?", "evaluation_id?", "limit?", "offset?"], output: "DenialNotice[]", side_effects: [] }
  - { method: GET, path: "/applications/{id}/denial-notices", description: "List denial notices of an application", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "DenialNotice[]", side_effects: [] }
  - { method: POST, path: "/denial-notices/{id}/appeals", description: "Borrower appeals a denial within the window; requires appeal_eligible", roles: [Borrower], code: 201, input: [grounds], output: Appeal, side_effects: ["notice ISSUED -> APPEALED", "application -> APPEAL_REVIEW"] }
  - { method: GET, path: "/appeals/{id}", description: "Fetch an appeal", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: GET, path: "/appeals", description: "List appeals", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["denial_notice_id?", "status?", "limit?", "offset?"], output: "Appeal[]", side_effects: [] }
  - { method: GET, path: "/denial-notices/{id}/appeals", description: "List appeals of a denial notice", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "Appeal[]", side_effects: [] }
  - { method: POST, path: "/appeals/{id}/decision", description: "Appeal reviewer decides; reviewer must differ from the denying underwriter (segregation of duties)", roles: [AppealReviewer], code: 200, input: [outcome], output: Appeal, side_effects: ["AFFIRMED: notice AFFIRMED, application CLOSED_DENIED", "OVERTURNED: 3-level cascade (notice SUPERSEDED -> application COMPLETE_PACKAGE -> foreclosure SALE_HOLD)"] }

  # --- foreclosure (dual-tracking surface) ---
  - { method: POST, path: "/loans/{id}/foreclosure-cases", description: "Refer a loan to foreclosure; gated by 120-day rule, dual-tracking block, one-active-case rule", roles: [ForeclosureCounsel], code: 201, input: [county, docket_number], output: ForeclosureCase, side_effects: ["REFERRED", "Loan.foreclosure_status mirror"] }
  - { method: GET, path: "/foreclosure-cases/{id}", description: "Fetch a foreclosure case", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: ForeclosureCase, side_effects: [] }
  - { method: GET, path: "/loans/{id}/foreclosure-cases", description: "List foreclosure cases of a loan", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "ForeclosureCase[]", side_effects: [] }
  - { method: POST, path: "/foreclosure-cases/{id}/schedule-sale", description: "Schedule (or re-schedule from SALE_HOLD) a foreclosure sale; min-notice, appeal-window, and 37-day dual-tracking gates", roles: [ForeclosureCounsel], code: 200, input: [sale_date], output: ForeclosureCase, side_effects: ["REFERRED/SALE_HOLD -> SALE_SCHEDULED"] }
  - { method: POST, path: "/foreclosure-cases/{id}/cancel", description: "Cancel a non-terminal foreclosure case", roles: [ForeclosureCounsel], code: 200, input: [], output: ForeclosureCase, side_effects: ["-> CANCELLED", "mirror -> NONE"] }
  - { method: POST, path: "/foreclosure-cases/{id}/complete-sale", description: "Mark the sale held; terminal-locks the loan's workout dimension", roles: [ForeclosureCounsel], code: 200, input: [], output: ForeclosureCase, side_effects: ["SALE_SCHEDULED -> SALE_COMPLETED", "workout transitions now rejected (ERR_LOAN_FORECLOSURE_COMPLETED)"] }

  # --- escrow analysis ---
  - { method: POST, path: "/loans/{id}/escrow-analyses", description: "Create a manual escrow analysis (DRAFT); computation windows must not overlap", roles: [ServicingOps], code: 201, input: [analysis_type, comp_year_start_month, comp_year_months, projected_annual_disbursements_cents], output: EscrowAnalysis, side_effects: ["computed fields per escrow_reanalysis"] }
  - { method: GET, path: "/escrow-analyses/{id}", description: "Fetch an escrow analysis", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: EscrowAnalysis, side_effects: [] }
  - { method: GET, path: "/escrow-analyses", description: "List escrow analyses", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel], code: 200, input: ["loan_id?", "modification_id?", "limit?", "offset?"], output: "EscrowAnalysis[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}/escrow-analyses", description: "List escrow analyses of a loan", roles: [ServicingAdmin, LossMitAgent, Underwriter, AppealReviewer, ServicingOps, ForeclosureCounsel, Borrower], code: 200, input: [], output: "EscrowAnalysis[]", side_effects: [] }
  - { method: POST, path: "/escrow-analyses/{id}/apply", description: "Apply a DRAFT analysis: updates loan escrow monthly, issues surplus refund", roles: [ServicingOps], code: 200, input: [], output: EscrowAnalysis, side_effects: ["Loan.escrow_monthly_cents updated", "refund reduces escrow_balance_cents"] }
  - { method: POST, path: "/escrow-analyses/{id}/void", description: "Void an APPLIED analysis (compensating action); blocked when a later APPLIED analysis exists", roles: [ServicingOps], code: 200, input: [], output: EscrowAnalysis, side_effects: ["restores escrow_monthly and refunded balance"] }

  # --- logical clock (test-driving endpoint) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock to an arbitrary ISO8601 UTC timestamp. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. No sweeps run: all deadline rules (appeal window, offer validity, rescission, sale gates) are evaluated live against the logical clock", roles: [ServicingAdmin], code: 200, input: [to_iso8601], output: null, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # auth / request shape
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, wrong type, or invalid enum member" }
  - { id: ERR_BORROWER_OWNERSHIP, http: 403, condition: "Borrower-role caller acts on a resource chain whose loan.borrower_id != X-User-ID" }
  # existence (404)
  - { id: ERR_BORROWER_NOT_FOUND, http: 404, condition: "No borrower with the given id" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "No loan with the given id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No application with the given id" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "No package document with the given id" }
  - { id: ERR_PROGRAM_OPTION_NOT_FOUND, http: 404, condition: "No program option with the given id" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "No evaluation with the given id" }
  - { id: ERR_TRIAL_PLAN_NOT_FOUND, http: 404, condition: "No trial payment plan with the given id" }
  - { id: ERR_TRIAL_PAYMENT_NOT_FOUND, http: 404, condition: "No trial payment with the given id" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "No permanent modification with the given id" }
  - { id: ERR_DENIAL_NOTICE_NOT_FOUND, http: 404, condition: "No denial notice with the given id" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "No appeal with the given id" }
  - { id: ERR_FORECLOSURE_CASE_NOT_FOUND, http: 404, condition: "No foreclosure case with the given id" }
  - { id: ERR_ESCROW_ANALYSIS_NOT_FOUND, http: 404, condition: "No escrow analysis with the given id" }
  # OCC (412)
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_loan_version != current Loan.version on application create" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version != current LossMitApplication.version on evaluation create" }
  # state (409)
  - { id: ERR_APPLICATION_NOT_COMPLETE, http: 409, condition: "Evaluation requested while application is not COMPLETE_PACKAGE" }
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "Application action not allowed from its current status (acknowledge non-SUBMITTED, withdraw from TRIAL_ACTIVE/TRIAL_PASSED/terminal, etc.)" }
  - { id: ERR_DOCUMENT_ALREADY_RESOLVED, http: 409, condition: "Accept/reject on a document not in SUBMITTED" }
  - { id: ERR_TRIAL_PLAN_NOT_OFFERED, http: 409, condition: "Accept on a plan not OFFERED, or past offer_deadline" }
  - { id: ERR_TRIAL_PLAN_NOT_ACTIVE, http: 409, condition: "Pay/finalize on a plan not ACTIVE" }
  - { id: ERR_TRIAL_PAYMENT_RESOLVED, http: 409, condition: "Pay on a payment not SCHEDULED" }
  - { id: ERR_TRIAL_PLAN_NOT_COMPLETED, http: 409, condition: "Modification create on a trial plan not COMPLETED" }
  - { id: ERR_NOTICE_ALREADY_APPEALED, http: 409, condition: "Appeal submitted against a notice already APPEALED" }
  - { id: ERR_NOTICE_NOT_APPEALABLE_STATE, http: 409, condition: "Appeal submitted against a notice in SUPERSEDED or AFFIRMED" }
  - { id: ERR_APPEAL_ALREADY_DECIDED, http: 409, condition: "Decision on an appeal not SUBMITTED" }
  - { id: ERR_MODIFICATION_STATE_INVALID, http: 409, condition: "Modification action not allowed from its current status" }
  - { id: ERR_ANALYSIS_NOT_DRAFT, http: 409, condition: "Apply on an escrow analysis not DRAFT" }
  - { id: ERR_FORECLOSURE_STATE_INVALID, http: 409, condition: "Foreclosure action not allowed from the case's current status" }
  - { id: ERR_LOAN_FORECLOSURE_COMPLETED, http: 409, condition: "Workout-side action on a loan whose foreclosure_status is SALE_COMPLETED" }
  # business_safety (compliance)
  - { id: ERR_REFERRAL_TOO_EARLY, http: 422, condition: "Foreclosure referral with delinquency_days <= 120 (strictly greater required)" }
  - { id: ERR_DUAL_TRACKING_BLOCKED, http: 422, condition: "Referral or sale scheduling while a blocking-state application with completed_at at least 37 days before the sale date is pending" }
  - { id: ERR_SALE_WITHIN_APPEAL_WINDOW, http: 422, condition: "sale_date falls inside the closed interval [issued_at date, appeal_deadline date] of an ISSUED or APPEALED denial notice" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decision caller's X-User-ID equals the denying notice's underwriter_user_id" }
  # business_temporal
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal submitted after appeal_deadline (issued_at + 14 days, inclusive boundary)" }
  - { id: ERR_APPEAL_NOT_AVAILABLE, http: 422, condition: "Appeal against a notice whose appeal_eligible is false (complete application received less than 90 days before the scheduled sale)" }
  - { id: ERR_SALE_MIN_NOTICE, http: 422, condition: "sale_date earlier than referred_at + 14 days" }
  - { id: ERR_RESCISSION_WINDOW_EXPIRED, http: 422, condition: "Rescind after recorded_at + 3 days" }
  # business_constraint
  - { id: ERR_PROGRAM_RANK_DUPLICATE, http: 409, condition: "Program option created with a waterfall_rank already in use" }
  - { id: ERR_FORECLOSURE_CASE_ACTIVE, http: 409, condition: "Referral while another non-terminal foreclosure case exists for the loan" }
  - { id: ERR_ESCROW_YEAR_OVERLAP, http: 422, condition: "New analysis computation window [start_month, start_month+months) intersects a non-VOIDED/non-CANCELLED analysis window for the same loan (adjacent = allowed)" }
  - { id: ERR_ANALYSIS_VOID_BLOCKED, http: 409, condition: "Void while a later APPLIED (non-VOIDED) analysis exists for the loan" }
  - { id: ERR_INVALID_COMP_MONTHS, http: 422, condition: "comp_year_months != 12 for STANDARD_ANNUAL, or outside 1..12 for POST_MODIFICATION" }
  # business_fiscal
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "Trial payment amount_cents <= 0" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ServicingAdmin
    description: "Servicer platform administrator; seeds borrowers/loans/program options; drives the logical clock"
    identity: opaque
    exclusive_operations: [create_borrower, create_loan, create_program_option, retire_program_option, set_clock]
    shared_operations: [read_any_resource]
  - name: Borrower
    description: "The mortgagor; acts only on resources chained to their own loans"
    identity: "entity_backed:Borrower"
    exclusive_operations: [submit_application, withdraw_application, submit_document, accept_trial_plan, pay_trial_payment, sign_modification, submit_appeal]
    shared_operations: [read_any_resource]
  - name: LossMitAgent
    description: "Loss-mitigation intake specialist; acknowledgment and document determination"
    identity: opaque
    exclusive_operations: [acknowledge_application, accept_document, reject_document]
    shared_operations: [read_any_resource]
  - name: Underwriter
    description: "Runs evaluation waterfalls and issues offers/denials; barred from deciding appeals on own denials"
    identity: opaque
    exclusive_operations: [run_evaluation]
    shared_operations: [read_any_resource]
  - name: AppealReviewer
    description: "Independent appeal decision-maker (segregation of duties vs Underwriter)"
    identity: opaque
    exclusive_operations: [decide_appeal]
    shared_operations: [read_any_resource]
  - name: ServicingOps
    description: "Servicing operations; trial finalize, modification lifecycle, escrow analyses"
    identity: opaque
    exclusive_operations: [finalize_trial_plan, create_modification, send_modification_docs, record_modification, rescind_modification, create_escrow_analysis, apply_escrow_analysis, void_escrow_analysis]
    shared_operations: [read_any_resource]
  - name: ForeclosureCounsel
    description: "Foreclosure counsel; referral and sale lifecycle, subject to dual-tracking gates"
    identity: opaque
    exclusive_operations: [create_foreclosure_case, schedule_sale, cancel_foreclosure_case, complete_sale]
    shared_operations: [read_any_resource]
