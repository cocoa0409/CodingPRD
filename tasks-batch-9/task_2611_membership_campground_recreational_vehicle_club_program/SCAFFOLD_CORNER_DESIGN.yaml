            - "Listing another member's dues invoices: HTTP 403 ERR_NOT_RESOURCE_OWNER — the nested list is scoped by the parent membership's owner, not by the invoice"
            - "Booking against another member's membership: HTTP 403 ERR_NOT_RESOURCE_OWNER — the create path is scoped by body.membership_id, so a stranger cannot burn someone else's entitlement nights"
            - "Cancelling the first member's reservation as the second member: HTTP 403 ERR_NOT_RESOURCE_OWNER, and the reservation is still CONFIRMED"
