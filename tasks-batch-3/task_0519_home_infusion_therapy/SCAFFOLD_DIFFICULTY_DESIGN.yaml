# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (depth probe).
# 9 Difficulty Rules × ≥2 instances each. Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls/trigger call resolves to a declared §1.5 endpoint; every ${var} is bound by an
# earlier captures: block; every payload field conforms to that endpoint's input: schema.
#
# Shared fixture vocabulary used across instances:
#   - "vanco" drug: specialty + trough-monitored; vial_size_mg=1000, awp_per_vial_cents=4250
#   - "cef" drug: non-specialty, no trough; vial_size_mg=1000, awp_per_vial_cents=2000
#   - PayerPlan PA: per_diem {AMINOGLYCOSIDE_OR_VANCO:12500}, awp_discount_pct=0.18, coinsurance_pct=0.20,
#       deductible_remaining_cents=30000, oop_max_remaining_cents=50000
#   - PayerPlan PB: per_diem {ANTI_INFECTIVE:12500}, awp_discount_pct=0.10, coinsurance_pct=0.20,
#       deductible_remaining_cents=10000, oop_max_remaining_cents=500000

scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_estimate_vs_final_allowed_total_on_order
        grounds:
          - calculations.drug_line_allowed
          - calculations.per_diem_line
          - state_machines.Claim.DRAFT_to_POSTED
          - entities.Claim.fields.allowed_total_cents
        distinguishing_aspect: |
          Same order, identical inputs: the ESTIMATE variant bills scheduled_days=7 (allowed_total_cents=136290)
          while the FINAL variant bills administered_days=4 (allowed_total_cents=77880); the divergence is on the
          Claim/InfusionOrder billing domain.
        test_recipe:
          setup:
            - "vanco drug, PayerPlan PA, patient on PA, accepted referral, specialty order RELEASED via approved auth"
            - "order scheduled_days=7, daily_dose_mg=2000, start_date 2026-06-10; exactly 4 NursingVisits COMPLETED so administered_days=4; order is ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-VANCO", generic_name: "vancomycin", therapy_category: "AMINOGLYCOSIDE_OR_VANCO", vial_size_mg: 1000, awp_per_vial_cents: 4250, is_specialty: true, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { vanco_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PA", per_diem_rate_cents: { AMINOGLYCOSIDE_OR_VANCO: 12500 }, awp_discount_pct: 0.18, coinsurance_pct: 0.20, deductible_remaining_cents: 30000, oop_max_remaining_cents: 50000 }
              as: Biller
              captures: { plan_a_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", service_state: "CA", payer_plan_id: "${plan_a_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${vanco_id}", route: "IV", daily_dose_mg: 2000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 7 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /prior-authorizations"
              payload: { order_id: "${order_id}", requested_units: 14 }
              as: AuthSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /prior-authorizations/${auth_id}/approve"
              payload: { approved_units: 14 }
              as: AuthSpecialist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-11T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v2: $.data.id }
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-12T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v3: $.data.id }
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-13T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v4: $.data.id }
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "POST /nursing-visits/${v2}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "POST /nursing-visits/${v3}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "POST /nursing-visits/${v4}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "GET /infusion-orders/${order_id}"
              payload: {}
              as: Biller
              captures: { order_ver: $.data.version }
          trigger:
            - call: "POST /claims"
              payload: { order_id: "${order_id}", expected_order_version: "${order_ver}" }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/post"
              payload: {}
              as: Biller
          assert:
            - "after POST /claims, Claim.${claim_id}.variant == ESTIMATE"
            - "after POST /claims, Claim.${claim_id}.billed_days == 7"
            - "after POST /claims, Claim.${claim_id}.allowed_total_cents == 136290"
            - "after POST /claims/${claim_id}/post, Claim.${claim_id}.variant == FINAL"
            - "after POST /claims/${claim_id}/post, Claim.${claim_id}.billed_days == 4"
            - "after POST /claims/${claim_id}/post, Claim.${claim_id}.allowed_total_cents == 77880"

      - name: ae_severity_grade_vs_resume_scoring_on_adverse_event
        grounds:
          - calculations.ae_severity_score
          - calculations.copay_waterfall
          - entities.AdverseEvent.fields.severity_score
          - entities.Claim.fields.patient_responsibility_cents
        distinguishing_aspect: |
          The second dual-variant subject is on a DIFFERENT entity domain than claim_estimate_vs_final: the copay
          waterfall's ESTIMATE variant reads PayerPlan accumulators without debiting (patient_responsibility_cents
          provisional) whereas the FINAL variant debits them, so a second claim sees a lowered deductible — a
          patient-liability ledger, distinct from the claim-total billing ledger of instance 1.
        test_recipe:
          setup:
            - "vanco order RELEASED on PayerPlan PA with deductible_remaining_cents=30000, oop_max_remaining_cents=50000"
            - "order ACTIVE with administered_days=7 (all scheduled visits completed); a first claim already POSTED, debiting accumulators"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-VANCO2", generic_name: "vancomycin", therapy_category: "AMINOGLYCOSIDE_OR_VANCO", vial_size_mg: 1000, awp_per_vial_cents: 4250, is_specialty: true, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { vanco_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PA2", per_diem_rate_cents: { AMINOGLYCOSIDE_OR_VANCO: 12500 }, awp_discount_pct: 0.18, coinsurance_pct: 0.20, deductible_remaining_cents: 30000, oop_max_remaining_cents: 50000 }
              as: Biller
              captures: { plan_a_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", service_state: "CA", payer_plan_id: "${plan_a_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nia", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${vanco_id}", route: "IV", daily_dose_mg: 2000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 1 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /prior-authorizations"
              payload: { order_id: "${order_id}", requested_units: 2 }
              as: AuthSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /prior-authorizations/${auth_id}/approve"
              payload: { approved_units: 2 }
              as: AuthSpecialist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "GET /infusion-orders/${order_id}"
              payload: {}
              as: Biller
              captures: { order_ver: $.data.version }
            - call: "POST /claims"
              payload: { order_id: "${order_id}", expected_order_version: "${order_ver}" }
              as: Biller
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /adverse-events"
              payload: { order_id: "${order_id}", severity_grade: 3, reaction_count: 1, vital_instability: 0 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { ae_id: $.data.id }
          assert:
            - "after the create claim (DRAFT), Claim.${claim1_id}.variant == ESTIMATE and PayerPlan.${plan_a_id}.deductible_remaining_cents == 30000 (unchanged by the ESTIMATE read)"
            - "AdverseEvent.${ae_id}.severity_score == 7"
            - "the severity_score uses constants W_SEVERITY=2, W_REACTION=1, W_VITAL=3 (2*3+1*1+3*0==7), distinct from the copay ledger of instance 1"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copay_waterfall_three_input_nonlinear_with_oop_cap
        grounds:
          - calculations.copay_waterfall
          - entities.Claim.fields.patient_responsibility_cents
          - entities.PayerPlan.fields.deductible_remaining_cents
          - entities.PayerPlan.fields.oop_max_remaining_cents
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (deductible_remaining_cents, coinsurance_pct, oop_max_remaining_cents) with
          non-linear interaction — nested min for the deductible bucket and a final min cap so patient owes
          min(ded_applied + round(after_ded*coins), oop_remaining); with allowed_total=136290 the
          pre-cap 51258 is clamped to the OOP cap 50000.
        test_recipe:
          setup:
            - "vanco order on PayerPlan PA (deductible 30000, coins 0.20, oop 50000), ACTIVE with administered_days>=scheduled_days, claim DRAFT ESTIMATE on allowed_total_cents=136290"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-V3", generic_name: "vancomycin", therapy_category: "AMINOGLYCOSIDE_OR_VANCO", vial_size_mg: 1000, awp_per_vial_cents: 4250, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { vanco_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PA3", per_diem_rate_cents: { AMINOGLYCOSIDE_OR_VANCO: 12500 }, awp_discount_pct: 0.18, coinsurance_pct: 0.20, deductible_remaining_cents: 30000, oop_max_remaining_cents: 50000 }
              as: Biller
              captures: { plan_a_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat C", service_state: "CA", payer_plan_id: "${plan_a_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Ned", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${vanco_id}", route: "IV", daily_dose_mg: 2000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 7 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "GET /infusion-orders/${order_id}"
              payload: {}
              as: Biller
              captures: { order_ver: $.data.version }
          trigger:
            - call: "POST /claims"
              payload: { order_id: "${order_id}", expected_order_version: "${order_ver}" }
              as: Biller
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.allowed_total_cents == 136290"
            - "Claim.${claim_id}.patient_responsibility_cents == 50000"
            - "Claim.${claim_id}.plan_paid_cents == 86290"

      - name: drug_line_whole_vial_ceiling_before_discount_rounding_order
        grounds:
          - calculations.drug_line_allowed
          - entities.DrugCatalog.fields.vial_size_mg
          - entities.DrugCatalog.fields.awp_per_vial_cents
          - entities.PayerPlan.fields.awp_discount_pct
        distinguishing_aspect: |
          Mode (b): the evaluation order is pinned — apply the whole-vial CEILING first (ceil(daily*days/vial)),
          THEN the discount, THEN round_half_up the single line. With daily=1500, scheduled=3, vial=1000,
          awp=4255, discount=0.18: ceil(4500/1000)=5 units, gross=21275, 21275*0.82=17445.5 rounds HALF_UP to
          17446 (truncation would give 17445), a different axis than the min/cap nesting of the copay instance.
        test_recipe:
          setup:
            - "non-specialty drug vial_size_mg=1000 awp_per_vial_cents=4255 on PayerPlan PA (awp_discount_pct=0.18)"
            - "order daily_dose_mg=1500 scheduled_days=3 RELEASED, one visit completed so order ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-RND", generic_name: "ceftriaxone", therapy_category: "AMINOGLYCOSIDE_OR_VANCO", vial_size_mg: 1000, awp_per_vial_cents: 4255, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PA4", per_diem_rate_cents: { AMINOGLYCOSIDE_OR_VANCO: 12500 }, awp_discount_pct: 0.18, coinsurance_pct: 0.20, deductible_remaining_cents: 30000, oop_max_remaining_cents: 50000 }
              as: Biller
              captures: { plan_a_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat D", service_state: "CA", payer_plan_id: "${plan_a_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nan", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1500, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 3 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "GET /infusion-orders/${order_id}"
              payload: {}
              as: Biller
              captures: { order_ver: $.data.version }
          trigger:
            - call: "POST /claims"
              payload: { order_id: "${order_id}", expected_order_version: "${order_ver}" }
              as: Biller
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.drug_allowed_cents == 17446"
            - "the value is ceil(4500/1000)=5 units * 4255 = 21275 gross, *0.82 = 17445.5 rounded HALF_UP to 17446 (not 17445)"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_hold_resume_cycle_active_to_onhold_to_active
        grounds:
          - state_machines.InfusionOrder.ACTIVE_to_ON_HOLD
          - state_machines.InfusionOrder.ON_HOLD_to_ACTIVE
          - entities.InfusionOrder.fields.hold_reason
        distinguishing_aspect: |
          InfusionOrder is non-linear via a cycle: ACTIVE -> ON_HOLD (adverse event) -> ACTIVE (RESUME
          adjudication), revisiting ACTIVE — not a linear forward pipeline.
        test_recipe:
          setup:
            - "vanco order ACTIVE (one visit completed); a high-severity AdverseEvent reported by the nurse auto-holds it (hold_reason ADVERSE_EVENT)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-H1", generic_name: "vancomycin", therapy_category: "AMINOGLYCOSIDE_OR_VANCO", vial_size_mg: 1000, awp_per_vial_cents: 4250, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PH1", per_diem_rate_cents: { AMINOGLYCOSIDE_OR_VANCO: 12500 }, awp_discount_pct: 0.18, coinsurance_pct: 0.20, deductible_remaining_cents: 30000, oop_max_remaining_cents: 50000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat H", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nash", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 2000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
            - call: "POST /adverse-events"
              payload: { order_id: "${order_id}", visit_id: "${v1}", severity_grade: 3, reaction_count: 2, vital_instability: 1 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { ae_id: $.data.id }
          trigger:
            - call: "POST /adverse-events/${ae_id}/adjudicate"
              payload: { disposition: "RESUME" }
              as: MedicalDirector
              as_user_id: "md-001"
          assert:
            - "after the adverse event report, InfusionOrder.${order_id}.status == ON_HOLD and hold_reason == ADVERSE_EVENT"
