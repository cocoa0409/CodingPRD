            - "${st} == DISQUALIFIED and Volunteer.${v1}.status == DISQUALIFIED"

      - name: roster_submit_below_minimum_rejected
        claim_type: aggregate
        grounds: [errors.ERR_ROSTER_BELOW_MINIMUM, calculations.roster_size_count]
        distinguishing_aspect: "Aggregate validation: 2 individually valid selections are not enough — submit with roster_size 2 fails ERR_ROSTER_BELOW_MINIMUM (minimum 3)."
        test_recipe:
