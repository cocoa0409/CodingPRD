scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: case_create_success_201_and_fields_echoed
        claim_type: creation
        grounds: ["entities.OffboardingCase", "endpoints[POST /offboarding/offboarding-cases]"]
        distinguishing_aspect: "Valid create returns 201 with server-minted UUID id, created_at/updated_at, version=1, status=INTAKE, revocation_posture=NOT_STARTED, asset_posture=NOT_STARTED, deduction_total_cents=0, rehire_code=null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR1", case_type: "TERMINATION", work_state_code: "IL", notice_received_date: "2026-08-03T00:00:00Z", requested_last_day: "2026-08-03T00:00:00Z", pto_balance_hours: 12.5, tenure_years: 3.5, hourly_wage_cents: 7200, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cr1: $.data.id, case_cr1_v: $.data.version }
          assert:
            - "HTTP 201; data.id is a bare UUID (no prefix); version == 1; status == INTAKE; revocation_posture == NOT_STARTED; asset_posture == NOT_STARTED; deduction_total_cents == 0; rehire_code == null; determined_last_day == null (not yet approved)"
      - name: case_get_by_id_returns_stored
        claim_type: retrieval
        grounds: ["endpoints[GET /offboarding/offboarding-cases/{id}]"]
        distinguishing_aspect: "GET returns the same field values written at create."
        test_recipe:
          setup: ["one case exists"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR2", case_type: "RESIGNATION", work_state_code: "WA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 5.0, tenure_years: 0.5, hourly_wage_cents: 3000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cr2: $.data.id }
          trigger:
            - call: "GET /offboarding/offboarding-cases/${case_cr2}"
              payload: {}
              as: HRPartner
          assert:
            - "data.employee_ref == E-CR2; data.work_state_code == WA; data.hourly_wage_cents == 3000; data.status == INTAKE"
      - name: case_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /offboarding/offboarding-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HRPartner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"
      - name: case_create_missing_required_field_400
        claim_type: required_fields
        grounds: ["validations[priority=13]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing hourly_wage_cents in create -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR3", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"
      - name: case_create_invalid_enum_400
        claim_type: type_constraints
        grounds: ["entities.OffboardingCase.fields.case_type"]
        distinguishing_aspect: "case_type=QUIT (not in enum) -> 400 ERR_INVALID_REQUEST; work_state_code=ZZ (unsupported) likewise rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR4", case_type: "QUIT", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"
      - name: case_employee_ref_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.OffboardingCase.fields.employee_ref", "validations[priority=7]"]
        distinguishing_aspect: "Second case with same employee_ref -> 422 ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["one case with employee_ref E-DUP exists"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-DUP", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-DUP", case_type: "TERMINATION", work_state_code: "CA", notice_received_date: "2026-08-02T00:00:00Z", requested_last_day: "2026-08-15T00:00:00Z", pto_balance_hours: 1.0, tenure_years: 2.0, hourly_wage_cents: 6000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_REFERENTIAL_INTEGRITY"
      - name: manager_notification_immutable_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.ManagerNotification"]
        distinguishing_aspect: "ManagerNotification has common_fields:false and no write endpoints; only GET list/sub-resource. Attempting POST to its collection is not declared -> 404/405 by absence; verified via GET-only surface."
        test_recipe:
          setup: ["one case created (emits INTAKE_ALERT)"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-MN1", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_mn1: $.data.id }
          trigger:
            - call: "GET /offboarding/offboarding-cases/${case_mn1}/manager-notifications"
              payload: {}
              as: Manager
              captures: { notif_count: $.data.0.notification_kind }
          assert:
            - "list contains one INTAKE_ALERT row with suppressed == false and a server-stamped sent_at"
      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: ["entities.OffboardingCase.fields.deduction_total_cents"]
        distinguishing_aspect: "Client-supplied deduction_total_cents/status/revocation_posture in create payload is ignored; server values win."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR5", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cr5: $.data.id }
          assert:
            - "data.deduction_total_cents == 0; data.status == INTAKE; data.revocation_posture == NOT_STARTED regardless of any extra client fields"
      - name: system_fields_id_created_at_version
        claim_type: system_fields
        grounds: ["entities.OffboardingCase"]
        distinguishing_aspect: "Client cannot set id/created_at/version; server mints UUID, stamps ISO8601 with 3 fractional digits, version starts 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CR6", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cr6: $.data.id }
          assert:
            - "data.id matches UUID regex without type prefix; data.created_at has exactly 3 fractional second digits; data.version == 1"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: case_close_from_intake_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.OffboardingCase"]
        distinguishing_aspect: "Close from INTAKE (not READY_TO_CLOSE) -> ERR_INVALID_STATE; also OCC would be moot."
        test_recipe:
          setup: ["case in INTAKE"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM1", case_type: "RESIGNATION", work_state_code: "TX", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-14T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm1: $.data.id, case_sm1_v: $.data.version }
          trigger:
            - call: "POST /offboarding/offboarding-cases/${case_sm1}/close"
              payload: { expected_offboarding_case_version: "${case_sm1_v}" }
              as: HRPartner
              as_user_id: "hr-approver-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"
      - name: case_terminal_lockdown_closed
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.OffboardingCase"]
        distinguishing_aspect: "Any transition attempt on a CLOSED case -> ERR_CASE_TERMINAL (or ERR_INVALID_STATE); verified via void after close attempt."
        test_recipe:
          setup:
            - "Full pipeline to CLOSED: CA case approved, one EMAIL task executed+verified, statement calculated+approved+disbursed on time, no assets, no interviews, KT plan waived, rehire review finalized, covenant ack acknowledged"
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sm2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm2}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_sm2: $.data.id }
            - call: "POST /offboarding/benefits-notices"
              payload: { offboarding_case_id: "${case_sm2}", notice_kind: "BENEFITS_TERMINATION" }
              as: BenefitsAdministrator
              captures: { notice_sm2: $.data.id }
            - call: "POST /offboarding/restrictive-covenant-acks"
              payload: { offboarding_case_id: "${case_sm2}", covenant_kind: "CONFIDENTIALITY" }
              as: HRPartner
              captures: { ack_sm2: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_sm2}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
            - call: "POST /offboarding/access-revocation-tasks/${task_sm2}/verify"
              payload: { outcome: "VERIFIED" }
              as: ITVerifier
              as_user_id: "it-ver-1"
            - call: "GET /offboarding/offboarding-cases/${case_sm2}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_sm2: $.data.0.id, stmt_sm2_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_sm2}/calculate"
              payload: { regular_wages_cents: 100000, expected_final_pay_statement_version: "${stmt_sm2_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_sm2}/approve"
              payload: {}
              as: PayrollSpecialist
              as_user_id: "payroll-approver-1"
            - call: "POST /offboarding/final-pay-statements/${stmt_sm2}/disburse"
              payload: {}
              as: PayrollSpecialist
            - call: "GET /offboarding/offboarding-cases/${case_sm2}/knowledge-transfer-plans"
              payload: {}
              as: Manager
              captures: { plan_sm2: $.data.0.id }
            - call: "POST /offboarding/knowledge-transfer-plans/${plan_sm2}/waive"
              payload: { waived_reason: "role eliminated" }
              as: Manager
            - call: "POST /offboarding/benefits-notices/${notice_sm2}/send"
              payload: {}
              as: BenefitsAdministrator
            - call: "POST /offboarding/restrictive-covenant-acks/${ack_sm2}/acknowledge"
              payload: { acknowledgment_text_version: "v2026-1" }
              as: HRPartner
            - call: "GET /offboarding/offboarding-cases/${case_sm2}/rehire-eligibility-reviews"
              payload: {}
              as: HRReviewer
              captures: { review_sm2: $.data.0.id }
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_sm2}/submit"
              payload: { recommended_code: "ELIGIBLE", rationale: "ok" }
              as: HRReviewer
              as_user_id: "hr-reviewer-1"
            - call: "POST /offboarding/rehire-eligibility-reviews/${review_sm2}/finalize"
              payload: {}
              as: HRDirector
              as_user_id: "hr-director-1"
            - call: "GET /offboarding/offboarding-cases/${case_sm2}"
              payload: {}
              as: HRPartner
              captures: { case_sm2_v: $.data.version }
            - call: "POST /offboarding/offboarding-cases/${case_sm2}/close"
              payload: { expected_offboarding_case_version: "${case_sm2_v}" }
              as: HRPartner
              as_user_id: "hr-approver-1"
          trigger:
            - call: "POST /offboarding/offboarding-cases/${case_sm2}/void"
              payload: { void_reason: "late change" }
              as: HRPartner
              as_user_id: "hr-approver-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id in {ERR_INVALID_STATE, ERR_CASE_TERMINAL}; case remains CLOSED"
      - name: double_execute_second_call_rejected
        claim_type: idempotency
        grounds: ["state_machines.AccessRevocationTask.READY_to_EXECUTED"]
        distinguishing_aspect: "Second execute on an already-EXECUTED task -> ERR_INVALID_STATE (not a silent no-op)."
        test_recipe:
          setup: ["CA case approved; EMAIL task READY (clock at DL 17:00); first execute SUCCESS"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM3", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm3: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sm3}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm3}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_sm3: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_sm3}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_sm3}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"
      - name: revoke_ordering_gate_blocks_higher_rank
        claim_type: precondition_enforcement
        grounds: ["state_machines.AccessRevocationTask.PENDING_to_READY", "validations[priority=10]"]
        distinguishing_aspect: "Task with sequence_rank=2 must not become READY while rank-1 sibling is still PENDING/non-terminal; execute on rank 2 -> ERR_SEQUENCE_GATE (or task never READY)."
        test_recipe:
          setup: ["CA case approved; EMAIL rank 1 and VPN rank 2 created; clock at DL 17:00 (only rank 1 should be READY)"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM4", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm4: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sm4}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm4}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_sm4a: $.data.id }
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm4}", system_name: "VPN", sequence_rank: 2 }
              as: ITManager
              captures: { task_sm4b: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_sm4b}/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id in {ERR_SEQUENCE_GATE, ERR_INVALID_STATE} (rank-2 task not READY while rank-1 non-terminal)"
      - name: waive_before_retry_cap_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.AccessRevocationTask.FAILED_to_WAIVED", "validations[priority=10]"]
        distinguishing_aspect: "Waive with retry_count < 3 -> ERR_SEQUENCE_GATE."
        test_recipe:
          setup: ["CA case approved; EMAIL task READY then FAILED once (retry_count=0)"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM5", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm5: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sm5}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm5}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_sm5: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_sm5}/execute"
              payload: { outcome: "FAILED", failure_reason: "first failure" }
              as: ITOperator
              as_user_id: "it-op-1"
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/${task_sm5}/waive"
              payload: { waive_reason: "premature" }
              as: ITManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_SEQUENCE_GATE"
      - name: revoke_retry_cap_exceeded
        claim_type: precondition_enforcement
        grounds: ["validations[priority=9]", "state_machines.AccessRevocationTask.FAILED_to_RETRY_SCHEDULED"]
        distinguishing_aspect: "Fourth retry attempt (retry_count already 3) -> ERR_RETRY_CAP_EXCEEDED."
        test_recipe:
          setup: ["CA case approved; EMAIL task cycled FAILED->retry x3 (retry_count=3, currently FAILED after third re-execution)"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SM6", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sm6: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sm6}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_sm6}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
              captures: { task_sm6: $.data.id }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offboarding/access-revocation-tasks/${task_sm6}/execute"
              payload: { outcome: "FAILED", failure_reason: "f1" }
              as: ITOperator
              as_user_id: "it-op-1"
