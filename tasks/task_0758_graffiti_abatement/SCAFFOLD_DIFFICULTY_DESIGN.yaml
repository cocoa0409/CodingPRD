  - rule_id: boundary_precision_check
    instances:
      - name: hotspot_threshold_third_report_flips_hotspot
        grounds:
          - state_machines.Site.MONITORED_to_HOTSPOT
          - entities.Site.fields.report_count_90d
          - entities.Site.fields.status
        distinguishing_aspect: "The HOTSPOT threshold is >=3 exactly: after two in-window reports the site is only MONITORED; the third report makes report_count_90d==3 and flips status to HOTSPOT. Metric = report count; endpoint = POST /abatement/reports."
        test_recipe:
          setup:
            - "PUBLIC site with two in-window reports already filed (site is MONITORED, report_count_90d==2)."
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "FENCE", severity: "LOW", description: "r1" }
              as: IntakeClerk
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "FENCE", severity: "LOW", description: "r2" }
              as: IntakeClerk
          trigger:
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "MEDIUM", description: "r3" }
              as: IntakeClerk
          assert:
            - "Site.${site_id}.report_count_90d == 3"
            - "Site.${site_id}.status == HOTSPOT"

