      - name: shift_cancel_lowers_operability
        claim_type: cascading_side_effects
        grounds: [state_machines.StaffShift.SCHEDULED_to_CANCELLED, calculations.operability_posture, state_machines.OperatorTruck.OPERABLE_to_RESTRICTED]
