  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: capacity_window_half_open_overlap_semantics
        grounds:
          - validations[priority=7]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.CapacityWindow.fields.window_start
        distinguishing_aspect: |
          CapacityWindow uses HALF-OPEN interval semantics [start, end): a new
          window starting exactly at another's end (2026-07-01 == 2026-07-01) is
          adjacent and ALLOWED, while a straddling window is rejected — different
          interval semantics than the closed-interval asset service window rule.
        test_recipe:
          setup:
            - "Existing window W1 [2026-06-01T00:00:00Z, 2026-07-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 100 }, as: Planner, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /capacity-windows", payload: { label: "W2", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", bay_hours_capacity: 100 }, as: Planner, captures: { w2: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W3", window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-15T00:00:00Z", bay_hours_capacity: 50 }, as: Planner, captures: { err: $.data.error_id } }
          assert:
            - "W2 creation succeeds (201): end-exclusive semantics make [07-01, 08-01) adjacent to [06-01, 07-01)"
            - "W3 creation rejected: error_id == ERR_WINDOW_OVERLAP (straddles W1 end and W2 start)"
            - "Exactly 2 capacity windows exist (GET /capacity-windows total_count == 2)"

      - name: asset_service_window_closed_interval_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_ASSET_WINDOW_OVERLAP]
          - entities.RepairOrder.fields.planned_start_date
        distinguishing_aspect: |
          RepairOrder asset service windows use CLOSED interval semantics
          [start, end] inclusive: a second order whose planned_start_date equals
          the first order's planned_end_date CONFLICTS (turnaround day counts),
          while starting the day after is allowed — different semantics and a
          different resource entity than the capacity-window half-open rule.
        test_recipe:
          setup:
            - "Customer, one GENERAL_VALVE asset; RO1 planned [2026-08-10, 2026-08-20] exists (RECEIVED)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Red River Paper", account_number: "RR-960", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-9601", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
          trigger:
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "OTHER", failure_description: "recheck", intake_priority: "STANDARD", planned_start_date: "2026-08-20", planned_end_date: "2026-08-25", estimated_bay_hours: 4 }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "OTHER", failure_description: "recheck", intake_priority: "STANDARD", planned_start_date: "2026-08-21", planned_end_date: "2026-08-25", estimated_bay_hours: 4 }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
          assert:
            - "RO at [08-20, 08-25] rejected: error_id == ERR_ASSET_WINDOW_OVERLAP (closed interval: 08-20 belongs to both)"
            - "RO at [08-21, 08-25] succeeds (201) with status RECEIVED"
            - "GET /repair-orders?asset_id=${asset} returns exactly 2 non-terminal orders"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: capacity_hours_reserve_release_conservation
        grounds:
          - calculations.bay_hours_reserved
          - state_machines.RepairOrder.QUOTE_IN_PROGRESS_to_AUTHORIZED
          - state_machines.RepairOrder.AUTHORIZED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: CapacityWindow.bay_hours_reserved. Forward action
          (quote approve, +40) paired with its compensating action (repair order
          cancel, -40) leaves the invariant reserved == sum(estimated_bay_hours
          over linked ROs in {AUTHORIZED..COMPLETE}) == 0 — a different conserved
          quantity (bay-hours) than the pool-unit count instance.
        test_recipe:
          setup:
            - "Customer, GENERAL_VALVE asset, window capacity 200 (reserved 0)"
            - "RO with estimated_bay_hours 40 quoted and ISSUED"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Salt Plains Coop", account_number: "SP-970", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "V-9701", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 200 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 40 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 8, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 8, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
          trigger:
            - { call: "GET /capacity-windows/${win}", payload: {}, as: ServiceManager, captures: { r0: $.data.bay_hours_reserved } }
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /capacity-windows/${win}", payload: {}, as: ServiceManager, captures: { r1: $.data.bay_hours_reserved } }
            - { call: "POST /repair-orders/${ro}/cancel", payload: {}, as: IntakeCoordinator }
            - { call: "GET /capacity-windows/${win}", payload: {}, as: ServiceManager, captures: { r2: $.data.bay_hours_reserved, p2: $.data.window_posture } }
          assert:
            - "reserved before approve == 0"
            - "reserved after approve == 40 and RepairOrder.${ro}.status == AUTHORIZED"
            - "reserved after cancel == 0 (compensating action restores the invariant)"
            - "CapacityWindow.${win}.window_posture == NORMAL after release"
            - "Quote.${q}.status == CANCELLED after RO cancellation cascade"

      - name: pool_unit_exchange_conservation
        grounds:
          - calculations.pool_available_count
          - state_machines.PoolUnit.RESERVED_to_ISSUED
          - state_machines.RepairOrder.COMPLETE_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: Customer.pool_available_count (units IN_POOL +
          RESERVED). The exchange cycle issues one unit (-1) and enrolls the
          repaired asset into the pool (+1), returning the count to 1 — a
          different conserved quantity (spare units) than bay-hours.
        test_recipe:
          setup:
            - "Customer pool_program=true; pool unit U1 on asset A1 IN_POOL"
            - "RO for asset A2 (same customer) with exchange_requested=true; U1 RESERVED for RO; quote approved; RO driven to COMPLETE"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Twin Buttes Energy", account_number: "TB-980", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: true }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-9801", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-9802", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /pool-units", payload: { customer_id: "${cust}", asset_id: "${a1}" }, as: IntakeCoordinator, captures: { u1: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a2}", failure_mode: "SEAL_LEAK", failure_description: "leak", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10, exchange_requested: true }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "worn", recommended_action: "REPAIR", estimated_labor_hours: 2, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /pool-units/${u1}/reserve", payload: { repair_order_id: "${ro}" }, as: IntakeCoordinator }
            - { call: "POST /quotes/${q}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 100, reference_value: 100 } ] }, as: Technician }
          trigger:
            - { call: "GET /customers/${cust}", payload: {}, as: ServiceManager, captures: { n0: $.data.pool_available_count } }
            - { call: "POST /repair-orders/${ro}/close", payload: {}, as: IntakeCoordinator }
            - { call: "GET /pool-units/${u1}", payload: {}, as: ServiceManager, captures: { u1_status: $.data.pool_status } }
            - { call: "GET /pool-units?asset_id=${a2}", payload: {}, as: ServiceManager, captures: { new_unit_status: "$.data[0].pool_status" } }
            - { call: "GET /customers/${cust}", payload: {}, as: ServiceManager, captures: { n1: $.data.pool_available_count } }
          assert:
            - "pool_available_count before close == 1 (RESERVED unit still counts)"
            - "after close: PoolUnit.${u1}.pool_status == ISSUED"
            - "a new PoolUnit exists with asset_id == ${a2} and pool_status == IN_POOL (replenishment)"
            - "pool_available_count after close == 1 (issue -1 paired with replenishment +1 conserves the count)"
            - "RepairOrder.${ro}.status == CLOSED and repair_outcome == FIRST_TIME_FIX"
