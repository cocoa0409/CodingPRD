            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 1 }, as: QualityInspector, as_user_id: "${qi}", captures: { r1: $.data.result } }
            - { call: "POST /plant/harness-units/${u1}/complete-rework", payload: {}, as: LineOperator, as_user_id: "${lo}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 11.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { r2: $.data.result } }
            - { call: "POST /plant/harness-units/${u1}/complete-rework", payload: {}, as: LineOperator, as_user_id: "${lo}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}" }
