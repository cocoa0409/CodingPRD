            - "Review.${r1_id}.current_sheet_round is still 1 and scored_at is unchanged"

      - name: cancelling_a_completed_session_returns_the_hours_ledger_and_the_plan_state
        grounds:
          - state_machines.RetrainingSession.COMPLETED_to_CANCELLED
          - state_machines.CoachingPlan.VERIFIED_to_IN_PROGRESS
          - calculations.coaching_plan_credited_hours
          - calculations.remediation_hours_ledger
        distinguishing_aspect: |
          The completion bubbled the plan up to VERIFIED and removed its hours from the dispatcher's
          owed ledger; the cancellation must push the plan back down to IN_PROGRESS, clear
          verified_at, return credited_hours to exactly 0.00 and put the full requirement back into
          remediation_hours_owed. Because credited_hours is a full recompute over the COMPLETED set
          rather than an incremental decrement, the round trip leaves no residue.
        test_recipe:
          setup:
            - "Program with one APPROVED MPDS_CARDSET version and hours_owed_restriction_threshold 6.0."
            - "Dispatcher D1 with a MANUAL ADVISORY plan (required_hours 2.0) and one SCHEDULED session on 2026-08-15 09:00-11:00 (2.00 h)."
            - "Clock 2026-08-20T00:00:00Z, so the session may be completed."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Zephyr EMD QA", accreditation_body: "IAED", hours_owed_restriction_threshold: 6.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-P01", full_name: "Bea Nkemdirim" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${d1_id}", expected_dispatcher_version: "${d1_v}", severity: "ADVISORY", focus_area: "FINAL_CODING" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { plan_id: $.data.id }
            - call: "POST /coaching-plans/${plan_id}/retraining-sessions"
              payload: { protocol_version_id: "${pv_id}", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T11:00:00Z", modality: "ONE_ON_ONE" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sess_id: $.data.id }
            - call: "POST /retraining-sessions/${sess_id}/complete"
              payload: { attendance_confirmed: true }
              as: QaSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /retraining-sessions/${sess_id}/cancel"
              payload: { cancel_reason: "ATTENDANCE_DISPUTED" }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "Before the trigger: RetrainingSession.${sess_id}.status == COMPLETED with duration_hours 2.00 and completed_at 2026-08-20T00:00:00Z; CoachingPlan.${plan_id}.credited_hours == 2.00, status == VERIFIED, verified_at == 2026-08-20T00:00:00Z; Dispatcher.${d1_id}.remediation_hours_owed == 0.00"
            - "After the trigger: RetrainingSession.${sess_id}.status == CANCELLED, completed_at == null, cancel_reason == ATTENDANCE_DISPUTED, duration_hours still 2.00"
            - "CoachingPlan.${plan_id}.credited_hours == 0.00 (exactly the pre-completion value, recomputed over an empty COMPLETED set)"
            - "CoachingPlan.${plan_id}.status == IN_PROGRESS and verified_at == null"
            - "Dispatcher.${d1_id}.remediation_hours_owed == 2.00 and dispatch_privilege == FULL (2.00 is not above the 6.0 threshold)"
            - "GET /coaching-plans/${plan_id}/retraining-sessions returns exactly 1 element (the cancelled session is retained, not deleted)"

      - name: voiding_a_selected_review_returns_the_sample_slot_and_the_call
        grounds:
          - state_machines.Review.SELECTED_to_VOIDED
          - calculations.sampling_period_counters
          - validations.priority_70_business_constraint.ERR_CALL_ALREADY_SELECTED
          - validations.priority_75_business_fiscal.ERR_SAMPLE_QUOTA_FILLED
        distinguishing_aspect: |
          Sample-slot conservation: a targeted selection consumes a quota slot and marks the call
          SELECTED; voiding the review must return both, so that the very same CallRecord can be
          targeted again into a brand-new Review. The quota counter is a recompute that excludes
          VOIDED reviews, so the round trip is exact and the second Review is a distinct row with
          its own id while the CallRecord's own version history keeps growing.
        test_recipe:
          setup:
            - "Program with one APPROVED MPDS_CARDSET version; clock 2026-08-20T00:00:00Z."
            - "One dispatcher with two CHEST_PAIN calls; a TARGETED period [2026-08-01, 2026-09-01) with target_sample_count 1."
            - "The first call is targeted, filling the quota."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Alder EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-Q01", full_name: "Cyrus Delacroix" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-Q001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-Q002", call_type: "CHEST_PAIN", received_at: "2026-08-06T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c2_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /reviews/${r1_id}/void"
              payload: { void_reason: "WRONG_DISPATCHER" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "SENTINEL_FLAG" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r2_id: $.data.id }
          assert:
            - "Before the trigger: SamplingPeriod.${sp_id}.selected_review_count == 1, CallRecord.${c1_id}.status == SELECTED, and re-targeting ${c1_id} returns 409 ERR_CALL_ALREADY_SELECTED while targeting ${c2_id} returns 422 ERR_SAMPLE_QUOTA_FILLED"
            - "After the void: Review.${r1_id}.status == VOIDED with void_reason WRONG_DISPATCHER, CallRecord.${c1_id}.status == INGESTED, SamplingPeriod.${sp_id}.selected_review_count == 0"
            - "The re-target of ${c1_id} returns 201 and Review.${r2_id}.id != ${r1_id}, with status SELECTED, selection_mode TARGETED, selection_reason SENTINEL_FLAG, current_sheet_round 0"
            - "Review.${r2_id}.protocol_version_id == ${pv_id} (the pin is recomputed from the call's received_at, not copied from the voided review)"
            - "SamplingPeriod.${sp_id}.selected_review_count == 1 again and GET /reviews?sampling_period_id=${sp_id} returns 2 elements, one VOIDED and one SELECTED"
            - "GET /reviews?sampling_period_id=${sp_id}&status=SELECTED returns exactly 1 element, ${r2_id}"
