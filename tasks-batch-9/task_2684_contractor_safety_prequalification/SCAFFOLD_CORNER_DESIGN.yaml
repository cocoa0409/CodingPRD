            - "missing X-User-ID against an unknown contractor id: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED - priority 1 precedes the priority-5 path-id resolution, so no 404 is returned"
            - "missing X-User-Role: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and no Prequalification row created"
