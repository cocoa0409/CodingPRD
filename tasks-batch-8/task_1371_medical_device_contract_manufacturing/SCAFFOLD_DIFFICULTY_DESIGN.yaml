  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: supplier_audit_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
          - entities.SupplierAudit.fields.scheduled_start
        distinguishing_aspect: |
          Resource Supplier, half-open interval semantics: audit B starting exactly at audit A's end
          (09-12T00:00 == 09-12T00:00) is ALLOWED (adjacency, [start,end) ), while C starting one hour
          before A's end overlaps and is rejected. A cancelled audit frees its window.
        test_recipe:
          setup:
            - "supplier SUP-AU QUALIFIED with ACTIVE agreement (audit_notice_days 30); clock 2026-08-01"
            - "audit AUD-A SCHEDULED [2026-09-10, 2026-09-12)"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-AU", name: "Audit Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-AU", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_a: "$.data.id" } }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-12T00:00:00Z", scheduled_end: "2026-09-13T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_b: "$.data.id" } }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-11T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /api/supplier-audits/${aud_b}/cancel", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-12T00:00:00Z", scheduled_end: "2026-09-13T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_d: "$.data.id" } }
          assert:
            - "audit B adjacent at A's end (start == 2026-09-12T00:00:00Z): created (201) — half-open semantics permit touching"
            - "audit C overlapping A (start 2026-09-11): 409 error_id == ERR_AUDIT_WINDOW_OVERLAP"
            - "after cancelling B, the same window is free: audit D created (201)"

      - name: line_window_changeover_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - entities.ManufacturingLine.fields.changeover_buffer_hours
        distinguishing_aspect: |
          Resource ManufacturingLine, buffered-interval semantics: protocol windows on the same line
          must be separated by >= changeover_buffer_hours (24h) — a gap of exactly 24h is allowed but
          12h is rejected, i.e. plain adjacency (gap 0) is forbidden, unlike the audit half-open rule.
        test_recipe:
          setup:
            - "line L-BF (buffer 24h); DMR DEV-BF rev A APPROVED; protocol VP-BF1 occupies [2026-09-01, 2026-09-05]"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-BF", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-BF", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-BF1", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-05T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-BF2", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-06T00:00:00Z", planned_end: "2026-09-08T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { p2: "$.data.id" } }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-BF3", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-05T12:00:00Z", planned_end: "2026-09-07T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err_conflict: "$.data.error_id" } }
          assert:
            - "VP-BF2 with gap exactly == 24h buffer (2026-09-06 vs 2026-09-05): created (201)"
            - "VP-BF3 with gap 12h < buffer: 409 error_id == ERR_LINE_WINDOW_CONFLICT"
            - "VP-BF2 remains DRAFT and occupies its window (subsequent conflicting creates keep failing)"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_quantity_mass_balance
        grounds:
          - entities.SupplierPart.fields.quantity_received
          - entities.SupplierPart.fields.quantity_remaining
          - entities.SupplierPart.fields.quantity_committed
          - entities.SupplierPart.fields.quantity_in_released_lots
          - entities.SupplierPart.fields.quantity_in_scrapped_lots
          - state_machines.DeviceLot
        distinguishing_aspect: |
          Conserved quantity: physical component units. Forward/compensating pairs commit(+) / delete(-)
          and release / scrap move units between buckets such that received == remaining + committed +
          in_released + in_scrapped holds after every step: pinned end state 1000 == 750 + 0 + 200 + 50.
        test_recipe:
          setup:
            - "supplier SUP-MB QUALIFIED; part PN-MB received 1000; DMR DEV-MB APPROVED; protocol VP-MB VALIDATED"
            - "lot LT-MB1 (IN_PRODUCTION, component 100), lot LT-MB2 (component 200)"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-MB", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-MB", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-MB", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-MB", name: "MassBalance" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-MB", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-MB", description: "chip", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 1000 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-MB1", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot1_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot1_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 100, supplier_lot_number: "SL-MB1" }, as: ProductionOperator, as_user_id: "po-1", captures: { comp1_id: "$.data.id" } }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-MB2", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot2_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot2_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 200, supplier_lot_number: "SL-MB2" }, as: ProductionOperator, as_user_id: "po-1" }
          trigger:
            - { call: "POST /api/device-lots/${lot2_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot2_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot2_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl2_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl2_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/udi-labels/${lbl2_id}/print", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot2_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "DELETE /api/lot-components/${comp1_id}", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot1_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 50, supplier_lot_number: "SL-MB1B" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot1_id}/scrap", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/supplier-parts/${part_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { q_recv: "$.data.quantity_received", q_rem: "$.data.quantity_remaining", q_com: "$.data.quantity_committed", q_rel: "$.data.quantity_in_released_lots", q_scr: "$.data.quantity_in_scrapped_lots" } }
          assert:
            - "SupplierPart.${part_id}.quantity_received == 1000"
            - "quantity_remaining == 750 (1000 - 100 committed - 200 released + 100 restored by delete - 50 committed)"
            - "quantity_committed == 0 (lot1 scrapped, lot2 released)"
            - "quantity_in_released_lots == 200 (lot2 release)"
            - "quantity_in_scrapped_lots == 50 (lot1 scrap)"
            - "invariant: 750 + 0 + 200 + 50 == 1000 (component units conserved through commit/delete/release/scrap)"

      - name: supplier_penalty_reversal_zero_drift
        grounds:
          - calculations.supplier_quality_score
          - state_machines.NonconformanceReport.DISPOSITIONED_to_OPEN
          - entities.Supplier.fields.applied_penalty_points
        distinguishing_aspect: |
          Conserved quantity: quality-score points — quality_score + applied_penalty_points == 100 at
          all times. Dispositioning fault=SUPPLIER applies 15; reopening reverses exactly those 15;
          re-dispositioning fault=INTERNAL applies nothing. No drift after the forward+compensate round.
        test_recipe:
          setup:
            - "supplier SUP-PD QUALIFIED; part PN-PD; NCR-PD (MAJOR) CONTAINED"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-PD", name: "Pendulum" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-PD", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-PD", description: "spring", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports", payload: { ncr_code: "NCR-PD", description: "spring fatigue", severity: "MAJOR", supplier_part_id: "${part_id}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ncr_id: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
          trigger:
            - { call: "POST /api/nonconformance-reports/${ncr_id}/disposition", payload: { disposition: "RETURN_TO_SUPPLIER", fault: "SUPPLIER" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score_fwd: "$.data.quality_score", pen_fwd: "$.data.applied_penalty_points" } }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/reopen", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score_rev: "$.data.quality_score", pen_rev: "$.data.applied_penalty_points" } }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/disposition", payload: { disposition: "USE_AS_IS", fault: "INTERNAL" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score_end: "$.data.quality_score", pen_end: "$.data.applied_penalty_points" } }
          assert:
            - "after SUPPLIER disposition: quality_score == 85 and applied_penalty_points == 15 (invariant 85+15 == 100)"
            - "after reopen: quality_score == 100 and applied_penalty_points == 0 (exact reversal, no drift)"
            - "after INTERNAL re-disposition: quality_score == 100 and applied_penalty_points == 0 (no penalty for internal fault)"
            - "NonconformanceReport.${ncr_id} after reopen has fault == UNDETERMINED and disposition == NONE"
