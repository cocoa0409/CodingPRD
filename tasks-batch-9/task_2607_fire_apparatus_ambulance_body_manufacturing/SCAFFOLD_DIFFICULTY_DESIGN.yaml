              captures: { u_rear_over_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 5809, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { u_front_over_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 15920, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { u_gvwr_eq_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 15919, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
