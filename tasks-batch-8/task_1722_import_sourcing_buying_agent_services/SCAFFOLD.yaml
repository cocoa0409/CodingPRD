# =============================================================================
# Task 1722 — Import Sourcing & Buying-Agent Services (import buying agent)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Import Sourcing & Buying-Agent Services (import buying agent): factory
  identification & audit scoring, sample development & approval cycle, price
  negotiation & commission structure, purchase-order placement & production
  milestone monitoring, inspection (pre-shipment/during) & AQL result, shipment
  booking & document handoff, quality claim & chargeback to factory, compliance
  (social/testing) documentation.

domain_name: import-buying-agent
api_prefix: /sourcing

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer company name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 buyer country" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Chargeback credits received from approved quality claims; zero-sum counterpart of Factory.debit_balance_cents" }
      - { name: ytd_gmv_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents of this buyer's PurchaseOrders whose status is in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED, CLOSED}, restricted to POs whose created_at falls in the calendar year of the current logical clock" }
      - { name: status, type: enum, source: system, description: "ACTIVE", constraints: "Always ACTIVE in v1 (no close transition exposed)" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agent (buying-agent employee) full name" }
      - { name: agency_name, type: string, source: input, description: "Agency firm the agent works for" }
      - { name: commission_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of final_commission_cents of PurchaseOrders (status CLOSED) assigned to this agent, calendar-year scoped like Buyer.ytd_gmv_cents" }

  - name: Factory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Factory legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 factory country" }
      - { name: monthly_capacity_units, type: integer, source: input, description: "Maximum committed units per calendar delivery month across all POs; must be >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE at creation; SUSPENDED by chargeback cascade" }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | NON_COMPLIANT; derived from required ComplianceDocuments for the product categories of this factory's non-terminal PurchaseOrders" }
      - { name: debit_balance_cents, type: integer, source: computed, default: 0, description: "Cumulative approved chargebacks owed to buyers; drives SUSPENSION_THRESHOLD breach" }
      - { name: latest_audit_grade, type: enum, source: computed, default: "NONE", description: "A | B | C | D | NONE; set from the most recently APPROVED ONSITE FactoryAudit (by approved_at, tie-break created_at ASC)" }
      - { name: audit_score, type: integer, source: computed, default: 0, description: "Integer score of the most recently APPROVED ONSITE FactoryAudit; 0 when none" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Inspector full name" }
      - { name: region, type: string, source: input, description: "Operating region label" }

  - name: FactoryAudit
    parent: null
    common_fields: true
    fields:
      - { name: factory_id, type: string, source: input, description: "FK -> Factory.id; audited factory" }
      - { name: conducted_by_agent_id, type: string, source: system, description: "FK -> Agent.id; taken from X-User-ID of the creating SourcingAgent" }
      - { name: audit_type, type: enum, source: input, description: "SCREENING | ONSITE" }
      - { name: quality_system_score, type: integer, source: input, description: "0..100 category score" }
      - { name: social_compliance_score, type: integer, source: input, description: "0..100 category score" }
      - { name: production_capability_score, type: integer, source: input, description: "0..100 category score" }
      - { name: financial_stability_score, type: integer, source: input, description: "0..100 category score" }
      - { name: critical_findings, type: integer, source: input, default: 0, description: "Count of critical findings; each deducts CRITICAL_FINDING_DEDUCTION points on the ONSITE variant only" }
      - { name: score, type: integer, source: computed, description: "Weighted integer score per audit_score calculation (variant keyed on audit_type)" }
      - { name: grade, type: enum, source: computed, description: "A | B | C | D derived from score bands: A>=85, B>=70, C>=50, D<50" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of APPROVED transition; null until approved" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REJECTED" }

  - name: ComplianceDocument
    parent: null
    common_fields: true
    fields:
      - { name: factory_id, type: string, source: input, description: "FK -> Factory.id; owning factory" }
      - { name: doc_type, type: enum, source: input, description: "SOCIAL_AUDIT | PRODUCT_TEST | LAB_TEST | FIRE_SAFETY" }
      - { name: issued_date, type: string, source: input, description: "ISO 8601 date of issue" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; doc becomes EXPIRED when logical clock passes it" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED | REJECTED; VERIFIED -> EXPIRED (system sweep on clock advance)" }

  - name: SourcingRequest
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; taken from X-User-ID of the creating BuyerManager" }
      - { name: assigned_agent_id, type: string, source: input, description: "FK -> Agent.id; agent owning this engagement" }
      - { name: title, type: string, source: input, description: "Product brief title" }
      - { name: product_category, type: enum, source: input, description: "APPAREL | ELECTRONICS | TOYS | FURNITURE; drives required compliance doc types" }
      - { name: target_price_cents, type: integer, source: input, description: "Buyer target unit price" }
      - { name: quantity, type: integer, source: input, description: "Intended order quantity; must be >= 1" }
      - { name: commission_mode, type: enum, source: input, description: "FOB | CIF; selects commission base variant" }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_PROGRESS -> PO_PLACED -> COMPLETED | CANCELLED" }

  - name: Sample
    parent: null
    common_fields: true
    fields:
      - { name: sourcing_request_id, type: string, source: input, description: "FK -> SourcingRequest.id" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of resubmissions; incremented on each resubmit; REVISION_CAP = 3" }
      - { name: notes, type: string, source: input, description: "Free-text sample notes" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REVISION_REQUESTED; REVISION_REQUESTED -> SUBMITTED (resubmit) | REJECTED (terminal at cap)" }

  - name: Quotation
    parent: null
    common_fields: true
    fields:
      - { name: sourcing_request_id, type: string, source: input, description: "FK -> SourcingRequest.id" }
      - { name: factory_id, type: string, source: system, description: "FK -> Factory.id; taken from X-User-ID of the creating FactoryRep" }
      - { name: unit_price_cents, type: integer, source: input, description: "Offered unit price; refreshed on each counter" }
      - { name: moq, type: integer, source: input, description: "Minimum order quantity" }
      - { name: lead_time_days, type: integer, source: input, description: "Promised production lead time" }
      - { name: valid_until, type: datetime, source: input, description: "Offer expiry instant; accept after this -> ERR_QUOTATION_EXPIRED" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of counter-offers exchanged; NEGOTIATION_ROUND_CAP = 6" }
      - { name: last_actor_role, type: enum, source: system, description: "FACTORY | BUYER; whose turn produced the current terms (FACTORY on create)" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; set on accept; null until then" }
      - { name: status, type: enum, source: system, description: "OPEN -> COUNTERED -> OPEN -> ... -> ACCEPTED | REJECTED | EXPIRED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: quotation_id, type: string, source: system, description: "FK -> Quotation.id; source quotation" }
      - { name: sourcing_request_id, type: string, source: system, description: "FK -> SourcingRequest.id; copied from quotation" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; copied from sourcing request" }
      - { name: factory_id, type: string, source: system, description: "FK -> Factory.id; copied from quotation" }
      - { name: assigned_agent_id, type: string, source: system, description: "FK -> Agent.id; copied from sourcing request" }
      - { name: ordered_qty, type: integer, source: input, description: "Ordered units (from accept; amendable); must be >= quotation.moq" }
      - { name: unit_price_cents, type: integer, source: system, description: "Accepted unit price from quotation; amendable" }
      - { name: total_cents, type: integer, source: computed, description: "= ordered_qty * unit_price_cents (exact integer cents)" }
      - { name: delivery_month, type: string, source: input, description: "YYYY-MM committed delivery month; capacity-bucket key" }
      - { name: freight_cents, type: integer, source: input, default: 0, description: "Freight amount used by CIF commission base" }
      - { name: insurance_cents, type: integer, source: input, default: 0, description: "Insurance amount used by CIF commission base" }
      - { name: shipped_qty, type: integer, source: system, default: 0, description: "Sum of shipped_qty over this PO's Shipments with status in {BOOKED, DOCS_HANDED_OVER, DELIVERED}" }
      - { name: cancelled_qty, type: integer, source: system, default: 0, description: "Units released by cancel or amend-down beyond shipped" }
      - { name: open_qty, type: integer, source: computed, description: "= ordered_qty - shipped_qty - cancelled_qty; invariant ordered == shipped + cancelled + open" }
      - { name: milestone_plan_locked, type: boolean, source: system, default: false, description: "True once milestone weights sum to exactly 100" }
      - { name: progress_pct, type: integer, source: computed, default: 0, description: "Sum of weight_pct over VERIFIED milestones" }
      - { name: production_status, type: enum, source: system, description: "PLACED -> IN_PRODUCTION -> PRODUCTION_COMPLETE (parallel dimension 1)" }
      - { name: latest_psi_result, type: enum, source: computed, default: "NONE", description: "NONE | PASSED | FAILED; result of the latest RESULT_RECORDED PSI inspection by updated_at DESC, tie-break created_at DESC (parallel dimension 2)" }
      - { name: document_status, type: enum, source: system, description: "PENDING -> HANDED_OVER (parallel dimension 3; flips when any shipment reaches DOCS_HANDED_OVER)" }
      - { name: ship_blocked, type: boolean, source: computed, default: false, description: "True when factory compliance_posture is NON_COMPLIANT; recomputed on posture change" }
      - { name: provisional_commission_cents, type: integer, source: computed, description: "Commission computed at PO creation (provisional variant)" }
      - { name: final_commission_cents, type: integer, source: computed, description: "Commission recomputed at PO close (final variant); null until CLOSED" }
      - { name: commission_rate_bp, type: integer, source: computed, description: "Basis-point tier rate applied at last commission computation (500 | 400 | 300)" }
      - { name: remaining_payable_cents, type: integer, source: computed, description: "= total_cents - sum of total_chargeback_cents over this PO's APPROVED QualityClaims" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PARTIALLY_SHIPPED -> SHIPPED -> CLOSED | CANCELLED" }

  - name: ProductionMilestone
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: name, type: string, source: input, description: "Milestone label (e.g., CUTTING, SEWING, PACKING)" }
      - { name: weight_pct, type: integer, source: input, description: "1..100; plan locks when the PO's milestone weights sum to exactly 100" }
      - { name: evidence_note, type: string, source: input, description: "Factory-submitted evidence text on submit" }
      - { name: status, type: enum, source: system, description: "PLANNED -> SUBMITTED -> VERIFIED | REJECTED; REJECTED -> SUBMITTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: inspection_type, type: enum, source: input, description: "DUPRO | PSI" }
      - { name: scheduled_date, type: string, source: input, description: "ISO 8601 date of the inspection window start" }
      - { name: duration_days, type: integer, source: input, description: "1..5; window is half-open [scheduled_date, scheduled_date + duration_days)" }
      - { name: lot_size, type: integer, source: input, description: "Units presented for inspection; drives sample_size via AQL table" }
      - { name: sample_size, type: integer, source: computed, description: "AQL code-letter sample size from lot_size" }
      - { name: defects_critical, type: integer, source: input, description: "Critical defects found (recorded at result)" }
      - { name: defects_major, type: integer, source: input, description: "Major defects found" }
      - { name: defects_minor, type: integer, source: input, description: "Minor defects found" }
      - { name: result, type: enum, source: computed, default: "NONE", description: "NONE | PASSED | FAILED per aql_result calculation" }
      - { name: status, type: enum, source: system, description: "BOOKED -> RESULT_RECORDED | CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: shipped_qty, type: integer, source: input, description: "Units booked onto this shipment; 1..po.open_qty" }
      - { name: vessel_ref, type: string, source: input, description: "Booking/vessel reference" }
      - { name: doc_refs, type: array, source: input, description: "Document references handed over (B/L, packing list, COO)" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of confirm-receipt; null until then" }
      - { name: status, type: enum, source: system, description: "BOOKED -> DOCS_HANDED_OVER -> DELIVERED | CANCELLED" }

  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: filed_by_buyer_id, type: string, source: system, description: "FK -> Buyer.id; taken from X-User-ID of the filing BuyerManager" }
      - { name: items, type: array, source: input, description: "Claim lines: [{ description, qty_defective, unit_price_cents }]; qty_defective >= 1, unit_price_cents >= 1" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Sum over items of qty_defective * unit_price_cents (exact)" }
      - { name: defective_qty, type: integer, source: computed, description: "Sum over items of qty_defective" }
      - { name: defect_rate, type: number, source: computed, description: "round_half_up(defective_qty / po.ordered_qty, 4 decimal places)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Per-line penalty sum per chargeback calculation; 0 until APPROVED" }
      - { name: total_chargeback_cents, type: integer, source: computed, description: "base_amount_cents + penalty_cents; 0 until APPROVED" }
      - { name: approved_by_agent_id, type: string, source: system, description: "FK -> Agent.id; adjudicating agent (must differ from po.assigned_agent_id); null until decided" }
      - { name: status, type: enum, source: system, description: "FILED -> APPROVED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FactoryAudit
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sourcing/audits/{auditId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Audit must be SUBMITTED (ERR_AUDIT_NOT_REVIEWABLE)"
        side_effects:
          - "approved_at = current logical clock"
          - "If audit_type == ONSITE: factory.latest_audit_grade = this.grade, factory.audit_score = this.score (selection: latest APPROVED ONSITE audit by approved_at, tie-break created_at ASC)"
          - "increments Factory.version by 1 when factory grade/score fields are updated"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sourcing/audits/{auditId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Audit must be SUBMITTED (ERR_AUDIT_NOT_REVIEWABLE)"
        side_effects: []

  - entity: ComplianceDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /sourcing/compliance-documents/{docId}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "Document must be SUBMITTED (ERR_DOC_NOT_VERIFIABLE)"
        side_effects:
          - "Recompute factory.compliance_posture (compliance_posture calculation)"
          - "If posture flipped to COMPLIANT: set ship_blocked = false on every PO of this factory with status in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED}"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sourcing/compliance-documents/{docId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Document must be SUBMITTED (ERR_DOC_NOT_VERIFIABLE)"
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (clock sweep inside POST /sourcing/_clock/set_current_utc when expires_at < new clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute factory.compliance_posture; if it flips to NON_COMPLIANT, set ship_blocked = true on every PO of this factory with status in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED} (cascade: document -> factory posture -> PO ship gate)"

  - entity: SourcingRequest
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "system (first Sample created OR first Quotation created under this request)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: PO_PLACED
        trigger: "system (a Quotation of this request reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PO_PLACED
        to: COMPLETED
        trigger: "system (the PurchaseOrder created from this request reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sourcing/sourcing-requests/{srId}/cancel"
        actor: BuyerManager
        preconditions:
          - "Caller owns the request (buyer_id == X-User-ID, ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "Status must be OPEN or IN_PROGRESS (ERR_SR_NOT_CANCELLABLE)"
        side_effects:
          - "All non-terminal Samples (SUBMITTED, REVISION_REQUESTED) -> REJECTED"
          - "All non-terminal Quotations (OPEN, COUNTERED) -> REJECTED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /sourcing/sourcing-requests/{srId}/cancel"
        actor: BuyerManager
        preconditions:
          - "Caller owns the request (buyer_id == X-User-ID)"
          - "Status must be OPEN or IN_PROGRESS"
        side_effects:
          - "All non-terminal Samples (SUBMITTED, REVISION_REQUESTED) -> REJECTED"
          - "All non-terminal Quotations (OPEN, COUNTERED) -> REJECTED"

  - entity: Sample
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sourcing/samples/{sampleId}/review with decision=APPROVE"
        actor: BuyerManager
        preconditions:
          - "Sample must be SUBMITTED (ERR_SAMPLE_NOT_REVIEWABLE)"
          - "Caller owns the parent SourcingRequest (buyer_id == X-User-ID)"
          - "SourcingRequest status must be OPEN or IN_PROGRESS (ERR_SR_NOT_ACTIVE)"
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /sourcing/samples/{sampleId}/review with decision=REQUEST_REVISION and revision_count < REVISION_CAP (3)"
        actor: BuyerManager
        preconditions:
          - "Sample must be SUBMITTED (ERR_SAMPLE_NOT_REVIEWABLE)"
          - "Caller owns the parent SourcingRequest"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sourcing/samples/{sampleId}/review with decision=REQUEST_REVISION and revision_count == REVISION_CAP (3)"
        actor: BuyerManager
        preconditions:
          - "Sample must be SUBMITTED"
          - "revision_count == 3 (boundary: the 4th revision request is refused and the sample is terminally rejected)"
        side_effects:
          - "Sample -> REJECTED (terminal); review call succeeds with 200 and the sample body shows status REJECTED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /sourcing/samples/{sampleId}/resubmit"
        actor: SourcingAgent
        preconditions:
          - "Sample must be REVISION_REQUESTED (ERR_SAMPLE_NOT_RESUBMITTABLE)"
          - "Caller is the SourcingRequest.assigned_agent_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
        side_effects:
          - "revision_count += 1"

  - entity: Quotation
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /sourcing/quotations/{quotationId}/counter"
        actor: BuyerManager | FactoryRep
        preconditions:
          - "Quotation status must be OPEN or COUNTERED (ERR_QUOTATION_NOT_OPEN)"
          - "expected_quotation_version must equal current version (ERR_STALE_VERSION, 412)"
          - "Actor must be the side that did NOT set current terms: last_actor_role FACTORY -> only BuyerManager may counter; BUYER -> only FactoryRep (ERR_WRONG_COUNTER_PARTY)"
          - "BuyerManager caller must own the SourcingRequest; FactoryRep caller must belong to quotation.factory_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "round_count < NEGOTIATION_ROUND_CAP (6) (ERR_NEGOTIATION_ROUND_EXCEEDED)"
          - "current logical clock <= valid_until (ERR_QUOTATION_EXPIRED)"
        side_effects:
          - "round_count += 1"
          - "last_actor_role flips to the countering side"
          - "unit_price_cents (and optionally valid_until) replaced by payload values"
          - "increments Quotation.version by 1"
      - from: COUNTERED
        to: OPEN
        trigger: "POST /sourcing/quotations/{quotationId}/counter (state alternates OPEN <-> COUNTERED per side; COUNTERED means the BUYER set the last terms, OPEN means the FACTORY set them)"
        actor: BuyerManager | FactoryRep
        preconditions:
          - "Same as OPEN -> COUNTERED"
        side_effects:
          - "Same as OPEN -> COUNTERED"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /sourcing/quotations/{quotationId}/accept"
        actor: BuyerManager
        preconditions:
          - "Quotation status must be OPEN or COUNTERED (ERR_QUOTATION_NOT_OPEN)"
          - "expected_quotation_version must equal current version (ERR_STALE_VERSION, 412)"
          - "Caller owns the SourcingRequest (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "current logical clock <= valid_until (ERR_QUOTATION_EXPIRED)"
          - "Factory status must be ACTIVE (ERR_FACTORY_SUSPENDED)"
          - "factory.latest_audit_grade in {A, B} (ERR_FACTORY_GRADE_INSUFFICIENT)"
          - "Capacity check: committed_units(factory, delivery_month) + ordered_qty <= factory.monthly_capacity_units (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create PurchaseOrder (status ACTIVE, production_status PLACED, ordered_qty/unit_price_cents from payload/quotation)"
          - "Compute provisional_commission_cents via commission calculation (provisional variant)"
          - "quotation.purchase_order_id = new PO id"
          - "SourcingRequest -> PO_PLACED"
          - "Buyer.ytd_gmv_cents recomputed (now includes this PO.total_cents)"
          - "increments Quotation.version by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /sourcing/quotations/{quotationId}/accept"
        actor: BuyerManager
        preconditions:
          - "Same as OPEN -> ACCEPTED"
        side_effects:
          - "Same as OPEN -> ACCEPTED"
      - from: OPEN
        to: REJECTED
        trigger: "POST /sourcing/quotations/{quotationId}/reject"
        actor: BuyerManager
        preconditions:
          - "Quotation status must be OPEN or COUNTERED (ERR_QUOTATION_NOT_OPEN)"
          - "Caller owns the SourcingRequest"
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /sourcing/quotations/{quotationId}/reject"
        actor: BuyerManager
        preconditions:
          - "Quotation status must be OPEN or COUNTERED"
          - "Caller owns the SourcingRequest"
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system (clock sweep when current logical clock > valid_until and quotation non-terminal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
        trigger: "system (clock sweep when current logical clock > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PurchaseOrder
    initial_state: ACTIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PARTIALLY_SHIPPED
        trigger: "system (first Shipment booked with shipped_qty < open_qty)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SHIPPED
        trigger: "system (shipment booked making open_qty == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_SHIPPED
        to: SHIPPED
        trigger: "system (shipment booked making open_qty == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: CLOSED
        trigger: "system (confirm-receipt on a shipment when po.open_qty == 0 and all non-CANCELLED shipments are DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute final_commission_cents via commission calculation (final variant; tier from Buyer.ytd_gmv_cents at close time)"
          - "Agent.commission_ytd_cents += final_commission_cents"
          - "SourcingRequest -> COMPLETED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sourcing/purchase-orders/{poId}/cancel"
        actor: SourcingAgent
        preconditions:
          - "Caller is po.assigned_agent_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "Status must be ACTIVE or PARTIALLY_SHIPPED (ERR_PO_NOT_ACTIVE)"
        side_effects:
          - "cancelled_qty += open_qty; open_qty = 0"
          - "All PLANNED/SUBMITTED/REJECTED (non-VERIFIED) milestones -> remain but PO terminal; VERIFIED milestones keep progress_pct frozen"
          - "Capacity commitment released (delivery_month bucket reduced by former open_qty + shipped_qty is retained per committed_units definition: CANCELLED POs contribute 0)"
      - from: PARTIALLY_SHIPPED
        to: CANCELLED
        trigger: "POST /sourcing/purchase-orders/{poId}/cancel"
        actor: SourcingAgent
        preconditions:
          - "Caller is po.assigned_agent_id"
          - "Status must be ACTIVE or PARTIALLY_SHIPPED"
        side_effects:
          - "cancelled_qty += open_qty; open_qty = 0"
          - "Capacity commitment released"

  - entity: ProductionMilestone
    initial_state: PLANNED
    terminal_states: [VERIFIED]
    transitions:
      - from: PLANNED
        to: SUBMITTED
        trigger: "POST /sourcing/milestones/{milestoneId}/submit"
        actor: FactoryRep
        preconditions:
          - "Milestone must be PLANNED or REJECTED (ERR_MILESTONE_NOT_SUBMITTABLE)"
          - "Caller belongs to po.factory_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "po.milestone_plan_locked must be true (ERR_MILESTONE_PLAN_INCOMPLETE)"
          - "PO status must be ACTIVE (ERR_PO_NOT_ACTIVE)"
        side_effects:
          - "If this is the PO's first submit: po.production_status PLACED -> IN_PRODUCTION"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /sourcing/milestones/{milestoneId}/submit"
        actor: FactoryRep
        preconditions:
          - "Milestone must be PLANNED or REJECTED"
          - "Caller belongs to po.factory_id"
          - "po.milestone_plan_locked must be true"
          - "PO status must be ACTIVE"
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /sourcing/milestones/{milestoneId}/verify"
        actor: SourcingAgent
        preconditions:
          - "Milestone must be SUBMITTED (ERR_MILESTONE_NOT_VERIFIABLE)"
          - "Caller is po.assigned_agent_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "PO status must be ACTIVE"
        side_effects:
          - "po.progress_pct += milestone.weight_pct (progress_pct aggregation)"
          - "If all PO milestones are VERIFIED: po.production_status -> PRODUCTION_COMPLETE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sourcing/milestones/{milestoneId}/reject"
        actor: SourcingAgent
        preconditions:
          - "Milestone must be SUBMITTED"
          - "Caller is po.assigned_agent_id"
        side_effects: []

  - entity: Inspection
    initial_state: BOOKED
    terminal_states: [RESULT_RECORDED, CANCELLED]
    transitions:
      - from: BOOKED
        to: RESULT_RECORDED
        trigger: "POST /sourcing/inspections/{inspectionId}/record-result"
        actor: Inspector
        preconditions:
          - "Inspection must be BOOKED (ERR_INSPECTION_NOT_RECORDABLE)"
          - "Caller is inspection.inspector_id (ERR_OWNERSHIP_SCOPE_VIOLATION)"
          - "defects_critical + defects_major + defects_minor <= sample_size (ERR_AQL_SAMPLE_MISMATCH)"
        side_effects:
          - "result computed per aql_result calculation"
          - "If inspection_type == PSI: po.latest_psi_result = result"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /sourcing/inspections/{inspectionId}/cancel"
        actor: SourcingAgent
        preconditions:
          - "Inspection must be BOOKED (ERR_INSPECTION_NOT_CANCELLABLE)"
          - "Caller is po.assigned_agent_id"
        side_effects: []

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DOCS_HANDED_OVER
        trigger: "POST /sourcing/shipments/{shipmentId}/handover-documents"
        actor: FactoryRep
        preconditions:
          - "Shipment must be BOOKED (ERR_SHIPMENT_STATE_INVALID)"
          - "Caller belongs to po.factory_id"
          - "doc_refs must be a non-empty array (ERR_VALIDATION)"
        side_effects:
          - "po.document_status -> HANDED_OVER"
      - from: DOCS_HANDED_OVER
        to: DELIVERED
        trigger: "POST /sourcing/shipments/{shipmentId}/confirm-receipt"
        actor: BuyerManager
        preconditions:
          - "Shipment must be DOCS_HANDED_OVER (ERR_SHIPMENT_STATE_INVALID)"
          - "Caller owns po.buyer_id"
        side_effects:
          - "delivered_at = current logical clock"
          - "If po.open_qty == 0 and all non-CANCELLED shipments of this PO are DELIVERED: po.status -> CLOSED (final commission variant computed; agent commission accrues; SourcingRequest -> COMPLETED)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /sourcing/shipments/{shipmentId}/cancel"
        actor: SourcingAgent
        preconditions:
          - "Shipment must be BOOKED (ERR_SHIPMENT_STATE_INVALID)"
          - "Caller is po.assigned_agent_id"
        side_effects:
          - "po.shipped_qty -= shipment.shipped_qty; po.open_qty recomputed"
          - "If po was PARTIALLY_SHIPPED and this removes the last live shipment: po.status -> ACTIVE"

  - entity: QualityClaim
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /sourcing/quality-claims/{claimId}/approve"
        actor: SourcingAgent
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_NOT_REVIEWABLE)"
          - "Segregation of duties: caller's agent id != po.assigned_agent_id (ERR_SEGREGATION_OF_DUTIES)"
          - "total_chargeback_cents (computed at approval) <= po.remaining_payable_cents (ERR_CLAIM_EXCEEDS_PAYABLE)"
        side_effects:
          - "Compute base_amount_cents, defect_rate, penalty_cents, total_chargeback_cents (chargeback calculation, per-line rounding)"
          - "approved_by_agent_id = caller id"
          - "Factory.debit_balance_cents += total_chargeback_cents"
          - "Buyer.credit_balance_cents += total_chargeback_cents (zero-sum counterpart)"
          - "po.remaining_payable_cents -= total_chargeback_cents"
          - "If factory.debit_balance_cents >= SUSPENSION_THRESHOLD_CENTS (1,000,000): factory.status -> SUSPENDED; then every Quotation of that factory in {OPEN, COUNTERED} -> EXPIRED; then every PurchaseOrder of that factory with status ACTIVE and shipped_qty == 0 -> CANCELLED (cascade: claim -> factory debit -> factory status -> quotations/POs)"
      - from: FILED
        to: REJECTED
        trigger: "POST /sourcing/quality-claims/{claimId}/reject"
        actor: SourcingAgent
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_NOT_REVIEWABLE)"
          - "Segregation of duties: caller's agent id != po.assigned_agent_id"
        side_effects: []

  - entity: Factory
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (debit_balance_cents >= SUSPENSION_THRESHOLD_CENTS after a claim approval)"
        actor: system
        preconditions: []
        side_effects:
          - "All Quotations of this factory in {OPEN, COUNTERED} -> EXPIRED"
          - "All PurchaseOrders of this factory with status ACTIVE and shipped_qty == 0 -> CANCELLED (cancelled_qty += open_qty; open_qty = 0)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quotation-counter-stale-version
    parent_entity: Quotation
    write_endpoint: "POST /sourcing/quotations/{quotationId}/counter"
    occ_field: expected_quotation_version
    description: |
      Countering a Quotation with an expected_quotation_version that no longer
      matches the Quotation's current version is rejected. This captures the
      case where the other negotiating party has just posted a counter (which
      legitimately advanced the terms) and the current writer's view of the
      negotiation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: po-amend-stale-version
    parent_entity: PurchaseOrder
    write_endpoint: "POST /sourcing/purchase-orders/{poId}/amend"
    occ_field: expected_po_version
    description: |
      Amending a PurchaseOrder with an expected_po_version that no longer
      matches the PO's current version is rejected. This captures the case
      where another writer has just amended the PO (which legitimately
      superseded the prior commercial terms) and the current writer's view
      of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: audit_score
    trigger: "FactoryAudit creation (score and grade are computed at POST time and immutable thereafter)"
    algorithm: weighted_scoring
    formula: |
      Inputs: quality_system_score (qs), social_compliance_score (sc),
              production_capability_score (pc), financial_stability_score (fs),
              critical_findings (cf), audit_type.
      Weights (variant-keyed):
        SCREENING: qs 0.35, sc 0.25, pc 0.25, fs 0.15
        ONSITE:    qs 0.40, sc 0.30, pc 0.20, fs 0.10
      Steps:
        1. contribution_i = round_half_up(score_i * weight_i, 2 decimal places)
        2. raw = sum(contribution_i)
        3. ONSITE only: raw = raw - CRITICAL_FINDING_DEDUCTION * cf; floor raw at 0
        4. score = round_half_up(raw, 0 decimal places)  (integer)
        5. grade: score >= 85 -> A; >= 70 -> B; >= 50 -> C; else D
    input_set: "Exactly the four category scores and critical_findings of the audit being created; no cross-entity inputs"
    constants:
      CRITICAL_FINDING_DEDUCTION: 5
      GRADE_A_MIN: 85
      GRADE_B_MIN: 70
      GRADE_C_MIN: 50
    precision: "contributions 2dp round_half_up; final score integer round_half_up"
    variants:
      - name: screening
        when: "audit_type == SCREENING"
        difference: "Screening weights (0.35/0.25/0.25/0.15); critical findings are NOT deducted"
      - name: onsite
        when: "audit_type == ONSITE"
        difference: "Onsite weights (0.40/0.30/0.20/0.10); each critical finding deducts 5 points (floor 0). Only APPROVED ONSITE audits update factory.latest_audit_grade / audit_score"

  - name: commission
    trigger: "provisional variant: PurchaseOrder creation (quotation accept). final variant: PurchaseOrder close (last shipment confirm-receipt)"
    algorithm: tiered_pricing
    formula: |
      Step 1 (tier selection): tier_basis = buyer.ytd_gmv_cents evaluated AFTER
        this PO's total_cents is included (provisional) — i.e., basis includes
        the new PO. final variant re-evaluates buyer.ytd_gmv_cents at close time.
        tier_basis < TIER1_MAX_CENTS (10,000,000)         -> rate = 500 bp (5%)
        TIER1_MAX_CENTS <= tier_basis < TIER2_MAX_CENTS (50,000,000) -> rate = 400 bp (4%)
        tier_basis >= TIER2_MAX_CENTS                     -> rate = 300 bp (3%)
        Boundaries are inclusive on the lower edge: exactly 10,000,000 -> 4%.
      Step 2 (base selection, by sourcing_request.commission_mode):
        FOB: base = po.total_cents
        CIF: base = po.total_cents + po.freight_cents + po.insurance_cents
      Step 3 (commission):
        commission = round_half_up(base * rate_bp / 10000, 0 decimal places)
        CIF only: commission = min(commission, round_half_up(CIF_CAP_RATE * po.total_cents, 0))
                  where CIF_CAP_RATE = 0.12
      commission_rate_bp stores the applied tier rate.
    input_set: "The PO being computed; its buyer's ytd_gmv_cents (POs in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED, CLOSED} in the calendar year of the logical clock); sourcing_request.commission_mode"
    constants:
      TIER1_MAX_CENTS: 10000000
      TIER2_MAX_CENTS: 50000000
      TIER1_RATE_BP: 500
      TIER2_RATE_BP: 400
      TIER3_RATE_BP: 300
      CIF_CAP_RATE: "0.12"
    precision: "integer cents, round_half_up at each labeled step"
    variants:
      - name: provisional
        when: "PO creation (quotation accept)"
        difference: "tier_basis is buyer.ytd_gmv_cents including the new PO, evaluated at accept time; result stored in provisional_commission_cents"
      - name: final
        when: "PO close (last shipment confirm-receipt)"
        difference: "tier_basis re-evaluated from buyer.ytd_gmv_cents at close time (reflecting all POs accepted since); result stored in final_commission_cents; may differ from provisional even for identical PO data"

  - name: aql_result
    trigger: "POST /sourcing/inspections/{inspectionId}/record-result"
    algorithm: threshold
    formula: |
      Step 1 (sample size, at booking time): lot_size -> sample_size
        lot_size <= 500        -> n = 50
        501 <= lot_size <= 1200 -> n = 80
        1201 <= lot_size <= 3200 -> n = 125
        lot_size >= 3201       -> n = 200
        (Boundaries inclusive: exactly 500 -> 50; exactly 501 -> 80.)
      Step 2 (acceptance numbers for AQL 2.5 major):
        n = 50  -> Ac = 3,  Re = 4
        n = 80  -> Ac = 5,  Re = 6
        n = 125 -> Ac = 7,  Re = 8
        n = 200 -> Ac = 10, Re = 11
      Step 3 (result):
        FAILED if defects_critical > 0
        else FAILED if defects_major >= Re
        else FAILED if defects_minor > 2 * Ac
        else PASSED
        (Boundary: defects_major == Ac exactly -> PASSED.)
    input_set: "The inspection's own lot_size and recorded defect counts"
    constants:
      AQL_MAJOR_LEVEL: "2.5"
    precision: "integer counts; no rounding"

  - name: chargeback
    trigger: "POST /sourcing/quality-claims/{claimId}/approve (computed at approval, not at filing)"
    algorithm: waterfall_allocation
    formula: |
      Step 1: base_line_i = qty_defective_i * unit_price_cents_i (exact integer)
              base_amount_cents = sum(base_line_i)
      Step 2: defective_qty = sum(qty_defective_i)
              defect_rate = round_half_up(defective_qty / po.ordered_qty, 4 decimal places)
      Step 3 (penalty tier on defect_rate):
        defect_rate <= 0.05                 -> penalty_rate = 0.00
        0.05 < defect_rate <= 0.10          -> penalty_rate = 0.02
        defect_rate > 0.10                  -> penalty_rate = 0.05
        (Boundaries: exactly 0.0500 -> no penalty; exactly 0.1000 -> 2% tier.)
      Step 4 (ROUNDING ORDER PINNED — per-line then sum):
        penalty_line_i = round_half_up(base_line_i * penalty_rate, 0 decimal places)
        penalty_cents = sum(penalty_line_i)
      Step 5: total_chargeback_cents = base_amount_cents + penalty_cents
      Step 6: guard total_chargeback_cents <= po.remaining_payable_cents
              else ERR_CLAIM_EXCEEDS_PAYABLE (422).
    input_set: "The claim's items array and po.ordered_qty / po.remaining_payable_cents"
    constants:
      PENALTY_TIER1_MAX: "0.05"
      PENALTY_TIER2_MAX: "0.10"
      PENALTY_RATE_MID: "0.02"
      PENALTY_RATE_HIGH: "0.05"
      SUSPENSION_THRESHOLD_CENTS: 1000000
    precision: "integer cents; per-line round_half_up BEFORE summation (sum-then-round is explicitly NOT used)"

  - name: progress_pct
    trigger: "milestone verify; milestone reject does not change it"
    algorithm: aggregation
    formula: |
      po.progress_pct = sum(weight_pct) over the PO's milestones with status VERIFIED.
      Milestone plan lock rule: milestone creation allowed only while
      po.milestone_plan_locked == false and PO status == ACTIVE; after each
      creation, if sum(weight_pct) over ALL milestones of the PO == 100 exactly,
      milestone_plan_locked flips to true and po.production_status stays PLACED
      until first submit. Sum > 100 -> creation rejected (ERR_INVALID_WEIGHT_TOTAL).
      Sum == 100 exactly locks; sum < 100 leaves plan unlocked.
    input_set: "All ProductionMilestones of the PO, any status for the lock sum; VERIFIED only for progress_pct"
    constants:
      PLAN_TOTAL_WEIGHT: 100
    precision: "integer percent"

  - name: committed_units
    trigger: "quotation accept capacity check; PO amend capacity check"
    algorithm: aggregation
    formula: |
      committed_units(factory, delivery_month) =
        sum(open_qty + shipped_qty) over PurchaseOrders of that factory whose
        delivery_month == the target month AND status in
        {ACTIVE, PARTIALLY_SHIPPED, SHIPPED}.
      Check: committed_units + candidate_qty <= factory.monthly_capacity_units
      else ERR_CAPACITY_EXCEEDED. Boundary: equality is allowed (<=).
    input_set: "POs of the factory filtered by status and delivery_month"
    constants: {}
    precision: "integer units"

  - name: compliance_posture
    trigger: "compliance document verify; clock sweep expiry; PO creation (recompute for affected factory)"
    algorithm: aggregation
    formula: |
      Required doc types by product_category:
        APPAREL     -> {SOCIAL_AUDIT, PRODUCT_TEST}
        ELECTRONICS -> {PRODUCT_TEST, LAB_TEST}
        TOYS        -> {PRODUCT_TEST, LAB_TEST, SOCIAL_AUDIT}
        FURNITURE   -> {FIRE_SAFETY, PRODUCT_TEST}
      Let CATS = set of product_category over the factory's SourcingRequests
      linked via PurchaseOrders with status in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED}.
      If CATS is empty -> posture = COMPLIANT.
      Else required = union of required doc types over CATS.
      posture = COMPLIANT iff for every t in required there EXISTS a
      ComplianceDocument of the factory with doc_type == t, status == VERIFIED,
      and expires_at > current logical clock; else NON_COMPLIANT.
      On every posture flip, ship_blocked is rewritten on all of the factory's
      POs with status in {ACTIVE, PARTIALLY_SHIPPED, SHIPPED}.
    input_set: "ComplianceDocuments of the factory (VERIFIED, unexpired); factory's live POs' categories"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership scoping: entity-backed callers may only touch their own resources (BuyerManager: buyer_id; SourcingAgent: assigned_agent_id; FactoryRep: factory_id; Inspector: inspector_id)"
    error_id: ERR_OWNERSHIP_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all role-scoped write endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids must exist (validated left-to-right: parent before child)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: state
    check: "Target entity state precondition for the invoked transition (per state machine; e.g., sample SUBMITTED for review, quotation OPEN/COUNTERED for counter/accept, PO in {ACTIVE, PARTIALLY_SHIPPED} for amend (ERR_PO_NOT_ACTIVE otherwise), claim FILED for approve)"
    error_id: "ERR_{STATE_PRECONDITION} (e.g., ERR_SAMPLE_NOT_REVIEWABLE, ERR_QUOTATION_NOT_OPEN, ERR_PO_NOT_ACTIVE, ERR_CLAIM_NOT_REVIEWABLE)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_quotation_version / expected_po_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sourcing/quotations/{id}/counter, POST /sourcing/quotations/{id}/accept, POST /sourcing/purchase-orders/{id}/amend"

  - priority: 7
    category: business_safety
    check: "Compliance posture gate: shipment booking and inspection booking require po.ship_blocked == false (factory posture COMPLIANT); quotation create/accept, shipment booking, and inspection booking require factory.status == ACTIVE"
    error_id: "ERR_FACTORY_NOT_COMPLIANT | ERR_FACTORY_SUSPENDED"
    http_status: 409
    applies_to: "POST /sourcing/purchase-orders/{id}/shipments, POST /sourcing/quotations/{id}/accept, POST /sourcing/sourcing-requests/{id}/quotations, POST /sourcing/purchase-orders/{id}/inspections"

  - priority: 8
    category: business_safety
    check: "Audit grade gate: quotation accept requires factory.latest_audit_grade in {A, B}; segregation of duties on claim adjudication (approver != po.assigned_agent_id); inspection booking type gates (DUPRO requires production_status IN_PRODUCTION; PSI requires PRODUCTION_COMPLETE)"
    error_id: "ERR_FACTORY_GRADE_INSUFFICIENT | ERR_SEGREGATION_OF_DUTIES | ERR_PO_NOT_READY_FOR_DUPRO | ERR_PO_NOT_READY_FOR_PSI"
    http_status: 409
    applies_to: "quotation accept, quality-claim approve/reject, inspection booking"

  - priority: 9
    category: business_constraint
    check: "Structural constraints: at most one non-terminal quotation per (sourcing_request, factory); milestone plan locked before submit; inspector half-open window overlap; AQL defect counts <= sample_size"
    error_id: "ERR_DUPLICATE_QUOTATION | ERR_MILESTONE_PLAN_INCOMPLETE | ERR_INVALID_WEIGHT_TOTAL | ERR_MILESTONE_PLAN_LOCKED | ERR_INSPECTION_WINDOW_CONFLICT | ERR_AQL_SAMPLE_MISMATCH"
    http_status: 409
    applies_to: "quotation create, milestone create/submit, inspection booking, record-result"

  - priority: 10
    category: business_temporal
    check: "Time-window rules against the logical clock: quotation accept/counter requires clock <= valid_until; quality claim filing requires clock <= po latest delivered_at + 30 days"
    error_id: "ERR_QUOTATION_EXPIRED | ERR_CLAIM_WINDOW_CLOSED"
    http_status: 409
    applies_to: "quotation counter/accept, quality-claim create"

  - priority: 11
    category: business_fiscal
    check: "Money/capacity: committed_units + candidate <= monthly_capacity_units; ordered_qty >= quotation.moq; amend ordered_qty >= shipped_qty + cancelled_qty (equality allowed); shipment shipped_qty in 1..open_qty; chargeback <= remaining_payable"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_QTY_BELOW_MOQ | ERR_AMEND_BELOW_SHIPPED | ERR_SHIP_QTY_INVALID | ERR_CLAIM_EXCEEDS_PAYABLE"
    http_status: 422
    applies_to: "quotation accept, PO amend, shipment booking, quality-claim approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform bootstrap ---
  - method: POST
    path: "/sourcing/buyers"
    description: "Create a Buyer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, country_code]
    output: Buyer
    side_effects: ["credit_balance_cents = 0", "ytd_gmv_cents = 0", "status = ACTIVE"]

  - method: GET
    path: "/sourcing/buyers/{buyerId}"
    description: "Get a Buyer"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: POST
    path: "/sourcing/agents"
    description: "Create an Agent"
    roles: [PlatformAdmin]
    code: 201
    input: [name, agency_name]
    output: Agent
    side_effects: ["commission_ytd_cents = 0"]

  - method: GET
    path: "/sourcing/agents/{agentId}"
    description: "Get an Agent"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: POST
    path: "/sourcing/inspectors"
    description: "Create an Inspector"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region]
    output: Inspector
    side_effects: []

  - method: GET
    path: "/sourcing/inspectors/{inspectorId}"
    description: "Get an Inspector"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # --- Factory registry ---
  - method: POST
    path: "/sourcing/factories"
    description: "Register a Factory (identified by a sourcing agent)"
    roles: [SourcingAgent]
    code: 201
    input: [name, country_code, monthly_capacity_units]
    output: Factory
    side_effects: ["status = ACTIVE", "compliance_posture = COMPLIANT", "debit_balance_cents = 0", "latest_audit_grade = NONE"]

  - method: GET
    path: "/sourcing/factories/{factoryId}"
    description: "Get a Factory"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Factory
    side_effects: []

  # --- Audits ---
  - method: POST
    path: "/sourcing/factories/{factoryId}/audits"
    description: "Conduct (create) a FactoryAudit; score+grade computed at creation"
    roles: [SourcingAgent]
    code: 201
    input: [audit_type, quality_system_score, social_compliance_score, production_capability_score, financial_stability_score, "critical_findings?"]
    output: FactoryAudit
    side_effects: ["status = SUBMITTED", "score and grade computed per audit_score calculation", "conducted_by_agent_id = X-User-ID"]

  - method: GET
    path: "/sourcing/audits"
    description: "List FactoryAudits (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["factory_id?", "conducted_by_agent_id?", "limit?", "offset?"]
    output: "FactoryAudit[]"
    side_effects: []

  - method: GET
    path: "/sourcing/audits/{auditId}"
    description: "Get a FactoryAudit"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: FactoryAudit
    side_effects: []

  - method: POST
    path: "/sourcing/audits/{auditId}/approve"
    description: "Approve a SUBMITTED audit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FactoryAudit
    side_effects: ["status -> APPROVED", "approved_at = clock", "if ONSITE: factory.latest_audit_grade/audit_score updated, Factory.version += 1"]

  - method: POST
    path: "/sourcing/audits/{auditId}/reject"
    description: "Reject a SUBMITTED audit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FactoryAudit
    side_effects: ["status -> REJECTED"]

  # --- Compliance documents ---
  - method: POST
    path: "/sourcing/factories/{factoryId}/compliance-documents"
    description: "Upload a compliance document"
    roles: [SourcingAgent]
    code: 201
    input: [doc_type, issued_date, expires_at]
    output: ComplianceDocument
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/sourcing/compliance-documents"
    description: "List ComplianceDocuments (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["factory_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: "ComplianceDocument[]"
    side_effects: []

  - method: GET
    path: "/sourcing/compliance-documents/{docId}"
    description: "Get a ComplianceDocument"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: []

  - method: POST
    path: "/sourcing/compliance-documents/{docId}/verify"
    description: "Verify a SUBMITTED document; recomputes factory posture"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: ["status -> VERIFIED", "recompute factory.compliance_posture", "if posture -> COMPLIANT: ship_blocked=false on live POs"]

  - method: POST
    path: "/sourcing/compliance-documents/{docId}/reject"
    description: "Reject a SUBMITTED document"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: ["status -> REJECTED"]

  # --- Sourcing requests ---
  - method: POST
    path: "/sourcing/sourcing-requests"
    description: "Create a SourcingRequest (buyer = caller)"
    roles: [BuyerManager]
    code: 201
    input: [assigned_agent_id, title, product_category, target_price_cents, quantity, commission_mode]
    output: SourcingRequest
    side_effects: ["buyer_id = X-User-ID", "status = OPEN"]

  - method: GET
    path: "/sourcing/sourcing-requests"
    description: "List SourcingRequests (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["buyer_id?", "assigned_agent_id?", "status?", "limit?", "offset?"]
    output: "SourcingRequest[]"
    side_effects: []

  - method: GET
    path: "/sourcing/sourcing-requests/{srId}"
    description: "Get a SourcingRequest"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: SourcingRequest
    side_effects: []

  - method: POST
    path: "/sourcing/sourcing-requests/{srId}/cancel"
    description: "Cancel an OPEN/IN_PROGRESS SourcingRequest; cascades to samples and quotations"
    roles: [BuyerManager]
    code: 200
    input: []
    output: SourcingRequest
    side_effects: ["status -> CANCELLED", "non-terminal Samples -> REJECTED", "non-terminal Quotations -> REJECTED"]

  # --- Samples ---
  - method: POST
    path: "/sourcing/sourcing-requests/{srId}/samples"
    description: "Create a Sample (first revision) under a SourcingRequest"
    roles: [SourcingAgent]
    code: 201
    input: [notes]
    output: Sample
    side_effects: ["status = SUBMITTED", "revision_count = 0", "SourcingRequest OPEN -> IN_PROGRESS"]

  - method: GET
    path: "/sourcing/samples"
    description: "List Samples (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["sourcing_request_id?", "status?", "limit?", "offset?"]
    output: "Sample[]"
    side_effects: []

  - method: GET
    path: "/sourcing/samples/{sampleId}"
    description: "Get a Sample"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Sample
    side_effects: []

  - method: POST
    path: "/sourcing/samples/{sampleId}/review"
    description: "Buyer reviews a SUBMITTED sample: APPROVE or REQUEST_REVISION (4th revision request auto-rejects)"
    roles: [BuyerManager]
    code: 200
    input: [decision, "comments?"]
    output: Sample
    side_effects: ["APPROVE -> APPROVED; REQUEST_REVISION -> REVISION_REQUESTED if revision_count < 3 else REJECTED"]

  - method: POST
    path: "/sourcing/samples/{sampleId}/resubmit"
    description: "Agent resubmits a REVISION_REQUESTED sample (revision_count += 1)"
    roles: [SourcingAgent]
    code: 200
    input: [notes]
    output: Sample
    side_effects: ["status REVISION_REQUESTED -> SUBMITTED", "revision_count += 1"]

  # --- Quotations (price negotiation) ---
  - method: POST
    path: "/sourcing/sourcing-requests/{srId}/quotations"
    description: "Factory submits an initial quotation"
    roles: [FactoryRep]
    code: 201
    input: [unit_price_cents, moq, lead_time_days, valid_until]
    output: Quotation
    side_effects: ["factory_id = X-User-ID", "status = OPEN", "round_count = 0", "last_actor_role = FACTORY", "SourcingRequest OPEN -> IN_PROGRESS", "requires factory ACTIVE and grade in {A,B}"]

  - method: GET
    path: "/sourcing/quotations"
    description: "List Quotations (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["sourcing_request_id?", "factory_id?", "purchase_order_id?", "status?", "limit?", "offset?"]
    output: "Quotation[]"
    side_effects: []

  - method: GET
    path: "/sourcing/quotations/{quotationId}"
    description: "Get a Quotation"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Quotation
    side_effects: []

  - method: POST
    path: "/sourcing/quotations/{quotationId}/counter"
    description: "Counter-offer; alternates between buyer and factory; OCC on quotation version"
    roles: [BuyerManager, FactoryRep]
    code: 200
    input: [unit_price_cents, expected_quotation_version, "valid_until?"]
    output: Quotation
    side_effects: ["round_count += 1", "last_actor_role flips", "status alternates OPEN <-> COUNTERED", "increments Quotation.version by 1"]

  - method: POST
    path: "/sourcing/quotations/{quotationId}/accept"
    description: "Buyer accepts quotation; creates the PurchaseOrder; OCC on quotation version"
    roles: [BuyerManager]
    code: 201
    input: [ordered_qty, delivery_month, expected_quotation_version, "freight_cents?", "insurance_cents?"]
    output: PurchaseOrder
    side_effects: ["Quotation -> ACCEPTED, purchase_order_id set", "SourcingRequest -> PO_PLACED", "provisional commission computed", "Buyer.ytd_gmv_cents recomputed", "increments Quotation.version by 1", "factory posture recomputed for this new live PO"]

  - method: POST
    path: "/sourcing/quotations/{quotationId}/reject"
    description: "Buyer rejects a non-terminal quotation"
    roles: [BuyerManager]
    code: 200
    input: []
    output: Quotation
    side_effects: ["status -> REJECTED"]

  # --- Purchase orders ---
  - method: GET
    path: "/sourcing/purchase-orders"
    description: "List PurchaseOrders (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["buyer_id?", "factory_id?", "quotation_id?", "sourcing_request_id?", "assigned_agent_id?", "status?", "delivery_month?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: GET
    path: "/sourcing/purchase-orders/{poId}"
    description: "Get a PurchaseOrder"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/sourcing/purchase-orders/{poId}/amend"
    description: "Amend unit price / quantity / delivery month of a live PO (status ACTIVE or PARTIALLY_SHIPPED; ERR_PO_NOT_ACTIVE otherwise); OCC on PO version"
    roles: [SourcingAgent]
    code: 200
    input: [expected_po_version, "unit_price_cents?", "ordered_qty?", "delivery_month?"]
    output: PurchaseOrder
    side_effects: ["at least one of unit_price_cents/ordered_qty/delivery_month required (ERR_VALIDATION)", "total_cents/open_qty recomputed", "provisional_commission_cents recomputed", "capacity re-validated on qty/month change", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/sourcing/purchase-orders/{poId}/cancel"
    description: "Cancel a live PO (assigned agent); open units become cancelled"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> CANCELLED", "cancelled_qty += open_qty; open_qty = 0", "capacity released"]

  # --- Milestones ---
  - method: POST
    path: "/sourcing/purchase-orders/{poId}/milestones"
    description: "Add a milestone to the PO plan (allowed until weights total exactly 100)"
    roles: [SourcingAgent]
    code: 201
    input: [name, weight_pct]
    output: ProductionMilestone
    side_effects: ["status = PLANNED", "if cumulative weight == 100: milestone_plan_locked = true", "if cumulative weight would exceed 100: ERR_INVALID_WEIGHT_TOTAL", "if plan already locked: ERR_MILESTONE_PLAN_LOCKED"]

  - method: GET
    path: "/sourcing/milestones"
    description: "List ProductionMilestones (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["po_id?", "status?", "limit?", "offset?"]
    output: "ProductionMilestone[]"
    side_effects: []

  - method: GET
    path: "/sourcing/milestones/{milestoneId}"
    description: "Get a ProductionMilestone"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: ProductionMilestone
    side_effects: []

  - method: POST
    path: "/sourcing/milestones/{milestoneId}/submit"
    description: "Factory submits milestone evidence"
    roles: [FactoryRep]
    code: 200
    input: [evidence_note]
    output: ProductionMilestone
    side_effects: ["status PLANNED|REJECTED -> SUBMITTED", "first submit on the PO: production_status PLACED -> IN_PRODUCTION"]

  - method: POST
    path: "/sourcing/milestones/{milestoneId}/verify"
    description: "Assigned agent verifies a submitted milestone"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: ProductionMilestone
    side_effects: ["status SUBMITTED -> VERIFIED", "po.progress_pct += weight_pct", "if all PO milestones VERIFIED: production_status -> PRODUCTION_COMPLETE"]

  - method: POST
    path: "/sourcing/milestones/{milestoneId}/reject"
    description: "Assigned agent rejects a submitted milestone"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: ProductionMilestone
    side_effects: ["status SUBMITTED -> REJECTED"]

  # --- Inspections ---
  - method: POST
    path: "/sourcing/purchase-orders/{poId}/inspections"
    description: "Book a DUPRO or PSI inspection with an inspector and window"
    roles: [SourcingAgent]
    code: 201
    input: [inspector_id, inspection_type, scheduled_date, duration_days, lot_size]
    output: Inspection
    side_effects: ["status = BOOKED", "sample_size computed from lot_size", "inspector half-open window overlap check", "DUPRO requires IN_PRODUCTION; PSI requires PRODUCTION_COMPLETE"]

  - method: GET
    path: "/sourcing/inspections"
    description: "List Inspections (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["po_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/sourcing/inspections/{inspectionId}"
    description: "Get an Inspection"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/sourcing/inspections/{inspectionId}/record-result"
    description: "Inspector records defect counts; result computed per AQL"
    roles: [Inspector]
    code: 200
    input: [defects_critical, defects_major, defects_minor]
    output: Inspection
    side_effects: ["status BOOKED -> RESULT_RECORDED", "result = PASSED|FAILED per aql_result", "if PSI: po.latest_psi_result updated"]

  - method: POST
    path: "/sourcing/inspections/{inspectionId}/cancel"
    description: "Cancel a BOOKED inspection"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status BOOKED -> CANCELLED"]

  # --- Shipments ---
  - method: POST
    path: "/sourcing/purchase-orders/{poId}/shipments"
    description: "Book a shipment against a production-complete, PSI-passed, compliant PO"
    roles: [SourcingAgent]
    code: 201
    input: [shipped_qty, vessel_ref]
    output: Shipment
    side_effects: ["requires production_status PRODUCTION_COMPLETE (ERR_PO_NOT_READY_FOR_PSI gating uses production; separate ERR_NO_PASSING_PSI when no passed PSI)", "requires po.latest_psi_result == PASSED (ERR_NO_PASSING_PSI)", "requires ship_blocked == false (ERR_FACTORY_NOT_COMPLIANT)", "po.shipped_qty += shipped_qty; open_qty recomputed", "po.status ACTIVE -> PARTIALLY_SHIPPED or -> SHIPPED when open_qty == 0"]

  - method: GET
    path: "/sourcing/shipments"
    description: "List Shipments (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["po_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/sourcing/shipments/{shipmentId}"
    description: "Get a Shipment"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/sourcing/shipments/{shipmentId}/handover-documents"
    description: "Factory hands over shipping documents"
    roles: [FactoryRep]
    code: 200
    input: [doc_refs]
    output: Shipment
    side_effects: ["status BOOKED -> DOCS_HANDED_OVER", "po.document_status -> HANDED_OVER"]

  - method: POST
    path: "/sourcing/shipments/{shipmentId}/confirm-receipt"
    description: "Buyer confirms receipt; delivers shipment; may close the PO (final commission)"
    roles: [BuyerManager]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status DOCS_HANDED_OVER -> DELIVERED", "delivered_at = clock", "if po.open_qty == 0 and all live shipments DELIVERED: PO -> CLOSED, final_commission computed, Agent.commission_ytd_cents += final, SourcingRequest -> COMPLETED"]

  - method: POST
    path: "/sourcing/shipments/{shipmentId}/cancel"
    description: "Cancel a BOOKED shipment; restores open_qty"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status BOOKED -> CANCELLED", "po.shipped_qty -= shipped_qty", "po.status may revert PARTIALLY_SHIPPED -> ACTIVE"]

  # --- Quality claims ---
  - method: POST
    path: "/sourcing/purchase-orders/{poId}/quality-claims"
    description: "Buyer files a quality claim (within 30 days of latest delivery)"
    roles: [BuyerManager]
    code: 201
    input: [items]
    output: QualityClaim
    side_effects: ["status = FILED", "base_amount_cents/defective_qty computed", "penalty/chargeback stay 0 until approval"]

  - method: GET
    path: "/sourcing/quality-claims"
    description: "List QualityClaims (filtered)"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: ["po_id?", "filed_by_buyer_id?", "approved_by_agent_id?", "status?", "limit?", "offset?"]
    output: "QualityClaim[]"
    side_effects: []

  - method: GET
    path: "/sourcing/quality-claims/{claimId}"
    description: "Get a QualityClaim"
    roles: [PlatformAdmin, BuyerManager, SourcingAgent, FactoryRep, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []

  - method: POST
    path: "/sourcing/quality-claims/{claimId}/approve"
    description: "Adjudicating agent (not the PO's agent) approves; chargeback applied zero-sum"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status FILED -> APPROVED", "chargeback computed per-line then summed", "Factory.debit_balance_cents += total", "Buyer.credit_balance_cents += total", "po.remaining_payable_cents -= total", "if debit >= 1,000,000: factory SUSPENDED -> its open quotations EXPIRED and unshipped ACTIVE POs CANCELLED"]

  - method: POST
    path: "/sourcing/quality-claims/{claimId}/reject"
    description: "Adjudicating agent (not the PO's agent) rejects the claim"
    roles: [SourcingAgent]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status FILED -> REJECTED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/sourcing/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Advancing the clock sweeps VERIFIED ComplianceDocuments whose expires_at < new time to EXPIRED (with posture cascade) and non-terminal Quotations whose valid_until < new time to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["document expiry sweep + posture cascade", "quotation expiry sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_SCOPE_VIOLATION, http: 403, condition: "Entity-backed caller does not own the target resource (buyer_id / assigned_agent_id / factory_id / inspector_id mismatch)" }
  # --- not found ---
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id not found" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "Agent id not found" }
  - { id: ERR_FACTORY_NOT_FOUND, http: 404, condition: "Factory id not found" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Inspector id not found" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "FactoryAudit id not found" }
  - { id: ERR_COMPLIANCE_DOCUMENT_NOT_FOUND, http: 404, condition: "ComplianceDocument id not found" }
  - { id: ERR_SOURCING_REQUEST_NOT_FOUND, http: 404, condition: "SourcingRequest id not found" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "Sample id not found" }
  - { id: ERR_QUOTATION_NOT_FOUND, http: 404, condition: "Quotation id not found" }
  - { id: ERR_PURCHASE_ORDER_NOT_FOUND, http: 404, condition: "PurchaseOrder id not found" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "ProductionMilestone id not found" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id not found" }
  - { id: ERR_QUALITY_CLAIM_NOT_FOUND, http: 404, condition: "QualityClaim id not found" }
  # --- input ---
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum value, out-of-range scalar (score outside 0..100, weight outside 1..100, duration outside 1..5, empty doc_refs, non-YYYY-MM delivery_month), or amend with no changed field" }
  # --- state ---
  - { id: ERR_AUDIT_NOT_REVIEWABLE, http: 409, condition: "Audit not SUBMITTED" }
  - { id: ERR_DOC_NOT_VERIFIABLE, http: 409, condition: "ComplianceDocument not SUBMITTED" }
  - { id: ERR_SR_NOT_ACTIVE, http: 409, condition: "SourcingRequest not OPEN/IN_PROGRESS for the attempted child operation" }
  - { id: ERR_SR_NOT_CANCELLABLE, http: 409, condition: "SourcingRequest not OPEN/IN_PROGRESS for cancel" }
  - { id: ERR_SAMPLE_NOT_REVIEWABLE, http: 409, condition: "Sample not SUBMITTED" }
  - { id: ERR_SAMPLE_NOT_RESUBMITTABLE, http: 409, condition: "Sample not REVISION_REQUESTED" }
  - { id: ERR_QUOTATION_NOT_OPEN, http: 409, condition: "Quotation not OPEN/COUNTERED" }
  - { id: ERR_WRONG_COUNTER_PARTY, http: 409, condition: "The side that set current terms cannot counter its own offer" }
  - { id: ERR_NEGOTIATION_ROUND_EXCEEDED, http: 409, condition: "round_count already == 6 (NEGOTIATION_ROUND_CAP)" }
  - { id: ERR_QUOTATION_EXPIRED, http: 409, condition: "Logical clock past valid_until on counter/accept" }
  - { id: ERR_PO_NOT_ACTIVE, http: 409, condition: "PurchaseOrder not ACTIVE (or ACTIVE/PARTIALLY_SHIPPED for cancel) for the attempted operation" }
  - { id: ERR_MILESTONE_NOT_SUBMITTABLE, http: 409, condition: "Milestone not PLANNED/REJECTED" }
  - { id: ERR_MILESTONE_NOT_VERIFIABLE, http: 409, condition: "Milestone not SUBMITTED" }
  - { id: ERR_INSPECTION_NOT_RECORDABLE, http: 409, condition: "Inspection not BOOKED" }
  - { id: ERR_INSPECTION_NOT_CANCELLABLE, http: 409, condition: "Inspection not BOOKED for cancel" }
  - { id: ERR_SHIPMENT_STATE_INVALID, http: 409, condition: "Shipment not in the required state for handover/confirm/cancel" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "QualityClaim not FILED" }
  # --- business ---
  - { id: ERR_FACTORY_SUSPENDED, http: 409, condition: "Factory is SUSPENDED (quotation create/accept, audit creation allowed; shipment booking blocked)" }
  - { id: ERR_FACTORY_NOT_COMPLIANT, http: 409, condition: "po.ship_blocked true / factory posture NON_COMPLIANT for shipment booking or inspection booking" }
  - { id: ERR_FACTORY_GRADE_INSUFFICIENT, http: 409, condition: "factory.latest_audit_grade not in {A, B} at quotation create or accept" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim adjudicator is the PO's assigned agent" }
  - { id: ERR_DUPLICATE_QUOTATION, http: 409, condition: "A non-terminal quotation already exists for (sourcing_request, factory)" }
  - { id: ERR_MILESTONE_PLAN_INCOMPLETE, http: 409, condition: "Submit attempted before milestone weights sum to exactly 100" }
  - { id: ERR_MILESTONE_PLAN_LOCKED, http: 409, condition: "Milestone creation attempted after plan locked" }
  - { id: ERR_INVALID_WEIGHT_TOTAL, http: 409, condition: "Milestone weight would push cumulative total above 100" }
  - { id: ERR_INSPECTION_WINDOW_CONFLICT, http: 409, condition: "Inspector already has a BOOKED/RESULT_PENDING inspection whose half-open window overlaps the requested one" }
  - { id: ERR_AQL_SAMPLE_MISMATCH, http: 422, condition: "defects_critical + defects_major + defects_minor > sample_size" }
  - { id: ERR_PO_NOT_READY_FOR_DUPRO, http: 409, condition: "DUPRO booking requires production_status == IN_PRODUCTION" }
  - { id: ERR_PO_NOT_READY_FOR_PSI, http: 409, condition: "PSI booking or shipment booking requires production_status == PRODUCTION_COMPLETE" }
  - { id: ERR_NO_PASSING_PSI, http: 409, condition: "Shipment booking requires po.latest_psi_result == PASSED" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 409, condition: "Logical clock beyond latest delivered_at + 30 days (or no delivery yet)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "committed_units + candidate_qty > factory.monthly_capacity_units for the delivery month" }
  - { id: ERR_QTY_BELOW_MOQ, http: 422, condition: "ordered_qty < quotation.moq at accept" }
  - { id: ERR_AMEND_BELOW_SHIPPED, http: 422, condition: "Amended ordered_qty < shipped_qty + cancelled_qty (equality allowed)" }
  - { id: ERR_SHIP_QTY_INVALID, http: 422, condition: "shipped_qty < 1 or > po.open_qty" }
  - { id: ERR_CLAIM_EXCEEDS_PAYABLE, http: 422, condition: "Computed chargeback > po.remaining_payable_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_quotation_version / expected_po_version mismatch (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; bootstraps buyers/agents/inspectors and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /sourcing/buyers"
      - "POST /sourcing/agents"
      - "POST /sourcing/inspectors"
      - "POST /sourcing/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: BuyerManager
    description: "Buyer-side manager; owns sourcing requests, reviews samples, negotiates/accepts quotations, files claims, confirms receipts"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /sourcing/sourcing-requests"
      - "POST /sourcing/sourcing-requests/{id}/cancel"
      - "POST /sourcing/samples/{id}/review"
      - "POST /sourcing/quotations/{id}/accept"
      - "POST /sourcing/quotations/{id}/reject"
      - "POST /sourcing/purchase-orders/{id}/quality-claims"
      - "POST /sourcing/shipments/{id}/confirm-receipt"
    shared_operations:
      - "POST /sourcing/quotations/{id}/counter (shared with FactoryRep; alternating side enforced)"
      - "All GET endpoints"

  - name: SourcingAgent
    description: "Buying-agent employee; identifies factories, conducts audits, manages documents, milestones, inspections, shipments; adjudicates claims on other agents' POs"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /sourcing/factories"
      - "POST /sourcing/factories/{id}/audits"
      - "POST /sourcing/factories/{id}/compliance-documents"
      - "POST /sourcing/sourcing-requests/{id}/samples"
      - "POST /sourcing/samples/{id}/resubmit"
      - "POST /sourcing/purchase-orders/{id}/amend"
      - "POST /sourcing/purchase-orders/{id}/cancel"
      - "POST /sourcing/purchase-orders/{id}/milestones"
      - "POST /sourcing/milestones/{id}/verify"
      - "POST /sourcing/milestones/{id}/reject"
      - "POST /sourcing/purchase-orders/{id}/inspections"
      - "POST /sourcing/inspections/{id}/cancel"
      - "POST /sourcing/purchase-orders/{id}/shipments"
      - "POST /sourcing/shipments/{id}/cancel"
      - "POST /sourcing/quality-claims/{id}/approve"
      - "POST /sourcing/quality-claims/{id}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: FactoryRep
    description: "Factory representative; submits quotations, counters, milestone evidence, and document handover"
    identity: "entity_backed:Factory"
    exclusive_operations:
      - "POST /sourcing/sourcing-requests/{id}/quotations"
      - "POST /sourcing/milestones/{id}/submit"
      - "POST /sourcing/shipments/{id}/handover-documents"
    shared_operations:
      - "POST /sourcing/quotations/{id}/counter (shared with BuyerManager; alternating side enforced)"
      - "All GET endpoints"

  - name: Inspector
    description: "Third-party inspector; records AQL results only for own assigned inspections"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /sourcing/inspections/{id}/record-result"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance authority; approves audits and verifies compliance documents; never touches commercial flow"
    identity: opaque
    exclusive_operations:
      - "POST /sourcing/audits/{id}/approve"
      - "POST /sourcing/audits/{id}/reject"
      - "POST /sourcing/compliance-documents/{id}/verify"
      - "POST /sourcing/compliance-documents/{id}/reject"
    shared_operations:
      - "All GET endpoints"
