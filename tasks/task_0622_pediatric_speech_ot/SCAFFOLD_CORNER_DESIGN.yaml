# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage for non-difficulty tests)
# Pediatric Speech & OT Clinic — Expert band
# Sections/claim_types per references/claim-extraction-guide.md.
# Shared conventions match SCAFFOLD_DIFFICULTY_DESIGN.yaml (clock default
# 2026-01-01T00:00:00Z; authorization windows 2026-06-01..2026-09-01).
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_child_returns_201_with_computed_age_and_defaults
        claim_type: Creation
        grounds:
          - entities.Child.fields.full_name
          - entities.Child.fields.age_months_at_intake
          - entities.Child.fields.coordination_program
        distinguishing_aspect: "POST /clinic/children with full_name + date_of_birth returns 201; age_months_at_intake computed from DOB vs clock; coordination_program defaults NONE, status ACTIVE."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; DOB 2024-06-01 -> exactly 24 months."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/children"
              payload: { full_name: "New Kid", date_of_birth: "2024-06-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Child.${ch_id}.age_months_at_intake == 24"
            - "Child.${ch_id}.coordination_program == NONE"
            - "Child.${ch_id}.status == ACTIVE"
            - "Child.${ch_id}.version == 1"

      - name: get_child_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Child, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinic/children/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/children/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_evaluation_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Evaluation.fields.severity_score, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clinic/evaluations without severity_score returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A child exists; acting Evaluator is a Therapist id."]
          setup_api_calls:
            - call: "POST /clinic/therapists"
              payload: { full_name: "Eval T", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid R", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP" }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_evaluation_severity_out_of_range_returns_400
        claim_type: Type Constraints
        grounds: [entities.Evaluation.fields.severity_score, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "severity_score=101 violates the 0..100 range and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A child and an Evaluator (Therapist id)."]
          setup_api_calls:
            - call: "POST /clinic/therapists"
              payload: { full_name: "Eval T2", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid S", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 101 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_goal_target_not_above_baseline_returns_400
        claim_type: Type Constraints
        grounds: [entities.Goal.fields.target_pct, entities.Goal.fields.baseline_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A goal with target_pct (40) <= baseline_pct (40) is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An ACTIVE plan of care exists."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T G", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid T", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /clinic/plans-of-care/${poc_id}/goals"
              payload: { description: "Bad goal", weight: 1, baseline_pct: 40, target_pct: 40 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: recommended_weekly_minutes_computed_on_finalize
        claim_type: Computed Fields
        grounds: [calculations.recommended_weekly_minutes, entities.Evaluation.fields.recommended_weekly_minutes, state_machines.Evaluation.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing an evaluation with severity_score=72 sets recommended_weekly_minutes to the tier value 90."
        test_recipe:
          setup: ["A DRAFT SLP evaluation with severity_score=72."]
          setup_api_calls:
            - call: "POST /clinic/therapists"
              payload: { full_name: "T Rec", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid U", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 72 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
          assert:
            - "Evaluation.${ev_id}.status == FINALIZED"
            - "Evaluation.${ev_id}.recommended_weekly_minutes == 90"

      - name: goal_progress_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.GoalProgressEntry]
        distinguishing_aspect: "GoalProgressEntry has common_fields:false — exposes id + created_at but no version field; it is an append-only event with no update endpoint."
        test_recipe:
          setup: ["A completed appointment recorded one progress entry for a goal."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T GPE", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid V", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care/${poc_id}/goals"
              payload: { description: "G", weight: 1, baseline_pct: 0, target_pct: 100 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
            - call: "POST /clinic/appointments/${appt_id}/complete"
              payload: { narrative: "Recorded progress.", minutes_delivered: 45, goal_progress_entries: [ { goal_id: "${goal_id}", recorded_pct: 30 } ] }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "GET /clinic/goals/${goal_id}/progress-entries"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { entry_pct: "$.data[0].recorded_pct" }
          assert:
            - "response.status == 200"
            - "GoalProgressEntry[0].recorded_pct == 30"
            - "GoalProgressEntry[0].recorded_session_time == 2026-06-10T09:00:00Z"

      - name: list_children_pagination_envelope
        claim_type: Listing
        grounds: [entities.Child, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /clinic/children returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two children registered."]
          setup_api_calls:
            - call: "POST /clinic/children"
              payload: { full_name: "C1", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
            - call: "POST /clinic/children"
              payload: { full_name: "C2", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
          trigger:
            - call: "GET /clinic/children"
              payload: {}
              as: ClinicAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: complete_already_completed_appointment_returns_not_scheduled
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment.SCHEDULED_to_COMPLETED, "errors[ERR_APPOINTMENT_NOT_SCHEDULED]"]
        distinguishing_aspect: "Completing an appointment already COMPLETED fails ERR_APPOINTMENT_NOT_SCHEDULED (409); no second visit committed."
        test_recipe:
          setup: ["One appointment completed once."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T C2", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid W", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
            - call: "POST /clinic/appointments/${appt_id}/complete"
              payload: { narrative: "First completion.", minutes_delivered: 45, goal_progress_entries: [] }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /clinic/appointments/${appt_id}/complete"
              payload: { narrative: "Second completion attempt.", minutes_delivered: 45, goal_progress_entries: [] }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_SCHEDULED"
            - "Authorization.${auth_id}.committed_visits == 1"

      - name: complete_future_appointment_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.SCHEDULED_to_COMPLETED, "errors[ERR_APPOINTMENT_IN_FUTURE]"]
        distinguishing_aspect: "Completing an appointment whose start_time is after the clock fails ERR_APPOINTMENT_IN_FUTURE (409)."
        test_recipe:
          setup: ["Clock at 2026-06-05; appointment slot at 2026-06-10 (future)."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T Fut", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid X2", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt_id}/complete"
              payload: { narrative: "Trying to complete future appt.", minutes_delivered: 45, goal_progress_entries: [] }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_IN_FUTURE"

      - name: appointment_initial_state_is_scheduled
        claim_type: Initial State
        grounds: [state_machines.Appointment, entities.Appointment.fields.status]
        distinguishing_aspect: "A newly booked appointment starts in SCHEDULED with duration_minutes computed."
        test_recipe:
          setup: ["ACTIVE plan + authorization."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T Init", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid Y2", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T10:00:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Appointment.${appt_id}.status == SCHEDULED"
            - "Appointment.${appt_id}.duration_minutes == 60"

      - name: ifsp_age_ineligible_blocks_activation
        claim_type: Precondition Enforcement
        grounds: [state_machines.CoordinationPlan.DRAFT_to_ACTIVE, "errors[ERR_IFSP_AGE_INELIGIBLE]"]
        distinguishing_aspect: "Activating an IFSP coordination plan for a child whose age_months_at_intake >= 36 fails ERR_IFSP_AGE_INELIGIBLE (409)."
        test_recipe:
          setup: ["Clock 2026-06-01; child DOB 2022-01-01 -> 53 months (>= 36)."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/children"
              payload: { full_name: "Older Kid", date_of_birth: "2022-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/coordination-plans"
              payload: { child_id: "${ch_id}", plan_type: "IFSP", jurisdiction: "Lead Agency", review_due_time: "2026-12-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /clinic/coordination-plans/${cp_id}/activate"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_IFSP_AGE_INELIGIBLE"

      - name: coordination_conflict_second_active_plan_rejected
        claim_type: guarded transitions
        grounds: [state_machines.CoordinationPlan.DRAFT_to_ACTIVE, "errors[ERR_COORDINATION_CONFLICT]"]
        distinguishing_aspect: "Activating a second coordination plan while the child already has an ACTIVE one fails ERR_COORDINATION_CONFLICT (409)."
        test_recipe:
          setup: ["Clock 2026-06-01; child DOB 2024-06-01 (24 months). One IFSP plan already ACTIVE; a second IEP plan in DRAFT."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/children"
              payload: { full_name: "Coord Kid", date_of_birth: "2024-06-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/coordination-plans"
              payload: { child_id: "${ch_id}", plan_type: "IFSP", jurisdiction: "Lead Agency", review_due_time: "2026-12-01T00:00:00Z" }
