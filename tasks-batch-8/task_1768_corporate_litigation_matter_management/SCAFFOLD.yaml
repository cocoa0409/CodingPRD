- method: POST
  path: /litigation/_clock/set_current_utc
  description: Sets the logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/cooling-period
    rules read this clock.
  roles:
  - LegalOperationsAnalyst
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - 'runs system sweeps in pinned order: (1) Deadline SCHEDULED->MISSED where due_at < clock; (2) Deadline MISSED->EXPIRED where due_at + 30d < clock; (3) SettlementRequest SUBMITTED/UNDER_REVIEW/COUNTERED
    -> EXPIRED where expires_at < clock; each fired sweep reapplies its §1.2 side effects (including jurisdictional FROZEN posture)'
