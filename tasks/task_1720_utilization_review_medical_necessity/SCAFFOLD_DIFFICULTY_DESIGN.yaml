              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v3: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/condition-code-44-requests"
              payload: { rationale: "Inpatient criteria not met.", service_lines: [{ description: "Room", charge_cents: 200000, rate_milli: 500 }], expected_case_version: "${case_v3}" }
              as: URNurse
              captures: { cc_id: $.data.id }
            - call: "POST /api/condition-code-44-requests/${cc_id}/concurrence"
              payload: { decision: "CONCUR" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
          trigger:
            - call: "POST /api/condition-code-44-requests/${cc_id}/committee-review"
              payload: { decision: "APPROVE" }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
            - call: "POST /api/condition-code-44-requests/${cc_id}/rescind"
              payload: { rescind_reason: "Criteria requalified after new imaging" }
              as: URDirector
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
          assert:
            - "Invariant before/after approve: certified_day_count == 3 both times; after approve certified_inpatient_day_count == 0 and certified_observation_day_count == 3"
            - "Invariant after rescind (compensating action): certified_day_count == 3, certified_inpatient_day_count == 3, certified_observation_day_count == 0"
            - "current_admission_status returns to INPATIENT and AuthorizationRequest.${auth_id} remains APPROVED throughout (already-terminal-to-nothing; only interval tags moved)"

      - name: p2p_schedule_cancel_conserves_appeal_deadline
        grounds:
          - state_machines.DenialCase.OPEN_to_P2P_SCHEDULED
          - state_machines.DenialCase.P2P_SCHEDULED_to_OPEN
          - entities.DenialCase.fields.appeal_deadline_at
        distinguishing_aspect: |
          Different conserved quantity: DenialCase.appeal_deadline_at (a temporal value, not a day count). The schedule+cancel pair moves the denial OPEN -> P2P_SCHEDULED -> OPEN while the deadline stays bit-identical at 2026-10-01T12:00:00Z (denied 2026-08-02T12:00:00Z + 60 days); P2P activity never extends the appeal clock.
        test_recipe:
          setup:
            - "Medicare case; authorization for 3 days denied at logical time 2026-08-02T12:00:00Z; denial OPEN with appeal_deadline_at 2026-10-01T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-INV2", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "DENY", denial_reason_code: "CRITERIA_NOT_MET" }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}/denial-cases"
              as: URNurse
              captures: { den_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/peer-to-peer-conferences"
              payload: { advisor_physician_id: "${dr_adv}", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T10:30:00Z" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
              captures: { conf_id: $.data.id }
            - call: "GET /api/denial-cases/${den_id}"
              as: URNurse
            - call: "POST /api/peer-to-peer-conferences/${conf_id}/cancel"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${dr_att}"
            - call: "GET /api/denial-cases/${den_id}"
              as: URNurse
          assert:
            - "At creation: DenialCase.${den_id}.appeal_deadline_at == 2026-10-01T12:00:00Z"
            - "While P2P_SCHEDULED: appeal_deadline_at still == 2026-10-01T12:00:00Z (scheduling does not toll the deadline)"
            - "After cancel (compensating action): DenialCase.${den_id}.status == OPEN and appeal_deadline_at == 2026-10-01T12:00:00Z — the schedule+cancel pair leaves the deadline byte-identical"
            - "PeerToPeerConference.${conf_id}.status == CANCELLED"
