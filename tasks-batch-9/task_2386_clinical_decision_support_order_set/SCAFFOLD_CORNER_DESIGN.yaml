        grounds:
          - entities.ContentRequest.common_fields
          - state_machines.ContentRequest
        distinguishing_aspect: "The version counter advances on every successful write in the intake loop - create 1, triage RETURN 2, resubmit 3, triage ACCEPT 4 - and a child order set creation bumps the parent to 5, so a version captured before any of those writes is unusable afterwards."
