          - state_machines.IncidentReport.SUBMITTED_to_RETURNED
          - state_machines.IncidentReport.RETURNED_to_DRAFT
        distinguishing_aspect: |
          IncidentReport review loop SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED ->
          ACCEPTED is a revision cycle on a different entity than ArffVehicle;
          review_cycle_count tracks loop iterations exactly once.
        test_recipe:
