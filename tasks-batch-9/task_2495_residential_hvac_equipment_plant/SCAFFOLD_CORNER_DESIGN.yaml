              payload: { build_order_id: "${bo1_id}", test_cell_id: "${cell_id}", window_start_utc: "2026-08-05T08:00:00Z", window_end_utc: "2026-08-05T09:00:00Z", measured_capacity_btuh: 24000, measured_power_w: 2020, measured_ambient_c: 35.0 }
              as: QualityTechnician
              as_user_id: "user-qt-2"
            - call: "POST /plant/build-orders/${bo1_id}/release-to-stock"
              payload: {}
              as: ProductionPlanner
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 8, scheduled_start_utc: "2026-08-06T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo2_id: $.data.id }
            - call: "POST /plant/build-orders/${bo2_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo2_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo2_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.30 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
            - call: "POST /plant/build-orders/${bo2_id}/charge"
              payload: { charge_grams: 1600 }
              as: ProductionTechnician
            - call: "POST /plant/run-tests"
              payload: { build_order_id: "${bo2_id}", test_cell_id: "${cell_id}", window_start_utc: "2026-08-05T09:30:00Z", window_end_utc: "2026-08-05T10:30:00Z", measured_capacity_btuh: 24000, measured_power_w: 2020, measured_ambient_c: 35.0 }
              as: QualityTechnician
              as_user_id: "user-qt-2"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 14, scheduled_start_utc: "2026-08-07T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo3_id: $.data.id }
            - call: "POST /plant/build-orders/${bo3_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo3_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo3_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.40 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
            - call: "POST /plant/build-orders/${bo3_id}/charge"
              payload: { charge_grams: 1600 }
              as: ProductionTechnician
            - call: "POST /plant/run-tests"
              payload: { build_order_id: "${bo3_id}", test_cell_id: "${cell_id}", window_start_utc: "2026-08-05T11:00:00Z", window_end_utc: "2026-08-05T12:00:00Z", measured_capacity_btuh: 24000, measured_power_w: 2020, measured_ambient_c: 35.0 }
              as: QualityTechnician
              as_user_id: "user-qt-2"
          trigger:
            - call: "POST /plant/build-orders/${bo2_id}/release-to-stock"
              payload: {}
              as: ProductionPlanner
          assert:
            - "HTTP 200; BuildOrder.${bo2_id}.status == RELEASED_TO_STOCK and released_to_stock_at == \"2026-08-01T00:00:00Z\""
            - "ProductPlatform.${plat_id}.units_built_released == 20 (12 + 8) - not 34, because lot 3 is still RUN_PASSED"
            - "BuildOrder.${bo3_id}.status == RUN_PASSED and latest_run_verdict == PASS"
            - "ProductPlatform.${plat_id}.units_shipped_total == 0 and rolling_claim_rate_pct == 0.00"
            - "GET /plant/test-cells/${cell_id}/run-tests returns 3 records, all verdict == PASS"

      - name: c_sell_through_cascade_reaches_warehouse_capacity
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: sell_through_cascade_frees_warehouse_pallets_in_four_hops
          rationale: "That §1.8 instance already walks the deepest cascade in the domain - program to platform to build lot to warehouse reservation to warehouse occupancy - pinning the intermediate state, hold_reason, release_reason, released_at, and the recomputed pallet count at every hop. A §1.9 restatement would add no distinguishable claim."

      - name: c_leak_method_selects_the_pass_criterion
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: leak_verdict_diverges_by_method_on_same_magnitude
          rationale: "That §1.8 instance drives both variants of calculations.leak_test_verdict from the same numeric magnitude on sibling lots, so the applied_limit and verdict of each branch are pinned together and the divergence is provably method-driven rather than data-driven."

      - name: c_claim_rate_crossing_a_threshold_opens_a_capa
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: claim_rate_of_exactly_five_percent_trips_capa_threshold
          rationale: "That §1.8 instance sits the rolling claim rate on the CAPA_THRESHOLD_PCT boundary exactly, pins the resulting posture, derate, and effective capacity, and contrasts the stored BUILT_BASIS rate against the SHIPPED_BASIS view - covering both the threshold trigger and its reporting variant."

  - section: consistency_model
    instances:
      - name: c_allocation_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/plant/distributor-orders/{id}/allocate
          - entities.ComponentSupply.fields.available_units
        distinguishing_aspect: "There is no eventual-consistency window anywhere in the plant: the allocate response itself already reports the new allocation_status and allocated_units, and reads issued immediately afterwards see the drawn pools and the written lines without any retry or polling."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform CERTIFIED for SOUTHEAST."
            - "For 2026-11: a compressor pool of 50 units and a control-board pool of 50 units."
            - "A SOUTHEAST order for 30 units, never yet allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/regional-standards"
              payload: { region_code: "SOUTHEAST", min_seer2_standard: 14.30, min_seer2_high: 15.20, min_seer2_premium: 16.00, effective_from_utc: "2026-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { std_id: $.data.id }
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
              captures: { plat_v: $.data.version }
            - call: "POST /plant/certification-records"
              payload: { platform_id: "${plat_id}", region_code: "SOUTHEAST", rated_seer2_submitted: 15.80, expected_platform_version: "${plat_v}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { cert_id: $.data.id }
            - call: "POST /plant/certification-records/${cert_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "user-ce-1"
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "CERTIFIED" }
              as: RegulatoryAuditor
              as_user_id: "user-ra-1"
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-51", supply_month: "2026-11", total_allocatable_units: 50, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id, cmp_v0: $.data.version }
            - call: "POST /plant/component-supplies"
              payload: { component_type: "CONTROL_BOARD", part_number: "CTL-9X", supplier_lot_code: "LOT-CTL-77", supply_month: "2026-11", total_allocatable_units: 50, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { ctl_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-SE-1", platform_id: "${plat_id}", region_code: "SOUTHEAST", requested_units: 30, priority_score: 70, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-1"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /plant/distributor-orders/${ord_id}/allocate"
              payload: { expected_component_supply_version: "${cmp_v0}" }
              as: SupplyPlanner
            - call: "GET /plant/component-supplies/${cmp_id}"
              payload: {}
              as: SupplyPlanner
            - call: "GET /plant/distributor-orders/${ord_id}/allocation-lines"
              payload: {}
              as: SupplyPlanner
          assert:
            - "First trigger call: HTTP 200 with data.allocation_status == FULLY_ALLOCATED and data.allocated_units == 30 in the mutating response itself"
            - "Second trigger call, issued with no delay: available_units == 20, reserved_units == 30, version == 2"
            - "Third trigger call, issued with no delay: exactly 2 items, both status == RESERVED with units == 30"
            - "GET /plant/distributor-orders/${ord_id} agrees with the mutating response on allocation_status and allocated_units"
