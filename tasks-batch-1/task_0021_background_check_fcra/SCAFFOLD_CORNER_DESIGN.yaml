        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_ROLE]
        distinguishing_aspect: "Request with X-User-Role='RandomRole' (not in §1.7) returns ERR_INVALID_ROLE (401)."
