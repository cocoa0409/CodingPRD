# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >= 2 instances = 18 instances. All literals precomputed.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: longarm_estimate_vs_final_price
        grounds:
          - calculations.longarm_pricing
          - entities.LongarmJob.fields.estimated_price
          - entities.LongarmJob.fields.final_price
          - state_machines.LongarmJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Same longarm_pricing formula, estimate variant uses quoted 60x80 (=168.00) and final variant uses measured 60x82 (=172.20) on the LongarmJob (quilting service) domain; the two diverge."
        test_recipe:
          setup: ["A member; a longarm machine AVAILABLE; a QUEUED job quoted 60x80 CUSTOM no addons no rush; job scheduled and in progress."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Q Owner", email: "q1@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "LA1", model: "APQS" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 60, quoted_length_in: 80, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { job_id: $.data.id, est: $.data.estimated_price }
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T12:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /api/longarm-jobs/${job_id}/complete"
              payload: { measured_width_in: 60, measured_length_in: 82 }
              as: Clerk
              captures: { fin: $.data.final_price }
          assert:
            - "LongarmJob.${job_id}.estimated_price == 168.00"
            - "LongarmJob.${job_id}.final_price == 172.20"
            - "LongarmJob.${job_id}.final_price != LongarmJob.${job_id}.estimated_price"

      - name: special_order_quote_vs_final_total
        grounds:
          - calculations.special_order_pricing
          - entities.SpecialOrder.fields.quoted_price
          - entities.SpecialOrder.fields.final_total
          - state_machines.SpecialOrder.QUOTED_to_FULFILLED
        distinguishing_aspect: "special_order_pricing on the SpecialOrder (retail special-order) domain: estimate quoted_price=45.00 excludes shipping and uses est_unit_cost; final_total=59.00 uses actual_unit_cost 12 plus shipping 5; different entity domain from longarm."
        test_recipe:
          setup: ["A member; a QUOTED special order qty 3 est_unit_cost 10.00."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "S Buyer", email: "s1@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/special-orders"
              payload: { member_id: "${m_id}", description: "Ruler set", quantity: 3, est_unit_cost: 10.00 }
              as: Clerk
              captures: { so_id: $.data.id, q: $.data.quoted_price }
          trigger:
            - call: "POST /api/special-orders/${so_id}/fulfill"
              payload: { actual_unit_cost: 12.00, shipping_cost: 5.00 }
              as: Clerk
              captures: { ft: $.data.final_total }
          assert:
            - "SpecialOrder.${so_id}.quoted_price == 45.00"
            - "SpecialOrder.${so_id}.final_total == 59.00"
            - "SpecialOrder.${so_id}.final_total != SpecialOrder.${so_id}.quoted_price"

  - rule_id: combinatorial_formula
    instances:
      - name: longarm_final_price_tiered_addons_rush
        grounds:
          - calculations.longarm_pricing
          - entities.LongarmJob.fields.estimated_price
          - entities.LongarmJob.fields.pattern_tier
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — area 8000>7500 triggers LARGE_SURCHARGE (*1.1) nested, then BATTING_FEE+THREAD_FEE, then RUSH_MULTIPLIER, then max(.,MIN_CHARGE): 8000*0.02*1.1+25+12 = 213 -> *1.25 = 266.25."
        test_recipe:
          setup: ["A member; a QUEUED job quoted 100x80 EDGE_TO_EDGE, batting+thread+rush all true."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Big Quilt", email: "b1@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 100, quoted_length_in: 80, pattern_tier: "EDGE_TO_EDGE", batting_addon: true, thread_addon: true, rush: true }
              as: Clerk
              captures: { job_id: $.data.id }
          assert:
            - "LongarmJob.${job_id}.estimated_price == 266.25"
            - "LongarmJob.${job_id}.status == QUEUED"

      - name: kit_price_round_per_component_then_sum
        grounds:
          - calculations.kit_price
          - entities.Kit.fields.materials_cost
          - entities.Kit.fields.kit_price
        distinguishing_aspect: "Mode (b): pinned rounding order. Two components 1.5yd @ 3.33 each: round(4.995,2)=5.00 per line then sum = 10.00 (sum-then-round would give 9.99); kit_price = round(10.00*1.4,2)=14.00."
        test_recipe:
          setup: ["A fabric bolt priced 3.33/yd; a kit with two components each 1.5 yd of that bolt qty 1."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "CT-333", color: "Sunwash", price_per_yard: 3.33, original_yards: 50 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          trigger:
            - call: "POST /api/kits"
              payload: { name: "Sunwash BOM", kit_type: "BOM", components: [ { bolt_id: "${bolt_id}", yards_per_kit: 1.5, quantity: 1 }, { bolt_id: "${bolt_id}", yards_per_kit: 1.5, quantity: 1 } ] }
              as: Clerk
              captures: { kit_id: $.data.id }
          assert:
            - "Kit.${kit_id}.materials_cost == 10.00"
            - "Kit.${kit_id}.kit_price == 14.00"

  - rule_id: non_linear_state_machine
    instances:
      - name: class_event_open_full_cycle
        grounds:
          - state_machines.ClassEvent.OPEN_to_FULL
          - state_machines.ClassEvent.FULL_to_OPEN
          - entities.ClassEvent.fields.seats_taken
        distinguishing_aspect: "ClassEvent is cyclic A->B->A: capacity 1 goes OPEN->FULL on the first enrollment, then FULL->OPEN when that enrollment is cancelled; the same row re-enters OPEN."
        test_recipe:
          setup: ["A capacity-1 OPEN class; a member; the member enrolled (class now FULL)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Cyc M", email: "cyc@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Mini", event_type: "CLASS", instructor: "Ivy", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T12:00:00Z", capacity: 1, fee: 20.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /api/enrollments/${e_id}/cancel"
              payload: {}
              as: Clerk
          assert:
            - "ClassEvent.${c_id}.status == OPEN"
            - "ClassEvent.${c_id}.seats_taken == 0"

      - name: special_order_requote_cycle
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_QUOTED
          - concurrency_rules[special-order-revise-stale-version]
          - entities.SpecialOrder.fields.quoted_price
        distinguishing_aspect: "SpecialOrder is cyclic via a QUOTED->QUOTED revision loop: revise-quote leaves status QUOTED, recomputes quoted_price 30.00->60.00, and increments version 1->2, so the machine is not a linear pipeline."
        test_recipe:
          setup: ["A member; a QUOTED special order qty 2 est_unit_cost 10.00 (quoted_price 30.00, version 1)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Rq M", email: "rq@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/special-orders"
              payload: { member_id: "${m_id}", description: "Bobbins", quantity: 2, est_unit_cost: 10.00 }
              as: Clerk
              captures: { so_id: $.data.id, so_v: $.data.version }
          trigger:
            - call: "POST /api/special-orders/${so_id}/revise-quote"
              payload: { est_unit_cost: 20.00, quantity: 2, expected_special_order_version: "${so_v}" }
              as: Clerk
              captures: { so_v2: $.data.version }
          assert:
            - "SpecialOrder.${so_id}.status == QUOTED"
            - "SpecialOrder.${so_id}.quoted_price == 60.00"
            - "SpecialOrder.${so_id}.version == 2"

  - rule_id: transitive_cascade
    instances:
      - name: class_cancel_cascades_to_loyalty_reversal
        grounds:
          - state_machines.ClassEvent.OPEN_to_CANCELLED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - entities.LoyaltyTransaction.fields.points
          - entities.Member.fields.points_balance
        distinguishing_aspect: "Depth-3 chain from ClassEvent cancel: ClassEvent.cancel -> Enrollment.CANCELLED (hop1) -> reversing LoyaltyTransaction -600 created (hop2) -> Member.points_balance recomputed 600->0 (hop3). Each hop caused by the previous."
        test_recipe:
          setup: ["A member with 0 points; an OPEN class fee 60.00; member enrolled (points_balance 600)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Cas M", email: "cas@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Retreat", event_type: "RETREAT", instructor: "Rae", start_time: "2026-10-01T09:00:00Z", end_time: "2026-10-03T17:00:00Z", capacity: 10, fee: 60.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /api/classes/${c_id}/cancel"
              payload: {}
              as: Clerk
          assert:
            - "ClassEvent.${c_id}.status == CANCELLED"
            - "Enrollment.${e_id}.status == CANCELLED"
            - "Member.${m_id}.points_balance == 0"

      - name: special_order_fulfill_earns_loyalty
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_FULFILLED
          - entities.LoyaltyTransaction.fields.points
          - entities.Member.fields.points_balance
        distinguishing_aspect: "Depth-2 chain from a different trigger (SpecialOrder fulfill): fulfill -> LoyaltyTransaction +590 created (hop1) -> Member.points_balance recomputed to 590 (hop2). final_total 59.00 * POINTS_PER_DOLLAR floored = 590."
        test_recipe:
          setup: ["A member with 0 points; a QUOTED special order qty 3 est 10.00."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Ful M", email: "ful@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/special-orders"
              payload: { member_id: "${m_id}", description: "Thread cones", quantity: 3, est_unit_cost: 10.00 }
              as: Clerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /api/special-orders/${so_id}/fulfill"
              payload: { actual_unit_cost: 12.00, shipping_cost: 5.00 }
              as: Clerk
          assert:
            - "SpecialOrder.${so_id}.status == FULFILLED"
            - "Member.${m_id}.points_balance == 590"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cut_discontinued_beats_insufficient_yardage
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - state_machines.FabricBolt.IN_STOCK_to_DISCONTINUED
        distinguishing_aspect: "Category pair {state (p5), business_fiscal (p9)}: a cut on a DISCONTINUED bolt for 20 yd against 10 remaining violates both; the state error ERR_BOLT_DISCONTINUED wins over ERR_INSUFFICIENT_YARDAGE."
        test_recipe:
          setup: ["A DISCONTINUED bolt with original_yards 10, price 5.00."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "DC-1", color: "Retired", price_per_yard: 5.00, original_yards: 10, reorder_threshold: 2 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/fabric-bolts/${bolt_id}/discontinue"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 20 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOLT_DISCONTINUED"
            - "http_status == 409"

      - name: start_maintenance_beats_invalid_window
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.LongarmJob.QUEUED_to_IN_PROGRESS
        distinguishing_aspect: "Category pair {state (p5), business_temporal (p7)}: starting a job on a MAINTENANCE machine with scheduled_end before scheduled_start violates both; state error ERR_MACHINE_UNAVAILABLE wins over ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup: ["A member; a QUEUED job; a machine created in MAINTENANCE."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Mnt M", email: "mnt@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "Down", model: "Gammill", status: "MAINTENANCE" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 50, quoted_length_in: 50, pattern_tier: "EDGE_TO_EDGE" }
              as: Clerk
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MACHINE_UNAVAILABLE"
            - "http_status == 409"

  - rule_id: boundary_precision_check
    instances:
      - name: bolt_reorder_threshold_exact_low_stock
        grounds:
          - state_machines.FabricBolt.IN_STOCK_to_LOW_STOCK
          - calculations.bolt_yards_remaining
          - entities.FabricBolt.fields.reorder_threshold
        distinguishing_aspect: "Yardage metric via POST /api/fabric-cuts: reorder uses <= not <. original 10, threshold 3; a 7-yd cut lands yards_remaining exactly at 3 (== threshold) -> LOW_STOCK, not IN_STOCK."
        test_recipe:
          setup: ["A bolt original_yards 10, reorder_threshold 3, price 1.00, IN_STOCK."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "BD-1", color: "Edge", price_per_yard: 1.00, original_yards: 10, reorder_threshold: 3 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 7 }
              as: Clerk
          assert:
            - "FabricBolt.${bolt_id}.yards_remaining == 3"
            - "FabricBolt.${bolt_id}.status == LOW_STOCK"

      - name: class_capacity_last_seat_full
        grounds:
          - state_machines.ClassEvent.OPEN_to_FULL
          - calculations.class_seats_taken
          - validations[priority=9]
        distinguishing_aspect: "Seat-count metric via POST /api/enrollments: enroll permitted while seats_taken < capacity. Capacity 2: first two enrollments succeed, seats_taken reaches exactly 2 (== capacity) -> FULL; a third enrollment is rejected ERR_CLASS_FULL."
        test_recipe:
          setup: ["A capacity-2 OPEN class; two members already enrolled (class FULL); a third member exists."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Seat A", email: "sa@x.com" }
              as: Clerk
              captures: { ma_id: $.data.id }
            - call: "POST /api/members"
              payload: { name: "Seat B", email: "sb@x.com" }
              as: Clerk
              captures: { mb_id: $.data.id }
            - call: "POST /api/members"
              payload: { name: "Seat C", email: "sc@x.com" }
              as: Clerk
              captures: { mc_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "FMQ", event_type: "CLASS", instructor: "Fay", start_time: "2026-09-05T10:00:00Z", end_time: "2026-09-05T14:00:00Z", capacity: 2, fee: 30.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${ma_id}" }
              as: Clerk
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${mb_id}" }
              as: Clerk
          trigger:
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${mc_id}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "ClassEvent.${c_id}.seats_taken == 2"
            - "ClassEvent.${c_id}.status == FULL"
            - "response.data.error_id == ERR_CLASS_FULL"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: longarm_start_requires_machine_available
        grounds:
          - state_machines.LongarmJob.QUEUED_to_IN_PROGRESS
          - entities.LongarmMachine.fields.status
          - validations[priority=5]
        distinguishing_aspect: "Pair LongarmJob->LongarmMachine: a job's QUEUED->IN_PROGRESS is blocked when the referenced machine.status != AVAILABLE; MAINTENANCE machine -> ERR_MACHINE_UNAVAILABLE (valid-window slot)."
        test_recipe:
          setup: ["A member; a QUEUED job; a MAINTENANCE machine."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Ce1 M", email: "ce1@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "Serviced", model: "Innova", status: "MAINTENANCE" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 40, quoted_length_in: 40, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MACHINE_UNAVAILABLE"
            - "LongarmJob.${job_id}.status == QUEUED"

      - name: enroll_requires_class_open
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - entities.ClassEvent.fields.status
          - validations[priority=5]
        distinguishing_aspect: "Pair Enrollment->ClassEvent (different from Job->Machine): enrolling requires the target class.status in {OPEN, FULL}; a CANCELLED class rejects enrollment with ERR_CLASS_NOT_OPEN."
        test_recipe:
          setup: ["A member; a class that has been CANCELLED."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Ce2 M", email: "ce2@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Dead", event_type: "CLASS", instructor: "Deb", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 5, fee: 25.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/classes/${c_id}/cancel"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLASS_NOT_OPEN"

  - rule_id: resource_temporal_overlap
    instances:
      - name: longarm_machine_buffer_overlap
        grounds:
          - state_machines.LongarmJob.QUEUED_to_IN_PROGRESS
          - entities.LongarmJob.fields.scheduled_start
          - validations[priority=7]
        distinguishing_aspect: "LongarmMachine resource, buffer semantics: two jobs on one machine need SETUP_BUFFER_MINUTES (30) gap. Job1 [10:00,12:00], job2 [12:15,13:00] have a 15-min gap < 30 -> ERR_MACHINE_SCHEDULE_CONFLICT even though intervals do not overlap."
        test_recipe:
          setup: ["A member; an AVAILABLE machine; job1 IN_PROGRESS on it [10:00,12:00]; job2 QUEUED."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Buf M", email: "buf@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "Bay1", model: "APQS" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 50, quoted_length_in: 50, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { j1_id: $.data.id }
            - call: "POST /api/longarm-jobs/${j1_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }
              as: Clerk
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 55, quoted_length_in: 55, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { j2_id: $.data.id }
          trigger:
            - call: "POST /api/longarm-jobs/${j2_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-03T12:15:00Z", scheduled_end: "2026-08-03T13:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MACHINE_SCHEDULE_CONFLICT"
            - "LongarmJob.${j2_id}.status == QUEUED"

      - name: member_class_schedule_overlap
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - entities.ClassEvent.fields.start_time
          - validations[priority=7]
        distinguishing_aspect: "Member resource, half-open interval semantics (no buffer, back-to-back allowed): a member cannot hold two CONFIRMED enrollments whose class times overlap. Class A [10:00,12:00], class B [11:00,13:00] overlap -> ERR_MEMBER_SCHEDULE_CONFLICT."
        test_recipe:
          setup: ["A member enrolled in class A [10:00,12:00]; class B [11:00,13:00] OPEN."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Ovr M", email: "ovr@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "A", event_type: "CLASS", instructor: "Ann", start_time: "2026-09-20T10:00:00Z", end_time: "2026-09-20T12:00:00Z", capacity: 5, fee: 20.00 }
              as: Clerk
              captures: { ca_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "B", event_type: "CLASS", instructor: "Bo", start_time: "2026-09-20T11:00:00Z", end_time: "2026-09-20T13:00:00Z", capacity: 5, fee: 20.00 }
              as: Clerk
              captures: { cb_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${ca_id}", member_id: "${m_id}" }
              as: Clerk
          trigger:
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${cb_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_SCHEDULE_CONFLICT"

  - rule_id: compensating_invariant
    instances:
      - name: fabric_yardage_conserved_on_cut_void
        grounds:
          - state_machines.FabricBolt.IN_STOCK_to_LOW_STOCK
          - calculations.bolt_yards_remaining
          - entities.FabricCut.fields.status
        distinguishing_aspect: "Conserved quantity = bolt yardage: invariant yards_remaining + SUM(CUT cuts.yards_requested) == original_yards (10). A 4-yd cut then void restores yards_remaining to exactly 10, cut -> VOIDED; no drift."
        test_recipe:
          setup: ["A bolt original_yards 10, price 2.00; a 4-yd CUT (yards_remaining 6)."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "IV-1", color: "Teal", price_per_yard: 2.00, original_yards: 10, reorder_threshold: 2 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 4 }
              as: Clerk
              captures: { cut_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-cuts/${cut_id}/void"
              payload: {}
              as: Clerk
          assert:
            - "FabricCut.${cut_id}.status == VOIDED"
            - "FabricBolt.${bolt_id}.yards_remaining == 10"
            - "FabricBolt.${bolt_id}.status == IN_STOCK"

      - name: loyalty_points_conserved_on_enroll_cancel
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - entities.LoyaltyTransaction.fields.points
          - entities.Member.fields.points_balance
        distinguishing_aspect: "Conserved quantity = loyalty points (different from yardage): forward enroll earns +300, compensating cancel writes -300, leaving Member.points_balance back at the pre-enroll value 0."
        test_recipe:
          setup: ["A member with 0 points; an OPEN class fee 30.00; member enrolled (points 300)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Inv2 M", email: "inv2@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Comp", event_type: "CLASS", instructor: "Cyn", start_time: "2026-11-01T10:00:00Z", end_time: "2026-11-01T12:00:00Z", capacity: 5, fee: 30.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /api/enrollments/${e_id}/cancel"
              payload: {}
              as: Clerk
          assert:
            - "Enrollment.${e_id}.status == CANCELLED"
            - "Member.${m_id}.points_balance == 0"
