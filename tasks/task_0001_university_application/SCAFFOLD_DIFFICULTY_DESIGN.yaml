              payload: { application_id: "${app2}", recommender_id: "${rec2}" }
              as: Applicant
              as_user_id: "${a2}"
              captures: { l2: $.data.id }
            - call: "POST /recommendation-letters/${l2}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec2}"
            - call: "POST /recommendation-letters/${l2}/submit"
              payload: { body: "Letter two body extending past the two hundred character minimum, with a careful evaluation of Applicant 2's academic performance, classroom conduct, intellectual disposition, and personal growth observed." }
              as: Recommender
              as_user_id: "${rec2}"
            - call: "POST /applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a2}"
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v2_review: $.data.version }
            - call: "POST /applications/${app2}/decide"
              payload: { decision: "WAITLIST", expected_application_version: "${v2_review}" }
              as: AdmissionsOfficer
            # First yield run — succeeds; promotes Applicant 1 (rank 1) to ADMITTED.
            # This sets last_yield_run_at to current clock (2030-10-01T00:00:00Z).
            - call: "POST /admission-cycles/${school_id}/run-yield"
              payload: {}
              as: AdmissionsOfficer
            # Applicant 1 accepts → confirmed_enrollment_count=1, posture=AT_TARGET
            - call: "POST /applications/${app1}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${a1}"
            # Advance the clock by only 1 hour — still within cooldown
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /admission-cycles/${school_id}/run-yield"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_NO_OPEN_SEATS' (priority 18, business_fiscal — wins because School.posture == 'AT_TARGET'; the cooldown check at priority 19 is not reached even though delta=3_600_000 ms < 86_400_000 ms)"

  # --------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # --------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: essay_word_count_upper_boundary_inclusive
        grounds:
          - validations[priority=14]
          - entities.EssaySubmission.fields.body
          - entities.EssaySubmission.fields.word_count
          - errors[ERR_ESSAY_WORD_COUNT_OUT_OF_RANGE]
        distinguishing_aspect: |
          Numeric upper bound on EssaySubmission.word_count: 650 is ACCEPTED (inclusive),
          651 is REJECTED. Metric = whitespace-separated token count; endpoint =
          POST /essay-submissions. Distinct from the count-based capacity boundary in
          instance 2 (different metric, different endpoint).
        test_recipe:
          setup:
            - "Applicant in DRAFT with one DRAFT Application"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "ESS-WC", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "ess@x.com", full_name: "Ess", gpa: 3.5, sat_total: 1200 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "essr@x.com", full_name: "EssR", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            # 650-word body (accepted boundary): build via repetition. Using prose form here;
            # the test-generator will materialise a 650-word string (650 whitespace tokens).
          trigger:
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "PROMPT", body: "<652_word_body_string_with_651_whitespace_tokens>" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_ESSAY_WORD_COUNT_OUT_OF_RANGE' (651 tokens rejected; 650 would be accepted — inclusive boundary)"
            - "A separate POST /essay-submissions on a freshly-created DRAFT Application with exactly 650 whitespace tokens returns HTTP 201 and EssaySubmission.word_count == 650"

