          assert:
            - "each of the ten triggers returns HTTP 404 with an error envelope carrying error_id and message"
            - "the ten error_ids are, in order: ERR_SPECIES_NOT_FOUND, ERR_PROPONENT_NOT_FOUND, ERR_PROJECT_ACTION_NOT_FOUND, ERR_PRESENCE_DETERMINATION_NOT_FOUND, ERR_CONSULTATION_NOT_FOUND, ERR_HCP_NOT_FOUND, ERR_CONSERVATION_BANK_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_MONITORING_REPORT_NOT_FOUND, ERR_CIRCUMSTANCE_EVENT_NOT_FOUND"
            - "GET /species/00000000-0000-4000-8000-000000000000/critical-habitat-units also returns ERR_SPECIES_NOT_FOUND (404) rather than an empty 200 list"
            - "GET /project-actions/00000000-0000-4000-8000-000000000000/habitat-conservation-plans returns ERR_PROJECT_ACTION_NOT_FOUND (404), not an empty list"

