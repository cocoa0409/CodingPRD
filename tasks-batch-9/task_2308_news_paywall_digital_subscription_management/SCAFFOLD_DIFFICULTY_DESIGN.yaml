              as: Reader
              as_user_id: "${rd_loyal}"
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rd_loyal}"
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rd_loyal}"
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rd_loyal}"
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rd_loyal}"
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rd_loyal}"
          trigger:
            - call: "POST /paywall/readers/${rd_loyal}/events"
              payload: { event_type: "INTERVENTION_EDITORIAL", occurred_at: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
