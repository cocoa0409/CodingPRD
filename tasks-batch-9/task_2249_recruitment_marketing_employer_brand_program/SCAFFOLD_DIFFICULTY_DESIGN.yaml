  # =========================================================================
  # Rule 3 - non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: posting_optimize_self_transition_retracts_compliance_clearance
        grounds:
          - state_machines.JobPosting.OPTIMIZED_to_OPTIMIZED
          - state_machines.JobPosting.UNREVIEWED_to_CLEARED
          - state_machines.JobPosting.OPTIMIZED_to_PUBLISHED
          - entities.JobPosting.fields.content_status
          - entities.JobPosting.fields.compliance_status
          - entities.JobPosting.fields.cleared_by_user_id
          - calculations.posting_optimization_score
        distinguishing_aspect: |
          JobPosting runs two orthogonal dimensions at once, and the content dimension carries a
          legal OPTIMIZED -> OPTIMIZED self-transition: a second optimize revision leaves
          content_status where it was but drags compliance_status backwards from CLEARED to
          UNREVIEWED and nulls cleared_by_user_id, so the pair (OPTIMIZED, CLEARED) is reached
          twice through different histories and the publish gate that passed before now fails.
          A linear reading - one status field, forward-only - cannot express either the self-loop
          or the backwards move on the parallel dimension.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program, one JobFamily with an APPROVED CandidatePersona."
            - "One JobPosting created with title Senior Backend Engineer (3 words), responsibility_count 6, benefit_count 5, a valid pay range and eeo_statement_included true - a first optimize therefore scores 25 + 20 + 15 + 15 + 25 = 100."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 0, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, v0: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${v0}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { v1: $.data.version }
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "first clearance" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
              captures: { v2: $.data.version, cleared_first_by: $.data.cleared_by_user_id }
          trigger:
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${v2}", benefit_count: 2 }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { v3: $.data.version }
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "re-cleared after revision" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
          assert:
            - "After the setup optimize: JobPosting.${posting_id}.content_status == OPTIMIZED, optimization_score == 100, optimized_by_user_id == u-lead-1"
            - "After the setup compliance review: compliance_status == CLEARED, cleared_by_user_id == u-comp-1, content_status still OPTIMIZED"
            - "Trigger call 1 (second optimize) returns 200: content_status is still OPTIMIZED (legal self-transition), optimization_score == 85, compliance_status == UNREVIEWED, cleared_by_user_id == null"
            - "Trigger call 2 (publish) fails 409 with error_id ERR_POSTING_COMPLIANCE_NOT_CLEARED and content_status remains OPTIMIZED"
            - "Trigger call 3 (re-review) returns 200 with compliance_status == CLEARED"
            - "Trigger call 4 (publish) returns 200 with content_status == PUBLISHED, compliance_status == CLEARED, optimization_score == 85"
            - "JobPosting.${posting_id}.version has advanced monotonically across all six mutating calls and ${v3} > ${v2} > ${v1} > ${v0}"

      - name: employer_review_legal_rejection_cycle_revisits_drafting_twice
        grounds:
          - state_machines.EmployerReview.LEGAL_REVIEW_to_DRAFTING
          - state_machines.EmployerReview.TRIAGED_to_DRAFTING
          - state_machines.EmployerReview.DRAFTING_to_LEGAL_REVIEW
          - entities.EmployerReview.fields.rejection_count
          - entities.EmployerReview.fields.sla_status
          - calculations.program_brand_health_score
        distinguishing_aspect: |
          The response workflow is a cycle, not a chain - LEGAL_REVIEW rejects back into DRAFTING
          an unbounded number of times, DRAFTING accepts a self-transition for each redraft, and
          only rejection_count distinguishes the second visit to DRAFTING from the first. The same
          state is entered three times with three different counter values, and the terminal
          RESPONSE_PUBLISHED is reachable only through the loop's exit edge.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One Program with no other EmployerReview rows, so brand_health_score starts at 100.00."
            - "One EmployerReview on GLASSDOOR with rating 3 and posted_at 2026-07-31T12:00:00Z; review_response_deadline gives 72 hours, so response_due_at is 2026-08-03T12:00:00Z - comfortably in the future for the whole test."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR" }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-88120", rating: 3, posted_at: "2026-07-31T12:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id, due_at: $.data.response_due_at }
            - call: "POST /employer-reviews/${review_id}/triage"
              payload: { note: "needs a public response" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/draft-response"
              payload: { response_body: "Thank you for the feedback - draft 1." }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/submit-legal"
              as: CommunityManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /employer-reviews/${review_id}/legal-review"
              payload: { decision: "REJECT", note: "tone too defensive" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /employer-reviews/${review_id}/draft-response"
              payload: { response_body: "Thank you for the feedback - draft 2." }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/submit-legal"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/legal-review"
              payload: { decision: "REJECT", note: "one unverifiable claim remains" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /employer-reviews/${review_id}/draft-response"
              payload: { response_body: "Thank you for the feedback - draft 3." }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/submit-legal"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews/${review_id}/legal-review"
              payload: { decision: "APPROVE", note: "cleared for publication" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
          assert:
            - "EmployerReview.${review_id}.response_due_at == 2026-08-03T12:00:00Z (72-hour band for rating 3)"
            - "After trigger call 1: state == DRAFTING, rejection_count == 1, response_body still holds draft 1 (retained for editing)"
            - "After trigger call 4: state == DRAFTING, rejection_count == 2, response_body holds draft 2"
            - "After trigger call 7: state == RESPONSE_PUBLISHED, rejection_count == 2 (approval does not touch the counter)"
            - "EmployerReview.${review_id}.response_body == Thank you for the feedback - draft 3."
            - "EmployerReview.${review_id}.drafted_by_user_id == u-cm-1 and approved_by_user_id == u-comp-1"
            - "EmployerReview.${review_id}.sla_status == MET and responded_at == 2026-08-01T00:00:00Z"
            - "Program.${program_id}.brand_health_score == 100.00 (rating 3 contributes max(0, 3 - 3) = 0 penalty and the SLA was met)"
            - "A further POST /employer-reviews/${review_id}/legal-review returns 409 ERR_REVIEW_NOT_IN_LEGAL_REVIEW - the cycle has exited to a terminal state"

  # =========================================================================
  # Rule 4 - transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: qualification_cascade_five_hops_from_decide_to_budget_release
        grounds:
          - state_machines.Application.SCREENED_to_QUALIFIED
          - state_machines.MediaFlight.ACTIVE_to_PAUSED_PACING
          - calculations.application_touch_credit
          - calculations.channel_blended_cpqa_target
          - calculations.channel_cpqa
          - entities.Channel.fields.pacing_status
          - entities.BudgetLedgerEntry.fields.entry_type
          - entities.Program.fields.committed_budget_cents
        distinguishing_aspect: |
          One POST /applications/{id}/decide propagates five hops across four other entities:
          (1) Touchpoint.credit_bp is written, (2) Channel.credited_qualified_bp rises and
          MediaFlight.qualified_credit_bp with it, (3) the channel re-prices to cpqa_cents 20000
          against a 18000 pacing threshold and flips to THROTTLED, (4) the ACTIVE flight on that
          channel is forced to PAUSED_PACING with release_reason PACING_THROTTLE, and (5) the
          released reservation writes a mirroring RELEASE ledger row that drives
          Program.committed_budget_cents and JobFamily.reserved_cents back to 0. Hop 5 is
          reachable only through hops 3 and 4 - nothing in the decide request mentions money.
        test_recipe:
          setup:
            - "Program with pool_job_board_cents 0, pool_social_cents 0, pool_programmatic_cents 0 and flex_reserve_cents 0, so the flight can only be funded from the family's dedicated budget."
            - "JobFamily SWE with cpqa_target_cents 15000 and dedicated_budget_cents 500000."
            - "Channel Board A (JOB_BOARD) with daily_capacity_cents 100000 and min_flight_days 1."
            - "One PUBLISHED, CLEARED JobPosting of that family (score 100) with an APPROVED persona."
            - "One MediaFlight 2026-08-01 -> 2026-08-08 at daily_cap_cents 50000: 7 days, base_gross 350000, TIER_1, no discount, 3 percent fee 10500, total_cost_cents 360500, fully drawn from FAMILY_DEDICATED; activated, then 20000 cents of spend recorded."
            - "Logical clock advanced to 2026-08-02T00:00:00Z before the application is submitted, so the single touchpoint at 2026-08-01T12:00:00Z is inside the (submitted_at - 30d, submitted_at] window."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, attribution_model: "LINEAR", pool_job_board_cents: 0, pool_social_cents: 0, pool_programmatic_cents: 0, flex_reserve_cents: 0 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, dedicated_budget_cents: 500000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000, min_flight_days: 1 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, posting_version: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${posting_version}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
            - call: "POST /job-postings/${posting_id}/publish"
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { program_version: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-01", end_date: "2026-08-08", daily_cap_cents: 50000, expected_program_version: "${program_version}" }
              as: MediaBuyer
              captures: { flight_id: $.data.id, total_cost: $.data.total_cost_cents }
            - call: "POST /media-flights/${flight_id}/activate"
              as: MediaBuyer
            - call: "POST /media-flights/${flight_id}/spend"
              payload: { amount_cents: 20000, spent_on: "2026-08-01" }
              as: MediaBuyer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
