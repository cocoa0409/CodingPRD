  - section: endpoints
    instances:
      - name: issue_endpoint_full_side_effects
        claim_type: side_effect_execution
        grounds: [endpoints.POST_/registry/certifications/issue, calculations.certification_expiry_extension]
        distinguishing_aspect: "Issuance sets the full derived field set in one call: ACTIVE, issued_on == clock, expires_on == +24 months, lapse_deadline == +48 months, renewed_count 0, version 1."
        test_recipe:
          setup: ["candidate completed the full eligibility chain; clock 2026-09-04T00:00:00Z at issue"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Ivy Issue", email: "ivy@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at}/responses"
              payload: { responses: [ { item_id: "i1", difficulty_b: 0.5, correct: true }, { item_id: "i2", difficulty_b: 0.5, correct: true }, { item_id: "i3", difficulty_b: 0.5, correct: true }, { item_id: "i4", difficulty_b: 0.5, correct: true }, { item_id: "i5", difficulty_b: 0.5, correct: true }, { item_id: "i6", difficulty_b: 0.5, correct: true }, { item_id: "i7", difficulty_b: 0.5, correct: true }, { item_id: "i8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${c}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${rec}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
