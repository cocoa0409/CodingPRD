  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_daypart_update
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[daypart-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT /dayparts/{id} with a stale expected_daypart_version returns 412 ERR_STALE_VERSION; with the current version it succeeds and bumps version by 1."
        test_recipe:
          setup:
            - "StoreDay 2026-11-08; LUNCH daypart created (version 1); one successful PUT moves version to 2"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-11-08" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id, dp_v: $.data.version }
            - call: "PUT /dayparts/${dp_id}"
              payload: { base_demand_units: 15, expected_daypart_version: "${dp_v}" }
              as: StoreManager
              captures: { dp_v2: $.data.version }
          trigger:
            - call: "PUT /dayparts/${dp_id}"
              payload: { rack_capacity: 25, expected_daypart_version: "${dp_v}" }
              as: StoreManager
              captures: { err: $.data.error_id }
            - call: "PUT /dayparts/${dp_id}"
              payload: { rack_capacity: 25, expected_daypart_version: "${dp_v2}" }
              as: StoreManager
              captures: { dp_v3: $.data.version }
          assert:
            - "stale PUT returns ERR_STALE_VERSION (412)"
            - "fresh PUT succeeds and version advances from ${dp_v2} to ${dp_v2} + 1"
            - "Daypart.${dp_id}.rack_capacity == 25"

      - name: occ_stale_version_on_storeday_update
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[storeday-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT /store-days/{id} OCC: a cascade (daypart creation bumps nothing on the day, but the open transition does bump version) — a client holding the pre-open version is rejected 412."
        test_recipe:
          setup:
            - "StoreDay 2026-11-09 created (version 1) with a daypart; open bumps version to 2"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-11-09" }
              as: StoreManager
              captures: { sd_id: $.data.id, sd_v: $.data.version }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
              captures: { sd_v_open: $.data.version }
          trigger:
            - call: "PUT /store-days/${sd_id}"
              payload: { business_date: "2026-11-09", expected_store_day_version: "${sd_v}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "stale PUT returns ERR_STALE_VERSION (412) — open advanced the version past the client's view"

