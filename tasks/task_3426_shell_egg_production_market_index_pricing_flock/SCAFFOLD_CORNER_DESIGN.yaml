  # ===========================================================================
  - section: calculations
    instances:

      - name: capacity_projection_offsets_and_age_exclusion
        claim_type: correct_result
        grounds:
          - calculations.laying_capacity_projection
          - endpoints.GET_/api/complexes/{id}/capacity-projection
        distinguishing_aspect: "A 50000-hen flock at age 28 (peak band 0.92) projects 26833 dozen at offsets 0 and 4 — identical because projection ignores future mortality — 24791 at offset 23 (age 51, band 0.85), and 0 at offset 52 (age 80, auto-deplete exclusion)."
        test_recipe:
          setup: ["Complex 'Projection Farm' with LAYING flock of 50000 hens at age 28 (placement 2026-02-17, placed at clock 2026-09-01)."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Projection Farm", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-02-17T00:00:00Z", placed_hen_count: 50000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "GET /api/complexes/${cx_id}/capacity-projection"
              payload: { week_offset: 0 }
              as: ProductionPlanner
              captures: { p0: $.data.total_dozen }
            - call: "GET /api/complexes/${cx_id}/capacity-projection"
              payload: { week_offset: 4 }
              as: ProductionPlanner
              captures: { p4: $.data.total_dozen }
            - call: "GET /api/complexes/${cx_id}/capacity-projection"
              payload: { week_offset: 23 }
              as: ProductionPlanner
              captures: { p23: $.data.total_dozen }
            - call: "GET /api/complexes/${cx_id}/capacity-projection"
              payload: { week_offset: 52 }
              as: ProductionPlanner
              captures: { p52: $.data.total_dozen }
          assert:
            - "precondition: Flock.${f1_id}.age_weeks == 28 and status == LAYING"
            - "p0 == 26833 and p4 == 26833 (floor(50000 * 0.92 * 7 / 12); projection freezes hens — future mortality is deliberately ignored)"
            - "p23 == 24791 (age 51 falls to the 0.85 band)"
            - "p52 == 0 (projected age 80 hits the auto-deplete exclusion)"
