            - "the second, byte-identical lot request -> 409 with data.error_id == ERR_INSUFFICIENT_SEED_INVENTORY"
            - "the failing calculation was still performed for rung 47: the shortfall is 243125 g against 1000 g on hand"
            - "BreedingLine.${line_id}.seed_inventory_g == 1000 and reserved_seed_g == 0 after both rejections"
            - "GET /breeding-lines/${line_id}/seed-increase-lots returns total_count == 0"
