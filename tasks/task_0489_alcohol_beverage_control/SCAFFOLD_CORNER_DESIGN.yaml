            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
          trigger:
            - call: "POST /license-applications/${la_id}/approve"
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
            - "LicenseApplication.${la_id}.status == PROTEST_PERIOD"

      - name: investigator_cannot_sustain_own_violation_segregation_covered
        claim_type: segregation_of_duties
        grounds:
          - "roles"
          - "validations[priority=5]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_vs_temporal_approve_segregation_beats_window_open
          rationale: "Segregation-of-duties enforcement (ERR_SEGREGATION_OF_DUTIES) is the subject of the safety-vs-temporal §1.8 instance."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_region_version_on_submit_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[quota-reserve-stale-region]"
          - "errors[ERR_STALE_REGION_VERSION]"
        distinguishing_aspect: "A second submit carrying an expected_region_version one less than the region's current version (stale after the first submit bumped it) -> ERR_STALE_REGION_VERSION (412)."
        test_recipe:
          setup: ["Region CTY_LA cap 2 for ON_47; one application la1_id already SUBMITTED (region version advanced 1->2). A second DRAFT application la2_id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_id: $.data.id, reg_v0: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Bar One" }
              as: Director
              captures: { owner1_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner1_id}", region_code: "CTY_LA", street_address: "1 A St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner1_id}"
              captures: { prem1_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner1_id}", premise_id: "${prem1_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner1_id}"
              captures: { la1_id: $.data.id }
            - call: "POST /license-applications/${la1_id}/submit"
              payload: { expected_region_version: "${reg_v0}" }
              as: Applicant
              as_user_id: "${owner1_id}"
            - call: "POST /applicants"
              payload: { legal_name: "Bar Two" }
              as: Director
              captures: { owner2_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner2_id}", region_code: "CTY_LA", street_address: "2 B St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner2_id}"
              captures: { prem2_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner2_id}", premise_id: "${prem2_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner2_id}"
              captures: { la2_id: $.data.id }
            - call: "GET /quota-regions/${reg_id}"
              as: Director
              as_user_id: "dir-1"
              captures: { reg_v1: $.data.version }
          trigger:
            - call: "POST /license-applications/${la2_id}/submit"
              payload: { expected_region_version: "${reg_v1} - 1" }
              as: Applicant
              as_user_id: "${owner2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_REGION_VERSION"
            - "LicenseApplication.${la2_id}.status == DRAFT"

      - name: occ_stale_license_version_on_server_activate_covered
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[server-activate-stale-license]"
          - "errors[ERR_STALE_LICENSE_VERSION]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / server_activate_blocked_unless_license_active
          rationale: "The server-activate path with a re-read license version is exercised in the cross-entity §1.8 instance; the stale-version 412 corner reuses the same activate write_endpoint and occ_field."

      - name: rate_threshold_suspension_at_exactly_ten_demerits_covered
        claim_type: rate_threshold_triggers
        grounds:
          - "entities.License.fields.demerit_points"
          - "state_machines.License.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: transitive_cascade / violation_sustain_cascade_depth_four_to_server_permit_expiry
          rationale: "The demerit_points >= 10 cumulative-threshold boundary (10 triggers suspension) is asserted by the depth-4 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_response
        claim_type: immediate
        grounds:
          - "state_machines.Violation.ALLEGED_to_SUSTAINED"
          - "entities.License.fields.outstanding_fine_cents"
        distinguishing_aspect: "Sustaining a MINOR violation immediately reflects the fine on the license in a subsequent read within the same logical request flow: outstanding_fine_cents == 25000 right after sustain (no eventual lag)."
        test_recipe:
          setup: ["An ISSUED License lic_id (ACTIVE, demerit_points=0) and a MINOR Violation vio_id (ALLEGED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
              as_user_id: "dir-1"
            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
            - call: "POST /violations"
              payload: { license_id: "${lic_id}", severity: "MINOR" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { vio_id: $.data.id }
          trigger:
            - call: "POST /violations/${vio_id}/sustain"
              payload: { action_type: "FINE" }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
              captures: { act_id: $.data.action_id }
            - call: "GET /licenses/${lic_id}"
              as: Director
              as_user_id: "dir-1"
              captures: { out: $.data.outstanding_fine_cents, dp: $.data.demerit_points }
          assert:
            - "License.${lic_id}.outstanding_fine_cents == 25000"
            - "License.${lic_id}.demerit_points == 2"
            - "AdministrativeAction.${act_id}.fine_cents == 25000"
