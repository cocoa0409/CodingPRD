        excluded_because:
          difficulty_instance: resource_temporal_overlap / exclusivity_half_open_single_occupant_with_renewal_exemption
          rationale: "That instance raises ERR_EXCLUSIVITY_CONFLICT from a rival submit inside a live window and then shows the renewal exemption."

      - name: allocation_closed_error_is_reachable_after_a_close
        claim_type: triggerable
        grounds:
          - errors[ERR_ALLOCATION_CLOSED]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mdf_claim_create_depends_on_allocation_closed_state
          rationale: "That instance closes the allocation and asserts ERR_ALLOCATION_CLOSED on the next claim create."

      - name: audit_remediation_overdue_error_is_reachable
        claim_type: triggerable
        grounds:
          - errors[ERR_AUDIT_REMEDIATION_OVERDUE]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / audit_remediation_overdue_outranks_mdf_insufficiency_on_claim_create
          rationale: "That instance lets a FINDINGS_OPEN review's remediation_due_at pass and asserts the resulting freeze error."

      - name: period_capacity_error_is_reachable_from_two_allocations
        claim_type: triggerable
        grounds:
          - errors[ERR_MDF_PERIOD_CAPACITY_EXCEEDED]
          - validations[priority=51]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / mdf_period_capacity_over_inclusive_intersecting_periods
          rationale: "That instance breaches ANNUAL_MDF_CAP_CENTS across two intersecting periods and asserts the 422."

      - name: no_verified_proof_error_is_reachable_on_validation
        claim_type: triggerable
        grounds:
          - errors[ERR_NO_VERIFIED_PROOF]
          - validations[priority=42]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_verified_proofs_blocks_claim_validation
          rationale: "That instance validates a claim whose single proof is unverified and asserts ERR_NO_VERIFIED_PROOF."

  # =========================================================================
  # Table 7 - RBAC (role_model: segregation_of_duties)
  # =========================================================================
  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: role_permission
        grounds:
          - roles.Partner.exclusive_operations
          - roles.ChannelOpsAnalyst.exclusive_operations
          - roles.ChannelDirector.exclusive_operations
          - roles.DirectSalesRep.exclusive_operations
        distinguishing_aspect: "One end-to-end chain exercises an exclusive operation of all four roles - analyst enrolment, partner registration, director decision and direct-sales pursuit - and each is accepted with its declared success code."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; nothing else exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_rp_id: $.data.id }
            - call: "POST /partners/${p_rp_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_rp_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Ridge Logistics", region_code: "EU" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_rp2_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_rp_id}", account_id: "${acc_rp_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_rp_id}"
              captures: { r_rp_id: $.data.id }
            - call: "POST /deal-registrations/${r_rp_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_rp_id}"
            - call: "POST /deal-registrations/${r_rp_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${r_rp_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /accounts/${acc_rp2_id}/direct-pursuit"
              payload: { pursuit_note: "unprotected territory" }
              as: DirectSalesRep
              as_user_id: "u_dsr_1"
          assert:
            - "the two creates return 201 and DealRegistration.${r_rp_id}.status walks DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED"
            - "DealRegistration.${r_rp_id}.protection_days == 30 with exclusivity_end_at == 2026-03-31T00:00:00.000Z"
            - "Account.${acc_rp_id}.coverage_state == CHANNEL_PROTECTED with protected_partner_id == ${p_rp_id}"
            - "Account.${acc_rp2_id}.coverage_state == NAMED_DIRECT with direct_pursuit_owner_id == u_dsr_1"

      - name: roles_cannot_invoke_each_others_exclusive_operations
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.ChannelDirector.exclusive_operations
          - roles.ChannelOpsAnalyst.exclusive_operations
        distinguishing_aspect: "The priority-2 role check runs before every existence and state check, so four cross-role attempts against fabricated ids all return ERR_UNAUTHORIZED 403 rather than a 404 or a 409."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; none of the fabricated ids below exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /deal-registrations/reg_00000000-0000-4000-8000-000000000000/decision"
              payload: { decision: "APPROVE" }
              as: Partner
              as_user_id: "ptr_00000000-0000-4000-8000-000000000000"
            - call: "POST /mdf-claims/clm_00000000-0000-4000-8000-000000000000/settlement"
              payload: { action: "APPROVE_PAYMENT" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/reg_00000000-0000-4000-8000-000000000000/review"
              payload: { action: "START_REVIEW" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /partners"
              payload: { company_name: "Rogue Reseller", partner_type: "RESELLER" }
              as: DirectSalesRep
              as_user_id: "u_dsr_1"
          assert:
            - "all four calls return error_id == ERR_UNAUTHORIZED with http_status 403"
            - "no Partner row named Rogue Reseller exists afterwards"
            - "GET /partners as ChannelOpsAnalyst returns total_count == 0"

      - name: preparer_cannot_decide_the_review_it_prepared
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=22]
          - errors[ERR_SOD_SAME_ACTOR]
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties is enforced on X-User-ID, not on the role: a ChannelDirector request whose X-User-ID equals review.prepared_by_user_id is refused with ERR_SOD_SAME_ACTOR 409, and the identical request from a different user id succeeds."
        test_recipe:
          setup:
            - "Clock 2026-02-01T00:00:00.000Z; one RESELLER partner with marketing_commitment_cents 0 and no certifications."
            - "One review over [2026-01-01T00:00:00.000Z, 2026-01-31T23:59:59.999Z] with findings_count 0, prepared by u_ops_1 (provisional_score 25.0, recommended_tier REGISTERED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sd_id: $.data.id }
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p_sd_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_sd_id: $.data.id }
          trigger:
            - call: "POST /performance-reviews/${rev_sd_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_ops_1"
            - call: "POST /performance-reviews/${rev_sd_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "PerformanceReview.${rev_sd_id}.prepared_by_user_id == u_ops_1 and status == PREPARED before the trigger"
            - "the first decision returns error_id == ERR_SOD_SAME_ACTOR with http_status 409 and leaves status == PREPARED with decided_by_user_id == null"
            - "the second decision succeeds: status == APPROVED, decided_by_user_id == u_dir_1, final_score == 25.0, approved_tier == REGISTERED"
            - "Partner.${p_sd_id}.tier == REGISTERED and tier_status == COMPLIANT"

      - name: validator_cannot_settle_the_claim_it_validated
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=22]
          - errors[ERR_SOD_SAME_ACTOR]
          - state_machines.MdfClaim.settlement_state_UNPAID_to_APPROVED_FOR_PAYMENT
        distinguishing_aspect: "The second segregated pair is claim.validated_by_user_id against the settling X-User-ID: a settlement request carrying u_ops_1 is refused even though the role is ChannelDirector, and the buckets do not move until a different user settles."
        test_recipe:
