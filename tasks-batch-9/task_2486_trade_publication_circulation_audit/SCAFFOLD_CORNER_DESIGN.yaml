  # =====================================================================
  # Section 4 — Validations (§1.4). One instance per rule that §1.8 does
  # not already exercise, plus the pattern rows (cross-entity, temporal,
  # aggregate, conditional, cascading). Priority-conflict pairs are §1.8.
  # =====================================================================
  - section: validations
    instances:
      - name: duplicate_rule_dimension_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors[ERR_RULE_DIMENSION_EXISTS]
          - entities.QualificationRule.fields.dimension
        distinguishing_aspect: "The qualified-circulation definition allows exactly one rule per dimension, so the second JOB_FUNCTION rule is refused even though its allowed_values and points differ from the first."
        test_recipe:
          setup:
            - "one publication with a JOB_FUNCTION rule already defined"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "One Rule Per Dimension Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { rule_id: $.data.id, mandatory: $.data.is_mandatory }
          trigger:
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["PLANT_MGMT", "ENGINEERING_MGMT"], points: 20 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == ERR_RULE_DIMENSION_EXISTS"
            - "QualificationRule.${rule_id}.allowed_values is still [ENGINEERING_MGMT] with points 45 and ${mandatory} == true"
            - "a rule for INDUSTRY on the same publication is accepted — the uniqueness scope is (publication_id, dimension)"

      - name: reclassify_to_paid_without_payment_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=73]
          - errors[ERR_PAID_REQUIRES_PAYMENT]
          - entities.Subscriber.fields.paid_amount_cents
        distinguishing_aspect: "The payment requirement is conditional on the TARGET class: the same recipient row is refused when reclassified to PAID with no cents on file, then accepted once cents are supplied, and the copies ledger only moves on the accepted call."
        test_recipe:
          setup:
            - "one publication with a 100-copy CONTROLLED recipient that has never paid"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Paid Class Guard Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Charlie Stamping", contact_email: "c@charlie.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 100 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_c_id: $.data.id, paid_cents: $.data.paid_amount_cents }
          trigger:
            - call: "POST /circulation/subscribers/${sub_c_id}/reclassify"
              payload: { subscription_class: "PAID" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/subscribers/${sub_c_id}/reclassify"
              payload: { subscription_class: "PAID", paid_amount_cents: 5000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { new_class: $.data.subscription_class, new_cents: $.data.paid_amount_cents }
          assert:
            - "${paid_cents} == 0 on creation for a CONTROLLED recipient"
            - "the first reclassify returns HTTP 422 with ${err} == ERR_PAID_REQUIRES_PAYMENT"
            - "after the rejection Subscriber.${sub_c_id}.subscription_class is still CONTROLLED and Publication.${pub_id}.controlled_copies_on_file == 100"
            - "the second reclassify returns HTTP 200 with ${new_class} == PAID and ${new_cents} == 5000"
            - "Publication.${pub_id}.paid_copies_on_file == 100, controlled_copies_on_file == 0 and copies_on_file_total == 100"
            - "a reclassify to CONTROLLED never requires paid_amount_cents — the rule is conditional on PAID only"

      - name: verify_with_incomplete_rule_set_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=68]
          - errors[ERR_QUALIFICATION_RULES_INCOMPLETE]
          - entities.QualificationRule.fields.dimension
        distinguishing_aspect: "Validity of a request-level verify depends on the PUBLICATION's rule set being complete across all three dimensions; with PURCHASING_AUTHORITY missing the verify is refused at priority 68 even though the two defined dimensions would already total 75."
        test_recipe:
          setup:
            - "publication with only JOB_FUNCTION (45, mandatory) and INDUSTRY (30) rules — no PURCHASING_AUTHORITY rule"
            - "one recipient whose request has been reviewed and is UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Incomplete Definition Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Delta Extrusions", contact_email: "d@delta.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "QUALIFIED_NON_PAID", copies: 200 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_d_id: $.data.id, sub_d_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_d_id}/source-documents"
              payload: { doc_type: "EMAIL_CONFIRMATION", captured_at: "2026-07-25T00:00:00Z", storage_ref: "s3://circ/d-email" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_d_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_d_id}", source_document_id: "${doc_d_id}", request_channel: "EMAIL", signed_at: "2026-07-25T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_d_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_d_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_d_id}/review"
              payload: { review_note: "definition still being drafted" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { score: $.data.computed_score }
          trigger:
            - call: "POST /circulation/qualification-requests/${req_d_id}/verify"
              payload: { decision_reason: "attempting to qualify against an incomplete definition" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
          assert:
            - "${score} == 80 at review (45 + 30 + 0 for the undefined dimension, plus the EMAIL bonus 5)"
            - "HTTP 409 with ${err} == ERR_QUALIFICATION_RULES_INCOMPLETE — priority 68 precedes the score test at 70"
            - "QualificationRequest.${req_d_id}.status is still UNDER_REVIEW and decided_at is null"
            - "Subscriber.${sub_d_id}.qualification_status is still PENDING_QUALIFICATION and qualification_score == 0"

      - name: mandatory_criterion_missed_after_score_passes_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=69]
          - validations[priority=70]
          - errors[ERR_MANDATORY_CRITERION_NOT_MET]
          - calculations.qualification_score
        distinguishing_aspect: "The mandatory-dimension gate is evaluated AFTER the score threshold, so a request scoring 90 — comfortably above 70 — still fails because the single mandatory dimension contributed zero; an implementation that folds the gate into the score would return the threshold error instead."
        test_recipe:
          setup:
            - "publication whose rules are JOB_FUNCTION 20 mandatory [ENGINEERING_MGMT], INDUSTRY 50 [MANUFACTURING], PURCHASING_AUTHORITY 30 [APPROVES]"
            - "a SALES recipient who attests SALES, MANUFACTURING and APPROVES, signed 2026-07-10 by direct mail"
            - "the request has been reviewed and is UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Mandatory Gate Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 20, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 50, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
