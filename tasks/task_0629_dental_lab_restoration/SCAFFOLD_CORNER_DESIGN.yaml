scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_doctor_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Doctor.fields.full_name, entities.Doctor.fields.email]
        distinguishing_aspect: "POST /doctors with full_name+practice_name+email returns 201 with completed_case_count=0 and account_credit_cents=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /doctors"
              payload: { full_name: "Dr Z", practice_name: "ZZ", email: "z@x.com" }
              as: LabAdmin
              captures: { id: "$.data.id", ccc: "$.data.completed_case_count", acc: "$.data.account_credit_cents" }
          assert:
            - "response code == 201"
            - "Doctor.completed_case_count == 0 and Doctor.account_credit_cents == 0"
            - "Doctor.version == 1 and id is a bare UUID with no prefix"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Case, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_case_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Case.fields.intake_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases without intake_method returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a registered doctor"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr R1", practice_name: "P", email: "r1@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}" }
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_case_default_is_rush_false
        claim_type: Defaults
        grounds: [entities.Case.fields.is_rush]
        distinguishing_aspect: "Omitting is_rush on POST /cases applies the default false."
        test_recipe:
          setup: ["a registered doctor"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr R2", practice_name: "P", email: "r2@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "RX_PAPER" }
              as: LabTech
              captures: { rush: "$.data.is_rush" }
          assert:
            - "Case.is_rush == false (default applied)"

      - name: create_case_invalid_enum_intake_method_rejected
        claim_type: Type Constraints
        grounds: [entities.Case.fields.intake_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "intake_method outside {RX_PAPER, IMPRESSION, INTRAORAL_SCAN} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a registered doctor"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr R3", practice_name: "P", email: "r3@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "TELEPATHY" }
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: create_case_unknown_doctor_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Case.fields.doctor_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cases with a doctor_id that does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { doctor_id: "00000000-0000-4000-8000-000000000001", intake_method: "RX_PAPER" }
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: computed_unit_price_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Restoration.fields.unit_price_cents, calculations.line_item_pricing]
        distinguishing_aspect: "unit_price_cents is server-computed at submit; before submit it is 0 regardless of any client input."
        test_recipe:
          setup: ["an INTAKE case with one crown restoration in a 12000-base material (not yet submitted)"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr R4", practice_name: "P", email: "r4@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZC1", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { up: "$.data.unit_price_cents" }
          assert:
            - "Restoration.unit_price_cents == 0 before submit (computed only at SUBMIT_TO_DESIGN)"

      - name: list_doctors_pagination_envelope
        claim_type: Listing
        grounds: [entities.Doctor]
        distinguishing_aspect: "GET /doctors returns a paginated array with total_count and has_more in the pagination envelope."
        test_recipe:
          setup: ["two doctors registered"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr R5", practice_name: "P", email: "r5@x.com" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr R6", practice_name: "P", email: "r6@x.com" }
              as: LabAdmin
          trigger:
            - call: "GET /doctors"
              payload: { limit: 1, offset: 0 }
              as: LabAdmin
          assert:
            - "response_type == array; pagination total_count >= 2 and has_more == true with limit=1"

      - name: pagination_limit_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /doctors with limit above max (100) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /doctors"
              payload: { limit: 999, offset: 0 }
              as: LabAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID (400)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: submit_from_design_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Case.INTAKE_to_DESIGN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a case already in DESIGN returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a case that has been submitted (now in DESIGN) with one crown restoration"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr S1", practice_name: "P", email: "s1@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZS1", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Case.status stays DESIGN"

      - name: cancel_from_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Case.INTAKE_to_CANCELLED]
        distinguishing_aspect: "A second cancel on an already-CANCELLED case returns ERR_INVALID_STATE; CANCELLED is terminal."
        test_recipe:
          setup: ["a case cancelled from INTAKE"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr S2", practice_name: "P", email: "s2@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "RX_PAPER" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: Doctor
              as_user_id: "${doc_id}"
          trigger:
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: Doctor
              as_user_id: "${doc_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Case.status stays CANCELLED"

      - name: new_case_starts_in_intake
        claim_type: Initial State
        grounds: [state_machines.Case.initial_state, entities.Case.fields.status]
        distinguishing_aspect: "A freshly created case has status INTAKE, revision_count 0, billable_unit_count 0."
        test_recipe:
          setup: ["a registered doctor"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr S3", practice_name: "P", email: "s3@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "IMPRESSION" }
              as: LabTech
              captures: { st: "$.data.status" }
          assert:
            - "Case.status == INTAKE and revision_count == 0 and billable_unit_count == 0"

      - name: start_fabrication_before_scheduling_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Case.DESIGN_to_FABRICATION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-fabrication on a DESIGN case whose units have no SCHEDULED/DONE MillJob is rejected (precondition unmet)."
        test_recipe:
          setup: ["a DESIGN case with one QUEUED unit that has no MillJob yet"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr S4", practice_name: "P", email: "s4@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZS4", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
          trigger:
            - call: "POST /cases/${case_id}/start-fabrication"
              payload: {}
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Case.status stays DESIGN"

      - name: milljob_complete_from_scheduled_blocked
        claim_type: Invalid Transitions
        grounds: [state_machines.MillJob.RUNNING_to_DONE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a MillJob that is still SCHEDULED (never started) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a SCHEDULED MillJob (never started)"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr S5", practice_name: "P", email: "s5@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZS5", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /mill-machines"
              payload: { name: "M-S5", capability: "MILLED" }
              as: LabAdmin
              captures: { mach_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { rest_id: "$.data.id" }
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /restorations/${rest_id}/fabrication-units"
              payload: {}
              as: LabTech
              captures: { unit_id: "$.data[0].id" }
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit_id}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T01:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job_id: "$.data.id" }
          trigger:
            - call: "POST /mill-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); MillJob stays SCHEDULED"

      - name: case_revision_cycle_already_covered
        claim_type: Valid Transition
        grounds: [state_machines.Case.TRY_IN_to_REVISION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_tryin_revision_cycle
          rationale: "The TRY_IN->REVISION cyclic transition and its requeue side effect are asserted by the named §1.8 instance."

      - name: invoice_parallel_dimensions_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.Invoice.ISSUED_to_PAID]
        excluded_because:
          difficulty_instance: non_linear_state_machine / invoice_parallel_billing_and_delivery_dimensions
          rationale: "Pay advancing only billing_status while delivery_status stays IN_TRANSIT is the §1.8 assertion."

  # =========================================================================
  - section: calculations
    instances:
      - name: turnaround_promise_rush_halving
        claim_type: Correct Result
        grounds: [calculations.turnaround_promise, entities.Case.fields.promised_ready_at]
        distinguishing_aspect: "A rush crown submitted at 2026-01-01T00:00:00Z gets promised_ready_at = +60h = 2026-01-03T12:00:00Z (120h halved to 60h)."
        test_recipe:
          setup: ["a rush crown case submitted with the clock at 2026-01-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr C1", practice_name: "P", email: "c1@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZC2", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN", is_rush: true }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
              captures: { pr: "$.data.promised_ready_at" }
          assert:
            - "Case.promised_ready_at == 2026-01-03T12:00:00.000Z (scheduled_start 2026-01-01T00:00:00Z + 60h)"

      - name: turnaround_promise_uses_slowest_restoration_type
        claim_type: Input Set Filtering
        grounds: [calculations.turnaround_promise]
        distinguishing_aspect: "A standard case with a crown (120h) AND a denture (240h) gets promised_ready_at from the max (240h) = 2026-01-11T00:00:00Z."
        test_recipe:
          setup: ["a standard case with one crown and one denture restoration, submitted at 2026-01-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr C2", practice_name: "P", email: "c2@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZC3", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { zir_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ACR", name: "Acrylic", base_unit_price_cents: 4000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { acr_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "IMPRESSION" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${zir_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${acr_id}", restoration_type: "DENTURE", unit_count: 1, requested_shade: "A2" }
              as: LabTech
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
              captures: { pr: "$.data.promised_ready_at" }
          assert:
            - "Case.promised_ready_at == 2026-01-11T00:00:00.000Z (max(120h crown, 240h denture)=240h)"

      - name: provisional_invoice_correct_no_rush_no_discount
        claim_type: Constants Applied
        grounds: [calculations.invoice_total, entities.Invoice.fields.tax_cents]
        distinguishing_aspect: "Single crown (subtotal 12000), standard, doctor tier 0: tax = round(12000*0.0825)=990, total 12990."
        test_recipe:
          setup: ["a submitted single-crown case, standard, doctor with completed_case_count 0"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr C3", practice_name: "P", email: "c3@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "ZC4", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { tot: "$.data[0].total_cents" }
          assert:
            - "Invoice.subtotal_cents == 12000, tax_cents == 990, discount_cents == 0, total_cents == 12990, kind == PROVISIONAL"

      - name: dual_variant_provisional_final_covered
        claim_type: Variant Divergence
        grounds: [calculations.invoice_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_tier_crossing
          rationale: "Provisional-vs-final divergence on tier crossing is the named §1.8 instance."

      - name: per_unit_rounding_order_covered
        claim_type: Precision
        grounds: [calculations.line_item_pricing]
        excluded_because:
          difficulty_instance: combinatorial_formula / pricing_per_unit_round_order_pinned
          rationale: "Per-unit-round-then-sum precision is asserted by the named §1.8 instance."

  # =========================================================================
  - section: validations
    instances:
      - name: material_inactive_on_restoration_create
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_MATERIAL_INACTIVE]"]
        distinguishing_aspect: "Creating a restoration that references a Material with is_active=false returns ERR_MATERIAL_INACTIVE (422)."
        test_recipe:
          setup: ["a case in INTAKE and a Material created with is_active=false"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr V1", practice_name: "P", email: "v1@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "DEAD", name: "Discontinued", base_unit_price_cents: 8000, fabrication_process: "MILLED", is_active: false }
              as: LabAdmin
              captures: { mat_id: "$.data.id" }
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_MATERIAL_INACTIVE (422)"

      - name: machine_capability_mismatch_on_milljob
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_MACHINE_CAPABILITY_MISMATCH]"]
        distinguishing_aspect: "Scheduling a PRINTED-material unit on a MILLED-capability machine returns ERR_MACHINE_CAPABILITY_MISMATCH (422) (unit is QUEUED, so the state precondition passes)."
        test_recipe:
          setup: ["a submitted aligner case (PRINTED material) with a QUEUED unit, plus a MILLED-only machine"]
          setup_api_calls:
            - call: "POST /doctors"
              payload: { full_name: "Dr V2", practice_name: "P", email: "v2@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /materials"
              payload: { code: "PMMA2", name: "Printed", base_unit_price_cents: 5000, fabrication_process: "PRINTED" }
              as: LabAdmin
              captures: { print_mat: "$.data.id" }
            - call: "POST /mill-machines"
              payload: { name: "M-V2", capability: "MILLED" }
              as: LabAdmin
