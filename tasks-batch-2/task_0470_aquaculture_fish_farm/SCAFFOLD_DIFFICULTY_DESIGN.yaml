scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fcr_provisional_vs_final_diverges_on_cohort
        grounds:
          - calculations.compute_fcr
          - calculations.estimate_biomass
          - entities.Cohort.fields.estimated_biomass_kg
          - state_machines.HarvestOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Same Cohort feed total yields provisional_fcr=1.98 (growth-model gain) but final_fcr=2.31 (actual landed gain); the two variants operate on the Cohort feed-accounting domain."
        test_recipe:
          setup:
            - "Species SALM (base_daily_growth_g=5.0, target_market_weight_g=5000, default_processing_yield_pct=0.62)."
            - "Tank T1 OPEN; Cohort C1 (fish_count=1000, stocked_avg_weight_g=50, stocked_at 2026-01-01) in T1."
            - "One FeedLog amount_kg=300; clock advanced to 2026-02-01 (31 days elapsed)."
            - "HarvestOrder scheduled+started+completed with harvested_fish_count=1000, harvested_live_weight_kg=180.0."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: FarmManager
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-15T00:00:00Z", amount_kg: 300, feed_type: "grower" }
              as: FarmTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 1000, scheduled_at: "2026-02-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
          trigger:
            - call: "GET /cohorts/${c1}/summary"
              payload: {}
              as: FarmTechnician
              captures: { prov: $.data.provisional_fcr }
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 1000, harvested_live_weight_kg: 180.0 }
              as: HarvestOperator
          assert:
            - "GET /cohorts/${c1}/summary before completion returns provisional_fcr == 1.98 (300 / (201.82 - 50))."
            - "After completion, compute_fcr final variant = round(300 / (180.0 - 50.0), 2) == 2.31."
            - "provisional_fcr (1.98) != final_fcr (2.31): same feed total, two divergent gain denominators on the Cohort domain."

      - name: processing_yield_estimate_vs_actual_diverges_on_batch
        grounds:
          - calculations.estimate_processing_yield
          - entities.ProcessingBatch.fields.estimated_yield_kg
          - entities.ProcessingBatch.fields.actual_processed_weight_kg
          - state_machines.ProcessingBatch.PROCESSING_to_COMPLETED
        distinguishing_aspect: "Same ProcessingBatch input weight gives estimated_yield_kg=124.00 (species % forward estimate) but actual ProductLot.total_weight_kg=130.00 (operator measurement); this dual variant lives in the harvest/processing domain, distinct from the Cohort-feed FCR variant."
        test_recipe:
          setup:
            - "Species SALM (default_processing_yield_pct=0.62); Tank T1; Cohort C1 fish_count=1000."
            - "HarvestOrder completed with harvested_live_weight_kg=200.0; ProcessingBatch created (input_live_weight_kg=200.0) and started."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 500, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 500, harvested_live_weight_kg: 200.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
              captures: { est: $.data.estimated_yield_kg }
            - call: "POST /processing-batches/${pb}/complete"
              payload: { actual_processed_weight_kg: 130.0, price_per_kg: 12.50 }
              as: HarvestOperator
          assert:
            - "After start, ProcessingBatch.estimated_yield_kg == 124.00 (round(200.0 * 0.62, 2))."
            - "After complete, the created ProductLot.total_weight_kg == 130.00 (actual variant)."
            - "estimated_yield_kg (124.00) != actual ProductLot.total_weight_kg (130.00): variance 6.00 in the processing domain."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: biomass_growth_tiered_nonlinear_mode_a
        grounds:
          - calculations.estimate_biomass
          - entities.Species.fields.base_daily_growth_g
          - entities.Cohort.fields.estimated_biomass_kg
        distinguishing_aspect: "Mode (a): estimate_biomass nests fish_count × tier-selected growth × multiplicative survival floor (>=3 inputs, conditional tier branch) to give 201.82 kg at 31 days."
        test_recipe:
          setup:
            - "Species SALM base_daily_growth_g=5.0; Cohort C1 fish_count=1000, stocked_avg_weight_g=50, stocked_at 2026-01-01."
            - "Clock at 2026-02-01 (31 days, tier1 growth_factor=1.00, survival=0.9845)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FarmManager
          trigger:
            - call: "GET /cohorts/${c1}/summary"
              payload: {}
              as: FarmTechnician
              captures: { bm: $.data.estimated_biomass_kg }
          assert:
            - "estimated_biomass_kg == 201.82 (round(1000 * (50 + 31*5.0*1.00) * max(0.80, 1-0.0005*31) / 1000, 2))."
            - "days_elapsed in summary == 31."

      - name: order_total_per_line_round_then_sum_mode_b
        grounds:
          - calculations.compute_order_total
          - entities.SalesOrderLine.fields.line_subtotal
          - entities.ProductLot.fields.price_per_kg
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: "Mode (b): pinned per-line rounding (41.66 + 24.98) then SILVER discount yields order_total=59.98, whereas sum-then-round would give 59.97 — the rounding order is decisive."
        test_recipe:
          setup:
            - "Two ProductLots: LotA price_per_kg=12.50 total 100kg, LotB price_per_kg=9.99 total 50kg; both AVAILABLE, version 1."
            - "SalesOrder SILVER with two lines: LotA weight 3.333, LotB weight 2.5."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 200000, max_biomass_kg: 200000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "CA", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { ca: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${ca}", planned_fish_count: 1, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { hoa: $.data.id }
            - call: "POST /harvest-orders/${hoa}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${hoa}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${hoa}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 300.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${hoa}" }
              as: HarvestOperator
              captures: { pba: $.data.id }
            - call: "POST /processing-batches/${pba}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pba}/complete"
              payload: { actual_processed_weight_kg: 100.0, price_per_kg: 12.50 }
              as: HarvestOperator
              captures: { lotA: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "CB", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { cb: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${cb}", planned_fish_count: 1, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { hob: $.data.id }
            - call: "POST /harvest-orders/${hob}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${hob}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${hob}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 200.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${hob}" }
              as: HarvestOperator
              captures: { pbb: $.data.id }
            - call: "POST /processing-batches/${pbb}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pbb}/complete"
              payload: { actual_processed_weight_kg: 50.0, price_per_kg: 9.99 }
              as: HarvestOperator
              captures: { lotB: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme", discount_tier: "SILVER" }
              as: SalesAgent
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { product_lot_id: "${lotA}", weight_kg: 3.333 }
              as: SalesAgent
            - call: "POST /sales-orders/${so}/lines"
              payload: { product_lot_id: "${lotB}", weight_kg: 2.5 }
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
              captures: { lotA_v: $.data.version }
          trigger:
            - call: "POST /sales-orders/${so}/confirm"
              payload: { expected_lot_version: "${lotA_v}" }
              as: SalesAgent
              captures: { tot: $.data.order_total }
          assert:
            - "LotA line_subtotal == 41.66 (round(3.333*12.50,2)); LotB line_subtotal == 24.98 (round(2.5*9.99,2))."
            - "SalesOrder.order_total == 59.98 (round((41.66+24.98)*0.90,2)); sum-then-round 59.97 is wrong."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cohort_parallel_lifecycle_and_health_dimensions
        grounds:
          - state_machines.Cohort.STOCKED_to_GROWING
          - state_machines.Cohort.HEALTHY_to_UNDER_TREATMENT
          - entities.Cohort.fields.lifecycle_status
          - entities.Cohort.fields.health_status
        distinguishing_aspect: "On Cohort, lifecycle_status (STOCKED->GROWING via feeding) and health_status (HEALTHY->UNDER_TREATMENT via treatment) evolve independently: after feeding then treating, lifecycle_status==GROWING while health_status==UNDER_TREATMENT on the same row."
        test_recipe:
          setup:
            - "Species SALM; Tank T1 OPEN; Cohort C1 fish_count=1000 in T1."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-01T00:00:00Z", amount_kg: 10, feed_type: "starter" }
              as: FarmTechnician
          trigger:
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", medication: "oxytet", started_at: "2026-01-01T00:00:00Z", duration_days: 5, withdrawal_days: 10 }
              as: Veterinarian
              captures: { tx: $.data.id }
            - call: "GET /cohorts/${c1}"
              payload: {}
              as: FarmTechnician
          assert:
            - "After feed + treatment: Cohort.lifecycle_status == GROWING AND Cohort.health_status == UNDER_TREATMENT on the same Cohort."
            - "Cohort.withdrawal_until == 2026-01-16T00:00:00Z (treatment_end 2026-01-06 + 10 withdrawal days)."

      - name: tank_posture_cyclic_open_frozen_open
        grounds:
          - state_machines.Tank.OPEN_to_FROZEN
          - state_machines.Tank.FROZEN_to_OPEN
          - calculations.classify_reading
          - entities.Tank.fields.posture
        distinguishing_aspect: "On Tank, posture cycles OPEN->FROZEN (CRITICAL reading) then FROZEN->OPEN (NORMAL reading) — a true cycle returning to the initial state, distinct from the Cohort parallel-dimension shape."
        test_recipe:
          setup:
            - "Tank T1 OPEN (no posture_override)."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "T1", kind: "POND", volume_liters: 500000, max_biomass_kg: 50000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 3.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-03T00:00:00Z", dissolved_oxygen_mg_l: 8.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
            - call: "GET /tanks/${t1}"
              payload: {}
              as: FarmManager
          assert:
            - "After the DO=3.0 CRITICAL reading, Tank.posture == FROZEN."
            - "After the DO=8.0 NORMAL reading, Tank.posture == OPEN (cycled back to initial state)."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tank_freeze_cascades_to_cohort_then_harvest_order_depth3
        grounds:
          - state_machines.Tank.OPEN_to_FROZEN
          - state_machines.Cohort.STOCKED_to_GROWING
          - state_machines.HarvestOrder.SCHEDULED_to_BLOCKED
          - entities.Cohort.fields.operational_status
        distinguishing_aspect: "A CRITICAL reading freezes Tank (hop1) -> the freeze sets residing Cohort.operational_status=SUSPENDED (hop2, caused by hop1) -> the suspension blocks the SCHEDULED HarvestOrder (hop3, caused by hop2); depth 3, each hop caused by the previous."
        test_recipe:
          setup:
            - "Species SALM; Tank T1 OPEN; Cohort C1 GROWING in T1; HarvestOrder HO1 SCHEDULED on C1."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-01T00:00:00Z", amount_kg: 10, feed_type: "starter" }
              as: FarmTechnician
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 500, scheduled_at: "2026-01-05T00:00:00Z" }
              as: HarvestOperator
              captures: { ho1: $.data.id }
            - call: "POST /harvest-orders/${ho1}/schedule"
              payload: {}
              as: HarvestOperator
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-06T00:00:00Z", dissolved_oxygen_mg_l: 3.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
            - call: "GET /harvest-orders/${ho1}"
              payload: {}
              as: HarvestOperator
          assert:
            - "Tank.posture == FROZEN; Cohort.operational_status == SUSPENDED; HarvestOrder.status == BLOCKED."
            - "All three changes result from the single CRITICAL reading via the depth-3 chain."

      - name: sales_cancel_cascades_lot_release_then_status_revert_depth2
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - state_machines.ProductLot.DEPLETED_to_AVAILABLE
          - entities.ProductLot.fields.reserved_weight_kg
          - entities.ProductLot.fields.available_weight_kg
        distinguishing_aspect: "Cancelling a CONFIRMED SalesOrder releases reserved weight on the lot (hop1) -> the release pushes available_weight_kg above 0 which reverts the lot DEPLETED->AVAILABLE (hop2, caused by hop1); depth 2 from a sales trigger, distinct from the water-quality trigger."
        test_recipe:
          setup:
            - "ProductLot LotA total 50kg; SalesOrder confirmed reserving all 50kg so LotA is DEPLETED (available 0)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 1, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 80.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pb}/complete"
              payload: { actual_processed_weight_kg: 50.0, price_per_kg: 10.0 }
              as: HarvestOperator
              captures: { lotA: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme", discount_tier: "NONE" }
              as: SalesAgent
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { product_lot_id: "${lotA}", weight_kg: 50.0 }
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
              captures: { lotA_v: $.data.version }
            - call: "POST /sales-orders/${so}/confirm"
              payload: { expected_lot_version: "${lotA_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /sales-orders/${so}/cancel"
              payload: {}
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
          assert:
            - "Before cancel: LotA.available_weight_kg == 0.00, status == DEPLETED, reserved_weight_kg == 50.00."
            - "After cancel: LotA.reserved_weight_kg == 0.00, available_weight_kg == 50.00, status == AVAILABLE."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stocking_safety_beats_temporal_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_TANK_NOT_OPERATIONAL]
          - errors[ERR_TANK_OCCUPANCY_OVERLAP]
        distinguishing_aspect: "A stocking request to a FROZEN tank that ALSO overlaps an existing occupancy interval returns ERR_TANK_NOT_OPERATIONAL (priority 6 business_safety), not ERR_TANK_OCCUPANCY_OVERLAP (priority 8 business_temporal)."
        test_recipe:
          setup:
            - "Tank T1 with an existing StockingEvent [2026-01-01,2026-06-01); then T1 driven FROZEN by a CRITICAL reading."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-01-01T00:00:00Z", expected_harvest_at: "2026-06-01T00:00:00Z" }
              as: FarmTechnician
            - call: "POST /cohorts"
              payload: { label: "C2", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c2: $.data.id }
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 3.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
          trigger:
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c2}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-03-01T00:00:00Z", expected_harvest_at: "2026-09-01T00:00:00Z" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TANK_NOT_OPERATIONAL (HTTP 409); the temporal-overlap rule is not reached."

      - name: harvest_start_state_beats_withdrawal_safety
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WITHDRAWAL_ACTIVE]
        distinguishing_aspect: "Starting a DRAFT HarvestOrder (wrong state) for a cohort that is also UNDER_TREATMENT returns ERR_INVALID_STATE (priority 4 state), not ERR_WITHDRAWAL_ACTIVE (priority 7 business_safety)."
        test_recipe:
          setup:
            - "Cohort C1 UNDER_TREATMENT; HarvestOrder HO1 still in DRAFT (never scheduled)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 500, scheduled_at: "2026-01-05T00:00:00Z" }
              as: HarvestOperator
              captures: { ho1: $.data.id }
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", medication: "oxytet", started_at: "2026-01-01T00:00:00Z", duration_days: 5, withdrawal_days: 10 }
              as: Veterinarian
          trigger:
            - call: "POST /harvest-orders/${ho1}/start"
              payload: {}
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409); the withdrawal-safety rule is not reached (state precondition fails first)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: do_threshold_strict_less_than_critical
        grounds:
          - calculations.classify_reading
          - entities.WaterQualityReading.fields.severity
          - entities.Tank.fields.posture
        distinguishing_aspect: "DO exactly 4.0 is NOT critical (strict <): classifies WARNING -> Tank.posture RESTRICTED; DO 3.99 classifies CRITICAL -> FROZEN. Boundary on the DO metric via the water-quality endpoint."
        test_recipe:
          setup:
            - "Tank T1 OPEN, no override."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 4.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
              captures: { sev: $.data.severity }
            - call: "GET /tanks/${t1}"
              payload: {}
              as: FarmManager
          assert:
            - "WaterQualityReading.severity == WARNING for DO == 4.0 (not CRITICAL)."
            - "Tank.posture == RESTRICTED (not FROZEN) at the exact DO threshold."

      - name: lot_depletes_at_exactly_zero_available
        grounds:
          - state_machines.ProductLot.AVAILABLE_to_DEPLETED
          - entities.ProductLot.fields.available_weight_kg
          - entities.ProductLot.fields.status
        distinguishing_aspect: "Reserving exactly all available weight drives available_weight_kg to precisely 0.00 and flips ProductLot.status to DEPLETED; the zero-quantity boundary on the weight metric via the sales-confirm endpoint, distinct from the DO numeric threshold."
        test_recipe:
          setup:
            - "ProductLot LotA total 40kg available 40; SalesOrder with one 40kg line."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 1, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 70.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pb}/complete"
              payload: { actual_processed_weight_kg: 40.0, price_per_kg: 10.0 }
              as: HarvestOperator
              captures: { lotA: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme", discount_tier: "NONE" }
              as: SalesAgent
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { product_lot_id: "${lotA}", weight_kg: 40.0 }
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
              captures: { lotA_v: $.data.version }
          trigger:
            - call: "POST /sales-orders/${so}/confirm"
              payload: { expected_lot_version: "${lotA_v}" }
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
          assert:
            - "After confirm, LotA.available_weight_kg == 0.00 and LotA.status == DEPLETED."
            - "LotA.reserved_weight_kg == 40.00 (full reservation at the zero boundary)."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: harvest_schedule_depends_on_cohort_health
        grounds:
          - state_machines.HarvestOrder.DRAFT_to_SCHEDULED
          - state_machines.Cohort.HEALTHY_to_UNDER_TREATMENT
          - validations[priority=7]
          - errors[ERR_WITHDRAWAL_ACTIVE]
        distinguishing_aspect: "HarvestOrder DRAFT->SCHEDULED is rejected with ERR_WITHDRAWAL_ACTIVE while the referenced Cohort.health_status == UNDER_TREATMENT — the HarvestOrder<-Cohort pair."
        test_recipe:
          setup:
            - "Cohort C1 UNDER_TREATMENT; HarvestOrder HO1 DRAFT on C1."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 500, scheduled_at: "2026-01-05T00:00:00Z" }
              as: HarvestOperator
              captures: { ho1: $.data.id }
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", medication: "oxytet", started_at: "2026-01-01T00:00:00Z", duration_days: 5, withdrawal_days: 10 }
              as: Veterinarian
          trigger:
            - call: "POST /harvest-orders/${ho1}/schedule"
              payload: {}
              as: HarvestOperator
              captures: { err: $.data.error_id }
          assert:
            - "schedule returns ERR_WITHDRAWAL_ACTIVE (409) because Cohort.health_status == UNDER_TREATMENT."

      - name: stocking_depends_on_tank_posture
        grounds:
          - state_machines.Tank.OPEN_to_RESTRICTED
          - validations[priority=6]
          - errors[ERR_TANK_NOT_OPERATIONAL]
          - entities.Tank.fields.posture
        distinguishing_aspect: "POST /stocking-events is rejected with ERR_TANK_NOT_OPERATIONAL when the target Tank.posture == RESTRICTED (stocking needs OPEN) — the StockingEvent<-Tank pair, distinct from the HarvestOrder<-Cohort pair."
        test_recipe:
          setup:
            - "Tank T1 driven to RESTRICTED by a WARNING reading (DO 5.0); Cohort C1 exists."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /tanks/${t1}/water-quality-readings"
              payload: { measured_at: "2026-01-02T00:00:00Z", dissolved_oxygen_mg_l: 5.0, ammonia_mg_l: 0.1, water_temp_c: 10.0 }
              as: FarmTechnician
          trigger:
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-02-01T00:00:00Z", expected_harvest_at: "2026-06-01T00:00:00Z" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "stocking returns ERR_TANK_NOT_OPERATIONAL (409) because Tank.posture == RESTRICTED."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_occupancy_half_open_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_TANK_OCCUPANCY_OVERLAP]
          - entities.StockingEvent.fields.stocked_at
          - entities.StockingEvent.fields.expected_harvest_at
        distinguishing_aspect: "Half-open [start,end) geometric overlap on Tank occupancy: a second stocking [2026-03-01,2026-09-01) overlaps the existing [2026-01-01,2026-06-01) and is rejected; back-to-back at 2026-06-01 would be allowed."
        test_recipe:
          setup:
            - "Tank T1 OPEN with StockingEvent [2026-01-01,2026-06-01)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-01-01T00:00:00Z", expected_harvest_at: "2026-06-01T00:00:00Z" }
              as: FarmTechnician
            - call: "POST /cohorts"
              payload: { label: "C2", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /stocking-events"
              payload: { cohort_id: "${c2}", tank_id: "${t1}", fish_count: 100, stocked_at: "2026-03-01T00:00:00Z", expected_harvest_at: "2026-09-01T00:00:00Z" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "Second stocking returns ERR_TANK_OCCUPANCY_OVERLAP (409): [2026-03-01,2026-09-01) overlaps [2026-01-01,2026-06-01)."

      - name: treatment_window_buffer_extended_overlap
        grounds:
          - validations[priority=9]
          - calculations.compute_treatment_window
          - errors[ERR_TREATMENT_WINDOW_CONFLICT]
          - entities.HealthTreatment.fields.withdrawal_end_at
        distinguishing_aspect: "Buffer-extended interval on HealthTreatment: a second treatment on the same tank starting 2026-01-10 is rejected because it precedes the prior treatment's withdrawal_end_at 2026-01-16 (the withdrawal period acts as a mandatory fallow buffer) — distinct interval arithmetic from half-open occupancy."
        test_recipe:
          setup:
            - "Tank T1 with two cohorts C1, C2; C1 treated 2026-01-01 (duration 5, withdrawal 10 -> withdrawal_end_at 2026-01-16)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C2", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c2: $.data.id }
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c1}", tank_id: "${t1}", medication: "oxytet", started_at: "2026-01-01T00:00:00Z", duration_days: 5, withdrawal_days: 10 }
              as: Veterinarian
          trigger:
            - call: "POST /health-treatments"
              payload: { cohort_id: "${c2}", tank_id: "${t1}", medication: "florfenicol", started_at: "2026-01-10T00:00:00Z", duration_days: 3, withdrawal_days: 7 }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "Second treatment returns ERR_TREATMENT_WINDOW_CONFLICT (409): started_at 2026-01-10 < prior withdrawal_end_at 2026-01-16."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grading_split_conserves_fish_count
        grounds:
          - state_machines.GradingEvent.PLANNED_to_COMMITTED
          - validations[priority=10]
          - entities.Cohort.fields.fish_count
          - concurrency_rules[grading-commit-stale-cohort]
        distinguishing_aspect: "Conserved quantity = total live fish: committing a grading split of a 1000-fish cohort into 600+400 leaves sum(child.fish_count)==1000==pre-split source.fish_count, with source consumed to 0."
        test_recipe:
          setup:
            - "Species SALM; Tanks T1,T2,T3 OPEN; Cohort C1 fish_count=1000 in T1 (STOCKED, version 1)."
            - "GradingEvent G1 PLANNED with splits 600->T2, 400->T3."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T2", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t2: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T3", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t3: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /grading-events"
              payload: { source_cohort_id: "${c1}", planned_splits: [ { label: "big", fish_count: 600, target_tank_id: "${t2}", avg_weight_g: 60 }, { label: "small", fish_count: 400, target_tank_id: "${t3}", avg_weight_g: 40 } ] }
              as: FarmTechnician
              captures: { g1: $.data.id }
            - call: "POST /grading-events/${g1}/plan"
              payload: {}
              as: FarmTechnician
          trigger:
            - call: "POST /grading-events/${g1}/commit"
              payload: { expected_source_cohort_version: "${c1_v}" }
              as: FarmTechnician
              captures: { kids: $.data.child_cohort_ids }
            - call: "GET /cohorts/${c1}"
              payload: {}
              as: FarmTechnician
          assert:
            - "Source Cohort C1.fish_count == 0 and lifecycle_status == HARVESTED after commit."
            - "Two child cohorts created with fish_count 600 and 400; 600 + 400 == 1000 == pre-split source.fish_count (no fish created/destroyed)."

      - name: sales_reserve_release_conserves_lot_weight
        grounds:
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - entities.ProductLot.fields.total_weight_kg
          - entities.ProductLot.fields.available_weight_kg
        distinguishing_aspect: "Conserved quantity = lot weight: across confirm (reserve 30 of 50) then cancel (release 30), ProductLot total_weight_kg==50 stays invariant as total == available + reserved + shipped at every step — a different conserved quantity than grading fish count."
        test_recipe:
          setup:
            - "ProductLot LotA total 50kg, available 50; SalesOrder with a 30kg line."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 1000, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /harvest-orders"
              payload: { cohort_id: "${c1}", planned_fish_count: 1, scheduled_at: "2026-01-01T00:00:00Z" }
              as: HarvestOperator
              captures: { ho: $.data.id }
            - call: "POST /harvest-orders/${ho}/schedule"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest-orders/${ho}/complete"
              payload: { harvested_fish_count: 1, harvested_live_weight_kg: 90.0 }
              as: HarvestOperator
            - call: "POST /processing-batches"
              payload: { harvest_order_id: "${ho}" }
              as: HarvestOperator
              captures: { pb: $.data.id }
            - call: "POST /processing-batches/${pb}/start"
              payload: {}
              as: HarvestOperator
            - call: "POST /processing-batches/${pb}/complete"
              payload: { actual_processed_weight_kg: 50.0, price_per_kg: 10.0 }
              as: HarvestOperator
              captures: { lotA: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_name: "Acme", discount_tier: "NONE" }
              as: SalesAgent
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { product_lot_id: "${lotA}", weight_kg: 30.0 }
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
              captures: { lotA_v: $.data.version }
            - call: "POST /sales-orders/${so}/confirm"
              payload: { expected_lot_version: "${lotA_v}" }
              as: SalesAgent
          trigger:
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
              captures: { mid_avail: $.data.available_weight_kg }
            - call: "POST /sales-orders/${so}/cancel"
              payload: {}
              as: SalesAgent
            - call: "GET /product-lots/${lotA}"
              payload: {}
              as: SalesAgent
          assert:
            - "After confirm: LotA total_weight_kg == 50.00, reserved == 30.00, available == 20.00 (50 == 20 + 30 + 0)."
            - "After cancel: LotA total_weight_kg == 50.00, reserved == 0.00, available == 50.00 (invariant preserved end-to-end)."
