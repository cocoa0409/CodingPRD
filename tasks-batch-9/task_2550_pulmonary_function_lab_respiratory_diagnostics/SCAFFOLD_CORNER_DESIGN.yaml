# SCAFFOLD_CORNER_DESIGN.yaml - task 2550 Pulmonary Function Lab & Respiratory Diagnostics
# Corner-case design index (SKILL.md 1.9). One entry per claim the PRD makes, grouped by the
# nine sections of references/claim-extraction-guide.md. Every instance either carries a
# test_recipe or points at the 1.8 difficulty instance that already proves it.
scaffold_corner_design:
  - section: entities
    instances:
      - name: staff_creation_returns_every_declared_field_with_defaults_applied
        claim_type: creation
        grounds:
          - endpoints[POST /pft-lab/staff]
          - entities.Staff.fields.open_report_count
          - entities.Staff.fields.status
        distinguishing_aspect: |
          A single POST /pft-lab/staff with only the required fields returns 201 and the whole Staff row:
          the seven supplied fields echoed verbatim plus status ON_DUTY, max_concurrent_reports 1,
          is_biologic_control false and open_report_count 0 from their declared defaults.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "no Staff row exists yet"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "R-001", full_name: "Rhea Lund", role_type: "INTERPRETING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO"] }
              as: LabManager
              captures: { rad1_id: $.data.id }
          assert:
            - "the response is HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "Staff.${rad1_id}.employee_code == R-001 and full_name == Rhea Lund and role_type == INTERPRETING_PHYSICIAN"
            - "Staff.${rad1_id}.credentialed_modalities == [SPIROMETRY, DLCO] in the submitted order"
            - "Staff.${rad1_id}.status == ON_DUTY by default"
            - "Staff.${rad1_id}.max_concurrent_reports == 1 by default"
            - "Staff.${rad1_id}.is_biologic_control == false and open_report_count == 0"
            - "Staff.${rad1_id}.version == 1"
      - name: device_retrieval_returns_stored_row_with_null_quality_history
        claim_type: retrieval
        grounds:
          - endpoints[GET /pft-lab/devices/{device_id}]
          - entities.Device.fields.status
          - entities.Device.fields.consecutive_biologic_failures
        distinguishing_aspect: |
          GET /pft-lab/devices/{device_id} on a freshly created device returns status NEW with every
          quality-history field still null or zero, proving creation writes no calibration or infection
          control history of its own.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "device SPIRO-1 was just created and has no quality events"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
          trigger:
            - call: "GET /pft-lab/devices/${dev1_id}"
              payload: {}
              as: LabManager
          assert:
            - "the response is HTTP 200 with Device.${dev1_id}.device_code == SPIRO-1 and modality == SPIROMETRY"
            - "Device.${dev1_id}.status == NEW"
            - "Device.${dev1_id}.last_calibration_at == null and last_calibration_error_pct == null and last_biologic_control_date == null"
            - "Device.${dev1_id}.consecutive_biologic_failures == 0 and sessions_since_filter_change == 0"
            - "Device.${dev1_id}.current_filter_serial == null and last_session_end_at == null"
            - "Device.${dev1_id}.quarantined_at == null and quarantine_reason == null and quarantine_trigger_staff_id == null"
      - name: device_listing_paginates_and_filters_by_modality
        claim_type: listing
        grounds:
          - endpoints[GET /pft-lab/devices]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three devices, limit 2 / offset 0 returns two rows with total_count 3 and
          has_more true, limit 2 / offset 2 returns the remaining one with has_more false, and the
          modality filter narrows total_count to 1 - so total_count counts the filtered set, not the table.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "three devices exist: SPIRO-1 and SPIRO-2 with modality SPIROMETRY and DLCO-1 with modality DLCO"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-2", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev2_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "DLCO-1", modality: "DLCO" }
              as: LabManager
              captures: { dev3_id: $.data.id }
          trigger:
            - call: "GET /pft-lab/devices"
              payload: { limit: 2, offset: 0 }
              as: LabManager
            - call: "GET /pft-lab/devices"
              payload: { limit: 2, offset: 2 }
              as: LabManager
            - call: "GET /pft-lab/devices"
              payload: { modality: "DLCO" }
              as: LabManager
          assert:
            - "the first page returns HTTP 200 with response_type array, 2 items, total_count 3, limit 2, offset 0 and has_more true"
            - "the second page returns 1 item with total_count 3, offset 2 and has_more false"
            - "the modality DLCO query returns 1 item, total_count 1 and has_more false, and that item is Device.${dev3_id}"
      - name: session_get_with_unknown_id_returns_session_not_found
        claim_type: not_found
        grounds:
          - validations[priority=9]
          - errors[ERR_SESSION_NOT_FOUND]
          - endpoints[GET /pft-lab/test-sessions/{session_id}]
        distinguishing_aspect: |
          A well-formed but unused UUID on GET /pft-lab/test-sessions/{session_id} returns HTTP 404 with
          error_id ERR_SESSION_NOT_FOUND, not an empty 200 body and not the 422 of a state error.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "no TestSession exists"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "GET /pft-lab/test-sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 404 with response_type error and data.error_id == ERR_SESSION_NOT_FOUND"
            - "the response carries a meta block with api_request_id and api_request_timestamp"
      - name: patient_creation_missing_weight_kg_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /pft-lab/patients]
        distinguishing_aspect: |
          weight_kg is declared as a required input with no default, so omitting it - with every other
          required field present - returns HTTP 400 ERR_INVALID_REQUEST and creates no Patient row.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "no Patient row exists"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
          assert:
            - "the rejected attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the follow-up POST with the same mrn MRN-7001 and a weight_kg of 80.0 returns HTTP 201, so the rejected attempt persisted no row that could have collided on the mrn uniqueness check"
            - "Patient.${pat1_id}.weight_kg == 80.0"
      - name: order_creation_applies_declared_defaults_for_omitted_optionals
        claim_type: defaults
        grounds:
          - endpoints[POST /pft-lab/test-orders]
          - entities.TestOrder.fields.bronchodilator_requested
          - entities.TestOrder.fields.challenge_type
          - entities.TestOrder.fields.current_medication_classes
        distinguishing_aspect: |
          Omitting all three optional order inputs yields bronchodilator_requested false, challenge_type
          NONE and current_medication_classes [] - and because the medication list defaults to empty, the
          order's later submit lands on READY rather than SUBMITTED.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "ordering physician D-001 and patient MRN-7001 exist"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "D-001", full_name: "Dana Okafor", role_type: "ORDERING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"] }
              as: LabManager
              captures: { doc1_id: $.data.id }
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY"], test_context: "ROUTINE_CLINICAL" }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord1_id: $.data.id }
          assert:
            - "the response is HTTP 201 with TestOrder.${ord1_id}.bronchodilator_requested == false"
            - "TestOrder.${ord1_id}.challenge_type == NONE"
            - "TestOrder.${ord1_id}.current_medication_classes == []"
            - "TestOrder.${ord1_id}.status == DRAFT with rejection_reason == null, hold_release_at == null and abort_count == 0"
            - "TestOrder.${ord1_id}.ordering_staff_id == ${doc1_id}, taken from the X-User-ID header rather than the body"
      - name: patient_age_years_is_computed_from_birth_date_and_logical_clock
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.age_years
          - endpoints[POST /pft-lab/patients]
          - endpoints[POST /pft-lab/_clock/set_current_utc]
        distinguishing_aspect: |
          age_years is computed, not stored: a patient born 1981-03-15 reads 45 at a logical clock of
          2026-08-03 and still reads 45 at 2027-03-14, the day before the birthday, proving the field is
          derived from the clock rather than frozen at creation.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "patient MRN-7001 was born 1981-03-15"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "GET /pft-lab/patients/${pat1_id}"
              payload: {}
              as: LabManager
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-14T08:00:00Z" }
              as: LabManager
            - call: "GET /pft-lab/patients/${pat1_id}"
              payload: {}
              as: LabManager
          assert:
            - "the first read returns HTTP 200 with Patient.${pat1_id}.age_years == 45"
            - "the second read still returns age_years == 45, because 2027-03-14 precedes the 2027-03-15 birthday"
            - "Patient.${pat1_id}.height_cm == 175.0 and weight_kg == 80.0 are echoed unchanged"
            - "Patient.${pat1_id}.completed_order_count == 0"
      - name: staff_system_fields_are_server_minted_not_client_supplied
        claim_type: system_fields
        grounds:
          - entities.Staff.fields.open_report_count
          - endpoints[POST /pft-lab/staff]
          - endpoints[GET /pft-lab/staff/{staff_id}]
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server: two staff rows created in the
          same request sequence receive distinct ids, both start at version 1, and open_report_count - a
          computed field with no input channel - starts at 0 on both.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "no Staff row exists"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "R-001", full_name: "Rhea Lund", role_type: "INTERPRETING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], max_concurrent_reports: 1 }
              as: LabManager
              captures: { rad1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "R-002", full_name: "Ravi Menon", role_type: "INTERPRETING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], max_concurrent_reports: 1 }
              as: LabManager
              captures: { rad2_id: $.data.id }
            - call: "GET /pft-lab/staff/${rad1_id}"
              payload: {}
              as: LabManager
          assert:
            - "both creations return HTTP 201 and Staff.${rad1_id}.id != Staff.${rad2_id}.id"
            - "Staff.${rad1_id}.version == 1 and Staff.${rad2_id}.version == 1"
            - "Staff.${rad1_id}.created_at == 2026-08-03T08:00:00.000Z and updated_at == 2026-08-03T08:00:00.000Z"
            - "Staff.${rad1_id}.open_report_count == 0, a computed field the request could not set"
            - "the GET returns the same id, created_at and version as the creation response"
      - name: patient_out_of_range_height_and_undeclared_enum_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - entities.Patient.fields.height_cm
          - entities.Patient.fields.smoking_status
        distinguishing_aspect: |
          Both a numeric range breach (height_cm 250.0 above the declared 220.0 ceiling) and an
          undeclared enum member (smoking_status VAPING) return the same HTTP 400 ERR_INVALID_REQUEST,
          and neither leaves a Patient row behind.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "no Patient row exists"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 250.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7002", full_name: "Bea Nkosi", birth_date: "1981-03-15", sex: "FEMALE", height_cm: 165.0, weight_kg: 62.0, smoking_status: "VAPING" }
              as: LabManager
              captures: { err: $.data.error_id }
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
          assert:
            - "the height_cm 250.0 attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST, because 250.0 exceeds the declared maximum 220.0"
            - "the smoking_status VAPING attempt returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the follow-up POST reusing mrn MRN-7001 with height_cm 175.0 and smoking_status FORMER returns HTTP 201, so neither rejected attempt persisted a row"
            - "Patient.${pat1_id}.age_years == 45"
      - name: maneuver_is_an_immutable_event_row_with_no_version_or_update_channel
        claim_type: immutability
        grounds:
          - entities.Maneuver
          - endpoints[GET /pft-lab/maneuvers/{maneuver_id}]
          - endpoints[POST /pft-lab/test-sessions/{session_id}/maneuvers]
        distinguishing_aspect: |
          Maneuver is declared common_fields false, so its row carries id and created_at but no updated_at
          and no version, and §1.5 declares no PATCH or DELETE for it - the only way a maneuver's
          contribution changes is by appending another maneuver, which leaves the first row byte-identical.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "device SPIRO-1 passed calibration, biologic control, filter replacement and disinfection today"
            - "order ORD-1 is READY and session SESS-1 is SCHEDULED on SPIRO-1"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-090", full_name: "Cal Mensah", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2026-05-01" }
              as: LabManager
              captures: { bcs_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "D-001", full_name: "Dana Okafor", role_type: "ORDERING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"] }
              as: LabManager
              captures: { doc1_id: $.data.id }
            - call: "POST /pft-lab/reference-equations"
              payload: { equation_code: "GLI-M-2005", modality_scope: ["SPIROMETRY"], sex_scope: "MALE", applicable_age_min: 40, applicable_age_max: 60, lln_percentile: 5.0, ratio_lln: 0.700, a_fev1: 2.300, b_fev1: 0.020, c_fev1: 0.400, a_fvc: 1.350, b_fvc: 0.030, c_fvc: 0.400, rsd_frac: 0.130, bd_criterion: "PCT_BASELINE_2005" }
              as: LabManager
              captures: { eq2005_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1001" }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "HIGH_LEVEL_DISINFECT", dwell_minutes: 25 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY"], test_context: "ROUTINE_CLINICAL", bronchodilator_requested: false, current_medication_classes: [] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord1_id: $.data.id }
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-sessions"
              payload: { order_id: "${ord1_id}", device_id: "${dev1_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T09:30:00Z" }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.200, fev1_l: 2.400, pef_l_s: 6.00, back_extrapolated_volume_ml: 100, expiratory_time_s: 15.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { man1_id: $.data.id }
            - call: "GET /pft-lab/maneuvers/${man1_id}"
              payload: {}
              as: LabManager
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.150, fev1_l: 2.250, pef_l_s: 5.80, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "GET /pft-lab/maneuvers/${man1_id}"
              payload: {}
              as: LabManager
          assert:
            - "the append returns HTTP 201 with Maneuver.${man1_id}.maneuver_index == 1 and acceptability == ACCEPTABLE"
            - "the first read returns id and created_at 2026-08-03T08:00:00.000Z and carries no version and no updated_at field"
