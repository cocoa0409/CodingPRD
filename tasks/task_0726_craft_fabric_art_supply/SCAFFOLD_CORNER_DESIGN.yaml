  # ===========================================================================
  - section: consistency_model
    instances:
      - name: pickup_decrements_on_hand_and_accrues_points
        claim_type: cross_entity_cascade
        grounds:
          - state_machines.Order.READY_FOR_PICKUP_to_PICKED_UP
          - calculations.loyalty_points_earned
          - entities.InventoryLot.fields.on_hand_yards
        distinguishing_aspect: "Pickup of a 5000c order decrements on_hand_yards by the cut quantity and accrues floor(5000/100)=50 loyalty points in the same request."
        test_recipe:
          setup:
            - "Order O PAID and ready with one BY_YARD line, actual_cut_yards=2, unit_price 2500c (final total 5000c); lot on_hand_yards=10."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc19@x.com", full_name: "CC Nineteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-2500", name: "Velvet", sell_mode: "BY_YARD", unit_price_cents: 2500, min_cut_increment_yards: 1 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 10 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 2 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "PATCH /order-lines/${line_id}/record-cut"
              payload: { actual_cut_yards: 2 }
              as: StoreAssociate
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/pickup"
              payload: {}
              as: StoreAssociate
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { oh: $.data.on_hand_yards }
            - call: "GET /customers/${c_id}/loyalty-account"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { pe: "$.data[0].points_earned" }
          assert:
            - "InventoryLot.${lot_id}.on_hand_yards == 8"
            - "LoyaltyAccount.points_earned == 50"

