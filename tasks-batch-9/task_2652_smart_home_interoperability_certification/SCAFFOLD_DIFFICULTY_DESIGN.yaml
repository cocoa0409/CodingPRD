      - name: penalty_surcharge_rounds_a_half_cent_up_before_the_cap_is_applied
        grounds:
          - calculations.noncompliance_penalty_assessment
          - entities.NoncomplianceCase.fields.assessment_subtotal_cents
          - entities.NoncomplianceCase.fields.surcharge_cents
          - entities.NoncomplianceCase.fields.penalty_total_cents
          - endpoints[POST /noncompliance-cases]
        distinguishing_aspect: |
          MODE (b) - NESTED ROUNDING ORDER. Three roundings/clampings are chained in a fixed order:
          marginal tier bands produce an integer subtotal, that subtotal is multiplied by the category
          rate and ROUND_HALF_UP to whole cents (320150 * 0.35 == 112052.5 rounds UP to 112053, and
          320150 * 0.25 == 80037.5 rounds UP to 80038), and only THEN is the uncapped sum clamped to
