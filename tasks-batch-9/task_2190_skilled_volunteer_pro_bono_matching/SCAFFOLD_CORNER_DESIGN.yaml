      - name: error_window_outside_cycle_on_partially_contained_interval
        claim_type: error_triggerable
        grounds: ["errors[ERR_WINDOW_OUTSIDE_CYCLE]", "validations[priority=39]", "validations[priority=43]", "endpoints[POST /volunteers/{id}/availability-windows]"]
        distinguishing_aspect: "Containment is all-or-nothing: a window running 2026-07-01 to 2026-08-15 overlaps the cycle but starts a month before it, so it is not contained by any ProgramCycle interval and the answer is 422 ERR_WINDOW_OUTSIDE_CYCLE - the priority-43 overlap rule never gets a chance because no prior window exists."
