scenario: "754. Polling-Place & Poll-Worker Management: precinct/location & equipment inventory, poll-worker recruit/assign & training, shift & check-in/payroll, supply kit & chain-of-custody, e-pollbook & provisional, incident & support hotline, results-return & reconciliation, accessibility"
domain_name: "polling-place-management"
api_prefix: "/"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
    - resource_temporal_overlap
    - dual_variant_calculation

  entity_topology: hybrid
  # Election is the root; PollingPlace hangs under it; EquipmentUnit / SupplyKit /
  # Assignment / Shift / ProvisionalBallot / Incident are flat peers linked by FK.

  state_machine_shape: posture_driven
  # PollingPlace.readiness_posture (SETUP/OPEN/SUSPENDED/CLOSED/RECONCILED) gates
  # all child operations and cycles OPEN<->SUSPENDED. ProvisionalBallot is branching
  # (CAST -> {ACCEPTED, REJECTED}).

  relationship_patterns:
    - one_to_many        # Election -> PollingPlace, PollingPlace -> Shift, etc.
    - cross_aggregate    # Shift references PollWorker + PollingPlace across aggregates
    - polymorphic        # CustodyEvent logs any custody transition of a SupplyKit

  role_model: peer_roles
  # ElectionAdmin owns inventory/lifecycle, CustodyOfficer owns chain-of-custody,
  # SupportAgent owns incidents, PrecinctCaptain runs a place, PollWorker works shifts.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Election name, e.g. '2026 General Election'"
      - name: jurisdiction
        type: string
        source: input
        description: "County / jurisdiction identifier"
      - name: election_date
        type: datetime
        source: input
        description: "ISO 8601 date the election is held"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the election-day voting window"
        default: PLANNING
        constraints: "one of PLANNING, VOTING_OPEN, VOTING_CLOSED"
      - name: initial_ballot_stock
        type: integer
        source: input
        description: "Total blank ballots held centrally at creation; conserved-quantity anchor for the ballot-stock invariant"
        constraints: ">= 0"
      - name: unallocated_ballot_stock
        type: integer
        source: computed
        description: "Blank ballots not yet committed to any SupplyKit; decremented on kit ISSUE, incremented on VOID_ISSUE. Starts equal to initial_ballot_stock."

  - name: PollingPlace
    parent: Election
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id"
      - name: name
        type: string
        source: input
        description: "Precinct / location name"
      - name: address
        type: string
        source: input
        description: "Street address of the polling location"
      - name: min_workers_required
        type: integer
        source: input
        description: "Quorum: minimum ACTIVE assignments needed before the place may OPEN"
        constraints: ">= 1"
      - name: staffing_capacity
        type: integer
        source: input
        description: "Maximum number of poll workers that may be filled at this place; anchor for the staffing-slot invariant"
        constraints: ">= 1"
      - name: station_capacity
        type: integer
        source: input
        description: "Maximum number of shifts whose time windows may overlap at this place (check-in station count)"
        constraints: ">= 1"
      - name: wheelchair_accessible
        type: boolean
        source: input
        description: "Accessibility: ground-level or ramped entrance available"
        default: false
      - name: accessible_parking
        type: boolean
        source: input
        description: "Accessibility: designated accessible parking present"
        default: false
      - name: ada_voting_stations
        type: integer
        source: input
        description: "Count of ADA-compliant ballot-marking voting stations"
        default: 0
        constraints: ">= 0"
      - name: readiness_posture
        type: enum
        source: system
        description: "Derived operational posture gating all child operations"
        default: SETUP
        constraints: "one of SETUP, OPEN, SUSPENDED, CLOSED, RECONCILED"
      - name: slots_filled
        type: integer
        source: computed
        description: "Count of Assignment rows for this place in status ACTIVE"
        default: 0
      - name: slots_open
        type: integer
        source: computed
        description: "staffing_capacity - slots_filled; invariant slots_filled + slots_open == staffing_capacity always holds"
      - name: provisional_cast_count
        type: integer
        source: computed
        description: "Count of ProvisionalBallot rows for this place in any status"
        default: 0
      - name: provisional_accepted_count
        type: integer
        source: computed
        description: "Count of ProvisionalBallot rows for this place in status ACCEPTED"
        default: 0
      - name: scanner_tally
        type: integer
        source: system
        description: "Machine-scanned ballot count captured at reconcile; null until reconciled"
        default: null
      - name: epollbook_checkins
        type: integer
        source: system
        description: "Number of e-pollbook voter check-ins captured at reconcile; null until reconciled"
        default: null
      - name: spoiled_count
        type: integer
        source: system
        description: "Spoiled ballots recorded at reconcile"
        default: 0
      - name: reconciliation_status
        type: enum
        source: system
        description: "Result of results-return reconciliation"
        default: UNRECONCILED
        constraints: "one of UNRECONCILED, BALANCED, MISMATCH"
      - name: reconciliation_discrepancy
        type: integer
        source: computed
        description: "(scanner_tally + provisional_accepted_count) - epollbook_checkins; null until reconciled"
        default: null
      - name: total_payroll_cents
        type: integer
        source: computed
        description: "Sum over this place's CHECKED_OUT shifts of round_half_up(shift gross pay); rounded per shift then summed"
        default: 0

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: equipment_type
        type: enum
        source: input
        description: "Device kind"
        constraints: "one of SCANNER, BMD, EPOLLBOOK, PRINTER"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial number"
      - name: status
        type: enum
        source: system
        description: "Inventory / operational status"
        default: IN_WAREHOUSE
        constraints: "one of IN_WAREHOUSE, OPERATIONAL, OUT_OF_SERVICE"
      - name: polling_place_id
        type: string
        source: system
        description: "FK -> PollingPlace.id; null while IN_WAREHOUSE, set on deploy"
        default: null

  - name: PollWorker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Poll worker legal name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
        default: null
      - name: training_status
        type: enum
        source: system
        description: "Certification status; must be CERTIFIED before shift check-in"
        default: PENDING
        constraints: "one of PENDING, CERTIFIED"
      - name: accrued_payroll_cents
        type: integer
        source: computed
        description: "Cumulative pay across CHECKED_OUT shifts plus one-time training stipend"
        default: 0
      - name: stipend_paid
        type: boolean
        source: system
        description: "Whether the one-time training stipend has already been added to accrued_payroll_cents"
        default: false

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: poll_worker_id
        type: string
        source: input
        description: "FK -> PollWorker.id"
      - name: polling_place_id
        type: string
        source: input
        description: "FK -> PollingPlace.id"
      - name: is_lead
        type: boolean
        source: input
        description: "Whether this worker serves as lead (precinct captain differential pay)"
        default: false
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle; ACTIVE consumes a staffing slot"
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, WITHDRAWN"

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id"
      - name: poll_worker_id
        type: string
        source: system
        description: "FK -> PollWorker.id; copied from the assignment on creation"
      - name: polling_place_id
        type: string
        source: system
        description: "FK -> PollingPlace.id; copied from the assignment on creation"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned shift start (ISO 8601)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned shift end (ISO 8601); must be strictly after scheduled_start"
      - name: check_in_time
        type: datetime
        source: system
        description: "Logical-clock instant of check-in; null until CHECKED_IN"
        default: null
      - name: check_out_time
        type: datetime
        source: system
        description: "Logical-clock instant of check-out; null until CHECKED_OUT"
        default: null
      - name: status
        type: enum
        source: system
        description: "Shift lifecycle"
        default: SCHEDULED
        constraints: "one of SCHEDULED, CHECKED_IN, CHECKED_OUT"
      - name: is_lead
        type: boolean
        source: computed
        description: "Copied from the parent Assignment.is_lead; selects lead hourly rate"
        default: false
      - name: scheduled_hours
        type: number
        source: computed
        description: "(scheduled_end - scheduled_start) in hours, rounded to 4 decimals; drives the provisional pay variant"
      - name: scheduled_pay_cents
        type: integer
        source: computed
        description: "Provisional gross pay projected from scheduled_hours via calculation shift_pay (scheduled_projection variant); set at shift creation, independent of actual worked time"
      - name: actual_hours
        type: number
        source: computed
        description: "(check_out_time - check_in_time) in hours, rounded to 4 decimals; null until CHECKED_OUT; drives the final pay variant"
        default: null
      - name: gross_pay_cents
        type: integer
        source: computed
        description: "Final gross pay computed from actual_hours on check-out; null until CHECKED_OUT"
        default: null

  - name: SupplyKit
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK -> Election.id"
      - name: polling_place_id
        type: string
        source: system
        description: "FK -> PollingPlace.id; null until RECEIVE at a place"
        default: null
      - name: ballot_count
        type: integer
        source: input
        description: "Blank ballots sealed in this kit; committed from Election.unallocated_ballot_stock on ISSUE"
        constraints: ">= 1"
      - name: seal_number
        type: string
        source: input
        description: "Tamper-evident seal identifier"
      - name: custody_state
        type: enum
        source: system
        description: "Chain-of-custody state"
        default: PREPARED
        constraints: "one of PREPARED, ISSUED, IN_TRANSIT, AT_PLACE, RETURN_PENDING, RECONCILED, COMPROMISED"
      - name: returned_ballot_count
        type: integer
        source: system
        description: "Ballots reported returned at RECONCILE"
        default: null

  - name: CustodyEvent
    parent: SupplyKit
    common_fields: false
    fields:
      - name: supply_kit_id
        type: string
        source: system
        description: "FK -> SupplyKit.id"
      - name: event_type
        type: enum
        source: input
        description: "Custody transition kind"
        constraints: "one of ISSUE, DISPATCH, RECEIVE, RETURN, RECONCILE, SEAL_BREAK, VOID_ISSUE"
      - name: from_state
        type: string
        source: system
        description: "SupplyKit.custody_state before this event"
      - name: to_state
        type: string
        source: system
        description: "SupplyKit.custody_state after this event"
      - name: actor_role
        type: string
        source: system
        description: "Role that performed the custody transition (audit trail)"
      - name: note
        type: string
        source: input
        description: "Optional free-text custody note"
        default: null

  - name: ProvisionalBallot
    parent: null
    common_fields: true
    fields:
      - name: polling_place_id
        type: string
        source: input
        description: "FK -> PollingPlace.id"
      - name: voter_name
        type: string
        source: input
        description: "Name of the provisional voter"
      - name: reason
        type: string
        source: input
        description: "Reason the ballot is provisional (e.g. NO_ID, NOT_IN_BOOK)"
      - name: status
        type: enum
        source: system
        description: "Adjudication status; branches from CAST"
        default: CAST
        constraints: "one of CAST, ACCEPTED, REJECTED"

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: polling_place_id
        type: string
        source: input
        description: "FK -> PollingPlace.id"
      - name: equipment_unit_id
        type: string
        source: input
        description: "FK -> EquipmentUnit.id; set only for equipment-related incidents"
        default: null
      - name: category
        type: enum
        source: input
        description: "Incident category"
        constraints: "one of EQUIPMENT, STAFFING, SECURITY, ACCESSIBILITY, OTHER"
      - name: description
        type: string
        source: input
        description: "Free-text incident description from the support hotline"
      - name: severity
        type: enum
        source: system
        description: "Severity; starts LOW, set to CRITICAL on escalate"
        default: LOW
        constraints: "one of LOW, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Incident lifecycle"
        default: OPEN
        constraints: "one of OPEN, ACKNOWLEDGED, ESCALATED, RESOLVED"
      - name: resolution
        type: string
        source: system
        description: "Resolution note recorded on resolve"
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Election
    initial_state: PLANNING
    terminal_states: [VOTING_CLOSED]
    transitions:
      - from: PLANNING
        to: VOTING_OPEN
        trigger: "POST /elections/{id}/open-voting"
        actor: ElectionAdmin
        preconditions: ["election.status == PLANNING"]
        side_effects: ["increments Election.version by 1"]
      - from: VOTING_OPEN
        to: VOTING_CLOSED
        trigger: "POST /elections/{id}/close-voting"
        actor: ElectionAdmin
        preconditions: ["election.status == VOTING_OPEN"]
        side_effects:
          - "CASCADE link 1: every child PollingPlace in posture OPEN transitions OPEN -> CLOSED"
          - "increments Election.version by 1"
        note: "Head of cascade chain 1 (depth 3): Election close -> PollingPlace close -> Shift auto check-out -> PollWorker payroll accrual."

  - entity: PollingPlace
    initial_state: SETUP
    terminal_states: [RECONCILED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /polling-places/{id}/open"
        actor: PrecinctCaptain
        preconditions:
          - "election of this place is in status VOTING_OPEN"
          - "no SupplyKit for this place is in custody_state COMPROMISED (business_safety)"
          - "at least one SupplyKit for this place is in custody_state AT_PLACE"
          - "every EquipmentUnit whose polling_place_id == this place has status == OPERATIONAL (none OUT_OF_SERVICE) (cross-entity dependency on EquipmentUnit)"
          - "slots_filled >= min_workers_required (business_fiscal quorum, >= boundary)"
        side_effects: ["set readiness_posture = OPEN", "increments PollingPlace.version by 1"]
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /polling-places/{id}/suspend OR system cascade from Incident escalate"
        actor: PrecinctCaptain
        preconditions: ["readiness_posture == OPEN"]
        side_effects: ["set readiness_posture = SUSPENDED", "increments PollingPlace.version by 1"]
        note: "Cyclic edge; also the tail (link 2) of cascade chain 2 when an equipment OUT_OF_SERVICE removes the OPERATIONAL guarantee."
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /polling-places/{id}/resume"
        actor: PrecinctCaptain
        preconditions:
          - "readiness_posture == SUSPENDED"
          - "every EquipmentUnit whose polling_place_id == this place has status == OPERATIONAL"
          - "no SupplyKit for this place is in custody_state COMPROMISED"
        side_effects: ["set readiness_posture = OPEN", "increments PollingPlace.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /polling-places/{id}/close OR system cascade from Election close-voting"
        actor: PrecinctCaptain
        preconditions: ["readiness_posture == OPEN"]
        side_effects:
          - "set readiness_posture = CLOSED"
          - "CASCADE link 2: every Shift for this place in status CHECKED_IN auto-transitions CHECKED_IN -> CHECKED_OUT (check_out_time = current logical clock)"
          - "increments PollingPlace.version by 1"
        note: "Middle of cascade chain 1."
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /polling-places/{id}/close"
        actor: PrecinctCaptain
        preconditions: ["readiness_posture == SUSPENDED"]
        side_effects: ["set readiness_posture = CLOSED", "increments PollingPlace.version by 1"]
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /polling-places/{id}/reconcile"
        actor: PrecinctCaptain
        preconditions:
          - "readiness_posture in {CLOSED, RECONCILED}"
          - "expected_polling_place_version matches current PollingPlace.version (OCC)"
        side_effects:
          - "set scanner_tally, epollbook_checkins, spoiled_count from the request"
          - "recompute reconciliation_discrepancy and reconciliation_status via calculation reconciliation"
          - "set readiness_posture = RECONCILED"
          - "increments PollingPlace.version by 1"
        note: "Re-runnable correction: RECONCILED -> RECONCILED is permitted so a corrected results-return supersedes the prior one; guarded by OCC on PollingPlace.version."

  - entity: EquipmentUnit
    initial_state: IN_WAREHOUSE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: IN_WAREHOUSE
        to: OPERATIONAL
        trigger: "POST /equipment/{id}/deploy"
        actor: ElectionAdmin
        preconditions: ["status == IN_WAREHOUSE", "target PollingPlace exists"]
        side_effects: ["set polling_place_id = target place", "set status = OPERATIONAL", "increments EquipmentUnit.version by 1"]
      - from: OPERATIONAL
        to: OUT_OF_SERVICE
        trigger: "system cascade from Incident escalate (equipment-related)"
        actor: system
        preconditions: ["status == OPERATIONAL"]
        side_effects:
          - "set status = OUT_OF_SERVICE"
          - "CASCADE link 2 tail: if the owning PollingPlace posture is OPEN, force it OPEN -> SUSPENDED (its OPERATIONAL guarantee is now broken)"
          - "increments EquipmentUnit.version by 1"
        note: "Link 1 of cascade chain 2."

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /assignments/{id}/activate"
        actor: PrecinctCaptain
        preconditions:
          - "status == PROPOSED"
          - "PollWorker.training_status == CERTIFIED (cross-entity dependency on PollWorker)"
          - "PollingPlace.slots_open >= 1"
        side_effects:
          - "set status = ACTIVE"
          - "PollingPlace.slots_filled += 1; PollingPlace.slots_open -= 1 (staffing-slot invariant, forward action)"
          - "increments Assignment.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /assignments/{id}/withdraw"
        actor: PrecinctCaptain
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "set status = WITHDRAWN"
          - "PollingPlace.slots_filled -= 1; PollingPlace.slots_open += 1 (staffing-slot invariant, compensating action)"
          - "increments Assignment.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /assignments/{id}/withdraw"
        actor: PrecinctCaptain
        preconditions: ["status == PROPOSED"]
        side_effects: ["set status = WITHDRAWN", "increments Assignment.version by 1"]
        note: "Withdrawing a not-yet-ACTIVE assignment releases no slot (none was filled)."

  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /shifts/{id}/check-in"
        actor: PrecinctCaptain
        preconditions:
          - "status == SCHEDULED (state)"
          - "PollWorker.training_status == CERTIFIED (cross-entity dependency on PollWorker)"
          - "parent Assignment.status == ACTIVE"
          - "owning PollingPlace.readiness_posture == OPEN"
          - "no other Shift with the same poll_worker_id in status CHECKED_IN or SCHEDULED has a time window overlapping [scheduled_start, scheduled_end) (business_temporal, per-worker pairwise overlap)"
        side_effects: ["set check_in_time = current logical clock", "set status = CHECKED_IN", "increments Shift.version by 1"]
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /shifts/{id}/check-out OR system cascade from PollingPlace close"
        actor: PrecinctCaptain
        preconditions: ["status == CHECKED_IN"]
        side_effects:
          - "set check_out_time = current logical clock"
          - "compute actual_hours and gross_pay_cents via calculation shift_pay (final/actual variant)"
          - "CASCADE link 3: add gross_pay_cents to PollWorker.accrued_payroll_cents; if PollWorker.stipend_paid == false add TRAINING_STIPEND_CENTS and set stipend_paid = true"
          - "recompute owning PollingPlace.total_payroll_cents via calculation place_payroll_summary"
          - "set status = CHECKED_OUT"
          - "increments Shift.version by 1"
        note: "Tail (link 3) of cascade chain 1."

  - entity: SupplyKit
    initial_state: PREPARED
    terminal_states: [RECONCILED]
    transitions:
      - from: PREPARED
        to: ISSUED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: ISSUE}"
        actor: CustodyOfficer
        preconditions:
          - "custody_state == PREPARED"
          - "Election.unallocated_ballot_stock >= ballot_count (business_fiscal)"
        side_effects:
          - "Election.unallocated_ballot_stock -= ballot_count (ballot-stock invariant, forward action)"
          - "append CustodyEvent"
          - "increments SupplyKit.version by 1"
      - from: ISSUED
        to: PREPARED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: VOID_ISSUE}"
        actor: CustodyOfficer
        preconditions: ["custody_state == ISSUED"]
        side_effects:
          - "Election.unallocated_ballot_stock += ballot_count (ballot-stock invariant, compensating action)"
          - "append CustodyEvent"
          - "increments SupplyKit.version by 1"
      - from: ISSUED
        to: IN_TRANSIT
        trigger: "POST /supply-kits/{id}/custody-events {event_type: DISPATCH}"
        actor: CustodyOfficer
        preconditions: ["custody_state == ISSUED"]
        side_effects: ["append CustodyEvent", "increments SupplyKit.version by 1"]
      - from: IN_TRANSIT
        to: AT_PLACE
        trigger: "POST /supply-kits/{id}/custody-events {event_type: RECEIVE, polling_place_id}"
        actor: CustodyOfficer
        preconditions: ["custody_state == IN_TRANSIT", "target PollingPlace exists"]
        side_effects: ["set polling_place_id", "append CustodyEvent", "increments SupplyKit.version by 1"]
      - from: AT_PLACE
        to: RETURN_PENDING
        trigger: "POST /supply-kits/{id}/custody-events {event_type: RETURN}"
        actor: CustodyOfficer
        preconditions: ["custody_state == AT_PLACE"]
        side_effects: ["append CustodyEvent", "increments SupplyKit.version by 1"]
      - from: RETURN_PENDING
        to: RECONCILED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: RECONCILE, returned_ballot_count}"
        actor: CustodyOfficer
        preconditions: ["custody_state == RETURN_PENDING"]
        side_effects: ["set returned_ballot_count", "append CustodyEvent", "increments SupplyKit.version by 1"]
      - from: ISSUED
        to: COMPROMISED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: SEAL_BREAK}"
        actor: CustodyOfficer
        preconditions: ["custody_state in {ISSUED, IN_TRANSIT, AT_PLACE}"]
        side_effects:
          - "set custody_state = COMPROMISED"
          - "if the kit has a polling_place_id and that place is OPEN, force place OPEN -> SUSPENDED"
          - "append CustodyEvent"
          - "increments SupplyKit.version by 1"
        note: "SEAL_BREAK is reachable from ISSUED, IN_TRANSIT, or AT_PLACE; a compromised kit blocks the place from opening (business_safety)."
      - from: IN_TRANSIT
        to: COMPROMISED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: SEAL_BREAK}"
        actor: CustodyOfficer
        preconditions: ["custody_state in {ISSUED, IN_TRANSIT, AT_PLACE}"]
        side_effects: ["set custody_state = COMPROMISED", "append CustodyEvent", "increments SupplyKit.version by 1"]
      - from: AT_PLACE
        to: COMPROMISED
        trigger: "POST /supply-kits/{id}/custody-events {event_type: SEAL_BREAK}"
        actor: CustodyOfficer
        preconditions: ["custody_state in {ISSUED, IN_TRANSIT, AT_PLACE}"]
        side_effects:
          - "set custody_state = COMPROMISED"
          - "if the owning place is OPEN, force place OPEN -> SUSPENDED"
          - "append CustodyEvent"
          - "increments SupplyKit.version by 1"

  - entity: ProvisionalBallot
    initial_state: CAST
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: CAST
        to: ACCEPTED
        trigger: "POST /provisional-ballots/{id}/adjudicate {decision: ACCEPT}"
        actor: PrecinctCaptain
        preconditions: ["status == CAST"]
        side_effects:
          - "owning PollingPlace.provisional_accepted_count += 1"
          - "increments ProvisionalBallot.version by 1"
        note: "Branch A: accepted ballots enter the reconciled tally."
      - from: CAST
        to: REJECTED
        trigger: "POST /provisional-ballots/{id}/adjudicate {decision: REJECT}"
        actor: PrecinctCaptain
        preconditions: ["status == CAST"]
        side_effects: ["increments ProvisionalBallot.version by 1"]
        note: "Branch B: rejected ballots do NOT touch provisional_accepted_count (divergent side-effect set)."

  - entity: Incident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /incidents/{id}/acknowledge"
        actor: SupportAgent
        preconditions: ["status == OPEN"]
        side_effects: ["increments Incident.version by 1"]
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /incidents/{id}/escalate"
        actor: SupportAgent
        preconditions: ["status == ACKNOWLEDGED"]
        side_effects:
          - "set severity = CRITICAL"
          - "CASCADE link 1: if category == EQUIPMENT and equipment_unit_id is set, transition that EquipmentUnit OPERATIONAL -> OUT_OF_SERVICE"
          - "increments Incident.version by 1"
        note: "Head of cascade chain 2 (depth 2): Incident escalate -> EquipmentUnit OUT_OF_SERVICE -> PollingPlace SUSPENDED."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /incidents/{id}/escalate"
        actor: SupportAgent
        preconditions: ["status == OPEN"]
        side_effects:
          - "set severity = CRITICAL"
          - "if category == EQUIPMENT and equipment_unit_id is set, transition that EquipmentUnit OPERATIONAL -> OUT_OF_SERVICE"
          - "increments Incident.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: SupportAgent
        preconditions: ["status == ACKNOWLEDGED"]
        side_effects: ["set resolution", "increments Incident.version by 1"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: SupportAgent
        preconditions: ["status == ESCALATED"]
        side_effects: ["set resolution", "increments Incident.version by 1"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: reconcile-stale-place
    parent_entity: PollingPlace
    write_endpoint: "POST /polling-places/{id}/reconcile"
    occ_field: "expected_polling_place_version"
    description: |
      Submitting a results-return reconciliation against a PollingPlace whose
      version has advanced since the client last observed it is rejected. The
      reconcile endpoint is re-runnable (a corrected results-return legitimately
      supersedes the prior one), so a submission carrying a stale
      expected_polling_place_version is rejected on the stale-version check
      rather than on any posture precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: shift_pay
    trigger: "Shift CHECKED_IN -> CHECKED_OUT (POST /shifts/{id}/check-out or cascade from PollingPlace close); provisional variant is projectable at any time from scheduled_start/scheduled_end"
    algorithm: tiered_pricing
    formula: |
      def hours(delta_seconds): return round_half_up_4(delta_seconds / 3600.0)
      rate = LEAD_HOURLY_CENTS if shift.is_lead else BASE_HOURLY_CENTS
      # FINAL / ACTUAL variant uses actual_hours from check_in/check_out clock stamps:
      H = actual_hours
      regular_hours = min(H, OT_THRESHOLD_HOURS)
      overtime_hours = max(0, H - OT_THRESHOLD_HOURS)   # OT only when H strictly > 8.0
      regular_pay = round_half_up(regular_hours * rate)
      overtime_pay = round_half_up(overtime_hours * rate * OT_MULTIPLIER)
      gross_pay_cents = regular_pay + overtime_pay
      # NOTE: the one-time TRAINING_STIPEND_CENTS is NOT part of gross_pay_cents;
      # it is added to PollWorker.accrued_payroll_cents once, on the worker's first check-out.
    input_set: "A single Shift; actual variant requires status CHECKED_OUT (both check_in_time and check_out_time set)."
    constants:
      BASE_HOURLY_CENTS: 1825
      LEAD_HOURLY_CENTS: 2450
      OT_THRESHOLD_HOURS: 8.0
      OT_MULTIPLIER: 1.5
      TRAINING_STIPEND_CENTS: 5000
    precision: "regular_pay and overtime_pay each round_half_up to whole cents independently, then sum"
    variants:
      - name: scheduled_projection
        when: "provisional estimate before check-out; uses scheduled_hours from scheduled_start/scheduled_end"
        difference: "H = scheduled_hours (from the planned window) instead of actual_hours (from clock stamps); yields the provisional gross, which diverges from the final gross whenever worked time differs from planned time."
      - name: actual_final
        when: "on check-out; uses actual_hours from check_in_time/check_out_time"
        difference: "authoritative pay written to gross_pay_cents and rolled into payroll."

  - name: place_payroll_summary
    trigger: "recomputed whenever a Shift for the place reaches CHECKED_OUT"
    algorithm: aggregation
    formula: |
      # ROUND-PER-SHIFT-THEN-SUM (pinned order):
      total = 0
      for s in shifts where s.polling_place_id == place.id and s.status == CHECKED_OUT:
          total += s.gross_pay_cents            # each already round_half_up per shift_pay
      place.total_payroll_cents = total
      # FORBIDDEN alternative (sum-raw-then-round-once) would differ in cents when
      # per-shift regular_pay carries a half-cent; the per-shift rounding is authoritative.
    input_set: "Shifts for the place in status CHECKED_OUT only; SCHEDULED and CHECKED_IN shifts excluded."
    constants: {}
    precision: "round_half_up per shift inside shift_pay, then integer summation; no second rounding"

  - name: reconciliation
    trigger: "PollingPlace CLOSED -> RECONCILED (POST /polling-places/{id}/reconcile)"
    algorithm: aggregation
    formula: |
      # Two valid tallies of the same place produce different totals:
      machine_only_total   = scanner_tally
      reconciled_total     = scanner_tally + provisional_accepted_count
      reconciliation_discrepancy = reconciled_total - epollbook_checkins
      reconciliation_status = "BALANCED" if reconciliation_discrepancy == 0 else "MISMATCH"
    input_set: "scanner_tally, spoiled_count, epollbook_checkins from the reconcile request; provisional_accepted_count is the place's live ACCEPTED provisional count."
    constants: {}
    precision: "integer counts; no rounding"
    variants:
      - name: machine_only
        when: "scanner/tabulator view — counts only machine-scanned ballots"
        difference: "excludes accepted provisional ballots (which are hand-counted separately), so machine_only_total = scanner_tally."
      - name: reconciled_inclusive
        when: "canvass reconciliation view"
        difference: "adds provisional_accepted_count to scanner_tally; diverges from machine_only by exactly provisional_accepted_count and is the total compared against epollbook_checkins."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET (reads require auth too)"
  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource referenced in the path or by FK in the body exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 4.5
    category: state
    check: "opening a place requires its election in status VOTING_OPEN; casting a provisional requires the place posture == OPEN"
    error_id: ERR_VOTING_NOT_OPEN
    http_status: 409
    applies_to: "POST /polling-places/{id}/open, POST /provisional-ballots"
  - priority: 5
    category: business_safety
    check: "no SupplyKit for the place is COMPROMISED when opening/resuming the place"
    error_id: ERR_KIT_COMPROMISED
    http_status: 409
    applies_to: "POST /polling-places/{id}/open, POST /polling-places/{id}/resume"
  - priority: 6
    category: business_safety
    check: "no EquipmentUnit assigned to the place is OUT_OF_SERVICE when opening/resuming; at least one SupplyKit AT_PLACE"
    error_id: ERR_EQUIPMENT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /polling-places/{id}/open, POST /polling-places/{id}/resume"
  - priority: 7
    category: business_referential
    check: "poll worker is CERTIFIED when activating an assignment or checking in a shift"
    error_id: ERR_WORKER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /assignments/{id}/activate, POST /shifts/{id}/check-in"
  - priority: 8
    category: business_temporal
    check: "new/checked-in shift's [scheduled_start, scheduled_end) does not overlap another shift of the same worker (half-open, adjacency at a shared boundary allowed)"
    error_id: ERR_WORKER_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /shifts, POST /shifts/{id}/check-in"
  - priority: 9
    category: business_temporal
    check: "number of existing shifts at the place whose windows overlap the new shift's window is strictly less than station_capacity (aggregate-capacity interval semantics)"
    error_id: ERR_PLACE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shifts"
  - priority: 10
    category: business_constraint
    check: "custody event_type is valid from the kit's current custody_state; RECEIVE requires polling_place_id"
    error_id: ERR_INVALID_CUSTODY_TRANSITION
    http_status: 422
    applies_to: "POST /supply-kits/{id}/custody-events"
  - priority: 11
    category: business_fiscal
    check: "Election.unallocated_ballot_stock >= kit.ballot_count on ISSUE"
    error_id: ERR_INSUFFICIENT_BALLOT_STOCK
    http_status: 422
    applies_to: "POST /supply-kits/{id}/custody-events"
  - priority: 12
    category: business_fiscal
    check: "slots_filled >= min_workers_required before the place may OPEN"
    error_id: ERR_UNDERSTAFFED
    http_status: 422
    applies_to: "POST /polling-places/{id}/open"
  - priority: 13
    category: business_constraint
    check: "PollingPlace.slots_open >= 1 before an assignment may be activated"
    error_id: ERR_NO_OPEN_SLOTS
    http_status: 422
    applies_to: "POST /assignments/{id}/activate"
  - priority: 14
    category: business_constraint
    check: "scheduled_end strictly after scheduled_start; decision enum values valid; reconcile counts non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /shifts, POST /provisional-ballots/{id}/adjudicate, POST /polling-places/{id}/reconcile"
  - priority: 15
    category: state
    check: "expected_polling_place_version equals current PollingPlace.version on reconcile (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /polling-places/{id}/reconcile"

