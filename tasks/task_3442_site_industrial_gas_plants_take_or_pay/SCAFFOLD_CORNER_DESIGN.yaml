              payload: { customer_id: "${c_w2}", site_label: "MILL-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 7000, required_purity_percent: 99.9, required_product: "H2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_w2: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_w2}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_w2}"
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_w2}", evaluation_id: "${e_w2}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_w2: $.data.id }
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_w2}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { err_cw: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_cw} == ERR_CUSTOMER_CREDIT_WATCH"
            - "SupplyContract.${k_w2}.status remains DRAFT"

