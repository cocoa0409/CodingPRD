  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check (priority 1 beats priority 2)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aip/sponsors"
              payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED (request sent with no X-User-Role/X-User-ID headers)"

      - name: role_mismatch_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "FinanceOfficer is not in the roles list of POST /aip/capital-programs: the call fails 403 ERR_FORBIDDEN even though the payload is valid."
        test_recipe:
          setup: ["sponsor exists"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
