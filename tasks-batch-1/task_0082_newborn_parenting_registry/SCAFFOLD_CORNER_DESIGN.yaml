        grounds: ["roles.AttendingNurse", "roles.Neonatologist", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "AttendingNurse calling POST /newborns/{id}/nicu-escalate (Neonatologist-exclusive) returns ERR_UNAUTHORIZED (403); peer-role boundary."
        test_recipe:
          setup: ["A BORN newborn meeting NICU criteria and a LEVEL_3 bed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 1500, gestational_age_weeks: 31, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "GET /newborns/${nb_id}"
              payload: {}
              as: AttendingNurse
              captures: { nb_v: $.data.version }
          trigger:
            - call: "POST /newborns/${nb_id}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T10:30:00Z", expected_newborn_version: "${nb_v}" }
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "data.error_id == ERR_UNAUTHORIZED"

      - name: missing_auth_headers_unauthenticated
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A GET /newborns/{random} with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any existence check."
        test_recipe:
          setup: ["Empty DB; the caller supplies an unknown role header."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
          trigger:
            - call: "GET /newborns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "When called with an unknown/missing X-User-Role header, response code == 401 and data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_nicu_escalate_stale_newborn_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[nicu-escalate-stale-newborn]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A nicu-escalate carrying expected_newborn_version one less than the current version (after a room-in bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A BORN newborn that has been roomed-in (so its version advanced past the value the client first observed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "GET /newborns/${nb_id}"
              payload: {}
              as: Neonatologist
              captures: { stale_v: $.data.version }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
          trigger:
            - call: "POST /newborns/${nb_id}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T11:00:00Z", expected_newborn_version: "${stale_v}" }
              as: Neonatologist
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_dependent_approve_stale_policy_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dependent-approve-stale-policy]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approving enrollment B with expected_policy_version captured BEFORE enrollment A's approval bumped the policy version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A MARKETPLACE policy slots_max 3 with two newborns and two PENDING enrollments, both within SEP; the client captures policy.version BEFORE approving A."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_a: $.data.id }
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:05:00Z", birth_sequence: 2, weight_grams: 3100, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_b: $.data.id }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_a}", policy_id: "${policy_id}", requested_at: "2026-03-06T12:00:00Z" }
              as: BenefitsCoordinator
              captures: { enr_a: $.data.id }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_b}", policy_id: "${policy_id}", requested_at: "2026-03-06T12:00:00Z" }
              as: BenefitsCoordinator
              captures: { enr_b: $.data.id }
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { pol_v_stale: $.data.version }
            - call: "POST /dependent-enrollments/${enr_a}/approve"
              payload: { expected_policy_version: "${pol_v_stale}" }
              as: BenefitsCoordinator
          trigger:
            - call: "POST /dependent-enrollments/${enr_b}/approve"
              payload: { expected_policy_version: "${pol_v_stale}" }
              as: BenefitsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [entities.Newborn.fields.id, state_machines.Newborn.BORN_to_ROOMING_IN]
        distinguishing_aspect: "Newborn.version starts at 1 on creation and becomes 2 after a single room-in mutation (version increments by one per write)."
        test_recipe:
          setup: ["A BORN newborn just created (version 1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
              captures: { v1: $.data.version }
          assert:
            - "Newborn.${nb_id}.version == 2 after room-in (was 1 at creation)"

      - name: error_dependent_slots_reconciled_on_terminate
        claim_type: derived_field_reconciliation
        grounds: [entities.InsurancePolicy.fields.dependents_added_count]
        excluded_because:
          difficulty_instance: compensating_invariant / terminate_enrollment_conserves_policy_dependent_slots
          rationale: "dependents_added_count reconciliation across enroll/terminate is the named §1.8 invariant."

