      - name: substantiation_fails_with_deficient_profile
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_SUBSTANTIATION_UNMET]
        distinguishing_aspect: |
          With supplier coverage satisfied (P9 passes) but the NutrientProfile
          DEFICIENT (protein 10.0 below the DOG ADULT floor 18.0), substantiate
          fails with ERR_SUBSTANTIATION_UNMET (422) — isolating the P11
