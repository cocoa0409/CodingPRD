          leaves seal_number at the first call's value SEAL-1.
        test_recipe:
          setup:
            - "Store S-1914 with MANUAL safe SAFE-A (500000) UNLOCKED at 08:10Z, journal 2026-08-03, and a PREPARING deposit of 100000 prepared by U-CLERK-1"
          setup_api_calls:
