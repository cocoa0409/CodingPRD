          Conserved quantity = MONEY in cents. After paying 24000 then a full WALLET refund 24000,
          the invariant (Invoice.amount_paid_cents - Invoice.refunded_cents) + Customer.wallet_credit_cents
          == 24000 holds: platform-retained 0 + wallet 24000 == paid 24000. No cents drift.
        test_recipe:
