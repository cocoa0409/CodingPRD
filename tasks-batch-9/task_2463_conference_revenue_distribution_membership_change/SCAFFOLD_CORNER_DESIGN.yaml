      - name: corner_conference_singleton_and_initialization_guards_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 5]
          - validations[priority 6]
          - errors.ERR_CONFERENCE_NOT_INITIALIZED
          - errors.ERR_CONFERENCE_ALREADY_EXISTS
        distinguishing_aspect: |
          The two singleton guards are mirror images and both must exist: with
          no Conference row every other write is refused with 409
          ERR_CONFERENCE_NOT_INITIALIZED, and once exactly one exists a second
          POST /conference is refused with 409 ERR_CONFERENCE_ALREADY_EXISTS.
          The clock endpoint is deliberately outside the guard, which is what
          lets the fixture pin time before the conference exists at all.
        test_recipe:
          setup:
            - "The database is empty apart from the pinned logical clock."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /venues"
              payload: { name: "Premature Pavilion", city: "Nowhere", seating_capacity: 20000, concurrent_event_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u_adm_1"
            - *c_conf
            - call: "POST /conference"
              payload: { name: "Rival Conference Office", fiscal_year_start_month: 7, current_fiscal_year: 2027, unit_value_cents: 34000000, phase_schedule_years: 3 }
              as: PlatformAdmin
              as_user_id: "u_adm_1"
            - *c_v1
          assert:
            - "the first venue attempt returns HTTP 409 with error.error_id == ERR_CONFERENCE_NOT_INITIALIZED and creates no Venue"
            - "the first POST /conference returns HTTP 201 and the clock call before it succeeded, so /_clock/set_current_utc is exempt from priority 5"
            - "the second POST /conference returns HTTP 409 with error.error_id == ERR_CONFERENCE_ALREADY_EXISTS and GET /conference still reports name \"Mid-Continental Athletic Conference\""
            - "the venue retried after initialization returns HTTP 201 as ${v1_id}"

      - name: corner_charter_admission_after_operating_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 20]
          - errors.ERR_CHARTER_WINDOW_CLOSED
          - state_machines.Conference.FORMING_to_OPERATING
        distinguishing_aspect: |
          The charter window is keyed on Conference.governance_status, not on a
          member count or a date: the instant the FY2027 budget is approved and
          the conference turns OPERATING, admission_path CHARTER is refused with
          409 while PETITIONED on the identical payload succeeds and lands on
          the phasing ladder at 0 bps.
        test_recipe:
          setup:
            - "The conference has four charter members and an APPROVED FY2027 budget, so governance_status is OPERATING."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Latecomer University", institution_code: "LAT", admission_path: "CHARTER", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2034 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Latecomer University", institution_code: "LAT", admission_path: "PETITIONED", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2034 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_lat_id: $.data.id }
          assert:
            - "Conference.governance_status == \"OPERATING\" before either attempt"
            - "the CHARTER attempt returns HTTP 409 with error.error_id == ERR_CHARTER_WINDOW_CLOSED and creates no Member"
            - "the PETITIONED attempt returns HTTP 201 with Member.${m_lat_id}.status == \"PETITIONED\", .distribution_phase_bps == 0, .voting_weight_bps == 0 and .phase_year == 0"
            - "the reused institution_code LAT does not trip priority 14, because the refused attempt persisted nothing"

      - name: corner_effective_fiscal_year_must_exceed_current_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 40]
          - errors.ERR_INVALID_EFFECTIVE_YEAR
          - endpoints[POST /membership-actions]
          - endpoints[POST /members/{id}/withdrawal-notice]
        distinguishing_aspect: |
          Priority 40 is strict inequality against Conference.current_fiscal_year
          on both endpoints that carry an effective year: 2027 equals the current
          year and is refused 422 on the ADMIT proposal and on the withdrawal
          notice alike, while 2028 is accepted on both. An implementation using
          `>=` would let a member depart mid-year and admit a petitioner into a
          year whose pools are already computing.
        test_recipe:
          setup:
            - "The conference is OPERATING at current_fiscal_year 2027 with an APPROVED FY2027 budget and a PETITIONED Central Plains University."
          setup_api_calls:
            - *c_clock
            - *c_conf
