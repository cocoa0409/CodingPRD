          assert:
            - "${dom_accrued_0} == 0, ${drv_ytd_0} == 0, ${trip_pay_0} == 0 and ${trip_settle_0} == PENDING"
            - "${f1_stop1_service} == 105, ${f1_duty} == 505, ${f1_miles} == 273 and ${f1_end} == 2026-08-03T14:50:00Z"
            - "${trip_pay_1} == 28244, ${trip_settle_1} == ACCRUED and ${trip_plan_1} == COMPLETED"
            - "${dom_accrued_1} == 28244 and ${drv_ytd_1} == 28244 - both ledgers rose by exactly the statement's gross"
            - "${stmt_gross} == 28244, ${stmt_status_1} == ACCRUED, ${stmt_variant} == FINAL_SETTLEMENT, ${stmt_hourly} == 1050 and ${stmt_makeup} == 0"
            - "${stmt_status_2} == SETTLED but ${dom_accrued_2} == 28244 and ${drv_ytd_2} == 28244 - settling is NOT a second accrual"
            - "${stmt_status_3} == REVERSED, ${dom_accrued_3} == 0 and ${drv_ytd_3} == 0 - the unwind removes exactly the 28244 that was added, from both ledgers"
            - "${trip_pay_3} == 0 and ${trip_settle_3} == ADJUSTED, while ${trip_plan_3} == COMPLETED - the trip-level mirror is compensated without disturbing the operations dimension"
            - "after the reversal both ledgers again equal the sum of gross_cents over the non-REVERSED statements of that domicile and that driver, which is the empty sum"

      - name: safety_score_and_open_penalty_points_always_sum_to_one_hundred
        grounds:
          - calculations.driver_safety_score
          - entities.Driver.open_penalty_points
          - entities.Driver.safety_score
          - endpoints[POST /fleet/telematics-events]
          - endpoints[POST /fleet/telematics-events/{event_id}/coach]
        distinguishing_aspect: |
          CONSERVED QUANTITY: the identity safety_score + open_penalty_points
          == 100, maintained across four writes in both directions. Unlike the
          two ledger instances, the compensation here is not a reversal of the
          original write: the event row survives coaching with coached == true
          and its penalty_points field unchanged, and it is the DERIVED pair
          that is rebalanced. Coaching one of three identical 12-point events
          therefore moves the driver from 36/64 back to 24/76 and clears
          coaching_hold, which the hold threshold of 70 had set on the way down.
          The driver deliberately holds no trip and no bid, so the coaching-hold
          cascade has nothing to strip and only the score pair moves.
        test_recipe:
          setup:
            - "Domicile DOM-KC, plan MILE-A and driver D-120, freshly created with open_penalty_points 0, safety_score 100 and coaching_hold false. The driver is on no trip and has no bid, so no cascade can fire."
            - "Three identical SEATBELT severity-3 events are worth 4*3 = 12 points each."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-KC", region_code: "MIDWEST", tractor_capacity: 16, driver_headcount_target: 8, fixed_ownership_cents_per_day: 8800, overhead_cents_per_day: 2600, dedicated_rate_cents_per_mile: 265, dedicated_rate_cents_per_case: 192 }
              as: FleetPlanner
              captures: { dom_kc_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-120", domicile_id: "${dom_kc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2010-05-05" }
              as: TransportManager
              captures: { drv_120_id: $.data.id, d120_open_0: $.data.open_penalty_points, d120_score_0: $.data.safety_score, d120_hold_0: $.data.coaching_hold }
          trigger:
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_120_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-10T09:00:00Z" }
              as: SafetyManager
              captures: { ev1_id: $.data.id, ev1_points: $.data.penalty_points, ev1_coached: $.data.coached }
            - call: "GET /fleet/drivers/${drv_120_id}"
              payload: {}
              as: SafetyManager
              captures: { d120_open_1: $.data.open_penalty_points, d120_score_1: $.data.safety_score, d120_hold_1: $.data.coaching_hold }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_120_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-11T09:00:00Z" }
              as: SafetyManager
              captures: { ev2_id: $.data.id }
            - call: "GET /fleet/drivers/${drv_120_id}"
              payload: {}
              as: SafetyManager
              captures: { d120_open_2: $.data.open_penalty_points, d120_score_2: $.data.safety_score, d120_hold_2: $.data.coaching_hold }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_120_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-12T09:00:00Z" }
              as: SafetyManager
              captures: { ev3_id: $.data.id }
            - call: "GET /fleet/drivers/${drv_120_id}"
              payload: {}
              as: SafetyManager
              captures: { d120_open_3: $.data.open_penalty_points, d120_score_3: $.data.safety_score, d120_hold_3: $.data.coaching_hold }
            - call: "POST /fleet/telematics-events/${ev1_id}/coach"
              payload: { coaching_note: "Belt discipline reviewed in cab." }
              as: SafetyManager
              captures: { ev1_coached_after: $.data.coached, ev1_points_after: $.data.penalty_points }
            - call: "GET /fleet/drivers/${drv_120_id}"
              payload: {}
              as: SafetyManager
              captures: { d120_open_4: $.data.open_penalty_points, d120_score_4: $.data.safety_score, d120_hold_4: $.data.coaching_hold }
          assert:
            - "${d120_open_0} == 0, ${d120_score_0} == 100, ${d120_hold_0} == false - the identity holds at 0 + 100"
            - "${ev1_points} == 12 and ${ev1_coached} == false"
            - "${d120_open_1} == 12 and ${d120_score_1} == 88 with ${d120_hold_1} == false (12 + 88 == 100)"
            - "${d120_open_2} == 24 and ${d120_score_2} == 76 with ${d120_hold_2} == false (24 + 76 == 100)"
            - "${d120_open_3} == 36 and ${d120_score_3} == 64 with ${d120_hold_3} == true (36 + 64 == 100; 64 < 70 sets the hold)"
            - "${ev1_coached_after} == true and ${ev1_points_after} == 12 - the event is retired, not rewritten, and it is NOT deleted"
            - "${d120_open_4} == 24 and ${d120_score_4} == 76 with ${d120_hold_4} == false (24 + 76 == 100) - coaching one of the three identical events returns the pair to the two-event state exactly and releases the hold"
            - "coaching the same event again is refused with ERR_ALREADY_COACHED, so the compensation cannot be double-counted"
