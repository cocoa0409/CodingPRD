              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
          trigger:
            - call: "GET /mentors?limit=0"
              payload: {}
              as: ProgramAdmin
            - call: "GET /mentors?limit=101"
              payload: {}
              as: ProgramAdmin
            - call: "GET /mentors?offset=-1"
              payload: {}
              as: ProgramAdmin
            - call: "GET /mentors?limit=100&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "calls 1, 2 and 3 each return HTTP 400 with data.error_id == \"ERR_INVALID_PAGINATION\""
            - "call 4 returns HTTP 200 with limit == 100, offset == 0, total_count == 1 and has_more == false"
            - "GET /mentors with no pagination parameters returns limit == 10 and offset == 0 — the declared defaults"

