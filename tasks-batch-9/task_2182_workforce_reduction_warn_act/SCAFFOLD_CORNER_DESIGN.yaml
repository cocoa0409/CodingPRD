# Coverage Index for non-difficulty tests (SKILL.md 1.9). Sections and claim_type
# values are taken from references/claim-extraction-guide.md; no new categories are
# invented. Fixture conventions match SCAFFOLD_DIFFICULTY_DESIGN.yaml: the logical
# clock starts at 2026-08-01T00:00:00.000Z, X-User-ID literals are u-lead-1 /
# u-lead-2 / u-counsel-1 / u-counsel-2 / u-benefits-1 / u-admin-1, and the standard
# criterion sheet {PERFORMANCE 72, CRITICAL_SKILLS 55, TENURE 88} against weights
# {50, 30, 20} scores 70.10.
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_reduction_plan_returns_201_with_declared_defaults
        claim_type: creation
        grounds: [entities.ReductionPlan.fields.criteria_status, entities.ReductionPlan.fields.approval_status, entities.ReductionPlan.fields.warn_status, endpoints.POST_/reduction-plans]
        distinguishing_aspect: "A freshly created plan answers 201 with criteria_status DRAFT, approval_status DRAFT, warn_status NOT_ASSESSED, version 1 and every ledger and counter at 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ReductionPlan.${plan_id}.criteria_status == DRAFT"
            - "ReductionPlan.${plan_id}.approval_status == DRAFT"
            - "ReductionPlan.${plan_id}.warn_status == NOT_ASSESSED"
            - "ReductionPlan.${plan_id}.version == 1"
            - "ReductionPlan.${plan_id}.severance_reserve_cents == 0"
            - "ReductionPlan.${plan_id}.benefit_liability_cents == 0"
            - "ReductionPlan.${plan_id}.selected_count == 0"
            - "ReductionPlan.${plan_id}.pool_count == 0"
            - "ReductionPlan.${plan_id}.owbpa_required == false"
            - "ReductionPlan.${plan_id}.owbpa_consideration_days == 21"
            - "ReductionPlan.${plan_id}.required_notice_days == 0"
            - "ReductionPlan.${plan_id}.earliest_separation_date == null"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: get_site_returns_the_stored_entity_with_zeroed_counters
        claim_type: retrieval
        grounds: [entities.Site.fields.roster_count, entities.Site.fields.warn_trigger_status, "endpoints.GET_/sites/{id}"]
        distinguishing_aspect: "GET /sites/{id} echoes the stored name, state_code and is_single_site and reports roster_count 0, active_headcount 0 and warn_trigger_status NONE before any roster import."
        test_recipe:
          setup:
            - "One site created with name 'Austin Campus', state_code TX, is_single_site true and no employees."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { name_back: $.data.name, roster_back: $.data.roster_count }
          assert:
            - "HTTP status == 200"
            - "${name_back} == Austin Campus"
            - "${roster_back} == 0"
            - "Site.${site_id}.state_code == TX"
            - "Site.${site_id}.is_single_site == true"
            - "Site.${site_id}.active_headcount == 0"
            - "Site.${site_id}.warn_trigger_status == NONE"
            - "Site.${site_id}.window_start_date == null"

      - name: list_employees_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: [endpoints.GET_/employees, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /employees?site_id=...&limit=2&offset=0 over a three-person roster answers exactly 2 rows with total_count 3 and has_more true; offset 2 answers 1 row with has_more false."
        test_recipe:
          setup:
            - "One TX site with a three-person roster."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { created: $.data.created_count }
          trigger:
            - call: "GET /employees"
              payload: { site_id: "${site_id}", limit: 2, offset: 0 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /employees"
              payload: { site_id: "${site_id}", limit: 2, offset: 2 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
          assert:
            - "${created} == 3"
            - "first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "second page returns exactly 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both pages"

      - name: get_selection_with_unknown_id_returns_selection_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SELECTION_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A syntactically valid UUID that names no Selection answers 404 with error_id ERR_SELECTION_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /selections/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_SELECTION_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: create_site_without_state_code_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", endpoints.POST_/sites]
        distinguishing_aspect: "Omitting the required state_code on POST /sites answers 400 ERR_INVALID_REQUEST and persists no Site row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Austin Campus" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: site_is_single_site_defaults_to_true_when_omitted
        claim_type: defaults
        grounds: [entities.Site.fields.is_single_site, endpoints.POST_/sites]
        distinguishing_aspect: "Omitting the optional is_single_site field yields true, the declared default, rather than null or false."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id, single: $.data.is_single_site }
          assert:
            - "${single} == true"
            - "Site.${site_id}.is_single_site == true"

      - name: employee_is_part_time_computed_from_weekly_hours_boundary
        claim_type: computed_fields
        grounds: [entities.Employee.fields.is_part_time, calculations.warn_employment_loss_count]
        distinguishing_aspect: "is_part_time is derived, never accepted from input: 16 weekly hours yields true while exactly 20 yields false, because the MIN_PART_TIME_HOURS test is weekly_hours < 20."
        test_recipe:
          setup:
            - "One TX site."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { site_id: "${site_id}", full_name: "Elena Torres", job_title: "Ops Specialist", birth_date: "1968-07-22", hire_date: "2019-02-01", annual_base_cents: 2600000, weekly_hours: 16, demographic_code: "CLASS_B", monthly_premium_cents: 45000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { pt_id: $.data.id, pt_flag: $.data.is_part_time }
            - call: "POST /employees"
              payload: { site_id: "${site_id}", full_name: "Omar Diallo", job_title: "Ops Specialist II", birth_date: "1988-04-04", hire_date: "2019-02-01", annual_base_cents: 3120000, weekly_hours: 20, demographic_code: "CLASS_B", monthly_premium_cents: 45000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { ft_id: $.data.id, ft_flag: $.data.is_part_time }
          assert:
            - "${pt_flag} == true"
            - "${ft_flag} == false"
            - "Employee.${pt_id}.employment_status == ACTIVE"
            - "Employee.${ft_id}.employment_status == ACTIVE"
            - "Site.${site_id}.roster_count == 2"
            - "Site.${site_id}.active_headcount == 2"

      - name: employee_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds: [entities.Employee.fields.employment_status, entities.Employee.fields.separation_date, entities.Employee.fields.release_signed]
        distinguishing_aspect: "id is a bare server-minted UUID with no type prefix, created_at is ISO 8601 UTC with three fractional digits, version starts at 1, and employment_status is ACTIVE with separation_date null and release_signed false regardless of what the caller sends."
        test_recipe:
          setup:
            - "One TX site."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { site_id: "${site_id}", full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { emp_id: $.data.id, emp_version: $.data.version }
          assert:
            - "${emp_version} == 1"
            - "Employee.${emp_id}.id matches the bare UUID form with no type prefix"
            - "Employee.${emp_id}.employment_status == ACTIVE"
            - "Employee.${emp_id}.separation_date == null"
            - "Employee.${emp_id}.age_at_separation == null"
            - "Employee.${emp_id}.years_of_service == null"
            - "Employee.${emp_id}.release_signed == false"
            - "Employee.${emp_id}.benefit_continuation_status == NONE"
            - "Employee.${emp_id}.outplacement_tier == NONE"

      - name: create_employee_with_unknown_demographic_code_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", entities.Employee.fields.demographic_code]
        distinguishing_aspect: "demographic_code accepts only CLASS_A, CLASS_B or CLASS_C; CLASS_D answers 400 ERR_INVALID_REQUEST and creates no Employee."
        test_recipe:
          setup:
            - "One TX site with no employees."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { site_id: "${site_id}", full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_D", monthly_premium_cents: 90000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "Site.${site_id}.roster_count == 0"

      - name: warn_rule_is_immutable_configuration_without_version_field
        claim_type: immutability
        grounds: [entities.WarnRule, "endpoints.GET_/warn-rules/{id}"]
        distinguishing_aspect: "WarnRule declares common_fields false, so its read carries id and created_at but no version and no updated_at, and 1.5 exposes no update or delete endpoint for it."
        test_recipe:
          setup:
            - "One FEDERAL WarnRule configured."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "FEDERAL", state_code: "US", rule_code: "FED-WARN-1988", min_loss_count: 3, min_percent: 33.0, absolute_count: 20, notice_days: 60, window_days: 90, counts_part_time: false, min_service_days: 180, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { rule_id: $.data.id }
          trigger:
            - call: "GET /warn-rules/${rule_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { code_back: $.data.rule_code }
          assert:
            - "${code_back} == FED-WARN-1988"
            - "the response body exposes id and created_at but neither version nor updated_at"
            - "WarnRule.${rule_id}.window_days == 90"
            - "WarnRule.${rule_id}.counts_part_time == false"
            - "WarnRule.${rule_id}.min_service_days == 180"

      - name: create_selection_with_unknown_plan_id_returns_plan_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_PLAN_NOT_FOUND]", entities.Selection.fields.plan_id]
        distinguishing_aspect: "A body foreign key that names no ReductionPlan answers 404 ERR_PLAN_NOT_FOUND at priority 5, before any criteria-locked or score-shape business check runs."
        test_recipe:
          setup:
            - "One TX site with one employee and no reduction plan at all."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /employees"
              payload: { site_id: "${site_id}", full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: $.data.id }
          trigger:
            - call: "POST /selections"
              payload: { plan_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", employee_id: "${alice_id}", proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PLAN_NOT_FOUND"
            - "HTTP status == 404"

  - section: state_machines
    instances:

      - name: lock_criteria_moves_plan_criteria_status_to_locked
        claim_type: valid_transition
        grounds: [entities.ReductionPlan.fields.criteria_status, "endpoints.POST_/reduction-plans/{id}/lock-criteria"]
        distinguishing_aspect: "POST /reduction-plans/{id}/lock-criteria moves criteria_status DRAFT -> LOCKED, bumps version to 2 and leaves approval_status DRAFT and warn_status NOT_ASSESSED untouched."
        test_recipe:
          setup:
            - "One plan in criteria_status DRAFT, version 1."
          setup_api_calls:
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { crit: $.data.criteria_status, ver: $.data.version }
          assert:
            - "${crit} == LOCKED"
            - "${ver} == 2"
            - "ReductionPlan.${plan_id}.approval_status == DRAFT"
            - "ReductionPlan.${plan_id}.warn_status == NOT_ASSESSED"

      - name: lock_criteria_twice_returns_invalid_plan_state
        claim_type: idempotency
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_PLAN_STATE]"]
        distinguishing_aspect: "The second lock-criteria on the same plan is rejected with 409 ERR_INVALID_PLAN_STATE rather than silently succeeding, and the plan's version does not advance a second time."
        test_recipe:
          setup:
            - "One plan whose criteria have already been locked, version 2."
          setup_api_calls:
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
          trigger:
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_PLAN_STATE"
            - "HTTP status == 409"
            - "ReductionPlan.${plan_id}.version == 2"
            - "ReductionPlan.${plan_id}.criteria_status == LOCKED"

      - name: submit_legal_review_without_any_selected_selection_is_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ReductionPlan.DRAFT_to_IN_LEGAL_REVIEW, "errors[ERR_INVALID_PLAN_STATE]"]
        distinguishing_aspect: "The transition's second precondition, selected_count >= 1, is enforced separately from criteria_status: a plan with LOCKED criteria but only PROPOSED selections is rejected with ERR_INVALID_PLAN_STATE and stays in DRAFT."
        test_recipe:
          setup:
            - "TX site with two employees; a plan with LOCKED criteria and one PROPOSED selection that has never been decided."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", ben_id: "$.data.employee_ids[1]" }
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /selections"
              payload: { plan_id: "${plan_id}", employee_id: "${alice_id}", proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { sel_alice: $.data.id }
          trigger:
            - call: "POST /reduction-plans/${plan_id}/submit-legal-review"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_PLAN_STATE"
            - "HTTP status == 409"
            - "ReductionPlan.${plan_id}.approval_status == DRAFT"
            - "ReductionPlan.${plan_id}.submitted_by_user_id == null"
            - "ReductionPlan.${plan_id}.selected_count == 0"
            - "ReductionPlan.${plan_id}.pool_count == 1"

      - name: legal_decision_return_reverts_plan_to_draft_and_counts_the_loop
        claim_type: valid_transition
        grounds: [state_machines.ReductionPlan.IN_LEGAL_REVIEW_to_DRAFT, entities.ReductionPlan.fields.legal_return_count]
        distinguishing_aspect: "A RETURN decision moves approval_status IN_LEGAL_REVIEW -> DRAFT, raises legal_return_count to 1 and clears submitted_by_user_id to null, so the plan can legitimately re-enter review."
        test_recipe:
          setup:
            - "TX site with two employees; Alice SELECTED for 2026-12-01; the analysis is CLEARED and the plan has been submitted for legal review by u-lead-1."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
