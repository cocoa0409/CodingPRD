              payload: { operation_id: "${op_id}", storage_id: "00000000-0000-4000-8000-000000000000", hauler_id: "00000000-0000-4000-8000-000000000001", recipient_name: "Kroeger Row Crops", recipient_address: "1188 County Road E, Linn", transferred_on: "2026-07-28T00:00:00Z", gallons_transferred: 100000, nutrient_analysis_provided: true }
              as: Operator
