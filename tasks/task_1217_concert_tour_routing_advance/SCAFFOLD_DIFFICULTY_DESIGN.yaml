      - name: business_safety_vs_business_temporal_on_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_VENUE_UNAVAILABLE]
          - errors[ERR_RADIUS_CONFLICT]
        distinguishing_aspect: |
          Show confirm where the venue date is unavailable (temporal violation,
          priority 8) AND a radius-clause CRITICAL conflict exists (safety
          violation, priority 10). The temporal error must win because
          business_temporal (priority 8) precedes business_safety (priority 10).
          Different category pair from the sibling instance.
        test_recipe:
          setup:
            - "Show S2 in HOLD_PLACED at a venue whose available_dates does not include S2.show_date"
            - "A different confirmed show S1 in a nearby market whose date is within the exclusivity window"
            - "Both errors would fire on confirm; temporal must win"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
