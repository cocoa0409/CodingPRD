endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default startup time is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock. Drives enrolled_at/event_date determinism."
    roles: [System]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  # --- Employer ---
  - method: POST
    path: "/benefits/employers"
    description: "Create an employer"
    roles: [BenefitsAdmin]
    code: 201
    input: [legal_name, "section_125_plan_active?", "pay_periods_per_year?"]
    output: Employer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/benefits/employers/{employerId}"
    description: "Get an employer"
    roles: [BenefitsAdmin, ClaimsAdjuster, Payroll, Employee]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # --- PlanProduct ---
  - method: POST
    path: "/benefits/plan-products"
    description: "Create a plan product (DRAFT)"
    roles: [BenefitsAdmin]
    code: 201
    input: [employer_id, policy_type, product_name, weekly_premium_cents, annual_benefit_cap_cents, "eoi_surcharge_bps?", "portability_loadup_bps?"]
    output: PlanProduct
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/benefits/plan-products"
    description: "List plan products, filterable by employer (reverse-reachability for PlanProduct.employer_id)"
    roles: [BenefitsAdmin, ClaimsAdjuster, Employee]
    code: 200
    input: ["employer_id?", "policy_type?", "status?", "limit?", "offset?"]
    output: PlanProduct[]
    side_effects: []

  - method: GET
    path: "/benefits/plan-products/{planProductId}"
