      - name: anchor_torque_at_exact_minimum_passes_and_below_fails
        claim_type: threshold
        grounds:
          - calculations.anchor_certification_evaluation
          - state_machines.AnchorCertification.SUBMITTED_to_CHANGES_REQUIRED
          - state_machines.AnchorCertification.CHANGES_REQUIRED_to_SUBMITTED
          - errors[ERR_ANCHOR_COMPLIANCE_FAILED]
        distinguishing_aspect: |
          MIN_TORQUE_FT_LB is compared inclusively: 174.99 ft-lb on 8 anchors in wind
          zone I fails hud_pass while state_pass stays true (AZ is not in
          STATE_EXTRA_ANCHOR_STATES), so CERTIFY is refused with
          ERR_ANCHOR_COMPLIANCE_FAILED (422) and the row stays SUBMITTED; a
          resubmission at exactly 175 flips hud_pass to true and CERTIFY then
          succeeds. A strict > comparison would reject the 175 package.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, a single-section AZ order in wind zone I (required_anchors = 8 x 1 = 8), one licensed SetCrew"
            - "a SetJob booked on that order (no dispatch needed - anchor certifications may be filed against a SCHEDULED job)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "GET /installations/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { order_v: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v}" }
              as: NetworkAdmin
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /installations/anchor-certifications"
              payload: { set_job_id: "${job_id}", anchor_count: 8, avg_torque_ft_lb: 174.99, strap_count: 8, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "CERTIFY", findings: "torque marginal" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "REQUEST_CHANGES", findings: "re-torque all straps to 175 ft-lb" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
            - call: "POST /installations/anchor-certifications/${cert_id}/resubmit"
              payload: { anchor_count: 8, avg_torque_ft_lb: 175, strap_count: 8, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "CERTIFY", findings: "torque at HUD minimum" }
              as: InstallationInspector
              as_user_id: "insp-anchor-2"
          assert:
            - "after trigger step 1: AnchorCertification.${cert_id}.status == SUBMITTED"
            - "after trigger step 1: AnchorCertification.${cert_id}.hud_pass == false"
            - "after trigger step 1: AnchorCertification.${cert_id}.state_pass == true"
            - "after trigger step 1: AnchorCertification.${cert_id}.revision_round == 1"
            - "trigger step 2 returns HTTP 422 with error_id ERR_ANCHOR_COMPLIANCE_FAILED"
            - "after trigger step 2: AnchorCertification.${cert_id}.status == SUBMITTED (unchanged)"
            - "after trigger step 3: AnchorCertification.${cert_id}.status == CHANGES_REQUIRED"
            - "after trigger step 4: AnchorCertification.${cert_id}.avg_torque_ft_lb == 175"
            - "after trigger step 4: AnchorCertification.${cert_id}.hud_pass == true"
            - "after trigger step 4: AnchorCertification.${cert_id}.state_pass == true"
            - "after trigger step 4: AnchorCertification.${cert_id}.revision_round == 2"
            - "after trigger step 4: AnchorCertification.${cert_id}.status == SUBMITTED"
            - "trigger step 5 returns HTTP 200"
            - "AnchorCertification.${cert_id}.status == CERTIFIED"
            - "AnchorCertification.${cert_id}.certifier_user_id == insp-anchor-2"

