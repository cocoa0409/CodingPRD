  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_approval_requires_non_terminal_grant_state_on_another_entity
        grounds:
          - state_machines.RetroactiveClaim.PENDING_to_APPROVED
          - state_machines.ExemptionGrant.SUSPENDED_to_REVOKED
          - validations[priority=9]
          - errors[ERR_GRANT_ALREADY_TERMINAL]
          - calculations.retroactive_refund_amount
        distinguishing_aspect: |
          The blocked operation lives on RetroactiveClaim but the gating state lives on ExemptionGrant:
          a claim filed while its grant was ACTIVE becomes unapprovable the moment the grant is
          directly REVOKED, even though nothing about the claim row changed. The dependency is on a
          PARENT row reached through claim.grant_id.
        test_recipe:
          setup:
            - "ACTIVE HOMESTEAD_BASIC grant G1 for TaxpayerAccount T on Parcel P1 has benefit_amount_cents 8400000 and first_eligible_tax_year 2019."
            - "RetroactiveClaim C1 (filing_tax_year 2026, requested_start_tax_year 2023) is PENDING with gross_refund_cents 315000 and every other money field 0."
            - "No FraudCase exists, so the priority 11 fraud hold cannot fire and the grant state is the only blocker."
            - "G1 is then REVOKED directly by an ExemptionsReviewer through POST /exemption-grants/{id}/compliance-actions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "CARLA CLAIMANT", date_of_birth: "1965-07-07", ssn_last4: "3131", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { g1_id: $.data.resulting_grant_id }
            - call: "POST /retroactive-claims"
              payload: { grant_id: "${g1_id}", filing_tax_year: 2026, requested_start_tax_year: 2023 }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { claim_id: $.data.id }
            - call: "POST /exemption-grants/${g1_id}/compliance-actions"
              payload: { action: "REVOKE", reason: "Occupancy audit found the parcel vacant." }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
          trigger:
            - call: "POST /retroactive-claims/${claim_id}/decide"
              payload: { action: "APPROVE", note: "Attempting approval after revocation." }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with ${err} == ERR_GRANT_ALREADY_TERMINAL"
            - "RetroactiveClaim.${claim_id}.status == PENDING with gross_refund_cents == 315000 and net_refund_cents == 0, refund_interest_cents == 0, total_payable_cents == 0, offset_applied_cents == 0"
            - "TaxpayerAccount.${t_id}.lifetime_refund_cents == 0 and net_relief_cents == 0"
            - "ExemptionGrant.${g1_id}.benefit_status == REVOKED and applied_exempt_value_cents == 0"
            - "Parcel.${p1_id}.exempt_value_cents == 0, taxable_value_cents == 33600000, exemption_status == UNEXEMPTED"
            - "GET /taxpayer-accounts/${t_id}/notices?notice_type=REFUND_DETERMINATION returns 0 rows (no refund notice was mailed)"

      - name: determination_waits_for_income_certification_to_leave_pending
        grounds:
          - state_machines.IncomeCertification.PENDING_to_CERTIFIED
          - validations[priority=29]
          - errors[ERR_INCOME_CERTIFICATION_REQUIRED]
          - calculations.income_relief_tier
          - calculations.exemption_benefit_amount
        distinguishing_aspect: |
          A different direction of dependency from the claim instance: the gating row here is a SIBLING
          entity (IncomeCertification) reached by (taxpayer_id, tax_year) rather than by a foreign key,
          and the gate is opened from the outside by a VerificationCheck on a THIRD entity. The very
          same determine payload that fails with 422 succeeds once the certification flips
          PENDING -> CERTIFIED, proving the dependency is on state and not on the request.
        test_recipe:
          setup:
            - "DISABILITY_INCOME program (requires_income_certification true, income_limit_cents 6000000, asset_limit_cents 4000000, relief_pct_bps 3000, max_exempt_value_cents 12000000) is OPEN."
