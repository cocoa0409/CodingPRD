            - "response.data.error_id == ERR_PLACE_CAPACITY_EXCEEDED"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ballot_stock_conserved_on_issue_then_void
        grounds:
          - state_machines.SupplyKit.PREPARED_to_ISSUED
          - state_machines.SupplyKit.ISSUED_to_PREPARED
          - entities.Election.fields.unallocated_ballot_stock
        distinguishing_aspect: "Conserved quantity = ballot stock: ISSUE debits Election.unallocated_ballot_stock by ballot_count=500 (10000->9500); the compensating VOID_ISSUE credits it back to exactly 10000, so unallocated + issued kit ballots is invariant across the pair."
        test_recipe:
          setup:
            - "Election initial_ballot_stock=10000; one PREPARED kit ballot_count=500 issued (unallocated=9500)."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
          trigger:
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "VOID_ISSUE" }
              as: CustodyOfficer
          assert:
            - "SupplyKit.${kit_id}.custody_state == PREPARED"
            - "Election.${el_id}.unallocated_ballot_stock == 10000"

      - name: staffing_slots_conserved_on_activate_then_withdraw
        grounds:
          - state_machines.Assignment.PROPOSED_to_ACTIVE
          - state_machines.Assignment.ACTIVE_to_WITHDRAWN
          - entities.PollingPlace.fields.slots_open
          - entities.PollingPlace.fields.slots_filled
        distinguishing_aspect: "A different conserved quantity = staffing slots: activate fills a slot (slots_filled 0->1, slots_open 5->4); the compensating withdraw restores slots_open to 5 and slots_filled to 0, keeping slots_filled + slots_open == staffing_capacity == 5 invariant."
        test_recipe:
          setup:
            - "Place staffing_capacity=5; certified worker on an ACTIVE assignment (slots_filled=1, slots_open=4)."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
          trigger:
            - call: "POST /assignments/${a_id}/withdraw"
              payload: {}
              as: PrecinctCaptain
          assert:
            - "Assignment.${a_id}.status == WITHDRAWN"
            - "PollingPlace.${pp_id}.slots_filled == 0"
            - "PollingPlace.${pp_id}.slots_open == 5"
