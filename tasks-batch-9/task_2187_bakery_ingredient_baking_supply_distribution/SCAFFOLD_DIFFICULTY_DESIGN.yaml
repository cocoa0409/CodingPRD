            - "Order.${order2_id}.fulfillment_status == NEW"
            - "OrderLine.${line2_id}.allocation_status == UNALLOCATED"

      - name: boundary_route_utilization_exactly_one_hundred_percent_still_seals
        grounds:
          - calculations.route_load_waterfall
          - state_machines.DeliveryRoute.PLANNING_to_SEALED
          - validations[priority=26]
          - entities.DeliveryRoute.fields.utilization_pct
          - entities.RouteStop.fields.sequence_no
        distinguishing_aspect: |
          A third boundary metric (percentage utilization, 2dp) on a third endpoint (seal): a single
          20000 lb stop on a 20000 lb trailer gives utilization_pct exactly 100.00, and the seal
          precondition is inclusive, so the route MUST reach SEALED and assign sequence_no 1. An
          implementation using < 100 rejects a legal full trailer; one that also mis-scales the
          percentage (e.g. 1.00 instead of 100.00) fails the literal 100.00 assert.
