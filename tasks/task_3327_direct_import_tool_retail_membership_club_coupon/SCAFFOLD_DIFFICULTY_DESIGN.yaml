# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN (§1.8) — 9 rules x >=2 instances
# Grounds reference SCAFFOLD.yaml §1.1-§1.7 elements only.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_final
        grounds:
          - calculations.provisional_landed_cost
          - calculations.final_landed_cost
          - state_machines.PurchaseOrder.DRAFT_to_ISSUED
          - state_machines.Container.CLEARED_to_RECEIVED
        distinguishing_aspect: |
          Same PO lines costed by two algorithms on the SAME entity domain input
          (PurchaseOrder) but this instance is the cost-accounting domain: the
          forward_looking provisional variant (estimated pool, no remainder
          redistribution) yields per-line costs 1050/2100 cents, while the
          chronological final variant (actual pool 1600, remainder carry)
          yields 1080/2160 — different results for identical line data.
        test_recipe:
          setup:
            - "Item A (sku A1) ACTIVE, unit_retail 5000, member 4500, floor_margin 0.10, lead 30"
            - "Item B (sku B1) ACTIVE, unit_retail 9000, member 8500, floor_margin 0.10, lead 30"
            - "PO with lines [A x10 @1000, B x5 @2000], estimated_duty 500, estimated_freight 500, issued"
            - "Container for the PO cleared through customs"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "A1", name: "Drill", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 5000, member_price_cents: 4500, floor_margin_pct: 0.10, lead_time_days: 30, unit_weight_kg: 2.0 }
              as: PurchasingManager
              captures: { item_a: $.data.id }
            - call: "POST /items/${item_a}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "B1", name: "Saw", brand_tier: "MID", origin_country: "TW", unit_retail_cents: 9000, member_price_cents: 8500, floor_margin_pct: 0.10, lead_time_days: 30, unit_weight_kg: 3.0 }
              as: PurchasingManager
              captures: { item_b: $.data.id }
            - call: "POST /items/${item_b}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-1"
                lines:
                  - { item_id: "${item_a}", quantity: 10, unit_cost_cents: 1000 }
                  - { item_id: "${item_b}", quantity: 5, unit_cost_cents: 2000 }
                estimated_duty_cents: 500
                estimated_freight_cents: 500
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-1"
                lines:
                  - { item_id: "${item_a}", quantity: 10 }
                  - { item_id: "${item_b}", quantity: 5 }
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/clear-customs"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /containers/${cont_id}/receive"
              payload: { actual_duty_cents: 700, actual_freight_cents: 900 }
              as: LogisticsCoordinator
          assert:
            - "PurchaseOrder.${po_id}.provisional_landed_costs[${item_a}] == 1050"
            - "PurchaseOrder.${po_id}.provisional_landed_costs[${item_b}] == 2100"
            - "PurchaseOrder.${po_id}.final_landed_costs[${item_a}] == 1080"
            - "PurchaseOrder.${po_id}.final_landed_costs[${item_b}] == 2160"
            - "Item.${item_a}.current_landed_unit_cost_cents == 1080"
            - "Item.${item_b}.current_landed_unit_cost_cents == 2160"

      - name: membership_savings_settled_vs_optimistic
        grounds:
          - calculations.membership_savings
          - entities.Membership.fields.settled_savings_cents
          - entities.Membership.fields.optimistic_savings_cents
        distinguishing_aspect: |
          Customer-domain dual variant (different domain from landed cost):
          settled_savings_cents counts only COMPLETED/RETURNED_PARTIAL sales,
          while optimistic_savings_cents additionally projects member discounts
          on the customer's OPEN sale; with one completed sale (savings 500) and
          one open sale (projected 500) the two fields differ by exactly 500.
        test_recipe:
          setup:
            - "Item ACTIVE, retail 5000, member 4500"
            - "Customer with ACTIVE CLUB membership"
            - "Sale S1 COMPLETED with 1 unit (member price 4500, savings 500)"
            - "Sale S2 OPEN with 1 unit (projected savings 500)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "S1", name: "Wrench", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 5000, member_price_cents: 4500, floor_margin_pct: 0.05, lead_time_days: 45, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST1", name: "Store 1", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cust One" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
              captures: { memb_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale1: $.data.id }
            - call: "POST /sales/${sale1}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale1}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale2: $.data.id }
            - call: "POST /sales/${sale2}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
          trigger:
            - call: "GET /memberships/${memb_id}"
              payload: {}
              as: StoreClerk
          assert:
            - "Membership.${memb_id}.settled_savings_cents == 500"
            - "Membership.${memb_id}.optimistic_savings_cents == 1000"
            - "optimistic_savings_cents - settled_savings_cents == 500 (the OPEN sale's projected discount)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: coupon_discount_multigate_formula
        grounds:
          - calculations.coupon_discount
          - calculations.coupon_redemption_gate
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — discount_type
          selects the eligible base (single lowest-priced line vs whole basket),
          raw percent math floors, then a min() against max_discount_cents cap,
          then a <= budget gate against spent+reserved; changing any one input
          changes which branch produces the discount.
        test_recipe:
          setup:
            - "Item P ACTIVE retail 2000 member 2000; Item Q ACTIVE retail 5000 member 5000"
            - "Customer (no membership needed; audience ALL)"
            - "Coupon CP: PERCENT_OFF_ITEM 25%, max_discount_cents 400, min_basket 0, per_customer_limit 5, budget 100000, window covers now, ACTIVE"
            - "OPEN sale with P x1 (line total 2000) and Q x1 (line total 5000)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "P1", name: "Pliers", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 2000, member_price_cents: 2000, floor_margin_pct: 0.05, lead_time_days: 20, unit_weight_kg: 0.5 }
              as: PurchasingManager
              captures: { item_p: $.data.id }
            - call: "POST /items/${item_p}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "Q1", name: "Jack", brand_tier: "PROFESSIONAL", origin_country: "TW", unit_retail_cents: 5000, member_price_cents: 5000, floor_margin_pct: 0.05, lead_time_days: 20, unit_weight_kg: 5.0 }
              as: PurchasingManager
              captures: { item_q: $.data.id }
            - call: "POST /items/${item_q}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST2", name: "Store 2", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_p}", "${item_q}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "Cust Two" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "SAVE25", channel: "APP", audience: "ALL", discount_type: "PERCENT_OFF_ITEM", discount_value: 25, max_discount_cents: 400, per_customer_limit: 5, budget_cents: 100000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_q}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_p}", quantity: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "SAVE25" }
              as: StoreClerk
          assert:
            - "Sale.${sale_id}.subtotal_cents == 7000"
            - "eligible line is the lowest unit_price line (P, 2000): raw = floor(2000*25/100) = 500"
            - "cap min(500, 400) applies: Sale.${sale_id}.coupon_discount_cents == 400"
            - "Coupon.${coupon_id}.budget_reserved_cents == 400"

      - name: final_landed_cost_remainder_carry_rounding
        grounds:
          - calculations.final_landed_cost
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the millicent remainder
          carry distributes rounding pennies to EARLIER PO lines first; summing
          the pool then splitting evenly would give a different per-line result
          than the pinned chronological carry.
        test_recipe:
          setup:
            - "Items R1, R2 ACTIVE; PO lines [R1 x3 @ 333, R2 x1 @ 1]; goods_total = 999+1 = 1000"
            - "issued with estimated pool 0; container received with actual_duty 1, actual_freight 0 (pool = 1 cent)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "R1", name: "Bit Set", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 2000, member_price_cents: 1900, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_r1: $.data.id }
            - call: "POST /items/${item_r1}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "R2", name: "Screw", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 100, member_price_cents: 100, floor_margin_pct: 0.01, lead_time_days: 30, unit_weight_kg: 0.01 }
              as: PurchasingManager
              captures: { item_r2: $.data.id }
            - call: "POST /items/${item_r2}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-R"
                lines:
                  - { item_id: "${item_r1}", quantity: 3, unit_cost_cents: 333 }
                  - { item_id: "${item_r2}", quantity: 1, unit_cost_cents: 1 }
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-R"
                lines:
                  - { item_id: "${item_r1}", quantity: 3 }
                  - { item_id: "${item_r2}", quantity: 1 }
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/clear-customs"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /containers/${cont_id}/receive"
              payload: { actual_duty_cents: 1, actual_freight_cents: 0 }
              as: LogisticsCoordinator
          assert:
            - "R1 share millicents = floor(1*999*1000/1000)=999 -> 0 cents, carry 999; R2 share = floor(1*1*1000/1000)=1 millicent -> 0 cents, carry 1000 -> +1 cent to R2"
            - "PurchaseOrder.${po_id}.final_landed_costs[${item_r1}] == 333"
            - "PurchaseOrder.${po_id}.final_landed_costs[${item_r2}] == 2"
            - "naive even split (1 cent to R1) would give 334/1 — the pinned carry order gives 333/2"

      - name: sale_total_evaluation_order_circular_pin
        grounds:
          - calculations.coupon_discount
          - calculations.member_price_resolution
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — min_basket gate references the
          pre-discount subtotal B while the discount reduces what the customer
          pays; the scaffold pins B first, discount second, total third, so a
          basket at exactly min_basket BEFORE discount still qualifies even
          though the post-discount total falls below min_basket.
        test_recipe:
          setup:
            - "Item M ACTIVE retail 3000 member 3000"
            - "Coupon MB: PERCENT_OFF_BASKET 50%, min_basket_cents 3000 (basket exactly at gate), no cap, limit 5, budget 100000, ACTIVE, window covers now"
            - "OPEN sale with M x1 (subtotal exactly 3000)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "M1", name: "Multimeter", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 3000, member_price_cents: 3000, floor_margin_pct: 0.05, lead_time_days: 25, unit_weight_kg: 0.8 }
              as: PurchasingManager
              captures: { item_m: $.data.id }
            - call: "POST /items/${item_m}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST3", name: "Store 3", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_m}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "Cust Three" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "HALF", channel: "EMAIL", audience: "ALL", discount_type: "PERCENT_OFF_BASKET", discount_value: 50, min_basket_cents: 3000, per_customer_limit: 5, budget_cents: 100000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_m}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "HALF" }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/complete"
              payload: {}
              as: StoreClerk
          assert:
            - "Sale.${sale_id}.status == COMPLETED (gate passed on pre-discount B == 3000)"
            - "Sale.${sale_id}.coupon_discount_cents == 1500"
            - "Sale.${sale_id}.total_cents == 1500 (post-discount total below min_basket is allowed — evaluation order pinned)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: container_customs_hold_release_cycle
        grounds:
          - state_machines.Container.AT_PORT_to_CUSTOMS_HOLD
          - state_machines.Container.CUSTOMS_HOLD_to_AT_PORT
        distinguishing_aspect: |
          Cyclic machine on Container: AT_PORT -> CUSTOMS_HOLD -> AT_PORT is
          repeatable; after a full hold/release cycle the container can still
          clear customs and be received, proving the cycle does not consume the
          state (unlike a linear pipeline).
        test_recipe:
          setup:
            - "Item ACTIVE; PO issued; container departed and at port"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "CYC1", name: "Lathe", brand_tier: "PROFESSIONAL", origin_country: "DE", unit_retail_cents: 50000, member_price_cents: 47000, floor_margin_pct: 0.10, lead_time_days: 60, unit_weight_kg: 50.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-CYC"
                lines: [ { item_id: "${item_id}", quantity: 2, unit_cost_cents: 20000 } ]
                estimated_duty_cents: 1000
                estimated_freight_cents: 2000
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-CYC"
                lines: [ { item_id: "${item_id}", quantity: 2 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /containers/${cont_id}/hold-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${cont_id}/release-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${cont_id}/hold-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${cont_id}/release-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${cont_id}/clear-customs"
              payload: {}
              as: ComplianceOfficer
              captures: { cont_after: $.data.status }
          assert:
            - "Container.${cont_id}.status == CLEARED after two full hold/release cycles"
            - "Container.${cont_id}.version == 8 (1 at creation + 7 transition mutations: depart, arrive, hold, release, hold, release, clear)"

      - name: warranty_claim_deny_appeal_cycle
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED
          - state_machines.WarrantyClaim.DENIED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on a DIFFERENT entity (WarrantyClaim): UNDER_REVIEW ->
          DENIED -> UNDER_REVIEW loops exactly once (appeal_count max 1); the
          second denial is terminal and a second appeal is rejected, so the
          cycle has a pinned termination condition.
        test_recipe:
          setup:
            - "Item ACTIVE; store carrying it; customer; completed sale with warranty line (price 1500) covering the merchandise line"
            - "Claim filed for 800 (<= 100000 so appealable), UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "W1", name: "Grinder", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 6000, member_price_cents: 5500, floor_margin_pct: 0.10, lead_time_days: 30, unit_weight_kg: 2.5 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST4", name: "Store 4", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "Cust Four" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1, is_warranty_line: true, covered_item_id: "${item_id}", warranty_price_cents: 1500 }
              as: StoreClerk
              captures: { wline_id: $.data.id }
            - call: "POST /sales/${sale_id}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /warranty-claims"
              payload: { sale_line_id: "${wline_id}", reason: "motor failure", claim_amount_cents: 800 }
              as: StoreClerk
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/start-review"
              payload: {}
              as: WarrantyAdjuster
          trigger:
            - call: "POST /warranty-claims/${claim_id}/deny"
              payload: {}
              as: WarrantyAdjuster
            - call: "POST /warranty-claims/${claim_id}/appeal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /warranty-claims/${claim_id}/deny"
              payload: {}
              as: WarrantyAdjuster
            - call: "POST /warranty-claims/${claim_id}/appeal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "after first appeal: WarrantyClaim.${claim_id}.status == UNDER_REVIEW and appeal_count == 1"
            - "second appeal rejected: err == ERR_CLAIM_APPEAL_EXHAUSTED"
            - "WarrantyClaim.${claim_id}.status == DENIED (terminal) after second denial"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recall_activation_quarantine_block_chain
        grounds:
          - state_machines.Recall.DRAFT_to_ACTIVE
          - state_machines.Item.ACTIVE_to_QUARANTINED
          - state_machines.StoreAllocation.COMMITTED_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 chain from Recall activation: hop 1 mutates Item (QUARANTINED,
          open_recall_count +1); hop 2 is caused by the item quarantine and
          mutates StoreAllocation rows (COMMITTED -> BLOCKED); hop 3 is caused by
          the allocation blocking and mutates Container (unallocated pool
          restored, version bump). Trigger: POST /recalls/{id}/activate.
        test_recipe:
          setup:
            - "Item ACTIVE; PO issued; container BOOKED with 10 units; allocation of 4 units COMMITTED (container version advanced by commit)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "RC1", name: "Heater", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 4000, member_price_cents: 3600, floor_margin_pct: 0.10, lead_time_days: 40, unit_weight_kg: 4.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-RC"
                lines: [ { item_id: "${item_id}", quantity: 10, unit_cost_cents: 1500 } ]
                estimated_duty_cents: 200
                estimated_freight_cents: 300
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-RC"
                lines: [ { item_id: "${item_id}", quantity: 10 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /stores"
              payload: { store_code: "ST5", name: "Store 5", format: "STANDARD", market_tier: "SECONDARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${cont_id}", item_id: "${item_id}", quantity: 4 }
              as: InventoryPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /store-allocations/${alloc_id}/commit"
              payload: { expected_container_version: "${cont_v}" }
              as: InventoryPlanner
            - call: "POST /recalls"
              payload: { item_id: "${item_id}", severity: "STOP_SALE", reason: "cord fire risk" }
              as: ComplianceOfficer
              captures: { recall_id: $.data.id }
          trigger:
            - call: "POST /recalls/${recall_id}/activate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Item.${item_id}.lifecycle_status == QUARANTINED"
            - "Item.${item_id}.open_recall_count == 1"
            - "StoreAllocation.${alloc_id}.status == BLOCKED"
            - "Container.${cont_id}.unallocated_quantities[${item_id}] == 10 (4 committed units returned by hop 3)"

      - name: container_receive_landed_cost_margin_chain
        grounds:
          - state_machines.Container.CLEARED_to_RECEIVED
          - calculations.final_landed_cost
          - calculations.margin_floor_check
          - entities.Item.fields.current_landed_unit_cost_cents
        distinguishing_aspect: |
          Different trigger (container receive, not recall): hop 1 receive
          recomputes PurchaseOrder final_landed_costs; hop 2 (caused by hop 1)
          updates each line Item.current_landed_unit_cost_cents and bumps
          Item.version; hop 3 (caused by hop 2) re-evaluates margin floor so the
          item's sellable price floor changes — a depth-3 fiscal propagation.
        test_recipe:
          setup:
            - "Item ACTIVE retail 3000 floor_margin 0.20; PO issued line qty 4 @ 1000, estimated pool 0; container cleared"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "MG1", name: "Vise", brand_tier: "MID", origin_country: "IN", unit_retail_cents: 3000, member_price_cents: 2800, floor_margin_pct: 0.20, lead_time_days: 50, unit_weight_kg: 6.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-MG"
                lines: [ { item_id: "${item_id}", quantity: 4, unit_cost_cents: 1000 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-MG"
                lines: [ { item_id: "${item_id}", quantity: 4 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/clear-customs"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /containers/${cont_id}/receive"
              payload: { actual_duty_cents: 2000, actual_freight_cents: 0 }
              as: LogisticsCoordinator
            - call: "POST /items/${item_id}/reprice"
              payload: { unit_retail_cents: 1700, member_price_cents: 1700 }
              as: PurchasingManager
              captures: { reprice_err: $.data.error_id }
          assert:
            - "final landed unit cost = 1000 + floor(2000/4) = 1500: Item.${item_id}.current_landed_unit_cost_cents == 1500"
            - "PurchaseOrder.${po_id}.status == RECEIVED (all quantities received)"
            - "Item.version advanced beyond ${item_v0} by the hop-2 cascade"
            - "hop-3 floor = 1500 * 1.20 = 1800: reprice to 1700 rejected with reprice_err == ERR_MARGIN_FLOOR_VIOLATION"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_gate_beats_fiscal_store_credit
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_ITEM_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_STORE_CREDIT]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): completing a sale whose line item was
          DISCONTINUED after the line was added AND requesting store credit
          above the customer's balance must return the state error
          ERR_ITEM_NOT_ACTIVE, not the fiscal ERR_INSUFFICIENT_STORE_CREDIT.
        test_recipe:
          setup:
            - "Item ACTIVE; store; customer with store_credit_cents == 0; OPEN sale with 1 line of the item; item then DISCONTINUED"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "PV1", name: "Charger", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 2500, member_price_cents: 2400, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 0.4 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST6", name: "Store 6", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "Cust Six" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /items/${item_id}/discontinue"
              payload: {}
              as: PurchasingManager
          trigger:
            - call: "POST /sales/${sale_id}/complete"
              payload: { store_credit_applied_cents: 500 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ITEM_NOT_ACTIVE"
            - "Sale.${sale_id}.status == OPEN (no partial effects; store credit NOT debited)"

      - name: safety_hold_beats_coupon_window
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_SAFETY_HOLD]
          - errors[ERR_COUPON_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          Different category pair (business_safety vs business_temporal):
          completing a sale whose item has an ACTIVE HAZARD recall while the
          applied coupon's window has already closed must return ERR_SAFETY_HOLD,
          not ERR_COUPON_OUTSIDE_WINDOW.
        test_recipe:
          setup:
            - "Item ACTIVE; store; customer; OPEN sale with 1 line; coupon window [2026-08-01, 2026-08-15] applied while clock inside window; clock then advanced past window_end; HAZARD recall activated on the item"
          setup_api_calls:
