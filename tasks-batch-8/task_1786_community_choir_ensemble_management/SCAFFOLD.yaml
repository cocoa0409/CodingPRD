        to: COMPLETED
        trigger: "POST /v1/rehearsals/{id}/attendance"
        actor: ChoirDirector
        preconditions: ["rehearsal.scheduled_at <= clock now (ERR_REHEARSAL_NOT_HELD)"]
        side_effects: ["AttendanceRecords created; attendance_rate recomputed for each recorded member"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/rehearsals/{id}/cancel"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["Cancelled rehearsals are excluded from attendance_rate input set"]

  - entity: AttendanceRecord
    field: status
    initial_state: PRESENT
