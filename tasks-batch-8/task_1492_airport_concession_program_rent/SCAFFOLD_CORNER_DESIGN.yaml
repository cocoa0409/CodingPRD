scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: tenant_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults_system
        grounds: ["entities.Tenant"]
        distinguishing_aspect: "POST /tenants omitting acdbe_certified returns 201 with acdbe_certified false, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id, flag: $.data.acdbe_certified, v: $.data.version } }
          trigger: []
          assert:
            - "flag == false   # default applied"
            - "v == 1"
            - "t1 is a server-minted UUID"

      - name: lease_creation_initializes_computed_counters
        claim_type: creation_computed
        grounds: ["entities.Lease.fields.arrears_cents", "entities.Lease.fields.ti_remaining_cents"]
        distinguishing_aspect: "POST /leases returns status DRAFT, arrears_cents 0, ti_remaining_cents equal to ti_allowance_cents, version 1."
        test_recipe:
          setup: ["one tenant"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { stat: $.data.status, arr: $.data.arrears_cents, rem: $.data.ti_remaining_cents, v: $.data.version } }
          assert:
            - "stat == DRAFT"
            - "arr == 0"
            - "rem == 500000"
            - "v == 1"

      - name: lease_get_not_found_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown lease id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /concessions/leases/00000000-0000-0000-0000-000000000000", payload: {}, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: tenant_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.Tenant.fields.legal_name"]
        distinguishing_aspect: "POST /tenants without legal_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /concessions/tenants", payload: { contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: lease_create_invalid_enum_returns_invalid_enum
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_ENUM]", "entities.Lease.fields.category"]
        distinguishing_aspect: "category 'LOUNGE' is not a declared enum member -> 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["one tenant"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "LOUNGE", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_ENUM"

      - name: lease_create_computed_arrears_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Lease.fields.arrears_cents"]
        distinguishing_aspect: "Client-supplied arrears_cents in the create payload is ignored; server stores the computed 0."
        test_recipe:
          setup: ["one tenant"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000, arrears_cents: 999 }, as: AirportAdmin, captures: { arr: $.data.arrears_cents } }
          assert:
            - "arr == 0"

      - name: sales_report_listing_paginates_with_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.SalesReport"]
        distinguishing_aspect: "GET /sales-reports?lease_id&limit=1 over two reports returns total_count 2, has_more true, exactly 1 item."
        test_recipe:
          setup: ["ACTIVE lease with two DRAFT reports (2026-01, 2026-02)"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-02", gross_sales_cents: 200000 }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "GET /concessions/sales-reports", payload: { lease_id: "${l1}", limit: 1, offset: 0 }, as: ConcessionAnalyst }
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "data has exactly 1 item; total_count == 2; has_more == true"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: sales_report_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.SalesReport"]
        distinguishing_aspect: "A freshly created report has status DRAFT and null submitted_at."
        test_recipe:
          setup: ["ACTIVE lease"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}", captures: { stat: $.data.status, sub: $.data.submitted_at } }
          assert:
            - "stat == DRAFT"
            - "sub == null"

      - name: accept_draft_report_returns_report_not_reviewable
        claim_type: invalid_transition
        grounds: ["state_machines.SalesReport.SUBMITTED_to_ACCEPTED", "errors[ERR_REPORT_NOT_REVIEWABLE]"]
        distinguishing_aspect: "ACCEPT from DRAFT (skipping SUBMIT) is rejected with ERR_REPORT_NOT_REVIEWABLE; report stays DRAFT."
        test_recipe:
          setup: ["ACTIVE lease; DRAFT report 2026-01"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REPORT_NOT_REVIEWABLE"

      - name: invoice_paid_settlement_returns_settlement_not_invoicable
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RentSettlement", "errors[ERR_SETTLEMENT_NOT_INVOICABLE]"]
        distinguishing_aspect: "PAID is terminal for invoicing: a second invoice attempt returns ERR_SETTLEMENT_NOT_INVOICABLE."
        test_recipe:
          setup: ["ACTIVE lease; settlement 2026 INVOICED (1,200,000) and fully PAID"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 1200000, method: "ACH" }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SETTLEMENT_NOT_INVOICABLE"

      - name: payment_void_twice_returns_payment_already_voided
        claim_type: idempotency
        grounds: ["state_machines.Payment.POSTED_to_VOIDED", "errors[ERR_PAYMENT_ALREADY_VOIDED]"]
        distinguishing_aspect: "Voiding an already-VOIDED payment returns ERR_PAYMENT_ALREADY_VOIDED; no double-decrement of amount_paid_cents."
        test_recipe:
          setup: ["INVOICED settlement (1,200,000); payment 300,000 POSTED then VOIDED once"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 300000, method: "ACH" }, as: Tenant, as_user_id: "${t1}", captures: { p1: $.data.id } }
            - { call: "POST /concessions/payments/${p1}/void", payload: {}, as: ConcessionAnalyst }
          trigger:
            - { call: "POST /concessions/payments/${p1}/void", payload: {}, as: ConcessionAnalyst, captures: { err: $.data.error_id } }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { paid: $.data.amount_paid_cents } }
          assert:
            - "err == ERR_PAYMENT_ALREADY_VOIDED"
            - "paid == 0   # no double decrement"

      - name: lease_expired_by_clock_sweep
        claim_type: automatic_transition
        grounds: ["state_machines.Lease.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "System sweep on clock-set expires an ACTIVE lease whose term_end_date has passed; status becomes EXPIRED without any lease-scoped call."
        test_recipe:
          setup: ["ACTIVE lease with term 2026-01-01..2026-07-31"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "C3", category: "RETAIL", term_start_date: "2026-01-01", term_end_date: "2026-07-31", mag_annual_cents: 600000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 100000, buildout_deadline: "2026-03-31", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: AirportAdmin }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: AirportAdmin, captures: { stat: $.data.status } }
          assert:
            - "stat == EXPIRED"

      - name: settlement_overdue_by_clock_sweep
        claim_type: automatic_transition
        grounds: ["state_machines.RentSettlement.INVOICED_to_OVERDUE"]
        distinguishing_aspect: "INVOICED settlement with due_date 2027-02-14 flips to OVERDUE when the clock moves to 2027-02-15 with balance outstanding."
        test_recipe:
          setup: ["Settlement 2026 INVOICED at clock 2027-01-15 (due_date = 2027-02-14); no payments"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { duedate: $.data.due_date } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { stat: $.data.status } }
          assert:
            - "duedate == 2027-02-14"
            - "stat == OVERDUE"

      - name: audit_issue_findings_after_close_returns_audit_state_forbids
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AuditCase", "errors[ERR_AUDIT_STATE_FORBIDS]"]
        distinguishing_aspect: "CLOSED is terminal: issue-findings after close returns ERR_AUDIT_STATE_FORBIDS."
        test_recipe:
          setup: ["ACTIVE lease; audit case OPENED then CLOSED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/audits", payload: { lease_id: "${l1}", period_start_month: "2026-01", period_end_month: "2026-03" }, as: Auditor, captures: { a1: $.data.id } }
            - { call: "POST /concessions/audits/${a1}/close", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /concessions/audits/${a1}/issue-findings", payload: { findings: [] }, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AUDIT_STATE_FORBIDS"

      - name: waiver_approve_after_reject_returns_waiver_state_forbids
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.OperatingHoursWaiver", "errors[ERR_WAIVER_STATE_FORBIDS]"]
        distinguishing_aspect: "REJECTED is terminal: a later APPROVE attempt returns ERR_WAIVER_STATE_FORBIDS."
        test_recipe:
          setup: ["ACTIVE lease; waiver REQUESTED then REJECTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/waivers", payload: { lease_id: "${l1}", closure_start_date: "2026-10-01", closure_end_date: "2026-10-05", reason: "renovation" }, as: Tenant, as_user_id: "${t1}", captures: { w1: $.data.id } }
            - { call: "POST /concessions/waivers/${w1}/transition", payload: { action: "REJECT" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/waivers/${w1}/transition", payload: { action: "APPROVE" }, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAIVER_STATE_FORBIDS"

      - name: terminate_draft_lease_returns_lease_state_forbids
        claim_type: invalid_transition
        grounds: ["state_machines.Lease", "errors[ERR_LEASE_STATE_FORBIDS]"]
        distinguishing_aspect: "TERMINATE from DRAFT is not a declared transition -> ERR_LEASE_STATE_FORBIDS."
        test_recipe:
          setup: ["lease created, never activated"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
          trigger:
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "TERMINATE" }, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LEASE_STATE_FORBIDS"

      - name: disburse_unapproved_draw_returns_draw_state_forbids
        claim_type: invalid_transition
        grounds: ["state_machines.TIDraw", "errors[ERR_DRAW_STATE_FORBIDS]"]
        distinguishing_aspect: "DISBURSE from REQUESTED (skipping APPROVE) returns ERR_DRAW_STATE_FORBIDS."
        test_recipe:
          setup: ["ACTIVE lease; draw 100,000 REQUESTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
