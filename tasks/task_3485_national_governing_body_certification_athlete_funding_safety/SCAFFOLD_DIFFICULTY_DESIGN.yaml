  - rule_id: resource_temporal_overlap
    instances:
      - name: certification_cycle_half_open_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.CertificationCycle.fields.window_start
        distinguishing_aspect: |
          Resource: the governing body's review calendar, HALF-OPEN interval
          semantics — a cycle starting exactly at the prior cycle's window_end is
          allowed, while any interior overlap is rejected.
        test_recipe:
          setup:
            - "GoverningBody APPLIED with one CertificationCycle occupying [2026-09-01, 2026-12-01)"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Judo", sport_code: "JUDO", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_a: $.data.id }
          trigger:
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-10-15T00:00:00Z", window_end: "2027-02-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-12-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_c: $.data.id }
            - call: "GET /api/governing-bodies/${gb_id}/certification-cycles"
              as: CommitteeAdmin
              captures: { cyc_count: $.data }
          assert:
            - "overlapping cycle [2026-10-15, 2027-02-01): error_id == ERR_CYCLE_WINDOW_OVERLAP"
            - "adjacent cycle [2026-12-01, 2027-03-01) with window_start == prior window_end: created (201) — half-open semantics permit touching endpoints"
            - "body now has exactly 2 certification cycles"

      - name: deal_exclusivity_closed_interval_gap
        grounds:
          - validations[priority=6]
          - errors[ERR_DEAL_EXCLUSIVITY_OVERLAP]
          - entities.CommercialDeal.fields.exclusivity_end
        distinguishing_aspect: |
          Resource: an athlete's image-rights calendar, CLOSED interval semantics
          with a mandatory 1-day gap — a deal starting on the prior deal's
          exclusivity_end is rejected (unlike the certification calendar where
          touching is allowed), and only a start at end + DEAL_EXCLUSIVITY_MIN_GAP_DAYS
          (1) is accepted.
        test_recipe:
          setup:
            - "CERTIFIED body; ELIGIBLE athlete; PROPOSED deal A with exclusivity [2027-01-01, 2027-03-31] (closed)"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
