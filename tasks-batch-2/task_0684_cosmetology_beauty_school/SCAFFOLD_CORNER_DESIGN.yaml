scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_program_computes_credit_hours
        claim_type: Computed Fields
        grounds: [entities.Program.fields.credit_hours, calculations.clock_to_credit]
        distinguishing_aspect: "POST /school/programs with total_clock_hours 1500 and default clock_hours_per_credit 37.5 yields credit_hours == 40 (floor)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { credit: $.data.credit_hours }
          assert:
            - "data.credit_hours == 40"

      - name: create_program_clinic_phase_default_applies
        claim_type: Defaults
        grounds: [entities.Program.fields.clock_hours_per_credit, entities.Program.fields.admin_fee_cap_cents]
        distinguishing_aspect: "Omitting clock_hours_per_credit and admin_fee_cap_cents applies defaults 37.5 and 15000; a 600h program yields credit_hours == 16."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /school/programs"
              payload: { name: "Esthetics 600", total_clock_hours: 600, tuition_cents: 500000, kit_fee_cents: 80000, lab_fee_cents: 20000, clinic_phase_start_hour: 150 }
              as: Registrar
              captures: { credit: $.data.credit_hours, cap: $.data.admin_fee_cap_cents }
          assert:
            - "data.credit_hours == 16"
            - "data.admin_fee_cap_cents == 15000"
            - "data.clock_hours_per_credit == 37.5"

      - name: enrollment_create_computes_ledger
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.total_charges_cents, entities.Enrollment.fields.ledger_balance_cents, calculations.ledger_balance]
        distinguishing_aspect: "POST /school/enrollments snapshots program charges: total_charges_cents == 1400000, total_credits_cents == 0, ledger_balance_cents == 1400000 at creation."
        test_recipe:
          setup: ["A program with tuition 1200000, kit 150000, lab 50000."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Sam Shine", email: "sam@x.com", ssn_last4: "2020" }
              as: Registrar
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 0 }
              as: Registrar
              captures: { enr_id: $.data.id }
          assert:
            - "data.total_charges_cents == 1400000"
            - "data.total_credits_cents == 0"
            - "data.ledger_balance_cents == 1400000"
            - "data.status == ACTIVE"

      - name: enrollment_create_sets_student_enrolled
        claim_type: Computed Fields
        grounds: [entities.Student.fields.status, "endpoints[POST /school/enrollments]"]
        distinguishing_aspect: "Creating an enrollment sets the referenced Student.status to ENROLLED (side effect)."
        test_recipe:
          setup: ["A program and a PROSPECT student."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Tia Tint", email: "tia@x.com", ssn_last4: "2121" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z" }
              as: Registrar
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /school/students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "data.status == ENROLLED"

      - name: get_program_not_found
        claim_type: Not Found
        grounds: ["endpoints[GET /school/programs/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /school/programs/{nonexistent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /school/programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_student_missing_required_field
        claim_type: Required Fields
        grounds: ["endpoints[POST /school/students]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /school/students missing required email returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /school/students"
              payload: { full_name: "No Email", ssn_last4: "0000" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_student_duplicate_email
        claim_type: Type Constraints
        grounds: [entities.Student.fields.email, "validations[priority=6]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Registering a second student with an existing email returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["One student with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /school/students"
              payload: { full_name: "First", email: "dup@x.com", ssn_last4: "0001" }
              as: Registrar
          trigger:
            - call: "POST /school/students"
              payload: { full_name: "Second", email: "dup@x.com", ssn_last4: "0002" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_KEY"

      - name: create_instructor_duplicate_license
        claim_type: Type Constraints
        grounds: [entities.Instructor.fields.license_number, "validations[priority=6]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Creating a second instructor with an existing license_number returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["One instructor with license INS-DUP exists."]
          setup_api_calls:
            - call: "POST /school/instructors"
              payload: { full_name: "First Teach", license_number: "INS-DUP", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
          trigger:
            - call: "POST /school/instructors"
              payload: { full_name: "Second Teach", license_number: "INS-DUP", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_KEY"

      - name: enrollment_create_invalid_enum_program_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Enrollment.fields.program_id, "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /school/enrollments referencing a non-existent program_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A student exists; program id is bogus."]
          setup_api_calls:
            - call: "POST /school/students"
              payload: { full_name: "Una Up", email: "una@x.com", ssn_last4: "2323" }
              as: Registrar
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "00000000-0000-0000-0000-000000000000", enrolled_on_iso: "2026-04-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: list_programs_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints[GET /school/programs]", response_envelope]
        distinguishing_aspect: "GET /school/programs returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two programs exist."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "P1", total_clock_hours: 1500, tuition_cents: 100, kit_fee_cents: 0, lab_fee_cents: 0, clinic_phase_start_hour: 300 }
              as: Registrar
            - call: "POST /school/programs"
              payload: { name: "P2", total_clock_hours: 600, tuition_cents: 100, kit_fee_cents: 0, lab_fee_cents: 0, clinic_phase_start_hour: 150 }
              as: Registrar
          trigger:
            - call: "GET /school/programs"
              payload: { limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"

  # =========================================================================
  - section: state_machines
    instances:
      - name: approve_attendance_from_voided_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AttendanceRecord.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an attendance record already VOIDED (from PENDING) returns ERR_INVALID_STATE; no hours accrue."
        test_recipe:
          setup: ["A PENDING attendance record that has been VOIDED."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Vic Vibe", email: "vic@x.com", ssn_last4: "2424" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-20", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 100 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 50, hours: 50 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/void"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: exam_approve_not_ready_returns_error
        claim_type: precondition_violation
        grounds: [state_machines.ExamApplication.SUBMITTED_to_APPROVED, "validations[priority=16]", "errors[ERR_EXAM_NOT_READY]"]
        distinguishing_aspect: "Approving a SUBMITTED application whose readiness_score 78.50 < 80 returns ERR_EXAM_NOT_READY; enrollment stays ACTIVE."
        test_recipe:
          setup: ["A SUBMITTED exam application with readiness_score 78.50 (mock 50, comp 100, actual_hours 1350)."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Wes Wave", email: "wes@x.com", ssn_last4: "2525" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-21", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 1400 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 1350, hours: 1350 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/exam-applications"
              payload: { enrollment_id: "${enr_id}", exam_type: "WRITTEN", mock_exam_avg: 50, competency_signoff_pct: 100 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { exa_id: $.data.id }
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "POST /school/exam-applications/${exa_id}/approve"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_EXAM_NOT_READY"

      - name: exam_result_failed_reverts_enrollment_to_active
        claim_type: Side Effect Execution
        grounds: [state_machines.ExamApplication.SCHEDULED_to_FAILED, state_machines.Enrollment.ACTIVE_to_EXAM_PENDING]
        distinguishing_aspect: "Recording FAILED on a SCHEDULED application reverts owning Enrollment EXAM_PENDING->ACTIVE (retake permitted) and sets application FAILED."
        test_recipe:
          setup: ["An exam application SCHEDULED for an enrollment in EXAM_PENDING (ready: actual_hours 1350, mock 85, comp 100)."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Xan Xen", email: "xan@x.com", ssn_last4: "2626" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-22", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 1400 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 1350, hours: 1350 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/exam-applications"
              payload: { enrollment_id: "${enr_id}", exam_type: "WRITTEN", mock_exam_avg: 85, competency_signoff_pct: 100 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { exa_id: $.data.id }
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /school/exam-applications/${exa_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /school/exam-applications/${exa_id}/schedule"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /school/exam-applications/${exa_id}/record-result"
              payload: { result: "FAILED" }
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "ExamApplication.${exa_id}.status == FAILED"
            - "Enrollment.${enr_id}.status == ACTIVE"

      - name: graduate_blocked_by_outstanding_balance
        claim_type: precondition_violation
        grounds: [state_machines.Enrollment.EXAM_PENDING_to_GRADUATED, "validations[priority=17]", "errors[ERR_OUTSTANDING_BALANCE]"]
        distinguishing_aspect: "Recording PASSED while Enrollment.ledger_balance_cents == 1400000 > 0 returns ERR_OUTSTANDING_BALANCE; enrollment stays EXAM_PENDING."
        test_recipe:
          setup: ["A SCHEDULED exam application for an EXAM_PENDING enrollment with full hours (actual_hours 1500) but ledger_balance 1400000."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Yul Yarn", email: "yul@x.com", ssn_last4: "2727" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-23", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 1500 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 1500, hours: 1500 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/exam-applications"
              payload: { enrollment_id: "${enr_id}", exam_type: "WRITTEN", mock_exam_avg: 85, competency_signoff_pct: 100 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { exa_id: $.data.id }
            - call: "POST /school/exam-applications/${exa_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /school/exam-applications/${exa_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /school/exam-applications/${exa_id}/schedule"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /school/exam-applications/${exa_id}/record-result"
              payload: { result: "PASSED" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_OUTSTANDING_BALANCE"
            - "Enrollment.${enr_id}.status == EXAM_PENDING"

      - name: terminal_returned_disbursement_cannot_return_again
        claim_type: terminal_lockdown
        grounds: [state_machines.Disbursement.POSTED_to_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETURNED disbursement (terminal) cannot be returned again; second /return yields ERR_INVALID_STATE."
        test_recipe:
          setup: ["A disbursement POSTED then RETURNED (terminal)."]
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Zoe Zest", email: "zoe@x.com", ssn_last4: "2828" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-24", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/enrollments"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}", enrolled_on_iso: "2026-04-01T00:00:00Z", scheduled_hours_to_date: 450 }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 405, hours: 405 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FinancialAidOfficer
            - call: "POST /school/disbursements"
              payload: { enrollment_id: "${enr_id}", payment_period: 1, period_hours: 400, period_weeks: 4, gross_amount_cents: 600000, origination_fee_cents: 0 }
              as: FinancialAidOfficer
              captures: { dis_id: $.data.id }
            - call: "GET /school/enrollments/${enr_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { enr_v: $.data.version }
            - call: "POST /school/disbursements/${dis_id}/post"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: FinancialAidOfficer
            - call: "POST /school/disbursements/${dis_id}/return"
              payload: {}
              as: FinancialAidOfficer
          trigger:
            - call: "POST /school/disbursements/${dis_id}/return"
              payload: {}
              as: FinancialAidOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: clinic_signoff_already_signed_off_invalid_state
        claim_type: invalid_transition
