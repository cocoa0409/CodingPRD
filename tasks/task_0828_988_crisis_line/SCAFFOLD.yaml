  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "BedReferral id does not exist" }
  - { id: ERR_FOLLOWUP_NOT_FOUND, http: 404, condition: "FollowUpTask id does not exist" }
  - { id: ERR_EMERGENCY_NOT_FOUND, http: 404, condition: "EmergencyCoordination id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field or malformed body" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its allowed set" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window_end <= window_start (or shift_end <= shift_start)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DISPOSITION_NOT_ALLOWED, http: 409, condition: "Requested disposition is not permitted for the contact's risk_band" }
  - { id: ERR_NO_ACTIVE_SAFETY_PLAN, http: 409, condition: "Resolving a DE_ESCALATION contact with no ACTIVE SafetyPlan" }
  - { id: ERR_CONTACT_NOT_DISPATCH_PENDING, http: 409, condition: "Dispatch/referral creation requires the contact to be DISPATCH_PENDING" }
  - { id: ERR_CENTER_OFFLINE, http: 409, condition: "Referral create/admit against a DIVERTED CrisisCenter" }
  - { id: ERR_ACUITY_NOT_ACCEPTED, http: 409, condition: "CrisisCenter does not accept the referral acuity" }
  - { id: ERR_BED_WINDOW_CONFLICT, http: 409, condition: "Bed-hold window would push concurrent holds above bed_capacity" }
  - { id: ERR_TEAM_WINDOW_CONFLICT, http: 409, condition: "Dispatch window collides with another dispatch window for the team within the turnaround buffer" }
  - { id: ERR_TEAM_OFF_SHIFT, http: 409, condition: "Team is OFF_SHIFT or the window falls outside its shift" }
  - { id: ERR_TEAM_AT_CAPACITY, http: 409, condition: "Team already has capacity active dispatches" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CrisisCounselor
    description: "Front-line clinical staff: intake, screening, de-escalation, safety planning, follow-up outreach."
    identity: opaque
    exclusive_operations:
      - "POST /risk-screenings"
      - "POST /safety-plans"
      - "POST /safety-plans/{safetyPlanId}/state"
      - "POST /follow-up-tasks/{taskId}/attempt"
    shared_operations:
      - "POST /contacts (create intake)"
      - "POST /contacts/{contactId}/state (DE_ESCALATION, RESOLVED for clinical branches)"
      - "GET on all resources"
      - "POST /_clock/set_current_utc"

  - name: CrisisDispatcher
    description: "Logistics staff: mobile dispatch, bed referral, center status, 911 escalation."
    identity: opaque
    exclusive_operations:
      - "POST /mobile-dispatches"
      - "POST /mobile-dispatches/{dispatchId}/state"
      - "POST /bed-referrals"
      - "POST /bed-referrals/{referralId}/state"
      - "POST /crisis-centers/{centerId}/state"
    shared_operations:
      - "POST /contacts (create intake)"
      - "POST /contacts/{contactId}/state (DISPATCH_PENDING, EMERGENCY_911)"
      - "GET on all resources"
      - "POST /_clock/set_current_utc"

  - name: ClinicalSupervisor
    description: "Superset role (hierarchical override): everything CrisisCounselor and CrisisDispatcher can do, plus team/center configuration, closing contacts, and reporting."
    identity: opaque
    exclusive_operations:
      - "POST /mobile-crisis-teams"
      - "POST /crisis-centers"
      - "POST /contacts/{contactId}/state (CLOSED)"
      - "GET /reports/operations"
    shared_operations:
      - "All CrisisCounselor operations"
      - "All CrisisDispatcher operations"
