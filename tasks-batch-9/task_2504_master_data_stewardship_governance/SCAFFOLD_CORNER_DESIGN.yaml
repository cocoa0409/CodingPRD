        grounds:
          - calculations.domain_quality_scorecard.input_set
          - state_machines.QualityRule.ACTIVE_to_RETIRED.side_effects
          - errors.ERR_UNKNOWN_RULE_CODE
        distinguishing_aspect: "On the CERTIFIED basis every ACTIVE rule sits in the denominator, so retiring QR2 must shrink the denominator from 100 to 40 - the same measurement then scores 50.00 instead of 20.00 - and the retired rule_code becomes unmeasurable (ERR_UNKNOWN_RULE_CODE) rather than silently ignored."
        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT) with DATA_OWNER + DATA_STEWARD assignments and an ACTIVE AUTHORITATIVE registration on CERTIFIED source ERP; rules QR1 (40 pts, threshold 90.00, HIGH) and QR2 (60 pts, threshold 80.00, LOW); QR2 then retired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
