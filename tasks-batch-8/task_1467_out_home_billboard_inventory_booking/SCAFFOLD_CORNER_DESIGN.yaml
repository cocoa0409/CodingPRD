            - { call: "PUT /api/campaigns/${camp1}", payload: { status: "SUBMITTED" }, as: SalesManager, captures: { err2: $.data.error_id } }
          assert:
            - "SalesPlanner approving: error_id == ERR_INSUFFICIENT_PERMISSIONS (403); C2 stays SUBMITTED"
            - "SalesManager submitting: error_id == ERR_INSUFFICIENT_PERMISSIONS (403); C1 stays DRAFT"
      - name: field_installer_cannot_verify_posting_rejected
        claim_type: rbac_exclusive_denial
        grounds: [roles.FieldInstaller, roles.OperationsAuditor, "validations[priority=2]"]
        distinguishing_aspect: "PUT /api/posting-records/{id} is exclusive to OperationsAuditor; a FieldInstaller (the role that reports postings) is denied at priority 2."
        test_recipe:
          setup: ["flight ART_CLEARED at clock 2026-08-10; posting REPORTED by installer-1"]
