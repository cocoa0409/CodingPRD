            - "After the clock reaches end_date and the order completes: Member.${mf}.deployment_posture == NONE while Member.${mf}.status is still SUSPENDED (posture release does not touch the status dimension)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: revocation_depth3_descendant_suspension_cascade
        grounds:
          - state_machines.Member.SUSPENDED_to_REVOKED
          - state_machines.ProductEntitlement.GRANDFATHERED_to_CLOSED
          - calculations.household_aggregate_recompute
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST .../eligibility-loss
          (FRAUD_CONFIRMED): Member revocation (hop 1) closes every
          GRANDFATHERED entitlement of the revoked member (hop 2, caused by
          the revocation, not the request), and each entitlement closure
          recomputes the linked household's aggregate_product_count (hop 3,
          caused by hop 2); a child member sponsored by the revoked member is
          itself suspended, which recomputes ITS household aggregate (still
          hop 3 from the original trigger).
        test_recipe:
          setup:
            - "Sponsor S ACTIVE with an entitlement whose offering does not allow S's category after loss (so suspension grandfathered it); household H1 containing S."
            - "Child C (FAMILY_CHILD, ACTIVE, sponsored by S) in household H2."
            - "S SUSPENDED via DOCUMENTATION_REVOKED (entitlement grandfathered, H1 aggregate includes S's suspended facets)."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Gus Ground", applicant_dob: "1979-11-11", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_g: $.data.id }
