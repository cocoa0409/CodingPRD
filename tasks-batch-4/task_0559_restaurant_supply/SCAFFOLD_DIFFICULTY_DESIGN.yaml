# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: freight_provisional_vs_final_on_shipment
        grounds:
          - calculations.freight_quote
          - entities.Shipment.fields.freight_quote_cents
          - entities.Shipment.fields.final_freight_cents
          - state_machines.Shipment.QUOTED_to_BOOKED
        distinguishing_aspect: "Freight is computed twice on the SAME Shipment: provisional weighs ORDERED qty (5 eaches, 500 lb) = 27000c, final weighs ALLOCATED qty (3 eaches, 300 lb) = 21000c — the backordered 2 eaches make final < provisional; this dual variant lives on the Shipment domain, distinct from the RMA-domain restock variant."
        test_recipe:
          setup:
            - "Account with ample credit; STOCK/LTL product HEAVY weighing 100 lb/each with on_hand_qty=3; a CONFIRMED order for 5 HEAVY (allocated 3, backordered 2)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro A", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HEAVY-1", name: "Floor Mixer", category: "SMALLWARE", taxable: true, unit_price_cents: 1000, case_qty: 100, case_price_cents: 90000, pallet_case_qty: 10, pallet_price_cents: 800000, weight_lbs_per_unit: 100, fulfillment_type: "STOCK", freight_type: "LTL", on_hand_qty: 3, par_level: 50, reorder_point: 10 }
              as: WarehouseOps
              captures: { heavy_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${heavy_id}", quantity: 5 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "YRC", liftgate_required: true }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
          assert:
            - "Shipment.${ship_id}.freight_quote_cents == 27000"
            - "Shipment.${ship_id}.final_freight_cents == 21000"
            - "Shipment.${ship_id}.freight_quote_cents != Shipment.${ship_id}.final_freight_cents"

      - name: restock_sealed_vs_opened_on_rma
        grounds:
          - calculations.restock_refund
          - entities.ReturnLine.fields.condition
          - entities.ReturnAuthorization.fields.refund_cents
          - entities.ReturnAuthorization.fields.restock_fee_cents
          - state_machines.ReturnAuthorization.REQUESTED_to_APPROVED
        distinguishing_aspect: "Two ReturnLines with identical merch value (3200c each) yield different refunds because condition drives the restock pct: SEALED 15% -> fee 480 refund 2720; OPENED 25% -> fee 800 refund 2400; RMA totals restock_fee_cents=1280, refund_cents=5120 — dual variant on the RMA domain, distinct from the Shipment-domain freight variant."
        test_recipe:
          setup:
            - "A delivered (COMPLETED) order containing 4 PLATE and 4 CUP (each unit_price 800c); an RMA in REQUESTED with a SEALED line of 4 PLATE and an OPENED line of 4 CUP."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro B", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PLATE-1", name: "Dinner Plate", category: "SMALLWARE", taxable: true, unit_price_cents: 800, case_qty: 100, case_price_cents: 70000, pallet_case_qty: 10, pallet_price_cents: 650000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 200, reorder_point: 10 }
              as: WarehouseOps
              captures: { plate_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CUP-1", name: "Coffee Cup", category: "SMALLWARE", taxable: true, unit_price_cents: 800, case_qty: 100, case_price_cents: 70000, pallet_case_qty: 10, pallet_price_cents: 650000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 200, reorder_point: 10 }
              as: WarehouseOps
              captures: { cup_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${plate_id}", quantity: 4 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${cup_id}", quantity: 4 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "UPS" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOps
            - call: "POST /orders/${order_id}/returns"
              payload: { reason: "Damaged in transit" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/lines"
              payload: { product_id: "${plate_id}", quantity: 4, condition: "SEALED" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /returns/${return_id}/lines"
              payload: { product_id: "${cup_id}", quantity: 4, condition: "OPENED" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: WarehouseOps
          assert:
            - "ReturnAuthorization.${return_id}.restock_fee_cents == 1280"
            - "ReturnAuthorization.${return_id}.refund_cents == 5120"
            - "ReturnAuthorization.${return_id}.status == APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_pallet_case_each_decomposition
        grounds:
          - calculations.line_tier_pricing
          - entities.OrderLine.fields.pricing_tier
          - entities.OrderLine.fields.line_subtotal_cents
        distinguishing_aspect: "Mode (a): line pricing takes >=3 inputs (unit/case/pallet prices + case_qty + pallet_case_qty) with nested integer division; qty 125 = 1 pallet(120)+0 cases+5 eaches -> 48000+2500 = 50500c, tier PALLET — a tiered-rate selection, not a rounding or evaluation-order mode."
        test_recipe:
          setup:
            - "Account and product WIDGET (unit 500, case_qty 12, case_price 5400, pallet_case_qty 10, pallet_price 48000); a DRAFT order."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro C", credit_terms: "PREPAID", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "WIDGET-1", name: "Widget", category: "SMALLWARE", taxable: true, unit_price_cents: 500, case_qty: 12, case_price_cents: 5400, pallet_case_qty: 10, pallet_price_cents: 48000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 1000, par_level: 200, reorder_point: 10 }
              as: WarehouseOps
              captures: { widget_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${widget_id}", quantity: 125 }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
          assert:
            - "OrderLine.${line_id}.pricing_tier == PALLET"
            - "OrderLine.${line_id}.line_subtotal_cents == 50500"

      - name: order_tax_round_per_line_then_sum
        grounds:
          - calculations.order_tax
          - entities.PurchaseOrder.fields.tax_cents
          - entities.Account.fields.tax_rate
        distinguishing_aspect: "Mode (b): rounding order is pinned. Two taxable lines of 630c at rate 0.08 each round to 50c (630*0.08=50.4) then sum to 100c; sum-then-round (1260*0.08=100.8 -> 101c) would differ — the scaffold pins round-per-line-then-sum, a rounding-order mode distinct from the tiered-selection mode."
        test_recipe:
          setup:
            - "Account with default tax_rate 0.08 (not tax-exempt), ample credit; two taxable products PEPPER and SALT priced 630c each; a DRAFT order with one line of each at qty 1."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro D", credit_terms: "NET_15", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEPPER-1", name: "Pepper Mill", category: "SMALLWARE", taxable: true, unit_price_cents: 630, case_qty: 100, case_price_cents: 60000, pallet_case_qty: 10, pallet_price_cents: 560000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { pepper_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SALT-1", name: "Salt Shaker", category: "SMALLWARE", taxable: true, unit_price_cents: 630, case_qty: 100, case_price_cents: 60000, pallet_case_qty: 10, pallet_price_cents: 560000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { salt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${pepper_id}", quantity: 1 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${salt_id}", quantity: 1 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "PurchaseOrder.${order_id}.tax_cents == 100"
            - "PurchaseOrder.${order_id}.merchandise_subtotal_cents == 1260"
            - "PurchaseOrder.${order_id}.total_cents == 1360"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rma_approved_revert_to_requested
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_REQUESTED
          - state_machines.ReturnAuthorization.REQUESTED_to_APPROVED
          - entities.ReturnAuthorization.fields.refund_cents
        distinguishing_aspect: "ReturnAuthorization is non-linear via a revert edge APPROVED->REQUESTED (revise): after approve computes refund 2720, revise zeroes refund_cents and returns status to REQUESTED — a backward transition on the RMA entity, distinct from the TaxExemptCertificate cycle."
        test_recipe:
          setup:
            - "A delivered order with a PLATE line; an RMA APPROVED with one SEALED line of 4 PLATE (refund_cents 2720)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro E", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PLATE-2", name: "Salad Plate", category: "SMALLWARE", taxable: true, unit_price_cents: 800, case_qty: 100, case_price_cents: 70000, pallet_case_qty: 10, pallet_price_cents: 650000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 200, reorder_point: 10 }
              as: WarehouseOps
              captures: { plate_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${plate_id}", quantity: 4 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "UPS" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOps
            - call: "POST /orders/${order_id}/returns"
              payload: { reason: "Wrong item" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/lines"
              payload: { product_id: "${plate_id}", quantity: 4, condition: "SEALED" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /returns/${return_id}/revise"
              payload: {}
              as: WarehouseOps
          assert:
            - "ReturnAuthorization.${return_id}.status == REQUESTED"
            - "ReturnAuthorization.${return_id}.refund_cents == 0"
            - "ReturnAuthorization.${return_id}.restock_fee_cents == 0"

      - name: tax_cert_rejected_resubmit_cycle
        grounds:
          - state_machines.TaxExemptCertificate.REJECTED_to_SUBMITTED
          - state_machines.TaxExemptCertificate.SUBMITTED_to_REJECTED
          - entities.TaxExemptCertificate.fields.status
        distinguishing_aspect: "TaxExemptCertificate cycles SUBMITTED->REJECTED->SUBMITTED via resubmit: after reject the owner resubmits and status returns to SUBMITTED — a cyclic loop on the certificate entity, distinct from the RMA branch/revert."
        test_recipe:
          setup:
            - "An account whose Buyer submitted a certificate that was then REJECTED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro F", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tax-certificates"
              payload: { cert_number: "TX-1001", state_code: "TX", expiry_date: "2027-01-01T00:00:00Z" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /tax-certificates/${cert_id}/reject"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /tax-certificates/${cert_id}/resubmit"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "TaxExemptCertificate.${cert_id}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_allocates_decrements_stock_flags_reorder
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - entities.OrderLine.fields.allocated_qty
          - entities.Product.fields.on_hand_qty
          - entities.Product.fields.needs_reorder
          - calculations.line_tier_pricing
        distinguishing_aspect: "Depth-3 chain from order confirm: confirm mutates OrderLine (allocated_qty=2) -> that allocation mutates Product.on_hand_qty (5->3) -> that stock change flips Product.needs_reorder to true (3<=reorder_point 4) with reorder_suggested_qty 17; each hop is caused by the prior hop, originating from the DRAFT->CONFIRMED trigger."
        test_recipe:
          setup:
            - "Account with ample credit; STOCK product with on_hand_qty=5, reorder_point=4, par_level=20; a DRAFT order with one line of qty 2."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro G", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CASCA-1", name: "Mixing Bowl", category: "SMALLWARE", taxable: true, unit_price_cents: 500, case_qty: 12, case_price_cents: 5400, pallet_case_qty: 10, pallet_price_cents: 48000, weight_lbs_per_unit: 2, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 5, par_level: 20, reorder_point: 4 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "OrderLine.${line_id}.allocated_qty == 2"
            - "Product.${prod_id}.on_hand_qty == 3"
            - "Product.${prod_id}.needs_reorder == true"
            - "Product.${prod_id}.reorder_suggested_qty == 17"

      - name: rma_receive_restocks_clears_reorder
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_RECEIVED
          - entities.ReturnLine.fields.status
          - entities.Product.fields.on_hand_qty
          - entities.Product.fields.needs_reorder
        distinguishing_aspect: "Depth-3 chain from a DIFFERENT trigger (RMA receive): receive mutates ReturnLine (status->RECEIVED) -> that mutates Product.on_hand_qty (4->8) -> that stock change flips Product.needs_reorder to false (8>reorder_point 5); originates from APPROVED->RECEIVED, not from order confirm."
        test_recipe:
          setup:
            - "Product FRYPAN on_hand=8 reorder_point=5 par=12; a delivered order for 4 FRYPAN (on_hand now 4, needs_reorder true); an RMA APPROVED with a SEALED line of 4 FRYPAN."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro H", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FRYPAN-1", name: "Fry Pan", category: "SMALLWARE", taxable: true, unit_price_cents: 1500, case_qty: 100, case_price_cents: 130000, pallet_case_qty: 10, pallet_price_cents: 1200000, weight_lbs_per_unit: 3, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 8, par_level: 12, reorder_point: 5 }
              as: WarehouseOps
              captures: { pan_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${pan_id}", quantity: 4 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "FEDEX" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOps
            - call: "POST /orders/${order_id}/returns"
              payload: { reason: "Overstock" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/lines"
              payload: { product_id: "${pan_id}", quantity: 4, condition: "SEALED" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { rline_id: $.data.id }
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /returns/${return_id}/receive"
              payload: {}
              as: WarehouseOps
          assert:
            - "ReturnLine.${rline_id}.status == RECEIVED"
            - "Product.${pan_id}.on_hand_qty == 8"
            - "Product.${pan_id}.needs_reorder == false"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_suspended_beats_credit
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "On confirm, the account is SUSPENDED (state, priority 9) AND the order total 6480c exceeds credit_available 1000c (business_fiscal, priority 10); the state error ERR_ACCOUNT_SUSPENDED wins — a state vs business_fiscal pairing distinct from the temporal vs constraint pairing."
        test_recipe:
          setup:
            - "SUSPENDED account with credit_limit 1000c; a DRAFT order with one line whose total (6000 + 480 tax) exceeds available credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro I", credit_terms: "NET_30", credit_limit_cents: 1000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "BIG-1", name: "Walk-in Shelf", category: "SMALLWARE", taxable: true, unit_price_cents: 6000, case_qty: 100, case_price_cents: 500000, pallet_case_qty: 10, pallet_price_cents: 4500000, weight_lbs_per_unit: 5, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
