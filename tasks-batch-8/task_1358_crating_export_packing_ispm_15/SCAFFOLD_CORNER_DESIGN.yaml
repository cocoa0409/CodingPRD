            - { call: "POST /crating/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/claims", payload: { crate_id: "${crate_id}", claim_type: IMPACT, description: "Late discovery", amount_claimed_cents: 50000 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CLAIM_WINDOW_EXPIRED (35 days > 30-day window from delivered_at 2026-08-01)"]
      - name: sod_approver_is_preparer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "ComplianceOfficer u-co-1 prepared and submitted the declaration; the same X-User-ID approving it violates segregation of duties -> ERR_SOD_VIOLATION even though the role is correct."
        test_recipe:
          setup: ["hazmat item; declaration created AND submitted by ComplianceOfficer u-co-1 (declaration is SUBMITTED, state check passes)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "SoD Co", site_code: "SOD-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Battery pack", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 40, fragile_class: STANDARD, hazmat: true, battery_in_equipment: LITHIUM_ION, declared_value_cents: 80000 }, as: SalesRep, captures: { item_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/hazmat-declarations", payload: { un_number: "UN3481", dg_class: "9", packing_group: "II", battery_type: LITHIUM_ION }, as: ComplianceOfficer, as_user_id: "u-co-1", captures: { decl_id: $.data.id } }
            - { call: "POST /crating/hazmat-declarations/${decl_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "u-co-1" }
          trigger:
            - { call: "POST /crating/hazmat-declarations/${decl_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "u-co-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SOD_VIOLATION; declaration remains SUBMITTED; approved_by_user_id still null"]
      - name: crew_unqualified_for_hazmat_job
        claim_type: conditional_validation
        grounds: ["validations[priority=23]", "errors[ERR_CREW_UNQUALIFIED]"]
        distinguishing_aspect: "Conditional rule: the same crew+booking is fine for a clean job, but the job contains a hazmat item so HAZMAT_CERT is required -> ERR_CREW_UNQUALIFIED."
        test_recipe:
          setup: ["accepted SHOP job whose item has hazmat=true; crew with capabilities [SHOP_BUILD] only"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Qual Co", site_code: "QUA-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Solvent pump", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 40, fragile_class: STANDARD, hazmat: true, declared_value_cents: 80000 }, as: SalesRep, captures: { item_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/crews", payload: { name: "Plain Crew", capabilities: [SHOP_BUILD] }, as: ShopForeman, captures: { crew_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/labor-bookings", payload: { crew_id: "${crew_id}", mode: SHOP, start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ShopForeman, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CREW_UNQUALIFIED (crew lacks HAZMAT_CERT for a hazmat job)"]
      - name: item_patch_locked_by_design_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_ITEM_NOT_CAPTURABLE]"]
        distinguishing_aspect: "PATCH on captured dims is allowed only while no non-SUPERSEDED design exists; with a DRAFT design present -> ERR_ITEM_NOT_CAPTURABLE."
        test_recipe:
          setup: ["QUOTED job; item with a DRAFT design"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Patch Co", site_code: "PAT-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
