        grounds:
          - state_machines.BalanceRecord.PROPOSED_to_APPLIED
          - state_machines.BalanceRecord.APPLIED_to_SUPERSEDED
          - endpoints.POST_balance_records_decision
          - calculations.gas_balance_target
          - entities.BeerLine.fields.applied_psi
          - entities.BeerLine.fields.applied_co2_pct
        distinguishing_aspect: |
          Entity A (BalanceRecord) changing state adjusts entity B (BeerLine) and
          a sibling A row at once: the second APPLY moves the first record to
          SUPERSEDED and repoints BeerLine.applied_co2_pct from 59.2 to 48.5
