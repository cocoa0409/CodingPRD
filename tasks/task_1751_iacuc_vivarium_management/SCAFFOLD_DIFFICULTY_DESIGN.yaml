              as: AnimalCareStaff
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "CAP-2", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "F" }
              as: AnimalCareStaff
