    instances:
      - name: suspended_participant_citing_closed_session_returns_not_certified_not_session_error
        grounds:
          - validations.priority_12_ERR_PARTICIPANT_NOT_CERTIFIED
          - validations.priority_17_ERR_BREAK_GLASS_SESSION_NOT_OPEN
          - endpoints.POST_hie_record_locator_queries
        distinguishing_aspect: |
          Pairs category state (priority 12, ERR_PARTICIPANT_NOT_CERTIFIED) against category
          business_safety (priority 17, ERR_BREAK_GLASS_SESSION_NOT_OPEN) on
          POST /hie/record-locator-queries. Both conditions hold in the same request - the querying
          participant is SUSPENDED and the cited emergency session is CLOSED - and the response must
          carry the priority-12 error only. A control request from a CERTIFIED participant citing the
          same CLOSED session proves the priority-17 rule is live and was merely outranked.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE and an OPT_IN statewide policy is ACTIVE."
            - "Participant H is certified end-to-end, contributes one patient record (creating a single-member ACTIVE cluster) and never provisions a data feed."
            - "Clinician clin-h-1 opens an emergency session over that cluster and then closes it explicitly, so session_status == CLOSED."
            - "Participant H is then SUSPENDED by the HIE administrator."
            - "Participant J is certified end-to-end and stays CERTIFIED, to serve as the control caller."
          setup_api_calls:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.5", model: "OPT_IN", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "HIV", "SUBSTANCE_USE", "REPRODUCTIVE"], default_share_for_treatment: true, effective_from: "2026-01-01T00:00:00Z" }
