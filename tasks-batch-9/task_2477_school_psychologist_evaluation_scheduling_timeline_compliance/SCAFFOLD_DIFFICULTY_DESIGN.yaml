              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-G-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: IntakeCoordinator
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval1}", school_id: "${s1}", scheduled_start_at: "2026-09-20T15:00:00Z", scheduled_end_at: "2026-09-20T16:00:00Z", expected_evaluation_version: "${ver1}" }
              as: IntakeCoordinator
              captures: { m1: $.data.id }
            - call: "POST /psych-services/eligibility-meetings/${m1}/notice"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /psych-services/eligibility-meetings/${m1}/reschedule-request"
              payload: { scheduled_start_at: "2026-09-25T15:00:00Z", scheduled_end_at: "2026-09-25T16:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /psych-services/eligibility-meetings/${m1}/notice"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /psych-services/eligibility-meetings/${m1}/reschedule-request"
              payload: { scheduled_start_at: "2026-09-28T15:00:00Z", scheduled_end_at: "2026-09-28T16:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /psych-services/eligibility-meetings/${m1}/notice"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /psych-services/eligibility-meetings/${m1}/reschedule-request"
              payload: { scheduled_start_at: "2026-10-02T15:00:00Z", scheduled_end_at: "2026-10-02T16:00:00Z" }
              as: IntakeCoordinator
          assert:
            - "Immediately before the trigger EligibilityMeeting.${m1}.status == NOTICED, reschedule_count == 2, scheduled_start_at == \"2026-09-28T15:00:00Z\" and notice_lead_days == 58"
            - "The trigger returns HTTP 409 with error_id == ERR_RESCHEDULE_LIMIT_REACHED"
            - "EligibilityMeeting.${m1}.status is still NOTICED and reschedule_count is still 2 after the rejected trigger"
            - "EligibilityMeeting.${m1}.scheduled_start_at is still \"2026-09-28T15:00:00Z\" — the rejected reschedule did not move the interval"
            - "The row entered NOTICED three times in total, proving the cycle is re-traversable rather than a one-way pipeline"

  - rule_id: transitive_cascade
    instances:
      - name: psychologist_leave_cascade_depth_four
        grounds:
          - state_machines.Psychologist.ACTIVE_to_ON_LEAVE
          - state_machines.Evaluation.ASSIGNED_to_PENDING_ASSIGNMENT
          - state_machines.InterpreterSession.SCHEDULED_to_CANCELLED
          - calculations.psychologist_open_case_points
          - calculations.caseload_pressure_index
        distinguishing_aspect: |
          Trigger is an HR event on Psychologist (POST /psychologists/{id}/leave) and the chain is 4 levels:
          L1 Psychologist.status -> L2 Evaluation unassignment -> L3 InterpreterSession cancellation ->
          L4 caseload/pressure re-derivation. Levels 2-4 touch three different entities from the other
          instance's chain, and the cascade REMOVES work rather than restoring compliance.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; one ACTIVE SSP psychologist covering it."
            - "One INITIAL referral with 3 domains and interpreter_required = true (9 caseload points, primary_language es, bilingual_evaluation_required false) consented 2026-08-01T09:00:00Z and ASSIGNED to that psychologist."
            - "One SCHEDULED InterpreterSession for that evaluation on 2026-09-10T09:00:00Z-10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Cedar Park Elementary", building_code: "CP06", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 520 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Fay Nolan", employee_number: "E-1007", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-H", referral_type: "INITIAL", primary_language: "es", interpreter_required: true, bilingual_evaluation_required: false, requested_domains: ["COGNITIVE", "ACADEMIC", "ADAPTIVE"], intervention_team_summary: "tier 3, newcomer" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-H-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/interpreter-sessions"
              payload: { evaluation_id: "${eval1}", language_code: "es", interpreter_name: "M. Cruz", session_start_at: "2026-09-10T09:00:00Z", session_end_at: "2026-09-10T10:00:00Z" }
              as: IntakeCoordinator
              captures: { sess1: $.data.id }
          trigger:
            - call: "POST /psych-services/psychologists/${pa}/leave"
              payload: {}
              as: DistrictAdmin
          assert:
            - "Immediately before the trigger Psychologist.${pa}.open_case_points == 9 and Evaluation.${eval1}.caseload_points == 9"
            - "L1: Psychologist.${pa}.status == ON_LEAVE"
            - "L2: Evaluation.${eval1}.assessment_status == PENDING_ASSIGNMENT, psychologist_id == null and reassignment_count == 1"
            - "L3: InterpreterSession.${sess1}.status == CANCELLED with cancellation_reason == PSYCHOLOGIST_UNAVAILABLE"
            - "L4: Psychologist.${pa}.open_case_points == 0, caseload_status == BALANCED, pressure_index_assigned_basis == 0.00 and pressure_index_clock_weighted == 0.00"
            - "Evaluation.${eval1}.clock_start_date is still \"2026-08-01\" and base_due_date is still \"2026-09-30\" — the leave cascade never touches the statutory clock"

      - name: exclusion_approval_cascade_depth_five_vacates_remedy
        grounds:
          - state_machines.TimelineExclusion.CLAIMED_to_APPROVED
          - calculations.evaluation_timeline_clock
          - state_machines.Evaluation.BREACHED_to_ON_TRACK
          - state_machines.TimelineBreach.REMEDY_PROPOSED_to_VACATED
          - calculations.caseload_pressure_index
        distinguishing_aspect: |
          Trigger is a supervisor adjudication on TimelineExclusion (decision=APPROVE) and the chain is 5
          levels deep: L1 exclusion credit -> L2 timeline recomputation -> L3 compliance_status leaves
          BREACHED -> L4 TimelineBreach vacated with remedy_minutes_awarded reset to 0 -> L5 the assigned
          psychologist's clock-weighted pressure index drops. Unlike the leave cascade this one RESTORES
          compliance and unwinds an already-proposed remedy.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; one ACTIVE SSP psychologist; one INITIAL 1-domain referral (5 caseload points) consented 2026-08-01T09:00:00Z and ASSIGNED."
            - "Clock advanced to 2026-10-01T00:00:00Z and a compliance run has opened a TimelineBreach with breach_days = 1 (MINOR)."
            - "A remedy on BREACH_DAY_BASIS (30 minutes) has already been proposed, so the breach sits in REMEDY_PROPOSED."
            - "A BREAK_CLOSURE exclusion for 2026-08-10..2026-08-24 (15 days claimed, 14 creditable) is CLAIMED and awaiting decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Harbor View Middle", building_code: "HV07", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 640 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Gil Amato", employee_number: "E-1008", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-I", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["SOCIAL_EMOTIONAL"], intervention_team_summary: "tier 3 behaviour" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-I-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /psych-services/evaluations/${eval1}/timeline-breaches"
              payload: {}
              as: ComplianceOfficer
              captures: { breach_id: "$.data[0].id" }
            - call: "POST /psych-services/timeline-breaches/${breach_id}/propose-remedy"
              payload: { remedy_basis: "BREACH_DAY_BASIS", additional_minutes: 0, corrective_action_note: "One 30-minute make-up session" }
              as: ComplianceOfficer
            - call: "POST /psych-services/timeline-exclusions"
              payload: { evaluation_id: "${eval1}", exclusion_type: "BREAK_CLOSURE", start_date: "2026-08-10", end_date: "2026-08-24", claim_note: "District summer closure" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
              captures: { excl1: $.data.id }
          trigger:
            - call: "POST /psych-services/timeline-exclusions/${excl1}/decision"
              payload: { decision: "APPROVE" }
              as: PsychServicesSupervisor
          assert:
            - "Immediately before the trigger Evaluation.${eval1}.compliance_status == BREACHED, days_remaining == -1, TimelineBreach.${breach_id}.status == REMEDY_PROPOSED with breach_days == 1, severity == MINOR and remedy_minutes_awarded == 30, and Psychologist.${pa}.pressure_index_clock_weighted == 0.50"
            - "L1: TimelineExclusion.${excl1}.status == APPROVED, days_claimed == 15, days_credited == 14"
            - "L2: Evaluation.${eval1}.credited_exclusion_days == 14, statutory_due_date == \"2026-10-14\", elapsed_statutory_days == 47 and days_remaining == 13"
            - "L3: Evaluation.${eval1}.compliance_status == ON_TRACK (13 > AT_RISK_WINDOW_DAYS 10)"
            - "L4: TimelineBreach.${breach_id}.status == VACATED and remedy_minutes_awarded == 0, while remedy_basis remains BREACH_DAY_BASIS and breach_days stays frozen at 1"
            - "L5: Psychologist.${pa}.pressure_index_clock_weighted == 0.25 and pressure_index_assigned_basis == 0.25 (urgency weight fell from 2.0 to 1.0)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_p8_beats_building_mismatch_p14
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors.ERR_EVALUATION_STATE_INVALID
          - errors.ERR_PSYCH_BUILDING_MISMATCH
        distinguishing_aspect: |
          Error-category pair is state (priority 8, ERR_EVALUATION_STATE_INVALID, 409) versus
          business_referential (priority 14, ERR_PSYCH_BUILDING_MISMATCH, 422). Both conditions are true in
          the same request; the OCC check at priority 7 is deliberately satisfied with a freshly read version
          so it cannot mask the pair.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two buildings; psychologist A covers building 1 only, psychologist B covers building 2 only."
            - "An instrument with stock and a licence seat for A so A can start testing."
            - "One INITIAL 1-domain referral at building 1, consented, ASSIGNED to A, then driven to IN_TESTING."
            - "The Evaluation's current version is read immediately before the trigger so expected_evaluation_version is fresh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Maple Grove Elementary", building_code: "MG08", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 410 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/schools"
              payload: { name: "Pine Ridge Elementary", building_code: "PR09", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 430 }
              as: DistrictAdmin
              captures: { s2: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Hana Sato", employee_number: "E-1009", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s1}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Ivan Petrov", employee_number: "E-1010", credential_type: "SSP", languages_certified: ["en"], assigned_school_ids: ["${s2}"], weekly_capacity_points: 20 }
              as: DistrictAdmin
              captures: { pb: $.data.id }
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "WJ-IV", instrument_code: "WJ4", protocol_stock_count: 8, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1500, license_seat_total: 2, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/assessment-instruments/${inst}/license-seats"
              payload: { psychologist_id: "${pa}" }
              as: DistrictAdmin
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-J", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["ACADEMIC"], intervention_team_summary: "tier 3 maths" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-J-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/evaluations/${eval1}/testing-start"
              payload: { instrument_id: "${inst}" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver2: $.data.version }
          trigger:
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver2}", psychologist_id: "${pb}" }
              as: PsychServicesSupervisor
          assert:
            - "Both conditions hold at trigger time: Evaluation.${eval1}.assessment_status == IN_TESTING (assign only allows PENDING_ASSIGNMENT or ASSIGNED) AND Referral.${r1}.school_id == ${s1} is absent from Psychologist.${pb}.assigned_school_ids"
            - "The trigger returns HTTP 409 with error_id == ERR_EVALUATION_STATE_INVALID (priority 8 wins)"
            - "The response is NOT 422 / ERR_PSYCH_BUILDING_MISMATCH (priority 14 never runs)"
            - "Evaluation.${eval1}.psychologist_id is still ${pa}, assessment_status is still IN_TESTING, reassignment_count == 0 and version is unchanged from ${ver2}"
            - "Psychologist.${pb}.open_case_points == 0"

      - name: licensing_p12_beats_protocol_stock_p29
        grounds:
          - validations[priority=12]
          - validations[priority=29]
          - errors.ERR_SCORING_LICENSE_INVALID
          - errors.ERR_PROTOCOL_STOCK_INSUFFICIENT
        distinguishing_aspect: |
          A different error-category pair from the first instance: business_safety (priority 12,
          ERR_SCORING_LICENSE_INVALID, 422) versus business_fiscal (priority 29,
          ERR_PROTOCOL_STOCK_INSUFFICIENT, 409). Here the LOWER-numbered rule carries the 422 and the
          higher-numbered one the 409, the reverse arrangement of the state/referential pair, so an
          implementation that sorts by HTTP status instead of priority fails exactly one of the two.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; one ACTIVE SSP psychologist holding a seat on the instrument."
            - "The instrument's licence expired 2026-07-31 (license_status EXPIRED at the current clock) AND its protocol_stock_count is 0, so both priority 12 and priority 29 are violated by the same testing-start call."
