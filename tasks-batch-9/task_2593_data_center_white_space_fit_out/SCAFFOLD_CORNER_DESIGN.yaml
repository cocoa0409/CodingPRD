          trigger:
            - name: second_hall_with_same_code_rejected
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Clone Hall", code: "CX71", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 200.00, gross_area_sqm: 300.0, cooling_redundancy: "N", planned_rack_count: 4 }
