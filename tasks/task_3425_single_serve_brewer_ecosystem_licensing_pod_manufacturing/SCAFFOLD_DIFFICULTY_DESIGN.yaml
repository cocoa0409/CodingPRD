# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3425_single_serve_brewer_ecosystem_licensing_pod_manufacturing
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2+ instances per §0.5 rule.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_divergence
        grounds:
          - calculations.royalty_accrual
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - entities.RoyaltyStatement.fields.provisional_royalty_cents
          - entities.RoyaltyStatement.fields.final_royalty_cents
        distinguishing_aspect: |
          Fiscal domain (RoyaltyStatement): identical period data yields provisional 930000
          cents (sell_in 1200000, brackets from position 0, no multipliers) vs final 772800
          cents (sell_through 1100000, then the exclusive 8% discount) — the two variants
          disagree on both the unit basis AND the multiplier set.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Licensed brand with an ACTIVE exclusive agreement (tiers 750/900/1100 millicents at 1M/5M brackets, min cup 80). One PASS audit with defect_rate_ppm 50 (no penalty band). Statement 2026-08: sell_in 1200000, sell_through 1100000, unlicensed_share 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Lakeside Coffee", kind: "LICENSED", home_region: "US-W" }
              as: PlatformAdmin
              captures: { dv1_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${dv1_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: 1000000, millicents_per_pod: 750}, {up_to_units: 5000000, millicents_per_pod: 900}, {up_to_units: null, millicents_per_pod: 1100}], quality_min_cup_score: 80, exclusive: true }
              as: LicensingManager
              captures: { dv1_ag: $.data.id }
            - call: "POST /license-agreements/${dv1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${dv1_ag}/quality-audits"
              payload: { audited_at: "2026-06-15T00:00:00Z", cup_score: 90, defect_rate_ppm: 50 }
              as: QualityAuditor
            - call: "POST /license-agreements/${dv1_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 1200000, sell_through_units: 1100000, unlicensed_share_pct: 10 }
              as: FinanceAnalyst
              captures: { dv1_st: $.data.id, dv1_prov: $.data.provisional_royalty_cents }
          trigger:
            - call: "POST /royalty-statements/${dv1_st}/transition"
              payload: { target_state: "ISSUED" }
              as: FinanceAnalyst
              captures: { dv1_final: $.data.final_royalty_cents }
          assert:
            - "RoyaltyStatement.${dv1_st}.provisional_royalty_cents == 930000 (1200000 sell-in units: 1000000*750/1000 + 200000*900/1000, no multipliers)"
            - "RoyaltyStatement.${dv1_st}.final_royalty_cents == 772800 (1100000 sell-through: base 840000, then exclusive discount *0.92; audit defects 50 <= 200 so no penalty; unlicensed 10 < 15 so no discount)"
            - "provisional_royalty_cents != final_royalty_cents for the same period row"

      - name: household_forward_vs_trailing_divergence
        grounds:
          - calculations.household_consumption_model
          - entities.Household.fields.expected_monthly_pods
          - entities.Household.fields.trailing_avg_pods
        distinguishing_aspect: |
          Demand domain (Household, a different entity domain from RoyaltyStatement): the
          forward-looking model yields 120.00 (size 4 * 30 * engagement 1.0 * descale 1.0 *
          warranty 1.0) while the chronological trailing variant yields 185.00
          ((3*240+2*150+1*90)/6) for the same household at the same instant.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Household size 4 with one ACTIVE in-warranty brewer (no brews recorded). ConsumptionRecords 2026-06=90, 2026-07=150, 2026-08=240."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { region: "NW", size: 4 }
              as: PlatformAdmin
              captures: { dv2_hh: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-MINI", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 8000, unit_cost_cents: 9000 }
              as: PlatformAdmin
              captures: { dv2_model: $.data.id }
            - call: "POST /households/${dv2_hh}/brewers"
              payload: { model_id: "${dv2_model}", serial_number: "SN-DV2-1" }
              as: PlatformAdmin
            - call: "POST /households/${dv2_hh}/consumption-records"
              payload: { period: "2026-06", pods_brewed: 90 }
              as: PlatformAdmin
            - call: "POST /households/${dv2_hh}/consumption-records"
              payload: { period: "2026-07", pods_brewed: 150 }
              as: PlatformAdmin
            - call: "POST /households/${dv2_hh}/consumption-records"
              payload: { period: "2026-08", pods_brewed: 240 }
              as: PlatformAdmin
          trigger:
            - call: "GET /households/${dv2_hh}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Household.${dv2_hh}.engagement == ENGAGED and installed_brewers == 1"
            - "Household.${dv2_hh}.trailing_avg_pods == 185.00 (chronological 3/2/1 weights)"
            - "Household.${dv2_hh}.expected_monthly_pods == 120.00 (forward model)"
            - "trailing_avg_pods != expected_monthly_pods for the same household"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_multiplier_stacking
        grounds:
          - calculations.royalty_accrual
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: marginal tier selection AND
          two conditional multiplier branches (quality penalty from latest audit defect band,
          unlicensed-share discount at >= 15%) applied in the pinned order, each step
          re-rounded: base 450000 -> 495000 (penalty) -> 470250 (unlicensed).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Non-exclusive agreement (same tiers, min cup 80). Latest audit PASSes (cup 90) but with defect_rate_ppm 300 (> DEFECT_SOFT_MAX_PPM 200) so the 10% penalty applies without suspending. Statement 2026-08: sell_in 500000, sell_through 600000, unlicensed_share 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Harbor Roast Co", kind: "LICENSED", home_region: "US-E" }
              as: PlatformAdmin
              captures: { cf1_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${cf1_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: 1000000, millicents_per_pod: 750}, {up_to_units: 5000000, millicents_per_pod: 900}, {up_to_units: null, millicents_per_pod: 1100}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { cf1_ag: $.data.id }
            - call: "POST /license-agreements/${cf1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${cf1_ag}/quality-audits"
              payload: { audited_at: "2026-07-01T00:00:00Z", cup_score: 90, defect_rate_ppm: 300 }
              as: QualityAuditor
            - call: "POST /license-agreements/${cf1_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 500000, sell_through_units: 600000, unlicensed_share_pct: 20 }
              as: FinanceAnalyst
              captures: { cf1_st: $.data.id, cf1_prov: $.data.provisional_royalty_cents }
          trigger:
            - call: "POST /royalty-statements/${cf1_st}/transition"
              payload: { target_state: "ISSUED" }
              as: FinanceAnalyst
              captures: { cf1_final: $.data.final_royalty_cents }
          assert:
            - "RoyaltyStatement.${cf1_st}.provisional_royalty_cents == 375000 (500000 * 750/1000, provisional ignores multipliers)"
            - "RoyaltyStatement.${cf1_st}.final_royalty_cents == 470250 (base 450000; exclusive skipped; *1.10 penalty -> 495000; *0.95 unlicensed -> 470250)"
            - "the audit still has result PASS (defects 300 <= DEFECT_HARD_MAX_PPM 500), so the agreement remains ACTIVE"

      - name: assortment_per_slot_rounding_order
        grounds:
          - calculations.assortment_productivity
          - calculations.variety_velocity
          - state_machines.AssortmentPlan.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: per-slot round_half_up then sum
          yields 70001 (52501 + 17500); summing raw fractions first would yield 70002.
          The scaffold pins per-slot-first and the floor 70000 is cleared by exactly 1 cent.
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-12T00:00:00Z. Two ACTIVE owned varieties V1/V2, margin 35 each, each with one COMPLETED run of 45001 actual units (window_end 2026-09-11T00:00:00Z inside the trailing 90d window), so velocity_units_90d == 45001 each. Account floor 70000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Platform Roasters", kind: "PLATFORM_OWNED", home_region: "US-W" }
              as: PlatformAdmin
              captures: { cf2_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${cf2_brand}", name: "House Medium", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 120, margin_cents: 35 }
              as: BrandManager
              as_user_id: "${cf2_brand}"
              captures: { cf2_v1: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${cf2_brand}", name: "Dark Reserve", roast_level: "DARK", flavor_family: "FLAVORED", wholesale_price_cents: 130, margin_cents: 35 }
              as: BrandManager
              as_user_id: "${cf2_brand}"
              captures: { cf2_v2: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Reno Plant", kind: "OWNED", region: "US-W" }
              as: OperationsDirector
              captures: { cf2_fac: $.data.id }
            - call: "POST /facilities/${cf2_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { cf2_l1: $.data.id }
            - call: "POST /facilities/${cf2_fac}/filling-lines"
              payload: { line_code: "L2", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { cf2_l2: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${cf2_l1}", variety_id: "${cf2_v1}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 45001 }
              as: ProductionPlanner
              captures: { cf2_r1: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${cf2_l2}", variety_id: "${cf2_v2}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 45001 }
              as: ProductionPlanner
              captures: { cf2_r2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-runs/${cf2_r1}/transition"
              payload: { target_state: "IN_PROGRESS" }
              as: ProductionPlanner
            - call: "POST /production-runs/${cf2_r1}/transition"
              payload: { target_state: "COMPLETED", actual_units: 45001 }
              as: ProductionPlanner
            - call: "POST /production-runs/${cf2_r2}/transition"
              payload: { target_state: "IN_PROGRESS" }
              as: ProductionPlanner
            - call: "POST /production-runs/${cf2_r2}/transition"
              payload: { target_state: "COMPLETED", actual_units: 45001 }
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-accounts"
              payload: { name: "BigBox National", region: "US", shelf_slots_total: 100, productivity_floor_cents: 70000 }
              as: CategoryManager
              captures: { cf2_acct: $.data.id, cf2_acct_v: $.data.version }
            - call: "POST /retail-accounts/${cf2_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${cf2_acct_v}", period: "2026-10", slots: [{variety_id: "${cf2_v1}", facings: 3, clearance_flag: false}, {variety_id: "${cf2_v2}", facings: 1, clearance_flag: false}] }
              as: CategoryManager
              captures: { cf2_plan: $.data.id }
            - call: "POST /assortment-plans/${cf2_plan}/transition"
              payload: { target_state: "PROPOSED" }
              as: CategoryManager
          trigger:
            - call: "POST /assortment-plans/${cf2_plan}/transition"
              payload: { target_state: "APPROVED" }
              as: CategoryManager
              captures: { cf2_prod: $.data.productivity_cents }
          assert:
            - "AssortmentPlan.${cf2_plan}.status == APPROVED"
            - "AssortmentPlan.${cf2_plan}.productivity_cents == 70001 (per-slot rounding: round(3*45001*35/90)=52501 plus round(1*45001*35/90)=17500)"
            - "70001 >= productivity_floor_cents 70000 by exactly one cent; the sum-then-round alternative 70002 is NOT the contract"

      - name: subsidy_snapshot_evaluation_order
        grounds:
          - calculations.brewer_subsidy_snapshot
          - entities.BrewerModel.fields.subsidy_cents
          - entities.BrewerModel.fields.margin_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: subsidy is
          snapshotted from the CURRENT installed base at model creation (15 cents per
          installed brewer), never recomputed; model A created at base 0 keeps subsidy 0
          while model B created after 2 brewers exist gets subsidy 30 — proving the snapshot
          (not live evaluation) semantics.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Model A created while the global installed base is 0. Then a household with 2 ACTIVE brewers. Model B created afterwards with identical price/cost."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewer-models"
              payload: { model_code: "K-ALPHA", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 8000, unit_cost_cents: 9000 }
              as: PlatformAdmin
              captures: { cf3_model_a: $.data.id, cf3_sub_a: $.data.subsidy_cents, cf3_margin_a: $.data.margin_cents }
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { cf3_hh: $.data.id }
            - call: "POST /households/${cf3_hh}/brewers"
              payload: { model_id: "${cf3_model_a}", serial_number: "SN-CF3-1" }
              as: PlatformAdmin
            - call: "POST /households/${cf3_hh}/brewers"
              payload: { model_id: "${cf3_model_a}", serial_number: "SN-CF3-2" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brewer-models"
              payload: { model_code: "K-BETA", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 8000, unit_cost_cents: 9000 }
              as: PlatformAdmin
              captures: { cf3_model_b: $.data.id, cf3_sub_b: $.data.subsidy_cents, cf3_margin_b: $.data.margin_cents }
          assert:
            - "BrewerModel.${cf3_model_a}.subsidy_cents == 0 (installed base was 0 at creation)"
            - "BrewerModel.${cf3_model_b}.subsidy_cents == 30 (2 installed brewers * 15 cents recoverable each)"
            - "BrewerModel.${cf3_model_b}.margin_cents == -1030 (8000 - 9000 - 30)"
            - "BrewerModel.${cf3_model_a}.subsidy_cents remains 0 after the base grew — no retroactive recomputation"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: license_suspend_reinstate_cycle
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.LicenseAgreement.SUSPENDED_to_ACTIVE
          - state_machines.PodVariety.ACTIVE_to_SUPPLY_BLOCKED
        distinguishing_aspect: |
          Cyclic shape on LicenseAgreement: ACTIVE -> SUSPENDED -> ACTIVE returns to the
          origin state, with the SUPPLY_BLOCKED side effect on PodVariety applied and then
          unwound by the cycle — a linear pipeline cannot express this.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Licensed brand, ACTIVE agreement, one ACTIVE variety of that brand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Cycle Beans", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { nl1_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${nl1_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { nl1_ag: $.data.id }
            - call: "POST /license-agreements/${nl1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /pod-varieties"
              payload: { brand_id: "${nl1_brand}", name: "Cycle House Blend", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 110, margin_cents: 30 }
              as: BrandManager
              as_user_id: "${nl1_brand}"
              captures: { nl1_var: $.data.id }
          trigger:
            - call: "POST /license-agreements/${nl1_ag}/transition"
              payload: { target_state: "SUSPENDED" }
              as: LicensingManager
            - call: "POST /license-agreements/${nl1_ag}/quality-audits"
              payload: { audited_at: "2026-09-01T00:00:00Z", cup_score: 91, defect_rate_ppm: 50 }
              as: QualityAuditor
            - call: "POST /license-agreements/${nl1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
          assert:
            - "after SUSPENDED: LicenseAgreement.${nl1_ag}.status == SUSPENDED and PodVariety.${nl1_var}.status == SUPPLY_BLOCKED"
            - "the PASS audit is creatable while SUSPENDED (remediation path)"
            - "after reinstatement: LicenseAgreement.${nl1_ag}.status == ACTIVE and PodVariety.${nl1_var}.status == ACTIVE — full cycle back to origin"

      - name: brewer_independent_dimensions
        grounds:
          - state_machines.Brewer
          - calculations.descale_and_dormancy_clock
          - entities.Brewer.fields.warranty_status
          - entities.Brewer.fields.operational
        distinguishing_aspect: |
          Independent state dimensions on Brewer: warranty expires on the calendar while
          operational stays ACTIVE, dormancy flips on idle days while warranty stays
          EXPIRED, and a brew on the dormant brewer reactivates operational without
          touching warranty — the two dimensions evolve orthogonally on one row.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Owned brand with ACTIVE variety. Model warranty_months=1, descale 200. Household with one brewer registered 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Platform Basics", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { nl2_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${nl2_brand}", name: "Morning Cup", roast_level: "LIGHT", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 25 }
              as: BrandManager
              as_user_id: "${nl2_brand}"
              captures: { nl2_var: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-SHORT", firmware_compat: "OPEN", warranty_months: 1, descale_interval_brews: 200, msrp_cents: 5000, unit_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { nl2_model: $.data.id }
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { nl2_hh: $.data.id }
            - call: "POST /households/${nl2_hh}/brewers"
              payload: { model_id: "${nl2_model}", serial_number: "SN-NL2-1" }
              as: PlatformAdmin
              captures: { nl2_br: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /brewers/${nl2_br}"
              payload: {}
              as: PlatformAdmin
              captures: { nl2_w_oct: $.data.warranty_status, nl2_o_oct: $.data.operational }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /brewers/${nl2_br}"
              payload: {}
              as: PlatformAdmin
              captures: { nl2_o_late: $.data.operational }
            - call: "POST /brewers/${nl2_br}/record-brews"
              payload: { brews: 5, variety_id: "${nl2_var}" }
              as: PlatformAdmin
              captures: { nl2_o_final: $.data.operational, nl2_w_final: $.data.warranty_status }
          assert:
            - "at 2026-10-01 (exactly registered_at + 1 month): warranty_status == EXPIRED while operational == ACTIVE (idle only 30 days)"
            - "at 2026-10-31 (exactly DORMANCY_DAYS 60 after registration): operational == DORMANT while warranty_status stays EXPIRED"
            - "after record-brews: operational == ACTIVE again but warranty_status remains EXPIRED — reactivation does not revive warranty"

      - name: statement_dispute_reissue_cycle
        grounds:
          - state_machines.RoyaltyStatement.ISSUED_to_DISPUTED
          - state_machines.RoyaltyStatement.DISPUTED_to_ISSUED
          - state_machines.RoyaltyStatement.ISSUED_to_SETTLED
        distinguishing_aspect: |
          Branching cycle on RoyaltyStatement: ISSUED -> DISPUTED -> ISSUED -> SETTLED —
          the re-issue recomputes the final royalty from corrected units (75000 -> 90000)
          while dispute_count accumulates, then the branch converges to SETTLED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. ACTIVE non-exclusive agreement with tiers 750/900/1100 millicents at 1M/5M; PASS audit defects 50; statement 2026-08 sell_in 100000 sell_through 100000 unlicensed 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
