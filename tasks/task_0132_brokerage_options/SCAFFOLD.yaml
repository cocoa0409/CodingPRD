scenario: |
  Brokerage Account & Options Approval: account opening with KYC (Know Your Customer)
  and W-9 tax form collection, Options trading approval Level 1 (covered calls/cash-secured
  puts) through Level 4 (uncovered/naked options) based on experience and net worth,
  margin account requirements under Reg T (Regulation T 50% initial margin) or PMA
  (Portfolio Margin Account for sophisticated investors), order types (limit, stop,
  stop-limit, take-profit, market), Pattern Day Trader rule (4+ day trades in 5
  business days flags as PDT requiring $25K equity minimum), ACAT (Automated Customer
  Account Transfer) transfer between brokerages with 6-business-day standard timeline.

domain_name: "brokerage-options"
api_prefix: "/brokerage"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation       # Reg T vs PMA margin requirement on same position
    - rate_threshold_triggers        # PDT 4-trades/5-days, $25K equity floor, 50% margin
    - cascading_side_effects         # PDT flag → trading posture freeze → cancels open orders
    - scheduled_deferred_actions     # ACAT 6-business-day settlement clock

  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many                    # Account → Orders, Account → DayTrades
    - cross_aggregate                # ACATTransfer references two Accounts
    - self_referential               # ACATTransfer.source_account_id / destination_account_id same entity
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal full name supplied at registration"
        constraints: "1..120 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD ISO date"
        constraints: "Must produce age >= 18 at account-open time"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of US SSN; collected for KYC/W-9"
        constraints: "Exactly 4 digits; immutable after first set"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Self-reported annual income in USD cents"
        constraints: ">= 0"
      - name: liquid_net_worth_cents
        type: integer
        source: input
        description: "Self-reported liquid net worth in USD cents"
        constraints: ">= 0"
      - name: total_net_worth_cents
        type: integer
        source: input
        description: "Self-reported total net worth in USD cents"
        constraints: ">= liquid_net_worth_cents"
      - name: years_options_experience
        type: integer
        source: input
        description: "Self-reported years of options-trading experience"
        constraints: ">= 0"
      - name: kyc_status
        type: enum
        source: computed
        description: "Aggregate KYC posture"
        default: NOT_STARTED
        constraints: "NOT_STARTED | PENDING | VERIFIED | REJECTED"
      - name: w9_collected
        type: boolean
        source: computed
        description: "True when a W-9 form has been submitted and accepted"
        default: false

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "Owning customer"
      - name: account_type
        type: enum
        source: input
        description: "CASH | MARGIN_REG_T | MARGIN_PMA"
        constraints: "CASH | MARGIN_REG_T | MARGIN_PMA"
      - name: status
        type: enum
        source: computed
        description: "Account lifecycle state"
        default: PENDING_KYC
        constraints: "PENDING_KYC | KYC_REVIEW | APPROVED | REJECTED | CLOSED"
      - name: trading_posture
        type: enum
        source: computed
        description: "Derived posture gating trade endpoints"
        default: RESTRICTED
        constraints: "RESTRICTED | OPEN | PDT_FROZEN | TRANSFER_LOCKED"
      - name: options_level
        type: integer
        source: computed
        description: "Approved options level 0 (none) through 4 (uncovered)"
        default: 0
        constraints: "0..4"
      - name: cash_balance_cents
        type: integer
        source: computed
        description: "Settled cash in USD cents"
        default: 0
      - name: equity_value_cents
        type: integer
        source: computed
        description: "Cash + market value of long positions in USD cents"
        default: 0
      - name: pdt_flag
        type: boolean
        source: computed
        description: "True once Pattern Day Trader rule trips"
        default: false
      - name: pdt_flagged_at
        type: datetime
        source: computed
        description: "Timestamp PDT flag was raised (null if never flagged)"
        default: null

  - name: KYCSubmission
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "Owning customer"
      - name: government_id_type
        type: enum
        source: input
        description: "PASSPORT | DRIVERS_LICENSE | STATE_ID"
        constraints: "PASSPORT | DRIVERS_LICENSE | STATE_ID"
      - name: government_id_number
        type: string
        source: input
        description: "Document number, alphanumeric"
        constraints: "1..40 chars"
      - name: address_line1
        type: string
        source: input
        description: "Residential street address"
      - name: address_country
        type: string
        source: input
        description: "ISO-3166 alpha-2 country code"
        constraints: "Exactly 2 uppercase letters; must equal 'US' to pass KYC"
      - name: w9_signed_name
        type: string
        source: input
        description: "Signed name on W-9 (must match Customer.legal_name exactly, case-insensitive)"
      - name: status
        type: enum
        source: computed
        description: "KYC submission status"
        default: PENDING
        constraints: "PENDING | VERIFIED | REJECTED"
      - name: rejection_reason
        type: string
        source: computed
        description: "Populated when status=REJECTED"
        default: null

  - name: OptionsApproval
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "Target account"
      - name: requested_level
        type: integer
        source: input
        description: "1..4 — desired options level"
        constraints: "1..4"
      - name: status
        type: enum
        source: computed
        description: "Approval workflow state"
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | REVISION_REQUESTED"
      - name: approved_level
        type: integer
        source: computed
        description: "Level granted (may be lower than requested)"
        default: null
        constraints: "0..4 once decided"
      - name: review_notes
        type: string
        source: input
        description: "Compliance officer's notes; required when REJECTED or REVISION_REQUESTED"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the approval has cycled REVISION_REQUESTED → SUBMITTED"
        default: 0

  - name: Order
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "Owning account"
      - name: symbol
        type: string
        source: input
        description: "Ticker, uppercase A-Z 1..5 chars"
        constraints: "Pattern ^[A-Z]{1,5}$"
      - name: instrument_type
        type: enum
        source: input
        description: "EQUITY | OPTION"
        constraints: "EQUITY | OPTION"
      - name: option_strategy
        type: enum
        source: input
        description: "Required when instrument_type=OPTION; null otherwise"
        default: null
        constraints: "COVERED_CALL | CASH_SECURED_PUT | LONG_CALL | LONG_PUT | SPREAD | NAKED_CALL | NAKED_PUT"
      - name: side
        type: enum
        source: input
        description: "BUY | SELL"
        constraints: "BUY | SELL"
      - name: order_type
        type: enum
        source: input
        description: "MARKET | LIMIT | STOP | STOP_LIMIT | TAKE_PROFIT"
        constraints: "MARKET | LIMIT | STOP | STOP_LIMIT | TAKE_PROFIT"
      - name: quantity
        type: integer
        source: input
        description: "Number of shares or contracts"
        constraints: ">= 1"
      - name: limit_price_cents
        type: integer
        source: input
        description: "Required for LIMIT, STOP_LIMIT, TAKE_PROFIT"
        default: null
      - name: stop_price_cents
        type: integer
        source: input
        description: "Required for STOP, STOP_LIMIT"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle"
        default: ACCEPTED
        constraints: "ACCEPTED | WORKING | FILLED | CANCELLED | REJECTED"
      - name: fill_price_cents
        type: integer
        source: computed
        description: "Average fill price when status=FILLED"
        default: null
      - name: filled_at
        type: datetime
        source: computed
        description: "Timestamp of fill"
        default: null
      - name: opened_for_day_trade
        type: boolean
        source: computed
        description: "True if this BUY filled and a matching SELL filled same trading day"
        default: false
      - name: margin_requirement_cents
        type: integer
        source: computed
        description: "Initial margin required for this order at submission time (Reg T or PMA)"
        default: 0

  - name: DayTrade
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "Owning account"
      - name: symbol
        type: string
        source: input
        description: "Ticker that round-tripped"
      - name: opening_order_id
        type: string
        source: input
        description: "Order that opened the position"
      - name: closing_order_id
        type: string
        source: input
        description: "Order that closed the position same trading day"
      - name: trade_date
        type: string
        source: input
        description: "Trading day (YYYY-MM-DD UTC) — both fills occurred on this date"

  - name: ACATTransfer
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "Internal account participating in transfer"
      - name: direction
        type: enum
        source: input
        description: "INBOUND (assets arriving) or OUTBOUND (assets leaving)"
        constraints: "INBOUND | OUTBOUND"
      - name: counterparty_brokerage
        type: string
        source: input
        description: "Name of the other brokerage"
      - name: counterparty_account_number
        type: string
        source: input
        description: "Account number at the other brokerage"
      - name: requested_value_cents
        type: integer
        source: input
        description: "Estimated total value of assets being transferred, USD cents"
        constraints: ">= 100"
      - name: status
        type: enum
        source: computed
        description: "Transfer pipeline status"
        default: INITIATED
        constraints: "INITIATED | VALIDATED | IN_TRANSIT | COMPLETED | REJECTED | CANCELLED"
      - name: initiated_at
        type: datetime
        source: computed
        description: "Server time when transfer was created"
      - name: expected_completion_at
        type: datetime
        source: computed
        description: "initiated_at + 6 business days at 17:00 UTC"
      - name: completed_at
        type: datetime
        source: computed
        description: "Timestamp transfer reached COMPLETED"
        default: null
      - name: business_days_elapsed
        type: integer
        source: computed
        description: "Business days elapsed from initiated_at to now (clock-driven)"
        default: 0

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Account
    initial_state: PENDING_KYC
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: PENDING_KYC
        to: KYC_REVIEW
        trigger: "POST /brokerage/customers/{customer_id}/kyc — submit KYC + W-9"
        actor: Customer
        preconditions:
          - "Customer.kyc_status == NOT_STARTED OR KYCSubmission for customer has status=REJECTED"
          - "KYCSubmission.w9_signed_name equals Customer.legal_name (case-insensitive)"
        side_effects:
          - "KYCSubmission row created with status=PENDING"
          - "Customer.kyc_status := PENDING"

      - from: KYC_REVIEW
        to: APPROVED
        trigger: "POST /brokerage/customers/{customer_id}/kyc/decision body={decision:'VERIFY'}"
        actor: ComplianceOfficer
        preconditions:
          - "Latest KYCSubmission.status == PENDING"
          - "KYCSubmission.address_country == 'US'"
        side_effects:
          - "KYCSubmission.status := VERIFIED"
          - "Customer.kyc_status := VERIFIED"
          - "Customer.w9_collected := true"
          - "Account.status := APPROVED"
          - "Account.trading_posture := OPEN"

      - from: KYC_REVIEW
        to: PENDING_KYC
        trigger: "POST /brokerage/customers/{customer_id}/kyc/decision body={decision:'REJECT'}"
        actor: ComplianceOfficer
        preconditions:
          - "Latest KYCSubmission.status == PENDING"
        side_effects:
          - "KYCSubmission.status := REJECTED"
          - "Customer.kyc_status := REJECTED"
          - "Account reverts to PENDING_KYC so customer may resubmit"
        note: "Cyclic transition supports revision loop until verified or closure"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /brokerage/accounts/{id}/close"
        actor: Customer
        preconditions:
          - "No Order.status IN {ACCEPTED, WORKING}"
          - "No ACATTransfer.status IN {INITIATED, VALIDATED, IN_TRANSIT} for this account"
          - "Account.cash_balance_cents == 0 AND Account.equity_value_cents == 0"
        side_effects:
          - "Account.trading_posture := RESTRICTED"

  - entity: Account
    initial_state: RESTRICTED
    terminal_states: []
    transitions:
      - from: RESTRICTED
        to: OPEN
        trigger: "SYSTEM — KYC verified transition above"
        actor: system
        preconditions:
          - "Account.status == APPROVED"
        side_effects: []

      - from: OPEN
        to: PDT_FROZEN
        trigger: "SYSTEM — fourth same-account DayTrade row created within rolling 5 business days while equity_value_cents < 2_500_000"
        actor: system
        preconditions:
          - "count(DayTrade where account_id=X AND trade_date within last 5 business days) >= 4"
          - "Account.equity_value_cents < 2_500_000  (PDT_EQUITY_FLOOR_CENTS)"
        side_effects:
          - "Account.pdt_flag := true"
          - "Account.pdt_flagged_at := now()"
          - "All Order rows for this account with status IN {ACCEPTED, WORKING} → CANCELLED (cascade)"
          - "All OptionsApproval rows for this account with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} → REJECTED with reason='PDT_FREEZE'"
        note: "Cascade depth 3 — DayTrade insert → Account posture → Order cancel → OptionsApproval reject"

      - from: PDT_FROZEN
        to: OPEN
        trigger: "POST /brokerage/accounts/{id}/pdt/reset (after deposit raising equity)"
        actor: Customer
        preconditions:
          - "Account.equity_value_cents >= 2_500_000"
        side_effects:
          - "Account.pdt_flag := false (flag cleared once equity restored)"

      - from: OPEN
        to: TRANSFER_LOCKED
        trigger: "SYSTEM — ACATTransfer for this account with direction=OUTBOUND moves to VALIDATED"
        actor: system
        preconditions:
          - "ACATTransfer.status == VALIDATED AND direction == OUTBOUND"
        side_effects:
          - "All Order rows with status IN {ACCEPTED, WORKING} → CANCELLED"
          - "POST /brokerage/orders disabled for this account while locked"

      - from: TRANSFER_LOCKED
        to: OPEN
        trigger: "SYSTEM — outbound ACATTransfer reaches terminal state (COMPLETED, REJECTED, or CANCELLED)"
        actor: system
        preconditions:
          - "No ACATTransfer with status IN {VALIDATED, IN_TRANSIT} exists for account with direction=OUTBOUND"
        side_effects: []

  - entity: OptionsApproval
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /brokerage/options-approvals/{id}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == APPROVED"
          - "Customer.kyc_status == VERIFIED"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /brokerage/options-approvals/{id}/decide body={decision:'APPROVE', approved_level:L}"
        actor: ComplianceOfficer
        preconditions:
          - "approved_level <= eligibility_max for the customer (see calc options_eligibility_max)"
          - "approved_level >= 1"
        side_effects:
          - "OptionsApproval.approved_level := L"
          - "Account.options_level := max(Account.options_level, L)"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /brokerage/options-approvals/{id}/decide body={decision:'REQUEST_REVISION', notes:'...'}"
        actor: ComplianceOfficer
        preconditions:
          - "review_notes non-empty"
          - "revision_count < 3"
        side_effects:
          - "OptionsApproval.review_notes := notes"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "PATCH /brokerage/options-approvals/{id} (customer updates supporting data)"
        actor: Customer
        preconditions: []
        side_effects:
          - "OptionsApproval.revision_count := revision_count + 1"
        note: "Cyclic revision loop, bounded by revision_count<3"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /brokerage/options-approvals/{id}/decide body={decision:'REJECT', notes:'...'}"
        actor: ComplianceOfficer
        preconditions:
          - "review_notes non-empty"
        side_effects: []

  - entity: Order
    initial_state: ACCEPTED
    terminal_states: [FILLED, CANCELLED, REJECTED]
    transitions:
      - from: ACCEPTED
        to: WORKING
        trigger: "SYSTEM — order routed to market (auto-applied immediately after creation for non-MARKET orders)"
        actor: system
        preconditions:
          - "order_type IN {LIMIT, STOP, STOP_LIMIT, TAKE_PROFIT}"
        side_effects: []

      - from: ACCEPTED
        to: FILLED
        trigger: "SYSTEM — MARKET order fills immediately at submitted reference price"
        actor: system
        preconditions:
          - "order_type == MARKET"
        side_effects:
          - "Order.fill_price_cents := submitted reference price"
          - "Order.filled_at := now()"
          - "Account.cash_balance_cents adjusted by side*quantity*fill_price_cents"
          - "If matching same-day opposite-side fill exists for symbol → DayTrade row inserted (see day_trade_pairing calc)"

      - from: WORKING
        to: FILLED
        trigger: "POST /brokerage/orders/{id}/fill body={execution_price_cents:N} (operator simulation)"
        actor: PlatformAdmin
        preconditions:
          - "Order.status == WORKING"
          - "Execution price respects LIMIT/STOP semantics (see validation P=24)"
        side_effects:
          - "Order.fill_price_cents := N"
          - "Order.filled_at := now()"
          - "Account.cash_balance_cents adjusted"
          - "If matching same-day opposite-side fill exists for symbol → DayTrade row inserted"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "DELETE /brokerage/orders/{id}"
        actor: Customer
        preconditions: []
        side_effects: []

      - from: WORKING
        to: CANCELLED
        trigger: "DELETE /brokerage/orders/{id} OR system cascade from PDT_FROZEN / TRANSFER_LOCKED"
        actor: Customer | system
        preconditions: []
        side_effects: []

  - entity: ACATTransfer
    initial_state: INITIATED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: INITIATED
        to: VALIDATED
        trigger: "POST /brokerage/acat-transfers/{id}/validate"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == APPROVED"
          - "Customer.kyc_status == VERIFIED"
          - "If direction==OUTBOUND: no Order.status IN {ACCEPTED, WORKING}"
        side_effects:
          - "ACATTransfer.expected_completion_at := initiated_at + 6 business days at 17:00 UTC (see calc acat_completion_eta)"
          - "If direction==OUTBOUND: Account.trading_posture := TRANSFER_LOCKED (cascade)"

      - from: VALIDATED
        to: IN_TRANSIT
        trigger: "SYSTEM — POST /brokerage/_clock/advance crosses initiated_at + 1 business day"
        actor: system
        preconditions:
          - "business_days_elapsed >= 1"
        side_effects: []

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "SYSTEM — clock crosses expected_completion_at"
        actor: system
        preconditions:
          - "now() >= ACATTransfer.expected_completion_at"
        side_effects:
          - "ACATTransfer.completed_at := now()"
          - "If direction==INBOUND: Account.cash_balance_cents += requested_value_cents AND Account.equity_value_cents += requested_value_cents"
          - "If direction==OUTBOUND: Account.cash_balance_cents -= requested_value_cents AND Account.equity_value_cents -= requested_value_cents (cascade to posture re-evaluation)"
          - "If direction==OUTBOUND and Account.trading_posture == TRANSFER_LOCKED → revert to OPEN (cascade)"

      - from: INITIATED
        to: REJECTED
        trigger: "POST /brokerage/acat-transfers/{id}/reject body={reason:'...'}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: INITIATED
        to: CANCELLED
        trigger: "DELETE /brokerage/acat-transfers/{id}"
        actor: Customer
        preconditions: []
        side_effects: []

      - from: VALIDATED
        to: CANCELLED
        trigger: "DELETE /brokerage/acat-transfers/{id}"
        actor: Customer
        preconditions: []
        side_effects:
          - "If direction==OUTBOUND: Account.trading_posture := OPEN (revert TRANSFER_LOCKED)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Customer and ComplianceOfficer simultaneously act on same OptionsApproval"
    guarantee: "At most one decision is recorded; second request fails because status no longer matches"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on OptionsApproval.status"

  - scenario: "Two ACATTransfer outbound submissions for the same account simultaneously"
    guarantee: "At most one OUTBOUND ACATTransfer per account in non-terminal status"
    error_id: ERR_TRANSFER_ALREADY_PENDING
    http_status: 409
    serialization: "First-writer-wins on ACATTransfer creation per (account_id, direction=OUTBOUND, status non-terminal)"

  - scenario: "Customer cancels Order while system auto-cancels via PDT cascade"
    guarantee: "Exactly one cancellation succeeds; the other returns 409 because Order.status already CANCELLED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status"

  - scenario: "Two OptionsApproval submissions for same account simultaneously"
    guarantee: "At most one OptionsApproval in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} per account"
    error_id: ERR_OPTIONS_APPROVAL_IN_PROGRESS
    http_status: 409
    serialization: "First-writer-wins on OptionsApproval creation"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: options_eligibility_max
    trigger: "Computed on POST /brokerage/options-approvals (and re-evaluated when ComplianceOfficer decides)"
    algorithm: tiered_pricing
    formula: |
      # All money values are in USD cents.
      yrs = Customer.years_options_experience
      lnw = Customer.liquid_net_worth_cents
      tnw = Customer.total_net_worth_cents
      # Tier rules — return the MAXIMUM level for which BOTH criteria are met.
      eligible = 0
      if yrs >= 0 and lnw >= 1_000_000:        eligible = 1   # $10k
      if yrs >= 1 and lnw >= 5_000_000:        eligible = 2   # $50k
      if yrs >= 2 and lnw >= 10_000_000 and tnw >= 25_000_000: eligible = 3  # $100k/$250k
      if yrs >= 3 and lnw >= 25_000_000 and tnw >= 50_000_000: eligible = 4  # $250k/$500k
      return eligible
    input_set: "Customer fields: years_options_experience, liquid_net_worth_cents, total_net_worth_cents at submission time"
    constants:
      LEVEL_1_LNW_CENTS: 1000000
      LEVEL_2_LNW_CENTS: 5000000
      LEVEL_3_LNW_CENTS: 10000000
      LEVEL_3_TNW_CENTS: 25000000
      LEVEL_4_LNW_CENTS: 25000000
      LEVEL_4_TNW_CENTS: 50000000
    precision: "integer (cents); no rounding"
    variants: []

  - name: margin_requirement
    trigger: "On POST /brokerage/orders before status set to ACCEPTED; rejects if Account.cash_balance_cents < requirement"
    algorithm: weighted_scoring
    formula: |
      # Notional in cents.
      px = limit_price_cents if order_type in (LIMIT, STOP_LIMIT, TAKE_PROFIT) else stop_price_cents if order_type==STOP else market_reference_price_cents
      notional = quantity * px
      base = 0
      if Account.account_type == CASH:
          base = notional                       # 100% — full cash required
      elif Account.account_type == MARGIN_REG_T:
          base = ceil(notional * 0.50)          # Reg T 50% initial margin
      elif Account.account_type == MARGIN_PMA:
          base = ceil(notional * 0.15)          # PMA stress-test factor
      # Naked option add-on (Reg T only, applies to NAKED_CALL/NAKED_PUT)
      addon = 0
      if instrument_type == OPTION and option_strategy in (NAKED_CALL, NAKED_PUT) and Account.account_type == MARGIN_REG_T:
          addon = ceil(notional * 0.20)
      return base + addon
    input_set: "Order being submitted; price reference is request body; account_type determines base rate"
    constants:
      REG_T_RATE: 0.50
      PMA_RATE: 0.15
      NAKED_ADDON_RATE: 0.20
    precision: "integer cents; ceil() applied per-term BEFORE summation (rounding order pinned)"
    variants:
      - name: reg_t
        when: "Account.account_type == MARGIN_REG_T"
        difference: "50% initial margin (plus 20% naked-option add-on if applicable)"
      - name: pma
        when: "Account.account_type == MARGIN_PMA"
        difference: "15% portfolio-margin stress-test rate, no naked add-on; produces a strictly lower requirement on identical inputs"

  - name: day_trade_pairing
    trigger: "On any Order transition to FILLED — evaluate whether this fill closes an opposite-side same-symbol same-day fill"
    algorithm: chronological
    formula: |
      # Match newest FILLED order to OLDEST unmatched opposite-side FILLED order on same trade_date (FIFO).
      candidates = Orders where account_id == self.account_id
                                AND symbol == self.symbol
                                AND status == FILLED
                                AND opened_for_day_trade == false
                                AND side != self.side
                                AND trade_date(filled_at) == trade_date(self.filled_at)
      ORDER BY filled_at ASC, id ASC
      if candidates not empty:
          opener = first(candidates)
          mark opener.opened_for_day_trade = true
          mark self.opened_for_day_trade = true
          insert DayTrade(opening_order_id=opener.id, closing_order_id=self.id, symbol, trade_date=trade_date(self.filled_at))
    input_set: "Orders for same account, same symbol, same UTC trading-day, FILLED, not yet paired"
    constants: {}
    precision: "exact"
    variants: []

  - name: pdt_flag_check
    trigger: "Evaluated immediately after every DayTrade row insert"
    algorithm: aggregation
    formula: |
      # Count DayTrade rows for this account whose trade_date is in the rolling 5-business-day window
      # ending at (and including) today (UTC, business days = Mon-Fri).
      window_start = subtract_business_days(today_utc, 4)   # 5 business days inclusive
      count = COUNT(DayTrade where account_id == X AND trade_date BETWEEN window_start AND today_utc INCLUSIVE)
      if count >= 4 AND Account.equity_value_cents < PDT_EQUITY_FLOOR_CENTS:
          set Account.pdt_flag = true
          set Account.trading_posture = PDT_FROZEN
          cascade: cancel all non-terminal Orders, reject all non-terminal OptionsApprovals
    input_set: "DayTrade rows within rolling 5-business-day window inclusive of today; uses UTC business calendar (Mon-Fri, no holidays)"
    constants:
      PDT_TRADE_THRESHOLD: 4
      PDT_WINDOW_BUSINESS_DAYS: 5
      PDT_EQUITY_FLOOR_CENTS: 2500000   # $25,000.00
    precision: "exact integer counts; window boundary inclusive on both ends"
    variants: []

  - name: acat_completion_eta
    trigger: "On ACATTransfer.status transition from INITIATED to VALIDATED"
    algorithm: forward_looking
    formula: |
      # Standard 6 business days from initiated_at, completing at 17:00 UTC on the target day.
      day = date(initiated_at)
      remaining = 6
      while remaining > 0:
          day = day + 1 day
          if weekday(day) in (MON..FRI):
              remaining -= 1
      expected_completion_at = datetime(day, 17:00:00 UTC)
      return expected_completion_at
    input_set: "ACATTransfer.initiated_at; UTC business calendar (Mon-Fri, no holidays)"
    constants:
      ACAT_BUSINESS_DAYS: 6
      COMPLETION_HOUR_UTC: 17
    precision: "second; pinned to 17:00:00.000 UTC on the target day"
    variants: []

  - name: portfolio_equity
    trigger: "Recomputed on every Order fill, on every ACATTransfer completion, and on PDT check"
    algorithm: aggregation
    formula: |
      # Mark-to-market using last fill_price_cents of each symbol; for symbols with no fills, exclude.
      cash = Account.cash_balance_cents
      positions = group Order rows where account_id==X AND status==FILLED by symbol
      market_value = 0
      for each symbol group:
          # Net signed quantity by side: BUY +qty, SELL -qty; only EQUITY instruments contribute (options excluded for equity calc)
          net_qty = sum(BUY.quantity) - sum(SELL.quantity)  for EQUITY rows
          last_price = max(filled_at) row's fill_price_cents for that symbol+EQUITY
          if last_price is null OR net_qty <= 0: contribution = 0
          else: contribution = net_qty * last_price
          market_value += contribution
      Account.equity_value_cents = cash + market_value
    input_set: "All FILLED equity Orders for the account; cash_balance_cents"
    constants: {}
    precision: "integer cents; per-symbol contribution computed BEFORE summing"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Customer, ComplianceOfficer, PlatformAdmin}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is authorized for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-parameter customer_id resolves to a Customer row"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {customer_id} in path"

  - priority: 5
    category: existence
    check: "Path-parameter account_id resolves to an Account row"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {account_id} or /accounts/{id}"

  - priority: 6
    category: existence
    check: "Path-parameter options-approval id resolves"
    error_id: ERR_OPTIONS_APPROVAL_NOT_FOUND
    http_status: 404
    applies_to: "/brokerage/options-approvals/{id}/**"

  - priority: 7
    category: existence
    check: "Path-parameter order id resolves"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "/brokerage/orders/{id}/**"

  - priority: 8
    category: existence
    check: "Path-parameter acat-transfer id resolves"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "/brokerage/acat-transfers/{id}/**"

  - priority: 9
    category: auth
    check: "Customer role: X-User-ID must equal the owning Customer.id for the requested resource (or its account.customer_id chain)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "Customer-role endpoints"

  - priority: 10
    category: state
    check: "Account.status == APPROVED for any trade/transfer/options endpoint (except KYC)"
    error_id: ERR_ACCOUNT_NOT_APPROVED
    http_status: 409
    applies_to: "/brokerage/orders, /brokerage/options-approvals, /brokerage/acat-transfers"

  - priority: 11
    category: state
    check: "Customer.kyc_status == VERIFIED for any post-KYC endpoint"
    error_id: ERR_KYC_NOT_VERIFIED
    http_status: 409
    applies_to: "/brokerage/orders, /brokerage/options-approvals, /brokerage/acat-transfers, /brokerage/accounts/{id}/close"

  - priority: 12
    category: state
    check: "Account.trading_posture == OPEN for order submission"
    error_id: ERR_TRADING_FROZEN
    http_status: 409
    applies_to: "POST /brokerage/orders"

  - priority: 13
    category: state
    check: "OptionsApproval.status matches the action's source state (e.g., decide requires UNDER_REVIEW)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/brokerage/options-approvals/{id}/start-review, /decide, PATCH"

  - priority: 14
    category: state
    check: "Order.status == ACCEPTED or WORKING for cancel; Order.status == WORKING for fill"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "DELETE /brokerage/orders/{id}, POST /brokerage/orders/{id}/fill"

  - priority: 15
    category: state
    check: "ACATTransfer.status matches the action's source state per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/brokerage/acat-transfers/{id}/**"

  - priority: 16
    category: business_safety
    check: "KYC submission: address_country must equal 'US' (only US persons supported)"
    error_id: ERR_KYC_INELIGIBLE_COUNTRY
    http_status: 422
    applies_to: "POST /brokerage/customers/{customer_id}/kyc"

  - priority: 17
    category: business_safety
    check: "KYC: customer age >= 18 derived from date_of_birth"
    error_id: ERR_KYC_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /brokerage/customers/{customer_id}/kyc"

  - priority: 18
    category: business_safety
    check: "W-9 signed_name must equal Customer.legal_name (case-insensitive, trimmed)"
    error_id: ERR_W9_NAME_MISMATCH
    http_status: 422
    applies_to: "POST /brokerage/customers/{customer_id}/kyc"

  - priority: 19
    category: business_safety
    check: "OptionsApproval: requested_level requires options_strategy compatibility — orders with NAKED_CALL/NAKED_PUT require Account.options_level >= 4; SPREAD requires >= 3; LONG_CALL/LONG_PUT requires >= 2; COVERED_CALL/CASH_SECURED_PUT requires >= 1"
    error_id: ERR_OPTIONS_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /brokerage/orders (instrument_type==OPTION)"

  - priority: 20
    category: business_safety
    check: "OptionsApproval decision: approved_level must be <= options_eligibility_max calculated from Customer fields"
    error_id: ERR_OPTIONS_LEVEL_EXCEEDS_ELIGIBILITY
    http_status: 422
    applies_to: "POST /brokerage/options-approvals/{id}/decide"

  - priority: 21
    category: business_constraint
    check: "Order payload: limit_price_cents required for LIMIT/STOP_LIMIT/TAKE_PROFIT; stop_price_cents required for STOP/STOP_LIMIT"
    error_id: ERR_ORDER_PRICE_MISSING
    http_status: 422
    applies_to: "POST /brokerage/orders"

  - priority: 22
    category: business_constraint
    check: "Order payload: option_strategy required iff instrument_type==OPTION"
    error_id: ERR_ORDER_STRATEGY_REQUIRED
    http_status: 422
    applies_to: "POST /brokerage/orders"

  - priority: 23
    category: business_constraint
    check: "Order payload: quantity >= 1 and integer; price fields > 0 when provided"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /brokerage/orders"

  - priority: 24
    category: business_constraint
    check: "Order fill: execution_price_cents must respect price semantics — LIMIT BUY: price <= limit; LIMIT SELL: price >= limit; STOP BUY: price >= stop; STOP SELL: price <= stop; STOP_LIMIT applies both"
    error_id: ERR_FILL_PRICE_VIOLATES_LIMITS
    http_status: 422
    applies_to: "POST /brokerage/orders/{id}/fill"

  - priority: 25
    category: business_constraint
    check: "PDT rule: Account.pdt_flag is true AND Account.equity_value_cents < 2_500_000 AND request would create a 4th-or-later day trade in window → reject order outright (pre-flag block once already flagged)"
    error_id: ERR_PDT_EQUITY_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /brokerage/orders"

  - priority: 26
    category: business_constraint
    check: "ACATTransfer creation: no other non-terminal ACATTransfer with same (account_id, direction=OUTBOUND)"
    error_id: ERR_TRANSFER_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /brokerage/acat-transfers"

  - priority: 27
    category: business_referential
    check: "ACATTransfer validate (OUTBOUND): no Order.status IN {ACCEPTED, WORKING} for account"
    error_id: ERR_OPEN_ORDERS_BLOCK_TRANSFER
    http_status: 409
    applies_to: "POST /brokerage/acat-transfers/{id}/validate"

  - priority: 28
    category: business_referential
    check: "Account close: no open Orders and no non-terminal ACATTransfers"
    error_id: ERR_ACCOUNT_HAS_DEPENDENCIES
    http_status: 409
    applies_to: "POST /brokerage/accounts/{id}/close"

  - priority: 29
    category: business_fiscal
    check: "Order submission: required margin (per calc margin_requirement) <= Account.cash_balance_cents for CASH accounts; for MARGIN accounts, requirement <= cash_balance_cents (initial margin must be available cash)"
    error_id: ERR_INSUFFICIENT_MARGIN
    http_status: 422
    applies_to: "POST /brokerage/orders"

  - priority: 30
    category: business_fiscal
    check: "OptionsApproval bounded: revision_count < 3 when requesting revision"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /brokerage/options-approvals/{id}/decide (REQUEST_REVISION)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Customer + KYC ----
  - method: POST
    path: "/brokerage/customers"
    description: "Create a new Customer (no KYC yet)"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [legal_name, date_of_birth, ssn_last4, annual_income_cents, liquid_net_worth_cents, total_net_worth_cents, years_options_experience]
    output: Customer
    side_effects:
      - "Customer row created with kyc_status=NOT_STARTED"

  - method: GET
    path: "/brokerage/customers/{customer_id}"
    description: "Read a Customer"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/brokerage/customers/{customer_id}/kyc"
    description: "Submit KYC and W-9 form. Creates KYCSubmission; transitions Account from PENDING_KYC → KYC_REVIEW"
    roles: [Customer]
    code: 201
    input: [government_id_type, government_id_number, address_line1, address_country, w9_signed_name]
    output: KYCSubmission
    side_effects:
      - "Customer.kyc_status := PENDING"
      - "Account.status := KYC_REVIEW (if currently PENDING_KYC)"

  - method: POST
    path: "/brokerage/customers/{customer_id}/kyc/decision"
    description: "Compliance verifies or rejects the latest KYCSubmission"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: KYCSubmission
    side_effects:
      - "On VERIFY: Customer.kyc_status:=VERIFIED, w9_collected:=true, Account.status:=APPROVED, Account.trading_posture:=OPEN"
      - "On REJECT: Customer.kyc_status:=REJECTED, Account reverts to PENDING_KYC"

  # ---- Accounts ----
  - method: POST
    path: "/brokerage/accounts"
    description: "Create an Account for an existing Customer"
    roles: [Customer]
    code: 201
    input: [customer_id, account_type]
    output: Account
    side_effects:
      - "Account row created with status=PENDING_KYC, trading_posture=RESTRICTED"

  - method: GET
    path: "/brokerage/accounts/{id}"
    description: "Read an Account"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/brokerage/accounts"
    description: "List Accounts (paginated; filter by customer_id, status)"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/brokerage/accounts/{id}/close"
    description: "Close an Account"
    roles: [Customer]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account.status := CLOSED; trading_posture := RESTRICTED"

  - method: POST
    path: "/brokerage/accounts/{id}/pdt/reset"
    description: "Clear PDT freeze after depositing to bring equity above $25K"
    roles: [Customer]
    code: 200
    input: [equity_top_up_cents]
    output: Account
    side_effects:
      - "Account.cash_balance_cents += equity_top_up_cents"
      - "Equity recomputed; if >= 2_500_000 and posture==PDT_FROZEN: posture := OPEN, pdt_flag := false"

  # ---- Options Approvals ----
  - method: POST
    path: "/brokerage/options-approvals"
    description: "Submit an OptionsApproval for an Account"
    roles: [Customer]
    code: 201
    input: [account_id, requested_level]
    output: OptionsApproval
    side_effects:
      - "OptionsApproval row created with status=SUBMITTED"

  - method: GET
    path: "/brokerage/options-approvals/{id}"
    description: "Read an OptionsApproval"
    roles: [Customer, ComplianceOfficer]
    code: 200
    input: []
    output: OptionsApproval
    side_effects: []

  - method: POST
    path: "/brokerage/options-approvals/{id}/start-review"
    description: "Compliance opens an OptionsApproval for review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OptionsApproval
    side_effects:
      - "status := UNDER_REVIEW"

  - method: POST
    path: "/brokerage/options-approvals/{id}/decide"
    description: "Compliance decides: APPROVE / REJECT / REQUEST_REVISION"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "approved_level?", "notes?"]
    output: OptionsApproval
    side_effects:
      - "APPROVE: Account.options_level := max(current, approved_level)"
      - "REQUEST_REVISION: status := REVISION_REQUESTED"
      - "REJECT: terminal state"

  - method: PATCH
    path: "/brokerage/options-approvals/{id}"
    description: "Customer resubmits after REVISION_REQUESTED (increments revision_count)"
    roles: [Customer]
    code: 200
    input: ["requested_level?", version]
    output: OptionsApproval
    side_effects:
      - "status := SUBMITTED; revision_count += 1"

  # ---- Orders ----
  - method: POST
    path: "/brokerage/orders"
    description: "Submit an order. Runs margin_requirement calc and PDT validation"
    roles: [Customer]
    code: 201
    input: [account_id, symbol, instrument_type, "option_strategy?", side, order_type, quantity, "limit_price_cents?", "stop_price_cents?"]
    output: Order
    side_effects:
      - "margin_requirement_cents computed and stored on Order"
      - "If MARKET: Order auto-FILLED; cash_balance adjusted; day_trade_pairing evaluated; pdt_flag_check evaluated"
      - "Else: Order.status := WORKING"

  - method: GET
    path: "/brokerage/orders/{id}"
    description: "Read an Order"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/brokerage/orders"
    description: "List Orders (paginated; filter by account_id, symbol, status)"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "symbol?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/brokerage/orders/{id}/fill"
    description: "Operator simulates a fill of a WORKING order at an execution price"
    roles: [PlatformAdmin]
    code: 200
    input: [execution_price_cents]
    output: Order
    side_effects:
      - "Order.status := FILLED; cash_balance adjusted; day_trade_pairing evaluated; pdt_flag_check evaluated"

  - method: DELETE
    path: "/brokerage/orders/{id}"
    description: "Cancel an order (ACCEPTED or WORKING)"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "status := CANCELLED"

  # ---- ACAT Transfers ----
  - method: POST
    path: "/brokerage/acat-transfers"
    description: "Initiate an ACAT transfer"
    roles: [Customer]
    code: 201
    input: [account_id, direction, counterparty_brokerage, counterparty_account_number, requested_value_cents]
    output: ACATTransfer
    side_effects:
      - "ACATTransfer.status := INITIATED; initiated_at := now()"

  - method: GET
    path: "/brokerage/acat-transfers/{id}"
    description: "Read an ACATTransfer"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ACATTransfer
    side_effects: []

  - method: GET
    path: "/brokerage/acat-transfers"
    description: "List ACATTransfers (paginated; filter by account_id, direction, status)"
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "direction?", "status?", "limit?", "offset?"]
    output: ACATTransfer[]
    side_effects: []

  - method: POST
    path: "/brokerage/acat-transfers/{id}/validate"
    description: "Compliance validates; computes expected_completion_at = initiated_at + 6 business days at 17:00 UTC"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ACATTransfer
    side_effects:
      - "status := VALIDATED; expected_completion_at computed"
      - "If direction=OUTBOUND: Account.trading_posture := TRANSFER_LOCKED; cancel non-terminal Orders"

  - method: POST
    path: "/brokerage/acat-transfers/{id}/reject"
    description: "Compliance rejects an INITIATED transfer"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: ACATTransfer
    side_effects:
      - "status := REJECTED"

  - method: DELETE
    path: "/brokerage/acat-transfers/{id}"
    description: "Customer cancels an INITIATED or VALIDATED transfer"
    roles: [Customer]
    code: 200
    input: []
    output: ACATTransfer
    side_effects:
      - "status := CANCELLED; if was TRANSFER_LOCKED: revert posture to OPEN"

  # ---- Test-driving (clock + sweep) ----
  - method: POST
    path: "/brokerage/_clock/advance"
    description: "Advance the server's logical clock by a number of seconds (test-only). Drives time-gated transitions: VALIDATED→IN_TRANSIT (>=1 business day) and IN_TRANSIT→COMPLETED (>= expected_completion_at)."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null
    side_effects:
      - "Server now() advances; ACATTransfer business_days_elapsed recomputed; any due transitions auto-applied"

  - method: POST
    path: "/brokerage/_sweep/run"
    description: "Run the scheduled sweep: evaluate ACATTransfer time gates and re-run pdt_flag_check (test-only)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Time-gated transitions applied; account postures recomputed"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Required auth headers missing or empty"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role value not recognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "Customer accessing a resource that does not chain back to their Customer.id"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id path parameter does not resolve"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id path parameter does not resolve"
  - id: ERR_OPTIONS_APPROVAL_NOT_FOUND
    http: 404
    condition: "options-approval id does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id does not resolve"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "acat-transfer id does not resolve"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic schema validation failure (missing/typed fields)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in valid source state for the requested transition"
  - id: ERR_ACCOUNT_NOT_APPROVED
    http: 409
    condition: "Account.status != APPROVED for an endpoint that requires approval"
  - id: ERR_KYC_NOT_VERIFIED
    http: 409
    condition: "Customer.kyc_status != VERIFIED for an endpoint requiring verified KYC"
  - id: ERR_TRADING_FROZEN
    http: 409
    condition: "Account.trading_posture not OPEN (PDT_FROZEN, TRANSFER_LOCKED, or RESTRICTED)"
  - id: ERR_KYC_INELIGIBLE_COUNTRY
    http: 422
    condition: "KYC submission country_code != 'US'"
  - id: ERR_KYC_AGE_INELIGIBLE
    http: 422
    condition: "Customer age < 18 derived from date_of_birth"
  - id: ERR_W9_NAME_MISMATCH
    http: 422
    condition: "W-9 signed_name does not equal Customer.legal_name (case-insensitive)"
  - id: ERR_OPTIONS_LEVEL_INSUFFICIENT
    http: 422
    condition: "Order's option_strategy requires a higher Account.options_level than currently granted"
  - id: ERR_OPTIONS_LEVEL_EXCEEDS_ELIGIBILITY
    http: 422
    condition: "Compliance attempts to grant a level exceeding options_eligibility_max"
  - id: ERR_ORDER_PRICE_MISSING
    http: 422
    condition: "Required price field absent for chosen order_type"
  - id: ERR_ORDER_STRATEGY_REQUIRED
    http: 422
    condition: "option_strategy missing when instrument_type=OPTION (or present when EQUITY)"
  - id: ERR_FILL_PRICE_VIOLATES_LIMITS
    http: 422
    condition: "Operator fill price violates LIMIT/STOP/STOP_LIMIT semantics"
  - id: ERR_PDT_EQUITY_BELOW_MINIMUM
    http: 409
    condition: "Already-flagged PDT account with equity < $25,000 attempts another day trade"
  - id: ERR_INSUFFICIENT_MARGIN
    http: 422
    condition: "Order's computed margin_requirement_cents exceeds Account.cash_balance_cents"
  - id: ERR_OPEN_ORDERS_BLOCK_TRANSFER
    http: 409
    condition: "Outbound ACAT validate attempted while open Orders exist"
  - id: ERR_ACCOUNT_HAS_DEPENDENCIES
    http: 409
    condition: "Account close attempted with open Orders or non-terminal transfers"
  - id: ERR_TRANSFER_ALREADY_PENDING
    http: 409
    condition: "Another OUTBOUND ACATTransfer already in non-terminal state for this account"
  - id: ERR_OPTIONS_APPROVAL_IN_PROGRESS
    http: 409
    condition: "Another OptionsApproval already in non-terminal state for this account"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "REQUEST_REVISION attempted when revision_count >= 3"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user who owns Customer + Account; submits KYC, orders, options approvals, ACAT transfers"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /brokerage/customers/{customer_id}/kyc"
      - "POST /brokerage/accounts"
      - "POST /brokerage/accounts/{id}/close"
      - "POST /brokerage/accounts/{id}/pdt/reset"
      - "POST /brokerage/options-approvals"
      - "PATCH /brokerage/options-approvals/{id}"
      - "POST /brokerage/orders"
      - "DELETE /brokerage/orders/{id}"
      - "POST /brokerage/acat-transfers"
      - "DELETE /brokerage/acat-transfers/{id}"
    shared_operations:
      - "GET /brokerage/customers/{customer_id}"
      - "GET /brokerage/accounts/{id}"
      - "GET /brokerage/accounts"
      - "GET /brokerage/options-approvals/{id}"
      - "GET /brokerage/orders/{id}"
      - "GET /brokerage/orders"
      - "GET /brokerage/acat-transfers/{id}"
      - "GET /brokerage/acat-transfers"

  - name: ComplianceOfficer
    description: "Internal compliance operator; verifies KYC, decides options approvals, validates/rejects ACAT transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerage/customers/{customer_id}/kyc/decision"
      - "POST /brokerage/options-approvals/{id}/start-review"
      - "POST /brokerage/options-approvals/{id}/decide"
      - "POST /brokerage/acat-transfers/{id}/validate"
      - "POST /brokerage/acat-transfers/{id}/reject"
    shared_operations:
      - "GET /brokerage/customers/{customer_id}"
      - "GET /brokerage/accounts/{id}"
      - "GET /brokerage/accounts"
      - "GET /brokerage/options-approvals/{id}"
      - "GET /brokerage/orders/{id}"
      - "GET /brokerage/orders"
      - "GET /brokerage/acat-transfers/{id}"
      - "GET /brokerage/acat-transfers"

  - name: PlatformAdmin
    description: "Internal platform operator; simulates fills and drives the test clock/sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerage/orders/{id}/fill"
      - "POST /brokerage/_clock/advance"
      - "POST /brokerage/_sweep/run"
    shared_operations:
      - "POST /brokerage/customers"
      - "GET /brokerage/customers/{customer_id}"
      - "GET /brokerage/accounts/{id}"
      - "GET /brokerage/accounts"
      - "GET /brokerage/orders/{id}"
      - "GET /brokerage/orders"
      - "GET /brokerage/acat-transfers/{id}"
      - "GET /brokerage/acat-transfers"
