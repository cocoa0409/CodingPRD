        distinguishing_aspect: |
          Two applications whose raw windows are disjoint (2029-01-01..2029-12-31 and
          2030-01-01..2030-06-30) DO overlap once commissioning_buffer_days 90 is added to both
          ends, so 300 + 101 MW is refused on the buffered utility; the byte-identical windows and
          MW on a second utility with commissioning_buffer_days 0 are admitted, proving the buffer
          — not the calendar dates — decides. CLOSED intervals, MW aggregated across the group.
        test_recipe:
          setup:
            - "Utility Buffered: total_transmission_capacity_mw 400, commissioning_buffer_days 90; Site A1 reserved for 300 MW over 2029-01-01..2029-12-31; Site A2's 101 MW application over 2030-01-01..2030-06-30 STUDY_COMPLETE."
