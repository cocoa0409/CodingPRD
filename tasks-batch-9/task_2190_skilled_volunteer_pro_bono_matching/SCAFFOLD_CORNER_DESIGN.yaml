      - name: error_rescope_limit_reached_on_fourth_rescope_attempt
        claim_type: error_triggerable
        grounds: ["errors[ERR_RESCOPE_LIMIT_REACHED]", "validations[priority=50]", state_machines.ProjectRequest.transitions.MATCHING_to_RESCOPING]
        distinguishing_aspect: "The only reachable route to the rescope ceiling: three full unsuccessful-match cycles (two withdrawn offers each, using six distinct volunteers because the retry-exclusion rule bars any volunteer already offered on this request) drive rescope_count to 3, after which the request is parked in RESCOPING and rescope must be refused while abandon stays available. Scaffold divergence worth pinning: §1.4 priority 50 requires rescope_count < 3, the ProjectRequest machine's RESCOPING -> SCOPING precondition says rescope_count <= 3, and the §1.6 catalog text names MAX_RESCOPES (2); the §1.4 ladder is normative, so rescope_count == 3 must fail."
