  # -----------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: arrangement_create_stale_account_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[arrangement-create-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A second arrangement create carrying the pre-supersede expected_account_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Account at version 1; a first arrangement created (account -> version 2)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "OCC Ola", service_address: "124 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 20000, installment_count: 4, expected_account_version: "${acct_v0}" }
              as: AssistanceCaseworker
              captures: { pa1_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 30000, installment_count: 5, expected_account_version: "${acct_v0}" }
              as: AssistanceCaseworker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (412)"
            - "PaymentArrangement.${pa1_id}.status == ACTIVE (not superseded by the stale request)"

      - name: arrangement_create_supersede_prior_active
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.PaymentArrangement.ACTIVE_to_SUPERSEDED
          - entities.Account.fields.version
        distinguishing_aspect: "A second arrangement create with the CURRENT account version succeeds and supersedes the prior ACTIVE arrangement."
        test_recipe:
          setup: ["Account with one ACTIVE arrangement; version re-read after creation."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Sup Sue", service_address: "125 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 20000, installment_count: 4, expected_account_version: "${acct_v0}" }
              as: AssistanceCaseworker
              captures: { pa1_id: $.data.id }
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: AssistanceCaseworker
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 30000, installment_count: 5, expected_account_version: "${acct_v1}" }
              as: AssistanceCaseworker
              captures: { pa2_id: $.data.id }
          assert:
            - "PaymentArrangement.${pa1_id}.status == SUPERSEDED"
            - "PaymentArrangement.${pa2_id}.status == ACTIVE"

      - name: version_increments_on_assistance_enrollment
        claim_type: optimistic_concurrency
        grounds:
          - entities.Account.fields.version
          - endpoints
        distinguishing_aspect: "POST /accounts/{id}/assistance increments Account.version from 1 to 2."
        test_recipe:
          setup: ["Fresh account at version 1."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Ver Val", service_address: "126 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/assistance"
              payload: { program: "SENIOR", discount_pct: 0.15 }
              as: AssistanceCaseworker
              captures: { v_after: $.data.version }
          assert:
            - "Account.${a_id}.version == 2"
            - "Account.${a_id}.assistance_program == SENIOR"

  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: error_moratorium_blocks_shutoff_execute
        claim_type: guarded transitions
        grounds:
          - state_machines.ShutoffOrder.SCHEDULED_to_EXECUTED
        excluded_because:
          difficulty_instance: shutoff_execute_depends_on_moratorium_window
          rationale: "Moratorium-blocked shutoff execution is the invalid path of the named §1.8 cross-entity instance."
      - name: error_bill_period_overlap_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=7]
        excluded_because:
          difficulty_instance: bill_period_overlap_half_open_on_account
          rationale: "Half-open bill overlap rejection is asserted directly by the named §1.8 temporal-overlap instance."
      - name: error_moratorium_window_overlap_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=7]
        excluded_because:
          difficulty_instance: moratorium_window_overlap_closed_with_adjacency
          rationale: "Closed-interval moratorium overlap rejection is asserted by the named §1.8 temporal-overlap instance."
      - name: deposit_fully_refunded_when_no_balance
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Deposit.HELD_to_REFUNDED
          - calculations.deposit_settlement
        distinguishing_aspect: "Finalizing an account with a HELD deposit but zero final balance refunds the full deposit (status REFUNDED, applied 0)."
        test_recipe:
          setup: ["Account with no meters and a HELD deposit of 3000 (final bill will be 0)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Ref Ron", service_address: "127 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/deposits"
              payload: { amount_cents: 3000, reason: "NEW_SERVICE" }
              as: BillingSpecialist
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/finalize"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
          assert:
            - "Deposit.${d_id}.status == REFUNDED"
            - "Deposit.${d_id}.refunded_cents == 3000"
            - "Deposit.${d_id}.applied_cents == 0"

