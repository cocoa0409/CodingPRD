              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${p1}/open-comment"
              payload: {}
              as: UtilityPlanner
              captures: { ok: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
