  - section: validations
    instances:
      - name: score_gate_exactly_at_threshold_passes
        claim_type: satisfaction_pass
        grounds: ["validations[priority=11]", "calculations.scouting_score"]
        distinguishing_aspect: "A ROCK artist with engagement 0.6, live 2000, zero streams/followers scores exactly 40.0 == sign_threshold_score and MAY be proposed (>= semantics)."
        test_recipe:
          setup: ["Label defaults (threshold 40.0)"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label Vb1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Edge Act", genre: "ROCK", birth_date: "1995-04-12", monthly_streams: 0, social_followers: 0, engagement_rate: 0.6, live_draw_avg: 2000 }, as: AnRManager, captures: { artist_id: $.data.id, score: $.data.scouting_score } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { st: $.data.status } }
          assert:
            - "Artist.scouting_score == 40.0 and propose succeeds: DealMemo.${memo_id}.status == PROPOSED"

      - name: score_below_gate_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_SCOUTING_SCORE_TOO_LOW]"]
        distinguishing_aspect: "An OTHER-genre artist scoring 3.3 cannot be proposed: ERR_SCOUTING_SCORE_TOO_LOW and the memo stays DRAFT."
        test_recipe:
          setup: ["Label defaults; low-score artist (3.3)"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label Vb2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Low Act", genre: "OTHER", birth_date: "1995-04-12", monthly_streams: 10000, social_followers: 20000, engagement_rate: 0.1, live_draw_avg: 50 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCOUTING_SCORE_TOO_LOW (422); memo stays DRAFT; artist stays SCOUTED"

      - name: memo_already_open_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DEAL_MEMO_ALREADY_OPEN]"]
        distinguishing_aspect: "One open memo per artist: creating a second memo while the first is DRAFT fails with ERR_DEAL_MEMO_ALREADY_OPEN."
        test_recipe:
          setup: ["Label; artist with one DRAFT memo"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label Vb3" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist Vb3", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
          trigger:
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 60000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEAL_MEMO_ALREADY_OPEN (409); GET /api/artists/${artist_id}/deal-memos total_count == 1"

      - name: memo_expired_lazy_transition
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_DEAL_MEMO_EXPIRED]", "state_machines.DealMemo.DRAFT_to_EXPIRED"]
        distinguishing_aspect: "Lazy expiry: proposing after valid_until_date transitions the memo to EXPIRED AND returns ERR_DEAL_MEMO_EXPIRED in the same response."
        test_recipe:
          setup: ["Label; artist; memo DRAFT valid_until 2026-08-10; clock at 2026-08-11"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label Vb4" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist Vb4", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2026-08-10" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: LabelAdmin }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEAL_MEMO_EXPIRED (422)"
            - "DealMemo.${memo_id}.status == EXPIRED after the failed call (lazy transition persisted)"

      - name: isrc_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_ISRC_CONFLICT]"]
        distinguishing_aspect: "A second track anywhere in the label reusing an existing ISRC fails with ERR_ISRC_CONFLICT."
        test_recipe:
          setup: ["Label; funded contract; project RECORDING with track ISRC USRC20000031"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label Vb5" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist Vb5", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
