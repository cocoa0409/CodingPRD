  - rule_id: resource_temporal_overlap
    instances:
      - name: representative_windows_are_half_open_so_adjacency_passes_and_one_second_fails
        grounds:
          - interval_rules[representative-designation-window]
          - validations[priority=70]
          - entities.AuthorizedRepresentative.fields.authority_scope
          - state_machines.AuthorizedRepresentative.DESIGNATED_to_REVOKED
        distinguishing_aspect: |
          The designation window is half-open [effective_from, effective_to), so a
          successor starting exactly at the incumbent's effective_to is accepted while
          a successor starting one second earlier is refused; the occupancy is keyed
          by intersecting scope SETS, so an AUTHORIZE_LITIGATION designation may share
          the incumbent's exact window while BOTH may not; and revoking the incumbent
          frees the window for a fresh designation.
        test_recipe:
          setup:
            - "An ACTIVE AMZ enrollment exists"
            - "rep1 holds authority_scope SUBMIT_TAKEDOWN over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
            - "The clock stands at 2026-08-05T09:00:00Z throughout"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
