        claim_type: immediate_consistency
        grounds:
          - state_machines.AvoidanceAction.DEMANDED_to_SETTLED
          - consistency_model
        distinguishing_aspect: "Avoidance settle is atomic in one request: response shows SETTLED and cash credited, and an immediate GET on the claims register shows the compensating GENERAL_UNSECURED claim for the shortfall — no eventual lag."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION; DEMANDED action: transfer 100,000, demand 100,000; settle at 60,000 -> shortfall claim 40,000 for the transferee"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-IM-1", contact_email: "im@x.com" }
              as: Clerk
