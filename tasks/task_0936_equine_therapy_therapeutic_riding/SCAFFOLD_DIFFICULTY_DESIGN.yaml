          - errors[ERR_HORSE_LOAD_EXCEEDED]
        distinguishing_aspect: |
          Metric 1 - a NUMERIC threshold on POST /sessions: 190 lb rider + 30 lb tack = 220.00
          equals the horse's 1100 * 0.20 = 220.00 ceiling and is ADMITTED, while 191 lb pushes
          the load to 221.00 and is rejected.
