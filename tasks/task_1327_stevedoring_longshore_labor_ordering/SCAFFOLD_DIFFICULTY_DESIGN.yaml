            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 6, beats business_safety, priority 7)"
            - "HTTP status 409"
            - "GangOrder.${g}.status remains CANCELLED and VesselCall.${v}.work_posture remains FULL_STOPPAGE"

      - name: safety_error_beats_temporal_error_on_dispatch
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - calculations.dispatch_selection
          - calculations.work_posture_derivation
        distinguishing_aspect: |
          Pair (business_safety, business_temporal) — a different category pair than the
          (state, safety) instance: a forced dispatch of an already-double-booked worker
          (temporal violation) into a vessel under FULL_STOPPAGE (safety violation) must
          surface ERR_WORK_STOPPAGE_ACTIVE.
        test_recipe:
          setup:
            - "Vessel with TWO overlapping OPEN shifts S1 (08:00-16:00) and S2 (12:00-20:00)"
            - "Gang G1 on S1 already holds an OFFERED assignment for W1 (HOLDMAN, the only one)"
            - "Gang G2 on S2 is PLACED; a CRITICAL incident then drives the vessel to FULL_STOPPAGE"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Prio2", voyage_number: "P-112", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "NIGHT", start_utc: "2026-08-10T12:00:00Z", end_utc: "2026-08-10T20:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s2: $.data.id }
            - call: "POST /api/shift-windows/${s1}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows/${s2}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s1}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s2}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g2: $.data.id, g2_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g1}/dispatch-batch"
              payload: { expected_gang_order_version: "${g1_v}" }
              as: LaborHallDispatcher
            - call: "POST /api/safety-incidents"
              payload: { vessel_call_id: "${v}", scope: "VESSEL", severity: "CRITICAL", description: "Fuel spill" }
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/gang-orders/${g2}/dispatch-batch"
              payload: { expected_gang_order_version: "${g2_v}", worker_ids: ["${w1}"] }
              as: LaborHallDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WORK_STOPPAGE_ACTIVE (business_safety, priority 7, beats business_temporal double-booking, priority 9)"
            - "HTTP status 409"
            - "GangOrder.${g2} remains PLACED with offered_count == 0"

      - name: schema_error_beats_state_error_on_amend
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair (schema, state) — a third distinct category pair: a PATCH carrying an
          out-of-range required_headcount (-5) against an already-COMPLETED gang order
          must surface ERR_VALIDATION (priority 4), not ERR_INVALID_STATE (priority 6).
        test_recipe:
          setup:
            - "Vessel/shift/gang (headcount 1) fully worked to COMPLETED by W1"
          setup_api_calls:
