# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3033_franchise_operator_selection_single_unit_operator_agreement
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: candidate_create_returns_system_fields_and_registered_status
        claim_type: Creation
        grounds:
          - entities.Candidate
          - endpoints.POST_/franchise/candidates
        distinguishing_aspect: "A candidate created with the five input fields returns 201 with candidate_status REGISTERED, version 1, and system-minted id / created_at / updated_at; the client cannot set candidate_status."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Pat Applicant", email: "pat@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 500000 }
              as: SystemAdmin
              captures: { cand_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Candidate.${cand_id}.candidate_status == REGISTERED"
            - "Candidate.${cand_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: candidate_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Candidate.fields.email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "email is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST, not a 404 or a 422."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Pat Applicant", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 500000 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: candidate_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/franchise/candidates/{candidateId}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated candidate id produces 404 ERR_NOT_FOUND on the error envelope."
        test_recipe:
          setup:
            - "Logical clock at default. No candidate created."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /franchise/candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FieldConsultant
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: candidates_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/franchise/candidates
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three candidates, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at default. Three candidates registered."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /franchise/candidates"
              payload: { legal_name: "A One", email: "a1@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 100000 }
              as: SystemAdmin
            - call: "POST /franchise/candidates"
              payload: { legal_name: "A Two", email: "a2@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 100000 }
              as: SystemAdmin
            - call: "POST /franchise/candidates"
              payload: { legal_name: "A Three", email: "a3@example.com", home_market_code: "FL", relocation_willing: false, liquid_capital_cents: 100000 }
              as: SystemAdmin
          trigger:
            - call: "GET /franchise/candidates"
              payload: { limit: 2, offset: 0 }
              as: FieldConsultant
          assert:
            - "the response returns 2 rows with total_count == 3 and has_more == true"
            - "GET /franchise/candidates?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /franchise/candidates?home_market_code=FL returns exactly 1 row"

      - name: operating_week_operating_day_count_is_always_six
        claim_type: Computed Fields
        grounds:
          - entities.OperatingWeek.fields.operating_day_count
          - entities.Restaurant.fields.sunday_closed
        distinguishing_aspect: "operating_day_count is computed and always 6 under the closed-Sunday calendar, regardless of the week requested; a client-supplied value is ignored."
        test_recipe:
          setup:
            - "Logical clock at default. One AVAILABLE restaurant."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /franchise/restaurants"
              payload: { site_code: "GA-ATL-100", market_code: "GA", baseline_weekly_revenue_cents: 700000, equipment_value_cents: 90000000 }
              as: SystemAdmin
              captures: { r100_id: $.data.id }
            - call: "POST /franchise/restaurants/${r100_id}/make-available"
              payload: {}
              as: SystemAdmin
          trigger:
            - call: "POST /franchise/restaurants/${r100_id}/weeks"
              payload: { week_start_on: "2026-09-07T00:00:00Z" }
              as: FieldConsultant
              captures: { w100_id: $.data.id }
          assert:
            - "OperatingWeek.${w100_id}.operating_day_count == 6"
            - "OperatingWeek.${w100_id}.week_status == PLANNED"
            - "Restaurant.${r100_id}.sunday_closed == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_advance_from_submitted_below_screening_score_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.SUBMITTED_to_SCREENING
          - errors.ERR_SCREENING_BELOW_THRESHOLD
          - calculations.screening_score
        distinguishing_aspect: "An application whose screening_score is below SCREENING_PASS_SCORE (60) cannot advance from SUBMITTED; the gate is evaluated at advance time from computed fields."
        test_recipe:
          setup:
            - "Logical clock at default. Candidate with liquid_capital_cents=0, relocation_willing=false, home GA, target FL, legal_name 'Bo' -> screening_score = 2."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Bo", email: "bo@example.com", home_market_code: "GA", relocation_willing: false, liquid_capital_cents: 0 }
              as: SystemAdmin
              captures: { cand_lo_id: $.data.id }
            - call: "POST /franchise/candidates/${cand_lo_id}/applications"
              payload: { target_market_code: "FL" }
              as: Candidate
              as_user_id: "${cand_lo_id}"
              captures: { app_lo_id: $.data.id }
          trigger:
            - call: "POST /franchise/applications/${app_lo_id}/advance"
              payload: {}
              as: FieldConsultant
              captures: { adv_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SCREENING_BELOW_THRESHOLD"
            - "Application.${app_lo_id}.stage remains SUBMITTED"
            - "Application.${app_lo_id}.screening_score == 2"

      - name: interview_score_out_of_range_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InterviewRound.SCHEDULED_to_SUBMITTED
          - errors.ERR_SCORE_OUT_OF_RANGE
        distinguishing_aspect: "Interview score must be within 0..100 inclusive; 101 is rejected with ERR_SCORE_OUT_OF_RANGE while the round stays SCHEDULED."
        test_recipe:
          setup:
            - "Logical clock at default. Application advanced to INTERVIEWS with one SCHEDULED round."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Quinn Applicant", email: "quinn@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 1000000 }
              as: SystemAdmin
              captures: { cand_q_id: $.data.id }
            - call: "POST /franchise/candidates/${cand_q_id}/applications"
              payload: { target_market_code: "GA" }
              as: Candidate
              as_user_id: "${cand_q_id}"
              captures: { app_q_id: $.data.id }
            - call: "POST /franchise/applications/${app_q_id}/advance"
              payload: {}
              as: FieldConsultant
            - call: "POST /franchise/applications/${app_q_id}/advance"
              payload: {}
              as: FieldConsultant
            - call: "POST /franchise/applications/${app_q_id}/interviews"
              payload: { interviewer_id: "fc-1", scheduled_for: "2026-09-02T00:00:00Z" }
              as: FieldConsultant
              captures: { iv_q_id: $.data.id }
          trigger:
            - call: "POST /franchise/applications/${app_q_id}/interviews/${iv_q_id}/score"
              payload: { score: 101 }
              as: FieldConsultant
              captures: { sc_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SCORE_OUT_OF_RANGE"
            - "InterviewRound.${iv_q_id}.status remains SCHEDULED"

      - name: terminal_state_lockdown_on_approved_application
        claim_type: Terminal State Lockdown
        grounds:
