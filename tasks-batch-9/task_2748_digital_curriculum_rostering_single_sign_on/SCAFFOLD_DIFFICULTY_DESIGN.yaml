  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict on DIFFERENT category pairs
  #   5a: state (priority 14) beats business_fiscal (priority 44).
  #   5b: business_temporal (priority 31) beats business_constraint (39).
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_app_account_create
        grounds:
          - validations[priority=14]
          - validations[priority=44]
          - errors[ERR_VENDOR_APP_NOT_ACTIVE]
          - errors[ERR_BUILDING_ALLOCATION_EXHAUSTED]
          - endpoints[POST /rostering/app-accounts]
        distinguishing_aspect: "Category pair STATE (priority 14, ERR_VENDOR_APP_NOT_ACTIVE) versus BUSINESS_FISCAL (priority 44, ERR_BUILDING_ALLOCATION_EXHAUSTED): the request simultaneously targets a SUSPENDED licence AND a building whose single allocated seat is already consumed, and the lower-numbered state check must win — the caller learns the licence is suspended, not that the building is out of seats."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ACTIVE ELEMENTARY building with exactly two ENROLLED students S1 and S2; Term Fall 2026 ACTIVE."
            - "An ACTIVE PER_STUDENT licence with total_seats 1, price_per_seat_cents 1000, PROPORTIONAL_HEADCOUNT and overage_policy BLOCK, so the single building holds 1 seat and there is no district pool to fall back on."
            - "S1 already provisioned, so BuildingAllocation.consumed_seats == 1 == allocated_seats: any further account in that building would violate the priority-44 fiscal check."
            - "The licence is then PATCHed to status SUSPENDED, so the priority-14 state check is ALSO violated by the same request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: IdentityAdmin
              as_user_id: "ia-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2002", first_name: "Priya", last_name: "Raman", grade_level: 4, date_of_birth: "2016-07-11" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s2_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 1, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_id: "$.data[0].id" }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v1: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_v1}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "PATCH /rostering/vendor-apps/${va_id}"
              payload: { status: "SUSPENDED" }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v2: $.data.version }
          trigger:
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s2_id}", expected_vendor_app_version: "${va_v2}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
          assert:
            - "the trigger fails with error_id ERR_VENDOR_APP_NOT_ACTIVE and HTTP 409 — the priority-14 state check, NOT ERR_BUILDING_ALLOCATION_EXHAUSTED from priority 44"
            - "the version in expected_vendor_app_version is current, so ERR_STALE_VENDOR_APP_VERSION (priority 8) is deliberately not in play"
            - "BuildingAllocation.${alloc_id}.consumed_seats is still 1 and allocated_seats is still 1"
            - "VendorApp.${va_id}.consumed_seats is still 1 and committed_charge_cents is still 1000"
            - "GET /rostering/app-accounts?student_id=${s2_id} returns 0 rows — nothing was created"
            - "GET /rostering/app-accounts?building_allocation_id=${alloc_id} returns exactly 1 row, AppAccount.${a1_id}"

      - name: temporal_beats_constraint_on_enrollment_create
        grounds:
          - validations[priority=31]
          - validations[priority=39]
          - errors[ERR_STUDENT_SCHEDULE_CONFLICT]
          - errors[ERR_SECTION_AT_CAPACITY]
          - endpoints[POST /rostering/enrollments]
        distinguishing_aspect: "A DIFFERENT category pair from 5a — BUSINESS_TEMPORAL (priority 31, ERR_STUDENT_SCHEDULE_CONFLICT) versus BUSINESS_CONSTRAINT (priority 39, ERR_SECTION_AT_CAPACITY): the target section is simultaneously full AND clashes with the student's existing period-3 enrollment, and the temporal overlap check must be reported."
        test_recipe:
          setup:
            - "Clock advanced to 2026-08-20T00:00:00Z so both enrollments requested for mid-August land ACTIVE immediately."
            - "One ACTIVE ELEMENTARY building; Term Fall 2026 ACTIVE; two ENROLLED students S1 and S2."
            - "SEC_A at period 3 (MON/WED/FRI) with teacher T_A and max_seats 5; S1 holds an ACTIVE enrollment in SEC_A effective 2026-08-15."
            - "SEC_B at period 3 (MON/WED) with primary_teacher_id omitted and max_seats 1, already filled by S2's ACTIVE enrollment, so active_enrollment_count == max_seats == 1."
            - "SEC_B shares period 3 and the MON/WED meeting days with SEC_A, so a second S1 enrollment breaks the priority-31 schedule rule at the same time as the priority-39 capacity rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
