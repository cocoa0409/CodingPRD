            - "Project.${proj}.milestone_state == PRECONSTRUCTION throughout — the gate is the substation's status, not the project's"

      - name: pile_driving_gated_on_grading_area_acceptance
        grounds:
          - validations[priority=10]
          - state_machines.GradingArea.GRADED_to_ACCEPTED
          - state_machines.Pile.PLANNED_to_ACCEPTED
          - state_machines.Block.PLANNED_to_PILES_COMPLETE
