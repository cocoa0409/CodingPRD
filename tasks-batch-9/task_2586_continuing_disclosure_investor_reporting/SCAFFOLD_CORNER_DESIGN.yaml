            - "${single_late} == 0, ${single_missed} == 0, ${single_delq} == 0 and ${list_total} == 1"
            - "${issue_open_events} == 1 — the issue-level derived counter agrees with the undertaking-level one on the notice half of the obligation count"

      - name: calendar_sweep_processes_every_due_row_once_and_is_idempotent
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/disclosure/calendar-sweeps
          - state_machines[AnnualReportCycle].DRAFTING->DELINQUENT
          - state_machines[MaterialEventNotice].MATERIAL->MISSED
          - calculations.undertaking_disclosure_risk_score
        distinguishing_aspect: >-
          The sweep is a bulk action with skip-not-fail semantics: it must move the two past-due
          cycles and the one past-deadline notice while leaving the not-yet-due cycle and the
          within-tolerance engagement untouched, and it must run the risk score ONCE per touched
          undertaking rather than once per row. A second sweep at the SAME clock must report all
          five counts as zero and — the harder half — must not re-escalate the score, which would
          happen if the tier multiplier were reapplied to an unchanged base.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue (final maturity 2056) with an ACTIVE Undertaking, a single 10000-bp OPERATING_DATA_TABLE requirement and three non-overlapping cycles: FY2024 (2023-07-01..2024-06-30, due 2025-01-27), FY2025 (2024-07-01..2025-06-30, due 2026-01-26) and FY2026 (2025-07-01..2026-06-30, due 2027-01-26)."
            - "One MATERIAL notice occurring 2026-07-13, whose ten-business-day deadline is 2026-07-27 — already past at the default clock."
            - "One ACTIVE engagement effective 2026-07-01, so its monitoring lapse is 31 days: inside the 45-day tolerance."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2023-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
