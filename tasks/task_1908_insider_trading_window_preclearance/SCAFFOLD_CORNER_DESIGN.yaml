# =============================================================================
# §1.9 Scaffold Corner Design — Task 1908 Insider Trading Window & Preclearance
# Breadth coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 that §1.8
# (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover. Sections and
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_covered_person_missing_required_designation
        claim_type: required_fields
        grounds: [entities.CoveredPerson.fields.designation, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "designation is source:input with no default — omitting it must fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /covered-persons"
              payload: { full_name: "No Desig", email: "nodesig@x.com", department: "Ops" }
              as: LegalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /covered-persons returns total_count == 0 (nothing persisted)"

      - name: covered_person_creation_applies_system_defaults
        claim_type: defaults
        grounds: [entities.CoveredPerson.fields.status, entities.CoveredPerson.fields.policy_ack_current, entities.CoveredPerson.fields.compliance_hold]
        distinguishing_aspect: "A freshly created person carries system defaults: status ACTIVE, all three computed flags false, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /covered-persons"
              payload: { full_name: "Fresh Person", email: "fresh@x.com", designation: "CONSULTANT", department: "Advisory" }
              as: LegalAdmin
              captures: { p_id: $.data.id, p_status: $.data.status, p_version: $.data.version }
          assert:
            - "p_status == ACTIVE"
            - "p_version == 1"
            - "CoveredPerson.${p_id}.policy_ack_current == false and training_current == false and compliance_hold == false"
            - "CoveredPerson.${p_id}.suspended_until == null"

      - name: covered_person_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.CoveredPerson.fields.designation, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "designation value CEO is outside {SECTION_16_OFFICER, DIRECTOR, EMPLOYEE, CONSULTANT} and must fail with ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /covered-persons"
              payload: { full_name: "Bad Enum", email: "badenum@x.com", designation: "CEO", department: "Exec" }
              as: LegalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_ENUM"

      - name: get_nonexistent_person_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed UUID that does not exist returns ERR_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /covered-persons/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LegalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_covered_persons_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and emits total_count and has_more per the fixed envelope; limit=2 over 3 rows yields has_more true and total_count 3."
        test_recipe:
          setup: ["three covered persons exist"]
          setup_api_calls:
            - call: "POST /covered-persons"
              payload: { full_name: "Pg One", email: "pg1@x.com", designation: "EMPLOYEE", department: "A" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Pg Two", email: "pg2@x.com", designation: "EMPLOYEE", department: "B" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Pg Three", email: "pg3@x.com", designation: "EMPLOYEE", department: "C" }
              as: LegalAdmin
          trigger:
            - call: "GET /covered-persons?limit=2&offset=0"
              payload: {}
              as: LegalAdmin
          assert:
            - "response contains exactly 2 data rows"
            - "total_count == 3 and has_more == true"
            - "a second call with limit=2&offset=2 returns 1 row and has_more == false"

      - name: restricted_entry_manual_create_defaults
        claim_type: defaults
        grounds: [entities.RestrictedListEntry.fields.source, entities.RestrictedListEntry.fields.status, entities.RestrictedListEntry.fields.deal_id]
        distinguishing_aspect: "Manual creation defaults source=MANUAL, status=ACTIVE, deal_id=null; omitted note stays null."
        test_recipe:
          setup: ["officer exists"]
          setup_api_calls:
            - call: "POST /covered-persons"
              payload: { full_name: "Officer C1", email: "officer_c1@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
          trigger:
            - call: "POST /restricted-list-entries"
              payload: { security_ticker: "DELTA" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { entry_id: $.data.id, entry_source: $.data.source, entry_status: $.data.status }
          assert:
            - "entry_source == MANUAL and entry_status == ACTIVE"
            - "RestrictedListEntry.${entry_id}.deal_id == null and note == null"

      - name: computed_currency_flags_after_attestation_completion
        claim_type: computed_fields
        grounds: [entities.CoveredPerson.fields.policy_ack_current, entities.CoveredPerson.fields.training_current, calculations.attestation_currency]
        distinguishing_aspect: "policy_ack_current and training_current are computed from completed Attestations — completing both flips both flags to true without any direct write to the person."
        test_recipe:
          setup: ["clock at 2026-08-01T00:00:00Z; person created with both flags false"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Compute Me", email: "compute@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { ack_flag: $.data.policy_ack_current, trn_flag: $.data.training_current }
          assert:
            - "ack_flag == true and trn_flag == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: preclearance_decision_before_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PreclearanceRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decision is only declared from UNDER_REVIEW; calling it on a SUBMITTED request fails with ERR_INVALID_STATE and leaves status SUBMITTED."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; insider policy/training current; SUBMITTED request exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer S1", email: "officer_s1@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider S1", email: "insider_s1@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10, proposed_trade_date: "2026-08-20T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id, req_v1: $.data.version }
          trigger:
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v1}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PreclearanceRequest.${req_id}.status == SUBMITTED"

      - name: withdraw_terminal_request_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.PreclearanceRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DENIED is terminal; withdraw on a DENIED request fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; insider policy/training current; request DENIED via decision"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer S2", email: "officer_s2@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider S2", email: "insider_s2@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10, proposed_trade_date: "2026-08-20T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "DENY", denial_reason: "OFFICER_DISCRETION", expected_preclearance_version: "${req_v2}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /preclearance-requests/${req_id}/withdraw"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PreclearanceRequest.${req_id}.status == DENIED and denial_reason == OFFICER_DISCRETION"

      - name: double_decision_second_attempt_rejected
        claim_type: idempotency
        grounds: [state_machines.PreclearanceRequest.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the same APPROVE trigger against the now-APPROVED request fails with ERR_INVALID_STATE — the transition fires exactly once."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; insider policy/training current; request APPROVED (version advanced past review version)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer S3", email: "officer_s3@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider S3", email: "insider_s3@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10, proposed_trade_date: "2026-08-20T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v2}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v3: $.data.version }
          trigger:
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v3}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PreclearanceRequest.${req_id}.status == APPROVED (unchanged)"

      - name: attestation_late_completion_from_overdue
        claim_type: valid_transition
        grounds: [state_machines.Attestation.OVERDUE_to_COMPLETED, state_machines.Attestation.ASSIGNED_to_OVERDUE]
        distinguishing_aspect: "An OVERDUE attestation can still be completed late; completion restores training_current to true."
        test_recipe:
          setup: ["person with ANNUAL_TRAINING due 2026-08-02T00:00:00Z; clock advanced to 2026-08-03 and sweep has flipped it OVERDUE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Late Learner", email: "late@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Officer S4", email: "officer_s4@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-08-02T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
              captures: { final_status: $.data.status }
          assert:
            - "Attestation.${trn_id} was OVERDUE before completion (sweep at 2026-08-03 with due_date 2026-08-02 < now)"
            - "final_status == COMPLETED and Attestation.${trn_id}.completed_at == 2026-08-03T00:00:00Z"
            - "CoveredPerson.${p_id}.training_current == true after late completion"

      - name: exception_withdraw_by_owner
        claim_type: valid_transition
        grounds: [state_machines.ExceptionRequest.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "Owner withdraw moves SUBMITTED -> WITHDRAWN and blocks further votes (subsequent vote hits ERR_INVALID_STATE, covered by state preconditions)."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; requester; SUBMITTED exception exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Requester W", email: "requester_w@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { requester_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { covered_person_id: "${requester_id}", security_ticker: "ACME", quantity: 100, hardship_reason: "relocation" }
              as: Insider
              as_user_id: "${requester_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /exception-requests/${ex_id}/withdraw"
              payload: {}
              as: Insider
              as_user_id: "${requester_id}"
              captures: { final_status: $.data.status }
          assert:
            - "final_status == WITHDRAWN"
            - "ExceptionRequest.${ex_id}.votes_for == 0 and votes_against == 0"

      - name: plan_terminate_draft_by_owner
        claim_type: valid_transition
        grounds: [state_machines.TenB5Plan.DRAFT_to_TERMINATED]
        distinguishing_aspect: "The owning Insider may TERMINATE a DRAFT plan; the response shows TERMINATED."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; owner policy/training current; DRAFT plan exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Plan Owner", email: "planowner@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { p_v: $.data.version }
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${p_id}", security_ticker: "ACME", total_quantity: 100, first_trade_date: "2026-09-01T00:00:00Z", expected_covered_person_version: "${p_v}" }
              as: Insider
              as_user_id: "${p_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /tenb5-plans/${plan_id}/action"
              payload: { action: "TERMINATE" }
              as: Insider
              as_user_id: "${p_id}"
              captures: { final_status: $.data.status }
          assert:
            - "final_status == TERMINATED"

      - name: deal_close_abandoned_cancels_scheduled_window
        claim_type: side_effect_execution
        grounds: [state_machines.Deal.ACTIVE_to_ABANDONED, state_machines.BlackoutWindow.SCHEDULED_to_CANCELLED, state_machines.RestrictedListEntry.ACTIVE_to_REMOVED]
        distinguishing_aspect: "Closing a deal with outcome ABANDONED cascades: deal-sourced SCHEDULED event window -> CANCELLED and deal-sourced restricted entry -> REMOVED (DEAL_CLOSED)."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; ACTIVE deal with event window [2026-08-10, 2026-08-14) and DEAL_INTAKE entry for GAMMA"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer S5", email: "officer_s5@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /deals"
              payload: { codename: "PROJECTGAMMA", deal_type: "DIVESTITURE", security_ticker: "GAMMA", event_blackout_start: "2026-08-10T00:00:00Z", event_blackout_end: "2026-08-14T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "GET /deals/${deal_id}/restricted-list-entries"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
