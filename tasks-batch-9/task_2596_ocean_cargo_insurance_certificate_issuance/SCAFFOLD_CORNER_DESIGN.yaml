      - name: zero_computed_base_declaration_reports_a_full_hundred_percent_variance
        claim_type: correct_result
        grounds:
          - calculations.declaration_premium_reconciliation
          - state_machines.PremiumDeclaration.status.UNDER_AUDIT_to_ADJUSTED
          - state_machines.OpenPolicy.status.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Division by a zero computed base is resolved by convention, not by
          arithmetic: declaring 100.00 against an empty period yields
          variance_amount 100.00 and variance_pct exactly
          ZERO_BASE_VARIANCE_PCT (100.00), which is above both the 2.5%
          tolerance and the 10% suspension threshold, so one finish-audit both
          ADJUSTS the declaration (audit_adjustment_amount 100.00) and SUSPENDS
          the policy. Declaring 0.00 against the same empty base is the special
          case that yields 0.00 / 0.00 instead of an error or a NaN, and the two
          adjacent periods prove the half-open overlap rule accepts a period
          starting exactly at another's end.
        test_recipe:
          setup:
            - "one ACTIVE OpenPolicy with no certificates at all"
            - "two adjacent declarations: [2026-02-01, 2026-03-01) and [2026-03-01, 2026-04-01)"
          setup_api_calls:
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-EMPTY", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /premium-declarations"
              payload: { open_policy_id: "${pol_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { decl_a_id: $.data.id }
            - call: "POST /premium-declarations"
              payload: { open_policy_id: "${pol_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { decl_b_id: $.data.id }
          trigger:
            - call: "POST /premium-declarations/${decl_a_id}/submit"
              payload: { declared_premium_total: 100.00 }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { a_computed: $.data.computed_premium_total, a_var: $.data.variance_amount, a_pct: $.data.variance_pct }
            - call: "POST /premium-declarations/${decl_b_id}/submit"
              payload: { declared_premium_total: 0.00 }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { b_var: $.data.variance_amount, b_pct: $.data.variance_pct }
            - call: "POST /premium-declarations/${decl_a_id}/start-audit"
              payload: {}
              as: PremiumAuditor
              as_user_id: "auditor-1"
            - call: "POST /premium-declarations/${decl_a_id}/finish-audit"
              payload: { audit_note: "no certificates issued in the period" }
              as: PremiumAuditor
              as_user_id: "auditor-1"
              captures: { a_status: $.data.status, a_adj: $.data.audit_adjustment_amount }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
          assert:
            - "POST /premium-declarations for the adjacent period returned 201 — a period starting exactly at another's period_end does not overlap"
            - "${a_computed} == 0.00 and ${a_var} == 100.00 and ${a_pct} == 100.00 (ZERO_BASE_VARIANCE_PCT, not a division error)"
            - "${b_var} == 0.00 and ${b_pct} == 0.00 — declaring nothing against nothing is a perfect match"
            - "PremiumDeclaration.${decl_a_id}.certificate_count == 0"
            - "${a_status} == \"ADJUSTED\" and ${a_adj} == 100.00"
            - "OpenPolicy.${pol_id}.status == \"SUSPENDED\" — 100.00% is above DECLARATION_SUSPENSION_PCT"
            - "OpenPolicy.${pol_id}.aggregate_premium_booked == 0.00 — an audit adjustment is never booked onto the policy"

      - name: claim_below_the_deductible_floors_at_zero_and_settles_at_zero
        claim_type: correct_result
        grounds:
          - calculations.claim_adjusted_amount
          - state_machines.ClaimFile.status.OPENED_to_ADJUSTED
          - state_machines.ClaimFile.status.ADJUSTED_to_SETTLED
        distinguishing_aspect: |
          A loss smaller than the deductible must clamp at zero without going
          negative, and the deductible actually consumed is the loss itself, not
          the full deductible: damage_percentage 0.10 on insured 1155000.00 is a
          gross loss of 1155.00, so adjusted_amount is 0.00 and
          deductible_applied_amount is 1155.00 (min(2500.00, 1155.00)) — not
          -1345.00 and not 2500.00. The claim still travels the full
          OPENED -> ADJUSTED -> SETTLED path with settled_amount 0.00, which
          proves settlement is not gated on a positive indemnity.
        test_recipe:
          setup:
            - "one ISSUED certificate: insured 1155000.00, deductible pinned at 2500.00"
            - "one ClaimFile with claimed_amount 1155.00 (below survey_required_above_amount 500000) and damage_percentage 0.10"
            - "all three mandatory document types logged so documentation_complete is true"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
