# =============================================================================
# SCAFFOLD — Net Metering Interconnection Application Processing
# Utility interconnection desk: intake/completeness, eligibility, technical
# screens & supplemental review, upgrade cost estimates, PTO, bidirectional
# meter exchange, credit banking & annual true-up, capacity-cap queue.
# =============================================================================

scenario: |
  Net Metering Interconnection Application Processing (utility interconnection desk): application intake & completeness screening, system size vs load eligibility, technical screen & supplemental review triggers, utility upgrade cost estimate & customer acceptance, permission-to-operate after inspection, bidirectional meter installation, credit banking & annual true-up, capacity-cap queue position

domain_name: net-metering-interconnection
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: program_status, type: enum, source: system, description: "OPEN | CAP_REACHED | SUSPENDED | CLOSED", default: OPEN }
      - { name: aggregate_cap_watts, type: integer, source: input, description: "Program-wide net-metering capacity cap in watts AC", constraints: "> 0" }
      - { name: metering_variant, type: enum, source: input, description: "ENERGY_BANKING | MONETARY_CREDIT — selects monthly netting variant (calculations.monthly_netting)" }
      - { name: true_up_mode, type: enum, source: input, description: "AVOIDED_COST_PAYOUT | BANK_ROLLOVER — selects annual true-up variant (calculations.annual_true_up)" }
      - { name: true_up_month, type: integer, source: input, description: "Reconciliation anchor month, 1-12; year-Y window covers [Y-tum-01, (Y+1)-tum-01)" }
      - { name: screening_basis, type: enum, source: input, description: "COMMITTED | INCLUDE_QUEUED — aggregate basis for technical screens" }
      - { name: bank_cap_wh, type: integer, source: input, description: "kWh-bank cap in Wh for BANK_ROLLOVER true-up forfeiture; null = unlimited", constraints: ">= 0 or null", default: null }
      - { name: interconnected_watts, type: integer, source: computed, description: "Sum of system_size_watts_ac of applications that reached PTO_GRANTED/OPERATING", default: 0 }
      - { name: reserved_watts, type: integer, source: computed, description: "Sum of capacity_reserved_watts over applications holding a reservation", default: 0 }
      - { name: available_capacity_watts, type: integer, source: computed, description: "aggregate_cap_watts - interconnected_watts - reserved_watts", default: 0 }
      - { name: queued_count, type: integer, source: computed, description: "Count of applications in WAITING_FOR_CAPACITY", default: 0 }

  - name: TariffSchedule
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: schedule_code, type: string, source: input, description: "Human-readable tariff code" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive), half-open interval" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); null = open-ended", default: null }
      - { name: import_rate_millicents_per_kwh, type: integer, source: input, description: "Import energy rate, millicents per kWh", constraints: "> 0" }
      - { name: export_rate_millicents_per_kwh, type: integer, source: input, description: "Export surplus credit rate, millicents per kWh (MONETARY_CREDIT variant)", constraints: "> 0" }
      - { name: net_surplus_rate_millicents_per_kwh, type: integer, source: input, description: "Net surplus compensation rate for annual true-up, millicents per kWh", constraints: "> 0" }

  - name: Feeder
    parent: null
    common_fields: true
    fields:
      - { name: feeder_code, type: string, source: input, description: "Unique feeder code", constraints: "unique" }
      - { name: peak_load_watts, type: integer, source: input, description: "Annual peak load in watts", constraints: "> 0" }
      - { name: pre_existing_der_watts, type: integer, source: input, description: "Legacy DER already on feeder before this system", default: 0, constraints: ">= 0" }
      - { name: aggregate_der_watts, type: integer, source: computed, description: "pre_existing_der_watts + reserved + interconnected watts of applications on this feeder", default: 0 }

  - name: ServiceTransformer
    parent: null
    common_fields: true
    fields:
      - { name: feeder_id, type: string, source: input, description: "FK -> Feeder.id; upstream feeder" }
      - { name: transformer_code, type: string, source: input, description: "Unique transformer code", constraints: "unique" }
      - { name: nameplate_watts, type: integer, source: input, description: "Nameplate capacity in watts", constraints: "> 0" }
      - { name: pre_existing_der_watts, type: integer, source: input, description: "Legacy DER already on transformer", default: 0, constraints: ">= 0" }
      - { name: aggregate_der_watts, type: integer, source: computed, description: "pre_existing_der_watts + reserved + interconnected watts of applications on this transformer", default: 0 }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; account holder (Applicant identity anchor)" }
      - { name: transformer_id, type: string, source: input, description: "FK -> ServiceTransformer.id; serving transformer (also determines feeder)" }
      - { name: account_number, type: string, source: input, description: "Utility account number", constraints: "unique" }
      - { name: service_class, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL — drives class size cap" }
      - { name: prior_annual_usage_wh, type: integer, source: input, description: "Prior 12-month consumption in Wh; eligibility baseline", constraints: ">= 0" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED (independent dimension)", default: ACTIVE }
      - { name: metering_status, type: enum, source: system, description: "STANDARD | NET_METERING (independent dimension; NET_METERING set at PTO)", default: STANDARD }
      - { name: meter_serial, type: string, source: system, description: "Installed bidirectional meter serial; null until exchange completed", default: null }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over all CreditLedgerEntry rows for this account", default: 0 }
      - { name: banked_wh, type: integer, source: computed, description: "Sum of quantity_wh over BANK_DEPOSIT + BANK_DRAW + BANK_FORFEIT ledger entries", default: 0 }

  - name: InterconnectionApplication
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: technology, type: enum, source: input, description: "SOLAR_PV | WIND | FUEL_CELL" }
      - { name: system_size_watts_ac, type: integer, source: input, description: "Nameplate AC capacity in watts", constraints: "> 0" }
      - { name: estimated_annual_production_wh, type: integer, source: input, description: "Estimated annual production in Wh", constraints: "> 0" }
      - { name: application_status, type: enum, source: system, description: "DRAFT | PENDING_COMPLETENESS | INCOMPLETE | WAITING_FOR_CAPACITY | CAPACITY_RESERVED | SUPPLEMENTAL_REVIEW | SCREEN_PASSED | AWAITING_COST_ESTIMATE | CUSTOMER_DECISION_PENDING | UPGRADE_IN_PROGRESS | PTO_GRANTED | OPERATING | WITHDRAWN | DENIED", default: DRAFT }
      - { name: denial_reason, type: enum, source: system, description: "PRODUCTION_EXCEEDS_LOAD | SIZE_EXCEEDS_CLASS_CAP | TECHNICALLY_INFEASIBLE; null unless DENIED", default: null }
      - { name: withdrawal_reason, type: enum, source: system, description: "APPLICANT_WITHDRAWN | CUSTOMER_DECLINED | ESTIMATE_EXPIRED | RESERVATION_EXPIRED; null unless WITHDRAWN", default: null }
      - { name: queue_position, type: integer, source: system, description: "1-based position among WAITING_FOR_CAPACITY applications of the program; null when not queued", default: null }
      - { name: capacity_reserved_watts, type: integer, source: system, description: "Watts currently reserved under this application; 0 when none", default: 0 }
      - { name: reservation_expires_at, type: datetime, source: system, description: "reserved_at + 180 days; null when no reservation", default: null }
      - { name: submission_round, type: integer, source: system, description: "Number of times submitted; increments on each resubmission", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of most recent submit", default: null }
      - { name: pto_granted_at, type: datetime, source: system, description: "Timestamp of PTO grant", default: null }

  - name: ApplicationDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: doc_type, type: enum, source: input, description: "SITE_PLAN | SINGLE_LINE_DIAGRAM | INSURANCE_CERTIFICATE" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: review_status, type: enum, source: system, description: "UPLOADED | ACCEPTED | REJECTED", default: UPLOADED }
      - { name: review_note, type: string, source: system, description: "Reviewer note", default: null }

  - name: ScreeningReport
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: screening_round, type: integer, source: system, description: "1 + count of prior reports for this application" }
      - { name: report_status, type: enum, source: system, description: "CURRENT | SUPERSEDED", default: CURRENT }
      - { name: aggregate_basis, type: enum, source: system, description: "COMMITTED | INCLUDE_QUEUED — copied from program at compute time" }
      - { name: transformer_aggregate_after_watts, type: integer, source: computed, description: "Basis aggregate on transformer + this application's size" }
      - { name: transformer_limit_watts, type: integer, source: computed, description: "floor(nameplate_watts * 50 / 100)" }
      - { name: transformer_screen_passed, type: boolean, source: computed, description: "transformer_aggregate_after_watts <= transformer_limit_watts" }
      - { name: feeder_aggregate_after_watts, type: integer, source: computed, description: "Basis aggregate on feeder + this application's size" }
      - { name: feeder_limit_watts, type: integer, source: computed, description: "floor(peak_load_watts * 15 / 100)" }
      - { name: feeder_screen_passed, type: boolean, source: computed, description: "feeder_aggregate_after_watts < feeder_limit_watts (strict)" }
      - { name: size_within_fast_track, type: boolean, source: computed, description: "system_size_watts_ac <= 2000000" }
      - { name: outcome, type: enum, source: computed, description: "PASSED | FAILED (FAILED iff any screen failed)" }
      - { name: failing_screens, type: array, source: computed, description: "Ordered subset of [TRANSFORMER_CAPACITY, FEEDER_PENETRATION, FAST_TRACK_SIZE]" }

  - name: SupplementalReview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: review_type, type: enum, source: input, description: "FACILITIES_STUDY | SYSTEM_IMPACT_STUDY" }
      - { name: review_status, type: enum, source: system, description: "OPEN | COMPLETED | CLOSED", default: OPEN }
      - { name: outcome, type: enum, source: system, description: "CLEARED | UPGRADES_REQUIRED | DENIED; null until completed", default: null }
      - { name: findings, type: string, source: input, description: "Engineering findings narrative", default: null }

  - name: UpgradeCostEstimate
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: supplemental_review_id, type: string, source: input, description: "FK -> SupplementalReview.id; review that required upgrades" }
      - { name: items, type: array, source: input, description: "Array of {description: string, amount_cents: integer >= 0}" }
      - { name: contingency_pct, type: integer, source: input, description: "Contingency percentage 0-100" }
      - { name: total_cents, type: integer, source: computed, description: "round_half_up(sum(items.amount_cents) * (100 + contingency_pct) / 100)" }
      - { name: estimate_status, type: enum, source: system, description: "ISSUED | ACCEPTED | WORK_COMPLETE | DECLINED | EXPIRED | SUPERSEDED | CANCELLED", default: ISSUED }
      - { name: valid_until, type: datetime, source: system, description: "created_at + 30 days; acceptance allowed while now <= valid_until" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of accept/decline", default: null }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled inspection instant; must be >= current clock time" }
      - { name: inspection_status, type: enum, source: system, description: "SCHEDULED | RESULT_RECORDED | CANCELLED", default: SCHEDULED }
      - { name: outcome, type: enum, source: system, description: "PASSED | FAILED; null until recorded", default: null }
      - { name: occurred_at, type: datetime, source: input, description: "Actual inspection instant; must satisfy scheduled_date <= occurred_at <= now" }
      - { name: defects, type: string, source: input, description: "Defect narrative; required iff outcome == FAILED", default: null }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the Inspector who recorded the result", default: null }

  - name: MeterExchange
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> InterconnectionApplication.id" }
      - { name: crew_id, type: string, source: input, description: "Meter crew identifier (buffer-overlap resource)" }
      - { name: window_start, type: datetime, source: input, description: "Appointment window start" }
      - { name: window_end, type: datetime, source: input, description: "Appointment window end; must be > window_start" }
      - { name: exchange_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | FAILED | CANCELLED", default: SCHEDULED }
      - { name: installed_meter_serial, type: string, source: system, description: "Bidirectional meter serial recorded at completion", default: null }
      - { name: technician_user_id, type: string, source: system, description: "X-User-ID of the MeterTechnician who completed the exchange", default: null }
      - { name: fail_reason, type: string, source: system, description: "Failure reason recorded on fail", default: null }

  - name: MeterReading
    parent: null
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive), half-open" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (exclusive); must be > period_start" }
      - { name: import_wh, type: integer, source: input, description: "Energy imported from grid in Wh", constraints: ">= 0" }
      - { name: export_wh, type: integer, source: input, description: "Energy exported to grid in Wh", constraints: ">= 0" }
      - { name: reading_status, type: enum, source: system, description: "POSTED | SUPERSEDED | VOIDED", default: POSTED }
      - { name: tariff_id, type: string, source: system, description: "FK -> TariffSchedule.id; tariff effective at period_start used for netting" }
      - { name: bill_cents, type: integer, source: computed, description: "Customer bill for the period per calculations.monthly_netting", default: 0 }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Banked credit consumed by this bill (MONETARY_CREDIT)", default: 0 }
      - { name: bank_drawn_wh, type: integer, source: computed, description: "kWh-bank energy drawn (ENERGY_BANKING)", default: 0 }
      - { name: bank_deposited_wh, type: integer, source: computed, description: "Surplus energy banked (ENERGY_BANKING)", default: 0 }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id" }
      - { name: meter_reading_id, type: string, source: system, description: "FK -> MeterReading.id; null for true-up entries" }
      - { name: annual_reconciliation_id, type: string, source: system, description: "FK -> AnnualReconciliation.id; null for reading entries" }
      - { name: entry_type, type: enum, source: system, description: "EXPORT_SURPLUS_CREDIT | CREDIT_APPLIED | BANK_DEPOSIT | BANK_DRAW | BANK_FORFEIT | TRUE_UP_PAYOUT | TRUE_UP_FORFEIT | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; credit-positive, debit-negative; 0 for pure energy-bank entries" }
      - { name: quantity_wh, type: integer, source: system, description: "Signed Wh for energy-bank entries and NSC tracking; 0 when not applicable" }
      - { name: posted_at, type: datetime, source: system, description: "Logical clock time of posting" }

  - name: AnnualReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: reconciliation_year, type: integer, source: input, description: "Anchor year Y; window covers [Y-tum-01, (Y+1)-tum-01)" }
      - { name: reconciliation_status, type: enum, source: system, description: "COMPUTED | SETTLED | VOIDED", default: COMPUTED }
      - { name: window_start, type: datetime, source: computed, description: "(Y, true_up_month, 1)" }
      - { name: window_end, type: datetime, source: computed, description: "(Y+1, true_up_month, 1)" }
      - { name: surplus_wh, type: integer, source: computed, description: "Sum of max(0, export_wh - import_wh) over POSTED readings with period_start in window" }
      - { name: credit_balance_at_compute_cents, type: integer, source: computed, description: "Account credit_balance_cents at computation" }
      - { name: nsc_cents, type: integer, source: computed, description: "round_half_up(surplus_wh * net_surplus_rate_millicents_per_kwh / 1000000) using tariff effective at computation time" }
      - { name: payout_cents, type: integer, source: computed, description: "AVOIDED_COST_PAYOUT: min(credit_balance_at_compute_cents, nsc_cents); else 0" }
      - { name: forfeited_cents, type: integer, source: computed, description: "AVOIDED_COST_PAYOUT: credit_balance_at_compute_cents - payout_cents; else 0" }
      - { name: forfeited_wh, type: integer, source: computed, description: "BANK_ROLLOVER: max(0, banked_wh - bank_cap_wh); else 0" }
      - { name: tariff_id, type: string, source: system, description: "FK -> TariffSchedule.id; tariff effective at computation time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    field: program_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CAP_REACHED
        trigger: "system (after any reservation event leaves available_capacity_watts <= 0)"
        actor: system
        preconditions: ["available_capacity_watts <= 0 after the mutation"]
        side_effects: ["Blocks nothing by itself; posture visible to clients"]
      - from: CAP_REACHED
        to: OPEN
        trigger: "system (after any release event leaves available_capacity_watts > 0)"
        actor: system
        preconditions: ["available_capacity_watts > 0 after the mutation"]
        side_effects: []
      - from: [OPEN, CAP_REACHED]
        to: SUSPENDED
        trigger: "POST /programs/{program_id}/suspend"
        actor: ProgramAdministrator
        preconditions: []
        side_effects: ["New application submissions rejected while SUSPENDED"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /programs/{program_id}/resume"
        actor: ProgramAdministrator
        preconditions: []
        side_effects:
          - "Lands OPEN if available_capacity_watts > 0 else CAP_REACHED (posture recompute)"
      - from: [OPEN, CAP_REACHED, SUSPENDED]
        to: CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: ProgramAdministrator
        preconditions: ["No application of this program in a non-terminal status"]
        side_effects: []

  - entity: ServiceAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-accounts/{service_account_id}/suspend"
        actor: ProgramAdministrator
        preconditions: []
        side_effects: ["Submissions and meter readings rejected while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-accounts/{service_account_id}/reactivate"
        actor: ProgramAdministrator
        preconditions: []
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /service-accounts/{service_account_id}/close"
        actor: ProgramAdministrator
        preconditions: ["No non-terminal InterconnectionApplication references this account"]
        side_effects: []

  - entity: ServiceAccount
    field: metering_status
    initial_state: STANDARD
    terminal_states: []
    transitions:
      - from: STANDARD
        to: NET_METERING
        trigger: "system (PTO granted on an application of this account)"
        actor: system
        preconditions: []
        side_effects: ["Meter readings accepted for this account from this point on"]
    note: "metering_status evolves independently of account_status (parallel dimensions): an account may be SUSPENDED while NET_METERING."

  - entity: InterconnectionApplication
    field: application_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DENIED, OPERATING]
    transitions:
      - from: DRAFT
        to: PENDING_COMPLETENESS
        trigger: "POST /applications/{application_id}/submit"
        actor: Applicant
        preconditions:
          - "Program of the application has program_status IN {OPEN, CAP_REACHED}"
          - "ServiceAccount.account_status == ACTIVE"
          - "No other non-terminal application exists for the same service_account_id"
        side_effects: ["submitted_at = now; submission_round = 1"]
      - from: INCOMPLETE
        to: PENDING_COMPLETENESS
        trigger: "POST /applications/{application_id}/submit (resubmission)"
        actor: Applicant
        preconditions:
          - "Program of the application has program_status IN {OPEN, CAP_REACHED}"
          - "ServiceAccount.account_status == ACTIVE"
        side_effects: ["submitted_at = now; submission_round += 1"]
      - from: PENDING_COMPLETENESS
        to: INCOMPLETE
        trigger: "POST /applications/{application_id}/completeness-decision outcome=INCOMPLETE"
        actor: InterconnectionCoordinator
        preconditions: ["At least one ApplicationDocument of this application has review_status == REJECTED"]
        side_effects: ["deficiency note retained on the decision"]
      - from: PENDING_COMPLETENESS
        to: DENIED
        trigger: "POST /applications/{application_id}/completeness-decision outcome=COMPLETE (eligibility fails)"
        actor: InterconnectionCoordinator
        preconditions:
          - "Required document set all ACCEPTED (else ERR_INCOMPLETE_DOCUMENTS)"
          - "system_size_watts_ac > class cap, OR estimated_annual_production_wh > floor(prior_annual_usage_wh * 110 / 100)"
        side_effects: ["denial_reason = SIZE_EXCEEDS_CLASS_CAP (size checked first) else PRODUCTION_EXCEEDS_LOAD"]
      - from: PENDING_COMPLETENESS
        to: CAPACITY_RESERVED
        trigger: "POST /applications/{application_id}/completeness-decision outcome=COMPLETE (eligible, capacity fits)"
        actor: InterconnectionCoordinator
        preconditions:
          - "Required document set all ACCEPTED"
          - "Eligibility passes"
          - "program.available_capacity_watts >= system_size_watts_ac"
        side_effects:
          - "capacity_reserved_watts = system_size_watts_ac; reservation_expires_at = now + 180 days"
          - "program.reserved_watts += system_size_watts_ac; transformer.feeder aggregate_der_watts += system_size_watts_ac"
          - "program posture recompute (OPEN -> CAP_REACHED if available hits <= 0)"
      - from: PENDING_COMPLETENESS
        to: WAITING_FOR_CAPACITY
        trigger: "POST /applications/{application_id}/completeness-decision outcome=COMPLETE (eligible, capacity short)"
        actor: InterconnectionCoordinator
        preconditions:
          - "Required document set all ACCEPTED"
          - "Eligibility passes"
          - "program.available_capacity_watts < system_size_watts_ac"
        side_effects: ["queue_position = max(existing queue_position of program) + 1 (1 if none); program.queued_count += 1"]
      - from: WAITING_FOR_CAPACITY
        to: CAPACITY_RESERVED
        trigger: "system (queue promotion scan after capacity release, sweep, or amend decrease)"
        actor: system
        preconditions: ["At scan turn (queue_position ASC): program.available_capacity_watts >= system_size_watts_ac"]
        side_effects:
          - "capacity_reserved_watts = system_size_watts_ac; reservation_expires_at = now + 180 days; queue_position = null"
          - "program.reserved_watts += size; transformer/feeder aggregate_der_watts += size; queued_count -= 1"
          - "Remaining queued applications with higher queue_position renumber down (gap closed)"
          - "program posture recompute"
      - from: CAPACITY_RESERVED
        to: SCREEN_PASSED
        trigger: "POST /screening-reports (all screens pass)"
        actor: DistributionEngineer
        preconditions: ["ScreeningReport outcome == PASSED"]
        side_effects: ["Report created CURRENT; prior CURRENT reports -> SUPERSEDED"]
      - from: CAPACITY_RESERVED
        to: SUPPLEMENTAL_REVIEW
        trigger: "POST /screening-reports (any screen fails)"
        actor: DistributionEngineer
        preconditions: ["ScreeningReport outcome == FAILED"]
        side_effects: ["Report created CURRENT with failing_screens; prior CURRENT reports -> SUPERSEDED"]
      - from: SUPPLEMENTAL_REVIEW
        to: CAPACITY_RESERVED
        trigger: "POST /applications/{application_id}/amend (design revision)"
        actor: Applicant
        preconditions: ["Eligibility re-check passes on amended values; capacity rule of amend satisfied"]
        side_effects:
          - "Open SupplementalReviews -> CLOSED; CURRENT ScreeningReports -> SUPERSEDED"
          - "Reservation adjusted to new size (increase needs available >= delta, else release-and-requeue; decrease frees capacity and triggers promotion scan)"
      - from: SUPPLEMENTAL_REVIEW
        to: SCREEN_PASSED
        trigger: "POST /supplemental-reviews/{supplemental_review_id}/complete outcome=CLEARED"
        actor: DistributionEngineer
        preconditions: ["Review is OPEN"]
        side_effects: ["review_status -> COMPLETED, outcome = CLEARED"]
      - from: SUPPLEMENTAL_REVIEW
        to: AWAITING_COST_ESTIMATE
        trigger: "POST /supplemental-reviews/{supplemental_review_id}/complete outcome=UPGRADES_REQUIRED"
        actor: DistributionEngineer
        preconditions: ["Review is OPEN"]
        side_effects: ["review_status -> COMPLETED, outcome = UPGRADES_REQUIRED"]
      - from: SUPPLEMENTAL_REVIEW
        to: DENIED
        trigger: "POST /supplemental-reviews/{supplemental_review_id}/complete outcome=DENIED"
        actor: DistributionEngineer
        preconditions: ["Review is OPEN"]
        side_effects:
          - "denial_reason = TECHNICALLY_INFEASIBLE; review COMPLETED"
          - "Reservation released: program.reserved_watts -= capacity_reserved_watts; transformer/feeder aggregates -= size; capacity_reserved_watts = 0; reservation_expires_at = null"
          - "Release triggers queue promotion scan + posture recompute"
      - from: AWAITING_COST_ESTIMATE
        to: CUSTOMER_DECISION_PENDING
        trigger: "POST /cost-estimates (OCC-guarded; supersedes any ISSUED estimate)"
        actor: DistributionEngineer
        preconditions: ["expected_application_version matches application.version"]
        side_effects: ["Estimate ISSUED with valid_until = now + 30 days; application.version incremented"]
      - from: CUSTOMER_DECISION_PENDING
        to: CUSTOMER_DECISION_PENDING
        trigger: "POST /cost-estimates (estimate revision)"
        actor: DistributionEngineer
        preconditions: ["expected_application_version matches application.version"]
        side_effects: ["Previously ISSUED estimate -> SUPERSEDED; new estimate ISSUED with valid_until = now + 30 days; application.version incremented"]
      - from: CUSTOMER_DECISION_PENDING
        to: UPGRADE_IN_PROGRESS
        trigger: "POST /cost-estimates/{cost_estimate_id}/accept"
        actor: Applicant
        preconditions: ["Estimate ISSUED; now <= estimate.valid_until"]
        side_effects: ["estimate_status -> ACCEPTED; decided_at = now"]
      - from: CUSTOMER_DECISION_PENDING
        to: WITHDRAWN
        trigger: "POST /cost-estimates/{cost_estimate_id}/decline, or system sweep (estimate expired)"
        actor: "Applicant or system"
        preconditions: ["Decline: estimate ISSUED. Sweep: estimate ISSUED and valid_until < now"]
        side_effects:
          - "estimate_status -> DECLINED (decline) or EXPIRED (sweep); withdrawal_reason = CUSTOMER_DECLINED or ESTIMATE_EXPIRED"
          - "Reservation released + queue promotion scan + posture recompute"
      - from: UPGRADE_IN_PROGRESS
        to: SCREEN_PASSED
        trigger: "POST /cost-estimates/{cost_estimate_id}/mark-work-complete"
        actor: DistributionEngineer
        preconditions: ["Estimate ACCEPTED"]
        side_effects: ["estimate_status -> WORK_COMPLETE"]
      - from: SCREEN_PASSED
        to: PTO_GRANTED
        trigger: "POST /applications/{application_id}/grant-pto"
        actor: InterconnectionCoordinator
        preconditions:
          - "ServiceAccount.account_status == ACTIVE"
          - "A MeterExchange with exchange_status == COMPLETED exists for this application"
          - "The latest Inspection (max created_at) has inspection_status == RESULT_RECORDED and outcome == PASSED"
          - "A TariffSchedule of the program is effective at now"
        side_effects:
          - "pto_granted_at = now"
          - "program.reserved_watts -= capacity_reserved_watts; program.interconnected_watts += capacity_reserved_watts (available_capacity_watts unchanged)"
          - "capacity_reserved_watts = 0; reservation_expires_at = null"
          - "ServiceAccount.metering_status STANDARD -> NET_METERING"
      - from: PTO_GRANTED
        to: OPERATING
        trigger: "system (first MeterReading transitions to POSTED for the account)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, PENDING_COMPLETENESS, INCOMPLETE, WAITING_FOR_CAPACITY, CAPACITY_RESERVED, SUPPLEMENTAL_REVIEW, SCREEN_PASSED, AWAITING_COST_ESTIMATE, CUSTOMER_DECISION_PENDING, UPGRADE_IN_PROGRESS]
        to: WITHDRAWN
        trigger: "POST /applications/{application_id}/withdraw, or system sweep (reservation expired)"
        actor: "Applicant or system"
        preconditions: ["Sweep path: application holds a reservation and reservation_expires_at < now"]
        side_effects:
          - "withdrawal_reason = APPLICANT_WITHDRAWN (manual) or RESERVATION_EXPIRED (sweep)"
          - "If queued: queue_position released; higher positions renumber down; queued_count -= 1"
          - "If reserved: program.reserved_watts -= capacity_reserved_watts; transformer/feeder aggregates -= size; capacity_reserved_watts = 0; reservation_expires_at = null; queue promotion scan + posture recompute"
          - "OPEN SupplementalReviews -> CLOSED; ISSUED UpgradeCostEstimates -> CANCELLED; SCHEDULED Inspections -> CANCELLED; SCHEDULED or FAILED MeterExchanges -> CANCELLED"
    note: "Withdrawal and PTO are forbidden from PTO_GRANTED and OPERATING (ERR_INVALID_STATE)."

  - entity: ApplicationDocument
    field: review_status
    initial_state: UPLOADED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: UPLOADED
        to: ACCEPTED
        trigger: "POST /documents/{document_id}/review outcome=ACCEPTED"
        actor: InterconnectionCoordinator
        preconditions: []
        side_effects: ["review_note stored"]
      - from: UPLOADED
        to: REJECTED
        trigger: "POST /documents/{document_id}/review outcome=REJECTED"
        actor: InterconnectionCoordinator
        preconditions: []
        side_effects: ["review_note stored; enables completeness-decision INCOMPLETE"]

  - entity: ScreeningReport
    field: report_status
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a newer ScreeningReport is created for the application, or the application is amended)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupplementalReview
    field: review_status
    initial_state: OPEN
    terminal_states: [COMPLETED, CLOSED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /supplemental-reviews/{supplemental_review_id}/complete"
        actor: DistributionEngineer
        preconditions: []
        side_effects: ["outcome stored; application transitions per outcome"]
      - from: OPEN
        to: CLOSED
        trigger: "system (application amended or withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UpgradeCostEstimate
    field: estimate_status
    initial_state: ISSUED
    terminal_states: [WORK_COMPLETE, DECLINED, EXPIRED, SUPERSEDED, CANCELLED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /cost-estimates/{cost_estimate_id}/accept"
        actor: Applicant
        preconditions: ["now <= valid_until"]
        side_effects: ["decided_at = now; application -> UPGRADE_IN_PROGRESS"]
      - from: ISSUED
        to: DECLINED
        trigger: "POST /cost-estimates/{cost_estimate_id}/decline"
        actor: Applicant
        preconditions: []
        side_effects: ["decided_at = now; application -> WITHDRAWN (CUSTOMER_DECLINED) with release cascade"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (program sweep: valid_until < now)"
        actor: system
        preconditions: []
        side_effects: ["application -> WITHDRAWN (ESTIMATE_EXPIRED) with release cascade"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a new estimate is created for the same application)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "system (application withdrawn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: WORK_COMPLETE
        trigger: "POST /cost-estimates/{cost_estimate_id}/mark-work-complete"
        actor: DistributionEngineer
        preconditions: []
        side_effects: ["application -> SCREEN_PASSED"]

  - entity: Inspection
    field: inspection_status
    initial_state: SCHEDULED
    terminal_states: [RESULT_RECORDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESULT_RECORDED
        trigger: "POST /inspections/{inspection_id}/record-result"
        actor: Inspector
        preconditions:
          - "inspector X-User-ID != technician_user_id of the application's completed MeterExchange (segregation of duties)"
          - "scheduled_date <= occurred_at <= now"
          - "defects present iff outcome == FAILED"
        side_effects: ["outcome, occurred_at, inspector_user_id stored"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{inspection_id}/cancel, or system (application withdrawn)"
        actor: "Applicant or system"
        preconditions: []
        side_effects: []

  - entity: MeterExchange
    field: exchange_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /meter-exchanges/{meter_exchange_id}/complete"
        actor: MeterTechnician
        preconditions: []
        side_effects:
          - "installed_meter_serial and technician_user_id (X-User-ID) stored"
          - "ServiceAccount.meter_serial = installed_meter_serial"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /meter-exchanges/{meter_exchange_id}/fail"
        actor: MeterTechnician
        preconditions: []
        side_effects: ["fail_reason stored"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /meter-exchanges/{meter_exchange_id}/reschedule"
        actor: MeterTechnician
        preconditions: ["New window_end > window_start", "Crew buffer-overlap check passes against other SCHEDULED exchanges of the same crew_id"]
        side_effects: ["window_start/window_end replaced; fail_reason cleared"]
      - from: [SCHEDULED, FAILED]
        to: CANCELLED
        trigger: "POST /meter-exchanges/{meter_exchange_id}/cancel, or system (application withdrawn)"
        actor: "MeterTechnician or system"
        preconditions: []
        side_effects: []

  - entity: MeterReading
    field: reading_status
    initial_state: POSTED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: POSTED
        to: SUPERSEDED
        trigger: "system (a new MeterReading is created for the same account with exactly equal period_start and period_end)"
        actor: system
        preconditions: []
        side_effects: ["REVERSAL ledger entries negate this reading's entries; balances recomputed"]
      - from: POSTED
        to: VOIDED
        trigger: "POST /meter-readings/{meter_reading_id}/void"
        actor: MeterTechnician
        preconditions: []
        side_effects: ["REVERSAL ledger entries negate this reading's entries; balances recomputed"]

  - entity: AnnualReconciliation
    field: reconciliation_status
    initial_state: COMPUTED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /annual-reconciliations/{annual_reconciliation_id}/finalize"
        actor: ProgramAdministrator
        preconditions: []
        side_effects:
          - "AVOIDED_COST_PAYOUT: TRUE_UP_PAYOUT entry -payout_cents if > 0; TRUE_UP_FORFEIT entry -forfeited_cents if > 0 (credit bank zeroed)"
          - "BANK_ROLLOVER: BANK_FORFEIT entry quantity_wh = -forfeited_wh if > 0"
          - "Account credit_balance_cents / banked_wh recomputed"
      - from: COMPUTED
        to: VOIDED
        trigger: "POST /annual-reconciliations/{annual_reconciliation_id}/void"
        actor: ProgramAdministrator
        preconditions: []
        side_effects: ["No ledger entries posted; frees the (account, year) slot for recomputation"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-application
    parent_entity: InterconnectionApplication
    write_endpoint: "POST /cost-estimates"
    occ_field: "expected_application_version"
    description: |
      Creating an UpgradeCostEstimate against an InterconnectionApplication whose
      version has advanced since the client last observed it is rejected. Creating
      a new estimate legitimately supersedes the currently ISSUED one, so a writer
      holding a stale application version must not be allowed to supersede on the
      basis of outdated state.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: reading-create-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /meter-readings"
    occ_field: "expected_account_version"
    description: |
      Creating a MeterReading against a ServiceAccount whose version has advanced
      since the client last observed it is rejected. Creating a reading with a
      period exactly equal to an existing POSTED reading legitimately supersedes
      it, so a writer holding a stale account version must not be allowed to
      supersede on the basis of outdated state.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_size_vs_load
    trigger: "completeness-decision outcome=COMPLETE (and re-checked on amend)"
    algorithm: threshold
    formula: |
      class_cap = CLASS_CAP_WATTS[service_account.service_class]
      if system_size_watts_ac > class_cap: DENIED with SIZE_EXCEEDS_CLASS_CAP (checked first)
      production_cap_wh = floor(prior_annual_usage_wh * SIZE_TO_LOAD_LIMIT_PCT / 100)
      if estimated_annual_production_wh > production_cap_wh: DENIED with PRODUCTION_EXCEEDS_LOAD
      Boundary: production exactly equal to production_cap_wh PASSES (<= semantics).
      prior_annual_usage_wh == 0 makes any positive production fail.
    constants:
      SIZE_TO_LOAD_LIMIT_PCT: 110
      CLASS_CAP_WATTS: { RESIDENTIAL: 25000, COMMERCIAL: 1000000, INDUSTRIAL: 5000000 }
    precision: "integer Wh arithmetic; floor on the percentage product"

  - name: program_capacity_ledger
    trigger: "reservation, release, promotion, PTO"
    algorithm: aggregation
    formula: |
      program.available_capacity_watts = aggregate_cap_watts - interconnected_watts - reserved_watts
      reserved_watts = sum of capacity_reserved_watts over applications of the program holding a reservation
      interconnected_watts = sum of system_size_watts_ac of applications in PTO_GRANTED or OPERATING
      queued_count = count of applications in WAITING_FOR_CAPACITY
      Posture: OPEN -> CAP_REACHED when available_capacity_watts <= 0 after a mutation;
               CAP_REACHED -> OPEN when available_capacity_watts > 0 after a mutation.
    input_set: "Applications of the program in all statuses; only reserved-holding and PTO'd applications contribute watts."
    precision: "integer watts"

  - name: screening_aggregate
    trigger: "POST /screening-reports"
    algorithm: aggregation
    formula: |
      committed_agg(node) = node.pre_existing_der_watts
          + sum(system_size_watts_ac of OTHER applications holding a reservation whose account sits on node)
          + sum(system_size_watts_ac of applications in PTO_GRANTED/OPERATING whose account sits on node)
      queued_agg(node) = sum(system_size_watts_ac of applications in WAITING_FOR_CAPACITY whose account sits on node)
      aggregate(node) = committed_agg(node)                       if program.screening_basis == COMMITTED
      aggregate(node) = committed_agg(node) + queued_agg(node)    if program.screening_basis == INCLUDE_QUEUED
      node = the application's ServiceAccount.transformer, and that transformer's feeder.
      The application being screened is EXCLUDED from committed_agg/queued_agg; its own
      system_size_watts_ac is added exactly once by transformer_screen / feeder_screen when
      computing aggregate_after. (Since the screened application holds a reservation, including
      it in committed_agg would double-count it.)
    input_set: "Reservation-holding statuses: CAPACITY_RESERVED, SUPPLEMENTAL_REVIEW, SCREEN_PASSED, AWAITING_COST_ESTIMATE, CUSTOMER_DECISION_PENDING, UPGRADE_IN_PROGRESS. Interconnected statuses: PTO_GRANTED, OPERATING. Queued: WAITING_FOR_CAPACITY."
    precision: "integer watts"
    variants:
      - name: COMMITTED
        when: "program.screening_basis == COMMITTED"
        difference: "WAITING_FOR_CAPACITY applications are excluded from the aggregate"
      - name: INCLUDE_QUEUED
        when: "program.screening_basis == INCLUDE_QUEUED"
        difference: "WAITING_FOR_CAPACITY applications are included; identical grid data can flip a screen from PASSED to FAILED"

  - name: transformer_screen
    trigger: "POST /screening-reports"
    algorithm: threshold
    formula: |
      transformer_limit_watts = floor(nameplate_watts * TRANSFORMER_LIMIT_PCT / 100)
      transformer_aggregate_after_watts = aggregate(transformer) + system_size_watts_ac
      transformer_screen_passed = (transformer_aggregate_after_watts <= transformer_limit_watts)   # inclusive
    constants:
      TRANSFORMER_LIMIT_PCT: 50
    precision: "integer watts"

  - name: feeder_screen
    trigger: "POST /screening-reports"
    algorithm: threshold
    formula: |
      feeder_limit_watts = floor(peak_load_watts * FEEDER_LIMIT_PCT / 100)
      feeder_aggregate_after_watts = aggregate(feeder) + system_size_watts_ac
      feeder_screen_passed = (feeder_aggregate_after_watts < feeder_limit_watts)   # STRICT: equality FAILS
    constants:
      FEEDER_LIMIT_PCT: 15
    precision: "integer watts"

  - name: fast_track_size_screen
    trigger: "POST /screening-reports"
    algorithm: threshold
    formula: |
      size_within_fast_track = (system_size_watts_ac <= FAST_TRACK_LIMIT_WATTS)   # inclusive
    constants:
      FAST_TRACK_LIMIT_WATTS: 2000000
    precision: "integer watts"

  - name: queue_position_assignment
    trigger: "application enters WAITING_FOR_CAPACITY; application leaves the queue"
    algorithm: chronological
    formula: |
      On entry: queue_position = max(queue_position over program's WAITING_FOR_CAPACITY applications) + 1, or 1 if none.
      On exit (promotion, withdrawal, expiry): every remaining queued application with
        queue_position > departed position has queue_position decremented by 1 (gap closed).
      Order is therefore the order in which applications entered the queue; ties are impossible
      because entry happens within a single request.
    precision: "integer positions, 1-based"

  - name: queue_promotion_scan
    trigger: "capacity release (withdrawal, denial, decline, sweep expiry, amend decrease)"
    algorithm: waterfall_allocation
    formula: |
      Iterate the program's WAITING_FOR_CAPACITY applications in queue_position ASC.
      For each: if program.available_capacity_watts >= system_size_watts_ac, promote
      (CAPACITY_RESERVED; reserved_watts += size; available recomputed BEFORE the next
      candidate). Applications that do not fit are skipped and remain queued; the scan
      continues past them. After the scan, recompute posture.
      Evaluation order is pinned: ascending queue_position, available recomputed after
      every promotion — a different order can promote a different subset.
    precision: "integer watts"

  - name: estimate_total
    trigger: "POST /cost-estimates"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(items[].amount_cents)                      # integer sum first
      total_cents = round_half_up(subtotal_cents * (100 + contingency_pct) / 100)   # single rounding at the end
      valid_until = created_at + ESTIMATE_VALIDITY_DAYS days
    constants:
      ESTIMATE_VALIDITY_DAYS: 30
    precision: "0 decimal places (integer cents), round_half_up applied once after the percentage"

  - name: monthly_netting
    trigger: "MeterReading transitions to POSTED"
    algorithm: threshold
    formula: |
      tariff = TariffSchedule of the account's program effective at period_start
      offset_wh = min(import_wh, export_wh)
      surplus_wh = export_wh - offset_wh
      billable_import_wh = import_wh - offset_wh
      raw_bill_cents = round_half_up(billable_import_wh * tariff.import_rate_millicents_per_kwh / 1000000)
      variant MONETARY_CREDIT:
        surplus_credit_cents = round_half_up(surplus_wh * tariff.export_rate_millicents_per_kwh / 1000000)
        if surplus_credit_cents > 0: post EXPORT_SURPLUS_CREDIT {amount_cents: +surplus_credit_cents, quantity_wh: +surplus_wh}
        credit_draw_cents = min(account.credit_balance_cents, raw_bill_cents)
        if credit_draw_cents > 0: post CREDIT_APPLIED {amount_cents: -credit_draw_cents, quantity_wh: 0}
        bill_cents = raw_bill_cents - credit_draw_cents
        credit_applied_cents = credit_draw_cents; bank_drawn_wh = 0; bank_deposited_wh = 0
      variant ENERGY_BANKING:
        net_wh = import_wh - export_wh
        if net_wh > 0:
          bank_drawn_wh = min(account.banked_wh, net_wh)
          if bank_drawn_wh > 0: post BANK_DRAW {amount_cents: 0, quantity_wh: -bank_drawn_wh}
          billable_wh = net_wh - bank_drawn_wh
          bill_cents = round_half_up(billable_wh * tariff.import_rate_millicents_per_kwh / 1000000)
        else:
          bank_deposited_wh = -net_wh
          if bank_deposited_wh > 0: post BANK_DEPOSIT {amount_cents: 0, quantity_wh: +bank_deposited_wh}
          bill_cents = 0
        credit_applied_cents = 0
      Each ledger entry amount is rounded to whole cents at posting time (round_half_up);
      balances are sums of posted rounded entries — no sub-cent carry-over.
    input_set: "Single MeterReading + account bank state + tariff effective at period_start"
    precision: "0 decimal places (integer cents), round_half_up per entry"
    variants:
      - name: ENERGY_BANKING
        when: "program.metering_variant == ENERGY_BANKING"
        difference: "Surplus is banked in Wh and offsets future consumption in Wh; money is computed only on the unbanked remainder"
      - name: MONETARY_CREDIT
        when: "program.metering_variant == MONETARY_CREDIT"
        difference: "Surplus is converted to cents at the export rate immediately and offsets future bills in cents; identical readings produce different bills and balances than ENERGY_BANKING"

  - name: credit_ledger_projection
    trigger: "any ledger entry posted (reading netting, reversal, true-up settlement)"
    algorithm: projection
    formula: |
      credit_balance_cents = sum(amount_cents over ALL CreditLedgerEntry rows of the account)
      banked_wh = sum(quantity_wh over entries with entry_type IN {BANK_DEPOSIT, BANK_DRAW, BANK_FORFEIT})
      Invariant: voiding or superseding a reading appends REVERSAL entries whose
      amount_cents / quantity_wh are the exact negation of that reading's original entries,
      so post-then-void leaves both balances unchanged.
    input_set: "All ledger entries of the account (entries are never deleted)"
    precision: "integer cents / Wh"

  - name: annual_true_up
    trigger: "POST /annual-reconciliations (compute) and /finalize (settle)"
    algorithm: aggregation
    formula: |
      window = [ (Y, program.true_up_month, 1), (Y+1, program.true_up_month, 1) )
      eligible readings: reading_status == POSTED and period_start in [window_start, window_end)
      surplus_wh = sum over eligible readings of max(0, export_wh - import_wh)
      tariff = TariffSchedule effective at computation time (now)
      nsc_cents = round_half_up(surplus_wh * tariff.net_surplus_rate_millicents_per_kwh / 1000000)
      variant AVOIDED_COST_PAYOUT:
        payout_cents = min(credit_balance_at_compute_cents, nsc_cents)
        forfeited_cents = credit_balance_at_compute_cents - payout_cents
        On finalize: TRUE_UP_PAYOUT -payout_cents (if > 0), TRUE_UP_FORFEIT -forfeited_cents (if > 0)
        => credit_balance_cents becomes 0.
        Rounding order PINNED: the bank being settled is the sum of per-reading
        cent-rounded credits (see monthly_netting); the annual figures are derived
        from that posted balance, never from a whole-year recompute of raw Wh.
      variant BANK_ROLLOVER:
        forfeited_wh = max(0, banked_wh - program.bank_cap_wh)   # bank_cap_wh null => 0 forfeiture
        payout_cents = 0; forfeited_cents = 0
        On finalize: BANK_FORFEIT quantity_wh = -forfeited_wh (if > 0)
        => banked_wh becomes min(banked_wh, bank_cap_wh); energy bank rolls forward.
      Run window: creation allowed only while now IN [window_end, window_end + 60 days).
      Uniqueness: at most one reconciliation with status COMPUTED or SETTLED per (account, year).
    input_set: "POSTED readings of the account whose period_start falls in the reconciliation window (SUPERSEDED and VOIDED excluded)"
    constants:
      TRUE_UP_RUN_WINDOW_DAYS: 60
    precision: "0 decimal places (integer cents), round_half_up on NSC"
    variants:
      - name: AVOIDED_COST_PAYOUT
        when: "program.true_up_mode == AVOIDED_COST_PAYOUT"
        difference: "Credit bank is cashed out at the net-surplus rate capped by the posted balance; excess bank forfeited"
      - name: BANK_ROLLOVER
        when: "program.true_up_mode == BANK_ROLLOVER"
        difference: "No payout; energy bank carries forward net of an over-cap forfeiture"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role must be a declared role name"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Applicant ownership: X-User-ID must equal the customer_id of the ServiceAccount owning the target resource (application, document, inspection, estimate)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Applicant-scoped mutating endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Request schema: required fields present, enum membership valid, quantities positive where required, amend payload non-empty, period_end > period_start, deficiency_note present when outcome=INCOMPLETE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: existence
    check: "Body foreign keys reference existing resources (service_account_id, program_id, transformer_id, feeder_id, customer_id, application_id, supplemental_review_id)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "creation endpoints with body FKs"
  - priority: 7
    category: state
    check: "OCC: expected_application_version / expected_account_version matches the parent's current version"
    error_id: "ERR_STALE_APPLICATION_VERSION / ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /cost-estimates, POST /meter-readings"
  - priority: 8
    category: state
    check: "Primary resource is in a valid state for the requested transition (incl. estimate must be ISSUED for accept/decline)"
    error_id: "ERR_INVALID_STATE / ERR_ESTIMATE_NOT_ISSUED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: Inspector recording a result must not be the MeterTechnician (technician_user_id) who completed that application's meter exchange"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /inspections/{inspection_id}/record-result"
  - priority: 10
    category: business_temporal
    check: "Time-window rules: estimate acceptance while now <= valid_until; occurred_at within [scheduled_date, now]; scheduled_date >= now at creation; reconciliation run window open"
    error_id: "ERR_ESTIMATE_EXPIRED / ERR_INSPECTION_DATE_INVALID / ERR_TRUE_UP_WINDOW_NOT_OPEN"
    http_status: 422
    applies_to: "accept, record-result, POST /inspections, POST /annual-reconciliations"
  - priority: 11
    category: business_constraint
    check: "Structural rules: tariff window overlap, reading period overlap (exact-match supersedes instead), crew buffer overlap, one SCHEDULED inspection per application, one active (SCHEDULED) meter exchange per application, one OPEN supplemental review per application, one non-terminal application per account (at submit), window_end > window_start, required document set complete, defects required iff FAILED, eligibility re-check on amend (size cap checked before production ratio)"
    error_id: "ERR_TARIFF_WINDOW_OVERLAP / ERR_READING_PERIOD_OVERLAP / ERR_EXCHANGE_WINDOW_OVERLAP / ERR_EXCHANGE_WINDOW_INVALID / ERR_INSPECTION_EXISTS / ERR_EXCHANGE_ALREADY_ACTIVE / ERR_SUPPLEMENTAL_REVIEW_OPEN / ERR_DUPLICATE_ACTIVE_APPLICATION / ERR_INCOMPLETE_DOCUMENTS / ERR_NO_REJECTED_DOCUMENTS / ERR_DEFECTS_REQUIRED / ERR_SIZE_EXCEEDS_CLASS_CAP / ERR_PRODUCTION_EXCEEDS_LOAD"
    http_status: 422
    applies_to: "creation + decision endpoints"
  - priority: 12
    category: business_referential
    check: "Cross-entity gates: program accepting submissions, account ACTIVE, account NET_METERING for readings (readings check metering_status before account_status), completed meter exchange before inspection request / PTO (PTO checks exchange before latest-inspection), latest inspection PASSED before PTO, effective tariff exists (PTO, reading, true-up compute), program closable (no in-flight applications), account closable (no non-terminal applications)"
    error_id: "ERR_PROGRAM_NOT_ACCEPTING / ERR_ACCOUNT_NOT_ACTIVE / ERR_ACCOUNT_NOT_NET_METERING / ERR_METER_EXCHANGE_NOT_COMPLETED / ERR_INSPECTION_NOT_PASSED / ERR_NO_EFFECTIVE_TARIFF / ERR_PROGRAM_HAS_INFLIGHT_WORK / ERR_ACCOUNT_HAS_INFLIGHT_APPLICATIONS"
    http_status: 422
    applies_to: "submit, readings, inspections create, grant-pto, true-up create, program close"

