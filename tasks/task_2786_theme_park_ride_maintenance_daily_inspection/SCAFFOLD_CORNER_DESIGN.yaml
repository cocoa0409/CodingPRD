            - "MaintenanceBulletin.${b2}.status == \"ISSUED\" and supersedes_bulletin_id == \"${b1}\" and action_total_count == 0"
            - "GET /park-ops/bulletin-actions?bulletin_id=${b1}&status=CANCELLED returns total_count == 2"
