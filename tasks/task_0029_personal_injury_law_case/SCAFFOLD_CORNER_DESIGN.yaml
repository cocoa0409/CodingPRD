            - "Disbursement for case ${case_id}.contingency_fee_cents == 333300"
            - "MedicalLien.${lien_a}.negotiated_amount_cents == 266680"
            - "MedicalLien.${lien_b}.negotiated_amount_cents == 400020"
            - "Disbursement for case ${case_id}.total_lien_payout_cents == 666700"
            - "Disbursement for case ${case_id}.net_to_client_cents == 0"

      - name: sol_with_tolling_extends_deadline
        claim_type: correct_result
        grounds:
          - calculations.statute_of_limitations_check
          - entities.Case.fields.sol_tolled_days
          - entities.Case.fields.statute_of_limitations_date
        distinguishing_aspect: |
          sol_tolled_days adds calendar days to the effective SOL. With
          accident_date=2024-01-15, jurisdiction=CA (2y), sol_tolled_days=30, the
          effective_sol_date is 2026-02-14 (not 2026-01-15). A case activation at
          clock=2026-02-01 (which would FAIL without tolling) succeeds when
