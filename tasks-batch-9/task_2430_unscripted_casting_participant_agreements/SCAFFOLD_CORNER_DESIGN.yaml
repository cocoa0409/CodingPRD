          - state_machines.PostObligation.SCHEDULED_to_BREACHED
          - entities.Production.fields.breached_obligation_count
          - entities.ParticipantAgreement.fields.welfare_hold
          - calculations.post_obligation_fee_allocation
          - endpoints.POST_/casting/productions/{id}/welfare-run
        distinguishing_aspect: |
          Ledger-sweep side-effect claim with a threshold: at clock 2027-02-20 both
          PRESS_JUNKET obligations (due 2027-01-14 and 2027-02-13) are overdue and
          move to BREACHED while the REUNION_TAPING (due 2027-06-13) stays SCHEDULED;
          reaching two breaches on one agreement stamps welfare_hold. A second
          welfare-run is a no-op — breached_obligation_count stays 2 rather than
          double-counting.
        test_recipe:
          setup:
            - "One EXECUTED agreement with 2 press appearances and a reunion (FINAL stipend 400,000); clock advanced past both press due dates."
