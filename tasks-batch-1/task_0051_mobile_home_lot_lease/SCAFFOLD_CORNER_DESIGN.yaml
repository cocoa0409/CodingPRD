# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, taxonomy per claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_community_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Community.fields.ownership_model
          - entities.Community.fields.utility_apportionment_method
          - endpoints
        distinguishing_aspect: "POST /communities with name+state_code returns 201; ownership_model defaults PARK_OWNED and utility_apportionment_method defaults PER_CAPITA, occupied_lot_count=0."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Solo Park", state_code: "FL" }
              as: ParkManager
              captures: { comm_id: $.data.id }
          assert:
            - "http status == 201"
            - "Community.${comm_id}.ownership_model == PARK_OWNED"
            - "Community.${comm_id}.utility_apportionment_method == PER_CAPITA"
            - "Community.${comm_id}.occupied_lot_count == 0"
            - "Community.${comm_id}.version == 1"

      - name: get_nonexistent_lot_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /lots/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_lot_missing_base_rent_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - entities.Lot.fields.base_rent_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /lots omitting required base_rent_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A community exists"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Req Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "Z1" }
              as: ParkManager
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: lot_status_defaults_vacant_current_rent_equals_base
        claim_type: Defaults
        grounds:
          - entities.Lot.fields.status
          - entities.Lot.fields.current_rent_cents
        distinguishing_aspect: "A freshly created lot has status=VACANT and current_rent_cents==base_rent_cents (no effective schedule)."
        test_recipe:
          setup:
            - "A community exists"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Def Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "Z2", base_rent_cents: 72000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
          assert:
            - "Lot.${lot_id}.status == VACANT"
            - "Lot.${lot_id}.current_rent_cents == 72000"

      - name: create_lot_invalid_state_code_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Community.fields.state_code
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /communities with state_code 'ZZ' (not in CA|OR|FL|TX) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Bad Park", state_code: "ZZ" }
              as: ParkManager
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: utility_charge_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.UtilityCharge
        distinguishing_aspect: "UtilityCharge is common_fields:false — it has id+created_at only, no version, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Community with one occupied lot and one apportioned WATER bill"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Imm Park", state_code: "CA", utility_apportionment_method: "PER_CAPITA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "M1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RM", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 5000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
          trigger:
            - call: "GET /utility-charges?utility_bill_id=${bill_id}"
              payload: {}
              as: ParkManager
          assert:
            - "exactly one UtilityCharge for bill ${bill_id} with amount_cents == 5000"
            - "UtilityCharge has no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_lease_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LotLease.PENDING_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a lease already ACTIVE returns ERR_INVALID_STATE (409); no second occupancy side effects fire."
        test_recipe:
          setup:
            - "A lease already ACTIVE on a CA lot"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Sm Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "S1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RS", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cure_after_dismiss_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EvictionCase.NOTICE_SERVED_to_DISMISSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DISMISSED eviction case is terminal; a subsequent cure returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A LEASE_VIOLATION eviction dismissed on a CA lease"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Tm Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "TM", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RTm", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "LEASE_VIOLATION" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "POST /eviction-cases/${ev_id}/dismiss"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases/${ev_id}/cure"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: lease_initial_state_pending_on_create
        claim_type: Initial State
        grounds:
          - entities.LotLease.fields.status
          - state_machines.LotLease
        distinguishing_aspect: "A newly created LotLease starts in PENDING before activation."
        test_recipe:
          setup:
            - "A CA lot and resident exist"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "In Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "IN", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RIn", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
          assert:
            - "LotLease.${lease_id}.status == PENDING"

      - name: cure_nonpayment_after_payment_restores_occupancy
        claim_type: Valid Transition
        grounds:
          - state_machines.EvictionCase.NOTICE_SERVED_to_CURED
          - state_machines.Lot.EVICTING_to_OCCUPIED
          - validations[priority=15]
        distinguishing_aspect: "A NONPAYMENT cure within the window, after a PAYMENT drops arrears below threshold, moves the case to CURED and the lot EVICTING->OCCUPIED, standing restored to GOOD."
        test_recipe:
          setup:
            - "NONPAYMENT eviction on a CA lease (rent 55000 arrears), inside the cure window; resident pays 10000 to clear below 50000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Cu Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "CU", base_rent_cents: 55000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RCu", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/payments"
              payload: { amount_cents: 10000 }
              as: ParkManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases/${ev_id}/cure"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: ParkManager
          assert:
            - "EvictionCase.${ev_id}.status == CURED"
            - "Lot.${lot_id}.status == OCCUPIED"
            - "Resident.${res_id}.standing == GOOD"

      - name: rent_apply_effective_updates_lot_current_rent
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RentSchedule.ACCEPTED_to_EFFECTIVE
          - entities.Lot.fields.current_rent_cents
        distinguishing_aspect: "Applying an ACCEPTED CA schedule (60000->63000) sets RentSchedule EFFECTIVE and Lot.current_rent_cents to 63000."
        test_recipe:
          setup:
            - "CA lot 60000, schedule proposed 63000 then accepted, effective 2027-01-01"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Ap Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "AP", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RAp", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 63000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_id: $.data.id }
            - call: "POST /rent-schedules/${sched_id}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /rent-schedules/${sched_id}/apply"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
          assert:
            - "RentSchedule.${sched_id}.status == EFFECTIVE"
            - "Lot.${lot_id}.current_rent_cents == 63000"

  # ===========================================================================
  - section: calculations
    instances:
      - name: sub_meter_apportionment_exact_split
        claim_type: Correct Result
        grounds:
          - calculations.utility_apportionment
          - entities.UtilityReading.fields.metered_units
        distinguishing_aspect: "SUB_METER apportionment of 10000c over readings 30/50/20 yields 3000/5000/2000 exactly (no remainder), demonstrating the sub_meter variant selection by community method."
        test_recipe:
          setup:
            - "CA SUB_METER community, 3 occupied lots with readings 30/50/20 on a 10000c WATER bill"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Sub Park", state_code: "CA", utility_apportionment_method: "SUB_METER" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "U1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot1: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "U2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot2: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "U3", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot3: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RU1", household_size: 2 }
              as: ParkManager
              captures: { res1: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RU2", household_size: 2 }
              as: ParkManager
              captures: { res2: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RU3", household_size: 2 }
              as: ParkManager
              captures: { res3: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot1}", resident_id: "${res1}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease1: $.data.id }
            - call: "POST /lot-leases/${lease1}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot2}", resident_id: "${res2}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease2: $.data.id }
            - call: "POST /lot-leases/${lease2}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot3}", resident_id: "${res3}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease3: $.data.id }
            - call: "POST /lot-leases/${lease3}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 10000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
            - call: "POST /utility-bills/${bill_id}/readings"
              payload: { lot_id: "${lot1}", metered_units: 30 }
              as: ParkManager
            - call: "POST /utility-bills/${bill_id}/readings"
              payload: { lot_id: "${lot2}", metered_units: 50 }
              as: ParkManager
            - call: "POST /utility-bills/${bill_id}/readings"
              payload: { lot_id: "${lot3}", metered_units: 20 }
              as: ParkManager
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
            - call: "GET /utility-charges?utility_bill_id=${bill_id}"
              payload: {}
              as: ParkManager
          assert:
            - "UtilityCharge for lot ${lot1} amount_cents == 3000"
            - "UtilityCharge for lot ${lot2} amount_cents == 5000"
            - "UtilityCharge for lot ${lot3} amount_cents == 2000"

      - name: sub_meter_with_zero_readings_returns_no_meter_readings
        claim_type: Input Set Filtering
        grounds:
          - validations[priority=16]
          - errors[ERR_NO_METER_READINGS]
          - entities.Community.fields.total_metered_units
        distinguishing_aspect: "SUB_METER apportionment with one occupied lot but total_metered_units==0 returns ERR_NO_METER_READINGS (409)."
        test_recipe:
          setup:
            - "CA SUB_METER community, one occupied lot, a DRAFT bill with no readings"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Z0 Park", state_code: "CA", utility_apportionment_method: "SUB_METER" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "Z0", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RZ0", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 10000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_NO_METER_READINGS"
            - "http status == 409"

      - name: nonpayment_eviction_below_threshold_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.resident_arrears
          - validations[priority=14]
          - errors[ERR_ARREARS_BELOW_THRESHOLD]
        distinguishing_aspect: "Serving a NONPAYMENT eviction when arrears (40000) < ARREARS_THRESHOLD_CENTS (50000) returns ERR_ARREARS_BELOW_THRESHOLD (409)."
        test_recipe:
          setup:
            - "CA lease with rent 40000 arrears (below 50000 threshold)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Bt Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "BT", base_rent_cents: 40000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RBt", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT" }
              as: ParkManager
          assert:
            - "response error_id == ERR_ARREARS_BELOW_THRESHOLD"
            - "http status == 409"

      - name: cure_deadline_tx_14_days
        claim_type: Correct Result
        grounds:
          - calculations.cure_deadline_derivation
          - entities.EvictionCase.fields.cure_deadline
        distinguishing_aspect: "A TX LEASE_VIOLATION eviction served 2026-01-01 derives cure_deadline 2026-01-15 (notice + 14 days)."
        test_recipe:
          setup:
            - "TX lease, eviction served at clock 2026-01-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Tx Park", state_code: "TX" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
