  # -----------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # -----------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_create_gated_by_family_agreement
        grounds:
          - validations[priority=6]
          - state_machines.FamilyAgreement.PENDING_to_SIGNED
          - state_machines.Assignment
        distinguishing_aspect: |
          Pair: Assignment ↔ FamilyAgreement. Assignment create precondition
          is FamilyAgreement.signature_state == SIGNED — Assignment cannot
          be created when FamilyAgreement is PENDING or DECLINED. Different
          entity pair from instance 2.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, student S enrolled; FamilyAgreement left PENDING (never signed)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-X1", serial_number: "SN-X1", condition_grade: "A" }
