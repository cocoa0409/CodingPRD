              captures: { ps1: $.data.status }
            - call: "POST /category-reviews/${rev}/decide"
              payload: { expected_review_version: "${rev_v}", authorized_item_ids: ["${i1}", "${i2}"], default_store_count: 400 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { st2: $.data.status, aw2: $.data.slots_awarded, rem2: $.data.slots_remaining }
            - call: "GET /authorizations"
              payload: { review_id: "${rev}" }
              as: BrokerAccountManager
              captures: { a1: "$.data[0].id", a1_state: "$.data[0].authorization_state", a1_stores: "$.data[0].authorized_store_count", a2: "$.data[1].id" }
            - call: "GET /presentations/${pres}"
              payload: {}
              as: BrokerAccountManager
              captures: { ps2: $.data.status, ac2: $.data.authorized_item_count }
          assert:
            - "Call 1 returns 422 ERR_ITEM_NOT_IN_SUBMITTED_PRESENTATION for ${i3}"
            - "Call 2 returns total_count 0 — NOT two authorizations for the two valid items; the awarded set is applied atomically"
            - "Call 3: ${st1} == LOCKED, ${aw1} == 0, ${rem1} == 3 and ${rv1} == ${rev_v} — the failed bulk write bumped nothing, which is exactly why the same expected_review_version can be replayed"
            - "Call 4: ${ps1} == SUBMITTED — no presentation was moved to ACCEPTED or DECLINED"
            - "Call 5 succeeds with ${st2} == DECIDED, ${aw2} == 2 and ${rem2} == 1"
            - "Call 6 returns total_count 2 in Item.upc ASC order (${a1} for upc 011111000001, ${a2} for upc 022222000002); ${a1_state} == AUTHORIZED (no linked deal, so PENDING_SETUP auto-advances) and ${a1_stores} == 400"
            - "Call 7: ${ps2} == ACCEPTED with ${ac2} == 2, and Item ${i3} still has no Authorization anywhere"

