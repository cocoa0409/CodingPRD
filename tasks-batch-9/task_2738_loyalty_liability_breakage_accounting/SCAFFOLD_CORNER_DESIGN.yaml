      - name: valid_zero_length_and_inverted_period_windows_rejected
        claim_type: Temporal
        grounds:
          - validations[priority=75]
          - entities.AccountingPeriod.fields.start_at
          - entities.AccountingPeriod.fields.end_at
        distinguishing_aspect: "The window check is strict `start_at < end_at`, so an instantaneous period (start == end) is refused just like an inverted one, and the same validation governs PartnerAgreement effective dates."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Window Core' is DRAFT with rule TX and cohort C1 configured; period creation does not require an ACTIVE program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Window Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "ZERO", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T00:00:00Z" }
              as: Controller
              captures: { err_zero: $.data.error_id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "INV", start_at: "2026-09-01T00:00:00Z", end_at: "2026-08-01T00:00:00Z" }
              as: Controller
              captures: { err_inverted: $.data.error_id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PW", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-12-31T00:00:00Z", effective_end_date: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_agr_window: $.data.error_id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per_ok_id: $.data.id }
          assert:
            - "The zero-length window returns HTTP 409 with error_id == ERR_INVALID_WINDOW - equality fails the strict `start_at < end_at` test"
            - "The inverted window returns HTTP 409 with error_id == ERR_INVALID_WINDOW"
            - "The inverted PartnerAgreement window returns HTTP 409 with error_id == ERR_INVALID_WINDOW - the same priority-75 rule spans both entities"
            - "ERR_INVALID_WINDOW is preferred over ERR_PERIOD_OVERLAP for these bodies: the malformed window is caught at priority 75, before the priority-76 overlap sweep runs"
            - "The one-month window SUCCEEDS: AccountingPeriod.${per_ok_id}.state == OPEN with reopen_count 0"
            - "GET /accounting-periods?program_id=${prog_id} returns total_count == 1 - the three refused bodies persisted nothing"

