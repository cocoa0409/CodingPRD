        distinguishing_aspect: "On a SCHEDULED visit the same POST /scores body is rejected 403 ERR_NOT_RESOURCE_OWNER for an Observer who is neither lead nor secondary and accepted 201 for the named lead, and that same lead is then refused 403 ERR_FORBIDDEN_ROLE on finalize because finalization is StateAdministrator-exclusive - not the 422 ERR_OBSERVATION_SCORES_INCOMPLETE the partial score set would otherwise cause."
