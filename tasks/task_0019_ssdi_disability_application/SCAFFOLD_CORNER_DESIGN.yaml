            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${st_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { ast_id: "$.data.id" }
            - call: "POST /ssdi/applications/${ast_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${st_id}"
              captures: { ast_v: "$.data.version" }
            - call: "POST /ssdi/applications/${ast_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 60 }
              as: Claimant
              as_user_id: "${st_id}"
            - call: "POST /ssdi/applications/${ast_id}/medical-decision"
              payload: { decision_type: "NOT_DISABLED", established_onset_date: "2024-01-15T00:00:00Z", rfc_score: 90, expected_application_version: "${ast_v}" }
              as: DDSExaminer
            - call: "POST /ssdi/applications/${ast_id}/request-reconsideration"
