              payload: {}
              as: EditorInChief
              captures: { tv1: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_a}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 5000, booking_start_date: "2026-08-01", booking_end_date: "2026-08-05", expected_title_version: "${tv1}" }
              as: EditorInChief
              captures: { a_s: $.data.id }
            - call: "POST /comics/creative-assignments/${a_s}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_a}"
            - call: "GET /comics/titles/${t1}"
              payload: {}
              as: EditorInChief
              captures: { tv2: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_a}", craft: "PENCILS", page_rate_cents: 9000, royalty_share_bps: 1500, booking_start_date: "2026-08-05", booking_end_date: "2026-08-10", expected_title_version: "${tv2}" }
              as: EditorInChief
              captures: { a_pe: $.data.id }
