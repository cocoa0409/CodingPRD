  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: work_order_schedule_gated_by_contract_status
        grounds:
          - state_machines.WorkOrder.REQUESTED_to_SCHEDULED
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
          - validations[priority=40]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          The dependent pair is WorkOrder -> Contract: a WorkOrder's REQUESTED ->
          SCHEDULED transition is legal only while the Contract reached through
          WorkOrder.lot_id -> Lot.contract_id is ACTIVE, so suspending the contract
          blocks the schedule with ERR_CONTRACT_NOT_ACTIVE and reinstating it
          immediately unblocks the same call.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T00:00:00Z."
            - "One ACTIVE Contract with one 3135.00-gallon Lot in production_status JUICE."
            - "One WorkOrder (RACKING) in REQUESTED against that lot."
            - "The Contract is then moved to SUSPENDED, which is the only gate the schedule call violates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-9001", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 42000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 23.50, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id }
            - call: "POST /work-orders"
              payload: { lot_id: "${lot1}", operation_type: "RACKING", scheduled_at: "2026-09-22T14:00:00Z", labor_hours: 1.50, crew_size: 2 }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { wo1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUSPEND" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "POST /work-orders/${wo1}/transitions"
              payload: { action: "SCHEDULE" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "REINSTATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /work-orders/${wo1}/transitions"
              payload: { action: "SCHEDULE" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { st_after: $.data.status }
          assert:
            - "${err} == ERR_CONTRACT_NOT_ACTIVE with HTTP 409"
            - "WorkOrder.${wo1}.status == REQUESTED immediately after the rejected call"
            - "${st_after} == SCHEDULED once Contract.${ct1}.status returns to ACTIVE"
            - "WorkOrder.${wo1}.material_cost_cents == 0 and rush == false (defaults applied at creation)"

      - name: release_execute_gated_by_prepared_ttb_period
        grounds:
          - validations[priority=55]
          - errors[ERR_REPORTING_PERIOD_LOCKED]
          - state_machines.ReleaseOrder.APPROVED_to_EXECUTED
