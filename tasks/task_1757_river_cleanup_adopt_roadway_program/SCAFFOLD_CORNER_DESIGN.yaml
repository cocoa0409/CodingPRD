          setup: ["approved agreement; client captured its version after approval"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: GroupLeader, as_user_id: "${g}", captures: { v_obs: $.data.version } }
          trigger:
            - { call: "PATCH /program/agreements/${ag}", payload: { expected_agreement_version: "${v_obs}", contact_email: "new-lead@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { v_next: $.data.version, new_email: $.data.contact_email } }
            - { call: "PATCH /program/agreements/${ag}", payload: { expected_agreement_version: "${v_obs}", special_instructions: "stale write" }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "PATCH /program/agreements/${ag}", payload: { expected_agreement_version: "${v_next}", special_instructions: "bring extra bags" }, as: GroupLeader, as_user_id: "${g}", captures: { v_final: $.data.version, final_notes: $.data.special_instructions } }
          assert:
            - "v_next == v_obs + 1 and new_email == new-lead@riverkeepers.org (fresh OCC write succeeds)"
            - "err == ERR_STALE_VERSION (http 412) for the replayed stale version"
            - "v_final == v_obs + 2 and final_notes == bring extra bags"

      - name: agreement_counter_reconciles_after_each_completion
        claim_type: derived_field_reconciliation
        grounds: [entities.AdoptionAgreement.fields.cleanups_completed_in_window, calculations.compliance_standing]
        distinguishing_aspect: "The derived counter moves 0 -> 1 -> 2 with successive completions while the agreement is younger than 180 days, and standing stays NOT_EVALUATED (grace window) even though the counter is live."
        test_recipe:
          setup: ["approved agreement with two events (2026-09-10, 2026-09-12) created and briefed up front"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e1: $.data.id } }
            - { call: "POST /program/events/${e1}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-12", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e2: $.data.id } }
            - { call: "POST /program/events/${e2}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { c0: $.data.cleanups_completed_in_window, st0: $.data.standing } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e1}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { c1: $.data.cleanups_completed_in_window, st1: $.data.standing } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e2}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/agreements/${ag}", payload: {}, as: ProgramCoordinator, captures: { c2: $.data.cleanups_completed_in_window, st2: $.data.standing } }
          assert:
            - "c0 == 0 and st0 == NOT_EVALUATED"
            - "c1 == 1 and st1 == NOT_EVALUATED (age 40 days < 180 grace)"
            - "c2 == 2 and st2 == NOT_EVALUATED (counter live, standing still in grace)"

      - name: rate_threshold_boundary_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [calculations.compliance_standing]
        excluded_because:
          difficulty_instance: cleanup_count_exactly_three_vs_two
          rationale: "The >= 3 cumulative threshold (and its 2-vs-3 failure side) is asserted by the named §1.8 instance."

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.AdoptionAgreement.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: suspension_cascade_event_cancel_supply_restock
          rationale: "The N-level cascade (agreement -> events -> distributions -> depot) is asserted hop-by-hop in the named §1.8 instance."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.official_event_weight, calculations.compliance_standing]
        excluded_because:
          difficulty_instance: debris_measured_vs_estimated_divergence
          rationale: "Both variants and their divergence are asserted in the named §1.8 instance (and standing_rolling_vs_anniversary_windows for the compliance calculation)."

