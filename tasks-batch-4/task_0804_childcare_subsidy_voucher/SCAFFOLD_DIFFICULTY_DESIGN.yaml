scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: copay_provisional_vs_verified_across_determinations
        grounds:
          - calculations.copay_determination
          - entities.EligibilityDetermination.fields.monthly_copay_cents
          - entities.Family.fields.monthly_self_employment_income_cents
        distinguishing_aspect: |
          Same Family; INITIAL determination counts gross-only (250000 -> band 5% -> copay 12500)
          while REDETERMINATION counts gross+self-employment (350000 -> band 8% -> copay 28000):
          different countable income and different band on the EligibilityDetermination/Family
          (household income) domain.
        test_recipe:
          setup:
            - "IncomeStandard(hh=3, entry=400000, exit=500000, CA)"
            - "Family gross=250000, self=100000, hh=3; one 40h WORK activity"
            - "INITIAL determination finalized APPROVED (copay 12500)"
            - "REDETERMINATION determination finalized APPROVED (copay 28000)"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_init_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_init_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "REDETERMINATION" }
              as: CaseWorker
              captures: { det_redet_id: $.data.id }
          trigger:
            - call: "POST /ccdf/determinations/${det_redet_id}/finalize"
              payload: {}
              as: CaseWorker
          assert:
            - "EligibilityDetermination.${det_init_id}.countable_income_cents == 250000"
            - "EligibilityDetermination.${det_init_id}.monthly_copay_cents == 12500"
            - "EligibilityDetermination.${det_redet_id}.countable_income_cents == 350000"
            - "EligibilityDetermination.${det_redet_id}.monthly_copay_cents == 28000"

      - name: payment_estimated_vs_actual_across_authorization_and_payment
        grounds:
          - calculations.payment_computation
          - entities.Authorization.fields.estimated_monthly_payment_cents
          - entities.Payment.fields.net_provider_payment_cents
        distinguishing_aspect: |
          Authorization.estimated_monthly_payment_cents (forward-looking full attendance, full copay =
          5000*22-12500 = 97500) diverges from the ACTUAL Payment.net_provider_payment_cents (payable 21
          days, prorated copay = 93072); the two variants live on different entity domains (voucher estimate
          vs provider payment).
        test_recipe:
          setup:
            - "eligible Family + APPROVED INITIAL determination (copay 12500)"
            - "LICENSED CENTER provider published 6000; RateCeiling CENTER/TODDLER/CA max 5000"
            - "ACTIVE Authorization authorized_days_per_month=22 (rate 5000, estimate 97500)"
            - "AttendanceRecord 2026-03 present=18 absent=3 approved -> Payment PAID"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /ccdf/attendance-records/${att_id}/approve"
              payload: {}
              as: CaseWorker
            - call: "GET /ccdf/payments?attendance_record_id=${att_id}"
              payload: {}
              as: CaseWorker
              captures: { pay_id: "$.data[0].id" }
          assert:
            - "Authorization.${auth_id}.authorized_daily_rate_cents == 5000"
            - "Authorization.${auth_id}.estimated_monthly_payment_cents == 97500"
            - "Payment.${pay_id}.net_provider_payment_cents == 93072"
            - "Payment.${pay_id}.net_provider_payment_cents != Authorization.${auth_id}.estimated_monthly_payment_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payment_gross_nested_min_absence_cap
        grounds:
          - calculations.payment_computation
          - entities.AttendanceRecord.fields.payable_days
          - entities.Payment.fields.net_provider_payment_cents
        distinguishing_aspect: |
          Mode (a): net = max(0, authorized_daily_rate * (present + min(absent, 5)) - prorated_copay) has 4
          inputs with a nested min (absence cap) and an outer max floor; present=20 absent=8 pins payable=25,
          gross=125000, copay=14200, net=110800.
        test_recipe:
          setup:
            - "ACTIVE Authorization rate 5000, authorized_days_per_month=22, copay 12500"
            - "AttendanceRecord 2026-03 present=20 absent=8"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
