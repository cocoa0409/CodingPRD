      - name: corner_ep_aging_run_is_idempotent_within_one_clock_instant
        claim_type: bulk_action
        grounds:
          - endpoints["POST /facilities/{id}/aging-run"]
          - calculations.facility_fee_accrual
          - calculations.dwell_and_aging_classification
        distinguishing_aspect: |
          The batch is a skip-not-fail bulk action AND idempotent within one logical-clock
          instant. The second run at the identical clock must report fee_accrual_cents 0,
          accrual_days 0, margin_calls_issued 0, bailee_letters_expired 0 and
          repurchase_demands_raised 0 — while still reporting advances_evaluated 1. A
          naive re-run double-accrues 21,058,333 cents and issues a duplicate call.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000 and shipped at 2026-08-01, so its BaileeLetter expires 2026-08-31."
            - "Clock moved to 2026-09-05, i.e. dwell 35 days against a dwell_limit_days of 30."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - *c_ship_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: CreditOfficer
          trigger:
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { r1_evaluated: "$.data.advances_evaluated", r1_calls: "$.data.margin_calls_issued", r1_expired: "$.data.bailee_letters_expired", r1_demands: "$.data.repurchase_demands_raised", r1_fee: "$.data.fee_accrual_cents", r1_days: "$.data.accrual_days" }
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { r2_evaluated: "$.data.advances_evaluated", r2_calls: "$.data.margin_calls_issued", r2_expired: "$.data.bailee_letters_expired", r2_demands: "$.data.repurchase_demands_raised", r2_fee: "$.data.fee_accrual_cents", r2_days: "$.data.accrual_days" }
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities/${fac_id}/ledger-entries"
              payload: { entry_type: "FEE_ACCRUAL" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "run 1: r1_evaluated == 1, r1_calls == 1, r1_expired == 1, r1_demands == 1, r1_days == 35, r1_fee == 21058333 = 16673611 (A1 at note_rate 0.0650 + FACILITY_SPREAD 0.0225 on 360-day basis) + 4384722 (unused line fee)"
            - "run 1: Advance.${a1_id}.dwell_days == 35, is_aged == true, effective_advance_rate == 0.975 (one curtailment step of 0.005 for ceil(5/15) == 1), eligible_collateral_value_cents == 1950000000, required_paydown_cents == 10000000"
            - "run 1 raised exactly one MarginCall with trigger_reason DWELL_EXCEEDED and call_amount_cents == 10000000"
            - "run 1: the BaileeLetter is EXPIRED and one RepurchaseDemand exists with reason BAILEE_EXPIRED, demanded_amount_cents == 1960000000 and deadline_at == 2026-09-15T00:00:00Z (clock + AGING_RUN_DEMAND_DAYS)"
            - "run 1: WarehouseFacility.${fac_id}.status == RESTRICTED and accrued_fee_balance_cents == 21058333"
            - "run 2: r2_evaluated == 1 — the advance is still walked, so this is skip-not-fail, not a short-circuit"
            - "run 2: r2_fee == 0 and r2_days == 0 — last_accrual_at already equals the clock, so no second FEE_ACCRUAL entry is appended"
            - "run 2: r2_calls == 0 — A1 already carries an ISSUED margin call, so it is skipped rather than erroring"
            - "run 2: r2_expired == 0 and r2_demands == 0 — the letter is already EXPIRED, so no second demand is raised"
            - "GET /facilities/${fac_id}/margin-calls returns total_count == 1 and GET ledger-entries?entry_type=FEE_ACCRUAL returns total_count == 1"
            - "WarehouseFacility.${fac_id}.accrued_fee_balance_cents is still 21058333 after run 2 and status is still RESTRICTED"
            - "run 2 did NOT default the margin call: its cure_deadline_at is 2026-09-07T00:00:00Z, strictly after the clock, so the facility stays RESTRICTED rather than SUSPENDED"

      - name: corner_ep_ship_links_advance_to_investor_through_the_commitment
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /advances/{id}/ship"]
          - errors.ERR_INVESTOR_NOT_FOUND
          - errors.ERR_COMMITMENT_INVESTOR_MISMATCH
        distinguishing_aspect: |
          Ship is a three-way link: the advance, the named investor, and the commitment
          that must already tie them together. Three arms separate the failure modes — an
          id that does not resolve is 404, an id that resolves to a real APPROVED investor
          who is simply not this advance's counterparty is 422
          ERR_COMMITMENT_INVESTOR_MISMATCH, and only the commitment's own investor gets a
          BaileeLetter.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000 against commitment A (investor A)."
            - "Investor E also registered and APPROVED on the same facility, but with no commitment."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Echo Loan Purchasers", counterparty_rating: "A", concentration_limit_pct: 0.50 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_e_id: "$.data.id" }
            - call: "POST /investors/${inv_e_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "00000000-0000-0000-0000-0000000000ff" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_e_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl_link_id: "$.data.id" }
            - call: "GET /advances/${a1_id}/bailee-letters"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "the unresolvable investor_id returns HTTP 404 with data.error_id == ERR_INVESTOR_NOT_FOUND"
            - "the investor-E arm returns HTTP 422 with data.error_id == ERR_COMMITMENT_INVESTOR_MISMATCH — existence is satisfied, the association is not"
            - "after both failures Advance.${a1_id}.funding_status is still FUNDED, custody_status is still RECEIVED_CLEAR, and GET /advances/${a1_id}/bailee-letters would return total_count 0"
            - "the investor-A arm returns HTTP 201 with BaileeLetter.${bl_link_id}.advance_id == ${a1_id} and investor_id == ${inv_a_id}"
            - "BaileeLetter.${bl_link_id}.status == ISSUED, effective_from == 2026-08-01T00:00:00Z, expires_at == 2026-08-31T00:00:00Z, bailee_period_days == 30 snapshotted from the facility"
            - "Advance.${a1_id}.funding_status == SHIPPED, shipped_at == 2026-08-01T00:00:00Z, custody_status == RELEASED_TO_INVESTOR"
            - "GET /advances/${a1_id}/bailee-letters returns total_count == 1 — the two rejected arms created nothing"
            - "InvestorCommitment.${comm_a_id}.allocated_amount_cents is still 1960000000 — shipment moves documents, not money"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents is still 1960000000"

      - name: corner_ep_clock_endpoint_returns_previous_value_and_mutates_nothing
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          The harness clock must (a) start at the mandated default 2026-08-01T00:00:00Z, so
          the very first set returns that as previous_utc, (b) return the value it replaced
          rather than the value it was given, and (c) change no business state — a facility
          created before the jump keeps its original created_at and version, and only
          derived reads such as dwell_days move.
        test_recipe:
          setup:
            - "One ACTIVE facility created and approved with NO prior clock call, so every timestamp is written at the server default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { clk_fac_ver: "$.data.version" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T12:00:00Z" }
              as: CreditOfficer
              captures: { clk_prev_1: "$.data.previous_utc", clk_cur_1: "$.data.current_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: Investor
              captures: { clk_prev_2: "$.data.previous_utc", clk_cur_2: "$.data.current_utc" }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "clk_prev_1 == 2026-08-01T00:00:00Z — the mandatory server default was in force before any clock call"
            - "clk_cur_1 == 2026-09-10T12:00:00Z"
            - "clk_prev_2 == 2026-09-10T12:00:00Z and clk_cur_2 == 2026-09-11T00:00:00Z — previous_utc echoes the replaced value, not the new one"
            - "both calls return HTTP 200 and both succeed with the X-User-ID and X-User-Role headers omitted entirely — this is the one endpoint exempt from priority 1"
            - "the second call succeeds as role Investor with no X-User-ID resolving to a TakeoutInvestor row, confirming priority 2 is also bypassed here"
            - "WarehouseFacility.${fac_id}.created_at is still 2026-08-01T00:00:00Z and approved_at is still 2026-08-01T00:00:00Z — writes read the clock at write time and are never rewritten"
            - "WarehouseFacility.${fac_id}.version == clk_fac_ver — a clock move is not a write to any business row"
            - "WarehouseFacility.${fac_id}.status is still ACTIVE, outstanding_principal_cents == 0, accrued_fee_balance_cents == 0 — no accrual happens until a business call runs"

