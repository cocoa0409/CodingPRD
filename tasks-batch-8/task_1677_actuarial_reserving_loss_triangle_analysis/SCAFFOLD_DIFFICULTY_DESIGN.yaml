# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Actuarial Reserving & Loss Triangle Analysis
# Nine Difficulty Rules x 2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> target state via §1.5 calls.
#
# Shared fixture arithmetic (Main Book, used by many instances):
#   Claim C-A (AQ 2025-Q1): payments 100000@dev0, 100000@dev1, 50000@dev2
#     -> cumulative cells dev0=100000, dev1=200000, dev2=250000
#   Claim C-B (AQ 2025-Q2): 200000@dev0, 100000@dev1 -> dev0=200000, dev1=300000
#   Claim C-D (AQ 2025-Q2): 100000@dev0 -> dev0=100000
#   Bulk PAID triangle @2025-Q3: AQ1[100000,200000,250000], AQ2[300000,300000]
#   Link ratios: d0->1 = 500000/400000 = 1.25 ; d1->2 = 250000/200000 = 1.25
#   selected_factors = [1.2500, 1.2500]; tail (n=2 < 3) = 1.0000
#   CDF(0) = 1.5625 ; CDF(1) = 1.2500 ; CDF(2) = 1.0000
#   CL: AQ1 250000*1.0 = 250000 ; AQ2 300000*1.25 = 375000 ; total 625000 ; IBNR 75000
#   BF (exposure 400000/AQ, a-priori 0.8): AQ1 250000 ; AQ2 300000+320000*0.2 = 364000 ; total 614000 ; IBNR 64000
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: chain_ladder_vs_bornhuetter_ferguson_ultimate_divergence
        grounds:
          - calculations.chain_ladder_ultimate
          - calculations.bornhuetter_ferguson_ultimate
          - entities.ReserveRun.fields.ultimate_cents
        distinguishing_aspect: |
          Same entity domain as itself (ReserveRun) but pinned against the second
          instance's domain (Claim): identical triangle, quarter and basis feed two
          method algorithms — chain ladder (diagonal x CDF) yields ultimate 625000,
          Bornhuetter-Ferguson (diagonal + exposure x a-priori x (1 - 1/CDF)) yields
          614000; the 11000 delta exists only because the two algorithms weight
          emerging experience vs a-priori expectation differently.
        test_recipe:
          setup:
            - "Segment 'Main Book' (threshold 400000, max_range_width 0.5, benchmark 50000) with claims C-A/C-B/C-D and the shared-fixture payments, all transactions posted before any aggregation"
            - "PAID triangle aggregated at valuation 2025-Q3; DRAFT pattern computed (factors [1.25, 1.25], tail 1.0000) and SELECTED with window [2025-Q3, 2026-Q2)"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-D", accident_date: "2025-04-10", report_date: "2025-04-15" }
              as: ClaimsExaminer
              captures: { cl_d: $.data.id }
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id }
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
              captures: { run_cl: $.data.id, cl_ult: $.data.ultimate_cents, cl_ibnr: $.data.ibnr_cents }
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "BORNHUETTER_FERGUSON", basis: "PAID", earned_exposure_cents: 400000, a_priori_loss_ratio: 0.8 }
              as: ActuarialAnalyst
              captures: { run_bf: $.data.id, bf_ult: $.data.ultimate_cents, bf_ibnr: $.data.ibnr_cents }
          assert:
            - "ReserveRun.${run_cl}.ultimate_cents == 625000"
            - "ReserveRun.${run_bf}.ultimate_cents == 614000"
            - "ReserveRun.${run_cl}.ibnr_cents == 75000"
            - "ReserveRun.${run_bf}.ibnr_cents == 64000"
            - "cl_ult != bf_ult (625000 vs 614000) for identical triangle, quarter and basis"
      - name: case_adequacy_development_vs_benchmark_divergence
        grounds:
          - calculations.case_reserve_adequacy
          - entities.Claim.fields.adequacy_ratio_development
          - entities.Claim.fields.adequacy_ratio_benchmark
        distinguishing_aspect: |
          Different entity domain from the first instance (Claim, not ReserveRun):
          one open claim's case outstanding (80000) is judged 3.2x adequate by the
          development-indicated variant (paid 100000 x (CDF(1)-1) = 25000 indicated)
          but only 1.6x by the schedule-benchmark variant (flat 50000); the two
          variants disagree because one is claim-payment-driven and the other is
          payment-history-independent.
        test_recipe:
          setup:
            - "Main Book segment and claims exactly as in the shared fixture; claim C-D additionally carries a CASE_RESERVE_SET of 80000 dated 2025-05-15"
            - "PAID triangle @2025-Q3 aggregated after all transactions; pattern SELECTED with window [2025-Q3, 2026-Q2)"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-D", accident_date: "2025-04-10", report_date: "2025-04-15" }
              as: ClaimsExaminer
              captures: { cl_d: $.data.id }
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "CASE_RESERVE_SET", transaction_date: "2025-05-15T00:00:00Z", case_value_cents: 80000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id }
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "GET /actuarial/claims/${cl_d}"
              as: ActuarialAnalyst
              captures: { ratio_dev: $.data.adequacy_ratio_development, ratio_bench: $.data.adequacy_ratio_benchmark }
          assert:
            - "Claim.${cl_d}.adequacy_ratio_development == 3.2"
            - "Claim.${cl_d}.adequacy_ratio_benchmark == 1.6"
            - "ratio_dev != ratio_bench for the same claim, same case_outstanding_cents == 80000"
  - rule_id: combinatorial_formula
    instances:
      - name: bf_layered_ibnr_with_large_loss_split
        grounds:
          - calculations.bornhuetter_ferguson_ultimate
          - calculations.chain_ladder_ultimate
          - entities.LossTriangle.fields.large_loss_cells
        distinguishing_aspect: |
          Mode (a) — 3+ inputs with non-linear interaction and a conditional branch:
          BF needs exposure x a-priori x (1 - 1/CDF) AND branches on claim segregation;
          with claim C-LARGE (500000 paid, incurred 500000 >= threshold 400000) the large
          layer adds round(500000 x CDF(0)=1.5625) = 781250 of CL-based ultimate, giving
          BF total 614000 + 781250 = 1395250 vs bulk-only 614000.
        test_recipe:
          setup:
            - "Main Book shared fixture (claims C-A/C-B/C-D) PLUS claim C-LARGE (accident 2025-01-20) with a single 500000 payment on 2025-02-10, making it large-loss-segregated from creation"
            - "Triangle @2025-Q3 and SELECTED pattern as in the shared fixture (large claims never enter bulk cells or factor selection)"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-LARGE", accident_date: "2025-01-20", report_date: "2025-01-25" }
              as: ClaimsExaminer
              captures: { cl_c: $.data.id }
            - call: "POST /actuarial/claims/${cl_c}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-10T00:00:00Z", amount_cents: 500000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id }
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "BORNHUETTER_FERGUSON", basis: "PAID", earned_exposure_cents: 400000, a_priori_loss_ratio: 0.8 }
              as: ActuarialAnalyst
              captures: { run_bf: $.data.id, bf_ult: $.data.ultimate_cents, bf_ibnr: $.data.ibnr_cents }
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
              captures: { run_cl: $.data.id }
            - call: "GET /actuarial/triangles/${tri}"
              as: ActuarialAnalyst
              captures: { large_cells: $.data.large_loss_cells }
          assert:
            - "ReserveRun.${run_bf}.ultimate_cents == 1395250"
            - "ReserveRun.${run_bf}.ibnr_cents == 345250"
            - "ReserveRun.${run_cl}.ultimate_cents == 1406250"
            - "LossTriangle.${tri}.large_loss_cells contains exactly one cell {accident_quarter: 2025-Q1, dev_quarter: 0, amount_cents: 500000}"
            - "LossTriangle.${tri}.cells for accident_quarter 2025-Q1 dev_quarter 0 == 100000 (C-LARGE excluded from bulk)"
      - name: factor_rounding_order_changes_ultimate_cents
        grounds:
          - calculations.development_factor_selection
          - calculations.cdf_lookup
          - calculations.chain_ladder_ultimate
        distinguishing_aspect: |
          Mode (b) — nested rounding order, distinct from the first instance's mode (a):
          raw link ratio 123445/100000 = 1.23445 must round per-factor to 1.2345 BEFORE
          CDF multiplication; the pinned order yields ultimate 222205, while the forbidden
          raw-product order yields 222201 — a 4-cent observable difference.
        test_recipe:
          setup:
            - "Fresh segment 'GL Book' (threshold 10000000): claim R-1 (AQ 2025-Q1) paid 100000@dev0 then 23445@dev1 (cumulative 123445); claim R-2 (AQ 2025-Q2) paid 80000@dev0"
            - "Triangle @2025-Q2 aggregated; pattern created from it and SELECTED"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "GL Book", line_of_business: "GENERAL_LIABILITY", large_loss_threshold_cents: 10000000, max_range_width_pct: 1.0, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "R-1", accident_date: "2025-01-15", report_date: "2025-01-16" }
              as: ClaimsExaminer
              captures: { cl_r1: $.data.id }
            - call: "POST /actuarial/claims/${cl_r1}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_r1}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-10T00:00:00Z", amount_cents: 23445 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "R-2", accident_date: "2025-04-10", report_date: "2025-04-11" }
              as: ClaimsExaminer
              captures: { cl_r2: $.data.id }
            - call: "POST /actuarial/claims/${cl_r2}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-20T00:00:00Z", amount_cents: 80000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2025-Q2", effective_to_quarter: "2026-Q1" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q2", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
              captures: { run_r: $.data.id }
            - call: "GET /actuarial/development-patterns/${pat}"
              as: ActuarialAnalyst
              captures: { factors: $.data.selected_factors, tail: $.data.tail_factor }
          assert:
            - "DevelopmentPattern.${pat}.selected_factors == [1.2345] (raw 1.23445 rounded half-up per factor before any multiplication)"
            - "DevelopmentPattern.${pat}.tail_factor == 1.0 (fewer than 3 factors)"
            - "ReserveRun.${run_r}.ultimate_cents == 222205 (123445 x CDF(1)=1.0 + round(80000 x 1.2345) = 123445 + 98760)"
            - "ReserveRun.${run_r}.ibnr_cents == 18760"
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_open_closed_reopened_cycle
        grounds:
          - state_machines.Claim.OPEN_to_CLOSED
          - state_machines.Claim.CLOSED_to_REOPENED
          - state_machines.Claim.REOPENED_to_CLOSED
        distinguishing_aspect: |
          Cyclic machine on Claim (distinct entity from the second instance's
          ReservingStudy): the full loop OPEN -> CLOSED -> REOPENED -> CLOSED is
          legal, so CLOSED is not absorbing and the same close trigger is valid
          from two different from-states.
        test_recipe:
          setup:
            - "Segment exists; claim C-N created (OPEN) with zero case outstanding"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Cycle Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 400000, max_range_width_pct: 1.0, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-N", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_n: $.data.id }
          trigger:
            - call: "POST /actuarial/claims/${cl_n}/status"
              payload: { target_status: "CLOSED" }
              as: ClaimsExaminer
              captures: { s1: $.data.status }
            - call: "POST /actuarial/claims/${cl_n}/status"
              payload: { target_status: "REOPENED" }
              as: ClaimsExaminer
              captures: { s2: $.data.status }
            - call: "POST /actuarial/claims/${cl_n}/status"
              payload: { target_status: "CLOSED" }
              as: ClaimsExaminer
              captures: { s3: $.data.status, v3: $.data.version }
          assert:
            - "s1 == CLOSED (OPEN -> CLOSED)"
            - "s2 == REOPENED (cycle back)"
            - "s3 == CLOSED (second close from REOPENED)"
            - "Claim.${cl_n}.version == 4 after three transitions on top of creation"
      - name: study_draft_in_review_revision_loop
        grounds:
          - state_machines.ReservingStudy.DRAFT_to_IN_REVIEW
          - state_machines.ReservingStudy.IN_REVIEW_to_DRAFT
          - state_machines.ReservingStudy.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Revision loop on ReservingStudy (distinct entity from Claim): the
          DRAFT -> IN_REVIEW -> DRAFT reject loop may repeat; a REJECTED study is
          re-submittable and can later reach APPROVED, proving IN_REVIEW -> DRAFT
          is a loop edge, not a terminal rejection.
        test_recipe:
          setup:
            - "Main Book shared fixture with triangle, SELECTED pattern, and fresh CHAIN_LADDER + BORNHUETTER_FERGUSON runs for 2025-Q3"
            - "DRAFT study created by user analyst-1 with selected_method CHAIN_LADDER, selected_basis PAID"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
