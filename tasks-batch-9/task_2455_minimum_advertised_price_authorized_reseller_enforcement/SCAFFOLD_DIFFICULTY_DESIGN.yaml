              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "Tiny Distribution", annual_chargeback_cap_cents: 5000 }
              as: BrandChannelManager
              captures: { d_id: $.data.id }
            - call: "POST /serial-units"
              payload: { serial_number: "SN-40", product_id: "${prod_id}", lot_code: "LOT-E", shipped_distributor_id: "${d_id}" }
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "GreyDeals", listing_url: "https://bigmarket.example/greydeals/sub-1", listed_price_cents: 14000, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_id: $.data.id }
            - call: "POST /test-purchases"
              payload: { observation_id: "${obs_id}", ordered_at: "2026-08-08T00:00:00Z", purchase_price_cents: 14000 }
              as: MonitoringAnalyst
