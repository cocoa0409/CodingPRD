scenario: |
  529 College Savings Account Management: Donors/beneficiaries, state-by-state tax
  benefit matching, recurring/lump-sum contributions, qualified education expenses
  (K-12 annual cap), beneficiary changes, excess withdrawal penalties, Form 1099-Q
  tax reporting.

domain_name: "five-twenty-nine-college-savings"
api_prefix: "/accounts"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # Donor, Beneficiary, Account, Contribution, Withdrawal, RecurringPlan,
  # BeneficiaryChangeRequest, TaxReport, StateRule, EducationExpense — peer
  # entities referenced by foreign keys (account_id, donor_id, beneficiary_id,
  # state_code) rather than nested in URL paths.

  state_machine_shape: branching
  # Withdrawal forks REQUESTED → {DISBURSED, REJECTED}; BeneficiaryChangeRequest
  # forks SUBMITTED → {APPROVED, REJECTED}; RecurringPlan cycles
  # ACTIVE → PAUSED → ACTIVE → CANCELLED; Account cycles OPEN → RESTRICTED → OPEN.

  relationship_patterns:
    - one_to_many        # Account → Contributions, Account → Withdrawals
    - many_to_many       # Donor ↔ Account (a donor can fund many accounts; an account can have multiple co-donors via primary/successor)
    - cross_aggregate    # TaxReport.account_id, EducationExpense → Withdrawal

  role_model: segregation_of_duties
  # Donor opens accounts and contributes; Beneficiary cannot withdraw from their own account
  # (Donor must initiate disbursement); PlanAdministrator reviews beneficiary changes and
  # cannot also contribute on behalf of the donor.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Donor legal name as on tax records"
        constraints: "non-empty, max 200 chars"
      - name: state_of_residence
        type: enum
        source: input
        description: "Two-letter U.S. state code controlling tax benefit eligibility"
        constraints: "exactly two uppercase letters, must match a StateRule.state_code"
      - name: ssn_last_four
        type: string
        source: input
        description: "Last four of donor SSN; required for 1099-Q reporting"
        constraints: "exactly 4 digits"
      - name: ytd_contribution_total_cents
        type: integer
        source: computed
        description: "Calendar-year sum of SETTLED Contribution.amount_cents where donor_id = this.id; recomputed on every contribution settlement and on every January-1 sweep"
        default: 0
      - name: ytd_state_deduction_used_cents
        type: integer
        source: computed
        description: "Calendar-year deduction credited toward this donor's state, capped by StateRule.deduction_cap_cents; see calculations.state_tax_benefit_credit"
        default: 0

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Beneficiary legal name"
        constraints: "non-empty, max 200 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date used to determine K-12 vs post-secondary eligibility window"
      - name: ssn_last_four
        type: string
        source: input
        description: "Last four of beneficiary SSN; required for 1099-Q recipient line"
        constraints: "exactly 4 digits"
      - name: relationship_family_code
        type: enum
        source: input
        description: "IRS family-relationship code controlling permissible beneficiary changes"
        constraints: "one of {SELF, CHILD, SIBLING, NIECE_NEPHEW, PARENT, COUSIN, SPOUSE, IN_LAW, FIRST_COUSIN_ONCE_REMOVED}"
      - name: k12_ytd_qualified_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.qualified_amount_cents this calendar year where expense_category = K_12 and withdrawal.status = CLASSIFIED for accounts whose beneficiary_id = this.id"
        default: 0

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: primary_donor_id
        type: string
        source: input
        description: "FK to Donor; this donor opened the account and is the account owner"
      - name: beneficiary_id
        type: string
        source: input
        description: "FK to Beneficiary; current beneficiary"
      - name: state_plan_code
        type: enum
        source: input
        description: "Two-letter code of the state sponsoring the plan (independent of donor residence); resolves StateRule"
        constraints: "must match a StateRule.state_code"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.Account"
        constraints: "one of {OPEN, RESTRICTED, CLOSED}"
        default: OPEN
      - name: basis_balance_cents
        type: integer
        source: computed
        description: "Sum of after-fee contribution principal still in the account; decremented basis-first on every withdrawal disbursement per calculations.withdrawal_basis_earnings_split"
        default: 0
      - name: earnings_balance_cents
        type: integer
        source: computed
        description: "Accumulated earnings = total_balance_cents - basis_balance_cents; the portion subject to tax on non-qualified withdrawals"
        default: 0
      - name: total_balance_cents
        type: integer
        source: computed
        description: "basis_balance_cents + earnings_balance_cents; canonical balance shown to the donor"
        default: 0
      - name: lifetime_contribution_cap_cents
        type: integer
        source: computed
        description: "Frozen at OPEN from StateRule.lifetime_aggregate_cap_cents at the moment of opening; never re-read from StateRule on subsequent contributions (pinned at version_at_open)"
      - name: state_rule_version_at_open
        type: integer
        source: computed
        description: "Snapshot of StateRule.version at the moment Account was opened; used to detect drift if StateRule is later updated"

  - name: Contribution
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account"
      - name: donor_id
        type: string
        source: input
        description: "FK to Donor; need not equal Account.primary_donor_id (third-party contributions allowed)"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross contribution amount in cents; must be > 0"
        constraints: "> 0; integer cents"
      - name: contribution_kind
        type: enum
        source: input
        description: "LUMP_SUM (one-off) or RECURRING (created by a RecurringPlan)"
        constraints: "one of {LUMP_SUM, RECURRING}"
      - name: recurring_plan_id
        type: string
        source: input
        description: "FK to RecurringPlan when contribution_kind=RECURRING; null otherwise"
        default: null
      - name: status
        type: enum
        source: computed
        description: "See state_machines.Contribution"
        constraints: "one of {PENDING, SETTLED, REVERSED}"
        default: PENDING
      - name: settled_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp when Contribution.status flipped to SETTLED; sets the calendar year used for tax-deduction credit"
        default: null

  - name: Withdrawal
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Gross dollars requested; must be > 0 and <= Account.total_balance_cents at REQUESTED time"
        constraints: "> 0"
      - name: expense_category
        type: enum
        source: input
        description: "Drives qualified-vs-non-qualified classification and which annual cap applies"
        constraints: "one of {POST_SECONDARY_TUITION, ROOM_AND_BOARD, BOOKS_SUPPLIES, K_12, NON_QUALIFIED}"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.Withdrawal"
        constraints: "one of {REQUESTED, REJECTED, DISBURSED, CLASSIFIED, REPORTED}"
        default: REQUESTED
      - name: basis_portion_cents
        type: integer
        source: computed
        description: "Computed at DISBURSED via calculations.withdrawal_basis_earnings_split"
        default: null
      - name: earnings_portion_cents
        type: integer
        source: computed
        description: "Computed at DISBURSED via calculations.withdrawal_basis_earnings_split"
        default: null
      - name: qualified_amount_cents
        type: integer
        source: computed
        description: "Portion of requested_amount_cents that is qualified after applying K-12 annual cap and matching against EducationExpense receipts; computed at CLASSIFIED"
        default: null
      - name: non_qualified_amount_cents
        type: integer
        source: computed
        description: "requested_amount_cents - qualified_amount_cents; computed at CLASSIFIED"
        default: null
      - name: penalty_cents
        type: integer
        source: computed
        description: "10% penalty on the earnings share of non_qualified_amount_cents per calculations.non_qualified_penalty"
        default: null
      - name: rejected_reason
        type: enum
        source: computed
        description: "Reason code when status=REJECTED"
        constraints: "one of {INSUFFICIENT_BALANCE, ACCOUNT_RESTRICTED, K12_CAP_WOULD_EXCEED, EXPENSE_RECEIPT_MISSING}"
        default: null

  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account"
      - name: donor_id
        type: string
        source: input
        description: "FK to Donor doing the recurring contribution"
      - name: amount_cents
        type: integer
        source: input
        description: "Per-cycle amount"
        constraints: "> 0"
      - name: cadence_days
        type: integer
        source: input
        description: "Days between scheduled contributions"
        constraints: "one of {7, 14, 30, 90, 365}"
      - name: next_run_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC; the soonest moment a sweep will materialize a Contribution from this plan"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.RecurringPlan"
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"
        default: ACTIVE

  - name: BeneficiaryChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account whose beneficiary_id is being changed"
      - name: current_beneficiary_id
        type: string
        source: computed
        description: "Snapshot of Account.beneficiary_id at SUBMITTED time"
      - name: proposed_beneficiary_id
        type: string
        source: input
        description: "FK to Beneficiary that would replace the current one"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.BeneficiaryChangeRequest"
        constraints: "one of {SUBMITTED, APPROVED, REJECTED}"
        default: SUBMITTED
      - name: rejection_reason
        type: enum
        source: computed
        description: "Reason code when status=REJECTED"
        constraints: "one of {RELATIONSHIP_NOT_PERMITTED, GENERATION_SKIP, ACCOUNT_NOT_OPEN, IDENTICAL_TO_CURRENT}"
        default: null

  - name: EducationExpense
    parent: null
    common_fields: false
    fields:
      - name: withdrawal_id
        type: string
        source: input
        description: "FK to Withdrawal; receipts are attached after disbursement to substantiate qualification"
      - name: institution_name
        type: string
        source: input
        description: "Name of the school or vendor"
        constraints: "non-empty, max 200 chars"
      - name: category
        type: enum
        source: input
        description: "Must equal the parent Withdrawal.expense_category for qualification credit"
        constraints: "one of {POST_SECONDARY_TUITION, ROOM_AND_BOARD, BOOKS_SUPPLIES, K_12, NON_QUALIFIED}"
      - name: amount_cents
        type: integer
        source: input
        description: "Receipt face amount in cents"
        constraints: "> 0"
      - name: incurred_on
        type: string
        source: input
        description: "ISO 8601 date the expense was incurred; must fall in the same calendar year as the Withdrawal disbursement"

  - name: TaxReport
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account"
      - name: tax_year
        type: integer
        source: input
        description: "Four-digit calendar year covered by this 1099-Q"
        constraints: ">= 2000"
      - name: gross_distribution_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.requested_amount_cents for the account in tax_year, where status IN {CLASSIFIED, REPORTED}; box 1 of 1099-Q"
      - name: earnings_cents
        type: integer
        source: computed
        description: "Sum of per-withdrawal earnings_portion_cents in tax_year; box 2 of 1099-Q. Per-withdrawal rounding then sum, NOT sum-then-round (see calculations.tax_report_aggregation)"
      - name: basis_cents
        type: integer
        source: computed
        description: "gross_distribution_cents - earnings_cents; box 3 of 1099-Q"
      - name: total_penalty_cents
        type: integer
        source: computed
        description: "Sum of Withdrawal.penalty_cents in tax_year"
      - name: locked
        type: boolean
        source: computed
        description: "True once the report has been finalized; immutable thereafter"
        default: false

  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter U.S. state code"
        constraints: "exactly two uppercase letters; unique"
      - name: deduction_cap_cents
        type: integer
        source: input
        description: "Maximum annual state-income-tax deduction a single donor may claim"
        constraints: ">= 0"
      - name: parity
        type: enum
        source: input
        description: "IN_STATE_ONLY (deduction only for state_plan_code == donor.state_of_residence) or PARITY (deduction allowed for any state's plan)"
        constraints: "one of {IN_STATE_ONLY, PARITY}"
      - name: lifetime_aggregate_cap_cents
        type: integer
        source: input
        description: "Maximum cumulative contributions an account in this state may ever hold; pinned onto Account.lifetime_contribution_cap_cents at open"
        constraints: "> 0"
      - name: k12_qualified
        type: boolean
        source: input
        description: "Whether the state recognizes K-12 expenses as qualified for state-tax purposes (federal cap still applies)"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /accounts/{id}/restrict"
        actor: PlanAdministrator
        preconditions:
          - "Account.status == OPEN"
        side_effects:
          - "All RecurringPlans with account_id = this.id and status=ACTIVE transition to PAUSED"
          - "No new Contributions or Withdrawals may transition from REQUESTED while RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /accounts/{id}/release"
        actor: PlanAdministrator
        preconditions:
          - "Account.status == RESTRICTED"
        side_effects:
          - "No automatic resumption of RecurringPlans; donor must explicitly unpause"
      - from: OPEN
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Donor
        preconditions:
          - "Account.total_balance_cents == 0"
          - "No Withdrawal on this account has status IN {REQUESTED, DISBURSED, CLASSIFIED}"
          - "No BeneficiaryChangeRequest on this account has status == SUBMITTED"
        side_effects:
          - "All RecurringPlans on this account transition to CANCELLED"

  - entity: Contribution
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /contributions/{id}/settle"
        actor: system
        preconditions:
          - "Account.status == OPEN"
          - "Account.total_balance_cents + Contribution.amount_cents <= Account.lifetime_contribution_cap_cents"
          - "Donor.ytd_contribution_total_cents + Contribution.amount_cents <= ANNUAL_GIFT_EXCLUSION_CENTS"
        side_effects:
          - "Account.basis_balance_cents increases by Contribution.amount_cents"
          - "Account.total_balance_cents increases by Contribution.amount_cents"
          - "Donor.ytd_contribution_total_cents increases by Contribution.amount_cents"
          - "Contribution.settled_at = now()"
          - "Trigger calculations.state_tax_benefit_credit; Donor.ytd_state_deduction_used_cents may increase"
      - from: PENDING
        to: REVERSED
        trigger: "POST /contributions/{id}/reverse"
        actor: PlanAdministrator
        preconditions:
          - "Contribution.status == PENDING"
        side_effects:
          - "No balance change (never settled)"
        note: "Reversal of a SETTLED contribution is not supported; mistakes there require a Withdrawal."

  - entity: Withdrawal
    initial_state: REQUESTED
    terminal_states: [REJECTED, REPORTED]
    transitions:
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /withdrawals/{id}/reject"
        actor: PlanAdministrator
        preconditions:
          - "Withdrawal.status == REQUESTED"
        side_effects:
          - "Withdrawal.rejected_reason set"
          - "No balance change"
      - from: REQUESTED
        to: DISBURSED
        trigger: "POST /withdrawals/{id}/disburse"
        actor: Donor
        preconditions:
          - "Account.status == OPEN"
          - "Withdrawal.requested_amount_cents <= Account.total_balance_cents"
        side_effects:
          - "calculations.withdrawal_basis_earnings_split runs; Withdrawal.basis_portion_cents and Withdrawal.earnings_portion_cents are set"
          - "Account.basis_balance_cents decreases by Withdrawal.basis_portion_cents"
          - "Account.earnings_balance_cents decreases by Withdrawal.earnings_portion_cents"
          - "Account.total_balance_cents decreases by Withdrawal.requested_amount_cents"
      - from: DISBURSED
        to: CLASSIFIED
        trigger: "POST /withdrawals/{id}/classify"
        actor: Donor
        preconditions:
          - "Withdrawal.status == DISBURSED"
          - "If Withdrawal.expense_category != NON_QUALIFIED then sum of EducationExpense.amount_cents for this withdrawal_id with matching category > 0"
        side_effects:
          - "calculations.k12_cap_application runs; Withdrawal.qualified_amount_cents and Withdrawal.non_qualified_amount_cents are set"
          - "calculations.non_qualified_penalty runs; Withdrawal.penalty_cents is set"
          - "Beneficiary.k12_ytd_qualified_cents increases by the K-12 portion of qualified_amount_cents"
      - from: CLASSIFIED
        to: REPORTED
        trigger: "POST /tax-reports/{id}/finalize cascades into all CLASSIFIED Withdrawals in that tax year on that account"
        actor: PlanAdministrator
        preconditions:
          - "Withdrawal.status == CLASSIFIED"
          - "Withdrawal disbursement year == TaxReport.tax_year"
          - "TaxReport.locked is being set to true in this transition"
        side_effects:
          - "TaxReport.gross_distribution_cents, earnings_cents, basis_cents, total_penalty_cents are recomputed via calculations.tax_report_aggregation immediately before lock"
          - "TaxReport.locked = true"

  - entity: RecurringPlan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /recurring-plans/{id}/pause OR cascade from Account RESTRICTED"
        actor: Donor | system
        preconditions:
          - "RecurringPlan.status == ACTIVE"
        side_effects:
          - "Plan stops producing Contributions on its next scheduled run"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /recurring-plans/{id}/resume"
        actor: Donor
        preconditions:
          - "RecurringPlan.status == PAUSED"
          - "Account.status == OPEN"
        side_effects:
          - "RecurringPlan.next_run_at = now() + cadence_days * 86400 seconds"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel OR cascade from Account CLOSE"
        actor: Donor | system
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel OR cascade from Account CLOSE"
        actor: Donor | system
        preconditions: []
        side_effects: []

  - entity: BeneficiaryChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /beneficiary-change-requests/{id}/approve"
        actor: PlanAdministrator
        preconditions:
          - "BeneficiaryChangeRequest.status == SUBMITTED"
          - "Account.status == OPEN"
          - "proposed Beneficiary.relationship_family_code is in the IRS permissible-family set relative to current Beneficiary (see validations[priority=12])"
          - "proposed Beneficiary.id != current_beneficiary_id"
        side_effects:
          - "Account.beneficiary_id = proposed_beneficiary_id"
          - "No basis/earnings reset; the account balances carry over unchanged (this is the conserved-quantity invariant)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /beneficiary-change-requests/{id}/reject"
        actor: PlanAdministrator
        preconditions:
          - "BeneficiaryChangeRequest.status == SUBMITTED"
        side_effects:
          - "BeneficiaryChangeRequest.rejection_reason is set"
          - "No mutation to Account"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Donor disburses a Withdrawal while PlanAdministrator restricts the Account"
    guarantee: "Exactly one operation succeeds. If RESTRICT lands first, the disburse attempt sees Account.status=RESTRICTED and is rejected."
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    serialization: "First-writer-wins on Account.status"

  - scenario: "Two concurrent disbursements from the same Account that together exceed total_balance_cents"
    guarantee: "Only one disbursement succeeds; the second is rejected because the remaining balance after the first commit is insufficient"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    serialization: "First-writer-wins on Account.total_balance_cents; second disburse re-reads and fails the balance precondition"

  - scenario: "Two BeneficiaryChangeRequests on the same Account approved simultaneously"
    guarantee: "Exactly one approval lands; the loser is rejected because Account.beneficiary_id has already changed and the loser's current_beneficiary_id snapshot is stale"
    error_id: ERR_STALE_BENEFICIARY_SNAPSHOT
    http_status: 409
    serialization: "First-writer-wins on Account.beneficiary_id; loser fails the snapshot match"

  - scenario: "TaxReport finalize races a new Withdrawal classify in the same tax year"
    guarantee: "If finalize wins, the late classify is rejected because the report is locked; if classify wins, finalize re-aggregates including the new row"
    error_id: ERR_TAX_REPORT_LOCKED
    http_status: 409
    serialization: "First-writer-wins on TaxReport.locked"

  - scenario: "Two Contributions on the same Account where each individually fits the lifetime cap but together exceed it"
    guarantee: "First-writer-wins on Account.total_balance_cents; second contribution settle is rejected because the post-credit total would exceed Account.lifetime_contribution_cap_cents"
    error_id: ERR_LIFETIME_CAP_WOULD_EXCEED
    http_status: 409
    serialization: "First-writer-wins on Account.total_balance_cents"

  - scenario: "OCC version stale write on PATCH /accounts/{id} or PATCH /recurring-plans/{id}"
    guarantee: "Loser whose request.version is less than current row version is rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-swap on the version field"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: withdrawal_basis_earnings_split
    trigger: "Withdrawal transition REQUESTED → DISBURSED"
    algorithm: aggregation
    formula: |
      # All quantities are integer cents. earnings_portion is rounded to the nearest cent
      # using round_half_up; basis_portion is the residual so basis + earnings = requested.
      total = Account.total_balance_cents          # pre-disbursement
      if total == 0:
        raise ERR_INSUFFICIENT_BALANCE
      earnings_ratio = Account.earnings_balance_cents / total       # float in [0, 1]
      earnings_portion_cents = round_half_up(Withdrawal.requested_amount_cents * earnings_ratio)
      basis_portion_cents = Withdrawal.requested_amount_cents - earnings_portion_cents
    input_set: "Account.basis_balance_cents and Account.earnings_balance_cents as of the moment immediately before the disbursement commit; Withdrawal.requested_amount_cents"
    constants: {}
    precision: "round_half_up to integer cents; earnings_portion rounded, basis_portion = requested - earnings_portion (residual, never separately rounded)"
    variants:
      - name: qualified
        when: "Withdrawal.expense_category != NON_QUALIFIED AND Withdrawal eventually reaches CLASSIFIED with qualified_amount_cents == requested_amount_cents"
        difference: "earnings_portion is reported on 1099-Q box 2 but NOT taxed and NOT penalized"
      - name: non_qualified
        when: "Withdrawal.expense_category == NON_QUALIFIED OR qualified_amount_cents < requested_amount_cents"
        difference: "earnings_portion attributable to the non-qualified share is taxable AND triggers calculations.non_qualified_penalty at 10%"

  - name: state_tax_benefit_credit
    trigger: "Contribution transition PENDING → SETTLED"
    algorithm: tiered_pricing
    formula: |
      # All quantities integer cents.
      donor = Donor[Contribution.donor_id]
      account = Account[Contribution.account_id]
      rule = StateRule[state_code = donor.state_of_residence]
      if rule.parity == IN_STATE_ONLY and account.state_plan_code != donor.state_of_residence:
        credit_cents = 0
      else:
        room = max(0, rule.deduction_cap_cents - donor.ytd_state_deduction_used_cents)
        credit_cents = min(Contribution.amount_cents, room)
      donor.ytd_state_deduction_used_cents += credit_cents
    input_set: "All SETTLED Contributions made by donor in the same calendar year as Contribution.settled_at, aggregated to donor.ytd_state_deduction_used_cents BEFORE this contribution; StateRule of donor.state_of_residence (NOT account.state_plan_code)"
    constants: {}
    precision: "integer cents; no rounding required"
    variants:
      - name: in_state_match
        when: "StateRule.parity == IN_STATE_ONLY AND account.state_plan_code == donor.state_of_residence"
        difference: "credit_cents = min(Contribution.amount_cents, room)"
      - name: cross_state_no_credit
        when: "StateRule.parity == IN_STATE_ONLY AND account.state_plan_code != donor.state_of_residence"
        difference: "credit_cents = 0 regardless of cap room; the contribution still settles but yields zero deduction"

  - name: k12_cap_application
    trigger: "Withdrawal transition DISBURSED → CLASSIFIED"
    algorithm: threshold
    formula: |
      # K-12 federal annual cap is $10,000 per beneficiary per calendar year.
      # Cap applies cumulatively across ALL accounts whose beneficiary_id matches this beneficiary.
      cap_room_cents = K12_ANNUAL_CAP_CENTS - Beneficiary.k12_ytd_qualified_cents
      # Sum of substantiated EducationExpense receipts for this Withdrawal:
      receipts_total_cents = sum(EducationExpense.amount_cents where withdrawal_id = this.id and category = this.expense_category)
      requested = Withdrawal.requested_amount_cents

      if Withdrawal.expense_category == NON_QUALIFIED:
        qualified_amount_cents = 0
      elif Withdrawal.expense_category == K_12:
        # K-12 has BOTH the receipts ceiling AND the federal $10k cap
        qualified_amount_cents = min(requested, receipts_total_cents, cap_room_cents)
      else:
        # Post-secondary categories: only the receipts ceiling
        qualified_amount_cents = min(requested, receipts_total_cents)

      non_qualified_amount_cents = requested - qualified_amount_cents
    input_set: "All Withdrawals across all accounts for this Beneficiary with status IN {CLASSIFIED, REPORTED} and expense_category=K_12 and disbursed in the current calendar year (these define k12_ytd_qualified_cents); plus the EducationExpense receipts attached to THIS Withdrawal"
    constants:
      K12_ANNUAL_CAP_CENTS: 1000000   # $10,000 in cents
    precision: "integer cents; no rounding"
    variants:
      - name: under_cap_room
        when: "Beneficiary.k12_ytd_qualified_cents + requested <= K12_ANNUAL_CAP_CENTS AND receipts cover the request"
        difference: "qualified_amount_cents = requested_amount_cents; non_qualified_amount_cents = 0"
      - name: cap_partially_consumed
        when: "Beneficiary.k12_ytd_qualified_cents + requested > K12_ANNUAL_CAP_CENTS but cap_room_cents > 0"
        difference: "qualified_amount_cents = cap_room_cents; non_qualified_amount_cents = requested - cap_room_cents"

  - name: non_qualified_penalty
    trigger: "Withdrawal transition DISBURSED → CLASSIFIED, immediately after k12_cap_application"
    algorithm: threshold
    formula: |
      # Penalty is 10% of the earnings share attributable to the non-qualified portion.
      # The earnings share is allocated PROPORTIONALLY to the dollar split, NOT basis-first.
      requested = Withdrawal.requested_amount_cents
      if requested == 0 or Withdrawal.non_qualified_amount_cents == 0:
        penalty_cents = 0
      else:
        earnings_share_of_non_qualified_cents = round_half_up(
          Withdrawal.earnings_portion_cents * Withdrawal.non_qualified_amount_cents / requested
        )
        penalty_cents = round_half_up(earnings_share_of_non_qualified_cents * PENALTY_RATE)
    input_set: "Withdrawal.earnings_portion_cents (already pinned at DISBURSED), Withdrawal.non_qualified_amount_cents (just computed by k12_cap_application), Withdrawal.requested_amount_cents"
    constants:
      PENALTY_RATE: 0.10
    precision: "Round earnings_share first, then multiply by 0.10 and round again (nested round per (b)). Both roundings are round_half_up to integer cents."
    variants:
      - name: fully_qualified_no_penalty
        when: "Withdrawal.non_qualified_amount_cents == 0"
        difference: "penalty_cents = 0"
      - name: partial_penalty
        when: "0 < non_qualified_amount_cents < requested_amount_cents"
        difference: "penalty applied only to the proportional earnings share of the non-qualified portion"

  - name: tax_report_aggregation
    trigger: "TaxReport transition (any update or finalize on a TaxReport row); finalize cascades CLASSIFIED → REPORTED on every contained Withdrawal"
    algorithm: aggregation
    formula: |
      # The 1099-Q boxes are sums of PER-WITHDRAWAL rounded values.
      # Per-withdrawal rounding happens at DISBURSED/CLASSIFIED; we never re-derive from
      # ratio*total at report time, which would change cents due to double rounding.
      withdrawals = [
        W for W in Withdrawal
        where W.account_id == TaxReport.account_id
          and tax_year_of(W.disbursed_at) == TaxReport.tax_year
          and W.status IN {CLASSIFIED, REPORTED}
      ]
      # Tie-break for chronological ordering: ascending W.created_at, then ascending W.id
      withdrawals.sort(key=lambda w: (w.created_at, w.id))

      gross_distribution_cents = sum(W.requested_amount_cents for W in withdrawals)
      earnings_cents          = sum(W.earnings_portion_cents for W in withdrawals)
      basis_cents             = gross_distribution_cents - earnings_cents
      total_penalty_cents     = sum(W.penalty_cents for W in withdrawals)
    input_set: "All Withdrawal rows for the account where disbursed_at falls in tax_year and status is CLASSIFIED or REPORTED. Reversed/Rejected/Requested rows are EXCLUDED."
    constants: {}
    precision: "Per-withdrawal values are already cent-rounded; the aggregation is a pure integer sum. Sum-then-round (re-deriving earnings from total*ratio at report time) is INCORRECT."
    variants:
      - name: live_recompute
        when: "TaxReport.locked == false"
        difference: "Boxes 1-4 are recomputed on every read"
      - name: frozen_snapshot
        when: "TaxReport.locked == true"
        difference: "Boxes 1-4 are immutable; subsequent withdrawals in the same year are rejected (ERR_TAX_REPORT_LOCKED)"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request includes X-User-Role and X-User-ID headers"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Donor, Beneficiary, PlanAdministrator}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path resource ids (account_id, withdrawal_id, contribution_id, …) resolve to live rows, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Body-referenced resource ids (donor_id, beneficiary_id, account_id, recurring_plan_id, withdrawal_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying foreign keys in the body"

  - priority: 6
    category: state
    check: "Account.status == OPEN for any Contribution create, Withdrawal create, Withdrawal disburse, RecurringPlan create, RecurringPlan resume, BeneficiaryChangeRequest approve"
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: "POST /accounts/{id}/contributions, POST /accounts/{id}/withdrawals, POST /withdrawals/{id}/disburse, POST /accounts/{id}/recurring-plans, POST /recurring-plans/{id}/resume, POST /beneficiary-change-requests/{id}/approve"

  - priority: 7
    category: state
    check: "Source state of the target row matches the transition's from-state (e.g., Withdrawal.status==REQUESTED for /disburse)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "TaxReport for the relevant (account_id, tax_year) is not locked when classifying a withdrawal in that year"
    error_id: ERR_TAX_REPORT_LOCKED
    http_status: 409
    applies_to: "POST /withdrawals/{id}/classify, POST /withdrawals/{id}/disburse"
    note: "This safety/compliance check fires BEFORE business_fiscal checks (priority 9+). A disbursement attempt against a year whose 1099-Q is already locked is a regulatory error even if balance is available."

  - priority: 9
    category: business_referential
    check: "For Withdrawal.classify, every attached EducationExpense.category equals Withdrawal.expense_category; mismatched receipts are rejected before any cap math is run"
    error_id: ERR_EXPENSE_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /withdrawals/{id}/classify"

  - priority: 10
    category: business_temporal
    check: "EducationExpense.incurred_on falls in the same calendar year (UTC) as the Withdrawal disbursement"
    error_id: ERR_EXPENSE_OUT_OF_YEAR
    http_status: 422
    applies_to: "POST /withdrawals/{id}/expenses"

  - priority: 11
    category: business_referential
    check: "For BeneficiaryChangeRequest.approve, proposed Beneficiary.id != current Account.beneficiary_id (no-op change forbidden)"
    error_id: ERR_BENEFICIARY_IDENTICAL_TO_CURRENT
    http_status: 422
    applies_to: "POST /beneficiary-change-requests/{id}/approve"

  - priority: 12
    category: business_safety
    check: "Proposed Beneficiary.relationship_family_code is in the IRS permissible-family set relative to the current Beneficiary; otherwise reject. Generation-skip (CHILD → PARENT or CHILD → IN_LAW where the new beneficiary is one or more generations older) is REJECTED with a distinct error."
    error_id: ERR_BENEFICIARY_RELATIONSHIP_FORBIDDEN
    http_status: 422
    applies_to: "POST /beneficiary-change-requests/{id}/approve"
    note: "Permissible family set per IRS §529: CHILD, SIBLING, NIECE_NEPHEW, COUSIN, FIRST_COUSIN_ONCE_REMOVED, SPOUSE, IN_LAW, PARENT — but NOT a generation that skips upward. Implementations should table-drive the (from_relationship, to_relationship) pairs."

  - priority: 13
    category: business_safety
    check: "Beneficiary generation-skip: rejecting the change when the proposed beneficiary's relationship is more than one generation removed upward from the current (e.g., changing from CHILD to PARENT skips upward)"
    error_id: ERR_BENEFICIARY_GENERATION_SKIP
    http_status: 422
    applies_to: "POST /beneficiary-change-requests/{id}/approve"
    note: "This is a SAFETY check (priority 13) that fires BEFORE the business_constraint k-12 cap check at priority 16. The conflict resolution between this priority and priority 16 is the basis for rule_5 (priority_pair_validation_conflict)."

  - priority: 14
    category: business_fiscal
    check: "Donor.ytd_contribution_total_cents + Contribution.amount_cents <= ANNUAL_GIFT_EXCLUSION_CENTS (IRS gift-tax exclusion per donor per year, $18,000 cents=1,800,000)"
    error_id: ERR_GIFT_EXCLUSION_EXCEEDED
    http_status: 422
    applies_to: "POST /contributions/{id}/settle"

  - priority: 15
    category: business_fiscal
    check: "Account.total_balance_cents + Contribution.amount_cents <= Account.lifetime_contribution_cap_cents"
    error_id: ERR_LIFETIME_CAP_WOULD_EXCEED
    http_status: 422
    applies_to: "POST /contributions/{id}/settle"

  - priority: 16
    category: business_constraint
    check: "For Withdrawal.classify where expense_category == K_12: requested_amount_cents <= (K12_ANNUAL_CAP_CENTS - Beneficiary.k12_ytd_qualified_cents). If exceeded, classify still succeeds but Withdrawal.non_qualified_amount_cents > 0; if there is also zero cap_room remaining AND zero receipts, then ERR_K12_CAP_EXCEEDED fires when the user instead attempted /withdrawals create with category=K_12 against a beneficiary who has zero room left."
    error_id: ERR_K12_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /accounts/{id}/withdrawals"
    note: "Boundary precision: a withdrawal that lands EXACTLY on the cap (cap_room == requested) is ALLOWED (>=, not >); a withdrawal that crosses by even one cent into negative cap_room is REJECTED at create time."

  - priority: 17
    category: business_fiscal
    check: "Withdrawal.requested_amount_cents <= Account.total_balance_cents at REQUEST time (pre-check; final check at DISBURSE re-reads balance)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /accounts/{id}/withdrawals, POST /withdrawals/{id}/disburse"

  - priority: 18
    category: business_referential
    check: "OCC: request.version (when supplied on PATCH endpoints) matches the row's current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Donor -----
  - method: POST
    path: "/donors"
    description: "Register a donor"
    roles: [PlanAdministrator]
    code: 201
    input: [full_name, state_of_residence, ssn_last_four]
    output: Donor
    side_effects: []

  - method: GET
    path: "/donors/{id}"
    description: "Get a donor including computed YTD totals"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # ----- Beneficiary -----
  - method: POST
    path: "/beneficiaries"
    description: "Register a beneficiary"
    roles: [PlanAdministrator, Donor]
    code: 201
    input: [full_name, date_of_birth, ssn_last_four, relationship_family_code]
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Get a beneficiary including k12_ytd_qualified_cents"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  # ----- Account -----
  - method: POST
    path: "/accounts"
    description: "Open a 529 account; pins lifetime_contribution_cap_cents and state_rule_version_at_open"
    roles: [Donor]
    code: 201
    input: [primary_donor_id, beneficiary_id, state_plan_code]
    output: Account
    side_effects:
      - "Account.lifetime_contribution_cap_cents = StateRule[state_plan_code].lifetime_aggregate_cap_cents"
      - "Account.state_rule_version_at_open = StateRule[state_plan_code].version"

  - method: GET
    path: "/accounts/{id}"
    description: "Get account incl. computed balances"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts; supports filter by primary_donor_id, beneficiary_id, status, state_plan_code"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: ["primary_donor_id?, beneficiary_id?, status?, state_plan_code?, limit?, offset?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/restrict"
    description: "Restrict the account; pauses all ACTIVE recurring plans"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Cascade: every RecurringPlan with account_id=this.id and status=ACTIVE → PAUSED"

  - method: POST
    path: "/accounts/{id}/release"
    description: "Release the restriction"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/close"
    description: "Close an account with zero balance"
    roles: [Donor]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Cascade: every RecurringPlan with account_id=this.id and status IN {ACTIVE, PAUSED} → CANCELLED"

  # ----- Contributions -----
  - method: POST
    path: "/accounts/{id}/contributions"
    description: "Create a contribution in PENDING; donor_id may differ from primary_donor_id (third-party gift)"
    roles: [Donor]
    code: 201
    input: ["donor_id, amount_cents, contribution_kind, recurring_plan_id?"]
    output: Contribution
    side_effects:
      - "Contribution.status = PENDING"

  - method: POST
    path: "/contributions/{id}/settle"
    description: "Settle a PENDING contribution; updates account balances and donor YTD"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "calculations.state_tax_benefit_credit runs"
      - "Account.basis_balance_cents, total_balance_cents increase"
      - "Donor.ytd_contribution_total_cents, ytd_state_deduction_used_cents update"

  - method: POST
    path: "/contributions/{id}/reverse"
    description: "Reverse a PENDING contribution (cannot reverse SETTLED)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/contributions/{id}"
    description: "Get a contribution"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/accounts/{id}/contributions"
    description: "List contributions on an account, filter by status and contribution_kind"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: ["status?, contribution_kind?, limit?, offset?"]
    output: "Contribution[]"
    side_effects: []

  # ----- Recurring plans -----
  - method: POST
    path: "/accounts/{id}/recurring-plans"
    description: "Create a recurring plan"
    roles: [Donor]
    code: 201
    input: [donor_id, amount_cents, cadence_days]
    output: RecurringPlan
    side_effects:
      - "RecurringPlan.next_run_at = now() + cadence_days * 86400 seconds"

  - method: PATCH
    path: "/recurring-plans/{id}"
    description: "Update plan amount or cadence; requires version for OCC"
    roles: [Donor]
    code: 200
    input: ["amount_cents?, cadence_days?, version"]
    output: RecurringPlan
    side_effects: []

  - method: POST
    path: "/recurring-plans/{id}/pause"
    description: "Pause an ACTIVE recurring plan"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []

  - method: POST
    path: "/recurring-plans/{id}/resume"
    description: "Resume a PAUSED plan; only if Account is OPEN"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects:
      - "RecurringPlan.next_run_at = now() + cadence_days * 86400 seconds"

  - method: POST
    path: "/recurring-plans/{id}/cancel"
    description: "Cancel a recurring plan"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []

  # ----- Withdrawals -----
  - method: POST
    path: "/accounts/{id}/withdrawals"
    description: "Create a withdrawal request"
    roles: [Donor]
    code: 201
    input: [requested_amount_cents, expense_category]
    output: Withdrawal
    side_effects:
      - "Withdrawal.status = REQUESTED"

  - method: POST
    path: "/withdrawals/{id}/disburse"
    description: "Disburse a REQUESTED withdrawal; runs withdrawal_basis_earnings_split"
    roles: [Donor]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.basis_portion_cents, earnings_portion_cents set"
      - "Account.basis_balance_cents, earnings_balance_cents, total_balance_cents decrease"

  - method: POST
    path: "/withdrawals/{id}/reject"
    description: "Reject a REQUESTED withdrawal"
    roles: [PlanAdministrator]
    code: 200
    input: [rejected_reason]
    output: Withdrawal
    side_effects: []

  - method: POST
    path: "/withdrawals/{id}/expenses"
    description: "Attach an EducationExpense receipt to a DISBURSED withdrawal"
    roles: [Donor]
    code: 201
    input: [institution_name, category, amount_cents, incurred_on]
    output: EducationExpense
    side_effects: []

  - method: POST
    path: "/withdrawals/{id}/classify"
    description: "Classify DISBURSED → CLASSIFIED; runs k12_cap_application and non_qualified_penalty"
    roles: [Donor]
    code: 200
    input: []
    output: Withdrawal
    side_effects:
      - "Withdrawal.qualified_amount_cents, non_qualified_amount_cents, penalty_cents set"
      - "Beneficiary.k12_ytd_qualified_cents may increase"

  - method: GET
    path: "/withdrawals/{id}"
    description: "Get a withdrawal"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []

  - method: GET
    path: "/accounts/{id}/withdrawals"
    description: "List withdrawals on an account, filter by status and expense_category"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: ["status?, expense_category?, limit?, offset?"]
    output: "Withdrawal[]"
    side_effects: []

  # ----- Beneficiary change requests -----
  - method: POST
    path: "/accounts/{id}/beneficiary-change-requests"
    description: "Submit a beneficiary change for an account"
    roles: [Donor]
    code: 201
    input: [proposed_beneficiary_id]
    output: BeneficiaryChangeRequest
    side_effects:
      - "BeneficiaryChangeRequest.current_beneficiary_id snapshot is taken from Account.beneficiary_id at submit time"

  - method: POST
    path: "/beneficiary-change-requests/{id}/approve"
    description: "Approve; mutates Account.beneficiary_id; balances are conserved (invariant)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: BeneficiaryChangeRequest
    side_effects:
      - "Account.beneficiary_id = BeneficiaryChangeRequest.proposed_beneficiary_id"
      - "INVARIANT: Account.basis_balance_cents and Account.earnings_balance_cents are unchanged"

  - method: POST
    path: "/beneficiary-change-requests/{id}/reject"
    description: "Reject with a reason"
    roles: [PlanAdministrator]
    code: 200
    input: [rejection_reason]
    output: BeneficiaryChangeRequest
    side_effects: []

  # ----- Tax reports -----
  - method: POST
    path: "/tax-reports"
    description: "Create an unlocked TaxReport stub for (account_id, tax_year)"
    roles: [PlanAdministrator]
    code: 201
    input: [account_id, tax_year]
    output: TaxReport
    side_effects:
      - "tax_report_aggregation runs in live_recompute mode"

  - method: GET
    path: "/tax-reports/{id}"
    description: "Get a 1099-Q (live boxes if unlocked, frozen if locked)"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: TaxReport
    side_effects:
      - "If TaxReport.locked == false, tax_report_aggregation runs before returning"

  - method: POST
    path: "/tax-reports/{id}/finalize"
    description: "Lock the 1099-Q; cascades all CLASSIFIED withdrawals in that tax year to REPORTED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: TaxReport
    side_effects:
      - "tax_report_aggregation runs in frozen_snapshot mode"
      - "Cascade: every Withdrawal where account_id matches and disbursed_at year == tax_year and status == CLASSIFIED transitions to REPORTED"
      - "TaxReport.locked = true"

  # ----- State rules -----
  - method: GET
    path: "/state-rules/{state_code}"
    description: "Get the current state rule"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: []
    output: StateRule
    side_effects: []

  - method: GET
    path: "/state-rules"
    description: "List all state rules"
    roles: [PlanAdministrator, Donor]
    code: 200
    input: ["limit?, offset?"]
    output: "StateRule[]"
    side_effects: []

  - method: POST
    path: "/state-rules"
    description: "Seed/replace a state rule (administrative)"
    roles: [PlanAdministrator]
    code: 201
    input: [state_code, deduction_cap_cents, parity, lifetime_aggregate_cap_cents, k12_qualified]
    output: StateRule
    side_effects:
      - "StateRule.version increments; existing Accounts are NOT re-pinned (state_rule_version_at_open is immutable)"

  # ----- Test-driving / system endpoints (test reachability per §1.5 principle) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to a specified ISO 8601 UTC instant (test harness only). Required to drive scheduled-recurring sweeps and to cross calendar-year boundaries for K-12 cap reset and 1099-Q aggregation. Time only moves forward; advancing backward returns ERR_CLOCK_NOT_MOVING_FORWARD."
    roles: [PlanAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Server now() returns the new instant"

  - method: POST
    path: "/_sweep/run-recurring"
    description: "Sweep all ACTIVE RecurringPlans where next_run_at <= now(); materializes a Contribution per plan in PENDING; advances next_run_at by cadence_days"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: "Contribution[]"
    side_effects:
      - "One PENDING Contribution per qualifying plan"
      - "RecurringPlan.next_run_at += cadence_days * 86400 seconds"
      - "Each created Contribution carries recurring_plan_id and contribution_kind=RECURRING"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Required auth headers X-User-Role or X-User-ID are missing"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of {Donor, Beneficiary, PlanAdministrator}"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted to call the endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body-referenced id does not resolve to a row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Source row state does not match the transition's required from-state"
  - id: ERR_ACCOUNT_RESTRICTED
    http: 409
    condition: "Account.status != OPEN at the time of contribution settle, withdrawal disburse, recurring resume, or beneficiary change approve"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "Withdrawal.requested_amount_cents > Account.total_balance_cents at create or disburse time"
  - id: ERR_LIFETIME_CAP_WOULD_EXCEED
    http: 422
    condition: "Account.total_balance_cents + Contribution.amount_cents > Account.lifetime_contribution_cap_cents"
  - id: ERR_GIFT_EXCLUSION_EXCEEDED
    http: 422
    condition: "Donor.ytd_contribution_total_cents + Contribution.amount_cents > ANNUAL_GIFT_EXCLUSION_CENTS"
  - id: ERR_K12_CAP_EXCEEDED
    http: 422
    condition: "K-12 withdrawal creation would exceed the beneficiary's $10k annual cap with zero room remaining"
  - id: ERR_EXPENSE_CATEGORY_MISMATCH
    http: 422
    condition: "An EducationExpense.category does not equal the parent Withdrawal.expense_category"
  - id: ERR_EXPENSE_OUT_OF_YEAR
    http: 422
    condition: "EducationExpense.incurred_on is not in the calendar year of the Withdrawal disbursement"
  - id: ERR_BENEFICIARY_IDENTICAL_TO_CURRENT
    http: 422
    condition: "Approval would set Account.beneficiary_id to its current value"
  - id: ERR_BENEFICIARY_RELATIONSHIP_FORBIDDEN
    http: 422
    condition: "Proposed beneficiary's relationship_family_code is not in the IRS permissible-family set"
  - id: ERR_BENEFICIARY_GENERATION_SKIP
    http: 422
    condition: "Proposed beneficiary skips upward more than one generation relative to current (e.g., CHILD → PARENT)"
  - id: ERR_TAX_REPORT_LOCKED
    http: 409
    condition: "A classify, disburse, or new tax-report operation targets a (account, tax_year) whose 1099-Q is already locked"
  - id: ERR_STALE_BENEFICIARY_SNAPSHOT
    http: 409
    condition: "BeneficiaryChangeRequest.approve sees Account.beneficiary_id != BeneficiaryChangeRequest.current_beneficiary_id (lost race to another approval)"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: request.version does not match the row's current version on a PATCH endpoint"
  - id: ERR_CLOCK_NOT_MOVING_FORWARD
    http: 422
    condition: "POST /_clock/advance with to_iso8601 <= current server now()"
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Generic request-shape failure (missing required field, malformed value, non-positive amount, bad enum)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Donor
    description: "Account owner; opens accounts, contributes, requests and disburses withdrawals, submits beneficiary change requests."
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/close"
      - "POST /accounts/{id}/contributions"
      - "POST /accounts/{id}/recurring-plans"
      - "PATCH /recurring-plans/{id}"
      - "POST /recurring-plans/{id}/pause"
      - "POST /recurring-plans/{id}/resume"
      - "POST /recurring-plans/{id}/cancel"
      - "POST /accounts/{id}/withdrawals"
      - "POST /withdrawals/{id}/disburse"
      - "POST /withdrawals/{id}/expenses"
      - "POST /withdrawals/{id}/classify"
      - "POST /accounts/{id}/beneficiary-change-requests"
    shared_operations:
      - "POST /beneficiaries"
      - "GET /donors/{id}"
      - "GET /beneficiaries/{id}"
      - "GET /accounts/{id}"
      - "GET /accounts"
      - "GET /contributions/{id}"
      - "GET /accounts/{id}/contributions"
      - "GET /withdrawals/{id}"
      - "GET /accounts/{id}/withdrawals"
      - "GET /tax-reports/{id}"
      - "GET /state-rules/{state_code}"
      - "GET /state-rules"

  - name: Beneficiary
    description: "Read-only viewer of accounts where Beneficiary.id = Account.beneficiary_id. Cannot withdraw, contribute, or approve changes (segregation of duties)."
    identity: "entity_backed:Beneficiary"
    exclusive_operations: []
    shared_operations:
      - "GET /accounts/{id}"
      - "GET /accounts"
      - "GET /accounts/{id}/contributions"
      - "GET /accounts/{id}/withdrawals"
      - "GET /tax-reports/{id}"
      - "GET /beneficiaries/{id}"

  - name: PlanAdministrator
    description: "Operates the plan: registers donors, restricts/releases accounts, settles or reverses contributions, rejects withdrawals, approves or rejects beneficiary change requests, finalizes 1099-Q tax reports, maintains state rules."
    identity: "opaque"
    exclusive_operations:
      - "POST /donors"
      - "POST /accounts/{id}/restrict"
      - "POST /accounts/{id}/release"
      - "POST /contributions/{id}/settle"
      - "POST /contributions/{id}/reverse"
      - "POST /withdrawals/{id}/reject"
      - "POST /beneficiary-change-requests/{id}/approve"
      - "POST /beneficiary-change-requests/{id}/reject"
      - "POST /tax-reports"
      - "POST /tax-reports/{id}/finalize"
      - "POST /state-rules"
      - "POST /_clock/advance"
      - "POST /_sweep/run-recurring"
    shared_operations:
      - "POST /beneficiaries"
      - "GET /donors/{id}"
      - "GET /beneficiaries/{id}"
      - "GET /accounts/{id}"
      - "GET /accounts"
      - "GET /contributions/{id}"
      - "GET /accounts/{id}/contributions"
      - "GET /withdrawals/{id}"
      - "GET /accounts/{id}/withdrawals"
      - "GET /tax-reports/{id}"
      - "GET /state-rules/{state_code}"
      - "GET /state-rules"
