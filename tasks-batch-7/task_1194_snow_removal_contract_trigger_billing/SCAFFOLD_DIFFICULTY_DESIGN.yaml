            - { call: "POST /contract-sites", payload: { contract_id: "${kE}", site_id: "${sE}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { csE: $.data.id } }
            - { call: "POST /contracts/${kE}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
