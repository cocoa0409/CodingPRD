  - section: cross_cutting_complexity_layers
    instances:
      - name: renew_stale_permit_version_occ_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[renew-stale-permit]", entities.Permit.fields.version, state_machines.Permit.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "A second renew carrying the pre-renew expected_permit_version (one behind, after a prior renew bumped it) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE permit inside its renewal window; one successful renew already advanced version."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "CC1", str_eligible: true, whole_home_allowed: true, permit_cap: 5 }
