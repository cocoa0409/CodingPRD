# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × ≥2 instances = 18 instances. All chains executable from empty-DB
# against §1.5; all formula-derived asserts are precomputed integer-cent literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_reservation_estimate_vs_final_fare
        grounds:
          - calculations.estimate_quote
          - calculations.final_settlement
          - entities.Reservation.fields.quote_estimate_total_cents
          - entities.Reservation.fields.final_total_cents
          - state_machines.Reservation.PASSENGER_ABOARD_to_COMPLETED
        distinguishing_aspect: "Same booked reservation: estimate folds NO wait into base (7290+1458+350=9098) while final folds 7 chargeable wait-minutes into base BEFORE discount+gratuity (8550+1710+350=10610); the dual variants on the Reservation domain diverge by 1512 cents."
        test_recipe:
          setup:
            - "Clock at 2026-07-01T09:00:00Z; account discount 10% gratuity 20%; SEDAN class base 5000 per_mile 250 wait_per_min 200 grace 15; POINT_TO_POINT 12.4mi tolls 350."
            - "Reservation quoted (quote_estimate_total_cents stamped), confirmed, assigned in-house, dispatched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: DispatchAdmin
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 10, default_gratuity_pct: 20, cancellation_grace_minutes: 120 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO", rest_buffer_minutes: 20 }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-1", turnaround_minutes: 30 }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-01T12:00:00Z", planned_drop_at: "2026-07-01T13:00:00Z", estimated_miles: 12.4, tolls_cents: 350 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
              captures: { est: $.data.quote_estimate_total_cents }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "DISPATCH" }
              as: Dispatcher
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "CHAUFFEUR_ARRIVED", occurred_at: "2026-07-01T12:05:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "PASSENGER_BOARDED", occurred_at: "2026-07-01T12:27:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "COMPLETE" }
              as: Chauffeur
              as_user_id: "${drv}"
              captures: { fin: $.data.final_total_cents }
          assert:
            - "Reservation.${res}.quote_estimate_total_cents == 9098"
            - "Reservation.${res}.chargeable_wait_minutes == 7"
            - "Reservation.${res}.final_total_cents == 10610"
            - "Reservation.${res}.final_total_cents - Reservation.${res}.quote_estimate_total_cents == 1512"

      - name: dual_variant_farmout_payout_basis_vs_customer_total
        grounds:
          - calculations.affiliate_payout
          - calculations.final_settlement
          - entities.FarmOutOrder.fields.offered_payout_cents
          - entities.Reservation.fields.final_total_cents
          - state_machines.FarmOutOrder.OFFERED_to_ACCEPTED
        distinguishing_aspect: "Same trip, two domains: FarmOutOrder.offered_payout_cents uses raw pre-discount fare_base × 70% (5670) while the Reservation customer-side final_total_cents uses post-discount+gratuity+tolls (9098); 5670 != 9098 proves the operator-side and customer-side variants diverge on different entities."
        test_recipe:
          setup:
            - "Same account/class as above; SFO affiliate payout_share 70%; POINT_TO_POINT 12.4mi tolls 350, quoted then confirmed."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 10, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Bay Black Car", market_code: "SFO", payout_share_pct: 70 }
              as: DispatchAdmin
              captures: { aff: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-02T12:00:00Z", planned_drop_at: "2026-07-02T13:00:00Z", estimated_miles: 12.4, tolls_cents: 350 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /farm-out-orders"
              payload: { reservation_id: "${res}", affiliate_id: "${aff}", expected_reservation_version: "${rv}" }
              as: Dispatcher
              captures: { fo: $.data.id, payout: $.data.offered_payout_cents }
          trigger:
            - call: "POST /farm-out-orders/${fo}/decision-events"
              payload: { action: "ACCEPT" }
              as: AffiliatePartner
              as_user_id: "${aff}"
              captures: { fin: $.data.id }
          assert:
            - "FarmOutOrder.${fo}.offered_payout_cents == 5670"
            - "Reservation.${res}.final_total_cents == 9098"
            - "FarmOutOrder.${fo}.offered_payout_cents != Reservation.${res}.final_total_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_hourly_ceil_then_tiered_discount_gratuity
        grounds:
          - calculations.estimate_quote
          - entities.VehicleClass.fields.hourly_rate_cents
          - entities.Reservation.fields.charter_hours
          - entities.Reservation.fields.gratuity_pct_override
        distinguishing_aspect: "Mode (a) non-linear ≥3-input interaction: billable_hours=ceil(3.2)=4, fare_base=15000*4=60000, then discounted_base=round(60000*0.75)=45000, then gratuity=round(45000*0.15)=6750 — three conditional/nonlinear steps (ceil, tiered discount, override gratuity) chained, total 51750."
        test_recipe:
          setup:
            - "SUV class hourly 15000; account discount 25%; HOURLY 3.2h with gratuity_pct_override 15, tolls 0."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Globex", billing_email: "ap@globex.com", negotiated_discount_pct: 25, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SUV", base_fare_cents: 7000, per_mile_cents: 300, hourly_rate_cents: 15000, wait_per_minute_cents: 250, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { suv: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "HOURLY", vehicle_class_id: "${suv}", pickup_at: "2026-07-03T18:00:00Z", planned_drop_at: "2026-07-03T22:00:00Z", charter_hours: 3.2, gratuity_pct_override: 15, tolls_cents: 0 }
              as: Dispatcher
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
              captures: { est: $.data.quote_estimate_total_cents }
          assert:
            - "Reservation.${res}.quote_estimate_total_cents == 51750"
            - "Reservation.${res}.trip_status == QUOTED"

      - name: combinatorial_circular_eval_order_discount_then_gratuity_then_tolls
        grounds:
          - calculations.estimate_quote
          - entities.CorporateAccount.fields.negotiated_discount_pct
          - entities.CorporateAccount.fields.default_gratuity_pct
          - entities.Reservation.fields.tolls_cents
        distinguishing_aspect: "Mode (c) pinned evaluation order: gratuity is keyed on the DISCOUNTED base, and tolls are added AFTER gratuity (never discounted nor gratuity-bearing). For base 8100, discount 10%, gratuity 20%, tolls 350: discounted_base 7290 -> gratuity 1458 -> +tolls 350 = 9098; any other order (e.g. gratuity on pre-discount base) yields a different number."
        test_recipe:
          setup:
            - "SEDAN base 5000 per_mile 250; account discount 10% gratuity 20%; POINT_TO_POINT 12.4mi tolls 350."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Initech", billing_email: "ap@initech.com", negotiated_discount_pct: 10, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200, included_wait_minutes: 15 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-04T12:00:00Z", planned_drop_at: "2026-07-04T13:00:00Z", estimated_miles: 12.4, tolls_cents: 350 }
              as: Dispatcher
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
              captures: { est: $.data.quote_estimate_total_cents }
          assert:
            - "Reservation.${res}.quote_estimate_total_cents == 9098"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_chauffeur_status_cycle_on_duty_on_trip_on_duty
        grounds:
          - state_machines.Chauffeur.ON_DUTY_to_ON_TRIP
          - state_machines.Chauffeur.ON_TRIP_to_ON_DUTY
          - entities.Chauffeur.fields.status
          - entities.Chauffeur.fields.active_assignment_id
        distinguishing_aspect: "Chauffeur status CYCLES ON_DUTY -> ON_TRIP -> ON_DUTY across one trip (dispatch then complete), returning to ON_DUTY with active_assignment_id cleared — a genuine cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "Reservation assigned in-house to chauffeur Dana (Dana ON_DUTY, active_assignment_id null)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 0, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-2" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-05T12:00:00Z", planned_drop_at: "2026-07-05T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "DISPATCH" }
              as: Dispatcher
              captures: { onroute: $.data.trip_status }
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "CHAUFFEUR_ARRIVED", occurred_at: "2026-07-05T12:05:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/wait-events"
              payload: { kind: "PASSENGER_BOARDED", occurred_at: "2026-07-05T12:10:00Z" }
              as: Chauffeur
              as_user_id: "${drv}"
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "COMPLETE" }
              as: Chauffeur
              as_user_id: "${drv}"
          assert:
            - "Chauffeur.${drv}.status == ON_DUTY"
            - "Chauffeur.${drv}.active_assignment_id == null"
            - "Assignment.${asg}.status == RELEASED"

      - name: nonlinear_flight_tracking_on_time_delayed_revert_loop
        grounds:
          - state_machines.FlightTracking.ON_TIME_to_DELAYED
          - state_machines.FlightTracking.DELAYED_to_ON_TIME
          - calculations.flight_delay_propagation
          - entities.FlightTracking.fields.status
        distinguishing_aspect: "FlightTracking loops ON_TIME -> DELAYED -> ON_TIME on a different entity than the chauffeur cycle: a 40-min delay update flips DELAYED, a within-threshold update flips back ON_TIME — a revert cycle, not a one-way pipeline."
        test_recipe:
          setup:
            - "AIRPORT reservation with flight tracking attached, scheduled arrival 2026-07-06T15:00:00Z."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SUV", base_fare_cents: 7000, per_mile_cents: 300, hourly_rate_cents: 15000, wait_per_minute_cents: 250 }
              as: DispatchAdmin
              captures: { suv: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "AIRPORT", vehicle_class_id: "${suv}", pickup_at: "2026-07-06T15:30:00Z", planned_drop_at: "2026-07-06T16:30:00Z", estimated_miles: 18 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /flight-trackings"
              payload: { reservation_id: "${res}", flight_number: "UA1234", scheduled_arrival_at: "2026-07-06T15:00:00Z", meet_and_greet: true }
              as: Dispatcher
              captures: { ft: $.data.id }
          trigger:
            - call: "POST /flight-trackings/${ft}/flight-updates"
              payload: { estimated_arrival_at: "2026-07-06T15:40:00Z" }
              as: DispatchAdmin
              captures: { st1: $.data.status }
            - call: "POST /flight-trackings/${ft}/flight-updates"
              payload: { estimated_arrival_at: "2026-07-06T15:10:00Z" }
              as: DispatchAdmin
              captures: { st2: $.data.status }
          assert:
            - "FlightTracking.${ft}.status == ON_TIME"
            - "FlightTracking.${ft}.estimated_arrival_at == 2026-07-06T15:10:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_assignment_create_depth3_reservation_chauffeur_assignment
        grounds:
          - state_machines.Reservation.CONFIRMED_to_ASSIGNED
          - state_machines.Chauffeur.OFF_DUTY_to_ON_DUTY
          - entities.Assignment.fields.status
          - entities.Chauffeur.fields.status
        distinguishing_aspect: "Depth-3 cascade triggered by POST /assignments: (1) Reservation CONFIRMED->ASSIGNED, (2) that creates an ACTIVE Assignment whose existence (3) flips the chauffeur OFF_DUTY->ON_DUTY; each hop caused by the prior, not a fan-out from the original call."
        test_recipe:
          setup:
            - "CONFIRMED reservation; chauffeur OFF_DUTY; vehicle AVAILABLE."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 0, default_gratuity_pct: 20 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-3" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-07T12:00:00Z", planned_drop_at: "2026-07-07T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
              captures: { asg: $.data.id }
          assert:
            - "Reservation.${res}.trip_status == ASSIGNED"
            - "Assignment.${asg}.status == ACTIVE"
            - "Chauffeur.${drv}.status == ON_DUTY"

      - name: cascade_cancel_en_route_depth2_reservation_assignment_then_chauffeur
        grounds:
          - state_machines.Reservation.EN_ROUTE_to_CANCELLED
          - state_machines.Chauffeur.ON_TRIP_to_OFF_DUTY
          - entities.Assignment.fields.status
          - entities.Chauffeur.fields.status
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (CANCEL from EN_ROUTE): (1) Assignment ACTIVE->RELEASED, (2) the release of the chauffeur's only active assignment flips the chauffeur ON_TRIP->OFF_DUTY with active_assignment_id cleared — origin transition differs from the assignment-create cascade."
        test_recipe:
          setup:
            - "Reservation EN_ROUTE (dispatched), chauffeur ON_TRIP, ACTIVE assignment."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", negotiated_discount_pct: 0, default_gratuity_pct: 20, cancellation_grace_minutes: 0 }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /chauffeurs"
              payload: { full_name: "Dana", home_market_code: "SFO" }
              as: DispatchAdmin
              captures: { drv: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_class_id: "${sedan}", plate: "BLK-4" }
              as: DispatchAdmin
              captures: { veh: $.data.id }
            - call: "POST /reservations"
              payload: { corporate_account_id: "${acct}", trip_type: "POINT_TO_POINT", vehicle_class_id: "${sedan}", pickup_at: "2026-07-08T12:00:00Z", planned_drop_at: "2026-07-08T13:00:00Z", estimated_miles: 10 }
              as: Dispatcher
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "QUOTE" }
              as: Dispatcher
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CONFIRM" }
              as: Dispatcher
              captures: { rv: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${rv}" }
              as: Dispatcher
              captures: { asg: $.data.id }
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "DISPATCH" }
              as: Dispatcher
          trigger:
            - call: "POST /reservations/${res}/trip-events"
              payload: { action: "CANCEL" }
              as: Dispatcher
          assert:
            - "Reservation.${res}.trip_status == CANCELLED"
            - "Assignment.${asg}.status == RELEASED"
            - "Chauffeur.${drv}.status == OFF_DUTY"
            - "Chauffeur.${drv}.active_assignment_id == null"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_on_billing_invoice
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - state_machines.Reservation.UNBILLED_to_INVOICED
        distinguishing_aspect: "error-category pair state(7) vs business_fiscal(15): invoicing a still-DRAFT reservation violates both the state precondition (settlement not UNBILLED-billable) and the fiscal billable rule; the higher-priority state check wins -> ERR_INVALID_STATE, not ERR_NOT_BILLABLE."
        test_recipe:
          setup:
            - "Fresh DRAFT reservation (never quoted/completed/cancelled): settlement UNBILLED, trip_status DRAFT."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
            - call: "POST /reservations"
