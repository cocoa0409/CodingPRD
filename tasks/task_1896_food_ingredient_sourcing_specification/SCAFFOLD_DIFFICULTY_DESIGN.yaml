  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: source_activation_depends_on_supplier_state_and_declaration_state
        grounds:
          - state_machines.ApprovedSource.PROVISIONAL_to_ACTIVE
          - errors[ERR_SUPPLIER_NOT_QUALIFIED]
          - errors[ERR_DECLARATION_MISSING]
        distinguishing_aspect: |
          Pair ApprovedSource -> Supplier (plus declaration gating): source
          activation is rejected with ERR_SUPPLIER_NOT_QUALIFIED while the
          supplier is IN_QUALIFICATION, and with ERR_DECLARATION_MISSING when
          the supplier is QUALIFIED but declarations are absent — the same
          transition is gated by two different cross-entity states.
        test_recipe:
          setup:
            - "Ingredient with EFFECTIVE spec; supplier SUP-X PROSPECT with an open qualification (IN_QUALIFICATION); source created pinned to EFFECTIVE spec; no declarations"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "SWT-1", name: "Sweetener One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "brix", criticality: "MINOR", uom: "deg", target_value: 65, min_value: 60, max_value: 70 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-X", legal_name: "Sweet Supplier", risk_tier: "TIER_B", country_of_operation: "BR" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 80, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id }
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
              captures: { err1: $.data.error_id }
          assert:
            - "Activation with supplier IN_QUALIFICATION fails with ERR_SUPPLIER_NOT_QUALIFIED (cross-entity gate on Supplier.status)"

      - name: audit_close_depends_on_corrective_action_children_states
        grounds:
          - state_machines.SupplierAudit.REPORT_ISSUED_to_CLOSED
          - errors[ERR_OPEN_CAPAS_EXIST]
        distinguishing_aspect: |
          Different entity pair (SupplierAudit -> CorrectiveAction): the audit
          cannot close while any child CAPA is not VERIFIED; only after every
          child reaches VERIFIED does the parent transition unblock —
          compound-style gating across the audit/CAPA pair, distinct from the
          source/supplier pair.
