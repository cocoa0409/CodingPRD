scenario: "School Immunization Compliance & Exclusion (district health services): required vaccine schedule by grade & state rules, record intake & provisional enrollment window, exemption (medical/religious) processing & documentation, non-compliance notice & exclusion date, outbreak-triggered exclusion of exempt students, state registry reconciliation, annual compliance rate reporting, catch-up clinic coordination"
domain_name: "school-immunization-compliance-exclusion"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Student full legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "Student date of birth (ISO 8601, time normalized to 00:00:00Z)."
      - name: grade
        type: enum
        source: input
        description: "Current grade level."
        constraints: "one of [PK, K, G1, G2, G3, G4, G5, G6, G7, G8, G9, G10, G11, G12]"
      - name: school_code
        type: string
        source: input
        description: "District school identifier (plain code, not an entity reference)."
      - name: enrollment_date
        type: datetime
        source: input
        description: "Date the student enrolled in the school."
      - name: status
        type: enum
        source: system
        default: ENROLLED_PROVISIONAL
        description: "Compliance/enrollment posture, driven by the Student state machine."
        constraints: "one of [ENROLLED_PROVISIONAL, ENROLLED_COMPLIANT, NON_COMPLIANT, EXCLUDED, WITHDRAWN]"
      - name: provisional_deadline
        type: datetime
        source: computed
        description: "enrollment_date + PROVISIONAL_WINDOW_DAYS (30) days. Computed at creation."
      - name: deficiency_vaccine_codes
        type: array
        source: computed
        description: "Vaccine codes whose LOCAL_RECORDS evaluation is currently NOT_SATISFIED for this student. Recomputed on every evaluation trigger."

  - name: VaccineRequirement
    parent: null
    common_fields: true
    fields:
      - name: vaccine_code
        type: enum
        source: input
        description: "Vaccine antigen code."
        constraints: "one of [DTAP, IPV, MMR, HEPB, VAR, HIB, PCV, HEPA]"
      - name: applies_to_grades
        type: array
        source: input
        description: "Grade levels (Student.grade enum members) this requirement applies to."
      - name: doses_required
        type: integer
        source: input
        description: "Number of verified doses required for compliance. >= 1."
      - name: min_interval_days
        type: integer
        source: input
        description: "Minimum days between consecutive doses of this vaccine. >= 0."
      - name: min_age_months
        type: integer
        source: input
        description: "Minimum age in whole months at which any dose of this vaccine is valid. >= 0."
      - name: school_year
        type: string
        source: input
        description: "Academic year label, format 'YYYY-YYYY' (e.g. '2026-2027'). Unique together with vaccine_code."

  - name: ImmunizationRecord
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student who received the dose."
      - name: vaccine_code
        type: enum
        source: input
        description: "Vaccine antigen code (same enum as VaccineRequirement.vaccine_code)."
      - name: dose_number
        type: integer
        source: input
        description: "Ordinal dose number in the series. >= 1. Unique per (student_id, vaccine_code) among records with status != VOIDED."
      - name: administered_date
        type: datetime
        source: input
        description: "Date the dose was administered."
      - name: source
        type: enum
        source: system
        default: MANUAL
        description: "MANUAL for clerk entry, CLINIC for catch-up clinic completion, REGISTRY_IMPORT for state-registry sync."
        constraints: "one of [MANUAL, CLINIC, REGISTRY_IMPORT]"
      - name: clinic_appointment_id
        type: string
        source: system
        description: "FK -> ClinicAppointment.id; set only when source == CLINIC, otherwise null."
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: "Verification lifecycle of the dose record."
        constraints: "one of [PENDING_VERIFICATION, VERIFIED, VOIDED]"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SchoolNurse who verified the record; null until VERIFIED."
        constraints: "nullable"

  - name: ExemptionRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student the exemption covers."
      - name: vaccine_code
        type: enum
        source: input
        description: "Vaccine antigen code the exemption covers."
      - name: exemption_type
        type: enum
        source: input
        description: "Legal basis of the exemption."
        constraints: "one of [MEDICAL, RELIGIOUS]"
      - name: document_ref
        type: string
        source: input
        description: "Reference URI/key of the supporting documentation uploaded out-of-band."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Adjudication lifecycle; see ExemptionRequest state machine."
        constraints: "one of [SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, SUSPENDED_OUTBREAK]"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the submitter, captured at creation. Segregation-of-duties anchor."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewing DistrictHealthOfficer, set at start-review; cleared on resubmit."
        constraints: "nullable"
      - name: denial_reason
        type: string
        source: system
        description: "Reason text supplied by the deny transition; null unless DENIED."
        constraints: "nullable"

  - name: ComplianceNotice
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student the notice was issued to."
      - name: notice_type
        type: enum
        source: input
        description: "INITIAL_NONCOMPLIANCE (manual or sweep-issued) or OUTBREAK_EXCLUSION (system-issued only, on outbreak declaration)."
        constraints: "one of [INITIAL_NONCOMPLIANCE, OUTBREAK_EXCLUSION]"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Notice lifecycle; see ComplianceNotice state machine."
        constraints: "one of [ISSUED, CURED, RESCINDED, EXCLUSION_EFFECTIVE]"
      - name: issue_date
        type: datetime
        source: system
        description: "Logical-clock timestamp at issuance."
      - name: exclusion_date
        type: datetime
        source: computed
        description: "INITIAL_NONCOMPLIANCE: issue_date + EXCLUSION_GRACE_DAYS (14) days. OUTBREAK_EXCLUSION: equal to issue_date (immediate exclusion)."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the notice reached CURED or RESCINDED; null otherwise."
        constraints: "nullable"

  - name: OutbreakEvent
    parent: null
    common_fields: true
    fields:
      - name: school_code
        type: string
        source: input
        description: "School where the outbreak is declared."
      - name: vaccine_code
        type: enum
        source: input
        description: "Vaccine-preventable disease driving the outbreak (same enum as VaccineRequirement.vaccine_code)."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE until lifted."
        constraints: "one of [ACTIVE, LIFTED]"
      - name: declared_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of declaration."
      - name: lifted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of lift; null while ACTIVE."
        constraints: "nullable"

  - name: ClinicSession
    parent: null
    common_fields: true
    fields:
      - name: school_code
        type: string
        source: input
        description: "Host school of the catch-up clinic session."
      - name: session_date
        type: datetime
        source: input
        description: "Start datetime of the session."
      - name: duration_minutes
        type: integer
        source: input
        description: "Session length in minutes; session window is [session_date, session_date + duration_minutes). > 0."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of concurrently BOOKED appointments. >= 1."
      - name: booked_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClinicAppointments for this session with status == BOOKED. Recomputed on book/cancel/complete/no-show/session-cancel."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Session lifecycle; see ClinicSession state machine."
        constraints: "one of [SCHEDULED, OPEN, CLOSED, CANCELLED]"

  - name: ClinicAppointment
    parent: null
    common_fields: true
    fields:
      - name: clinic_session_id
        type: string
        source: input
        description: "FK -> ClinicSession.id; session the appointment belongs to (path-scoped at creation)."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student receiving the catch-up dose."
      - name: vaccine_code
        type: enum
        source: input
        description: "Vaccine to be administered at the appointment."
      - name: start_time
        type: datetime
        source: input
        description: "Appointment start; half-open interval [start_time, end_time)."
      - name: end_time
        type: datetime
        source: input
        description: "Appointment end (exclusive). Must be > start_time."
      - name: status
        type: enum
        source: system
        default: BOOKED
        description: "Appointment lifecycle; see ClinicAppointment state machine."
        constraints: "one of [BOOKED, COMPLETED, CANCELLED, NO_SHOW]"

  - name: RegistrySyncRun
    parent: null
    common_fields: true
    fields:
      - name: school_code
        type: string
        source: input
        description: "School whose students are reconciled against the seeded state-registry doses."
      - name: status
        type: enum
        source: system
        default: RUNNING
        description: "RUNNING while executing; the create endpoint completes synchronously and returns COMPLETED."
        constraints: "one of [RUNNING, COMPLETED]"
      - name: registry_doses_seen
        type: integer
        source: computed
        description: "Number of seeded registry doses for students of this school inspected by the run."
      - name: imported_count
        type: integer
        source: computed
        description: "Seeded registry doses with no local record for (student, vaccine_code, dose_number): imported as VERIFIED ImmunizationRecords with source REGISTRY_IMPORT."
      - name: matched_count
        type: integer
        source: computed
        description: "Seeded registry doses matching an existing non-VOIDED local record on (student, vaccine_code, dose_number) AND administered_date."
      - name: discrepancy_count
        type: integer
        source: computed
        description: "Seeded registry doses matching an existing non-VOIDED local record on (student, vaccine_code, dose_number) but with a different administered_date."

  - name: ComplianceSnapshot
    parent: null
    common_fields: true
    fields:
      - name: school_year
        type: string
        source: input
        description: "Academic year label, e.g. '2026-2027'. Unique together with (school_code, grade, rate_variant)."
      - name: school_code
        type: string
        source: input
        description: "School the snapshot covers."
      - name: grade
        type: enum
        source: input
        description: "Grade the snapshot covers (Student.grade enum)."
      - name: census_date
        type: datetime
        source: input
        description: "As-of date for membership: only students with enrollment_date <= census_date are counted."
      - name: rate_variant
        type: enum
        source: input
        description: "CENSUS_DATE excludes WITHDRAWN students from the denominator; EVER_ENROLLED includes them."
        constraints: "one of [CENSUS_DATE, EVER_ENROLLED]"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Denominator per rate_variant membership rule."
      - name: compliant_count
        type: integer
        source: computed
        description: "Members whose REGISTRY_RECONCILED evaluation is all-SATISFIED at generation time."
      - name: exempt_count
        type: integer
        source: computed
        description: "Members with at least one ExemptionRequest in status APPROVED at generation time."
      - name: compliance_rate
        type: number
        source: computed
        description: "round(100.0 * compliant_count / enrolled_count, 1) half-up; null when enrolled_count == 0."
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT snapshots may be superseded by regeneration; FINALIZED is locked."
        constraints: "one of [DRAFT, FINALIZED]"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Student
    initial_state: ENROLLED_PROVISIONAL
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED_PROVISIONAL
        to: ENROLLED_COMPLIANT
        trigger: "dose verify (POST /api/immunization-records/{id}/verify), appointment complete (POST /api/clinic-appointments/{id}/complete), exemption approve (POST /api/exemption-requests/{id}/approve), or POST /api/ops/compliance-sweep"
        actor: system
        preconditions:
          - "LOCAL_RECORDS evaluation: every applicable VaccineRequirement is SATISFIED"
        side_effects:
          - "Student.deficiency_vaccine_codes := []"
          - "Student.version incremented"
      - from: ENROLLED_PROVISIONAL
        to: NON_COMPLIANT
        trigger: "POST /api/ops/compliance-sweep"
        actor: system
        preconditions:
          - "current logical clock > Student.provisional_deadline (strictly greater)"
          - "at least one applicable requirement NOT_SATISFIED under LOCAL_RECORDS"
        side_effects:
          - "create ComplianceNotice notice_type=INITIAL_NONCOMPLIANCE, status=ISSUED, issue_date=current clock, exclusion_date=current clock + 14 days"
          - "Student.deficiency_vaccine_codes recomputed"
          - "Student.version incremented"
      - from: NON_COMPLIANT
        to: ENROLLED_COMPLIANT
        trigger: "dose verify, appointment complete, or exemption approve"
        actor: system
        preconditions:
          - "LOCAL_RECORDS evaluation: every applicable VaccineRequirement is SATISFIED"
        side_effects:
          - "all ComplianceNotices for this student with status == ISSUED transition to CURED with resolved_at = current clock"
          - "Student.deficiency_vaccine_codes := []"
          - "Student.version incremented"
      - from: NON_COMPLIANT
        to: EXCLUDED
        trigger: "POST /api/ops/compliance-sweep"
        actor: system
        preconditions:
          - "student has a ComplianceNotice with status == ISSUED and current logical clock >= that notice.exclusion_date"
          - "student still deficient under LOCAL_RECORDS"
        side_effects:
          - "that ComplianceNotice transitions ISSUED -> EXCLUSION_EFFECTIVE"
          - "Student.version incremented"
      - from: NON_COMPLIANT
        to: EXCLUDED
        trigger: "POST /api/outbreak-events (outbreak declaration for the student's school_code and a vaccine_code the student holds an APPROVED exemption for)"
        actor: system
        preconditions:
          - "student's ExemptionRequest transitioned APPROVED -> SUSPENDED_OUTBREAK as part of the same outbreak cascade"
        side_effects:
          - "create ComplianceNotice notice_type=OUTBREAK_EXCLUSION, status=EXCLUSION_EFFECTIVE, issue_date = exclusion_date = current clock"
          - "Student.version incremented"
      - from: ENROLLED_PROVISIONAL
        to: EXCLUDED
        trigger: "POST /api/outbreak-events (same matching rule as NON_COMPLIANT -> EXCLUDED)"
        actor: system
        preconditions:
          - "student's ExemptionRequest transitioned APPROVED -> SUSPENDED_OUTBREAK as part of the same outbreak cascade"
        side_effects:
          - "create ComplianceNotice notice_type=OUTBREAK_EXCLUSION, status=EXCLUSION_EFFECTIVE, issue_date = exclusion_date = current clock"
          - "Student.version incremented"
      - from: ENROLLED_COMPLIANT
        to: EXCLUDED
        trigger: "POST /api/outbreak-events (same matching rule as NON_COMPLIANT -> EXCLUDED)"
        actor: system
        preconditions:
          - "student's ExemptionRequest transitioned APPROVED -> SUSPENDED_OUTBREAK as part of the same outbreak cascade"
        side_effects:
          - "create ComplianceNotice notice_type=OUTBREAK_EXCLUSION, status=EXCLUSION_EFFECTIVE, issue_date = exclusion_date = current clock"
          - "Student.version incremented"
      - from: EXCLUDED
        to: ENROLLED_COMPLIANT
        trigger: "dose verify or appointment complete (readmission), or POST /api/outbreak-events/{id}/lift"
        actor: system
        preconditions:
          - "LOCAL_RECORDS evaluation: every applicable VaccineRequirement is SATISFIED"
        side_effects:
          - "all ComplianceNotices for this student with status IN {ISSUED, EXCLUSION_EFFECTIVE} transition to CURED with resolved_at = current clock"
          - "Student.deficiency_vaccine_codes := []"
          - "Student.version incremented"
      - from: EXCLUDED
        to: NON_COMPLIANT
        trigger: "POST /api/outbreak-events/{id}/lift"
        actor: system
        preconditions:
          - "after exemption reinstatement, at least one applicable requirement still NOT_SATISFIED under LOCAL_RECORDS"
        side_effects:
          - "this student's OUTBREAK_EXCLUSION notice with status == EXCLUSION_EFFECTIVE transitions to CURED with resolved_at = current clock"
          - "Student.deficiency_vaccine_codes recomputed"
          - "Student.version incremented"
      - from: ENROLLED_PROVISIONAL
        to: WITHDRAWN
        trigger: "POST /api/students/{id}/withdraw"
        actor: HealthClerk
        preconditions: []
        side_effects:
          - "all ClinicAppointments for this student with status == BOOKED transition to CANCELLED; each affected ClinicSession.booked_count recomputed and its version incremented"
          - "Student.version incremented"
      - from: ENROLLED_COMPLIANT
        to: WITHDRAWN
        trigger: "POST /api/students/{id}/withdraw"
        actor: HealthClerk
        preconditions: []
        side_effects:
          - "same appointment-cancellation cascade as ENROLLED_PROVISIONAL -> WITHDRAWN"
          - "Student.version incremented"
      - from: NON_COMPLIANT
        to: WITHDRAWN
        trigger: "POST /api/students/{id}/withdraw"
        actor: HealthClerk
        preconditions: []
        side_effects:
          - "same appointment-cancellation cascade as ENROLLED_PROVISIONAL -> WITHDRAWN"
          - "Student.version incremented"
      - from: EXCLUDED
        to: WITHDRAWN
        trigger: "POST /api/students/{id}/withdraw"
        actor: HealthClerk
        preconditions: []
        side_effects:
          - "same appointment-cancellation cascade as ENROLLED_PROVISIONAL -> WITHDRAWN"
          - "Student.version incremented"
      - from: ENROLLED_COMPLIANT
        to: ENROLLED_PROVISIONAL
        trigger: "POST /api/immunization-records/{id}/void on a VERIFIED record"
        actor: system
        preconditions:
          - "after voiding, at least one applicable requirement NOT_SATISFIED under LOCAL_RECORDS"
          - "current logical clock <= Student.provisional_deadline"
        side_effects:
          - "Student.deficiency_vaccine_codes recomputed"
          - "Student.version incremented"
      - from: ENROLLED_COMPLIANT
        to: NON_COMPLIANT
        trigger: "POST /api/immunization-records/{id}/void on a VERIFIED record"
        actor: system
        preconditions:
          - "after voiding, at least one applicable requirement NOT_SATISFIED under LOCAL_RECORDS"
          - "current logical clock > Student.provisional_deadline"
        side_effects:
          - "Student.deficiency_vaccine_codes recomputed"
          - "Student.version incremented"

  - entity: ImmunizationRecord
    initial_state: PENDING_VERIFICATION
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /api/immunization-records/{id}/verify"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "verified_by_user_id := caller X-User-ID"
          - "Student LOCAL_RECORDS evaluation recomputed; Student status transition applied per Student state machine (including notice cure on readmission)"
      - from: PENDING_VERIFICATION
        to: VOIDED
        trigger: "POST /api/immunization-records/{id}/void"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "Student LOCAL_RECORDS evaluation recomputed"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /api/immunization-records/{id}/void (correction of a previously verified dose)"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "Student LOCAL_RECORDS evaluation recomputed; Student status transition applied per Student state machine (ENROLLED_COMPLIANT may revert to ENROLLED_PROVISIONAL or NON_COMPLIANT depending on the logical clock)"

  - entity: ExemptionRequest
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/exemption-requests/{id}/start-review"
        actor: DistrictHealthOfficer
        preconditions:
          - "caller X-User-ID != ExemptionRequest.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/exemption-requests/{id}/approve"
        actor: DistrictHealthOfficer
        preconditions:
          - "caller X-User-ID != ExemptionRequest.submitted_by_user_id (segregation of duties)"
          - "no OutbreakEvent with status == ACTIVE exists for (student's school_code, this vaccine_code)"
        side_effects:
          - "Student LOCAL_RECORDS evaluation recomputed; Student status transition applied per Student state machine"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/exemption-requests/{id}/deny"
        actor: DistrictHealthOfficer
        preconditions:
          - "caller X-User-ID != ExemptionRequest.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "denial_reason := request payload denial_reason"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /api/exemption-requests/{id}/resubmit with a new document_ref"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "document_ref := request payload document_ref"
          - "reviewed_by_user_id := null; denial_reason := null"
          - "submitted_by_user_id := caller X-User-ID"
      - from: APPROVED
        to: SUSPENDED_OUTBREAK
        trigger: "system cascade of POST /api/outbreak-events when (school_code, vaccine_code) match"
        actor: system
        preconditions:
          - "OutbreakEvent ACTIVE created for (student's school_code, this vaccine_code)"
        side_effects:
          - "Student LOCAL_RECORDS evaluation recomputed; if the requirement is now NOT_SATISFIED, Student transitions to EXCLUDED per Student state machine and an OUTBREAK_EXCLUSION ComplianceNotice is created with status EXCLUSION_EFFECTIVE"
      - from: SUSPENDED_OUTBREAK
        to: APPROVED
        trigger: "system cascade of POST /api/outbreak-events/{id}/lift"
        actor: system
        preconditions:
          - "the matching OutbreakEvent transitions ACTIVE -> LIFTED"
        side_effects:
          - "Student LOCAL_RECORDS evaluation recomputed; Student transitions EXCLUDED -> ENROLLED_COMPLIANT if now all-SATISFIED, else EXCLUDED -> NON_COMPLIANT; this student's OUTBREAK_EXCLUSION notice (status EXCLUSION_EFFECTIVE) transitions to CURED in both cases"

  - entity: ComplianceNotice
    initial_state: ISSUED
    terminal_states: [CURED, RESCINDED]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "system cascade: student reached all-SATISFIED under LOCAL_RECORDS (dose verify, appointment complete, exemption approve)"
        actor: system
        preconditions:
          - "Student.status transitions to ENROLLED_COMPLIANT in the same cascade"
        side_effects:
          - "resolved_at := current clock"
      - from: ISSUED
        to: EXCLUSION_EFFECTIVE
        trigger: "POST /api/ops/compliance-sweep"
        actor: system
        preconditions:
          - "current logical clock >= exclusion_date"
          - "student still deficient under LOCAL_RECORDS"
        side_effects:
          - "Student transitions NON_COMPLIANT -> EXCLUDED"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /api/compliance-notices/{id}/rescind"
        actor: DistrictHealthOfficer
        preconditions: []
        side_effects:
          - "resolved_at := current clock"
      - from: EXCLUSION_EFFECTIVE
        to: CURED
        trigger: "system cascade: student readmitted (dose verify / appointment complete reaching all-SATISFIED) or outbreak lift"
        actor: system
        preconditions:
          - "Student leaves EXCLUDED in the same cascade"
        side_effects:
          - "resolved_at := current clock"

  - entity: OutbreakEvent
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /api/outbreak-events/{id}/lift"
        actor: DistrictHealthOfficer
        preconditions: []
        side_effects:
          - "lifted_at := current clock"
          - "every ExemptionRequest with status == SUSPENDED_OUTBREAK whose student's school_code and vaccine_code match this event transitions back to APPROVED; each affected Student is re-evaluated and transitions out of EXCLUDED per the Student state machine; the student's OUTBREAK_EXCLUSION notice transitions EXCLUSION_EFFECTIVE -> CURED"

  - entity: ClinicSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/clinic-sessions/{id}/open"
        actor: SchoolNurse
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/clinic-sessions/{id}/close"
        actor: SchoolNurse
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/clinic-sessions/{id}/cancel"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "all ClinicAppointments for this session with status == BOOKED transition to CANCELLED; booked_count recomputed"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/clinic-sessions/{id}/cancel"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "all ClinicAppointments for this session with status == BOOKED transition to CANCELLED; booked_count recomputed"

  - entity: ClinicAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/clinic-appointments/{id}/cancel, or cascade of POST /api/students/{id}/withdraw, or cascade of session cancel"
        actor: HealthClerk
        preconditions: []
        side_effects:
          - "ClinicSession.booked_count recomputed (decremented by 1); ClinicSession.version incremented"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /api/clinic-appointments/{id}/complete"
        actor: SchoolNurse
        preconditions: []
        side_effects:
          - "create ImmunizationRecord for (student_id, vaccine_code) with source=CLINIC, status=VERIFIED, clinic_appointment_id := this appointment, dose_number := max existing non-VOIDED dose_number for (student, vaccine_code) + 1 (1 if none), administered_date := appointment start_time"
          - "Student LOCAL_RECORDS evaluation recomputed; Student status transition applied per Student state machine (including notice cure)"
          - "ClinicSession.booked_count recomputed (decremented by 1); ClinicSession.version incremented"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /api/ops/compliance-sweep when appointment end_time < current logical clock"
        actor: system
        preconditions:
          - "appointment end_time < current logical clock"
        side_effects:
          - "ClinicSession.booked_count recomputed (decremented by 1); ClinicSession.version incremented"

  - entity: RegistrySyncRun
    initial_state: RUNNING
    terminal_states: [COMPLETED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "system auto-transition within the POST /api/registry-sync-runs request (synchronous execution)"
        actor: system
        preconditions: []
        side_effects:
          - "registry_doses_seen / imported_count / matched_count / discrepancy_count populated"
          - "imported doses create ImmunizationRecords (source=REGISTRY_IMPORT, status=VERIFIED); each affected Student's evaluation recomputed (LOCAL_RECORDS unchanged by REGISTRY_IMPORT sources; REGISTRY_RECONCILED changes)"

  - entity: ComplianceSnapshot
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/compliance-snapshots/{id}/finalize"
        actor: DistrictHealthOfficer
        preconditions: []
        side_effects:
          - "snapshot counts and compliance_rate frozen; further regeneration for the same (school_year, school_code, grade, rate_variant) is rejected"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: dose-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /api/students/{id}/immunization-records"
    occ_field: expected_student_version
    description: |
      Creating an ImmunizationRecord against a Student whose version has
      advanced since the client last observed it is rejected. Dose creation
      legitimately accumulates on the student (each creation recomputes the
      student's derived compliance fields and increments Student.version), so
      a writer carrying a stale expected_student_version is writing against a
      superseded view of the student's record.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
  - rule_id: appointment-book-stale-session
    parent_entity: ClinicSession
    write_endpoint: "POST /api/clinic-sessions/{id}/appointments"
    occ_field: expected_clinic_session_version
    description: |
      Booking an appointment against a ClinicSession whose version has
      advanced since the client last observed it is rejected. Every booking,
      cancellation, completion, or no-show sweep legitimately mutates
      booked_count and increments ClinicSession.version, so a writer carrying
      a stale expected_clinic_session_version is booking against a superseded
      view of the session's remaining capacity.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: requirement_evaluation
    trigger: "student creation; immunization record verify/void; appointment complete; exemption approve; outbreak declare/lift cascade; registry sync run; compliance sweep; GET /api/students/{id}/compliance"
    algorithm: aggregation
    formula: |
      academic_year(clock) = label "YYYY-(YYYY+1)" where Aug 1 <= date <= Jul 31
      (e.g. any clock in [2026-08-01, 2027-07-31] -> "2026-2027").
      applicable_requirements(student) =
        VaccineRequirement where student.grade IN applies_to_grades
        AND school_year == academic_year(current_clock)
      per requirement req:
        local_count      = count(ImmunizationRecord where student_id == student.id
                            AND vaccine_code == req.vaccine_code AND status == VERIFIED
                            AND source IN {MANUAL, CLINIC})
        reconciled_count = count(ImmunizationRecord where student_id == student.id
                            AND vaccine_code == req.vaccine_code AND status == VERIFIED
                            AND source IN {MANUAL, CLINIC, REGISTRY_IMPORT})
        has_exemption    = exists ExemptionRequest where student_id == student.id
                            AND vaccine_code == req.vaccine_code AND status == APPROVED
        satisfied_local      = (local_count >= req.doses_required) OR has_exemption
        satisfied_reconciled = (reconciled_count >= req.doses_required) OR has_exemption
      Student.deficiency_vaccine_codes = [req.vaccine_code where NOT satisfied_local]
      Student official status transitions are driven by the LOCAL_RECORDS variant only.
    input_set: "VaccineRequirements filtered by grade + current academic year; ImmunizationRecords with status == VERIFIED (PENDING_VERIFICATION and VOIDED excluded); ExemptionRequests with status == APPROVED (SUSPENDED_OUTBREAK does NOT satisfy)."
    constants:
      ACADEMIC_YEAR_START_MONTH: 8
    precision: "integer dose counts; exact comparison >= doses_required"
    variants:
      - name: LOCAL_RECORDS
        when: "official Student.status transitions, deficiency_vaccine_codes, sweep decisions, exclusion decisions"
        difference: "counts only VERIFIED doses with source IN {MANUAL, CLINIC}; registry-imported doses are invisible"
      - name: REGISTRY_RECONCILED
        when: "GET /api/students/{id}/compliance reconciled fields; ComplianceSnapshot compliant_count"
        difference: "additionally counts VERIFIED doses with source == REGISTRY_IMPORT, so a student can be SATISFIED under this variant while NOT_SATISFIED under LOCAL_RECORDS"

  - name: next_dose_due_date
    trigger: "computed per requirement row inside GET /api/students/{id}/compliance"
    algorithm: forward_looking
    formula: |
      inputs: student.date_of_birth, student.enrollment_date, req.min_age_months,
              req.min_interval_days, verified LOCAL doses for (student, req.vaccine_code),
              exemption status, current logical clock
      if has_exemption (status == APPROVED):           -> null (not due; exempt)
      base = student.date_of_birth + req.min_age_months months
      if no VERIFIED LOCAL dose exists:
          due = max(base, student.enrollment_date)
      else:
          last_dose = max(administered_date over VERIFIED LOCAL doses)
          due = max(base, last_dose + req.min_interval_days days)
      if an ExemptionRequest for (student, req.vaccine_code) is SUSPENDED_OUTBREAK:
          due = min(due, current_clock)                # immediately due during outbreak
      return due
    input_set: "VERIFIED ImmunizationRecords with source IN {MANUAL, CLINIC} only; exemption considered in statuses APPROVED and SUSPENDED_OUTBREAK."
    constants: {}
    precision: "datetime comparison at second precision; month addition is calendar-month arithmetic"
    variants: []

  - name: timing_rules
    trigger: "student creation (provisional_deadline); notice issuance (exclusion_date); POST /api/ops/compliance-sweep (both boundaries evaluated)"
    algorithm: threshold
    formula: |
      provisional_deadline = enrollment_date + PROVISIONAL_WINDOW_DAYS days
      sweep flips ENROLLED_PROVISIONAL -> NON_COMPLIANT only when
          current_clock >  provisional_deadline        # strict: AT the deadline is still provisional
      notice.exclusion_date (INITIAL_NONCOMPLIANCE) = issue_date + EXCLUSION_GRACE_DAYS days
      notice.exclusion_date (OUTBREAK_EXCLUSION)    = issue_date
      sweep escalates ISSUED -> EXCLUSION_EFFECTIVE only when
          current_clock >= exclusion_date              # inclusive: AT the exclusion date escalates
    input_set: "Students with status == ENROLLED_PROVISIONAL; ComplianceNotices with status == ISSUED."
    constants:
      PROVISIONAL_WINDOW_DAYS: 30
      EXCLUSION_GRACE_DAYS: 14
    precision: "datetime comparison at second precision"
    variants: []

  - name: annual_compliance_rate
    trigger: "POST /api/compliance-snapshots/generate (per school+grade cell); POST /api/compliance-snapshots/district-rollup (district aggregation)"
    algorithm: aggregation
    formula: |
      members(variant):
        CENSUS_DATE:   Student where school_code == cell.school_code AND grade == cell.grade
                       AND enrollment_date <= census_date AND status != WITHDRAWN
        EVER_ENROLLED: Student where school_code == cell.school_code AND grade == cell.grade
                       AND enrollment_date <= census_date   (any status, WITHDRAWN included)
      enrolled_count  = |members|
      compliant_count = count(members where REGISTRY_RECONCILED evaluation is all-SATISFIED)
      exempt_count    = count(members with >= 1 ExemptionRequest status == APPROVED)
      compliance_rate = null if enrolled_count == 0
                        else round(100.0 * compliant_count / enrolled_count, 1) ROUND_HALF_UP
      district_rollup(school_year, grade):                # NESTED ROUNDING ORDER IS PINNED
        cells = all school_codes having >= 1 member (enrolled_count > 0),
                evaluated live with census_date = current clock and CENSUS_DATE membership
        step 1: rate_s   = round(100.0 * compliant_s / enrolled_s, 1) ROUND_HALF_UP   # per school FIRST
        step 2: district_rate = round( sum(rate_s * enrolled_s) / sum(enrolled_s), 1 ) ROUND_HALF_UP
        step 3: schools_included = |cells|; enrolled_total = sum(enrolled_s)
        if no cells: district_rate = null
        (Aggregating raw counts first and rounding once is explicitly NOT the rule;
         the per-school rounded rate is the weighted term.)
    input_set: "Students per membership rule above; compliance determined by the REGISTRY_RECONCILED variant at generation time."
    constants:
      RATE_DECIMALS: 1
    precision: "1 decimal place, ROUND_HALF_UP; per-school rounding strictly precedes district weighting"
    variants:
      - name: CENSUS_DATE
        when: "official annual compliance report"
        difference: "WITHDRAWN students excluded from the denominator"
      - name: EVER_ENROLLED
        when: "auxiliary accountability view"
        difference: "WITHDRAWN students remain in the denominator, so identical data yields an equal-or-lower rate"

  - name: session_booked_count
    trigger: "appointment book, cancel, complete, no-show sweep, session cancel cascade"
    algorithm: aggregation
    formula: |
      ClinicSession.booked_count =
        count(ClinicAppointment where clinic_session_id == session.id AND status == BOOKED)
      Recomputed after every appointment mutation affecting the session;
      every such recompute increments ClinicSession.version by 1.
    input_set: "ClinicAppointments with status == BOOKED only (COMPLETED, CANCELLED, NO_SHOW excluded)."
    constants: {}
    precision: "integer"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path-template ids exist, validated left-to-right; then body FK ids (student_id) exist"
    error_id: ERR_STUDENT_NOT_FOUND | ERR_RECORD_NOT_FOUND | ERR_EXEMPTION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_OUTBREAK_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} path params or FK body fields"
  - priority: 4
    category: state
    check: "OCC: expected_student_version equals current Student.version (dose creation); expected_clinic_session_version equals current ClinicSession.version (appointment booking)"
    error_id: ERR_STALE_STUDENT_VERSION | ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /api/students/{id}/immunization-records; POST /api/clinic-sessions/{id}/appointments"
  - priority: 5
    category: state
    check: "target resource state permits the operation: Student.status != WITHDRAWN for dose entry / exemption submit / booking; ExemptionRequest in SUBMITTED for start-review, UNDER_REVIEW for approve/deny, DENIED for resubmit; ClinicSession SCHEDULED for open, OPEN for close, SCHEDULED|OPEN for cancel, OPEN for booking; ClinicAppointment BOOKED for cancel/complete; ComplianceNotice ISSUED for rescind; OutbreakEvent ACTIVE for lift; ComplianceSnapshot DRAFT for finalize"
    error_id: ERR_STUDENT_NOT_ACTIVE | ERR_EXEMPTION_NOT_REVIEWABLE | ERR_EXEMPTION_NOT_RESUBMITTABLE | ERR_SESSION_NOT_OPENABLE | ERR_SESSION_NOT_CLOSABLE | ERR_SESSION_NOT_CANCELLABLE | ERR_SESSION_NOT_OPEN | ERR_APPOINTMENT_NOT_BOOKED | ERR_NOTICE_NOT_OPEN | ERR_OUTBREAK_ALREADY_LIFTED | ERR_SNAPSHOT_FINALIZED
    http_status: 409
    applies_to: "all action/transition endpoints and mutating endpoints with state preconditions"
  - priority: 6
    category: business_safety
    check: "dose clinical safety, evaluated in this order: (6a) administered_date >= date_of_birth + min_age_months for the vaccine's applicable requirement; (6b) administered_date >= max(existing non-VOIDED same-student same-vaccine administered_date) + min_interval_days"
    error_id: ERR_MIN_AGE_VIOLATION | ERR_MIN_INTERVAL_VIOLATION
    http_status: 422
    applies_to: "POST /api/students/{id}/immunization-records"
  - priority: 7
    category: business_temporal
    check: "temporal placement, evaluated in this order: (7a) on session create, no other ClinicSession for the same school_code with status IN {SCHEDULED, OPEN, CLOSED} may have |session_date difference| < MIN_SESSION_GAP_DAYS days (7 days; a gap of exactly 7 days is allowed); (7b) on booking, appointment [start_time, end_time) must lie within the session window [session_date, session_date + duration_minutes); (7c) on booking, half-open interval [start_time, end_time) must not overlap any other BOOKED appointment of the same student (adjacency — end == start — is NOT an overlap)"
    error_id: ERR_SESSION_GAP_VIOLATION | ERR_APPOINTMENT_OUTSIDE_SESSION | ERR_APPOINTMENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /api/clinic-sessions; POST /api/clinic-sessions/{id}/appointments"
  - priority: 8
    category: business_constraint
    check: "uniqueness / segregation / allowability, evaluated in this order: (8a) no non-VOIDED ImmunizationRecord with same (student_id, vaccine_code, dose_number); (8b) caller X-User-ID != submitted_by_user_id on start-review/approve/deny; (8c) no VaccineRequirement with same (vaccine_code, school_year); (8d) no OutbreakEvent with status == ACTIVE for same (school_code, vaccine_code); (8e) manual INITIAL_NONCOMPLIANCE notice requires Student.status == NON_COMPLIANT; (8f) no ComplianceSnapshot with status == FINALIZED for same (school_year, school_code, grade, rate_variant)"
    error_id: ERR_DUPLICATE_DOSE | ERR_SEGREGATION_OF_DUTIES | ERR_DUPLICATE_REQUIREMENT | ERR_OUTBREAK_ALREADY_ACTIVE | ERR_NOTICE_NOT_ALLOWED | ERR_SNAPSHOT_EXISTS
    http_status: 409
    applies_to: "POST /api/students/{id}/immunization-records; POST /api/exemption-requests/{id}/{start-review,approve,deny}; POST /api/vaccine-requirements; POST /api/outbreak-events; POST /api/students/{id}/compliance-notices; POST /api/compliance-snapshots/generate"
  - priority: 9
    category: business_fiscal
    check: "capacity: booking requires ClinicSession.booked_count < ClinicSession.capacity (booked_count == capacity rejects; booked_count == capacity - 1 accepts)"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /api/clinic-sessions/{id}/appointments"
  - priority: 10
    category: existence
    check: "request-body schema: required fields present, enum members valid, types well-formed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/api/students"
    description: "Register a student. Status starts ENROLLED_PROVISIONAL; provisional_deadline = enrollment_date + 30 days; initial deficiency evaluation computed."
    roles: [HealthClerk]
    code: 201
    input: [legal_name, date_of_birth, grade, school_code, enrollment_date]
    output: Student
    side_effects: ["initial requirement_evaluation", "deficiency_vaccine_codes populated"]
  - method: GET
    path: "/api/students"
    description: "List students with optional filters and pagination."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["school_code?", "status?", "grade?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/api/students/{id}"
    description: "Fetch one student including computed fields."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/api/students/{id}/withdraw"
    description: "Withdraw a student (terminal). Cancels the student's BOOKED appointments."
    roles: [HealthClerk]
    code: 200
    input: []
    output: Student
    side_effects: ["BOOKED ClinicAppointments -> CANCELLED", "affected ClinicSession.booked_count recomputed, version incremented", "Student.version incremented"]
  - method: GET
    path: "/api/students/{id}/compliance"
    description: "Computed per-requirement compliance view showing BOTH evaluation variants and next_dose_due_date per requirement."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: []
    output: { student_status: string, requirements: array }
    side_effects: []
  - method: POST
    path: "/api/vaccine-requirements"
    description: "Configure a grade-scoped vaccine requirement for a school year. Unique on (vaccine_code, school_year)."
    roles: [DistrictHealthOfficer]
    code: 201
    input: [vaccine_code, applies_to_grades, doses_required, min_interval_days, min_age_months, school_year]
    output: VaccineRequirement
    side_effects: []
  - method: GET
    path: "/api/vaccine-requirements"
    description: "List vaccine requirements with optional filters."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["grade?", "school_year?", "limit?", "offset?"]
    output: VaccineRequirement[]
    side_effects: []
  - method: POST
    path: "/api/students/{id}/immunization-records"
    description: "Record a dose (source=MANUAL, status=PENDING_VERIFICATION). OCC-guarded on Student.version; increments Student.version on success."
    roles: [HealthClerk]
    code: 201
    input: [vaccine_code, dose_number, administered_date, expected_student_version]
    output: ImmunizationRecord
    side_effects: ["Student requirement_evaluation recomputed", "Student.version incremented by 1"]
  - method: GET
    path: "/api/students/{id}/immunization-records"
    description: "List a student's dose records."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["status?", "vaccine_code?", "limit?", "offset?"]
    output: ImmunizationRecord[]
    side_effects: []
  - method: POST
    path: "/api/immunization-records/{id}/verify"
    description: "Verify a pending dose record; triggers student re-evaluation and notice cure cascades."
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ImmunizationRecord
    side_effects: ["record -> VERIFIED", "Student re-evaluation and possible status transition", "notice cure cascade", "Student.version incremented"]
  - method: POST
    path: "/api/immunization-records/{id}/void"
    description: "Void a dose record (from PENDING_VERIFICATION or VERIFIED); triggers student re-evaluation."
    roles: [SchoolNurse]
    code: 200
    input: [reason]
    output: ImmunizationRecord
    side_effects: ["record -> VOIDED", "Student re-evaluation and possible status transition", "Student.version incremented"]
  - method: POST
    path: "/api/students/{id}/exemption-requests"
    description: "Submit a medical/religious exemption request; submitted_by_user_id captured from X-User-ID."
    roles: [SchoolNurse, DistrictHealthOfficer]
    code: 201
    input: [vaccine_code, exemption_type, document_ref]
    output: ExemptionRequest
    side_effects: []
  - method: GET
    path: "/api/students/{id}/exemption-requests"
    description: "List a student's exemption requests."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExemptionRequest[]
    side_effects: []
  - method: POST
    path: "/api/exemption-requests/{id}/start-review"
    description: "Move SUBMITTED -> UNDER_REVIEW. Caller must differ from submitter."
    roles: [DistrictHealthOfficer]
    code: 200
    input: []
    output: ExemptionRequest
    side_effects: ["reviewed_by_user_id set"]
  - method: POST
    path: "/api/exemption-requests/{id}/approve"
    description: "Approve an UNDER_REVIEW request. Blocked while a matching outbreak is ACTIVE; triggers student re-evaluation."
    roles: [DistrictHealthOfficer]
    code: 200
    input: []
    output: ExemptionRequest
    side_effects: ["Student re-evaluation and possible status transition", "Student.version incremented"]
  - method: POST
    path: "/api/exemption-requests/{id}/deny"
    description: "Deny an UNDER_REVIEW request with a reason."
    roles: [DistrictHealthOfficer]
    code: 200
    input: [denial_reason]
    output: ExemptionRequest
    side_effects: ["denial_reason set"]
  - method: POST
    path: "/api/exemption-requests/{id}/resubmit"
    description: "Resubmit a DENIED request with new documentation; resets review fields and re-anchors submitted_by_user_id."
    roles: [SchoolNurse, DistrictHealthOfficer]
    code: 200
    input: [document_ref]
    output: ExemptionRequest
    side_effects: ["reviewed_by_user_id := null", "denial_reason := null", "submitted_by_user_id := caller"]
  - method: POST
    path: "/api/students/{id}/compliance-notices"
    description: "Manually issue an INITIAL_NONCOMPLIANCE notice. Requires Student.status == NON_COMPLIANT. OUTBREAK_EXCLUSION notices are system-created only."
    roles: [DistrictHealthOfficer]
    code: 201
    input: [notice_type]
    output: ComplianceNotice
    side_effects: ["exclusion_date = issue_date + 14 days for INITIAL_NONCOMPLIANCE"]
  - method: GET
    path: "/api/students/{id}/compliance-notices"
    description: "List a student's compliance notices."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComplianceNotice[]
    side_effects: []
  - method: POST
    path: "/api/compliance-notices/{id}/rescind"
    description: "Rescind an ISSUED notice (clerical error)."
    roles: [DistrictHealthOfficer]
    code: 200
    input: [reason]
    output: ComplianceNotice
    side_effects: ["resolved_at set"]
  - method: POST
    path: "/api/outbreak-events"
    description: "Declare an outbreak for (school_code, vaccine_code). Cascades: APPROVED exemptions -> SUSPENDED_OUTBREAK -> affected students -> EXCLUDED with immediate OUTBREAK_EXCLUSION notice."
    roles: [DistrictHealthOfficer]
    code: 201
    input: [school_code, vaccine_code]
    output: OutbreakEvent
    side_effects: ["matching APPROVED ExemptionRequests -> SUSPENDED_OUTBREAK", "affected Students -> EXCLUDED", "OUTBREAK_EXCLUSION notices created with status EXCLUSION_EFFECTIVE"]
  - method: POST
    path: "/api/outbreak-events/{id}/lift"
    description: "Lift an ACTIVE outbreak; reinstates suspended exemptions and re-admits or downgrades affected students."
    roles: [DistrictHealthOfficer]
    code: 200
    input: []
    output: OutbreakEvent
    side_effects: ["SUSPENDED_OUTBREAK ExemptionRequests -> APPROVED", "EXCLUDED students -> ENROLLED_COMPLIANT or NON_COMPLIANT", "OUTBREAK_EXCLUSION notices -> CURED"]
  - method: POST
    path: "/api/clinic-sessions"
    description: "Schedule a catch-up clinic session. Same-school sessions must be >= 7 days apart (CANCELLED sessions ignored)."
    roles: [SchoolNurse]
    code: 201
    input: [school_code, session_date, duration_minutes, capacity]
    output: ClinicSession
    side_effects: []
  - method: GET
    path: "/api/clinic-sessions/{id}"
    description: "Fetch one clinic session including booked_count and version."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: []
    output: ClinicSession
    side_effects: []
  - method: POST
    path: "/api/clinic-sessions/{id}/open"
    description: "Open a SCHEDULED session for booking."
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ClinicSession
    side_effects: []
  - method: POST
    path: "/api/clinic-sessions/{id}/close"
    description: "Close an OPEN session."
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ClinicSession
    side_effects: []
  - method: POST
    path: "/api/clinic-sessions/{id}/cancel"
    description: "Cancel a SCHEDULED or OPEN session; cascades cancellation to BOOKED appointments."
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ClinicSession
    side_effects: ["BOOKED appointments -> CANCELLED", "booked_count recomputed"]
  - method: POST
    path: "/api/clinic-sessions/{id}/appointments"
    description: "Book an appointment into an OPEN session. OCC-guarded on ClinicSession.version; increments ClinicSession.version on success."
    roles: [HealthClerk]
    code: 201
    input: [student_id, vaccine_code, start_time, end_time, expected_clinic_session_version]
    output: ClinicAppointment
    side_effects: ["booked_count recomputed (incremented by 1)", "ClinicSession.version incremented by 1"]
  - method: GET
    path: "/api/clinic-sessions/{id}/appointments"
    description: "List a session's appointments."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicAppointment[]
    side_effects: []
  - method: GET
    path: "/api/clinic-appointments/{id}"
    description: "Fetch one appointment."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: []
  - method: GET
    path: "/api/students/{id}/clinic-appointments"
    description: "List a student's appointments across sessions."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicAppointment[]
    side_effects: []
  - method: POST
    path: "/api/clinic-appointments/{id}/cancel"
    description: "Cancel a BOOKED appointment; frees the session seat."
    roles: [HealthClerk]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["booked_count recomputed (decremented by 1)", "ClinicSession.version incremented by 1"]
  - method: POST
    path: "/api/clinic-appointments/{id}/complete"
    description: "Mark a BOOKED appointment completed; creates a VERIFIED ImmunizationRecord with source=CLINIC and re-evaluates the student."
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["ImmunizationRecord created (source=CLINIC, status=VERIFIED)", "Student re-evaluation and possible status transition incl. notice cure", "booked_count recomputed (decremented by 1)", "ClinicSession.version incremented by 1"]
  - method: GET
    path: "/api/clinic-appointments/{id}/immunization-records"
    description: "List dose records produced by this appointment (0 or 1 entries)."
    roles: [HealthClerk, SchoolNurse, DistrictHealthOfficer, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ImmunizationRecord[]
    side_effects: []
  - method: POST
    path: "/api/registry-sync-runs"
    description: "Synchronously reconcile the school's students against seeded state-registry doses; imports missing doses as VERIFIED REGISTRY_IMPORT records and reports match/discrepancy counts."
    roles: [RegistryCoordinator]
    code: 201
    input: [school_code]
    output: RegistrySyncRun
    side_effects: ["ImmunizationRecords created for imported doses", "affected students re-evaluated (REGISTRY_RECONCILED variant changes; LOCAL_RECORDS unaffected)"]
  - method: POST
    path: "/api/compliance-snapshots/generate"
    description: "Generate a DRAFT per-(school, grade, year, rate_variant) compliance snapshot using the REGISTRY_RECONCILED evaluation."
    roles: [RegistryCoordinator]
    code: 201
    input: [school_year, school_code, grade, census_date, rate_variant]
    output: ComplianceSnapshot
    side_effects: ["enrolled_count / compliant_count / exempt_count / compliance_rate computed"]
  - method: POST
    path: "/api/compliance-snapshots/{id}/finalize"
    description: "Finalize a DRAFT snapshot, locking its numbers."
    roles: [DistrictHealthOfficer]
    code: 200
    input: []
    output: ComplianceSnapshot
    side_effects: ["snapshot locked"]
  - method: POST
    path: "/api/compliance-snapshots/district-rollup"
    description: "Compute the district-wide rate for a (school_year, grade) with the pinned nested rounding order (per-school rounded rate first, enrollment-weighted, round again)."
    roles: [DistrictHealthOfficer]
    code: 200
    input: [school_year, grade]
    output: { district_rate: number, schools_included: integer, enrolled_total: integer }
    side_effects: []
  - method: POST
    path: "/api/ops/compliance-sweep"
    description: "Ops-run checkpoint: (1) ENROLLED_PROVISIONAL students past provisional_deadline and deficient -> NON_COMPLIANT with auto-issued INITIAL_NONCOMPLIANCE notice; (2) ISSUED notices at/past exclusion_date with still-deficient student -> EXCLUSION_EFFECTIVE and student -> EXCLUDED; (3) BOOKED appointments with end_time < current clock -> NO_SHOW; (4) ENROLLED_PROVISIONAL students with zero deficiencies -> ENROLLED_COMPLIANT."
    roles: [DistrictHealthOfficer]
    code: 200
    input: []
    output: { provisional_expired_count: integer, notices_escalated_count: integer, students_excluded_count: integer, students_marked_compliant_count: integer, appointments_no_show_count: integer }
    side_effects: ["Student status transitions", "ComplianceNotice issuance/escalation", "ClinicAppointment NO_SHOW transitions with booked_count recompute"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (server startup default) and never falls back to wall-clock time."
    roles: [DistrictHealthOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]
  - method: POST
    path: "/_registry/seed-doses"
    description: "Test-driving endpoint: plant a dose record in the external state registry so a registry-sync run can import/match/flag it."
    roles: [RegistryCoordinator]
    code: 201
    input: [student_id, vaccine_code, dose_number, administered_date]
    output: { seed_id: string }
    side_effects: ["registry-side dose stored for the next sync run"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role is not in the endpoint's allowed roles."
  - id: ERR_VALIDATION
    http: 400
    condition: "Required request field missing, invalid enum member, or malformed type."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "Referenced student id does not exist."
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "Referenced immunization record id does not exist."
  - id: ERR_EXEMPTION_NOT_FOUND
    http: 404
    condition: "Referenced exemption request id does not exist."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "Referenced compliance notice id does not exist."
  - id: ERR_OUTBREAK_NOT_FOUND
    http: 404
    condition: "Referenced outbreak event id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced clinic session id does not exist."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Referenced clinic appointment id does not exist."
  - id: ERR_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "Referenced compliance snapshot id does not exist."
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_version does not equal the Student's current version (OCC)."
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_clinic_session_version does not equal the ClinicSession's current version (OCC)."
  - id: ERR_STUDENT_NOT_ACTIVE
    http: 409
    condition: "Operation targets a Student with status == WITHDRAWN."
  - id: ERR_EXEMPTION_NOT_REVIEWABLE
    http: 409
    condition: "start-review/approve/deny attempted from a state other than SUBMITTED/UNDER_REVIEW respectively."
  - id: ERR_EXEMPTION_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmit attempted on a request not in DENIED."
  - id: ERR_SESSION_NOT_OPENABLE
    http: 409
    condition: "open attempted on a session not in SCHEDULED."
  - id: ERR_SESSION_NOT_CLOSABLE
    http: 409
    condition: "close attempted on a session not in OPEN."
  - id: ERR_SESSION_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on a session in CLOSED or CANCELLED."
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "booking attempted into a session not in OPEN."
  - id: ERR_APPOINTMENT_NOT_BOOKED
    http: 409
    condition: "cancel/complete attempted on an appointment not in BOOKED."
  - id: ERR_NOTICE_NOT_OPEN
    http: 409
    condition: "rescind attempted on a notice in a terminal or EXCLUSION_EFFECTIVE state."
  - id: ERR_OUTBREAK_ALREADY_LIFTED
    http: 409
    condition: "lift attempted on an OutbreakEvent already LIFTED."
  - id: ERR_SNAPSHOT_FINALIZED
    http: 409
    condition: "mutation attempted on a FINALIZED snapshot."
  - id: ERR_MIN_AGE_VIOLATION
    http: 422
    condition: "Dose administered before date_of_birth + min_age_months for the applicable requirement."
  - id: ERR_MIN_INTERVAL_VIOLATION
    http: 422
    condition: "Dose administered less than min_interval_days after the latest non-VOIDED dose of the same vaccine for the student."
  - id: ERR_SESSION_GAP_VIOLATION
    http: 409
    condition: "New session for a school_code is less than 7 days from an existing non-CANCELLED session for that school."
  - id: ERR_APPOINTMENT_OUTSIDE_SESSION
    http: 422
    condition: "Appointment [start_time, end_time) does not lie within the session window."
  - id: ERR_APPOINTMENT_TIME_CONFLICT
    http: 409
    condition: "Appointment half-open interval overlaps another BOOKED appointment of the same student."
  - id: ERR_DUPLICATE_DOSE
    http: 409
    condition: "A non-VOIDED record already exists for (student_id, vaccine_code, dose_number)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Reviewer X-User-ID equals ExemptionRequest.submitted_by_user_id on start-review/approve/deny."
  - id: ERR_OUTBREAK_ACTIVE
    http: 409
    condition: "Exemption approve attempted while an OutbreakEvent for (student's school_code, vaccine_code) is ACTIVE."
  - id: ERR_DUPLICATE_REQUIREMENT
    http: 409
    condition: "A VaccineRequirement already exists for (vaccine_code, school_year)."
  - id: ERR_OUTBREAK_ALREADY_ACTIVE
    http: 409
    condition: "An OutbreakEvent with status ACTIVE already exists for (school_code, vaccine_code)."
  - id: ERR_NOTICE_NOT_ALLOWED
    http: 422
    condition: "Manual INITIAL_NONCOMPLIANCE notice requires Student.status == NON_COMPLIANT; OUTBREAK_EXCLUSION is system-created only."
  - id: ERR_SNAPSHOT_EXISTS
    http: 409
    condition: "A FINALIZED snapshot already exists for (school_year, school_code, grade, rate_variant)."
  - id: ERR_SESSION_FULL
    http: 409
    condition: "ClinicSession.booked_count >= ClinicSession.capacity at booking time."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: HealthClerk
    description: "District health-services clerk: enrollment intake, manual dose entry, catch-up clinic booking."
    identity: opaque
    exclusive_operations:
      - "POST /api/students"
      - "POST /api/students/{id}/withdraw"
      - "POST /api/students/{id}/immunization-records"
      - "POST /api/clinic-sessions/{id}/appointments"
      - "POST /api/clinic-appointments/{id}/cancel"
    shared_operations:
      - "all GET endpoints"
  - name: SchoolNurse
    description: "School nurse: verifies dose records, submits exemption requests, runs catch-up clinic sessions."
    identity: opaque
    exclusive_operations:
      - "POST /api/immunization-records/{id}/verify"
      - "POST /api/immunization-records/{id}/void"
      - "POST /api/clinic-sessions"
      - "POST /api/clinic-sessions/{id}/open"
      - "POST /api/clinic-sessions/{id}/close"
      - "POST /api/clinic-sessions/{id}/cancel"
      - "POST /api/clinic-appointments/{id}/complete"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/students/{id}/exemption-requests (shared with DistrictHealthOfficer)"
      - "POST /api/exemption-requests/{id}/resubmit (shared with DistrictHealthOfficer)"
  - name: DistrictHealthOfficer
    description: "District health officer: requirement configuration, exemption adjudication, notices, outbreaks, sweeps, snapshot finalization. Segregation of duties: cannot review an exemption request they personally submitted."
    identity: opaque
    exclusive_operations:
      - "POST /api/vaccine-requirements"
      - "POST /api/exemption-requests/{id}/start-review"
      - "POST /api/exemption-requests/{id}/approve"
      - "POST /api/exemption-requests/{id}/deny"
      - "POST /api/students/{id}/compliance-notices"
      - "POST /api/compliance-notices/{id}/rescind"
      - "POST /api/outbreak-events"
      - "POST /api/outbreak-events/{id}/lift"
      - "POST /api/ops/compliance-sweep"
      - "POST /api/compliance-snapshots/{id}/finalize"
      - "POST /api/compliance-snapshots/district-rollup"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/students/{id}/exemption-requests (shared with SchoolNurse)"
      - "POST /api/exemption-requests/{id}/resubmit (shared with SchoolNurse)"
  - name: RegistryCoordinator
    description: "State-registry liaison: runs reconciliation and generates annual compliance snapshots."
    identity: opaque
    exclusive_operations:
      - "POST /api/registry-sync-runs"
      - "POST /api/compliance-snapshots/generate"
      - "POST /_registry/seed-doses"
    shared_operations:
      - "all GET endpoints"
