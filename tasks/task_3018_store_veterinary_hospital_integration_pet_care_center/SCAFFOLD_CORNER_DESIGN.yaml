              as: PlatformAdmin
          trigger:
            - call: "GET /stores?limit=1&offset=0"
              payload: {}
              as: Any
          assert:
            - "the response is 200 with response_type array"
            - "meta carries total_count == 1, limit == 1, offset == 0 and has_more == false"
            - "the same call with limit=0 is refused with 400 ERR_INVALID_REQUEST because limit must be between 1 and 100"

