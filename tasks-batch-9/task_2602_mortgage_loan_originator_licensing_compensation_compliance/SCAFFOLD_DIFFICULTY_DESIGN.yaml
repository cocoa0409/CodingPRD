  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lock_rejected_after_owning_license_revoked
        grounds:
          - validations[priority=13]
          - state_machines.LicenseRegistration.ACTIVE_to_REVOKED
          - state_machines.LoanApplication.TAKEN_to_LOCKED
        distinguishing_aspect: |
          Entity pair LoanApplication x LicenseRegistration. The loan is in a state that normally
          permits the lock (TAKEN) and nothing about the loan changed, but the OTHER entity moved
          ACTIVE -> REVOKED, which drops the state from authorized_state_codes and suspends the
          loan's authority_flag. The identical lock request succeeds before the revocation and is
          rejected with ERR_LICENSE_NOT_ACTIVE after it.
        test_recipe:
          setup:
            - "Originator NMLS 1100013 with an ACTIVE CA licence CA-DFPI-40201 and sponsorship
               INST-ALPHA effective 2026-08-01T00:00:00Z."
            - "Clock at 2026-08-05T00:00:00Z; one loan taken while authority holds, left in TAKEN."
            - "A second loan taken at the same instant is locked BEFORE the revocation, to show the
               identical request is otherwise legal."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100013", legal_name: "Colin Verte", hire_date: "2025-03-03T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-40201", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-ALPHA", effective_at: "2026-08-01T00:00:00Z", expected_license_registration_version: "${lic_v0}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { spon_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-81", product_type: "FIXED_30", requested_amount_cents: 19000000, par_rate_bps: 648 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { l_ctrl: $.data.id }
            - call: "POST /loan-applications/${l_ctrl}/lock"
              payload: { note_rate_bps: 655, locked_amount_cents: 19000000 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { ctrl_status: $.data.status, ctrl_flag: $.data.authority_flag }
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BW-2602-82", product_type: "FIXED_30", requested_amount_cents: 21000000, par_rate_bps: 648 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { l_test: $.data.id, test_flag0: $.data.authority_flag }
          trigger:
            - call: "POST /license-registrations/${lic_id}/status-actions"
              payload: { action: "REVOKE", note: "State order revoking the licence for cause." }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_status: $.data.status, lic_spon_code: $.data.active_sponsoring_institution_code }
            - call: "POST /loan-applications/${l_test}/lock"
              payload: { note_rate_bps: 655, locked_amount_cents: 21000000 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /loan-applications/${l_test}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { test_status: $.data.status, test_flag: $.data.authority_flag, test_locked: $.data.locked_amount_cents }
          assert:
            - "${ctrl_status} == LOCKED and ${ctrl_flag} == VERIFIED and ${test_flag0} == VERIFIED
               (the identical lock is legal while the licence is ACTIVE)"
            - "${lic_status} == REVOKED and ${lic_spon_code} == null"
            - "SponsorshipTransfer.${spon_id}.status == RELINQUISHED and
               Originator.${orig_id}.authorized_state_codes == []"
            - "${err_id} == ERR_LICENSE_NOT_ACTIVE with HTTP 422 - priority 13 fires ahead of the
               priority-14 ERR_STATE_NOT_AUTHORIZED that the same request also trips"
            - "${test_status} == TAKEN and ${test_flag} == SUSPENDED and ${test_locked} == null
               (the rejected lock wrote nothing; the SUSPENDED flag came from the revocation
               cascade, not from the failed lock)"
            - "LoanApplication.${l_ctrl}.authority_flag == SUSPENDED as well - the cascade covers
               both TAKEN and LOCKED loans in that state"
            - "GET /unlicensed-activity-investigations?originator_id=${orig_id} returns 2 rows, both
               OPEN with opened_by CASCADE, and
               Originator.${orig_id}.open_investigation_count == 2"

      - name: compensation_release_blocked_until_investigation_remediated
        grounds:
          - validations[priority=21]
          - state_machines.UnlicensedActivityInvestigation
          - state_machines.LoanApplication.PENDING_to_ACCRUED
        distinguishing_aspect: |
          Entity pair LoanApplication x UnlicensedActivityInvestigation, and the gate runs the
          other way round from the sibling instance: here the loan is already CLOSED with
          compensation_status PENDING and the blocking condition lives entirely in the
          investigation's state. The release call is rejected while the investigation is OPEN and
          again nothing changes; only after SUBSTANTIATED -> REMEDIATED does the identical call
          succeed and mint the withheld PROVISIONAL ledger line.
        test_recipe:
          setup:
            - "Originator NMLS 1100014 with a CA licence expiring 2026-09-01T00:00:00Z and an
               ACTIVE 200 bps plan assigned over [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]."
            - "One loan taken and locked at 20000000 cents at clock 2026-08-05T00:00:00Z."
            - "Clock advanced to 2026-09-02T00:00:00Z and the sweep run once, so the licence expires,
               the loan's authority_flag becomes SUSPENDED and a CASCADE investigation opens."
            - "The loan is then closed, which takes DIMENSION 2 BRANCH B: compensation_status
               PENDING and no CompensationRecord."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100014", legal_name: "Faye Otieno", hire_date: "2025-04-07T00:00:00Z", employment_status: "EMPLOYED" }
