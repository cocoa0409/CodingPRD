scenario: "1918. Multifamily Acquisition Due Diligence & Lease Audit (multifamily acquisitions team): lease file audit against rent roll & concession verification, unit walk inspection & deferred maintenance quantification, utility/expense analysis & tax reassessment projection, security deposit reconciliation & transfer, employee retention/termination plan, service contract assumption or cancellation, insurance/loss run review, closing prorations & post-closing adjustments"

domain_name: multifamily-acquisition-due-diligence
api_prefix: /acquisitions

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
# Money is integer cents. Dates are ISO-8601 datetimes (UTC); day-count math
# uses calendar-day differences of the date portion. common_fields: true adds
# id, created_at, updated_at, version (version starts 1, +1 per mutation).
entities:
  - name: Acquisition
    parent: null
    common_fields: true
    fields:
      - { name: property_name, type: string, source: input, description: "Property name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: agreed_purchase_price_cents, type: integer, source: input, description: "Contract purchase price in cents" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents" }
      - { name: closing_date, type: datetime, source: input, description: "Scheduled closing date; buyer owns the closing day for all prorations" }
      - { name: diligence_deadline, type: datetime, source: input, description: "End of due diligence period" }
      - { name: true_up_window_days, type: integer, source: input, default: 90, description: "Days after closing during which post-closing adjustments may be asserted" }
      - { name: assessment_ratio, type: number, source: input, description: "Jurisdiction assessment ratio applied to value to obtain assessed value (e.g. 0.40)" }
      - { name: millage_rate, type: number, source: input, description: "Mills per $1.00 of assessed value (e.g. 25.0)" }
      - { name: prior_year_tax_cents, type: integer, source: input, description: "Most recent full-year property tax actually billed, in cents" }
      - { name: maintenance_estimate_basis, type: enum, source: input, default: INSPECTOR_BASIS, description: "INSPECTOR_BASIS | SELLER_BASIS — selects which estimate feeds the deferred-maintenance rollup", constraints: "enum: INSPECTOR_BASIS, SELLER_BASIS" }
      - { name: interest_accrual_method, type: enum, source: input, default: DAILY_ACCRUAL, description: "SIMPLE_ANNUAL (interest only per whole elapsed anniversary year) | DAILY_ACCRUAL (deposit x rate x days/365)", constraints: "enum: SIMPLE_ANNUAL, DAILY_ACCRUAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_DILIGENCE | DILIGENCE_COMPLETE | PRE_CLOSING | CLOSED | SETTLED | TERMINATED" }
      - { name: readiness_posture, type: enum, source: computed, description: "ON_TRACK | AT_RISK | BLOCKED — derived aggregate over child workstream state; see posture_derivation calculation" }
      - { name: deferred_maintenance_total_cents, type: integer, source: computed, description: "Sum of verified_cost_cents over DeficiencyFinding rows with status VERIFIED whose unit is not EXCLUDED" }
      - { name: rent_roll_variance_cents, type: integer, source: computed, description: "Sum of (RentRollEntry.reported_rent_cents - LeaseFile.contract_rent_cents) over LeaseFile rows with status DISCREPANCY_FLAGGED whose unit is not EXCLUDED" }
      - { name: deposit_variance_cents, type: integer, source: computed, description: "Sum of SecurityDepositLedgerEntry.variance_cents over entries with status DISPUTED" }
      - { name: payroll_accrual_cents, type: integer, source: computed, description: "Sum of (severance_cents + pto_payout_cents) over EmployeeDecision rows with decision in {TERMINATE, TRANSFER} and status in {APPROVED, NOTIFIED}" }
      - { name: net_proration_cents, type: integer, source: computed, description: "Sum of net_amount_cents over this acquisition's ProrationStatements with status in {APPROVED, SETTLED}; 0 when none" }
      - { name: closing_executed_at, type: datetime, source: system, description: "Logical-clock timestamp stamped when execute-closing succeeds; null until CLOSED" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id; owning acquisition" }
      - { name: unit_number, type: string, source: input, description: "Unit number; unique within the acquisition" }
      - { name: floor_plan, type: string, source: input, description: "Floor plan code" }
      - { name: sqft, type: integer, source: input, description: "Square footage" }
      - { name: market_rent_cents, type: integer, source: input, description: "Advertised market rent in cents" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CLEARING | VERIFIED | EXCLUDED — compound rollup of lease audit + walk QA + deposit reconciliation" }
      - { name: lease_audited, type: boolean, source: computed, description: "true when the unit's current LeaseFile has status in {AUDITED, RESOLVED, WAIVED}" }
      - { name: walk_accepted, type: boolean, source: computed, description: "true when the unit's latest non-cancelled UnitWalkInspection has status QA_ACCEPTED" }
      - { name: deposit_reconciled, type: boolean, source: computed, description: "true when at least one SecurityDepositLedgerEntry exists for the unit's current lease and its status is in {RECONCILED, ESCROW_QUEUED, TRANSFERRED}" }

  - name: LeaseFile
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit this lease covers" }
      - { name: resident_name, type: string, source: input, description: "Resident name as written on the lease" }
      - { name: lease_start_date, type: datetime, source: input, description: "Lease commencement" }
      - { name: lease_end_date, type: datetime, source: input, description: "Lease expiration" }
      - { name: contract_rent_cents, type: integer, source: input, description: "Monthly contract rent per the lease document" }
      - { name: term_months, type: integer, source: input, description: "Lease term in months" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Security deposit required by the lease" }
      - { name: supersedes_lease_id, type: string, source: input, description: "FK -> LeaseFile.id; when supplied, that lease (which must be the unit's current lease) is moved to SUPERSEDED" }
      - { name: status, type: enum, source: system, description: "UPLOADED | AUDITED | DISCREPANCY_FLAGGED | RESOLVED | WAIVED | SUPERSEDED; current lease = status != SUPERSEDED" }
      - { name: variance_cents, type: integer, source: computed, description: "RentRollEntry.reported_rent_cents - contract_rent_cents for the unit's rent roll entry; null until audited" }
      - { name: audit_result, type: enum, source: computed, description: "PENDING | MATCH | OVERSTATED | UNDERSTATED — comparison outcome of the last audit" }
      - { name: net_effective_rent_cents, type: integer, source: computed, description: "round_half_up((contract_rent_cents * term_months - sum of verified_value_cents over VERIFIED concessions) / term_months)" }
      - { name: waived_variance_cents, type: integer, source: computed, description: "Variance amount the buyer accepted when the lease was WAIVED; 0 otherwise" }

  - name: RentRollEntry
    parent: null
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit this seller rent-roll line covers; at most one entry per unit" }
      - { name: reported_resident_name, type: string, source: input, description: "Resident name per seller rent roll" }
      - { name: reported_rent_cents, type: integer, source: input, description: "Monthly rent per seller rent roll" }
      - { name: reported_concession_cents, type: integer, source: input, description: "Monthly concession per seller rent roll" }
      - { name: reported_deposit_cents, type: integer, source: input, description: "Deposit held per seller rent roll" }
      - { name: move_in_date, type: datetime, source: input, description: "Move-in date per rent roll" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | MISMATCHED — written only as a side effect of LeaseFile audit/flag/resolve" }

  - name: Concession
    parent: null
    common_fields: true
    fields:
      - { name: lease_file_id, type: string, source: input, description: "FK -> LeaseFile.id; lease the concession attaches to" }
      - { name: concession_type, type: enum, source: input, description: "RECURRING_MONTHLY | ONE_TIME_CREDIT | FREE_MONTH_AMORTIZED", constraints: "enum: RECURRING_MONTHLY, ONE_TIME_CREDIT, FREE_MONTH_AMORTIZED" }
      - { name: value_cents, type: integer, source: input, description: "Face value: monthly credit for RECURRING_MONTHLY, total credit otherwise" }
      - { name: coverage_start_date, type: datetime, source: input, description: "First covered day (inclusive)" }
      - { name: coverage_end_date, type: datetime, source: input, description: "Last covered day (inclusive) — coverage intervals are CLOSED intervals" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: verified_value_cents, type: integer, source: system, description: "Value accepted at verification; set by the verify action" }

  - name: UnitWalkInspection
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit walked" }
      - { name: inspector_ref, type: string, source: input, description: "Inspector identifier; the booked resource for overlap checks" }
      - { name: walk_start, type: datetime, source: input, description: "Walk window start — half-open interval [walk_start, walk_end)" }
      - { name: walk_end, type: datetime, source: input, description: "Walk window end (exclusive)" }
      - { name: condition_rating, type: integer, source: input, description: "1-5 condition score recorded at completion" }
      - { name: no_findings_declared, type: boolean, source: input, description: "Completer's declaration that zero findings exist; if false, at least one finding must be recorded before QA accept" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the caller who completed the walk; QA accept/reject by the same user is a segregation-of-duties violation" }
      - { name: reschedule_count, type: integer, source: system, description: "Number of QA_REJECTED -> SCHEDULED cycles", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | QA_ACCEPTED | QA_REJECTED — QA_REJECTED returns to SCHEDULED via reschedule (cycle)" }

  - name: DeficiencyFinding
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> UnitWalkInspection.id; inspection during which the deficiency was found" }
      - { name: category, type: enum, source: input, description: "LIFE_SAFETY | MAJOR_SYSTEMS | CODE_COMPLIANCE | COSMETIC", constraints: "enum: LIFE_SAFETY, MAJOR_SYSTEMS, CODE_COMPLIANCE, COSMETIC" }
      - { name: severity, type: integer, source: input, description: "1-5 severity" }
      - { name: seller_estimate_cents, type: integer, source: input, description: "Seller's cost-to-cure estimate" }
      - { name: inspector_estimate_cents, type: integer, source: input, description: "Inspector's cost-to-cure estimate" }
      - { name: verified_cost_cents, type: integer, source: computed, description: "round_half_up(base * severity_multiplier) + category_loading; base selected by Acquisition.maintenance_estimate_basis; recomputed on verify/dispute and on basis change" }
      - { name: status, type: enum, source: system, description: "OPEN | VERIFIED | DISPUTED | EXCLUDED — DISPUTED may return to VERIFIED (cycle)" }

  - name: UtilityExpenseRecord
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id" }
      - { name: period_month, type: string, source: input, description: "Calendar month as YYYY-MM" }
      - { name: category, type: enum, source: input, description: "ELECTRIC | GAS | WATER_SEWER | TRASH | OTHER", constraints: "enum: ELECTRIC, GAS, WATER_SEWER, TRASH, OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Recorded expense for the period" }
      - { name: source, type: enum, source: input, description: "SELLER_T12 | BILL_AUDIT | ESTIMATE — ESTIMATE rows are excluded from trailing averages and normalization", constraints: "enum: SELLER_T12, BILL_AUDIT, ESTIMATE" }
      - { name: is_outlier, type: boolean, source: computed, description: "true when amount_cents deviates from the category trailing average by strictly more than 20% (amount > avg*1.20 or amount < avg*0.80); average excludes ESTIMATE rows and the row under test" }
      - { name: normalized_amount_cents, type: integer, source: computed, description: "amount_cents, or round_half_up(category trailing average) when is_outlier" }

  - name: TaxReassessmentProjection
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: system, description: "FK -> Acquisition.id; taken from the create path" }
      - { name: method, type: enum, source: input, description: "PURCHASE_PRICE_ANCHORED | INCOME_APPROACH", constraints: "enum: PURCHASE_PRICE_ANCHORED, INCOME_APPROACH" }
      - { name: cap_rate, type: number, source: input, description: "Capitalization rate; required when method = INCOME_APPROACH" }
      - { name: noi_t12_cents, type: integer, source: input, description: "Trailing-12 NOI computed with PRIOR-year taxes (breaks the tax<->NOI circularity); required when method = INCOME_APPROACH" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | APPROVED | SUPERSEDED — COMPUTED may return to DRAFT via revise (cycle)" }
      - { name: projected_value_cents, type: integer, source: computed, description: "Method-specific value conclusion" }
      - { name: projected_assessed_value_cents, type: integer, source: computed, description: "round_half_up(projected_value_cents * Acquisition.assessment_ratio)" }
      - { name: projected_annual_tax_cents, type: integer, source: computed, description: "round_half_up(projected_assessed_value_cents * Acquisition.millage_rate / 1000)" }
      - { name: delta_vs_prior_cents, type: integer, source: computed, description: "projected_annual_tax_cents - Acquisition.prior_year_tax_cents" }

  - name: SecurityDepositLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: lease_file_id, type: string, source: input, description: "FK -> LeaseFile.id; lease whose deposit is tracked" }
      - { name: seller_stated_amount_cents, type: integer, source: input, description: "Deposit liability per the seller's statement (including any interest the seller claims to owe)" }
      - { name: interest_required, type: boolean, source: input, description: "Whether the jurisdiction requires deposit interest" }
      - { name: annual_interest_rate, type: number, source: input, default: 0, description: "Statutory annual rate as a decimal (e.g. 0.02)" }
      - { name: verified_amount_cents, type: integer, source: computed, description: "LeaseFile.deposit_amount_cents once reconciled (or adjusted_verified_amount_cents after dispute resolution)" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued from LeaseFile.lease_start_date to Acquisition.closing_date per Acquisition.interest_accrual_method; 0 when interest_required is false" }
      - { name: variance_cents, type: integer, source: computed, description: "verified_amount_cents + accrued_interest_cents - seller_stated_amount_cents" }
      - { name: status, type: enum, source: system, description: "RECORDED | RECONCILED | DISPUTED | ESCROW_QUEUED | TRANSFERRED — DISPUTED returns to RECONCILED via resolve-dispute (cycle)" }

  - name: EmployeeDecision
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id" }
      - { name: employee_ref, type: string, source: input, description: "Staff member identifier" }
      - { name: position, type: string, source: input, description: "Role on site (e.g. LEASING_MANAGER)" }
      - { name: hire_date, type: datetime, source: input, description: "Original hire date" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Current annual salary" }
      - { name: accrued_pto_hours, type: number, source: input, description: "Accrued unused PTO hours" }
      - { name: decision, type: enum, source: input, description: "RETAIN | TERMINATE | TRANSFER", constraints: "enum: RETAIN, TERMINATE, TRANSFER" }
      - { name: notice_date, type: datetime, source: input, description: "Date notice was (or will be) delivered" }
      - { name: effective_date, type: datetime, source: input, description: "Date the decision takes effect; must satisfy effective_date - notice_date >= required_notice_days" }
      - { name: required_notice_days, type: integer, source: input, default: 14, description: "Minimum statutory/policy notice days" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposer; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver" }
      - { name: severance_cents, type: integer, source: computed, description: "Tenure-tiered severance; 0 for RETAIN" }
      - { name: pto_payout_cents, type: integer, source: computed, description: "round_half_up(accrued_pto_hours * round_half_up(annual_salary_cents / 2080)); 0 for RETAIN" }
      - { name: assumed_pto_liability_cents, type: integer, source: computed, description: "RETAIN only: round_half_up(accrued_pto_hours * round_half_up(annual_salary_cents / 2080)) — the PTO liability the buyer assumes" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | NOTIFIED | EFFECTIVE | RESCINDED" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id" }
      - { name: vendor_name, type: string, source: input, description: "Vendor name" }
      - { name: service_type, type: enum, source: input, description: "ELEVATOR | LAUNDRY | LANDSCAPING | PEST_CONTROL | SECURITY | OTHER", constraints: "enum: ELEVATOR, LAUNDRY, LANDSCAPING, PEST_CONTROL, SECURITY, OTHER" }
      - { name: monthly_cost_cents, type: integer, source: input, description: "Monthly contract cost" }
      - { name: term_end_date, type: datetime, source: input, description: "Current term end" }
      - { name: auto_renew, type: boolean, source: input, description: "Whether the contract auto-renews absent timely notice" }
      - { name: cancellation_notice_days, type: integer, source: input, description: "Notice days required before term end" }
      - { name: cancellation_penalty_cents, type: integer, source: input, description: "Penalty payable on cancellation" }
      - { name: prepaid_through_date, type: datetime, source: input, description: "Date through which the seller has prepaid the service; optional" }
      - { name: decision_deadline, type: datetime, source: computed, description: "term_end_date - cancellation_notice_days (calendar days); last day notice may be sent" }
      - { name: cancellation_effective_date, type: datetime, source: system, description: "Recorded at send-notice; mark-cancelled requires the logical clock to be at or past this date" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | UNDER_REVIEW | ASSUMED | NOTICE_SENT | CANCELLED_EFFECTIVE | RENEWED | AUTO_RENEWED | TRANSFERRED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id" }
      - { name: policy_type, type: enum, source: input, description: "PROPERTY | GENERAL_LIABILITY | UMBRELLA | FLOOD | OTHER", constraints: "enum: PROPERTY, GENERAL_LIABILITY, UMBRELLA, FLOOD, OTHER" }
      - { name: carrier_name, type: string, source: input, description: "Carrier" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annual premium" }
      - { name: expiration_date, type: datetime, source: input, description: "Policy expiration" }
      - { name: prepaid_through_date, type: datetime, source: input, description: "Date through which premium is prepaid" }
      - { name: loss_run_total_cents, type: integer, source: input, description: "Aggregate of 3-year loss runs" }
      - { name: open_claims_count, type: integer, source: input, description: "Open claims on the loss run" }
      - { name: loss_ratio, type: number, source: computed, description: "loss_run_total_cents / (annual_premium_cents * 3)" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW when loss_ratio < 0.40; ELEVATED when 0.40 <= loss_ratio < 0.80; HIGH when loss_ratio >= 0.80" }
      - { name: status, type: enum, source: system, description: "DOCUMENTED | LOSS_RUNS_REVIEWED | ASSUMED | TRANSFERRED | EXCLUDED" }

  - name: ProrationStatement
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: system, description: "FK -> Acquisition.id; taken from the create path" }
      - { name: statement_type, type: enum, source: input, description: "DRAFT_CLOSING | FINAL_CLOSING | POST_CLOSING_TRUEUP", constraints: "enum: DRAFT_CLOSING, FINAL_CLOSING, POST_CLOSING_TRUEUP" }
      - { name: day_count_method, type: enum, source: input, description: "ACTUAL_365 | BANKERS_30_360 — selects the proration variant", constraints: "enum: ACTUAL_365, BANKERS_30_360" }
      - { name: status, type: enum, source: system, description: "DRAFT | REVIEWED | APPROVED | SETTLED | SUPERSEDED — REVIEWED may return to DRAFT via send-back (cycle)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the generating user" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer; must differ from created_by_user_id" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver; must differ from both created_by_user_id and reviewed_by_user_id" }
      - { name: total_buyer_credits_cents, type: integer, source: computed, description: "Sum of amount_cents over lines with direction CREDIT_BUYER" }
      - { name: total_seller_credits_cents, type: integer, source: computed, description: "Sum of amount_cents over lines with direction CREDIT_SELLER" }
      - { name: net_amount_cents, type: integer, source: computed, description: "total_buyer_credits_cents - total_seller_credits_cents; negative = net due to seller" }

  - name: ProrationLine
    parent: null
    common_fields: false
    fields:
      - { name: statement_id, type: string, source: system, description: "FK -> ProrationStatement.id; owning statement" }
      - { name: line_type, type: enum, source: system, description: "RENT | TAX | PREPAID_EXPENSE | DEPOSIT_TRANSFER | PAYROLL | ADJUSTMENT", constraints: "enum: RENT, TAX, PREPAID_EXPENSE, DEPOSIT_TRANSFER, PAYROLL, ADJUSTMENT" }
      - { name: direction, type: enum, source: system, description: "CREDIT_BUYER | CREDIT_SELLER", constraints: "enum: CREDIT_BUYER, CREDIT_SELLER" }
      - { name: amount_cents, type: integer, source: computed, description: "GENERATED lines: computed at generation; MANUAL lines: taken from the request" }
      - { name: source_kind, type: enum, source: system, description: "GENERATED | MANUAL", constraints: "enum: GENERATED, MANUAL" }
      - { name: source_ref_type, type: enum, source: system, description: "Polymorphic source: LEASE_FILE | TAX_PROJECTION | SERVICE_CONTRACT | INSURANCE_POLICY | DEPOSIT_ENTRY | EMPLOYEE_DECISION | ADJUSTMENT | null", constraints: "enum: LEASE_FILE, TAX_PROJECTION, SERVICE_CONTRACT, INSURANCE_POLICY, DEPOSIT_ENTRY, EMPLOYEE_DECISION, ADJUSTMENT" }
      - { name: source_ref_id, type: string, source: system, description: "Id of the source entity; null for aggregate lines" }
      - { name: memo, type: string, source: input, description: "Free-text memo on manual lines" }

  - name: PostClosingAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: acquisition_id, type: string, source: input, description: "FK -> Acquisition.id" }
      - { name: adjustment_type, type: enum, source: input, description: "COLLECTION_LOSS | TAX_RECALC | DEPOSIT_SHORTFALL | EXPENSE_RECON", constraints: "enum: COLLECTION_LOSS, TAX_RECALC, DEPOSIT_SHORTFALL, EXPENSE_RECON" }
      - { name: amount_cents, type: integer, source: input, description: "Asserted amount" }
      - { name: direction, type: enum, source: input, description: "CREDIT_BUYER | CREDIT_SELLER", constraints: "enum: CREDIT_BUYER, CREDIT_SELLER" }
      - { name: evidence_note, type: string, source: input, description: "Evidence summary recorded at the evidence step" }
      - { name: pre_closing_arrears_cents, type: integer, source: input, description: "COLLECTION_LOSS only: tenant arrears existing at closing" }
      - { name: collections_applied_cents, type: integer, source: input, description: "COLLECTION_LOSS only: post-closing collections applied to pre-closing arrears (oldest arrears first)" }
      - { name: resolved_amount_cents, type: integer, source: system, description: "Amount agreed at resolve; the RESOLVED branch posts this amount instead of amount_cents" }
      - { name: asserted_date, type: datetime, source: system, description: "Logical-clock date the adjustment was asserted" }
      - { name: status, type: enum, source: system, description: "ASSERTED | EVIDENCED | ACCEPTED | DISPUTED | RESOLVED | APPLIED — fork at EVIDENCED joins at APPLIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Acquisition
    initial_state: DRAFT
    terminal_states: [SETTLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: IN_DILIGENCE
        trigger: "POST /acquisitions/{id}/kickoff"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["readiness_posture recomputed"]
      - from: IN_DILIGENCE
        to: DILIGENCE_COMPLETE
        trigger: "POST /acquisitions/{id}/complete-diligence"
        actor: UnderwritingManager
        preconditions:
          - "readiness_posture != BLOCKED (ERR_ACQUISITION_BLOCKED)"
          - "No LeaseFile for a non-EXCLUDED unit in status UPLOADED or DISCREPANCY_FLAGGED (ERR_UNRESOLVED_AUDIT_ITEMS)"
          - "No SecurityDepositLedgerEntry in status RECORDED or DISPUTED (ERR_UNRESOLVED_AUDIT_ITEMS)"
          - "Every non-EXCLUDED Unit has status VERIFIED (ERR_UNRESOLVED_AUDIT_ITEMS)"
        side_effects: []
      - from: DILIGENCE_COMPLETE
        to: PRE_CLOSING
        trigger: "POST /acquisitions/{id}/advance-to-pre-closing"
        actor: UnderwritingManager
        preconditions:
          - "A ProrationStatement with statement_type DRAFT_CLOSING and status APPROVED exists (ERR_NO_APPROVED_DRAFT_STATEMENT)"
        side_effects: []
      - from: PRE_CLOSING
        to: CLOSED
        trigger: "POST /acquisitions/{id}/execute-closing"
        actor: UnderwritingManager
        preconditions:
          - "A ProrationStatement with statement_type FINAL_CLOSING and status APPROVED exists (ERR_NO_APPROVED_FINAL_STATEMENT)"
          - "Every SecurityDepositLedgerEntry has status ESCROW_QUEUED or TRANSFERRED (ERR_DEPOSITS_NOT_QUEUED)"
          - "No EmployeeDecision in status PROPOSED (ERR_OPEN_DECISIONS_REMAIN)"
          - "No ServiceContract in status IDENTIFIED or UNDER_REVIEW (ERR_OPEN_SERVICE_CONTRACTS_REMAIN)"
        side_effects:
          - "closing_executed_at := logical clock"
          - "CASCADE hop 1: every SecurityDepositLedgerEntry in ESCROW_QUEUED -> TRANSFERRED"
          - "CASCADE hop 2 (caused by hop 1): each newly TRANSFERRED entry regenerates the DEPOSIT_TRANSFER GENERATED line on the FINAL_CLOSING statement with amount = sum of verified_amount_cents + accrued_interest_cents over TRANSFERRED entries"
          - "CASCADE hop 3 (caused by hop 2): the FINAL_CLOSING statement's total_buyer_credits_cents / total_seller_credits_cents / net_amount_cents recompute, and Acquisition.net_proration_cents re-derives from the statement"
          - "CASCADE hop 1 (parallel branch): every ServiceContract in ASSUMED -> TRANSFERRED; every InsurancePolicy in ASSUMED -> TRANSFERRED"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /acquisitions/{id}/settle"
        actor: EscrowOfficer
        preconditions:
          - "Logical clock > closing_executed_at + true_up_window_days (ERR_TRUE_UP_WINDOW_OPEN)"
          - "FINAL_CLOSING statement has status SETTLED (ERR_FINAL_STATEMENT_NOT_SETTLED)"
          - "If any POST_CLOSING_TRUEUP statement exists, it has status SETTLED (ERR_TRUEUP_STATEMENT_NOT_SETTLED)"
          - "No PostClosingAdjustment in a non-terminal status {ASSERTED, EVIDENCED, ACCEPTED, DISPUTED, RESOLVED} (ERR_OPEN_ADJUSTMENTS_REMAIN)"
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /acquisitions/{id}/terminate"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Every EmployeeDecision in APPROVED or NOTIFIED -> RESCINDED (compensation: payroll_accrual_cents contribution removed)"]
      - from: IN_DILIGENCE
        to: TERMINATED
        trigger: "POST /acquisitions/{id}/terminate"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Every EmployeeDecision in APPROVED or NOTIFIED -> RESCINDED"]
      - from: DILIGENCE_COMPLETE
        to: TERMINATED
        trigger: "POST /acquisitions/{id}/terminate"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Every EmployeeDecision in APPROVED or NOTIFIED -> RESCINDED"]
      - from: PRE_CLOSING
        to: TERMINATED
        trigger: "POST /acquisitions/{id}/terminate"
        actor: UnderwritingManager
        preconditions: []
        side_effects:
          - "Every EmployeeDecision in APPROVED or NOTIFIED -> RESCINDED"
          - "Every ServiceContract in ASSUMED or NOTICE_SENT -> CANCELLED_EFFECTIVE (deal-off unwind)"

  - entity: Unit
    initial_state: REGISTERED
    terminal_states: [EXCLUDED]
    transitions:
      - from: REGISTERED
        to: CLEARING
        trigger: "system (first of: lease audited, inspection QA_ACCEPTED, deposit reconciled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARING
        to: VERIFIED
        trigger: "system (lease_audited AND walk_accepted AND deposit_reconciled all true)"
        actor: system
        preconditions: []
        side_effects: ["Acquisition readiness_posture recomputed"]
      - from: VERIFIED
        to: CLEARING
        trigger: "system (any of the three readiness flags flips false, e.g. lease re-flagged)"
        actor: system
        preconditions: []
        side_effects: ["Acquisition readiness_posture recomputed"]
      - from: REGISTERED
        to: EXCLUDED
        trigger: "POST /acquisitions/units/{id}/exclude"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects: ["Unit removed from audit scope, proration RENT input set, and posture derivation"]
      - from: CLEARING
        to: EXCLUDED
        trigger: "POST /acquisitions/units/{id}/exclude"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects: ["Same as REGISTERED -> EXCLUDED"]

  - entity: LeaseFile
    initial_state: UPLOADED
    terminal_states: [SUPERSEDED, WAIVED]
    transitions:
      - from: UPLOADED
        to: AUDITED
        trigger: "POST /acquisitions/lease-files/{id}/audit"
        actor: AcquisitionsAnalyst
        preconditions:
          - "A RentRollEntry exists for the lease's unit (ERR_RENT_ROLL_ENTRY_MISSING)"
          - "abs(variance_cents) < RENT_VARIANCE_THRESHOLD_CENTS"
        side_effects:
          - "RentRollEntry.verification_status := VERIFIED"
          - "audit_result := MATCH"
          - "Unit.lease_audited recomputed (may drive Unit -> CLEARING/VERIFIED)"
          - "Acquisition.rent_roll_variance_cents recomputed"
      - from: UPLOADED
        to: DISCREPANCY_FLAGGED
        trigger: "POST /acquisitions/lease-files/{id}/audit"
        actor: AcquisitionsAnalyst
        preconditions:
          - "A RentRollEntry exists for the lease's unit (ERR_RENT_ROLL_ENTRY_MISSING)"
          - "abs(variance_cents) >= RENT_VARIANCE_THRESHOLD_CENTS"
        side_effects:
          - "RentRollEntry.verification_status := MISMATCHED"
          - "audit_result := OVERSTATED when reported_rent_cents > contract_rent_cents else UNDERSTATED"
          - "Acquisition.rent_roll_variance_cents recomputed; readiness_posture recomputed (BLOCKED while any DISCREPANCY_FLAGGED lease exists)"
      - from: AUDITED
        to: DISCREPANCY_FLAGGED
        trigger: "POST /acquisitions/lease-files/{id}/flag"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects:
          - "CASCADE hop 1: RentRollEntry.verification_status := MISMATCHED"
          - "CASCADE hop 2 (caused by hop 1): Unit.lease_audited := false; if Unit was VERIFIED it demotes to CLEARING"
          - "CASCADE hop 3 (caused by hop 2): Acquisition.readiness_posture recomputed"
      - from: RESOLVED
        to: DISCREPANCY_FLAGGED
        trigger: "POST /acquisitions/lease-files/{id}/flag"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects: ["Same cascade as AUDITED -> DISCREPANCY_FLAGGED (revision loop)"]
      - from: DISCREPANCY_FLAGGED
        to: RESOLVED
        trigger: "POST /acquisitions/lease-files/{id}/resolve"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects:
          - "If corrected_contract_rent_cents supplied: contract_rent_cents updated, variance_cents recomputed"
          - "RentRollEntry.verification_status := VERIFIED"
          - "Unit.lease_audited recomputed (may drive Unit CLEARING -> VERIFIED)"
          - "Acquisition.rent_roll_variance_cents recomputed; readiness_posture recomputed"
      - from: DISCREPANCY_FLAGGED
        to: WAIVED
        trigger: "POST /acquisitions/lease-files/{id}/waive"
        actor: UnderwritingManager
        preconditions: []
        side_effects:
          - "waived_variance_cents := variance_cents"
          - "Unit.lease_audited recomputed"
          - "Acquisition.rent_roll_variance_cents recomputed (WAIVED leases leave the open-variance sum); readiness_posture recomputed"
      - from: UPLOADED
        to: SUPERSEDED
        trigger: "system (a new LeaseFile uploaded with supersedes_lease_id = this lease)"
        actor: system
        preconditions: []
        side_effects: ["Unit.lease_audited recomputed"]
      - from: AUDITED
        to: SUPERSEDED
        trigger: "system (supersede)"
        actor: system
        preconditions: []
        side_effects: ["Unit.lease_audited recomputed"]
      - from: DISCREPANCY_FLAGGED
        to: SUPERSEDED
        trigger: "system (supersede)"
        actor: system
        preconditions: []
        side_effects: ["Unit.lease_audited recomputed; Acquisition.rent_roll_variance_cents recomputed; readiness_posture recomputed"]
      - from: RESOLVED
        to: SUPERSEDED
        trigger: "system (supersede)"
        actor: system
        preconditions: []
        side_effects: ["Unit.lease_audited recomputed"]

  - entity: Concession
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /acquisitions/concessions/{id}/verify"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects:
          - "verified_value_cents := request value"
          - "LeaseFile.net_effective_rent_cents recomputed"
          - "Acquisition.readiness_posture recomputed (PENDING concessions keep posture AT_RISK)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /acquisitions/concessions/{id}/reject"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects: ["LeaseFile.net_effective_rent_cents recomputed; readiness_posture recomputed"]

  - entity: UnitWalkInspection
    initial_state: SCHEDULED
    terminal_states: [QA_ACCEPTED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /acquisitions/inspections/{id}/complete"
        actor: PropertyOperationsLead
        preconditions: []
        side_effects: ["completed_by_user_id := X-User-ID of caller"]
      - from: COMPLETED
        to: QA_ACCEPTED
        trigger: "POST /acquisitions/inspections/{id}/qa-accept"
        actor: PropertyOperationsLead
        preconditions:
          - "Caller X-User-ID != completed_by_user_id (ERR_SOD_VIOLATION)"
          - "If no_findings_declared is false, at least one DeficiencyFinding exists for the inspection (ERR_FINDINGS_REQUIRED)"
        side_effects:
          - "CASCADE hop 1: every DeficiencyFinding of this inspection in OPEN -> VERIFIED"
          - "CASCADE hop 2 (caused by hop 1): Acquisition.deferred_maintenance_total_cents recomputed"
          - "CASCADE hop 3 (caused by hop 2): Acquisition.readiness_posture recomputed (may flip ON_TRACK -> AT_RISK -> BLOCKED at the 3% / 5% thresholds)"
          - "Unit.walk_accepted recomputed (may drive Unit -> VERIFIED)"
      - from: COMPLETED
        to: QA_REJECTED
        trigger: "POST /acquisitions/inspections/{id}/qa-reject"
        actor: PropertyOperationsLead
        preconditions:
          - "Caller X-User-ID != completed_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["Acquisition.readiness_posture recomputed (any QA_REJECTED inspection forces at least AT_RISK)"]
      - from: QA_REJECTED
        to: SCHEDULED
        trigger: "POST /acquisitions/inspections/{id}/reschedule"
        actor: PropertyOperationsLead
        preconditions: []
        side_effects:
          - "reschedule_count += 1; condition_rating and no_findings_declared cleared"
          - "Acquisition.readiness_posture recomputed"

  - entity: DeficiencyFinding
    initial_state: OPEN
    terminal_states: [EXCLUDED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /acquisitions/findings/{id}/verify OR system (QA accept of parent inspection)"
        actor: PropertyOperationsLead | system
        preconditions: []
        side_effects:
          - "verified_cost_cents computed per Acquisition.maintenance_estimate_basis"
          - "Acquisition.deferred_maintenance_total_cents recomputed; readiness_posture recomputed"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /acquisitions/findings/{id}/dispute"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Finding leaves the rollup: Acquisition.deferred_maintenance_total_cents recomputed; readiness_posture recomputed"]
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /acquisitions/findings/{id}/verify"
        actor: PropertyOperationsLead
        preconditions: []
        side_effects: ["Finding re-enters the rollup: Acquisition.deferred_maintenance_total_cents recomputed; readiness_posture recomputed"]
      - from: OPEN
        to: EXCLUDED
        trigger: "POST /acquisitions/findings/{id}/exclude"
        actor: PropertyOperationsLead
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: EXCLUDED
        trigger: "POST /acquisitions/findings/{id}/exclude"
        actor: PropertyOperationsLead
        preconditions: []
        side_effects: []

  - entity: TaxReassessmentProjection
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /acquisitions/tax-projections/{id}/compute"
        actor: AcquisitionsAnalyst
        preconditions: []
        side_effects: ["projected_value_cents / projected_assessed_value_cents / projected_annual_tax_cents / delta_vs_prior_cents computed"]
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /acquisitions/tax-projections/{id}/approve"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Any other projection of the same acquisition in APPROVED -> SUPERSEDED"]
      - from: COMPUTED
        to: DRAFT
        trigger: "POST /acquisitions/tax-projections/{id}/revise"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Computed fields cleared"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a new projection created under the same acquisition, or another projection approved)"
        actor: system
        preconditions: []
        side_effects: ["ProrationStatements referencing this projection drift (TAX line no longer matches the currently APPROVED projection)"]

  - entity: SecurityDepositLedgerEntry
    initial_state: RECORDED
    terminal_states: [TRANSFERRED]
    transitions:
      - from: RECORDED
        to: RECONCILED
        trigger: "POST /acquisitions/deposits/{id}/reconcile"
        actor: AcquisitionsAnalyst
        preconditions:
          - "LeaseFile status in {AUDITED, RESOLVED, WAIVED} (ERR_LEASE_NOT_AUDITED)"
          - "variance_cents == 0"
        side_effects: ["Unit.deposit_reconciled recomputed; Acquisition.deposit_variance_cents and readiness_posture recomputed"]
      - from: RECORDED
        to: DISPUTED
        trigger: "POST /acquisitions/deposits/{id}/reconcile"
        actor: AcquisitionsAnalyst
        preconditions:
          - "LeaseFile status in {AUDITED, RESOLVED, WAIVED} (ERR_LEASE_NOT_AUDITED)"
          - "variance_cents != 0"
        side_effects: ["Acquisition.deposit_variance_cents recomputed; readiness_posture := BLOCKED while any DISPUTED entry exists"]
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /acquisitions/deposits/{id}/resolve-dispute"
        actor: AcquisitionsAnalyst
        preconditions:
          - "After applying adjusted_verified_amount_cents, recomputed variance_cents == 0 (ERR_DEPOSIT_VARIANCE_UNRESOLVED)"
        side_effects: ["verified_amount_cents := adjusted_verified_amount_cents; Unit.deposit_reconciled recomputed; Acquisition.deposit_variance_cents and readiness_posture recomputed"]
      - from: RECONCILED
        to: ESCROW_QUEUED
        trigger: "POST /acquisitions/deposits/{id}/queue-escrow"
        actor: EscrowOfficer
        preconditions:
          - "Acquisition status == PRE_CLOSING (ERR_ACQUISITION_NOT_PRE_CLOSING)"
        side_effects: []
      - from: ESCROW_QUEUED
        to: TRANSFERRED
        trigger: "system (execute-closing cascade)"
        actor: system
        preconditions: []
        side_effects: ["Regenerates the DEPOSIT_TRANSFER GENERATED line on the FINAL_CLOSING statement"]

  - entity: EmployeeDecision
    initial_state: PROPOSED
    terminal_states: [REJECTED, RESCINDED, EFFECTIVE]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /acquisitions/employee-decisions/{id}/approve"
        actor: UnderwritingManager
        preconditions:
          - "Acquisition status == IN_DILIGENCE (ERR_ACQUISITION_NOT_IN_DILIGENCE)"
          - "Caller X-User-ID != proposed_by_user_id (ERR_SOD_VIOLATION)"
          - "effective_date - notice_date >= required_notice_days (ERR_NOTICE_PERIOD_INSUFFICIENT)"
        side_effects:
          - "severance_cents / pto_payout_cents / assumed_pto_liability_cents computed"
          - "Acquisition.payroll_accrual_cents recomputed (TERMINATE/TRANSFER add severance + pto_payout)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /acquisitions/employee-decisions/{id}/reject"
        actor: UnderwritingManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: NOTIFIED
        trigger: "POST /acquisitions/employee-decisions/{id}/notify"
        actor: HRPartner
        preconditions: []
        side_effects: []
      - from: NOTIFIED
        to: EFFECTIVE
        trigger: "POST /acquisitions/employee-decisions/{id}/mark-effective"
        actor: HRPartner
        preconditions:
          - "Logical clock >= effective_date (ERR_NOT_YET_EFFECTIVE)"
        side_effects: ["Acquisition.payroll_accrual_cents recomputed (decision leaves the APPROVED/NOTIFIED accrual set)"]
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /acquisitions/employee-decisions/{id}/rescind OR system (acquisition terminate)"
        actor: HRPartner | system
        preconditions: []
        side_effects: ["Compensation: Acquisition.payroll_accrual_cents contribution removed (returns to pre-approval value)"]
      - from: NOTIFIED
        to: RESCINDED
        trigger: "POST /acquisitions/employee-decisions/{id}/rescind OR system (acquisition terminate)"
        actor: HRPartner | system
        preconditions: []
        side_effects: ["Compensation: payroll accrual removed; severance_cents/pto_payout_cents retained on the record for audit but excluded from accrual"]

  - entity: ServiceContract
    initial_state: IDENTIFIED
    terminal_states: [TRANSFERRED, CANCELLED_EFFECTIVE, RENEWED, AUTO_RENEWED]
    transitions:
      - from: IDENTIFIED
        to: UNDER_REVIEW
        trigger: "POST /acquisitions/service-contracts/{id}/begin-review"
        actor: VendorManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ASSUMED
        trigger: "POST /acquisitions/service-contracts/{id}/assume"
        actor: VendorManager
        preconditions: []
        side_effects: ["Contract enters the PREPAID_EXPENSE proration input set when prepaid_through_date > Acquisition.closing_date"]
      - from: UNDER_REVIEW
        to: NOTICE_SENT
        trigger: "POST /acquisitions/service-contracts/{id}/send-notice"
        actor: VendorManager
        preconditions:
          - "Logical clock <= decision_deadline (ERR_NOTICE_WINDOW_MISSED)"
          - "Acquisition status in {IN_DILIGENCE, DILIGENCE_COMPLETE, PRE_CLOSING} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["cancellation_effective_date := request value"]
      - from: UNDER_REVIEW
        to: RENEWED
        trigger: "POST /acquisitions/service-contracts/{id}/renew"
        actor: VendorManager
        preconditions: []
        side_effects: []
      - from: NOTICE_SENT
        to: CANCELLED_EFFECTIVE
        trigger: "POST /acquisitions/service-contracts/{id}/mark-cancelled"
        actor: VendorManager
        preconditions:
          - "Logical clock >= cancellation_effective_date (ERR_CANCELLATION_NOT_YET_EFFECTIVE)"
        side_effects: []
      - from: IDENTIFIED
        to: AUTO_RENEWED
        trigger: "system (POST /_clock/set_current_utc sweep: auto_renew == true and new clock > decision_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: AUTO_RENEWED
        trigger: "system (clock sweep, same rule)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSUMED
        to: TRANSFERRED
        trigger: "system (execute-closing cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsurancePolicy
    initial_state: DOCUMENTED
    terminal_states: [TRANSFERRED, EXCLUDED]
    transitions:
      - from: DOCUMENTED
        to: LOSS_RUNS_REVIEWED
        trigger: "POST /acquisitions/insurance-policies/{id}/review-loss-runs"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["loss_ratio and risk_tier computed"]
      - from: LOSS_RUNS_REVIEWED
        to: ASSUMED
        trigger: "POST /acquisitions/insurance-policies/{id}/assume"
        actor: UnderwritingManager
        preconditions:
          - "risk_tier != HIGH unless override_high_risk == true (ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE)"
        side_effects: ["Policy enters the PREPAID_EXPENSE proration input set"]
      - from: DOCUMENTED
        to: EXCLUDED
        trigger: "POST /acquisitions/insurance-policies/{id}/exclude"
        actor: UnderwritingManager
        preconditions: []
        side_effects: []
      - from: LOSS_RUNS_REVIEWED
        to: EXCLUDED
        trigger: "POST /acquisitions/insurance-policies/{id}/exclude"
        actor: UnderwritingManager
        preconditions: []
        side_effects: []
      - from: ASSUMED
        to: TRANSFERRED
        trigger: "system (execute-closing cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProrationStatement
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: REVIEWED
        trigger: "POST /acquisitions/proration-statements/{id}/submit-review"
        actor: UnderwritingManager
        preconditions:
          - "Caller X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["reviewed_by_user_id := caller"]
      - from: REVIEWED
        to: DRAFT
        trigger: "POST /acquisitions/proration-statements/{id}/send-back"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["reviewed_by_user_id cleared (revision loop)"]
      - from: REVIEWED
        to: APPROVED
        trigger: "POST /acquisitions/proration-statements/{id}/approve"
        actor: UnderwritingManager
        preconditions:
          - "Caller X-User-ID != created_by_user_id and != reviewed_by_user_id (ERR_SOD_VIOLATION)"
          - "Snapshot drift check: every GENERATED line recomputed from live data must equal its stored amount_cents (ERR_STATEMENT_DRIFT)"
          - "An APPROVED TaxReassessmentProjection exists for the acquisition (ERR_TAX_PROJECTION_NOT_APPROVED)"
        side_effects: ["Acquisition.net_proration_cents re-derives from this statement"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /acquisitions/proration-statements/{id}/settle"
        actor: EscrowOfficer
        preconditions:
          - "statement_type in {FINAL_CLOSING, POST_CLOSING_TRUEUP} (ERR_STATEMENT_NOT_SETTLABLE)"
          - "Acquisition status == CLOSED (ERR_ACQUISITION_NOT_CLOSED)"
        side_effects: ["Acquisition.net_proration_cents finalized"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a new statement of the next type generated: FINAL_CLOSING supersedes APPROVED DRAFT_CLOSING)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PostClosingAdjustment
    initial_state: ASSERTED
    terminal_states: [APPLIED]
    transitions:
      - from: ASSERTED
        to: EVIDENCED
        trigger: "POST /acquisitions/adjustments/{id}/evidence"
        actor: AcquisitionsAnalyst
        preconditions:
          - "COLLECTION_LOSS only: amount_cents <= min(pre_closing_arrears_cents, collections_applied_cents) (ERR_ADJUSTMENT_EXCEEDS_CLAIMABLE)"
        side_effects: ["If the request supplies amount_cents, it replaces the asserted amount BEFORE the cap check"]
      - from: EVIDENCED
        to: ACCEPTED
        trigger: "POST /acquisitions/adjustments/{id}/accept"
        actor: UnderwritingManager
        preconditions: []
        side_effects: []
      - from: EVIDENCED
        to: DISPUTED
        trigger: "POST /acquisitions/adjustments/{id}/dispute"
        actor: UnderwritingManager
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /acquisitions/adjustments/{id}/resolve"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["resolved_amount_cents := request value"]
      - from: ACCEPTED
        to: APPLIED
        trigger: "POST /acquisitions/adjustments/{id}/apply"
        actor: UnderwritingManager
        preconditions: []
        side_effects:
          - "If no POST_CLOSING_TRUEUP statement in DRAFT exists for the acquisition, one is created (day_count_method copied from the FINAL_CLOSING statement)"
          - "An ADJUSTMENT line (source_ref_type ADJUSTMENT) with amount_cents := this adjustment's amount_cents is appended to that statement and its totals recompute"
      - from: RESOLVED
        to: APPLIED
        trigger: "POST /acquisitions/adjustments/{id}/apply"
        actor: UnderwritingManager
        preconditions: []
        side_effects: ["Same as ACCEPTED -> APPLIED but the posted line uses resolved_amount_cents (divergent branch amount)"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: tax-projection-create-stale-acquisition
    parent_entity: Acquisition
    write_endpoint: "POST /acquisitions/{id}/tax-projections"
    occ_field: expected_acquisition_version
    description: |
      Creating a TaxReassessmentProjection against an Acquisition whose version
      has advanced since the client last read it is rejected. The create
      legitimately supersedes the currently APPROVED projection, so a second
      create issued with a stale acquisition version would silently supersede
      a projection the caller never saw; the stale-version OCC check rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: proration-statement-generate-stale-acquisition
    parent_entity: Acquisition
    write_endpoint: "POST /acquisitions/{id}/proration-statements"
    occ_field: expected_acquisition_version
    description: |
      Generating a ProrationStatement supersedes the APPROVED statement of the
      preceding type and mutates Acquisition fields, so a generate issued with
      an expected_acquisition_version older than the current Acquisition.version
      is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: statement-line-add-stale-statement
    parent_entity: ProrationStatement
    write_endpoint: "POST /acquisitions/proration-statements/{id}/lines"
    occ_field: expected_statement_version
    description: |
      Appending a manual ProrationLine recomputes the statement totals and bumps
      ProrationStatement.version; a caller whose expected_statement_version does
      not match the current version is working from stale totals and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
# Global precision: all money is integer cents; every intermediate division or
# multiplication that yields a fraction is rounded round_half_up to integer
# cents AT THE STEP WHERE IT APPEARS, in the order the steps are written.
calculations:
  - name: rent_roll_variance
    trigger: "LeaseFile audit, resolve, waive; RentRollEntry creation"
    algorithm: threshold
    formula: |
      variance_cents = RentRollEntry.reported_rent_cents - LeaseFile.contract_rent_cents
      if abs(variance_cents) >= RENT_VARIANCE_THRESHOLD_CENTS: audit lands DISCREPANCY_FLAGGED, entry MISMATCHED
      else: audit lands AUDITED, entry VERIFIED
      Acquisition.rent_roll_variance_cents = SUM over LeaseFile rows with status == DISCREPANCY_FLAGGED
        whose unit status != EXCLUDED of (reported_rent_cents - contract_rent_cents)
    input_set: "LeaseFile rows of the acquisition with status DISCREPANCY_FLAGGED (open exposure only); RESOLVED/WAIVED/AUDITED contribute 0"
    constants:
      RENT_VARIANCE_THRESHOLD_CENTS: 500
    precision: "integer cents"

  - name: net_effective_rent
    trigger: "Concession verify/reject; LeaseFile create/resolve"
    algorithm: aggregation
    formula: |
      verified_concessions_total = SUM of verified_value_cents over Concession rows
        of the lease with verification_status == VERIFIED
      net_effective_rent_cents = round_half_up((contract_rent_cents * term_months - verified_concessions_total) / term_months)
    input_set: "Concession rows of the lease with verification_status VERIFIED only; PENDING and REJECTED excluded"
    precision: "integer cents, round_half_up at the final division"

  - name: deferred_maintenance_rollup
    trigger: "DeficiencyFinding verify/dispute/exclude; QA accept cascade; PATCH Acquisition.maintenance_estimate_basis"
    algorithm: tiered_pricing
    formula: |
      severity_multiplier: severity in {1,2} -> 1.00; 3 -> 1.15; 4 -> 1.25; 5 -> 1.40
      category_loading: LIFE_SAFETY -> +15000; CODE_COMPLIANCE -> +5000; MAJOR_SYSTEMS -> +0; COSMETIC -> +0
      base = inspector_estimate_cents when Acquisition.maintenance_estimate_basis == INSPECTOR_BASIS
             else seller_estimate_cents
      verified_cost_cents = round_half_up(base * severity_multiplier) + category_loading
      Acquisition.deferred_maintenance_total_cents = SUM of verified_cost_cents
        over DeficiencyFinding rows with status == VERIFIED whose unit status != EXCLUDED
    input_set: "DeficiencyFinding rows with status VERIFIED only (OPEN, DISPUTED, EXCLUDED excluded); units with status EXCLUDED excluded"
    variants:
      - name: INSPECTOR_BASIS
        when: "Acquisition.maintenance_estimate_basis == INSPECTOR_BASIS (default)"
        difference: "base = inspector_estimate_cents"
      - name: SELLER_BASIS
        when: "Acquisition.maintenance_estimate_basis == SELLER_BASIS"
        difference: "base = seller_estimate_cents; switching basis re-derives every verified_cost_cents and the rollup"
    precision: "integer cents; severity multiply rounded round_half_up BEFORE the flat category loading is added"

  - name: tax_reassessment_projection
    trigger: "POST /acquisitions/tax-projections/{id}/compute"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned one-pass to break the tax<->NOI circularity:
      (1) value conclusion uses ONLY the inputs below (prior-year tax is already
          inside noi_t12_cents for INCOME_APPROACH — the projected tax computed
          here MUST NOT feed back into NOI);
      (2) assessed value; (3) projected tax.
      PURCHASE_PRICE_ANCHORED:
        projected_value_cents = Acquisition.agreed_purchase_price_cents
      INCOME_APPROACH:
        projected_value_cents = round_half_up(noi_t12_cents / cap_rate)
      projected_assessed_value_cents = round_half_up(projected_value_cents * Acquisition.assessment_ratio)
      projected_annual_tax_cents = round_half_up(projected_assessed_value_cents * Acquisition.millage_rate / 1000)
      delta_vs_prior_cents = projected_annual_tax_cents - Acquisition.prior_year_tax_cents
    input_set: "The projection's own method/cap_rate/noi_t12_cents; Acquisition price/ratio/millage/prior_year_tax"
    variants:
      - name: PURCHASE_PRICE_ANCHORED
        when: "method == PURCHASE_PRICE_ANCHORED"
        difference: "value anchored to the contract purchase price"
      - name: INCOME_APPROACH
        when: "method == INCOME_APPROACH"
        difference: "value = NOI / cap_rate; produces a different value and tax for identical acquisition data"
    precision: "integer cents, round_half_up at each labelled step"

  - name: closing_proration
    trigger: "POST /acquisitions/{id}/proration-statements (GENERATED lines)"
    algorithm: projection
    formula: |
      Rounding order is pinned: (1) round each daily rate to cents; (2) multiply
      by whole days (exact); (3) statement totals = exact integer sums of the
      per-line rounded amounts. Sum-then-round is FORBIDDEN.
      Day attribution: the seller is responsible through the day BEFORE
      closing_date; the buyer owns the closing day.
      seller_days = calendar_days(period_start .. closing_date - 1)
      buyer_days  = calendar_days(closing_date .. period_end)   [closing day included]
      RENT lines (one per non-EXCLUDED unit whose current LeaseFile status is in
      {AUDITED, RESOLVED, WAIVED}), direction CREDIT_BUYER:
        ACTUAL_365:     daily = round_half_up(contract_rent_cents * 12 / 365); buyer_days as above
        BANKERS_30_360: daily = round_half_up(contract_rent_cents / 30);
                        period treated as a 30-day month: seller_days = closing_day_of_month - 1,
                        buyer_days = 30 - closing_day_of_month + 1
        line amount = daily * buyer_days
      TAX line (single, CREDIT_BUYER): requires an APPROVED TaxReassessmentProjection:
        amount = round_half_up(projected_annual_tax_cents * seller_days_ytd / 365)
        seller_days_ytd = calendar_days(Jan 1 of closing year .. closing_date - 1)
      PREPAID_EXPENSE lines (CREDIT_SELLER):
        per ASSUMED ServiceContract with prepaid_through_date > closing_date:
          daily = round_half_up(monthly_cost_cents * 12 / 365); days = calendar_days(closing_date+1 .. prepaid_through_date)
        per ASSUMED InsurancePolicy with prepaid_through_date > closing_date:
          daily = round_half_up(annual_premium_cents / 365);      days = calendar_days(closing_date+1 .. prepaid_through_date)
      DEPOSIT_TRANSFER line (single, CREDIT_BUYER):
        amount = SUM over SecurityDepositLedgerEntry status in {ESCROW_QUEUED, TRANSFERRED}
                 of (verified_amount_cents + accrued_interest_cents)
      PAYROLL line (single, CREDIT_BUYER):
        amount = SUM of assumed_pto_liability_cents over EmployeeDecision rows with
                 decision == RETAIN and status in {APPROVED, NOTIFIED, EFFECTIVE}
      Line emission order (deterministic): RENT lines first (unit unit_number ASC,
      tie-break LeaseFile.created_at ASC), then TAX, then PREPAID_EXPENSE lines
      (source entity created_at ASC), then DEPOSIT_TRANSFER, then PAYROLL.
      A line whose input set is empty is OMITTED (no zero-amount lines).
    input_set: "status-filtered sets pinned per line type above; statement generation snapshots them"
    variants:
      - name: ACTUAL_365
        when: "day_count_method == ACTUAL_365"
        difference: "daily rate = monthly * 12 / 365; real calendar days"
      - name: BANKERS_30_360
        when: "day_count_method == BANKERS_30_360"
        difference: "daily rate = monthly / 30; 30-day-month day counts; different amounts for identical inputs"
    precision: "integer cents; round_half_up at each labelled rounding step, in the written order"

  - name: deposit_interest_accrual
    trigger: "SecurityDepositLedgerEntry reconcile / resolve-dispute"
    algorithm: forward_looking
    formula: |
      Accrual window: LeaseFile.lease_start_date .. Acquisition.closing_date.
      days = calendar_days(lease_start_date .. closing_date)   [closing date exclusive of start]
      if interest_required == false: accrued_interest_cents = 0
      DAILY_ACCRUAL:  accrued = round_half_up(verified_amount_cents * annual_interest_rate * days / 365)
      SIMPLE_ANNUAL:  whole_years = floor(days / 365);
                      accrued = round_half_up(verified_amount_cents * annual_interest_rate * whole_years)
      verified_amount_cents = LeaseFile.deposit_amount_cents (or adjusted value after dispute resolution)
      variance_cents = verified_amount_cents + accrued_interest_cents - seller_stated_amount_cents
    input_set: "The deposit entry, its lease, and the acquisition's closing_date and interest_accrual_method"
    variants:
      - name: DAILY_ACCRUAL
        when: "Acquisition.interest_accrual_method == DAILY_ACCRUAL (default)"
        difference: "accrues from day 1"
      - name: SIMPLE_ANNUAL
        when: "Acquisition.interest_accrual_method == SIMPLE_ANNUAL"
        difference: "accrues only whole elapsed anniversary years; a 364-day-old deposit accrues 0, a 365-day-old deposit accrues one full year"
    precision: "integer cents, round_half_up"

  - name: utility_expense_normalization
    trigger: "UtilityExpenseRecord create; GET /acquisitions/{id}/expense-summary"
    algorithm: aggregation
    formula: |
      Trailing window: the 12 complete calendar months strictly before the logical clock's current month.
      Category average over included rows: included = source in {SELLER_T12, BILL_AUDIT} (ESTIMATE excluded);
        avg(category) = round_half_up(sum of amount_cents over included rows EXCLUDING the row under test / count)
      is_outlier(row) := row.amount_cents > avg * 1.20 OR row.amount_cents < avg * 0.80   (strict; exactly +-20% is NOT an outlier)
      normalized_amount_cents = is_outlier ? avg : amount_cents
      expense-summary: per-category raw sum, per-category normalized sum, totals, outlier_count
    input_set: "UtilityExpenseRecord rows of the acquisition inside the trailing window; ESTIMATE rows excluded from averages and sums; a category with no included rows in the window contributes 0 to the totals"
    precision: "integer cents, round_half_up for averages"

  - name: severance_and_pto
    trigger: "EmployeeDecision approve"
    algorithm: tiered_pricing
    formula: |
      tenure_years = floor(calendar_days(hire_date .. effective_date) / 365)
      severance_weeks: tenure 0 -> 0; 1..2 -> 1; 3..5 -> 2; >= 6 -> 3
      weekly_cents = round_half_up(annual_salary_cents / 52)
      hourly_cents = round_half_up(annual_salary_cents / 2080)
      RETAIN:    severance_cents = 0; pto_payout_cents = 0;
                 assumed_pto_liability_cents = round_half_up(accrued_pto_hours * hourly_cents)
      TERMINATE/TRANSFER:
        severance_cents = severance_weeks * weekly_cents
        pto_payout_cents = round_half_up(accrued_pto_hours * hourly_cents)
        cap: severance_cents + pto_payout_cents <= 8 * weekly_cents; the SUM is capped:
             if severance + pto > 8*weekly then pto_payout_cents is reduced so the sum equals 8*weekly
        assumed_pto_liability_cents = 0
      Acquisition.payroll_accrual_cents = SUM(severance_cents + pto_payout_cents)
        over decisions with decision in {TERMINATE, TRANSFER} and status in {APPROVED, NOTIFIED}
    input_set: "The decision's own fields; acquisition accrual sums over status-filtered decisions"
    precision: "integer cents, round_half_up at weekly/hourly derivations before multiplication"

  - name: collection_loss_waterfall
    trigger: "PostClosingAdjustment evidence (type COLLECTION_LOSS)"
    algorithm: waterfall_allocation
    formula: |
      Post-closing resident collections are applied to the oldest pre-closing
      arrears first (charge due_date ASC, tie-break charge created_at ASC).
      claimable_cap = min(pre_closing_arrears_cents, collections_applied_cents)
      evidence step rejects amount_cents > claimable_cap with ERR_ADJUSTMENT_EXCEEDS_CLAIMABLE
    input_set: "The adjustment's amount_cents, pre_closing_arrears_cents, collections_applied_cents"
    precision: "integer cents"

  - name: statement_netting
    trigger: "statement generate, manual line add, adjustment apply, closing cascade regeneration"
    algorithm: aggregation
    formula: |
      total_buyer_credits_cents  = SUM amount_cents over lines direction == CREDIT_BUYER
      total_seller_credits_cents = SUM amount_cents over lines direction == CREDIT_SELLER
      net_amount_cents = total_buyer_credits_cents - total_seller_credits_cents
      Acquisition.net_proration_cents = SUM of net_amount_cents over all statements
        of the acquisition with status in {APPROVED, SETTLED} (SUPERSEDED and DRAFT/
        REVIEWED excluded; 0 when none)
      Snapshot-drift check at approve: every GENERATED line is recomputed from
      live data with the pinned formulas; any mismatch -> ERR_STATEMENT_DRIFT.
    input_set: "All ProrationLine rows of the statement"
    precision: "integer cents"

  - name: posture_derivation
    trigger: "any mutation to LeaseFile, SecurityDepositLedgerEntry, DeficiencyFinding, UnitWalkInspection, Concession, or Unit status"
    algorithm: threshold
    formula: |
      Acquisition.readiness_posture:
        BLOCKED  if any LeaseFile DISCREPANCY_FLAGGED (non-EXCLUDED unit)
                 OR any SecurityDepositLedgerEntry DISPUTED
                 OR deferred_maintenance_total_cents > round_half_up(agreed_purchase_price_cents * 0.05)
        AT_RISK  elif deferred_maintenance_total_cents > round_half_up(agreed_purchase_price_cents * 0.03)
                 OR any UnitWalkInspection QA_REJECTED
                 OR any Concession PENDING
        ON_TRACK otherwise
    input_set: "All child rows of the acquisition; EXCLUDED units' leases and findings are ignored"
    constants:
      AT_RISK_PCT: 0.03
      BLOCKED_PCT: 0.05
    precision: "threshold comparisons are strict >; a total exactly equal to the threshold does NOT cross it"

  - name: insurance_loss_ratio
    trigger: "POST /acquisitions/insurance-policies/{id}/review-loss-runs"
    algorithm: threshold
    formula: |
      loss_ratio = loss_run_total_cents / (annual_premium_cents * 3)
      risk_tier = LOW when loss_ratio < 0.40;
                  ELEVATED when 0.40 <= loss_ratio < 0.80;
                  HIGH when loss_ratio >= 0.80
    input_set: "The policy's own premium and loss-run fields"
    precision: "ratio compared as exact decimal; 0.80 exactly is HIGH"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references (unit_id, lease_file_id, inspection_id, acquisition_id, supersedes_lease_id) exist"
    error_id: "ERR_ACQUISITION_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_LEASE_FILE_NOT_FOUND | ERR_CONCESSION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_UTILITY_RECORD_NOT_FOUND | ERR_TAX_PROJECTION_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND | ERR_EMPLOYEE_DECISION_NOT_FOUND | ERR_SERVICE_CONTRACT_NOT_FOUND | ERR_INSURANCE_POLICY_NOT_FOUND | ERR_PRORATION_STATEMENT_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or body FKs

  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, types correct, enum values valid, date ranges sane (end >= start), numbers non-negative where meaningless otherwise"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: all endpoints

  - priority: 5
    category: state
    check: "Target entity transition is valid from its current state; named state preconditions on transitions (e.g. statement must be REVIEWED to approve -> ERR_STATEMENT_NOT_REVIEWED; acquisition phase gates -> ERR_ACQUISITION_NOT_IN_DILIGENCE / ERR_ACQUISITION_NOT_PRE_CLOSING / ERR_ACQUISITION_NOT_CLOSED; lease audited before deposit reconcile -> ERR_LEASE_NOT_AUDITED; statement type allowed for acquisition phase -> ERR_STATEMENT_TYPE_NOT_ALLOWED_FOR_PHASE; terminal entities reject all mutations)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_ACQUISITION_NOT_IN_DILIGENCE | ERR_ACQUISITION_NOT_PRE_CLOSING | ERR_ACQUISITION_NOT_CLOSED | ERR_STATEMENT_NOT_REVIEWED | ERR_LEASE_NOT_AUDITED | ERR_STATEMENT_TYPE_NOT_ALLOWED_FOR_PHASE | ERR_STATEMENT_NOT_SETTLABLE"
    http_status: 409
    applies_to: all action/transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_acquisition_version / expected_statement_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /acquisitions/{id}/tax-projections, POST /acquisitions/{id}/proration-statements, POST /acquisitions/proration-statements/{id}/lines"

  - priority: 7
    category: business_referential
    check: "Segregation of duties and reference currency: statement reviewer != creator and approver != creator and != reviewer; employee-decision approver != proposer; inspection QA caller != completer (ERR_SOD_VIOLATION); supersedes_lease_id must name the unit's current non-SUPERSEDED lease (ERR_SUPERSEDE_TARGET_NOT_CURRENT); rent roll entry must exist before lease audit (ERR_RENT_ROLL_ENTRY_MISSING)"
    error_id: "ERR_SOD_VIOLATION | ERR_SUPERSEDE_TARGET_NOT_CURRENT | ERR_RENT_ROLL_ENTRY_MISSING"
    http_status: 409
    applies_to: "approve/submit-review/qa-accept/qa-reject endpoints, lease create, lease audit"

  - priority: 8
    category: business_safety
    check: "Compliance gates: HIGH risk_tier insurance requires override_high_risk=true (ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE); complete-diligence requires posture != BLOCKED and no unresolved audit items (ERR_ACQUISITION_BLOCKED, ERR_UNRESOLVED_AUDIT_ITEMS)"
    error_id: "ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE | ERR_ACQUISITION_BLOCKED | ERR_UNRESOLVED_AUDIT_ITEMS"
    http_status: 409
    applies_to: "insurance assume, acquisition complete-diligence"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and readiness: unit_number unique per acquisition (ERR_DUPLICATE_UNIT_NUMBER); at most one current LeaseFile per unit (ERR_ACTIVE_LEASE_EXISTS); at most one RentRollEntry per unit (ERR_RENT_ROLL_ENTRY_EXISTS); (acquisition, period_month, category) unique for utility records (ERR_UTILITY_RECORD_EXISTS); findings require parent inspection COMPLETED (ERR_INSPECTION_NOT_COMPLETED); QA accept requires findings when no_findings_declared is false (ERR_FINDINGS_REQUIRED)"
    error_id: "ERR_DUPLICATE_UNIT_NUMBER | ERR_ACTIVE_LEASE_EXISTS | ERR_RENT_ROLL_ENTRY_EXISTS | ERR_UTILITY_RECORD_EXISTS | ERR_INSPECTION_NOT_COMPLETED | ERR_FINDINGS_REQUIRED"
    http_status: 409
    applies_to: "create endpoints for units, lease files, rent roll, utility records; findings create; inspection qa-accept"

  - priority: 10
    category: business_temporal
    check: "Temporal rules: inspector walk windows (half-open [walk_start, walk_end)) must not overlap another non-terminal inspection of the same inspector_ref (ERR_INSPECTOR_DOUBLE_BOOKED); concession coverage windows (CLOSED intervals) on the same lease must not share even one calendar day (ERR_CONCESSION_OVERLAP); send-notice requires clock <= decision_deadline (ERR_NOTICE_WINDOW_MISSED); employee effective_date - notice_date >= required_notice_days (ERR_NOTICE_PERIOD_INSUFFICIENT); mark-effective requires clock >= effective_date (ERR_NOT_YET_EFFECTIVE); mark-cancelled requires clock >= cancellation_effective_date (ERR_CANCELLATION_NOT_YET_EFFECTIVE); adjustment assert requires clock <= closing_executed_at + true_up_window_days (ERR_TRUE_UP_WINDOW_EXPIRED); settle requires clock > closing_executed_at + true_up_window_days (ERR_TRUE_UP_WINDOW_OPEN)"
    error_id: "ERR_INSPECTOR_DOUBLE_BOOKED | ERR_CONCESSION_OVERLAP | ERR_NOTICE_WINDOW_MISSED | ERR_NOTICE_PERIOD_INSUFFICIENT | ERR_NOT_YET_EFFECTIVE | ERR_CANCELLATION_NOT_YET_EFFECTIVE | ERR_TRUE_UP_WINDOW_EXPIRED | ERR_TRUE_UP_WINDOW_OPEN"
    http_status: 409
    applies_to: "inspections create/reschedule, concessions create, service-contract notice/mark-cancelled, employee approve/mark-effective, adjustments create, acquisition settle"

  - priority: 11
    category: business_fiscal
    check: "Money checks: statement approve re-verifies every GENERATED line against live data (ERR_STATEMENT_DRIFT); COLLECTION_LOSS evidence caps amount at min(arrears, collections) (ERR_ADJUSTMENT_EXCEEDS_CLAIMABLE); deposit dispute resolution must zero the variance (ERR_DEPOSIT_VARIANCE_UNRESOLVED)"
    error_id: "ERR_STATEMENT_DRIFT | ERR_ADJUSTMENT_EXCEEDS_CLAIMABLE | ERR_DEPOSIT_VARIANCE_UNRESOLVED"
    http_status: 409
    applies_to: "statement approve, adjustment evidence, deposit resolve-dispute"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# GET endpoints are readable by every role.
endpoints:
  # --- Acquisition lifecycle ---
  - method: POST
    path: "/acquisitions"
    description: "Create an acquisition diligence project"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [property_name, address, agreed_purchase_price_cents, earnest_money_cents, closing_date, diligence_deadline, assessment_ratio, millage_rate, prior_year_tax_cents, "true_up_window_days?", "interest_accrual_method?", "maintenance_estimate_basis?"]
    output: Acquisition
    side_effects: ["status DRAFT; posture ON_TRACK; computed money fields 0"]
  - method: GET
    path: "/acquisitions"
    description: "List acquisitions (paginated)"
    roles: &all_roles [PlatformAdmin, AcquisitionsAnalyst, UnderwritingManager, PropertyOperationsLead, HRPartner, VendorManager, EscrowOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Acquisition[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/{id}"
    description: "Read one acquisition including computed rollups and posture"
    roles: *all_roles
    code: 200
    input: []
    output: Acquisition
    side_effects: []
  - method: PATCH
    path: "/acquisitions/{id}"
    description: "Update closing_date / maintenance_estimate_basis / interest_accrual_method while DRAFT or IN_DILIGENCE; basis change re-derives every verified_cost_cents and the deferred-maintenance rollup"
    roles: [UnderwritingManager]
    code: 200
    input: ["closing_date?", "maintenance_estimate_basis?", "interest_accrual_method?"]
    output: Acquisition
    side_effects: ["deferred_maintenance_total_cents and every verified_cost_cents re-derived when basis changes; deposit accrued interest is always computed at reconcile/resolve time from the CURRENT closing_date and interest_accrual_method; version +1"]
  - method: POST
    path: "/acquisitions/{id}/kickoff"
    description: "DRAFT -> IN_DILIGENCE"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["status transition; version +1"]
  - method: POST
    path: "/acquisitions/{id}/complete-diligence"
    description: "IN_DILIGENCE -> DILIGENCE_COMPLETE; enforces posture and audit-completion gates"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["status transition; version +1"]
  - method: POST
    path: "/acquisitions/{id}/advance-to-pre-closing"
    description: "DILIGENCE_COMPLETE -> PRE_CLOSING; requires an APPROVED DRAFT_CLOSING statement"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["status transition; version +1"]
  - method: POST
    path: "/acquisitions/{id}/execute-closing"
    description: "PRE_CLOSING -> CLOSED; cascades deposits to TRANSFERRED, ASSUMED contracts and policies to TRANSFERRED, regenerates DEPOSIT_TRANSFER line and recomputes statement totals and net_proration_cents"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["closing_executed_at := clock; deposits ESCROW_QUEUED -> TRANSFERRED; contracts/policies ASSUMED -> TRANSFERRED; FINAL_CLOSING statement DEPOSIT_TRANSFER line regenerated; statement totals + Acquisition.net_proration_cents recomputed; version +1"]
  - method: POST
    path: "/acquisitions/{id}/settle"
    description: "CLOSED -> SETTLED after the true-up window has elapsed and all statements settled / adjustments terminal"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["status transition; version +1"]
  - method: POST
    path: "/acquisitions/{id}/terminate"
    description: "-> TERMINATED from DRAFT/IN_DILIGENCE/DILIGENCE_COMPLETE/PRE_CLOSING; rescinds APPROVED/NOTIFIED employee decisions; in PRE_CLOSING also force-cancels ASSUMED/NOTICE_SENT contracts"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Acquisition
    side_effects: ["EmployeeDecision APPROVED/NOTIFIED -> RESCINDED (payroll accrual removed); ServiceContract ASSUMED/NOTICE_SENT -> CANCELLED_EFFECTIVE when PRE_CLOSING; version +1"]

