          - validations[priority 4].ERR_FUEL_GRADE_NOT_FOUND
          - validations[priority 5].ERR_CUSTOMER_NOT_FOUND
          - validations[priority 6].ERR_ASSET_NOT_FOUND
          - validations[priority 7].ERR_NOMINATION_NOT_FOUND
          - validations[priority 8].ERR_DELIVERY_ORDER_NOT_FOUND
          - validations[priority 9].ERR_BDN_NOT_FOUND
          - validations[priority 10].ERR_CLAIM_NOT_FOUND
          - validations[priority 11].ERR_LAB_ANALYSIS_NOT_FOUND
          - validations[priority 12].ERR_INVOICE_NOT_FOUND
          - validations[priority 13].ERR_SPILL_INCIDENT_NOT_FOUND
