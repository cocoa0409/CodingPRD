  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_check_settle
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Check settle returns the final subtotal_cents, tax_cents, and total_cents in the same response; no lag or eventual consistency."
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest exists"
            - "Check OPEN with one line"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/checks"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 2, kind: "REGULAR" }
              as: Server
              captures: { check_id: $.data.id }
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 2 }
              as: Server
          trigger:
            - call: "POST /api/checks/${check_id}/settle"
              payload: {}
              as: Server
              captures: { check: $.data }
          assert:
            - "check.status == SETTLED"
            - "check.subtotal_cents == 3000"
            - "check.tax_cents == 150"
            - "check.total_cents == 3150"
