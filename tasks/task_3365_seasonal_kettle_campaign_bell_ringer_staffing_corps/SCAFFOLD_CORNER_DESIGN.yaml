              captures: { err_terminal: "$.data.error_id" }
          assert:
            - "HostSite.${host_id}.permission_status == DENIED after the deny decision"
            - "the later approve attempt returns error_id ERR_ALREADY_TERMINAL with http status 409"
            - "HostSite.${host_id}.permission_status is still DENIED"

      - name: collection_verify_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.KettleCollection.SUBMITTED_to_VERIFIED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=10]
        distinguishing_aspect: |
          Replaying the verify call on an already VERIFIED collection is rejected with
          ERR_INVALID_STATE_TRANSITION instead of returning the same success payload, so the action
          is not idempotent and the version does not advance on the second attempt.
        test_recipe:
