      - name: claim_filing_blocked_by_refused_delivery_leaving_the_window_null
        entity_pair: "DamageClaim depends on DeliveryOrder.status and claim_window_ends_at"
        grounds:
          - validations[priority 20]
          - errors.ERR_CLAIM_WINDOW_CLOSED
          - state_machines.DeliveryOrder
          - endpoints[POST /delivery-orders/{id}/complete]
          - calculations.delivery_fee
          - calculations.consignor_split
        distinguishing_aspect: |
          A completely different entity pair from the other instance, and the dependency is
          on a null field rather than on an enum: a REFUSED outcome never sets
          claim_window_ends_at, so the priority-20 guard has to treat null as closed rather
          than as unbounded. The same fixture carries a DELIVERED sibling order whose window
          IS open, so an implementation that only compares the clock against a non-null
          timestamp passes one branch and fails the other.
