              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v1}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { app1: $.data.id }
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app1}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /applications"
              payload: { vendor_id: "${v2}", product_category: "FLOWERS" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app2}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v1}", assignment_type: "SEASON", expected_booth_version: "${booth_v0}" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { asg1: $.data.id }
            - call: "GET /booths/${booth}"
              payload: {}
              as: MarketAdmin
              captures: { booth_v_held: $.data.version }
          trigger:
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v2}", assignment_type: "SEASON", allow_waitlist: true, expected_booth_version: "${booth_v_held}" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { asg2: $.data.id }
          assert:
            - "BoothAssignment.${asg2}.status == WAITLISTED"
            - "BoothAssignment.${asg2}.waitlist_rank == 1"
            - "BoothAssignment.${asg2}.fee_charged_cents == 0"

      - name: voucher_batch_aggregate_capacity_overlap  # interval semantics: aggregate-capacity occupation on a DIFFERENT resource (VoucherBatch)
        grounds:
          - state_machines.VoucherRedemption.SUBMITTED_to_RECONCILED
          - entities.VoucherBatch.fields.tokens_issued
          - validations[priority=11]
        distinguishing_aspect: |
          Different resource entity (VoucherBatch, not Booth) and different interval semantics: this is an
          AGGREGATE-CAPACITY overlap — each RECONCILED redemption occupies a slice of the batch's finite
          tokens_issued pool, and a new reconcile that would push cumulative occupation past tokens_issued
          collides (ERR_TOKEN_OVERDRAW). Contrast the date-range whole-window overlap on Booth: here there
          is no time axis, only summed capacity (45 + 60 > 100 tokens_issued).
        test_recipe:
          setup:
            - "Standard market; OPEN day; VoucherBatch tokens_issued=100; two vendors each submit a redemption (45 and 60 tokens); the 45-token redemption is already RECONCILED (45 of 100 occupied)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /voucher-batches"
              payload: { market_id: "${mkt}", market_day_id: "${day}", tokens_issued: 100 }
              as: MarketManager
              captures: { batch: $.data.id }
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${v1}", market_day_id: "${day}", token_count: 45 }
              as: Vendor
              as_user_id: "${v1}"
              captures: { r1: $.data.id }
            - call: "POST /voucher-redemptions/${r1}/reconcile"
              payload: {}
              as: MarketManager
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${v2}", market_day_id: "${day}", token_count: 60 }
              as: Vendor
              as_user_id: "${v2}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /voucher-redemptions/${r2}/reconcile"
              payload: {}
              as: MarketManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_TOKEN_OVERDRAW (45 + 60 = 105 > 100 tokens_issued)"
            - "VoucherRedemption.${r2}.status == SUBMITTED (unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: voucher_reversal_restores_liability  # conserved quantity: voucher cash liability
        grounds:
          - state_machines.VoucherRedemption.RECONCILED_to_REVERSED  # via [SUBMITTED,RECONCILED]_to_REVERSED
          - calculations.voucher_liability_ledger
          - entities.Market.fields.voucher_liability_cents
        distinguishing_aspect: |
          Conserved quantity = Market.voucher_liability_cents = face*sum(batch.tokens_redeemed) -
          reimbursed_to_date. Forward action (reconcile redemption of 40 tokens) raises liability to
          8000; the compensating action (weather cancel -> REVERSED) MUST return it to its pre-redemption
          value 0 with zero drift.
        test_recipe:
          setup:
            - "Standard market; OPEN day; VoucherBatch tokens_issued=100; one redemption 40 tokens RECONCILED (liability 8000)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { ven: $.data.id }
            - call: "POST /market-days"
              payload: { market_id: "${mkt}", market_date: "2026-06-06" }
              as: MarketAdmin
              captures: { day: $.data.id }
            - call: "POST /market-days/${day}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /voucher-batches"
              payload: { market_id: "${mkt}", market_day_id: "${day}", tokens_issued: 100 }
              as: MarketManager
              captures: { batch: $.data.id }
            - call: "POST /voucher-redemptions"
              payload: { market_id: "${mkt}", voucher_batch_id: "${batch}", vendor_id: "${ven}", market_day_id: "${day}", token_count: 40 }
              as: Vendor
              as_user_id: "${ven}"
              captures: { red: $.data.id }
            - call: "POST /voucher-redemptions/${red}/reconcile"
              payload: {}
              as: MarketManager
          trigger:
            - call: "POST /market-days/${day}/cancel"
              payload: { cancellation_reason: "WEATHER" }
              as: MarketAdmin
          assert:
            - "Before trigger, Market.${mkt}.voucher_liability_cents == 8000"
            - "VoucherRedemption.${red}.status == REVERSED"
            - "VoucherRedemption.${red}.reimbursed_cents == 0"
            - "Market.${mkt}.voucher_liability_cents == 0 (restored, zero drift)"
            - "VoucherBatch.${batch}.tokens_redeemed == 0"

      - name: season_complete_then_promote_conserves_fee_ledger  # conserved quantity: occupancy fee ledger
        grounds:
          - state_machines.BoothAssignment.RESERVED_to_COMPLETED  # via [RESERVED,ACTIVE]_to_COMPLETED
          - state_machines.BoothAssignment.WAITLISTED_to_RESERVED
          - calculations.market_fee_ledger
          - entities.Market.fields.total_fees_collected_cents
        distinguishing_aspect: |
          Different conserved quantity = Market.total_fees_collected_cents. Completing the SEASON holder
          (forward) removes its 75000, but the compensating promotion of the rank-1 waitlister to RESERVED
          re-adds an identical 75000 SEASON fee, so the occupancy-fee ledger is invariant at 75000 with no
          drift across the complete+promote pair.
        test_recipe:
          setup:
            - "Standard market; CORNER booth; V1 RESERVED SEASON (fee 75000), V2 WAITLISTED rank-1 SEASON; total_fees_collected_cents == 75000."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
              as: MarketAdmin
              captures: { mkt: $.data.id }
            - call: "POST /booths"
              payload: { market_id: "${mkt}", label: "C-1", grid_row: 0, grid_col: 1, size_class: "CORNER", allowed_categories: [] }
              as: MarketAdmin
              captures: { booth: $.data.id, booth_v0: $.data.version }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V1", contact_email: "v1@x.com" }
              as: MarketAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { market_id: "${mkt}", legal_name: "V2", contact_email: "v2@x.com" }
              as: MarketAdmin
              captures: { v2: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v1}", product_category: "CRAFTS" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { app1: $.data.id }
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app1}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /applications"
              payload: { vendor_id: "${v2}", product_category: "FLOWERS" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app2}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v1}", assignment_type: "SEASON", expected_booth_version: "${booth_v0}" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { asg1: $.data.id }
            - call: "GET /booths/${booth}"
              payload: {}
              as: MarketAdmin
              captures: { booth_v_held: $.data.version }
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${v2}", assignment_type: "SEASON", allow_waitlist: true, expected_booth_version: "${booth_v_held}" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { asg2: $.data.id }
          trigger:
            - call: "POST /booth-assignments/${asg1}/complete"
              payload: {}
              as: MarketAdmin
          assert:
            - "Before trigger, Market.${mkt}.total_fees_collected_cents == 75000"
            - "BoothAssignment.${asg1}.status == COMPLETED"
            - "BoothAssignment.${asg2}.status == RESERVED"
            - "BoothAssignment.${asg2}.fee_charged_cents == 75000"
            - "Market.${mkt}.total_fees_collected_cents == 75000 (invariant, zero drift)"
