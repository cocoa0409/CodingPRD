        grounds:
          - calculations.order_quoted_total
          - endpoints[POST /customer-orders].side_effects
        distinguishing_aspect: "The plainest path through order_quoted_total - pass-through enabled, no cut-to-length, tier 1 - pins all six quoted_* outputs at once, so a solver that skips the pass-through term or extends before rounding the unit price is caught on the simplest possible order."
        test_recipe:
          setup:
            - "One COPPER quote at 4.10 effective 2026-07-30; SKU THHN-12-CU at 19.8 lbs/kft; customer with pass_through_enabled true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
