            - "sealed_alias == \"LIT-2027-0001\" and submitted_at == \"2026-09-01T00:00:00.000Z\""
            - "applicant_legal_name == \"Cleo Amari\", applicant_region == \"NORTH\", residency_months_at_deadline == 45 and blackout_gap_years == null"
            - "work_sample_count == 2, valid_review_count == 0 and eligibility_status is still null/undetermined"

      - name: two_rules_at_different_priorities_violated_by_one_request
        claim_type: priority_conflict
        grounds:
          - validations[priority=70]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_posture_p70_outranks_installment_not_due_p80
          rationale: "That §1.8 instance drives one release call that violates both the P70 posture rule and the P80 due-date rule and asserts the P70 code."

      - name: later_check_depends_on_the_result_of_an_earlier_one
        claim_type: cascading_validation
        grounds:
          - validations[priority=70]
          - validations[priority=85]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cycle_state_p70_outranks_deadline_p80_which_outranks_duplicate_p85
          rationale: "The named §1.8 instance peels a three-defect request one priority band at a time, which is the cascading-validation claim in full."

      - name: reopen_required_blocks_both_the_slate_and_the_cycle_advance
        claim_type: violation_error
        grounds:
          - validations[error_id=ERR_SCORE_SPREAD_REQUIRES_ANOTHER_ROUND]
        excluded_because:
          difficulty_instance: non_linear_state_machine / panel_loops_deliberating_back_to_scoring_for_a_bounded_second_round
          rationale: "That §1.8 instance trips the 2.50 spread threshold and asserts both the refused slate and the refused BOARD_REVIEW advance before the second round clears it."

