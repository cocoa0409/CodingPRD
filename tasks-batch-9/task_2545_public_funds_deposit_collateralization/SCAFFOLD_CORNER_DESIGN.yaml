        distinguishing_aspect: "Adequacy is judged on HAIRCUT VALUE, not par, and only at compliance-approve: swapping 10,000,000 par of US_TREASURY (200 bps haircut, value 9,800,000) for the SAME par of MUNI_GO (1000 bps haircut, value 9,000,000) is accepted as a request but rejected on approval with delta -800,000, while 11,000,000 par of the same MUNI_GO clears with delta +100,000."
