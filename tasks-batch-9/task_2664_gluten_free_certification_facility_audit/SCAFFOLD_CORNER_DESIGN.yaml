          All four elements of the selector policy are exercised in one triage: eligibility is
          a CLOSED 90-day look-back, so the lot collected 2026-08-16 (91 days before the
          2026-11-15 exposure) is out while 2026-08-17 (exactly 90 days) is in; ranking is
          sample_collected_on DESC; the tie between the two 2026-11-15 lots is broken by
          created_at ASC so RSL-L3 outranks RSL-L4; and only the first three candidates are
          taken, which leaves the eligible 2026-08-17 lot at rank 4 unselected. The FAILING
          lot is deliberately the INELIGIBLE one, so recall_action must stay VOLUNTARY_RECALL
          - an implementation that scans all lots of the product, or that upgrades on any
