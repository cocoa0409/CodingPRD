            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stN_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", book_inventory_cents: 4000000 }
              as: FranchisorAdmin
              captures: { saN_1: $.data.id }
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stN_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", book_inventory_cents: 4000000 }
              as: FranchisorAdmin
              captures: { saN_2: $.data.id }
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stN_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", book_inventory_cents: 4000000 }
              as: FranchisorAdmin
              captures: { saN_3: $.data.id }
          trigger:
            - call: "POST /franchise/shrink-audits/${saN_1}/count"
