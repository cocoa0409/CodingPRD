            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${k1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { k1_v: $.data.version } }
            - { call: "POST /cases/${k1}/sar-decision", payload: { decision: "NO_SAR", decision_rationale: "Documented legitimate activity", expected_case_version: "${k1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "FBI", inquiry_reference: "LE-7001", subject_customer_id: "${cu1}" }, as: ComplianceAdmin, captures: { le1: $.data.id } }
            - { call: "POST /law-enforcement-inquiries/${le1}/link-case", payload: { case_id: "${k1}" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /cases/${k1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}", captures: { err: $.data.error_id } }
            - { call: "POST /law-enforcement-inquiries/${le1}/respond", payload: { response_summary: "Provided account records for the review period" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /law-enforcement-inquiries/${le1}/close", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${k1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}", captures: { k1_end: $.data.status } }
          assert:
            - "First qa PASS: 409 ERR_LE_INQUIRY_OPEN; case remains PENDING_QA"
            - "After respond + close of the inquiry: second qa PASS succeeds; Case.${k1}.status == CLOSED with closed_reason == NO_SAR_CONFIRMED"
            - "LawEnforcementInquiry.${le1}.status == CLOSED and customer open_le_inquiry_count == 0 afterwards"

