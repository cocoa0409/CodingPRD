  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: reprice_with_current_version_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reprice-stale-event]", entities.Event.fields.version]
        distinguishing_aspect: "POST /events/{id}/reprice with expected_event_version == current version succeeds, updates seat_price_cents, and increments Event.version by 1."
        test_recipe:
          setup: ["A DRAFT event at version 1"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "23 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/reprice"
              payload: { new_seat_price_cents: 12000, expected_event_version: "${ev_v}" }
              as: PlatformAdmin
          assert:
            - "Event.${event_id}.seat_price_cents == 12000"
            - "Event.${event_id}.version == 2"

      - name: reprice_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reprice-stale-event]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "A second reprice still carrying the pre-reprice expected_event_version is rejected with ERR_STALE_EVENT_VERSION (412) because the first reprice already advanced Event.version."
        test_recipe:
          setup: ["A DRAFT event repriced once (version advanced 1 -> 2); client still holds version 1"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "24 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ev_v: $.data.version }
            - call: "POST /events/${event_id}/reprice"
              payload: { new_seat_price_cents: 11000, expected_event_version: "${ev_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /events/${event_id}/reprice"
              payload: { new_seat_price_cents: 13000, expected_event_version: "${ev_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_EVENT_VERSION"
            - "http status == 412"

