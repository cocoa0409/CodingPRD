          - "errors[ERR_TICKET_NOT_YET_DUE]"
        distinguishing_aspect: "Reporting a miss for a future service_date (clock 2026-05-04, ticket 2026-05-11) -> 422 ERR_TICKET_NOT_YET_DUE."
        test_recipe:
