      - name: escalating_a_detection_links_it_to_a_newly_minted_incident
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /telemetry-detections/{detectionId}/triage]
          - calculations.incident_severity
          - calculations.incident_notification_due_at
          - calculations.detection_exposure_score
          - entities.TelemetryDetection.fields.linked_incident_id
        distinguishing_aspect: |
          ESCALATE is the only disposition that creates a second entity: the detection must
          come back with a non-null linked_incident_id pointing at a brand-new VendorIncident
          whose detected_at is the detection's observed_at, whose affected_student_count
          defaults to the detection's distinct_user_count (30 -> MODERATE) and whose
          max_data_tier defaults to 3, giving notification_due_at = observed_at + min(48, 72)
          hours = 2026-08-02T12:00:00.000Z. An implementation that stamps the incident with
          the clock instead of observed_at gets the due instant wrong.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V (breach_notification_hours 48) with Application A and NO catalog entry, so the detection classifies UNAUTHORIZED."
            - "Detection D on A: 30 distinct users, 120 sessions, observed_at 2026-07-31T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Shadow Quiz Tools", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
