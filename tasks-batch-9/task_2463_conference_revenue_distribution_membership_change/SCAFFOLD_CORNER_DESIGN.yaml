      - name: corner_travel_partner_gap_penalty_applies_per_unpaired_away_game
        claim_type: weighted_scoring
        grounds:
          - calculations.schedule_compliance_score
          - entities.Member.fields.travel_partner_member_id
          - endpoints[GET /members/{id}/schedule-compliance]
          - endpoints[PATCH /members/{id}]
        distinguishing_aspect: |
          The travel-partner gap is counted per away game that lacks a partner
          away game at the *same venue* within TRAVEL_PAIR_WINDOW_DAYS, and it
          is skipped entirely when travel_partner_member_id is null. East, once
          paired to West, scores 92 on a single unpaired trip; adding West's
          away game at the same venue two days later erases the gap and returns
          East to 100 - while West, whose own partner field stays null, sits at
          100 throughout despite making the identical trip.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members; North and South both play at the Northfield Dome, their declared home venue."
            - "East is amended to name West as its travel partner; West's own travel_partner_member_id stays null."
