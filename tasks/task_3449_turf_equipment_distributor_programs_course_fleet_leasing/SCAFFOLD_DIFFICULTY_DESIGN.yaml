          setup:
            - "D1 ACTIVE; C1 CLUB; lease [M1 x4, M2 x2] cycle 36 start 2026-09-01, APPROVED then ACTIVE at the default clock; no appraisals"
            - "net = total = 35600000 x 1.08 = 38448000; monthly = 1068000"
