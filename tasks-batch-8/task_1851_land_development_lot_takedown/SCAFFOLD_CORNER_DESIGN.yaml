              captures: { lp: $.data.id }
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${lp}", commitment_amount_cents: 1000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ll: $.data.id }
          trigger:
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${lp}", commitment_amount_cents: 2000000, release_price_floor_bp: 7500 }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_LOAN_ALREADY_EXISTS (409)"

      - name: invalid_contingency_extension_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_CONTINGENCY_EXTENSION]"]
        distinguishing_aspect: "new_contingency_end_date equal to or before the current deadline is rejected 400 ERR_INVALID_CONTINGENCY_EXTENSION even with a correct OCC version."
        test_recipe:
          setup: ["Parcel P in CONTINGENCY_ACTIVE with contingency_end_date 2027-01-01"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "EP2", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { ep2: $.data.id }
            - call: "POST /api/parcels/${ep2}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ep2_v: $.data.version }
          trigger:
            - call: "POST /api/parcels/${ep2}/extend-contingency"
              payload: { new_contingency_end_date: "2026-12-01T00:00:00Z", expected_parcel_version: "${ep2_v}" }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_CONTINGENCY_EXTENSION (400)"

      - name: window_invalid_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "selling_window_end <= selling_window_start on phase create is rejected 400 ERR_INVALID_WINDOW (field-level temporal shape check, before any overlap analysis)."
        test_recipe:
          setup: ["Parcel P exists"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "WP2", county: "Travis", earnest_money_cents: 100000 }
