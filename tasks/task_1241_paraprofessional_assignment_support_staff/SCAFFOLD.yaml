# =============================================================================
# Task 1241: Paraprofessional Assignment & Support Staff Allocation
# District special education staffing — scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1241. Paraprofessional Assignment & Support Staff Allocation (district special
  education staffing): student need & IEP-mandated one-on-one assignment,
  qualification requirement & training completion, daily coverage plan & absence
  backfill, schedule fragmentation across buildings, supervision & evaluation by
  teacher/administrator, hours limitation & benefit eligibility, reassignment when
  student services change, staffing cost vs allocation formula

domain_name: paraprofessional-staffing
api_prefix: /sped-staffing

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: posture-driven gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - scheduled_actions
  entity_topology: flat        # peer entities joined by FK references in bodies; no nested write paths
  state_machine_shape: parallel # Assignment carries status x funding_status; several cyclic machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # evaluation author may not countersign; para may not approve own timesheet
  consistency_model: immediate
  difficulty_intent: "beyond expert band: 13 entities / 75 endpoints / 41 errors with dense cross-entity coupling (parallel state dimensions, posture-gated coverage, selector with decline-exclusion, depth-3 cascade, all three combinatorial modes)"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffingPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Plan display name" }
      - { name: school_year, type: string, source: input, description: "School year label, e.g. 2026-27" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total staffing budget in cents; must be > 0" }
      - { name: benefit_threshold_minutes, type: integer, source: input, default: 1800, description: "Weekly provisional minutes at or above which a para is benefit-eligible (>=)" }
      - { name: benefit_surcharge_pct, type: number, source: input, default: 0.20, description: "Wage multiplier applied to newly-costed assignments while para is benefit-eligible" }
      - { name: travel_buffer_minutes, type: integer, source: input, default: 30, description: "Required gap between same-day assignments in different buildings" }
      - { name: committed_cost_cents, type: integer, source: computed, description: "Sum of projected_weekly_cost_cents over assignments in PROPOSED/QUALIFICATION_VERIFIED/ACTIVE/SUSPENDED (SUSPENDED releases its share)" }
      - { name: settled_cost_cents, type: integer, source: computed, description: "Sum of final approved-timesheet labor cost posted at plan close" }
      - { name: cost_balance_cents, type: integer, source: computed, description: "= total_budget_cents - committed_cost_cents - settled_cost_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RECONCILING | CLOSED", constraints: "initial DRAFT" }

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: name, type: string, source: input, description: "Building display name" }
      - { name: building_code, type: string, source: input, description: "Unique per plan", constraints: "unique within plan_id" }
      - { name: hardship_factor, type: number, source: input, default: 1.0, description: "Allocation multiplier for hard-to-staff buildings, 0.5..2.0" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; current placement building" }
      - { name: student_ref, type: string, source: input, description: "Opaque district student reference (privacy-safe), unique per plan", constraints: "unique within plan_id" }
      - { name: iep_service_level, type: enum, source: input, description: "ONE_TO_ONE | SHARED_SUPPORT | TRANSITIONAL" }
      - { name: iep_minutes_per_week, type: integer, source: input, description: "IEP-mandated support minutes per week; > 0" }
      - { name: required_qualification, type: enum, source: input, default: "NONE", description: "NONE | BEHAVIOR_SUPPORT | MEDICAL_DELEGATION | SIGN_LANGUAGE" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE_IEP | SERVICE_CHANGE_PENDING | EXITED", constraints: "initial REGISTERED" }

  - name: Paraprofessional
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: home_building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: full_name, type: string, source: input, description: "Full name" }
      - { name: email, type: string, source: input, description: "Contact email, unique per plan", constraints: "unique within plan_id" }
      - { name: base_hourly_wage_cents, type: integer, source: input, description: "Base wage in cents per hour; > 0" }
      - { name: contracted_max_weekly_minutes, type: integer, source: input, description: "Hard weekly cap on scheduled minutes; > 0" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD; used as selector tie-break before created_at" }
      - { name: qualifications, type: array, source: system, description: "Entries {qualification, completed_on, expires_on|null, revoked}; appended via qualifications endpoint; initial []" }
      - { name: weekly_scheduled_minutes, type: integer, source: computed, description: "Sum of weekly minutes over ACTIVE assignments + accepted backfill minutes for the current ISO week" }
      - { name: benefit_eligible, type: boolean, source: computed, description: "Provisional variant: weekly_scheduled_minutes >= plan.benefit_threshold_minutes" }
      - { name: confirmed_benefit_eligible, type: boolean, source: computed, description: "Chronological variant set at plan close: any week with approved minutes >= threshold; null until close" }
      - { name: benefit_variance_cents, type: integer, source: computed, description: "Clawback posted at plan close for weeks provisional-eligible but confirmed below threshold; 0 until close" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | SEPARATED", constraints: "initial ACTIVE" }

  - name: ServiceChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: change_type, type: enum, source: input, description: "MINUTES_CHANGE | QUALIFICATION_CHANGE | BUILDING_TRANSFER | EXIT" }
      - { name: new_minutes_per_week, type: integer, source: input, description: "Required when change_type=MINUTES_CHANGE; > 0" }
      - { name: new_required_qualification, type: enum, source: input, description: "Required when change_type=QUALIFICATION_CHANGE; NONE | BEHAVIOR_SUPPORT | MEDICAL_DELEGATION | SIGN_LANGUAGE" }
      - { name: new_building_id, type: string, source: input, description: "FK -> Building.id; required when change_type=BUILDING_TRANSFER" }
      - { name: reason, type: string, source: input, description: "Free-text rationale" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | EFFECTIVE | CANCELLED", constraints: "initial FILED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: para_id, type: string, source: input, description: "FK -> Paraprofessional.id" }
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; service location driving travel-buffer logic" }
      - { name: start_date, type: string, source: input, description: "ISO date; first service date" }
      - { name: end_date, type: string, source: input, description: "ISO date; last service date; >= start_date" }
      - { name: days_of_week, type: array, source: input, description: "Non-empty subset of [MON,TUE,WED,THU,FRI,SAT,SUN]" }
      - { name: daily_start_minute, type: integer, source: input, description: "Minute-of-day 0..1439" }
      - { name: daily_end_minute, type: integer, source: input, description: "Minute-of-day; > daily_start_minute" }
      - { name: service_level_snapshot, type: enum, source: system, description: "Copied from student.iep_service_level at creation" }
      - { name: required_qualification_snapshot, type: enum, source: system, description: "Copied from student.required_qualification at creation" }
      - { name: base_wage_snapshot_cents, type: integer, source: system, description: "Copied from para.base_hourly_wage_cents at creation" }
      - { name: daily_cost_cents, type: integer, source: computed, description: "Per calculations.assignment_daily_cost; recomputed on benefit flips while non-activated; locked at activation" }
      - { name: projected_weekly_cost_cents, type: integer, source: computed, description: "= daily_cost_cents * len(days_of_week); recomputed whenever daily_cost_cents recomputes" }
      - { name: weekly_minutes, type: integer, source: computed, description: "= (daily_end_minute - daily_start_minute) * len(days_of_week)" }
      - { name: end_reason, type: enum, source: system, description: "null | SERVICE_CHANGED | COORDINATOR_ENDED | PLAN_CLOSED", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | QUALIFICATION_VERIFIED | ACTIVE | SUSPENDED | ENDED", constraints: "initial PROPOSED; ENDED terminal" }
      - { name: funding_status, type: enum, source: system, description: "PROVISIONALLY_FUNDED | UNFUNDED | FUNDED | SETTLED; parallel state dimension independent of status", constraints: "initial PROVISIONALLY_FUNDED" }

  - name: CoveragePlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: coverage_date, type: string, source: input, description: "ISO date this plan covers", constraints: "(building_id, coverage_date) unique" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | RECONCILED", constraints: "initial DRAFT" }
      - { name: coverage_posture, type: enum, source: computed, description: "OPEN (no linked non-terminal absences) | GAPS_OPEN (>=1 absence in REPORTED/BACKFILL_PENDING/ESCALATED) | FROZEN (status LOCKED or RECONCILED)" }

  - name: AbsenceReport
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> StaffingPlan.id; derived from assignment" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the assignment left uncovered" }
      - { name: coverage_plan_id, type: string, source: system, description: "FK -> CoveragePlan.id; resolved from (assignment.building_id, absence_date)" }
      - { name: absence_date, type: string, source: input, description: "ISO date of absence; weekday must be in assignment.days_of_week" }
      - { name: absence_minutes, type: integer, source: system, description: "= assignment daily minutes (daily_end_minute - daily_start_minute)" }
      - { name: reason, type: string, source: input, description: "Free-text absence reason" }
      - { name: reported_by_role, type: string, source: system, description: "X-User-Role of creator" }
      - { name: declined_para_ids, type: array, source: system, description: "Para ids who declined a backfill offer for this absence; excluded from future selector runs; initial []" }
      - { name: status, type: enum, source: system, description: "REPORTED | BACKFILL_PENDING | ESCALATED | COVERED | CANCELLED | UNCOVERED", constraints: "initial REPORTED; COVERED/CANCELLED/UNCOVERED terminal" }

  - name: BackfillAssignment
    parent: null
    common_fields: true
    fields:
      - { name: absence_id, type: string, source: system, description: "FK -> AbsenceReport.id" }
      - { name: plan_id, type: string, source: system, description: "FK -> StaffingPlan.id; derived from absence" }
      - { name: substitute_para_id, type: string, source: system, description: "FK -> Paraprofessional.id; chosen by calculations.backfill_selector" }
      - { name: coverage_minutes, type: integer, source: system, description: "= absence.absence_minutes" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | CANCELLED | COMPLETED", constraints: "initial OFFERED; DECLINED/CANCELLED/COMPLETED terminal" }

  - name: TimesheetEntry
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> StaffingPlan.id; derived from assignment" }
      - { name: para_id, type: string, source: system, description: "FK -> Paraprofessional.id; always equals X-User-ID of creator" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: work_date, type: string, source: input, description: "ISO date worked; must fall within assignment [start_date, end_date]" }
      - { name: start_minute, type: integer, source: input, description: "Minute-of-day 0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minute-of-day; > start_minute" }
      - { name: minutes_worked, type: integer, source: computed, description: "= end_minute - start_minute" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED", constraints: "initial DRAFT; reject bounces SUBMITTED back to DRAFT; APPROVED terminal" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: para_id, type: string, source: input, description: "FK -> Paraprofessional.id" }
      - { name: period_start, type: string, source: input, description: "ISO date" }
      - { name: period_end, type: string, source: input, description: "ISO date; >= period_start" }
      - { name: professionalism_score, type: integer, source: input, description: "1..5" }
      - { name: instructional_support_score, type: integer, source: input, description: "1..5" }
      - { name: comments, type: string, source: input, description: "Free-text evaluation comments" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating Teacher; used for submit-ownership and countersign segregation" }
      - { name: countersigned_by_user_id, type: string, source: system, description: "X-User-ID of countersigning BuildingAdministrator; null until countersigned" }
      - { name: resolution_note, type: string, source: system, description: "Set on resolve; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COUNTERSIGNED | ACKNOWLEDGED | DISPUTED | RESOLVED", constraints: "initial DRAFT; ACKNOWLEDGED/RESOLVED terminal" }

  - name: AllocationFormula
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: version_no, type: integer, source: system, description: "Per-plan sequence: max(existing)+1, starting at 1" }
      - { name: base_grant_cents, type: integer, source: input, description: "Flat per-building grant; >= 0" }
      - { name: per_minute_rate_cents, type: integer, source: input, description: "Funding rate per IEP minute; > 0" }
      - { name: weight_one_to_one, type: number, source: input, description: "Service weight for ONE_TO_ONE" }
      - { name: weight_shared_support, type: number, source: input, description: "Service weight for SHARED_SUPPORT" }
      - { name: weight_transitional, type: number, source: input, description: "Service weight for TRANSITIONAL" }
      - { name: period_weeks, type: integer, source: input, description: "Number of weeks in a funding period; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", constraints: "initial DRAFT" }

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> StaffingPlan.id; derived from formula" }
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; one row per building in the plan" }
      - { name: formula_id, type: string, source: system, description: "FK -> AllocationFormula.id; version pinned at compute time" }
      - { name: period_label, type: string, source: system, description: "Funding period label from compute request" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Forward-looking variant per calculations.building_allocation" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Chronological variant computed at plan close; null until close" }
      - { name: variance_cents, type: integer, source: computed, description: "= final_amount_cents - provisional_amount_cents; null until close" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED", constraints: "initial PROVISIONAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StaffingPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sped-staffing/plans/{planId}/activate"
        actor: DistrictStaffingAdmin
        preconditions:
          - "At least one Building exists for the plan (ERR_PLAN_HAS_NO_BUILDINGS)"
        side_effects:
          - "increments StaffingPlan.version by 1"

      - from: ACTIVE
        to: RECONCILING
        trigger: "POST /sped-staffing/plans/{planId}/begin-reconciliation"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "increments StaffingPlan.version by 1"

      - from: RECONCILING
        to: ACTIVE
        trigger: "POST /sped-staffing/plans/{planId}/reopen"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "increments StaffingPlan.version by 1"
        note: "Revision loop: reconciliation findings may force the plan back to ACTIVE for correction"

      - from: RECONCILING
        to: CLOSED
        trigger: "POST /sped-staffing/plans/{planId}/close"
        actor: DistrictStaffingAdmin
        preconditions:
          - "No TimesheetEntry in SUBMITTED state for this plan (ERR_UNRESOLVED_TIMESHEETS)"
          - "No CoveragePlan in DRAFT/PUBLISHED/LOCKED state for this plan (ERR_UNRECONCILED_COVERAGE_PLANS)"
        side_effects:
          - "Per para: compute confirmed_benefit_eligible and benefit_variance_cents (calculations.weekly_benefit_eligibility, confirmed variant)"
          - "Per FundingAllocation row: compute final_amount_cents and variance_cents (calculations.building_allocation, final variant); status -> FINALIZED"
          - "settled_cost_cents = sum over APPROVED timesheets of round_half_up(minutes_worked/60 * assignment locked hourly rate); cost_balance_cents recomputed"
          - "All ACTIVE/SUSPENDED assignments -> ENDED with end_reason PLAN_CLOSED; their committed share released"
          - "increments StaffingPlan.version by 1"

  - entity: Student
    initial_state: REGISTERED
    terminal_states: [EXITED]
    transitions:
      - from: REGISTERED
        to: ACTIVE_IEP
        trigger: "POST /sped-staffing/students/{studentId}/activate-iep"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects: []

      - from: ACTIVE_IEP
        to: SERVICE_CHANGE_PENDING
        trigger: "POST /sped-staffing/service-change-orders (creation)"
        actor: SpecialEdCoordinator
        preconditions:
          - "No ServiceChangeOrder in FILED or APPROVED exists for this student (ERR_OPEN_CHANGE_ORDER_EXISTS)"
        side_effects: []

      - from: SERVICE_CHANGE_PENDING
        to: ACTIVE_IEP
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects: []

      - from: SERVICE_CHANGE_PENDING
        to: ACTIVE_IEP
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/effectuate (change_type != EXIT)"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Student fields updated to the order's new_* values (minutes / qualification / building per change_type)"
          - "Cascade hop 1: each of the student's assignments in PROPOSED/QUALIFICATION_VERIFIED/ACTIVE/SUSPENDED -> ENDED with end_reason SERVICE_CHANGED; each release returns its weekly_minutes to para.weekly_scheduled_minutes and its projected_weekly_cost_cents to plan.committed_cost_cents"
          - "Cascade hop 2: para.weekly_scheduled_minutes drop may flip para.benefit_eligible to false"
          - "Cascade hop 3: benefit flip re-snapshots daily_cost_cents (and projected_weekly_cost_cents) on the para's remaining PROPOSED/QUALIFICATION_VERIFIED assignments using the non-surcharged rate; plan.committed_cost_cents adjusted by the delta"

      - from: SERVICE_CHANGE_PENDING
        to: EXITED
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/effectuate (change_type = EXIT)"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Same assignment-ending cascade as the non-EXIT effectuate path (hops 1-3)"

  - entity: ServiceChangeOrder
    initial_state: FILED
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/approve"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: FILED
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/return"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects: []
        note: "Revision loop: returned orders may be edited nowhere (immutable body) but re-approved; student stays SERVICE_CHANGE_PENDING"

      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/effectuate"
        actor: SpecialEdCoordinator
        preconditions:
          - "Student must still be in SERVICE_CHANGE_PENDING (ERR_CHANGE_ORDER_INVALID_STATE)"
        side_effects:
          - "Student state + field cascade per Student machine (ACTIVE_IEP or EXITED)"

      - from: FILED
        to: CANCELLED
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Student -> ACTIVE_IEP"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /sped-staffing/service-change-orders/{orderId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Student -> ACTIVE_IEP"

  - entity: Paraprofessional
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /sped-staffing/paraprofessionals/{paraId}/set-status"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "Excluded from backfill selector candidate pool while ON_LEAVE"

      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /sped-staffing/paraprofessionals/{paraId}/set-status"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /sped-staffing/paraprofessionals/{paraId}/set-status"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "All non-ENDED assignments -> ENDED with end_reason COORDINATOR_ENDED (same release cascade as service change hops 1-3)"

      - from: ON_LEAVE
        to: SEPARATED
        trigger: "POST /sped-staffing/paraprofessionals/{paraId}/set-status"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "All non-ENDED assignments -> ENDED with end_reason COORDINATOR_ENDED (same release cascade)"

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [ENDED]
    transitions:
      # --- status dimension ---
      - from: PROPOSED
        to: QUALIFICATION_VERIFIED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/verify-qualifications"
        actor: SpecialEdCoordinator
        preconditions:
          - "Para holds required_qualification_snapshot with completed_on <= current logical date, (expires_on null or > current logical date), revoked=false (ERR_QUALIFICATION_NOT_CURRENT)"
        side_effects: []

      - from: QUALIFICATION_VERIFIED
        to: ACTIVE
        trigger: "POST /sped-staffing/assignments/{assignmentId}/activate"
        actor: SpecialEdCoordinator
        preconditions:
          - "Student.status == ACTIVE_IEP (ERR_STUDENT_NOT_ASSIGNABLE)"
          - "Funding gate: funding_status == PROVISIONALLY_FUNDED and plan committed_cost_cents (already including this assignment) <= total_budget_cents - settled_cost_cents (ERR_INSUFFICIENT_BUDGET; on failure funding_status -> UNFUNDED)"
        side_effects:
          - "daily_cost_cents locked (no further recompute)"
          - "funding_status -> FUNDED"
          - "para.weekly_scheduled_minutes += weekly_minutes; para.benefit_eligible recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/suspend OR system (qualification revoked/expired cascade)"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "para.weekly_scheduled_minutes -= weekly_minutes; para.benefit_eligible recomputed"
          - "plan.committed_cost_cents -= projected_weekly_cost_cents"
          - "funding_status stays FUNDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sped-staffing/assignments/{assignmentId}/resume"
        actor: SpecialEdCoordinator
        preconditions:
          - "Qualification re-check (ERR_QUALIFICATION_NOT_CURRENT)"
          - "Schedule re-check against para's other ACTIVE assignments under travel-buffer rule (ERR_SCHEDULE_OVERLAP)"
          - "Weekly cap re-check: para.weekly_scheduled_minutes + weekly_minutes <= contracted_max_weekly_minutes (ERR_WEEKLY_MINUTES_CAP_EXCEEDED)"
          - "Budget re-check: plan.committed_cost_cents + projected_weekly_cost_cents <= total_budget_cents - settled_cost_cents (ERR_INSUFFICIENT_BUDGET; on failure funding_status -> UNFUNDED)"
        side_effects:
          - "para.weekly_scheduled_minutes += weekly_minutes; para.benefit_eligible recomputed"
          - "plan.committed_cost_cents += projected_weekly_cost_cents"

      - from: PROPOSED
        to: ENDED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/end OR system cascade"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "plan.committed_cost_cents -= projected_weekly_cost_cents"
          - "funding_status -> SETTLED"

      - from: QUALIFICATION_VERIFIED
        to: ENDED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/end OR system cascade"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "plan.committed_cost_cents -= projected_weekly_cost_cents"
          - "funding_status -> SETTLED"

      - from: ACTIVE
        to: ENDED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/end OR system cascade"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "para.weekly_scheduled_minutes -= weekly_minutes; para.benefit_eligible recomputed"
          - "plan.committed_cost_cents -= projected_weekly_cost_cents"
          - "funding_status -> SETTLED"

      - from: SUSPENDED
        to: ENDED
        trigger: "POST /sped-staffing/assignments/{assignmentId}/end OR system cascade"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "funding_status -> SETTLED (minutes and committed already released at suspend)"

      # --- funding_status dimension (parallel) ---
      - from: PROVISIONALLY_FUNDED
        to: FUNDED
        trigger: "system (on successful activate)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PROVISIONALLY_FUNDED
        to: UNFUNDED
        trigger: "system (on failed funding gate at activate)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FUNDED
        to: UNFUNDED
        trigger: "system (on failed funding gate at resume)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNFUNDED
        to: PROVISIONALLY_FUNDED
        trigger: "system (automatic when plan.committed_cost_cents decreases and the assignment's projected_weekly_cost_cents fits again)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Bubble-up re-fund: evaluated after every committed-cost release on the plan; earliest-created_at UNFUNDED assignment of the plan is re-funded first"

      - from: PROVISIONALLY_FUNDED
        to: SETTLED
        trigger: "system (on end from PROPOSED/QUALIFICATION_VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FUNDED
        to: SETTLED
        trigger: "system (on end from ACTIVE/SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CoveragePlan
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /sped-staffing/coverage-plans/{coveragePlanId}/publish"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "increments CoveragePlan.version by 1"

      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /sped-staffing/coverage-plans/{coveragePlanId}/reopen"
        actor: SpecialEdCoordinator
        preconditions:
          - "coverage_posture == OPEN (ERR_COVERAGE_GAPS_OPEN)"
        side_effects:
          - "increments CoveragePlan.version by 1"

      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /sped-staffing/coverage-plans/{coveragePlanId}/lock"
        actor: SpecialEdCoordinator
        preconditions:
          - "coverage_posture == OPEN: no linked AbsenceReport in REPORTED/BACKFILL_PENDING/ESCALATED (ERR_COVERAGE_GAPS_OPEN)"
        side_effects:
          - "coverage_posture -> FROZEN"
          - "increments CoveragePlan.version by 1"

      - from: LOCKED
        to: RECONCILED
        trigger: "POST /sped-staffing/coverage-plans/{coveragePlanId}/reconcile"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Linked absences: COVERED stays COVERED (already terminal); REPORTED/BACKFILL_PENDING/ESCALATED -> UNCOVERED"
          - "Linked backfills: OFFERED -> CANCELLED; ACCEPTED -> COMPLETED (substitute minutes unchanged: one-off date already passed)"
          - "increments CoveragePlan.version by 1"

  - entity: AbsenceReport
    initial_state: REPORTED
    terminal_states: [COVERED, CANCELLED, UNCOVERED]
    transitions:
      - from: REPORTED
        to: BACKFILL_PENDING
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/backfill-offers (selector finds a candidate)"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Creates BackfillAssignment OFFERED for the selector-chosen substitute"

      - from: REPORTED
        to: ESCALATED
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/backfill-offers (selector pool empty) OR POST /sped-staffing/absence-reports/{absenceId}/escalate"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: BACKFILL_PENDING
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/backfill-offers (retry after pool changes)"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Creates BackfillAssignment OFFERED; previously declined paras are excluded from the candidate pool"
        note: "Retry loop ESCALATED -> BACKFILL_PENDING"

      - from: BACKFILL_PENDING
        to: ESCALATED
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/escalate"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Any OFFERED backfill for this absence -> CANCELLED"

      - from: BACKFILL_PENDING
        to: COVERED
        trigger: "POST /sped-staffing/backfill-assignments/{backfillId}/accept"
        actor: Paraprofessional
        preconditions: []
        side_effects:
          - "Accepting backfill -> ACCEPTED; substitute weekly_scheduled_minutes += coverage_minutes; substitute benefit_eligible recomputed"

      - from: BACKFILL_PENDING
        to: CANCELLED
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Any OFFERED backfill for this absence -> CANCELLED"
          - "Coverage posture recomputed (may return to OPEN)"

      - from: REPORTED
        to: CANCELLED
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Coverage posture recomputed (may return to OPEN)"

      - from: ESCALATED
        to: CANCELLED
        trigger: "POST /sped-staffing/absence-reports/{absenceId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "Coverage posture recomputed (may return to OPEN)"

      - from: REPORTED
        to: UNCOVERED
        trigger: "system (CoveragePlan reconcile sweep)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BACKFILL_PENDING
        to: UNCOVERED
        trigger: "system (CoveragePlan reconcile sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Any OFFERED backfill -> CANCELLED"

      - from: ESCALATED
        to: UNCOVERED
        trigger: "system (CoveragePlan reconcile sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BackfillAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, CANCELLED, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /sped-staffing/backfill-assignments/{backfillId}/accept"
        actor: Paraprofessional
        preconditions:
          - "X-User-ID == substitute_para_id (ERR_BACKFILL_NOT_OWN)"
        side_effects:
          - "AbsenceReport -> COVERED"
          - "substitute.weekly_scheduled_minutes += coverage_minutes; substitute.benefit_eligible recomputed"
          - "Coverage posture recomputed (may return to OPEN)"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /sped-staffing/backfill-assignments/{backfillId}/decline"
        actor: Paraprofessional
        preconditions:
          - "X-User-ID == substitute_para_id (ERR_BACKFILL_NOT_OWN)"
        side_effects:
          - "substitute_para_id appended to absence.declined_para_ids"
          - "Absence stays BACKFILL_PENDING"

      - from: OFFERED
        to: CANCELLED
        trigger: "POST /sped-staffing/backfill-assignments/{backfillId}/cancel OR absence escalate/cancel/reconcile cascade"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /sped-staffing/backfill-assignments/{backfillId}/cancel"
        actor: SpecialEdCoordinator
        preconditions: []
        side_effects:
          - "substitute.weekly_scheduled_minutes -= coverage_minutes; substitute.benefit_eligible recomputed"
          - "AbsenceReport COVERED -> BACKFILL_PENDING (re-opened)"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (CoveragePlan reconcile sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TimesheetEntry
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sped-staffing/timesheets/{timesheetId}/submit"
        actor: Paraprofessional
        preconditions:
          - "X-User-ID == para_id (ERR_TIMESHEET_NOT_OWN)"
          - "Closed-interval overlap re-check vs other non-DRAFT entries for same para + work_date (ERR_TIMESHEET_OVERLAP)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sped-staffing/timesheets/{timesheetId}/approve"
        actor: BuildingAdministrator
        preconditions: []
        side_effects:
          - "Approved minutes feed the confirmed benefit variant and final allocation variant at plan close"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /sped-staffing/timesheets/{timesheetId}/reject"
        actor: BuildingAdministrator
        preconditions: []
        side_effects: []
        note: "Revision loop: rejected entries return to DRAFT for correction and resubmission"

  - entity: Evaluation
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, RESOLVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sped-staffing/evaluations/{evaluationId}/submit"
        actor: Teacher
        preconditions:
          - "X-User-ID == created_by_user_id (ERR_EVALUATION_NOT_OWN)"
        side_effects: []

      - from: SUBMITTED
        to: COUNTERSIGNED
        trigger: "POST /sped-staffing/evaluations/{evaluationId}/countersign"
        actor: BuildingAdministrator
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_EVALUATION_SELF_COUNTERSIGN — segregation of duties)"
        side_effects:
          - "countersigned_by_user_id := X-User-ID"

      - from: COUNTERSIGNED
        to: ACKNOWLEDGED
        trigger: "POST /sped-staffing/evaluations/{evaluationId}/acknowledge"
        actor: Paraprofessional
        preconditions:
          - "X-User-ID == para_id (ERR_EVALUATION_NOT_OWN)"
        side_effects: []

      - from: COUNTERSIGNED
        to: DISPUTED
        trigger: "POST /sped-staffing/evaluations/{evaluationId}/dispute"
        actor: Paraprofessional
        preconditions:
          - "X-User-ID == para_id (ERR_EVALUATION_NOT_OWN)"
        side_effects: []

      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /sped-staffing/evaluations/{evaluationId}/resolve"
        actor: BuildingAdministrator
        preconditions: []
        side_effects:
          - "resolution_note := request value"

  - entity: AllocationFormula
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /sped-staffing/allocation-formulas/{formulaId}/publish"
        actor: DistrictStaffingAdmin
        preconditions: []
        side_effects:
          - "Any other PUBLISHED formula for the same plan -> SUPERSEDED"

  - entity: FundingAllocation
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (plan close)"
        actor: system
        preconditions: []
        side_effects:
          - "final_amount_cents and variance_cents computed (chronological variant)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-plan
    parent_entity: StaffingPlan
    write_endpoint: "POST /sped-staffing/assignments"
    occ_field: "expected_plan_version"
    description: |
      Creating an Assignment against a StaffingPlan whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just mutated the plan (activation, another assignment
      create, close, etc.) and the current writer's budget view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: absence-create-stale-coverage-plan
    parent_entity: CoveragePlan
    write_endpoint: "POST /sped-staffing/absence-reports"
    occ_field: "expected_coverage_plan_version"
    description: |
      Creating an AbsenceReport against a CoveragePlan whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just published/reopened/locked the plan and the current
      writer's posture view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assignment_daily_cost
    trigger: "assignment creation; re-evaluated for non-activated (PROPOSED/QUALIFICATION_VERIFIED) assignments whenever the para's benefit_eligible flips; locked permanently at activation"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned — circular-looking dependency made explicit):
      1. projected_minutes = para.weekly_scheduled_minutes (current, ACTIVE assignments only)
             + this assignment's weekly_minutes
      2. eligible = projected_minutes >= plan.benefit_threshold_minutes
      3. effective_rate = base_wage_snapshot_cents
             + QUALIFICATION_DIFFERENTIAL[required_qualification_snapshot]
             + (SERVICE_STIPEND_ONE_TO_ONE if service_level_snapshot == ONE_TO_ONE else 0)
      4. if eligible: effective_rate = effective_rate * (1 + plan.benefit_surcharge_pct)
      5. daily_cost_cents = round_half_up((daily_end_minute - daily_start_minute) / 60 * effective_rate)
      ROUNDING ORDER (pinned): round each day FIRST, then sum for the week:
      6. projected_weekly_cost_cents = daily_cost_cents * len(days_of_week)
      Note: step 1 counts THIS assignment's own minutes toward the eligibility
      threshold even though this assignment's cost is what is being computed —
      eligibility is evaluated on the projected schedule INCLUDING self.
    input_set: "the assignment being costed; its para's current ACTIVE assignments"
    constants:
      QUALIFICATION_DIFFERENTIAL: { NONE: 0, BEHAVIOR_SUPPORT: 150, MEDICAL_DELEGATION: 200, SIGN_LANGUAGE: 250 }
      SERVICE_STIPEND_ONE_TO_ONE: 100
    precision: "integer cents, round_half_up per day"

  - name: weekly_benefit_eligibility
    trigger: "para.weekly_scheduled_minutes changes (assignment activate/suspend/resume/end, backfill accept/cancel); confirmed variant at plan close"
    algorithm: threshold
    formula: |
      provisional (stored on para.benefit_eligible):
        benefit_eligible = weekly_scheduled_minutes >= plan.benefit_threshold_minutes
        where weekly_scheduled_minutes = sum of weekly_minutes over ACTIVE assignments
             + coverage_minutes over ACCEPTED backfills whose absence_date falls in the
               current ISO week (Mon-Sun) of the logical clock
      confirmed (at plan close, chronological):
        for each ISO week W in [min assignment start_date, close date]:
          approved_minutes(W) = sum of minutes_worked over APPROVED TimesheetEntry
                                with work_date in W for this para
        confirmed_benefit_eligible = any week W with approved_minutes(W) >= threshold
        benefit_variance_cents = sum over weeks W where the para had at least one
          assignment ACTIVE during W AND approved_minutes(W) < threshold of
          (that assignment's locked projected_weekly_cost_cents
           minus the same weekly cost recomputed at the NON-surcharged effective rate)
        — i.e., only the surcharge component actually charged is clawed back;
        assignments costed while ineligible contribute 0.
    input_set: "provisional: ACTIVE assignments + current-week ACCEPTED backfills; confirmed: APPROVED timesheets only (DRAFT/SUBMITTED excluded)"
    constants: {}
    precision: "integer minutes; variance in integer cents, round_half_up"
    variants:
      - name: provisional
        when: "live operation — stored on para.benefit_eligible"
        difference: "counts scheduled minutes whether or not the work was later approved"
      - name: confirmed
        when: "plan close reconciliation"
        difference: "counts only APPROVED timesheet minutes; same week can be eligible provisionally and ineligible confirmed, producing a clawback variance"

  - name: building_allocation
    trigger: "POST /sped-staffing/funding-allocations/compute (provisional); plan close (final)"
    algorithm: forward_looking
    formula: |
      provisional_amount_cents (forward-looking, per building):
        S = students of the building with status in {REGISTERED, ACTIVE_IEP, SERVICE_CHANGE_PENDING}
            (EXITED excluded), using current iep_minutes_per_week and iep_service_level
        service_sum = sum over S of weight(level) * iep_minutes_per_week
        provisional = round_half_up(base_grant_cents
                        + service_sum * per_minute_rate_cents * formula.period_weeks)
                        * hardship_factor   -- note: grant+minutes rounded FIRST (exact integer
                        arithmetic until the single round), THEN hardship_factor applied and
                        the product rounded: final = round_half_up(raw * hardship_factor)
      final_amount_cents (chronological, per building, at plan close):
        minutes_by_student = sum of minutes_worked over APPROVED TimesheetEntry mapped via
                             assignment.student_id to students whose CURRENT building is this
                             building; each minute weighted by the student's CURRENT service
                             level weight
        final = round_half_up(base_grant_cents
                  + sum_over_students(minutes * weight(level)) * per_minute_rate_cents)
                  -- period_weeks NOT applied to actuals
                  -- then * hardship_factor, round_half_up once at the very end
      ROUNDING CONTRAST (pinned): this rule sums exact values and rounds ONCE at the end;
      assignment_daily_cost rounds PER DAY then sums. Identical underlying minutes therefore
      yield different cents across the two rules.
      variance_cents = final_amount_cents - provisional_amount_cents
    input_set: "provisional: students in {REGISTERED, ACTIVE_IEP, SERVICE_CHANGE_PENDING}; final: APPROVED timesheets only"
    constants: {}
    precision: "integer cents, round_half_up once at the end of each variant"
    variants:
      - name: provisional
        when: "compute endpoint"
        difference: "projects from IEP-minute entitlements and period_weeks"
      - name: final
        when: "plan close"
        difference: "replays actual approved minutes without period_weeks; provisional vs final diverge whenever service delivery deviates from entitlement"

  - name: backfill_selector
    trigger: "POST /sped-staffing/absence-reports/{absenceId}/backfill-offers"
    algorithm: constraint_propagation
    formula: |
      eligibility filter (candidate pool):
        - para.status == ACTIVE
        - para.id != absence.assignment.para_id
        - para.id NOT IN absence.declined_para_ids
        - para holds assignment.required_qualification_snapshot current at absence_date
          (completed_on <= absence_date, expires_on null or > absence_date, revoked=false);
          when snapshot == NONE every para satisfies this clause
        - no time conflict: para has no ACTIVE assignment whose days_of_week contains the
          absence weekday AND whose [daily_start_minute, daily_end_minute) violates the
          para_schedule_overlap rule against the absent assignment's window and buildings
        - para.weekly_scheduled_minutes + absence.absence_minutes
            <= para.contracted_max_weekly_minutes
      ranking expression (ascending, best first):
        1. weekly_scheduled_minutes ASC (least-loaded first)
        2. base_hourly_wage_cents ASC (cheapest first)
        3. hire_date ASC (earliest hire first)
        4. created_at ASC (final deterministic fallback; id NEVER used)
      selection: head of the ranking
      empty-pool fallback: no offer is created; absence -> ESCALATED
    input_set: "all Paraprofessionals of the plan"
    constants: {}
    precision: "n/a"

  - name: para_schedule_overlap
    trigger: "assignment creation and resume (against the para's other ACTIVE assignments)"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics with conditional travel buffer.
      For candidate window [s, e) on weekday set D at building B, and each existing ACTIVE
      assignment [s2, e2) with weekday set D2 at building B2 sharing at least one weekday:
        if B == B2:   conflict iff s < e2 AND s2 < e          (adjacency e == s2 is ALLOWED)
        if B != B2:   conflict iff s < e2 + BUFFER AND s2 < e + BUFFER
                      where BUFFER = plan.travel_buffer_minutes
                      (i.e., the gap between the windows must be >= BUFFER on BOTH sides)
    input_set: "para's ACTIVE assignments"
    constants: {}
    precision: "integer minutes"

  - name: timesheet_double_log_check
    trigger: "timesheet creation and submit"
    algorithm: interval_merge
    formula: |
      CLOSED interval semantics — touching endpoints count as conflict (deliberate contrast
      with the half-open assignment rule):
      for new entry [s, e] on (para, work_date), conflict exists iff there is another
      TimesheetEntry for the same para + work_date in state SUBMITTED or APPROVED with
      s <= e2 AND s2 <= e.
      DRAFT entries do not participate.
    input_set: "para's SUBMITTED/APPROVED timesheets for the same work_date"
    constants: {}
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body FK references exist (path left-to-right, then body)"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_BUILDING_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_PARAPROFESSIONAL_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_COVERAGE_PLAN_NOT_FOUND | ERR_ABSENCE_NOT_FOUND | ERR_BACKFILL_NOT_FOUND | ERR_TIMESHEET_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_FORMULA_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4a
    category: state
    check: "Plan is in a state allowing the operation (config writes need DRAFT or ACTIVE; assignment/coverage writes need ACTIVE; close needs RECONCILING)"
    error_id: "ERR_PLAN_NOT_ACTIVE | ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_RECONCILING"
    http_status: 409
    applies_to: "plan-gated endpoints"

  - priority: 4b
    category: state
    check: "Target entity is in the exact from-state the transition declares (absence create: coverage plan DRAFT -> ERR_COVERAGE_PLAN_NOT_PUBLISHED; LOCKED/RECONCILED -> ERR_COVERAGE_PLAN_FROZEN)"
    error_id: "ERR_ASSIGNMENT_INVALID_STATE | ERR_STUDENT_NOT_ASSIGNABLE | ERR_CHANGE_ORDER_INVALID_STATE | ERR_COVERAGE_PLAN_NOT_PUBLISHED | ERR_COVERAGE_PLAN_FROZEN | ERR_ABSENCE_INVALID_STATE | ERR_BACKFILL_INVALID_STATE | ERR_TIMESHEET_INVALID_STATE | ERR_EVALUATION_INVALID_STATE | ERR_FORMULA_NOT_PUBLISHED"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 4c
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sped-staffing/assignments, POST /sped-staffing/absence-reports"

  - priority: 5
    category: business_safety
    check: "Qualification currency: para holds required qualification, completed_on <= current date, expires_on null or > current date, not revoked"
    error_id: ERR_QUALIFICATION_NOT_CURRENT
    http_status: 422
    applies_to: "POST /sped-staffing/assignments, verify-qualifications, resume"

  - priority: 5b
    category: business_safety
    check: "Segregation of duties: countersigning user differs from evaluation creator"
    error_id: ERR_EVALUATION_SELF_COUNTERSIGN
    http_status: 403
    applies_to: "POST /sped-staffing/evaluations/{id}/countersign"

  - priority: 6a
    category: business_constraint
    check: "Schedule overlap: half-open conflict vs para's ACTIVE assignments incl. travel buffer across buildings"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /sped-staffing/assignments, resume"

  - priority: 6b
    category: business_constraint
    check: "Timesheet closed-interval double-logging vs SUBMITTED/APPROVED entries same para+date"
    error_id: ERR_TIMESHEET_OVERLAP
    http_status: 409
    applies_to: "POST /sped-staffing/timesheets, submit"

  - priority: 6c
    category: business_constraint
    check: "Uniqueness: (building_id, coverage_date) for coverage plans; one open SCO per student; one compute per (formula, period_label); building_code and student_ref and para email unique per plan"
    error_id: "ERR_DUPLICATE_COVERAGE_PLAN | ERR_OPEN_CHANGE_ORDER_EXISTS | ERR_ALLOCATIONS_ALREADY_COMPUTED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "creation endpoints as listed"

  - priority: 6d
    category: business_constraint
    check: "Weekly capacity: para.weekly_scheduled_minutes + new weekly_minutes <= contracted_max_weekly_minutes"
    error_id: ERR_WEEKLY_MINUTES_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /sped-staffing/assignments, resume"

  - priority: 7
    category: business_temporal
    check: "Date coherence: end_date >= start_date; daily_end_minute > daily_start_minute; absence weekday in days_of_week; timesheet work_date within assignment window; evaluation period_end >= period_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "endpoints carrying dates"

  - priority: 8
    category: business_referential
    check: "Aggregate gating: coverage lock/reopen requires posture OPEN; plan close requires no SUBMITTED timesheets and no non-RECONCILED coverage plans; plan activate requires >= 1 building"
    error_id: "ERR_COVERAGE_GAPS_OPEN | ERR_UNRESOLVED_TIMESHEETS | ERR_UNRECONCILED_COVERAGE_PLANS | ERR_PLAN_HAS_NO_BUILDINGS"
    http_status: 409
    applies_to: "coverage lock/reopen, plan close/activate"

  - priority: 9
    category: business_fiscal
    check: "Budget: plan.committed_cost_cents + candidate projected_weekly_cost_cents <= total_budget_cents - settled_cost_cents (fiscal checks run LAST)"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: "POST /sped-staffing/assignments, activate, resume"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never wall-clock time."
    roles: [DistrictStaffingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Lazy qualification expiry and posture recomputes observe the new clock value on subsequent reads/writes"]

  # --- StaffingPlan ---
  - method: POST
    path: "/sped-staffing/plans"
    description: "Create a staffing plan (DRAFT)"
    roles: [DistrictStaffingAdmin]
    code: 201
    input: [plan_name, school_year, total_budget_cents, "benefit_threshold_minutes?", "benefit_surcharge_pct?", "travel_buffer_minutes?"]
    output: StaffingPlan
    side_effects: ["committed_cost_cents=0, settled_cost_cents=0, cost_balance_cents=total_budget_cents"]

  - method: GET
    path: "/sped-staffing/plans"
    description: "List staffing plans"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "StaffingPlan[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/plans/{planId}"
    description: "Get one staffing plan"
    roles: [Any]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: []

  - method: POST
    path: "/sped-staffing/plans/{planId}/activate"
    description: "DRAFT -> ACTIVE (requires >= 1 building)"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["increments StaffingPlan.version by 1"]

  - method: POST
    path: "/sped-staffing/plans/{planId}/begin-reconciliation"
    description: "ACTIVE -> RECONCILING"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["increments StaffingPlan.version by 1"]

  - method: POST
    path: "/sped-staffing/plans/{planId}/reopen"
    description: "RECONCILING -> ACTIVE (revision loop)"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["increments StaffingPlan.version by 1"]

  - method: POST
    path: "/sped-staffing/plans/{planId}/close"
    description: "RECONCILING -> CLOSED; runs confirmed benefit variant, final allocation variant, settles costs"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: StaffingPlan
    side_effects:
      - "confirmed_benefit_eligible + benefit_variance_cents per para"
      - "final_amount_cents + variance_cents per FundingAllocation; FINALIZED"
      - "settled_cost_cents posted; ACTIVE/SUSPENDED assignments ENDED (PLAN_CLOSED)"
      - "increments StaffingPlan.version by 1"

  # --- Building ---
  - method: POST
    path: "/sped-staffing/buildings"
    description: "Create a building (plan DRAFT or ACTIVE)"
    roles: [DistrictStaffingAdmin]
    code: 201
    input: [plan_id, name, building_code, "hardship_factor?"]
    output: Building
    side_effects: []

  - method: GET
    path: "/sped-staffing/buildings"
    description: "List buildings"
    roles: [Any]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "Building[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/buildings/{buildingId}"
    description: "Get one building"
    roles: [Any]
    code: 200
    input: []
    output: Building
    side_effects: []

  # --- Student ---
  - method: POST
    path: "/sped-staffing/students"
    description: "Register a student (plan DRAFT or ACTIVE); initial status REGISTERED"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [plan_id, building_id, student_ref, iep_service_level, iep_minutes_per_week, "required_qualification?"]
    output: Student
    side_effects: []

  - method: GET
    path: "/sped-staffing/students"
    description: "List students"
    roles: [Any]
    code: 200
    input: ["plan_id?", "building_id?", "status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/students/{studentId}"
    description: "Get one student"
    roles: [Any]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/sped-staffing/students/{studentId}/activate-iep"
    description: "REGISTERED -> ACTIVE_IEP"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- ServiceChangeOrder ---
  - method: POST
    path: "/sped-staffing/service-change-orders"
    description: "File a service change order (student ACTIVE_IEP, no other open order); student -> SERVICE_CHANGE_PENDING"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [student_id, change_type, "new_minutes_per_week?", "new_required_qualification?", "new_building_id?", reason]
    output: ServiceChangeOrder
    side_effects: ["Student -> SERVICE_CHANGE_PENDING"]

  - method: GET
    path: "/sped-staffing/service-change-orders"
    description: "List service change orders"
    roles: [Any]
    code: 200
    input: ["plan_id?", "student_id?", "new_building_id?", "status?", "limit?", "offset?"]
    output: "ServiceChangeOrder[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/service-change-orders/{orderId}"
    description: "Get one service change order"
    roles: [Any]
    code: 200
    input: []
    output: ServiceChangeOrder
    side_effects: []

  - method: POST
    path: "/sped-staffing/service-change-orders/{orderId}/approve"
    description: "FILED -> APPROVED"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: ServiceChangeOrder
    side_effects: []

  - method: POST
    path: "/sped-staffing/service-change-orders/{orderId}/return"
    description: "APPROVED -> FILED (revision loop)"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: ServiceChangeOrder
    side_effects: []

  - method: POST
    path: "/sped-staffing/service-change-orders/{orderId}/effectuate"
    description: "APPROVED -> EFFECTIVE; applies student field changes and ends assignments with the 3-hop cascade"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceChangeOrder
    side_effects: ["Student ACTIVE_IEP (or EXITED for EXIT); assignments ENDED; benefit/cost cascade hops 1-3"]

  - method: POST
    path: "/sped-staffing/service-change-orders/{orderId}/cancel"
    description: "FILED|APPROVED -> CANCELLED; student back to ACTIVE_IEP"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: ServiceChangeOrder
    side_effects: ["Student -> ACTIVE_IEP"]

  # --- Paraprofessional ---
  - method: POST
    path: "/sped-staffing/paraprofessionals"
    description: "Create a paraprofessional (plan DRAFT or ACTIVE); initial ACTIVE"
    roles: [DistrictStaffingAdmin]
    code: 201
    input: [plan_id, home_building_id, full_name, email, base_hourly_wage_cents, contracted_max_weekly_minutes, hire_date]
    output: Paraprofessional
    side_effects: ["qualifications=[], weekly_scheduled_minutes=0, benefit_eligible=false"]

  - method: GET
    path: "/sped-staffing/paraprofessionals"
    description: "List paraprofessionals"
    roles: [Any]
    code: 200
    input: ["plan_id?", "home_building_id?", "status?", "limit?", "offset?"]
    output: "Paraprofessional[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/paraprofessionals/{paraId}"
    description: "Get one paraprofessional"
    roles: [Any]
    code: 200
    input: []
    output: Paraprofessional
    side_effects: []

  - method: POST
    path: "/sped-staffing/paraprofessionals/{paraId}/set-status"
    description: "Set para status ACTIVE | ON_LEAVE | SEPARATED per state machine"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: [status]
    output: Paraprofessional
    side_effects: ["SEPARATED ends all non-ENDED assignments with release cascade"]

  - method: POST
    path: "/sped-staffing/paraprofessionals/{paraId}/qualifications"
    description: "Record completed training: append {qualification, completed_on, expires_on?, revoked=false}"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: [qualification, completed_on, "expires_on?"]
    output: Paraprofessional
    side_effects: ["Qualification appended to qualifications array"]

  - method: POST
    path: "/sped-staffing/paraprofessionals/{paraId}/qualifications/revoke"
    description: "Revoke a qualification; cascades suspension of ACTIVE assignments requiring it"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: [qualification]
    output: Paraprofessional
    side_effects:
      - "qualification entry revoked=true"
      - "ACTIVE assignments of this para whose required_qualification_snapshot equals it -> SUSPENDED (release cascade)"
      - "for each such assignment, if the current logical weekday is in its days_of_week and a PUBLISHED coverage plan exists for (assignment.building_id, current date), an AbsenceReport is auto-created (REPORTED) and the coverage plan's posture recomputed"

  # --- Assignment ---
  - method: POST
    path: "/sped-staffing/assignments"
    description: "Propose an IEP-mandated assignment (plan ACTIVE; OCC on plan version)"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [plan_id, student_id, para_id, building_id, start_date, end_date, days_of_week, daily_start_minute, daily_end_minute, expected_plan_version]
    output: Assignment
    side_effects:
      - "snapshots service level / qualification / wage; computes weekly_minutes, daily_cost_cents, projected_weekly_cost_cents"
      - "plan.committed_cost_cents += projected_weekly_cost_cents"
      - "increments StaffingPlan.version by 1"

  - method: GET
    path: "/sped-staffing/assignments"
    description: "List assignments"
    roles: [Any]
    code: 200
    input: ["plan_id?", "student_id?", "para_id?", "building_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/assignments/{assignmentId}"
    description: "Get one assignment"
    roles: [Any]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/sped-staffing/assignments/{assignmentId}/verify-qualifications"
    description: "PROPOSED -> QUALIFICATION_VERIFIED (re-checks qualification currency)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/sped-staffing/assignments/{assignmentId}/activate"
    description: "QUALIFICATION_VERIFIED -> ACTIVE (student gate + funding gate; locks daily cost)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["daily_cost locked", "funding_status -> FUNDED (or UNFUNDED on gate failure)", "para weekly minutes + benefit recompute"]

  - method: POST
    path: "/sped-staffing/assignments/{assignmentId}/suspend"
    description: "ACTIVE -> SUSPENDED (releases weekly minutes and committed cost)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["para weekly minutes released", "plan.committed_cost_cents released", "funding_status unchanged"]

  - method: POST
    path: "/sped-staffing/assignments/{assignmentId}/resume"
    description: "SUSPENDED -> ACTIVE (re-runs qualification, overlap, cap, budget checks)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["para weekly minutes re-added", "plan.committed_cost_cents re-added"]

  - method: POST
    path: "/sped-staffing/assignments/{assignmentId}/end"
    description: "Any non-terminal state -> ENDED (end_reason COORDINATOR_ENDED)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["release minutes + committed as applicable", "funding_status -> SETTLED"]

  # --- CoveragePlan ---
  - method: POST
    path: "/sped-staffing/coverage-plans"
    description: "Create a daily coverage plan for a building (plan ACTIVE); unique (building_id, coverage_date)"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [plan_id, building_id, coverage_date]
    output: CoveragePlan
    side_effects: ["coverage_posture=OPEN"]

  - method: GET
    path: "/sped-staffing/coverage-plans"
    description: "List coverage plans"
    roles: [Any]
    code: 200
    input: ["plan_id?", "building_id?", "coverage_date?", "status?", "limit?", "offset?"]
    output: "CoveragePlan[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/coverage-plans/{coveragePlanId}"
    description: "Get one coverage plan"
    roles: [Any]
    code: 200
    input: []
    output: CoveragePlan
    side_effects: []

  - method: POST
    path: "/sped-staffing/coverage-plans/{coveragePlanId}/publish"
    description: "DRAFT -> PUBLISHED"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: CoveragePlan
    side_effects: ["increments CoveragePlan.version by 1"]

  - method: POST
    path: "/sped-staffing/coverage-plans/{coveragePlanId}/reopen"
    description: "PUBLISHED -> DRAFT (requires posture OPEN)"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: CoveragePlan
    side_effects: ["increments CoveragePlan.version by 1"]

  - method: POST
    path: "/sped-staffing/coverage-plans/{coveragePlanId}/lock"
    description: "PUBLISHED -> LOCKED (requires posture OPEN); posture -> FROZEN"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: CoveragePlan
    side_effects: ["coverage_posture -> FROZEN", "increments CoveragePlan.version by 1"]

  - method: POST
    path: "/sped-staffing/coverage-plans/{coveragePlanId}/reconcile"
    description: "LOCKED -> RECONCILED; sweeps linked absences/backfills to terminal states"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: CoveragePlan
    side_effects: ["absences REPORTED/BACKFILL_PENDING/ESCALATED -> UNCOVERED; backfills OFFERED -> CANCELLED, ACCEPTED -> COMPLETED", "increments CoveragePlan.version by 1"]

  # --- AbsenceReport ---
  - method: POST
    path: "/sped-staffing/absence-reports"
    description: "Report an absence against an ACTIVE assignment; resolves the PUBLISHED coverage plan for (building, date); OCC on coverage plan version"
    roles: [Teacher, Paraprofessional]
    code: 201
    input: [assignment_id, absence_date, expected_coverage_plan_version, reason]
    output: AbsenceReport
    side_effects:
      - "coverage posture recomputed (OPEN -> GAPS_OPEN)"
      - "increments CoveragePlan.version by 1"
      - "Paraprofessional creators must own the assignment (X-User-ID == assignment.para_id, ERR_ABSENCE_NOT_OWN)"

  - method: GET
    path: "/sped-staffing/absence-reports"
    description: "List absence reports"
    roles: [Any]
    code: 200
    input: ["plan_id?", "assignment_id?", "coverage_plan_id?", "status?", "limit?", "offset?"]
    output: "AbsenceReport[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/absence-reports/{absenceId}"
    description: "Get one absence report"
    roles: [Any]
    code: 200
    input: []
    output: AbsenceReport
    side_effects: []

  - method: POST
    path: "/sped-staffing/absence-reports/{absenceId}/escalate"
    description: "REPORTED|BACKFILL_PENDING -> ESCALATED; cancels any OFFERED backfill"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: AbsenceReport
    side_effects: ["OFFERED backfill -> CANCELLED"]

  - method: POST
    path: "/sped-staffing/absence-reports/{absenceId}/cancel"
    description: "REPORTED|BACKFILL_PENDING|ESCALATED -> CANCELLED; cancels any OFFERED backfill"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: AbsenceReport
    side_effects: ["OFFERED backfill -> CANCELLED", "coverage posture recomputed"]

  - method: POST
    path: "/sped-staffing/absence-reports/{absenceId}/backfill-offers"
    description: "Run the backfill selector; from REPORTED or ESCALATED. Success: absence -> BACKFILL_PENDING + OFFERED backfill created. Empty pool: absence -> ESCALATED, no offer."
    roles: [SpecialEdCoordinator]
    code: 201
    input: []
    output: AbsenceReport
    side_effects: ["BackfillAssignment OFFERED created when pool non-empty", "declined paras excluded from the pool"]

  # --- BackfillAssignment ---
  - method: GET
    path: "/sped-staffing/backfill-assignments"
    description: "List backfill assignments"
    roles: [Any]
    code: 200
    input: ["plan_id?", "absence_id?", "substitute_para_id?", "status?", "limit?", "offset?"]
    output: "BackfillAssignment[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/backfill-assignments/{backfillId}"
    description: "Get one backfill assignment"
    roles: [Any]
    code: 200
    input: []
    output: BackfillAssignment
    side_effects: []

  - method: POST
    path: "/sped-staffing/backfill-assignments/{backfillId}/accept"
    description: "OFFERED -> ACCEPTED (substitute self only)"
    roles: [Paraprofessional]
    code: 200
    input: []
    output: BackfillAssignment
    side_effects: ["absence -> COVERED", "substitute weekly minutes += coverage_minutes", "coverage posture recomputed"]

  - method: POST
    path: "/sped-staffing/backfill-assignments/{backfillId}/decline"
    description: "OFFERED -> DECLINED (substitute self only); records decline for selector exclusion"
    roles: [Paraprofessional]
    code: 200
    input: []
    output: BackfillAssignment
    side_effects: ["substitute_para_id appended to absence.declined_para_ids"]

  - method: POST
    path: "/sped-staffing/backfill-assignments/{backfillId}/cancel"
    description: "OFFERED|ACCEPTED -> CANCELLED; ACCEPTED cancel re-opens absence and reverts substitute minutes"
    roles: [SpecialEdCoordinator]
    code: 200
    input: []
    output: BackfillAssignment
    side_effects: ["if ACCEPTED: absence COVERED -> BACKFILL_PENDING and substitute minutes reverted"]

  # --- TimesheetEntry ---
  - method: POST
    path: "/sped-staffing/timesheets"
    description: "Para logs a work interval (plan ACTIVE; own assignments only); DRAFT"
    roles: [Paraprofessional]
    code: 201
    input: [assignment_id, work_date, start_minute, end_minute]
    output: TimesheetEntry
    side_effects: ["minutes_worked computed", "closed-interval overlap check vs SUBMITTED/APPROVED entries"]

  - method: GET
    path: "/sped-staffing/timesheets"
    description: "List timesheets"
    roles: [Any]
    code: 200
    input: ["plan_id?", "para_id?", "assignment_id?", "status?", "limit?", "offset?"]
    output: "TimesheetEntry[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/timesheets/{timesheetId}"
    description: "Get one timesheet"
    roles: [Any]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: []

  - method: POST
    path: "/sped-staffing/timesheets/{timesheetId}/submit"
    description: "DRAFT -> SUBMITTED (own only; overlap re-check)"
    roles: [Paraprofessional]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: []

  - method: POST
    path: "/sped-staffing/timesheets/{timesheetId}/approve"
    description: "SUBMITTED -> APPROVED (plan ACTIVE or RECONCILING)"
    roles: [BuildingAdministrator]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: ["approved minutes feed confirmed benefit variant and final allocation variant"]

  - method: POST
    path: "/sped-staffing/timesheets/{timesheetId}/reject"
    description: "SUBMITTED -> DRAFT (bounce-back revision loop; plan ACTIVE or RECONCILING)"
    roles: [BuildingAdministrator]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: []

  # --- Evaluation ---
  - method: POST
    path: "/sped-staffing/evaluations"
    description: "Teacher authors an evaluation of a para (plan ACTIVE; DRAFT)"
    roles: [Teacher]
    code: 201
    input: [plan_id, para_id, period_start, period_end, professionalism_score, instructional_support_score, comments]
    output: Evaluation
    side_effects: ["created_by_user_id := X-User-ID"]

  - method: GET
    path: "/sped-staffing/evaluations"
    description: "List evaluations"
    roles: [Any]
    code: 200
    input: ["plan_id?", "para_id?", "status?", "limit?", "offset?"]
    output: "Evaluation[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/evaluations/{evaluationId}"
    description: "Get one evaluation"
    roles: [Any]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/sped-staffing/evaluations/{evaluationId}/submit"
    description: "DRAFT -> SUBMITTED (author only)"
    roles: [Teacher]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/sped-staffing/evaluations/{evaluationId}/countersign"
    description: "SUBMITTED -> COUNTERSIGNED (segregation of duties: countersigner != author)"
    roles: [BuildingAdministrator]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["countersigned_by_user_id := X-User-ID"]

  - method: POST
    path: "/sped-staffing/evaluations/{evaluationId}/acknowledge"
    description: "COUNTERSIGNED -> ACKNOWLEDGED (the evaluated para only)"
    roles: [Paraprofessional]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/sped-staffing/evaluations/{evaluationId}/dispute"
    description: "COUNTERSIGNED -> DISPUTED (the evaluated para only)"
    roles: [Paraprofessional]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/sped-staffing/evaluations/{evaluationId}/resolve"
    description: "DISPUTED -> RESOLVED"
    roles: [BuildingAdministrator]
    code: 200
    input: [resolution_note]
    output: Evaluation
    side_effects: []

  # --- AllocationFormula ---
  - method: POST
    path: "/sped-staffing/allocation-formulas"
    description: "Create a formula version for a plan (plan DRAFT or ACTIVE)"
    roles: [DistrictStaffingAdmin]
    code: 201
    input: [plan_id, base_grant_cents, per_minute_rate_cents, weight_one_to_one, weight_shared_support, weight_transitional, period_weeks]
    output: AllocationFormula
    side_effects: ["version_no = max(existing for plan) + 1"]

  - method: GET
    path: "/sped-staffing/allocation-formulas"
    description: "List allocation formulas"
    roles: [Any]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: "AllocationFormula[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/allocation-formulas/{formulaId}"
    description: "Get one allocation formula"
    roles: [Any]
    code: 200
    input: []
    output: AllocationFormula
    side_effects: []

  - method: POST
    path: "/sped-staffing/allocation-formulas/{formulaId}/publish"
    description: "DRAFT -> PUBLISHED; supersedes any other PUBLISHED formula of the plan"
    roles: [DistrictStaffingAdmin]
    code: 200
    input: []
    output: AllocationFormula
    side_effects: ["prior PUBLISHED formula of the plan -> SUPERSEDED"]

  # --- FundingAllocation ---
  - method: POST
    path: "/sped-staffing/funding-allocations/compute"
    description: "Compute provisional allocations: one FundingAllocation per building pinned to a PUBLISHED formula version (plan ACTIVE)"
    roles: [DistrictStaffingAdmin]
    code: 201
    input: [formula_id, period_label]
    output: "FundingAllocation[]"
    side_effects: ["one row per building of the plan; provisional_amount_cents per calculations.building_allocation"]

  - method: GET
    path: "/sped-staffing/funding-allocations"
    description: "List funding allocations"
    roles: [Any]
    code: 200
    input: ["plan_id?", "building_id?", "formula_id?", "status?", "limit?", "offset?"]
    output: "FundingAllocation[]"
    side_effects: []

  - method: GET
    path: "/sped-staffing/funding-allocations/{allocationId}"
    description: "Get one funding allocation"
    roles: [Any]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "StaffingPlan id does not exist" }
  - { id: ERR_BUILDING_NOT_FOUND, http: 404, condition: "Building id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not exist" }
  - { id: ERR_PARAPROFESSIONAL_NOT_FOUND, http: 404, condition: "Paraprofessional id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Assignment id does not exist" }
  - { id: ERR_COVERAGE_PLAN_NOT_FOUND, http: 404, condition: "CoveragePlan id does not exist" }
  - { id: ERR_ABSENCE_NOT_FOUND, http: 404, condition: "AbsenceReport id does not exist" }
  - { id: ERR_BACKFILL_NOT_FOUND, http: 404, condition: "BackfillAssignment id does not exist" }
  - { id: ERR_TIMESHEET_NOT_FOUND, http: 404, condition: "TimesheetEntry id does not exist" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "Evaluation id does not exist" }
  - { id: ERR_FORMULA_NOT_FOUND, http: 404, condition: "AllocationFormula id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "FundingAllocation id does not exist" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "ServiceChangeOrder id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or per-plan uniqueness of building_code/student_ref/email violated" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires plan ACTIVE (or DRAFT|ACTIVE for config writes)" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Plan lifecycle operation requires DRAFT (activate)" }
  - { id: ERR_PLAN_NOT_RECONCILING, http: 409, condition: "close/reopen require plan RECONCILING" }
  - { id: ERR_PLAN_HAS_NO_BUILDINGS, http: 409, condition: "activate requires at least one building" }
  - { id: ERR_STUDENT_NOT_ASSIGNABLE, http: 409, condition: "Operation requires student ACTIVE_IEP (blocked during SERVICE_CHANGE_PENDING or after EXITED)" }
  - { id: ERR_OPEN_CHANGE_ORDER_EXISTS, http: 409, condition: "Student already has a FILED or APPROVED service change order" }
  - { id: ERR_CHANGE_ORDER_INVALID_STATE, http: 409, condition: "Change-order transition attempted from a state that does not allow it" }
  - { id: ERR_QUALIFICATION_NOT_CURRENT, http: 422, condition: "Para lacks the required qualification, or it is expired/revoked/not yet completed at the relevant date" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "Half-open time conflict with a para's ACTIVE assignment, or cross-building gap below travel_buffer_minutes" }
  - { id: ERR_WEEKLY_MINUTES_CAP_EXCEEDED, http: 422, condition: "Adding the assignment would push weekly_scheduled_minutes above contracted_max_weekly_minutes" }
  - { id: ERR_INSUFFICIENT_BUDGET, http: 402, condition: "committed + candidate cost would exceed total_budget - settled" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment transition attempted from a state that does not allow it" }
  - { id: ERR_DUPLICATE_COVERAGE_PLAN, http: 409, condition: "A coverage plan already exists for (building_id, coverage_date)" }
  - { id: ERR_COVERAGE_PLAN_NOT_PUBLISHED, http: 409, condition: "Absence reporting requires a PUBLISHED coverage plan for the assignment's building and date" }
  - { id: ERR_COVERAGE_PLAN_FROZEN, http: 409, condition: "Coverage plan is LOCKED/RECONCILED; mutation forbidden" }
  - { id: ERR_COVERAGE_GAPS_OPEN, http: 409, condition: "lock/reopen blocked: linked absences in REPORTED/BACKFILL_PENDING/ESCALATED" }
  - { id: ERR_ABSENCE_INVALID_STATE, http: 409, condition: "Absence transition attempted from a state that does not allow it" }
  - { id: ERR_ABSENCE_NOT_OWN, http: 403, condition: "Paraprofessional reporting an absence for an assignment that is not theirs" }
  - { id: ERR_BACKFILL_INVALID_STATE, http: 409, condition: "Backfill transition attempted from a state that does not allow it" }
  - { id: ERR_BACKFILL_NOT_OWN, http: 403, condition: "accept/decline by a para who is not the offered substitute" }
  - { id: ERR_TIMESHEET_INVALID_STATE, http: 409, condition: "Timesheet transition attempted from a state that does not allow it" }
  - { id: ERR_TIMESHEET_OVERLAP, http: 409, condition: "Closed-interval double-logging against a SUBMITTED/APPROVED entry for the same para and work_date" }
  - { id: ERR_TIMESHEET_NOT_OWN, http: 403, condition: "Timesheet create/submit by a para other than the owning para" }
  - { id: ERR_EVALUATION_INVALID_STATE, http: 409, condition: "Evaluation transition attempted from a state that does not allow it" }
  - { id: ERR_EVALUATION_NOT_OWN, http: 403, condition: "submit by non-author teacher, or acknowledge/dispute by a different para" }
  - { id: ERR_EVALUATION_SELF_COUNTERSIGN, http: 403, condition: "Countersigning administrator's X-User-ID equals the authoring teacher's (segregation of duties)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_FORMULA_NOT_PUBLISHED, http: 409, condition: "compute requires the formula PUBLISHED" }
  - { id: ERR_ALLOCATIONS_ALREADY_COMPUTED, http: 409, condition: "Allocations already exist for (formula_id, period_label)" }
  - { id: ERR_UNRECONCILED_COVERAGE_PLANS, http: 409, condition: "Plan close blocked: a coverage plan is not RECONCILED" }
  - { id: ERR_UNRESOLVED_TIMESHEETS, http: 409, condition: "Plan close blocked: a timesheet is SUBMITTED" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end before start, non-positive durations, weekday mismatch, or date outside the allowed window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictStaffingAdmin
    description: "District staffing administrator: owns plans, buildings, para roster, formulas, allocations, SCO approval, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sped-staffing/plans and all /plans/{id}/activate|begin-reconciliation|reopen|close"
      - "POST /sped-staffing/buildings"
      - "POST /sped-staffing/paraprofessionals incl. set-status and qualifications (add/revoke)"
      - "POST /sped-staffing/allocation-formulas incl. publish"
      - "POST /sped-staffing/funding-allocations/compute"
      - "POST /sped-staffing/service-change-orders/{id}/approve|return"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints (via Any)"

  - name: SpecialEdCoordinator
    description: "Special education coordinator: owns students, change-order filing/effectuation, assignments, coverage plans, absence escalation, backfill offers"
    identity: opaque
    exclusive_operations:
      - "POST /sped-staffing/students incl. activate-iep"
      - "POST /sped-staffing/service-change-orders incl. effectuate and cancel"
      - "POST /sped-staffing/assignments incl. verify-qualifications/activate/suspend/resume/end"
      - "POST /sped-staffing/coverage-plans incl. publish/reopen/lock/reconcile"
      - "POST /sped-staffing/absence-reports/{id}/escalate|cancel|backfill-offers"
      - "POST /sped-staffing/backfill-assignments/{id}/cancel"
    shared_operations:
      - "all GET endpoints (via Any)"

  - name: BuildingAdministrator
    description: "Building administrator: approves timesheets, countersigns and resolves evaluations"
    identity: opaque
    exclusive_operations:
      - "POST /sped-staffing/timesheets/{id}/approve|reject"
      - "POST /sped-staffing/evaluations/{id}/countersign|resolve"
    shared_operations:
      - "all GET endpoints (via Any)"

  - name: Teacher
    description: "Supervising teacher: reports absences, authors and submits evaluations"
    identity: opaque
    exclusive_operations:
      - "POST /sped-staffing/evaluations incl. submit"
    shared_operations:
      - "POST /sped-staffing/absence-reports (shared with Paraprofessional)"
      - "all GET endpoints (via Any)"

  - name: Paraprofessional
    description: "Support staff member: reports own absences, logs and submits own timesheets, answers own backfill offers, acknowledges or disputes own evaluations"
    identity: "entity_backed:Paraprofessional"
    exclusive_operations:
      - "POST /sped-staffing/timesheets incl. submit (own records only)"
      - "POST /sped-staffing/backfill-assignments/{id}/accept|decline (own offers only)"
      - "POST /sped-staffing/evaluations/{id}/acknowledge|dispute (own evaluations only)"
    shared_operations:
      - "POST /sped-staffing/absence-reports (own assignments only; shared with Teacher)"
      - "all GET endpoints (via Any)"

  - name: Any
    description: "Read-only aggregate role granted to every authenticated caller"
    identity: opaque
    shared_operations:
      - "GET /sped-staffing/* (all list and detail endpoints)"
