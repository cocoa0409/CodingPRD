            - { call: "POST /network/invoices/${inv}/certify", payload: {}, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /network/invoices/${inv}/make-goods", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { mg: "$.data.id" } }
          trigger:
            - { call: "POST /network/make-goods/${mg}/review", payload: { decision: APPROVE }, as: Auditor, as_user_id: "aud-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /network/make-goods/${mg}/review", payload: { decision: APPROVE }, as: Auditor, as_user_id: "aud-2", captures: { st_ok: "$.data.credit_status" } }
