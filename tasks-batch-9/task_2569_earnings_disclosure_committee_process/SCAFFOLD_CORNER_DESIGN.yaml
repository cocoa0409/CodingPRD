              captures: { doc_v3: $.data.version }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Operating expenses", reported_value: 3000000, source_record_value: 3000000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v3}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { item2_id: $.data.id, item2_status: $.data.status }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_status_after_item: $.data.status, gate_tie_out: $.data.tie_out_status, total_after: $.data.tie_out_total_variance_bp }
            # ---- admitted on an APPROVED document: tie-out review ----
            - call: "POST /disclosure/tie-out-items/${item2_id}/review"
              payload: { reviewer_member_id: "${fin2_id}", decision: "WAIVE" }
              as: Controller
              as_user_id: "${fin2_id}"
              captures: { item2_status_2: $.data.status }
            # ---- refused on an APPROVED document: measure create ----
            - call: "POST /disclosure/documents/${doc_id}/adjusted-measures"
              payload: { measure_label: "Adjusted operating margin", adjusted_value: 400000, comparable_gaap_value: 350000, reconciliation_items: [{ label: "Restructuring", amount: 50000 }], adjusted_prominence_index: 3, gaap_prominence_index: 1 }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 409, error_id: ERR_INVALID_STATE }
            # ---- refused on an APPROVED document: measure reconcile ----
            - call: "POST /disclosure/adjusted-measures/${measure_id}/reconcile"
              payload: { adjusted_prominence_index: 1, gaap_prominence_index: 2 }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 409, error_id: ERR_INVALID_STATE }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_status_final: $.data.status, gate_final: $.data.measure_gate_status }
          assert:
            - "${measure_status_1} == DRAFT and ${gate_1} == BLOCKED_RECONCILIATION"
            - "${measure_sum} == 200000.00 and ${measure_gap} == 0.00 and ${measure_prom} == true and ${measure_status_2} == RECONCILED"
            - "${gate_2} == CLEARED and ${doc_status_approved} == APPROVED"
            - "${item2_status} == MATCHED and ${doc_status_after_item} == APPROVED and ${gate_tie_out} == PASSED and ${total_after} == 0"
            - "${item2_status_2} == WAIVED"
            - "the adjusted-measure create on the APPROVED document returns 409 ERR_INVALID_STATE"
            - "the reconcile on the APPROVED document returns 409 ERR_INVALID_STATE"
            - "${doc_status_final} == APPROVED and ${gate_final} == CLEARED"
          notes: |
            The refused reconcile deliberately supplies prominence indices that WOULD flip the measure to
            PROMINENCE_FAILED (gaap 2 > adjusted 1), so the assertion that measure_gate_status is still
            CLEARED at the end proves the request was rejected before any recomputation, not merely
            reported as an error afterwards. Both admitted legs keep tie_out_status PASSED — the added
            line has zero variance — so the HOP 3 cascade never fires and the document stays APPROVED,
            isolating the claim to the parent-state gate.

  # ===================================================================
  # SECTION 6 — ERRORS (§1.6)
  # The guide's Table 6 rule is a coverage rule, not a pattern table: "verify every
  # error code is triggerable". All 57 catalog codes are accounted for as follows.
  #
  # Already triggered by a §1.8 instance:
  #   ERR_MEMBER_SEAT_INVALID, ERR_SOD_SELF_REVIEW, ERR_MILESTONE_WINDOW_OVERLAP,
  #   ERR_MILESTONE_BUFFER_VIOLATION, ERR_MILESTONE_PAST_DEADLINE, ERR_INVALID_STATE,
  #   ERR_ENTITY_TERMINAL, ERR_CERT_SCOPE_EMPTY, ERR_CERT_COVERAGE_INSUFFICIENT,
  #   ERR_TIE_OUT_NOT_PASSED, ERR_MEASURE_NOT_RECONCILED, ERR_MEASURE_PROMINENCE,
  #   ERR_MEMBER_PREP_WINDOW_CAPACITY, ERR_OPEN_MATERIAL_EVENT, ERR_INVALID_REQUEST,
  #   ERR_FILING_DOCUMENT_INVALID, ERR_EVENT_DETERMINATION_CONFLICT,
  #   ERR_DEFICIENCY_ALREADY_MITIGATED.
  # Already triggered by an earlier §1.9 section:
  #   ERR_CHARTER_NOT_FOUND / ERR_MEMBER_NOT_FOUND / ERR_CYCLE_NOT_FOUND /
  #   ERR_SUBCERT_NOT_FOUND / ERR_DOCUMENT_NOT_FOUND / ERR_FILING_NOT_FOUND (entities),
  #   ERR_QUORUM_NOT_MET / ERR_FUNCTION_COVERAGE_GAP / ERR_SUCCESSOR_CHARTER_INVALID
  #   (state_machines), ERR_CHARTER_NOT_ADOPTED / ERR_SUBCERT_DUE_OUT_OF_WINDOW /
  #   ERR_SAFE_HARBOR_MISSING / ERR_QA_ITEM_UNCLEARED / ERR_MEMBER_CHARTER_MISMATCH /
  #   ERR_DUPLICATE_CERTIFICATION (validations, endpoints).
  # Deferred to a later §1.9 section by design:
  #   ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_MEMBER_FUNCTION_MISMATCH and
  #   ERR_ROLE_ACTION_MISMATCH belong to `rbac`; ERR_STALE_CYCLE_VERSION and
  #   ERR_STALE_DOCUMENT_VERSION belong to `cross_cutting_complexity_layers`.
  # The instances below close the remaining gap.
  # ===================================================================
  - section: errors
    instances:

      - name: every_remaining_path_parameter_reports_its_own_not_found_code
        claim_type: error_triggerability
        grounds:
          - validations[priority=6]
          - errors[ERR_MILESTONE_NOT_FOUND]
          - errors[ERR_OFFICER_CERT_NOT_FOUND]
          - errors[ERR_TIE_OUT_ITEM_NOT_FOUND]
          - errors[ERR_MEASURE_NOT_FOUND]
          - errors[ERR_QA_ITEM_NOT_FOUND]
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_CORRECTION_NOT_FOUND]
          - errors[ERR_DEFICIENCY_NOT_FOUND]
        distinguishing_aspect: |
          §1.4 priority 6 demands the *_NOT_FOUND variant OF THE FAILING SEGMENT, so a single generic 404
          is not acceptable. The eight entity types whose 404 code is not already exercised by the
          entities-section not_found instance are each probed on a real endpoint — three of them through
          a mutation, because §1.5 declares no GET-by-id for Milestone, AdjustedMeasure, QandAItem or
          ControlDeficiency. The probes are also arranged so the 404 must beat every later check: the
          mitigate call carries a well-formed remediation_note and the clear call a well-formed
          clearance_note, so nothing but the missing row can explain the response.
        test_recipe:
          setup:
            - "A charter with one FINANCE and one LEGAL voting member, left in DRAFT: none of these probes reaches a state check, so adoption is unnecessary."
            - "All identifiers below are syntactically valid UUIDs that match no row."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Probe Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
          trigger:
            - call: "POST /disclosure/milestones/00000000-0000-4000-8000-000000000101/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 404, error_id: ERR_MILESTONE_NOT_FOUND }
            - call: "GET /disclosure/officer-certifications/00000000-0000-4000-8000-000000000102"
              payload: {}
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_OFFICER_CERT_NOT_FOUND }
            - call: "GET /disclosure/tie-out-items/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_TIE_OUT_ITEM_NOT_FOUND }
            - call: "POST /disclosure/adjusted-measures/00000000-0000-4000-8000-000000000104/reconcile"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 404, error_id: ERR_MEASURE_NOT_FOUND }
            - call: "POST /disclosure/qa-items/00000000-0000-4000-8000-000000000105/clear"
              payload: { clearance_note: "Counsel cleared the wording." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 404, error_id: ERR_QA_ITEM_NOT_FOUND }
            - call: "GET /disclosure/material-events/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_EVENT_NOT_FOUND }
            - call: "GET /disclosure/corrections/00000000-0000-4000-8000-000000000107"
              payload: {}
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_CORRECTION_NOT_FOUND }
            - call: "GET /disclosure/corrections/00000000-0000-4000-8000-000000000107/control-deficiencies"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_CORRECTION_NOT_FOUND }
            - call: "POST /disclosure/control-deficiencies/00000000-0000-4000-8000-000000000108/mitigate"
              payload: { remediation_note: "Control redesigned and retested." }
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_DEFICIENCY_NOT_FOUND }
          assert:
            - "each of the nine probes returns HTTP 404 with exactly the code named in its expect_error"
            - "the two corrections probes return the SAME code ERR_CORRECTION_NOT_FOUND, one from a by-id read and one from a nested list read"
            - "no row is created or modified by any probe"

      - name: pagination_bounds_reject_zero_and_two_hundred_one_while_admitting_one_and_two_hundred
        claim_type: error_triggerability
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The pagination window is the closed integer range [1, 200] with offset >= 0, and all four
          boundaries are probed from both sides on the same list endpoint: limit 0 and limit 201 are
          refused, limit 1 and limit 200 are accepted, offset -1 is refused and offset 0 is accepted. The
          upper bound is the interesting one, because pagination_defaults declares limit 10 as the DEFAULT
          and 200 as the MAXIMUM; an implementation that reuses the default as the cap refuses limit 200.
        test_recipe:
          setup:
            - "Three charters exist so that a limited page is genuinely shorter than the collection."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter One", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
            - call: "POST /disclosure/charters"
              payload: { name: "Charter Two", version_label: "2026.2", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
            - call: "POST /disclosure/charters"
              payload: { name: "Charter Three", version_label: "2026.3", min_quorum_count: 1, required_functions: ["LEGAL"] }
              as: ComplianceAdmin
          trigger:
            - call: "GET /disclosure/charters"
              payload: { limit: 0, offset: 0 }
              as: ComplianceAdmin
              expect_error: { http: 422, error_id: ERR_INVALID_PAGINATION }
            - call: "GET /disclosure/charters"
              payload: { limit: 201, offset: 0 }
              as: ComplianceAdmin
              expect_error: { http: 422, error_id: ERR_INVALID_PAGINATION }
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: -1 }
              as: ComplianceAdmin
              expect_error: { http: 422, error_id: ERR_INVALID_PAGINATION }
            - call: "GET /disclosure/charters"
              payload: { limit: 1, offset: 0 }
              as: ComplianceAdmin
            - call: "GET /disclosure/charters"
              payload: { limit: 200, offset: 0 }
              as: ComplianceAdmin
            - call: "GET /disclosure/charters"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "limit 0, limit 201 and offset -1 each return HTTP 422 ERR_INVALID_PAGINATION"
            - "limit 1 returns HTTP 200 with exactly 1 row, total_count 3 and has_more true"
            - "limit 200 returns HTTP 200 with all 3 rows, limit 200, total_count 3 and has_more false"
            - "the call with no pagination arguments returns all 3 rows with limit 10 and offset 0 applied by default"

      - name: conditional_field_requirements_are_enforced_per_action_and_the_same_call_lands_once_supplied
        claim_type: error_triggerability
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
          - state_machines.SubCertificationRequest.PENDING_to_EXCEPTION_NOTED
          - state_machines.DraftDocument.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.MaterialEvent.UNASSESSED_to_NOT_REPORTABLE
        distinguishing_aspect: |
          ERR_INVALID_REQUEST is not only about absent top-level fields: §1.6 lists four CONDITIONAL
          shapes — exception_note required only when exception_severity is LOW/MEDIUM/HIGH, change_note
          required only on REQUEST_CHANGES, determination required only on ASSESS, and reconciliation_items
          required to be a list of objects each carrying `label` AND `amount`. Every one of those fields is
          declared OPTIONAL in the §1.5 `input:` list, so an implementation that validates only against the
          declared input signature accepts all five malformed calls. Each malformed call is then repeated
          with the missing piece supplied and must succeed, which proves the 422 came from the conditional
          rule and not from an unrelated gate.
        test_recipe:
          setup:
            - "An ADOPTED charter with a FINANCE and a LEGAL voting member; a FY2026-Q2 FORM_10Q cycle in CLOSE_OPEN with a CLOSE milestone."
            - "A PENDING sub-certification held by the FINANCE member, a DRAFT PERIODIC_FILING document authored by the FINANCE member, and an UNASSESSED MaterialEvent of severity_score 2.00 (200000 / 10000000 * 100)."
            - "Logical clock at the 2026-08-01T00:00:00Z default; internal_target_utc is 2026-08-05T17:30:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Shape Probe Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", expected_cycle_version: "${cycle_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "LITIGATION_JUDGMENT", occurred_utc: "2026-07-20T00:00:00Z", discovered_utc: "2026-07-28T00:00:00Z", magnitude_amount: 200000, description: "Adverse judgment in a supplier dispute" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /disclosure/documents/${doc_id}/adjusted-measures"
              payload: { measure_label: "Adjusted EBITDA", adjusted_value: 4300000, comparable_gaap_value: 4100000, reconciliation_items: [{ label: "Restructuring charge" }], adjusted_prominence_index: 2, gaap_prominence_index: 1 }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/documents/${doc_id}/adjusted-measures"
              payload: { measure_label: "Adjusted EBITDA", adjusted_value: 4300000, comparable_gaap_value: 4100000, reconciliation_items: "Restructuring charge 200000", adjusted_prominence_index: 2, gaap_prominence_index: 1 }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/documents/${doc_id}/adjusted-measures"
              payload: { measure_label: "Adjusted EBITDA", adjusted_value: 4300000, comparable_gaap_value: 4100000, reconciliation_items: [{ label: "Restructuring charge", amount: 200000 }], adjusted_prominence_index: 2, gaap_prominence_index: 1 }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { measure_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "SIGNOFF", planned_start_utc: "2026-08-04T00:00:00Z", planned_end_utc: "2026-08-04T06:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "SUBMIT", exception_severity: "HIGH" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "SUBMIT", exception_severity: "SEVERE", exception_note: "Cut-off testing incomplete." }
              as: BusinessLeader
              as_user_id: "${fin_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/sub-certifications/${sc_id}/transitions"
              payload: { action: "SUBMIT", exception_severity: "HIGH", exception_note: "Cut-off testing incomplete for two subsidiaries." }
              as: BusinessLeader
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "REQUEST_CHANGES" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "REQUEST_CHANGES", change_note: "Reconcile the adjusted measure to the GAAP line." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { doc_status: $.data.status, doc_round: $.data.revision_round }
            - call: "POST /disclosure/material-events/${ev_id}/transitions"
              payload: { action: "ASSESS" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 422, error_id: ERR_INVALID_REQUEST }
            - call: "POST /disclosure/material-events/${ev_id}/transitions"
              payload: { action: "ASSESS", determination: "NOT_REPORTABLE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_status: $.data.assessment_status }
          assert:
            - "the measure whose reconciliation_items item omits `amount` returns 422 ERR_INVALID_REQUEST, and so does the one that sends a bare string instead of a list"
            - "the well-formed measure is created with reconciliation_total 200000.00"
            - "milestone kind SIGNOFF returns 422 ERR_INVALID_REQUEST — an out-of-domain enum is a shape error, not ERR_MILESTONE_MISSING or a 404"
            - "SUBMIT with exception_severity HIGH and no exception_note returns 422 ERR_INVALID_REQUEST; exception_severity SEVERE returns 422 ERR_INVALID_REQUEST even though exception_note is present"
            - "SUBMIT with exception_severity HIGH AND exception_note lands EXCEPTION_NOTED"
            - "REQUEST_CHANGES with no change_note returns 422 ERR_INVALID_REQUEST; with change_note ${doc_status} == CHANGES_REQUESTED and ${doc_round} == 1"
            - "ASSESS with no determination returns 422 ERR_INVALID_REQUEST; with determination NOT_REPORTABLE ${ev_status} == NOT_REPORTABLE"
            - "no state changed on any of the five rejected calls: the document was still IN_REVIEW with revision_round 0 after the first REQUEST_CHANGES attempt failed, the sub-certification was still PENDING after both bad SUBMIT attempts, and the event was still UNASSESSED after the first ASSESS attempt failed"

      - name: both_segregation_of_duties_gates_fire_and_a_second_actor_gets_past_them
        claim_type: error_triggerability
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_SOD_SELF_APPROVAL]
          - errors[ERR_SOD_OFFICER_SUBCERT]
          - validations[priority=27]
        distinguishing_aspect: |
          The two segregation-of-duties codes guard different axes and both are probed with their
          success twin. ERR_SOD_SELF_APPROVAL covers BOTH document review verdicts — an implementation
          that guards only APPROVE lets the author reject their own draft, which is the same conflict.
          ERR_SOD_OFFICER_SUBCERT is probed in the ASSIGNMENT direction (priority 20: a member already
          holding a non-VOID OfficerCertification cannot be handed a SubCertificationRequest on that
          cycle), which is the direction the certification-signing precondition of the same name does
          NOT cover. The final APPROVE by a different reviewer must fail with ERR_TIE_OUT_NOT_PASSED
          (priority 27, downstream of 19) rather than succeed or repeat the SOD code: the only thing
          that changed between the two APPROVE calls is the acting member.
        test_recipe:
          setup:
            - "An ADOPTED charter with FINANCE, LEGAL and an is_officer FINANCE member; a FY2026-Q2 FORM_10Q cycle in CLOSE_OPEN with a CLOSE milestone."
            - "A CEO_302 OfficerCertification already created for the officer member, so it holds a non-VOID certification on the cycle."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "SOD Probe Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
