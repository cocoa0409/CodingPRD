          assert:
            - "certA window [2027-08-01, 2027-08-05) ends exactly at blackout start -> adjacent, NO conflict: status == REDEEMED"
            - "certB window [2027-08-01, 2027-08-06) overlaps blackout by one day -> error_id == ERR_BLACKOUT_CONFLICT"

      - name: redemption_closed_containment_with_grace
        grounds:
          - calculations.certificate_validity_window
          - validations[priority=14]
        distinguishing_aspect: |
          Resource = Certificate; semantics = CLOSED containment with grace
          extension: scheduled_end exactly equal to grace_end_at (2027-08-31) is
          allowed, one day later is rejected — a third interval geometry (closed
