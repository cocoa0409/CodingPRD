scenario: "Commuter-Rail Fare & Conductor App: fare zone & ticket type (single/monthly), mobile-ticket activation & visual/scan validation, conductor onboard inspection & upgrade, fare evasion & citation, reduced-fare eligibility, refund/exchange, delay/service-credit, revenue apportionment"
domain_name: commuter-rail-fare
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys (Passenger, Ticket, Inspection, Citation,
  # RefundRequest, ServiceCredit, ...) — no nested URL ownership chain. All
  # collections are top-level (api_prefix is root); children carry FK fields.

  state_machine_shape: branching
  # Ticket branches PURCHASED -> {ACTIVATED, REFUNDED, EXCHANGED} and
  # ACTIVATED -> {VALIDATED, REFUNDED}; Citation branches
  # ISSUED -> {PAID, CONTESTED} then CONTESTED -> {UPHELD, DISMISSED} with
  # divergent side-effects (DISMISSED reverses evasion_count). Non-linear on
  # two distinct entities.

  relationship_patterns:
    - one_to_many        # Passenger 1:N Ticket / Citation / ServiceCredit
    - cross_aggregate    # Inspection references Ticket AND Passenger; Upgrade references Inspection AND Ticket

  role_model: peer_roles
  # Passenger owns tickets/applications/refunds; Conductor owns inspections/
  # upgrades/citations; FareAdmin owns fare config, approvals, disruptions, credits.

  consistency_model: immediate
  # All mutations (including cascaded side-effects) are atomic within the request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: FareProduct
    parent: null
    common_fields: false
    description: "Configuration row pricing one (origin_zone, destination_zone, ticket_type) fare. Immutable once created."
    fields:
      - name: origin_zone
        type: integer
        source: input
        description: "Origin fare zone number (1..6)."
        constraints: "1 <= origin_zone <= 6"
      - name: destination_zone
        type: integer
        source: input
        description: "Destination fare zone number (1..6)."
        constraints: "1 <= destination_zone <= 6"
      - name: ticket_type
        type: enum
        source: input
        description: "SINGLE (one journey) or MONTHLY (calendar-month pass)."
        constraints: "one of {SINGLE, MONTHLY}"
      - name: base_fare_cents
        type: integer
        source: input
        description: "Off-peak base fare in cents for this zone/type."
        constraints: ">= 0"
      - name: peak_surcharge_cents
        type: integer
        source: input
        description: "Additional cents applied when travel_period == PEAK."
        constraints: ">= 0"
      - name: apportionment_method
        type: enum
        source: input
        description: "Revenue split method inherited by tickets: ZONE_COUNT or DISTANCE."
        default: ZONE_COUNT
        constraints: "one of {ZONE_COUNT, DISTANCE}"

  - name: Agency
    parent: null
    common_fields: false
    description: "Operating agency that shares ticket revenue. Config; created before tickets. created_at ASC is the deterministic tie-break for rounding-remainder allocation."
    fields:
      - name: code
        type: string
        source: input
        description: "Short unique agency code (e.g. 'A')."
        constraints: "unique among agencies"
      - name: zones_served
        type: array
        source: input
        description: "Integer zone numbers this agency operates (e.g. [1,2])."
        constraints: "non-empty; each 1..6"

  - name: Passenger
    parent: null
    common_fields: true
    description: "A rider. Acts under role Passenger with X-User-ID == this id. Holds reduced-fare eligibility, wallet balance, and cumulative evasion count."
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email."
      - name: full_name
        type: string
        source: input
        description: "Full legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD); used for SENIOR age eligibility."
      - name: reduced_fare_category
        type: enum
        source: computed
        description: "Set by an approved ReducedFareApplication; reset to NONE on eligibility revocation. Gates reduced-fare ticket purchase."
        default: NONE
        constraints: "one of {NONE, SENIOR, STUDENT, DISABILITY}"
      - name: reduced_fare_valid_until
        type: datetime
        source: computed
        description: "Expiry of current reduced-fare eligibility; null when NONE. Compared against purchase clock."
        default: null
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Store credit balance. Increased by WALLET refunds / service credits / positive exchange deltas; decreased by wallet_apply at purchase and by service-credit voids. Invariant: equals sum of ISSUED ServiceCredit.credit_amount_cents + APPROVED WALLET RefundRequest.refund_amount_cents + exchange credits - sum of Ticket.wallet_applied_cents."
        default: 0
        constraints: ">= 0"
      - name: evasion_count
        type: integer
        source: computed
        description: "Cumulative count of ISSUED-and-not-DISMISSED citations. Incremented when a Citation is issued; decremented when a Citation is DISMISSED. Drives repeat-offender penalty multiplier and eligibility revocation."
        default: 0
        constraints: ">= 0"

  - name: ReducedFareApplication
    parent: null
    common_fields: true
    description: "Passenger request for reduced-fare eligibility. Approval mutates the parent Passenger. A new application supersedes any prior SUBMITTED one (OCC on Passenger.version)."
    fields:
      - name: passenger_id
        type: string
        source: input
        description: "FK -> Passenger.id; the applicant. Must equal X-User-ID of the acting Passenger."
      - name: category
        type: enum
        source: input
        description: "Requested reduced-fare category."
        constraints: "one of {SENIOR, STUDENT, DISABILITY}"
      - name: proof_document_ref
        type: string
        source: input
        description: "Opaque reference to submitted proof document."
      - name: proof_expires_at
        type: datetime
        source: input
        description: "Expiry of the submitted proof; approval sets valid_until to min(this, +1 year)."
      - name: valid_until
        type: datetime
        source: computed
        description: "Eligibility expiry set on approval; null otherwise."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, SUPERSEDED, REVOKED}"
      - name: decision_reason
        type: string
        source: computed
        description: "Reason recorded on reject; null otherwise."
        default: null

  - name: Ticket
    parent: null
    common_fields: true
    description: "A purchased ticket/pass. Carries computed price and revenue allocations. destination_zone may be extended by an onboard Upgrade."
    fields:
      - name: passenger_id
        type: string
        source: input
        description: "FK -> Passenger.id; the ticket holder. Must equal acting Passenger's X-User-ID."
      - name: fare_product_id
        type: string
        source: input
        description: "FK -> FareProduct.id; the priced fare row."
      - name: ticket_type
        type: enum
        source: system
        description: "Copied from FareProduct.ticket_type at purchase."
        constraints: "one of {SINGLE, MONTHLY}"
      - name: origin_zone
        type: integer
        source: system
        description: "Copied from FareProduct.origin_zone."
      - name: destination_zone
        type: integer
        source: system
        description: "Copied from FareProduct.destination_zone at purchase; overwritten to the observed zone by an accepted Upgrade."
      - name: travel_period
        type: enum
        source: input
        description: "PEAK or OFF_PEAK; selects whether peak_surcharge applies."
        constraints: "one of {PEAK, OFF_PEAK}"
      - name: wallet_applied_cents
        type: integer
        source: input
        description: "Wallet credit spent at purchase; must not exceed passenger.wallet_credit_cents."
        default: 0
        constraints: ">= 0"
      - name: reduced_fare_applied
        type: boolean
        source: computed
        description: "True when use_reduced_fare was requested AND passenger eligibility was valid at purchase; drives the reduced-fare discount."
        default: false
      - name: purchase_price_cents
        type: integer
        source: computed
        description: "Fare charged; output of the ticket_purchase_price calculation."
      - name: apportionment_method
        type: enum
        source: system
        description: "Copied from FareProduct.apportionment_method; selects the revenue_apportionment variant."
        constraints: "one of {ZONE_COUNT, DISTANCE}"
      - name: revenue_allocations
        type: array
        source: computed
        description: "Array of {agency_id, agency_code, amount_cents}; output of revenue_apportionment. Sum equals purchase_price_cents while non-terminal; zeroed to sum 0 on REFUNDED."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: PURCHASED
        constraints: "one of {PURCHASED, ACTIVATED, VALIDATED, REFUNDED, EXCHANGED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Clock time of activation; null until ACTIVATED."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "For SINGLE: activated_at + 90 minutes. For MONTHLY: first instant of the month after activation. Null until ACTIVATED."
        default: null
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Set when the ticket becomes REFUNDED; output of refund_amount. Null otherwise."
        default: null

  - name: Inspection
    parent: null
    common_fields: false
    description: "Append-only record of a conductor checking a passenger onboard. result and fare_shortfall_cents are computed at creation."
    fields:
      - name: passenger_id
        type: string
        source: input
        description: "FK -> Passenger.id; the inspected rider."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the presented ticket, or null when none is presented (evasion)."
        default: null
      - name: observed_destination_zone
        type: integer
        source: input
        description: "Zone to which the passenger is actually travelling."
        constraints: "1 <= observed_destination_zone <= 6"
      - name: result
        type: enum
        source: computed
        description: "VALID (ticket covers travel), UPGRADE_REQUIRED (observed zone beyond ticket destination), or EVASION (no/expired/invalid ticket)."
        constraints: "one of {VALID, UPGRADE_REQUIRED, EVASION}"
      - name: fare_shortfall_cents
        type: integer
        source: computed
        description: "For EVASION: EVASION_FARE_ESTIMATE_CENTS. For UPGRADE_REQUIRED: the upgrade fare difference. For VALID: 0."
        default: 0

  - name: Upgrade
    parent: null
    common_fields: false
    description: "Append-only record of an onboard fare upgrade collected by a conductor. Extends the ticket's destination_zone."
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; must have result == UPGRADE_REQUIRED."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket being upgraded (must equal Inspection.ticket_id)."
      - name: from_zone
        type: integer
        source: system
        description: "Ticket destination_zone before upgrade."
      - name: to_zone
        type: integer
        source: system
        description: "Inspection.observed_destination_zone; new ticket destination_zone."
      - name: upgrade_fare_cents
        type: integer
        source: computed
        description: "Output of upgrade_fare calculation."

  - name: Citation
    parent: null
    common_fields: true
    description: "Fare-evasion citation issued from an EVASION inspection. Contestable; dismissal reverses the passenger's evasion_count."
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; must have result == EVASION."
      - name: passenger_id
        type: string
        source: input
        description: "FK -> Passenger.id; the cited rider."
      - name: base_penalty_cents
        type: integer
        source: computed
        description: "EVASION_BASE_PENALTY_CENTS times repeat multiplier (2 when prior evasion_count >= REPEAT_EVASION_THRESHOLD, else 1)."
      - name: fare_shortfall_cents
        type: integer
        source: computed
        description: "Copied from Inspection.fare_shortfall_cents at issuance."
      - name: total_penalty_cents
        type: integer
        source: computed
        description: "Output of citation_penalty: base_penalty_cents + fare_shortfall_cents."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: ISSUED
        constraints: "one of {ISSUED, PAID, CONTESTED, UPHELD, DISMISSED}"
      - name: contest_grounds
        type: string
        source: computed
        description: "Grounds text recorded on contest; null otherwise."
        default: null
      - name: resolution_decision
        type: enum
        source: computed
        description: "UPHELD or DISMISSED once resolved; null otherwise."
        default: null
        constraints: "one of {UPHELD, DISMISSED, null}"

  - name: RefundRequest
    parent: null
    common_fields: true
    description: "Passenger request to refund a ticket. Approval drives the ticket to REFUNDED and moves money."
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket to refund."
      - name: reason
        type: string
        source: input
        description: "Free-text reason."
      - name: refund_destination
        type: enum
        source: input
        description: "WALLET (store credit) or ORIGINAL (original tender)."
        constraints: "one of {WALLET, ORIGINAL}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Output of refund_amount at request time (variant selected by ticket state/type)."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
      - name: decision_reason
        type: string
        source: computed
        description: "Reason recorded on deny; null otherwise."
        default: null

  - name: ServiceDisruption
    parent: null
    common_fields: false
    description: "Recorded delay on a line. delay_minutes and severity computed at creation; windows must not conflict within a buffer on the same line."
    fields:
      - name: line_code
        type: string
        source: input
        description: "Line identifier the disruption affects."
      - name: scheduled_departure
        type: datetime
        source: input
        description: "Scheduled departure instant."
      - name: actual_departure
        type: datetime
        source: input
        description: "Actual departure instant; must be >= scheduled_departure."
      - name: window_start
        type: datetime
        source: input
        description: "Start of the affected service window (inclusive)."
      - name: window_end
        type: datetime
        source: input
        description: "End of the affected service window (inclusive); must be >= window_start."
      - name: delay_minutes
        type: integer
        source: computed
        description: "floor((actual_departure - scheduled_departure) / 60s)."
      - name: severity
        type: enum
        source: computed
        description: "MINOR (<30), MAJOR ([30,120)), SEVERE (>=120) by delay_minutes."
        constraints: "one of {MINOR, MAJOR, SEVERE}"

  - name: ServiceCredit
    parent: null
    common_fields: true
    description: "Compensation credit issued for a delay against a specific ticket. Issuance credits the passenger wallet; voiding reverses it."
    fields:
      - name: disruption_id
        type: string
        source: input
        description: "FK -> ServiceDisruption.id; the delay being compensated."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the affected ticket."
      - name: passenger_id
        type: string
        source: system
        description: "FK -> Passenger.id; copied from Ticket.passenger_id."
      - name: credit_amount_cents
        type: integer
        source: computed
        description: "Output of service_credit_amount (tiered by delay_minutes over ticket.purchase_price_cents)."
      - name: status
        type: enum
        source: computed
        description: "ISSUED or VOIDED."
        default: ISSUED
        constraints: "one of {ISSUED, VOIDED}"
      - name: void_reason
        type: string
        source: computed
        description: "Reason recorded on void; null otherwise."
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Ticket
    initial_state: PURCHASED
    terminal_states: [VALIDATED, REFUNDED, EXCHANGED]
    transitions:
      - from: PURCHASED
        to: ACTIVATED
        trigger: "POST /tickets/{id}/activate"
        actor: Passenger
        preconditions:
          - "ticket.status == PURCHASED"
          - "now (clock) <= created_at + TICKET_ACTIVATION_DEADLINE_DAYS (else business_temporal failure)"
          - "for MONTHLY: no other ACTIVATED MONTHLY ticket of the same passenger with same (origin_zone,destination_zone) whose validity month overlaps (resource_temporal_overlap)"
        side_effects:
          - "set activated_at = now"
          - "set expires_at = activated_at + 90 minutes (SINGLE) or first instant of next calendar month (MONTHLY)"
          - "increments Ticket.version by 1"
      - from: ACTIVATED
        to: VALIDATED
        trigger: "POST /tickets/{id}/validate"
        actor: Passenger
        preconditions:
          - "ticket.status == ACTIVATED"
          - "ticket.ticket_type == SINGLE"
          - "now <= ticket.expires_at (else ERR_TICKET_EXPIRED business_temporal)"
        side_effects:
          - "increments Ticket.version by 1"
        note: "Visual/scan validation consumes a SINGLE ticket."
      - from: PURCHASED
        to: REFUNDED
        trigger: "POST /refund-requests/{id}/approve (ticket unactivated)"
        actor: FareAdmin
        preconditions:
          - "ticket.status == PURCHASED"
        side_effects:
          - "set ticket.refund_amount_cents = refund_amount (FULL variant)"
          - "zero every revenue_allocations[].amount_cents (sum becomes 0)"
          - "if refund_destination == WALLET: passenger.wallet_credit_cents += refund_amount_cents (increments Passenger.version)"
          - "increments Ticket.version by 1"
      - from: ACTIVATED
        to: REFUNDED
        trigger: "POST /refund-requests/{id}/approve (activated MONTHLY)"
        actor: FareAdmin
        preconditions:
          - "ticket.status == ACTIVATED"
          - "ticket.ticket_type == MONTHLY"
        side_effects:
          - "set ticket.refund_amount_cents = refund_amount (PRORATED variant)"
          - "zero every revenue_allocations[].amount_cents (sum becomes 0)"
          - "if refund_destination == WALLET: passenger.wallet_credit_cents += refund_amount_cents (increments Passenger.version)"
          - "increments Ticket.version by 1"
      - from: PURCHASED
        to: EXCHANGED
        trigger: "POST /tickets/{id}/exchange"
        actor: Passenger
        preconditions:
          - "ticket.status == PURCHASED"
        side_effects:
          - "create a new Ticket (PURCHASED) priced by ticket_purchase_price for new_fare_product_id"
          - "if old.purchase_price_cents > new ticket.purchase_price_cents: passenger.wallet_credit_cents += (old.purchase_price_cents - new.purchase_price_cents) (increments Passenger.version)"
          - "zero old ticket revenue_allocations (sum 0); allocate new ticket revenue"
          - "increments Ticket.version by 1"
        note: "Exchange is the branch of PURCHASED distinct from activate/refund."

  - entity: ReducedFareApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reduced-fare-applications/{id}/approve"
        actor: FareAdmin
        preconditions:
          - "application.status == SUBMITTED"
          - "if category == SENIOR: passenger age at now >= SENIOR_MIN_AGE (else ERR_SENIOR_AGE_NOT_MET)"
        side_effects:
          - "set valid_until = min(proof_expires_at, now + 365 days)"
          - "set passenger.reduced_fare_category = application.category"
          - "set passenger.reduced_fare_valid_until = valid_until"
          - "increments Passenger.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reduced-fare-applications/{id}/reject"
        actor: FareAdmin
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "set decision_reason = reason"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: another ReducedFareApplication created for same passenger"
        actor: system
        preconditions:
          - "a newer application is being created for the same passenger"
        side_effects:
          - "prior SUBMITTED application status -> SUPERSEDED"
        note: "The create bumps Passenger.version; OCC guards concurrent supersede (see concurrency_rules)."
      - from: APPROVED
        to: REVOKED
        trigger: "system: passenger.evasion_count reaches EVASION_REVOCATION_THRESHOLD"
        actor: system
        preconditions:
          - "application.status == APPROVED"
          - "passenger.evasion_count >= EVASION_REVOCATION_THRESHOLD"
        side_effects:
          - "set passenger.reduced_fare_category = NONE"
          - "set passenger.reduced_fare_valid_until = null"
          - "increments Passenger.version by 1"
        note: "Third hop of the citation revocation cascade."

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /citations"
        actor: Conductor
        preconditions:
          - "inspection.result == EVASION (else ERR_NO_EVASION_FOUND)"
          - "citation.passenger_id == inspection.passenger_id"
        side_effects:
          - "compute base_penalty_cents using passenger.evasion_count BEFORE increment"
          - "compute total_penalty_cents = base_penalty_cents + fare_shortfall_cents"
          - "passenger.evasion_count += 1 (increments Passenger.version)"
          - "if passenger.evasion_count >= EVASION_REVOCATION_THRESHOLD and an APPROVED ReducedFareApplication exists: that application -> REVOKED and passenger eligibility cleared"
        note: "Cascade hop 1 (create) -> hop 2 (evasion_count) -> hop 3 (application REVOKED)."
      - from: ISSUED
        to: PAID
        trigger: "POST /citations/{id}/pay"
        actor: Passenger
        preconditions:
          - "citation.status IN {ISSUED, UPHELD}"
        side_effects:
          - "increments Citation.version by 1"
      - from: UPHELD
        to: PAID
        trigger: "POST /citations/{id}/pay"
        actor: Passenger
        preconditions:
          - "citation.status IN {ISSUED, UPHELD}"
        side_effects:
          - "increments Citation.version by 1"
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /citations/{id}/contest"
        actor: Passenger
        preconditions:
          - "citation.status == ISSUED"
        side_effects:
          - "set contest_grounds = grounds"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /citations/{id}/resolve (decision=UPHELD)"
        actor: FareAdmin
        preconditions:
          - "citation.status == CONTESTED"
        side_effects:
          - "set resolution_decision = UPHELD"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /citations/{id}/resolve (decision=DISMISSED)"
        actor: FareAdmin
        preconditions:
          - "citation.status == CONTESTED"
        side_effects:
          - "set resolution_decision = DISMISSED"
          - "passenger.evasion_count -= 1 (compensating; increments Passenger.version)"
          - "increments Citation.version by 1"
        note: "Divergent branch: only DISMISSED reverses evasion_count."

  - entity: RefundRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /refund-requests"
        actor: Passenger
        preconditions:
          - "ticket.status IN {PURCHASED, ACTIVATED} (else ERR_TICKET_NOT_REFUNDABLE)"
          - "for ACTIVATED: ticket.ticket_type == MONTHLY"
          - "now <= ticket.created_at + REFUND_WINDOW_DAYS (else ERR_REFUND_WINDOW_ELAPSED)"
        side_effects:
          - "set refund_amount_cents = refund_amount (variant by ticket state/type)"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /refund-requests/{id}/approve"
        actor: FareAdmin
        preconditions:
          - "refund_request.status == REQUESTED"
          - "ticket.status IN {PURCHASED, ACTIVATED}"
        side_effects:
          - "drive ticket to REFUNDED (see Ticket transitions), moving money and zeroing allocations"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /refund-requests/{id}/deny"
        actor: FareAdmin
        preconditions:
          - "refund_request.status == REQUESTED"
        side_effects:
          - "set decision_reason = reason"

  - entity: ServiceCredit
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /service-credits"
        actor: FareAdmin
        preconditions:
          - "disruption.delay_minutes >= SERVICE_CREDIT_MIN_DELAY_MINUTES (else ERR_DELAY_BELOW_THRESHOLD)"
          - "ticket.status IN {PURCHASED, ACTIVATED, VALIDATED}"
        side_effects:
          - "set credit_amount_cents = service_credit_amount"
          - "set passenger_id = ticket.passenger_id"
          - "passenger.wallet_credit_cents += credit_amount_cents (increments Passenger.version)"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /service-credits/{id}/void"
        actor: FareAdmin
        preconditions:
          - "service_credit.status == ISSUED"
        side_effects:
          - "set void_reason = reason"
          - "passenger.wallet_credit_cents -= credit_amount_cents (compensating; increments Passenger.version)"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: application-create-stale-passenger
    parent_entity: Passenger
    write_endpoint: "POST /reduced-fare-applications"
    occ_field: "expected_passenger_version"
    description: |
      Creating a ReducedFareApplication carries the passenger version the client
      last observed. When that version is stale — the passenger has since been
      mutated (a prior application create that superseded an earlier SUBMITTED
      one, an approval, an evasion increment, or a wallet change) — the create is
      rejected. This is a true CREATE-with-supersede case: a fresh application
      legitimately supersedes the prior SUBMITTED application, so under natural
      semantics a second create would itself succeed; the stale-version check is
      the only deterministic guard.
    error_id: ERR_STALE_PASSENGER_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: ticket_purchase_price
    trigger: "POST /tickets (and the priced leg of POST /tickets/{id}/exchange)"
    algorithm: tiered_pricing
    formula: |
      subtotal = fare_product.base_fare_cents
                 + (fare_product.peak_surcharge_cents if travel_period == PEAK else 0)
      if reduced_fare_applied:
          discount = round_half_up(subtotal * REDUCED_FARE_DISCOUNT_PCT)
          price = subtotal - discount
      else:
          price = subtotal
      purchase_price_cents = min(price, FARE_CAP_CENTS)
    input_set: "Single FareProduct row plus the travel_period and reduced-fare decision for this purchase."
    constants:
      REDUCED_FARE_DISCOUNT_PCT: 0.50
      FARE_CAP_CENTS: 5000
    precision: "integer cents; round_half_up on the discount step only."
    variants:
      - name: standard
        when: "reduced_fare_applied == false"
        difference: "no discount step; price = subtotal capped at FARE_CAP_CENTS."
      - name: reduced
        when: "reduced_fare_applied == true"
        difference: "subtract round_half_up(subtotal * 0.50) before the cap."

  - name: revenue_apportionment
    trigger: "POST /tickets (recomputed on POST /tickets/{id}/exchange for the new ticket); zeroed on Ticket REFUNDED/EXCHANGED"
    algorithm: waterfall_allocation
    formula: |
      ticket_zones = set(range(min(origin_zone,destination_zone), max(origin_zone,destination_zone)+1))
      for each Agency:
          served = ticket_zones ∩ set(agency.zones_served)
          if apportionment_method == ZONE_COUNT:
              weight[agency] = len(served)
          else:  # DISTANCE
              weight[agency] = sum(ZONE_MILES[z] for z in served)
      participating = agencies with weight > 0
      total = purchase_price_cents
      W = sum(weight[a] for a in participating)
      raw[a]   = total * weight[a] / W        # exact rational
      floor[a] = floor(raw[a])
      remainder = total - sum(floor[a])
      # distribute remainder as +1 cents, agencies ordered by weight DESC,
      # tie-break Agency.created_at ASC, until remainder is exhausted
      amount[a] = floor[a] (+1 while remainder-- for the ordered leaders)
    input_set: "All Agency config rows whose zones_served intersect the ticket's zone span."
    constants:
      ZONE_MILES: { 1: 10, 2: 20, 3: 30, 4: 40, 5: 50, 6: 60 }
    precision: "integer cents; floor per agency then deterministic remainder distribution — sum(amount) == total exactly."
    variants:
      - name: zone_count
        when: "ticket.apportionment_method == ZONE_COUNT"
        difference: "weight = count of served zones; equal-length agencies tie on weight."
      - name: distance
        when: "ticket.apportionment_method == DISTANCE"
        difference: "weight = summed ZONE_MILES of served zones; produces a different split for the same total."

  - name: refund_amount
    trigger: "POST /refund-requests (and confirmed at POST /refund-requests/{id}/approve)"
    algorithm: forward_looking
    formula: |
      if ticket.status == PURCHASED:                       # FULL variant
          refund = max(0, ticket.purchase_price_cents - REFUND_FEE_CENTS)
      elif ticket.status == ACTIVATED and ticket_type == MONTHLY:   # PRORATED variant
          total_days = days_in_calendar_month(ticket.activated_at)
          used_days = floor((now - start_of_day(ticket.activated_at)) / 1 day) + 1
          remaining_days = max(0, total_days - used_days)
          gross = floor(ticket.purchase_price_cents * remaining_days / total_days)
          refund = max(0, gross - REFUND_FEE_CENTS)
    input_set: "The single Ticket being refunded plus the current clock."
    constants:
      REFUND_FEE_CENTS: 200
    precision: "integer cents; floor on the proration step."
    variants:
      - name: full
        when: "ticket.status == PURCHASED (unactivated)"
        difference: "full price minus flat fee; ignores dates."
      - name: prorated
        when: "ticket.status == ACTIVATED and ticket_type == MONTHLY"
        difference: "price scaled by remaining/total days of the activation month, then minus fee — a different amount for the same ticket."

  - name: upgrade_fare
    trigger: "POST /upgrades"
    algorithm: threshold
    formula: |
      new_product = FareProduct(origin_zone=ticket.origin_zone,
                                destination_zone=inspection.observed_destination_zone,
                                ticket_type=ticket.ticket_type)
      new_full = new_product.base_fare_cents
                 + (new_product.peak_surcharge_cents if ticket.travel_period == PEAK else 0)
      upgrade_fare_cents = max(0, new_full - ticket.purchase_price_cents) + ONBOARD_SURCHARGE_CENTS
    input_set: "The upgraded Ticket and the FareProduct for the observed destination zone."
    constants:
      ONBOARD_SURCHARGE_CENTS: 200
    precision: "integer cents."

  - name: citation_penalty
    trigger: "POST /citations"
    algorithm: threshold
    formula: |
      prior = passenger.evasion_count            # BEFORE this citation's increment
      multiplier = 2 if prior >= REPEAT_EVASION_THRESHOLD else 1
      base_penalty_cents = EVASION_BASE_PENALTY_CENTS * multiplier
      total_penalty_cents = base_penalty_cents + inspection.fare_shortfall_cents
    input_set: "The EVASION Inspection and the cited Passenger's evasion_count prior to this citation."
    constants:
      EVASION_BASE_PENALTY_CENTS: 5000
      REPEAT_EVASION_THRESHOLD: 2
      EVASION_FARE_ESTIMATE_CENTS: 1000
    precision: "integer cents."

  - name: service_credit_amount
    trigger: "POST /service-credits"
    algorithm: threshold
    formula: |
      d = disruption.delay_minutes
      if d < 30:      credit = 0     # rejected upstream by ERR_DELAY_BELOW_THRESHOLD
      elif d < 60:    credit = floor(ticket.purchase_price_cents * 0.25)
      elif d < 120:   credit = floor(ticket.purchase_price_cents * 0.50)
      else:           credit = ticket.purchase_price_cents
      credit_amount_cents = credit
    input_set: "One ServiceDisruption's delay_minutes and one Ticket's purchase_price_cents."
    constants:
      SERVICE_CREDIT_MIN_DELAY_MINUTES: 30
    precision: "integer cents; floor on the percentage tiers."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when unauthenticated? no — all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right)."
    error_id: ERR_PASSENGER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing passenger_id / {id}"
  - priority: 3
    category: existence
    check: "Referenced FareProduct exists."
    error_id: ERR_FARE_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /tickets, POST /tickets/{id}/exchange"
  - priority: 3
    category: existence
    check: "Referenced Ticket exists."
    error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "ticket sub-resources, POST /inspections, POST /upgrades, POST /refund-requests, POST /service-credits"
  - priority: 3
    category: existence
    check: "Referenced ReducedFareApplication exists."
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "reduced-fare-application sub-resources"
  - priority: 3
    category: existence
    check: "Referenced Inspection exists."
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /upgrades, POST /citations"
  - priority: 3
    category: existence
    check: "Referenced Citation exists."
    error_id: ERR_CITATION_NOT_FOUND
    http_status: 404
    applies_to: "citation sub-resources"
  - priority: 3
    category: existence
    check: "Referenced RefundRequest exists."
    error_id: ERR_REFUND_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "refund-request sub-resources"
  - priority: 3
    category: existence
    check: "Referenced ServiceDisruption / ServiceCredit exists."
    error_id: ERR_DISRUPTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /service-credits, service-credit sub-resources"
  - priority: 4
    category: business_referential
    check: "Acting Passenger's X-User-ID equals the passenger_id / owning passenger of the target resource."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Passenger-owned writes (tickets, applications, refund-requests, citation pay/contest)"
  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, integers in range."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "Ticket is in a state that permits the requested transition (activate requires PURCHASED, validate requires ACTIVATED, etc.)."
    error_id: ERR_INVALID_TICKET_STATE
    http_status: 409
    applies_to: "POST /tickets/{id}/activate, /validate, /exchange"
  - priority: 5
    category: state
    check: "Citation is in a state that permits the transition."
    error_id: ERR_INVALID_CITATION_STATE
    http_status: 409
    applies_to: "POST /citations/{id}/pay, /contest, /resolve"
  - priority: 5
    category: state
    check: "ReducedFareApplication is SUBMITTED for approve/reject."
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /reduced-fare-applications/{id}/approve, /reject"
  - priority: 5
    category: state
    check: "RefundRequest is REQUESTED for approve/deny."
    error_id: ERR_INVALID_REFUND_STATE
    http_status: 409
    applies_to: "POST /refund-requests/{id}/approve, /deny"
  - priority: 5
    category: state
    check: "ServiceCredit is ISSUED for void."
    error_id: ERR_INVALID_CREDIT_STATE
    http_status: 409
    applies_to: "POST /service-credits/{id}/void"
  - priority: 5
    category: state
    check: "Ticket is refundable (status IN {PURCHASED, ACTIVATED}; ACTIVATED only for MONTHLY)."
    error_id: ERR_TICKET_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /refund-requests"
  - priority: 6
    category: business_referential
    check: "use_reduced_fare requires passenger.reduced_fare_category != NONE and reduced_fare_valid_until >= now."
    error_id: ERR_REDUCED_FARE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /tickets"
  - priority: 6
    category: business_referential
    check: "Upgrade's ticket_id equals Inspection.ticket_id."
    error_id: ERR_UPGRADE_TICKET_MISMATCH
    http_status: 409
    applies_to: "POST /upgrades"
  - priority: 7
    category: business_temporal
    check: "Activation is within TICKET_ACTIVATION_DEADLINE_DAYS of purchase."
    error_id: ERR_TICKET_ACTIVATION_EXPIRED
    http_status: 409
    applies_to: "POST /tickets/{id}/activate"
  - priority: 7
    category: business_temporal
    check: "Scan validation is at or before ticket.expires_at."
    error_id: ERR_TICKET_EXPIRED
    http_status: 409
    applies_to: "POST /tickets/{id}/validate"
  - priority: 7
    category: business_temporal
    check: "Refund is requested within REFUND_WINDOW_DAYS of purchase."
    error_id: ERR_REFUND_WINDOW_ELAPSED
    http_status: 409
    applies_to: "POST /refund-requests"
  - priority: 8
    category: business_constraint
    check: "Citation requires Inspection.result == EVASION."
    error_id: ERR_NO_EVASION_FOUND
    http_status: 409
    applies_to: "POST /citations"
  - priority: 8
    category: business_constraint
    check: "Upgrade requires Inspection.result == UPGRADE_REQUIRED (observed zone strictly beyond ticket destination)."
    error_id: ERR_UPGRADE_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /upgrades"
  - priority: 8
    category: business_constraint
    check: "SENIOR approval requires passenger age at now >= SENIOR_MIN_AGE (65)."
    error_id: ERR_SENIOR_AGE_NOT_MET
    http_status: 422
    applies_to: "POST /reduced-fare-applications/{id}/approve"
  - priority: 8
    category: business_temporal
    check: "Activating a MONTHLY ticket must not overlap an existing ACTIVATED MONTHLY ticket of same passenger and same (origin,destination) validity month."
    error_id: ERR_PASS_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tickets/{id}/activate"
  - priority: 8
    category: business_temporal
    check: "New ServiceDisruption window on a line must be >= DISRUPTION_BUFFER_MINUTES from any existing disruption window on the same line."
    error_id: ERR_DISRUPTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-disruptions"
  - priority: 8
    category: business_constraint
    check: "ServiceCredit requires disruption.delay_minutes >= SERVICE_CREDIT_MIN_DELAY_MINUTES (30)."
    error_id: ERR_DELAY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /service-credits"
  - priority: 9
    category: business_fiscal
    check: "wallet_apply_cents <= passenger.wallet_credit_cents."
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /tickets, POST /tickets/{id}/exchange"
  - priority: 10
    category: business_constraint
    check: "expected_passenger_version equals the current Passenger.version (OCC on application create)."
    error_id: ERR_STALE_PASSENGER_VERSION
    http_status: 412
    applies_to: "POST /reduced-fare-applications"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-03-01T00:00:00Z (before every fixture date); the clock never falls back to wall-clock time."
    roles: [FareAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: POST
    path: "/fare-products"
    description: "Create a fare-product pricing row."
    roles: [FareAdmin]
    code: 201
    input: [origin_zone, destination_zone, ticket_type, base_fare_cents, peak_surcharge_cents, "apportionment_method?"]
    output: FareProduct
    side_effects: []

  - method: POST
    path: "/agencies"
    description: "Create a revenue-sharing agency."
    roles: [FareAdmin]
    code: 201
    input: [code, zones_served]
    output: Agency
    side_effects: []

  - method: POST
    path: "/passengers"
    description: "Register a passenger."
    roles: [FareAdmin]
    code: 201
    input: [email, full_name, date_of_birth]
    output: Passenger
    side_effects: []

  - method: GET
    path: "/passengers/{id}"
    description: "Fetch a passenger (wallet, evasion_count, eligibility)."
    roles: [FareAdmin, Passenger, Conductor]
    code: 200
    input: []
    output: Passenger
    side_effects: []

  - method: POST
    path: "/reduced-fare-applications"
    description: "Submit a reduced-fare application; supersedes any prior SUBMITTED application for the passenger (OCC on passenger version)."
    roles: [Passenger]
    code: 201
    input: [passenger_id, category, proof_document_ref, proof_expires_at, expected_passenger_version]
    output: ReducedFareApplication
    side_effects: ["prior SUBMITTED application -> SUPERSEDED", "increments Passenger.version by 1"]

  - method: GET
    path: "/reduced-fare-applications/{id}"
    description: "Fetch a reduced-fare application."
    roles: [FareAdmin, Passenger]
    code: 200
    input: []
    output: ReducedFareApplication
    side_effects: []

  - method: GET
    path: "/reduced-fare-applications"
    description: "List reduced-fare applications; filter by passenger_id and/or status (reverse-reachability for passenger_id)."
    roles: [FareAdmin, Passenger]
    code: 200
    input: ["passenger_id?", "status?", "limit?", "offset?"]
    output: ReducedFareApplication[]
    side_effects: []

  - method: POST
    path: "/reduced-fare-applications/{id}/approve"
    description: "Approve an application; sets passenger eligibility."
    roles: [FareAdmin]
    code: 200
    input: []
    output: ReducedFareApplication
    side_effects: ["set valid_until", "passenger.reduced_fare_category/valid_until set", "increments Passenger.version by 1"]

  - method: POST
    path: "/reduced-fare-applications/{id}/reject"
    description: "Reject an application."
    roles: [FareAdmin]
    code: 200
    input: [reason]
    output: ReducedFareApplication
    side_effects: ["set decision_reason"]

  - method: POST
    path: "/tickets"
    description: "Purchase a ticket; computes price and revenue allocations."
    roles: [Passenger]
    code: 201
    input: [passenger_id, fare_product_id, travel_period, "use_reduced_fare?", "wallet_apply_cents?"]
    output: Ticket
    side_effects: ["ticket_purchase_price", "revenue_apportionment", "if wallet_apply_cents>0: passenger.wallet_credit_cents -= wallet_apply_cents (increments Passenger.version)"]

  - method: GET
    path: "/tickets/{id}"
    description: "Fetch a ticket (price, allocations, status)."
    roles: [FareAdmin, Passenger, Conductor]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets; filter by passenger_id, fare_product_id, status (reverse-reachability for passenger_id and fare_product_id)."
    roles: [FareAdmin, Passenger, Conductor]
    code: 200
    input: ["passenger_id?", "fare_product_id?", "status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/tickets/{id}/activate"
    description: "Activate a ticket (start validity)."
    roles: [Passenger]
    code: 200
    input: []
    output: Ticket
    side_effects: ["set activated_at, expires_at", "MONTHLY overlap check", "increments Ticket.version by 1"]

  - method: POST
    path: "/tickets/{id}/validate"
    description: "Visual/scan validation consuming a SINGLE ticket."
    roles: [Passenger, Conductor]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> VALIDATED", "increments Ticket.version by 1"]

  - method: POST
    path: "/tickets/{id}/exchange"
    description: "Exchange an unactivated ticket for a different fare product; creates a new ticket."
    roles: [Passenger]
    code: 201
    input: [new_fare_product_id, travel_period, "wallet_apply_cents?"]
    output: Ticket
    side_effects: ["old ticket -> EXCHANGED, allocations zeroed", "new Ticket priced + allocated", "wallet credited if downgrade"]

  - method: POST
    path: "/inspections"
    description: "Conductor inspects a passenger onboard; computes result and fare_shortfall."
    roles: [Conductor]
    code: 201
    input: [passenger_id, "ticket_id?", observed_destination_zone]
    output: Inspection
    side_effects: ["compute result and fare_shortfall_cents"]

  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection."
    roles: [FareAdmin, Conductor]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections; filter by passenger_id and/or ticket_id (reverse-reachability for both FKs)."
    roles: [FareAdmin, Conductor]
    code: 200
    input: ["passenger_id?", "ticket_id?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/upgrades"
    description: "Collect an onboard upgrade for an UPGRADE_REQUIRED inspection; extends the ticket."
    roles: [Conductor]
    code: 201
    input: [inspection_id, ticket_id]
    output: Upgrade
    side_effects: ["upgrade_fare", "ticket.destination_zone = observed zone", "increments Ticket.version by 1"]

  - method: GET
    path: "/upgrades/{id}"
    description: "Fetch an upgrade."
    roles: [FareAdmin, Conductor, Passenger]
    code: 200
    input: []
    output: Upgrade
    side_effects: []

  - method: GET
    path: "/upgrades"
    description: "List upgrades; filter by inspection_id and/or ticket_id (reverse-reachability for both FKs)."
    roles: [FareAdmin, Conductor]
    code: 200
    input: ["inspection_id?", "ticket_id?", "limit?", "offset?"]
    output: Upgrade[]
    side_effects: []

  - method: POST
    path: "/citations"
    description: "Issue a fare-evasion citation from an EVASION inspection; cascades evasion_count and possible eligibility revocation."
    roles: [Conductor]
    code: 201
    input: [inspection_id, passenger_id]
    output: Citation
    side_effects: ["citation_penalty", "passenger.evasion_count += 1", "possible ReducedFareApplication -> REVOKED", "increments Passenger.version by 1"]

  - method: GET
    path: "/citations/{id}"
    description: "Fetch a citation."
    roles: [FareAdmin, Conductor, Passenger]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: GET
    path: "/citations"
    description: "List citations; filter by passenger_id, inspection_id, status (reverse-reachability for passenger_id and inspection_id)."
    roles: [FareAdmin, Conductor, Passenger]
    code: 200
    input: ["passenger_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  - method: POST
    path: "/citations/{id}/pay"
    description: "Pay a citation (from ISSUED or UPHELD)."
    roles: [Passenger]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> PAID", "increments Citation.version by 1"]

  - method: POST
    path: "/citations/{id}/contest"
    description: "Contest an ISSUED citation."
    roles: [Passenger]
    code: 200
    input: [grounds]
    output: Citation
    side_effects: ["status -> CONTESTED", "increments Citation.version by 1"]

  - method: POST
    path: "/citations/{id}/resolve"
    description: "Resolve a contested citation UPHELD or DISMISSED; DISMISSED reverses evasion_count."
    roles: [FareAdmin]
    code: 200
    input: [decision]
    output: Citation
    side_effects: ["status -> UPHELD|DISMISSED", "if DISMISSED: passenger.evasion_count -= 1 (increments Passenger.version)", "increments Citation.version by 1"]

  - method: POST
    path: "/refund-requests"
    description: "Request a refund for a ticket; computes refund_amount."
    roles: [Passenger]
    code: 201
    input: [ticket_id, reason, refund_destination]
    output: RefundRequest
    side_effects: ["refund_amount"]

  - method: GET
    path: "/refund-requests/{id}"
    description: "Fetch a refund request."
    roles: [FareAdmin, Passenger]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []

  - method: GET
    path: "/refund-requests"
    description: "List refund requests; filter by ticket_id and/or status (reverse-reachability for ticket_id)."
    roles: [FareAdmin, Passenger]
    code: 200
    input: ["ticket_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []

  - method: POST
    path: "/refund-requests/{id}/approve"
    description: "Approve a refund; drives ticket to REFUNDED and moves money."
    roles: [FareAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["ticket -> REFUNDED", "allocations zeroed", "wallet credited if WALLET", "increments Ticket.version and (WALLET) Passenger.version"]

  - method: POST
    path: "/refund-requests/{id}/deny"
    description: "Deny a refund."
    roles: [FareAdmin]
    code: 200
    input: [reason]
    output: RefundRequest
    side_effects: ["set decision_reason"]

  - method: POST
    path: "/service-disruptions"
    description: "Record a service disruption; computes delay_minutes/severity and enforces per-line window buffer."
    roles: [FareAdmin]
    code: 201
    input: [line_code, scheduled_departure, actual_departure, window_start, window_end]
    output: ServiceDisruption
    side_effects: ["compute delay_minutes, severity"]

  - method: POST
    path: "/service-credits"
    description: "Issue a service credit for a delay against a ticket; credits the wallet."
    roles: [FareAdmin]
    code: 201
    input: [disruption_id, ticket_id]
    output: ServiceCredit
    side_effects: ["service_credit_amount", "passenger.wallet_credit_cents += credit (increments Passenger.version)"]

  - method: GET
    path: "/service-credits/{id}"
    description: "Fetch a service credit."
    roles: [FareAdmin, Passenger]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

  - method: GET
    path: "/service-credits"
    description: "List service credits; filter by disruption_id, ticket_id, passenger_id (reverse-reachability for all three FKs)."
    roles: [FareAdmin, Passenger]
    code: 200
    input: ["disruption_id?", "ticket_id?", "passenger_id?", "limit?", "offset?"]
    output: ServiceCredit[]
    side_effects: []

  - method: POST
    path: "/service-credits/{id}/void"
    description: "Void an issued service credit; reverses the wallet credit."
    roles: [FareAdmin]
    code: 200
    input: [reason]
    output: ServiceCredit
    side_effects: ["status -> VOIDED", "passenger.wallet_credit_cents -= credit (increments Passenger.version)"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Passenger acts on a resource whose owning passenger_id != X-User-ID."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum, or out-of-range integer."
  - id: ERR_PASSENGER_NOT_FOUND
    http: 404
    condition: "Referenced passenger does not exist."
  - id: ERR_FARE_PRODUCT_NOT_FOUND
    http: 404
    condition: "Referenced fare product does not exist (including the implied product for an upgrade's observed zone)."
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "Referenced ticket does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Referenced reduced-fare application does not exist."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "Referenced inspection does not exist."
  - id: ERR_CITATION_NOT_FOUND
    http: 404
    condition: "Referenced citation does not exist."
  - id: ERR_REFUND_REQUEST_NOT_FOUND
    http: 404
    condition: "Referenced refund request does not exist."
  - id: ERR_DISRUPTION_NOT_FOUND
    http: 404
    condition: "Referenced service disruption does not exist."
  - id: ERR_SERVICE_CREDIT_NOT_FOUND
    http: 404
    condition: "Referenced service credit does not exist."
  - id: ERR_INVALID_TICKET_STATE
    http: 409
    condition: "Ticket not in a state permitting the requested transition."
  - id: ERR_INVALID_CITATION_STATE
    http: 409
    condition: "Citation not in a state permitting the transition."
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "Application not SUBMITTED for approve/reject."
  - id: ERR_INVALID_REFUND_STATE
    http: 409
    condition: "Refund request not REQUESTED for approve/deny."
  - id: ERR_INVALID_CREDIT_STATE
    http: 409
    condition: "Service credit not ISSUED for void."
  - id: ERR_TICKET_NOT_REFUNDABLE
    http: 409
    condition: "Ticket status not refundable (terminal, or ACTIVATED non-MONTHLY)."
  - id: ERR_REDUCED_FARE_NOT_ELIGIBLE
    http: 422
    condition: "use_reduced_fare requested but passenger has no valid reduced-fare eligibility."
  - id: ERR_UPGRADE_TICKET_MISMATCH
    http: 409
    condition: "Upgrade ticket_id does not equal the inspection's ticket_id."
  - id: ERR_TICKET_ACTIVATION_EXPIRED
    http: 409
    condition: "Activation attempted after TICKET_ACTIVATION_DEADLINE_DAYS from purchase."
  - id: ERR_TICKET_EXPIRED
    http: 409
    condition: "Scan validation attempted after ticket.expires_at."
  - id: ERR_REFUND_WINDOW_ELAPSED
    http: 409
    condition: "Refund requested after REFUND_WINDOW_DAYS from purchase."
  - id: ERR_NO_EVASION_FOUND
    http: 409
    condition: "Citation attempted on an inspection whose result is not EVASION."
  - id: ERR_UPGRADE_NOT_REQUIRED
    http: 409
    condition: "Upgrade attempted on an inspection whose result is not UPGRADE_REQUIRED (observed zone not beyond ticket destination)."
  - id: ERR_SENIOR_AGE_NOT_MET
    http: 422
    condition: "SENIOR approval attempted for a passenger under SENIOR_MIN_AGE."
  - id: ERR_PASS_PERIOD_OVERLAP
    http: 409
    condition: "Activating a MONTHLY ticket whose validity month overlaps an existing ACTIVATED MONTHLY ticket for the same passenger and zone pair."
  - id: ERR_DISRUPTION_WINDOW_CONFLICT
    http: 409
    condition: "New disruption window is within DISRUPTION_BUFFER_MINUTES of an existing window on the same line."
  - id: ERR_DELAY_BELOW_THRESHOLD
    http: 422
    condition: "Service credit requested for a disruption with delay_minutes < SERVICE_CREDIT_MIN_DELAY_MINUTES."
  - id: ERR_INSUFFICIENT_WALLET
    http: 402
    condition: "wallet_apply_cents exceeds passenger.wallet_credit_cents."
  - id: ERR_STALE_PASSENGER_VERSION
    http: 412
    condition: "expected_passenger_version does not match current Passenger.version on application create (OCC)."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Passenger
    description: "A rider acting on their own tickets, applications, refunds, and citations."
    identity: "entity_backed:Passenger"
    exclusive_operations:
      - "POST /reduced-fare-applications"
      - "POST /tickets"
      - "POST /tickets/{id}/activate"
      - "POST /tickets/{id}/exchange"
      - "POST /refund-requests"
      - "POST /citations/{id}/pay"
      - "POST /citations/{id}/contest"
    shared_operations:
      - "POST /tickets/{id}/validate (with Conductor)"
      - "GET /passengers/{id}, /tickets, /tickets/{id}, /upgrades/{id}, /citations, /citations/{id}, /reduced-fare-applications*, /refund-requests*, /service-credits*"

  - name: Conductor
    description: "Onboard staff performing inspections, upgrades, and citations."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections"
      - "POST /upgrades"
      - "POST /citations"
    shared_operations:
      - "POST /tickets/{id}/validate (with Passenger)"
      - "GET /passengers/{id}, /tickets, /tickets/{id}, /inspections*, /upgrades*, /citations*"

  - name: FareAdmin
    description: "Fare configuration and back-office operator: products, agencies, passenger registration, approvals, disruptions, credits, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /fare-products"
      - "POST /agencies"
      - "POST /passengers"
      - "POST /reduced-fare-applications/{id}/approve"
      - "POST /reduced-fare-applications/{id}/reject"
      - "POST /refund-requests/{id}/approve"
      - "POST /refund-requests/{id}/deny"
      - "POST /citations/{id}/resolve"
      - "POST /service-disruptions"
      - "POST /service-credits"
      - "POST /service-credits/{id}/void"
    shared_operations:
      - "GET read endpoints across the system"

