scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: term_creation_applies_defaults
        claim_type: defaults
        grounds:
          - entities.AcademicTerm.fields.singleton_section_cap
          - entities.AcademicTerm.fields.change_request_max_per_student
        distinguishing_aspect: "Omitting optional fields on POST /scheduling/terms applies defaults singleton_section_cap=2 and change_request_max_per_student=3; posture starts COLLECTING and version == 1."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /scheduling/terms"
              payload: { code: "2040-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_def: "$.data.id", t_cap: "$.data.singleton_section_cap", t_max: "$.data.change_request_max_per_student", t_posture: "$.data.posture" }
          assert:
            - "singleton_section_cap == 2 and change_request_max_per_student == 3 (defaults applied)"
            - "posture == COLLECTING and version == 1"
      - name: term_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.AcademicTerm.fields.periods_per_day
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /scheduling/terms without periods_per_day fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /scheduling/terms"
              payload: { code: "2040-SPR", max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"
      - name: student_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Student.fields.planned_credit_load
          - entities.Student.fields.credit_deficient
        distinguishing_aspect: "Client-supplied planned_credit_load / credit_deficient values on POST /scheduling/students are ignored; the response carries computed defaults 0 and false."
        test_recipe:
          setup:
            - "counselor c_e exists"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Ent", max_caseload: 50 }
              as: Administrator
              captures: { c_e: "$.data.id" }
          trigger:
            - call: "POST /scheduling/students"
              payload: { external_ref: "CMP", full_name: "Computed Stu", grade_level: 9, counselor_id: "${c_e}", planned_credit_load: 99.0, credit_deficient: true }
              as: Administrator
              captures: { s_cmp: "$.data.id", s_load: "$.data.planned_credit_load", s_flag: "$.data.credit_deficient" }
          assert:
            - "planned_credit_load == 0 and credit_deficient == false (input ignored)"
      - name: get_missing_entity_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /scheduling/courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Administrator
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"
      - name: course_credit_step_constraint_enforced
        claim_type: type_constraints
        grounds:
          - entities.Course.fields.credits
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "credits must be a 0.25 step within [0.25, 2.00]; 1.10 is rejected."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /scheduling/courses"
              payload: { course_code: "BAD-1", title: "Bad", credits: 1.10, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { step_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"
      - name: teacher_qualification_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.TeacherQualification
        distinguishing_aspect: "common_fields: false — TeacherQualification carries id + created_at only; no version field and no update endpoint exist."
        test_recipe:
          setup:
            - "teacher t_q and course k_q exist"
          setup_api_calls:
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Q", max_sections: 3 }
              as: Administrator
              captures: { t_q: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "Q-1", title: "Qual Course", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_q: "$.data.id" }
          trigger:
            - call: "POST /scheduling/teachers/${t_q}/qualifications"
              payload: { course_id: "${k_q}", qualified_at: "2026-02-01T00:00:00Z" }
              as: Administrator
              captures: { tq_id: "$.data.id" }
          assert:
            - "response contains id and created_at; response has no version field"
      - name: fk_reverse_reachability_section_roster
        claim_type: parent_relationships
        grounds:
          - entities.ScheduleEntry.fields.section_id
        distinguishing_aspect: "GET /scheduling/sections/{id}/roster returns ScheduleEntry[] filtered by section; empty array when no enrollments."
        test_recipe:
          setup:
            - "term t_r created; section sec_r generated but not yet placed (BUILDING)"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Rr", max_caseload: 50 }
              as: Administrator
              captures: { c_rr: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2041-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_r: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "RR-1", title: "Roster", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_rr: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "RR", full_name: "Rr Stu", grade_level: 9, counselor_id: "${c_rr}" }
              as: Administrator
              captures: { s_rr: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_rr}", course_id: "${k_rr}", term_id: "${t_r}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_rr}"
              captures: { rq_rr: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_rr}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_rr}"
            - call: "POST /scheduling/terms/${t_r}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${t_r}/generate-sections"
              payload: {}
              as: Administrator
          trigger:
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_r: "$.data[0].id" }
            - call: "GET /scheduling/sections/${sec_r}/roster"
              as: Administrator
              captures: { roster_rows: "$.data" }
          assert:
            - "roster returns an empty array for the unplaced DRAFT section (FK reverse-reachability works)"
      - name: course_prerequisite_self_reference
        claim_type: graph_topology
        grounds:
          - entities.Course.fields.prerequisite_course_id
        distinguishing_aspect: "A course may name another course as prerequisite (self-referential FK); a student who has neither earned credit for nor is enrolled in the prerequisite is rejected ERR_COURSE_INELIGIBLE."
        test_recipe:
          setup:
            - "courses k_pre (MATH-201) and k_seq (MATH-302 with prerequisite k_pre); term COLLECTING; student s_seq grade 10 with earned_credits 0 and no enrollment in k_pre"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Pre", max_caseload: 50 }
              as: Administrator
              captures: { c_pre: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2042-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_pre: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "MATH-201", title: "Algebra I", credits: 1.0, subject_area: "MATH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_pre: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "MATH-302", title: "Algebra IIx", credits: 1.0, subject_area: "MATH", grade_band_min: 9, grade_band_max: 12, prerequisite_course_id: "${k_pre}" }
              as: Administrator
              captures: { k_seq: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "SEQ", full_name: "Seq Stu", grade_level: 10, counselor_id: "${c_pre}", earned_credits: 0 }
              as: Administrator
              captures: { s_seq: "$.data.id" }
          trigger:
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_seq}", course_id: "${k_seq}", term_id: "${t_pre}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_seq}"
              captures: { rq_seq: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_seq}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_seq}"
              captures: { pre_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_COURSE_INELIGIBLE (422): prerequisite MATH-201 neither earned nor in progress"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: request_starts_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.CourseRequest
        distinguishing_aspect: "A newly created CourseRequest has state == DRAFT and tally_weight == 0."
        test_recipe:
          setup:
            - "term COLLECTING, course k_i, student s_i exist"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Ini", max_caseload: 50 }
              as: Administrator
              captures: { c_i: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2043-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_i: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "INI-1", title: "Init", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_i: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "INI", full_name: "Ini Stu", grade_level: 9, counselor_id: "${c_i}" }
              as: Administrator
              captures: { s_i: "$.data.id" }
          trigger:
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_i}", course_id: "${k_i}", term_id: "${t_i}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_i}"
              captures: { rq_i: "$.data.id", rq_state: "$.data.state", rq_w: "$.data.tally_weight" }
          assert:
            - "state == DRAFT and tally_weight == 0"
      - name: unsubmit_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CourseRequest.SUBMITTED_to_DRAFT
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "unsubmit is legal only from SUBMITTED; calling it on a DRAFT request returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "DRAFT request rq_d exists in a COLLECTING term"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Inv", max_caseload: 50 }
              as: Administrator
              captures: { c_inv: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2044-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_inv: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "INV-1", title: "Inv", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_inv: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "INV", full_name: "Inv Stu", grade_level: 9, counselor_id: "${c_inv}" }
              as: Administrator
              captures: { s_inv: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_inv}", course_id: "${k_inv}", term_id: "${t_inv}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_inv}"
              captures: { rq_d: "$.data.id" }
          trigger:
            - call: "POST /scheduling/course-requests/${rq_d}/unsubmit"
              payload: {}
              as: Student
              as_user_id: "${s_inv}"
              captures: { inv_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
      - name: terminal_placement_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RecoveryPlacement
        distinguishing_aspect: "A WAIVED RecoveryPlacement rejects place with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup:
            - "PENDING recovery placement rp_t for student s_t; admin waives it"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Term", max_caseload: 50 }
              as: Administrator
              captures: { c_t: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2045-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_t: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "TRM-1", title: "Term Course", credits: 1.0, subject_area: "ENGLISH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_t: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "TRM", full_name: "Term Stu", grade_level: 12, counselor_id: "${c_t}", earned_credits: 10.0 }
              as: Administrator
              captures: { s_t: "$.data.id" }
            - call: "POST /scheduling/recovery-placements"
              payload: { student_id: "${s_t}", term_id: "${t_t}", target_course_id: "${k_t}" }
              as: Counselor
              as_user_id: "${c_t}"
              captures: { rp_t: "$.data.id" }
            - call: "POST /scheduling/recovery-placements/${rp_t}/waive"
              payload: { waiver_reason: "IEP team waives recovery this term" }
              as: Administrator
          trigger:
            - call: "POST /scheduling/recovery-placements/${rp_t}/place"
              payload: {}
              as: Counselor
              as_user_id: "${c_t}"
              captures: { lock_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409): WAIVED is terminal"
      - name: appointment_complete_side_effect_version
        claim_type: side_effect_execution
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
        distinguishing_aspect: "complete flips state to COMPLETED and increments version by exactly 1; no other entity mutates."
        test_recipe:
          setup:
            - "BOOKED appointment ap_c for counselor c_c and student s_c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T07:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Cmp", max_caseload: 50 }
              as: Administrator
              captures: { c_c: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "CMP2", full_name: "Cmp Stu", grade_level: 9, counselor_id: "${c_c}" }
              as: Administrator
              captures: { s_c: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c_c}", student_id: "${s_c}", start_at: "2026-05-12T09:00:00Z", end_at: "2026-05-12T09:30:00Z" }
              as: Counselor
              as_user_id: "${c_c}"
              captures: { ap_c: "$.data.id", ap_v: "$.data.version" }
          trigger:
            - call: "POST /scheduling/appointments/${ap_c}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${c_c}"
              captures: { ap_c2: "$.data.state", ap_v2: "$.data.version" }
          assert:
            - "state == COMPLETED and version == ${ap_v} + 1"
      - name: guarded_transition_publish_blocked
        claim_type: guarded_transitions
        grounds:
          - state_machines.AcademicTerm.BUILDING_to_PUBLISHED
          - "errors[ERR_PUBLISH_BLOCKED]"
        distinguishing_aspect: "publish is guarded by child state: any DRAFT section in the term blocks the transition with ERR_PUBLISH_BLOCKED (409)."
        test_recipe:
          setup:
            - "term t_g in BUILDING with one unscheduled DRAFT section"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Grd", max_caseload: 50 }
              as: Administrator
              captures: { c_g: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2046-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_g: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "GRD-1", title: "Guard", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_g: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "GRD", full_name: "Guard Stu", grade_level: 9, counselor_id: "${c_g}" }
              as: Administrator
              captures: { s_g: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_g}", course_id: "${k_g}", term_id: "${t_g}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_g}"
              captures: { rq_g: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_g}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_g}"
            - call: "POST /scheduling/terms/${t_g}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${t_g}/generate-sections"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /scheduling/terms/${t_g}/publish"
              payload: {}
              as: Administrator
              captures: { pub_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PUBLISH_BLOCKED (409): a DRAFT section remains"
      - name: close_window_blocked_by_inflight_requests
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AcademicTerm.CHANGE_WINDOW_to_LOCKED
          - "errors[ERR_CLOSE_WINDOW_BLOCKED]"
        distinguishing_aspect: "close-change-window is rejected ERR_CLOSE_WINDOW_BLOCKED while any change request is in SUBMITTED/COUNSELOR_REVIEW/REVISED/APPROVED."
        test_recipe:
          setup:
            - "term t_cw in CHANGE_WINDOW; student s_cw enrolled in one section; a SUBMITTED DROP change request exists"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C CW", max_caseload: 50 }
              as: Administrator
              captures: { c_cw: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2047-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_cw: "$.data.id" }
            # NOTE for the test-generator: standard chain to CHANGE_WINDOW with
            # s_cw enrolled, then create the SUBMITTED DROP request below.
            - call: "POST /scheduling/students"
              payload: { external_ref: "CW", full_name: "Cw Stu", grade_level: 9, counselor_id: "${c_cw}" }
              as: Administrator
              captures: { s_cw: "$.data.id" }
            - call: "GET /scheduling/students/${s_cw}/schedule"
              as: Administrator
              captures: { entry_cw: "$.data[0].id" }
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_cw}", term_id: "${t_cw}", kind: "DROP", drop_entry_id: "${entry_cw}", reason: "Blocking close for test" }
              as: Student
              as_user_id: "${s_cw}"
          trigger:
            - call: "POST /scheduling/terms/${t_cw}/close-change-window"
              payload: {}
              as: Administrator
              captures: { cw_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CLOSE_WINDOW_BLOCKED (409) while the SUBMITTED request exists"
      - name: idempotent_second_submit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.CourseRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submitting the same request twice: the second submit observes state == SUBMITTED and fails ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "request rq_idem SUBMITTED in a COLLECTING term"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Idem", max_caseload: 50 }
              as: Administrator
              captures: { c_idem: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2048-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_idem: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "IDM-1", title: "Idem", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_idem: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "IDM", full_name: "Idem Stu", grade_level: 9, counselor_id: "${c_idem}" }
              as: Administrator
              captures: { s_idem: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_idem}", course_id: "${k_idem}", term_id: "${t_idem}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_idem}"
              captures: { rq_idem: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_idem}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_idem}"
          trigger:
            - call: "POST /scheduling/course-requests/${rq_idem}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_idem}"
              captures: { idem_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409) on the second submit"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: tally_weight_alternate_half_weight
        claim_type: constants_applied
        grounds:
          - calculations.section_count_tally
        distinguishing_aspect: "Alternate requests contribute exactly 0.5 to demand: 1 primary + 2 alternates on the same course -> demand 2.0 in the final tally (verified via preview which counts SUBMITTED at full/alternate weight)."
        test_recipe:
