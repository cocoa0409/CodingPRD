            - call: "POST /tower-colo/structural-analyses/${cb_an_id}/quotation"
              payload: { modification_construction_cost_cents: 1000000 }
              as: StructuralEngineer
              as_user_id: "eng-1"
            - call: "POST /tower-colo/modification-projects"
              payload: { tower_id: "${cb_t_id}", originating_analysis_id: "${cb_an_id}", construction_window_start_date: "2026-09-01", construction_window_end_date: "2026-10-31", allocation_basis: "PRO_RATA_LOAD" }
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { cb_proj_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${cb_app_id}/withdraw"
              payload: {}
              as: Tenant
              as_user_id: "${cb_ten_id}"
          trigger:
            - call: "POST /tower-colo/modification-projects/${cb_proj_id}/allocate-cost-shares"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-2"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COST_SHARE_BENEFICIARY_INVALID"
            - "ModificationProject.${cb_proj_id}.status == PROPOSED"
            - "ModificationProject.${cb_proj_id}.allocated_cents == 0"
            - "GET /tower-colo/cost-shares with modification_project_id ${cb_proj_id} returns total_count == 0"

      - name: buyout_rejected_when_price_is_zero
        claim_type: conditional_validation
        grounds:
          - validations.priority_35
          - errors.ERR_BUYOUT_NOT_AVAILABLE
        distinguishing_aspect: |
          buyout_price_cents 0 is the encoding for "no buyout was negotiated", so the buyout action
          is refused with 422 and the lease stays ACTIVE with buyout_paid_cents 0 — a zero-price
          buyout must not be treated as a free acquisition.
        test_recipe:
          setup:
            - "Tower BYZ has an ACTIVE ground lease whose buyout_price_cents is 0."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Buyout Zero Basin", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { bz_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Zero Basin Land", remit_contact_email: "ap@zerobasin.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { bz_ll_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${bz_t_id}", landlord_id: "${bz_ll_id}", base_monthly_rent_cents: 300000, escalator_pct: 2.0, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 0 }
              as: PortfolioAdmin
              captures: { bz_gl_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/ground-leases/${bz_gl_id}/buyout"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_BUYOUT_NOT_AVAILABLE"
            - "GroundLease.${bz_gl_id}.status == ACTIVE"
            - "GroundLease.${bz_gl_id}.buyout_paid_cents == 0"

      - name: tenant_payment_of_zero_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_36
          - errors.ERR_INVALID_PAYMENT_AMOUNT
        distinguishing_aspect: |
          amount_cents must be strictly positive: 0 returns 422 ERR_INVALID_PAYMENT_AMOUNT and
          leaves the balance untouched, while 1 cent is accepted and drives the balance to -1 —
          overpayment is representable but a no-op payment is not.
        test_recipe:
          setup:
            - "Tenant PZR exists with outstanding_balance_cents 0 and credit_status CURRENT."
          setup_api_calls:
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Payment Zero Radio", carrier_code: "PZR" }
              as: PortfolioAdmin
              captures: { pz_ten_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/tenants/${pz_ten_id}/payments"
              payload: { amount_cents: 0 }
              as: PortfolioAdmin
            - call: "POST /tower-colo/tenants/${pz_ten_id}/payments"
              payload: { amount_cents: 1 }
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns 422 with error_id == ERR_INVALID_PAYMENT_AMOUNT"
            - "trigger call 2 returns 200 with outstanding_balance_cents == -1 and credit_status == CURRENT"

      - name: clock_set_to_earlier_or_equal_instant_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_38
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: |
          The logical clock is strictly monotonic: after moving to 2026-09-01T00:00:00Z, both an
          earlier target (2026-08-15) and a repeat of the current instant are refused with 422, so
          no test can rewind time and re-run an expiry sweep.
        test_recipe:
          setup:
            - "No fixtures beyond the default 2026-08-01T00:00:00Z clock are needed."
          setup_api_calls:
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns 422 with error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "trigger call 2 returns 422 with error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "trigger call 3 returns 200 with current_utc == 2026-09-01T00:00:01Z"

      - name: corner_privilege_suspension_outranks_no_equipment_lines
        claim_type: priority_ordering
        grounds:
          - validations.priority_12
          - validations.priority_20
        excluded_because:
          difficulty_instance: privilege_suspension_outranks_missing_equipment_lines_returns_409
          rationale: "The §1.8 instance submits a line-less application under a SUSPENDED privilege and asserts 409 ERR_MLA_PRIVILEGE_SUSPENDED, then 422 ERR_NO_EQUIPMENT_LINES after reinstatement."

      - name: corner_whole_month_period_outranks_missing_w9
        claim_type: priority_ordering
        grounds:
          - validations.priority_28
          - validations.priority_33
        excluded_because:
          difficulty_instance: whole_month_period_outranks_missing_w9_returns_422
          rationale: "The §1.8 instance violates both rules on one landlord payment and asserts ERR_PAYMENT_PERIOD_NOT_WHOLE_MONTHS wins."

      - name: corner_window_conflict_outranks_missing_quotation
        claim_type: priority_ordering
        grounds:
          - validations.priority_22
          - validations.priority_37
        excluded_because:
          difficulty_instance: window_conflict_outranks_missing_quotation_returns_409
          rationale: "The §1.8 instance creates an overlapping project from an un-quoted analysis and asserts the 409 ERR_CONSTRUCTION_WINDOW_CONFLICT."

      - name: corner_elevation_band_buffer_violation
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
        excluded_because:
          difficulty_instance: elevation_band_buffer_rejected_at_one_foot_separation
          rationale: "The §1.8 instance asserts rejection at 1 ft separation and acceptance at exactly the 2 ft buffer."

      - name: corner_construction_window_overlap
        claim_type: temporal_validation
        grounds:
          - validations.priority_22
        excluded_because:
          difficulty_instance: construction_window_conflict_on_single_shared_day
          rationale: "The §1.8 instance asserts the closed-interval overlap on one shared day and acceptance one day later."

      - name: corner_landlord_payment_period_overlap_and_gap
        claim_type: temporal_validation
        grounds:
          - validations.priority_26
          - validations.priority_27
        excluded_because:
          difficulty_instance: landlord_payment_period_overlap_and_gap_rejected
          rationale: "The §1.8 instance covers both the re-covered period and the skipped month against the same paid_through_date."

      - name: corner_ground_lease_not_active_blocks_execute
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_13
        excluded_because:
          difficulty_instance: amendment_execute_rejected_when_ground_lease_expired
          rationale: "The §1.8 instance expires the ground lease by clock advance and asserts 409 ERR_GROUND_LEASE_NOT_ACTIVE on execute."

      - name: corner_tenant_delinquency_blocks_execute
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_34
        excluded_because:
          difficulty_instance: amendment_execute_rejected_when_tenant_delinquent_returns_402
          rationale: "The §1.8 instance drives the tenant over the delinquency threshold by audit billing and asserts 402 on execute."

      - name: corner_frozen_posture_blocks_revise
        claim_type: conditional_validation
        grounds:
          - validations.priority_14
        excluded_because:
          difficulty_instance: revise_rejected_when_tower_posture_frozen
          rationale: "The §1.8 instance freezes the tower through ground-lease expiry and asserts 409 ERR_TOWER_POSTURE_FROZEN on revise."

  - section: endpoints
