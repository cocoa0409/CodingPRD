            - call: "POST /drone-ops/aircraft/${ar1}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${r1}", model: "Gate 2", serial_number: "SN-GAT-02", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${r1}"
              captures: { ar2: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-GAT", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
