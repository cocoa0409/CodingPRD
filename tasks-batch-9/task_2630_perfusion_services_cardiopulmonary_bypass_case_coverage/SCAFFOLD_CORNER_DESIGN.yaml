              payload: { contract_id: "${c1}", perfusionist_id: "${p_off}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { e_inactive_holder: $.data.error_id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p_plain}", slot_type: "ECMO_RELIEF", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { e_privilege: $.data.error_id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p_plain}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
