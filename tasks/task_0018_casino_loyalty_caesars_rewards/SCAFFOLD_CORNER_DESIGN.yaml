      - name: scheduled_action_cancel_annual_reset_before_due
        claim_type: scheduled_deferred_actions
        grounds:
          - state_machines.AnnualResetRun.SCHEDULED_to_CANCELLED
          - endpoints[POST /annual-reset-runs/{id}/cancel]
        distinguishing_aspect: "Cancelling AnnualResetRun before scheduled_for transitions to CANCELLED and prevents execution."
        test_recipe:
          setup: ["A SCHEDULED AnnualResetRun"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
