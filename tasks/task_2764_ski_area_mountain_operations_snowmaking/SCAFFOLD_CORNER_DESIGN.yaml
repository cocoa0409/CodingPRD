        grounds:
          - validations[priority=12]
          - errors[ERR_TERRAIN_STATE_INVALID]
          - state_machines.TerrainArea.READY_to_OPEN
        distinguishing_aspect: |
          decision=OPEN is only declared from READY and from PATROL_HOLD. A second area is walked only
          as far as PREP (a grooming dispatch moved it out of CLOSED) and the decision is attempted
          there. The corner is that the season is already OPERATING and a published day plan exists, so
