# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — COBRA Administration
# 9 Difficulty Rules × 2 instances = 18 instances.
# Canonical fixtures (reused by most instances):
#   Plan A: applicable_premium_cents=60000, std fee 2% -> monthly premium 61200,
#           disability fee 50% -> disability premium 90000.
#   Event: TERMINATION, coverage_loss_date 2026-04-01 -> coverage month 1 = 2026-04,
#           18-month scheduled_end 2027-09-30, run-to-term creditable_months 18.
#   Election notice sent at clock 2026-03-25 -> anchor max(2026-04-01,2026-03-25)=2026-04-01,
#           election_deadline 2026-05-31.
#   Election at clock 2026-04-10 -> initial_premium_due_date 2026-05-25.
#   Insignificant-shortfall allowance = max(5000, round_half_up(0.10*61200)) = 6120.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: first_month_full_vs_prorated_premium_diverge
        grounds:
          - calculations.first_month_amount_due
          - entities.PremiumInvoice.fields.amount_due_cents
          - entities.PremiumInvoice.fields.proration_mode
        distinguishing_aspect: |
          On a PremiumInvoice (billing domain), FULL_MONTH bills the full gross 61200
          while DAILY_PRORATED bills 30600 for a 2026-04-16 coverage_start (15/30 days) —
          identical premium inputs, two amount_due_cents results.
        test_recipe:
          setup:
            - "Plan A created (premium 61200). Beneficiary B-mid registered, TERMINATION event coverage_loss 2026-04-16, elected, enrollment ACTIVE with a paid first month, account A-mid exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Mid", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-16T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04", proration_mode: "DAILY_PRORATED" }
              as: BillingAgent
              captures: { inv_id: $.data.id }
          assert:
            - "PremiumInvoice.${inv_id}.gross_premium_cents == 61200"
            - "PremiumInvoice.${inv_id}.amount_due_cents == 30600"
            - "PremiumInvoice.${inv_id}.proration_mode == DAILY_PRORATED"

      - name: subsidy_chronological_lock_vs_forward_recompute_diverge
        grounds:
          - calculations.subsidy_applied
          - entities.SubsidyGrant.fields.status
          - entities.PremiumInvoice.fields.subsidy_applied_cents
        distinguishing_aspect: |
          On the SubsidyGrant/PremiumInvoice domain, a PAID invoice's subsidy stays locked at
          the chronologically-applied value (39780) after the grant is revoked, while a future
          OPEN invoice recomputes to 0 — same revoke action, two ledger outcomes.
        test_recipe:
          setup:
            - "Plan A enrollment ACTIVE on beneficiary B-sub; one 65% SubsidyGrant covering 2026-05..2026-12; May invoice (idx2) issued and PAID with subsidy 39780; June invoice OPEN."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Sub", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /enrollments/${enr_id}/subsidies"
              payload: { subsidy_pct: 0.65, start_month: "2026-05", end_month: "2026-12" }
              as: PlanAdministrator
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-05" }
              as: BillingAgent
              captures: { may_inv_id: $.data.id }
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 21420, target_coverage_month: "2026-05" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-06" }
              as: BillingAgent
              captures: { jun_inv_id: $.data.id }
          trigger:
            - call: "POST /subsidies/${sub_id}/revoke"
              payload: {}
              as: PlanAdministrator
          assert:
            - "PremiumInvoice.${may_inv_id}.status == PAID"
            - "PremiumInvoice.${may_inv_id}.subsidy_applied_cents == 39780"
            - "PremiumInvoice.${jun_inv_id}.subsidy_applied_cents == 0"
            - "PremiumInvoice.${jun_inv_id}.beneficiary_owed_cents == 61200"

  - rule_id: combinatorial_formula
    instances:
      - name: gross_premium_tiered_standard_vs_disability_branch
        grounds:
          - calculations.gross_monthly_premium
          - entities.CobraEnrollment.fields.disability_extension
          - entities.PremiumInvoice.fields.coverage_month_index
        distinguishing_aspect: |
          Mode (a): gross_premium selects fee tier from THREE inputs (applicable_premium_cents,
          coverage_month_index, disability_extension) with a branch — month 19 (2027-10) of a
          disability-extended enrollment bills 90000 (150%) versus 61200 (102%) for a standard month.
        test_recipe:
          setup:
            - "Plan A enrollment ACTIVE, disability extension applied (scheduled_end 2028-08-31); clock advanced to month 19; invoice for 2027-10 (idx19) generated."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Disab", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /enrollments/${enr_id}/apply-disability-extension"
              payload: { determination_date: "2026-05-01T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2027-10-01T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2027-10" }
              as: BillingAgent
              captures: { inv19_id: $.data.id }
          assert:
            - "PremiumInvoice.${inv19_id}.coverage_month_index == 19"
            - "PremiumInvoice.${inv19_id}.gross_premium_cents == 90000"
            - "PremiumInvoice.${inv19_id}.amount_due_cents == 90000"

      - name: paid_through_date_circular_order_payment_then_threshold
        grounds:
          - calculations.paid_through_date
          - calculations.deemed_full_payment
          - entities.PremiumAccount.fields.paid_through_date
        distinguishing_aspect: |
          Mode (c): paid_through_date is well-defined only because evaluation order is pinned —
          deemed_full_payment (shortfall<=allowance) is computed FIRST per month, then paid_through_date
          consumes that satisfaction flag; a 55080 payment (shortfall 6120==allowance) flips month 2 to
          satisfied and advances paid_through_date to 2026-05-31.
        test_recipe:
          setup:
            - "Plan A enrollment ACTIVE, April fully paid (61200). May invoice OPEN, owed 61200, allowance 6120."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Ptd", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-05" }
              as: BillingAgent
          trigger:
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 55080, target_coverage_month: "2026-05" }
              as: BillingAgent
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.deemed_full_payment == true"
            - "PremiumAccount.${acct_id}.paid_through_date == 2026-05-31"

  - rule_id: non_linear_state_machine
    instances:
      - name: qualifying_event_branch_elected_vs_lapsed
        grounds:
          - state_machines.QualifyingEvent.NOTICE_SENT_to_ELECTED
          - state_machines.QualifyingEvent.NOTICE_SENT_to_LAPSED
          - entities.QualifyingEvent.fields.status
        distinguishing_aspect: |
          On QualifyingEvent, NOTICE_SENT forks: /notices/elect drives ELECTED (creates enrollment),
          while the tick sweep past election_deadline drives LAPSED (no enrollment, beneficiary
          COVERAGE_ENDED) — divergent side-effect sets from one state.
        test_recipe:
          setup:
            - "Plan A; event recorded; notice sent (deadline 2026-05-31); election window left to expire."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Lapse", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-05T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plans/${plan_id}/tick"
              payload: {}
              as: PlanAdministrator
          assert:
            - "QualifyingEvent.${event_id}.status == LAPSED"
            - "ElectionNotice.${notice_id}.status == EXPIRED"
            - "QualifiedBeneficiary.${ben_id}.status == COVERAGE_ENDED"

      - name: enrollment_branch_terminate_early_vs_run_to_term
        grounds:
          - state_machines.CobraEnrollment.ACTIVE_to_TERMINATED
          - entities.CobraEnrollment.fields.termination_reason
          - entities.CobraEnrollment.fields.actual_end_date
        distinguishing_aspect: |
          On CobraEnrollment, ACTIVE forks to TERMINATED via different triggers: terminate-early
          (OTHER_GROUP_COVERAGE, actual_end_date=clock now 2026-06-15) versus the run-to-term tick
          (RUN_TO_TERM, actual_end_date=scheduled_end 2027-09-30) — same target state, distinct
          reason+end-date side effects on different entity than instance 1.
        test_recipe:
          setup:
            - "Plan A enrollment ACTIVE (April paid); administrator terminates early for OTHER_GROUP_COVERAGE at clock 2026-06-15."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Early", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /enrollments/${enr_id}/terminate-early"
              payload: { reason: "OTHER_GROUP_COVERAGE" }
              as: PlanAdministrator
          assert:
            - "CobraEnrollment.${enr_id}.status == TERMINATED"
            - "CobraEnrollment.${enr_id}.termination_reason == OTHER_GROUP_COVERAGE"
            - "CobraEnrollment.${enr_id}.actual_end_date == 2026-06-15"
            - "QualifiedBeneficiary.${ben_id}.status == COVERAGE_ENDED"

  - rule_id: transitive_cascade
    instances:
      - name: election_cascade_event_to_notice_to_enrollment_to_account
        grounds:
          - state_machines.QualifyingEvent.NOTICE_SENT_to_ELECTED
          - entities.CobraEnrollment.fields.status
          - entities.PremiumAccount.fields.initial_premium_due_date
        distinguishing_aspect: |
          Depth-3 cascade from /notices/elect: ELECTED mutates the ElectionNotice; that election
          creates a CobraEnrollment (link 2 caused by link 1); the enrollment creation itself
          creates the PremiumAccount with computed monthly_premium_cents 61200 (link 3 caused by link 2).
        test_recipe:
          setup:
            - "Plan A; event recorded; notice sent (OUTSTANDING); clock 2026-04-10 within window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Cascade", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
          assert:
            - "ElectionNotice.${notice_id}.status == ELECTED"
            - "CobraEnrollment.${enr_id}.status == PENDING_INITIAL_PREMIUM"
            - "CobraEnrollment.${enr_id}.coverage_start_date == 2026-04-01"
            - "PremiumAccount.${acct_id}.monthly_premium_cents == 61200"
            - "PremiumAccount.${acct_id}.initial_premium_due_date == 2026-05-25"

  # second transitive_cascade instance (different trigger, depth>=2)
      - name: nonpayment_tick_cascade_enrollment_to_invoices_to_certificate
        grounds:
          - state_machines.CobraEnrollment.ACTIVE_to_TERMINATED
          - entities.PremiumInvoice.fields.status
          - entities.HipaaCertificate.fields.creditable_months
        distinguishing_aspect: |
          Depth-3 cascade from the recurring-nonpayment tick: the sweep TERMINATES the enrollment;
          that termination VOIDs the trailing OPEN May invoice (link 2 caused by link 1); the same
          termination creates a HipaaCertificate with creditable_months 1 (link 3 caused by link 1),
          originating from a different trigger than the election cascade.
        test_recipe:
          setup:
            - "Plan A enrollment ACTIVE: April paid (paid_through 2026-04-30); May invoice OPEN and unpaid; clock advanced past May recurring grace (2026-05-31) to 2026-06-05."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B NonPay", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
