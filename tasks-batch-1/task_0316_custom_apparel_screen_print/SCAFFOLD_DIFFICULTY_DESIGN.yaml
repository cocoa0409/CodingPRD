            - call: "POST /garment-styles/${style_id}/blank-skus"
              payload: { color: "BLACK", size: "L", total_stock_qty: 200 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { garment_style_id: "${style_id}", decoration_method_id: "${method_id}", color: "BLACK", num_locations: 2, num_colors: 3, size_run: { L: 72 } }
              as: ShopManager
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "Front", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { dep_before: $.data.outstanding_deposit_cents }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: ShopManager
              captures: { order_dep_after: $.data.deposit_paid_cents }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { dep_after: $.data.outstanding_deposit_cents }
          assert:
            - "Before cancel: Customer.outstanding_deposit_cents == 59700"
            - "After cancel: Customer.outstanding_deposit_cents == 0 and Order.deposit_paid_cents == 0 (deposit fully refunded, baseline restored)"
