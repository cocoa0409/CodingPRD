            - "${e_cap_intake} == ERR_UNAUTHORIZED (403) and ${e_cap_drv} == ERR_UNAUTHORIZED (403), but ${e_cap_bill} == ERR_CONTRACT_NOT_FOUND (404): the role excluded from the risk read is the one admitted to the cap read"
            - "${e_man_audit} == ERR_UNAUTHORIZED (403) but ${e_man_drv} == ERR_ROUTE_NOT_FOUND (404): the manifest is the one computed read the auditor cannot see and the driver can — the exclusions are per endpoint, not a single privilege tier"
            - "${e_contract_phys} == ERR_UNAUTHORIZED (403) while ${e_cmn_phys} == ERR_CMN_NOT_FOUND (404): the physician's whitelist reaches branches, patients, studies and certificates only, so a whole entity is invisible rather than a computed field"
            - "${e_cmn_drv} == ERR_UNAUTHORIZED (403) while ${e_patient_drv} == ERR_PATIENT_NOT_FOUND (404): the driver reads the logistics half of the model and none of the clinical documentation"
            - "${list_ok} is a successful array response for the Physician on GET /home-oxygen/branches, confirming the twelve refusals above are endpoint-scoped and not a blanket read ban"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_patient_version_rejected_on_certificate_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cmn-create-stale-patient]
          - validations[priority=27]
          - errors.ERR_STALE_PATIENT_VERSION
        distinguishing_aspect: |
          The guarded write is a create, and the version it carries is not its own — it belongs to the
          Patient parent, whose version moves on every certificate write through the
          current_cmn_status mirror. So a client that reads the patient once and then drafts two
          certificates has a token that the first create silently invalidates: the second is refused
          at 412 even though nothing about the second body is wrong, and the refusal is distinguishable
          from omitting the field altogether, which is a 400 shape error at priority 17.
        test_recipe:
          setup:
            - "One branch, one ACTIVE patient at version 1, one GROUP_I study."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0780", full_name: "Eulalia Grimsdottir", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver_1: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver_1}" }
              as: IntakeCoordinator
              captures: { cmn_a: $.data.id }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { p_ver_2: $.data.version, mirror_2: $.data.current_cmn_status }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 4.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver_1}" }
              as: IntakeCoordinator
              captures: { e_stale: $.data.error_id, m_stale: $.data.message }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 4.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3 }
              as: IntakeCoordinator
              captures: { e_missing: $.data.error_id }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { p_ver_3: $.data.version }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 4.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver_3}" }
              as: IntakeCoordinator
              captures: { cmn_b: $.data.id, cmn_b_lpm: $.data.prescribed_lpm }
            - call: "GET /home-oxygen/cmns"
              payload: { patient_id: "${p_id}" }
              as: IntakeCoordinator
              captures: { cmn_list: $.data }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 5.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver_3}" }
              as: IntakeCoordinator
              captures: { e_stale_again: $.data.error_id }
          assert:
            - "${p_ver_1} == 1 at admission and ${p_ver_2} == 2 with ${mirror_2} == DRAFT: creating the first certificate advanced the parent, not just the child"
            - "${e_stale} == ERR_STALE_PATIENT_VERSION (412) with a non-empty ${m_stale}: the second create is refused for carrying ${p_ver_1}, and every other field in that body is legal"
            - "${e_missing} == ERR_INVALID_REQUEST (400), not 412: an absent expected_patient_version is a shape failure at priority 17, which sits above the concurrency check at priority 27"
            - "${p_ver_3} == 2 — the two refusals left the parent untouched — and the same body succeeds once it carries ${p_ver_3}, yielding ${cmn_b} with ${cmn_b_lpm} == 4.0"
            - "${cmn_list} contains exactly two certificates, ${cmn_a} and ${cmn_b}, so neither rejected create left a partial row behind"
            - "${e_stale_again} == ERR_STALE_PATIENT_VERSION (412): the token that worked one call earlier is already spent, because the successful create bumped the patient to version 3"

      - name: stale_contract_version_rejected_on_travel_authorization_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[travel-auth-create-stale-contract]
          - validations[priority=28]
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: |
          The second concurrency rule guards a different aggregate and is invalidated by writes a
          travel clerk never sees: posting a rental month is a billing action on a different endpoint
          under a different role, and it is enough to spend the clerk's token. The check is also
          ordered above every business rule of the endpoint — above the interval, supply-limit and
          compliance-hold checks — so a stale token masks all of them, and the refusal must leave the
          contract's version and the authorization list untouched.
        test_recipe:
          setup:
            - "One branch, one stationary concentrator, one HOMEBOUND patient at 3.0 L/min for 24 hours a day, and a contract driven to IN_SERVICE by a completed setup stop."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0790", full_name: "Fabrizio Halvorsen", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r1: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r1}", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 0 }
              as: BranchManager
              captures: { s_setup: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r1}/lock"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/delivery-routes/${r1}/dispatch"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/route-stops/${s_setup}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION", "FIRE_SAFETY", "EMERGENCY_CONTACT"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
          trigger:
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
