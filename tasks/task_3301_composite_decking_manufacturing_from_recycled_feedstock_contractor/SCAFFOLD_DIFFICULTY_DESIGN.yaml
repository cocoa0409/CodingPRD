  - rule_id: compensating_invariant
    instances:
      - name: outstanding_cents_credit_invariant
        grounds:
          - calculations.dealer_invoicing
          - calculations.claim_credit
          - entities.Dealer.fields.outstanding_cents
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
