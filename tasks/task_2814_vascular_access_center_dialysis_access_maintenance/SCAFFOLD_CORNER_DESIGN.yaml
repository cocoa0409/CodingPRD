            - call: "POST /procedures"
              payload: { referral_id: "${ref_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", procedure_type: "THROMBECTOMY", sedation_level: "NONE", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T14:00:00Z", expected_referral_version: "${ref_v}" }
              as: AccessCoordinator
              captures: { proc_id: $.data.id }
          trigger:
