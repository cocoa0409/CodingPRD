  # ===================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: formula_review_cycle
        grounds:
          - state_machines.Formula.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Formula.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.RegulatoryReview.CHANGES_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Cycle on Formula (IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW) interlocked
          with the RegulatoryReview cycle (SUBMITTED -> UNDER_REVIEW ->
          CHANGES_REQUESTED -> SUBMITTED); resubmit of the review is rejected until
          the formula itself is resubmitted.
        test_recipe:
          setup:
            - "Customer and a DRAFT formula exist; an INCI_LIST review has been claimed and sent back with changes"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/request-changes"
              payload: { comment: "INCI names incomplete" }
              as: RegulatoryAffairs
          trigger:
            - call: "POST /cosmfg/reviews/${rv}/resubmit"
              as: FormulationChemist
              captures: { e_early: $.data.error_id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
              captures: { fm_status: $.data.status }
            - call: "POST /cosmfg/reviews/${rv}/resubmit"
              as: FormulationChemist
              captures: { rv_status: $.data.status }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "GET /cosmfg/formulas/${fm}"
              as: FormulationChemist
              captures: { fm_final: $.data.status }
          assert:
            - "Early resubmit (formula still CHANGES_REQUESTED) is rejected with error_id ERR_INVALID_STATE"
            - "After formula resubmit: Formula.${fm}.status == IN_REVIEW (captured ${fm_status})"
            - "Review resubmit then succeeds: RegulatoryReview.${rv}.status == SUBMITTED (captured ${rv_status})"
            - "After claim+approve of the cycled review: Formula.${fm}.status == APPROVED"

      - name: batch_ipc_retry_cycle
        grounds:
          - state_machines.Batch.MIXING_to_IPC_FAILED
          - state_machines.Batch.IPC_FAILED_to_MIXING
          - state_machines.Batch.MIXING_to_IPC_PASSED
          - calculations.ipc_evaluation
        distinguishing_aspect: |
          Cycle on Batch (MIXING -> IPC_FAILED -> MIXING -> IPC_PASSED): a failed
          viscosity check (5000 vs band 400) increments failed_check_count and the
          adjustment loop resets the round; round-2 tolerance is tightened by 10%
          (viscosity band 400 -> 360).
        test_recipe:
          setup:
            - "CONFIRMED order with a MIXING 100kg batch fully allocated from a 200kg lot of component A (1000 c/kg)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 100, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 5000 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { chk1: $.data.result }
            - call: "POST /cosmfg/batches/${bt}/adjust"
              payload: { adjustment_note: "rehomogenize" }
              as: QAManager
              as_user_id: "qa-1"
              captures: { bt_round: $.data.failed_check_count }
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4300 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { chk2: $.data.result, tol2: $.data.effective_tolerance }
            - call: "POST /cosmfg/batches/${bt}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
              captures: { chk3: $.data.result }
            - call: "GET /cosmfg/batches/${bt}"
              as: QAManager
              captures: { bt_status: $.data.status }
          assert:
            - "First viscosity check (5000, band 400) result == FAIL (captured ${chk1})"
            - "After adjust: Batch.failed_check_count == 1 and batch back to MIXING"
            - "Round-2 viscosity check (4300) uses tightened effective_tolerance == 360 and result == PASS"
            - "PH check (5.5) result == PASS and Batch.${bt}.status == IPC_PASSED"

      - name: filling_line_cyclic
        grounds:
          - state_machines.FillingLine.IDLE_to_RUNNING
          - state_machines.FillingLine.RUNNING_to_CLEANING
          - state_machines.FillingLine.CLEANING_to_IDLE
        distinguishing_aspect: |
          Cycle on FillingLine (IDLE -> RUNNING -> CLEANING -> IDLE): after a run
          completes, the line must be cleaned before it can host a second run;
          the second start is rejected while CLEANING and succeeds after
          finish-cleaning, proving the loop is reusable.
        test_recipe:
          setup:
            - "CONFIRMED order (label review APPROVED) with two RELEASED_TO_FILLING 100kg batches and one line"
            - "Run 1 on the line completed; line now CLEANING"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la}", quantity: 50, batch_id: "${b1}" }, { lot_id: "${la}", quantity: 50, batch_id: "${b2}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${b1}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${b1}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${b1}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${b1}/release"
              as: QAManager
              as_user_id: "qa-2"
            - call: "POST /cosmfg/batches/${b2}/start-mixing"
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${b2}/ipc-checks"
              payload: { check_type: "VISCOSITY", measured_value: 4000 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${b2}/ipc-checks"
              payload: { check_type: "PH", measured_value: 5.5 }
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /cosmfg/batches/${b2}/release"
              as: QAManager
              as_user_id: "qa-2"
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b1}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T09:00:00Z", planned_units: 1000 }
