              as: Coordinator
              captures: { b1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p2}", external_ref: "OUT-2", guest_name: "Guest Two", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b2: "$.data.id" }
            - call: "POST /properties/${p2}/supply-lines"
              payload: { sku: "CON-COFFEE", name: "Coffee Box", category: "CONSUMABLE", unit_cost_cents: 340, par_qty: 4, unit: "BOX", initial_on_hand_qty: 4 }
              as: Coordinator
              captures: { sl2: "$.data.id" }
          trigger:
            - call: "GET /properties/${p2}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { e1: "$.data.error_id" }
            - call: "GET /bookings"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /bookings"
              payload: { property_id: "${p2}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { e3: "$.data.error_id" }
            - call: "GET /properties/${p2}/supply-lines"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { e4: "$.data.error_id" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { ok_code: "$.data.code", ok_status: "$.data.status" }
            - call: "GET /bookings"
              payload: { property_id: "${p1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { ok_ref: "$.data[0].external_ref" }
            - call: "GET /bookings"
              payload: {}
              as: Coordinator
          assert:
            - "${e1} == ERR_NOT_PROPERTY_OWNER (403) - not ERR_PROPERTY_NOT_FOUND; the row exists, the caller is simply not its owner"
            - "${e2} == ERR_NOT_PROPERTY_OWNER (403) - the property_id filter is mandatory for this role"
            - "${e3} == ERR_NOT_PROPERTY_OWNER (403) - a filter naming someone else's property is no better than none"
            - "${e4} == ERR_NOT_PROPERTY_OWNER (403) - the nested collection inherits the parent's ownership scope"
            - "${ok_code} == AUS-101 and ${ok_status} == ACTIVE with HTTP 200"
            - "${ok_ref} == OUT-1 with total_count == 1 for the self-scoped list"
            - "GET /bookings unfiltered as Coordinator returns HTTP 200 with total_count == 2"

      - name: corner_rbac_cleaner_may_only_act_on_its_own_assignment_and_turnover
        claim_type: Peer Role Isolation
        grounds:
          - validations[priority=8]
          - errors.ERR_NOT_ASSIGNMENT_OWNER
        distinguishing_aspect: |
          Priority 8 covers both the direct form (the addressed Assignment's cleaner_id) and the
          indirect form (the turnover's live assignment, reached through start and submit, where no
          assignment id appears in the URL at all). A peer cleaner is refused on both routes with
          403, and the refusal precedes the state checks - so a peer's accept on an OFFERED
          assignment is ERR_NOT_ASSIGNMENT_OWNER, never ERR_INVALID_ASSIGNMENT_STATE.
        test_recipe:
          setup:
            - "Turnover T1 has an OFFERED assignment for Cleaner A. Cleaner B is ACTIVE and eligible but was never offered anything."
            - "The clock is at 2026-08-08T16:00:00Z and the outgoing guest has checked out, so only ownership stands between B and the work."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner A", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { ca: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner B", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 90.00 }
              as: PlatformAdmin
              captures: { cb: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${ca}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id", a1_cleaner: "$.data.cleaner_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /assignments/${a1}/decline"
              payload: { decline_reason: "not mine to decline" }
              as: Cleaner
              as_user_id: "${cb}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
              captures: { ok_status: "$.data.status" }
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
              captures: { e3: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
              captures: { ok_t_status: "$.data.status" }
            - call: "GET /turnovers/${t1}/checklist-tasks"
              payload: {}
              as: Coordinator
              captures: { k1: "$.data[0].id" }
            - call: "POST /checklist-tasks/${k1}/submit"
              payload: { note: "helping out" }
              as: Cleaner
              as_user_id: "${cb}"
              captures: { e4: "$.data.error_id" }
            - call: "POST /checklist-tasks/${k1}/submit"
              payload: { note: "linens stripped" }
              as: Cleaner
