            - "Reader.${rA}.churn_risk_band == SEVERE"
            - "Reader.${rA}.propensity_band == LOW"
            - "Reader.${rB}.engagement_score == 10.00"
            - "Reader.${rB}.churn_risk_band == HIGH"
            - "Reader.${rB}.propensity_band == MEDIUM"
            - "Reader.${rC}.engagement_score == 9.00"
            - "Reader.${rC}.churn_risk_band == HIGH"
            - "Reader.${rC}.propensity_band == LOW"
            - "Reader.${rD}.engagement_score == 1.25"
            - "Reader.${rD}.churn_risk_band == SEVERE"
            - "Reader.${rD}.propensity_band == LOW"
