  - rule_id: boundary_precision_check
    instances:

      - name: refund_minimum_claim_days_boundary_six_versus_seven_days
        grounds:
          - calculations.refund_entitlement
          - validations[priority=61]
          - entities.RefundClaim.fields.claimed_days
          - entities.RefundClaim.fields.claimed_cents
        distinguishing_aspect: |
          claimed_days is inclusive of BOTH endpoints, so 2026-06-01..2026-06-06 is 6 days and is
          refused by ERR_REFUND_WINDOW_TOO_SHORT while 2026-06-01..2026-06-07 is exactly 7 days and
          is accepted; the accepted claim's amount 230 also pins the rounding
          (11999 * 7 / 365 = 230.06 -> round_half_up 230, not 231), and an 8-day claim yields 263,
          proving the cents are not simply scaled per day.
        setup_note: "The 6-day refusal is filed BEFORE any claim is accepted, so priority 60's closed-interval overlap rule cannot mask ERR_REFUND_WINDOW_TOO_SHORT."
