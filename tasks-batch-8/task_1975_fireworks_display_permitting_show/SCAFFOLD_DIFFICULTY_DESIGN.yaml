  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_quarantined_movement
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BATCH_QUARANTINED]
        distinguishing_aspect: |
          Category pair (state, business_safety): a CHECK_OUT against a CANCELLED event on
          a QUARANTINED batch violates priority 7 (event terminal) and priority 8
          (quarantine); the priority-7 state error ERR_INVALID_STATE must win over
          ERR_BATCH_QUARANTINED.
        test_recipe:
          setup:
            - "Event reached APPROVED, 10 units checked out, then cancelled by operator (auto-RETURN restores batch); batch then QUARANTINED"
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
