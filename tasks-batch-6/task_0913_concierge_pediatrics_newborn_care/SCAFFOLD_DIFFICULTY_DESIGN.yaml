              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Persson", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Vera", date_of_birth: "2026-05-20" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "GET /peds/well-visits"
              payload: { membership_id: "${mem_id}", milestone_code: "M1" }
              as: CareCoordinator
              captures: { wv_m1: "$.data[0].id" }
            - call: "POST /peds/well-visits/${wv_m1}/complete"
              payload: { completed_date: "2026-06-15" }
              as: Physician
              as_user_id: "${doc_id}"
          trigger:
            - call: "POST /peds/form-requests"
              payload: { membership_id: "${mem_id}", form_type: "CAMP", needed_by_date: "2026-07-31" }
              as: CareCoordinator
              captures: { fr_early: "$.data.id", fr_early_status: "$.data.status", fr_early_due: "$.data.due_at" }
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/form-requests"
              payload: { membership_id: "${mem_id}", form_type: "SCHOOL", needed_by_date: "2026-07-31" }
              as: CareCoordinator
              captures: { fr_late: "$.data.id", fr_late_status: "$.data.status", fr_late_reason: "$.data.blocked_reason" }
          assert:
            - "GET /peds/immunization-doses filtered by child_id ${child_id} returns 0 rows with total_count 0"
            - "at clock 2026-06-15, Child.${child_id}.age_days == 26 and Child.${child_id}.immunization_complete_for_age == true"
            - "FormRequest.${fr_early}.status == PENDING and blocked_reason == null"
            - "FormRequest.${fr_early}.due_at == 2026-06-18T00:00:00.000Z"
            - "at clock 2026-06-19, Child.${child_id}.age_days == 30 and Child.${child_id}.immunization_complete_for_age == false"
            - "FormRequest.${fr_late}.status == BLOCKED"
            - "FormRequest.${fr_late}.blocked_reason == IMMUNIZATION_INCOMPLETE"
