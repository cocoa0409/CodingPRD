              as_user_id: "agent-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_WRITEOFF_AMOUNT_MISMATCH"

      - name: short_pay_settles_invoice_in_full_books_shortfall
        claim_type: Conditional validation
        grounds: ["validations[priority=15]", entities.PaymentApplication.fields.short_pay_cents]
        distinguishing_aspect: "With settle_in_full true, applying 18000 to a 20000 invoice settles it PAID and books short_pay_cents 2000 (the gap), instead of leaving it PARTIAL."
        test_recipe:
          setup: ["invoice 20000, payment 18000"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "SP", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 20000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 18000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 18000, settle_in_full: true }
              as: AR_CLERK
              captures: { sp: $.data.short_pay_cents }
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { st: $.data.status }
          assert:
            - "PaymentApplication.short_pay_cents == 2000"
            - "Invoice.${inv_id}.status == PAID"

      - name: pagination_limit_over_max_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /ar/invoices with limit 101 (above the 100 max) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ar/invoices"
              payload: { limit: 101 }
              as: AUDITOR
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PAGINATION_INVALID"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: auto_apply_no_open_invoices_leaves_payment_unapplied
        claim_type: Conditional action
        grounds: [endpoints, calculations.payment_waterfall_application, entities.Payment.fields.unapplied_cents]
        distinguishing_aspect: "Auto-applying a payment for a customer with no OPEN/PARTIAL invoices leaves the entire amount on account (unapplied_cents == amount_cents), status UNAPPLIED."
        test_recipe:
          setup: ["customer with no invoices; one 5000 payment"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "AA0", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 5000, received_at: "2026-03-01T00:00:00Z" }
