            - "the AuditManager findings call returns 201 with data.variance_subscribers == 10000"
            - "the ISSUE_FINDINGS returns 200 with data.status == \"FINDINGS_ISSUED\""
            - "POST /carriage/invoices for this engagement as AuditManager with u-audit-1 returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" — link two is barred to the auditor by role"
            - "the same call as RevenueAccountant with u-rev-1 returns 201 — the chain completes only when both roles act, in this order"
            - "GET /carriage/audit-engagements/${eng_id} returns status == \"RECOVERY_INVOICED\" and a non-null recovery_invoice_id"
            - "the AuditManager attempt reports ERR_FORBIDDEN_ROLE and NOT ERR_SEGREGATION_OF_DUTIES — priority 2 masks the priority-3 same-user rule, which can only surface for a caller whose role already permits the endpoint"

  # ============================================================================
  # SECTION 8 — cross_cutting_complexity_layers
  # Three OCC rules, a logical clock that drives expiry and forfeiture sweeps,
  # a derived settlement summary, and paginated filtered reads. There are no
  # soft deletes, no bulk endpoints and no feature flags in this domain.
  # ============================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: report_filing_rejects_a_stale_agreement_view
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - endpoints[POST /carriage/subscriber-reports]
          - validations[priority=20]
        distinguishing_aspect: >-
          The guard is on the PARENT agreement's version, not the report's: an MFN
          waiver that rewrote effective_rate_cents_per_sub bumps the agreement to
          version 3, so a liaison still holding version 2 is refused 412
          ERR_STALE_AGREEMENT_VERSION even though no report has ever existed.
        test_recipe:
          setup:
            - "Cliffside Telco with an executed agreement at 40.0000 cents; the liaison observes version 2 immediately after EXECUTE."
            - "An ACTIVE MfnClause is then attached and waived, advancing the agreement version underneath the liaison."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dc_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dc_id}"
                contract_code: "CT-OCC"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_id: "id"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                stale_version: "version"
            - call: "POST /carriage/mfn-clauses"
              payload:
                agreement_id: "${ac_id}"
                mfn_scope: "DOMESTIC"
                rate_floor_cents: 30.0000
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                mfn_id: "id"
            - call: "GET /carriage/agreements/${ac_id}"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                fresh_version: "version"
          trigger:
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${stale_version}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${fresh_version}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
          assert:
            - "the stale filing returns 412 with data.error_id == \"ERR_STALE_AGREEMENT_VERSION\""
            - "GET /carriage/subscriber-reports with agreement_id=${ac_id} and limit=10 returns total_count == 0 after the refusal — no partial report was persisted"
            - "the refused call did NOT advance the agreement: GET /carriage/agreements/${ac_id} still returns version == ${fresh_version}"
            - "the retry with the refreshed version returns 201 with data.status == \"SUBMITTED\""
            - "replaying the accepted payload a second time with the same now-stale ${fresh_version} returns 412 with data.error_id == \"ERR_STALE_AGREEMENT_VERSION\" if the agreement version moved, and otherwise 409 with data.error_id == \"ERR_DUPLICATE_ACCEPTED_PERIOD\" once a report for 2026-06 has been accepted"
            - "the OCC check precedes every business rule: the same stale call naming period_month \"2030-01\", which would violate priority 70 PERIOD_OUTSIDE_TERM, still returns 412 ERR_STALE_AGREEMENT_VERSION"

      - name: mfn_reset_occ_guard
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: stale_agreement_version_precedes_invalid_mfn_state
          rationale: >-
            The third OCC rule, mfn-reset-stale-agreement on
            POST /carriage/mfn-clauses/{mfnClauseId}/reset, is already exercised at
            greater depth by the §1.8 priority-pair instance, which proves the
            priority-20 version check fires BEFORE the priority-3x invalid-MFN-state
            check on the very same call. A plain corner test here would assert a
            strict subset of that behaviour.
        grounds:
          - concurrency_rules[mfn-reset-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - endpoints[POST /carriage/mfn-clauses/{mfnClauseId}/reset]

      - name: credit_hold_fan_out
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: credit_hold_fans_out_to_agreements_windows_and_titles
          rationale: >-
            The deepest cascade in the domain — credit-review PLACE_HOLD reaching
            Distributor, then every EXECUTED agreement, then every CLEARED/ACTIVE
            rights window, then each affected title's derived coverage — is the §1.8
            transitive-cascade instance. Restating it as a corner claim would duplicate
            the same four-hop chain with weaker assertions.
        grounds:
          - endpoints[POST /carriage/distributors/{distributorId}/credit-review]
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.RightsWindow.CLEARED_to_BLOCKED

      - name: penetration_breach_streak_trips_suspension
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: report_acceptance_cascades_to_suspension_window_block_and_title_coverage
          rationale: >-
            The threshold behaviour — consecutive_breach_count reaching
            PENETRATION_BREACH_SUSPEND_THRESHOLD on report acceptance and dragging the
            agreement into SUSPENDED — is the trigger of the §1.8 cascade instance,
            which additionally follows the resulting window blocks and title
            re-derivation. A standalone counter test would assert only the first hop.
        grounds:
          - calculations.agreement_penetration_compliance
          - entities.CarriageAgreement.fields.penetration_breach_count
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED

      - name: audit_recovery_rate_basis_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: audit_recovery_period_rate_versus_closing_rate_variants
          rationale: >-
            AuditEngagement.rate_basis is the domain's canonical dual-variant switch,
            and the §1.8 instance already pins both branches to differing literal
            recovery amounts over the same findings. A corner-level restatement would
            add no distinguishing observation.
        grounds:
          - calculations.audit_recovery_amount
          - entities.AuditEngagement.fields.rate_basis

      - name: rights_window_listing_filters_before_it_paginates
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /carriage/rights-windows]
          - entities.RightsWindow.fields.platform
          - entities.RightsWindow.fields.status
          - entities.RightsWindow.fields.territory_code
        distinguishing_aspect: >-
          total_count reports the size of the FILTERED set, not the whole table, and it
          is invariant under limit and offset: five windows split 3 LINEAR / 2 VOD give
          total_count 3 with platform=LINEAR at every page size, while has_more flips
          from true to false across the two pages of limit=2.
        test_recipe:
          setup:
            - "One executed agreement and one cleared title."
            - "Five PLANNED windows on that agreement in creation order: three LINEAR (US, Oct/Nov/Dec 2026) and two VOD (US, Oct/Nov 2026)."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
