# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Industrial Equipment Installation & Millwright Services
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: project_created_with_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Project.fields.retainage_pct
          - entities.Project.fields.ot_basis
          - entities.Project.fields.hold_status
        distinguishing_aspect: "Omitting optional fields applies defaults retainage_pct == 0.10 and ot_basis == DAILY_OT; system fields initialize work_status == AWARDED, hold_status == CLEAR, version == 1, rollups == 0."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/projects", payload: { name: "Defaults Job", customer_name: "Acme", site_address: "20 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_d1: $.data.id, p_d1_ret: $.data.retainage_pct, p_d1_otb: $.data.ot_basis, p_d1_ws: $.data.work_status, p_d1_hs: $.data.hold_status, p_d1_v: $.data.version, p_d1_al: $.data.approved_labor_cents } }
          assert:
            - "retainage_pct == 0.10 (${p_d1_ret}) and ot_basis == DAILY_OT (${p_d1_otb}) applied as defaults"
            - "work_status == AWARDED, hold_status == CLEAR, version == 1, approved_labor_cents == 0, approved_equipment_cents == 0, invoiced_cents == 0"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - "endpoints.GET /v1/projects/{id}"
        distinguishing_aspect: "GET with a well-formed but nonexistent project id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/projects/00000000-0000-0000-0000-000000000000", payload: {}, as: ProjectManager, captures: { nf_err: $.data.error_id } }
          assert:
            - "Response is 404 with error_id ERR_NOT_FOUND (${nf_err})"

      - name: site_survey_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.SiteSurvey.fields.anchor_bolt_count
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required input anchor_bolt_count fails schema validation with 400 ERR_VALIDATION before any state change."
        test_recipe:
          setup: ["One project exists"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Schema Job", customer_name: "Acme", site_address: "21 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_m: $.data.id } }
          trigger:
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_m}", survey_date: "2026-08-01", anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { m_err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id ERR_VALIDATION (${m_err}); no SiteSurvey row is created"

      - name: labor_entry_invalid_hours_rejected
        claim_type: type_constraints
        grounds:
          - entities.LaborEntry.fields.hours_worked
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "hours_worked outside (0, 24] — here 25 — is rejected with ERR_VALIDATION; the boundary value 24 would pass."
        test_recipe:
          setup: ["One project exists"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Hours Job", customer_name: "Acme", site_address: "22 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_hr: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_hr}", worker_ref: "U-9101", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 25, shift: DAY }, as: SiteSupervisor, captures: { hr_err: $.data.error_id } }
          assert:
            - "Response is 400 with error_id ERR_VALIDATION (${hr_err})"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: survey_review_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SiteSurvey.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Review is declared only from SUBMITTED; reviewing a DRAFT survey fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project with a DRAFT site survey (never submitted)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM1 Job", customer_name: "Acme", site_address: "23 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm1: $.data.id } }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm1}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm1: $.data.id } }
          trigger:
            - { call: "POST /v1/site-surveys/${ss_sm1}/review", payload: { outcome: ACCEPTED }, as: ProjectManager, captures: { sm1_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm1_err}); survey remains DRAFT"

      - name: survey_submit_after_accepted_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SiteSurvey
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACCEPTED is terminal; submitting an already-accepted survey fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project with a survey SUBMITTED then ACCEPTED (clock advanced to cure date 2026-08-08)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM2 Job", customer_name: "Acme", site_address: "24 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm2: $.data.id } }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm2}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm2: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_sm2}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_sm2}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/site-surveys/${ss_sm2}/submit", payload: {}, as: SiteSupervisor, captures: { sm2_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm2_err}); survey remains ACCEPTED"

      - name: rigging_revise_from_approved_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RiggingPlan.REJECTED_to_DRAFT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Revise is declared only from REJECTED; revising an APPROVED plan fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project in INSTALLING with rigging plan APPROVED (full survey+approval chain)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM3 Job", customer_name: "Acme", site_address: "25 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm3: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm3}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm3: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm3}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_sm3}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm3}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm3: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_sm3}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_sm3}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_sm3}/advance", payload: {}, as: ProjectManager, captures: { p_sm3_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_sm3}", expected_project_version: "${p_sm3_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_sm3: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_sm3}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_sm3}/review", payload: { outcome: APPROVED }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/rigging-plans/${rp_sm3}/revise", payload: { lift_weight_tons: 41 }, as: SiteSupervisor, captures: { sm3_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm3_err}); plan remains APPROVED and project pin intact"

      - name: labor_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LaborEntry.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approve is declared only from SUBMITTED; approving a DRAFT entry fails with ERR_INVALID_STATE (and the segregation check never fires)."
        test_recipe:
          setup: ["Project with a DRAFT labor entry"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM4 Job", customer_name: "Acme", site_address: "26 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm4: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_sm4}", worker_ref: "U-9201", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_sm4: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries/${le_sm4}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1, captures: { sm4_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm4_err}); Project.approved_labor_cents remains 0"

      - name: labor_resubmit_after_rejected_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.LaborEntry.REJECTED_to_SUBMITTED
        distinguishing_aspect: "The payroll revision loop edge REJECTED -> SUBMITTED is a valid transition; resubmission records the new submitter and clears rejection_reason."
        test_recipe:
          setup: ["Project with a labor entry submitted by sup-1 then rejected by pay-1"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM5 Job", customer_name: "Acme", site_address: "27 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm5: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_sm5}", worker_ref: "U-9202", classification: OPERATOR, work_date: "2026-08-08", hours_worked: 6, shift: DAY }, as: SiteSupervisor, captures: { le_sm5: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_sm5}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_sm5}/reject", payload: { reason: "missing ticket number" }, as: PayrollClerk, as_user_id: pay-1 }
          trigger:
            - { call: "POST /v1/labor-entries/${le_sm5}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-2, captures: { sm5_status: $.data.status, sm5_sub: $.data.submitted_by_user_id, sm5_reason: $.data.rejection_reason } }
          assert:
            - "Status == SUBMITTED (${sm5_status}); submitted_by_user_id == 'sup-2' (${sm5_sub}); rejection_reason cleared to null"

      - name: lift_execute_after_cancel_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.LiftPermit.ISSUED_to_CANCELLED
          - state_machines.LiftPermit.ISSUED_to_EXECUTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal; executing a cancelled permit fails with ERR_INVALID_STATE even inside the booked window."
        test_recipe:
          setup: ["Project in INSTALLING with approved rigging plan; permit ISSUED for 2026-08-10 10:00-14:00 then cancelled; clock inside the window at 2026-08-10T11:00:00Z"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM6 Job", customer_name: "Acme", site_address: "28 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm6: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm6}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm6: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm6}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_sm6}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm6}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm6: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_sm6}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_sm6}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_sm6}/advance", payload: {}, as: ProjectManager, captures: { p_sm6_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_sm6}", expected_project_version: "${p_sm6_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_sm6: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_sm6}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_sm6}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_sm6}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_sm6: $.data.id } }
            - { call: "POST /v1/lift-permits/${lp_sm6}/cancel", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/lift-permits/${lp_sm6}/execute", payload: {}, as: SiteSupervisor, captures: { sm6_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm6_err}); permit remains CANCELLED, equipment_charge_cents stays null"

      - name: checklist_signoff_before_submit_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CommissioningChecklist.SUBMITTED_to_SIGNED_OFF
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Sign-off is declared only from SUBMITTED; signing an IN_PROGRESS checklist fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project in INSTALLING with a checklist created (IN_PROGRESS)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM7 Job", customer_name: "Acme", site_address: "29 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm7: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm7}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm7: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm7}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_sm7}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm7}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm7: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_sm7}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_sm7}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_sm7}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists", payload: { project_id: "${p_sm7}", items: [{ item_key: "GROUT", description: "grout cured", required: true }] }, as: ProjectManager, captures: { cc_sm7: $.data.id } }
          trigger:
            - { call: "POST /v1/commissioning-checklists/${cc_sm7}/sign-off", payload: {}, as: CustomerRep, captures: { sm7_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm7_err}); checklist remains IN_PROGRESS"

      - name: lockout_release_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LockoutWindow.ACTIVE_to_RELEASED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Release is declared only from ACTIVE; releasing a SCHEDULED window fails with ERR_INVALID_STATE (use cancel instead)."
        test_recipe:
          setup: ["Project with ACTIVE safety plan and a SCHEDULED lockout window in the future"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM8 Job", customer_name: "Acme", site_address: "30 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm8: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm8}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm8: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm8}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_sm8}", feeder_id: "F-1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T14:00:00Z" }, as: SafetyOfficer, captures: { lw_sm8: $.data.id } }
          trigger:
            - { call: "POST /v1/lockout-windows/${lw_sm8}/release", payload: {}, as: SafetyOfficer, captures: { sm8_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm8_err}); window remains SCHEDULED"

      - name: safety_plan_double_suspend_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SafetyPlan.ACTIVE_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Suspend is declared only from ACTIVE; suspending an already SUSPENDED plan fails with ERR_INVALID_STATE and does not re-fire the cascade."
        test_recipe:
          setup: ["Project with safety plan ACTIVE then SUSPENDED once"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM9 Job", customer_name: "Acme", site_address: "31 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm9: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm9}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm9: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm9}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/safety-plans/${sp_sm9}/suspend", payload: {}, as: SafetyOfficer }
          trigger:
            - { call: "POST /v1/safety-plans/${sp_sm9}/suspend", payload: {}, as: SafetyOfficer, captures: { sm9_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_INVALID_STATE (${sm9_err}); plan remains SUSPENDED, hold_status remains SAFETY_HOLD"

      - name: project_advance_from_completed_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Project.COMPLETED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "COMPLETED is terminal for work_status; a further advance fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project driven through the full chain to COMPLETED (safety plan, accepted survey, approved rigging plan, executed lift, signed-off checklist)"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "SM10 Job", customer_name: "Acme", site_address: "32 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_sm10: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_sm10}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_sm10: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_sm10}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_sm10}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_sm10}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_sm10: $.data.id } }
