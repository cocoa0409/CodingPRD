      - name: listing_creation_with_unknown_property_returns_property_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=9]", "errors[ERR_PROPERTY_NOT_FOUND]", "entities.Listing.fields.property_id"]
        distinguishing_aspect: "A body foreign key that resolves to nothing is caught by ladder rung 9 and returns the PARENT entity's not-found code, ERR_PROPERTY_NOT_FOUND, not a generic bad-request."
        test_recipe:
          setup: ["One LISTING_AGENT client and no properties."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
