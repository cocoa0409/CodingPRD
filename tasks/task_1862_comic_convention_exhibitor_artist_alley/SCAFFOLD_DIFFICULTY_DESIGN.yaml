  - rule_id: compensating_invariant
    instances:
      - name: space_unit_status_conservation_under_offer_release
        grounds:
          - state_machines.SpaceUnit.AVAILABLE_to_RESERVED
          - state_machines.SpaceUnit.RESERVED_to_AVAILABLE
          - state_machines.Placement.TENTATIVE_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: per-convention SpaceUnit status counts. The forward
          action (placement create: AVAILABLE -> RESERVED) paired with its
          compensating action (placement release: RESERVED -> AVAILABLE) leaves
          #(AVAILABLE)=2, #(RESERVED)=0, #(ASSIGNED)=0 — sum across statuses
          always equals the number of created units.
        test_recipe:
          setup:
            - "Convention C1 with TWO spaces (S1, S2) in PLACEMENT phase; application JURIED_ACCEPTED"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-102", block: "A", unit_number: 102, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
          trigger:
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector, captures: { plc: $.data.id } }
            - { call: "POST /placements/${plc}/release", payload: {}, as: ShowDirector }
            - { call: "GET /space-units?convention_id=${conv}&status=AVAILABLE", payload: {}, as: ShowDirector, captures: { avail_n: "$.data[1].id" } }
            - { call: "GET /space-units?convention_id=${conv}&status=RESERVED", payload: {}, as: ShowDirector }
            - { call: "GET /space-units/${sp1}", payload: {}, as: ShowDirector, captures: { sp1_st: $.data.status, sp1_holder: $.data.current_application_id } }
          assert:
            - "Invariant: count(AVAILABLE) + count(RESERVED) + count(ASSIGNED) == 2 (total created) before, between, and after the pair"
            - "after create+release: AVAILABLE list contains both units (second element id readable), RESERVED list is empty"
            - "S1 status == AVAILABLE and current_application_id is null (no drift from the compensating pair)"

      - name: pallet_reservation_conservation_under_confirm_cancel
        grounds:
          - calculations.load_slot_capacity
          - state_machines.FreightBooking.REQUESTED_to_CANCELLED
          - state_machines.LoadSlot.FULL_to_OPEN
        distinguishing_aspect: |
          Conserved quantity: LoadSlot.reserved_pallets (different quantity than
          space-unit counts). reserved_pallets must always equal the sum of
          pallet_count over active bookings; the forward action (book 3 pallets)
          plus its compensating action (cancel) returns the slot to exactly its
          prior reservation level.
        test_recipe:
          setup:
            - "Convention C1 in LOGISTICS with PLACED application; INBOUND slot cap 10 reserved 0"
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "ARTIST_ALLEY", max_accepted: 2, max_waitlisted: 2}, {category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [{door_code: "D1"}, {door_code: "D2"}] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector, captures: { plc: $.data.id } }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/verify-permit", payload: {}, as: ShowDirector }
            - { call: "POST /applications/${app}/accept-offer", payload: { deposit_cents: 22500 }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /placements/${plc}/confirm", payload: {}, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /load-slots", payload: { convention_id: "${conv}", direction: "INBOUND", starts_at: "2026-10-14T08:00:00Z", ends_at: "2026-10-14T12:00:00Z", pallet_capacity: 10 }, as: ShowDirector, captures: { slot: $.data.id, res0: $.data.reserved_pallets } }
            - { call: "GET /dock-doors?convention_id=${conv}&door_code=D1", payload: {}, as: ShowDirector, captures: { door1: "$.data[0].id" } }
          trigger:
            - { call: "POST /freight-bookings", payload: { application_id: "${app}", load_slot_id: "${slot}", dock_door_id: "${door1}", door_starts_at: "2026-10-14T08:00:00Z", door_ends_at: "2026-10-14T09:00:00Z", pallet_count: 3 }, as: Exhibitor, as_user_id: "${ex}", captures: { bk: $.data.id } }
            - { call: "GET /load-slots/${slot}", payload: {}, as: ShowDirector, captures: { res_mid: $.data.reserved_pallets } }
            - { call: "POST /freight-bookings/${bk}/cancel", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { bk_st: $.data.status } }
            - { call: "GET /load-slots/${slot}", payload: {}, as: ShowDirector, captures: { res_end: $.data.reserved_pallets, st_end: $.data.status } }
          assert:
            - "reserved_pallets: 0 at creation, 3 after booking (REQUESTED consumes capacity), 0 after cancel — forward + compensate nets to zero"
            - "booking status == CANCELLED; slot status == OPEN"
            - "invariant holds at every step: reserved_pallets == sum of pallet_count over bookings in {REQUESTED, CONFIRMED, CHECKED_IN}"
