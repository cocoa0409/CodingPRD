      - name: mop_approval_requirement_two_for_high_one_for_medium
        claim_type: constants_applied
        grounds:
          - calculations.mop_approval_requirement
          - state_machines.MethodOfProcedure.UNDER_REVIEW_to_UNDER_REVIEW
        distinguishing_aspect: "MOP_HIGH_APPROVALS == 2 and every other risk class needs 1: the HIGH MOP stays UNDER_REVIEW after its first APPROVE (approval_count 1 of 2) and only reaches APPROVED on the second, distinct-role approval, while a MEDIUM MOP on another target reaches APPROVED on its first."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall CX49 is in PLANNING and owns PDU-A1 with busways BW-A1 and BW-A2."
            - "MOP-H (target BUSWAY BW-A1, risk_class HIGH) and MOP-M (target BUSWAY BW-A2, risk_class MEDIUM) were authored by u-elec-1 and submitted; both are UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Corner Hall 49", code: "CX49", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
