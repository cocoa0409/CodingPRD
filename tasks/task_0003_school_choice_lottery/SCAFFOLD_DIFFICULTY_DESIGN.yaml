            - call: "POST /lottery/windows/${w18_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /lottery/applications"
              payload: { window_id: "${w18_id}", student_id: "${stu_ov}", school_id: "${s18_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_ov}"
              captures: { app_ov: $.data.id }
            - call: "POST /lottery/applications/${app_ov}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_ov}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w18_id}/close"
              payload: {}
              as: DistrictAdmin
