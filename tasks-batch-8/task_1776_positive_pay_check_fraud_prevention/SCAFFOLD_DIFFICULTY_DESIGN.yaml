# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1776: Positive Pay & Check Fraud Prevention
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_tier_reconciliation
        grounds:
          - calculations.exception_fee_provisional
          - calculations.exception_fee_tiered_final
          - calculations.monthly_statement
        distinguishing_aspect: |
          Same 11 exceptions, two valid fee algorithms on the FeeLedgerEntry domain:
          provisional accrual charges a flat 200 per exception (2200 total) while the
          final MONTHLY_BILLING marginal tier re-rate yields 2150, forcing a -50
          ADJUSTMENT entry at billing time.
        test_recipe:
          setup:
            - "REVERSE-tier enrollment, ACTIVE, clock parked in August so all exceptions land in period 2026-08"
            - "11 presented items -> 11 REVERSE_REVIEW exceptions, each accruing a 200-cent provisional EXCEPTION_FEE"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "FeeCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "900001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 1000, payee_name_raw: "P1", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "2", amount_cents: 1000, payee_name_raw: "P2", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "3", amount_cents: 1000, payee_name_raw: "P3", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "4", amount_cents: 1000, payee_name_raw: "P4", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "5", amount_cents: 1000, payee_name_raw: "P5", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "6", amount_cents: 1000, payee_name_raw: "P6", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "7", amount_cents: 1000, payee_name_raw: "P7", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "8", amount_cents: 1000, payee_name_raw: "P8", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "9", amount_cents: 1000, payee_name_raw: "P9", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "10", amount_cents: 1000, payee_name_raw: "P10", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "11", amount_cents: 1000, payee_name_raw: "P11", channel: "TELLER" }, as: BankOps }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { pre_exc: $.data.exception_fees_cents } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "MONTHLY_BILLING", enrollment_id: "${enr}", period: "2026-08" }, as: BankOps, captures: { run_adj: $.data.adjustment_cents, run_billed: $.data.fees_billed, run_topup: $.data.minimum_topup_cents } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { st_exc: $.data.exception_fees_cents, st_adj: $.data.adjustment_cents, st_topup: $.data.minimum_topup_cents, st_net: $.data.net_due_cents, st_cnt: $.data.entry_count } }
          assert:
            - "pre-billing statement exception_fees_cents == 2200 (11 x 200 provisional flat rate) and adjustment_cents == 0"
            - "MONTHLY_BILLING run: adjustment_cents == -50 (tiered 2150 vs provisional 2200), fees_billed == 11, minimum_topup_cents == 2850"
            - "post-billing statement: exception_fees_cents == 2200, adjustment_cents == -50, minimum_topup_cents == 2850, net_due_cents == 5000, entry_count == 13"

      - name: deadline_same_day_cutoff_vs_rolling_hours
        grounds:
          - calculations.decision_deadline
          - entities.ExceptionItem.fields.decision_deadline_at
        distinguishing_aspect: |
          Identical presented_at (2026-08-03T13:00:00Z) yields decision_deadline_at
          2026-08-03T20:00:00Z under SAME_DAY_CUTOFF but 2026-08-04T13:00:00Z under
          ROLLING_HOURS(24) — two valid deadline algorithms on the ExceptionItem
          (time) domain, a different entity domain from fee calculation.
        test_recipe:
          setup:
            - "Two ACTIVE REVERSE-tier enrollments differing only in deadline_mode; clock fixed at 2026-08-03T13:00:00Z (before the 14:00Z cutoff)"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "CutoffCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN", deadline_mode: "SAME_DAY_CUTOFF" }, as: BankTreasuryManager, captures: { enrA: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enrA}", account_number: "910001" }, as: BankTreasuryManager, captures: { acctA: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enrA}", display_name: "AdminA", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { admA: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enrA}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sessA: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sessA}/complete", payload: { attendee_user_ids: ["${admA}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enrA}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/enrollments", payload: { business_name: "RollCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN", deadline_mode: "ROLLING_HOURS", decision_window_hours: 24 }, as: BankTreasuryManager, captures: { enrB: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enrB}", account_number: "920001" }, as: BankTreasuryManager, captures: { acctB: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enrB}", display_name: "AdminB", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { admB: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enrB}", trainer_id: "tr-2", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sessB: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sessB}/complete", payload: { attendee_user_ids: ["${admB}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enrB}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:00:00Z" }, as: BankOps }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acctA}", check_number: "1", amount_cents: 500, payee_name_raw: "X", channel: "CLEARING" }, as: BankOps, captures: { exA: $.data.exception_id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acctB}", check_number: "1", amount_cents: 500, payee_name_raw: "X", channel: "CLEARING" }, as: BankOps, captures: { exB: $.data.exception_id } }
            - { call: "GET /treasury/exceptions/${exA}", payload: {}, as: BankOps, captures: { dlA: $.data.decision_deadline_at } }
            - { call: "GET /treasury/exceptions/${exB}", payload: {}, as: BankOps, captures: { dlB: $.data.decision_deadline_at } }
          assert:
            - "ExceptionItem.${exA}.decision_deadline_at == '2026-08-03T20:00:00Z' (same-day 20:00Z: presented before 14:00Z cutoff)"
            - "ExceptionItem.${exB}.decision_deadline_at == '2026-08-04T13:00:00Z' (presented_at + 24h)"
            - "Same presented_at, different deadlines — the two variants diverge"

  - rule_id: combinatorial_formula
    instances:
      - name: liability_party_branch_matrix_by_reason_and_path
        grounds:
          - calculations.liability_party_derivation
          - state_machines.ExceptionItem.OPEN_to_DECISIONED_PAY
          - state_machines.ExceptionItem.OPEN_to_DEFAULTED_RETURN
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — reason x resolution
          path x tier produce categorical branches: PAYEE_MISMATCH+DECISIONED_PAY ->
          CUSTOMER, AMOUNT_MISMATCH+DECISIONED_RETURN -> NONE, NO_ISSUE_RECORD+
          DEFAULTED_RETURN -> CUSTOMER; three branches of one matrix asserted.
        test_recipe:
          setup:
            - "ACTIVE PAYEE_POSITIVE_PAY enrollment, tolerance 0, threshold 85, default_decision RETURN"
            - "Issued checks 101 (30000, 'ACME INDUSTRIES') and 102 (40000, 'BETA LLC') uploaded by the manager user"
            - "Three exceptions exist: e1 PAYEE_MISMATCH, e2 AMOUNT_MISMATCH, e3 NO_ISSUE_RECORD"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "MatrixCo", tier: "PAYEE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "930001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Boss", user_role: "MANAGER" }, as: BankTreasuryManager, captures: { mgr: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${mgr}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-MATRIX", rows: [ { check_number: "101", amount_cents: 30000, payee_name: "ACME INDUSTRIES", issue_date: "2026-08-01" }, { check_number: "102", amount_cents: 40000, payee_name: "BETA LLC", issue_date: "2026-08-01" } ] }, as: CustomerManager, as_user_id: "${mgr}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "101", amount_cents: 30000, payee_name_raw: "ACM INDUSTRIES", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex1: $.data.exception_id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "102", amount_cents: 40050, payee_name_raw: "BETA LLC", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex2: $.data.exception_id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "999", amount_cents: 7000, payee_name_raw: "GHOST", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex3: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex1}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { e1st: $.data.status, e1liab: $.data.liability_party } }
            - { call: "POST /treasury/exceptions/${ex2}/decision", payload: { decision: "RETURN" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { e2st: $.data.status, e2liab: $.data.liability_party } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps }
            - { call: "GET /treasury/exceptions/${ex3}", payload: {}, as: BankOps, captures: { e3st: $.data.status, e3liab: $.data.liability_party } }
          assert:
            - "e1: status == DECISIONED_PAY and liability_party == CUSTOMER (customer approved a payee-mismatched item)"
            - "e2: status == DECISIONED_RETURN and liability_party == NONE (item unpaid, no loss to allocate)"
            - "e3: status == DEFAULTED_RETURN and liability_party == CUSTOMER (deadline missed, default rule RETURN applied)"

      - name: monthly_statement_pinned_evaluation_order
        grounds:
          - calculations.monthly_statement
          - calculations.exception_fee_tiered_final
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned order — gross
          (2400+500) -> tier adjustment (-100) -> waiver subtraction (500) ->
          minimum top-up. Pinned order yields pre_minimum 2300, topup 2700, net
          5000; the alternate 'minimum before waiver' reading yields 4500.
        test_recipe:
          setup:
            - "REVERSE-tier enrollment ACTIVE; 12 exceptions in period 2026-08 (provisional 2400, tiered 2300)"
            - "One exception decisioned RETURN, accruing a 500-cent RETURN_FEE, which is then WAIVED pre-billing"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OrderCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "940001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "P1", channel: "TELLER" }, as: BankOps, captures: { ex1: $.data.exception_id } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "2", amount_cents: 100, payee_name_raw: "P2", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "3", amount_cents: 100, payee_name_raw: "P3", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "4", amount_cents: 100, payee_name_raw: "P4", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "5", amount_cents: 100, payee_name_raw: "P5", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "6", amount_cents: 100, payee_name_raw: "P6", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "7", amount_cents: 100, payee_name_raw: "P7", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "8", amount_cents: 100, payee_name_raw: "P8", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "9", amount_cents: 100, payee_name_raw: "P9", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "10", amount_cents: 100, payee_name_raw: "P10", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "11", amount_cents: 100, payee_name_raw: "P11", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "12", amount_cents: 100, payee_name_raw: "P12", channel: "TELLER" }, as: BankOps }
            - { call: "POST /treasury/exceptions/${ex1}/decision", payload: { decision: "RETURN" }, as: CustomerDecisionMaker, as_user_id: "${dm}" }
            - { call: "GET /treasury/fee-entries", payload: { exception_id: "${ex1}", fee_type: "RETURN_FEE" }, as: BankOps, captures: { rfee: "$.data[0].id" } }
            - { call: "POST /treasury/fee-entries/${rfee}/waive", payload: { reason: "goodwill" }, as: BankOps, captures: { rfee_st: $.data.status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "MONTHLY_BILLING", enrollment_id: "${enr}", period: "2026-08" }, as: BankOps, captures: { run_adj: $.data.adjustment_cents, run_topup: $.data.minimum_topup_cents } }
            - { call: "GET /treasury/enrollments/${enr}/fee-statement", payload: { period: "2026-08" }, as: BankTreasuryManager, captures: { st_exc: $.data.exception_fees_cents, st_ret: $.data.return_fees_cents, st_adj: $.data.adjustment_cents, st_waiv: $.data.waived_cents, st_topup: $.data.minimum_topup_cents, st_net: $.data.net_due_cents } }
          assert:
            - "return fee waived pre-billing: rfee_st == WAIVED"
            - "statement: exception_fees_cents == 2400, return_fees_cents == 500, adjustment_cents == -100, waived_cents == 500"
            - "pre_minimum == 2300 (= 2400 - 100 + 500 - 500) so minimum_topup_cents == 2700 and net_due_cents == 5000"
            - "alternate 'minimum before waiver' order would yield net 4500 — pinned order is the only accepted reading"

      - name: payee_score_per_token_floor_rounding_order
        grounds:
          - calculations.payee_match_score
          - entities.PresentedItem.fields.match_score
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-token contribution floored
          BEFORE summation. 'ACME INDUSTRIES' vs 'ACM INDUSTRIES': floor order gives
          15+69=84 (PAYEE_MISMATCH at threshold 85); sum-then-round gives 85 (would
          pass). Same inputs, different cents-level outcome.
        test_recipe:
          setup:
            - "ACTIVE PAYEE_POSITIVE_PAY enrollment, payee_score_threshold 85; issued check 201 (5000, 'ACME INDUSTRIES')"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "RoundCo", tier: "PAYEE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "950001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-ROUND", rows: [ { check_number: "201", amount_cents: 5000, payee_name: "ACME INDUSTRIES", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
          trigger:
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "201", amount_cents: 5000, payee_name_raw: "ACM INDUSTRIES", channel: "REMOTE_DEPOSIT", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it_st: $.data.status, it_res: $.data.match_result, it_score: $.data.match_score } }
          assert:
            - "match_score == 84 (floor(4*50/13)=15, floor(9*100/13)=69, sum 84 — no re-round of the sum)"
            - "match_result == PAYEE_MISMATCH and status == EXCEPTION_HELD (84 < threshold 85)"
            - "sum-then-round reading (1100/13 = 84.6 -> 85) would have PAID the item — divergence is observable"
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_suspend_reactivate_cycle_gates_decisions
        grounds:
          - state_machines.TreasuryEnrollment.ACTIVE_to_SUSPENDED
          - state_machines.TreasuryEnrollment.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on TreasuryEnrollment: ACTIVE -> SUSPENDED -> ACTIVE is a
          legal loop (not a one-way pipeline); decisions made while SUSPENDED fail
          and succeed again after the cycle completes.
        test_recipe:
          setup:
            - "ACTIVE REVERSE-tier enrollment with one OPEN exception"
          setup_api_calls:
