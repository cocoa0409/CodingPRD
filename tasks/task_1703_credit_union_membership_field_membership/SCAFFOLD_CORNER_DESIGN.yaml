            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 1 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
