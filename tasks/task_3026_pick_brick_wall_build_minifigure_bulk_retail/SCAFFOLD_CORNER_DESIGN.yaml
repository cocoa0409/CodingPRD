              payload: { email: "m_occ1@example.com", display_name: "Occ One", home_store_id: "${st230}" }
              as: PlatformAdmin
              captures: { mem_occ1: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_occ2@example.com", display_name: "Occ Two", home_store_id: "${st230}" }
              as: PlatformAdmin
              captures: { mem_occ2: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st230}", element_id: "${el6701}", bin_label: "AA01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_aa01: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Town", exclusive_set_sku: "LEGO-H1", allocated_exclusive_units: 4, exclusive_set_unit_price_cents: 1300, per_customer_limit: 2, days_from_default_clock: 1, vip_early_days_before_release: 0 }
