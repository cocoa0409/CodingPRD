      - name: promotion_approve_requires_item_lifecycle_ramp_or_mature
        grounds:
          - validations[priority=130]
          - errors.ERR_ITEM_NOT_PROMOTABLE
          - state_machines.Item.PRELAUNCH_to_RAMP
          - state_machines.Promotion.DRAFT_to_APPROVED
          - entities.Item.fields.lifecycle_state
        distinguishing_aspect: |
          Entity pair Promotion -> Item — a different pair from SupplyPlan -> DemandForecast, and
          an existentially scoped guard on ONE parent row rather than a universal one over a
          collection. Both halves are exercised in a single chain: the same approve call is
          rejected while the item is PRELAUNCH and accepted after the item is promoted to RAMP,
          with nothing about the Promotion itself changing in between.
        test_recipe:
          setup:
            - "One ProductFamily, one Customer."
            - "One Item created with lifecycle_state PRELAUNCH."
            - "One DRAFT Promotion for that (item, customer) covering 2026-10..2026-10, whose window is ahead of the default 2026-08-01T00:00:00Z clock."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-NPI", name: "New Ventures", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-NEW-1", family_id: "${fam_id}", unit_price_cents: 700, unit_cost_cents: 250, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 500, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-10", end_month: "2026-10", lift_pct: 20, cannibalization_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "RAMP" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
          assert:
            - "First approve returns 422 with error_id ERR_ITEM_NOT_PROMOTABLE because Item.${item_id}.lifecycle_state == \"PRELAUNCH\""
            - "Promotion.${promo_id}.status is still \"DRAFT\" after the rejection"
            - "Item.${item_id}.lifecycle_state == \"RAMP\" after the lifecycle transition"
            - "Second approve returns 200 and Promotion.${promo_id}.status == \"APPROVED\" — the identical request now passes purely because the OTHER entity changed state"

  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_month_windows_closed_inclusive_adjacency_allowed
        grounds:
          - validations[priority=140]
          - errors.ERR_PROMOTION_WINDOW_OVERLAP
          - entities.Promotion.fields.start_month
          - entities.Promotion.fields.end_month
          - state_machines.Promotion.DRAFT_to_APPROVED
        distinguishing_aspect: |
          Resource: the (Item, Customer) trade calendar. Interval semantics: CLOSED INCLUSIVE
          month granularity — end_month is part of the window, so two windows conflict only when
          they share at least one month, and windows that merely abut (…2026-11 followed by
          2026-12…) are legal. Scope: the uniqueness is per (item_id, customer_id) and only among
          APPROVED rows, so the same window for a second customer is fine and DRAFT rows never
          conflict.
        test_recipe:
          setup:
            - "One ProductFamily, one MATURE Item, two Customers A and B."
            - "Logical clock at its 2026-08-01T00:00:00Z default so every window below is ahead of the frozen horizon."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-CEREAL", name: "Cereal", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
