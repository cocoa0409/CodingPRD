        as: NetworkAdmin
      - call: POST /network/audits/${audit1}/begin
        payload: {}
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/audits/${audit1}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
        as_user_id: aud-1
      - call: POST /network/shops/${shop_id}/technicians
