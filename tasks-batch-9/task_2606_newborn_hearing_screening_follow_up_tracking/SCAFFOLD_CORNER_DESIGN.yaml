              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /reporting-periods/${per_id}/close"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "First close returned 200 with ReportingPeriod.${per_id}.status == CLOSED, closed_at == 2026-09-01T00:00:00Z, facilities_assessed_count == 0, episodes_escalated_count == 0, episodes_lost_count == 0"
            - "Second close: HTTP 409 with data.error_id == ERR_PERIOD_ALREADY_CLOSED"
            - "ReportingPeriod.${per_id}.facilities_assessed_count is still 0 and closed_at is still 2026-09-01T00:00:00Z — no counter was double-applied"

