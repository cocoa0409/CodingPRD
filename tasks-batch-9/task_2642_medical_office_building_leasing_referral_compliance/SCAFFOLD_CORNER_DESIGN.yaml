      - name: ti_utility_review_rejects_a_request_above_the_suites_amperage
        claim_type: precondition_enforcement
        grounds:
          - state_machines[TenantImprovementProject].transitions[IN_REVIEW -> IN_REVIEW]
          - validations[20]
          - errors.ERR_INSUFFICIENT_UTILITY_CAPACITY
        distinguishing_aspect: "The amperage check runs at UTILITY review, not at project creation: a project requesting 250 amps in a 200-amp suite is created and submitted without complaint, then the review returns 422 ERR_INSUFFICIENT_UTILITY_CAPACITY and draws down nothing."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite offering 200 amps and a non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT lease."
            - "One TenantImprovementProject targeting INFUSION with power_amps_requested 250 and one POWER line item, submitted for review."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { m14_b_id: $.data.id }
