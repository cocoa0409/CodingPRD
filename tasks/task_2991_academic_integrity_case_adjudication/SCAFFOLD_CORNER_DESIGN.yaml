      - name: every_declared_type_constraint_rejects_its_own_boundary_violation
        claim_type: Type Constraints
        grounds:
          - entities.Department.fields.code
          - entities.CourseOffering.fields.course_code
          - entities.CourseOffering.fields.term_code
          - entities.CourseOffering.fields.grade_components
