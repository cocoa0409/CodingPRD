  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_calendar_buffer_is_wider_across_routes_than_within_one
        grounds:
          - calculations.crew_calendar_occupation
          - validations[priority 16 - business_temporal - ERR_CREW_INTERVAL_CONFLICT]
          - entities.HomeSafetyVisit.fields.occupies_crew_calendar
          - entities.Crew
        distinguishing_aspect: |
          Resource entity: Crew. Interval semantics: buffered half-open instant intervals whose buffer
          width depends on the pair - 15 minutes across routes, 5 minutes within one route. The same
          14:45Z candidate is refused on route R2 (14:35 + 15 = 14:50) and accepted on route R1
          (14:35 + 5 = 14:40).
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone with daily_visit_cap 12 and two households of 1 sleeping area / 1 storey (35 demand minutes each)."
            - "One crew with two PUBLISHED routes on 2026-08-03, R1 and R2, both windowed 13:00-21:00Z with 2 slots each."
            - "Visit V1 sits on R1 at 14:00Z and therefore ends at 14:35Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
