              payload: { appraiser_user_id: "appraiser-1", appraiser_firm: "Brandywine Rural Appraisal", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "PAIRED_SALES" }
