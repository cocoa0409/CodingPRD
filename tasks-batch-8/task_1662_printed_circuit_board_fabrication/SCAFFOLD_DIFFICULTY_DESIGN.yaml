  # =========================================================================
  # Rule 4 — transitive_cascade (cancel trigger depth 3; clock-set trigger depth 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_released_order_cascade_depth3
        grounds:
          - state_machines.FabOrder.RELEASED_to_CANCELLED
          - state_machines.PanelArray.RELEASED_to_CANCELLED
          - state_machines.LaminateReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 causal chain from POST cancel: FabOrder CANCELLED mutates the
          PanelArray (CANCELLED); the array's cancellation itself releases its
          RESERVED LaminateReservation; the reservation's release itself recomputes
          LaminateLot.panels_reserved (34 -> 0) and panels_available (66 -> 100) —
          plus a lane-commitment release on the quick-turn branch.
        test_recipe:
          setup:
            - "QUICK_TURN order on lane QT3 (capacity 500, multiplier 1.50), qty 100, ship 2026-08-10, fully released with 34 panels reserved from lot LOT-C1 (100 total)"
            - "lane slot commitment for 2026-08-10 holds 100 boards"
          setup_api_calls:
            - { call: "POST /pcb/quick-turn-lanes", payload: { lane_code: "QT3", turn_days: 3, capacity_boards_per_day: 500, premium_multiplier: 1.50, active: true }, as: FabAdmin, captures: { lane: $.data.id } }
            - { call: "POST /pcb/customers", payload: { company_name: "Eta Circuits", contact_email: "ops@eta.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "QUICK_TURN", quick_turn_lane_id: "${lane}", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-C1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner, captures: { res: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/cancel", payload: { reason: "customer cancelled" }, as: Customer, as_user_id: "${cust}" }
          assert:
            - "FabOrder.${ord}.fab_status == CANCELLED"
            - "GET PanelArray.${arr}.status == CANCELLED (link 1)"
            - "GET LaminateReservation.${res}.status == RELEASED (link 2, caused by link 1)"
            - "GET LaminateLot.${lot}: panels_reserved == 0, panels_consumed == 0, panels_available == 100, status == QUALIFIED (link 3, caused by link 2)"
            - "GET /pcb/quick-turn-lanes/${lane}/slots?ship_date=2026-08-10: committed_boards == 0"
      - name: clock_expiry_cascade
        grounds:
          - state_machines.LaminateLot.QUALIFIED_to_EXPIRED
          - state_machines.LaminateReservation.RESERVED_to_RELEASED
          - state_machines.FabOrder.AWAITING_LAMINATE_to_ON_HOLD
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /_clock/set_current_utc):
          clock advancing past expiry_date mutates LaminateLot (EXPIRED); that expiry
          itself releases the lot's RESERVED reservation; the reservation's release
          itself drops the order's coverage below panels_required and flips the order
          AWAITING_LAMINATE -> ON_HOLD.
        test_recipe:
          setup:
            - "Order AWAITING_LAMINATE with RELEASED array (panels_required 34) and one RESERVED reservation of 34 panels against lot LOT-E1 (manufacture 2025-08-10, expiry 2026-08-10, ship date 2026-08-09 < expiry)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Theta Circuits", contact_email: "ops@theta.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-09T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-E1", manufacture_date: "2025-08-10T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner, captures: { res: $.data.id } }
          trigger:
            - { call: "POST /pcb/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: FabAdmin }
          assert:
            - "GET LaminateLot.${lot}.status == EXPIRED (link 0: clock reached expiry_date 2026-08-10)"
            - "GET LaminateReservation.${res}.status == RELEASED (link 1, caused by the expiry)"
            - "GET LaminateLot.${lot}.panels_reserved == 0"
            - "GET FabOrder.${ord}.fab_status == ON_HOLD (link 2, caused by link 1: coverage 0 < 34)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (state vs business_fiscal; business_temporal vs business_fiscal)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_beats_insufficient_laminate
        grounds:
          - validations[priority=7]
          - validations[priority=32]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: releasing an order still in
          DFM_REVIEW (state violation, priority 7) that also has zero laminate
          coverage (business_fiscal violation, priority 32) must return
          ERR_INVALID_STATE, not ERR_INSUFFICIENT_LAMINATE.
        test_recipe:
          setup:
            - "Order in DFM_REVIEW (stackup locked, submit-dfm done) with no panel array and no reservations — coverage 0 < any panels_required"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Iota Circuits", contact_email: "ops@iota.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — the state violation at priority 7 masks the business_fiscal laminate shortage at priority 32"
      - name: reservation_temporal_beats_insufficient_panels
        grounds:
          - validations[priority=22]
          - validations[priority=32]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal: reserving against
          a lot whose expiry_date equals the order's ship date (temporal violation,
          priority 22) while requesting more panels than panels_available (fiscal
          violation, priority 32) must return ERR_LOT_EXPIRES_BEFORE_SHIP, not
          ERR_INSUFFICIENT_LAMINATE.
        test_recipe:
          setup:
            - "Order AWAITING_LAMINATE with RELEASED array (panels_required 34, ship 2026-08-10)"
            - "Lot LOT-T1 QUALIFIED, manufacture 2025-08-10 -> expiry 2026-08-10 == ship date (temporal violation), panels_total 10 -> available 10 < 34 (fiscal violation)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Kappa Circuits", contact_email: "ops@kappa.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-T1", manufacture_date: "2025-08-10T00:00:00Z", panels_total: 10 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
          trigger:
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_EXPIRES_BEFORE_SHIP (http 422) — the business_temporal rule at priority 22 masks the business_fiscal shortage at priority 32"

  # =========================================================================
  # Rule 6 — boundary_precision_check (aspect ratio on drill approve; lane capacity on release)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aspect_ratio_exact_limit
        grounds:
          - calculations.aspect_ratio_check
          - validations[priority=18]
        distinguishing_aspect: |
          Ratio metric on the drill-approve endpoint: 64/8 mils lands exactly on the
          1oz ceiling 8.0 and must PASS (inclusive <=), while 62/7 = 8.857 on an
          identical-shape program must FAIL with ERR_ASPECT_RATIO_EXCEEDED.
        test_recipe:
          setup:
            - "Two QUOTED orders each with a LOCKED 1oz stackup: O1 thickness 64 mils, O2 thickness 62 mils; drill programs UNDER_REVIEW with min_hole 8 (O1) and 7 (O2)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Lambda Circuits", contact_email: "ops@lambda.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { o1: $.data.id } }
            - { call: "POST /pcb/fab-orders/${o1}/stackups", payload: { revision: 1, total_thickness_mils: 64, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { s1: $.data.id } }
            - { call: "POST /pcb/stackups/${s1}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${o1}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 400 }, as: CAMOperator, as_user_id: "cam_1", captures: { d1: $.data.id } }
            - { call: "POST /pcb/drill-programs/${d1}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { o2: $.data.id } }
            - { call: "POST /pcb/fab-orders/${o2}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { s2: $.data.id } }
            - { call: "POST /pcb/stackups/${s2}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${o2}/drill-programs", payload: { revision: 1, min_hole_mils: 7, hole_count: 400 }, as: CAMOperator, as_user_id: "cam_1", captures: { d2: $.data.id } }
            - { call: "POST /pcb/drill-programs/${d2}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
          trigger:
            - { call: "POST /pcb/drill-programs/${d1}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1", captures: { d1_status: $.data.status, d1_ratio: $.data.plated_aspect_ratio } }
            - { call: "POST /pcb/drill-programs/${d2}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1", captures: { err: $.data.error_id } }
          assert:
            - "DrillProgram.${d1}: status == APPROVED with plated_aspect_ratio == 8.0 (64/8 hits the inclusive ceiling)"
            - "DrillProgram.${d2} approve rejected: error_id == ERR_ASPECT_RATIO_EXCEEDED (62/7 = 8.857 > 8.0)"
      - name: lane_capacity_exact_fit
        grounds:
          - calculations.lane_capacity_commitment
          - validations[priority=33]
        distinguishing_aspect: |
          Capacity metric on the release endpoint (different metric and endpoint than
          the aspect-ratio instance): committed 300 + 200 == capacity 500 must PASS
          (inclusive <=), and one further board (501) must FAIL with
          ERR_LANE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Lane QT3 capacity 500/day; three QUICK_TURN orders on ship date 2026-08-10: O1 qty 300 (100 panels), O2 qty 200 (67 panels), O3 qty 1 (1 panel); lot LOT-L1 has 500 panels; each order fully prepared (array released, drill approved, reservation placed)"
          setup_api_calls:
