              as: SchoolAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /parents/${p1_id}/students"
              payload: { full_name: "S1", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v0}" }
              as: Parent
              as_user_id: "${p1_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /parents"
              payload: { full_name: "P2", email: "p2@x.com" }
              as: SchoolAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /parents/${p2_id}/students"
              payload: { full_name: "S2", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl_id}" }
              as: Parent
              as_user_id: "${p2_id}"
              captures: { s2_id: $.data.id }
            - call: "GET /class-sessions/${sess_id}"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v_cur: $.data.version }
