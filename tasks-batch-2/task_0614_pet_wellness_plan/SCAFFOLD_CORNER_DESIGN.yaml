              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PREMIUM", name: "Premium", monthly_fee_cents: 9000, annual_value_cents: 120000, alacarte_discount_pct: 0.30 }
              as: PlanAdmin
