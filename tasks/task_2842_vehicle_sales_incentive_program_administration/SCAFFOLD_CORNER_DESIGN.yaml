      - name: claim_rate_basis_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.claim_payable_amount.variants
        excluded_because:
          difficulty_instance: claim_rate_basis_snapshot_versus_repriced_current
          rationale: "That §1.8 dual_variant_calc instance already runs two claims on the same program, same delivery footprint and same rate schedule through both variants and asserts the divergent approved_amount_cents together with rate_basis AS_SOLD_SNAPSHOT versus REPRICED_CURRENT, including the window test that selects between them. A §1.9 variant-selection recipe would re-drive the identical endpoints."

      - name: stair_step_tier_boundaries_and_bonus_mode_divergence
        claim_type: tiered_pricing
        grounds:
          - calculations.dealer_stair_step_payout
        excluded_because:
          difficulty_instance: stair_step_payout_marginal_bands_versus_full_volume
          rationale: "That §1.8 instance walks the tier ladder at threshold_units - 1, exactly at the threshold and above it, and computes the same achieved_units under MARGINAL and FULL_VOLUME to show the retroactive re-rating delta, which is precisely the tiered_pricing boundary/marginal-versus-average claim set."

      - name: accrual_rounds_per_line_before_summing
        claim_type: precision
        grounds:
          - calculations.budget_accrual_amount.precision
        excluded_because:
          difficulty_instance: accrual_rounds_each_eligibility_line_before_summing
          rationale: "That §1.8 combinatorial_formula instance pins the round-then-sum order across multiple EligibilityRule lines and states the wrong sum-then-round answer explicitly; a §1.9 precision recipe would assert the same accrued_cents from the same POST /incentives/programs/{id}/accruals call."

      - name: back_dated_detection_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.back_dated_sale_detection
        excluded_because:
          difficulty_instance: reporting_lag_boundary_is_strictly_greater_than_ten_days
          rationale: "That §1.8 boundary_precision_check instance already tests reporting_lag_days at 10 (clean), 11 (flagged) and -1 (future-dated), which is exactly the threshold-1 / threshold / threshold+1 sweep the guide asks for on this calculation."

      - name: committed_ledger_reconciles_after_chargeback_disposition
        claim_type: correct_result
        grounds:
          - calculations.program_committed_ledger
        excluded_because:
          difficulty_instance: recovered_chargeback_restores_committed_cents_but_write_off_deliberately_does_not
          rationale: "That §1.8 compensating_invariant instance drives the same claim through approval, payment, chargeback and both dispositions, asserting committed_cents before and after each step; it is the ledger's correct-result claim in full."

      - name: achieved_units_conservation_across_validate_and_unwind
        claim_type: correct_result
        grounds:
          - calculations.objective_achieved_units
        excluded_because:
          difficulty_instance: unwinding_a_delivery_restores_achieved_units_and_the_whole_stair_step_payout
          rationale: "That §1.8 compensating_invariant instance asserts achieved_units 2 -> 3 -> 2 with the payout returning to its exact prior value, which is the conservation claim for this aggregation and its downstream tier payout."

      - name: residual_impact_uses_raw_msrp_to_break_the_circularity
        claim_type: correct_result
        grounds:
          - calculations.residual_value_impact
        excluded_because:
          difficulty_instance: residual_impact_breaks_the_capitalized_cost_circularity
          rationale: "That §1.8 combinatorial_formula instance already proves step 3 reads RAW msrp_cents by stacking customer cash on the same delivery and showing residual_impact_bps does not move; the §1.9 precision instance above covers the orthogonal floor-at-every-division claim."

  - section: validations
    instances:
      - name: program_creation_ladder_walks_role_then_shape_then_uniqueness
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: "One payload is deliberately wrong in three ways at once (Dealer role, missing per_unit_amount_cents, already-used program_code) and the defects are then peeled off one at a time, so the response walks ERR_UNAUTHORIZED -> ERR_INVALID_REQUEST -> ERR_DUPLICATE_PROGRAM_CODE -> 201. Any implementation that checks uniqueness with a database constraint before parsing the body reports the wrong error at step 1 or 2."
        test_recipe:
          setup:
            - "One existing program already holding program_code CRN-V-LAD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-LAD", name: "Ladder Motors", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-LAD", name: "Ladder Incumbent", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNLAD", priority_rank: 409, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { incumbent: $.data.id }
          trigger:
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-LAD", name: "Ladder Attempt A", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", budget_cents: 1000000, stack_group: "CRNLAD", priority_rank: 410 }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { err_role: $.data.error_id, msg_role: $.data.message }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-LAD", name: "Ladder Attempt B", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", budget_cents: 1000000, stack_group: "CRNLAD", priority_rank: 410 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_shape: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-LAD", name: "Ladder Attempt C", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNLAD", priority_rank: 410 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_dupe: $.data.error_id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-LAD-2", name: "Ladder Attempt D", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNLAD", priority_rank: 410 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_version: $.data.version }
          assert:
            - "${err_role} == ERR_UNAUTHORIZED with HTTP 403 — the role gate at priority 2 fires even though the body is also malformed and the code is also taken"
            - "${msg_role} is a non-empty human-readable string, and the envelope carries ONLY error_id and message"
            - "${err_shape} == ERR_INVALID_REQUEST with HTTP 400 — the missing required per_unit_amount_cents at priority 6 outranks the duplicate code at priority 8"
            - "${err_dupe} == ERR_DUPLICATE_PROGRAM_CODE with HTTP 409"
            - "${ok_status} == DRAFT and ${ok_version} == 1 — only the fourth attempt persisted anything"
            - "the three rejected attempts left NO program behind: a subsequent GET /incentives/programs returns the incumbent plus exactly one new row"

      - name: path_resources_resolve_before_body_foreign_keys_so_a_bogus_batch_is_not_found
        claim_type: cascading_validation
        grounds:
