  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: declined_offer_restores_the_cycle_ledger_to_its_pre_award_values
        grounds:
          - state_machines.Award.OFFERED_to_DECLINED
          - calculations.cycle_budget_posture
          - calculations.cycle_admin_assessment
          - state_machines.RecommendationSlot.BOARD_APPROVED_to_VOIDED
        distinguishing_aspect: |
          Approving a slot writes six cycle fields, two discipline fields and one artist counter;
          declining the resulting offer must return every one of them to its exact pre-approval
          value — including admin_assessment_rate, which must fall back to 0.0 rather than
          sticking at the 0.085 tier it selected on the way up. The identity checked is
          before == after on the whole ledger, not merely "available_cents went back up".
        test_recipe:
          setup:
            - "CycleMain in BOARD_REVIEW with app1 SCORED and slated at rank 1"
            - "Pre-approval ledger: funded_total 0, admin_assessment_rate 0.0, assessment 0, committed 0, reserve 300000, available 5700000, posture OPEN"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
