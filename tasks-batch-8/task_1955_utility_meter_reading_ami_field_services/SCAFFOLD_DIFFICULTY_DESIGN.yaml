  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_stop_not_actionable_beats_business_constraint_rollback
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_STOP_NOT_ACTIONABLE]
        distinguishing_aspect: |
          Category pair state vs business_constraint: one request violates both (stop is
          SKIPPED_HAZARD and read_value 9000 rolls back the last validated 10000); the state
          error ERR_STOP_NOT_ACTIONABLE (priority 9) must win over ERR_READ_ROLLBACK (priority 18).
        test_recipe:
          setup:
            - "AMI account with validated history (last validated 10000), meter DEGRADED; period window [2026-08-06..2026-08-10] WINDOW_OPEN; route IN_PROGRESS; ACTIVE DOG hazard; stop SKIPPED_HAZARD"
