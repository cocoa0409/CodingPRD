            - call: "POST /dmv/documents"
              payload: { transaction_id: "${rj_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { rj_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${rj_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { rj_d2: $.data.id }
            - call: "POST /dmv/documents/${rj_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${rj_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${rj_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { rj_v1: $.data.version }
            - call: "POST /dmv/transactions/${rj_txn}/quote"
              payload: { expected_transaction_version: "${rj_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${rj_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { rj_sub: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { rj_trip: $.data.id, rj_trip_v0: $.data.version }
            - call: "POST /dmv/runner-trips/${rj_trip}/legs"
              payload: { submission_id: "${rj_sub}", expected_runnertrip_version: "${rj_trip_v0}" }
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${rj_trip}/dispatch"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${rj_trip}/return"
              payload: {}
              as: RunnerDispatcher
          trigger:
            - call: "POST /dmv/submissions/${rj_sub}/decision"
              payload: { outcome: "DMV_REJECTED", rejection_reason: "Wrong office" }
              as: RunnerDispatcher
          assert:
            - "Submission.${rj_sub}.submission_status == DMV_REJECTED"
            - "Transaction.${rj_txn}.lifecycle_status == REJECTED and rejection_round == 1"
            - "Transaction.${rj_txn}.document_status == INCOMPLETE (caused by the rejection cascade)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_role_beats_invalid_state_on_quote
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pair {auth(p2) ERR_FORBIDDEN_ROLE x state(p5) ERR_INVALID_STATE}: an IntakeClerk (wrong role) quoting a transaction already in SUBMITTED (wrong state) is rejected with ERR_FORBIDDEN_ROLE (403) because priority 2 fires before priority 5."
        test_recipe:
          setup:
            - "CA FeeSchedule; RETAIL account; REGISTRATION Transaction driven all the way to SUBMITTED (so quoting it is BOTH a role violation for IntakeClerk and a state violation)."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "P5 Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { p5_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${p5_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { p5_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${p5_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { p5_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${p5_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { p5_d2: $.data.id }
            - call: "POST /dmv/documents/${p5_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${p5_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${p5_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { p5_v1: $.data.version }
            - call: "POST /dmv/transactions/${p5_txn}/quote"
              payload: { expected_transaction_version: "${p5_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${p5_txn}/submit"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /dmv/transactions/${p5_txn}/quote"
              payload: { expected_transaction_version: "${p5_v1}" }
              as: IntakeClerk
              captures: { p5_err: $.data.error_id }
          assert:
            - "response status == 403 and error_id == ERR_FORBIDDEN_ROLE (auth priority 2 beats state priority 5; role check fires before the OCC version check regardless of the version value supplied)"

      - name: invalid_state_beats_credit_limit_on_complete
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Pair {state(p5) ERR_INVALID_STATE x business_fiscal(p16) ERR_CREDIT_LIMIT_EXCEEDED}: completing a transaction still in DRAFT on a FLEET account whose balance would exceed credit_limit returns ERR_INVALID_STATE (409, p5), not the fiscal error — the state check fires first."
        test_recipe:
          setup:
            - "CA FeeSchedule; FLEET account credit_terms with credit_limit_cents=1 (any completion would exceed)."
            - "A REGISTRATION Transaction left in DRAFT (never submitted/approved)."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Broke Fleet", state_code: "CA", credit_terms: true, credit_limit_cents: 1 }
              as: PlatformAdmin
              captures: { p16_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${p16_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { p16_txn: $.data.id }
          trigger:
            - call: "POST /dmv/transactions/${p16_txn}/complete"
              payload: {}
              as: FeeAnalyst
              captures: { p16_err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_INVALID_STATE (state priority 5 beats fiscal priority 16; txn is DRAFT not APPROVED)"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fleet_tier_boundary_ytd_5_inclusive_on_quote
        grounds:
          - calculations.fleet_volume_discount
          - entities.Account.fields.ytd_completed_count
        distinguishing_aspect: "Boundary on the ytd_completed_count metric via POST /dmv/transactions/{id}/quote: ytd==4 yields 0 discount (service 4500) while ytd==5 yields the 625 bps tier (service 4219) — the >= boundary is inclusive at 5."
        test_recipe:
          setup:
            - "CA FeeSchedule registration_fee 8500."
            - "FLEET account A with ytd_completed_count==4 (no tier) and FLEET account B with ytd_completed_count==5 (tier 1), each with a fresh REGISTRATION Transaction in DRAFT."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Tier4", state_code: "CA", credit_terms: true, credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { b4_acct: $.data.id }
            - call: "POST /dmv/_inject/account_counters"
              payload: { account_id: "${b4_acct}", ytd_completed_count: 4 }
              as: PlatformAdmin
            - call: "POST /dmv/transactions"
              payload: { account_id: "${b4_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { b4_txn: $.data.id, b4_txn_v0: $.data.version }
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Tier5", state_code: "CA", credit_terms: true, credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { b5_acct: $.data.id }
            - call: "POST /dmv/_inject/account_counters"
              payload: { account_id: "${b5_acct}", ytd_completed_count: 5 }
              as: PlatformAdmin
            - call: "POST /dmv/transactions"
              payload: { account_id: "${b5_acct}", transaction_type: "REGISTRATION", vin: "2HGCM82633A004353", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { b5_txn: $.data.id, b5_txn_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${b4_txn}/quote"
              payload: { expected_transaction_version: "${b4_txn_v0}" }
              as: FeeAnalyst
              captures: { b4_svc: $.data.service_fee_cents }
            - call: "POST /dmv/transactions/${b5_txn}/quote"
              payload: { expected_transaction_version: "${b5_txn_v0}" }
              as: FeeAnalyst
              captures: { b5_svc: $.data.service_fee_cents }
          assert:
            - "quote on ${b4_txn} has service_fee_cents == 4500 (ytd 4 -> no tier)"
            - "quote on ${b5_txn} has service_fee_cents == 4219 (ytd 5 -> 625 bps tier, round(4500*0.9375))"

      - name: dispatch_empty_trip_zero_legs_rejected
        grounds:
          - state_machines.RunnerTrip.PLANNED_to_DISPATCHED
          - entities.RunnerTrip.fields.assigned_leg_count
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Empty-set boundary on a DIFFERENT metric (assigned_leg_count) via a DIFFERENT endpoint POST /dmv/runner-trips/{id}/dispatch: dispatching a trip with assigned_leg_count==0 is rejected (precondition assigned_leg_count>=1), the zero-collection edge."
        test_recipe:
          setup:
            - "One PLANNED RunnerTrip with capacity 5 and zero attached legs."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-09", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { empty_trip: $.data.id }
          trigger:
            - call: "POST /dmv/runner-trips/${empty_trip}/dispatch"
              payload: {}
              as: RunnerDispatcher
              captures: { empty_err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_INVALID_STATE (assigned_leg_count==0 < 1)"
            - "RunnerTrip.${empty_trip}.trip_status == PLANNED (unchanged)"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_decision_requires_trip_returned
        grounds:
          - state_machines.Submission.ASSIGNED_to_ACCEPTED
          - validations[priority=14]
          - entities.RunnerTrip.fields.trip_status
          - errors[ERR_TRIP_NOT_RETURNED]
        distinguishing_aspect: "Entity pair Submission->RunnerTrip: a Submission's ASSIGNED->ACCEPTED decision depends on the leg's RunnerTrip.trip_status being RETURNED; recording a decision while the trip is only DISPATCHED returns ERR_TRIP_NOT_RETURNED."
        test_recipe:
