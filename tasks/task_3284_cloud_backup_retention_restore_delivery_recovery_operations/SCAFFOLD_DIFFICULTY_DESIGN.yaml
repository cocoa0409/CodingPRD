              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { acct_p_vr0: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_p_id}", subject_agent_id: "${agt_p_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 600.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-010", expected_account_version: "${acct_p_vr0}" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_r_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_r_id}/validate"
              payload: { requester_mfa_ticket: "mfa-ticket-010" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
            - call: "POST /backup-provider/restore-requests/${rr_r_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
            - call: "POST /backup-provider/restore-requests/${rr_r_id}/prepare"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
            - call: "POST /backup-provider/restore-requests/${rr_r_id}/complete"
