      - name: missing_identity_headers_are_unauthenticated_except_on_the_clock
        claim_type: exclusive_operations
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /warewashing/_clock/set_current_utc]
        distinguishing_aspect: |
          Authentication is checked before authorisation and before routing semantics: with the
          X-User-Role header absent the same GET and POST that succeed for a valid role return
          ERR_UNAUTHENTICATED (401), not ERR_FORBIDDEN_ROLE and not a 404 - and the single declared
          exemption, the clock endpoint, still works with no headers at all.
        test_recipe:
          setup:
            - "One customer, created with valid headers, to address afterwards."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: "(X-User-Role and X-User-ID omitted)"
              captures: { err_1: $.data.error_id }
            - call: "POST /warewashing/customers"
              payload: { name: "Anonymous Account", sustainability_goal_water_l: 1000 }
              as: "(X-User-Role omitted)"
              captures: { err_2: $.data.error_id }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: "(no headers)"
              captures: { now: $.data.current_utc }
          assert:
            - "${err_1} == ${err_2} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${now} == 2026-08-02T00:00:00Z - the clock is the one endpoint exempt from the header check"
            - "no customer named Anonymous Account exists afterwards"

