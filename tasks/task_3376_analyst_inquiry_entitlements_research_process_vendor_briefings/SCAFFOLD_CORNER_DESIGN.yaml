        distinguishing_aspect: "When every analyst who covers the briefing topic carries an ACTIVE sales tie to the requesting vendor, the screening step refuses the request outright with 403 ERR_BRIEFING_SEPARATION_FAILED rather than booking a conflicted analyst."
        test_recipe:
