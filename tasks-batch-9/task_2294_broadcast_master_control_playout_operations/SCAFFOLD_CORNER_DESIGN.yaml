        grounds: "§1.3 asset_technical_score (weighted_scoring: DEFECT_POINTS, duration_penalty = 0 if delta <= 2 else min(30, ceil(delta/2)*3), verdict FAIL if score < 70 OR any CRITICAL_DEFECT OR caption/resolution mismatch, PASS_WITH_EXCEPTION if < 85, else PASS; 'exactly 70 is PASS_WITH_EXCEPTION, exactly 85 is PASS')"
