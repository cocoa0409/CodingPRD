scaffold_corner_design:
- section: entities
  instances:
  - name: creation_of_a_title_returns_all_declared_fields_at_pitched
    claim_type: creation
    grounds: [entities.Title, 'endpoints[POST /comics/titles]', state_machines.Title.initial_state]
    distinguishing_aspect: 'A bare POST /comics/titles with the four declared input fields returns 201
      and every declared field: status PITCHED, greenlit_at null and all three ledgers at 0.'
    test_recipe:
      setup: [empty database, 'logical clock at the 2026-08-01T00:00:00Z default']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      assert: [response status == 201, 'Title.${t1}.name == ''Nebula Knights'' and planned_issue_count
          == 6', 'Title.${t1}.royalty_pool_bps == 1200 and cover_participation_bps == 1500', 'Title.${t1}.status
          == PITCHED and greenlit_at == null and cancel_reason == null', 'Title.${t1}.committed_share_bps
          == 0, production_cost_cents == 0, royalty_accrued_cents == 0', 'response data carries id, created_at,
          updated_at and version (common_fields: true)']
  - name: retrieval_of_an_issue_exposes_the_computed_foc_date_and_health_defaults
    claim_type: retrieval
    grounds: [entities.Issue.fields.foc_date, entities.Issue.fields.schedule_health, 'endpoints[GET /comics/issues/{id}]',
      calculations.stage_slip_days]
    distinguishing_aspect: GET /comics/issues/{id} on a freshly created issue returns foc_date == 2026-10-21T00:00:00Z
      (target 2026-11-11 minus the 21-day FOC_LEAD_DAYS constant) with every rollup still at 0.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', GREENLIT title with one ACCEPTED SCRIPT assignment,
        'Issue #1 target_on_sale_date 2026-11-11, page_count 22, cover_price_cents 399']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
        captures: {cr_a: $.data.id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: '${cr_a}', craft: SCRIPT, page_rate_cents: 12000, royalty_share_bps: 5000,
          booking_start_date: '2026-08-01', booking_end_date: '2026-12-01', expected_title_version: '${tv1}'}
        as: EditorInChief
        captures: {a_s: $.data.id}
      - call: POST /comics/creative-assignments/${a_s}/accept
        payload: {}
        as: Creator
        as_user_id: ${cr_a}
      - call: POST /comics/titles/${t1}/issues
        payload: {issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: '2026-11-11'}
        as: ManagingEditor
        captures: {i1: $.data.id}
      trigger:
      - call: GET /comics/issues/${i1}
        payload: {}
        as: ManagingEditor
      assert: ['Issue.${i1}.foc_date == ''2026-10-21T00:00:00Z''', 'Issue.${i1}.production_status == PLANNED
          and commercial_status == UNSOLICITED', 'Issue.${i1}.schedule_health == ON_TRACK and total_slip_days
          == 0', 'Issue.${i1}.total_ordered_units == 0, printed_units == 0, shipped_units == 0', 'Issue.${i1}.on_sale_date
          == null', 'Issue.${i1}.page_count == 22 and cover_price_cents == 399']
  - name: listing_retailers_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds: ['endpoints[GET /comics/retailers]', response_envelope.pagination_fields, response_envelope.pagination_defaults]
    distinguishing_aspect: Three retailers exist; limit 2 / offset 0 returns exactly 2 rows with total_count
      3 and has_more true, and limit 2 / offset 2 returns 1 row with has_more false.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', 'three ACTIVE retailers DM-2001, DM-2002, DM-2003,
          all with opening_units_ytd 0']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SalesDirector
      - call: POST /comics/retailers
        payload: {account_no: DM-2001, name: Panel Palace, credit_limit_cents: 5000000, non_returnable_ack: true,
          opening_units_ytd: 0}
        as: SalesDirector
        captures: {r1: $.data.id}
      - call: POST /comics/retailers
        payload: {account_no: DM-2002, name: Splash Page Comics, credit_limit_cents: 5000000, non_returnable_ack: true,
          opening_units_ytd: 0}
        as: SalesDirector
        captures: {r2: $.data.id}
      - call: POST /comics/retailers
        payload: {account_no: DM-2003, name: Gutter Books, credit_limit_cents: 5000000, non_returnable_ack: true,
          opening_units_ytd: 0}
        as: SalesDirector
        captures: {r3: $.data.id}
      trigger:
      - call: GET /comics/retailers
        payload: {limit: 2, offset: 0}
        as: SalesDirector
      - call: GET /comics/retailers
        payload: {limit: 2, offset: 2}
        as: SalesDirector
      - call: GET /comics/retailers
        payload: {status: ACTIVE, limit: 100, offset: 0}
        as: SalesDirector
      assert: [first response data length == 2 with meta total_count == 3 and has_more == true, second
          response data length == 1 with total_count == 3 and has_more == false, third response data length
          == 3 (all three are ACTIVE) with has_more == false, 'rows are ordered created_at ASC, so the
          first page holds DM-2001 and DM-2002', every row carries discount_tier == ENTRY and cumulative_units_ytd
          == 0]
  - name: get_unknown_solicitation_id_returns_err_solicitation_not_found
    claim_type: not_found
    grounds: ['errors[ERR_SOLICITATION_NOT_FOUND]', validations.priority_4, 'endpoints[GET /comics/solicitations/{id}]']
    distinguishing_aspect: A syntactically valid but absent solicitation id on GET /comics/solicitations/{id}
      returns 404 ERR_SOLICITATION_NOT_FOUND, not an empty 200 body.
    test_recipe:
      setup: [empty database except the clock default]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SalesDirector
      trigger:
      - call: GET /comics/solicitations/00000000-0000-0000-0000-000000000001
        payload: {}
        as: SalesDirector
        captures: {err: $.data.error_id}
      assert: [response status == 404, error_id == ERR_SOLICITATION_NOT_FOUND, response_type == 'error'
          and data carries error_id plus message]
  - name: issue_creation_missing_required_page_count_is_rejected
    claim_type: required_fields
    grounds: [entities.Issue.fields.page_count, validations.priority_3, 'errors[ERR_INVALID_REQUEST]']
    distinguishing_aspect: 'page_count has source: input and no default, so omitting it on POST /comics/titles/{id}/issues
      returns 400 ERR_INVALID_REQUEST and no Issue row is created.'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', GREENLIT title with no issues yet]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
        captures: {cr_a: $.data.id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      trigger:
      - call: POST /comics/titles/${t1}/issues
        payload: {issue_number: 1, cover_price_cents: 399, target_on_sale_date: '2026-10-14'}
        as: ManagingEditor
        captures: {err: $.data.error_id}
      - call: GET /comics/titles/${t1}/issues
        payload: {limit: 100, offset: 0}
        as: ManagingEditor
      assert: [response status == 400 with error_id == ERR_INVALID_REQUEST, 'GET /comics/titles/${t1}/issues
          returns total_count == 0', 'Title.${t1}.status is still GREENLIT (no GREENLIT -> IN_PRODUCTION
          bubble fired)']
  - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
    claim_type: defaults
    grounds: [entities.Retailer.fields.opening_units_ytd, entities.RetailerOrder.fields.exclusive_variant_qty,
      entities.RetailerOrder.fields.earned_variant_allocations, entities.CreativeAssignment.fields.advance_cents]
    distinguishing_aspect: Omitting opening_units_ytd, exclusive_variant_qty and advance_cents yields
      exactly the declared defaults 0 / 0 / 0 (and earned_variant_allocations []), not null.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', 'GREENLIT title, one ACCEPTED SCRIPT assignment created
          without advance_cents', 'Issue #1 UNSOLICITED, one retailer created without opening_units_ytd']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
        captures: {cr_a: $.data.id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: '${cr_a}', craft: SCRIPT, page_rate_cents: 12000, royalty_share_bps: 5000,
          booking_start_date: '2026-08-01', booking_end_date: '2026-12-01', expected_title_version: '${tv1}'}
        as: EditorInChief
        captures: {a_s: $.data.id}
      - call: POST /comics/creative-assignments/${a_s}/accept
        payload: {}
        as: Creator
        as_user_id: ${cr_a}
      - call: POST /comics/titles/${t1}/issues
        payload: {issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: '2026-10-14'}
        as: ManagingEditor
        captures: {i1: $.data.id}
      - call: POST /comics/retailers
        payload: {account_no: DM-2001, name: Panel Palace, credit_limit_cents: 5000000, non_returnable_ack: true}
        as: SalesDirector
        captures: {r1: $.data.id}
      trigger:
      - call: POST /comics/retailer-orders
        payload: {retailer_id: '${r1}', issue_id: '${i1}', standard_qty: 100}
        as: Retailer
        as_user_id: ${r1}
        captures: {o1: $.data.id}
      assert: ['Retailer.${r1}.opening_units_ytd == 0 and cumulative_units_ytd == 0', 'Retailer.${r1}.discount_tier
          == ENTRY and status == ACTIVE and suspension_reason == null', 'CreativeAssignment.${a_s}.advance_cents
          == 0 and unrecouped_advance_cents == 0', 'RetailerOrder.${o1}.exclusive_variant_qty == 0', 'RetailerOrder.${o1}.earned_variant_allocations
          == [] and total_units == 0', 'RetailerOrder.${o1}.is_reorder == false and status == DRAFT']
  - name: computed_creator_active_assignment_count_counts_only_open_assignments
    claim_type: computed_fields
    grounds: [entities.Creator.fields.active_assignment_count, state_machines.CreativeAssignment.COUNTERED_to_TERMINATED]
    distinguishing_aspect: active_assignment_count is 2 while one assignment is PROPOSED and one ACCEPTED,
      and drops to 1 when the PROPOSED row is TERMINATED — a client-supplied value is never honoured.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', 'GREENLIT title with two assignments for the same
          creator on adjacent bookings: SCRIPT 5000 bps ACCEPTED and PENCILS 1500 bps left PROPOSED']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
        captures: {cr_a: $.data.id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: '${cr_a}', craft: SCRIPT, page_rate_cents: 12000, royalty_share_bps: 5000,
          booking_start_date: '2026-08-01', booking_end_date: '2026-08-05', expected_title_version: '${tv1}'}
        as: EditorInChief
        captures: {a_s: $.data.id}
      - call: POST /comics/creative-assignments/${a_s}/accept
        payload: {}
        as: Creator
        as_user_id: ${cr_a}
      - call: GET /comics/titles/${t1}
        payload: {}
        as: EditorInChief
        captures: {tv2: $.data.version}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: '${cr_a}', craft: PENCILS, page_rate_cents: 9000, royalty_share_bps: 1500,
          booking_start_date: '2026-08-05', booking_end_date: '2026-08-10', expected_title_version: '${tv2}'}
        as: EditorInChief
        captures: {a_pe: $.data.id}
      trigger:
      - call: GET /comics/creators/${cr_a}
        payload: {}
        as: EditorInChief
      - call: POST /comics/creative-assignments/${a_pe}/terminate
        payload: {reason: artist unavailable}
        as: EditorInChief
      - call: GET /comics/creators/${cr_a}
        payload: {}
        as: EditorInChief
      assert: ['first GET: Creator.${cr_a}.active_assignment_count == 2', 'CreativeAssignment.${a_pe}.status
          == TERMINATED with terminated_reason == ''artist unavailable''', 'second GET: Creator.${cr_a}.active_assignment_count
          == 1', 'Title.${t1}.committed_share_bps == 5000 (only the ACCEPTED SCRIPT row counts)']
  - name: title_creation_extra_field_status_input_ignored
    claim_type: system_fields
    grounds: [entities.Title.fields.status, entities.Title.fields.greenlit_at, entities.Title.fields.committed_share_bps]
    distinguishing_aspect: 'status, greenlit_at and committed_share_bps are source: system/computed, so
      values sent for them on POST /comics/titles are discarded and the row is still PITCHED with 0 bps.'
    test_recipe:
      setup: [empty database, 'logical clock 2026-08-01T00:00:00Z']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500,
          status: PUBLISHING, greenlit_at: '2020-01-01T00:00:00Z', committed_share_bps: 9999}
        as: EditorInChief
        captures: {t1: $.data.id}
      assert: ['Title.${t1}.status == PITCHED (the supplied PUBLISHING is ignored)', 'Title.${t1}.greenlit_at
          == null (the supplied 2020-01-01 is ignored)', 'Title.${t1}.committed_share_bps == 0 (the supplied
          9999 is ignored)', 'Title.${t1}.id is a server-minted identifier that differs from anything
          in the request']
  - name: out_of_range_and_empty_enum_array_inputs_are_rejected
    claim_type: type_constraints
    grounds: [entities.Title.fields.planned_issue_count, entities.Creator.fields.crafts, validations.priority_3,
      'errors[ERR_INVALID_REQUEST]']
    distinguishing_aspect: planned_issue_count 25 breaches the declared 1..24 range and crafts [] breaches
      the non-empty-distinct-enum constraint; both return 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup: [empty database, 'logical clock 2026-08-01T00:00:00Z']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles
        payload: {name: Overrun, planned_issue_count: 25, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {err1: $.data.error_id}
      - call: POST /comics/creators
        payload:
          full_name: Nobody
          crafts: []
          default_page_rate_cents: 1000
        as: EditorInChief
        captures: {err2: $.data.error_id}
      - call: POST /comics/titles
        payload: {name: Overrun, planned_issue_count: 24, royalty_pool_bps: 3001, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {err3: $.data.error_id}
      assert: ['first trigger: status == 400 with error_id == ERR_INVALID_REQUEST (planned_issue_count
          > 24)', 'second trigger: status == 400 with error_id == ERR_INVALID_REQUEST (crafts must be
          non-empty)', 'third trigger: status == 400 with error_id == ERR_INVALID_REQUEST (royalty_pool_bps
          > 3000)', no Title and no Creator row exists after the three calls]
  - name: immutable_variant_cover_and_release_window_rows_carry_no_version_field
    claim_type: immutability
    grounds: [entities.VariantCover, entities.ReleaseWindow, 'endpoints[GET /comics/issues/{id}/variant-covers]',
      'endpoints[GET /comics/issues/{id}/release-windows]']
    distinguishing_aspect: 'VariantCover and ReleaseWindow declare common_fields: false, so their rows
      expose no version field and §1.5 declares no update or delete endpoint for either.'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', 'GREENLIT title, Issue #1 target 2026-10-14 with one
          STANDARD cover', 'one DIGITAL release window on 2026-11-13 (the earliest legal date, target
          + 30)']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
        captures: {cr_a: $.data.id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: EditorInChief
        captures: {t1: $.data.id}
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: '${cr_a}', craft: SCRIPT, page_rate_cents: 12000, royalty_share_bps: 5000,
          booking_start_date: '2026-08-01', booking_end_date: '2026-12-01', expected_title_version: '${tv1}'}
        as: EditorInChief
        captures: {a_s: $.data.id}
      - call: POST /comics/creative-assignments/${a_s}/accept
        payload: {}
        as: Creator
        as_user_id: ${cr_a}
      - call: POST /comics/titles/${t1}/issues
        payload: {issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: '2026-10-14'}
        as: ManagingEditor
        captures: {i1: $.data.id}
      - call: POST /comics/issues/${i1}/variant-covers
        payload: {code: A, kind: STANDARD, cover_price_cents: 399}
        as: SalesDirector
        captures: {cv_std: $.data.id}
      - call: POST /comics/issues/${i1}/release-windows
        payload: {channel: DIGITAL, release_date: '2026-11-13', expected_net_receipts_cents: 120000}
        as: SalesDirector
        captures: {rw1: $.data.id}
      trigger:
      - call: GET /comics/issues/${i1}/variant-covers
        payload: {limit: 100, offset: 0}
        as: SalesDirector
      - call: GET /comics/issues/${i1}/release-windows
        payload: {limit: 100, offset: 0}
        as: SalesDirector
      assert: [variant-cover rows carry id and created_at but no version key, release-window rows carry
          id and created_at but no version key, 'VariantCover.${cv_std}.code == ''A'' and kind == STANDARD
          and incentive_ratio == null', 'ReleaseWindow.${rw1}.channel == DIGITAL and release_date == ''2026-11-13T00:00:00Z''',
        '§1.5 declares no PUT/PATCH/DELETE for either path, so the rows are write-once']
  - name: issue_creation_under_an_unknown_title_id_returns_not_found
    claim_type: parent_relationships
    grounds: [entities.Issue.parent, validations.priority_4, 'errors[ERR_TITLE_NOT_FOUND]']
    distinguishing_aspect: Issue is a child of Title, so a POST under an absent parent id returns 404
      ERR_TITLE_NOT_FOUND before any body validation runs.
    test_recipe:
      setup: [empty database, 'logical clock 2026-08-01T00:00:00Z']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles/00000000-0000-0000-0000-000000000077/issues
        payload: {issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: '2026-10-14'}
        as: ManagingEditor
        captures: {err: $.data.error_id}
      assert: [response status == 404 with error_id == ERR_TITLE_NOT_FOUND, 'the 404 wins over any body-shape
          complaint, per priority 4 running left to right']
  - name: stage_creation_with_an_assignment_from_another_title_is_rejected
    claim_type: hybrid
    grounds: [validations.priority_24, 'errors[ERR_TITLE_SCOPE_MISMATCH]', entities.ProductionStage.fields.assignment_id]
    distinguishing_aspect: The hybrid topology lets ProductionStage point at both an Issue and a CreativeAssignment;
      when the assignment's title_id differs from the issue's, the create returns 422 ERR_TITLE_SCOPE_MISMATCH
      rather than silently crossing aggregates.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', 'two GREENLIT titles: ''Nebula Knights'' (t1, carrying
          Issue #1) and ''Rim Rangers'' (t2)', the creator's only ACCEPTED SCRIPT assignment belongs to
          t2]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/creators
        payload:
          full_name: Ada Allrounder
          crafts: [SCRIPT, PENCILS, INKS, COLORS, LETTERS]
          default_page_rate_cents: 10000
        as: EditorInChief
