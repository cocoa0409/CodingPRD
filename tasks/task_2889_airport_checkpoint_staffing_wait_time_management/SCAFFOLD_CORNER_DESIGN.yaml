            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - *c_approve
            - *c_activate
            - *c_checkin
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED", position_index: 2, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              captures: { closed_lane_id: $.data.id }
          trigger:
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { suspended: true }
              as: CheckpointManager
              captures: { susp_flag: $.data.suspended, susp_posture: $.data.posture, susp_avail: $.data.available_lane_positions, susp_open_count: $.data.open_lane_count }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { l1_state: $.data.lane_state, l1_reason: $.data.paused_reason_code }
            - call: "GET /lanes/${closed_lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { l2_state: $.data.lane_state, l2_reason: $.data.paused_reason_code }
            - call: "GET /lane-assignments/${asg1_id}"
              payload: {}
              as: CheckpointManager
              captures: { asg_after_susp: $.data.assignment_state, break_after_susp: $.data.break_state }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: CheckpointManager
              captures: { off_committed_after_susp: $.data.committed_duty_minutes, off_duty_after_susp: $.data.duty_status }
          assert:
            - "${susp_flag} == true and ${susp_posture} == SUSPENDED — the flag overrides the counter-derived posture"
            - "${l1_state} == PAUSED with ${l1_reason} == SECURITY_INCIDENT (cascade down onto the OPEN lane)"
            - "${l2_state} == CLOSED with ${l2_reason} == null — a lane that was never OPEN is not touched by the cascade"
            - "${susp_avail} == 6 and ${susp_open_count} == 0 — lane ${lane_id}'s position was restored by the pause"
            - "${asg_after_susp} == REASSIGN_PENDING while ${break_after_susp} == NOT_DUE — the break axis is preserved across the cascade"
            - "${off_committed_after_susp} == 30 and ${off_duty_after_susp} == ON_DUTY — REASSIGN_PENDING still counts toward the conserved ledger, so nothing was released"

      - name: escalation_resolution_branches_move_different_checkpoint_counters
        claim_type: side_effect_execution
        grounds:
