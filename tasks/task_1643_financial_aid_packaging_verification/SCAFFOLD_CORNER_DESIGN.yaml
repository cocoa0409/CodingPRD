            - "AwardPackage.${pkg_st}.total_offered_cents == 0 (STANDARD cohort filtered out; no lines)"

      - name: reconciliation_variance_and_adjustment_constants
        claim_type: correct_result
        grounds: [calculations.reconciliation_compare, "errors[ERR_VARIANCE_NOT_ZEROED]"]
        distinguishing_aspect: "compare computes variance = federal - internal exactly (99800_00 - 100000_00 = -200_00 -> VARIANCE_FOUND); an adjustments batch that does not net to zero fails ERR_VARIANCE_NOT_ZEROED, and one that does transitions to ADJUSTED."
