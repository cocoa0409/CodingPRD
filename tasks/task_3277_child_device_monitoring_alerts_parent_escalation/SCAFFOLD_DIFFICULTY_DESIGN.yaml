  - rule_id: boundary_precision_check
    instances:
      - name: device_limit_boundary_at_exactly_limit
        grounds:
          - calculations.device_limit_and_count
          - errors[ERR_DEVICE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold boundary on device_count via POST pair: the 2nd pair on a
          BASIC family (count 1 < limit 2) succeeds; the 3rd (count 2 >= limit 2)
          fails with ERR_DEVICE_LIMIT_EXCEEDED — the >= boundary is exact.
        test_recipe:
          setup:
            - "BASIC family (limit 2) with one child"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam B2", primary_contact_email: "b2@x.com", primary_parent_name: "Pat B2", subscription_tier: "BASIC" }
              as: PlatformAdmin
