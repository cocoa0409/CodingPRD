# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2508_certified_pre_owned_program_inspection_certification
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Shared conventions:
#   * The logical clock starts at 2026-08-01T00:00:00Z; instances that need
#     another instant call POST /cpo/_clock/set_current_utc first.
#   * The canonical checklist template MPI-172 carries three points:
#       P1 POWERTRAIN CRITICAL  reconditioning_allowed false
#       S1 SAFETY   CRITICAL    reconditioning_allowed true  (cap 200000)
#       B1 BRAKES   MAJOR       measured 4.0..12.0, reconditioning_allowed true (cap 100000)
#     so point_count == 3 and critical_item_count == 2.
#   * A clean attempt is
#       [{P1 PASS}, {S1 PASS}, {B1 PASS measured_value 8.0}]
#   * A submission with no reconditioning carries three documents
#     (TITLE_HISTORY_REPORT, INSPECTION_WORKSHEET, CUSTOMER_DISCLOSURE); one with
#     reconditioning adds RECONDITIONING_INVOICE.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: warranty_anchor_variant_divergence
        grounds:
          - calculations.warranty_coverage
          - calculations.warranty_coverage.variants.in_service_anchored
          - calculations.warranty_coverage.variants.certification_anchored
          - entities.Certification.fields.warranty_anchor_variant
          - entities.Certification.fields.warranty_start_date
          - entities.Certification.fields.warranty_end_miles
          - entities.Certification.fields.retention_expires_at
          - state_machines.Certification.SUBMITTED_to_ACTIVE
        distinguishing_aspect: |
          Two vehicles approved at the identical activation instant 2026-08-01T00:00:00Z select
          opposite warranty_coverage variants purely because one has outrun its factory basic
          warranty on both axes and the other on neither: the lapsed vehicle anchors coverage on the
          activation date (2026-08-01 -> 2027-08-01) while the fresh vehicle anchors it on the future
          factory expiry (2027-03-15 -> 2028-03-15), so the two coverage windows do not even
          intersect. No other instance contrasts the two anchor branches against a shared clock.
        test_recipe:
          setup:
            - "One dealer with one credentialed technician and the published MPI-172 template."
            - "Vehicle V_OLD: in_service_date 2022-02-01, 62000 miles — factory basic (36 months / 36000 miles) lapsed on both axes."
            - "Vehicle V_NEW: in_service_date 2024-03-15, 20000 miles — factory basic still live on both axes."
            - "Both vehicles carry a PASSED inspection and a SUBMITTED certification; the clock is still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_old: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_old}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_old: $.data.id }
            - call: "PUT /cpo/inspections/${i_old}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i_old}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v_old}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_old_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v_old}", inspection_id: "${i_old}", expected_vehicle_version: "${v_old_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-OLD" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-OLD" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-OLD" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_old: $.data.id }
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000002", model_year: 2024, in_service_date: "2024-03-15", odometer_miles: 20000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_new: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_new}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T13:00:00Z", odometer_at_inspection: 20000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_new: $.data.id }
            - call: "PUT /cpo/inspections/${i_new}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i_new}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v_new}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_new_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v_new}", inspection_id: "${i_new}", expected_vehicle_version: "${v_new_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-NEW" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-NEW" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-NEW" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_new: $.data.id }
          trigger:
            - call: "POST /cpo/certifications/${c_old}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /cpo/certifications/${c_new}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
          assert:
            - "Certification.${c_old}.warranty_anchor_variant == CERTIFICATION_ANCHORED"
            - "Certification.${c_old}.warranty_start_date == 2026-08-01"
            - "Certification.${c_old}.warranty_end_date == 2027-08-01"
            - "Certification.${c_old}.warranty_end_miles == 74000"
            - "Certification.${c_old}.retention_expires_at == 2034-08-01"
            - "Certification.${c_new}.warranty_anchor_variant == IN_SERVICE_ANCHORED"
            - "Certification.${c_new}.warranty_start_date == 2027-03-15"
            - "Certification.${c_new}.warranty_end_date == 2028-03-15"
            - "Certification.${c_new}.warranty_end_miles == 32000"
            - "Certification.${c_new}.retention_expires_at == 2035-03-15"
            - "GET /cpo/certifications/${c_new}/documents returns 3 rows, each with retained_until == 2035-03-15"
            - "both certifications have activated_at == 2026-08-01T00:00:00Z, so the differing warranty_start_date is attributable to the variant selection alone"

      - name: dealer_claim_ratio_lifetime_cumulative_variant
        grounds:
          - calculations.dealer_claim_ratio
          - calculations.dealer_claim_ratio.variants.lifetime_cumulative
          - calculations.dealer_risk_score
          - entities.Dealer.fields.claim_ratio_variant
          - entities.Dealer.fields.claim_ratio_effective
          - entities.ProgramConfig.fields.claim_variant_volume_floor
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The dealer's two lifetime activations sit below claim_variant_volume_floor, so
          dealer_claim_ratio selects LIFETIME_CUMULATIVE and divides by every activation the dealer
          has ever had — including the 2025-06-01 one that is more than claim_window_days old at the
          adjudication instant — producing 1/2 == 0.50. The sibling instance
          dealer_claim_ratio_trailing_window_variant runs the identical row set and gets 0.00.
        test_recipe:
          setup:
            - "claim_ratio_probation_threshold raised to 0.60 and claim_ratio_suspension_threshold to 0.90 so a 0.50 ratio leaves the dealer ACTIVE and no privilege cascade masks the ratio."
            - "claim_variant_volume_floor left at its default 20, so 2 lifetime activations select LIFETIME_CUMULATIVE."
            - "Dealer D1 with certification C_A activated 2025-06-01 and certification C_B activated 2026-07-01 on two different vehicles."
            - "One SUBMITTED warranty claim on C_A for 100000 cents with repair_date 2025-06-15, inside C_A's coverage window [2025-06-01, 2026-06-01)."
            - "The clock stands at 2026-07-01T00:00:00Z when the claim is adjudicated."
          setup_api_calls:
            - call: "PUT /cpo/program-config"
              payload: { claim_ratio_probation_threshold: 0.60, claim_ratio_suspension_threshold: 0.90 }
              as: ProgramAdministrator
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2025-06-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/dealers"
              payload: { name: "Ridge Auto", franchise_code: "FR-2001", region_code: "EAST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Bo Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2025-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000011", model_year: 2021, in_service_date: "2021-01-01", odometer_miles: 50000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_a: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_a}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2025-05-30T09:00:00Z", odometer_at_inspection: 50000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_a: $.data.id }
            - call: "PUT /cpo/inspections/${i_a}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i_a}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v_a}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_a_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v_a}", inspection_id: "${i_a}", expected_vehicle_version: "${v_a_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-A" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-A" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-A" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_a: $.data.id }
            - call: "POST /cpo/certifications/${c_a}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2025-06-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/warranty-claims"
              payload: { certification_id: "${c_a}", component_category: "POWERTRAIN", repair_date: "2025-06-15", repair_odometer_miles: 52000, claimed_amount_cents: 100000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { cl_1: $.data.id }
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000012", model_year: 2021, in_service_date: "2021-06-01", odometer_miles: 40000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_b: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_b}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-06-25T09:00:00Z", odometer_at_inspection: 40000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_b: $.data.id }
            - call: "PUT /cpo/inspections/${i_b}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i_b}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v_b}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_b_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v_b}", inspection_id: "${i_b}", expected_vehicle_version: "${v_b_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-B" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-B" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-B" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_b: $.data.id }
            - call: "POST /cpo/certifications/${c_b}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /cpo/warranty-claims/${cl_1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
          assert:
            - "WarrantyClaim.${cl_1}.status == APPROVED"
            - "WarrantyClaim.${cl_1}.dealer_ratio_snapshot_before == 0.00"
            - "WarrantyClaim.${cl_1}.approved_amount_cents == 100000"
            - "Dealer.${d1}.claim_ratio_variant == LIFETIME_CUMULATIVE"
            - "Dealer.${d1}.lifetime_activated_count == 2"
            - "Dealer.${d1}.approved_claim_count_lifetime == 1"
            - "Dealer.${d1}.claim_ratio_effective == 0.50"
            - "Dealer.${d1}.risk_score == 30"
            - "Dealer.${d1}.privilege_status == ACTIVE"

      - name: dealer_claim_ratio_trailing_window_variant
        grounds:
          - calculations.dealer_claim_ratio
          - calculations.dealer_claim_ratio.variants.trailing_window
          - entities.Dealer.fields.window_activated_count
          - entities.Dealer.fields.approved_claim_count_window
          - entities.ProgramConfig.fields.claim_window_days
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Identical dealer, identical two activations and identical single approved claim as
          dealer_claim_ratio_lifetime_cumulative_variant, but claim_variant_volume_floor is lowered to
          1 and the clock advanced to 2026-08-01, so the trailing 365-day window keeps only the
          2026-07-01 activation and drops the 2025-06-15 repair: the ratio is 0/1 == 0.00 instead of
          1/2 == 0.50 over the very same rows, while the lifetime counters still read 1 and 2.
        test_recipe:
          setup:
            - "claim_ratio_probation_threshold 0.60, claim_ratio_suspension_threshold 0.90 and claim_variant_volume_floor 1."
            - "Dealer D1 with certification C_A activated 2025-06-01 and certification C_B activated 2026-07-01."
            - "One SUBMITTED claim on C_A for 100000 cents with repair_date 2025-06-15."
            - "The clock stands at 2026-08-01T00:00:00Z when the claim is adjudicated, so the window is [2025-08-01, 2026-08-01]."
          setup_api_calls:
            - call: "PUT /cpo/program-config"
              payload: { claim_ratio_probation_threshold: 0.60, claim_ratio_suspension_threshold: 0.90, claim_variant_volume_floor: 1 }
              as: ProgramAdministrator
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2025-06-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/dealers"
              payload: { name: "Ridge Auto", franchise_code: "FR-2002", region_code: "EAST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Bo Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2025-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000021", model_year: 2021, in_service_date: "2021-01-01", odometer_miles: 50000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_a: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_a}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2025-05-30T09:00:00Z", odometer_at_inspection: 50000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_a: $.data.id }
            - call: "PUT /cpo/inspections/${i_a}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i_a}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v_a}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_a_ver: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v_a}", inspection_id: "${i_a}", expected_vehicle_version: "${v_a_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-A" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-A" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-A" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_a: $.data.id }
            - call: "POST /cpo/certifications/${c_a}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2025-06-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /cpo/warranty-claims"
              payload: { certification_id: "${c_a}", component_category: "POWERTRAIN", repair_date: "2025-06-15", repair_odometer_miles: 52000, claimed_amount_cents: 100000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { cl_1: $.data.id }
            - call: "POST /cpo/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
