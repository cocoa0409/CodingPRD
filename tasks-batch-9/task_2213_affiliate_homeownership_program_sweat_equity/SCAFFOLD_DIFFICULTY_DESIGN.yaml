  - rule_id: non_linear_state_machine
    instances:

      - name: household_parallel_dimensions_readiness_regresses_alone
        shape: "parallel — ApplicantHousehold carries selection_status and partnership_readiness as independent dimensions"
        grounds:
          - state_machines.ApplicantHousehold.selection_status.SELECTED_to_PARTNERSHIP_ACTIVE
          - state_machines.ApplicantHousehold.partnership_readiness.EDUCATION_COMPLETE_to_CLOSING_READY
          - state_machines.ApplicantHousehold.partnership_readiness.CLOSING_READY_to_EDUCATION_COMPLETE
          - state_machines.SweatEquityEntry.status.CREDITED_to_REVERSED
        distinguishing_aspect: |
          The two dimensions are not a single combined state: crediting 12.00
          hours pushes selection_status SELECTED -> PARTNERSHIP_ACTIVE and
          readiness EDUCATION_COMPLETE -> CLOSING_READY in one request, but the
          reversal moves ONLY readiness back to EDUCATION_COMPLETE —
          selection_status stays PARTNERSHIP_ACTIVE and never returns to
          SELECTED. An implementation with one fused state machine either
          regresses both or refuses the reversal.
