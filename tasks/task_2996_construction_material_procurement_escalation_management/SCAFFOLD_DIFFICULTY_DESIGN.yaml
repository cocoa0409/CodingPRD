- rule_id: compensating_invariant
  instances:
  - name: cancel_returns_the_escalation_contingency_ledger_to_zero
    grounds:
    - state_machines.PurchaseCommitment.COMMITTED_to_CANCELLED
    - calculations.buyout_variance
    - entities.Project.fields.escalation_contingency_committed
    - entities.PurchaseCommitment.fields.escalation_accrued
    distinguishing_aspect: 'INVARIANT contingency_conservation — Project.escalation_contingency_committed == the sum of escalation_accrued over commitments whose commitment_status is COMMITTED or CLOSED: after a release accrues 32941.98 and the PO is cancelled, the ledger returns to exactly 0.00 and escalation_contingency_remaining to exactly 500000.00, with no cent of drift.'
    test_recipe:
      setup:
      - Project with escalation_contingency_budget 500000.00
      - Clause EXECUTED with baseline_index_value 310.00, deadband 2.0, cap 8.0, share 40.0
      - Commitment COMMITTED at committed_base_cost 1150000.00
      - Clock advanced to 2026-09-10 and the commitment RELEASED_FOR_FAB, accruing a provisional 32941.98 against the 2026-09 reading of 331.00
      - The quote's expires_at is 2026-09-15, still ahead of the clock
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '310.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-08, value: '322.00', published_at: '2026-08-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-09, value: '331.00', published_at: '2026-09-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-12, value: '344.50', published_at: '2026-12-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements
        payload: {quote_id: '${q_id}', index_code: PPI_STEEL_MILL, baseline_index_period: 2026-07, cap_pct: '8.0', contractor_share_pct: '40.0', price_hold_through: '2026-09-15T00:00:00.000Z', deadband_pct: '2.0', proposed_terms_note: Mill index escalation with 2 pct deadband and shared band}
        as: BuyoutManager
        captures: {ea_id: $.data.id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/execute
        payload: {}
        as: ProjectExecutive
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv}', escalation_agreement_id: '${ea_id}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_id: $.data.id}
      - call: POST /procurement/purchase-commitments/${pc_id}/commit
        payload: {}
        as: ProjectExecutive
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-10T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: RELEASED_FOR_FAB}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/purchase-commitments/${pc_id}/cancel
        payload: {cancellation_reason: Owner deferred the steel package to a later phase}
        as: ProjectExecutive
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - PurchaseCommitment.${pc_id}.commitment_status == CANCELLED
      - PurchaseCommitment.${pc_id}.escalation_accrued == 0.00
      - PurchaseCommitment.${pc_id}.escalation_variant == NONE
      - PurchaseCommitment.${pc_id}.escalation_index_period is null
      - PurchaseCommitment.${pc_id}.released_for_fab_at is null
      - PurchaseCommitment.${pc_id}.delivery_posture == SCHEDULED
      - Project.${proj_id}.escalation_contingency_committed == 0.00
      - Project.${proj_id}.escalation_contingency_remaining == 500000.00
      - Project.${proj_id}.committed_total_cost == 0.00
      - Project.${proj_id}.buyout_variance == 1200000.00 and bought_out_variance == 0.00
      - Quote.${q_id}.status == OPEN
      - MaterialPackage.${pkg_id}.status == SOURCING and open_quote_count == 1
  - name: rescind_restores_package_schedule_days_and_estimate_exactly
    grounds:
    - state_machines.SubstitutionRequest.APPROVED_to_RESCINDED
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.baseline_fabrication_duration_days
    - entities.MaterialPackage.fields.baseline_estimated_cost
    distinguishing_aspect: 'INVARIANT schedule_days_conservation — MaterialPackage.fabrication_duration_days == baseline_fabrication_duration_days + the sum of applied_schedule_delta_days over APPROVED/APPROVED_AS_NOTED requests: after approving +12 days / +45000.00 and then rescinding, the package returns to fab 70, estimated_cost 1200000.00 and release date 2026-11-10 exactly, not merely approximately.'
    test_recipe:
      setup:
      - Clock at its 2026-08-01T00:00:00Z startup default
      - Steel package with baseline_fabrication_duration_days 70 and baseline_estimated_cost 1200000.00, release_for_fabrication_date 2026-11-10 and float_days 101
      - Substitute supplier 'Northline Steel Mills' (US, declared 0.00)
      - A substitution request with cost_delta 45000.00 and schedule_delta_days 12 already APPROVED, so the package now reads fab 82, estimated_cost 1245000.00, release date 2026-10-29 and float 89
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Northline Steel Mills, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup2_id: $.data.id}
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg_id}', proposed_supplier_id: '${sup2_id}', driver: VALUE_ENGINEERING, proposed_product: Alternate HSS section from mill B, cost_delta: '45000.00', schedule_delta_days: 12}
        as: BuyoutManager
        captures: {sr_id: $.data.id}
      - call: POST /procurement/substitution-requests/${sr_id}/disposition
        payload: {disposition: APPROVED}
        as: DesignEngineer
      trigger:
      - call: POST /procurement/substitution-requests/${sr_id}/rescind
        payload: {rescission_reason: Design team reverted to the specified section}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - SubstitutionRequest.${sr_id}.status == RESCINDED
      - SubstitutionRequest.${sr_id}.applied_cost_delta == 0.00 and applied_schedule_delta_days == 0
      - SubstitutionRequest.${sr_id}.cost_delta == 45000.00 and schedule_delta_days == 12 (the proposal itself is retained)
      - MaterialPackage.${pkg_id}.fabrication_duration_days == 70 and baseline_fabrication_duration_days == 70
      - MaterialPackage.${pkg_id}.estimated_cost == 1200000.00 and baseline_estimated_cost == 1200000.00
      - MaterialPackage.${pkg_id}.lead_time_days == 111
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z"
      - MaterialPackage.${pkg_id}.float_days == 101 and rff_risk_band == ON_TRACK
      - Project.${proj_id}.estimated_total_cost == 1200000.00
