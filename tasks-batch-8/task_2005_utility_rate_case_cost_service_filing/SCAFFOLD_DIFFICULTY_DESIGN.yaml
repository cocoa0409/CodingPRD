      - name: data_request_objection_overrule_overdue_cycle
        grounds:
          - state_machines.DataRequest.ISSUED_to_OBJECTED
          - state_machines.DataRequest.OBJECTED_to_RESPOND_REQUIRED
          - state_machines.DataRequest.RESPOND_REQUIRED_to_OVERDUE
          - state_machines.DataRequest.OVERDUE_to_RESPONDED
          - calculations.discovery_overdue_sweep
        distinguishing_aspect: |
          Entity = DataRequest (different from RateCase and
          SettlementProposal). Branching with a clock-driven re-entry:
          ISSUED -> OBJECTED -> RESPOND_REQUIRED -> OVERDUE -> RESPONDED
          visits OVERDUE via the extended 5-day clock (set only by an
          OVERRULED ruling), a path unreachable from the plain 10-day window;
          the case-level overdue counter rises and falls across the sweep.
