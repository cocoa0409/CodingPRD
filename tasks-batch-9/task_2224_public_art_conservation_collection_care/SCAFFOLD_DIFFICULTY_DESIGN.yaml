              as_user_id: "chief-1"
              captures: { prop_b: $.data.id }
            - call: "POST /public-art/treatment-proposals/${prop_b}/line-items"
              payload: { labor_hours: 4.0, complexity_class: "SURFACE", materials_cents: 5000, description: "wash and wax" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/treatment-proposals/${prop_b}/submit"
              payload: { submitter_note: "work B for approval" }
              as: ChiefConservator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /public-art/treatment-proposals/${prop_b}/approve"
              payload: { approval_note: "work B proceeds right after work A" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          assert:
            - "response status is 409 and error_id == ERR_CONSERVATOR_WINDOW_CONFLICT"
            - "TreatmentProposal.${prop_b}.status == SUBMITTED and estimate_total_cents == 130942"
            - "TreatmentProposal.${prop_a}.status == APPROVED and pinned_estimate_total_cents == 683269"
            - "Conservator.${cons_id}.active_engagement_count == 1"
            - "GET /public-art/funding-allocations?proposal_id=${prop_b} returns an empty list, so the buffer check ran before the funding check"

      - name: site_work_window_closed_interval_touching_endpoints_collide
        grounds:
          - validations[priority=29]
          - errors[ERR_SITE_WORK_CAPACITY_CONFLICT]
          - entities.Site.fields.concurrent_work_capacity
          - endpoints["POST /public-art/maintenance-visits"]
        distinguishing_aspect: |
          A different resource entity (Site) with the opposite interval semantics: site work windows are
          CLOSED intervals [window_start, window_end], so a window that starts exactly when another ends
          (2026-08-12T17:00:00Z) collides, while the conservator rule of the first instance treats its
          intervals as half-open with a 48-hour pad. A window starting 2026-08-13T08:00:00Z is accepted.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one site with concurrent_work_capacity 1 holding two BRONZE works of footprint 6 each"
            - "a WASH protocol for BRONZE and one SCHEDULED MaintenanceVisit on work A in window 2026-08-10T08:00:00Z..2026-08-12T17:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { work_a: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.002", title: "Seated Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "STANDARD", footprint_units: 6, insured_value_cents: 8000000, acquisition_date: "2016-05-01", acquisition_document_ref: "DEED-2016-002", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { work_b: $.data.id }
            - call: "POST /public-art/maintenance-protocols"
              payload: { protocol_code: "WASH-BR", material_class: "BRONZE", method: "WASH", cycle_days: 180, requires_conservator: false }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { protocol_id: $.data.id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${work_a}", protocol_id: "${protocol_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_a: $.data.id }
          trigger:
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${work_b}", protocol_id: "${protocol_id}", window_start: "2026-08-12T17:00:00Z", window_end: "2026-08-14T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${work_b}", protocol_id: "${protocol_id}", window_start: "2026-08-13T08:00:00Z", window_end: "2026-08-14T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_b: $.data.id }
          assert:
            - "the first trigger call returns 409 with error_id == ERR_SITE_WORK_CAPACITY_CONFLICT because the touching endpoint 2026-08-12T17:00:00Z is inside the closed interval"
            - "the second trigger call returns 201 and MaintenanceVisit.${visit_b}.status == SCHEDULED"
            - "MaintenanceVisit.${visit_a}.status == SCHEDULED and abort_reason == NONE"
            - "GET /public-art/maintenance-visits?protocol_id=${protocol_id} returns exactly two rows"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_release_restores_pool_available_cents
        grounds:
          - state_machines.FundingAllocation.RESERVED_to_RELEASED
          - calculations.pool_draw_available_cents
          - endpoints["POST /public-art/funding-allocations/{id}/release"]
          - entities.FundingPool.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity FundingPool.available_cents: the reservation of 683269 drops it from
          20527500 to 19844231 and the compensating release must return it to exactly 20527500, with
          release_reason MANUAL_RELEASE. No double credit and no residual encumbrance: a run of
          reserve/release pairs can never drift the pool balance.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one BRONZE artwork, a WASH protocol and a SCHEDULED MaintenanceVisit to carry the allocation link"
            - "an ENDOWMENT pool with principal 400000000 at 450 bps, available_cents 20527500 and no allocations"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/maintenance-protocols"
              payload: { protocol_code: "WASH-BR", material_class: "BRONZE", method: "WASH", cycle_days: 180, requires_conservator: false }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { protocol_id: $.data.id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${protocol_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_id: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-2026", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 450 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pool_id: $.data.id, pool_v: $.data.version }
          trigger:
            - call: "POST /public-art/funding-allocations"
              payload: { pool_id: "${pool_id}", purpose: "MAINTENANCE", amount_cents: 683269, expected_pool_version: "${pool_v}", visit_id: "${visit_id}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /public-art/funding-allocations/${alloc_id}/release"
              payload: { release_note: "scope cancelled by the crew" }
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "after the first trigger call FundingPool.${pool_id}.available_cents == 19844231"
            - "after the second trigger call FundingPool.${pool_id}.available_cents == 20527500"
            - "FundingAllocation.${alloc_id}.status == RELEASED and release_reason == MANUAL_RELEASE"
            - "FundingPool.${pool_id}.draw_authorized_cents == 20527500 and admin_fee_cents == 472500 throughout"
            - "MaintenanceVisit.${visit_id}.status == SCHEDULED, unaffected by the release"

      - name: relocate_out_and_back_restores_site_installed_units
        grounds:
          - state_machines.Artwork.ON_VIEW_to_IN_STORAGE
          - state_machines.Artwork.IN_STORAGE_to_ON_VIEW
          - entities.Site.fields.installed_units_used
          - validations[priority=30]
        distinguishing_aspect: |
          A different conserved quantity, Site.installed_units_used: sending the work to storage frees
          its 6 footprint units and reinstalling it at the same site must consume exactly 6 again,
          returning the counter to its original value with no drift and without disturbing the parallel
          conservation_status dimension.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "artist with moral_rights_waiver_on_file true, so relocation needs no MoralRightsNotice"
            - "one site with capacity_units 20 holding one BRONZE artwork of footprint 6, custody ON_VIEW, Site.installed_units_used == 6"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov", moral_rights_waiver_on_file: true }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
          trigger:
            - call: "POST /public-art/artworks/${artwork_id}/relocate"
              payload: { to_storage: true, relocation_note: "de-installed for plaza repaving" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
            - call: "POST /public-art/artworks/${artwork_id}/relocate"
              payload: { to_site_id: "${site_id}", relocation_note: "reinstalled after repaving" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
          assert:
            - "before the trigger Site.${site_id}.installed_units_used == 6"
            - "after the first trigger call Artwork.${artwork_id}.custody_status == IN_STORAGE and Site.${site_id}.installed_units_used == 0"
            - "after the second trigger call Artwork.${artwork_id}.custody_status == ON_VIEW and Site.${site_id}.installed_units_used == 6"
            - "Artwork.${artwork_id}.site_id == ${site_id} and conservation_status == MONITORED throughout"
            - "Site.${site_id}.installed_units_used never exceeds capacity_units 20 at any point"
