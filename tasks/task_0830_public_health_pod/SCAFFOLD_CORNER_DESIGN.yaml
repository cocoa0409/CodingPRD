scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: hazard_plan_creation_returns_all_declared_fields
        claim_type: creation
        grounds: [entities.HazardPlan]
        distinguishing_aspect: "POST /hazard-plans with all required fields returns 201 with every declared field present, status defaulted to DRAFT and readiness_score defaulted to 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /hazard-plans"
              payload: { hazard_type: NATURAL_DISASTER, title: "Corner Creation Plan", jurisdiction_code: "CTY20", target_population: 4200 }
              as: PublicHealthAdmin
              captures: { status: $.data.status, readiness_score: $.data.readiness_score, activated_at: $.data.activated_at, hazard_type: $.data.hazard_type }
          assert:
            - "status == 'DRAFT'"
            - "readiness_score == 0"
            - "activated_at == null"
            - "hazard_type == 'NATURAL_DISASTER'"

      - name: staff_member_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.StaffMember]
        distinguishing_aspect: "POST /staff-members omitting the required credential_expires_at field is rejected with ERR_VALIDATION, not silently defaulted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /staff-members"
              payload: { full_name: "Incomplete Staff", email: "incomplete@example.org", primary_role: GREETER, mrc_unit: "UnitN", credential_type: PODS_TRAINING }
              as: PublicHealthAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION'  (credential_expires_at is a required input field with no default)"

      - name: inventory_lot_pod_id_null_means_central_cache
        claim_type: defaults
        grounds: [entities.InventoryLot.pod_id]
        distinguishing_aspect: "Omitting pod_id on POST /inventory-lots creates a central SNS-cache lot (pod_id == null), distinct from a POD-scoped lot."
        test_recipe:
          setup: ["Countermeasure exists"]
          setup_api_calls:
            - call: "POST /countermeasures"
              payload: { name: "Central Cache Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 500, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-CACHE1", on_hand_quantity: 1000, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { pod_id_field: $.data.pod_id, available: $.data.available_quantity }
          assert:
            - "pod_id_field == null"
            - "available == 1000  (available_quantity == on_hand_quantity when reserved_quantity is 0)"

      - name: pod_listing_pagination_total_count_has_more
        claim_type: listing
        grounds: [entities.POD, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /pods with limit=2 on a plan with 3 PODs returns exactly 2 items, total_count=3, has_more=true."
        test_recipe:
          setup: ["HazardPlan ACTIVATED with 3 PODs created under it"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Pagination Plan", jurisdiction_code: "CTY21", target_population: 6000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Page POD 1", site_type: FIXED_POD, address: "1 Page St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Page POD 2", site_type: FIXED_POD, address: "2 Page St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Page POD 3", site_type: FIXED_POD, address: "3 Page St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
          trigger:
            - call: "GET /pods"
              payload: { hazard_plan_id: "${hp_id}", limit: 2, offset: 0 }
              as: PublicHealthAdmin
              captures: { total_count: $.meta.total_count, has_more: $.meta.has_more }
          assert:
            - "total_count == 3"
            - "has_more == true"

      - name: pod_closed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.POD]
        distinguishing_aspect: "Once POD.operational_status reaches the terminal CLOSED state, no further transition (open/restrict/resume/close) is possible."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD STAGING -> OPERATIONAL -> CLOSED"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Lockdown Plan", jurisdiction_code: "CTY22", target_population: 3200 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Lockdown POD", site_type: FIXED_POD, address: "22 Lockdown Ave", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods/${pod_id}/close"
              payload: {}
              as: PublicHealthAdmin
          trigger:
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { reopen_error: $.data.error_id }
          assert:
            - "reopen_error == 'ERR_INVALID_STATE'  (CLOSED is terminal; no transition list includes CLOSED as a from state)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: allocation_request_deny_from_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AllocationRequest.REQUESTED_to_DENIED]
        distinguishing_aspect: "Denying an already-RESERVED AllocationRequest (deny is only valid from REQUESTED) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AllocationRequest reserved (status=RESERVED)"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Deny Wrong State Plan", jurisdiction_code: "CTY23", target_population: 2800 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Deny POD", site_type: FIXED_POD, address: "23 Deny St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Deny Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 400, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-I1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_v: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 10, expected_pod_version: "${pod_v}" }
              as: LogisticsCoordinator
              captures: { ar_id: $.data.id }
            - call: "POST /allocation-requests/${ar_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v}" }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /allocation-requests/${ar_id}/deny"
              payload: {}
              as: LogisticsCoordinator
              captures: { deny_error: $.data.error_id }
          assert:
            - "deny_error == 'ERR_INVALID_STATE'  (deny is only declared from REQUESTED, not RESERVED)"

      - name: dispensing_event_terminal_dispensed_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DispensingEvent]
        distinguishing_aspect: "Once DispensingEvent.status reaches the terminal DISPENSED state, no further transition (screen/defer/rescreen/refuse/dispense) is possible."
        test_recipe:
          setup: ["DispensingEvent fully progressed to DISPENSED"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Dispensed Lockdown Plan", jurisdiction_code: "CTY24", target_population: 2600 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Dispensed Lockdown POD", site_type: FIXED_POD, address: "24 Lockdown Ave", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Lockdown Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 400, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-J1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Lockdown Staffer", email: "lockdownstaffer@example.org", primary_role: VACCINATOR, mrc_unit: "UnitO", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Terminal", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de_id: $.data.id }
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events/${de_id}/dispense"
              payload: { dispensed_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
          trigger:
            - call: "POST /dispensing-events/${de_id}/refuse"
              payload: {}
              as: ClinicalLead
              captures: { refuse_error: $.data.error_id }
          assert:
            - "refuse_error == 'ERR_INVALID_STATE'  (DISPENSED is terminal; refuse is only declared from SCREENED)"

      - name: drill_close_corrective_action_before_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Drill]
        distinguishing_aspect: "close_corrective_action requires Drill.status == COMPLETED and corrective_action_status == OPEN; attempting it while the drill is still SCHEDULED (corrective_action_status still NONE) is rejected."
        test_recipe:
          setup: ["Drill SCHEDULED, never completed"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Corrective Action Plan", jurisdiction_code: "CTY25", target_population: 1900 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /drills"
              payload: { hazard_plan_id: "${hp_id}", drill_type: TABLETOP, scheduled_at: "2026-04-01T09:00:00Z" }
              as: PublicHealthAdmin
              captures: { drill_id: $.data.id }
          trigger:
            - call: "POST /drills/${drill_id}/close_corrective_action"
              payload: {}
              as: PublicHealthAdmin
              captures: { close_error: $.data.error_id }
          assert:
            - "close_error == 'ERR_INVALID_STATE'  (Drill.status is SCHEDULED, not COMPLETED, and corrective_action_status is NONE, not OPEN)"

      - name: staff_member_pending_directly_to_revoked
        claim_type: valid_transition
        grounds: [state_machines.StaffMember.PENDING_to_REVOKED]
        distinguishing_aspect: "A StaffMember whose credential was never verified (still PENDING) can be revoked directly, without passing through VERIFIED."
        test_recipe:
          setup: ["StaffMember created, credential_status=PENDING, never verified"]
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Never Verified Staff", email: "neververified@example.org", primary_role: RUNNER, mrc_unit: "UnitP", credential_type: BACKGROUND_CHECK, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
          trigger:
            - call: "POST /staff-members/${staff_id}/revoke-credential"
              payload: {}
              as: PublicHealthAdmin
              captures: { status_after_revoke: $.data.credential_status }
          assert:
            - "status_after_revoke == 'REVOKED'  (PENDING -> REVOKED is a declared direct transition, no VERIFIED step required)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: allocation_priority_score_tie_break_by_created_at
        claim_type: aggregate_selection_precision
        grounds: [calculations.allocation_priority_score]
        distinguishing_aspect: "Two AllocationRequests with identical requested_quantity and POD.risk_tier produce equal priority_score; when listed, ties are broken by created_at ascending, never by id."
        test_recipe:
          setup: ["Two AllocationRequests for the same POD/countermeasure, requested_quantity=100 each, both reserved while risk_tier=STANDARD (equal priority_score), created in order A then B"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Tie Break Plan", jurisdiction_code: "CTY26", target_population: 3300 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Tie Break POD", site_type: FIXED_POD, address: "26 Tie St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v1: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Tie Break Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-K1", on_hand_quantity: 1000, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_v1: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 100, expected_pod_version: "${pod_v1}" }
              as: LogisticsCoordinator
              captures: { ar_a_id: $.data.id }
            - call: "POST /allocation-requests/${ar_a_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v1}" }
              as: LogisticsCoordinator
              captures: { lot_v2: $.data.id }
            - call: "GET /inventory-lots/${cm_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { lot_v2_ignore: $.data.id }
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v2: $.data.version }
          trigger:
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 100, expected_pod_version: "${pod_v2}" }
              as: LogisticsCoordinator
              captures: { ar_b_id: $.data.id }
            - call: "GET /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}" }
              as: PublicHealthAdmin
              captures: { first_listed_id: "$.data[0].id" }
          assert:
            - "first_listed_id == ar_a_id  (ar_a was created strictly before ar_b; when priority_score ties, created_at ascending orders ar_a first, never a random/id-based order)"

      - name: mutual_aid_reimbursement_cost_rounding_per_line_then_sum
        claim_type: correct_result
        grounds: [calculations.mutual_aid_reimbursement_cost, entities.SituationReport.total_mutual_aid_reimbursement_usd]
        distinguishing_aspect: "cost_per_dose_cents = 1000/3 = 333.333...; two separate MUTUAL_AID fulfillments of 1 dose each round to 3.33 apiece, summing to 6.66 — NOT 6.67, which is what summing the raw unrounded products first and rounding once would give."
        test_recipe:
          setup:
            - "Two PODs (requesting + partner) under an activated plan"
            - "Countermeasure unit_cost_cents=1000, doses_required=3 (cost_per_dose_cents = 333.333...)"
            - "Partner POD-scoped InventoryLot on_hand_quantity=10"
            - "Two MUTUAL_AID AllocationRequests, each requested_quantity=1, both reserved and fulfilled"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Reimbursement Plan", jurisdiction_code: "CTY27", target_population: 2100 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Reimb Requesting POD", site_type: FIXED_POD, address: "27 Reimb Rd", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { req_pod_id: $.data.id, req_pod_v: $.data.version }
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Reimb Partner POD", site_type: FIXED_POD, address: "28 Reimb Rd", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { partner_pod_id: $.data.id }
            - call: "POST /countermeasures"
              payload: { name: "Doxycycline PEP", countermeasure_type: ANTIBIOTIC_PEP, doses_required: 3, unit_cost_cents: 1000, reorder_point_quantity: 2 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${partner_pod_id}", lot_number: "LOT-L1", on_hand_quantity: 10, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_v1: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${req_pod_id}", countermeasure_id: "${cm_id}", source_type: MUTUAL_AID, partner_pod_id: "${partner_pod_id}", requested_quantity: 1, expected_pod_version: "${req_pod_v}" }
              as: LogisticsCoordinator
              captures: { ar1_id: $.data.id }
            - call: "POST /allocation-requests/${ar1_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v1}" }
              as: MutualAidPartner
            - call: "POST /allocation-requests/${ar1_id}/fulfill"
              payload: {}
              as: LogisticsCoordinator
              captures: { ar1_reimb: $.data.reimbursement_cost_usd }
            - call: "GET /pods/${req_pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { req_pod_v2: $.data.version }
            - call: "GET /inventory-lots/${cm_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { lot_v2_probe: $.data.id }
          trigger:
            - call: "POST /allocation-requests"
              payload: { pod_id: "${req_pod_id}", countermeasure_id: "${cm_id}", source_type: MUTUAL_AID, partner_pod_id: "${partner_pod_id}", requested_quantity: 1, expected_pod_version: "${req_pod_v2}" }
              as: LogisticsCoordinator
              captures: { ar2_id: $.data.id }
          assert:
            - "ar1_reimb == 3.33  (cost_per_dose_cents=1000/3=333.333...; round((333.333...*1)/100,2)=3.33)"
            - "note: completing ar2's reserve+fulfill the same way yields ar2_reimb == 3.33 as well; SituationReport.total_mutual_aid_reimbursement_usd for this plan would then equal 3.33+3.33=6.66 (sum of already-rounded per-line values), never 6.67 (which is what rounding a raw summed total of 666.666... cents would give)"

      - name: situation_report_staffing_fill_rate_zero_when_no_assignments
        claim_type: boundary_edge
        grounds: [calculations.situation_report_rollup]
        distinguishing_aspect: "When a hazard plan's PODs have zero ShiftAssignment rows, staffing_fill_rate_pct is exactly 0 (not a division-by-zero error), and readiness_status is RED because 0 < RED_THRESHOLD."
        test_recipe:
          setup: ["HazardPlan ACTIVATED with one OPERATIONAL POD and no ShiftAssignment rows at all"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Empty Staffing Plan", jurisdiction_code: "CTY28", target_population: 1200 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Empty Staffing POD", site_type: FIXED_POD, address: "29 Empty Ave", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
          trigger:
            - call: "POST /situation-reports"
              payload: { hazard_plan_id: "${hp_id}", report_period_label: "OPS_PERIOD_1" }
              as: PublicHealthAdmin
              captures: { fill_rate: $.data.staffing_fill_rate_pct, readiness: $.data.readiness_status }
          assert:
            - "fill_rate == 0  (denominator count(ShiftAssignment)==0, formula short-circuits to 0 instead of dividing by zero)"
            - "readiness == 'RED'  (staffing_fill_rate_pct 0 < RED_THRESHOLD 50.0)"

      - name: situation_report_readiness_status_red_when_pod_restricted
        claim_type: correct_result
        grounds: [calculations.situation_report_rollup]
        distinguishing_aspect: "readiness_status is RED whenever pods_restricted_count >= 1, even if staffing_fill_rate_pct alone would otherwise classify as GREEN."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; one POD manually RESTRICTED (pods_restricted_count=1); no ShiftAssignment rows needed since RESTRICTED alone forces RED"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Restricted Readiness Plan", jurisdiction_code: "CTY29", target_population: 1400 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Restricted Readiness POD", site_type: FIXED_POD, address: "30 Restricted Ave", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods/${pod_id}/restrict"
              payload: {}
              as: PublicHealthAdmin
          trigger:
            - call: "POST /situation-reports"
              payload: { hazard_plan_id: "${hp_id}", report_period_label: "OPS_PERIOD_2" }
