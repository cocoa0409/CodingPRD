      - name: corner_calc_forward_looking_projection_reacts_to_release
        claim_type: Includes pending + confirmed; re-evaluated when pending items change
        grounds:
          - calculations.player_pacing_bp
          - entities.Episode.fields.status
          - endpoints["GET /players/{player_id}/pacing"]
