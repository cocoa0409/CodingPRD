      - name: booking_list_filters_compose_and_exclude_cancelled_rows_only_on_request
        claim_type: standard_crud
        grounds:
          - endpoints[GET /festival-ops/bookings]
          - entities.Booking.fields.contract_status
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list endpoint has no implicit "hide cancelled" behaviour: a CANCELLED
          booking is still returned unless contract_status filters it out, and two
          filters compose conjunctively (stage_id plus contract_status). The ordering
          contract is slot_start_utc ASC regardless of which filter is applied.
        test_recipe:
          setup:
            - "Canonical base fixture plus the non-flagship stage Grove and two more acts, Vela Roan (ROCK, draw 72) and Cassia Vale (POP, draw 40)."
