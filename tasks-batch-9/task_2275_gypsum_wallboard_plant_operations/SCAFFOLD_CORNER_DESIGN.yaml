      - name: feed_from_a_lot_whose_assay_aged_past_thirty_days
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ASSAY_EXPIRED]
          - validations[priority 11, ERR_ASSAY_EXPIRED]
        distinguishing_aspect: |
          ASSAY_VALIDITY_DAYS 30 is measured from assayed_at against the logical clock, inclusively: at
          exactly 30 days the feed is accepted, and one second past the 31st day the same feed returns
          ERR_ASSAY_EXPIRED (409) even though the lot is still APPROVED with tonnage to spare.
        test_recipe:
          setup:
            - "Plant GYP-1; a 100.000 t synthetic lot assayed at the default clock 2026-08-01T00:00:00Z."
            - "Batch BF PLANNED with a feed window that never gates the feed."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 40.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bf_id: $.data.id }
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bf_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 10.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: PlantAdmin
            - call: "GET /plant-ops/gypsum-lots/${lot_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_v2: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${bf_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 10.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_v2}" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "the day-30 feed returned 201 and left CalcinerBatch.${bf_id}.status == FEEDING with feed_tons_total == 10.000"
            - "the expired feed returned status 409 with ${err_id} == ERR_ASSAY_EXPIRED"
            - "GypsumLot.${lot_id}.status is still APPROVED with remaining_tons == 90.000"
            - "CalcinerBatch.${bf_id}.feed_tons_total is still 10.000"

      - name: scheduling_while_an_emergency_outage_freezes_the_plant
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLANT_POSTURE_FROZEN]
          - validations[priority 10, ERR_PLANT_POSTURE_FROZEN]
        distinguishing_aspect: |
          A FROZEN posture is a plant-wide stop: with an EMERGENCY outage IN_PROGRESS on the only line, a
          run whose window is days away and whose batch is COMPLETED still cannot be scheduled, and the
          error is the posture code rather than any line, window or balance code.
