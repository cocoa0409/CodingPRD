      - name: recital_last_seat_sold_out_boundary
        grounds:
          - state_machines.Recital.ON_SALE_to_SOLD_OUT
          - entities.Recital.fields.seats_sold
          - entities.Recital.fields.total_seats
        distinguishing_aspect: |
          A recital with total_seats=1: holding the 1st seat makes seats_sold == total_seats and flips status
          to SOLD_OUT (boundary equality on a count metric, distinct endpoint POST /recitals/{id}/seats), where
          a 2nd hold is rejected ERR_RECITAL_SOLD_OUT.
