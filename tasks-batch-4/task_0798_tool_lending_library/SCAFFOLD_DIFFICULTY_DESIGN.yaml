              payload: { return_condition: "GOOD" }
              as: Coordinator
          assert:
            - "Fee.${fee_id}.amount_cents == 0"
            - "Fee.${fee_id}.status == PENDING"

      - name: reserve_empty_candidate_pool_boundary
        grounds:
          - validations[priority=11]
          - errors[ERR_NO_COPY_AVAILABLE]
          - calculations.item_availability
        distinguishing_aspect: |
          Empty-collection boundary on POST /library/reservations: the item's single copy is
          ON_LOAN with no scheduled return, so the free-copy candidate set for the window is
          empty (count 0) and the reservation is rejected with ERR_NO_COPY_AVAILABLE.
        test_recipe:
          setup:
            - "Two ACTIVE members; item with exactly one copy; clock 2026-03-01; member1 has the copy ON_LOAN (walk-up checkout)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Mo", email: "mo@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Ned", email: "ned@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Kettle", category: "KITCHEN", replacement_value_cents: 3000, loan_period_days: 14, daily_late_fee_cents: 50 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "KT-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
