              payload: {}
              as: Applicant
              as_user_id: "${app_a}"
              captures: { cross_agr_err: $.data.error_id }
            - call: "GET /casting/applicants/${app_a}"
              payload: {}
              as: Applicant
              as_user_id: "${app_a}"
              captures: { own_app_name: $.data.legal_name }
            - call: "GET /casting/participant-agreements/${agr_a}"
              payload: {}
              as: Applicant
              as_user_id: "${app_a}"
              captures: { own_agr_status: $.data.status }
            - call: "GET /casting/applicants/${app_b}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { staff_read_name: $.data.legal_name }
          assert:
            - "${cross_app_err} == ERR_NOT_RESOURCE_OWNER"
            - "${cross_agr_err} == ERR_NOT_RESOURCE_OWNER"
            - "HTTP 403 (not 404) on both cross-participant reads"
            - "${own_app_name} == Ada Reyes"
            - "${own_agr_status} == DRAFTED"
            - "${staff_read_name} == Bo Lindqvist"

      - name: four_eyes_screening_same_officer_cannot_record_both_checks
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_19
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.ComplianceOfficer.description
          - endpoints.POST_/casting/applicants/{id}/screening-items
        distinguishing_aspect: |
          Segregation claim inside one role: co_1 is fully authorised for screening items
          (it recorded the BACKGROUND_CHECK), yet recording the PSYCH_EVAL for the SAME
          applicant answers ERR_SEGREGATION_OF_DUTIES at 403. The rule is symmetric — on a
          second applicant co_1 may take the PSYCH_EVAL and is then locked out of the
          BACKGROUND_CHECK instead — and it is scoped per applicant, since co_1 recording
          both kinds across two different applicants is fine.
        test_recipe:
          setup:
            - "One production and one published call with two adult applicants."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S2", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 2, episode_order: 9, photography_start_utc: "2026-10-15T00:00:00Z", photography_end_utc: "2027-01-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 0 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_a: $.data.id }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Bo Lindqvist", date_of_birth: "1990-01-10", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_b: $.data.id }
            - call: "POST /casting/applicants/${app_a}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { a_bgc_by: $.data.recorded_by_user_id }
            - call: "POST /casting/applicants/${app_b}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { b_psych_by: $.data.recorded_by_user_id }
          trigger:
            - call: "POST /casting/applicants/${app_a}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { same_officer_err: $.data.error_id }
            - call: "POST /casting/applicants/${app_b}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { reverse_err: $.data.error_id }
            - call: "POST /casting/applicants/${app_a}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { a_psych_by: $.data.recorded_by_user_id, a_psych_outcome: $.data.outcome }
            - call: "POST /casting/applicants/${app_b}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { b_bgc_by: $.data.recorded_by_user_id }
          assert:
            - "${a_bgc_by} == co_1"
            - "${b_psych_by} == co_1"
            - "${same_officer_err} == ERR_SEGREGATION_OF_DUTIES"
            - "${reverse_err} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP 403 on both same-officer attempts"
            - "${a_psych_by} == co_2"
            - "${a_psych_outcome} == PASS"
            - "${b_bgc_by} == co_2"

      - name: four_eyes_execution_reviser_cannot_execute_the_agreement
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_20
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.ParticipantAgreement.fields.last_production_proposer_user_id
          - state_machines.ParticipantAgreement.COUNTERED_to_REVISED
        distinguishing_aspect: |
          Segregation claim anchored on the LATEST production proposer rather than on the
          drafter. Before any revision last_production_proposer_user_id is null, so the
          drafting officer could legally execute; once ba_9 revises the countered terms, ba_9
          is locked out with ERR_SEGREGATION_OF_DUTIES at 403 while ba_1 — who drafted and
          sent the agreement — remains eligible. A build that compared X-User-ID against the
          creating user, or that never refreshed the field on revise, gets the opposite
          answer on both attempts.
        test_recipe:
          setup:
            - "One production; one CLEARED adult applicant; one agreement drafted and sent by ba_1, countered by the applicant, then revised by ba_9 and re-sent."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id, proposer_at_draft: $.data.last_production_proposer_user_id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_ver: $.data.version }
            - call: "POST /casting/participant-agreements/${agr_id}/counter-offer"
              payload: { requested_base_stipend_cents: 150000, requested_exclusivity_window_days: 0, requested_depiction_rights_scope: "FULL", expected_agreement_version: "${agr_ver}" }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { countered_status: $.data.status }
            - call: "POST /casting/participant-agreements/${agr_id}/revise"
              payload: { base_stipend_cents: 150000, exclusivity_window_days: 0, depiction_rights_scope: "FULL", episodes_committed: 2 }
              as: BusinessAffairs
              as_user_id: "ba_9"
              captures: { revised_status: $.data.status, proposer_after_revise: $.data.last_production_proposer_user_id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { resent_status: $.data.status }
          trigger:
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_9"
              captures: { reviser_err: $.data.error_id }
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { exec_status: $.data.status, exec_by: $.data.executed_by_user_id, exec_total: $.data.total_stipend_commitment_cents }
          assert:
            - "${proposer_at_draft} == null"
            - "${countered_status} == COUNTERED"
            - "${revised_status} == REVISED"
