      - name: bond_requirement_on_empty_basis_set_then_min_bond_clamp
        grounds:
          - calculations.licensee_bond_requirement
          - entities.Licensee.fields.avg_monthly_tax_liability_cents
          - entities.Licensee.fields.required_bond_cents
          - entities.MonthlyReturn.fields.tax_due_cents
        distinguishing_aspect: |
          Metric is the aggregate over an EMPTY input set and the endpoint is
          GET /mft/licensees/{id}/bond-status (a third distinct metric and endpoint): with zero FILED
          returns basis_return_count is 0 and the assumed 500000 liability yields required_bond_cents
          1500000, while after one FILED return whose tax_due_cents is 0 the average collapses to 0 and
          the MIN_BOND_CENTS clamp - not the raw 0 - yields required_bond_cents 200000.
        test_recipe:
          setup:
            - "One SUPPLIER created and left in PENDING_BOND with no bonds and no returns."
