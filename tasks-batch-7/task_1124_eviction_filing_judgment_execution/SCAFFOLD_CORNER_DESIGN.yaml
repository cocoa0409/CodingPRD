      - d1 == 0 and st1 == STORED (now == deadline is NOT past it)
      - d2 == 1 and st2 == DISPOSABLE
  - name: unit_occupancy_derived_and_blocks_second_tenancy
    claim_type: derived_field_reconciliation
    grounds:
    - entities.RentalUnit.fields.status
    - validations[priority=14]
    - state_machines.RentalUnit.VACANT_to_OCCUPIED
    distinguishing_aspect: "Creating a tenancy flips the unit to OCCUPIED; a second tenancy on the same unit then fails ERR_UNIT_OCCUPIED \u2014 the derived status gates the next write."
    test_recipe:
      setup:
      - one landlord, one VACANT unit
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      trigger:
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T1
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t1: $.data.id
      - call: GET /api/units/${u}
        payload: {}
        as: CourtClerk
        captures:
          st: $.data.status
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T2
          monthly_rent_cents: 150000
          lease_start_date: '2026-02-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          err: $.data.error_id
      assert:
      - st == OCCUPIED after the first tenancy
      - err == ERR_UNIT_OCCUPIED
- section: consistency_model
  instances:
  - name: immediate_read_after_write
    claim_type: immediate
    grounds:
    - complexity_profile
    distinguishing_aspect: 'Writes are immediately visible: the case returned by POST and a subsequent GET agree on status DRAFT, tenancy_id, and case_number in the same logical instant.'
    test_recipe:
      setup:
      - one landlord with unit/tenancy
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      trigger:
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: NONPAYMENT
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cn: $.data.case_number
      - call: GET /api/cases/${c}
        payload: {}
        as: CourtClerk
        captures:
          st: $.data.status
          t2: $.data.tenancy_id
          cn2: $.data.case_number
      assert:
      - st == DRAFT and t2 == ${t} and cn2 == cn (no read-your-write lag)
