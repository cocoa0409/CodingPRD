            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_f1_id}", kit_lot_code: "LOT-2026-C", courier_tracking_code: "TRK-0003" }
              as: IntakeCoordinator
              captures: { kit_f1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/maternal-screenings"
              payload: { enrollment_id: "${enr_f5_id}", collected_at: "2026-08-10T05:00:00Z", hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/maternal-screenings"
              payload: { enrollment_id: "${enr_f1_id}", collected_at: "2026-08-10T05:00:00Z", hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_f5_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              captures: { col_f5_id: "$.data.id" }
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_f1_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "CESAREAN" }
              as: CollectionSite
