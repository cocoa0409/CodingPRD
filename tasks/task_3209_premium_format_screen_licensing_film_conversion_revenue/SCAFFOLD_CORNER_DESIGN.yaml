            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
