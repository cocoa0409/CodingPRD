              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "TRAVEL_PARTNER", units: 15 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
            - call: "GET /allocation-blocks/${tp_blk_id}"
              payload: {}
              as: CommercialManager
              as_user_id: u_pricer
              captures: { tp_v: "$.data.version", tp_alloc_before: "$.data.allocated_units", tp_state_before: "$.data.block_state" }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${tp_blk_id}", expected_allocation_block_version: "${tp_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs_before: "$.data.fulfillment_status" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { unalloc_before: "$.data.unallocated_units" } }
          trigger:
            # a CORPORATE block at priority_rank 1 preempts the rank-5 partner block
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 20, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { corp_blk_id: "$.data.id", corp_alloc: "$.data.allocated_units", corp_state: "$.data.block_state", corp_committed: "$.data.committed_units" }
          assert: >-
            Preconditions established by setup: ${tp_alloc_before} == 30,
            ${tp_state_before} == "EXHAUSTED", ${fs_before} == "ALLOCATED",
            ${unalloc_before} == 10 and ${b_net} == 2285315.
            Hop 1 — the new block: ${corp_alloc} == 20, ${corp_state} ==
            "EXHAUSTED" (20 == target 20), ${corp_committed} == 0 and
            priority_rank == 1.
            Hop 2 — GET /allocation-blocks/${tp_blk_id} has allocated_units == 20
            (down from 30, because the rank-1 block took 20 of the 40
            distributable units first) and block_state == "OPEN" (20 < target 30).
            Hop 3 — caused only by hop 2: GET /bookings/${b_id} has
            fulfillment_status == "RESERVED" and allocation_block_id == null, and
            GET /allocation-blocks/${tp_blk_id} has committed_units == 0 and
            released_back_units == 30 (= units 15 * tickets_per_package 2).
            GET /rights-deals/${deal_id} has unallocated_units == 0 (down from 10),
            released_units still 40 and deal_status still "PARTIALLY_RELEASED";
            20 + 20 == 40 == released_units, so the whole release is allocated.
            The unwind is fulfillment-only: GET /bookings/${b_id} still has
            net_price_cents == 2285315, paid_cents == 0, payment_status ==
            "UNPAID" and rebook_count == 0, and
            GET /payment-installments?booking_id=${b_id} still returns three
            SCHEDULE lines with installment_state == "SCHEDULED".
            GET /events/${ev_id} has fulfillment_risk_score == 0 and risk_posture
            == "NORMAL" (the reverted booking's 30 units still count as committed,
            but 30 - 40 < 0 so the gap component stays 0).

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Instance A pairs `state` (409) against `business_fiscal` (402).
  # Instance B pairs `business_safety` (422) against `business_referential` (422)
  # — the same HTTP status on both sides, so the ordering cannot be inferred from
  # the status code alone. Each recipe then removes the winning violation and
  # re-issues the identical request to prove the loser was genuinely live.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: package_state_conflict_beats_credit_limit_on_create_booking
        grounds: >-
          validations[priority=44] ERR_INVALID_PACKAGE_STATE (category state, 409,
          "being booked requires PUBLISHED") versus validations[priority=82]
          ERR_CREDIT_LIMIT_EXCEEDED (category business_fiscal, 402);
          errors ERR_INVALID_PACKAGE_STATE and ERR_CREDIT_LIMIT_EXCEEDED;
          calculations.client_credit_exposure (the strict `>` credit gate);
          state_machines.PackageProduct PRICED -> PUBLISHED;
          entities.Client.credit_limit_cents / outstanding_cents;
          endpoints "POST /bookings" and "POST /package-products/{id}/publish".
        distinguishing_aspect: >-
          One request violates exactly two rules from two different categories at
          two different HTTP statuses. The pinned priority order (44 before 82)
          means the 409 state error wins and the 402 fiscal error is never
          reported, even though the fiscal breach is enormous (a net price above
          1500000 against a credit_limit_cents of 1000). The recipe then publishes
          the package and replays the byte-identical booking request: the response
          flips to 402 ERR_CREDIT_LIMIT_EXCEEDED, which proves the fiscal rule was
          genuinely violated on the first attempt and that the observed 409 is an
          ordering decision rather than the absence of a second violation. An
          implementation that evaluates fiscal gates before state gates returns
          402 on the first call and fails.
        test_recipe:
          setup: >-
            One event with a committed ticket deal, the canonical GOLD package
            left in PRICED (never published), and a CORPORATE client whose
            credit_limit_cents is 1000 — far below any possible net price for a
            10-unit booking.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version", pkg_status_before: "$.data.package_status", list_price: "$.data.list_price_cents" } }
            - call: "POST /clients"
              payload: { name: "Thinly Funded Ltd", client_type: "CORPORATE", credit_limit_cents: 1000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
          trigger:
            # both priority 44 and priority 82 are violated by this one request
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { err1: "$.data.error_id" }
            # remove ONLY the higher-priority violation, then replay verbatim
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director, captures: { pkg_status_after: "$.data.package_status" } }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { err2: "$.data.error_id" }
          assert: >-
            ${pkg_status_before} == "PRICED" and ${list_price} == 177115, so a
            10-unit booking prices at 1637605 cents against a credit_limit_cents
            of 1000 — the fiscal rule is unambiguously violated on both attempts.
            First attempt: HTTP 409 with ${err1} == "ERR_INVALID_PACKAGE_STATE".
            It is NOT 402 and ${err1} != "ERR_CREDIT_LIMIT_EXCEEDED".
            ${pkg_status_after} == "PUBLISHED".
            Replay of the identical payload: HTTP 402 with
            ${err2} == "ERR_CREDIT_LIMIT_EXCEEDED", proving priority 82 was live
            all along and that the first response was chosen by ordering.
            ${err1} != ${err2}.
            After both attempts GET /bookings?client_id=${cl_id} returns
            total_count 0 and GET /clients/${cl_id} shows outstanding_cents == 0
            and client_status == "ACTIVE" — neither rejection wrote anything.

      - name: build_not_ready_safety_beats_booking_not_allocated_referential
        grounds: >-
          validations[priority=50] ERR_BUILD_NOT_READY (category business_safety,
          422) versus validations[priority=58] ERR_BOOKING_NOT_ALLOCATED (category
          business_referential, 422);
          validations[priority=45] (which passes here, since RESERVED is not in
          the forbidden set for issue-credentials);
          errors ERR_BUILD_NOT_READY and ERR_BOOKING_NOT_ALLOCATED;
          state_machines.HospitalityBuild PLANNED -> APPROVED -> READY;
          state_machines.Booking RESERVED -> ALLOCATED -> CREDENTIALED;
          endpoints "POST /bookings/{id}/issue-credentials",
          "POST /hospitality-builds/{id}/approve",
          "POST /hospitality-builds/{id}/ready",
          "POST /bookings/{id}/allocate".
        distinguishing_aspect: >-
          A different category pair from instance A (business_safety vs
          business_referential) and — deliberately — the SAME HTTP status on both
          sides, so nothing but the declared priority order distinguishes them.
          The single credential request violates both: the event's only
          hospitality build is still PLANNED and the booking was never allocated.
          Priority 50 wins, so the response is ERR_BUILD_NOT_READY. The recipe
          then repairs only the venue (approve + ready) and replays the identical
          request: it now returns ERR_BOOKING_NOT_ALLOCATED, proving priority 58
          was live. A third replay after allocating finally succeeds, so the
          ladder is 422/ERR_BUILD_NOT_READY -> 422/ERR_BOOKING_NOT_ALLOCATED ->
          200/CREDENTIALED from one unchanged request body.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal and a CORPORATE block
            holding 40 units, the canonical GOLD package published, one CORPORATE
            booking of 10 units left RESERVED (never allocated), and one
            hospitality build left in PLANNED (never approved).
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", fs_before: "$.data.fulfillment_status" }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id", hb_state_before: "$.data.build_state" }
          trigger:
            # both priority 50 and priority 58 are violated by this one request
            - { call: "POST /bookings/${b_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { err1: "$.data.error_id" } }
            # repair ONLY the safety violation, then replay verbatim
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { hb_state_after: "$.data.build_state" } }
            - { call: "POST /bookings/${b_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { err2: "$.data.error_id" } }
            # repair the referential violation too, then replay verbatim once more
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - { call: "POST /bookings/${b_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs_final: "$.data.fulfillment_status", creds_final: "$.data.credentials_issued_count" } }
          assert: >-
            ${fs_before} == "RESERVED" and ${hb_state_before} == "PLANNED", so both
            priority 50 and priority 58 are violated by the first request.
            First attempt: HTTP 422 with ${err1} == "ERR_BUILD_NOT_READY", and
            ${err1} != "ERR_BOOKING_NOT_ALLOCATED". GET /bookings/${b_id} still has
            fulfillment_status == "RESERVED", credentials_issued_count == 0 and
            allocation_block_id == null.
            ${hb_state_after} == "READY".
            Second attempt, identical request: still HTTP 422 but now
            ${err2} == "ERR_BOOKING_NOT_ALLOCATED", proving priority 58 was live
            during the first attempt. ${err1} != ${err2} while both responses
            carry status 422, so the status code alone cannot disambiguate them.
            Third attempt, after allocation: HTTP 200 with
            ${fs_final} == "CREDENTIALED" and ${creds_final} == 30, and
            GET /allocation-blocks/${blk_id} shows committed_units == 20.

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Instance A: a unit-count threshold (`>=`) hit exactly, on the tranche confirm
  # endpoint, with a one-unit-below control in the same fixture.
  # Instance B: a collection-cardinality boundary (zero rows) plus the
  # divide-by-zero guard, on the package pricing endpoint. Different metric,
  # different endpoint.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: released_units_exactly_equals_guaranteed_minimum_leaves_zero_shortfall
        grounds: >-
          calculations.rights_deal_minimum_liability, whose guard is pinned as
          "BOUNDARY: `>=`, not `>`" (released_units >= guaranteed_minimum_units =>
          shortfall_units 0) and whose liability is
          released_units * unit_cost_cents + shortfall_units *
          round_half_up(unit_cost_cents * SHORTFALL_LIABILITY_PCT) with
          SHORTFALL_LIABILITY_PCT = 0.60 (round-then-multiply);
          the deal status function's second branch
          (released + pending < guaranteed_minimum => SHORTFALL_DECLARED);
          state_machines.RightsDeal COMMITTED -> PARTIALLY_RELEASED and
          COMMITTED -> SHORTFALL_DECLARED;
          state_machines.ReleaseTranche PENDING -> CONFIRMED;
          endpoints "POST /release-tranches/{id}/confirm";
          entities.RightsDeal.released_units / shortfall_units /
          minimum_liability_cents / deal_status.
        distinguishing_aspect: >-
          Metric: an integer unit count against guaranteed_minimum_units, tested at
          exact equality. Two sibling deals differ in nothing but the guarantee
          (60 versus 61) and receive the identical 60-unit confirmation, so the
          comparison operator is the only thing that can explain the divergence.
          At released 60 vs minimum 60 the `>=` rule leaves shortfall_units 0,
          minimum_liability_cents 480000 and deal_status PARTIALLY_RELEASED; a `>`
          implementation would report shortfall_units 0 turning into 1 there. One
          unit below the boundary (minimum 61) the same confirm yields
          shortfall_units 1, minimum_liability_cents 484800 and deal_status
          SHORTFALL_DECLARED — and 484800 also pins the rounding order, because
          round_half_up(8000 * 0.60) = 4800 is computed once and then multiplied
          (multiply-then-round of 1 * 4800.0 happens to agree here, but the
          per-unit constant 4800 is asserted directly on the boundary deal's
          sibling so the order is observable).
        test_recipe:
          setup: >-
            One event carrying two committed ticket deals that are identical
            except for guaranteed_minimum_units — deal A at 60 (the boundary) and
            deal B at 61 (one unit above the release) — each with a single PENDING
            tranche promising 60 units at unit_cost_cents 8000.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC Boundary", inventory_type: "TICKET", contracted_units: 100, guaranteed_minimum_units: 60, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_a: "$.data.id" }
            - { call: "POST /rights-deals/${deal_a}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_a}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_a: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC OneOver", inventory_type: "HOSPITALITY_SPACE", contracted_units: 100, guaranteed_minimum_units: 61, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_b: "$.data.id" }
            - { call: "POST /rights-deals/${deal_b}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_b}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_b: "$.data.id" }
          trigger:
            - { call: "GET /rights-deals/${deal_a}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dav: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_a}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${dav}" }, as: RightsManager, as_user_id: u_rights, captures: { ta_state: "$.data.tranche_state", ta_units: "$.data.confirmed_units" } }
            - call: "GET /rights-deals/${deal_a}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { a_rel: "$.data.released_units", a_sf: "$.data.shortfall_units", a_ml: "$.data.minimum_liability_cents", a_st: "$.data.deal_status" }
            - { call: "GET /rights-deals/${deal_b}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dbv: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_b}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${dbv}" }, as: RightsManager, as_user_id: u_rights, captures: { tb_state: "$.data.tranche_state" } }
            - call: "GET /rights-deals/${deal_b}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { b_rel: "$.data.released_units", b_sf: "$.data.shortfall_units", b_ml: "$.data.minimum_liability_cents", b_st: "$.data.deal_status" }
          assert: >-
            Both confirmations are full confirmations:
            ${ta_state} == "CONFIRMED", ${ta_units} == 60 and
            ${tb_state} == "CONFIRMED".
            Deal A, exactly on the boundary (released 60, minimum 60):
            ${a_rel} == 60, ${a_sf} == 0, ${a_ml} == 480000 (= 60 * 8000, with no
            shortfall leg) and ${a_st} == "PARTIALLY_RELEASED".
            Deal B, one unit below (released 60, minimum 61):
            ${b_rel} == 60, ${b_sf} == 1, ${b_ml} == 484800
            (= 60 * 8000 + 1 * round_half_up(8000 * 0.60) = 480000 + 4800) and
            ${b_st} == "SHORTFALL_DECLARED".
            ${a_rel} == ${b_rel} while ${a_sf} != ${b_sf}, ${a_ml} != ${b_ml} and
            ${a_st} != ${b_st} — the only difference between the two deals is one
            unit of guaranteed_minimum_units, so a `>` comparison would give deal A
            shortfall_units 0 -> 1 and minimum_liability_cents 480000 -> 484800.
            ${b_ml} - ${a_ml} == 4800, the per-unit shortfall cost, which pins
            round_half_up(unit_cost_cents * 0.60) as an integer constant computed
            before multiplication.

      - name: pricing_package_with_zero_components_hits_empty_collection_guard
        grounds: >-
          validations[priority=59] ERR_PACKAGE_HAS_NO_COMPONENTS (422) and
          errors.ERR_PACKAGE_HAS_NO_COMPONENTS;
          calculations.package_component_line_pricing.input_set ("a package with
          zero components cannot be priced");
          calculations.package_list_pricing's guard
          "if list_price_cents == 0: margin_pct = 0";
          state_machines.PackageProduct DRAFT -> PRICED (precondition "this package
          has at least one PackageComponent");
          entities.PackageProduct.base_cost_cents /
          component_price_subtotal_cents / list_price_cents / margin_pct /
          package_status;
          endpoints "POST /package-products/{id}/price" and
          "POST /package-components".
        distinguishing_aspect: >-
          A different KIND of boundary from instance A and on a different endpoint:
          the cardinality of an input collection at zero, plus the divide-by-zero
          guard that only exists at that cardinality. The recipe pins both sides of
          the boundary with the same endpoint and the same package — cardinality 0
          is a 422 that leaves every derived money field at 0 and package_status at
          DRAFT, and cardinality 1 (the smallest legal set) succeeds and writes
          base_cost_cents 10000, component_price_subtotal_cents 11000,
          list_price_cents 13750 and margin_pct 0.2727. An implementation that
          summed an empty collection to 0 and then divided by list_price_cents to
          get margin_pct would raise instead of returning 422, and one that treated
          the guard as "at least two components" would reject the cardinality-1
          call.
        test_recipe:
          setup: >-
            One SCHEDULED event and one DRAFT package with no components at all.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Empty Shell", tier: "GOLD", tickets_per_package: 2, hotel_nights: 0, transport_included: false, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id", status0: "$.data.package_status", list0: "$.data.list_price_cents", base0: "$.data.base_cost_cents", margin0: "$.data.margin_pct" }
          trigger:
            # cardinality 0 — the empty-collection guard
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { err1: "$.data.error_id" } }
            # cardinality 1 — the smallest legal input set
            - call: "POST /package-components"
              payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Single seat", quantity: 1, unit_cost_cents: 10000, markup_pct: 0.1000, sequence_no: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { c1_id: "$.data.id" }
            - call: "POST /package-products/${pkg_id}/price"
              payload: {}
              as: CommercialManager
              as_user_id: u_pricer
              captures: { status1: "$.data.package_status", base1: "$.data.base_cost_cents", sub1: "$.data.component_price_subtotal_cents", list1: "$.data.list_price_cents", margin1: "$.data.margin_pct" }
          assert: >-
            At creation the derived fields are already at their zero values:
            ${status0} == "DRAFT", ${list0} == 0, ${base0} == 0 and ${margin0} == 0
            — so the guard's job is to prevent 0/0, not to produce zeros.
            Cardinality 0: HTTP 422 with ${err1} ==
            "ERR_PACKAGE_HAS_NO_COMPONENTS". GET /package-products/${pkg_id} still
            has package_status == "DRAFT", base_cost_cents == 0,
            component_price_subtotal_cents == 0, list_price_cents == 0,
            margin_pct == 0, priced_by_user_id == null and priced_at == null.
            GET /package-components?package_product_id=${pkg_id} returns
            total_count 0.
            Cardinality 1: HTTP 200 with ${status1} == "PRICED", ${base1} == 10000,
            ${sub1} == 11000 (= round_half_up(10000 * 1.1000)), ${list1} == 13750
            (= round_half_up(11000 * 1.25)) and ${margin1} == 0.2727
            (= round_half_up_4((13750 - 10000) / 13750) = round_half_up_4(0.2727272...)).
            GET /package-components/${c1_id} has line_cost_cents == 10000 and
            line_price_cents == 11000.
            ${err1} is raised at cardinality 0 and no error at cardinality 1, so
            the guard sits exactly at "at least one".

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Instance A: Booking depends on RightsDeal.deal_status, reached through
  # AllocationBlock — a row two hops away that the request never names.
  # Instance B: HostAssignment depends on HospitalityBuild.build_state, and the
  # accepted set has two members, so "must be READY" is also wrong.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: allocate_requires_rights_deal_partially_or_fully_released
        grounds: >-
          validations[priority=72] ERR_CHANNEL_OR_DEAL_MISMATCH (422, "the block's
          RightsDeal.deal_status IN {PARTIALLY_RELEASED, FULLY_RELEASED}");
          validations[priority=43] (which passes: the block is OPEN) and
          validations[priority=81] (which is also violated but loses on priority);
          entities.Booking.allocation_block_id (FK -> AllocationBlock.id) and
          entities.AllocationBlock.rights_deal_id (FK -> RightsDeal.id);
          entities.RightsDeal.deal_status / released_units;
          state_machines.RightsDeal COMMITTED -> FULLY_RELEASED;
          state_machines.Booking RESERVED -> ALLOCATED;
          calculations.channel_allocation_waterfall;
          endpoints "POST /bookings/{id}/allocate" and
          "POST /release-tranches/{id}/confirm".
        distinguishing_aspect: >-
          Entity pair Booking <-> RightsDeal, coupled through AllocationBlock. The
          allocate request names only a booking id and a block id, yet it is
          rejected because of the state of a THIRD row — the rights deal that owns
          the block — which has released nothing. Nothing about the booking or the
          block is wrong: the channels match, the block is OPEN and its version is
          current. The recipe then leaves the booking and the block untouched and
          changes only the deal (a tranche confirm moves it COMMITTED ->
          FULLY_RELEASED), after which the byte-identical allocate call succeeds.
          So the dependency is provably on the remote entity's state, not on any
          field of the request.
        test_recipe:
          setup: >-
            One event with a COMMITTED ticket deal that has released nothing, a
            CORPORATE block created against it (legal on a COMMITTED deal, and
            therefore holding allocated_units 0), the canonical GOLD package
            published, and one CORPORATE booking of 10 units in RESERVED.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { st_before: "$.data.deal_status", rel_before: "$.data.released_units" } }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id", blk_state_before: "$.data.block_state", blk_alloc_before: "$.data.allocated_units" }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
          trigger:
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v1: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v1}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { err1: "$.data.error_id" } }
            # change ONLY the remote entity: release the deal's inventory
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights, captures: { st_after: "$.data.tranche_state" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v2: "$.data.version", blk_alloc_after: "$.data.allocated_units" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v2}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs_after: "$.data.fulfillment_status", blk_after: "$.data.allocation_block_id" } }
          assert: >-
            Setup facts: ${st_before} == "COMMITTED", ${rel_before} == 0,
            ${blk_state_before} == "OPEN", ${blk_alloc_before} == 0 and
            ${b_net} == 1637605 (the deal is in the exposure set, so the surcharge
            applies).
            First allocate: HTTP 422 with ${err1} == "ERR_CHANNEL_OR_DEAL_MISMATCH".
            The channels DO match (booking CORPORATE, block CORPORATE) and the
            version WAS current, so the rejection is attributable only to
            RightsDeal.deal_status == "COMMITTED" — a row the request never names,
            reached as Booking -> allocation_block_id -> AllocationBlock ->
            rights_deal_id -> RightsDeal.
            ${err1} != "ERR_ALLOCATION_UNITS_UNAVAILABLE" even though
            allocated_units - committed_units == 0 < 20 is also false at that
            moment: priority 72 precedes priority 81.
            After the rejection GET /bookings/${b_id} still has fulfillment_status
            == "RESERVED" and allocation_block_id == null, and
            GET /allocation-blocks/${blk_id} still has committed_units == 0.
            ${st_after} == "CONFIRMED", and GET /rights-deals/${deal_id} now has
            deal_status == "FULLY_RELEASED" with released_units == 60;
            ${blk_alloc_after} == 40 (the waterfall filled the block to target).
            Second allocate, identical apart from the refreshed OCC token:
            HTTP 200 with ${fs_after} == "ALLOCATED" and ${blk_after} == ${blk_id},
            and GET /allocation-blocks/${blk_id} has committed_units == 20.
            Nothing about the booking or the block changed between the two calls
            except through the remote deal.

      - name: host_assignment_requires_build_approved_or_ready
        grounds: >-
          validations[priority=47] ERR_INVALID_BUILD_STATE (409, "build_state IN
          {APPROVED, READY} when a HostAssignment is created against it") and
          errors.ERR_INVALID_BUILD_STATE;
          validations[priority=45] (creating a HostAssignment requires
          fulfillment_status IN {ALLOCATED, CREDENTIALED} — satisfied here) and
          validations[priority=60] (same-event and shift-inside-window scope —
          also satisfied);
          entities.HostAssignment.hospitality_build_id (FK -> HospitalityBuild.id);
          entities.HospitalityBuild.build_state;
          entities.OnSiteHost.active_assignment_count;
          state_machines.HospitalityBuild PLANNED -> APPROVED;
          endpoints "POST /host-assignments" and
          "POST /hospitality-builds/{id}/approve".
        distinguishing_aspect: >-
          A different entity pair from instance A — HostAssignment <->
          HospitalityBuild — and a different failure mode: the dependency is on a
          two-member accepted set, so both "any state will do" and "must be READY"
          are wrong. The request is rejected while the build is PLANNED, then the
          identical request succeeds after the build is APPROVED and BEFORE it is
          ever declared READY, which is asserted explicitly. The booking, the host
          and the shift window are byte-identical across both attempts, and both
          the same-event scope rule and the booking-state rule are satisfied
          throughout, so nothing but HospitalityBuild.build_state can account for
          the difference.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal and a CORPORATE block
            holding 40 units, the canonical GOLD package published, one CORPORATE
            booking of 10 units already ALLOCATED, one hospitality build left in
            PLANNED, and one on-site host with no assignments.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id" }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs_before: "$.data.fulfillment_status" } }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id", hb_state_before: "$.data.build_state" }
            - call: "POST /on-site-hosts"
              payload: { full_name: "Alina Petrova", languages: ["EN", "IT"], max_concurrent_bookings: 2 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { host_id: "$.data.id", host_count_before: "$.data.active_assignment_count" }
          trigger:
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { err1: "$.data.error_id" }
            # change ONLY the build's state, and stop at APPROVED (never READY)
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { hb_state_mid: "$.data.build_state" } }
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { ha_id: "$.data.id", ha_state: "$.data.assignment_state" }
          assert: >-
            Setup facts: ${fs_before} == "ALLOCATED" (so priority 45 is satisfied),
            ${hb_state_before} == "PLANNED" and ${host_count_before} == 0.
            First attempt: HTTP 409 with ${err1} == "ERR_INVALID_BUILD_STATE".
            It is NOT ERR_ASSIGNMENT_SCOPE_MISMATCH — the build belongs to the same
            event as the booking and the shift 10:00-18:00 lies strictly inside the
            build window 09:00-20:00 — and NOT ERR_INVALID_BOOKING_STATE.
            After the rejection GET /on-site-hosts/${host_id} still has
            active_assignment_count == 0 and
            GET /host-assignments?booking_id=${b_id} returns total_count 0.
            ${hb_state_mid} == "APPROVED".
            Second attempt with the identical payload: HTTP 201 with
            ${ha_state} == "ASSIGNED", and GET /on-site-hosts/${host_id} now has
            active_assignment_count == 1.
            GET /hospitality-builds/${hb_id} still has build_state == "APPROVED",
            so the accepted set genuinely contains APPROVED and an implementation
            requiring READY would reject the second attempt as well.
            GET /host-assignments/${ha_id} has hospitality_build_id == ${hb_id} and
            booking_id == ${b_id}.

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Instance A: venue zone occupancy — CLOSED intervals, symmetric 90-minute
  # buffer, pairwise, partitioned by (event_id, zone_code).
  # Instance B: host shifts — HALF-OPEN intervals, no buffer, AGGREGATE
  # concurrency against a per-host capacity. Deliberately opposite semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: build_zone_closed_interval_with_ninety_minute_buffer_conflicts
        grounds: >-
          validations[priority=55] ERR_BUILD_ZONE_CONFLICT (409) with its pinned
          INTERVAL SEMANTICS block — windows CLOSED on both ends, each existing
          window inflated by BUILD_BUFFER_MINUTES = 90 on BOTH sides, conflict when
          new.start <= other.end + 90min AND new.end >= other.start - 90min,
          restricted to the same event_id and zone_code with build_state IN
          {PLANNED, APPROVED, READY};
          validations[priority=61] ERR_ZONE_NOT_AT_VENUE (which passes: both zones
          are members of Event.hospitality_zone_codes);
          entities.HospitalityBuild.zone_code / service_window_start /
          service_window_end / build_state;
          entities.Event.hospitality_zone_codes;
          endpoints "POST /hospitality-builds".
        distinguishing_aspect: >-
          Interval semantics: CLOSED plus a symmetric 90-minute buffer, tested at
          exactly 90 and exactly 91 minutes of clearance against the same incumbent
          window (09:00-14:00). A 90-minute gap CONFLICTS (409) and a 91-minute gap
          does not (201) — one minute apart, so an implementation using a
          half-open comparison, a one-sided buffer, or no buffer at all diverges on
          at least one of the two calls. The recipe additionally pins the
          resource partition key by creating the SAME 09:00-14:00 window on ZONE_B
          successfully (the resource is the zone, not the event) and then pins
          closedness directly by rejecting a ZONE_B window that merely TOUCHES the
          ZONE_B incumbent's end instant.
        test_recipe:
          setup: >-
            One event with two hospitality zones and one PLANNED build already
            occupying ZONE_A from 09:00 to 14:00 on match day.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T14:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb1_id: "$.data.id", hb1_state: "$.data.build_state" }
          trigger:
            # exactly 90 minutes of clearance after the incumbent's end -> CONFLICT
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T15:30:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { err_90: "$.data.error_id" }
            # exactly 91 minutes of clearance -> ACCEPTED
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T15:31:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb2_id: "$.data.id", hb2_state: "$.data.build_state" }
            # identical window to the incumbent but a DIFFERENT zone -> ACCEPTED
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_B", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T14:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb3_id: "$.data.id" }
            # touching the ZONE_B incumbent's end instant -> CONFLICT (closed ends)
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_B", service_window_start: "2027-02-01T14:00:00.000Z", service_window_end: "2027-02-01T16:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { err_touch: "$.data.error_id" }
          assert: >-
            ${hb1_state} == "PLANNED", so the incumbent is inside the
            {PLANNED, APPROVED, READY} conflict set.
            90-minute clearance: HTTP 409 with ${err_90} ==
            "ERR_BUILD_ZONE_CONFLICT" (15:30 <= 14:00 + 90min is TRUE at equality).
            91-minute clearance: HTTP 201, ${hb2_state} == "PLANNED" — one minute
            later and the same request is legal, which is what pins the buffer at
            exactly 90 minutes rather than 0, 60 or 120.
            Same window, other zone: HTTP 201 for ${hb3_id}, proving the resource
            is (event_id, zone_code) and not the event.
            Touching end instant on ZONE_B: HTTP 409 with ${err_touch} ==
            "ERR_BUILD_ZONE_CONFLICT" — a half-open implementation would accept
            14:00 as the start of a new window.
            ${err_90} == ${err_touch} == "ERR_BUILD_ZONE_CONFLICT".
            Final state: GET /hospitality-builds?event_id=${ev_id}&zone_code=ZONE_A
            returns total_count 2 (${hb1_id} and ${hb2_id}) and
            GET /hospitality-builds?event_id=${ev_id}&zone_code=ZONE_B returns
            total_count 1 (${hb3_id}); the two rejected windows wrote nothing.

      - name: host_shift_half_open_adjacency_allowed_with_aggregate_capacity
        grounds: >-
          validations[priority=69] ERR_HOST_CAPACITY_EXCEEDED (409) with its pinned
          INTERVAL SEMANTICS block — shifts HALF-OPEN [shift_start, shift_end),
          NO buffer, and an AGGREGATE per-instant test against
          OnSiteHost.max_concurrent_bookings rather than a pairwise one;
          validations[priority=60] ERR_ASSIGNMENT_SCOPE_MISMATCH (which passes: all
          shifts lie inside the build's service window);
          entities.OnSiteHost.max_concurrent_bookings / active_assignment_count;
          entities.HostAssignment.shift_start / shift_end / assignment_state;
          endpoints "POST /host-assignments".
        distinguishing_aspect: >-
          Deliberately the OPPOSITE interval semantics to instance A on a different
          resource entity: half-open instead of closed, no buffer instead of a
          90-minute one, and an aggregate concurrency count instead of a pairwise
          overlap test. Two facts are asserted that no other reading can produce.
          (1) A shift starting at 14:00 is ACCEPTED even though an existing shift
          ends at 14:00 — closed intervals would make three shifts overlap at that
          instant and push the host to 3 over a capacity of 2. (2) A strictly
          SHORTER shift 13:00-15:00 is REJECTED, because on [13:00, 14:00) two
          existing shifts are already live; every PAIRWISE comparison passes (each
          existing shift plus the new one is only 2), so a pairwise implementation
          accepts it and fails. Duration, assignment count and pair count are
          therefore all ruled out as the discriminator — only instantaneous
          concurrency explains both outcomes.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal and a CORPORATE block
            holding 40 units, the canonical GOLD package published, four CORPORATE
            bookings of 5 units each (all allocated, consuming exactly the block's
            40 units), one READY hospitality build covering 09:00-20:00, and one
            on-site host with max_concurrent_bookings 2 already carrying two
            overlapping shifts, 10:00-14:00 and 12:00-16:00.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b1_id: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { bv1: "$.data.version" } }
            - { call: "POST /bookings/${b1_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${bv1}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2_id: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { bv2: "$.data.version" } }
            - { call: "POST /bookings/${b2_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${bv2}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b3_id: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { bv3: "$.data.version" } }
            - { call: "POST /bookings/${b3_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${bv3}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b4_id: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { bv4: "$.data.version" } }
            - { call: "POST /bookings/${b4_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${bv4}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { blk_committed: "$.data.allocation_block_id" } }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id" }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /on-site-hosts"
              payload: { full_name: "Alina Petrova", languages: ["EN", "IT"], max_concurrent_bookings: 2 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { host_id: "$.data.id", cap: "$.data.max_concurrent_bookings" }
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b1_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T14:00:00.000Z" }
              as: OperationsManager
              as_user_id: u_ops
              captures: { ha1_id: "$.data.id" }
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b2_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T12:00:00.000Z", shift_end: "2027-02-01T16:00:00.000Z" }
              as: OperationsManager
              as_user_id: u_ops
              captures: { ha2_id: "$.data.id", count_before: "$.data.id" }
            - { call: "GET /on-site-hosts/${host_id}", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { host_count_before: "$.data.active_assignment_count" } }
          trigger:
            # starts exactly when ha1 ends: half-open, so no overlap with ha1;
            # overlaps only ha2 on [14:00, 16:00) -> 2 concurrent == capacity 2
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b3_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T14:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }
              as: OperationsManager
              as_user_id: u_ops
              captures: { ha3_id: "$.data.id", ha3_state: "$.data.assignment_state" }
            # a SHORTER shift that sits inside the [13:00, 14:00) double-cover
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b4_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T13:00:00.000Z", shift_end: "2027-02-01T15:00:00.000Z" }
              as: OperationsManager
              as_user_id: u_ops
              captures: { err_cap: "$.data.error_id" }
          assert: >-
            Setup facts: ${cap} == 2, ${host_count_before} == 2,
            ${blk_committed} == ${blk_id}, and
            GET /allocation-blocks/${blk_id} has allocated_units == 40 and
            committed_units == 40 (four bookings x 5 units x
            tickets_per_package 2).
            Adjacent shift: HTTP 201 with ${ha3_state} == "ASSIGNED". This is only
            legal under half-open semantics — at the instant 14:00 the 10:00-14:00
            shift has already ended, so the peak concurrency on [14:00, 16:00) is 2,
            exactly the capacity. GET /on-site-hosts/${host_id} now has
            active_assignment_count == 3, which is ABOVE
            max_concurrent_bookings — proving the rule caps instantaneous
            concurrency, not the number of assignments a host may hold.
            Shorter overlapping shift: HTTP 409 with ${err_cap} ==
            "ERR_HOST_CAPACITY_EXCEEDED", because on [13:00, 14:00) the
            10:00-14:00 and 12:00-16:00 shifts are both live and the new one would
            make 3 > 2. Every pairwise comparison would have passed (2 per pair),
            so a pairwise implementation accepts this call and fails.
            After the rejection GET /on-site-hosts/${host_id} still has
            active_assignment_count == 3 and
            GET /host-assignments?on_site_host_id=${host_id} returns total_count 3
            with ${ha1_id}, ${ha2_id} and ${ha3_id} all assignment_state
            "ASSIGNED"; GET /host-assignments?booking_id=${b4_id} returns
            total_count 0.
            No buffer is applied anywhere: the 14:00/14:00 adjacency is accepted,
            in direct contrast with the 90-minute inflation used for build zones.

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Instance A conserves integer ticket UNITS across an allocate/cancel pair.
  # Instance B conserves CENTS across a prepaid cancellation settlement.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: allocation_units_restored_exactly_after_allocate_then_cancel
        grounds: >-
          state_machines.Booking RESERVED -> ALLOCATED (committed_units +=
          units * tickets_per_package) and ALLOCATED -> CANCELLED (committed_units
          -= the same amount, released_back_units += the same amount, block_state
          unchanged per the §1.3 conventions);
          entities.AllocationBlock.allocated_units / committed_units /
          released_back_units / block_state;
          entities.RightsDeal.unallocated_units;
          validations[priority=81] ERR_ALLOCATION_UNITS_UNAVAILABLE (the free-units
          test that consumes the restored capacity);
          calculations.channel_allocation_waterfall (allocated_units is a pure
          function of the release, never of sales);
          endpoints "POST /bookings/{id}/allocate" and "POST /bookings/{id}/cancel".
        distinguishing_aspect: >-
          Conserved quantity: integer ticket units. The forward operation commits
          20 units and the compensating operation must return exactly 20 — not
          approximately, and not by rebuilding the block from scratch. Three
          properties are asserted together and each fails a different sloppy
          implementation: (1) allocated_units stays 40 at every observation, so the
          compensation must not re-run the distribution pass; (2) block_state stays
          EXHAUSTED even when committed_units falls to 0, so the compensation must
          not reopen a fully allocated block; (3) released_back_units becomes
          exactly 20, an audit counter that must NOT be netted off
          committed_units, so the identity is
          committed_units + free == allocated_units with released_back_units kept
          separately. The restored capacity is then proved genuinely reusable by
          allocating a fresh 20-unit booking that consumes all 40 units — if even
          one unit had leaked, priority 81 would reject it.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal, a CORPORATE block filled
            to its 40-unit target, the canonical GOLD package published, and one
            CORPORATE booking of 10 units still in RESERVED.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
          trigger:
            - call: "GET /allocation-blocks/${blk_id}"
              payload: {}
              as: CommercialManager
              as_user_id: u_pricer
              captures: { a0: "$.data.allocated_units", c0: "$.data.committed_units", r0: "$.data.released_back_units", s0: "$.data.block_state", v0: "$.data.version" }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v0}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - call: "GET /allocation-blocks/${blk_id}"
              payload: {}
              as: CommercialManager
              as_user_id: u_pricer
              captures: { a1: "$.data.allocated_units", c1: "$.data.committed_units", r1: "$.data.released_back_units", s1: "$.data.block_state" }
            - { call: "POST /bookings/${b_id}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fee: "$.data.cancellation_fee_cents" } }
            - call: "GET /allocation-blocks/${blk_id}"
              payload: {}
              as: CommercialManager
              as_user_id: u_pricer
              captures: { a2: "$.data.allocated_units", c2: "$.data.committed_units", r2: "$.data.released_back_units", s2: "$.data.block_state", v2: "$.data.version" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { unalloc: "$.data.unallocated_units" } }
            # the restored capacity must be fully reusable
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 20 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2_id: "$.data.id", b2_net: "$.data.net_price_cents" } }
            - { call: "POST /bookings/${b2_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v2}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs2: "$.data.fulfillment_status" } }
          assert: >-
            ${b_net} == 1580574.
            Before: ${a0} == 40, ${c0} == 0, ${r0} == 0, ${s0} == "EXHAUSTED".
            After allocate: ${a1} == 40, ${c1} == 20
            (= units 10 * tickets_per_package 2), ${r1} == 0, ${s1} == "EXHAUSTED".
            After cancel: ${a2} == 40 (UNCHANGED — allocation is a function of the
            release, not of sales), ${c2} == 0, ${r2} == 20 and
            ${s2} == "EXHAUSTED" (also UNCHANGED, even though committed_units is
            now 0).
            The conserved quantity is integer ticket units:
            ${a2} - ${c2} == 40 == ${a0} - ${c0}, i.e. free capacity is restored
            exactly; ${r2} - ${r0} == ${c1} - ${c0} == 20, i.e. the amount released
            back equals the amount that had been committed, to the unit;
            ${a2} == ${c2} + 40 with ${r2} tracked separately, so
            released_back_units is an audit counter and is NOT netted into
            allocated_units.
            ${fee} == 158057 (= round_half_up(1580574 * 0.10)) and
            GET /bookings/${b_id} has fulfillment_status == "CANCELLED",
            allocation_block_id == null and balance_due_cents == 158057 — the money
            side of the cancellation does not disturb the unit identity.
            ${unalloc} == 20 (= released 60 - allocated 40), unchanged by both the
            allocate and the cancel.
            Reuse proof: ${b2_net} == 3023707 and ${fs2} == "ALLOCATED", so a fresh
            20-unit booking consumed all 40 restored units; afterwards
            GET /allocation-blocks/${blk_id} has committed_units == 40,
            allocated_units == 40 and released_back_units == 20. Had a single unit
            leaked, validations[priority=81] would have rejected this allocate with
            ERR_ALLOCATION_UNITS_UNAVAILABLE.

      - name: cancellation_money_identity_fee_equals_prepaid_minus_refund_plus_balance
        grounds: >-
          calculations.booking_cancellation_settlement, whose formula declares the
          conserved quantity explicitly — cancellation_fee_cents == pre_paid_cents
          - refund_cents + balance_due_cents — with
          refund_cents = max(0, pre_paid - fee) and
          balance_due_cents = max(0, fee - pre_paid);
          the TIER_SCHEDULE variant (days_to_event 184 => fee_pct 0.10);
          state_machines.Booking ALLOCATED -> CANCELLED (paid_cents -= refund_cents;
          payment_status = REFUNDED when balance_due_cents == 0, else
          SETTLEMENT_DUE; SCHEDULED installments VOIDED; a SETTLEMENT installment
          is created only when balance_due_cents > 0);
          calculations.payment_schedule_generation (the schedule identity
          sum(amount_cents) + already_paid == net_price_cents);
          calculations.client_credit_exposure;
          entities.Booking.paid_cents / cancellation_fee_cents / refund_cents /
          balance_due_cents;
          endpoints "POST /payment-installments/{id}/pay" and
          "POST /bookings/{id}/cancel".
        distinguishing_aspect: >-
          A different conserved quantity from instance A — cents, not units — and a
          different compensation shape: the client has ALREADY paid more than the
          fee, so the compensation is a partial refund rather than a full reversal.
          Every cent that entered the system is accounted for exactly once:
          474172 arrived, 316115 goes back, 158057 is retained, and
          158057 == 474172 - 316115 + 0 is the declared identity. Because
          pre_paid > fee the balance leg is 0, which forces the
          max(0, ...) clamps to be real clamps rather than plain subtractions — a
          signed implementation would report balance_due_cents == -316115 and
          refund_cents == -316115 in the mirror case. Two further consequences are
          pinned: paid_cents is reduced to exactly the retained fee (158057), and
          NO SETTLEMENT installment is created, in contrast with the
          under-paid cancellations elsewhere in this design where balance_due_cents
          is positive and a settlement line appears.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal, a CORPORATE block, the
            canonical GOLD package published, one CORPORATE booking of 10 units
            (net 1580574, schedule 474172 / 632230 / 474172) allocated, and its
            first installment paid so the booking carries 474172 cents of prepaid
            cash against a future fee of 158057.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - call: "GET /payment-installments"
              payload: { booking_id: "${b_id}" }
              as: FinanceController
              as_user_id: u_fin
              captures: { i1_id: "$.data[0].id", i1_amt: "$.data[0].amount_cents", i2_id: "$.data[1].id", i3_id: "$.data[2].id" }
            - { call: "POST /payment-installments/${i1_id}/pay", payload: { amount_cents_paid: 474172 }, as: FinanceController, as_user_id: u_fin, captures: { i1_state: "$.data.installment_state", i1_paid: "$.data.paid_amount_cents" } }
            - { call: "GET /bookings/${b_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { prepaid: "$.data.paid_cents", ps_before: "$.data.payment_status" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { out_before: "$.data.outstanding_cents" } }
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { variant: "$.data.settlement_variant", fee: "$.data.cancellation_fee_cents", refund: "$.data.refund_cents", balance: "$.data.balance_due_cents", paid_after: "$.data.paid_cents", ps_after: "$.data.payment_status" }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { out_after: "$.data.outstanding_cents" } }
          assert: >-
            Setup facts: ${b_net} == 1580574, ${i1_amt} == 474172,
            ${i1_state} == "PAID", ${i1_paid} == 474172, ${prepaid} == 474172,
            ${ps_before} == "DEPOSIT_PAID" and ${out_before} == 1106402
            (= 1580574 - 474172).
            Settlement: ${variant} == "TIER_SCHEDULE", ${fee} == 158057
            (= round_half_up(1580574 * 0.10) at days_to_event 184),
            ${refund} == 316115 (= 474172 - 158057), ${balance} == 0,
            ${ps_after} == "REFUNDED" and ${paid_after} == 158057.
            The conserved quantity is cents, and the declared identity holds
            exactly: ${fee} == ${prepaid} - ${refund} + ${balance}, i.e.
            158057 == 474172 - 316115 + 0.
            ${paid_after} == ${fee} == 158057, so the cash retained by the provider
            equals the fee to the cent and ${prepaid} - ${paid_after} == ${refund}.
            The max(0, ...) clamps are real: ${balance} == 0 rather than -316115.
            Because ${balance} == 0 no settlement line exists —
            GET /payment-installments?booking_id=${b_id}&installment_kind=SETTLEMENT
            returns total_count 0 — while
            GET /payment-installments?booking_id=${b_id} shows ${i1_id} still PAID
            with paid_amount_cents 474172 and ${i2_id} and ${i3_id} both
            installment_state "VOIDED" with days_overdue 0.
            ${out_after} == 0: the booking is CANCELLED so it leaves the live set,
            and with payment_status REFUNDED rather than SETTLEMENT_DUE it
            contributes no balance either — so ${out_before} - ${out_after} ==
            1106402 is fully explained without any residue.
            GET /allocation-blocks/${blk_id} has committed_units == 0 and
            released_back_units == 20, confirming the unit and cent invariants are
            maintained independently by the same call.
