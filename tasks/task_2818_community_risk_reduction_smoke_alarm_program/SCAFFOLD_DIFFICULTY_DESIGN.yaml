          assert:
            - "the first lot receipt returns 409 with response.error_id == ERR_GRANT_NOT_ACTIVE"
            - "PartnerGrant.${g_id}.status == ACTIVE"
            - "PartnerGrant.${g_id}.available_cents == 500000"
            - "the second lot receipt returns 201 and DeviceLot.${lot_id}.status == AVAILABLE"
            - "DeviceLot.${lot_id}.on_hand_qty == 10"
